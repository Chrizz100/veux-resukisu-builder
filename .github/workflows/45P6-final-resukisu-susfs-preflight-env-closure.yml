      EXPECTED_CPUFREQ_AFTER_SHA256: "9ac85ecaafbdddfb43d2b361183b455448ce400fad1296ae290510ad33039ceb"

      EXPECTED_STORE_ONE_BEFORE_SHA256: "5b85f632ef77eeee55d4b404a08e9d96ec87af0201ba1d634150c3ef418f37e3"
      EXPECTED_STORE_ONE_AFTER_SHA256: "0bbe18c9eee2059f4d2ec636b604f50bda90b131261e857b0dbc717c512ef28e"
      EXPECTED_CPUFREQ_TARGETED_DIFF_SHA256: "b431c73a2bfee36e093dc87846c628dd598a84499db66fc12a9930ff948e0b43"

      EXPECTED_IDLE_RESTORE_DIFF_SHA256: "33b144f63893d7a45d6c8e301aacf6ca1faa7a87088c19ab8bfdc1ecb29a0fd5"

      EXPECTED_LPM_AFTER_SHA256: "6805651af0a60905ce04356df3a538be15e94b6c8599a1d35e414d0a50b67094"
      EXPECTED_CPUIDLE_CORE_AFTER_SHA256: "e7f7fba62ce2bbe82f23c6bfbf5a103161d1c8013b85f7f48e4c036758f6a603"
      EXPECTED_CPUIDLE_HEADER_AFTER_SHA256: "9149734aa0eef1bba2e7ae16902dfd3aa203f23fe41657ce7df50ab947620506"

      EXPECTED_SCHEDUTIL_BEFORE_SHA256: "9d56491a427ee12f1156ae907c5aa647bf1a1b35bf13c725a08e73ef295274b7"
      EXPECTED_SCHEDUTIL_AFTER_SHA256: "987c9598f16b22a1e7b343475691687d309122de447494cd1a2b5ea8cbbafffc"

      EXPECTED_CASS_DIFF_SHA256: "67abb81be8c2d7727c3e4c8a92419c9e9a3d97ee3d3e5355d3acabce34adf659"

      EXPECTED_XIAOMI_PELT_SHA256: "bad23ba491cc5d4669936507b392888765aa65fd8063b2a95a492d6b0dca0cb0"

      EXPECTED_HZ_KCONFIG_SHA256: "685e9a79f3dbf17e9bd5b402dfd25ad014886fbe1b6975a0913b3621519cd7fe"

      RESUKISU_COMMIT: "faccf4c5edc7be37776216e7d43dd3dca0239331"
      EXPECTED_RESUKISU_VERSION: "v4.2.0-rc1-faccf4c5@ReSukiSU"

      BACKPORT_REPO: "JackA1ltman/NonGKI_Kernel_Build_2nd"
      BACKPORT_COMMIT: "90d9f91d43ecaaee044e79c75a01d6a512508eb3"
      BACKPORT_PATCH_PATH: "Patches/Patch/susfs_patch_to_5.4.patch"
      BACKPORT_PATCH_BLOB: "7533876188b65d78940b705d8e4462dbdc31c0a2"
      BACKPORT_PATCH_SHA256: "21233ce9a0a02590d977cd193aa493b23df7008e73fed402901e033a303b9631"

      EXPECTED_TASK_MMU_REJECT_SHA256: "f8daf0861fd9608e6ceb11557c34ec09368fff8e4123992d3453c740f61c4996"

      WORKFLOW17_ORIGINAL_DIFF_SHA256: "afdbab86f738aead94a12f896eeb5b74008dcf1c4fe5dfec4682651491a3de1e"

      EXPECTED_WARNING_CLEAN_DIFF_SHA256: "5cca5614c8a34afc3e9c9d9719f8f0ed52dbf4d2296be15797dc9530630d9665"

      EXPECTED_NORMALIZED_ADAPTATION_SHA256: "43906d8a85bc0a1d175f5a2dd7903ae3a564fa8af891b9309a05de6d7edda135"

      EXPECTED_ADAPTATION_BYTES: "145803"

      WORKFLOW17_OLD_DEFCONFIG_INDEX: "index a841afe0a397..69cc6a8f1aa5 100644"
      CUMULATIVE_NEW_DEFCONFIG_INDEX: "index c8b4616de807..78e35057b154 100644"

      EXPECTED_CUMULATIVE_CONFIG_SHA256: "d7cd955abd59da45804acc9c5e450cf8fc953da3e66bbc274212b40ee9a0b372"

      EXPECTED_KNOWN_SUSFS_DIFFCHECK_SHA256: "eacb9bc8266ed665b6867709599450f54a47426dc09e979eb4ed2ede839a26f8"
      EXPECTED_KNOWN_SUSFS_DIFFCHECK_LINE_COUNT: "15"
      EXPECTED_KNOWN_SUSFS_WHITESPACE_ISSUE_COUNT: "8"

      WORKFLOW17_BLOB: "a87d1c8ec8dab938101337dd9786c1773d2c5f19"
      WORKFLOW44C_BLOB: "95fc204bd6d5355c2f6a1c0e75eefa68a053f576"
      WORKFLOW45P3_BLOB: "c0c791909e83cd3183cdaf2afc087e6d9d1c8a23"
      WORKFLOW45P4_BLOB: "cdcc8f96c22187b227e30e6a47ded92eceafd62c"
      WORKFLOW45P5_BLOB: "a3ff37c857312ee124fd76105ced390892605080"

      CLANG_PREBUILT_COMMIT: "aa2e4a514a6c85eebcc4a27149eaf9244e951a1e"

      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      REFERENCE_DIR: ${{ github.workspace }}/workflow-reference
      PATCH_DIR: ${{ github.workspace }}/reference-patches
      OUT_DIR: out
      ARTIFACT_DIR: ${{ github.workspace }}/final-preflight-env-closure

    steps:
      - name: Prepare 45P6 closure
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$TOOLCHAIN_DIR" \
            "$PATCH_DIR" \
            "$ARTIFACT_DIR"

          cat > "$ARTIFACT_DIR/PLAN.txt" <<'EOF'
          VEUX Final ReSukiSU + SUSFS Preflight Environment Closure
          =========================================================

          45P5 second run proved:
          - dependencies installed successfully
          - exact clang r416183b installed successfully
          - Candidate 2 reconstructed exactly
          - Xiaomi reference fetched successfully

          It then stopped at the first nested 44C replay step:

              RUNNING=Restore Xiaomi idle sleep policy

          Root cause:
          GitHub Actions applies values appended to $GITHUB_ENV only to
          subsequent Actions steps.

          45P5 replayed several former Actions steps inside one shell step.

          Therefore:
          - Recreate exact Candidate 2 wrote CANDIDATE_TIP and COMMON_SHA
            to $GITHUB_ENV
          - but those values were not exported into the still-running
            45P5 shell
          - Restore Xiaomi idle sleep policy immediately required
            CANDIDATE_TIP
          - set -u caused the nested replay to stop

          45P6 changes only orchestration.

          After every extracted historic Actions run block it imports the
          known simple KEY=value entries written to $GITHUB_ENV into the
          current shell.

          No kernel semantics are changed.
          No SUSFS source semantics are changed.
          No ReSukiSU source semantics are changed.

          The final checks remain those from 45P5.

          No Image build.
          No boot.img.
          No flashable ZIP.
          No device access.
          No flashing.
          EOF

      - name: Checkout exact workflow references
        uses: actions/checkout@v7
        with:
          repository: Chrizz100/veux-resukisu-builder
          ref: main
          fetch-depth: 1
          path: workflow-reference
          persist-credentials: false

      - name: Verify exact Workflow 45P5 blob
        shell: bash
        run: |
          set -euo pipefail

          W45P5=".github/workflows/45P5-final-resukisu-susfs-preflight-closure.yml"

          ACTUAL45P5="$(
            git -C "$REFERENCE_DIR" \
              hash-object \
              "$W45P5"
          )"

          if [ "$ACTUAL45P5" != "$WORKFLOW45P5_BLOB" ]; then
            echo "ERROR: Workflow 45P5 changed"
            echo "Expected: $WORKFLOW45P5_BLOB"
            echo "Actual:   $ACTUAL45P5"
            exit 1
          fi

          {
            echo "WORKFLOW45P5_BLOB=$ACTUAL45P5"
            echo "WORKFLOW45P5_REFERENCE=PASS"
          } | tee "$ARTIFACT_DIR/WORKFLOW45P5-REFERENCE.txt"

      - name: Create exact run block extractor
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/extract-run-block.py" <<'PY'
          import sys
          from pathlib import Path

          if len(sys.argv) != 4:
              raise SystemExit(
                  "usage: extract-run-block.py WORKFLOW STEP_NAME OUTPUT"
              )

          workflow = Path(sys.argv[1])
          step_name = sys.argv[2]
          output = Path(sys.argv[3])

          lines = workflow.read_text(
              encoding="utf-8"
          ).splitlines(
              keepends=True
          )

          marker = f"      - name: {step_name}"

          starts = [
              i
              for i, line in enumerate(lines)
              if line.rstrip("\n") == marker
          ]

          if len(starts) != 1:
              raise SystemExit(
                  f"{step_name!r}: expected one step, got {len(starts)}"
              )

          start = starts[0]
          run_index = None

          for i in range(start + 1, len(lines)):
              if (
                  i > start + 1
                  and lines[i].startswith("      - name: ")
              ):
                  break

              if lines[i].strip() == "run: |":
                  run_index = i
                  break

          if run_index is None:
              raise SystemExit(
                  f"{step_name!r}: run block not found"
              )

          end = len(lines)

          for i in range(run_index + 1, len(lines)):
              if lines[i].startswith("      - name: "):
                  end = i
                  break

          block = lines[
              run_index + 1:
              end
          ]

          nonblank = [
              line
              for line in block
              if line.strip()
          ]

          if not nonblank:
              raise SystemExit(
                  f"{step_name!r}: empty run block"
              )

          def leading_spaces(line):
              return len(line) - len(line.lstrip(" "))

          indent = min(
              leading_spaces(line)
              for line in nonblank
          )

          if indent < 10:
              raise SystemExit(
                  f"{step_name!r}: unexpected indentation {indent}"
              )

          extracted = "".join(
              line[indent:]
              if line.strip()
              else "\n"
              for line in block
          )

          output.write_text(
              extracted,
              encoding="utf-8"
          )
          PY

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P5-final-resukisu-susfs-preflight-closure.yml" \
            "Verify exact cumulative config identity" \
            "${RUNNER_TEMP}/extractor-selftest.sh"

          if [ ! -s "${RUNNER_TEMP}/extractor-selftest.sh" ]; then
            echo "ERROR: extractor self-test failed"
            exit 1
          fi

          echo "RUN_BLOCK_EXTRACTOR=PASS" \
            | tee "$ARTIFACT_DIR/RUN-BLOCK-EXTRACTOR.txt"

      - name: Install exact 45P5 dependencies
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/install-dependencies.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P5-final-resukisu-susfs-preflight-closure.yml" \
            "Install exact 45P4 dependencies" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Install exact Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/install-clang.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P5-final-resukisu-susfs-preflight-closure.yml" \
            "Install exact Android clang-r416183b" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Verify pinned dependency workflows
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/verify-pinned-workflows.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P5-final-resukisu-susfs-preflight-closure.yml" \
            "Verify pinned dependency workflows" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Checkout exact VEUX source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: "20240619"
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Replay exact 45P4 integration with same step environment
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          W45P4="$REFERENCE_DIR/.github/workflows/45P4-final-resukisu-susfs-semantic-integration-closure.yml"
          EXTRACTOR="${RUNNER_TEMP}/extract-run-block.py"

          sync_known_github_env() {
            local KEY
            local VALUE

            for KEY in \
              CANDIDATE_TIP \
              COMMON_SHA \
              CUMULATIVE_SHA \
              CUMULATIVE_TREE \
              NEW_CUMULATIVE_CONFIG_SHA256
            do
              VALUE="$(
                grep -E "^${KEY}=" "$GITHUB_ENV" \
                  | tail -n 1 \
                  | cut -d= -f2- \
                  || true
              )"

              if [ -n "$VALUE" ]; then
                export "${KEY}=${VALUE}"
                echo "ENV_SYNC=${KEY}"
              fi
            done
          }

          STEPS=(
            "Recreate exact Candidate 2"
            "Fetch official Xiaomi VEUX reference"
            "Reapply exact approved 44C cumulative corrections"
            "Commit isolated cumulative baseline"
            "Verify clean pre SUSFS cumulative state"
            "Fetch exact approved SUSFS 2.2 backport"
            "Apply exact Workflow 17 SUSFS base"
            "Replace legacy KernelSU with exact Workflow 17 ReSukiSU"
            "Apply exact Workflow 17 warning clean adaptation"
            "Verify cumulative adaptation with new exact raw hash"
            "Prove only Git index metadata changed from Workflow 17"
            "Verify cumulative corrections survived integration"
            "Resolve new cumulative ReSukiSU SUSFS config"
          )

          : > "$ARTIFACT_DIR/45P6-REPLAY-STEPS.txt"
          : > "$ARTIFACT_DIR/45P6-ENV-SYNC.txt"

          INDEX=0

          for STEP in "${STEPS[@]}"; do
            INDEX=$((INDEX + 1))

            SCRIPT="$RUNNER_TEMP/45p6-step-${INDEX}.sh"

            python3 \
              "$EXTRACTOR" \
              "$W45P4" \
              "$STEP" \
              "$SCRIPT"

            chmod +x "$SCRIPT"

            sync_known_github_env \
              | tee -a "$ARTIFACT_DIR/45P6-ENV-SYNC.txt"

            echo "RUNNING=$STEP" \
              | tee -a "$ARTIFACT_DIR/45P6-REPLAY-STEPS.txt"

            bash "$SCRIPT"

            sync_known_github_env \
              | tee -a "$ARTIFACT_DIR/45P6-ENV-SYNC.txt"

            echo "PASS=$STEP" \
              | tee -a "$ARTIFACT_DIR/45P6-REPLAY-STEPS.txt"
          done

          if [ -z "${CANDIDATE_TIP:-}" ]; then
            echo "ERROR: CANDIDATE_TIP still missing after synchronized replay"
            exit 1
          fi

          if [ -z "${COMMON_SHA:-}" ]; then
            echo "ERROR: COMMON_SHA still missing after synchronized replay"
            exit 1
          fi

          if [ -z "${CUMULATIVE_SHA:-}" ]; then
            echo "ERROR: CUMULATIVE_SHA still missing after synchronized replay"
            exit 1
          fi

          if [ -z "${CUMULATIVE_TREE:-}" ]; then
            echo "ERROR: CUMULATIVE_TREE still missing after synchronized replay"
            exit 1
          fi

          CONFIG="$ARTIFACT_DIR/final-cumulative.config"

          if [ ! -s "$CONFIG" ]; then
            echo "ERROR: final cumulative config not produced"
            exit 1
          fi

          CONFIG_SHA="$(
            sha256sum "$CONFIG" \
              | awk '{print $1}'
          )"

          if [ "$CONFIG_SHA" != "$EXPECTED_CUMULATIVE_CONFIG_SHA256" ]; then
            echo "ERROR: synchronized replay config hash mismatch"
            echo "Expected: $EXPECTED_CUMULATIVE_CONFIG_SHA256"
            echo "Actual:   $CONFIG_SHA"
            exit 1
          fi

          {
            echo "45P6_ENVIRONMENT_SYNC=PASS"
            echo "CANDIDATE_TIP=$CANDIDATE_TIP"
            echo "COMMON_SHA=$COMMON_SHA"
            echo "CUMULATIVE_SHA=$CUMULATIVE_SHA"
            echo "CUMULATIVE_TREE=$CUMULATIVE_TREE"
            echo "FINAL_CUMULATIVE_CONFIG_SHA256=$CONFIG_SHA"
          } | tee "$ARTIFACT_DIR/45P6-ENVIRONMENT-STATE.txt"

      - name: Verify exact cumulative config identity
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/verify-config.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P5-final-resukisu-susfs-preflight-closure.yml" \
            "Verify exact cumulative config identity" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Verify no reject or orig files remain
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/verify-reject-orig.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P5-final-resukisu-susfs-preflight-closure.yml" \
            "Verify no reject or orig files remain" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Strict diff check outside known approved SUSFS files
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/strict-diff-check.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P5-final-resukisu-susfs-preflight-closure.yml" \
            "Strict diff check outside known approved SUSFS files" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Verify exact inherited SUSFS whitespace diagnostics
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/verify-susfs-whitespace.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P5-final-resukisu-susfs-preflight-closure.yml" \
            "Verify exact inherited SUSFS whitespace diagnostics" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Verify semantic integration proof
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/verify-semantic-proof.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P5-final-resukisu-susfs-preflight-closure.yml" \
            "Verify semantic integration proof" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Verify ReSukiSU final identity and linkage
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/verify-resukisu.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P5-final-resukisu-susfs-preflight-closure.yml" \
            "Verify ReSukiSU final identity and linkage" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Prepare final preflight result
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/final-result.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P5-final-resukisu-susfs-preflight-closure.yml" \
            "Prepare final preflight result" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

          if ! grep -qFx \
            'RESULT=PASS_PREFLIGHT' \
            "$ARTIFACT_DIR/RESULT.txt"
          then
            echo "ERROR: final PASS_PREFLIGHT marker missing"
            exit 1
          fi

          if ! grep -qFx \
            "NEW_CUMULATIVE_CONFIG_SHA256=$EXPECTED_CUMULATIVE_CONFIG_SHA256" \
            "$ARTIFACT_DIR/RESULT.txt"
          then
            echo "ERROR: final cumulative config hash marker mismatch"
            exit 1
          fi

          {
            echo "RESULT=PASS"
            echo "45P5_FAILURE_ROOT_CAUSE=GITHUB_ENV_STEP_BOUNDARY"
            echo "45P6_ENVIRONMENT_SYNC=PASS"
            echo "45P5_SEMANTIC_CHECKS_REUSED=YES"
            echo "FINAL_PREFLIGHT_RESULT=PASS_PREFLIGHT"
            echo "FINAL_CUMULATIVE_CONFIG_SHA256=$EXPECTED_CUMULATIVE_CONFIG_SHA256"
            echo "KERNEL_IMAGE_BUILT=NO"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "DEVICE_FLASHED=NO"
          } | tee "$ARTIFACT_DIR/45P6-CLOSURE.txt"

      - name: Upload 45P6 final preflight closure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-Final-ReSukiSU-SUSFS-Preflight-Env-Closure
          path: final-preflight-env-closure/
          if-no-files-found: error
          retention-days: 30
