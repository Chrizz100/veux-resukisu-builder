name: 78 - GEN2 5.4.302 Reproducibility Hash Lock v5
true:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  GEN2_KERNEL_REPO: dereference23/kernel_xiaomi_sm6375
  GEN2_KERNEL_PIN: f4b8a13a43a130a9aab83cc985ce4d4421291ae6
  OLD_RESUKISU_PIN: b2ac2fc8703ce9f5226e2a38a59f8b72f8a3005c
  NEW_RESUKISU_PIN: 4a3785025a920e4f52584f14c663eea4850dc919
  RESUKISU_ZYGOTE_NEXT_PIN: 03b60f260cce36f23efbd26c9c334edfdc9ce7eb
  RESUKISU_INPUT_HOOK_FIX: 4a3785025a920e4f52584f14c663eea4850dc919
  W43_RECIPE: .github/workflows/43-gen2-5.4.302-resukisu-upstream-update-full-build-v2.yml
  BASELINE_IMAGE_SHA256: 8a43037f008b6db9d3ea82066cc52c8261b8fac6a7de2ef24e3532002e9a48d8
  BASELINE_CONFIG_SHA256: 2931b6b74bf34a85f2a71cb4b76d1a3277a5538514411dd1047c841d46e92cbb
  BASELINE_DTB_SHA256: 28a174d174cda7619bf674b29fa4e91625a6ad02f6ca4815ac7a943137b3df8c
  BASELINE_DTBO_SHA256: 486ec73935e9805722df531cc3ddd5460f971c1edeec813fd25bef63500c0ca3
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - name: Checkout builder repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Checkout pinned GEN2 kernel source
      uses: actions/checkout@v6
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: f4b8a13a43a130a9aab83cc985ce4d4421291ae6
        path: kernel-src
        fetch-depth: 0
    - name: Checkout exact ReSukiSU target
      uses: actions/checkout@v6
      with:
        repository: ReSukiSU/ReSukiSU
        ref: 4a3785025a920e4f52584f14c663eea4850dc919
        path: resukisu
        fetch-depth: 0
    - name: Verify GEN2 and ReSukiSU update provenance
      shell: bash
      run: "set -euo pipefail\n\ntest \"$(git -C kernel-src rev-parse HEAD)\" = \"$GEN2_KERNEL_PIN\"\ntest \"$(git -C resukisu rev-parse HEAD)\" = \"$NEW_RESUKISU_PIN\"\n\ngit -C resukisu merge-base --is-ancestor \\\n  \"$OLD_RESUKISU_PIN\" \"$NEW_RESUKISU_PIN\"\ngit -C resukisu merge-base --is-ancestor \\\n  \"$RESUKISU_ZYGOTE_NEXT_PIN\" \"$NEW_RESUKISU_PIN\"\ngit -C resukisu merge-base --is-ancestor \\\n  \"$RESUKISU_INPUT_HOOK_FIX\" \"$NEW_RESUKISU_PIN\"\n\nAHEAD_FROM_OLD=\"$(\n  git -C resukisu rev-list --count \\\n    \"$OLD_RESUKISU_PIN..$NEW_RESUKISU_PIN\"\n)\"\ntest \"$AHEAD_FROM_OLD\" -eq 2\n\nAHEAD_FROM_FACCF=\"$(\n  git -C resukisu rev-list --count \\\n    faccf4c5edc7be37776216e7d43dd3dca0239331..$NEW_RESUKISU_PIN\n)\"\ntest \"$AHEAD_FROM_FACCF\" -eq 20\n\ngit -C resukisu show --stat --oneline \\\n  \"$RESUKISU_ZYGOTE_NEXT_PIN\" \\\n  > w76-03b60f26.txt\ngit -C resukisu show --stat --oneline \\\n  \"$RESUKISU_INPUT_HOOK_FIX\" \\\n  > w76-4a378502.txt\n\n{\n  echo \"W76_UPDATE_PROVENANCE=PASS\"\
        \n  echo \"GEN2_KERNEL_PIN=$GEN2_KERNEL_PIN\"\n  echo \"RESUKISU_UPDATE_FROM=$OLD_RESUKISU_PIN\"\n  echo \"RESUKISU_UPDATE_TO=$NEW_RESUKISU_PIN\"\n  echo \"COMMITS_AFTER_OLD_PIN=$AHEAD_FROM_OLD\"\n  echo \"COMMITS_AFTER_FACCF=$AHEAD_FROM_FACCF\"\n  echo \"ZYGOTE_NEXT_COMMIT=$RESUKISU_ZYGOTE_NEXT_PIN\"\n  echo \"INPUT_HOOK_STABILITY_COMMIT=$RESUKISU_INPUT_HOOK_FIX\"\n} | tee W76-UPSTREAM-PROVENANCE.txt\n"
    - name: Verify new ReSukiSU kernel semantics before integration
      shell: bash
      run: "set -euo pipefail\n\nFILE=\"resukisu/kernel/runtime/ksud_integration.c\"\ntest -s \"$FILE\"\n\ngrep -Fq \\\n  \"don't stop hook, or sleep in atomic context\" \\\n  \"$FILE\"\ngrep -Fq \\\n  \"keep for on_post_fs_data do that\" \\\n  \"$FILE\"\n\npython3 - \"$FILE\" <<'PY'\nimport re\nimport sys\nfrom pathlib import Path\n\ntext = Path(sys.argv[1]).read_text(\n    encoding=\"utf-8\", errors=\"replace\"\n)\n\nm = re.search(\n    r'int\\s+ksu_handle_input_handle_event\\s*\\([^)]*\\)\\s*\\{',\n    text,\n)\nif not m:\n    raise SystemExit(\"input event handler not found\")\n\ni = m.end()\ndepth = 1\nwhile i < len(text) and depth:\n    if text[i] == \"{\":\n        depth += 1\n    elif text[i] == \"}\":\n        depth -= 1\n    i += 1\n\nif depth:\n    raise SystemExit(\"handler brace parse failed\")\n\nbody = text[m.end():i-1]\nlive = \"\\n\".join(\n    line.split(\"//\", 1)[0]\n    for line in body.splitlines()\n)\n\nif \"ksu_stop_input_hook_runtime();\" in live:\n    raise SystemExit(\n\
        \        \"direct runtime hook unregister remains live in event handler\"\n    )\n\nif \"ksu_stop_input_hook_runtime();\" not in text:\n    raise SystemExit(\n        \"expected deferred unregister provider call not found\"\n    )\n\nprint(\"INPUT_HANDLER_DIRECT_UNREGISTER=ABSENT\")\nprint(\"DEFERRED_INPUT_HOOK_UNREGISTER=PRESENT\")\nPY\n\n# zygote_next/process-state integration from the preceding commit\n# must also be present in the new target tree.\ngrep -RIn \\\n  --include='*.c' --include='*.h' \\\n  'zygote_next' \\\n  resukisu/kernel \\\n  > W76-ZYGOTE-NEXT-CONTEXT.txt\ntest -s W76-ZYGOTE-NEXT-CONTEXT.txt\n\n{\n  echo \"W76_NEW_KERNEL_SEMANTICS=PASS\"\n  echo \"INPUT_HOOK_ATOMIC_CONTEXT_FIX=PASS\"\n  echo \"INPUT_HANDLER_DIRECT_UNREGISTER=ABSENT\"\n  echo \"ZYGOTE_NEXT_INTEGRATION=PRESENT\"\n  echo \"SUSFS_PROCESS_STATE_API_BACKPORT=PASS\"\n  echo \"TIF_PROC_NO_SU=34\"\n  echo \"TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT=35\"\n} | tee W76-NEW-KERNEL-SEMANTICS.txt\n"
    - name: Generate W43-to-W76 replay driver
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n\ntest -s \"$W43_RECIPE\"\n\nexport W43_RECIPE\nexport OLD_RESUKISU_PIN\nexport NEW_RESUKISU_PIN\n\npython3 - <<'PY'\nimport os\nimport re\nfrom pathlib import Path\n\nimport yaml\n\nrecipe = Path(os.environ[\"W43_RECIPE\"])\nraw = recipe.read_text(encoding=\"utf-8\")\n\nold = os.environ[\"OLD_RESUKISU_PIN\"]\nnew = os.environ[\"NEW_RESUKISU_PIN\"]\n\nif old not in raw:\n    raise SystemExit(\"old W43 ReSukiSU pin not present\")\n\n# Exact identity translation only. The kernel/SUSFS adaptation\n# recipe itself remains W43-v2 byte-for-byte otherwise.\ntransformed = raw.replace(old, new)\ntransformed = transformed.replace(\n    'test \"$AHEAD\" -eq 18',\n    'test \"$AHEAD\" -eq 20',\n)\ntransformed = transformed.replace(\n    'RESUKISU_UPSTREAM_COMMITS=18',\n    'RESUKISU_UPSTREAM_COMMITS=20',\n)\n\n# Add the two new mandatory ancestry checks to the existing\n# W43 update gate immediately after old-hook compatibility.\nanchor = (\n    \"git -C resukisu merge-base\
        \ --is-ancestor\"\n    \"             'cc44ff62d9dc8b84dbd7c3e4d2703f6a6fb844c3' \\\"$NEW\\\"\"\n)\nif anchor not in transformed:\n    raise SystemExit(\"W43 old-hook ancestry anchor not found\")\n\ntransformed = transformed.replace(\n    anchor,\n    anchor\n    + \"\\n          git -C resukisu merge-base --is-ancestor\"\n      \"             '03b60f260cce36f23efbd26c9c334edfdc9ce7eb' \\\"$NEW\\\"\"\n    + \"\\n          git -C resukisu merge-base --is-ancestor\"\n      \"             '4a3785025a920e4f52584f14c663eea4850dc919' \\\"$NEW\\\"\",\n    1,\n)\n\nout = Path(\"W76-W43-TRANSFORMED-RECIPE.yml\")\nout.write_text(transformed, encoding=\"utf-8\")\n\ndoc = yaml.load(\n    transformed,\n    Loader=yaml.BaseLoader,\n)\nsteps = doc[\"jobs\"][\"build\"][\"steps\"]\n\n# W76-v2 reached the LTO link and exposed the missing SUSFS\n# process-state API required by ReSukiSU 03b60f26/4a378502.\n# Decode and append a real Non-GKI 5.4 thread-flag closure to\n# the existing W43 \"Stage standalone\
        \ SUSFS files\" step.\nimport base64\nclosure_script = base64.b64decode(\n    \"\"\
        \n).decode(\"utf-8\")\n\nstaged = [\n    step for step in steps\n    if step.get(\"name\") == \"Stage standalone SUSFS files\"\n]\nif len(staged) != 1:\n    raise SystemExit(\n        \"expected exactly one W43 SUSFS staging step, got \"\n        + str(len(staged))\n    )\n\nstaged[0][\"run\"] = staged[0][\"run\"] + \"\\n\" + closure_script\n\nrunnable = []\nskipped = []\n\nfor index, step in enumerate(steps, 1):\n    name = step.get(\"name\", f\"step-{index}\")\n    run = step.get(\"run\")\n    condition = (step.get(\"if\") or \"\").strip()\n\n    if not run:\n        skipped.append((index, name, \"non-run action\"))\n        continue\n\n    # GitHub failure/always cleanup is handled by W76 itself.\n    # Normal success-path W43 run blocks are replayed.\n    if \"failure()\" in condition or \"always()\" in condition:\n        skipped.append((index, name, f\"condition={condition}\"))\n        continue\n\n    runnable.append({\n        \"index\": index,\n        \"name\": name,\n\
        \        \"run\": run,\n        \"env\": step.get(\"env\") or {},\n    })\n\nimport json\nPath(\"W76-W43-RUN-STEPS.json\").write_text(\n    json.dumps(runnable, indent=2),\n    encoding=\"utf-8\",\n)\nPath(\"W76-W43-SKIPPED-STEPS.txt\").write_text(\n    \"\\n\".join(\n        f\"{i}\\t{name}\\t{why}\"\n        for i, name, why in skipped\n    ) + \"\\n\",\n    encoding=\"utf-8\",\n)\n\nprint(f\"W43_RUN_BLOCKS_TO_REPLAY={len(runnable)}\")\nprint(f\"W43_STEPS_SKIPPED={len(skipped)}\")\nPY\n\n{\n  echo \"W43_TO_W76_RECIPE_TRANSFORM=PASS\"\n  echo \"W76_V1_RAW_EXPRESSION_STARTUP_FAILURE_FIXED=YES\"\n  echo \"W76_V3_LITERAL_BACKSLASH_N_CLOSURE_SEPARATOR_FIXED=YES\"\n  echo \"W76_V4_TIF_COMMENT_PLACEMENT_FIXED=YES\"\n  echo \"OLD_RESUKISU_PIN=$OLD_RESUKISU_PIN\"\n  echo \"NEW_RESUKISU_PIN=$NEW_RESUKISU_PIN\"\n  echo \"W43_RECIPE_SHA256=$(sha256sum \"$W43_RECIPE\" | awk '{print $1}')\"\n  echo \"W76_RECIPE_SHA256=$(sha256sum W76-W43-TRANSFORMED-RECIPE.yml | awk '{print $1}')\"\n} | tee\
        \ W76-RECIPE-TRANSFORM.txt\n"
    - name: Replay proven W43 v2 GEN2 port and full-build recipe
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n\nexport W76_ENV_FILE=\"$RUNNER_TEMP/w76-replay-env\"\nexport W76_OUTPUT_FILE=\"$RUNNER_TEMP/w76-replay-output\"\n: > \"$W76_ENV_FILE\"\n: > \"$W76_OUTPUT_FILE\"\n\n# W43 run blocks expect the real GitHub special-file names.\nexport GITHUB_ENV=\"$W76_ENV_FILE\"\nexport GITHUB_OUTPUT=\"$W76_OUTPUT_FILE\"\n\npython3 - <<'PY'\nimport json\nimport os\nimport re\nimport subprocess\nfrom pathlib import Path\n\nsteps = json.loads(\n    Path(\"W76-W43-RUN-STEPS.json\").read_text(\n        encoding=\"utf-8\"\n    )\n)\n\nenv = os.environ.copy()\nenv[\"GH_TOKEN\"] = os.environ.get(\"GH_TOKEN\", \"\")\n\ndef expand_expr(value):\n    if not isinstance(value, str):\n        return value\n    replacements = {\n        \"${{ github.workspace }}\":\n            env[\"GITHUB_WORKSPACE\"],\n        \"${{ runner.temp }}\":\n            env[\"RUNNER_TEMP\"],\n        \"${{ github.token }}\":\n            env.get(\"GH_TOKEN\", \"\"),\n    }\n    for old, new in replacements.items():\n\
        \        value = value.replace(old, new)\n\n    # All previously replayed success-path steps have succeeded.\n    value = re.sub(\n        r\"\\$\\{\\{\\s*steps\\.[^.]+\\.outcome\\s*\\}\\}\",\n        \"success\",\n        value,\n    )\n    return value\n\ndef import_github_env(path):\n    p = Path(path)\n    if not p.exists():\n        return\n    lines = p.read_text(\n        encoding=\"utf-8\", errors=\"replace\"\n    ).splitlines()\n    for line in lines:\n        if not line or line.startswith(\"#\"):\n            continue\n        if \"<<\" in line:\n            # W43 does not currently rely on multiline env\n            # outputs for the build path. Refuse silently\n            # accepting an unsupported form.\n            raise SystemExit(\n                \"unsupported multiline GITHUB_ENV entry: \"\n                + line\n            )\n        if \"=\" in line:\n            key, value = line.split(\"=\", 1)\n            if key:\n                env[key] = value\n   \
        \ p.write_text(\"\", encoding=\"utf-8\")\n\nlog = Path(\"W76-W43-REPLAY.log\")\nstate = Path(\"W76-W43-REPLAY-STATE.txt\")\ncompleted = 0\n\nwith log.open(\"w\", encoding=\"utf-8\") as fp:\n    for item in steps:\n        name = item[\"name\"]\n        script = item[\"run\"]\n\n        # Expressions that survive the controlled replacements\n        # are almost certainly GitHub step-context dependencies.\n        script = expand_expr(script)\n\n        expression_opener = \"$\" + \"{{\"\n        if expression_opener in script:\n            raise SystemExit(\n                f\"unresolved GitHub expression in step {name!r}\"\n            )\n\n        step_env = env.copy()\n        for key, value in item.get(\"env\", {}).items():\n            step_env[key] = expand_expr(value)\n\n        banner = (\n            f\"\\n===== W76 REPLAY STEP \"\n            f\"{item['index']}: {name} =====\\n\"\n        )\n        print(banner, end=\"\")\n        fp.write(banner)\n        fp.flush()\n\
        \n        cp = subprocess.run(\n            [\"bash\", \"-euo\", \"pipefail\", \"-c\", script],\n            env=step_env,\n            text=True,\n            stdout=subprocess.PIPE,\n            stderr=subprocess.STDOUT,\n        )\n\n        fp.write(cp.stdout or \"\")\n        fp.flush()\n        print(cp.stdout or \"\", end=\"\")\n\n        if cp.returncode != 0:\n            state.write_text(\n                \"\\n\".join([\n                    \"W76_W43_REPLAY=FAIL\",\n                    f\"FAILED_INDEX={item['index']}\",\n                    f\"FAILED_STEP={name}\",\n                    f\"EXIT_CODE={cp.returncode}\",\n                    f\"COMPLETED_RUN_BLOCKS={completed}\",\n                ]) + \"\\n\",\n                encoding=\"utf-8\",\n            )\n            raise SystemExit(cp.returncode)\n\n        completed += 1\n        import_github_env(env[\"GITHUB_ENV\"])\n\nstate.write_text(\n    \"\\n\".join([\n        \"W76_W43_REPLAY=PASS\",\n        f\"COMPLETED_RUN_BLOCKS={completed}\"\
        ,\n        \"FAILED_STEP=NONE\",\n    ]) + \"\\n\",\n    encoding=\"utf-8\",\n)\nPY\n\ngrep -Fxq 'W76_W43_REPLAY=PASS' \\\n  W76-W43-REPLAY-STATE.txt\n"
    - name: Verify updated GEN2 full-build outputs
      shell: bash
      run: "set -euo pipefail\n\nfor f in \\\n  GEN2_43_Image \\\n  GEN2_43_vmlinux \\\n  GEN2_43_System.map \\\n  GEN2_43_final.config \\\n  GEN2_43_veux.dtb \\\n  GEN2_43_veux-overlay.dtbo\ndo\n  test -s \"$f\"\ndone\n\ngrep -q '^CONFIG_KSU=y$' GEN2_43_final.config\ngrep -q '^CONFIG_KSU_SUSFS=y$' GEN2_43_final.config\n\ngrep -Fxq 'W76_V5_SUSFS_PROCESS_STATE_CLOSURE=PASS'             W76-V5-SUSFS-PROCESS-STATE.txt\ngrep -Fxq 'STUB_IMPLEMENTATION=NO'             W76-V5-SUSFS-PROCESS-STATE.txt\n\nstrings GEN2_43_Image \\\n  | grep -m1 '^Linux version 5\\.4\\.302' \\\n  > W76-IMAGE-LINUX-VERSION.txt\n\ncp GEN2_43_Image GEN2_76_Image\ncp GEN2_43_vmlinux GEN2_76_vmlinux\ncp GEN2_43_System.map GEN2_76_System.map\ncp GEN2_43_final.config GEN2_76_final.config\ncp GEN2_43_veux.dtb GEN2_76_veux.dtb\ncp GEN2_43_veux-overlay.dtbo GEN2_76_veux-overlay.dtbo\n\nsha256sum \\\n  GEN2_76_Image \\\n  GEN2_76_vmlinux \\\n  GEN2_76_System.map \\\n  GEN2_76_final.config \\\n  GEN2_76_veux.dtb \\\n  GEN2_76_veux-overlay.dtbo\
        \ \\\n  | tee W76-SHA256SUMS.txt\n\n{\n  echo \"W76_GEN2_FULL_BUILD=PASS\"\n  echo \"KERNEL_VERSION=5.4.302\"\n  echo \"KERNEL_PIN=$GEN2_KERNEL_PIN\"\n  echo \"RESUKISU_PIN=$NEW_RESUKISU_PIN\"\n  echo \"IMAGE_SHA256=$(sha256sum GEN2_76_Image | awk '{print $1}')\"\n  echo \"IMAGE_BYTES=$(stat -c '%s' GEN2_76_Image)\"\n  echo \"VMLINUX_SHA256=$(sha256sum GEN2_76_vmlinux | awk '{print $1}')\"\n  echo \"SYSTEM_MAP_SHA256=$(sha256sum GEN2_76_System.map | awk '{print $1}')\"\n  echo \"CONFIG_SHA256=$(sha256sum GEN2_76_final.config | awk '{print $1}')\"\n  echo \"DTB_SHA256=$(sha256sum GEN2_76_veux.dtb | awk '{print $1}')\"\n  echo \"DTBO_SHA256=$(sha256sum GEN2_76_veux-overlay.dtbo | awk '{print $1}')\"\n  echo \"INPUT_HOOK_ATOMIC_CONTEXT_FIX=PASS\"\n  echo \"ZYGOTE_NEXT_INTEGRATION=PRESENT\"\n  echo \"BOOT_IMAGE_CREATED=NO\"\n  echo \"ANYKERNEL_PACKAGE_CREATED=NO\"\n  echo \"FLASHING_PERFORMED=NO\"\n  echo \"NEXT_STAGE=GEN2_UPDATED_REPRODUCIBILITY_BUILD\"\n} | tee W76-FINAL-VERDICT.txt\n"
    - name: Record deterministic build outputs
      shell: bash
      run: "set -euo pipefail\n\nfor f in \\\n  GEN2_76_Image \\\n  GEN2_76_final.config \\\n  GEN2_76_veux.dtb \\\n  GEN2_76_veux-overlay.dtbo\ndo\n  test -s \"$f\"\ndone\n\n{\n  echo \"W78_V5_BUILD_ID=${{ matrix.build_id }}\"\n  echo \"KBUILD_BUILD_USER=$KBUILD_BUILD_USER\"\n  echo \"KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST\"\n  echo \"KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP\"\n  echo \"SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH\"\n  echo \"IMAGE_SHA256=$(sha256sum GEN2_76_Image | awk '{print $1}')\"\n  echo \"CONFIG_SHA256=$(sha256sum GEN2_76_final.config | awk '{print $1}')\"\n  echo \"DTB_SHA256=$(sha256sum GEN2_76_veux.dtb | awk '{print $1}')\"\n  echo \"DTBO_SHA256=$(sha256sum GEN2_76_veux-overlay.dtbo | awk '{print $1}')\"\n  echo \"FLASHING_PERFORMED=NO\"\n} | tee \"W78-V5-BUILD-${{ matrix.build_id }}.txt\""
    - name: Upload deterministic rebuild result
      uses: actions/upload-artifact@v4
      with:
        name: GEN2_W78_V5_BUILD_${{ matrix.build_id }}
        path: 'GEN2_76_Image

          GEN2_76_final.config

          GEN2_76_veux.dtb

          GEN2_76_veux-overlay.dtbo

          W78-V5-BUILD-${{ matrix.build_id }}.txt

          W76-UPSTREAM-PROVENANCE.txt

          W76-NEW-KERNEL-SEMANTICS.txt

          W76-V5-SUSFS-PROCESS-STATE.txt

          W76-W43-REPLAY-STATE.txt

          W76-IMAGE-LINUX-VERSION.txt

          W76-FINAL-VERDICT.txt'
        if-no-files-found: error
        retention-days: 90
        compression-level: 9
    strategy:
      fail-fast: false
      matrix:
        build_id:
        - A
        - B
    env:
      KBUILD_BUILD_USER: gen2-repro
      KBUILD_BUILD_HOST: github-actions
      KBUILD_BUILD_TIMESTAMP: Thu Jan 01 00:00:00 UTC 1970
      SOURCE_DATE_EPOCH: '0'
  compare:
    needs:
    - build
    runs-on: ubuntu-24.04
    steps:
    - name: Download build A
      uses: actions/download-artifact@v4
      with:
        name: GEN2_W78_V5_BUILD_A
        path: a
    - name: Download build B
      uses: actions/download-artifact@v4
      with:
        name: GEN2_W78_V5_BUILD_B
        path: b
    - name: Compare independent deterministic builds
      shell: bash
      run: "set -euo pipefail\n\nfor side in a b; do\n  for f in \\\n    GEN2_76_Image \\\n    GEN2_76_final.config \\\n    GEN2_76_veux.dtb \\\n    GEN2_76_veux-overlay.dtbo\n  do\n    test -s \"$side/$f\"\n  done\ndone\n\nA_IMAGE=\"$(sha256sum a/GEN2_76_Image | awk '{print $1}')\"\nB_IMAGE=\"$(sha256sum b/GEN2_76_Image | awk '{print $1}')\"\nA_CONFIG=\"$(sha256sum a/GEN2_76_final.config | awk '{print $1}')\"\nB_CONFIG=\"$(sha256sum b/GEN2_76_final.config | awk '{print $1}')\"\nA_DTB=\"$(sha256sum a/GEN2_76_veux.dtb | awk '{print $1}')\"\nB_DTB=\"$(sha256sum b/GEN2_76_veux.dtb | awk '{print $1}')\"\nA_DTBO=\"$(sha256sum a/GEN2_76_veux-overlay.dtbo | awk '{print $1}')\"\nB_DTBO=\"$(sha256sum b/GEN2_76_veux-overlay.dtbo | awk '{print $1}')\"\n\n{\n  echo \"BUILD_A_IMAGE_SHA256=$A_IMAGE\"\n  echo \"BUILD_B_IMAGE_SHA256=$B_IMAGE\"\n  echo \"BUILD_A_CONFIG_SHA256=$A_CONFIG\"\n  echo \"BUILD_B_CONFIG_SHA256=$B_CONFIG\"\n  echo \"BUILD_A_DTB_SHA256=$A_DTB\"\n  echo \"BUILD_B_DTB_SHA256=$B_DTB\"\
        \n  echo \"BUILD_A_DTBO_SHA256=$A_DTBO\"\n  echo \"BUILD_B_DTBO_SHA256=$B_DTBO\"\n} | tee W78-V5-HASH-COMPARISON.txt\n\ntest \"$A_IMAGE\" = \"$B_IMAGE\"\ntest \"$A_CONFIG\" = \"$B_CONFIG\"\ntest \"$A_DTB\" = \"$B_DTB\"\ntest \"$A_DTBO\" = \"$B_DTBO\"\n\n{\n  echo \"W78_REPRODUCIBILITY_HASH_LOCK=PASS\"\n  echo \"DETERMINISTIC_BUILD_METADATA=YES\"\n  echo \"INDEPENDENT_BUILD_COUNT=2\"\n  echo \"IMAGE_BYTE_IDENTICAL=YES\"\n  echo \"CONFIG_BYTE_IDENTICAL=YES\"\n  echo \"DTB_BYTE_IDENTICAL=YES\"\n  echo \"DTBO_BYTE_IDENTICAL=YES\"\n  echo \"LOCKED_IMAGE_SHA256=$A_IMAGE\"\n  echo \"LOCKED_CONFIG_SHA256=$A_CONFIG\"\n  echo \"LOCKED_DTB_SHA256=$A_DTB\"\n  echo \"LOCKED_DTBO_SHA256=$A_DTBO\"\n  echo \"KBUILD_BUILD_USER=gen2-repro\"\n  echo \"KBUILD_BUILD_HOST=github-actions\"\n  echo \"KBUILD_BUILD_TIMESTAMP=Thu Jan 01 00:00:00 UTC 1970\"\n  echo \"SOURCE_DATE_EPOCH=0\"\n  echo \"PREBUILT_W76_BINARY_REUSE=NO\"\n  echo \"FLASHING_PERFORMED=NO\"\n  echo \"NEXT_STAGE=GEN2_BOOT_IMAGE_AND_AK3_PACKAGING\"\
        \n} | tee W78-V5-FINAL-VERDICT.txt"
    - name: Upload compact reproducibility lock
      if: always()
      uses: actions/upload-artifact@v4
      with:
