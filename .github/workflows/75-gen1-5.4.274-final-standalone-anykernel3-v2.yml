name: 75 - GEN1 5.4.274 Final Standalone AnyKernel3 v2

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

env:
  W52_CONTRACT_PATH: .github/workflows/52-gen1-5.4.274-github-built-standalone-ak3-v1.yml

  W73_KERNEL_ARTIFACT_NAME: W73-v2-VEUX-5.4.274-updated-kernel-candidate
  W73_BOOT_ARTIFACT_NAME: W73-v2-VEUX-5.4.274-ReSukiSU-SUSFS-boot-img-candidate
  W21_ARTIFACT_NAME: veux-5.4.274-resukisu-susfs-2.2-workflow21-exact-w19-final-flashable-1

  W73_IMAGE_SHA256: 1ff4c57bb524b1d01de1d56739133ea4a9c9b3269ad87e013b8140f3654d8aea
  W73_IMAGE_BYTES: "29843968"
  W73_CONFIG_SHA256: d7cd955abd59da45804acc9c5e450cf8fc953da3e66bbc274212b40ee9a0b372
  UPDATED_RESUKISU_COMMIT: 4a3785025a920e4f52584f14c663eea4850dc919

  W21_FINAL_ZIP_NAME: VEUX_5.4.274_ReSukiSU_SUSFS_2.2_EXACT_W19_BOOT_FLASHABLE.zip
  W21_FINAL_ZIP_SHA256: b6f9c22582cf90aca3bd40d946f44f465f3b4324d377cabdd9a23668113fe4f2
  W21_FINAL_ZIP_BYTES: "75516120"

  STOCK_ROM_VERSION: OS1.0.12.0.TKCMIXM
  STOCK_ANDROID_VERSION: "13"
  STOCK_SECURITY_PATCH: 2024-12
  STOCK_BOOT_SHA256: ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5
  STOCK_BOOT_BYTES: "134217728"
  OLD_CUSTOM_BOOT_SHA256: 2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e
  OLD_KERNEL_SHA256: e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96
  OLD_KERNEL_BYTES: "29839872"
  STOCK_RAMDISK_SHA256: 0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a
  ROLLBACK_GZIP_SHA256: 9a1532ccfc57b465256bba97863f927b80823fa8812a4d13e4f4c8bf9af0c78b

  AK3_CORE_SHA256: f7a51cfe2e093016a34a76e16de6c9885c2d1992c3482fcabc668680e1f0f6bb
  BUSYBOX_SHA256: 66436dc1e97d22886ed2d35bd69a9cb82bb0fdba4e4267c5184cee1d39a2f5f4
  MAGISKBOOT_SHA256: 0b19472b291ce9033c29a83155ff4c1b18be9d1d17d901d63e50f57436378762

  EXPECTED_BOOT_SHA256: 7490870231b26fc8495d190a7425dc347351f9f0751db7e9f29403d6a0194145
  EXPECTED_BOOT_BYTES: "134217728"
  EXPECTED_AVB_DIGEST: 7af81a3cf9f9a7575eee20ca76256700512db3a46153238789edafdf8adf8133
  EXPECTED_HEADER_SHA256: fda70b19269443dca783ec0198ad0117de8dc895f95a70fce3698fd8cb523bd6
  EXPECTED_VBMETA_SHA256: e4842eb0354d7c7aa1c0e6628a0b3c47c36b1514c98cec55190027c79437f8ab
  EXPECTED_FOOTER_SHA256: 04cccbbae2ffcce73c324de576be36cca6e00b809e387157619e2d4226537790

  RELEASE_ZIP_NAME: VEUX_5.4.274_ReSukiSU_4A378502_SUSFS_2.2_HyperOS_OS1.0.12.0_TKCMIXM_AK3_STANDALONE_W75.zip
  MAX_RELEASE_BYTES: "65000000"
  SOURCE_DATE_EPOCH: "1787788800"

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      WORK: ${{ github.workspace }}/gen1-w75
      INPUTS: ${{ github.workspace }}/gen1-w75/inputs
      W49: ${{ github.workspace }}/gen1-w75/w73-kernel-as-w49
      W73_BOOT: ${{ github.workspace }}/gen1-w75/w73-boot
      W21: ${{ github.workspace }}/gen1-w75/w21
      OLD_PACKAGE: ${{ github.workspace }}/gen1-w75/old-package
      PACKAGE: ${{ github.workspace }}/gen1-w75/package
      BUILD: ${{ github.workspace }}/gen1-w75/build
      HARNESS: ${{ github.workspace }}/gen1-w75/harness
      OUTPUT: ${{ github.workspace }}/gen1-w75/output
      FAKE_BLOCK_ROOT: ${{ github.workspace }}/gen1-w75/fake-block

      # Compatibility aliases consumed by the proven W52 scripts.
      W49_IMAGE_SHA256: 1ff4c57bb524b1d01de1d56739133ea4a9c9b3269ad87e013b8140f3654d8aea
      W49_IMAGE_BYTES: "29843968"
      W49_CONFIG_SHA256: d7cd955abd59da45804acc9c5e450cf8fc953da3e66bbc274212b40ee9a0b372
      W49_KERNEL_RELEASE: "5.4.274"
      W49_DTB_SHA256: "NOT_USED_BY_W75"

    steps:
      - name: Prepare W75 workspace and authenticate W52 contract
        uses: actions/checkout@v6

      - name: Initialize exact W75 workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORK"
          mkdir -p \
            "$INPUTS" \
            "$W49" \
            "$W73_BOOT" \
            "$W21" \
            "$OLD_PACKAGE" \
            "$PACKAGE" \
            "$BUILD" \
            "$HARNESS" \
            "$OUTPUT"

          CONTRACT="$GITHUB_WORKSPACE/$W52_CONTRACT_PATH"
          test -s "$CONTRACT"

          grep -Fxq \
            'name: 52 - GEN1 5.4.274 GitHub-built Standalone AK3 v1' \
            "$CONTRACT"

          grep -Fq \
            'PACKAGING_MODEL=ANYKERNEL3_STANDALONE_RUNTIME_BOOT_V3_RECONSTRUCTION' \
            "$CONTRACT"
          grep -Fq \
            'STANDALONE_RUNTIME_SLOT_A=PASS' \
            "$CONTRACT"
          grep -Fq \
            'POSTWRITE_CORRUPTION_ROLLBACK=PASS' \
            "$CONTRACT"

          {
            echo "W75_SCOPE=FINAL_GEN1_STANDALONE_AK3"
            echo "W52_CONTRACT_REUSE=YES"
            echo "W52_CONTRACT_SHA256=$(sha256sum "$CONTRACT" | awk '{print $1}')"
            echo "DEVICE=veux"
            echo "KERNEL_VERSION=5.4.274"
            echo "IMAGE_SHA256=$W73_IMAGE_SHA256"
            echo "RESUKISU_COMMIT=$UPDATED_RESUKISU_COMMIT"
            echo "EXPECTED_RUNTIME_BOOT_SHA256=$EXPECTED_BOOT_SHA256"
            echo "REAL_DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } | tee "$OUTPUT/W75-SCOPE.txt"

      - name: Install W75 dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl jq python3 python3-yaml unzip zip
          echo "DEPENDENCIES=PASS" | tee "$OUTPUT/W75-DEPENDENCIES.txt"

      - name: Download exact W73 kernel boot and W21 template artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ALL="$WORK/repository-artifacts.ndjson"
          : > "$ALL"

          page=1
          while :; do
            PAGE="$WORK/repository-artifacts-${page}.json"

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=${page}" \
              -o "$PAGE"

            COUNT="$(jq '.artifacts | length' "$PAGE")"
            jq -c '.artifacts[]' "$PAGE" >> "$ALL"

            if [ "$COUNT" -lt 100 ]; then
              break
            fi

            page=$((page + 1))
            [ "$page" -le 30 ] || {
              echo "ERROR: artifact pagination safety limit" >&2
              exit 1
            }
          done

          download_named() {
            local name="$1"
            local out="$2"
            local metadata="$3"

            local matches selected url
            matches="$(
              jq -s \
                --arg NAME "$name" \
                '[.[] | select(.name == $NAME and .expired == false)] | sort_by(.created_at)' \
                "$ALL"
            )"

            test "$(jq 'length' <<< "$matches")" -ge 1
            selected="$(jq '.[-1]' <<< "$matches")"
            url="$(jq -r '.archive_download_url' <<< "$selected")"

            jq . <<< "$selected" > "$metadata"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" \
              -o "$out"

            unzip -t "$out" >/dev/null
          }

          download_named \
            "$W73_KERNEL_ARTIFACT_NAME" \
            "$INPUTS/w73-kernel.zip" \
            "$OUTPUT/W73-KERNEL-ARTIFACT.json"

          download_named \
            "$W73_BOOT_ARTIFACT_NAME" \
            "$INPUTS/w73-boot.zip" \
            "$OUTPUT/W73-BOOT-ARTIFACT.json"

          download_named \
            "$W21_ARTIFACT_NAME" \
            "$INPUTS/w21.zip" \
            "$OUTPUT/W21-ARTIFACT.json"

          unzip -q "$INPUTS/w73-kernel.zip" -d "$W49"
          unzip -q "$INPUTS/w73-boot.zip" -d "$W73_BOOT"
          unzip -q "$INPUTS/w21.zip" -d "$W21"

          echo "SOURCE_ARTIFACT_DOWNLOADS=PASS" \
            | tee "$OUTPUT/W75-SOURCE-ARTIFACTS.txt"

      - name: Verify exact W73 kernel and boot inputs
        shell: bash
        run: |
          set -euo pipefail

          test -s "$W49/Image"
          test -s "$W49/config"
          test -s "$W73_BOOT/boot.img"

          test "$(stat -c '%s' "$W49/Image")" = "$W73_IMAGE_BYTES"
          test "$(sha256sum "$W49/Image" | awk '{print $1}')" = \
            "$W73_IMAGE_SHA256"
          test "$(sha256sum "$W49/config" | awk '{print $1}')" = \
            "$W73_CONFIG_SHA256"

          test "$(stat -c '%s' "$W73_BOOT/boot.img")" = \
            "$EXPECTED_BOOT_BYTES"
          test "$(sha256sum "$W73_BOOT/boot.img" | awk '{print $1}')" = \
            "$EXPECTED_BOOT_SHA256"

          python3 - "$W73_BOOT/boot.img" <<'PY'
          import hashlib
          import struct
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          b = p.read_bytes()

          def sha(x):
              return hashlib.sha256(x).hexdigest()

          if b[:8] != b"ANDROID!":
              raise SystemExit("bad Android boot magic")

          if struct.unpack_from("<I", b, 40)[0] != 3:
              raise SystemExit("not Boot Header v3")

          footer = b[-64:]
          if footer[:4] != b"AVBf":
              raise SystemExit("missing AVB footer")

          _, off, size = struct.unpack_from(">QQQ", footer, 12)

          expected = {
              "header": "fda70b19269443dca783ec0198ad0117de8dc895f95a70fce3698fd8cb523bd6",
              "vbmeta": "e4842eb0354d7c7aa1c0e6628a0b3c47c36b1514c98cec55190027c79437f8ab",
              "footer": "04cccbbae2ffcce73c324de576be36cca6e00b809e387157619e2d4226537790",
          }

          actual = {
              "header": sha(b[:4096]),
              "vbmeta": sha(b[off:off + size]),
              "footer": sha(footer),
          }

          if actual != expected:
              raise SystemExit(f"boot component hash mismatch: {actual}")

          print("W73_BOOT_COMPONENT_HASHES=PASS")
          PY

          {
            echo "W73_FINAL_KERNEL_GATE=PASS"
            echo "IMAGE_SHA256=$W73_IMAGE_SHA256"
            echo "IMAGE_BYTES=$W73_IMAGE_BYTES"
            echo "CONFIG_SHA256=$W73_CONFIG_SHA256"
            echo "RESUKISU_COMMIT=$UPDATED_RESUKISU_COMMIT"
            echo "W73_BOOT_SHA256=$EXPECTED_BOOT_SHA256"
            echo "W73_BOOT_COMPONENT_HASHES=PASS"
          } | tee "$OUTPUT/W75-W73-GATE.txt"

      - name: Write proven W52 step runner
        shell: bash
        run: |
          set -euo pipefail

          cat > "$WORK/run-w52-step.py" <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          import yaml

          contract = Path(os.environ["GITHUB_WORKSPACE"]) / os.environ["W52_CONTRACT_PATH"]
          wanted = sys.argv[1]

          doc = yaml.load(
              contract.read_text(encoding="utf-8"),
              Loader=yaml.BaseLoader,
          )

          steps = doc["jobs"]["release"]["steps"]
          found = [step for step in steps if step.get("name") == wanted]

          if len(found) != 1:
              raise SystemExit(
                  f"expected exactly one W52 step named {wanted!r}, got {len(found)}"
              )

          script = found[0].get("run")
          if not script:
              raise SystemExit(f"W52 step {wanted!r} has no run block")

          # Reuse the proven W52 implementation, but translate every
          # W49-era embedded identity constant to the already verified
          # W73/W74 final kernel/boot identity. W75-v1 only replaced the
          # visible label; W52's reconstruction Python still contained
          # the literal old W49 Image hash and therefore failed closed.
          replacements = {
              "ReSukiSU b2ac2fc8":
                  "ReSukiSU 4a378502",
              "b2ac2fc8703ce9f5226e2a38a59f8b72f8a3005c":
                  "4a3785025a920e4f52584f14c663eea4850dc919",
              "0a00b12dc8d4f114b4343f473054b03d6e32767961077e43d345f0dc7271b4d3":
                  "1ff4c57bb524b1d01de1d56739133ea4a9c9b3269ad87e013b8140f3654d8aea",
              "ab02eda6e4315ea20d672a580acb09a7d48646dd709ff07f7ebbe70b5cc4c96b":
                  "7490870231b26fc8495d190a7425dc347351f9f0751db7e9f29403d6a0194145",
              "ad684b315b9c3f006123fac2cf5efe57f1b7de4e243624e98e51999690ee7cc3":
                  "e4842eb0354d7c7aa1c0e6628a0b3c47c36b1514c98cec55190027c79437f8ab",
          }

          for old, new in replacements.items():
              script = script.replace(old, new)

          stale = (
              "0a00b12dc8d4f114b4343f473054b03d6e32767961077e43d345f0dc7271b4d3",
              "ab02eda6e4315ea20d672a580acb09a7d48646dd709ff07f7ebbe70b5cc4c96b",
              "ad684b315b9c3f006123fac2cf5efe57f1b7de4e243624e98e51999690ee7cc3",
          )
          for value in stale:
              if value in script:
                  raise SystemExit(
                      f"stale W52 identity constant survived translation: {value}"
                  )

          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", script],
              check=True,
              env=os.environ.copy(),
          )
          PY

          python3 -m py_compile "$WORK/run-w52-step.py"
          echo "W52_STEP_RUNNER=PASS" | tee "$OUTPUT/W75-W52-RUNNER.txt"

      - name: Reuse W52 historical W21 template gate
        shell: bash
        run: |
          set -euo pipefail

          python3 "$WORK/run-w52-step.py" \
            "Verify historical W21 direct payload installer template"

          grep -Fxq 'W21_DIRECT_INSTALLER_TEMPLATE_GATE=PASS' \
            "$OUTPUT/W21-TEMPLATE-GATE.txt"

      - name: Reuse W52 calibrated Boot v3 reconstruction
        shell: bash
        run: |
          set -euo pipefail

          python3 "$WORK/run-w52-step.py" \
            "Reconstruct updated Boot v3 payload twice with historical calibration"

          grep -Fxq 'GEN1_W52_UPDATED_BOOT_RECONSTRUCTION=PASS' \
            "$OUTPUT/W52-BOOT-BRIDGE.txt"
          grep -Fxq 'HISTORICAL_W19_CALIBRATION=PASS' \
            "$OUTPUT/W52-BOOT-BRIDGE.txt"

          test "$(sha256sum "$BUILD/updated-A.img" | awk '{print $1}')" = \
            "$EXPECTED_BOOT_SHA256"
          test "$(sha256sum "$BUILD/updated-B.img" | awk '{print $1}')" = \
            "$EXPECTED_BOOT_SHA256"

          cmp -s "$BUILD/updated-A.img" "$BUILD/updated-B.img"
          cmp -s "$BUILD/updated-A.img" "$W73_BOOT/boot.img"

          {
            echo "W75_BOOT_RECONSTRUCTION=PASS"
            echo "W52_HISTORICAL_CALIBRATION=PASS"
            echo "RECONSTRUCTED_BOOT_EQUALS_W73_BYTE_FOR_BYTE=YES"
            echo "EXPECTED_BOOT_SHA256=$EXPECTED_BOOT_SHA256"
            echo "EXPECTED_AVB_DIGEST=$EXPECTED_AVB_DIGEST"
          } | tee "$OUTPUT/W75-BOOT-RECONSTRUCTION.txt"

      - name: Reuse W52 standalone AnyKernel3 assembly
        shell: bash
        run: |
          set -euo pipefail

          python3 "$WORK/run-w52-step.py" \
            "Assemble deterministic Standalone AK3 from GitHub-built inputs"

          test -s "$OUTPUT/$RELEASE_ZIP_NAME"
          test "$(stat -c '%s' "$OUTPUT/$RELEASE_ZIP_NAME")" -le \
            "$MAX_RELEASE_BYTES"

          grep -Fxq 'STANDALONE_PACKAGE_ASSEMBLY=PASS' \
            "$OUTPUT/W52-STANDALONE-PACKAGE.txt"

          rm -rf "$WORK/package-recheck"
          mkdir -p "$WORK/package-recheck"
          unzip -q "$OUTPUT/$RELEASE_ZIP_NAME" -d "$WORK/package-recheck"

          test -s "$WORK/package-recheck/Image"
          test -s "$WORK/package-recheck/anykernel.sh"
          test -s "$WORK/package-recheck/tools/ak3-core.sh"
          test -s "$WORK/package-recheck/rollback_stock_boot.img.gz"

          test "$(sha256sum "$WORK/package-recheck/Image" | awk '{print $1}')" = \
            "$W73_IMAGE_SHA256"
          test "$(sha256sum "$WORK/package-recheck/tools/ak3-core.sh" | awk '{print $1}')" = \
            "$AK3_CORE_SHA256"
          test "$(sha256sum "$WORK/package-recheck/tools/busybox" | awk '{print $1}')" = \
            "$BUSYBOX_SHA256"
          test "$(sha256sum "$WORK/package-recheck/tools/magiskboot" | awk '{print $1}')" = \
            "$MAGISKBOOT_SHA256"
          test "$(sha256sum "$WORK/package-recheck/rollback_stock_boot.img.gz" | awk '{print $1}')" = \
            "$ROLLBACK_GZIP_SHA256"

          grep -Fq 'device.name1=veux' "$WORK/package-recheck/anykernel.sh"
          grep -Fq 'supported.versions=13' "$WORK/package-recheck/anykernel.sh"
          grep -Fq 'supported.patchlevels=2024-12 - 2024-12' \
            "$WORK/package-recheck/anykernel.sh"
          grep -Fq 'ReSukiSU 4a378502' "$WORK/package-recheck/anykernel.sh"

          if grep -RIn \
              --binary-files=without-match \
              -E 'ReSukiSU b2ac2fc8|ReSukiSU B2AC' \
              "$WORK/package-recheck"
          then
            echo "ERROR: stale previous ReSukiSU package label present" >&2
            exit 1
          fi

          {
            echo "W75_AK3_ASSEMBLY=PASS"
            echo "KERNEL_IMAGE_PACKAGED=YES"
            echo "BOOT_IMG_PACKAGED=NO"
            echo "ROLLBACK_STOCK_BOOT_PACKAGED=YES"
            echo "W52_RUNTIME_MODEL_RETAINED=YES"
          } | tee "$OUTPUT/W75-AK3-ASSEMBLY.txt"

      - name: Reuse W52 slot A B runtime simulation
        shell: bash
        run: |
          set -euo pipefail

          python3 "$WORK/run-w52-step.py" \
            "Runtime simulate GitHub-built Standalone AK3 on fake slot A and B"

          grep -Fxq 'STANDALONE_RUNTIME_SLOT_A=PASS' \
            "$OUTPUT/W52-RUNTIME-A-B.txt"
          grep -Fxq 'STANDALONE_RUNTIME_SLOT_B=PASS' \
            "$OUTPUT/W52-RUNTIME-A-B.txt"
          grep -Fxq 'OTHER_SLOT_PRESERVED=YES' \
            "$OUTPUT/W52-RUNTIME-A-B.txt"

          echo "W75_SLOT_A_B_RUNTIME=PASS" \
            | tee "$OUTPUT/W75-SLOT-A-B.txt"

      - name: Reuse W52 fail closed and rollback fault injection
        shell: bash
        run: |
          set -euo pipefail

          python3 "$WORK/run-w52-step.py" \
            "Prove fail-closed gates and rollback for GitHub-built package"

          for gate in \
            INVALID_SLOT_FAIL_CLOSED=PASS \
            LOCKED_BOOTLOADER_FAIL_CLOSED=PASS \
            NONSTOCK_BOOT_FAIL_CLOSED=PASS \
            TAMPERED_IMAGE_FAIL_CLOSED=PASS \
            POSTWRITE_CORRUPTION_ROLLBACK=PASS \
            ROLLBACK_STOCK_HASH_VERIFIED=YES \
            OTHER_SLOT_PRESERVED=YES
          do
            grep -Fxq "$gate" "$OUTPUT/W52-RUNTIME-FAIL-CLOSED.txt"
          done

          echo "W75_FAIL_CLOSED_AND_ROLLBACK=PASS" \
            | tee "$OUTPUT/W75-FAIL-CLOSED.txt"

      - name: Final deterministic W75 package recheck
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$OUTPUT/$RELEASE_ZIP_NAME"
          test -s "$ZIP"

          unzip -t "$ZIP" > "$OUTPUT/W75-FINAL-ZIP-CRC.txt"

          RELEASE_SHA256="$(sha256sum "$ZIP" | awk '{print $1}')"
          RELEASE_BYTES="$(stat -c '%s' "$ZIP")"

          test "$RELEASE_BYTES" -le "$MAX_RELEASE_BYTES"

          printf '%s  %s\n' "$RELEASE_SHA256" "$RELEASE_ZIP_NAME" \
            > "$OUTPUT/$RELEASE_ZIP_NAME.sha256"

          {
            echo "FINAL_RESULT=PASS_GEN1_W75_FINAL_STANDALONE_AK3"
            echo "DEVICE=veux"
            echo "KERNEL_VERSION=5.4.274"
            echo "ROM_VERSION=$STOCK_ROM_VERSION"
            echo "ANDROID_VERSION=$STOCK_ANDROID_VERSION"
            echo "SECURITY_PATCH=$STOCK_SECURITY_PATCH"
            echo "IMAGE_SHA256=$W73_IMAGE_SHA256"
            echo "RESUKISU_COMMIT=$UPDATED_RESUKISU_COMMIT"
            echo "SUSFS_VERSION=2.2.0_plus_process_state_backport"
            echo "SOURCE_BOOT_SHA256=$EXPECTED_BOOT_SHA256"
            echo "EXPECTED_RUNTIME_BOOT_SHA256=$EXPECTED_BOOT_SHA256"
            echo "EXPECTED_RUNTIME_AVB_DIGEST=$EXPECTED_AVB_DIGEST"
            echo "W52_PROVEN_INSTALLER_MODEL_REUSED=YES"
            echo "W75_V1_HARDCODED_W49_HASH_REGRESSION_FIXED=YES"
            echo "HISTORICAL_W19_CALIBRATION=PASS"
            echo "RECONSTRUCTED_BOOT_EQUALS_W73_BYTE_FOR_BYTE=YES"
            echo "ACTIVE_SLOT_A_RUNTIME=PASS"
            echo "ACTIVE_SLOT_B_RUNTIME=PASS"
            echo "INVALID_SLOT_FAIL_CLOSED=PASS"
            echo "LOCKED_BOOTLOADER_FAIL_CLOSED=PASS"
            echo "NONSTOCK_BOOT_FAIL_CLOSED=PASS"
            echo "TAMPERED_IMAGE_FAIL_CLOSED=PASS"
            echo "ROLLBACK_FAULT_INJECTION=PASS"
            echo "OTHER_SLOT_PRESERVED=YES"
            echo "BOOT_IMG_PACKAGED=NO"
            echo "KERNEL_IMAGE_PACKAGED=YES"
            echo "ROLLBACK_STOCK_BOOT_PACKAGED=YES"
            echo "RELEASE_ZIP_NAME=$RELEASE_ZIP_NAME"
            echo "RELEASE_ZIP_SHA256=$RELEASE_SHA256"
            echo "RELEASE_ZIP_BYTES=$RELEASE_BYTES"
            echo "UNDER_65MB=YES"
            echo "REAL_DEVICE_ACCESSED=NO"
            echo "ADB_USED=NO"
            echo "FASTBOOT_USED=NO"
            echo "FLASHING_PERFORMED=NO"
            echo "PHYSICAL_DEVICE_BOOT_TESTED=NO"
            echo "NEXT_STAGE=GEN1_FINAL_DEVICE_TEST_THEN_GEN2_5.4.302"
          } | tee "$OUTPUT/W75-FINAL-VERDICT.txt"

      - name: Write W75 failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p "$OUTPUT"
          {
            echo "GEN1_W75_V2_RESULT=FAILURE"
            echo "IMAGE_SHA256=$W73_IMAGE_SHA256"
            echo "RESUKISU_COMMIT=$UPDATED_RESUKISU_COMMIT"
            echo "EXPECTED_RUNTIME_BOOT_SHA256=$EXPECTED_BOOT_SHA256"
            echo "REAL_DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } > "$OUTPUT/W75-FAILURE-SUMMARY.txt"

      - name: Upload W75 final standalone AnyKernel3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GEN1_W75_FINAL_5.4.274_STANDALONE_AK3-${{ github.run_number }}
          path: gen1-w75/output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 0

      - name: Fail only after preserving W75 diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -Fxq \
              'FINAL_RESULT=PASS_GEN1_W75_FINAL_STANDALONE_AK3' \
              "$OUTPUT/W75-FINAL-VERDICT.txt" 2>/dev/null
          then
            echo "ERROR: W75 final PASS verdict was not produced." >&2
            exit 1
          fi
