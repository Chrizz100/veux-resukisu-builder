      - name: Build deterministic staging ZIP twice
        shell: bash
        run: |
          set -euo pipefail

          python3 - \
            "$PACKAGE" \
            "$OUTPUT/build-A.zip" \
            "$OUTPUT/build-B.zip" <<'PY'
          import os
          import stat
          import sys
          import zipfile
          from pathlib import Path

          root = Path(sys.argv[1])
          outputs = [
              Path(sys.argv[2]),
              Path(sys.argv[3]),
          ]

          files = sorted(
              p for p in root.rglob("*")
              if p.is_file()
          )

          for output in outputs:
              with zipfile.ZipFile(
                  output,
                  "w",
                  compression=zipfile.ZIP_DEFLATED,
                  compresslevel=9,
                  strict_timestamps=True,
              ) as z:
                  for path in files:
                      relative = path.relative_to(root).as_posix()

                      info = zipfile.ZipInfo(
                          relative,
                          date_time=(2024, 1, 1, 0, 0, 0),
                      )

                      mode = stat.S_IMODE(
                          path.stat().st_mode
                      )

                      info.create_system = 3
                      info.external_attr = mode << 16
                      info.compress_type = zipfile.ZIP_DEFLATED

                      z.writestr(
                          info,
                          path.read_bytes(),
                          compress_type=zipfile.ZIP_DEFLATED,
                          compresslevel=9,
                      )
          PY

          A="$OUTPUT/build-A.zip"
          B="$OUTPUT/build-B.zip"

          A_SHA="$(sha256sum "$A" | awk '{print $1}')"
          B_SHA="$(sha256sum "$B" | awk '{print $1}')"

          test "$A_SHA" = "$B_SHA"
          cmp -s "$A" "$B"

          mv "$A" "$OUTPUT/$STAGING_NAME"
          rm -f "$B"

          {
            echo "DETERMINISTIC_STAGING_BUILD=PASS"
            echo "BUILD_A_SHA256=$A_SHA"
            echo "BUILD_B_SHA256=$B_SHA"
            echo "BYTE_IDENTICAL=YES"
            echo "ZIP_BYTES=$(stat -c '%s' "$OUTPUT/$STAGING_NAME")"
            echo "ZIP_SHA256=$(sha256sum "$OUTPUT/$STAGING_NAME" | awk '{print $1}')"
          } > "$OUTPUT/STAGING-ZIP-REPRODUCIBILITY.txt"

      - name: Independently audit final staging ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$OUTPUT/$STAGING_NAME"

          unzip -t "$ZIP" \
            > "$OUTPUT/STAGING-ZIP-CRC.txt"

          python3 - "$ZIP" "$OUTPUT" <<'PY'
          import hashlib
          import json
          import stat
          import sys
          import zipfile
          from pathlib import Path

          path = Path(sys.argv[1])
          output = Path(sys.argv[2])

          expected_image = (
              "e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96"
          )

          with zipfile.ZipFile(path) as z:
              names = z.namelist()

              if len(names) != 17:
                  raise SystemExit(
                      f"ERROR: expected 17 ZIP entries, found {len(names)}"
                  )

              if len(names) != len(set(names)):
                  raise SystemExit("ERROR: duplicate ZIP names")

              bad = z.testzip()

              if bad is not None:
                  raise SystemExit(
                      f"ERROR: CRC failure: {bad}"
                  )

              image = z.read("Image")

              if len(image) != 29839872:
                  raise SystemExit(
                      "ERROR: Image size mismatch"
                  )

              image_sha = hashlib.sha256(
                  image
              ).hexdigest()

              if image_sha != expected_image:
                  raise SystemExit(
                      "ERROR: Image SHA mismatch"
                  )

              required = {
                  "Image",
                  "LICENSE",
                  "META-INF/com/google/android/update-binary",
                  "META-INF/com/google/android/updater-script",
                  "PACKAGE-SHA256SUMS",
                  "STOCK-ROM-REFERENCE.json",
                  "VEUX-PACKAGE-MANIFEST.txt",
                  "WORKFLOW20_DO_NOT_FLASH",
                  "anykernel.sh",
                  "tools/ak3-core.sh",
                  "tools/busybox",
                  "tools/fec",
                  "tools/httools_static",
                  "tools/lptools_static",
                  "tools/magiskboot",
                  "tools/magiskpolicy",
                  "tools/snapshotupdater_static",
              }

              if set(names) != required:
                  raise SystemExit(
                      "ERROR: package entry set mismatch"
                  )

              forbidden = [
                  "vendor_boot.img",
                  "dtbo.img",
                  "vbmeta.img",
                  "dtb",
                  "dtb.img",
                  "veux.dtb",
              ]

              for forbidden_name in forbidden:
                  if forbidden_name in names:
                      raise SystemExit(
                          f"ERROR: forbidden payload: {forbidden_name}"
                      )

              anykernel = z.read(
                  "anykernel.sh"
              ).decode(
                  "utf-8",
                  "replace",
              )

              if "WORKFLOW20_DO_NOT_FLASH" not in anykernel:
                  raise SystemExit(
                      "ERROR: W20 guard absent"
                  )

              if "BLOCK=vendor_boot" in anykernel:
                  raise SystemExit(
                      "ERROR: vendor_boot write path found"
                  )

              if "erase_dtbo" in anykernel:
                  raise SystemExit(
                      "ERROR: dtbo erase path found"
                  )

              sums = z.read(
                  "PACKAGE-SHA256SUMS"
              ).decode().splitlines()

              if len(sums) != 16:
                  raise SystemExit(
                      "ERROR: package checksum count"
                  )

              checked = 0

              for line in sums:
                  digest, filename = line.split(
                      None,
                      1,
                  )

                  filename = filename.strip()

                  if filename.startswith("./"):
                      filename = filename[2:]

                  if filename not in names:
                      raise SystemExit(
                          f"ERROR: checksum target absent: {filename}"
                      )

                  actual = hashlib.sha256(
                      z.read(filename)
                  ).hexdigest()

                  if actual != digest:
                      raise SystemExit(
                          f"ERROR: checksum mismatch: {filename}"
                      )

                  checked += 1

              exec_targets = [
                  "anykernel.sh",
                  "META-INF/com/google/android/update-binary",
                  "tools/ak3-core.sh",
                  "tools/busybox",
                  "tools/fec",
                  "tools/httools_static",
                  "tools/lptools_static",
                  "tools/magiskboot",
                  "tools/magiskpolicy",
                  "tools/snapshotupdater_static",
              ]

              for name in exec_targets:
                  mode = (
                      z.getinfo(name).external_attr
                      >> 16
                  ) & 0o777

                  if mode & 0o111 == 0:
                      raise SystemExit(
                          f"ERROR: executable bit missing: {name}"
                      )

          report = f"""STAGING_ZIP_INDEPENDENT_AUDIT=PASS
          ZIP_ENTRIES=17
          ZIP_CRC=PASS
          PACKAGE_INTERNAL_HASHES={checked}/16
          IMAGE_BYTES=29839872
          IMAGE_SHA256={image_sha}
          DO_NOT_FLASH_GUARD=FOUND
          VENDOR_BOOT_PAYLOAD=NO
          DTBO_PAYLOAD=NO
          VBMETA_PAYLOAD=NO
          DTB_PAYLOAD=NO
          DTBO_ERASE_LOGIC=NO
          EXECUTABLE_BITS=PASS
          """

          cleaned = "\n".join(
              line.strip()
              for line in report.splitlines()
          ).strip() + "\n"

          (
              output
              / "STAGING-ZIP-INDEPENDENT-AUDIT.txt"
          ).write_text(
              cleaned,
              encoding="utf-8",
          )

          print(cleaned)
          PY

