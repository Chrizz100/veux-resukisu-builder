          That behavior is intentionally NOT copied here.

          The exact Stock HyperOS Workflow-18 vendor_boot and dtbo
          remain outside this package and unchanged.

          STAGING PACKAGE
          ---------------
          $STAGING_NAME

          Bytes:
          $(stat -c '%s' "$ZIP")

          SHA-256:
          $(sha256sum "$ZIP" | awk '{print $1}')

          Deterministic two-build comparison:
          BYTE_IDENTICAL=YES

          SAFETY
          ------
          WORKFLOW20_DO_NOT_FLASH is present.

          anykernel.sh aborts before split_boot while the marker exists.

          NO DEVICE OPERATION WAS PERFORMED.
          NOTHING WAS FLASHED.

          PASS here is a packaging/provenance audit.
          It does not establish device boot success.
          EOF

          grep -Fxq \
            'RESULT: PASS_CANONICAL_W17_W18_W19' \
            "$OUTPUT/WORKFLOW20-SUMMARY.txt"

      - name: Create final output checksums
        shell: bash
        run: |
          set -euo pipefail

          (
            cd "$OUTPUT"

            find . \
              -maxdepth 1 \
              -type f \
              ! -name SHA256SUMS \
              ! -name SHA256SUMS.verify.txt \
              -printf '%f\n' \
              | LC_ALL=C sort \
              | while IFS= read -r file; do
                  sha256sum "$file"
                done \
              > SHA256SUMS

            sha256sum -c SHA256SUMS \
              | tee SHA256SUMS.verify.txt
          )

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p "$OUTPUT"

          {
            echo "VEUX Workflow 20: FAILURE"
            echo "Finished: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "No device operation was performed."
            echo "Nothing was flashed."
          } > "$OUTPUT/FAILURE-SUMMARY.txt"

          find "$WORK" \
            -maxdepth 7 \
            -type f \
            -printf '%s %p\n' \
            > "$OUTPUT/FAILURE-FILE-TREE.txt" \
            2>/dev/null || true

      - name: Upload canonical Workflow 20 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veux-5.4.274-resukisu-susfs-2.2-workflow20-canonical-packaging-avb-audit-${{ github.run_number }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6
