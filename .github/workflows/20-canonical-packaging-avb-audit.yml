name: 20 - VEUX Canonical AnyKernel3 Packaging + AVB Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # Canonical upstream GitHub chain
  W17_ARTIFACT_NAME: "veux-5.4.274-resukisu-susfs-2.2-final-release-candidate-1"
  W18_ARTIFACT_NAME: "veux-os1.0.12.0-workflow18-stock-rom-audit-3"
  W19_ARTIFACT_NAME: "veux-5.4.274-workflow19-boot-v3-dryrun-repack-avb-audit-1"

  # Frozen kernel
  W17_IMAGE_BYTES: "29839872"
  W17_IMAGE_SHA256: "e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96"
  W17_DTB_SHA256: "42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37"
  W17_CONFIG_SHA256: "c9831aeadf65064bf6632973b2bd6f4da905da9707718bc75ded0bd228150ca6"
  W17_SOURCE_DIFF_SHA256: "afdbab86f738aead94a12f896eeb5b74008dcf1c4fe5dfec4682651491a3de1e"
  W17_CANDIDATE_TREE: "5d25b7e0124d7fb695f3f07b45928fcb5780d0e8"
  W17_RESUKISU_COMMIT: "faccf4c5edc7be37776216e7d43dd3dca0239331"

  # Exact stock-ROM identities from canonical W18
  STOCK_BOOT_SHA256: "ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5"
  STOCK_VENDOR_BOOT_SHA256: "583e1f4c0e09c2267cda88bd48a8b4f56cf5c5e034fbda7b25bd65aa86385425"
  STOCK_DTBO_SHA256: "e9f3bae2c5417ff297162f1e7d2652ee98b347488fdf091d61daa986fbfb7690"
  STOCK_VBMETA_SHA256: "62a5b1a94c2247c786e8148b9d9d0aea943b57b1034b3fd82d9cac9a85fcde97"
  STOCK_ROM_MD5: "cda1240a451dd4f75776878b52f0cea3"

  # Canonical W19
  W19_DRYRUN_SHA256: "2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e"
  W19_AVB_DIGEST: "8b6af8a52796027ece9afb816e2354e0a9548808226749400fe8de86e0fdf397"

  # Frozen upstream AnyKernel3
  AK3_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_COMMIT: "e4b1bb25ca2aabcfd57f694a5998d87130701b71"

  # Git object pins previously audited in Workflow 20
  AK3_CORE_BLOB: "d9692acdb3501a7ccb60576ecce435e7a30156dc"
  UPDATE_BINARY_BLOB: "8c7006e7e3f6ef10f8f4117b291d6df204ef285e"
  MAGISKBOOT_BLOB: "56207debdf74b28059672c9ae39cc51897c7ca02"

  # Exact file-byte baseline from the previously audited W20 staging package.
  EXPECT_ANYKERNEL_SH_SHA256: "bb40e5cae67ff4f621b46283b73672afcdb0716e7dfd9dcc988cf830a5ef8462"
  EXPECT_STOCK_REFERENCE_SHA256: "13c636357eb3244afcac4aff385882ddb709ddd7d1fce4ab764b3d5df2d2df22"
  EXPECT_PACKAGE_MANIFEST_SHA256: "83dec4cf372ce8b6cb9aa3691092b43b8c675b7a00cdc6102b1b4bcc60ca64ed"
  EXPECT_GUARD_SHA256: "3d595edb1fab0a0d02bc4507508ca5e95496f7aceb9319e770654de0f51cef7a"
  EXPECT_PACKAGE_SHA256SUMS_SHA256: "678f247c19cbd6f740f6ce99018b5aaec5b52b7e7c43b0c656fed5de0308089b"

jobs:
  audit:
    name: Canonical W17-W18-W19 packaging audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      WORK: ${{ github.workspace }}/workflow20
      INPUTS: ${{ github.workspace }}/workflow20/inputs
      W17: ${{ github.workspace }}/workflow20/inputs/w17
      W18: ${{ github.workspace }}/workflow20/inputs/w18
      W19: ${{ github.workspace }}/workflow20/inputs/w19
      AK3: ${{ github.workspace }}/workflow20/anykernel3
      PACKAGE: ${{ github.workspace }}/workflow20/package
      OUTPUT: ${{ github.workspace }}/workflow20/output
      STAGING_NAME: "DO_NOT_FLASH_VEUX_5.4.274_ReSukiSU_SUSFS_2.2_WORKFLOW20_STAGING.zip"

    steps:
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORK"
          mkdir -p \
            "$INPUTS" \
            "$W17" \
            "$W18" \
            "$W19" \
            "$PACKAGE" \
            "$OUTPUT"

          command -v curl
          command -v git
          command -v jq
          command -v unzip
          command -v python3
          command -v sha256sum

          {
            echo "VEUX Workflow 20 - Canonical Packaging Audit"
            echo "============================================"
            echo
            echo "NO DEVICE OPERATION"
            echo "NO FLASH"
            echo "NO boot.img CREATION"
            echo "NO vendor_boot MODIFICATION"
            echo "NO dtbo MODIFICATION"
            echo "NO vbmeta MODIFICATION"
            echo
            echo "Inputs:"
            echo "Workflow 17 exact final kernel"
            echo "Workflow 18 exact ROM audit"
            echo "Workflow 19 exact Boot-v3 dry-run audit"
          } > "$OUTPUT/SCOPE.txt"

      - name: Download exact Workflow 17 18 and 19 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ALL="$WORK/artifacts.ndjson"
          : > "$ALL"

          page=1

          while :; do
            page_json="$WORK/artifacts-page-${page}.json"

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}" \
              -o "$page_json"

            count="$(jq '.artifacts | length' "$page_json")"

            jq -c '.artifacts[]' "$page_json" >> "$ALL"

            if [ "$count" -lt 100 ]; then
              break
            fi

            page=$((page + 1))

            [ "$page" -le 20 ] || {
              echo "ERROR: artifact pagination safety limit"
              exit 1
            }
          done

          download_artifact() {
            local name="$1"
            local destination="$2"
            local metadata="$3"

            matches="$(
              jq -s \
                --arg NAME "$name" \
                '[.[] | select(.name == $NAME and .expired == false)] | sort_by(.created_at)' \
                "$ALL"
            )"

            count="$(jq 'length' <<< "$matches")"

            [ "$count" -ge 1 ] || {
              echo "ERROR: artifact not found: $name"
              exit 1
            }

            selected="$(jq '.[-1]' <<< "$matches")"
            url="$(jq -r '.archive_download_url' <<< "$selected")"

            jq . <<< "$selected" > "$metadata"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" \
              -o "$destination"

            unzip -t "$destination" \
              > "${destination}.ziptest.txt"
          }

          download_artifact \
            "$W17_ARTIFACT_NAME" \
            "$INPUTS/w17.zip" \
            "$OUTPUT/W17-ARTIFACT-METADATA.json"

          download_artifact \
            "$W18_ARTIFACT_NAME" \
            "$INPUTS/w18.zip" \
            "$OUTPUT/W18-ARTIFACT-METADATA.json"

          download_artifact \
            "$W19_ARTIFACT_NAME" \
            "$INPUTS/w19.zip" \
            "$OUTPUT/W19-ARTIFACT-METADATA.json"

          {
            echo "W17=$W17_ARTIFACT_NAME"
            echo "W17_DOWNLOAD_SHA256=$(sha256sum "$INPUTS/w17.zip" | awk '{print $1}')"
            echo
            echo "W18=$W18_ARTIFACT_NAME"
            echo "W18_DOWNLOAD_SHA256=$(sha256sum "$INPUTS/w18.zip" | awk '{print $1}')"
            echo
            echo "W19=$W19_ARTIFACT_NAME"
            echo "W19_DOWNLOAD_SHA256=$(sha256sum "$INPUTS/w19.zip" | awk '{print $1}')"
          } > "$OUTPUT/CANONICAL-INPUT-ARTIFACTS.txt"

      - name: Verify canonical Workflow 17
        shell: bash
        run: |
          set -euo pipefail

          unzip -q "$INPUTS/w17.zip" -d "$W17"

          (
            cd "$W17"
            sha256sum -c SHA256SUMS \
              > "$OUTPUT/W17-SHA256SUMS.verify.txt"
          )

          test "$(stat -c '%s' "$W17/Image")" = "$W17_IMAGE_BYTES"
          test "$(sha256sum "$W17/Image" | awk '{print $1}')" = "$W17_IMAGE_SHA256"
          test "$(sha256sum "$W17/veux.dtb" | awk '{print $1}')" = "$W17_DTB_SHA256"
          test "$(sha256sum "$W17/final.config" | awk '{print $1}')" = "$W17_CONFIG_SHA256"

          grep -Fxq 'RESULT: PASS' \
            "$W17/RELEASE-MANIFEST.txt"

          grep -Fq \
            "Candidate tree: $W17_CANDIDATE_TREE" \
            "$W17/RELEASE-MANIFEST.txt"

          grep -Fq \
            "ReSukiSU commit: $W17_RESUKISU_COMMIT" \
            "$W17/RELEASE-MANIFEST.txt"

          grep -Fq \
            "Warning-clean source diff SHA-256: $W17_SOURCE_DIFF_SHA256" \
            "$W17/RELEASE-MANIFEST.txt"

          {
            echo "WORKFLOW17_RELEASE_CANDIDATE=PASS"
            echo "IMAGE_BYTES=$W17_IMAGE_BYTES"
            echo "IMAGE_SHA256=$W17_IMAGE_SHA256"
            echo "DTB_SHA256=$W17_DTB_SHA256"
            echo "CONFIG_SHA256=$W17_CONFIG_SHA256"
            echo "SOURCE_DIFF_SHA256=$W17_SOURCE_DIFF_SHA256"
            echo "CANDIDATE_TREE=$W17_CANDIDATE_TREE"
            echo "RESUKISU_COMMIT=$W17_RESUKISU_COMMIT"
          } > "$OUTPUT/WORKFLOW17-RELEASE-CANDIDATE-CHECK.txt"

      - name: Verify canonical Workflow 18
        shell: bash
        run: |
          set -euo pipefail

          unzip -q "$INPUTS/w18.zip" -d "$W18"

          (
            cd "$W18"
            sha256sum -c SHA256SUMS \
              > "$OUTPUT/W18-SHA256SUMS.verify.txt"
          )

          grep -Fxq \
            'RESULT: PASS_READ_ONLY_REPRODUCED_FROM_FASTBOOT_ROM' \
            "$W18/audit/WORKFLOW18-SUMMARY.txt"

          test \
            "$(sha256sum "$W18/stock_images/stock_boot.img" | awk '{print $1}')" \
            = "$STOCK_BOOT_SHA256"

          test \
            "$(sha256sum "$W18/stock_images/stock_vendor_boot.img" | awk '{print $1}')" \
            = "$STOCK_VENDOR_BOOT_SHA256"

          test \
            "$(sha256sum "$W18/stock_images/stock_dtbo.img" | awk '{print $1}')" \
            = "$STOCK_DTBO_SHA256"

          test \
            "$(sha256sum "$W18/stock_images/stock_vbmeta.img" | awk '{print $1}')" \
            = "$STOCK_VBMETA_SHA256"

          jq -e \
            --arg MD5 "$STOCK_ROM_MD5" \
            --arg BOOT "$STOCK_BOOT_SHA256" \
            --arg VENDOR "$STOCK_VENDOR_BOOT_SHA256" \
            --arg DTBO "$STOCK_DTBO_SHA256" \
            --arg VBMETA "$STOCK_VBMETA_SHA256" \
            '
              .result == "PASS_READ_ONLY_REPRODUCED_FROM_FASTBOOT_ROM"
              and .source.md5 == $MD5
              and .boot.sha256 == $BOOT
              and .vendor_boot.sha256 == $VENDOR
              and .dtbo.sha256 == $DTBO
              and .vbmeta.sha256 == $VBMETA
              and .vbmeta.signature_verifies == true
              and .vbmeta.direct_hashes_verify == true
              and .vendor_boot.dtb_fdt_count == 3
              and .dtbo.entry_count == 16
            ' \
            "$W18/audit/STOCK-ROM-AUDIT.json" \
            > /dev/null

          {
            echo "WORKFLOW18_STOCK_ROM=PASS"
            echo "ROM_MD5=$STOCK_ROM_MD5"
            echo "BOOT_SHA256=$STOCK_BOOT_SHA256"
            echo "VENDOR_BOOT_SHA256=$STOCK_VENDOR_BOOT_SHA256"
            echo "DTBO_SHA256=$STOCK_DTBO_SHA256"
            echo "VBMETA_SHA256=$STOCK_VBMETA_SHA256"
            echo "SIGNED_TOP_LEVEL_VBMETA=PASS"
          } > "$OUTPUT/WORKFLOW18-STOCK-ROM-CHECK.txt"

      - name: Verify canonical Workflow 19
        shell: bash
        run: |
          set -euo pipefail

          unzip -q "$INPUTS/w19.zip" -d "$W19"

          (
            cd "$W19"
            sha256sum -c SHA256SUMS \
              > "$OUTPUT/W19-SHA256SUMS.verify.txt"
          )

          grep -Fxq \
            'RESULT: PASS_DRYRUN_REPRODUCED_FROM_W17_W18' \
            "$W19/WORKFLOW19-DRYRUN-REPACK-AUDIT.txt"

          test \
            "$(stat -c '%s' "$W19/DO_NOT_FLASH_workflow19_dryrun_boot.img")" \
            = "134217728"

          test \
            "$(sha256sum "$W19/DO_NOT_FLASH_workflow19_dryrun_boot.img" | awk '{print $1}')" \
            = "$W19_DRYRUN_SHA256"

          jq -e \
            --arg SHA "$W19_DRYRUN_SHA256" \
            --arg DIGEST "$W19_AVB_DIGEST" \
            --arg IMAGE "$W17_IMAGE_SHA256" \
            '
              .result == "PASS_DRYRUN_REPRODUCED_FROM_W17_W18"
              and .dryrun_boot.sha256 == $SHA
              and .w17_image.sha256 == $IMAGE
              and .embedded_boot_avb.dryrun_digest_hex == $DIGEST
              and .embedded_boot_avb.dryrun_digest_verifies == true
              and .reproduction.matches_previous_local_workflow19_sha256 == true
              and .reproduction.matches_previous_local_workflow19_avb_digest == true
              and .top_level_stock_vbmeta.stock_boot_descriptor_verifies_stock_boot == true
              and .top_level_stock_vbmeta.stock_boot_descriptor_verifies_dryrun_boot == false
              and .top_level_stock_vbmeta.expected_mismatch_for_modified_boot == true
              and .top_level_stock_vbmeta.vendor_boot_descriptor_verifies_stock_vendor_boot == true
              and .top_level_stock_vbmeta.dtbo_descriptor_verifies_stock_dtbo == true
              and .safety.flashed == false
              and .safety.vendor_boot_modified == false
              and .safety.dtbo_modified == false
              and .safety.top_level_vbmeta_modified == false
              and .safety.dtb_appended == false
            ' \
            "$W19/WORKFLOW19-STRUCTURE.json" \
            > /dev/null

          grep -Fq \
            "$W17_ARTIFACT_NAME" \
            "$W19/MANIFEST.txt"

          grep -Fq \
            "$W18_ARTIFACT_NAME" \
            "$W19/MANIFEST.txt"

          {
            echo "WORKFLOW19_CANONICAL_DRYRUN=PASS"
            echo "DRYRUN_SHA256=$W19_DRYRUN_SHA256"
            echo "EMBEDDED_AVB_DIGEST=$W19_AVB_DIGEST"
            echo "BYTE_IDENTICAL_TO_PRIOR_LOCAL_W19=YES"
            echo "TOP_LEVEL_STOCK_VBMETA_CUSTOM_BOOT_MISMATCH=EXPECTED"
          } > "$OUTPUT/WORKFLOW19-CANONICAL-CHECK.txt"

      - name: Freeze canonical provenance chain
        shell: bash
        run: |
          set -euo pipefail

          cat > "$OUTPUT/CANONICAL-CHAIN.txt" <<EOF
          VEUX CANONICAL RELEASE CHAIN
          ============================

          WORKFLOW 17
          Artifact:
          $W17_ARTIFACT_NAME

          Image SHA-256:
          $W17_IMAGE_SHA256

          Candidate tree:
          $W17_CANDIDATE_TREE

          ReSukiSU:
          $W17_RESUKISU_COMMIT

          RESULT:
          PASS


          WORKFLOW 18
          Artifact:
          $W18_ARTIFACT_NAME

          Exact ROM MD5:
          $STOCK_ROM_MD5

          boot:
          $STOCK_BOOT_SHA256

          vendor_boot:
          $STOCK_VENDOR_BOOT_SHA256

          dtbo:
          $STOCK_DTBO_SHA256

          vbmeta:
          $STOCK_VBMETA_SHA256

          RESULT:
          PASS_READ_ONLY_REPRODUCED_FROM_FASTBOOT_ROM


          WORKFLOW 19
          Artifact:
          $W19_ARTIFACT_NAME

          Dry-run boot SHA-256:
          $W19_DRYRUN_SHA256

          Regenerated embedded AVB digest:
          $W19_AVB_DIGEST

          RESULT:
          PASS_DRYRUN_REPRODUCED_FROM_W17_W18


          WORKFLOW 20 PURPOSE
          Reproduce the previously audited boot-only AnyKernel3 staging
          package from the now-canonical W17 -> W18 -> W19 chain.

          NO FLASH.
          EOF

      - name: Fetch and pin exact AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --quiet \
            --filter=blob:none \
            --no-checkout \
            "$AK3_REPO" \
            "$AK3"

          git -C "$AK3" fetch \
            --quiet \
            origin \
            "$AK3_COMMIT"

          git -C "$AK3" checkout \
            --quiet \
            --detach \
            "$AK3_COMMIT"

          test \
            "$(git -C "$AK3" rev-parse HEAD)" \
            = "$AK3_COMMIT"

          test \
            "$(git -C "$AK3" rev-parse HEAD:tools/ak3-core.sh)" \
            = "$AK3_CORE_BLOB"

          test \
            "$(git -C "$AK3" rev-parse HEAD:META-INF/com/google/android/update-binary)" \
            = "$UPDATE_BINARY_BLOB"

          test \
            "$(git -C "$AK3" rev-parse HEAD:tools/magiskboot)" \
            = "$MAGISKBOOT_BLOB"

          {
            echo "ANYKERNEL3_COMMIT=$AK3_COMMIT"
            echo "AK3_CORE_BLOB=$AK3_CORE_BLOB"
            echo "UPDATE_BINARY_BLOB=$UPDATE_BINARY_BLOB"
            echo "MAGISKBOOT_BLOB=$MAGISKBOOT_BLOB"
          } > "$OUTPUT/ANYKERNEL3-PIN.txt"

      - name: Verify AnyKernel3 boot-only contract
        shell: bash
        run: |
          set -euo pipefail

          CORE="$AK3/tools/ak3-core.sh"

          grep -Fq 'split_boot()' "$CORE"
          grep -Fq 'flash_boot()' "$CORE"

          grep -Fq \
            'magiskboot repack' \
            "$CORE"

          grep -Fq \
            'PATCH_VBMETA_FLAG' \
            "$CORE"

          grep -Fq \
            'NO_VBMETA_PARTITION_PATCH' \
            "$CORE"

          grep -Fq \
            'NO_MAGISK_CHECK' \
            "$CORE"

          {
            echo "ANYKERNEL3_CONTRACT_AUDIT=PASS"
            echo "split_boot=FOUND"
            echo "flash_boot=FOUND"
            echo "magiskboot_repack=FOUND"
            echo "PATCH_VBMETA_FLAG=SUPPORTED"
            echo "NO_VBMETA_PARTITION_PATCH=SUPPORTED"
            echo "NO_MAGISK_CHECK=SUPPORTED"
          } > "$OUTPUT/ANYKERNEL3-CONTRACT-AUDIT.txt"

      - name: Assemble exact previously-audited W20 package contents
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$PACKAGE/META-INF/com/google/android" \
            "$PACKAGE/tools"

          cp "$W17/Image" \
            "$PACKAGE/Image"

          cp "$AK3/LICENSE" \
            "$PACKAGE/LICENSE"

          cp "$AK3/META-INF/com/google/android/update-binary" \
            "$PACKAGE/META-INF/com/google/android/update-binary"

          cp "$AK3/META-INF/com/google/android/updater-script" \
            "$PACKAGE/META-INF/com/google/android/updater-script"

          for tool in \
            ak3-core.sh \
            busybox \
            fec \
            httools_static \
            lptools_static \
            magiskboot \
            magiskpolicy \
            snapshotupdater_static
          do
            cp "$AK3/tools/$tool" \
              "$PACKAGE/tools/$tool"
          done

          chmod 755 \
            "$PACKAGE/META-INF/com/google/android/update-binary" \
            "$PACKAGE/tools/ak3-core.sh" \
            "$PACKAGE/tools/busybox" \
            "$PACKAGE/tools/fec" \
            "$PACKAGE/tools/httools_static" \
            "$PACKAGE/tools/lptools_static" \
            "$PACKAGE/tools/magiskboot" \
            "$PACKAGE/tools/magiskpolicy" \
            "$PACKAGE/tools/snapshotupdater_static"

          cat > "$PACKAGE/anykernel.sh" <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## VEUX 5.4.274 ReSukiSU + SUSFS 2.2

          ### AnyKernel setup
          properties() { '
          kernel.string=VEUX 5.4.274 ReSukiSU SUSFS 2.2
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=veux
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=13
          supported.patchlevels=2024-12 - 2024-12
          supported.vendorpatchlevels=2024-12 - 2024-12
          '; } # end properties

          ### boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          SLOT_SELECT=active;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=0;

          # Defense-in-depth:
          # this package must not write top-level vbmeta.
          NO_VBMETA_PARTITION_PATCH=1;

          # ReSukiSU is already integrated in the approved kernel.
          # Do not let AnyKernel3 alter the approved Image for Magisk.
          NO_MAGISK_CHECK=1;

          # Import AnyKernel3 functions.
          . tools/ak3-core.sh;

          # Workflow 20 is intentionally disabled.
          if [ -f "$AKHOME/WORKFLOW20_DO_NOT_FLASH" ]; then
            abort \
              "Workflow 20 staging package only." \
              "DO NOT FLASH." \
              "Use the separately approved Workflow 21 final package.";
          fi;

          ui_print \
            " " \
            "VEUX 5.4.274 ReSukiSU + SUSFS 2.2" \
            "Kernel-only installer";

          # Dump/split active-slot boot without unpacking
          # or recompressing its ramdisk.
          split_boot;

          # Runtime compatibility barriers.
          BOOT_BYTES="$(
            wc -c < "$BOOTIMG" \
              | tr -d ' '
          )";

          [ "$BOOT_BYTES" = "134217728" ] || abort \
            "Unexpected boot partition size: $BOOT_BYTES" \
            "Expected 134217728 bytes. Aborting.";

          grep -Eq \
            'HEADER_VER[[:space:]]+\[3\]' \
            "$SPLITIMG/infotmp" || abort \
            "Expected Android boot header v3. Aborting.";

          grep -Eq \
            'PAGESIZE[[:space:]]+\[4096\]' \
            "$SPLITIMG/infotmp" || abort \
            "Expected boot page size 4096. Aborting.";

          grep -Eq \
            'OS_VERSION[[:space:]]+\[11\.0\.0\]' \
            "$SPLITIMG/infotmp" || abort \
            "Unexpected boot-header OS_VERSION. Aborting.";

          grep -Eq \
            'OS_PATCH_LEVEL[[:space:]]+\[2024-12\]' \
            "$SPLITIMG/infotmp" || abort \
            "Unexpected boot-header patch level. Aborting.";

          grep -Eq \
            'RAMDISK_FMT[[:space:]]+\[lz4_legacy\]' \
            "$SPLITIMG/infotmp" || abort \
            "Expected LZ4-legacy boot ramdisk. Aborting.";

          ui_print \
            "Boot-v3 compatibility checks passed.";

          # Kernel-only repack/write.
          # No ramdisk unpack/repack.
