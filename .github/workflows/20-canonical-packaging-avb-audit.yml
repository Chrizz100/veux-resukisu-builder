              and .vendor_boot.partition_sha256 == $VENDOR
              and .dtbo.partition_sha256 == $DTBO
              and .vbmeta.partition_sha256 == $VBMETA
              and .workflow19.dryrun_boot_sha256 == $DRY
              and .boot.header_version == 3
              and .boot.partition_bytes == 134217728
              and .boot.ramdisk_format == "lz4_legacy"
              and .vendor_boot.dtb_fdt_blob_count == 3
              and .dtbo.entry_count == 16
              and .vbmeta.signature_verified_against_embedded_public_key == true
            ' \
            "$PACKAGE/STOCK-ROM-REFERENCE.json" \
