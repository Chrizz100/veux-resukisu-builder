          set -euo pipefail

          AK="$PACKAGE/anykernel.sh"

          grep -Fq 'device.name1=veux' "$AK"
          grep -Fq 'supported.versions=13' "$AK"
          grep -Fq 'supported.patchlevels=2024-12 - 2024-12' "$AK"

          grep -Fq 'BLOCK=boot;' "$AK"
          grep -Fq 'IS_SLOT_DEVICE=1;' "$AK"
          grep -Fq 'SLOT_SELECT=active;' "$AK"

          grep -Fq 'PATCH_VBMETA_FLAG=0;' "$AK"
          grep -Fq 'NO_VBMETA_PARTITION_PATCH=1;' "$AK"
          grep -Fq 'NO_MAGISK_CHECK=1;' "$AK"

          grep -Fq 'WORKFLOW20_DO_NOT_FLASH' "$AK"
          grep -Fq 'split_boot;' "$AK"
          grep -Fq 'flash_boot;' "$AK"

          guard_line="$(
            grep -n -m1 'WORKFLOW20_DO_NOT_FLASH' "$AK" \
              | cut -d: -f1
          )"

          split_line="$(
            grep -n -m1 '^[[:space:]]*split_boot;' "$AK" \
              | cut -d: -f1
