          } | tee "$ARTIFACT_DIR/RESULT.txt"

      - name: Upload SPRD rotation disable full build probe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-SPRD-Rotation-Disable-Full-Build-Probe
