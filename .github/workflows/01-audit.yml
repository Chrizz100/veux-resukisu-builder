name: 01 - VEUX 5.4.274 Source Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout 5.4.274 kernel source
        uses: actions/checkout@v4
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: f60d08db833bc56f054420abe0c16e8ca60fb1a0
          path: kernel
          fetch-depth: 1

      - name: Verify kernel version
        run: |
          cd kernel
          echo "=== KERNEL VERSION ==="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =' Makefile | head -n 4

          VERSION=$(awk '/^VERSION =/{print $3}' Makefile)
          PATCHLEVEL=$(awk '/^PATCHLEVEL =/{print $3}' Makefile)
          SUBLEVEL=$(awk '/^SUBLEVEL =/{print $3}' Makefile)

          echo "Detected: ${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          test "$VERSION" = "5"
          test "$PATCHLEVEL" = "4"
          test "$SUBLEVEL" = "274"

      - name: Show expected compiler
        run: |
          cd kernel
          echo "=== BUILD CONFIG ==="
          grep -E '^(CC|LD|NM|OBJCOPY|CLANG_PREBUILT_BIN)=' build.config.common || true

      - name: Search device configs
        run: |
          cd kernel
          echo "=== POSSIBLE VEUX / QGKI CONFIGS ==="
          find arch/arm64/configs -maxdepth 2 -type f \
            \( -iname '*veux*' \
            -o -iname '*bengal*' \
            -o -iname '*qgki*' \
            -o -iname '*stock*' \) \
            -print | sort

      - name: Check old known veux config
        run: |
          echo "=== VEUX CONFIG FROM 20240619 ==="
          curl -fsSL \
            https://raw.githubusercontent.com/dereference23/kernel_xiaomi_sm6375/20240619/arch/arm64/configs/veux_defconfig \
            -o veux_defconfig_5.4.268

          wc -l veux_defconfig_5.4.268
          sha256sum veux_defconfig_5.4.268

      - name: Summary
        run: |
          echo "Audit completed."
          echo "No kernel was flashed or installed."
