name: 61 - KernelSU v0.9.5 + SUSFS 2.2.0 Legacy Modern Bridge Contract Audit v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w61-v1-v095-susfs220-legacy-modern-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: W61 v1 ${{ matrix.id }} bridge contract audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-5_4_274
            kernel_version: "5.4.274"
            kernel_ref: "20240619"
            merge_common: "yes"
            expected_embedded_ksu: "11872"
          - id: linux-5_4_302
            kernel_version: "5.4.302"
            kernel_ref: "f4b8a13a43a130a9aab83cc985ce4d4421291ae6"
            merge_common: "no"
            expected_embedded_ksu: "12142"

    env:
      KERNEL_REPOSITORY: dereference23/kernel_xiaomi_sm6375
      COMMON_REPOSITORY: https://android.googlesource.com/kernel/common
      COMMON_REF: android11-5.4.274_r00

      KSU_REPOSITORY: tiann/KernelSU
      KSU_V095_REF: b766b98513b5a7eb33bc1c4a76b5702bf1288f07
      KSU_V095_VERSION: "11872"

      # Reference only. This tree is NEVER transplanted into v0.9.5.
      KSU_MODERN_REFERENCE_REF: abc3fdcf5b6ec9e0add131e600d55853a0fffbf2

      # GitHub transport mirror of the exact simonpunk Git commit history.
      SUSFS_MIRROR_REPOSITORY: ShirkNeko/susfs4ksu
      SUSFS_MODERN_REF: be08face56c347e7ba9c4fb420c2463598a14f5d
      SUSFS_MODERN_VERSION: "2.2.0"
      SUSFS_LEGACY_REF: 76affd70abf61d77feb0a132f61365d6848505df
      SUSFS_LEGACY_VERSION: "1.5.5"

      ARTIFACT_DIR: ${{ github.workspace }}/w61-artifact

    steps:
      - name: Initialize W61 audit artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          {
            echo "W61_VERSION=v1"
            echo "LANE=${{ matrix.id }}"
            echo "KERNEL_VERSION=${{ matrix.kernel_version }}"
            echo "PURPOSE=TRUE_LEGACY_V095_TO_MODERN_SUSFS220_BRIDGE_CONTRACT"
            echo "W60_RAW_BRIDGE_COUNT_IS_NOT_TREATED_AS_AN_ABI=YES"
            echo "FULL_KERNEL_BUILD_PERFORMED=NO"
            echo "KERNEL_TREE_MODIFIED=NO"
            echo "KSU_TREE_MODIFIED=NO"
            echo "SUSFS_PATCH_APPLIED=NO"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } | tee "$ARTIFACT_DIR/W61-HEADER.txt"

      - name: Install audit dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            file \
            patch \
            python3

      - name: Checkout exact VEUX kernel lane
        uses: actions/checkout@v6
        with:
          repository: ${{ env.KERNEL_REPOSITORY }}
          ref: ${{ matrix.kernel_ref }}
          path: kernel
          fetch-depth: 0
          filter: blob:none

      - name: Reconstruct exact Linux 5.4 lane
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          initial_head="$(git rev-parse HEAD)"
          initial_version="$(make -s kernelversion)"

          if [ "${{ matrix.merge_common }}" = "yes" ]; then
            test "$initial_version" = "5.4.268"

            git config user.name "VEUX W61 Audit"
            git config user.email "veux-w61-audit@users.noreply.github.com"

            git remote remove android-common >/dev/null 2>&1 || true
            git remote add android-common "$COMMON_REPOSITORY"

            git fetch android-common \
              "refs/tags/${COMMON_REF}:refs/tags/${COMMON_REF}"

            git merge \
              --no-edit \
              --no-ff \
              "$COMMON_REF"

            test "$(make -s kernelversion)" = "5.4.274"
          else
            test "$initial_head" = "${{ matrix.kernel_ref }}"
            test "$initial_version" = "5.4.302"
          fi

          final_version="$(make -s kernelversion)"
          final_head="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"

          test "$final_version" = "${{ matrix.kernel_version }}"
          test -f security/selinux/include/objsec.h
          test -f security/selinux/include/security.h
          test -d drivers/kernelsu

          embedded_version="$(
            sed -nE \
              's/^[[:space:]]*ccflags-y[[:space:]]*\+=[[:space:]]*-DKSU_VERSION=([0-9]+).*/\1/p' \
              drivers/kernelsu/Makefile \
              | head -n1
          )"

          test "$embedded_version" = "${{ matrix.expected_embedded_ksu }}"

          {
            echo "INITIAL_HEAD=$initial_head"
            echo "INITIAL_VERSION=$initial_version"
            echo "FINAL_HEAD=$final_head"
            echo "FINAL_TREE=$final_tree"
            echo "FINAL_VERSION=$final_version"
            echo "EMBEDDED_KSU_VERSION=$embedded_version"
            echo "KERNEL_LANE_AUTHENTICATION=PASS"
          } | tee "$ARTIFACT_DIR/KERNEL-IDENTITY.txt"

      - name: Snapshot existing VEUX manual hook contract
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          grep -RhoE '\bksu_[A-Za-z0-9_]+' \
            fs kernel security drivers/input include \
            --exclude-dir=kernelsu \
            --exclude='*.o' \
            2>/dev/null \
            | LC_ALL=C sort -u \
            > "$ARTIFACT_DIR/baseline-external-ksu-symbols.txt" || true

          grep -RIlE '\bksu_[A-Za-z0-9_]+' \
            fs kernel security drivers/input include \
            --exclude-dir=kernelsu \
            --exclude='*.o' \
            2>/dev/null \
            | LC_ALL=C sort -u \
            > "$ARTIFACT_DIR/baseline-manual-hook-files.txt" || true

          symbol_count="$(
            wc -l < "$ARTIFACT_DIR/baseline-external-ksu-symbols.txt" \
              | tr -d ' '
          )"

          file_count="$(
            wc -l < "$ARTIFACT_DIR/baseline-manual-hook-files.txt" \
              | tr -d ' '
          )"

          test "$symbol_count" = "8"
          test "$file_count" = "5"

          while IFS= read -r file; do
            sha256sum "$file"
          done < "$ARTIFACT_DIR/baseline-manual-hook-files.txt" \
            > "$ARTIFACT_DIR/baseline-manual-hook-files.sha256"

          {
            echo "EXTERNAL_KSU_SYMBOL_COUNT=$symbol_count"
            echo "MANUAL_HOOK_FILE_COUNT=$file_count"
            echo "MANUAL_HOOK_CONTRACT=8_OF_8"
          } | tee "$ARTIFACT_DIR/MANUAL-HOOK-CONTRACT.txt"

      - name: Checkout immutable original KernelSU v0.9.5
        uses: actions/checkout@v6
        with:
          repository: ${{ env.KSU_REPOSITORY }}
          ref: ${{ env.KSU_V095_REF }}
          path: KernelSU-v095
          fetch-depth: 0

      - name: Checkout pinned modern KernelSU semantic reference
        uses: actions/checkout@v6
        with:
          repository: ${{ env.KSU_REPOSITORY }}
          ref: ${{ env.KSU_MODERN_REFERENCE_REF }}
          path: KernelSU-modern-reference
          fetch-depth: 1

      - name: Checkout exact modern SUSFS 2.2 reference
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SUSFS_MIRROR_REPOSITORY }}
          ref: ${{ env.SUSFS_MODERN_REF }}
          path: susfs-modern
          fetch-depth: 1

      - name: Checkout exact legacy SUSFS 5.4 reference
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SUSFS_MIRROR_REPOSITORY }}
          ref: ${{ env.SUSFS_LEGACY_REF }}
          path: susfs-legacy
          fetch-depth: 1

      - name: Authenticate KSU and SUSFS immutable identities
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C KernelSU-v095 rev-parse HEAD)" = "$KSU_V095_REF"
          test "$(git -C KernelSU-modern-reference rev-parse HEAD)" = \
            "$KSU_MODERN_REFERENCE_REF"
          test "$(git -C susfs-modern rev-parse HEAD)" = "$SUSFS_MODERN_REF"
          test "$(git -C susfs-legacy rev-parse HEAD)" = "$SUSFS_LEGACY_REF"

          v095_count="$(git -C KernelSU-v095 rev-list --count HEAD)"
          v095_version="$((10000 + v095_count + 200))"
          test "$v095_version" = "$KSU_V095_VERSION"

          grep -Fq "$SUSFS_MODERN_VERSION" \
            susfs-modern/ksu_module_susfs/module.prop

          grep -Fq "$SUSFS_LEGACY_VERSION" \
            susfs-legacy/ksu_module_susfs/module.prop

          modern_message="$(git -C susfs-modern log -1 --format=%s)"
          test "$modern_message" = \
            "kernel: OPEN_REDIRECT: Fix potential UAF bug"

          test -f \
            susfs-modern/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          test -f \
            susfs-legacy/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          test -f \
            susfs-modern/kernel_patches/fs/susfs.c
          test -f \
            susfs-legacy/kernel_patches/fs/susfs.c
          test -f \
            susfs-modern/kernel_patches/include/linux/susfs.h

          grep -Fq \
            'synchronize_srcu(&susfs_srcu_open_redirect)' \
            susfs-modern/kernel_patches/fs/susfs.c

          {
            echo "KSU_V095_HEAD=$KSU_V095_REF"
            echo "KSU_V095_VERSION=$v095_version"
            echo "KSU_MODERN_REFERENCE_HEAD=$KSU_MODERN_REFERENCE_REF"
            echo "SUSFS_MODERN_HEAD=$SUSFS_MODERN_REF"
            echo "SUSFS_MODERN_VERSION=$SUSFS_MODERN_VERSION"
            echo "SUSFS_MODERN_COMMIT_MESSAGE=$modern_message"
            echo "SUSFS_LEGACY_HEAD=$SUSFS_LEGACY_REF"
            echo "SUSFS_LEGACY_VERSION=$SUSFS_LEGACY_VERSION"
            echo "OPEN_REDIRECT_SRCU_FIX=PASS"
            echo "SOURCE_IDENTITY=PASS"
          } | tee "$ARTIFACT_DIR/SOURCE-IDENTITY.txt"

      - name: Derive true active SUSFS 2.2 core root-manager ABI
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          artifact = Path(os.environ["ARTIFACT_DIR"])

          source_path = root / "susfs-modern/kernel_patches/fs/susfs.c"
          source = source_path.read_text(encoding="utf-8")

          def strip_c_comments(text: str) -> str:
              out = []
              i = 0
              state = "normal"

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if state == "normal":
                      if c == "/" and n == "/":
                          out.extend("  ")
                          i += 2
                          state = "line_comment"
                          continue
                      if c == "/" and n == "*":
                          out.extend("  ")
                          i += 2
                          state = "block_comment"
                          continue
                      if c == '"':
                          out.append(c)
                          i += 1
                          state = "string"
                          continue
                      if c == "'":
                          out.append(c)
                          i += 1
                          state = "char"
                          continue
                      out.append(c)
                      i += 1
                      continue

                  if state == "line_comment":
                      if c == "\n":
                          out.append("\n")
                          state = "normal"
                      else:
                          out.append(" ")
                      i += 1
                      continue

                  if state == "block_comment":
                      if c == "*" and n == "/":
                          out.extend("  ")
                          i += 2
                          state = "normal"
                      else:
                          out.append("\n" if c == "\n" else " ")
                          i += 1
                      continue

                  if state in {"string", "char"}:
                      out.append(c)
                      if c == "\\" and i + 1 < len(text):
                          out.append(text[i + 1])
                          i += 2
                          continue
                      if state == "string" and c == '"':
                          state = "normal"
                      elif state == "char" and c == "'":
                          state = "normal"
                      i += 1
                      continue

              return "".join(out)

          active = strip_c_comments(source)

          extern_lines = []
          for stmt in re.findall(r"\bextern\b[^;]+;", active, flags=re.S):
              compact = " ".join(stmt.split())
              if (
                  "ksu_" in compact
                  or "susfs_is_current_ksu_domain" in compact
                  or "setup_selinux" in compact
              ):
                  extern_lines.append(compact)

          expected = {
              "extern bool susfs_is_current_ksu_domain(void);",
              "extern void setup_selinux(const char *domain, struct cred *cred);",
              "extern struct cred *ksu_cred;",
          }

          if set(extern_lines) != expected:
              raise SystemExit(
                  "Unexpected active SUSFS 2.2 root-manager extern set:\n"
                  + "\n".join(sorted(extern_lines))
              )

          # Remove extern declarations before counting active usages.
          body = re.sub(r"\bextern\b[^;]+;", " ", active, flags=re.S)

          def ident_count(name: str) -> int:
              return len(re.findall(rf"\b{re.escape(name)}\b", body))

          counts = {
              "ksu_cred": ident_count("ksu_cred"),
              "susfs_is_current_ksu_domain": ident_count(
                  "susfs_is_current_ksu_domain"
              ),
              "setup_selinux": ident_count("setup_selinux"),
              "ksu_handle_setresuid": ident_count("ksu_handle_setresuid"),
              "ksu_susfs": ident_count("ksu_susfs"),
          }

          if counts["ksu_cred"] < 2:
              raise SystemExit("ksu_cred is not an active modern SUSFS dependency")
          if counts["susfs_is_current_ksu_domain"] < 1:
              raise SystemExit(
                  "susfs_is_current_ksu_domain active usage not found"
              )
          if counts["setup_selinux"] < 1:
              raise SystemExit("setup_selinux active usage not found")

          # W60 false positives: these occur in comments/text, not the active
          # body of fs/susfs.c.
          if counts["ksu_handle_setresuid"] != 0:
              raise SystemExit(
                  "ksu_handle_setresuid unexpectedly active inside susfs.c"
              )
          if counts["ksu_susfs"] != 0:
              raise SystemExit("ksu_susfs unexpectedly active inside susfs.c")

          if not re.search(
              r'setup_selinux\s*\(\s*"u:r:ksu:s0"\s*,\s*cred\s*\)',
              body,
          ):
              raise SystemExit(
                  "Expected modern SUSFS hard-coded ksu SELinux context call not found"
              )

          result = {
              "active_direct_root_manager_extern_count": 3,
              "active_direct_root_manager_externs": sorted(expected),
              "active_usage_counts": counts,
              "w60_false_positive_corrections": {
                  "ksu_handle_setresuid_in_susfs_c": "COMMENT_ONLY",
                  "ksu_susfs_in_susfs_c": "NOT_ACTIVE_CODE",
              },
              "modern_susfs_hardcoded_selinux_context": "u:r:ksu:s0",
          }

          (artifact / "true-modern-susfs-core-abi.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          (artifact / "true-modern-susfs-core-externs.txt").write_text(
              "\n".join(sorted(expected)) + "\n",
              encoding="utf-8",
          )

          (artifact / "w60-false-positive-corrections.txt").write_text(
              "\n".join([
                  "W60_REQUIRED_BRIDGE_COUNT_37_OR_39_IS_NOT_A_TRUE_ABI=YES",
                  "ksu_handle_setresuid_in_modern_susfs_c=COMMENT_ONLY",
                  "ksu_susfs_in_modern_susfs_c=NOT_ACTIVE_CODE",
                  "ksu_root_from_W43_recipe=WORKFLOW_VARIABLE_NOT_KERNEL_ABI",
                  "ksu_text_from_W43_recipe=WORKFLOW_VARIABLE_NOT_KERNEL_ABI",
                  "TRUE_DIRECT_MODERN_SUSFS_CORE_ROOT_MANAGER_EXTERN_COUNT=3",
              ]) + "\n",
              encoding="utf-8",
          )

          print("TRUE_DIRECT_MODERN_SUSFS_CORE_ROOT_MANAGER_EXTERN_COUNT=3")
          print("W60_FALSE_POSITIVE_CORRECTION=PASS")
          PY

      - name: Compare legacy 5.4 and modern 2.2 KernelSU integration patches
        shell: bash
        run: |
          set -euo pipefail

          LEGACY_PATCH="$GITHUB_WORKSPACE/susfs-legacy/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          MODERN_PATCH="$GITHUB_WORKSPACE/susfs-modern/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          KSU="$GITHUB_WORKSPACE/KernelSU-v095"

          set +e
          git -C "$KSU" apply \
            --check \
            --verbose \
            "$LEGACY_PATCH" \
            > "$ARTIFACT_DIR/legacy-kernel-5_4-ksu-v095-apply-check.log" \
            2>&1
          legacy_rc=$?

          git -C "$KSU" apply \
            --check \
            --verbose \
            "$MODERN_PATCH" \
            > "$ARTIFACT_DIR/modern-2_2-ksu-v095-apply-check.log" \
            2>&1
          modern_rc=$?
          set -e

          {
            echo "LEGACY_5_4_KSU_PATCH_V095_APPLY_CHECK_RC=$legacy_rc"
            echo "LEGACY_5_4_KSU_PATCH_RAW_APPLIES=$(
              [ "$legacy_rc" = "0" ] && echo YES || echo NO
            )"
            echo "MODERN_2_2_KSU_PATCH_V095_APPLY_CHECK_RC=$modern_rc"
            echo "MODERN_2_2_KSU_PATCH_RAW_APPLIES=$(
              [ "$modern_rc" = "0" ] && echo YES || echo NO
            )"
          } | tee "$ARTIFACT_DIR/KSU-PATCH-APPLICABILITY.txt"

          python3 - "$LEGACY_PATCH" "$MODERN_PATCH" "$KSU" "$ARTIFACT_DIR" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          legacy = Path(sys.argv[1])
          modern = Path(sys.argv[2])
          ksu = Path(sys.argv[3])
          artifact = Path(sys.argv[4])

          def segments(path):
              text = path.read_text(encoding="utf-8", errors="replace")
              matches = list(
                  re.finditer(
                      r"^diff --git a/(.+?) b/(.+?)$",
                      text,
                      flags=re.M,
                  )
              )

              out = {}
              for i, m in enumerate(matches):
                  a, b = m.groups()
                  if a != b:
                      raise SystemExit(f"unexpected rename: {a} -> {b}")
                  end = (
                      matches[i + 1].start()
                      if i + 1 < len(matches)
                      else len(text)
                  )
                  out[a] = text[m.start():end]
              return out

          legacy_seg = segments(legacy)
          modern_seg = segments(modern)

          legacy_targets = sorted(legacy_seg)
          modern_targets = sorted(modern_seg)

          legacy_missing = [
              p for p in legacy_targets if not (ksu / p).exists()
          ]
          modern_missing = [
              p for p in modern_targets if not (ksu / p).exists()
          ]

          # Locate the two control-plane implementations by actual command
          # dispatch hunks, not by guessed file names.
          legacy_cmd_files = sorted(
              p for p, seg in legacy_seg.items()
              if "CMD_SUSFS_" in seg
          )
          modern_cmd_files = sorted(
              p for p, seg in modern_seg.items()
              if "CMD_SUSFS_" in seg
          )

          modern_behavior = {
              "susfs_init": sorted(
                  p for p, seg in modern_seg.items()
                  if "susfs_init()" in seg
              ),
              "setresuid_extra_work": sorted(
                  p for p, seg in modern_seg.items()
                  if (
                      "susfs_extra_works" in seg
                      and "ksu_handle_setresuid" in seg
                  )
              ),
              "sid_cache": sorted(
                  p for p, seg in modern_seg.items()
                  if (
                      "susfs_set_batch_sid" in seg
                      or "susfs_zygote_sid" in seg
                  )
              ),
              "root_manager_command_dispatch": modern_cmd_files,
          }

          legacy_behavior = {
              "root_manager_command_dispatch": legacy_cmd_files,
              "sid_helpers": sorted(
                  p for p, seg in legacy_seg.items()
                  if "susfs_is_current_ksu_domain" in seg
              ),
          }

          if "kernel/core_hook.c" not in legacy_cmd_files:
              raise SystemExit(
                  "Legacy v0.9.5 SUSFS command dispatch did not resolve to core_hook.c"
              )

          if "kernel/supercall/dispatch.c" not in modern_cmd_files:
              raise SystemExit(
                  "Modern SUSFS command dispatch did not resolve to supercall/dispatch.c"
              )

          if len(modern_targets) != 29:
              raise SystemExit(
                  f"modern patch target count drifted: {len(modern_targets)}"
              )

          if len(modern_missing) != 24:
              raise SystemExit(
                  f"modern v0.9.5 missing target count drifted: {len(modern_missing)}"
              )

          result = {
              "legacy_target_count": len(legacy_targets),
              "legacy_targets_missing_in_v095": legacy_missing,
              "modern_target_count": len(modern_targets),
              "modern_targets_missing_in_v095": modern_missing,
              "legacy_control_plane_files": legacy_cmd_files,
              "modern_control_plane_files": modern_cmd_files,
              "legacy_behavior": legacy_behavior,
              "modern_behavior": modern_behavior,
          }

          (artifact / "legacy-modern-ksu-patch-structure.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          for name, values in (
              ("legacy-ksu-patch-targets.txt", legacy_targets),
              ("legacy-ksu-patch-targets-missing-in-v095.txt", legacy_missing),
              ("modern-ksu-patch-targets.txt", modern_targets),
              ("modern-ksu-patch-targets-missing-in-v095.txt", modern_missing),
              ("legacy-susfs-command-dispatch-files.txt", legacy_cmd_files),
              ("modern-susfs-command-dispatch-files.txt", modern_cmd_files),
          ):
              (artifact / name).write_text(
                  "\n".join(values) + ("\n" if values else ""),
                  encoding="utf-8",
              )

          print(f"LEGACY_KSU_PATCH_TARGET_COUNT={len(legacy_targets)}")
          print(f"LEGACY_KSU_PATCH_MISSING_IN_V095={len(legacy_missing)}")
          print(f"MODERN_KSU_PATCH_TARGET_COUNT={len(modern_targets)}")
          print(f"MODERN_KSU_PATCH_MISSING_IN_V095={len(modern_missing)}")
          print("CONTROL_PLANE_COMPARISON=PASS")
          PY

      - name: Audit legacy v0.9.5 and modern 2.2 control planes
        shell: bash
        run: |
          set -euo pipefail

          LEGACY_PATCH="$GITHUB_WORKSPACE/susfs-legacy/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          MODERN_PATCH="$GITHUB_WORKSPACE/susfs-modern/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          python3 - "$LEGACY_PATCH" "$MODERN_PATCH" "$ARTIFACT_DIR" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          legacy = Path(sys.argv[1]).read_text(
              encoding="utf-8", errors="replace"
          )
          modern = Path(sys.argv[2]).read_text(
              encoding="utf-8", errors="replace"
          )
          artifact = Path(sys.argv[3])

          legacy_facts = {
              "adds_cmd_susfs_dispatch": "CMD_SUSFS_" in legacy,
              "uses_core_hook_prctl_path": (
                  "diff --git a/kernel/core_hook.c" in legacy
                  and "CMD_SUSFS_" in legacy
              ),
              "adds_susfs_current_ksu_domain_helper": (
                  "susfs_is_current_ksu_domain" in legacy
              ),
              "adds_susfs_sid_cache": (
                  "susfs_ksu_sid" in legacy
                  and "susfs_zygote_sid" in legacy
              ),
              "references_ksu_cred": bool(
