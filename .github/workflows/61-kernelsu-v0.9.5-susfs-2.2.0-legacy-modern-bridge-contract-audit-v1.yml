            echo "SHA256=$(sha256sum "$MODERN_BIN" | awk '{print $1}')"
            file "$MODERN_BIN"
            echo
            echo "DYNAMIC_SYMBOL_HINTS:"
            aarch64-linux-gnu-readelf -Ws "$MODERN_BIN" 2>/dev/null \
              | grep -Ei 'prctl|syscall|ioctl' || true
            echo
            echo "STRING_PROTOCOL_HINTS:"
            strings -a "$MODERN_BIN" \
              | grep -Ei \
                'prctl|supercall|SUSFS|FAFAFAFA|add_sus|show_version|hide_sus' \
              | head -n 200 || true
          } > "$ARTIFACT_DIR/modern-ksu_susfs-binary-protocol-hints.txt"

          if [ -f "$LEGACY_BIN" ]; then
            {
              echo "=== LEGACY ==="
              echo "PATH=$LEGACY_BIN"
              echo "SHA256=$(sha256sum "$LEGACY_BIN" | awk '{print $1}')"
              file "$LEGACY_BIN"
              echo
              echo "DYNAMIC_SYMBOL_HINTS:"
              aarch64-linux-gnu-readelf -Ws "$LEGACY_BIN" 2>/dev/null \
                | grep -Ei 'prctl|syscall|ioctl' || true
              echo
              echo "STRING_PROTOCOL_HINTS:"
              strings -a "$LEGACY_BIN" \
                | grep -Ei \
                  'prctl|supercall|SUSFS|FAFAFAFA|add_sus|show_version|hide_sus' \
                | head -n 200 || true
            } > "$ARTIFACT_DIR/legacy-ksu_susfs-binary-protocol-hints.txt"

            modern_sha="$(sha256sum "$MODERN_BIN" | awk '{print $1}')"
            legacy_sha="$(sha256sum "$LEGACY_BIN" | awk '{print $1}')"

            {
              echo "MODERN_BINARY_SHA256=$modern_sha"
              echo "LEGACY_BINARY_SHA256=$legacy_sha"
              echo "BINARY_BYTE_IDENTICAL=$(
                [ "$modern_sha" = "$legacy_sha" ] && echo YES || echo NO
              )"
            } | tee "$ARTIFACT_DIR/ksu_susfs-binary-comparison.txt"
          else
            echo "LEGACY_BINARY_PRESENT=NO" \
              | tee "$ARTIFACT_DIR/ksu_susfs-binary-comparison.txt"
          fi

          # Binary strings are evidence only. They are not treated as proof of
          # syscall ABI compatibility.
          echo "BINARY_PROTOCOL_CLASSIFICATION=INFORMATIONAL_NOT_PROOF" \
            >> "$ARTIFACT_DIR/ksu_susfs-binary-comparison.txt"

      - name: Audit exact v0.9.5 credential and SELinux semantics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          artifact = Path(os.environ["ARTIFACT_DIR"])

          v095 = root / "KernelSU-v095/kernel"
          modern_ref = root / "KernelSU-modern-reference/kernel"

          v095_selinux_c = (
              v095 / "selinux/selinux.c"
          ).read_text(encoding="utf-8")
          v095_selinux_h = (
              v095 / "selinux/selinux.h"
          ).read_text(encoding="utf-8")
          v095_ksu_c = (
              v095 / "ksu.c"
          ).read_text(encoding="utf-8")
          v095_ksud_c = (
              v095 / "ksud.c"
          ).read_text(encoding="utf-8")

          modern_init_c = (
              modern_ref / "core/init.c"
          ).read_text(encoding="utf-8")
          modern_selinux_c = (
              modern_ref / "selinux/selinux.c"
          ).read_text(encoding="utf-8")

          facts = {
              "v095": {
                  "domain": None,
                  "setup_selinux_one_arg": False,
                  "is_ksu_domain_exists": False,
                  "ksu_cred_global_exists": False,
                  "post_fs_data_hook_exists": False,
                  "second_stage_applies_kernelsu_rules": False,
              },
              "modern_reference": {
                  "ksu_cred_global_exists": False,
                  "prepare_creds_for_ksu_cred": False,
                  "setup_selinux_two_arg": False,
                  "setup_ksu_cred_exists": False,
              },
          }

          m = re.search(
              r'#define\s+KERNEL_SU_DOMAIN\s+"([^"]+)"',
              v095_selinux_c,
          )
          if not m:
              raise SystemExit("v0.9.5 KERNEL_SU_DOMAIN not found")
          facts["v095"]["domain"] = m.group(1)

          facts["v095"]["setup_selinux_one_arg"] = bool(
              re.search(
                  r'void\s+setup_selinux\s*\(\s*const\s+char\s*\*\s*\)',
                  v095_selinux_h,
              )
          )
          facts["v095"]["is_ksu_domain_exists"] = bool(
              re.search(r'\bbool\s+is_ksu_domain\s*\(', v095_selinux_c)
          )

          all_v095 = "\n".join(
              p.read_text(encoding="utf-8", errors="replace")
              for p in v095.rglob("*")
              if p.is_file() and p.suffix in {".c", ".h"}
          )

          facts["v095"]["ksu_cred_global_exists"] = bool(
              re.search(r'\bstruct\s+cred\s*\*\s*ksu_cred\b', all_v095)
          )
          facts["v095"]["post_fs_data_hook_exists"] = bool(
              re.search(r'\bvoid\s+on_post_fs_data\s*\(', v095_ksud_c)
          )
          facts["v095"]["second_stage_applies_kernelsu_rules"] = (
              "apply_kernelsu_rules();" in v095_ksud_c
          )

          facts["modern_reference"]["ksu_cred_global_exists"] = bool(
              re.search(
                  r'\bstruct\s+cred\s*\*\s*ksu_cred\s*;',
                  modern_init_c,
              )
          )
          facts["modern_reference"]["prepare_creds_for_ksu_cred"] = (
              "ksu_cred = prepare_creds();" in modern_init_c
          )
          facts["modern_reference"]["setup_selinux_two_arg"] = bool(
              re.search(
                  r'void\s+setup_selinux\s*\(\s*const\s+char\s*\*\s*domain\s*,'
                  r'\s*struct\s+cred\s*\*\s*cred\s*\)',
                  modern_selinux_c,
              )
          )
          facts["modern_reference"]["setup_ksu_cred_exists"] = (
              "setup_ksu_cred" in modern_selinux_c
          )

          if facts["v095"]["domain"] != "u:r:su:s0":
              raise SystemExit(
                  f"unexpected v0.9.5 KSU domain: {facts['v095']['domain']}"
              )

          required_true = [
              facts["v095"]["setup_selinux_one_arg"],
              facts["v095"]["is_ksu_domain_exists"],
              facts["v095"]["post_fs_data_hook_exists"],
              facts["v095"]["second_stage_applies_kernelsu_rules"],
              facts["modern_reference"]["ksu_cred_global_exists"],
              facts["modern_reference"]["prepare_creds_for_ksu_cred"],
              facts["modern_reference"]["setup_selinux_two_arg"],
              facts["modern_reference"]["setup_ksu_cred_exists"],
          ]
          if not all(required_true):
              raise SystemExit("KSU credential/SELinux semantic facts drifted")

          if facts["v095"]["ksu_cred_global_exists"]:
              raise SystemExit("v0.9.5 unexpectedly already has ksu_cred")

          result = {
              **facts,
              "modern_susfs_domain": "u:r:ksu:s0",
              "domain_semantic_mismatch": True,
              "setup_selinux_signature_mismatch": True,
              "persistent_ksu_cred_missing_in_v095": True,
              "modern_reference_is_semantics_only_not_transplant_source": True,
          }

          (artifact / "v095-modern-credential-selinux-semantics.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("V095_KSU_DOMAIN=u:r:su:s0")
          print("MODERN_SUSFS_EXPECTED_DOMAIN=u:r:ksu:s0")
          print("DOMAIN_SEMANTIC_MISMATCH=YES")
          print("SETUP_SELINUX_SIGNATURE_MISMATCH=YES")
          print("V095_KSU_CRED_GLOBAL_PRESENT=NO")
          print("CREDENTIAL_SELINUX_AUDIT=PASS")
          PY

      - name: Audit modern SUSFS behavioral integration contracts
        shell: bash
        run: |
          set -euo pipefail

          MODERN_PATCH="$GITHUB_WORKSPACE/susfs-modern/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          python3 - "$MODERN_PATCH" "$ARTIFACT_DIR" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          patch = Path(sys.argv[1]).read_text(
              encoding="utf-8", errors="replace"
          )
          artifact = Path(sys.argv[2])

          def segments(text):
              matches = list(
                  re.finditer(
                      r"^diff --git a/(.+?) b/(.+?)$",
                      text,
                      flags=re.M,
                  )
              )
              out = {}
              for i, m in enumerate(matches):
                  a, b = m.groups()
                  if a != b:
                      raise SystemExit("unexpected rename")
                  end = (
                      matches[i + 1].start()
                      if i + 1 < len(matches)
                      else len(text)
                  )
                  out[a] = text[m.start():end]
              return out

          seg = segments(patch)

          contracts = {
              "susfs_init": {
                  "files": sorted(
                      p for p, s in seg.items()
                      if "susfs_init();" in s
                  ),
                  "required": True,
              },
              "zygote_setresuid_mark_and_extra_work": {
                  "files": sorted(
                      p for p, s in seg.items()
                      if (
                          "ksu_handle_setresuid" in s
                          and "susfs_extra_works" in s
                          and "susfs_set_current_proc_umounted" in s
                      )
                  ),
                  "required": True,
              },
              "sid_cache_after_policy": {
                  "files": sorted(
                      p for p, s in seg.items()
                      if "susfs_set_batch_sid();" in s
                  ),
                  "required": True,
              },
              "susfs_domain_helpers": {
                  "files": sorted(
                      p for p, s in seg.items()
                      if (
                          "susfs_is_current_ksu_domain" in s
                          and "susfs_zygote_sid" in s
                      )
                  ),
                  "required": True,
              },
              "userspace_command_dispatch": {
                  "files": sorted(
                      p for p, s in seg.items()
                      if "CMD_SUSFS_" in s
                  ),
                  "required": True,
              },
          }

          for name, data in contracts.items():
              if data["required"] and not data["files"]:
                  raise SystemExit(
                      f"modern SUSFS behavioral contract not located: {name}"
                  )

          # Important correction to W60:
          # ksu_handle_setresuid is not a direct susfs.c extern, but it is a
          # genuine behavioral integration hook in the modern KSU patch.
          result = {
              "contracts": contracts,
              "w60_correction": {
                  "ksu_handle_setresuid": (
                      "NOT_DIRECT_SUSFS_C_ABI_BUT_REAL_BEHAVIORAL_INTEGRATION"
                  ),
                  "ksu_susfs": "COMMENT_OR_TOOL_NAME_NOT_KERNEL_ABI",
              },
          }

          (artifact / "modern-susfs220-behavioral-contracts.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(
              "KSU_HANDLE_SETRESUID_CLASS="
              "BEHAVIORAL_INTEGRATION_NOT_DIRECT_CORE_ABI"
          )
          print("MODERN_BEHAVIORAL_CONTRACT_AUDIT=PASS")
          PY

