          MODERN_BIN="$GITHUB_WORKSPACE/susfs-modern/ksu_module_susfs/tools/ksu_susfs_arm64"
          LEGACY_BIN="$GITHUB_WORKSPACE/susfs-legacy/ksu_module_susfs/tools/ksu_susfs_arm64"

          test -f "$MODERN_BIN"

          {
            echo "=== MODERN ==="
