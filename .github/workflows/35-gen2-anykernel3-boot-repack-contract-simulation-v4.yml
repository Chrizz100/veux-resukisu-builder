name: 35 - GEN2 AnyKernel3 Boot Repack Contract Simulation v4

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gen2-35-v4-ak3-repack-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: GEN2 35 v4 AK3 boot repack contract simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      W33_ARTIFACT_PREFIX: GEN2_33_V7_FINAL_FULL_IMAGE_DTB_DTBO_BUILD_AUDIT-
      W34_ARTIFACT_PREFIX: GEN2_34_V3_LINEAGE_AOSP_COMPATIBILITY_AUDIT-

      W33_IMAGE_SHA256: 98e608f7c30540b6cb5a1731b0edecd9a3b4960ebf388763452685858916037f
      W33_VEUX_DTB_SHA256: 28a174d174cda7619bf674b29fa4e91625a6ad02f6ca4815ac7a943137b3df8c
      W33_VEUX_DTBO_SHA256: 486ec73935e9805722df531cc3ddd5460f971c1edeec813fd25bef63500c0ca3
      W33_CONFIG_SHA256: 2931b6b74bf34a85f2a71cb4b76d1a3277a5538514411dd1047c841d46e92cbb

      LINEAGE_VEUX_REPO: https://github.com/xiaomi-sm6375-devs/android_device_xiaomi_veux.git
      LINEAGE_COMMON_REPO: https://github.com/xiaomi-sm6375-devs/android_device_xiaomi_sm6375-common.git
      LINEAGE_BUILD_REPO: https://github.com/LineageOS/android_build.git
      LINEAGE_VEUX_PIN: 423b9b6e00301e181a85d886b3c67c47c48d096e
      LINEAGE_COMMON_PIN: 4cd108d5cd933e5cdaf1293bee233621e8008ac8
      LINEAGE_BUILD_PIN: 5a841be38fec92de9a8a408cf5812ca748ccc02e

      AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
      AK3_PIN: af770f7b16cf8f8eb7c68614b2a693b3b361c90c

      BOOT_PARTITION_SIZE: 134217728

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6

      - name: Initialize W35 v4 workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf w35v4
          mkdir -p \
            w35v4/evidence \
            w35v4/w33 \
            w35v4/w34 \
            w35v4/lineage \
            w35v4/ak3 \
            w35v4/sim

          {
            echo "AUDIT=GEN2_35_V4_ANYKERNEL3_BOOT_REPACK_CONTRACT_SIMULATION"
            echo "DATE_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "REPOSITORY=$GITHUB_REPOSITORY"
            echo "PARENT=W35_V3"
            echo "V4_HARDENING=FULL_ARTIFACT_PAGINATION_AND_FILENAME_VERSION_ALIGNMENT"
            echo "REAL_BOOT_IMAGE_USED=NO"
            echo "REAL_DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
            echo "ANYKERNEL_FLASHABLE_ZIP_CREATED=NO"
          } | tee w35v4/evidence/audit-header.txt

      - name: Download W33 v7 and W34 v3 artifacts with full pagination
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          VERSION="X-GitHub-Api-Version: 2022-11-28"

          ALL='w35v4/evidence/artifacts.ndjson'
          : > "$ALL"

          page=1
          while :; do
            page_json="w35v4/evidence/artifacts-page-${page}.json"

            curl -fsSL \
              -H "$AUTH" \
              -H "$ACCEPT" \
              -H "$VERSION" \
              "$API/actions/artifacts?per_page=100&page=${page}" \
              -o "$page_json"

            count="$(jq '.artifacts | length' "$page_json")"
            jq -c '.artifacts[]' "$page_json" >> "$ALL"

            if [ "$count" -lt 100 ]; then
              break
            fi

            page=$((page + 1))
            if [ "$page" -gt 100 ]; then
              echo "ERROR: artifact pagination safety limit reached"
              exit 1
            fi
          done

          jq -s '{artifacts: .}' "$ALL" > w35v4/evidence/artifacts.json

          fetch_artifact() {
            local prefix="$1"
            local outzip="$2"
            local outdir="$3"
            local label="$4"

            local id name
            id="$(
              jq -r --arg prefix "$prefix" '
                [
                  .artifacts[]
                  | select(
                      (.expired == false)
                      and
                      (.name | startswith($prefix))
                    )
                ]
                | sort_by(.created_at)
                | reverse
                | .[0].id // empty
              ' w35v4/evidence/artifacts.json
            )"

            test -n "$id"

            name="$(
              jq -r --argjson id "$id" '
                .artifacts[]
                | select(.id == $id)
                | .name
              ' w35v4/evidence/artifacts.json
            )"

            test -n "$name"

            curl -fLsS \
              -H "$AUTH" \
              -H "$ACCEPT" \
              -H "$VERSION" \
              "$API/actions/artifacts/$id/zip" \
              -o "$outzip"

            unzip -t "$outzip" > "w35v4/evidence/${label}-zip-test.txt"
            unzip -q "$outzip" -d "$outdir"

            printf '%s|%s|%s\n' \
              "$name" \
              "$id" \
              "$(sha256sum "$outzip" | awk '{print $1}')"
          }

          W33_INFO="$(
            fetch_artifact \
              "$W33_ARTIFACT_PREFIX" \
              w35v4/W33_V7.zip \
              w35v4/w33 \
              w33
          )"

          W34_INFO="$(
            fetch_artifact \
              "$W34_ARTIFACT_PREFIX" \
              w35v4/W34_V3.zip \
              w35v4/w34 \
              w34
          )"

          {
            echo "INPUT_ARTIFACT_FETCH=PASS"
            echo "ARTIFACT_PAGINATION=PASS"
            echo "ARTIFACT_PAGE_COUNT=$page"
            echo "ARTIFACT_TOTAL_COUNT=$(wc -l < "$ALL" | tr -d ' ')"
            echo "W33_ARTIFACT=$W33_INFO"
            echo "W34_ARTIFACT=$W34_INFO"
          } | tee w35v4/evidence/input-artifact-status.txt

      - name: Verify W33 v7 and W34 v3 prerequisite evidence
        shell: bash
        run: |
          set -euo pipefail

          test -s w35v4/w33/GEN2_33_Image
          test -s w35v4/w33/GEN2_33_veux.dtb
          test -s w35v4/w33/GEN2_33_veux-overlay.dtbo
          test -s w35v4/w33/GEN2_33_final.config
          test -s w35v4/w33/GEN2_33_V7_SHA256SUMS

          (
            cd w35v4/w33
            sha256sum -c GEN2_33_V7_SHA256SUMS
          ) | tee w35v4/evidence/w33-manifest-check.txt

          test "$(grep -c ': OK$' w35v4/evidence/w33-manifest-check.txt)" -eq 8
          test "$(sha256sum w35v4/w33/GEN2_33_Image | awk '{print $1}')" = "$W33_IMAGE_SHA256"
          test "$(sha256sum w35v4/w33/GEN2_33_veux.dtb | awk '{print $1}')" = "$W33_VEUX_DTB_SHA256"
          test "$(sha256sum w35v4/w33/GEN2_33_veux-overlay.dtbo | awk '{print $1}')" = "$W33_VEUX_DTBO_SHA256"
          test "$(sha256sum w35v4/w33/GEN2_33_final.config | awk '{print $1}')" = "$W33_CONFIG_SHA256"

          W34_REPORT='w35v4/w34/GEN2_34_V3_LINEAGE_AOSP_COMPATIBILITY_AUDIT.txt'
          test -s "$W34_REPORT"

          grep -q '^FINAL_RESULT=PASS_GEN2_34_V3_LINEAGE_AOSP_STATIC_COMPATIBILITY_AUDIT$' "$W34_REPORT"
          grep -q '^PRIMARY_STATIC_LINEAGE_TARGET=lineage-23.2$' "$W34_REPORT"
          grep -q '^DTB_POLICY=PRESERVE_ROM_DTB_IN_VENDOR_BOOT$' "$W34_REPORT"
          grep -q '^VENDOR_BOOT_POLICY=PRESERVE$' "$W34_REPORT"
          grep -q '^DTBO_POLICY=PRESERVE$' "$W34_REPORT"

          {
            echo "W35_V4_PREREQUISITES=PASS"
            echo "W33_V7=PASS"
            echo "W34_V3=PASS"
          } | tee w35v4/evidence/prerequisite-status.txt

      - name: Fetch exact Lineage and AnyKernel3 pins
        shell: bash
        run: |
          set -euo pipefail

          git clone --filter=blob:none --no-checkout \
            "$LINEAGE_VEUX_REPO" w35v4/lineage/veux >/dev/null 2>&1
          git -C w35v4/lineage/veux checkout --detach "$LINEAGE_VEUX_PIN" >/dev/null 2>&1

          git clone --filter=blob:none --no-checkout \
            "$LINEAGE_COMMON_REPO" w35v4/lineage/common >/dev/null 2>&1
          git -C w35v4/lineage/common checkout --detach "$LINEAGE_COMMON_PIN" >/dev/null 2>&1

          git clone --filter=blob:none --no-checkout \
            "$LINEAGE_BUILD_REPO" w35v4/lineage/build >/dev/null 2>&1
          git -C w35v4/lineage/build checkout --detach "$LINEAGE_BUILD_PIN" >/dev/null 2>&1

          git clone --filter=blob:none --no-checkout \
            "$AK3_REPO" w35v4/ak3/repo >/dev/null 2>&1
          git -C w35v4/ak3/repo checkout --detach "$AK3_PIN" >/dev/null 2>&1

          test "$(git -C w35v4/lineage/veux rev-parse HEAD)" = "$LINEAGE_VEUX_PIN"
          test "$(git -C w35v4/lineage/common rev-parse HEAD)" = "$LINEAGE_COMMON_PIN"
          test "$(git -C w35v4/lineage/build rev-parse HEAD)" = "$LINEAGE_BUILD_PIN"
          test "$(git -C w35v4/ak3/repo rev-parse HEAD)" = "$AK3_PIN"

          {
            echo "SOURCE_PINS=PASS"
            echo "LINEAGE_VEUX_PIN=$LINEAGE_VEUX_PIN"
            echo "LINEAGE_COMMON_PIN=$LINEAGE_COMMON_PIN"
            echo "LINEAGE_BUILD_PIN=$LINEAGE_BUILD_PIN"
            echo "AK3_PIN=$AK3_PIN"
          } | tee w35v4/evidence/source-pins.txt

      - name: Verify current Lineage routing and AnyKernel3 method contract
        shell: bash
        run: |
          set -euo pipefail

          DEVICE='w35v4/lineage/veux/BoardConfig.mk'
          COMMON='w35v4/lineage/common/BoardConfigCommon.mk'
          CORE='w35v4/ak3/repo/tools/ak3-core.sh'
          README='w35v4/ak3/repo/README.md'

          grep -q 'TARGET_KERNEL_CONFIG := veux_defconfig' "$DEVICE"
          grep -q 'BOARD_KERNEL_IMAGE_NAME := Image' "$COMMON"
          grep -q 'BOARD_BOOT_HEADER_VERSION := 3' "$COMMON"
          grep -q 'BOARD_KERNEL_SEPARATED_DTBO := true' "$COMMON"
          grep -q 'BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT := true' "$COMMON"

          grep -Fq 'split_boot() {' "$CORE"
          grep -Fq 'flash_boot() {' "$CORE"
          grep -Fq 'for i in zImage zImage-dtb Image Image-dtb' "$CORE"
          grep -Fq 'magiskboot repack' "$CORE"
          grep -Fq 'New image larger than target partition' "$CORE"
          grep -Fq '`IS_SLOT_DEVICE=1`' "$README"
          grep -Fq '`PATCH_VBMETA_FLAG=auto`' "$README"

          {
            echo "AK3_METHOD_CONTRACT=PASS"
            echo "KERNEL_FILENAME=Image"
            echo "USE_SPLIT_BOOT=YES"
            echo "USE_FLASH_BOOT=YES"
            echo "SLOT_AWARE_SUPPORTED=YES"
            echo "VENDOR_BOOT_POLICY=PRESERVE"
            echo "DTBO_POLICY=PRESERVE"
          } | tee w35v4/evidence/ak3-method-status.txt

      - name: Build deterministic synthetic boot v3 and replace only kernel
        shell: bash
        run: |
          set -euo pipefail

          cp w35v4/w33/GEN2_33_Image w35v4/sim/replacement-Image

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct

          PAGE = 4096
          HEADER_SIZE = 1580
          PARTITION_SIZE = 134217728

          old_kernel = (
              b"LINEAGE23.2-SYNTHETIC-KERNEL-"
              * 32768
          )[:786432]

          ramdisk = (
              b"LZ4-RAMDISK-SENTINEL-"
              * 65536
          )[:1048576]

          cmdline = (
              b"w35v4.synthetic=1 androidboot.hardware=qcom"
              + b"\0"
          ).ljust(1536, b"\0")

          header = struct.pack(
              "<8s9I1536s",
              b"ANDROID!",
              len(old_kernel),
              len(ramdisk),
              0x3500100,
              HEADER_SIZE,
              0, 0, 0, 0,
              3,
              cmdline,
          )

          def align(value):
              return (value + PAGE - 1) // PAGE * PAGE

          def pad(data):
              return data + bytes(align(len(data)) - len(data))

          source = (
              pad(header)
              + pad(old_kernel)
              + pad(ramdisk)
          )

          replacement = Path(
              "w35v4/sim/replacement-Image"
          ).read_bytes()

          values = struct.unpack(
              "<8s9I1536s",
              source[:HEADER_SIZE],
          )

          before = {
              "magic": values[0],
              "kernel_size": values[1],
              "ramdisk_size": values[2],
              "os_version": values[3],
              "header_size": values[4],
              "reserved": values[5:9],
              "header_version": values[9],
              "cmdline": values[10],
          }

          ramdisk_offset = PAGE + align(
              before["kernel_size"]
          )

          source_ramdisk = source[
              ramdisk_offset:
              ramdisk_offset + before["ramdisk_size"]
          ]

          new_header = struct.pack(
              "<8s9I1536s",
              before["magic"],
              len(replacement),
              before["ramdisk_size"],
              before["os_version"],
              before["header_size"],
              *before["reserved"],
              before["header_version"],
              before["cmdline"],
          )

          repacked = (
              pad(new_header)
              + pad(replacement)
              + pad(source_ramdisk)
          )

          if len(repacked) >= PARTITION_SIZE:
              raise RuntimeError(
                  "synthetic repack exceeds boot partition"
              )

          if hashlib.sha256(replacement).hexdigest() != (
              "98e608f7c30540b6cb5a1731b0edecd9"
              "a3b4960ebf388763452685858916037f"
          ):
              raise RuntimeError("W33 Image hash mismatch")

          after_values = struct.unpack(
              "<8s9I1536s",
              repacked[:HEADER_SIZE],
          )

          immutable_before = (
              before["magic"],
              before["ramdisk_size"],
              before["os_version"],
              before["header_size"],
              before["reserved"],
              before["header_version"],
              before["cmdline"],
          )

          immutable_after = (
              after_values[0],
              after_values[2],
              after_values[3],
              after_values[4],
              after_values[5:9],
              after_values[9],
              after_values[10],
          )

          if immutable_before != immutable_after:
              raise RuntimeError("boot v3 header invariant changed")

          new_ramdisk_offset = PAGE + align(
              len(replacement)
          )

          new_ramdisk = repacked[
              new_ramdisk_offset:
              new_ramdisk_offset + len(source_ramdisk)
          ]

          if new_ramdisk != source_ramdisk:
              raise RuntimeError("logical ramdisk changed")

          Path("w35v4/sim/source-boot-v3.img").write_bytes(
              source
          )
          Path("w35v4/sim/repacked-boot-v3.img").write_bytes(
              repacked
          )

          Path(
              "w35v4/evidence/synthetic-repack-status.txt"
          ).write_text(
              "\n".join([
                  "SYNTHETIC_BOOT_V3_REPACK=PASS",
                  "ONLY_LOGICAL_PAYLOAD_CHANGED=KERNEL",
                  "W33_IMAGE_SHA256_MATCH=YES",
                  "RAMDISK_LOGICAL_BYTES_PRESERVED=YES",
                  "BOOT_HEADER_VERSION_PRESERVED=YES",
                  "BOOT_HEADER_METADATA_PRESERVED=YES",
                  "REPACKED_BOOT_FITS_PARTITION=YES",
                  "VENDOR_BOOT_TOUCHED=NO",
                  "DTBO_TOUCHED=NO",
              ]) + "\n",
              encoding="utf-8",
          )
          PY

          cat w35v4/evidence/synthetic-repack-status.txt

      - name: Write final W35 v4 report
        shell: bash
        run: |
          set -euo pipefail

          grep -q '^W35_V4_PREREQUISITES=PASS$' w35v4/evidence/prerequisite-status.txt
          grep -q '^SOURCE_PINS=PASS$' w35v4/evidence/source-pins.txt
          grep -q '^AK3_METHOD_CONTRACT=PASS$' w35v4/evidence/ak3-method-status.txt
          grep -q '^SYNTHETIC_BOOT_V3_REPACK=PASS$' w35v4/evidence/synthetic-repack-status.txt
          grep -q '^ARTIFACT_PAGINATION=PASS$' w35v4/evidence/input-artifact-status.txt

          REPORT='GEN2_35_V4_ANYKERNEL3_BOOT_REPACK_CONTRACT_AUDIT.txt'

          {
            cat w35v4/evidence/audit-header.txt
            echo
            cat w35v4/evidence/input-artifact-status.txt
            cat w35v4/evidence/prerequisite-status.txt
            echo
            cat w35v4/evidence/source-pins.txt
            cat w35v4/evidence/ak3-method-status.txt
            echo
            cat w35v4/evidence/synthetic-repack-status.txt
            echo
            echo "FINAL_RESULT=PASS_GEN2_35_V4_ANYKERNEL3_BOOT_REPACK_STATIC_SYNTHETIC_CONTRACT"
            echo "W35_STATIC_SYNTHETIC_AK3_CONTRACT=PASS"
            echo "PRIMARY_DEVICE=veux"
            echo "PRIMARY_ROM_CONTRACT=lineage-23.2"
            echo "RAMDISK_POLICY=PRESERVE"
            echo "VENDOR_BOOT_POLICY=PRESERVE"
            echo "DTBO_POLICY=PRESERVE"
            echo "DTB_POLICY=PRESERVE_ROM_DTB_IN_VENDOR_BOOT"
            echo "REAL_BOOT_IMAGE_REPACK_REQUIRED_BEFORE_RELEASE=YES"
            echo "REAL_AK3_MAGISKBOOT_EXECUTION_REQUIRED_BEFORE_RELEASE=YES"
            echo "FLASHABLE_RELEASE_READY=NO"
            echo "NEXT_STEP=WORKFLOW36_V14_REAL_LINEAGE_BOOT_AK3_MAGISKBOOT_VALIDATION"
          } > "$REPORT"

          test -s "$REPORT"

      - name: Build failure safe W35 v4 report
        if: always()
        shell: bash
        run: |
          set +e

          REPORT='GEN2_35_V4_ANYKERNEL3_BOOT_REPACK_CONTRACT_AUDIT.txt'

          if [ ! -s "$REPORT" ]; then
            {
              echo "AUDIT=GEN2_35_V4_ANYKERNEL3_BOOT_REPACK_CONTRACT_SIMULATION"
              echo "RESULT=INCOMPLETE_OR_FAILED"
              echo "FAILURE_SAFE_AUDIT_GENERATED=YES"
              echo "DATE_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              find w35v4/evidence -maxdepth 1 -type f -print 2>/dev/null | sort
              echo "ANYKERNEL_FLASHABLE_ZIP_CREATED=NO"
              echo "DEVICE_ACCESSED=NO"
              echo "FLASHING_PERFORMED=NO"
            } > "$REPORT"
          fi

          test -s "$REPORT"

      - name: Upload W35 v4 audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GEN2_35_V4_ANYKERNEL3_BOOT_REPACK_CONTRACT_AUDIT-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          path: |
            GEN2_35_V4_ANYKERNEL3_BOOT_REPACK_CONTRACT_AUDIT.txt
            w35v4/evidence/
            w35v4/sim/source-boot-v3.img
            w35v4/sim/repacked-boot-v3.img
