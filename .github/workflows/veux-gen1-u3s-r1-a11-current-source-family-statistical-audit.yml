            echo "P13_CONFIG_QGKI=Y"
            echo "P13_CONFIG_ARCH_HOLI=Y"
            echo "P13_CONFIG_ARCH_BLAIR=Y"
            echo "P13_CONFIG_ONLY_BASELINE=PASS"
          } | tee "$AUDIT_DIR/09-P13-BASELINE.txt"

      - name: Clone pinned A11-current VEUX source corpus with sparse critical paths
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SNAPSHOT_DIR"
          mkdir -p "$SNAPSHOT_DIR"

          corpus="$AUDIT_DIR/10-source-corpus.tsv"
          printf 'label\tandroid_generation\tkind\trepository\tref\tpinned_commit\n' > "$corpus"

          clone_sparse() {
            label="$1"
            generation="$2"
            kind="$3"
            repo="$4"
            ref="$5"
            sha="$6"
            dest="$SNAPSHOT_DIR/$label"

            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$label" "$generation" "$kind" "$repo" "$ref" "$sha" >> "$corpus"

            git init -q "$dest"
            git -C "$dest" remote add origin "https://github.com/${repo}.git"
            git -C "$dest" sparse-checkout init --no-cone

            cat > "$dest/.git/info/sparse-checkout" <<'PATTERNS'
          /Makefile
          /Kconfig
          /arch/arm64/configs/
          /arch/arm64/boot/dts/vendor/
          /drivers/staging/qcacld-3.0/
          /drivers/staging/qca-wifi-host-cmn/
          /drivers/gpu/msm/
          /drivers/power/supply/qcom/
          /drivers/thermal/qcom/
          /drivers/scsi/ufs/
          /drivers/usb/dwc3/
          /drivers/soc/qcom/
          /techpack/audio/
          /techpack/camera/
          /techpack/video/
          /techpack/dataipa/
          /techpack/datarmnet/
          /net/qrtr/
          PATTERNS

            git -C "$dest" fetch -q --depth=2 --filter=blob:none origin "$sha"
            git -C "$dest" checkout -q --detach FETCH_HEAD

            test "$(git -C "$dest" rev-parse HEAD)" = "$sha"
            test -f "$dest/Makefile"

            # U3S-R1 operational correction: depth=2 keeps one real parent
            # object available for direct lineage checks. The statistical
            # source matrix itself is otherwise unchanged from U3S.
            if [ "$label" = "a16_caesium" ]; then
              git -C "$dest" cat-file -e 'HEAD^'
            fi
          }

          clone_sparse \
            a11_stock Android11 stock \
            MiCode/Xiaomi_Kernel_OpenSource veux-r-oss \
            61397e524093d1ccb94769b5460825e2eaf8871e

          clone_sparse \
            a12_twelve Android12 community \
            sm6375-devs/android_kernel_xiaomi_sm6375 twelve \
            ba5c5568e1562789d2bac04ae3370932004671bf

          clone_sparse \
            a13_lineage20 Android13 community \
            xiaomi-sm6375-devs/android_kernel_xiaomi_sm6375 lineage-20 \
            8050fa5150de3697e54e1366e968a3af0a6911ec

          clone_sparse \
            a14_pixel Android14 community \
            PixelExperience-Devices/kernel_xiaomi_sm6375 fourteen \
            889296971b88453d7ca9a1dd668a2381a7f4e9b7

          clone_sparse \
            a15_nebula Android15-era-custom custom \
            dev-sm6375/kernel_xiaomi_sm6375 main \
            c71429ee4780676cdb89aab5bb62ef4578b692dc

          clone_sparse \
            current_positron Android11-16-custom custom \
            dereference23/kernel_xiaomi_sm6375 main \
            f4b8a13a43a130a9aab83cc985ce4d4421291ae6

          clone_sparse \
            a16_caesium Android16-custom custom \
            CaesiumOS/kernel_xiaomi_sm6375 16-qpr2 \
            30e3b032c8f27780f6011bc61c4c4b655985c9bb

          cat "$corpus"

      - name: Build source-family signatures and P13 similarity matrix
        shell: bash
        run: |
          set -euo pipefail
          export P13_ROOT="$GITHUB_WORKSPACE/kernel"
          export P13_CONFIG="$AUDIT_DIR/09-P13-config.txt"

          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import csv, hashlib, os, re, subprocess

          audit = Path(os.environ["AUDIT_DIR"])
          roots = Path(os.environ["SNAPSHOT_DIR"])
          p13_root = Path(os.environ["P13_ROOT"])
          p13_config = Path(os.environ["P13_CONFIG"])

          corpus = list(csv.DictReader(
              (audit / "10-source-corpus.tsv").open(),
              delimiter="\t"
          ))

          groups = {
              "wifi_qcacld": [
                  "drivers/staging/qcacld-3.0",
                  "drivers/staging/qca-wifi-host-cmn",
              ],
              "gpu": ["drivers/gpu/msm"],
              "power": ["drivers/power/supply/qcom"],
              "thermal": ["drivers/thermal/qcom"],
              "ufs": ["drivers/scsi/ufs"],
              "usb_dwc3": ["drivers/usb/dwc3"],
              "soc_qcom": ["drivers/soc/qcom"],
              "audio": ["techpack/audio"],
              "camera": ["techpack/camera"],
              "video": ["techpack/video"],
              "ipa": ["techpack/dataipa"],
              "rmnet": ["techpack/datarmnet"],
              "qrtr": ["net/qrtr"],
          }

          config_keys = [
              "CONFIG_QGKI",
              "CONFIG_WT_QGKI",
              "CONFIG_AUDIO_QGKI",
              "CONFIG_ARCH_HOLI",
              "CONFIG_ARCH_BLAIR",
              "CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL",
              "CONFIG_BUILD_ARM64_DT_OVERLAY",
              "CONFIG_SCHED_WALT",
              "CONFIG_IPA3",
              "CONFIG_QCA_CLD_WLAN",
              "CONFIG_QCOM_KGSL",
              "CONFIG_SCSI_UFSHCD",
              "CONFIG_SCSI_UFSHCD_QTI",
              "CONFIG_USB_DWC3",
              "CONFIG_QRTR",
              "CONFIG_LTO_CLANG",
              "CONFIG_THINLTO",
              "CONFIG_MODULES",
              "CONFIG_MODVERSIONS",
          ]

          export_re = re.compile(
              r'EXPORT_SYMBOL(?:_GPL)?\s*\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)'
          )
          kconfig_re = re.compile(
              r'^\s*(?:menu)?config\s+([A-Za-z_][A-Za-z0-9_]*)\s*$',
              re.M
          )
          obj_re = re.compile(
              r'^\s*obj-[^:=+]*\+?=\s*(.+)$',
              re.M
          )

          def kernel_version(root):
              t = (root / "Makefile").read_text(errors="replace")
              vals = {}
              for key in ("VERSION", "PATCHLEVEL", "SUBLEVEL"):
                  m = re.search(rf'^{key}\s*=\s*([0-9]+)\s*$', t, re.M)
                  vals[key] = int(m.group(1)) if m else None
              if None in vals.values():
                  return "unknown", None
              return (
                  f"{vals['VERSION']}.{vals['PATCHLEVEL']}.{vals['SUBLEVEL']}",
                  vals["SUBLEVEL"],
              )

          def relevant_config_files(root):
              base = root / "arch/arm64/configs"
              if not base.exists():
                  return []
              all_cfg = [p for p in base.rglob("*") if p.is_file()]
              preferred = []
              for p in all_cfg:
                  n = p.name.lower()
                  rel = str(p.relative_to(base)).lower()
                  if "veux" in n or "veux" in rel:
                      preferred.append(p)
                  elif n == "holi_qgki.config":
                      preferred.append(p)
                  elif n == "stock_defconfig":
                      preferred.append(p)
              if preferred:
                  return sorted(set(preferred))
              return sorted(
                  p for p in all_cfg
                  if "qgki" in p.name.lower() or "holi" in p.name.lower()
              )

          def parse_cfg_text(text):
              out = {}
              for line in text.splitlines():
                  m = re.match(r'^(CONFIG_[A-Za-z0-9_]+)=(.*)$', line)
                  if m:
                      out[m.group(1)] = m.group(2)
                      continue
                  m = re.match(r'^# (CONFIG_[A-Za-z0-9_]+) is not set$', line)
                  if m:
                      out[m.group(1)] = "n"
              return out

          def source_config_states(root):
              states = {k: set() for k in config_keys}
              files = relevant_config_files(root)
              for f in files:
                  cfg = parse_cfg_text(f.read_text(errors="replace"))
                  for k in config_keys:
                      if k in cfg:
                          states[k].add(cfg[k])
              return states, files

          p13_cfg = parse_cfg_text(p13_config.read_text(errors="replace"))

          def iter_critical_files(root):
              for alternatives in groups.values():
                  for rel in alternatives:
                      d = root / rel
                      if not d.exists():
                          continue
                      for p in d.rglob("*"):
                          if p.is_file() and p.suffix in {".c", ".h"}:
                              yield p

          def export_symbols(root):
              out = set()
              for p in iter_critical_files(root):
                  try:
                      text = p.read_text(errors="replace")
                  except Exception:
                      continue
                  out.update(export_re.findall(text))
              return out

          def kconfig_symbols(root):
              out = set()
              for alternatives in groups.values():
                  for rel in alternatives:
                      d = root / rel
                      if not d.exists():
                          continue
                      for p in d.rglob("Kconfig*"):
                          if p.is_file():
                              out.update(kconfig_re.findall(
                                  p.read_text(errors="replace")
                              ))
              return out

          def kbuild_targets(root):
              out = set()
              for alternatives in groups.values():
                  for rel in alternatives:
                      d = root / rel
                      if not d.exists():
                          continue
                      for name in ("Makefile", "Kbuild"):
                          for p in d.rglob(name):
                              if not p.is_file():
                                  continue
                              text = p.read_text(errors="replace")
                              for rhs in obj_re.findall(text):
                                  for tok in rhs.split():
                                      tok = tok.strip()
                                      if tok.endswith((".o", ".a")):
                                          out.add(tok)
              return out

          def path_signature(root):
              row = {}
              for name, alternatives in groups.items():
                  count = 0
                  paths = []
                  for rel in alternatives:
                      d = root / rel
                      if d.exists():
                          paths.append(rel)
                          count += sum(1 for p in d.rglob("*") if p.is_file())
                  row[name] = (bool(paths), count, ",".join(paths))
              return row

          def dt_markers(root):
              found = set()
              dts = root / "arch/arm64/boot/dts/vendor"
              if not dts.exists():
                  return found
              needles = {
                  "VEUX": "veux",
                  "SM6375": "sm6375",
                  "HOLI": "qcom,holi",
                  "BLAIR": "qcom,blair",
                  "MANNAR": "mannar",
              }
              for p in dts.rglob("*"):
                  if not p.is_file() or p.suffix not in {".dts", ".dtsi"}:
                      continue
                  text = p.read_text(errors="replace").lower()
                  for key, needle in needles.items():
                      if needle.lower() in text:
                          found.add(key)
              return found

          def jaccard(a, b):
              if not a and not b:
                  return 1.0
              if not a or not b:
                  return 0.0
              return len(a & b) / len(a | b)

          p13_exports = export_symbols(p13_root)
          p13_kconfigs = kconfig_symbols(p13_root)
          p13_kbuild = kbuild_targets(p13_root)
          p13_paths = path_signature(p13_root)
          p13_dt = dt_markers(p13_root)

          (audit / "11-P13-critical-export-symbols.txt").write_text(
              "\n".join(sorted(p13_exports)) + "\n"
          )
          (audit / "11-P13-critical-kconfig-symbols.txt").write_text(
              "\n".join(sorted(p13_kconfigs)) + "\n"
          )
          (audit / "11-P13-critical-kbuild-targets.txt").write_text(
              "\n".join(sorted(p13_kbuild)) + "\n"
          )

          # P13 authoritative config state.
          config_rows = []
          for key in config_keys:
              config_rows.append({
                  "label": "P13",
                  "key": key,
                  "states": p13_cfg.get(key, "absent"),
                  "source": "generated_exact_P13_config",
              })

          sig_rows = []
          path_rows = []
          sim_rows = []

          for meta in corpus:
              label = meta["label"]
              root = roots / label
              version, sublevel = kernel_version(root)
              states, cfg_files = source_config_states(root)
              exports = export_symbols(root)
              kconfigs = kconfig_symbols(root)
              kbuild = kbuild_targets(root)
              paths = path_signature(root)
              dt = dt_markers(root)

              present_groups = sum(1 for v in paths.values() if v[0])
              structure_ratio = present_groups / len(groups)

              qgki = "y" in states["CONFIG_QGKI"]
              holi = "y" in states["CONFIG_ARCH_HOLI"] or "HOLI" in dt
              blair = "y" in states["CONFIG_ARCH_BLAIR"] or "BLAIR" in dt
              veux = any("veux" in str(p).lower() for p in cfg_files) or "VEUX" in dt

              agree = 0
              comparable = 0
              for key in config_keys:
                  pv = p13_cfg.get(key)
                  if pv is None:
                      continue
                  vals = states[key]
                  if not vals:
                      continue
                  comparable += 1
                  if pv in vals:
                      agree += 1
              config_agreement = agree / comparable if comparable else 0.0

              exp_j = jaccard(p13_exports, exports)
              kcfg_j = jaccard(p13_kconfigs, kconfigs)
              kbld_j = jaccard(p13_kbuild, kbuild)

              if not version.startswith("5.4."):
                  cls = "C_OUTSIDE_LINUX_5_4"
              elif sublevel is not None and sublevel > 302:
                  cls = "C_CUSTOM_GT302_SOURCE_REQUIRED"
              elif not qgki:
                  cls = "B_QGKI_MARKER_REVIEW"
              elif structure_ratio < 0.75:
                  cls = "B_CRITICAL_STRUCTURE_REVIEW"
              elif not (holi or blair or veux):
                  cls = "B_DEVICE_FAMILY_MARKER_REVIEW"
              elif exp_j < 0.65:
                  cls = "B_DRIVER_EXPORT_API_REVIEW"
              else:
                  cls = "A_SAME_VEUX_QGKI_5_4_SOURCE_FAMILY"

              parent = subprocess.run(
                  ["git", "-C", str(root), "show", "-s", "--format=%P", "HEAD"],
                  text=True, stdout=subprocess.PIPE, check=True
              ).stdout.strip()
              subject = subprocess.run(
                  ["git", "-C", str(root), "show", "-s", "--format=%s", "HEAD"],
                  text=True, stdout=subprocess.PIPE, check=True
              ).stdout.strip()

              sig_rows.append({
                  **meta,
                  "kernel_version": version,
                  "sublevel": sublevel if sublevel is not None else "",
                  "head_parent": parent,
                  "head_subject": subject,
                  "config_files": ",".join(str(p.relative_to(root)) for p in cfg_files),
                  "qgki_y": int(qgki),
                  "holi_marker": int(holi),
                  "blair_marker": int(blair),
                  "veux_marker": int(veux),
                  "dt_markers": ",".join(sorted(dt)),
                  "critical_groups_present": present_groups,
                  "critical_groups_total": len(groups),
                  "critical_export_symbols": len(exports),
                  "critical_kconfig_symbols": len(kconfigs),
                  "critical_kbuild_targets": len(kbuild),
                  "classification": cls,
              })

              sim_rows.append({
                  "label": label,
                  "android_generation": meta["android_generation"],
                  "kernel_version": version,
                  "structure_pct": f"{structure_ratio*100:.2f}",
                  "config_agreement_pct": f"{config_agreement*100:.2f}",
                  "export_symbol_jaccard": f"{exp_j:.6f}",
                  "kconfig_jaccard": f"{kcfg_j:.6f}",
                  "kbuild_jaccard": f"{kbld_j:.6f}",
                  "classification": cls,
              })

              for name, (exists, count, rels) in paths.items():
                  path_rows.append({
                      "label": label,
                      "group": name,
                      "present": int(exists),
                      "file_count": count,
                      "paths": rels,
                  })

              for key in config_keys:
                  config_rows.append({
                      "label": label,
                      "key": key,
                      "states": ",".join(sorted(states[key])) if states[key] else "absent",
                      "source": ",".join(str(p.relative_to(root)) for p in cfg_files),
                  })

          def write_tsv(path, rows):
              if not rows:
                  path.write_text("")
                  return
              fields = list(rows[0].keys())
              with path.open("w", newline="", encoding="utf-8") as fh:
                  w = csv.DictWriter(fh, fieldnames=fields, delimiter="\t")
                  w.writeheader()
                  w.writerows(rows)

          write_tsv(audit / "11-source-signatures.tsv", sig_rows)
          write_tsv(audit / "12-key-config-matrix.tsv", config_rows)
          write_tsv(audit / "13-critical-path-matrix.tsv", path_rows)
          write_tsv(audit / "14-family-similarity.tsv", sim_rows)

          # Fixed lineage fact that can be proven from the pinned commits:
          # Caesium 16-qpr2 HEAD is an immediate child of current Positron/e+ HEAD.
          pos = next(r for r in sig_rows if r["label"] == "current_positron")
          cae = next(r for r in sig_rows if r["label"] == "a16_caesium")
          caesium_parent_is_positron = (
              meta_pos := pos["pinned_commit"]
          ) in cae["head_parent"].split()

          with (audit / "14-lineage-checks.txt").open("w") as fh:
              fh.write(
                  "CAESIUM_HEAD_PARENT_CONTAINS_POSITRON_HEAD="
                  + ("PASS" if caesium_parent_is_positron else "FAIL")
                  + "\n"
              )
              fh.write(f"POSITRON_HEAD={pos['pinned_commit']}\n")
              fh.write(f"CAESIUM_HEAD={cae['pinned_commit']}\n")
              fh.write(f"CAESIUM_PARENTS={cae['head_parent']}\n")

          if not caesium_parent_is_positron:
              raise SystemExit("Pinned Caesium lineage check failed")

          # Summary classification does not claim boot safety.
          a_count = sum(r["classification"].startswith("A_") for r in sim_rows)
          b_count = sum(r["classification"].startswith("B_") for r in sim_rows)
          c_count = sum(r["classification"].startswith("C_") for r in sim_rows)

          if c_count:
              final = "SOURCE_MATRIX_CONTAINS_OUTSIDE_OR_CUSTOM_GT302_FAMILY"
          elif b_count:
              final = "SOURCE_MATRIX_SUPPORTS_COMMON_5_4_FAMILY_WITH_REVIEW_DELTAS"
          else:
              final = "SOURCE_MATRIX_SUPPORTS_SINGLE_COMMON_VEUX_QGKI_5_4_FAMILY"

          lines = [
              "# VEUX GEN1 U3S — A11 to Current Source-Family Audit",
              "",
              "## Scope",
              "",
              "This is a read-only source/statistical audit. It is not DEVICE PASS and",
              "does not guarantee that an arbitrary ROM will boot P13.",
              "",
              "## Exact baseline",
              "",
              "- P13 source reconstruction: exact pinned CLEAN-GEN1/P13 lineage",
              "- P13 kernel family: 5.4.274 QGKI",
              "- P13 generated config used as the authoritative config comparator",
              "",
              "## Corpus",
              "",
              "| Label | Android/era | Kernel | Structure | Config agree | Export Jaccard | Kconfig Jaccard | Kbuild Jaccard | Class |",
              "|---|---|---:|---:|---:|---:|---:|---:|---|",
          ]
          for r in sim_rows:
              lines.append(
                  f"| {r['label']} | {r['android_generation']} | {r['kernel_version']} | "
                  f"{r['structure_pct']}% | {r['config_agreement_pct']}% | "
                  f"{r['export_symbol_jaccard']} | {r['kconfig_jaccard']} | "
                  f"{r['kbuild_jaccard']} | {r['classification']} |"
              )

          lines += [
              "",
              "## Interpretation",
              "",
              f"- Class A sources: **{a_count}**",
              f"- Class B review deltas: **{b_count}**",
              f"- Class C/outside-family sources: **{c_count}**",
              "- Linux 5.4.302 is treated as the audited official 5.4 endpoint.",
              "- A claimed 5.4.308 is not inferred compatible. It requires its actual",
              "  source/runtime ABI evidence and is classified CUSTOM_GT302_SOURCE_REQUIRED.",
              "- Android release, ROM branding and geographic firmware region are not",
              "  used as compatibility gates.",
              "- Caesium 16-qpr2 ancestry to the pinned Positron/e+ head is checked",
              "  directly from commit parents.",
              "",
              "## Result",
              "",
              f"**{final}**",
              "",
              "This result is statistical/source-family evidence only. The U2-R3",
              "kernel remains frozen; no kernel patch or rebuild is justified by this",
              "audit alone.",
          ]

          (audit / "15-U3S-REPORT.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          (audit / "15-U3S-RESULT.txt").write_text(
              f"{final}\n"
              f"CLASS_A_COUNT={a_count}\n"
              f"CLASS_B_COUNT={b_count}\n"
              f"CLASS_C_COUNT={c_count}\n"
              "DEVICE_PASS=NO\n"
              "KERNEL_CHANGE_JUSTIFIED=NO\n"
              "GT_5_4_302_POLICY=SOURCE_REQUIRED\n",
              encoding="utf-8",
          )

          print(final)
          print(f"A={a_count} B={b_count} C={c_count}")
          PY

          cat "$AUDIT_DIR/15-U3S-RESULT.txt"
          sed -n '1,260p' "$AUDIT_DIR/15-U3S-REPORT.md"

      - name: Assert audit corpus and safety policy
        shell: bash
        run: |
          set -euo pipefail

          test "$(awk 'END{print NR-1}' "$AUDIT_DIR/10-source-corpus.tsv")" = "7"
          grep -Fq $'a11_stock\tAndroid11' "$AUDIT_DIR/10-source-corpus.tsv"
          grep -Fq $'a12_twelve\tAndroid12' "$AUDIT_DIR/10-source-corpus.tsv"
          grep -Fq $'a13_lineage20\tAndroid13' "$AUDIT_DIR/10-source-corpus.tsv"
          grep -Fq $'a14_pixel\tAndroid14' "$AUDIT_DIR/10-source-corpus.tsv"
          grep -Fq $'a15_nebula\tAndroid15-era-custom' "$AUDIT_DIR/10-source-corpus.tsv"
          grep -Fq $'current_positron\tAndroid11-16-custom' "$AUDIT_DIR/10-source-corpus.tsv"
          grep -Fq $'a16_caesium\tAndroid16-custom' "$AUDIT_DIR/10-source-corpus.tsv"

          grep -Fxq 'CAESIUM_HEAD_PARENT_CONTAINS_POSITRON_HEAD=PASS' \
            "$AUDIT_DIR/14-lineage-checks.txt"

          grep -Fq 'GT_5_4_302_POLICY=SOURCE_REQUIRED' \
            "$AUDIT_DIR/15-U3S-RESULT.txt"
          grep -Fq 'KERNEL_CHANGE_JUSTIFIED=NO' \
            "$AUDIT_DIR/15-U3S-RESULT.txt"

          {
            echo "U3S_CORPUS_COUNT=7"
            echo "U3S_GITHUB_MODE=READ_ONLY"
            echo "U3S_FLASH_ACTIONS=NONE"
            echo "U3S_DEVICE_REQUIRED=NO"
            echo "U3S_SAFETY_POLICY=PASS"
          } | tee "$AUDIT_DIR/16-U3S-SAFETY.txt"

      - name: Build self-verifying U3S evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d "$AUDIT_DIR"
          cd "$AUDIT_DIR"
          find . -type f ! -name 'U3S-EVIDENCE-SHA256SUMS.txt' -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            > U3S-EVIDENCE-SHA256SUMS.txt
          sha256sum -c U3S-EVIDENCE-SHA256SUMS.txt

      - name: Upload U3S source-family evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-GEN1-U3S-R1-A11-current-source-family-statistical-audit
          path: u3s-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
