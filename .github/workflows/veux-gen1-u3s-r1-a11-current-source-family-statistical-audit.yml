          grep -Fxq 'CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y' "$OUT_DIR/.config"

          {
            echo "P13_SOURCE_TREE=$(git write-tree)"
            echo "P13_KERNELVERSION=$(make -s kernelversion)"
