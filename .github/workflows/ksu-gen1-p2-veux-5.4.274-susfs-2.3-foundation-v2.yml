name: KSU GEN1 P2 - VEUX 5.4.274 SUSFS 2.3 Dormant Foundation v2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ksu-gen1-p2-veux-5-4-274-susfs-2-3-foundation-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_REPOSITORY: dereference23/kernel_xiaomi_sm6375
  BASE_COMMIT: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
  BASE_TREE: 1783b5008fc971b795ccaa374efe97aa996eef49
  BASE_VERSION: 5.4.268

  ANDROID_COMMON_REPO: https://android.googlesource.com/kernel/common
  ANDROID_TAG: android11-5.4.274_r00
  ANDROID_TAG_OBJECT: b5141f9d31a3d1875523c9e1ae0d4587c144d149
  ANDROID_COMMIT: 181edea14ae07024cc87699f3cd49116e6f8fbb3
  ANDROID_TREE: 0485f492b920bf72f7f623a0df2aa3c5d7661a9c
  TARGET_VERSION: 5.4.274
  EXPECTED_P0_MERGE_COMMIT: 763f39fff62ff914200a9ac6e7e2336fdf29a6f2
  EXPECTED_P0_MERGE_TREE: a50206971cf1d1eddc259f3aba3d63f87e7ec706

  KSU_REPOSITORY: https://github.com/tiann/KernelSU.git
  KSU_COMMIT: b766b98513b5a7eb33bc1c4a76b5702bf1288f07
  KSU_EXPECTED_VERSION: "11872"
  EXPECTED_P1_IMAGE_SHA256: 28de954eddb41fc6519e9b465a7e5212cf2786ba37f6e5c7aa164764dec42cd3
  EXPECTED_P1_CONFIG_SHA256: 40c5569254710ba6900ffc82186e5edf7eb09d430df3e88e21ac6a0be82d4169

  SUSFS_REPOSITORY: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_SOURCE_BRANCH: gki-android12-5.10
  SUSFS_SOURCE_COMMIT: ec785f47d49f7b3871ca9356f450411020af7017
  SUSFS_EXPECTED_VERSION: v2.3.0

  P2_V1_FAILED_RUN_ID: "33900901057"

  KBUILD_BUILD_USER: clean-gen1
  KBUILD_BUILD_HOST: github-actions
  KBUILD_BUILD_TIMESTAMP: Thu Apr 18 11:05:25 UTC 2024

jobs:
  p2-susfs-dormant-foundation:
    name: P2 - SUSFS 2.3 dormant source foundation v2
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: 01 - Checkout exact fresh VEUX base
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BASE_REPOSITORY }}
          ref: ${{ env.BASE_COMMIT }}
          path: kernel
          fetch-depth: 0
          filter: blob:none

      - name: 02 - Initialize P2 evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/evidence" "$GITHUB_WORKSPACE/restore-kit" "$GITHUB_WORKSPACE/susfs-upstream"
          mkdir -p "$GITHUB_WORKSPACE/evidence" "$GITHUB_WORKSPACE/restore-kit"
          {
            echo "WORKFLOW=KSU-GEN1-P2-VEUX-5.4.274-SUSFS-2.3-DORMANT-FOUNDATION-v2"
            echo "PURPOSE=Reconstruct proven P1 source state and add dormant SUSFS 2.3 source foundation only"
            echo "PARENT_FAILED_RUN_ID=$P2_V1_FAILED_RUN_ID"
            echo "P2_V1_FAILURE_CLASS=WORKFLOW_SCOPE_GATE_PLUS_EMPTY_RESTORE_MANIFEST"
            echo "P2_V2_SOURCE_INTEGRATION_CHANGED_FROM_V1=NO"
            echo "P2_V2_FIX_1=SEMANTIC_LEGACY_KSU_REPLACEMENT_SCOPE_GATE"
            echo "P2_V2_FIX_2=EMPTY_RESTORE_KIT_MANIFEST_SAFE"
            echo "DEVICE=VEUX"
            echo "TARGET_KERNEL=$TARGET_VERSION"
            echo "P1_KSU_COMMIT=$KSU_COMMIT"
            echo "P1_KSU_EXPECTED_VERSION=$KSU_EXPECTED_VERSION"
            echo "P1_REFERENCE_IMAGE_SHA256=$EXPECTED_P1_IMAGE_SHA256"
            echo "P1_REFERENCE_CONFIG_SHA256=$EXPECTED_P1_CONFIG_SHA256"
            echo "SUSFS_SOURCE_BRANCH=$SUSFS_SOURCE_BRANCH"
            echo "SUSFS_SOURCE_COMMIT=$SUSFS_SOURCE_COMMIT"
            echo "SUSFS_EXPECTED_VERSION=$SUSFS_EXPECTED_VERSION"
            echo "SUSFS_STATE=DORMANT_SOURCE_ONLY"
            echo "SUSFS_KCONFIG_ENABLEMENT=ABSENT"
            echo "SUSFS_ACTIVE_HOOKS=ABSENT"
            echo "RESUKISU_INTEGRATION=ABSENT"
            echo "KERNEL_BUILD=NOT_PERFORMED_IN_P2"
            echo "BOOT_IMAGE=NOT_CREATED"
            echo "FLASHING=NOT_PERFORMED"
          } > "$GITHUB_WORKSPACE/evidence/00-CONTRACT.txt"
          echo "STAGE=INITIALIZED" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"

      - name: 03 - Install source-audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=DEPENDENCIES" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            git \
            python3 \
            rsync

      - name: 04 - Authenticate exact VEUX base
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=BASE_AUTH" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
          cd "$GITHUB_WORKSPACE/kernel"

          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$BASE_TREE"
          test -z "$(git status --porcelain)"
          test "$(make -s kernelversion)" = "$BASE_VERSION"
          test -f arch/arm64/configs/veux_defconfig
          test -f arch/arm64/boot/dts/vendor/xiaomi/veux.dts
          test -d drivers/kernelsu

          {
            echo "BASE_AUTH=PASS"
            echo "BASE_COMMIT=$(git rev-parse HEAD)"
            echo "BASE_TREE=$(git rev-parse HEAD^{tree})"
            echo "BASE_VERSION=$(make -s kernelversion)"
          } > "$GITHUB_WORKSPACE/evidence/01-BASE-AUTH.txt"

      - name: 05 - Fetch and authenticate Android 5.4.274 target
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=ANDROID_TARGET" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
          cd "$GITHUB_WORKSPACE/kernel"

          git remote remove android >/dev/null 2>&1 || true
          git remote add android "$ANDROID_COMMON_REPO"
          git fetch --no-tags android "refs/tags/${ANDROID_TAG}:refs/tags/${ANDROID_TAG}"

          tag_object="$(git rev-parse "refs/tags/${ANDROID_TAG}")"
          tag_commit="$(git rev-parse "refs/tags/${ANDROID_TAG}^{}")"
          tag_type="$(git cat-file -t "refs/tags/${ANDROID_TAG}")"
          target_tree="$(git rev-parse "${ANDROID_COMMIT}^{tree}")"

          test "$tag_type" = "tag"
          test "$tag_object" = "$ANDROID_TAG_OBJECT"
          test "$tag_commit" = "$ANDROID_COMMIT"
          test "$target_tree" = "$ANDROID_TREE"

          {
            echo "ANDROID_TARGET_AUTH=PASS"
            echo "ANDROID_TAG=$ANDROID_TAG"
            echo "ANDROID_TAG_OBJECT=$tag_object"
            echo "ANDROID_COMMIT=$tag_commit"
            echo "ANDROID_TREE=$target_tree"
          } > "$GITHUB_WORKSPACE/evidence/02-ANDROID-TARGET.txt"

      - name: 06 - Reconstruct proven deterministic P0 merge
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P0_RECONSTRUCTION" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
          cd "$GITHUB_WORKSPACE/kernel"

          git config user.name "VEUX Clean Baseline"
          git config user.email "veux-clean-baseline@users.noreply.github.com"

          git merge --no-commit --no-ff "$ANDROID_COMMIT"
          test "$(make -s kernelversion)" = "$TARGET_VERSION"

          export GIT_AUTHOR_DATE="2024-04-18T11:05:25Z"
          export GIT_COMMITTER_DATE="2024-04-18T11:05:25Z"
          git commit -m "CLEAN BASELINE: merge android11-5.4.274_r00 into VEUX 5.4.268"

          test "$(git rev-parse HEAD)" = "$EXPECTED_P0_MERGE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P0_MERGE_TREE"
          test "$(git rev-parse HEAD^1)" = "$BASE_COMMIT"
          test "$(git rev-parse HEAD^2)" = "$ANDROID_COMMIT"
          test -z "$(git status --porcelain)"

          {
            echo "PROVEN_P0_RECONSTRUCTION_METHOD=PASS"
            echo "P0_MERGE_COMMIT=$(git rev-parse HEAD)"
            echo "P0_MERGE_TREE=$(git rev-parse HEAD^{tree})"
            echo "P0_KERNEL_VERSION=$(make -s kernelversion)"
          } > "$GITHUB_WORKSPACE/evidence/03-P0-RECONSTRUCTION.txt"

      - name: 07 - Snapshot P1 external KernelSU hook contract
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P1_HOOK_CONTRACT" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
          cd "$GITHUB_WORKSPACE/kernel"

          grep -RhoE '\bksu_[A-Za-z0-9_]+' \
            fs kernel security drivers/input include \
            --exclude-dir=kernelsu \
            --exclude='*.o' \
            2>/dev/null \
            | LC_ALL=C sort -u \
            > "$GITHUB_WORKSPACE/evidence/04-P1-EXTERNAL-KSU-SYMBOLS.txt" || true

          test "$(wc -l < "$GITHUB_WORKSPACE/evidence/04-P1-EXTERNAL-KSU-SYMBOLS.txt" | tr -d ' ')" -eq 8

          grep -RIlE '\bksu_[A-Za-z0-9_]+' \
            fs kernel security drivers/input include \
            --exclude-dir=kernelsu \
            --exclude='*.o' \
            2>/dev/null \
            | LC_ALL=C sort -u \
            > "$GITHUB_WORKSPACE/evidence/04-P1-HOOK-SOURCE-FILES.txt"

          test "$(wc -l < "$GITHUB_WORKSPACE/evidence/04-P1-HOOK-SOURCE-FILES.txt" | tr -d ' ')" -eq 5

          while IFS= read -r file; do
            sha256sum "$file"
          done < "$GITHUB_WORKSPACE/evidence/04-P1-HOOK-SOURCE-FILES.txt" \
            > "$GITHUB_WORKSPACE/evidence/04-P1-HOOK-SOURCE-FILES.sha256"

          {
            echo "EXTERNAL_KSU_SYMBOL_COUNT=8"
            echo "HOOK_SOURCE_FILE_COUNT=5"
            echo "P1_HOOK_CONTRACT_SNAPSHOT=PASS"
          } > "$GITHUB_WORKSPACE/evidence/04-P1-HOOK-CONTRACT.txt"

      - name: 08 - Checkout exact official KernelSU 0.9.5
        uses: actions/checkout@v7
        with:
          repository: tiann/KernelSU
          ref: ${{ env.KSU_COMMIT }}
          path: kernel/KernelSU
          fetch-depth: 0

      - name: 09 - Authenticate KernelSU and reconstruct P1 source integration
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P1_KSU_RECONSTRUCTION" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
          cd "$GITHUB_WORKSPACE/kernel"

          test "$(git -C KernelSU rev-parse HEAD)" = "$KSU_COMMIT"
          ksu_tree="$(git -C KernelSU rev-parse HEAD^{tree})"
          ksu_count="$(git -C KernelSU rev-list --count HEAD)"
          ksu_version="$((10000 + ksu_count + 200))"
          test "$ksu_version" = "$KSU_EXPECTED_VERSION"

          grep -RhoE '\bksu_[A-Za-z0-9_]+' KernelSU/kernel 2>/dev/null \
            | LC_ALL=C sort -u > "$GITHUB_WORKSPACE/evidence/05-OFFICIAL-KSU-SYMBOLS.txt" || true

          : > "$GITHUB_WORKSPACE/evidence/05-MISSING-KSU-SYMBOLS.txt"
          while IFS= read -r symbol; do
            [ -n "$symbol" ] || continue
            grep -Fxq "$symbol" "$GITHUB_WORKSPACE/evidence/05-OFFICIAL-KSU-SYMBOLS.txt" \
              || echo "$symbol" >> "$GITHUB_WORKSPACE/evidence/05-MISSING-KSU-SYMBOLS.txt"
          done < "$GITHUB_WORKSPACE/evidence/04-P1-EXTERNAL-KSU-SYMBOLS.txt"
          test ! -s "$GITHUB_WORKSPACE/evidence/05-MISSING-KSU-SYMBOLS.txt"

          rm -rf drivers/kernelsu
          ln -s ../KernelSU/kernel drivers/kernelsu
          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
          test "$(realpath drivers/kernelsu)" = "$(realpath KernelSU/kernel)"

          test "$(grep -Fc 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig)" -eq 1
          test "$(grep -Ec '^[[:space:]]*obj-\$\(CONFIG_KSU\)[[:space:]]*\+=[[:space:]]*kernelsu/[[:space:]]*$' drivers/Makefile)" -eq 1
          sha256sum -c "$GITHUB_WORKSPACE/evidence/04-P1-HOOK-SOURCE-FILES.sha256"

          mkdir -p .git/info
          touch .git/info/exclude
          grep -Fxq '/KernelSU/' .git/info/exclude || echo '/KernelSU/' >> .git/info/exclude

          {
            echo "P1_SOURCE_RECONSTRUCTION=PASS"
            echo "KSU_HEAD=$KSU_COMMIT"
            echo "KSU_TREE=$ksu_tree"
            echo "KSU_VERSION=$ksu_version"
            echo "KSU_DRIVER_MODE=BUILT_IN_SOURCE_SYMLINK"
            echo "EXTERNAL_HOOK_SOURCE_FILES_UNCHANGED=YES"
            echo "SUSFS_PRESENT_BEFORE_P2=NO"
          } > "$GITHUB_WORKSPACE/evidence/05-P1-KSU-RECONSTRUCTION.txt"

          test ! -e fs/susfs.c
          test ! -e include/linux/susfs.h
          test ! -e include/linux/susfs_def.h

      - name: 10 - Fetch exact reviewed SUSFS 2.3 source
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=SUSFS_SOURCE_FETCH" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"

          rm -rf "$GITHUB_WORKSPACE/susfs-upstream"
          git init "$GITHUB_WORKSPACE/susfs-upstream"
          git -C "$GITHUB_WORKSPACE/susfs-upstream" remote add origin "$SUSFS_REPOSITORY"
          git -C "$GITHUB_WORKSPACE/susfs-upstream" fetch --depth=1 origin "$SUSFS_SOURCE_COMMIT"
          git -C "$GITHUB_WORKSPACE/susfs-upstream" checkout --detach FETCH_HEAD

          test "$(git -C "$GITHUB_WORKSPACE/susfs-upstream" rev-parse HEAD)" = "$SUSFS_SOURCE_COMMIT"

          for file in \
            kernel_patches/fs/susfs.c \
            kernel_patches/include/linux/susfs.h \
            kernel_patches/include/linux/susfs_def.h
          do
            test -s "$GITHUB_WORKSPACE/susfs-upstream/$file"
          done

          grep -Fq "#define SUSFS_VERSION \"$SUSFS_EXPECTED_VERSION\"" \
            "$GITHUB_WORKSPACE/susfs-upstream/kernel_patches/include/linux/susfs.h"

          {
            echo "SUSFS_SOURCE_FETCH=PASS"
            echo "SUSFS_SOURCE_BRANCH=$SUSFS_SOURCE_BRANCH"
            echo "SUSFS_SOURCE_HEAD=$(git -C "$GITHUB_WORKSPACE/susfs-upstream" rev-parse HEAD)"
            echo "SUSFS_SOURCE_TREE=$(git -C "$GITHUB_WORKSPACE/susfs-upstream" rev-parse HEAD^{tree})"
            echo "SUSFS_SOURCE_VERSION=$SUSFS_EXPECTED_VERSION"
          } > "$GITHUB_WORKSPACE/evidence/06-SUSFS-SOURCE-IDENTITY.txt"

          sha256sum \
            "$GITHUB_WORKSPACE/susfs-upstream/kernel_patches/fs/susfs.c" \
            "$GITHUB_WORKSPACE/susfs-upstream/kernel_patches/include/linux/susfs.h" \
            "$GITHUB_WORKSPACE/susfs-upstream/kernel_patches/include/linux/susfs_def.h" \
            > "$GITHUB_WORKSPACE/evidence/06-SUSFS-UPSTREAM-SOURCE.sha256"

      - name: 11 - Import dormant SUSFS 2.3 core only
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=SUSFS_DORMANT_IMPORT" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
          cd "$GITHUB_WORKSPACE/kernel"

          install -m 0644 "$GITHUB_WORKSPACE/susfs-upstream/kernel_patches/fs/susfs.c" fs/susfs.c
          install -m 0644 "$GITHUB_WORKSPACE/susfs-upstream/kernel_patches/include/linux/susfs.h" include/linux/susfs.h
          install -m 0644 "$GITHUB_WORKSPACE/susfs-upstream/kernel_patches/include/linux/susfs_def.h" include/linux/susfs_def.h

          if grep -Fq 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile; then
            echo "Unexpected pre-existing SUSFS fs/Makefile wiring" >&2
            exit 1
          fi
          printf '\n# KSU GEN1 P2 dormant SUSFS 2.3 foundation\nobj-$(CONFIG_KSU_SUSFS) += susfs.o\n' >> fs/Makefile

          {
            echo "SUSFS_CORE_SOURCE_IMPORTED=YES"
            echo "SUSFS_HEADERS_IMPORTED=YES"
            echo "SUSFS_BUILD_WIRING_PRESENT=YES"
            echo "SUSFS_KCONFIG_SYMBOL_INTRODUCED=NO"
            echo "SUSFS_ACTIVE_HOOKS_INTEGRATED=NO"
            echo "SUSFS_STATE=DORMANT"
          } > "$GITHUB_WORKSPACE/evidence/07-SUSFS-DORMANT-IMPORT.txt"

      - name: 12 - Apply proven 5.4 SUSFS foundation safety adaptations
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=SUSFS_5_4_ADAPTATIONS" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
          cd "$GITHUB_WORKSPACE/kernel"

          python3 - <<'PY'
          from pathlib import Path

          h = Path("include/linux/susfs.h")
          text = h.read_text(encoding="utf-8")
          old = "#define KSTAT_SPOOF_CTIME_TV_SEC (1 < 8)"
          new = "#define KSTAT_SPOOF_CTIME_TV_SEC (1 << 8)"
          if text.count(old) != 1:
              raise SystemExit("KSTAT CTIME flag typo anchor mismatch")
          h.write_text(text.replace(old, new, 1), encoding="utf-8")

          d = Path("include/linux/susfs_def.h")
          text = d.read_text(encoding="utf-8")
          if "current_uid().val >= 10000" not in text:
              raise SystemExit("expected SUSFS current_uid().val application check missing")
          if "#include <linux/cred.h>" not in text:
              anchor = "#include <linux/bits.h>\n#include <linux/string.h>\n"
              repl = "#include <linux/bits.h>\n#include <linux/cred.h>\n#include <linux/string.h>\n"
              if text.count(anchor) != 1:
                  raise SystemExit("susfs_def.h cred include anchor mismatch")
              text = text.replace(anchor, repl, 1)
          d.write_text(text, encoding="utf-8")

          c = Path("fs/susfs.c")
          text = c.read_text(encoding="utf-8")
          old = "\tif (!info) {\n\t\tinfo->err = -ENOMEM;\n\t\tgoto out_copy_to_user;\n\t}\n"
          new = (
              "\tif (!info) {\n"
              "\t\tstruct st_susfs_enabled_features fallback = { .err = -ENOMEM };\n"
              "\t\tcopy_to_user((struct st_susfs_enabled_features __user*)*user_info,\n"
              "\t\t\t\t &fallback, sizeof(fallback));\n"
              "\t\treturn;\n"
              "\t}\n"
          )
          if text.count(old) != 1:
              raise SystemExit("enabled-features allocation guard anchor mismatch")
          text = text.replace(old, new, 1)

          srcu = Path("include/linux/srcu.h").read_text(encoding="utf-8", errors="ignore")
          if "DEFINE_STATIC_SRCU" not in srcu:
              old_srcu = "DEFINE_STATIC_SRCU(susfs_srcu_sus_path_loop);"
              new_srcu = "DEFINE_SRCU(susfs_srcu_sus_path_loop);"
              if old_srcu not in text:
                  raise SystemExit("DEFINE_STATIC_SRCU compatibility anchor missing")
              text = text.replace(old_srcu, new_srcu, 1)

          c.write_text(text, encoding="utf-8")
          PY

          grep -Fq '#define KSTAT_SPOOF_CTIME_TV_SEC (1 << 8)' include/linux/susfs.h
          ! grep -Fq '#define KSTAT_SPOOF_CTIME_TV_SEC (1 < 8)' include/linux/susfs.h
          grep -Fxq '#include <linux/cred.h>' include/linux/susfs_def.h
          grep -Fq 'current_uid().val >= 10000' include/linux/susfs_def.h
          grep -Fq 'struct st_susfs_enabled_features fallback = { .err = -ENOMEM };' fs/susfs.c
          ! grep -A7 -F 'if (!info) {' fs/susfs.c | head -8 | grep -Fq 'info->err = -ENOMEM'

          {
            echo "KSTAT_CTIME_FLAG_FIX=PASS"
            echo "SUSFS_DEF_CRED_INCLUDE_5_4_FIX=PASS"
            echo "ENABLED_FEATURES_KZALLOC_NULL_DEREF_FIX=PASS"
            if grep -Fq 'DEFINE_STATIC_SRCU(susfs_srcu_sus_path_loop);' fs/susfs.c; then
              echo "SUS_PATH_LOOP_SRCU_DECL=DEFINE_STATIC_SRCU"
            else
              grep -Fq 'DEFINE_SRCU(susfs_srcu_sus_path_loop);' fs/susfs.c
              echo "SUS_PATH_LOOP_SRCU_DECL=DEFINE_SRCU_5_4_COMPAT"
            fi
            echo "P2_FOUNDATION_SAFETY_ADAPTATIONS=PASS"
          } > "$GITHUB_WORKSPACE/evidence/08-SUSFS-5.4-SAFETY-ADAPTATIONS.txt"

      - name: 13 - Audit ARM64 SUSFS process-state TIF allocation
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=TIF_AUDIT" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
          cd "$GITHUB_WORKSPACE/kernel"

          python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/09-TIF-AUDIT.txt"
          import re
          from pathlib import Path

          reserved = {
              33: "TIF_PROC_UMOUNTED",
              34: "TIF_PROC_NO_SU",
              35: "TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT",
          }
          hits = []
          pat = re.compile(r'^\s*#\s*define\s+(TIF_[A-Za-z0-9_]+)\s+([0-9]+)\b')

          for root in (Path("arch/arm64/include"), Path("include")):
              if not root.exists():
                  continue
              for path in root.rglob("*.h"):
                  if path.as_posix() == "include/linux/susfs_def.h":
                      continue
                  for n, line in enumerate(path.read_text(encoding="utf-8", errors="ignore").splitlines(), 1):
                      m = pat.match(line)
                      if m and int(m.group(2)) in reserved:
                          hits.append((path.as_posix(), n, m.group(1), int(m.group(2))))

          if hits:
              print("TIF_COLLISION=FAIL")
              for hit in hits:
                  print("%s:%d %s=%d" % hit)
              raise SystemExit(1)

          text = Path("include/linux/susfs_def.h").read_text(encoding="utf-8")
          for bit, name in reserved.items():
              expected = f"#define {name} {bit}"
              if expected not in text:
                  raise SystemExit(f"missing {expected}")
              print(f"{name}={bit}=FREE")

          print("ARM64_TIF_33_34_35_COLLISION_AUDIT=PASS")
          PY

          grep -Fq 'ARM64_TIF_33_34_35_COLLISION_AUDIT=PASS' "$GITHUB_WORKSPACE/evidence/09-TIF-AUDIT.txt"

      - name: 14 - Audit dormant SRCU and OPEN_REDIRECT source semantics
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=SRCU_AUDIT" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
          cd "$GITHUB_WORKSPACE/kernel"

          python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/10-SRCU-AUDIT.txt"
          from pathlib import Path

          text = Path("fs/susfs.c").read_text(encoding="utf-8")
          if "susfs_srcu_sus_path_loop" not in text:
              raise SystemExit("missing SUS_PATH loop SRCU domain")
          if "DEFINE_SRCU(susfs_srcu_open_redirect);" not in text:
              raise SystemExit("missing OPEN_REDIRECT SRCU domain")
          if "synchronize_srcu(&susfs_srcu_open_redirect);" not in text:
              raise SystemExit("missing OPEN_REDIRECT synchronize_srcu")
          if 'callers must hold and release the "susfs_srcu_open_redirect" lock themselves.' not in text:
              raise SystemExit("missing caller-held OPEN_REDIRECT SRCU lifetime contract")

          begin = text.index("#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT")
          end = text.index("#endif // #ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT", begin)
          block = text[begin:end]
          if "synchronize_rcu(" in block:
              raise SystemExit("RCU/SRCU domain mixing in OPEN_REDIRECT block")

          print("SUS_PATH_LOOP_SRCU_DOMAIN=PASS")
          print("OPEN_REDIRECT_SRCU_DOMAIN=PASS")
          print("OPEN_REDIRECT_WRITER_SYNCHRONIZE_SRCU=PASS")
          print("OPEN_REDIRECT_MAPS_CALLER_HELD_SRCU_CONTRACT=PASS")
          print("OPEN_REDIRECT_SYNCHRONIZE_RCU_IN_SRCU_BLOCK=NO")
          print("OPEN_REDIRECT_STATUS=SOURCE_PRESENT_DORMANT_NOT_HOOKED")
          PY

      - name: 15 - Prove active kernel hook sites remain untouched
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=HOOK_BOUNDARY" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
          cd "$GITHUB_WORKSPACE/kernel"

          # Strong invariant: all five pre-existing KernelSU manual-hook callsite
          # sources must remain byte-identical to the proven P1 reconstruction.
          sha256sum -c "$GITHUB_WORKSPACE/evidence/04-P1-HOOK-SOURCE-FILES.sha256"

          mapfile -t changed < <(
            {
              git diff --name-only "$EXPECTED_P0_MERGE_COMMIT" --
              git ls-files --others --exclude-standard
            } | sed '/^$/d' | sort -u
          )
          test "${#changed[@]}" -gt 0
          printf '%s\n' "${changed[@]}" > "$GITHUB_WORKSPACE/evidence/11-P2-CHANGED-FILES.txt"

          # v1 incorrectly expected the replacement of the tracked legacy
          # drivers/kernelsu directory by one symlink to appear as one Git path.
          # Git correctly reports the removed legacy children too. v2 therefore
          # validates the semantic scope: the complete drivers/kernelsu subtree
          # is allowed as the P1 replacement footprint; outside that subtree only
          # the four dormant SUSFS foundation files are allowed.
          : > "$GITHUB_WORKSPACE/evidence/11-UNEXPECTED-CHANGED-FILES.txt"
          for file in "${changed[@]}"; do
            case "$file" in
              drivers/kernelsu|drivers/kernelsu/*|fs/Makefile|fs/susfs.c|include/linux/susfs.h|include/linux/susfs_def.h)
                ;;
              *)
                echo "$file" >> "$GITHUB_WORKSPACE/evidence/11-UNEXPECTED-CHANGED-FILES.txt"
                ;;
            esac
          done
          test ! -s "$GITHUB_WORKSPACE/evidence/11-UNEXPECTED-CHANGED-FILES.txt"

          for required in \
            drivers/kernelsu \
            fs/Makefile \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h
          do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$required"
          done

          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
          ksu_scope_count="$(printf '%s\n' "${changed[@]}" | grep -Ec '^drivers/kernelsu(/|$)')"
          test "$ksu_scope_count" -ge 1

          for forbidden in \
            fs/stat.c \
            fs/open.c \
            fs/namei.c \
            fs/namespace.c \
            fs/proc/task_mmu.c \
            fs/proc/base.c \
            fs/proc/fd.c \
            fs/proc_namespace.c \
            kernel/reboot.c
          do
            ! printf '%s\n' "${changed[@]}" | grep -Fxq "$forbidden"
          done

          {
            echo "P1_EXTERNAL_HOOK_SOURCE_FILES_UNCHANGED=YES"
            echo "LEGACY_KSU_REPLACEMENT_SCOPE_PATH_COUNT=$ksu_scope_count"
            echo "LEGACY_KSU_REPLACEMENT_SCOPE=PASS"
            echo "NON_KSU_ALLOWED_P2_FILES=4"
            echo "UNEXPECTED_CHANGED_FILES=0"
            echo "STAT_FACCESSAT_CHANGED=NO"
            echo "NAMEI_CHANGED=NO"
            echo "NAMESPACE_CHANGED=NO"
            echo "PROC_MAPS_CHANGED=NO"
            echo "OPEN_REDIRECT_ACTIVE_HOOKS_INTEGRATED=NO"
            echo "P2_ACTIVE_HOOK_BOUNDARY=PASS"
          } > "$GITHUB_WORKSPACE/evidence/11-ACTIVE-HOOK-BOUNDARY.txt"

      - name: 16 - Resolve config and prove SUSFS remains dormant
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=DORMANT_CONFIG_GATE" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
          cd "$GITHUB_WORKSPACE/kernel"

          rm -rf out-p2-config
          make -s O=out-p2-config ARCH=arm64 veux_defconfig
          test -s out-p2-config/.config

          grep -Fxq 'CONFIG_KSU=y' out-p2-config/.config
          grep -Fxq 'CONFIG_OVERLAY_FS=y' out-p2-config/.config

          if grep -Eq '^CONFIG_KSU_SUSFS=' out-p2-config/.config; then
            echo "CONFIG_KSU_SUSFS unexpectedly active at P2" >&2
            exit 1
          fi

          if grep -RInE '^config KSU_SUSFS$' KernelSU/kernel drivers/Kconfig fs/Kconfig arch/arm64/Kconfig 2>/dev/null; then
            echo "SUSFS Kconfig enablement unexpectedly introduced in P2" >&2
            exit 1
          fi

          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=ABSENT"
            echo "SUSFS_KCONFIG_ENABLEMENT=DEFERRED"
            echo "SUSFS_OBJECT_BUILD_ENABLED=NO"
            echo "P2_DORMANT_CONFIG_GATE=PASS"
            echo "CONFIG_SHA256=$(sha256sum out-p2-config/.config | awk '{print $1}')"
          } > "$GITHUB_WORKSPACE/evidence/12-DORMANT-CONFIG-GATE.txt"

      - name: 17 - Create deterministic P2 outer source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P2_CHECKPOINT" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
          cd "$GITHUB_WORKSPACE/kernel"

          rm -rf out-p2-config
          git diff --check
          git add -A drivers/kernelsu fs/Makefile fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
          git diff --cached --check
          git diff --cached --binary > "$GITHUB_WORKSPACE/restore-kit/p0-to-p2-outer.patch"
          test -s "$GITHUB_WORKSPACE/restore-kit/p0-to-p2-outer.patch"
          p2_tree="$(git write-tree)"

          export GIT_AUTHOR_NAME="KSU GEN1 P2"
          export GIT_AUTHOR_EMAIL="ksu-gen1-p2@users.noreply.github.com"
          export GIT_AUTHOR_DATE="2026-09-04T17:00:00Z"
          export GIT_COMMITTER_NAME="KSU GEN1 P2"
          export GIT_COMMITTER_EMAIL="ksu-gen1-p2@users.noreply.github.com"
          export GIT_COMMITTER_DATE="2026-09-04T17:00:00Z"
          git commit -m "KSU GEN1 P2: dormant SUSFS 2.3 foundation"

          p2_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^{tree})" = "$p2_tree"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_P0_MERGE_COMMIT"
          test -z "$(git status --porcelain)"

          {
            echo "P2_OUTER_COMMIT=$p2_commit"
            echo "P2_OUTER_TREE=$p2_tree"
            echo "P2_PARENT=$EXPECTED_P0_MERGE_COMMIT"
            echo "P2_SOURCE_CHECKPOINT=PASS"
          } > "$GITHUB_WORKSPACE/evidence/13-P2-SOURCE-CHECKPOINT.txt"

          echo "P2_OUTER_COMMIT=$p2_commit" >> "$GITHUB_ENV"
          echo "P2_OUTER_TREE=$p2_tree" >> "$GITHUB_ENV"

      - name: 18 - Replay-verify P2 outer patch from exact P0
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=REPLAY_VERIFY" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
          cd "$GITHUB_WORKSPACE/kernel"

          replay="$RUNNER_TEMP/p2-replay"
          rm -rf "$replay"
          git worktree add --detach "$replay" "$EXPECTED_P0_MERGE_COMMIT"

          git -C "$replay" apply --check --binary "$GITHUB_WORKSPACE/restore-kit/p0-to-p2-outer.patch"
          git -C "$replay" apply --index --binary "$GITHUB_WORKSPACE/restore-kit/p0-to-p2-outer.patch"
          replay_tree="$(git -C "$replay" write-tree)"
          test "$replay_tree" = "$P2_OUTER_TREE"

          {
            echo "P2_REPLAY_TREE=$replay_tree"
            echo "P2_EXPECTED_TREE=$P2_OUTER_TREE"
            echo "P2_PATCH_REPLAY=PASS"
          } > "$GITHUB_WORKSPACE/evidence/14-P2-REPLAY-VERIFY.txt"

          git worktree remove --force "$replay"

      - name: 19 - Create P2 restore manifest and final provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=PROVENANCE" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
          cd "$GITHUB_WORKSPACE/kernel"

          ksu_tree="$(git -C KernelSU rev-parse HEAD^{tree})"
          susfs_tree="$(git -C "$GITHUB_WORKSPACE/susfs-upstream" rev-parse HEAD^{tree})"

          python3 - <<PY
          import json
          from pathlib import Path

          manifest = {
              "stage": "KSU-GEN1-P2-v2",
              "device": "VEUX",
              "kernel_version": "$TARGET_VERSION",
              "p0_commit": "$EXPECTED_P0_MERGE_COMMIT",
              "p0_tree": "$EXPECTED_P0_MERGE_TREE",
              "p2_outer_commit": "$P2_OUTER_COMMIT",
              "p2_outer_tree": "$P2_OUTER_TREE",
              "kernelsu_head": "$KSU_COMMIT",
              "kernelsu_tree": "$ksu_tree",
              "kernelsu_version": "$KSU_EXPECTED_VERSION",
              "susfs_source_branch": "$SUSFS_SOURCE_BRANCH",
              "susfs_source_head": "$SUSFS_SOURCE_COMMIT",
              "susfs_source_tree": "$susfs_tree",
              "susfs_version": "$SUSFS_EXPECTED_VERSION",
              "susfs_source_present": True,
              "susfs_kconfig_enabled": False,
              "susfs_active_hooks_integrated": False,
              "resukisu_integrated": False,
              "kernel_build_performed": False,
              "boot_image_created": False,
              "flashing_performed": False,
              "p2_v1_failed_run_id": "$P2_V1_FAILED_RUN_ID",
              "p2_v2_source_integration_changed_from_v1": False,
          }
          Path("$GITHUB_WORKSPACE/restore-kit/manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          {
            echo "P2_KERNEL_VERSION=$TARGET_VERSION"
            echo "P2_P0_MERGE_COMMIT=$EXPECTED_P0_MERGE_COMMIT"
            echo "P2_P0_MERGE_TREE=$EXPECTED_P0_MERGE_TREE"
            echo "P2_OUTER_COMMIT=$P2_OUTER_COMMIT"
            echo "P2_OUTER_TREE=$P2_OUTER_TREE"
            echo "P2_KSU_HEAD=$KSU_COMMIT"
            echo "P2_KSU_TREE=$ksu_tree"
            echo "P2_KSU_VERSION=$KSU_EXPECTED_VERSION"
            echo "P2_SUSFS_SOURCE_HEAD=$SUSFS_SOURCE_COMMIT"
            echo "P2_SUSFS_SOURCE_TREE=$susfs_tree"
            echo "P2_SUSFS_VERSION=$SUSFS_EXPECTED_VERSION"
            echo "P2_SUSFS_DORMANT_FOUNDATION=PASS"
            echo "P2_ACTIVE_SUSFS_HOOKS=NO"
            echo "P2_RESUKISU=NO"
            echo "P2_KERNEL_BUILD=NO"
            echo "P2_V1_FAILURE_REPAIRED=WORKFLOW_ONLY"
            echo "P2_V2_SOURCE_INTEGRATION_CHANGED_FROM_V1=NO"
            echo "NEXT_IF_PASS=KSU GEN1 P3 - SUSFS 2.3 KernelSU bridge and compile boundary"
          } > "$GITHUB_WORKSPACE/evidence/15-P2-PROVENANCE.txt"

      - name: 20 - Close technical status before manifests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          echo "STAGE=FINAL_STATUS" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"

          if [ "${{ job.status }}" = "success" ]; then
            technical_pass=YES
            checkpoint=KSU-GEN1-P2-SUSFS-2.3-DORMANT-FOUNDATION-PASS
          else
            technical_pass=NO
            checkpoint=KSU-GEN1-P2-FAILED
          fi

          {
            echo "JOB_STATUS_AT_TECHNICAL_CLOSE=${{ job.status }}"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "TECHNICAL_PASS=$technical_pass"
            echo "CHECKPOINT=$checkpoint"
            echo "SUSFS_ACTIVE=NO"
            echo "KERNEL_BUILD_PERFORMED=NO"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } > "$GITHUB_WORKSPACE/evidence/98-FINAL-STATUS.txt"

      - name: 21 - Build evidence and restore-kit manifests safely
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          for dir in "$GITHUB_WORKSPACE/evidence" "$GITHUB_WORKSPACE/restore-kit"; do
            [ -d "$dir" ] || continue
            rm -f "$dir/SHA256SUMS" "$dir/EMPTY-DIRECTORY.txt"
            (
              cd "$dir"

              file_count="$(find . -type f ! -name SHA256SUMS ! -name EMPTY-DIRECTORY.txt | wc -l | tr -d ' ')"
              if [ "$file_count" -eq 0 ]; then
                {
                  echo "EMPTY_DIRECTORY_AT_MANIFEST_TIME=YES"
                  echo "REASON=Earlier workflow stage failed before restore-kit creation"
                  echo "RUN_ID=$GITHUB_RUN_ID"
                } > EMPTY-DIRECTORY.txt
              fi

              find . -type f ! -name SHA256SUMS -printf '%P\0' \
                | sort -z \
                | xargs -0 -r sha256sum > SHA256SUMS

              test -s SHA256SUMS
              if grep -Eq '[[:space:]]SHA256SUMS$' SHA256SUMS; then
                echo "ERROR: manifest contains itself" >&2
                exit 1
              fi
              sha256sum -c SHA256SUMS
            )
          done

      - name: 22 - Upload P2 v2 evidence and restore kit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ksu-gen1-p2-veux-5.4.274-susfs-2.3-foundation-v2-${{ github.run_id }}
          path: |
            evidence/
            restore-kit/
          retention-days: 14
          if-no-files-found: error

      - name: 23 - Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# KSU GEN1 P2 v2 - SUSFS 2.3 Dormant Foundation"
            echo
            if [ "${{ job.status }}" = "success" ] \
              && grep -q '^TECHNICAL_PASS=YES$' evidence/98-FINAL-STATUS.txt 2>/dev/null; then
              echo "**PASS**"
              echo
              echo "SUSFS 2.3 source foundation is present but dormant."
              echo "No SUSFS Kconfig enablement, active kernel hooks, ReSukiSU, kernel build, boot image, or flashing was performed."
              echo
              echo '```text'
              cat evidence/15-P2-PROVENANCE.txt
              echo '```'
            else
              echo "**FAIL - repair only the concrete P2 failure before P3.**"
              echo
              echo '```text'
              cat evidence/STAGE.txt 2>/dev/null || true
              cat evidence/98-FINAL-STATUS.txt 2>/dev/null || true
              cat evidence/11-UNEXPECTED-CHANGED-FILES.txt 2>/dev/null || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
