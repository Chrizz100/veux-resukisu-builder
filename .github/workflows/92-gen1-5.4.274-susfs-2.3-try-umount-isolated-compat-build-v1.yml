    - name: Build B W92 VEUX 5.4.274 SUSFS 2.3
      shell: bash
      timeout-minutes: 90
      run: |
        set -euo pipefail
        python3 "$BUILDER_DIR/.w92-run-w88-step.py" \
          "Build B VEUX 5.4.274 updated kernel"

        grep -Fq 'susfs_try_umount' "$OUT_DIR/System.map"
        grep -Fq 'susfs_add_try_umount' "$OUT_DIR/System.map"

        echo "TRY_UMOUNT_BUILD_B_SYMBOLS=PASS" \
          | tee "$ARTIFACT_DIR/27-build-b-try-umount.txt"
    - name: Prove W92 deterministic A B reproducibility
      shell: bash
      run: |
        set -euo pipefail
        python3 "$BUILDER_DIR/.w92-run-w88-step.py" \
          "Prove deterministic A B reproducibility"
    - name: Revalidate ReSukiSU manual hook contracts after SUSFS 2.3
      shell: bash
      run: |
        set -euo pipefail
        python3 "$BUILDER_DIR/.w92-run-w88-step.py" \
          "Validate ReSukiSU manual hook contracts"
    - name: Revalidate protected SUSFS contracts after SUSFS 2.3
      shell: bash
      run: |
        set -euo pipefail
        python3 "$BUILDER_DIR/.w92-run-w88-step.py" \
          "Revalidate protected SUSFS stability contracts"
    - name: Record W92 reproducible image and compare configuration with W91
      shell: bash
      run: |
        set -euo pipefail
        A="$GITHUB_WORKSPACE/w72-build-a"; B="$OUT_DIR"
        for f in "$A/Image" "$A/config" "$A/System.map" "$B/arch/arm64/boot/Image" "$B/.config" "$B/System.map"; do test -s "$f"; done
        A_IMAGE_SHA="$(sha256sum "$A/Image" | awk '{print $1}')"; B_IMAGE_SHA="$(sha256sum "$B/arch/arm64/boot/Image" | awk '{print $1}')"
        A_CONFIG_SHA="$(sha256sum "$A/config" | awk '{print $1}')"; B_CONFIG_SHA="$(sha256sum "$B/.config" | awk '{print $1}')"
        test "$A_IMAGE_SHA" = "$B_IMAGE_SHA"; test "$A_CONFIG_SHA" = "$B_CONFIG_SHA"; test "$A_CONFIG_SHA" = "$W91_CONFIG_SHA256"; test "$A_IMAGE_SHA" != "$W91_IMAGE_SHA256"
        grep -Fq 'susfs_try_umount' "$A/System.map"; grep -Fq 'susfs_add_try_umount' "$A/System.map"; grep -Fq 'susfs_try_umount' "$B/System.map"; grep -Fq 'susfs_add_try_umount' "$B/System.map"
        {
         echo "W92_BUILD_REPRODUCIBILITY=PASS"; echo "W92_IMAGE_SHA256=$A_IMAGE_SHA"; echo "W92_IMAGE_BYTES=$(stat -c '%s' "$A/Image")"; echo "W92_CONFIG_SHA256=$A_CONFIG_SHA"
         echo "W91_IMAGE_SHA256=$W91_IMAGE_SHA256"; echo "W91_CONFIG_SHA256=$W91_CONFIG_SHA256"; echo "W92_IMAGE_DIFFERS_FROM_W91=YES"; echo "W92_CONFIG_IDENTICAL_TO_W91=YES"
         echo "IMAGE_AB_IDENTICAL=YES"; echo "CONFIG_AB_IDENTICAL=YES"; echo "TRY_UMOUNT_BUILD_A_SYMBOLS=PASS"; echo "TRY_UMOUNT_BUILD_B_SYMBOLS=PASS"
        } | tee "$ARTIFACT_DIR/28-w91-vs-w92.txt"
    - name: Promote compact W92 SUSFS 2.3 isolated outputs
      shell: bash
      run: |
        set -Eeuo pipefail
        PHASE="INIT"; ERROR_FILE="$GITHUB_WORKSPACE/.w92-v1-promotion-error"; PASS_FILE="$GITHUB_WORKSPACE/.w92-v1-finalization-pass"; rm -f "$ERROR_FILE" "$PASS_FILE"
        on_error(){ local rc="$?"; printf 'W92_V1_PROMOTION_FAILURE phase=%s line=%s command=%q rc=%s\n' "$PHASE" "${BASH_LINENO[0]:-${LINENO}}" "$BASH_COMMAND" "$rc" | tee "$ERROR_FILE" >&2 || true; exit "$rc"; }; trap on_error ERR
        A="$GITHUB_WORKSPACE/w72-build-a"; STAGE_DIR="$RUNNER_TEMP/w92-v1-stage"
        REPORTS=(21-susfs23-source-auth.txt 21-susfs23-commits.txt 22-susfs23-classification.txt 22-w91-pre-susfs23-audit.txt 23-susfs23-applied-delta.txt 23-susfs23-5.4-adaptation.diff 24-susfs23-final-audit.txt 25-try-umount-config.txt 26-build-a-try-umount.txt 27-build-b-try-umount.txt 28-w91-vs-w92.txt)
        PAYLOAD=(GEN1_W92_Image GEN1_W92_config "${REPORTS[@]}" W92-REPORT.txt W92-FINAL-VERDICT.txt); FINAL_FILES=("${PAYLOAD[@]}" SHA256SUMS.txt)
        validate_fileset(){ local dir="$1" e a; e="$(mktemp)"; a="$(mktemp)"; printf '%s\n' "${FINAL_FILES[@]}"|sort >"$e"; find "$dir" -maxdepth 1 -type f -printf '%f\n'|sort >"$a"; diff -u "$e" "$a"; rm -f "$e" "$a"; }
        PHASE="PRECHECK_IMAGE"; test -s "$A/Image"; PHASE="PRECHECK_CONFIG"; test -s "$A/config"; PHASE="VERIFY_CONFIG_W91"; echo "$W91_CONFIG_SHA256  $A/config"|sha256sum -c -; PHASE="VERIFY_IMAGE_CHANGED"; test "$(sha256sum "$A/Image"|awk '{print $1}')" != "$W91_IMAGE_SHA256"
        for r in "${REPORTS[@]}"; do PHASE="PRECHECK_REPORT:$r"; test -s "$ARTIFACT_DIR/$r"; done
        PHASE="VERIFY_SOURCE_AUTH"; grep -Fxq 'OFFICIAL_SUSFS_2_3_SOURCE_AUTH=PASS' "$ARTIFACT_DIR/21-susfs23-source-auth.txt"; PHASE="VERIFY_CLASSIFICATION"; grep -Fxq 'UNCLASSIFIED_COUNT=0' "$ARTIFACT_DIR/22-susfs23-classification.txt"; PHASE="VERIFY_FINAL_AUDIT"; grep -Fxq 'SUSFS_2_3_FINAL_SEMANTIC_AUDIT=PASS' "$ARTIFACT_DIR/24-susfs23-final-audit.txt"; PHASE="VERIFY_REPRO"; grep -Fxq 'W92_BUILD_REPRODUCIBILITY=PASS' "$ARTIFACT_DIR/28-w91-vs-w92.txt"
        PHASE="STAGE"; rm -rf "$STAGE_DIR"; mkdir -p "$STAGE_DIR"; cp "$A/Image" "$STAGE_DIR/GEN1_W92_Image"; cp "$A/config" "$STAGE_DIR/GEN1_W92_config"; for r in "${REPORTS[@]}"; do cp "$ARTIFACT_DIR/$r" "$STAGE_DIR/$r"; done
        { for r in "${REPORTS[@]}"; do echo "===== $r ====="; cat "$STAGE_DIR/$r"; echo; done; } > "$STAGE_DIR/W92-REPORT.txt"
        W92_IMAGE_SHA="$(sha256sum "$STAGE_DIR/GEN1_W92_Image"|awk '{print $1}')"; W92_CONFIG_SHA="$(sha256sum "$STAGE_DIR/GEN1_W92_config"|awk '{print $1}')"
        cat > "$STAGE_DIR/W92-FINAL-VERDICT.txt" <<EOF
        W92_GEN1_5.4.274_SUSFS_2.3_TRY_UMOUNT=PASS
        OFFICIAL_SUSFS_2_3_SOURCE_AUTH=PASS
        SUSFS_2_2_TO_2_3_COMMIT_COUNT=21
        SUSFS_2_3_COMMIT_CLASSIFICATION=PASS
        SUSFS_2_3_5_4_SEMANTIC_BACKPORT=PASS
        RESUKISU_PIN=$TARGET_REF
        KERNELSU_3_3_WHOLESALE_SYNC=NO
        ZYGOTE_NEXT_LOOKUP_MNT_FIX=PASS
        ROOT_REVOKE_RECHECK=PASS
        UID_EUID_CAPTURE_ORDER_FIX=PASS
        OPEN_REDIRECT_2_3_EQUIVALENT=PASS
        MOUNT_VISIBILITY_STATIC_KEY_EQUIVALENT=PASS
        TRY_UMOUNT=PASS
        TRY_UMOUNT_ZYGOTE_NEXT_DIRECT_CALL=ABSENT_INTENTIONALLY
        MODULE_LOAD_FILTER_INCLUDED=NO
        CONFIG_UNCHANGED_FROM_W91=YES
        W92_IMAGE_SHA256=$W92_IMAGE_SHA
        W92_CONFIG_SHA256=$W92_CONFIG_SHA
        REPRODUCIBILITY=PASS
        BOOT_IMAGE_CREATED=NO
        FLASHABLE_ZIP_CREATED=NO
        NEXT_STAGE=FREEZE_W92_THEN_BUILD_AK3_R2
        EOF
        (cd "$STAGE_DIR"; sha256sum "${PAYLOAD[@]}" > SHA256SUMS.txt; sha256sum -c SHA256SUMS.txt)
        PHASE="VALIDATE_COUNT"; test "$(find "$STAGE_DIR" -maxdepth 1 -type f|wc -l)" -eq "${#FINAL_FILES[@]}"; PHASE="VALIDATE_FILESET"; validate_fileset "$STAGE_DIR"; for f in "${FINAL_FILES[@]}"; do PHASE="NONEMPTY:$f"; test -s "$STAGE_DIR/$f"; done
        PHASE="FINALIZE"; rm -rf "$COMPACT_DIR"; mkdir -p "$COMPACT_DIR"; cp -a "$STAGE_DIR/." "$COMPACT_DIR/"; validate_fileset "$COMPACT_DIR"; (cd "$COMPACT_DIR"; sha256sum -c SHA256SUMS.txt); echo 'W92_V1_FINALIZATION=PASS' > "$PASS_FILE"; PHASE="COMPLETE"; trap - ERR; echo "W92_V1_PROMOTION=PASS"
    - name: Final W92 v1 gate
      shell: bash
      run: |
        set -euo pipefail
        test -s "$GITHUB_WORKSPACE/.w92-v1-finalization-pass"; grep -Fxq 'W92_V1_FINALIZATION=PASS' "$GITHUB_WORKSPACE/.w92-v1-finalization-pass"
        for f in GEN1_W92_Image GEN1_W92_config W92-FINAL-VERDICT.txt SHA256SUMS.txt; do test -s "$COMPACT_DIR/$f"; done
        (cd "$COMPACT_DIR"; sha256sum -c SHA256SUMS.txt); echo "$W91_CONFIG_SHA256  $COMPACT_DIR/GEN1_W92_config"|sha256sum -c -; test "$(sha256sum "$COMPACT_DIR/GEN1_W92_Image"|awk '{print $1}')" != "$W91_IMAGE_SHA256"; test ! -e "$COMPACT_DIR/W92-FAILURE-SUMMARY.txt"
        for line in 'W92_GEN1_5.4.274_SUSFS_2.3_TRY_UMOUNT=PASS' 'OFFICIAL_SUSFS_2_3_SOURCE_AUTH=PASS' 'SUSFS_2_2_TO_2_3_COMMIT_COUNT=21' 'SUSFS_2_3_COMMIT_CLASSIFICATION=PASS' 'SUSFS_2_3_5_4_SEMANTIC_BACKPORT=PASS' 'KERNELSU_3_3_WHOLESALE_SYNC=NO' 'ZYGOTE_NEXT_LOOKUP_MNT_FIX=PASS' 'ROOT_REVOKE_RECHECK=PASS' 'UID_EUID_CAPTURE_ORDER_FIX=PASS' 'TRY_UMOUNT=PASS' 'TRY_UMOUNT_ZYGOTE_NEXT_DIRECT_CALL=ABSENT_INTENTIONALLY' 'MODULE_LOAD_FILTER_INCLUDED=NO' 'CONFIG_UNCHANGED_FROM_W91=YES' 'REPRODUCIBILITY=PASS' 'BOOT_IMAGE_CREATED=NO' 'FLASHABLE_ZIP_CREATED=NO' 'NEXT_STAGE=FREEZE_W92_THEN_BUILD_AK3_R2'; do grep -Fxq "$line" "$COMPACT_DIR/W92-FINAL-VERDICT.txt"; done
        test "$(wc -l < "$COMPACT_DIR/W92-FINAL-VERDICT.txt")" -eq 22; echo "W92_GEN1_5.4.274_SUSFS_2.3_TRY_UMOUNT=PASS"
    - name: Preserve W92 v1 failure summary
      if: failure()
      shell: bash
      run: |
        set -u
        rm -rf "$COMPACT_DIR"; mkdir -p "$COMPACT_DIR"
        {
         echo "W92_RESULT=FAILURE"; echo "WORKFLOW=W92-v1"; echo "TARGET=VEUX_5.4.274"; echo "RESUKISU_PIN=$TARGET_REF"; echo "TARGET_SUSFS=v2.3.0"; echo "TRY_UMOUNT_PRESERVED_FROM_W91=YES"; echo "KERNELSU_3_3_WHOLESALE_SYNC=NO"; echo "W88_W89_W90_W91_BASELINES_UNCHANGED=YES"; echo "BOOT_IMAGE_CREATED=NO"; echo "FLASHING_PERFORMED=NO"
         if [ -s "$GITHUB_WORKSPACE/.w92-v1-promotion-error" ]; then cat "$GITHUB_WORKSPACE/.w92-v1-promotion-error"; else echo "W92_V1_PROMOTION_FAILURE=NOT_REACHED_OR_NO_PROMOTION_ERROR_FILE"; fi
        } > "$COMPACT_DIR/W92-FAILURE-SUMMARY.txt"
        for f in "$ARTIFACT_DIR"/*.txt "$ARTIFACT_DIR"/*.diff; do [ -s "$f" ] && cp "$f" "$COMPACT_DIR/" || true; done
        test -s "$COMPACT_DIR/W92-FAILURE-SUMMARY.txt"; test ! -e "$COMPACT_DIR/GEN1_W92_Image"; test ! -e "$COMPACT_DIR/GEN1_W92_config"; test ! -e "$COMPACT_DIR/W92-FINAL-VERDICT.txt"; test ! -e "$COMPACT_DIR/SHA256SUMS.txt"
    - name: Upload compact W92 v1 artifact
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: GEN1_W92_5.4.274_SUSFS_2.3_TRY_UMOUNT_ISOLATED_v1-${{ github.run_number }}
        path: w92-compact/
        if-no-files-found: error
        compression-level: 9
        retention-days: 90
on:
  workflow_dispatch: null
