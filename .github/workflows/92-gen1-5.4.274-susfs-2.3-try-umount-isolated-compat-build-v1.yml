name: 92 - GEN1 5.4.274 SUSFS 2.3 + TRY_UMOUNT Isolated Compatibility Build v1
permissions:
  contents: read
  actions: read
jobs:
  susfs-23-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ARCH: arm64
      W88_PATH: .github/workflows/88-gen1-5.4.274-resukisu-419e270b-update-repro-build-v3.yml
      RECIPE_PATH: .github/workflows/46C7-final-cumulative-resukisu-susfs-deterministic-cross-run-reference.yml
      W65_PATH: .github/workflows/65-kernelsu-v0.9.5-susfs-2.2.0-cross-run-reproducibility-v1.yml
      RECIPE_JOB: full-build
      RECIPE_STOP_STEP: '27'
      BASE_REF: faccf4c5edc7be37776216e7d43dd3dca0239331
      PREVIOUS_REF: 4a3785025a920e4f52584f14c663eea4850dc919
      TARGET_REF: 419e270b50ad61725185dec74f438b8cb59c6889
      SUCOMPAT_REFACTOR: 75b99e3e2f312377fc9e5d3720324c0caaf1e610
      EXECVEAT_SUPPORT: 9671b9d11e459467d41884c98e1366b13aaae2cc
      OLD_HOOK_COMPAT: cc44ff62d9dc8b84dbd7c3e4d2703f6a6fb844c3
      SUSFS_SYNC: 03b60f260cce36f23efbd26c9c334edfdc9ce7eb
      INPUT_HOOK_STABILITY: 4a3785025a920e4f52584f14c663eea4850dc919
      SELINUX_HIDE_UPDATE: 6f50cba2a3919cfcec9f9061580a04588fb465b7
      WEBVIEW_ZYGOTE_UPDATE: 419e270b50ad61725185dec74f438b8cb59c6889
      BUILDER_DIR: ${{ github.workspace }}/builder-repo
      DRIVER_DIR: ${{ github.workspace }}/w92-driver
      ARTIFACT_DIR: ${{ github.workspace }}/w92-artifact
      PATCH_DIR: ${{ github.workspace }}/w92-patches
      COMPACT_DIR: ${{ github.workspace }}/w92-compact
      OUT_DIR_NAME: out-w92
      KBUILD_BUILD_USER: w68
      KBUILD_BUILD_HOST: veux-w68
      KBUILD_BUILD_TIMESTAMP: Tue Aug 25 00:00:00 UTC 2026
      KBUILD_BUILD_VERSION: '1'
      SOURCE_DATE_EPOCH: '1787616000'
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TRY_UMOUNT_SOURCE_COMMIT: 53aa7a21937c3dde100de6366118b5e49a9861c2
      TRY_UMOUNT_PATCH_PATH: Patches/Patch/susfs_restore_try_umount.patch
      TRY_UMOUNT_PATCH_BLOB_SHA1: d149c87cda0a7cb50293f6b69593c77625db2604
      W88_RUN_ID: '33252124378'
      W88_ARTIFACT_ID: '9715115041'
      W88_ARTIFACT_NAME: GEN1_W88_5.4.274_ReSukiSU_419E270B_COMPACT-1
      W88_ARTIFACT_SHA256: 25ec48457888386430604cab9fb20c91f778ae30672d90d2955bb38ca3fa080c
      W88_IMAGE_SHA256: d0f7abcc526ec63413236fd440cef2d9fb6cc3819ce656b1b49efde7d65cda04
      W88_IMAGE_BYTES: '29843968'
      W88_CONFIG_SHA256: d7cd955abd59da45804acc9c5e450cf8fc953da3e66bbc274212b40ee9a0b372
      SUSFS23_DIR: ${{ github.workspace }}/susfs23-official
      SUSFS23_BRANCH: gki-android12-5.10
      SUSFS22_COMMIT: d4c3914bc2e4b538d562193a65e5a11a0289d6ea
      SUSFS23_COMMIT: fb16b41a65180979f05eac837681c4dd0addffd1
      SUSFS23_EXPECTED_COMMITS: '21'
      W91_IMAGE_SHA256: 3fb447a5767939102079c993fea2e38d05715bb0bc2e4d6ba1538c7f0e3d7f9d
      W91_CONFIG_SHA256: a27c7cdd86bf7e7eb6a5ef515c28fab8d9a19a26b430694e582b339800db62ee
      W91_IMAGE_BYTES: '29843968'
    steps:
    - name: Install W92 dependencies
      shell: bash
      timeout-minutes: 15
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates cpio curl flex git jq \
          libelf-dev libncurses-dev libssl-dev patch python3 python3-pip \
          rsync xz-utils zstd

        python3 -m pip install \
          --disable-pip-version-check \
          --no-input \
          'PyYAML==6.0.2'
    - name: Checkout builder repository
      uses: actions/checkout@v6
      with:
        path: builder-repo
        fetch-depth: 0
    - name: Checkout ReSukiSU 419e270b target
      uses: actions/checkout@v6
      with:
        repository: ReSukiSU/ReSukiSU
        ref: ${{ env.TARGET_REF }}
        path: ReSukiSU-target
        fetch-depth: 0
    - name: Initialize W92 and exact W91 source reconstruction
      shell: bash
      run: |
        set -euo pipefail

        rm -rf \
          "$DRIVER_DIR" \
          "$ARTIFACT_DIR" \
          "$PATCH_DIR" \
          "$COMPACT_DIR" \
          "$GITHUB_WORKSPACE/w72-build-a"

        mkdir -p \
          "$DRIVER_DIR" \
          "$ARTIFACT_DIR" \
          "$PATCH_DIR" \
          "$COMPACT_DIR"

        W88="$BUILDER_DIR/$W88_PATH"
        test -s "$W88"
        test "$(sha256sum "$W88" | awk '{print $1}')" = \
          "2863ba87b06cf0865a2398bf1416c8b0d89685834a85f59b91807e355c6d7de3" || {
            echo "ERROR: W88-v3 workflow content changed; refusing replay" >&2
            sha256sum "$W88" >&2
            exit 1
          }

        cat > "$BUILDER_DIR/.w92-run-w88-step.py" <<'PY'
        import os
        import subprocess
        import sys
        from pathlib import Path
        import yaml

        if len(sys.argv) != 2:
            raise SystemExit("usage: w92-run-w88-step.py <exact-step-name>")

        workflow = Path(os.environ["BUILDER_DIR"]) / os.environ["W88_PATH"]
        doc = yaml.load(workflow.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
        steps = doc["jobs"]["integrate-compile"]["steps"]

        name = sys.argv[1]
        matches = [s for s in steps if s.get("name") == name]
        if len(matches) != 1:
            raise SystemExit(f"expected exactly one W88 step {name!r}, got {len(matches)}")

        script = matches[0].get("run")
        if not script:
            raise SystemExit(f"W88 step {name!r} has no run block")

        print(f"=== REPLAY_W88_STEP: {name} ===", flush=True)
        subprocess.run(
            ["bash", "-euo", "pipefail", "-c", script],
            check=True,
            env=os.environ.copy(),
        )
        PY

        python3 -m py_compile "$BUILDER_DIR/.w92-run-w88-step.py"

        cat > "$ARTIFACT_DIR/00-plan.txt" <<EOF
        W92_GEN1_5.4.274_SUSFS_2.3_TRY_UMOUNT_ISOLATED_TEST
        BASELINE=W91_SOURCE_STATE
        RESUKISU_PIN=$TARGET_REF
        BASE_SUSFS_VERSION=2.2.0
        TARGET_SUSFS_VERSION=2.3.0
        OFFICIAL_SUSFS_BRANCH=$SUSFS23_BRANCH
        OFFICIAL_SUSFS_2_2_COMMIT=$SUSFS22_COMMIT
        OFFICIAL_SUSFS_2_3_COMMIT=$SUSFS23_COMMIT
        TRY_UMOUNT=RETAINED_FROM_W91
        NORMAL_ZYGOTE_TRY_UMOUNT=YES
        ZYGOTE_NEXT_DIRECT_TRY_UMOUNT=NO_INTENTIONALLY
        KERNELSU_3_3_WHOLESALE_SYNC=NO
        RESUKISU_419E270B_PRESERVED=YES
        MODULE_LOAD_FILTER=EXCLUDED
        BOOT_IMAGE_CREATED=NO
        FLASHABLE_ZIP_CREATED=NO
        DEVICE_ACCESSED=NO
        FLASHING_PERFORMED=NO
        EOF
    - name: Replay W88 input authentication
      shell: bash
      run: |
        set -euo pipefail
        python3 "$BUILDER_DIR/.w92-run-w88-step.py" \
          "Authenticate W88 inputs"
    - name: Replay proven W65 staging driver
      shell: bash
      run: |
        set -euo pipefail
        python3 "$BUILDER_DIR/.w92-run-w88-step.py" \
          "Reuse proven W65 staging driver"
    - name: Replay exact 46C7 staging through step 27
      shell: bash
      timeout-minutes: 75
      env:
        W64_RECIPE_PATH: .github/workflows/46C7-final-cumulative-resukisu-susfs-deterministic-cross-run-reference.yml
        W64_RECIPE_JOB: full-build
        W64_RECIPE_STOP_STEP: '27'
        W64_LANE: linux-5_4_274
        W64_SOURCE_PROVEN_NOFAULT_FIX: 'no'
      run: |
        set -euo pipefail
        python3 "$BUILDER_DIR/.w92-run-w88-step.py" \
          "Stage exact 46C7 source through step 27"
    - name: Replay W88 staged tree location
      shell: bash
      run: |
        set -euo pipefail
        python3 "$BUILDER_DIR/.w92-run-w88-step.py" \
          "Locate staged VEUX kernel and ReSukiSU tree"
    - name: Replay W88 pre-update snapshot
      shell: bash
      run: |
        set -euo pipefail
        python3 "$BUILDER_DIR/.w92-run-w88-step.py" \
          "Snapshot pre-update ReSukiSU and SUSFS API"
    - name: Replay W88 selected patch extraction
      shell: bash
      run: |
        set -euo pipefail
        python3 "$BUILDER_DIR/.w92-run-w88-step.py" \
          "Extract selected ReSukiSU kernel patches"
    - name: Replay W88 selected ReSukiSU chain
      shell: bash
      run: |
        set -euo pipefail
        python3 "$BUILDER_DIR/.w92-run-w88-step.py" \
          "Apply selected ReSukiSU kernel chain"
    - name: Replay W88 cumulative 419e270b kernel uapi delta
      shell: bash
      run: |
        set -euo pipefail
        python3 "$BUILDER_DIR/.w92-run-w88-step.py" \
          "Apply cumulative 419e270b kernel uapi delta"
    - name: Replay W88 input hook stability validation
      shell: bash
      run: |
        set -euo pipefail
        python3 "$BUILDER_DIR/.w92-run-w88-step.py" \
          "Validate new input-hook atomic-context stability fix"
    - name: Replay W88 SUSFS process state backport
      shell: bash
      run: |
        set -euo pipefail
        python3 "$BUILDER_DIR/.w92-run-w88-step.py" \
          "Backport latest SUSFS 5.4 process-state API only"
    - name: Audit TRY_UMOUNT prerequisites and snapshot W88-equivalent tree
      shell: bash
      run: |
        set -euo pipefail

        SUSFS_C="$KERNEL_ROOT/fs/susfs.c"
        SUSFS_H="$KERNEL_ROOT/include/linux/susfs.h"
        SUSFS_DEF="$KERNEL_ROOT/include/linux/susfs_def.h"
        KCONFIG="$KSU_ROOT/kernel/Kconfig"
        KERNEL_UMOUNT="$KSU_ROOT/kernel/feature/kernel_umount.c"
        DISPATCH="$KSU_ROOT/kernel/supercall/dispatch.c"
        SETUID="$KSU_ROOT/kernel/hook/setuid_hook.c"

        for f in \
          "$SUSFS_C" \
          "$SUSFS_H" \
          "$SUSFS_DEF" \
          "$KCONFIG" \
          "$KERNEL_UMOUNT" \
          "$DISPATCH" \
          "$SETUID"
        do
          test -s "$f"
        done

        grep -Fq '#define TRY_UMOUNT_DEFAULT 0' "$SUSFS_DEF"
        grep -Fq '#define TRY_UMOUNT_DETACH 1' "$SUSFS_DEF"
        grep -Fq 'CMD_SUSFS_ADD_TRY_UMOUNT' "$SUSFS_DEF"
        grep -Fq 'void try_umount(const char *mnt, int flags)' "$KERNEL_UMOUNT"

        find "$KERNEL_ROOT/fs" "$KERNEL_ROOT/include/linux" "$KSU_ROOT/kernel" \
          -type f -print0 \
          | sort -z \
          | xargs -0 sha256sum \
          > "$ARTIFACT_DIR/17-pre-try-umount-tree.sha256"

        {
          echo "TRY_UMOUNT_PREREQUISITES=PASS"
          echo "TRY_UMOUNT_DEFAULT=0"
          echo "TRY_UMOUNT_DETACH=1"
          echo "CMD_SUSFS_ADD_TRY_UMOUNT_PRESENT=YES"
          echo "RESUKISU_TRY_UMOUNT_EXPORT_PRESENT=YES"
          echo
          echo "=== existing TRY_UMOUNT references before W91 delta ==="
          grep -RniE \
            'CONFIG_KSU_SUSFS_TRY_UMOUNT|susfs_(add_)?try_umount|CMD_SUSFS_ADD_TRY_UMOUNT' \
            "$KERNEL_ROOT/fs" \
            "$KERNEL_ROOT/include/linux" \
            "$KSU_ROOT/kernel" || true
        } | tee "$ARTIFACT_DIR/17-try-umount-prerequisites.txt"
    - name: Restore SUSFS TRY_UMOUNT implementation from pinned nGKI reference
      shell: bash
      run: |
        set -euo pipefail

        RESTORE="$PATCH_DIR/susfs_restore_try_umount.patch"
        RAW_URL="https://raw.githubusercontent.com/cyberc3dr/nGKI_Kernel_Build/${TRY_UMOUNT_SOURCE_COMMIT}/${TRY_UMOUNT_PATCH_PATH}"

        curl --fail --location --retry 4 --retry-all-errors \
          --connect-timeout 20 \
          "$RAW_URL" \
          -o "$RESTORE"

        test -s "$RESTORE"

        python3 - "$RESTORE" "$TRY_UMOUNT_PATCH_BLOB_SHA1" <<'PY'
        import hashlib
        import sys
        from pathlib import Path

        p = Path(sys.argv[1])
        expected = sys.argv[2]
        data = p.read_bytes()
        got = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
        if got != expected:
            raise SystemExit(f"Git blob SHA mismatch: {got} != {expected}")
        print("TRY_UMOUNT_REFERENCE_BLOB_AUTH=PASS")
        print("TRY_UMOUNT_REFERENCE_SHA256=" + hashlib.sha256(data).hexdigest())
        PY

        impl="$(grep -c 'void susfs_add_try_umount' "$KERNEL_ROOT/fs/susfs.c" || true)"
        structs="$(grep -c 'struct st_susfs_try_umount {' "$KERNEL_ROOT/include/linux/susfs.h" || true)"
        proto="$(grep -c 'void susfs_try_umount(uid_t uid);' "$KERNEL_ROOT/include/linux/susfs.h" || true)"

        if [ "$impl" -eq 0 ] && [ "$structs" -eq 0 ] && [ "$proto" -eq 0 ]; then
          git -C "$KERNEL_ROOT" apply --check --verbose "$RESTORE"
          git -C "$KERNEL_ROOT" apply --verbose "$RESTORE"
          restore_state="APPLIED_PINNED_REFERENCE"
        elif [ "$impl" -eq 1 ] && [ "$structs" -eq 1 ] && [ "$proto" -eq 1 ]; then
          restore_state="ALREADY_PRESENT_COMPLETE"
        else
          echo "ERROR: partial TRY_UMOUNT implementation already exists" >&2
          echo "impl=$impl structs=$structs proto=$proto" >&2
          exit 1
        fi

        grep -Fq 'void susfs_add_try_umount' "$KERNEL_ROOT/fs/susfs.c"
        grep -Fq 'void susfs_try_umount(uid_t uid)' "$KERNEL_ROOT/fs/susfs.c"
        grep -Fq 'struct st_susfs_try_umount {' "$KERNEL_ROOT/include/linux/susfs.h"
        grep -Fq 'void susfs_add_try_umount(void __user **user_info);' "$KERNEL_ROOT/include/linux/susfs.h"
        grep -Fq 'void susfs_try_umount(uid_t uid);' "$KERNEL_ROOT/include/linux/susfs.h"
        grep -Fq 'CONFIG_KSU_SUSFS_TRY_UMOUNT' "$KERNEL_ROOT/fs/susfs.c"

        {
          echo "TRY_UMOUNT_KERNEL_IMPLEMENTATION=PASS"
          echo "RESTORE_STATE=$restore_state"
          echo "REFERENCE_COMMIT=$TRY_UMOUNT_SOURCE_COMMIT"
          echo "REFERENCE_BLOB_SHA1=$TRY_UMOUNT_PATCH_BLOB_SHA1"
          echo "REFERENCE_SHA256=$(sha256sum "$RESTORE" | awk '{print $1}')"
        } | tee "$ARTIFACT_DIR/18-try-umount-restore.txt"
    - name: Add ReSukiSU TRY_UMOUNT Kconfig dispatch and safe normal zygote call path
      shell: bash
      run: |
        set -euo pipefail

        export W91_KCONFIG="$KSU_ROOT/kernel/Kconfig"
        export W91_DISPATCH="$KSU_ROOT/kernel/supercall/dispatch.c"
        export W91_UMOUNT="$KSU_ROOT/kernel/feature/kernel_umount.c"
        export W91_SETUID="$KSU_ROOT/kernel/hook/setuid_hook.c"

        python3 - <<'PY'
        import os
        from pathlib import Path

        def one_replace(path, old, new, label):
            s = path.read_text(encoding="utf-8")
            count = s.count(old)
            if count != 1:
                raise SystemExit(f"{label}: expected one anchor, got {count}")
            path.write_text(s.replace(old, new, 1), encoding="utf-8")

        kconfig = Path(os.environ["W91_KCONFIG"])
        dispatch = Path(os.environ["W91_DISPATCH"])
        umount = Path(os.environ["W91_UMOUNT"])
        setuid = Path(os.environ["W91_SETUID"])

        ks = kconfig.read_text(encoding="utf-8")
        if "config KSU_SUSFS_TRY_UMOUNT" not in ks:
            anchor = """config KSU_SUSFS_SPOOF_UNAME
        """
            block = """config KSU_SUSFS_TRY_UMOUNT
            bool "Enable SUSFS custom try_umount list"
            depends on KSU_SUSFS
            default y
            help
                - Allow SUSFS to unmount user-defined mount paths before
                  ReSukiSU's normal KernelSU umount list.
                - Effective only on the normal zygote umount path selected
                  by the existing ReSukiSU policy.
                - zygote_next is intentionally not unmounted here because
                  ReSukiSU handles that path through process-state flags.

        config KSU_SUSFS_SPOOF_UNAME
        """
            one_replace(kconfig, anchor, block, "Kconfig TRY_UMOUNT insertion")

        ds = dispatch.read_text(encoding="utf-8")
        if "case CMD_SUSFS_ADD_TRY_UMOUNT" not in ds:
            anchor = """#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME
            case CMD_SUSFS_SET_UNAME: {
        """
            block = """#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT
            case CMD_SUSFS_ADD_TRY_UMOUNT: {
                susfs_add_try_umount(arg);
                return 0;
            }
        #endif //#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT
        #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME
            case CMD_SUSFS_SET_UNAME: {
        """
            one_replace(dispatch, anchor, block, "SUSFS dispatch insertion")

        us = umount.read_text(encoding="utf-8")
        if "extern void susfs_try_umount(uid_t uid);" not in us:
            anchor = """#ifdef CONFIG_KSU_SUSFS
        extern struct work_struct susfs_extra_works;
        #endif
        """
            block = """#ifdef CONFIG_KSU_SUSFS
        extern struct work_struct susfs_extra_works;
        #ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT
        extern void susfs_try_umount(uid_t uid);
        #endif
        #endif
        """
            one_replace(umount, anchor, block, "TRY_UMOUNT extern insertion")

        us = umount.read_text(encoding="utf-8")
        if "susfs_try_umount(new_uid);" not in us:
            anchor = """    if (!ksu_uid_should_umount(new_uid) && !is_isolated_process(new_uid)) {
                return 0;
            }

            // no need to check zygote here, because we already check it in the setuid call.
        """
            block = """    if (!ksu_uid_should_umount(new_uid) && !is_isolated_process(new_uid)) {
                return 0;
            }

        #ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT
            /*
             * Run SUSFS custom unmounts first.  Keep this in the normal
             * zygote path only; handle_zygote_next_setresuid() explicitly
             * avoids direct unmounts because it is in the init namespace.
             */
            susfs_try_umount(new_uid);
        #endif

            // no need to check zygote here, because we already check it in the setuid call.
        """
            one_replace(umount, anchor, block, "normal zygote TRY_UMOUNT call insertion")

        ss = setuid.read_text(encoding="utf-8")
        if "susfs_try_umount" in ss:
            raise SystemExit(
                "refusing direct TRY_UMOUNT call in setuid_hook.c / zygote_next path"
            )
        PY

        grep -Fq 'config KSU_SUSFS_TRY_UMOUNT' "$KSU_ROOT/kernel/Kconfig"
        grep -Fq 'default y' "$KSU_ROOT/kernel/Kconfig"
        grep -Fq 'case CMD_SUSFS_ADD_TRY_UMOUNT' "$KSU_ROOT/kernel/supercall/dispatch.c"
        grep -Fq 'susfs_add_try_umount(arg);' "$KSU_ROOT/kernel/supercall/dispatch.c"
        grep -Fq 'extern void susfs_try_umount(uid_t uid);' "$KSU_ROOT/kernel/feature/kernel_umount.c"
        test "$(grep -c 'susfs_try_umount(new_uid);' "$KSU_ROOT/kernel/feature/kernel_umount.c")" -eq 1

        if grep -Fq 'susfs_try_umount' "$KSU_ROOT/kernel/hook/setuid_hook.c"; then
          echo "ERROR: direct TRY_UMOUNT leaked into zygote_next setuid hook" >&2
          exit 1
        fi

        {
          echo "TRY_UMOUNT_KCONFIG=PASS"
          echo "TRY_UMOUNT_USERSPACE_DISPATCH=PASS"
          echo "TRY_UMOUNT_NORMAL_ZYGOTE_CALL_PATH=PASS"
          echo "TRY_UMOUNT_ZYGOTE_NEXT_DIRECT_CALL=ABSENT_INTENTIONALLY"
          echo "NORMAL_ZYGOTE_ORDER=CUSTOM_SUSFS_BEFORE_RESUKISU_DEFAULT_LIST"
        } | tee "$ARTIFACT_DIR/19-try-umount-integration.txt"
    - name: Audit W91 delta scope before compile
      shell: bash
      run: |
        set -euo pipefail

        for required in \
          "$KERNEL_ROOT/fs/susfs.c" \
          "$KERNEL_ROOT/include/linux/susfs.h" \
          "$KSU_ROOT/kernel/Kconfig" \
          "$KSU_ROOT/kernel/supercall/dispatch.c" \
          "$KSU_ROOT/kernel/feature/kernel_umount.c"
        do
          test -s "$required"
        done

        if find "$KSU_ROOT/kernel" -type f -name '*module_load_filter*' | grep -q .; then
          echo "ERROR: excluded module_load_filter unexpectedly present" >&2
          exit 1
        fi

        grep -Fq 'synchronize_srcu' "$KERNEL_ROOT/fs/susfs.c"
        grep -Eq 'SUSFS|susfs' "$KERNEL_ROOT/fs/proc/task_mmu.c"

        {
          echo "W91_DELTA_SCOPE_AUDIT=PASS"
          echo "EXPECTED_MODIFIED_FILES:"
          echo "fs/susfs.c"
          echo "include/linux/susfs.h"
          echo "KernelSU/kernel/Kconfig"
          echo "KernelSU/kernel/supercall/dispatch.c"
          echo "KernelSU/kernel/feature/kernel_umount.c"
          echo
          echo "PROTECTED_CONTRACTS:"
          echo "OPEN_REDIRECT_SRCU=PASS"
          echo "PROC_MAPS_SUSFS=PASS"
          echo "MODULE_LOAD_FILTER_INCLUDED=NO"
          echo "ZYGOTE_NEXT_DIRECT_TRY_UMOUNT=NO"
        } | tee "$ARTIFACT_DIR/20-w91-delta-scope.txt"
    - name: Authenticate official SUSFS 2.3 source and 21-commit delta
      shell: bash
      timeout-minutes: 15
      run: |
        set -euo pipefail
        rm -rf "$SUSFS23_DIR"
        mkdir -p "$SUSFS23_DIR"
        git -C "$SUSFS23_DIR" init -q
        git -C "$SUSFS23_DIR" remote add origin https://gitlab.com/simonpunk/susfs4ksu.git
        ok=0
        for attempt in 1 2 3; do
          if git -C "$SUSFS23_DIR" fetch --no-tags --depth=100 origin "$SUSFS23_BRANCH"; then
            ok=1; break
          fi
          echo "SUSFS23_FETCH_ATTEMPT_${attempt}=FAILED" >&2
          sleep $((attempt * 5))
        done
        test "$ok" -eq 1

        git -C "$SUSFS23_DIR" cat-file -e "$SUSFS22_COMMIT^{commit}"
        git -C "$SUSFS23_DIR" cat-file -e "$SUSFS23_COMMIT^{commit}"
        git -C "$SUSFS23_DIR" merge-base --is-ancestor "$SUSFS22_COMMIT" "$SUSFS23_COMMIT"
        test "$(git -C "$SUSFS23_DIR" rev-list --count "$SUSFS22_COMMIT..$SUSFS23_COMMIT")" = "$SUSFS23_EXPECTED_COMMITS"
        git -C "$SUSFS23_DIR" checkout -q --detach "$SUSFS23_COMMIT"
