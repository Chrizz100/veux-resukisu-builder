    - name: Apply missing SUSFS 2.3 semantics to 5.4.274 and ReSukiSU 419e270b
      shell: bash
      run: |
        set -euo pipefail
        export W92_NS="$KERNEL_ROOT/fs/namespace.c"
        export W92_SUSFS_H="$KERNEL_ROOT/include/linux/susfs.h"
        export W92_SUCOMPAT="$KSU_ROOT/kernel/feature/sucompat.c"
        export W92_SETUID="$KSU_ROOT/kernel/hook/setuid_hook.c"
        python3 - <<'PY'
        import os,re
        from pathlib import Path
        ns=Path(os.environ['W92_NS']); hdr=Path(os.environ['W92_SUSFS_H']); su=Path(os.environ['W92_SUCOMPAT']); setuid=Path(os.environ['W92_SETUID'])
        status=[]
        # zygote_next inherited-init-namespace lookup fix
        s=ns.read_text()
        if 'susfs_is_current_proc_umounted_for_zygote_next()' in s:
            status.append('ZYGOTE_NEXT_LOOKUP_MNT_FIX=ALREADY_PRESENT')
        else:
            pat=re.compile(r'(struct\s+mount\s+\*__lookup_mnt\s*\(struct\s+vfsmount\s+\*mnt,\s*struct\s+dentry\s+\*dentry\)\s*\{\s*struct\s+hlist_head\s+\*head\s*=\s*m_hash\(mnt,\s*dentry\);\s*struct\s+mount\s+\*p;\s*)',re.S)
            m=pat.search(s)
            if not m: raise SystemExit('cannot locate 5.4 __lookup_mnt anchor')
            block="""\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\t/* SUSFS 2.3: zygote_next inherits init mount namespace; never unmount here. */\n\tif (susfs_is_current_proc_umounted_for_zygote_next()) {\n\t\thlist_for_each_entry_rcu(p, head, mnt_hash)\n\t\t\tif (p->mnt_id < DEFAULT_KSU_MNT_ID &&\n\t\t\t    &p->mnt_parent->mnt == mnt &&\n\t\t\t    p->mnt_mountpoint == dentry)\n\t\t\t\treturn p;\n\t\treturn NULL;\n\t}\n#endif // CONFIG_KSU_SUSFS_SUS_MOUNT\n\n"""
            ns.write_text(s[:m.end()]+block+s[m.end():]); status.append('ZYGOTE_NEXT_LOOKUP_MNT_FIX=APPLIED')
        # helper to extract a C function body
        def body_span(text,pattern):
            m=re.search(pattern,text)
            if not m: raise SystemExit('function missing: '+pattern)
            i=m.end(); d=1
            while i<len(text) and d:
                d += (text[i]=='{')-(text[i]=='}'); i+=1
            if d: raise SystemExit('unbalanced function: '+pattern)
            return m.end(),i-1
        # uid/euid capture before escape
        s=su.read_text(); a,b=body_span(s,r'static inline int do_ksu_handle_execveat_sucompat\s*\([^)]*\)\s*\{'); body=s[a:b]
        cap='pending_sucompat = ksu_sulog_capture_sucompat_manual(filename, *argv, GFP_KERNEL);'; esc='escape_with_root_profile();'
        if cap not in body or esc not in body: raise SystemExit('uid/euid anchors missing')
        if body.index(cap)>body.index(esc):
            old='    escape_with_root_profile();\n\n    '+cap; new='    '+cap+'\n\n    escape_with_root_profile();'
            if body.count(old)!=1: raise SystemExit('uid/euid exact reorder anchor count != 1')
            body=body.replace(old,new,1); s=s[:a]+body+s[b:]; su.write_text(s); status.append('UID_EUID_CAPTURE_ORDER_FIX=APPLIED')
        else: status.append('UID_EUID_CAPTURE_ORDER_FIX=ALREADY_PRESENT')
        # fresh allowlist recheck after execveat init
        s=su.read_text(); a,b=body_span(s,r'int ksu_handle_execve\s*\([^)]*\)\s*\{'); body=s[a:b]
        anchor='    ksu_handle_execveat_init(filename, envp);\n'; marker='SUSFS 2.3: fresh root-access recheck'
        if marker not in body:
            if body.count(anchor)!=1: raise SystemExit('root revoke anchor count != 1')
            check="""\n    /* SUSFS 2.3: fresh root-access recheck after init handling. */\n    if (!ksu_is_allow_uid_for_current(ksu_get_uid_t(current_uid()))) {\n        return 0;\n    }\n"""
            body=body.replace(anchor,anchor+check,1); s=s[:a]+body+s[b:]; su.write_text(s); status.append('ROOT_REVOKE_RECHECK=APPLIED')
        else: status.append('ROOT_REVOKE_RECHECK=ALREADY_PRESENT')
        # version only after semantics
        s=hdr.read_text()
        if '#define SUSFS_VERSION "v2.3.0"' not in s:
            old='#define SUSFS_VERSION "v2.2.0"'
            if s.count(old)!=1: raise SystemExit('SUSFS version anchor count != 1')
            hdr.write_text(s.replace(old,'#define SUSFS_VERSION "v2.3.0"',1)); status.append('SUSFS_VERSION_BUMP=APPLIED')
        else: status.append('SUSFS_VERSION_BUMP=ALREADY_PRESENT')
        if 'susfs_try_umount' in setuid.read_text(): raise SystemExit('direct TRY_UMOUNT leaked into zygote_next/setuid path')
        Path(os.environ['ARTIFACT_DIR']+'/23-susfs23-applied-delta.txt').write_text('\n'.join(status)+'\nSUSFS_2_3_5_4_ADAPTATION=PASS\n')
        PY
        {
         diff -u "$ARTIFACT_DIR/w91-before-susfs23/namespace.c" "$KERNEL_ROOT/fs/namespace.c" || true
         diff -u "$ARTIFACT_DIR/w91-before-susfs23/susfs.h" "$KERNEL_ROOT/include/linux/susfs.h" || true
         diff -u "$ARTIFACT_DIR/w91-before-susfs23/sucompat.c" "$KSU_ROOT/kernel/feature/sucompat.c" || true
        } > "$ARTIFACT_DIR/23-susfs23-5.4-adaptation.diff"
        test -s "$ARTIFACT_DIR/23-susfs23-5.4-adaptation.diff"
    - name: Validate complete SUSFS 2.3 semantic backport and protected W91 contracts
