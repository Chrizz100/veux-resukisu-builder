        b=body(r'int ksu_handle_execve\s*\([^)]*\)\s*\{'); init='ksu_handle_execveat_init(filename, envp);'; marker='SUSFS 2.3: fresh root-access recheck'
        if init not in b or marker not in b or b.index(marker)<b.index(init): raise SystemExit('fresh allowlist recheck missing')
        print('RESUKISU_SUSFS23_SUCOMPAT_FIXES=PASS')
        PY
        grep -Fq 'config KSU_SUSFS_TRY_UMOUNT' "$KSU_ROOT/kernel/Kconfig"; grep -Fq 'case CMD_SUSFS_ADD_TRY_UMOUNT' "$KSU_ROOT/kernel/supercall/dispatch.c"; test "$(grep -c 'susfs_try_umount(new_uid);' "$UMOUNT")" -eq 1
