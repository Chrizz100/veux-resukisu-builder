          'a029a5189aa63b47f20c901557933d3b8b3a5db1':'PINNED_RESUKISU_NOT_WHOLESALE_IMPORTED',
          'e5c00dc9ffd6f04ad6025f09d67e7db760b6d55b':'APPLY_5_4_NAMESPACE_LOOKUP_MNT',
          '44d9fed948b6d21c25ace142081418690f568dd3':'ALREADY_PRESENT_EQUIVALENT_W88_ZYGOTE_NEXT_PROC_UMOUNTED',
          'a587763bf4c5fa358793f368abff9186c1111b5c':'PINNED_RESUKISU_NOT_WHOLESALE_IMPORTED',
          '27ee8466fc5f151f987ea8e0ad38ba16f180bacf':'ALREADY_PRESENT_EQUIVALENT_RESUKISU_ATOMIC_CONTEXT',
          '46e4c5a1a28ad97e0537496b5585bf7a5f2355e4':'PINNED_RESUKISU_NOT_WHOLESALE_IMPORTED',
          'fb16b41a65180979f05eac837681c4dd0addffd1':'APPLY_VERSION_AFTER_SEMANTIC_GATES',
        }
        rows=[]; bad=[]; seen=set()
        for line in lines:
            sha,date,subject=line.split('|',2); status=expected.get(sha,'UNCLASSIFIED'); rows.append((sha,date,status,subject)); seen.add(sha)
