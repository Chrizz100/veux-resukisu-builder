        test "${#changed[@]}" -gt 0
        printf '%s\n' "${changed[@]}" > "$GITHUB_WORKSPACE/evidence/11-P2-CHANGED-FILES.txt"

        # v1 incorrectly expected the replacement of the tracked legacy
        # drivers/kernelsu directory by one symlink to appear as one Git path.
