        for forbidden in \
          fs/stat.c \
          fs/open.c \
          fs/namei.c \
          fs/namespace.c \
          fs/proc/task_mmu.c \
          fs/proc/base.c \
          fs/proc/fd.c \
          fs/proc_namespace.c \
          kernel/reboot.c
