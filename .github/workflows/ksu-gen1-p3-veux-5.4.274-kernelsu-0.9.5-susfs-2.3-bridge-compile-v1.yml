        # validates the semantic scope: the complete drivers/kernelsu subtree
        # is allowed as the P1 replacement footprint; outside that subtree only
        # the four dormant SUSFS foundation files are allowed.
        : > "$GITHUB_WORKSPACE/evidence/11-UNEXPECTED-CHANGED-FILES.txt"
