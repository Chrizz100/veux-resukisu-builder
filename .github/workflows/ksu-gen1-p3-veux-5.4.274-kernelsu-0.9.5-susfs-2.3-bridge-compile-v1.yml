    - name: 18 - Apply minimal KernelSU 0.9.5 SUSFS core bridge
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P3_BRIDGE" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
        cd "$GITHUB_WORKSPACE/kernel"

        test "$(git rev-parse HEAD)" = "$EXPECTED_P2_OUTER_COMMIT"
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P2_OUTER_TREE"
        test -z "$(git status --porcelain)"
        test -z "$(git -C KernelSU status --porcelain)"

        python3 - <<'PY'
        from pathlib import Path

        # 1) Add only the top-level SUSFS switch. Feature sub-options remain absent in P3.
        k = Path("KernelSU/kernel/Kconfig")
        text = k.read_text(encoding="utf-8")
        if "config KSU_SUSFS\n" in text:
            raise SystemExit("unexpected pre-existing KSU_SUSFS Kconfig")
        anchor = "\nendmenu\n"
        if text.count(anchor) != 1:
            raise SystemExit("KernelSU Kconfig endmenu anchor mismatch")
        block = r'''

        config KSU_SUSFS
        	bool "KernelSU addon - SUSFS 2.3 core"
        	depends on KSU
        	default n
        	help
        	  Enable the controlled SUSFS 2.3 core compile bridge.
        	  P3 intentionally leaves all invasive SUSFS feature sub-options and
        	  filesystem/proc hook integrations disabled.
        '''
        k.write_text(text.replace(anchor, block + anchor, 1), encoding="utf-8")

        # 2) Initialize the SUSFS core from official KernelSU 0.9.5 without importing
        # the broad upstream KernelSU patch.
        p = Path("KernelSU/kernel/ksu.c")
        text = p.read_text(encoding="utf-8")
        include_anchor = '#include "ksu.h"\n'
        include_repl = '#include "ksu.h"\n\n#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif\n'
        if text.count(include_anchor) != 1:
            raise SystemExit("ksu.c include anchor mismatch")
        text = text.replace(include_anchor, include_repl, 1)
        init_anchor = "\tksu_core_init();\n"
        init_repl = "\tksu_core_init();\n\n#ifdef CONFIG_KSU_SUSFS\n\tsusfs_init();\n#endif\n"
        if text.count(init_anchor) != 1:
            raise SystemExit("ksu.c init anchor mismatch")
        text = text.replace(init_anchor, init_repl, 1)
        p.write_text(text, encoding="utf-8")

        # 3) Bridge the SUSFS domain query onto the exact 0.9.5 SELinux helper.
        h = Path("KernelSU/kernel/selinux/selinux.h")
        text = h.read_text(encoding="utf-8")
        anchor = "bool is_ksu_domain();\n"
        if text.count(anchor) != 1:
            raise SystemExit("selinux.h is_ksu_domain anchor mismatch")
        h.write_text(text.replace(anchor, anchor + "bool susfs_is_current_ksu_domain();\n", 1), encoding="utf-8")

        c = Path("KernelSU/kernel/selinux/selinux.c")
        text = c.read_text(encoding="utf-8")
        anchor = "bool is_zygote(void *sec)\n"
        bridge = "bool susfs_is_current_ksu_domain(void)\n{\n\treturn is_ksu_domain();\n}\n\n"
        if text.count(anchor) != 1:
            raise SystemExit("selinux.c is_zygote anchor mismatch")
        c.write_text(text.replace(anchor, bridge + anchor, 1), encoding="utf-8")

        # 4) Adapt only the SUSFS core's unconditional API assumptions to official
        # KernelSU 0.9.5 and Linux 5.4. Feature-specific hooks remain compiled out.
        s = Path("fs/susfs.c")
        text = s.read_text(encoding="utf-8")
        old = (
            "extern bool susfs_is_current_ksu_domain(void);\n"
            "extern void setup_selinux(const char *domain, struct cred *cred);\n"
            "extern struct cred *ksu_cred;\n"
        )
        new = (
            "extern bool susfs_is_current_ksu_domain(void);\n"
            "extern void setup_selinux(const char *domain);\n"
            "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
            "extern struct cred *ksu_cred;\n"
            "#endif\n"
        )
        if text.count(old) != 1:
            raise SystemExit("susfs.c KernelSU API declaration anchor mismatch")
        text = text.replace(old, new, 1)

        old = '\tsetup_selinux("u:r:ksu:s0", cred);\n\tcommit_creds(cred);\n'
        new = '\tcommit_creds(cred);\n\tsetup_selinux("u:r:su:s0");\n'
        if text.count(old) != 1:
            raise SystemExit("susfs.c setup_selinux call anchor mismatch")
        text = text.replace(old, new, 1)

        old = (
            "static void susfs_run_extra_works(struct work_struct *work) {\n"
            "\tif (!ksu_cred)\n"
            "\t\treturn;\n"
            "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
            "\tsusfs_run_sus_path_loop();\n"
            "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
            "}\n"
        )
        new = (
            "static void susfs_run_extra_works(struct work_struct *work) {\n"
            "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
            "\tif (!ksu_cred)\n"
            "\t\treturn;\n"
            "\tsusfs_run_sus_path_loop();\n"
            "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
            "}\n"
        )
        if text.count(old) != 1:
            raise SystemExit("susfs.c ksu_cred guard anchor mismatch")
        text = text.replace(old, new, 1)

        # Linux 5.4 uses fsnotify_ops.handle_event, not the newer handle_inode_event API.
        old = r'''static int susfs_handle_sdcard_inode_event(struct fsnotify_mark *mark, u32 mask,
        											struct inode *inode, struct inode *dir,
        											const struct qstr *file_name, u32 cookie)
        {
        '''
        new = r'''static int susfs_handle_sdcard_inode_event(struct fsnotify_group *group,
        											struct inode *inode, u32 mask,
        											const void *data, int data_type,
        											const struct qstr *file_name, u32 cookie,
        											struct fsnotify_iter_info *iter_info)
        {
        '''
        if text.count(old) != 1:
            raise SystemExit("susfs.c fsnotify handler signature anchor mismatch")
        text = text.replace(old, new, 1)
        old = "static const struct fsnotify_ops fsnotify_ops = {\n\t.handle_inode_event = susfs_handle_sdcard_inode_event,\n};\n"
        new = "static const struct fsnotify_ops fsnotify_ops = {\n\t.handle_event = susfs_handle_sdcard_inode_event,\n};\n"
        if text.count(old) != 1:
            raise SystemExit("susfs.c fsnotify_ops anchor mismatch")
        text = text.replace(old, new, 1)
        s.write_text(text, encoding="utf-8")
        PY

        grep -Fq 'config KSU_SUSFS' KernelSU/kernel/Kconfig
        grep -Fq 'default n' KernelSU/kernel/Kconfig
        grep -Fq '#include <linux/susfs.h>' KernelSU/kernel/ksu.c
        grep -Fq 'susfs_init();' KernelSU/kernel/ksu.c
        grep -Fq 'bool susfs_is_current_ksu_domain(void)' KernelSU/kernel/selinux/selinux.c
        grep -Fq 'return is_ksu_domain();' KernelSU/kernel/selinux/selinux.c
        grep -Fq 'extern void setup_selinux(const char *domain);' fs/susfs.c
        grep -Fq 'setup_selinux("u:r:su:s0");' fs/susfs.c
        grep -Fq '.handle_event = susfs_handle_sdcard_inode_event' fs/susfs.c
        ! grep -Fq '.handle_inode_event = susfs_handle_sdcard_inode_event' fs/susfs.c

        {
          echo "P3_TOP_LEVEL_KCONFIG_BRIDGE=PASS"
          echo "P3_KSU_INIT_BRIDGE=PASS"
          echo "P3_KSU_DOMAIN_QUERY_BRIDGE=PASS"
          echo "P3_KSU_0_9_5_SETUP_SELINUX_ADAPTER=PASS"
          echo "P3_KSU_CRED_REFERENCE_GATED_BY_SUS_PATH=PASS"
          echo "P3_LINUX_5_4_FSNOTIFY_ADAPTER=PASS"
          echo "P3_BROAD_UPSTREAM_KSU_PATCH_APPLIED=NO"
        } > "$GITHUB_WORKSPACE/evidence/18-P3-BRIDGE.txt"
