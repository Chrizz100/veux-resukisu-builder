        rm -rf "$root" "$archive"
        mkdir -p "$root"
        url="${TOOLCHAIN_REPO}/+archive/${TOOLCHAIN_COMMIT}/${TOOLCHAIN_DIR}.tar.gz"

        curl --fail --location --retry 4 --retry-delay 2 --retry-all-errors \
          -H 'Cache-Control: no-cache' "$url" -o "$archive"
        test -s "$archive"
        tar -xzf "$archive" -C "$root"
        test -x "$root/bin/clang"
        test -x "$root/bin/ld.lld"
        test -x "$root/bin/llvm-nm"

        python3 - "$root" "$GITHUB_WORKSPACE/evidence/20-TOOLCHAIN-TREE.tsv" <<'PY'
        import hashlib
        import os
        import stat
        import sys
        from pathlib import Path
        root = Path(sys.argv[1]).resolve()
        out = Path(sys.argv[2])
        rows = []
        for path in sorted(root.rglob("*"), key=lambda p: p.relative_to(root).as_posix()):
            rel = path.relative_to(root).as_posix()
            st = path.lstat()
            mode = stat.S_IMODE(st.st_mode)
            if path.is_symlink():
                rows.append(f"L\t{mode:04o}\t{rel}\t{os.readlink(path)}")
            elif path.is_dir():
                rows.append(f"D\t{mode:04o}\t{rel}")
            elif path.is_file():
                h = hashlib.sha256()
                with path.open("rb") as f:
                    for chunk in iter(lambda: f.read(1024 * 1024), b""):
                        h.update(chunk)
                rows.append(f"F\t{mode:04o}\t{rel}\t{st.st_size}\t{h.hexdigest()}")
            else:
                rows.append(f"O\t{mode:04o}\t{rel}")
        out.write_text("\n".join(rows) + "\n", encoding="utf-8")
        PY

        tree_sha="$(sha256sum "$GITHUB_WORKSPACE/evidence/20-TOOLCHAIN-TREE.tsv" | awk '{print $1}')"
        clang_sha="$(sha256sum "$root/bin/clang" | awk '{print $1}')"
        lld_sha="$(sha256sum "$root/bin/ld.lld" | awk '{print $1}')"
        test "$tree_sha" = "$EXPECTED_TOOLCHAIN_TREE_SHA256"
