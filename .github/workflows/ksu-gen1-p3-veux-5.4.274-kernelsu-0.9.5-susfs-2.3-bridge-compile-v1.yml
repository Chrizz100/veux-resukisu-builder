        "$root/bin/ld.lld" --version > "$GITHUB_WORKSPACE/evidence/20-LLD-VERSION.txt"
        {
          echo "TOOLCHAIN_COMMIT=$TOOLCHAIN_COMMIT"
          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR"
          echo "TOOLCHAIN_TREE_SHA256=$tree_sha"
          echo "CLANG_SHA256=$clang_sha"
          echo "LLD_SHA256=$lld_sha"
          echo "RAW_ARCHIVE_SHA_IS_IDENTITY_GATE=NO"
          echo "PINNED_TOOLCHAIN_IDENTITY=PASS"
        } > "$GITHUB_WORKSPACE/evidence/20-TOOLCHAIN-IDENTITY.txt"

        echo "$root/bin" >> "$GITHUB_PATH"
        echo "KCFLAGS=-D__ANDROID_COMMON_KERNEL__" >> "$GITHUB_ENV"
    - name: 21 - Configure SUSFS core-only compile boundary
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P3_CONFIG" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
        cd "$GITHUB_WORKSPACE/kernel"
        rm -rf out-p3

        make -s O=out-p3 ARCH=arm64 LLVM=1 veux_defconfig
        test -s out-p3/.config

        scripts/config --file out-p3/.config \
          -e KSU \
          -e KSU_SUSFS \
          -d MODULES \
          -d KPROBES \
          -d KPROBE_EVENTS

        make -s O=out-p3 ARCH=arm64 LLVM=1 olddefconfig

        grep -Fxq 'CONFIG_KSU=y' out-p3/.config
        grep -Fxq 'CONFIG_KSU_SUSFS=y' out-p3/.config
        grep -Fxq 'CONFIG_OVERLAY_FS=y' out-p3/.config
        grep -Fxq 'CONFIG_HAVE_KPROBES=y' out-p3/.config
        ! grep -Eq '^CONFIG_MODULES=y$' out-p3/.config
        ! grep -Eq '^CONFIG_KPROBES=y$' out-p3/.config
        if grep -Eq '^CONFIG_KSU_SUSFS_[A-Z0-9_]+=y$' out-p3/.config; then
          echo "Unexpected SUSFS feature sub-option enabled in P3" >&2
          grep -E '^CONFIG_KSU_SUSFS_[A-Z0-9_]+=y$' out-p3/.config >&2
          exit 1
        fi

        grep -Fq 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
        sha256sum out-p3/.config > "$GITHUB_WORKSPACE/evidence/21-P3-CONFIG.sha256"
        {
          echo "CONFIG_KSU=y"
          echo "CONFIG_KSU_SUSFS=y"
          echo "SUSFS_FEATURE_SUBOPTIONS_ENABLED=0"
          echo "CONFIG_MODULES=y=NO"
          echo "CONFIG_KPROBES=y=NO"
          echo "CONFIG_HAVE_KPROBES=y=YES"
          echo "P3_CORE_ONLY_CONFIG_GATE=PASS"
          echo "CONFIG_SHA256=$(sha256sum out-p3/.config | awk '{print $1}')"
        } > "$GITHUB_WORKSPACE/evidence/21-P3-CONFIG-GATE.txt"
    - name: 22 - Compile SUSFS object boundary first
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=SUSFS_OBJECT_COMPILE" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
        cd "$GITHUB_WORKSPACE/kernel"

        set +e
        make -j"$(nproc)" O=out-p3 ARCH=arm64 LLVM=1 KCFLAGS="$KCFLAGS" fs/susfs.o \
          2>&1 | tee "$GITHUB_WORKSPACE/evidence/22-SUSFS-OBJECT-COMPILE.log"
        rc=${PIPESTATUS[0]}
        set -e
        {
          echo "SUSFS_OBJECT_COMPILE_EXIT_CODE=$rc"
          if [ "$rc" -eq 0 ]; then
            echo "SUSFS_OBJECT_COMPILE=PASS"
          else
            echo "SUSFS_OBJECT_COMPILE=FAIL"
          fi
        } > "$GITHUB_WORKSPACE/evidence/22-SUSFS-OBJECT-COMPILE.txt"
        test "$rc" -eq 0
        test -s out-p3/fs/susfs.o

        llvm-nm -u out-p3/fs/susfs.o | LC_ALL=C sort -u > "$GITHUB_WORKSPACE/evidence/22-SUSFS-OBJECT-UNDEFINED-SYMBOLS.txt"
        llvm-nm out-p3/fs/susfs.o | grep -E ' (susfs_init|susfs_show_version|susfs_get_enabled_features)$' \
          > "$GITHUB_WORKSPACE/evidence/22-SUSFS-OBJECT-KEY-SYMBOLS.txt"
        test "$(wc -l < "$GITHUB_WORKSPACE/evidence/22-SUSFS-OBJECT-KEY-SYMBOLS.txt" | tr -d ' ')" -eq 3
    - name: 23 - Compile full Image and dtbs with SUSFS core linked
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=IMAGE_DTBS_COMPILE" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
        cd "$GITHUB_WORKSPACE/kernel"

        set +e
        make -j"$(nproc)" O=out-p3 ARCH=arm64 LLVM=1 KCFLAGS="$KCFLAGS" Image dtbs \
          2>&1 | tee "$GITHUB_WORKSPACE/evidence/23-IMAGE-DTBS-COMPILE.log"
        rc=${PIPESTATUS[0]}
        set -e
        {
          echo "IMAGE_DTBS_COMPILE_EXIT_CODE=$rc"
          if [ "$rc" -eq 0 ]; then
            echo "IMAGE_DTBS_COMPILE=PASS"
          else
            echo "IMAGE_DTBS_COMPILE=FAIL"
          fi
        } > "$GITHUB_WORKSPACE/evidence/23-IMAGE-DTBS-COMPILE.txt"
        test "$rc" -eq 0

        image=out-p3/arch/arm64/boot/Image
        dtb=out-p3/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb
        test -s "$image"
        test -s "$dtb"
        test -s out-p3/System.map
        test -s out-p3/vmlinux

        cp "$image" "$GITHUB_WORKSPACE/build-artifacts/Image"
        cp "$dtb" "$GITHUB_WORKSPACE/build-artifacts/veux.dtb"
        cp out-p3/.config "$GITHUB_WORKSPACE/build-artifacts/config"
        cp out-p3/System.map "$GITHUB_WORKSPACE/build-artifacts/System.map"

        {
          echo "KERNEL_VERSION=$(make -s kernelversion)"
          echo "IMAGE_BYTES=$(stat -c '%s' "$image")"
          echo "IMAGE_SHA256=$(sha256sum "$image" | awk '{print $1}')"
          echo "VEUX_DTB_BYTES=$(stat -c '%s' "$dtb")"
          echo "VEUX_DTB_SHA256=$(sha256sum "$dtb" | awk '{print $1}')"
          echo "VMLINUX_SHA256=$(sha256sum out-p3/vmlinux | awk '{print $1}')"
          echo "SYSTEM_MAP_SHA256=$(sha256sum out-p3/System.map | awk '{print $1}')"
          echo "CONFIG_SHA256=$(sha256sum out-p3/.config | awk '{print $1}')"
          echo "P3_IMAGE_DTBS_BUILD=PASS"
        } > "$GITHUB_WORKSPACE/evidence/23-P3-BUILD-IDENTITY.txt"
    - name: 24 - Audit linked SUSFS/KSU symbols and prove invasive features absent
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=LINKED_SYMBOL_AUDIT" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
        cd "$GITHUB_WORKSPACE/kernel"
        map=out-p3/System.map

        grep -E ' (kernelsu_init|ksu_handle_execveat|ksu_handle_faccessat|ksu_handle_stat|susfs_init|susfs_show_version|susfs_get_enabled_features|susfs_is_current_ksu_domain)$' "$map" \
          | LC_ALL=C sort -u > "$GITHUB_WORKSPACE/evidence/24-LINKED-KEY-SYMBOLS.txt"

        for sym in \
          kernelsu_init \
          ksu_handle_execveat \
          ksu_handle_faccessat \
          ksu_handle_stat \
          susfs_init \
          susfs_show_version \
          susfs_get_enabled_features \
          susfs_is_current_ksu_domain
        do
          grep -Eq "[[:space:]]${sym}$" "$map"
        done

        # These are feature-suboption implementations and must remain compiled out in P3.
        : > "$GITHUB_WORKSPACE/evidence/24-UNEXPECTED-FEATURE-SYMBOLS.txt"
        for sym in \
          susfs_add_sus_path \
          susfs_add_sus_path_loop \
          susfs_add_sus_kstat \
          susfs_update_sus_kstat \
          susfs_set_uname \
          susfs_add_open_redirect \
          susfs_open_redirect_spoof_do_sys_openat \
          susfs_add_sus_map
        do
          if grep -Eq "[[:space:]]${sym}$" "$map"; then
            echo "$sym" >> "$GITHUB_WORKSPACE/evidence/24-UNEXPECTED-FEATURE-SYMBOLS.txt"
          fi
        done
        test ! -s "$GITHUB_WORKSPACE/evidence/24-UNEXPECTED-FEATURE-SYMBOLS.txt"

        sha256sum -c "$GITHUB_WORKSPACE/evidence/04-P1-HOOK-SOURCE-FILES.sha256"
        {
          echo "OFFICIAL_KSU_LINKED=YES"
          echo "SUSFS_CORE_LINKED=YES"
          echo "SUSFS_CORE_INIT_BRIDGE_LINKED=YES"
          echo "SUSFS_FEATURE_SUBOPTION_SYMBOLS_LINKED=0"
          echo "P1_MANUAL_HOOK_SOURCES_UNCHANGED=YES"
          echo "P3_LINKED_CORE_ONLY_BOUNDARY=PASS"
        } > "$GITHUB_WORKSPACE/evidence/24-LINKED-BOUNDARY.txt"
    - name: 25 - Create P3 restore kit and provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P3_PROVENANCE" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"
        cd "$GITHUB_WORKSPACE/kernel"

        # Two independent deltas are required because KernelSU is an intentionally
        # excluded nested checkout in the outer kernel Git repository.
        git diff --binary "$EXPECTED_P2_OUTER_COMMIT" -- fs/susfs.c \
          > "$GITHUB_WORKSPACE/restore-kit/p2-to-p3-outer-susfs-core.patch"
        git -C KernelSU diff --binary "$KSU_COMMIT" -- \
          kernel/Kconfig kernel/ksu.c kernel/selinux/selinux.c kernel/selinux/selinux.h \
          > "$GITHUB_WORKSPACE/restore-kit/p3-kernelsu-0.9.5-core-bridge.patch"
        test -s "$GITHUB_WORKSPACE/restore-kit/p2-to-p3-outer-susfs-core.patch"
        test -s "$GITHUB_WORKSPACE/restore-kit/p3-kernelsu-0.9.5-core-bridge.patch"

        image_sha="$(sha256sum out-p3/arch/arm64/boot/Image | awk '{print $1}')"
        dtb_sha="$(sha256sum out-p3/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb | awk '{print $1}')"
        config_sha="$(sha256sum out-p3/.config | awk '{print $1}')"
        ksu_tree="$(git -C KernelSU rev-parse "$KSU_COMMIT^{tree}")"
        susfs_tree="$(git -C "$GITHUB_WORKSPACE/susfs-upstream" rev-parse HEAD^{tree})"

        python3 - <<PY
        import json
        from pathlib import Path
        m = {
          "stage": "KSU-GEN1-P3-v1",
          "device": "VEUX",
          "kernel_version": "$TARGET_VERSION",
          "p2_pass_run_id": "$P2_PASS_RUN_ID",
          "p2_outer_commit": "$EXPECTED_P2_OUTER_COMMIT",
          "p2_outer_tree": "$EXPECTED_P2_OUTER_TREE",
          "kernelsu_head": "$KSU_COMMIT",
          "kernelsu_tree": "$ksu_tree",
          "kernelsu_version": "$KSU_EXPECTED_VERSION",
          "susfs_source_head": "$SUSFS_SOURCE_COMMIT",
          "susfs_source_tree": "$susfs_tree",
          "susfs_version": "$SUSFS_EXPECTED_VERSION",
          "toolchain_commit": "$TOOLCHAIN_COMMIT",
          "toolchain_tree_sha256": "$EXPECTED_TOOLCHAIN_TREE_SHA256",
          "config_ksu_susfs": True,
          "susfs_feature_suboptions_enabled": 0,
          "active_fs_proc_hooks_integrated": False,
          "user_command_dispatch_integrated": False,
          "resukisu_integrated": False,
          "kernel_build_performed": True,
          "image_sha256": "$image_sha",
          "veux_dtb_sha256": "$dtb_sha",
          "config_sha256": "$config_sha",
          "boot_image_created": False,
          "device_accessed": False,
          "flashing_performed": False,
          "next_if_pass": "P4 controlled active hook/API integration"
        }
        Path("$GITHUB_WORKSPACE/restore-kit/manifest.json").write_text(json.dumps(m, indent=2, sort_keys=True) + "\n", encoding="utf-8")
        PY

        {
          echo "P2_PROVEN_COMMIT=$EXPECTED_P2_OUTER_COMMIT"
          echo "P2_PROVEN_TREE=$EXPECTED_P2_OUTER_TREE"
          echo "KERNELSU_HEAD=$KSU_COMMIT"
          echo "KERNELSU_TREE=$ksu_tree"
          echo "KERNELSU_VERSION=$KSU_EXPECTED_VERSION"
          echo "SUSFS_SOURCE_HEAD=$SUSFS_SOURCE_COMMIT"
          echo "SUSFS_SOURCE_TREE=$susfs_tree"
          echo "SUSFS_VERSION=$SUSFS_EXPECTED_VERSION"
          echo "P3_TOP_LEVEL_SUSFS_ENABLED=YES"
          echo "P3_SUSFS_FEATURE_SUBOPTIONS_ENABLED=0"
          echo "P3_ACTIVE_FS_PROC_HOOKS=NO"
          echo "P3_USER_COMMAND_DISPATCH=NO"
          echo "P3_IMAGE_SHA256=$image_sha"
          echo "P3_VEUX_DTB_SHA256=$dtb_sha"
          echo "P3_CONFIG_SHA256=$config_sha"
          echo "P3_BRIDGE_COMPILE_BOUNDARY=PASS"
          echo "NEXT_IF_PASS=P4_CONTROLLED_ACTIVE_HOOK_AND_API_INTEGRATION"
        } > "$GITHUB_WORKSPACE/evidence/25-P3-PROVENANCE.txt"
    - name: 26 - Close P3 technical status
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/evidence"
        echo "STAGE=FINAL_STATUS" > "$GITHUB_WORKSPACE/evidence/STAGE.txt"

        if [ "${{ job.status }}" = "success" ] \
          && grep -q '^P3_BRIDGE_COMPILE_BOUNDARY=PASS$' "$GITHUB_WORKSPACE/evidence/25-P3-PROVENANCE.txt" 2>/dev/null; then
          technical_pass=YES
          checkpoint=KSU-GEN1-P3-SUSFS-2.3-BRIDGE-COMPILE-PASS
          build_performed=YES
          core_linked=YES
        else
          technical_pass=NO
          checkpoint=KSU-GEN1-P3-FAILED
          if grep -q '^P3_IMAGE_DTBS_BUILD=PASS$' "$GITHUB_WORKSPACE/evidence/23-P3-BUILD-IDENTITY.txt" 2>/dev/null; then
            build_performed=YES
          else
            build_performed=NO
          fi
          if grep -q '^SUSFS_CORE_LINKED=YES$' "$GITHUB_WORKSPACE/evidence/24-LINKED-BOUNDARY.txt" 2>/dev/null; then
            core_linked=YES
          else
            core_linked=NO
          fi
        fi

        {
          echo "JOB_STATUS_AT_TECHNICAL_CLOSE=${{ job.status }}"
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          echo "TECHNICAL_PASS=$technical_pass"
          echo "CHECKPOINT=$checkpoint"
          echo "CONFIG_KSU_SUSFS_TARGET=YES"
          echo "SUSFS_CORE_LINKED=$core_linked"
          echo "SUSFS_ACTIVE_FS_PROC_HOOKS=NO"
          echo "SUSFS_USER_COMMAND_DISPATCH=NO"
          echo "KERNEL_BUILD_PERFORMED=$build_performed"
          echo "BOOT_IMAGE_CREATED=NO"
          echo "DEVICE_ACCESSED=NO"
          echo "FLASHING_PERFORMED=NO"
        } > "$GITHUB_WORKSPACE/evidence/98-FINAL-STATUS.txt"
    - name: 27 - Build evidence, restore-kit and build-artifact manifests safely
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        for dir in "$GITHUB_WORKSPACE/evidence" "$GITHUB_WORKSPACE/restore-kit" "$GITHUB_WORKSPACE/build-artifacts"; do
          [ -d "$dir" ] || continue
          rm -f "$dir/SHA256SUMS" "$dir/EMPTY-DIRECTORY.txt"
          (
            cd "$dir"
            count="$(find . -type f ! -name SHA256SUMS ! -name EMPTY-DIRECTORY.txt | wc -l | tr -d ' ')"
            if [ "$count" -eq 0 ]; then
              {
                echo "EMPTY_DIRECTORY_AT_MANIFEST_TIME=YES"
                echo "RUN_ID=$GITHUB_RUN_ID"
              } > EMPTY-DIRECTORY.txt
            fi
            find . -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 -r sha256sum > SHA256SUMS
            test -s SHA256SUMS
            if grep -Eq '[[:space:]]SHA256SUMS$' SHA256SUMS; then
              echo "ERROR: manifest contains itself" >&2
              exit 1
            fi
            sha256sum -c SHA256SUMS
          )
        done
    - name: 28 - Upload P3 evidence, restore kit and build outputs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ksu-gen1-p3-veux-5.4.274-ksu-0.9.5-susfs-2.3-bridge-compile-v1-${{ github.run_id }}
        path: |
          evidence/
          restore-kit/
          build-artifacts/
        retention-days: 14
        if-no-files-found: error
        compression-level: 6
    - name: 29 - Summary
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "# KSU GEN1 P3 v1 - KernelSU 0.9.5 + SUSFS 2.3 core bridge"
          echo
          if [ "${{ job.status }}" = "success" ] \
            && grep -q '^TECHNICAL_PASS=YES$' evidence/98-FINAL-STATUS.txt 2>/dev/null; then
            echo "**PASS**"
            echo
            echo "The SUSFS 2.3 core is enabled and linked with official KernelSU 0.9.5."
            echo "All invasive SUSFS feature sub-options and fs/proc hooks remain disabled in P3."
            echo "No boot image, device access, or flashing was performed."
            echo
            echo '```text'
            cat evidence/23-P3-BUILD-IDENTITY.txt
            cat evidence/24-LINKED-BOUNDARY.txt
            cat evidence/25-P3-PROVENANCE.txt
            echo '```'
          else
            echo "**FAIL - repair only the concrete P3 bridge/compile failure before P4.**"
            echo
            echo '```text'
            cat evidence/STAGE.txt 2>/dev/null || true
            cat evidence/22-SUSFS-OBJECT-COMPILE.txt 2>/dev/null || true
            cat evidence/23-IMAGE-DTBS-COMPILE.txt 2>/dev/null || true
            cat evidence/98-FINAL-STATUS.txt 2>/dev/null || true
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
