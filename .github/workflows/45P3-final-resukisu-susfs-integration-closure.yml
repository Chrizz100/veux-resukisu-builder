name: 45P3 - VEUX Final ReSukiSU SUSFS Integration Closure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    env:
      ARCH: arm64

      COMMON_REF: "android11-5.4.274_r00"
      STOCK_REF: "veux-r-oss"

      STABILITY_REVERT: "f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80"

      EXPECTED_CANDIDATE_TREE: "5d25b7e0124d7fb695f3f07b45928fcb5780d0e8"

      LB_CAPACITY_COMMIT: "2c1495be9eabac845acc8da45f070622d6455091"

      IDLE_SCREEN_COMMIT: "64e34240600a0c90072972a6c3d86f1d6ec85c53"
      IDLE_EXPOSE_COMMIT: "4ac606c780ae02a075d75a2703be68880761531a"
      IDLE_NOTIFIER_COMMIT: "8bc9cc6e197c0d1cf166ed94bb53ce41add1c828"
      IDLE_OPTIMIZE_COMMIT: "1d49e9b3308a7eacd75ed67f4112914e74ee60db"

      CPUFREQ_MIN_COMMIT: "44242207c9afe2b3e7fb5bdc18da42e918043c63"
      CPUFREQ_MAX_COMMIT: "3a25ef84be1d26cf0ddd526534358febd04529c5"

      EXPECTED_CPUFREQ_BEFORE_SHA256: "e1fa642651d4cf66fe59bf0eb615974bb403057dad5daeb3b7a8b1e9c06de646"
      EXPECTED_CPUFREQ_AFTER_SHA256: "9ac85ecaafbdddfb43d2b361183b455448ce400fad1296ae290510ad33039ceb"

      EXPECTED_STORE_ONE_BEFORE_SHA256: "5b85f632ef77eeee55d4b404a08e9d96ec87af0201ba1d634150c3ef418f37e3"
      EXPECTED_STORE_ONE_AFTER_SHA256: "0bbe18c9eee2059f4d2ec636b604f50bda90b131261e857b0dbc717c512ef28e"
      EXPECTED_CPUFREQ_TARGETED_DIFF_SHA256: "b431c73a2bfee36e093dc87846c628dd598a84499db66fc12a9930ff948e0b43"

      EXPECTED_IDLE_RESTORE_DIFF_SHA256: "33b144f63893d7a45d6c8e301aacf6ca1faa7a87088c19ab8bfdc1ecb29a0fd5"

      EXPECTED_LPM_AFTER_SHA256: "6805651af0a60905ce04356df3a538be15e94b6c8599a1d35e414d0a50b67094"
      EXPECTED_CPUIDLE_CORE_AFTER_SHA256: "e7f7fba62ce2bbe82f23c6bfbf5a103161d1c8013b85f7f48e4c036758f6a603"
      EXPECTED_CPUIDLE_HEADER_AFTER_SHA256: "9149734aa0eef1bba2e7ae16902dfd3aa203f23fe41657ce7df50ab947620506"

      EXPECTED_SCHEDUTIL_BEFORE_SHA256: "9d56491a427ee12f1156ae907c5aa647bf1a1b35bf13c725a08e73ef295274b7"
      EXPECTED_SCHEDUTIL_AFTER_SHA256: "987c9598f16b22a1e7b343475691687d309122de447494cd1a2b5ea8cbbafffc"

      EXPECTED_CASS_DIFF_SHA256: "67abb81be8c2d7727c3e4c8a92419c9e9a3d97ee3d3e5355d3acabce34adf659"

      EXPECTED_XIAOMI_PELT_SHA256: "bad23ba491cc5d4669936507b392888765aa65fd8063b2a95a492d6b0dca0cb0"

      EXPECTED_HZ_KCONFIG_SHA256: "685e9a79f3dbf17e9bd5b402dfd25ad014886fbe1b6975a0913b3621519cd7fe"

      RESUKISU_COMMIT: "faccf4c5edc7be37776216e7d43dd3dca0239331"
      EXPECTED_RESUKISU_VERSION: "v4.2.0-rc1-faccf4c5@ReSukiSU"

      BACKPORT_REPO: "JackA1ltman/NonGKI_Kernel_Build_2nd"
      BACKPORT_COMMIT: "90d9f91d43ecaaee044e79c75a01d6a512508eb3"
      BACKPORT_PATCH_PATH: "Patches/Patch/susfs_patch_to_5.4.patch"
      BACKPORT_PATCH_BLOB: "7533876188b65d78940b705d8e4462dbdc31c0a2"
      BACKPORT_PATCH_SHA256: "21233ce9a0a02590d977cd193aa493b23df7008e73fed402901e033a303b9631"

      EXPECTED_TASK_MMU_REJECT_SHA256: "f8daf0861fd9608e6ceb11557c34ec09368fff8e4123992d3453c740f61c4996"

      EXPECTED_WARNING_CLEAN_DIFF_SHA256: "afdbab86f738aead94a12f896eeb5b74008dcf1c4fe5dfec4682651491a3de1e"

      WORKFLOW17_BLOB: "a87d1c8ec8dab938101337dd9786c1773d2c5f19"
      WORKFLOW44C_BLOB: "95fc204bd6d5355c2f6a1c0e75eefa68a053f576"
      WORKFLOW45P_BLOB: "9f040f3b7cdfed9221a2ffaaa3ccfd0988c9b676"

      CLANG_PREBUILT_COMMIT: "aa2e4a514a6c85eebcc4a27149eaf9244e951a1e"

      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      REFERENCE_DIR: ${{ github.workspace }}/workflow-reference
      PATCH_DIR: ${{ github.workspace }}/reference-patches
      OUT_DIR: out
      ARTIFACT_DIR: ${{ github.workspace }}/final-integration-closure

    steps:
      - name: Prepare integration closure
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$TOOLCHAIN_DIR" \
            "$PATCH_DIR" \
            "$ARTIFACT_DIR"

          cat > "$ARTIFACT_DIR/PLAN.txt" <<'EOF'
          VEUX Final ReSukiSU + SUSFS Integration Closure
          =================================================

          45P2 established that the Workflow 17 warning-clean adaptation
          itself succeeds with exit code 0 on the cumulative 44C baseline.

          Root cause of the 45P failure:

          Workflow 17 intentionally separates:

          1. Apply exact warning-clean VEUX SUSFS and ReSukiSU adaptation

             This step performs the source edits and removes remaining
             reject/orig files.

          2. Verify exact approved source adaptation

             This separate step:
             - checks required hooks
             - checks incompatible hooks are absent
             - performs git diff --check
             - creates VEUX-SUSFS-2.2-WARNING-CLEAN.diff
             - hashes that diff
             - compares it with the approved Workflow 17 hash

          45P incorrectly expected the diff to exist after step 1.

          45P3 fixes only this orchestration error.

          It reuses:
          - exact pinned Workflow 44C cumulative correction logic
          - exact pinned Workflow 17 warning-clean APPLY step
          - exact pinned Workflow 17 warning-clean VERIFY step
          - remaining exact 45P cumulative verification/config logic

          Expected approved adaptation:
          afdbab86f738aead94a12f896eeb5b74008dcf1c4fe5dfec4682651491a3de1e

          No Image build.
          No boot.img.
          No flashable ZIP.
          No device access.
          No flashing.
          EOF

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            patch \
            python3 \
            python-is-python3 \
            rsync \
            xz-utils \
            zstd

      - name: Install exact Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz" \
            -o "${RUNNER_TEMP}/clang-r416183b.tar.gz"

          tar \
            -xzf "${RUNNER_TEMP}/clang-r416183b.tar.gz" \
            -C "$TOOLCHAIN_DIR"

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

          "$TOOLCHAIN_DIR/bin/clang" --version \
            | tee "$ARTIFACT_DIR/clang-version.txt"

          "$TOOLCHAIN_DIR/bin/ld.lld" --version \
            | tee -a "$ARTIFACT_DIR/clang-version.txt"

          if ! "$TOOLCHAIN_DIR/bin/clang" --version \
            | grep -q 'r416183b'
          then
            echo "ERROR: expected clang-r416183b"
            exit 1
          fi

      - name: Checkout exact workflow references
        uses: actions/checkout@v7
        with:
          repository: Chrizz100/veux-resukisu-builder
          ref: main
          fetch-depth: 1
          path: workflow-reference
          persist-credentials: false

      - name: Verify Workflow 17 44C and 45P blobs
        shell: bash
        run: |
          set -euo pipefail

          W17=".github/workflows/17-susfs-final-release-candidate.yml"
          W44=".github/workflows/44C-restore-cpufreq-min-max-sysfs-full-build.yml"
          W45=".github/workflows/45P-final-resukisu-susfs-cumulative-integration-preflight.yml"

          ACTUAL17="$(
            git -C "$REFERENCE_DIR" \
              hash-object \
              "$W17"
          )"

          ACTUAL44="$(
            git -C "$REFERENCE_DIR" \
              hash-object \
              "$W44"
          )"

          ACTUAL45="$(
            git -C "$REFERENCE_DIR" \
              hash-object \
              "$W45"
          )"

          if [ "$ACTUAL17" != "$WORKFLOW17_BLOB" ]; then
            echo "ERROR: Workflow 17 changed"
            echo "Expected: $WORKFLOW17_BLOB"
            echo "Actual:   $ACTUAL17"
            exit 1
          fi

          if [ "$ACTUAL44" != "$WORKFLOW44C_BLOB" ]; then
            echo "ERROR: Workflow 44C changed"
            echo "Expected: $WORKFLOW44C_BLOB"
            echo "Actual:   $ACTUAL44"
            exit 1
          fi

          if [ "$ACTUAL45" != "$WORKFLOW45P_BLOB" ]; then
            echo "ERROR: Workflow 45P changed"
            echo "Expected: $WORKFLOW45P_BLOB"
            echo "Actual:   $ACTUAL45"
            exit 1
          fi

          {
            echo "WORKFLOW17_BLOB=$ACTUAL17"
            echo "WORKFLOW17_REFERENCE=PASS"
            echo "WORKFLOW44C_BLOB=$ACTUAL44"
            echo "WORKFLOW44C_REFERENCE=PASS"
            echo "WORKFLOW45P_BLOB=$ACTUAL45"
            echo "WORKFLOW45P_REFERENCE=PASS"
          } | tee "$ARTIFACT_DIR/WORKFLOW-REFERENCE-STATE.txt"

      - name: Create exact run block extractor
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/extract-run-block.py" <<'PY'
          import sys
          from pathlib import Path

          if len(sys.argv) != 4:
              raise SystemExit(
                  "usage: extract-run-block.py WORKFLOW STEP_NAME OUTPUT"
              )

          workflow = Path(sys.argv[1])
          step_name = sys.argv[2]
          output = Path(sys.argv[3])

          lines = workflow.read_text(
              encoding="utf-8"
          ).splitlines(
              keepends=True
          )

          marker = f"      - name: {step_name}"

          starts = [
              i
              for i, line in enumerate(lines)
              if line.rstrip("\n") == marker
          ]

          if len(starts) != 1:
              raise SystemExit(
                  f"{step_name!r}: expected one step, got {len(starts)}"
              )

          start = starts[0]
          run_index = None

          for i in range(start + 1, len(lines)):
              if (
                  i > start + 1
                  and lines[i].startswith("      - name: ")
              ):
                  break

              if lines[i].strip() == "run: |":
                  run_index = i
                  break

          if run_index is None:
              raise SystemExit(
                  f"{step_name!r}: run block not found"
              )

          end = len(lines)

          for i in range(run_index + 1, len(lines)):
              if lines[i].startswith("      - name: "):
                  end = i
                  break

          block = lines[
              run_index + 1:
              end
          ]

          nonblank = [
              line
              for line in block
              if line.strip()
          ]

          if not nonblank:
              raise SystemExit(
                  f"{step_name!r}: empty run block"
              )

          def leading_spaces(line):
              return len(line) - len(line.lstrip(" "))

          indent = min(
              leading_spaces(line)
              for line in nonblank
          )

          if indent < 10:
              raise SystemExit(
                  f"{step_name!r}: unexpected indentation {indent}"
              )

          extracted = "".join(
              line[indent:]
              if line.strip()
              else "\n"
              for line in block
          )

          output.write_text(
              extracted,
              encoding="utf-8"
          )
          PY

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/17-susfs-final-release-candidate.yml" \
            "Verify exact approved source adaptation" \
            "${RUNNER_TEMP}/extractor-selftest.sh"

          grep -qF \
            'VEUX-SUSFS-2.2-WARNING-CLEAN.diff' \
            "${RUNNER_TEMP}/extractor-selftest.sh"

          grep -qF \
            'EXPECTED_WARNING_CLEAN_DIFF_SHA256' \
            "${RUNNER_TEMP}/extractor-selftest.sh"

          echo "RUN_BLOCK_EXTRACTOR=PASS" \
            | tee "$ARTIFACT_DIR/RUN-BLOCK-EXTRACTOR.txt"

      - name: Checkout exact VEUX source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: "20240619"
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Recreate exact Candidate 2
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p-recreate-candidate.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P-final-resukisu-susfs-cumulative-integration-preflight.yml" \
            "Recreate exact Candidate 2" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Fetch official Xiaomi VEUX reference
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p-fetch-xiaomi.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P-final-resukisu-susfs-cumulative-integration-preflight.yml" \
            "Fetch official Xiaomi VEUX reference" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Reapply exact approved 44C cumulative corrections
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p-replay-44c.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P-final-resukisu-susfs-cumulative-integration-preflight.yml" \
            "Reapply exact approved 44C cumulative corrections" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Commit isolated cumulative baseline
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p-commit-baseline.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P-final-resukisu-susfs-cumulative-integration-preflight.yml" \
            "Commit isolated cumulative baseline" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Verify clean pre SUSFS cumulative state
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p-pre-susfs.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P-final-resukisu-susfs-cumulative-integration-preflight.yml" \
            "Verify clean pre SUSFS cumulative state" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Fetch exact approved SUSFS 2.2 backport
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p-fetch-susfs.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P-final-resukisu-susfs-cumulative-integration-preflight.yml" \
            "Fetch exact approved SUSFS 2.2 backport" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Apply exact Workflow 17 SUSFS base
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p-apply-susfs-base.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P-final-resukisu-susfs-cumulative-integration-preflight.yml" \
            "Apply exact Workflow 17 SUSFS base" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Replace legacy KernelSU with exact Workflow 17 ReSukiSU
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p-resukisu.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P-final-resukisu-susfs-cumulative-integration-preflight.yml" \
            "Replace legacy KernelSU with exact Workflow 17 ReSukiSU" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Apply exact Workflow 17 warning clean adaptation
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/w17-warning-clean-apply.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/17-susfs-final-release-candidate.yml" \
            "Apply exact warning-clean VEUX SUSFS and ReSukiSU adaptation" \
            "$SCRIPT"

          chmod +x "$SCRIPT"

          bash "$SCRIPT" \
            2>&1 \
            | tee "$ARTIFACT_DIR/WARNING-CLEAN-APPLY.log"

          {
            echo "WARNING_CLEAN_APPLY=PASS"
            echo "WARNING_CLEAN_APPLY_EXIT_CODE=0"
          } | tee "$ARTIFACT_DIR/WARNING-CLEAN-APPLY-STATE.txt"

      - name: Verify exact Workflow 17 approved source adaptation
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/w17-warning-clean-verify.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/17-susfs-final-release-candidate.yml" \
            "Verify exact approved source adaptation" \
            "$SCRIPT"

          cp \
            "$SCRIPT" \
            "$ARTIFACT_DIR/W17-VERIFY-SOURCE-ADAPTATION.sh"

          chmod +x "$SCRIPT"

          bash "$SCRIPT" \
            2>&1 \
            | tee "$ARTIFACT_DIR/WARNING-CLEAN-VERIFY.log"

          DIFF="$ARTIFACT_DIR/VEUX-SUSFS-2.2-WARNING-CLEAN.diff"

          if [ ! -s "$DIFF" ]; then
            echo "ERROR: Workflow 17 verify step did not create adaptation diff"
            exit 1
          fi

          DIFF_SHA="$(
            sha256sum "$DIFF" \
              | awk '{print $1}'
          )"

          if [ "$DIFF_SHA" != "$EXPECTED_WARNING_CLEAN_DIFF_SHA256" ]; then
            echo "ERROR: approved adaptation diff changed"
            echo "Expected: $EXPECTED_WARNING_CLEAN_DIFF_SHA256"
            echo "Actual:   $DIFF_SHA"
            exit 1
          fi

          if ! grep -qFx \
            'SOURCE_ADAPTATION=PASS' \
            "$ARTIFACT_DIR/SOURCE-ADAPTATION-CHECK.txt"
          then
            echo "ERROR: Workflow 17 source adaptation PASS marker missing"
            exit 1
          fi

          {
            echo "WORKFLOW17_WARNING_CLEAN_APPLY=PASS"
            echo "WORKFLOW17_SOURCE_ADAPTATION_VERIFY=PASS"
            echo "WARNING_CLEAN_ADAPTATION_SHA256=$DIFF_SHA"
            echo "ADAPTATION_BYTE_IDENTICAL_TO_WORKFLOW17=YES"
          } | tee "$ARTIFACT_DIR/INTEGRATION-ADAPTATION-STATE.txt"

      - name: Verify cumulative corrections survived integration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p-post-integration.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P-final-resukisu-susfs-cumulative-integration-preflight.yml" \
            "Verify cumulative corrections survived integration" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Resolve new cumulative ReSukiSU SUSFS config
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          SCRIPT="$RUNNER_TEMP/45p-resolve-config.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P-final-resukisu-susfs-cumulative-integration-preflight.yml" \
            "Resolve new cumulative ReSukiSU SUSFS config" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Final integration source audit
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p-final-source-audit.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P-final-resukisu-susfs-cumulative-integration-preflight.yml" \
            "Final integration source audit" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Prepare final preflight result
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p-result.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P-final-resukisu-susfs-cumulative-integration-preflight.yml" \
            "Prepare final preflight result" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

          if ! grep -qFx \
            'RESULT=PASS_PREFLIGHT' \
            "$ARTIFACT_DIR/RESULT.txt"
          then
            echo "ERROR: final PASS_PREFLIGHT marker missing"
            exit 1
          fi

          CONFIG_SHA="$(
            awk -F= \
              '$1=="NEW_CUMULATIVE_CONFIG_SHA256" {print $2}' \
              "$ARTIFACT_DIR/RESULT.txt"
          )"

          if [ -z "$CONFIG_SHA" ]; then
            echo "ERROR: new cumulative config SHA missing"
            exit 1
          fi

          {
            echo "45P2_ROOT_CAUSE=ORCHESTRATION_STEP_BOUNDARY"
            echo "WARNING_CLEAN_APPLY_STEP=PASS"
            echo "WARNING_CLEAN_VERIFY_STEP=PASS"
            echo "APPROVED_ADAPTATION_SHA256=$EXPECTED_WARNING_CLEAN_DIFF_SHA256"
            echo "NEW_CUMULATIVE_CONFIG_SHA256=$CONFIG_SHA"
            echo "INTEGRATION_CLOSURE=PASS"
          } | tee "$ARTIFACT_DIR/45P3-CLOSURE.txt"

      - name: Upload final integration closure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-Final-ReSukiSU-SUSFS-Integration-Closure
          path: final-integration-closure/
          if-no-files-found: error
          retention-days: 30
