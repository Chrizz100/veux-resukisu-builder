          Before writing boot, the installer requires:
          - VEUX via AnyKernel3 device check
          - Android 13
          - Android security patch 2024-12
          - vendor security patch 2024-12
          - valid _a or _b slot
          - positive bootloader-unlocked evidence
          - exact audited stock boot SHA-256
          - exact custom W19 payload SHA-256
          - exact stock rollback SHA-256

          After writing:
          - entire target boot partition is SHA-256 read back
          - exact W19 SHA-256 is required

          If custom write/readback fails:
          - exact stock boot rollback is attempted
          - rollback SHA-256 is verified

          UNTOUCHED BY THE INSTALLER
          --------------------------
          vendor_boot
          dtbo
          top-level vbmeta

          IMPORTANT
