          EOF

          grep -Fxq \
            'RESULT: PASS_FINAL_FLASHABLE_PACKAGE_BUILT_NOT_FLASHED' \
            "$OUTPUT/WORKFLOW21-SUMMARY.txt"

      - name: Create final output checksums
        shell: bash
        run: |
          set -euo pipefail

          (
            cd "$OUTPUT"

            find . \
              -maxdepth 1 \
              -type f \
              ! -name SHA256SUMS \
              ! -name SHA256SUMS.verify.txt \
              -printf '%f\n' \
              | LC_ALL=C sort \
              | while IFS= read -r FILE; do
                  sha256sum "$FILE"
                done \
              > SHA256SUMS

            sha256sum -c SHA256SUMS \
              > SHA256SUMS.verify.txt
          )

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p "$OUTPUT"

          {
            echo "WORKFLOW21_STATUS=REQUIRES_REVIEW"
            echo "Finished: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "No device operation was performed by GitHub Actions."
            echo "Nothing was flashed."
          } > "$OUTPUT/FAILURE-SUMMARY.txt"

      - name: Upload final Workflow 21 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veux-5.4.274-resukisu-susfs-2.2-workflow21-exact-w19-final-flashable-${{ github.run_number }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 0
