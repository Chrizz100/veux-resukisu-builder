      - name: Discover public SM6375 kernel repositories and branch versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          from urllib.error import HTTPError
          import csv, json, os, re, subprocess, time

          audit = Path(os.environ["AUDIT_DIR"])
          token = os.environ.get("GH_TOKEN", "")
          query = "kernel_xiaomi_sm6375 in:name"

          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "VEUX-U3T-readonly-audit",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def get_json(url):
              req = Request(url, headers=headers)
              with urlopen(req, timeout=45) as r:
                  return json.loads(r.read().decode("utf-8"))

          repos = {}
          raw_pages = []
          for page in range(1, 4):
              url = (
                  "https://api.github.com/search/repositories?"
                  f"q={quote(query)}&per_page=100&page={page}"
              )
              data = get_json(url)
              raw_pages.append(data)
              items = data.get("items", [])
              for item in items:
                  repos[item["full_name"]] = item
              if len(items) < 100:
                  break

          (audit / "10-repository-search.json").write_text(
              json.dumps(raw_pages, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          repo_rows = []
          branch_rows = []
          seen_sha = set()

          for full_name in sorted(repos, key=str.lower):
              item = repos[full_name]
              clone = item["clone_url"]
              default = item.get("default_branch") or ""
              size = int(item.get("size") or 0)

              repo_rows.append({
                  "repository": full_name,
                  "default_branch": default,
                  "size_kb": size,
                  "archived": int(bool(item.get("archived"))),
                  "fork": int(bool(item.get("fork"))),
                  "pushed_at": item.get("pushed_at") or "",
                  "updated_at": item.get("updated_at") or "",
                  "html_url": item.get("html_url") or "",
              })

              if size == 0:
                  continue

              cp = subprocess.run(
                  ["git", "ls-remote", "--heads", clone],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  timeout=90,
              )
              if cp.returncode != 0:
                  branch_rows.append({
                      "repository": full_name,
                      "branch": "",
                      "sha": "",
                      "kernel_version": "LS_REMOTE_FAILED",
                      "major": "",
                      "minor": "",
                      "sublevel": "",
                      "class": "DISCOVERY_ERROR",
                      "is_default": 0,
                  })
                  continue

              heads = []
              for line in cp.stdout.splitlines():
                  if not line.strip():
                      continue
                  sha, ref = line.split("\t", 1)
                  branch = ref.removeprefix("refs/heads/")
                  heads.append((sha, branch))

              # Deterministic cap guards pathological repositories while still
              # scanning a broad current ecosystem.
              heads = sorted(heads, key=lambda x: (x[1] != default, x[1]))[:80]

              for sha, branch in heads:
                  # Same commit may back multiple branches. Keep each branch row,
                  # but fetch/parse the Makefile once per unique SHA.
                  cache = audit / "u3t-makefile-cache"
                  cache.mkdir(exist_ok=True)
                  mf = cache / f"{sha}.Makefile"

                  if not mf.exists():
                      raw_url = (
                          f"https://raw.githubusercontent.com/"
                          f"{full_name}/{sha}/Makefile"
                      )
                      try:
                          req = Request(raw_url, headers={
                              "User-Agent": "VEUX-U3T-readonly-audit"
                          })
                          with urlopen(req, timeout=30) as r:
                              content = r.read()
                          mf.write_bytes(content)
                      except Exception:
                          mf.write_text("", encoding="utf-8")

                  txt = mf.read_text(errors="replace")
                  vals = {}
                  for key in ("VERSION", "PATCHLEVEL", "SUBLEVEL"):
                      m = re.search(
                          rf"^{key}\s*=\s*([0-9]+)\s*$", txt, re.M
                      )
                      vals[key] = int(m.group(1)) if m else None

                  if None in vals.values():
                      version = "UNKNOWN"
                      major = minor = sub = ""
                      cls = "UNCLASSIFIED_NO_ROOT_VERSION"
                  else:
                      major = vals["VERSION"]
                      minor = vals["PATCHLEVEL"]
                      sub = vals["SUBLEVEL"]
                      version = f"{major}.{minor}.{sub}"

                      if major == 5 and minor == 4 and sub <= 302:
                          cls = "A_5_4_FAMILY_LE302"
                      elif major == 5 and minor == 4 and sub > 302:
                          cls = "B_5_4_GT302_SOURCE_AUDIT"
                      else:
                          cls = "C_NEW_KERNEL_FAMILY"

                  branch_rows.append({
                      "repository": full_name,
                      "branch": branch,
                      "sha": sha,
                      "kernel_version": version,
                      "major": major,
                      "minor": minor,
                      "sublevel": sub,
                      "class": cls,
                      "is_default": int(branch == default),
                  })

          def write_tsv(path, rows, fields):
              with path.open("w", newline="", encoding="utf-8") as fh:
                  w = csv.DictWriter(fh, fieldnames=fields, delimiter="\t")
                  w.writeheader()
                  w.writerows(rows)

          write_tsv(
              audit / "10-repository-inventory.tsv",
              repo_rows,
              [
                  "repository","default_branch","size_kb","archived","fork",
                  "pushed_at","updated_at","html_url",
              ],
          )
          write_tsv(
              audit / "11-branch-kernel-version-inventory.tsv",
              branch_rows,
              [
                  "repository","branch","sha","kernel_version","major","minor",
                  "sublevel","class","is_default",
              ],
          )

          # Unique version / class summary.
          summary = {}
          for r in branch_rows:
              k = (r["kernel_version"], r["class"])
              summary[k] = summary.get(k, 0) + 1

          summary_rows = [
              {
                  "kernel_version": k[0],
                  "class": k[1],
                  "branch_count": n,
              }
              for k, n in sorted(summary.items())
          ]
          write_tsv(
              audit / "12-version-summary.tsv",
              summary_rows,
              ["kernel_version","class","branch_count"],
          )

          gt302 = [
              r for r in branch_rows
              if r["class"] == "B_5_4_GT302_SOURCE_AUDIT"
          ]
          sixone = [
              r for r in branch_rows
              if str(r["kernel_version"]).startswith("6.1.")
          ]

          # Deduplicate >302 audit candidates by commit SHA.
          gt302_unique = []
          gt_seen = set()
          for r in gt302:
              if r["sha"] in gt_seen:
                  continue
              gt_seen.add(r["sha"])
              gt302_unique.append(r)

          write_tsv(
              audit / "13-gt302-candidates.tsv",
              gt302_unique,
              [
                  "repository","branch","sha","kernel_version","major","minor",
                  "sublevel","class","is_default",
              ],
          )

          with (audit / "13-boundary-summary.txt").open("w") as fh:
              fh.write(f"REPOSITORIES_DISCOVERED={len(repo_rows)}\n")
              fh.write(f"BRANCH_ROWS={len(branch_rows)}\n")
              fh.write(f"GT302_BRANCH_ROWS={len(gt302)}\n")
              fh.write(f"GT302_UNIQUE_COMMITS={len(gt302_unique)}\n")
              fh.write(f"LINUX_6_1_BRANCH_ROWS={len(sixone)}\n")
              fh.write(
                  "P13_AUTOMATIC_FAMILY_BOUNDARY=LINUX_5_4_SUBLEVEL_LE302\n"
              )
              fh.write(
                  "NON_5_4_POLICY=SEPARATE_KERNEL_FAMILY_NOT_AUTO_COMPATIBLE\n"
              )

          print(f"repos={len(repo_rows)} branches={len(branch_rows)}")
          print(f"gt302={len(gt302_unique)} linux6.1={len(sixone)}")
          PY

          cat "$AUDIT_DIR/13-boundary-summary.txt"
          column -t -s $'\t' "$AUDIT_DIR/12-version-summary.tsv" || true

      - name: Assert current ecosystem scanner sees both known boundaries
        shell: bash
        run: |
          set -euo pipefail

          # Known public current representatives validate discovery coverage:
