            echo "U3T_GITHUB_MODE=READ_ONLY"
            echo "U3T_DEVICE_REQUIRED=NO"
            echo "U3T_FLASH_ACTIONS=NONE"
            echo "U3T_SAFETY_GATE=PASS"
          } | tee "$AUDIT_DIR/17-U3T-SAFETY.txt"

      - name: Build self-verifying U3T evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$AUDIT_DIR"
          rm -rf u3t-makefile-cache
          find . -type f ! -name 'U3T-EVIDENCE-SHA256SUMS.txt' -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            > U3T-EVIDENCE-SHA256SUMS.txt
          sha256sum -c U3T-EVIDENCE-SHA256SUMS.txt

      - name: Upload U3T ecosystem boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-GEN1-U3T-public-ecosystem-boundary-audit
          path: u3t-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
