              "**U3T_PUBLIC_ECOSYSTEM_BOUNDARY=PASS**",
              "",
              "The frozen P13 universal claim is bounded to the public",
              "VEUX/SM6375/QGKI Linux-5.4 family through sublevel 302.",
              "",
              "Current public VEUX repositories also contain Linux 6.1 sources.",
              "Those are a distinct kernel family and are not automatically",
              "compatible with the frozen P13 Image.",
              "",
              "Any public 5.4.x >302 branch is enumerated separately and",
              "source-compared to P13 before any compatibility inference.",
              "",
              f"- 5.4 <=302 branch rows: **{a}**",
              f"- 5.4 >302 branch rows: **{b}**",
              f"- other kernel-family branch rows: **{c}**",
              f"- Linux 6.1 branch rows: **{sixone}**",
