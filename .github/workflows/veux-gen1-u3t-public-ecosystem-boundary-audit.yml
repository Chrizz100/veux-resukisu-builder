      - name: Sparse-clone and compare any discovered 5.4 greater-than-302 sources
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$SNAPSHOT_DIR/gt302"

          python3 - <<'PY'
          from pathlib import Path
          import csv, os, subprocess

          audit = Path(os.environ["AUDIT_DIR"])
          out = Path(os.environ["SNAPSHOT_DIR"]) / "gt302"
          rows = list(csv.DictReader(
              (audit / "13-gt302-candidates.tsv").open(),
              delimiter="\t"
          ))

          # Bound workload while retaining deterministic evidence.
          rows = rows[:20]

          for i, r in enumerate(rows):
              dest = out / f"cand-{i:02d}"
              repo = r["repository"]
              sha = r["sha"]

              subprocess.run(["git","init","-q",str(dest)], check=True)
              subprocess.run(
                  ["git","-C",str(dest),"remote","add","origin",
                   f"https://github.com/{repo}.git"],
                  check=True
              )
              subprocess.run(
                  ["git","-C",str(dest),"sparse-checkout","init","--no-cone"],
                  check=True
              )
              patterns = """\
          /Makefile
          /Kconfig
          /arch/arm64/configs/
          /arch/arm64/boot/dts/vendor/
          /drivers/staging/qcacld-3.0/
          /drivers/staging/qca-wifi-host-cmn/
          /drivers/gpu/msm/
          /drivers/power/supply/qcom/
          /drivers/thermal/qcom/
          /drivers/scsi/ufs/
          /drivers/usb/dwc3/
          /drivers/soc/qcom/
          /techpack/audio/
          /techpack/camera/
          /techpack/video/
          /techpack/dataipa/
          /techpack/datarmnet/
          /net/qrtr/
          """
              (dest / ".git/info/sparse-checkout").write_text(patterns)

              subprocess.run(
                  ["git","-C",str(dest),"fetch","-q","--depth=1",
                   "--filter=blob:none","origin",sha],
                  check=True
              )
              subprocess.run(
                  ["git","-C",str(dest),"checkout","-q","--detach","FETCH_HEAD"],
                  check=True
              )
              if subprocess.check_output(
                  ["git","-C",str(dest),"rev-parse","HEAD"], text=True
              ).strip() != sha:
                  raise SystemExit(f"SHA mismatch for {repo} {sha}")

              (dest / ".u3t-meta.tsv").write_text(
                  "\t".join([
                      r["repository"], r["branch"], r["sha"],
                      r["kernel_version"]
                  ]) + "\n"
              )

          print(f"GT302_SOURCES_CLONED={len(rows)}")
          PY

      - name: Compare discovered greater-than-302 5.4 sources against exact P13
        shell: bash
        run: |
          set -euo pipefail
          export P13_ROOT="$GITHUB_WORKSPACE/kernel"

          python3 - <<'PY'
          from pathlib import Path
          import csv, os, re

          audit = Path(os.environ["AUDIT_DIR"])
          roots = Path(os.environ["SNAPSHOT_DIR"]) / "gt302"
          p13 = Path(os.environ["P13_ROOT"])

          groups = {
              "wifi_qcacld": [
                  "drivers/staging/qcacld-3.0",
                  "drivers/staging/qca-wifi-host-cmn",
              ],
              "gpu": ["drivers/gpu/msm"],
              "power": ["drivers/power/supply/qcom"],
              "thermal": ["drivers/thermal/qcom"],
              "ufs": ["drivers/scsi/ufs"],
              "usb_dwc3": ["drivers/usb/dwc3"],
              "soc_qcom": ["drivers/soc/qcom"],
              "audio": ["techpack/audio"],
              "camera": ["techpack/camera"],
              "video": ["techpack/video"],
              "ipa": ["techpack/dataipa"],
              "rmnet": ["techpack/datarmnet"],
              "qrtr": ["net/qrtr"],
          }

          export_re = re.compile(
              r'EXPORT_SYMBOL(?:_GPL)?\s*\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)'
          )
          kconfig_re = re.compile(
              r'^\s*(?:menu)?config\s+([A-Za-z_][A-Za-z0-9_]*)\s*$',
              re.M
          )
          obj_re = re.compile(r'^\s*obj-[^:=+]*\+?=\s*(.+)$', re.M)

          def critical_files(root):
              for paths in groups.values():
                  for rel in paths:
                      d = root / rel
                      if not d.exists():
                          continue
                      for p in d.rglob("*"):
                          if p.is_file() and p.suffix in {".c",".h"}:
                              yield p

          def exports(root):
              s=set()
              for p in critical_files(root):
                  s.update(export_re.findall(p.read_text(errors="replace")))
              return s

          def kconfigs(root):
              s=set()
              for paths in groups.values():
                  for rel in paths:
                      d=root/rel
                      if d.exists():
                          for p in d.rglob("Kconfig*"):
                              if p.is_file():
                                  s.update(kconfig_re.findall(
                                      p.read_text(errors="replace")
                                  ))
              return s

          def kbuild(root):
              s=set()
              for paths in groups.values():
                  for rel in paths:
                      d=root/rel
                      if not d.exists():
                          continue
                      for name in ("Makefile","Kbuild"):
                          for p in d.rglob(name):
                              if not p.is_file():
                                  continue
                              for rhs in obj_re.findall(
                                  p.read_text(errors="replace")
                              ):
                                  for tok in rhs.split():
                                      if tok.endswith((".o",".a")):
                                          s.add(tok)
              return s

          def structure(root):
              return {
                  name: any((root/rel).exists() for rel in paths)
                  for name, paths in groups.items()
              }

          def jac(a,b):
              if not a and not b: return 1.0
              if not a or not b: return 0.0
              return len(a&b)/len(a|b)

          pe, pk, pb = exports(p13), kconfigs(p13), kbuild(p13)
          rows=[]

          for dest in sorted(roots.glob("cand-*")):
              meta = (dest/".u3t-meta.tsv").read_text().strip().split("\t")
              repo, branch, sha, version = meta
              st = structure(dest)
              ratio = sum(st.values()) / len(st)
              ej, kj, bj = jac(pe,exports(dest)), jac(pk,kconfigs(dest)), jac(pb,kbuild(dest))

              if ratio >= 0.75 and ej >= 0.65:
                  cls="B_GT302_SAME_SOURCE_FAMILY_REVIEW"
              else:
                  cls="C_GT302_STRUCTURAL_DIVERGENCE"

              rows.append({
                  "repository":repo,
                  "branch":branch,
                  "sha":sha,
                  "kernel_version":version,
                  "structure_pct":f"{ratio*100:.2f}",
                  "export_symbol_jaccard":f"{ej:.6f}",
                  "kconfig_jaccard":f"{kj:.6f}",
                  "kbuild_jaccard":f"{bj:.6f}",
                  "classification":cls,
              })

          path=audit/"15-gt302-p13-comparison.tsv"
          fields=[
              "repository","branch","sha","kernel_version","structure_pct",
              "export_symbol_jaccard","kconfig_jaccard","kbuild_jaccard",
              "classification"
          ]
          with path.open("w",newline="",encoding="utf-8") as fh:
              w=csv.DictWriter(fh,fieldnames=fields,delimiter="\t")
              w.writeheader(); w.writerows(rows)

          same=sum(r["classification"].startswith("B_") for r in rows)
          diverged=sum(r["classification"].startswith("C_") for r in rows)
          with (audit/"15-gt302-result.txt").open("w") as fh:
              fh.write(f"GT302_COMPARED={len(rows)}\n")
              fh.write(f"GT302_SAME_SOURCE_FAMILY_REVIEW={same}\n")
              fh.write(f"GT302_STRUCTURAL_DIVERGENCE={diverged}\n")

          print((audit/"15-gt302-result.txt").read_text())
          PY

          cat "$AUDIT_DIR/15-gt302-p13-comparison.tsv"

      - name: Produce U3T ecosystem boundary report
        shell: bash
        run: |
