            cp LSPosed-v2.0.1-7371-IrenaX-P6-v1-old-lsplant-classlinker-fallback-official-base-release.zip p6-output/
          fi
          if [ -f LSPosed-v2.0.1-7371-IrenaX-P4-v3-lsplant-7244-official-base-release.zip ]; then
