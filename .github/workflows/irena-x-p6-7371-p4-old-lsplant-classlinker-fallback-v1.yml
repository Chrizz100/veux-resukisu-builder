          [ ! -f ../P4_LSPLANT_STATE.txt ] || cp ../P4_LSPLANT_STATE.txt ../p4-output/
          [ ! -f ../P4_NEW_HELPER_TOKEN_SCAN.txt ] || cp ../P4_NEW_HELPER_TOKEN_SCAN.txt ../p4-output/

