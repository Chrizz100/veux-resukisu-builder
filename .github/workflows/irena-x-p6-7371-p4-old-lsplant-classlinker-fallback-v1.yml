            find . -maxdepth 1 -type f ! -name 'P4_EVIDENCE_SHA256SUMS.txt' -print0               | sort -z | xargs -0 sha256sum > P4_EVIDENCE_SHA256SUMS.txt
          )


      - name: Finalize P6 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p6-output
          for f in \
            P4_BUILD_EXIT_CODE.txt \
            P6_BUILD_EXIT_CODE.txt \
            p4-build.log \
            p6-build.log \
