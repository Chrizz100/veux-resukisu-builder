name: 04 - VEUX 5.4.274 Baseline Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout complete VEUX 5.4.268 source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: 20240619
          fetch-depth: 0
          filter: blob:none
          path: kernel

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            cpio \
            rsync \
            python3 \
            xz-utils \
            zstd

      - name: Upstream VEUX source to Android 5.4.274
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          git config user.name "VEUX Baseline Builder"
          git config user.email "veux-builder@users.noreply.github.com"

          git remote remove android 2>/dev/null || true

          git remote add android \
            https://android.googlesource.com/kernel/common

          git fetch android \
            refs/tags/android11-5.4.274_r00:refs/tags/android11-5.4.274_r00

          git merge \
            --no-edit \
            --no-ff \
            android11-5.4.274_r00

          VERSION=$(awk '$1=="VERSION" && $2=="=" {print $3; exit}' Makefile)
          PATCHLEVEL=$(awk '$1=="PATCHLEVEL" && $2=="=" {print $3; exit}' Makefile)
          SUBLEVEL=$(awk '$1=="SUBLEVEL" && $2=="=" {print $3; exit}' Makefile)

          KVER="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          echo "Merged kernel version: $KVER"

          test "$KVER" = "5.4.274"

          test -f arch/arm64/boot/dts/vendor/xiaomi/veux.dts
          test -f arch/arm64/configs/veux_defconfig

          echo "✅ Linux 5.4.274"
          echo "✅ veux.dts"
          echo "✅ veux_defconfig"

          git status --short

      - name: Download official Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchain/clang-r416183b"

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz" \
            -o "$RUNNER_TEMP/clang-r416183b.tar.gz"

          tar \
            -xzf "$RUNNER_TEMP/clang-r416183b.tar.gz" \
            -C "$GITHUB_WORKSPACE/toolchain/clang-r416183b"

          rm -f "$RUNNER_TEMP/clang-r416183b.tar.gz"

          echo "$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin" >> "$GITHUB_PATH"

          "$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin/clang" --version
          "$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin/ld.lld" --version

      - name: Configure VEUX
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          export PATH="$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin:$PATH"
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"

          rm -rf out

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            veux_defconfig \
            2>&1 | tee "$GITHUB_WORKSPACE/config.log"

          echo
          echo "Critical VEUX configuration:"
          echo

          grep '^CONFIG_ARCH_QCOM=y' out/.config
          grep '^CONFIG_ARCH_HOLI=y' out/.config
          grep '^CONFIG_ARCH_BLAIR=y' out/.config
          grep '^CONFIG_WT_QGKI=y' out/.config
          grep '^CONFIG_LTO_CLANG=y' out/.config
          grep '^CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y' out/.config

          echo
          echo "Kernel release:"
          make \
            -s \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            kernelrelease

      - name: Build VEUX kernel and device tree
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          export PATH="$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin:$PATH"
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"

          echo "Using compiler:"
          clang --version

          echo
          echo "CPU threads:"
          nproc

          echo
          echo "Disk before build:"
          df -h "$GITHUB_WORKSPACE"

          echo
          echo "Starting VEUX 5.4.274 baseline build..."
          echo

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            Image \
            dtbs \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify baseline outputs
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          IMAGE="out/arch/arm64/boot/Image"
          VEUX_DTB="out/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"

          echo "Checking build outputs..."

          test -s "$IMAGE"
          test -s "$VEUX_DTB"
          test -s out/.config

          echo
          echo "✅ Kernel Image exists"
          echo "✅ VEUX DTB exists"
          echo "✅ Kernel config exists"

          echo
          echo "Files:"
          ls -lh "$IMAGE"
          ls -lh "$VEUX_DTB"
          ls -lh out/.config

          echo
          echo "SHA-256:"
          sha256sum "$IMAGE"
          sha256sum "$VEUX_DTB"

          echo
          echo "Parsing VEUX DTB..."

          out/scripts/dtc/dtc \
            -I dtb \
            -O dts \
            -o /dev/null \
            "$VEUX_DTB"

          echo "✅ VEUX DTB parses successfully"

      - name: Prepare baseline artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp \
            kernel/out/arch/arm64/boot/Image \
            "$GITHUB_WORKSPACE/artifacts/Image"

          cp \
            kernel/out/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb \
            "$GITHUB_WORKSPACE/artifacts/veux.dtb"

          cp \
            kernel/out/.config \
            "$GITHUB_WORKSPACE/artifacts/veux-5.4.274.config"

          cp \
            "$GITHUB_WORKSPACE/config.log" \
            "$GITHUB_WORKSPACE/artifacts/config.log"

          cp \
            "$GITHUB_WORKSPACE/build.log" \
            "$GITHUB_WORKSPACE/artifacts/build.log"

          {
            echo "VEUX 5.4.274 BASELINE BUILD"
            echo
            echo "Source: dereference23/kernel_xiaomi_sm6375"
            echo "Source tag: 20240619"
            echo "Upstream target: android11-5.4.274_r00"
            echo "Compiler: clang-r416183b"
            echo
            echo "Kernel release:"
            make \
              -s \
              -C kernel \
              O=out \
              ARCH=arm64 \
              LLVM=1 \
              kernelrelease
            echo
            echo "SHA-256:"
            sha256sum "$GITHUB_WORKSPACE/artifacts/Image"
            sha256sum "$GITHUB_WORKSPACE/artifacts/veux.dtb"
          } > "$GITHUB_WORKSPACE/artifacts/BUILD-INFO.txt"

      - name: Upload successful baseline build
        uses: actions/upload-artifact@v7
        with:
          name: veux-5.4.274-baseline-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

      - name: Upload logs if build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: veux-5.4.274-failure-logs-${{ github.run_number }}
          path: |
            config.log
            build.log
            kernel/out/.config
          retention-days: 14
          if-no-files-found: warn
