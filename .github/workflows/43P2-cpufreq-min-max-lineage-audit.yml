name: 43P2 - VEUX CPUFreq Min Max Lineage Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ARCH: arm64

      COMMON_REF: "android11-5.4.274_r00"
      STOCK_REF: "veux-r-oss"

      STABILITY_REVERT: "f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80"

      EXPECTED_CANDIDATE_TREE: "5d25b7e0124d7fb695f3f07b45928fcb5780d0e8"

      PREVIOUSLY_ASSUMED_MIN_COMMIT: "536504cec86bc49b37f5eae49d439ec4146df00f"

      ARTIFACT_DIR: ${{ github.workspace }}/cpufreq-min-max-lineage-audit

    steps:
      - name: Prepare audit directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ARTIFACT_DIR"

          cat > "$ARTIFACT_DIR/PLAN.txt" <<'EOF'
          VEUX CPUFreq Min / Max Lineage Audit
          =====================================

          This is the corrected successor to 43P.

          43P already proved on exact Candidate 2:

          Candidate:
          - scaling_min_freq writes are silently ignored
          - the min no-op happens before input parsing
          - scaling_max_freq below policy->min is rewritten to policy->min

          Xiaomi VEUX:
          - no min no-op
          - no max-below-min clamp
          - normal freq_qos_update_request() path

          Android Common 5.4.274:
          - no min no-op
          - no max-below-min clamp
          - normal freq_qos_update_request() path

          43P failed later because it treated an externally discovered
          historical/rebased min-no-op commit as an ancestor of the
          current Candidate source line.

          43P2 therefore does NOT hardcode either active tuning commit.

          It will:
          1. Reconstruct exact Candidate 2.
          2. Reconfirm Candidate / Xiaomi / Android Common behavior.
          3. Locate the exact live min-no-op and max-clamp source lines.
          4. Discover their currently active reachable commits with git blame.
          5. Capture reachable -S history for both semantic tokens.
          6. Inspect the discovered commits and their parents.
          7. Create an ARTIFACT-ONLY corrected cpufreq.c copy by removing
             exactly the two Candidate-specific blocks.
          8. Require the corrected store_one() macro to be byte-identical
             to BOTH Xiaomi VEUX and Android Common.
          9. Leave the real kernel source tree untouched.

          AUDIT ONLY.

          No source-tree modification.
          No kernel build.
          No boot.img.
          No flashable ZIP.
          No device access.
          No flashing.
          EOF

      - name: Checkout exact VEUX source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: "20240619"
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Recreate exact Candidate 2
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          BASE_SHA="$(git rev-parse HEAD)"
          BASE_TREE="$(git rev-parse HEAD^{tree})"

          git remote remove android-common 2>/dev/null || true

          git remote add \
            android-common \
            https://android.googlesource.com/kernel/common

          git fetch \
            --no-tags \
            android-common \
            "$COMMON_REF"

          COMMON_SHA="$(git rev-parse FETCH_HEAD)"

          git merge \
            --no-edit \
            "$COMMON_SHA"

          MERGED_SHA="$(git rev-parse HEAD)"
          MERGED_TREE="$(git rev-parse HEAD^{tree})"

          git cat-file -e \
            "${STABILITY_REVERT}^{commit}"

          git revert \
            --no-edit \
            "$STABILITY_REVERT"

          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"

          KERNEL_VERSION="$(make -s kernelversion)"

          if [ "$KERNEL_VERSION" != "5.4.274" ]; then
            echo "ERROR: expected Linux 5.4.274"
            echo "Actual: $KERNEL_VERSION"
            exit 1
          fi

          if [ "$CANDIDATE_TREE" != "$EXPECTED_CANDIDATE_TREE" ]; then
            echo "ERROR: Candidate 2 tree mismatch"
            echo "Expected: $EXPECTED_CANDIDATE_TREE"
            echo "Actual:   $CANDIDATE_TREE"
            exit 1
          fi

          {
            echo "BASE_SHA=$BASE_SHA"
            echo "BASE_TREE=$BASE_TREE"
            echo "COMMON_SHA=$COMMON_SHA"
            echo "MERGED_SHA=$MERGED_SHA"
            echo "MERGED_TREE=$MERGED_TREE"
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "CANDIDATE_TREE=$CANDIDATE_TREE"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "COMMON_REF=$COMMON_REF"
            echo "STABILITY_REVERT=$STABILITY_REVERT"
            echo "PREVIOUSLY_ASSUMED_MIN_COMMIT=$PREVIOUSLY_ASSUMED_MIN_COMMIT"
          } | tee "$ARTIFACT_DIR/IDENTITY.txt"

          {
            echo "COMMON_SHA=$COMMON_SHA"
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
          } >> "$GITHUB_ENV"

      - name: Fetch official Xiaomi VEUX reference
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git remote remove xiaomi 2>/dev/null || true

          git remote add \
            xiaomi \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git

          git fetch \
            --no-tags \
            xiaomi \
            "+refs/heads/${STOCK_REF}:refs/remotes/xiaomi/${STOCK_REF}"

          STOCK_SHA="$(git rev-parse "xiaomi/${STOCK_REF}")"

          {
            echo "STOCK_REF=$STOCK_REF"
            echo "STOCK_SHA=$STOCK_SHA"
          } | tee "$ARTIFACT_DIR/XIAOMI-REFERENCE.txt"

          echo "STOCK_SHA=$STOCK_SHA" >> "$GITHUB_ENV"

      - name: Extract CPUFreq sources and store one macros
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          FILE="drivers/cpufreq/cpufreq.c"

          git show \
            "HEAD:${FILE}" \
            > "$ARTIFACT_DIR/candidate-cpufreq.c"

          git show \
            "xiaomi/${STOCK_REF}:${FILE}" \
            > "$ARTIFACT_DIR/xiaomi-cpufreq.c"

          git show \
            "${COMMON_SHA}:${FILE}" \
            > "$ARTIFACT_DIR/common-cpufreq.c"

          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          out = Path(os.environ["ARTIFACT_DIR"])

          sources = {
              "candidate": out / "candidate-cpufreq.c",
              "xiaomi": out / "xiaomi-cpufreq.c",
              "common": out / "common-cpufreq.c",
          }

          def extract_store_one(text):
              start_marker = "#define store_one(file_name, object)"
              end_marker = "store_one(scaling_max_freq, max);"

              start = text.find(start_marker)

              if start < 0:
                  raise SystemExit(
                      "ERROR: store_one macro start not found"
                  )

              end = text.find(
                  end_marker,
                  start,
              )

              if end < 0:
                  raise SystemExit(
                      "ERROR: scaling_max_freq macro end not found"
                  )

              end += len(end_marker)

              segment = text[start:end]

              if end < len(text) and text[end] == "\n":
                  segment += "\n"

              return segment

          hash_lines = []

          for label, path in sources.items():
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(
                      f"ERROR: missing source {path}"
                  )

              raw = path.read_bytes()

              sha = hashlib.sha256(raw).hexdigest()

              hash_lines.append(
                  f"{label.upper()}_CPUFREQ_SHA256={sha}"
              )

              text = raw.decode(
                  "utf-8",
                  errors="strict",
              )

              macro = extract_store_one(text)

              (
                  out /
                  f"{label}-store-one.c"
              ).write_text(
                  macro,
                  encoding="utf-8",
              )

          (
              out /
              "CPUFREQ-SOURCE-HASHES.txt"
          ).write_text(
              "\n".join(hash_lines) + "\n",
              encoding="utf-8",
          )
          PY

          cat "$ARTIFACT_DIR/CPUFREQ-SOURCE-HASHES.txt"

          {
            echo "============================================================"
            echo "CANDIDATE"
            echo "============================================================"
            cat "$ARTIFACT_DIR/candidate-store-one.c"

            echo
            echo "============================================================"
            echo "XIAOMI"
            echo "============================================================"
            cat "$ARTIFACT_DIR/xiaomi-store-one.c"

            echo
            echo "============================================================"
            echo "ANDROID COMMON"
            echo "============================================================"
            cat "$ARTIFACT_DIR/common-store-one.c"
          } | tee "$ARTIFACT_DIR/STORE-ONE-CONTEXT.txt"

      - name: Verify behavior and prove exact targeted correction
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import difflib
          import hashlib
          import os
          from pathlib import Path

          out = Path(os.environ["ARTIFACT_DIR"])

          candidate_path = out / "candidate-store-one.c"
          xiaomi_path = out / "xiaomi-store-one.c"
          common_path = out / "common-store-one.c"

          candidate = candidate_path.read_text(
              encoding="utf-8"
          )

          xiaomi = xiaomi_path.read_text(
              encoding="utf-8"
          )

          common = common_path.read_text(
              encoding="utf-8"
          )

          min_condition = (
              "if (&policy->object == &policy->min)"
          )

          parse_token = (
              'ret = sscanf(buf, "%lu", &val);'
          )

          max_condition = (
              "if (&policy->object == &policy->max)"
          )

          below_min = (
              "if (val < policy->min)"
          )

          clamp_token = (
              "val = policy->min;"
          )

          qos_token = (
              "freq_qos_update_request("
              "policy->object##_freq_req, val)"
          )

          for token in (
              min_condition,
              parse_token,
              max_condition,
              below_min,
              clamp_token,
              qos_token,
          ):
              if token not in candidate:
                  raise SystemExit(
                      f"ERROR: Candidate token missing: {token}"
                  )

          if candidate.count(min_condition) != 1:
              raise SystemExit(
                  "ERROR: unexpected Candidate min-condition count"
              )

          if candidate.count(max_condition) != 1:
              raise SystemExit(
                  "ERROR: unexpected Candidate max-condition count"
              )

          if candidate.count(clamp_token) != 1:
              raise SystemExit(
                  "ERROR: unexpected Candidate clamp count"
              )

          for label, baseline in (
              ("XIAOMI", xiaomi),
              ("ANDROID_COMMON", common),
          ):
              for forbidden in (
                  min_condition,
                  max_condition,
                  below_min,
                  clamp_token,
              ):
                  if forbidden in baseline:
                      raise SystemExit(
                          f"ERROR: {label} unexpectedly contains "
                          f"{forbidden}"
                      )

              if parse_token not in baseline:
                  raise SystemExit(
                      f"ERROR: {label} input parser missing"
                  )

              if qos_token not in baseline:
                  raise SystemExit(
                      f"ERROR: {label} QoS update missing"
                  )

          if xiaomi != common:
              raise SystemExit(
                  "ERROR: Xiaomi and Android Common store_one "
                  "macros are not byte-identical"
              )

          lines = candidate.splitlines(
              keepends=True
          )

          def find_line(token, start=0):
              matches = [
                  i
                  for i in range(start, len(lines))
                  if token in lines[i]
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      f"ERROR: expected one line for {token}, "
                      f"got {len(matches)}"
                  )

              return matches[0]

          min_i = find_line(min_condition)
          parse_i = find_line(parse_token)
          max_i = find_line(max_condition)
          qos_i = find_line(qos_token)

          if not (
              min_i < parse_i < max_i < qos_i
          ):
              raise SystemExit(
                  "ERROR: unexpected Candidate store_one ordering"
              )

          min_block_lines = lines[
              min_i:parse_i
          ]

          max_block_lines = lines[
              max_i:qos_i
          ]

          min_block = "".join(
              min_block_lines
          )

          max_block = "".join(
              max_block_lines
          )

          if "return count;" not in min_block:
              raise SystemExit(
                  "ERROR: min no-op return missing from block"
              )

          if below_min not in max_block:
              raise SystemExit(
                  "ERROR: max below-min check missing from block"
              )

          if clamp_token not in max_block:
              raise SystemExit(
                  "ERROR: max clamp assignment missing from block"
              )

          sanitized_lines = (
              lines[:min_i]
              + lines[parse_i:max_i]
              + lines[qos_i:]
          )

          sanitized = "".join(
              sanitized_lines
          )

          if sanitized != xiaomi:
              raise SystemExit(
                  "ERROR: targeted correction does not equal "
                  "Xiaomi store_one"
              )

          if sanitized != common:
              raise SystemExit(
                  "ERROR: targeted correction does not equal "
                  "Android Common store_one"
              )

          (
              out /
              "TARGETED-MIN-NOOP-BLOCK.c"
          ).write_text(
              min_block,
              encoding="utf-8",
          )

          (
              out /
              "TARGETED-MAX-CLAMP-BLOCK.c"
          ).write_text(
              max_block,
              encoding="utf-8",
          )

          (
              out /
              "candidate-store-one-sanitized.c"
          ).write_text(
              sanitized,
              encoding="utf-8",
          )

          macro_diff = "".join(
              difflib.unified_diff(
                  candidate.splitlines(
                      keepends=True
                  ),
                  sanitized.splitlines(
                      keepends=True
                  ),
                  fromfile="candidate-store-one.c",
                  tofile="candidate-store-one-sanitized.c",
              )
          )

          (
              out /
              "TARGETED-STORE-ONE-CORRECTION.diff"
          ).write_text(
              macro_diff,
              encoding="utf-8",
          )

          candidate_full_path = (
              out /
              "candidate-cpufreq.c"
          )

          candidate_full = (
              candidate_full_path.read_text(
                  encoding="utf-8"
              )
          )

          if candidate_full.count(candidate) != 1:
              raise SystemExit(
                  "ERROR: Candidate store_one macro cannot be "
                  "uniquely replaced in full source"
              )

          sanitized_full = candidate_full.replace(
              candidate,
              sanitized,
              1,
          )

          (
              out /
              "candidate-cpufreq-targeted-correction.c"
          ).write_text(
              sanitized_full,
              encoding="utf-8",
          )

          full_diff = "".join(
              difflib.unified_diff(
                  candidate_full.splitlines(
                      keepends=True
                  ),
                  sanitized_full.splitlines(
                      keepends=True
                  ),
                  fromfile="candidate-cpufreq.c",
                  tofile=(
                      "candidate-cpufreq-targeted-correction.c"
                  ),
              )
          )

          (
              out /
              "TARGETED-CPUFREQ-CORRECTION.diff"
          ).write_text(
              full_diff,
              encoding="utf-8",
          )

          candidate_sha = hashlib.sha256(
              candidate.encode("utf-8")
          ).hexdigest()

          sanitized_sha = hashlib.sha256(
              sanitized.encode("utf-8")
          ).hexdigest()

          baseline_sha = hashlib.sha256(
              xiaomi.encode("utf-8")
          ).hexdigest()

          result = [
              "CANDIDATE_SCALING_MIN_WRITE_NOOP=YES",
              "CANDIDATE_MIN_NOOP_BEFORE_PARSE=YES",
              "CANDIDATE_MAX_BELOW_MIN_CLAMP=YES",
              "CANDIDATE_MAX_CLAMP_VALUE=policy->min",
              "XIAOMI_SCALING_MIN_WRITE_NOOP=NO",
              "XIAOMI_MAX_BELOW_MIN_CLAMP=NO",
              "ANDROID_COMMON_SCALING_MIN_WRITE_NOOP=NO",
              "ANDROID_COMMON_MAX_BELOW_MIN_CLAMP=NO",
              "XIAOMI_STORE_ONE_EQUALS_ANDROID_COMMON=YES",
              "TARGETED_CORRECTION_BLOCK_COUNT=2",
              "SANITIZED_STORE_ONE_EQUALS_XIAOMI=YES",
              "SANITIZED_STORE_ONE_EQUALS_ANDROID_COMMON=YES",
              f"CANDIDATE_STORE_ONE_SHA256={candidate_sha}",
              f"SANITIZED_STORE_ONE_SHA256={sanitized_sha}",
              f"BASELINE_STORE_ONE_SHA256={baseline_sha}",
          ]

          (
              out /
              "TARGETED-CORRECTION-PROOF.txt"
          ).write_text(
              "\n".join(result) + "\n",
              encoding="utf-8",
          )
          PY

          cat "$ARTIFACT_DIR/TARGETED-CORRECTION-PROOF.txt"

          echo
          echo "============================================================"
          echo "TARGETED STORE_ONE DIFF"
          echo "============================================================"
          cat "$ARTIFACT_DIR/TARGETED-STORE-ONE-CORRECTION.diff"

      - name: Locate exact live tuning lines
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path(
              "drivers/cpufreq/cpufreq.c"
          )

          lines = source.read_text(
              encoding="utf-8"
          ).splitlines()

          start = None
          end = None

          for i, line in enumerate(lines):
              if (
                  "#define store_one(file_name, object)"
                  in line
              ):
                  start = i
                  break

          if start is None:
              raise SystemExit(
                  "ERROR: store_one start not found"
              )

          for i in range(start, len(lines)):
              if (
                  "store_one(scaling_max_freq, max);"
                  in lines[i]
              ):
                  end = i
                  break

          if end is None:
              raise SystemExit(
                  "ERROR: store_one end not found"
              )

          segment = lines[
              start:end + 1
          ]

          def absolute_matches(token):
              return [
                  start + i
                  for i, line in enumerate(segment)
                  if token in line
              ]

          min_conditions = absolute_matches(
              "if (&policy->object == &policy->min)"
          )

          parse_lines = absolute_matches(
              'ret = sscanf(buf, "%lu", &val);'
          )

          max_conditions = absolute_matches(
              "if (&policy->object == &policy->max)"
          )

          clamp_lines = absolute_matches(
              "val = policy->min;"
          )

          if len(min_conditions) != 1:
              raise SystemExit(
                  "ERROR: unexpected min-condition count"
              )

          if len(parse_lines) != 1:
              raise SystemExit(
                  "ERROR: unexpected parser count"
              )

          if len(max_conditions) != 1:
              raise SystemExit(
                  "ERROR: unexpected max-condition count"
              )

          if len(clamp_lines) != 1:
              raise SystemExit(
                  "ERROR: unexpected clamp-line count"
              )

          min_condition = min_conditions[0]
          parse_line = parse_lines[0]
          max_condition = max_conditions[0]
          clamp_line = clamp_lines[0]

          min_returns = [
              i
              for i in range(
                  min_condition + 1,
                  parse_line,
              )
              if "return count;" in lines[i]
          ]

          if len(min_returns) != 1:
              raise SystemExit(
                  "ERROR: exact min no-op return line not found"
              )

          min_return = min_returns[0]

          if not (
              min_condition
              < min_return
              < parse_line
              < max_condition
              < clamp_line
          ):
              raise SystemExit(
                  "ERROR: live tuning ordering unexpected"
              )

          out = Path(
              os.environ["ARTIFACT_DIR"]
          )

          (
              out /
              "LIVE-TUNING-LINES.txt"
          ).write_text(
              "\n".join(
                  [
                      (
                          "STORE_ONE_START_LINE="
                          f"{start + 1}"
                      ),
                      (
                          "MIN_CONDITION_LINE="
                          f"{min_condition + 1}"
                      ),
                      (
                          "MIN_NOOP_RETURN_LINE="
                          f"{min_return + 1}"
                      ),
                      (
                          "PARSE_LINE="
                          f"{parse_line + 1}"
                      ),
                      (
                          "MAX_CONDITION_LINE="
                          f"{max_condition + 1}"
                      ),
                      (
                          "MAX_CLAMP_LINE="
                          f"{clamp_line + 1}"
                      ),
                      (
                          "STORE_ONE_END_LINE="
                          f"{end + 1}"
                      ),
                  ]
              )
              + "\n",
              encoding="utf-8",
          )

          env_path = Path(
              os.environ["GITHUB_ENV"]
          )

          with env_path.open(
              "a",
              encoding="utf-8",
          ) as f:
              f.write(
                  f"MIN_BLAME_LINE={min_return + 1}\n"
              )

              f.write(
                  f"MAX_BLAME_LINE={clamp_line + 1}\n"
              )
          PY

          cat "$ARTIFACT_DIR/LIVE-TUNING-LINES.txt"

      - name: Discover active commits with git blame
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          FILE="drivers/cpufreq/cpufreq.c"

          git blame \
            --porcelain \
            -L "${MIN_BLAME_LINE},${MIN_BLAME_LINE}" \
            HEAD \
            -- "$FILE" \
            > "$ARTIFACT_DIR/MIN-NOOP-BLAME.txt"

          git blame \
            --porcelain \
            -L "${MAX_BLAME_LINE},${MAX_BLAME_LINE}" \
            HEAD \
            -- "$FILE" \
            > "$ARTIFACT_DIR/MAX-CLAMP-BLAME.txt"

          MIN_ACTIVE_COMMIT="$(
            head -n 1 \
              "$ARTIFACT_DIR/MIN-NOOP-BLAME.txt" \
              | awk '{print $1}'
          )"

          MAX_ACTIVE_COMMIT="$(
            head -n 1 \
              "$ARTIFACT_DIR/MAX-CLAMP-BLAME.txt" \
              | awk '{print $1}'
          )"

          if ! [[
            "$MIN_ACTIVE_COMMIT"
            =~ ^[0-9a-f]{40}$
          ]]; then
            echo "ERROR: invalid min blame commit"
            cat "$ARTIFACT_DIR/MIN-NOOP-BLAME.txt"
            exit 1
          fi

          if ! [[
            "$MAX_ACTIVE_COMMIT"
            =~ ^[0-9a-f]{40}$
          ]]; then
            echo "ERROR: invalid max blame commit"
            cat "$ARTIFACT_DIR/MAX-CLAMP-BLAME.txt"
            exit 1
          fi

          git cat-file -e \
            "${MIN_ACTIVE_COMMIT}^{commit}"

          git cat-file -e \
            "${MAX_ACTIVE_COMMIT}^{commit}"

          if ! git merge-base \
            --is-ancestor \
            "$MIN_ACTIVE_COMMIT" \
            HEAD
          then
            echo "ERROR: active min blame commit is not reachable from Candidate"
            exit 1
          fi

          if ! git merge-base \
            --is-ancestor \
            "$MAX_ACTIVE_COMMIT" \
            HEAD
          then
            echo "ERROR: active max blame commit is not reachable from Candidate"
            exit 1
          fi

          {
            echo "MIN_ACTIVE_COMMIT=$MIN_ACTIVE_COMMIT"
            echo "MAX_ACTIVE_COMMIT=$MAX_ACTIVE_COMMIT"
          } >> "$GITHUB_ENV"

          {
            echo "MIN_NOOP_ACTIVE_COMMIT=$MIN_ACTIVE_COMMIT"
            echo "MIN_NOOP_ACTIVE_COMMIT_ANCESTOR=YES"
            echo "MAX_CLAMP_ACTIVE_COMMIT=$MAX_ACTIVE_COMMIT"
            echo "MAX_CLAMP_ACTIVE_COMMIT_ANCESTOR=YES"
          } | tee "$ARTIFACT_DIR/ACTIVE-LINEAGE.txt"

      - name: Trace reachable semantic history
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          FILE="drivers/cpufreq/cpufreq.c"

          git log \
            HEAD \
            --date=iso-strict \
            --pretty=format:'%H%x09%ad%x09%an%x09%s' \
            -S'if (&policy->object == &policy->min)' \
            -- "$FILE" \
            > "$ARTIFACT_DIR/MIN-NOOP-REACHABLE-HISTORY.txt" \
            || true

          git log \
            HEAD \
            --date=iso-strict \
            --pretty=format:'%H%x09%ad%x09%an%x09%s' \
            -S'val = policy->min;' \
            -- "$FILE" \
            > "$ARTIFACT_DIR/MAX-CLAMP-REACHABLE-HISTORY.txt" \
            || true

          {
            echo "============================================================"
            echo "MIN NO-OP REACHABLE HISTORY"
            echo "============================================================"
            cat "$ARTIFACT_DIR/MIN-NOOP-REACHABLE-HISTORY.txt"

            echo
            echo
            echo "============================================================"
            echo "MAX CLAMP REACHABLE HISTORY"
            echo "============================================================"
            cat "$ARTIFACT_DIR/MAX-CLAMP-REACHABLE-HISTORY.txt"
          } | tee "$ARTIFACT_DIR/REACHABLE-HISTORY-COMBINED.txt"

      - name: Capture discovered commits
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          FILE="drivers/cpufreq/cpufreq.c"

          capture_commit() {
            local LABEL="$1"
            local COMMIT="$2"

            git show \
              --no-ext-diff \
              --no-color \
              --format=fuller \
              "$COMMIT" \
              > "$ARTIFACT_DIR/${LABEL}-ACTIVE-COMMIT.txt"

            git show \
              --no-ext-diff \
              --no-color \
              --format= \
              "$COMMIT" \
              -- "$FILE" \
              > "$ARTIFACT_DIR/${LABEL}-ACTIVE-COMMIT.diff"

            git rev-list \
              --parents \
              -n 1 \
              "$COMMIT" \
              > "$ARTIFACT_DIR/${LABEL}-PARENTS.txt"
          }

          capture_commit \
            "MIN-NOOP" \
            "$MIN_ACTIVE_COMMIT"

          capture_commit \
            "MAX-CLAMP" \
            "$MAX_ACTIVE_COMMIT"

          {
            echo "============================================================"
            echo "MIN ACTIVE COMMIT"
            echo "============================================================"
            cat "$ARTIFACT_DIR/MIN-NOOP-ACTIVE-COMMIT.txt"

            echo
            echo "============================================================"
            echo "MAX ACTIVE COMMIT"
            echo "============================================================"
            cat "$ARTIFACT_DIR/MAX-CLAMP-ACTIVE-COMMIT.txt"
          } > "$ARTIFACT_DIR/ACTIVE-COMMITS-COMBINED.txt"

      - name: Inspect discovered commit parents
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          FILE="drivers/cpufreq/cpufreq.c"

          inspect_parents() {
            local LABEL="$1"
            local COMMIT="$2"
            local TOKEN="$3"

            mapfile -t ITEMS < <(
              git rev-list \
                --parents \
                -n 1 \
                "$COMMIT" \
                | tr ' ' '\n'
            )

            local PARENT_COUNT="$(
              (
                echo "${#ITEMS[@]} - 1"
              ) | bc
            )"

            local ABSENT_COUNT=0
            local PRESENT_COUNT=0
            local READABLE_COUNT=0

            {
              echo "LABEL=$LABEL"
              echo "COMMIT=$COMMIT"
              echo "PARENT_COUNT=$PARENT_COUNT"
              echo "TOKEN=$TOKEN"
            } > "$ARTIFACT_DIR/${LABEL}-PARENT-STATE.txt"

            if [ "$PARENT_COUNT" -gt 0 ]; then
              for ((i = 1; i < ${#ITEMS[@]}; i++)); do
                PARENT="${ITEMS[$i]}"

                echo "PARENT_$i=$PARENT" \
                  >> "$ARTIFACT_DIR/${LABEL}-PARENT-STATE.txt"

                if git cat-file -e \
                  "${PARENT}:${FILE}" \
                  2>/dev/null
                then
                  READABLE_COUNT=$((READABLE_COUNT + 1))

                  PARENT_FILE="$ARTIFACT_DIR/${LABEL}-parent-${i}-cpufreq.c"

                  git show \
                    "${PARENT}:${FILE}" \
                    > "$PARENT_FILE"

                  python3 - \
                    "$PARENT_FILE" \
                    "$ARTIFACT_DIR/${LABEL}-parent-${i}-store-one.c" \
                    <<'PY'
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])

          text = source.read_text(
              encoding="utf-8"
          )

          start_marker = "#define store_one(file_name, object)"
          end_marker = "store_one(scaling_max_freq, max);"

          start = text.find(start_marker)

          if start < 0:
              raise SystemExit(
                  "ERROR: parent store_one start not found"
              )

          end = text.find(
              end_marker,
              start,
          )

          if end < 0:
              raise SystemExit(
                  "ERROR: parent store_one end not found"
              )

          end += len(end_marker)

          macro = text[start:end]

          if end < len(text) and text[end] == "\n":
              macro += "\n"

          output.write_text(
              macro,
              encoding="utf-8",
          )
          PY

                  PARENT_MACRO="$ARTIFACT_DIR/${LABEL}-parent-${i}-store-one.c"

                  if grep -qF \
                    "$TOKEN" \
                    "$PARENT_MACRO"
                  then
                    PRESENT_COUNT=$((PRESENT_COUNT + 1))

                    echo "PARENT_${i}_TOKEN_PRESENT=YES" \
                      >> "$ARTIFACT_DIR/${LABEL}-PARENT-STATE.txt"
                  else
                    ABSENT_COUNT=$((ABSENT_COUNT + 1))

                    echo "PARENT_${i}_TOKEN_PRESENT=NO" \
                      >> "$ARTIFACT_DIR/${LABEL}-PARENT-STATE.txt"
                  fi
                else
                  echo "PARENT_${i}_CPUFREQ_READABLE=NO" \
                    >> "$ARTIFACT_DIR/${LABEL}-PARENT-STATE.txt"
                fi
              done
            fi

            {
              echo "READABLE_PARENT_COUNT=$READABLE_COUNT"
              echo "TOKEN_ABSENT_PARENT_COUNT=$ABSENT_COUNT"
              echo "TOKEN_PRESENT_PARENT_COUNT=$PRESENT_COUNT"
            } >> "$ARTIFACT_DIR/${LABEL}-PARENT-STATE.txt"
          }

          inspect_parents \
            "MIN-NOOP" \
            "$MIN_ACTIVE_COMMIT" \
            'if (&policy->object == &policy->min)'

          inspect_parents \
            "MAX-CLAMP" \
            "$MAX_ACTIVE_COMMIT" \
            'val = policy->min;'

          cat "$ARTIFACT_DIR/MIN-NOOP-PARENT-STATE.txt"
          echo
          cat "$ARTIFACT_DIR/MAX-CLAMP-PARENT-STATE.txt"

      - name: Compare old assumed commit with active lineage
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "PREVIOUSLY_ASSUMED_MIN_COMMIT=$PREVIOUSLY_ASSUMED_MIN_COMMIT"
            echo "ACTIVE_MIN_COMMIT=$MIN_ACTIVE_COMMIT"

            if [ \
              "$PREVIOUSLY_ASSUMED_MIN_COMMIT" = \
              "$MIN_ACTIVE_COMMIT" \
            ]; then
              echo "PREVIOUS_ASSUMPTION_EQUALS_ACTIVE_LINEAGE=YES"
            else
              echo "PREVIOUS_ASSUMPTION_EQUALS_ACTIVE_LINEAGE=NO"
            fi

            if git cat-file -e \
              "${PREVIOUSLY_ASSUMED_MIN_COMMIT}^{commit}" \
              2>/dev/null
            then
              echo "PREVIOUS_ASSUMED_COMMIT_AVAILABLE_LOCALLY=YES"

              if git merge-base \
                --is-ancestor \
                "$PREVIOUSLY_ASSUMED_MIN_COMMIT" \
                HEAD
              then
                echo "PREVIOUS_ASSUMED_COMMIT_ANCESTOR=YES"
              else
                echo "PREVIOUS_ASSUMED_COMMIT_ANCESTOR=NO"
              fi
            else
              echo "PREVIOUS_ASSUMED_COMMIT_AVAILABLE_LOCALLY=NO"
              echo "PREVIOUS_ASSUMED_COMMIT_ANCESTOR=NOT_TESTED"
            fi
          } | tee "$ARTIFACT_DIR/PREVIOUS-COMMIT-ASSUMPTION.txt"

      - name: Build final machine readable result
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          PROOF="$ARTIFACT_DIR/TARGETED-CORRECTION-PROOF.txt"

          for REQUIRED in \
            'CANDIDATE_SCALING_MIN_WRITE_NOOP=YES' \
            'CANDIDATE_MAX_BELOW_MIN_CLAMP=YES' \
            'XIAOMI_SCALING_MIN_WRITE_NOOP=NO' \
            'XIAOMI_MAX_BELOW_MIN_CLAMP=NO' \
            'ANDROID_COMMON_SCALING_MIN_WRITE_NOOP=NO' \
            'ANDROID_COMMON_MAX_BELOW_MIN_CLAMP=NO' \
            'XIAOMI_STORE_ONE_EQUALS_ANDROID_COMMON=YES' \
            'TARGETED_CORRECTION_BLOCK_COUNT=2' \
            'SANITIZED_STORE_ONE_EQUALS_XIAOMI=YES' \
            'SANITIZED_STORE_ONE_EQUALS_ANDROID_COMMON=YES'
          do
            if ! grep -qFx \
              "$REQUIRED" \
              "$PROOF"
            then
              echo "ERROR: proof result missing:"
              echo "$REQUIRED"
              exit 1
            fi
          done

          cat > "$ARTIFACT_DIR/RESULT.txt" <<EOF
          RESULT=PASS_AUDIT
          BASE_CANDIDATE_TREE=$EXPECTED_CANDIDATE_TREE
          KERNEL_VERSION=5.4.274
          MIN_NOOP_ACTIVE_COMMIT=$MIN_ACTIVE_COMMIT
          MAX_CLAMP_ACTIVE_COMMIT=$MAX_ACTIVE_COMMIT
          MIN_NOOP_ACTIVE_COMMIT_ANCESTOR=YES
          MAX_CLAMP_ACTIVE_COMMIT_ANCESTOR=YES
          CANDIDATE_SCALING_MIN_NOOP=YES
          CANDIDATE_MIN_NOOP_BEFORE_PARSE=YES
          CANDIDATE_MAX_BELOW_MIN_CLAMP=YES
          XIAOMI_SCALING_MIN_NOOP=NO
          XIAOMI_MAX_BELOW_MIN_CLAMP=NO
          ANDROID_COMMON_SCALING_MIN_NOOP=NO
          ANDROID_COMMON_MAX_BELOW_MIN_CLAMP=NO
          XIAOMI_STORE_ONE_EQUALS_ANDROID_COMMON=YES
          TARGETED_CORRECTION_BLOCK_COUNT=2
          SANITIZED_STORE_ONE_EQUALS_XIAOMI=YES
          SANITIZED_STORE_ONE_EQUALS_ANDROID_COMMON=YES
          PREVIOUS_HARDCODED_COMMIT_USED_AS_ANCESTRY_ASSERTION=NO
          REVIEW_CLASS=BOTH_CUSTOM_CPUFREQ_SYSFS_TUNINGS_CONFIRMED
          SOURCE_MODIFIED=NO
          KERNEL_BUILT=NO
          IMAGE_CREATED=NO
          BOOT_IMAGE_CREATED=NO
          FLASHABLE_ZIP_CREATED=NO
          DEVICE_FLASHED=NO
          EOF

          cat "$ARTIFACT_DIR/RESULT.txt"

      - name: Verify source tree integrity
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet; then
            echo "ERROR: audit modified tracked source"

            git diff \
              --no-ext-diff \
              --no-color

            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: unexpected working-tree files inside kernel"

            git status --short

            exit 1
          fi

          {
            echo "SOURCE_INTEGRITY=PASS"
            echo "TRACKED_SOURCE_DIFF=NONE"
            echo "WORKTREE_STATUS=CLEAN"
          } | tee "$ARTIFACT_DIR/SOURCE-INTEGRITY.txt"

      - name: Upload CPUFreq min max lineage audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-CPUFreq-Min-Max-Lineage-Audit
          path: cpufreq-min-max-lineage-audit/
          if-no-files-found: error
          retention-days: 30
