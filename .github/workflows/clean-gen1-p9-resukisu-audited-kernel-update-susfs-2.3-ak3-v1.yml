name: CLEAN GEN1 P9 - Audited ReSukiSU kernel update + SUSFS 2.3 AK3 v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: clean-gen1-p9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ak3:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

      VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
      VENDOR_TAG: '20240619'
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632

      # Exact accepted P6-v11 FULL-SUSFS-2.3 backup lineage.
      P6V11_ARTIFACT_PREFIX: clean-gen1-p6v11-v6-full-susfs-outer-integration-p7-test-boot-
      EXPECTED_P5I_COMMIT: f353a9475e40ca866d570c1d0ef55e24cf6556e4
      EXPECTED_P5I_TREE: a947c1f2891c796a08373fc755e29b23139dc761
      EXPECTED_RESUKISU_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_RESUKISU_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      EXPECTED_KSU_VERSION: '35102'

      # Reviewed upstream deltas. Apply in this exact order.
      RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
      R1_POLICYDB_FIX: f5992bfce3b292c69989ae8f41e49769563d2db9
      R2_WEBVIEW_ALLOWLIST: 5fe98409dc52506f7a5cc1bb8f94d6f5c849b7f0
      R3_APK_SIGN_HARDENING: 830a5aedc742cb7399cccb61df60d55fd7cbcb90

      # P6-v11 proven build identity/toolchain.
      CLANG_PREBUILT_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      KBUILD_BUILD_USER: builder
      KBUILD_BUILD_HOST: pangu-build-component-vendor-345942-54r9t-tw0tk-tq90c
      KBUILD_BUILD_TIMESTAMP: Thu Dec 5 14:47:59 UTC 2024
      KBUILD_BUILD_VERSION: '1'
      SOURCE_DATE_EPOCH: '1733410079'
      KBUILD_FIXED_SCM_SUFFIX: -g82179e362f33
      STOCK_KERNEL_RELEASE: 5.4.274-qgki-g82179e362f33
      P9_EFFECTIVE_KCFLAGS: -D__ANDROID_COMMON_KERNEL__

      AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
      AK3_COMMIT: e3849cc81950620f8043e69c06e330935ade2eec

      BACKUP_DIR: ${{ github.workspace }}/p6v11-backup
      AUDIT_DIR: ${{ github.workspace }}/clean-gen1-p9-audit
      OUT_A: ${{ github.workspace }}/kernel/out-p9-a
      OUT_B: ${{ github.workspace }}/kernel/out-p9-b
      DIST_DIR: ${{ github.workspace }}/clean-gen1-p9-dist

    steps:
      - name: Initialize audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BACKUP_DIR" "$AUDIT_DIR" "$DIST_DIR"
          mkdir -p "$BACKUP_DIR" "$AUDIT_DIR" "$DIST_DIR"

          cat > "$AUDIT_DIR/00-plan.txt" <<'EOF'
          CLEAN GEN1 P9
          Base: exact last accepted P6-v11 FULL SUSFS 2.3 restore kit.
          Device: VEUX / Linux 5.4.274.
          Output: AnyKernel3 ZIP, Image only.

          ReSukiSU update policy:
            1) f5992bfc policydb ebitmap buffer fix
            2) 5fe98409 WebView zygote allowlist refactor
            3) 830a5aed APK signing-block hardening

          Every commit is scope-audited before application.
          No full upstream merge/cherry-pick is allowed.
          Only the kernel/ paths belonging to the reviewed commit are considered.
          Clean apply is preferred. A 3-way apply is allowed only after the exact
          upstream base/target objects are fetched and only if it resolves without
          conflicts. Postconditions are checked after every delta.

          SUSFS 2.3 outer-kernel implementation is preserved byte-for-byte.
          The selected ReSukiSU deltas must not edit fs/susfs.c, include/linux/susfs*
          or KernelSU/kernel/feature/susfs.c.

          IMPORTANT:
          P9 does NOT fake a newer ReSukiSU version/API number. The accepted P6-v11
          35102 identity is preserved unless a later dedicated API-contract audit
          proves a real API migration. Therefore a Manager "kernel update required"
          banner may remain; this workflow intentionally does not hide it by spoofing.
          EOF

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git jq \
            libelf-dev libssl-dev python3 unzip zip zstd

      - name: Checkout exact VEUX vendor source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: '20240619'
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Authenticate vendor source
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
          test "$(make -s kernelversion)" = "5.4.274"
          {
            echo "VENDOR_SHA=$(git rev-parse HEAD)"
            echo "KERNEL_VERSION=$(make -s kernelversion)"
          } | tee "$AUDIT_DIR/01-vendor.txt"

      - name: Locate newest non-expired P6-v11 FULL-SUSFS backup artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidates="$RUNNER_TEMP/p6v11-candidates.tsv"
          : > "$candidates"

          for page in $(seq 1 20); do
            json="$RUNNER_TEMP/artifacts-${page}.json"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}" \
              -o "$json"

            count="$(jq '.artifacts | length' "$json")"
            jq -r --arg prefix "$P6V11_ARTIFACT_PREFIX" '
              .artifacts[]
              | select(.expired == false)
              | select(.name | startswith($prefix))
              | [.created_at, (.id|tostring), .name, .archive_download_url]
              | @tsv
            ' "$json" >> "$candidates"

            test "$count" -eq 100 || break
          done

          test -s "$candidates"
          IFS=$'\t' read -r created artifact_id artifact_name archive_url \
            < <(LC_ALL=C sort -r "$candidates" | head -n1)

          test -n "$artifact_id"
          test -n "$artifact_name"
          test -n "$archive_url"

          {
            echo "P6V11_BACKUP_CREATED=$created"
            echo "P6V11_BACKUP_ARTIFACT_ID=$artifact_id"
            echo "P6V11_BACKUP_ARTIFACT_NAME=$artifact_name"
          } | tee "$AUDIT_DIR/02-backup-selection.txt"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$archive_url" -o "$RUNNER_TEMP/p6v11-backup.zip"

          unzip -q "$RUNNER_TEMP/p6v11-backup.zip" -d "$BACKUP_DIR"

          restore_dir="$(find "$BACKUP_DIR" -type d -name source-restore-kit -print -quit)"
          test -n "$restore_dir"
          test -f "$restore_dir/manifest.json"
          test -f "$restore_dir/SHA256SUMS"
          test -f "$restore_dir/p5i/resukisu-p5i-full.bundle"

          result_file="$(find "$BACKUP_DIR" -type f -name 17-result.txt -print -quit)"
          test -n "$result_file"
          grep -Fxq 'CLEAN_GEN1_P6V11_FULL_SUSFS_OUTER_INTEGRATION_DETERMINISTIC_BUILD=PASS' \
            "$result_file"

          echo "RESTORE_DIR=$restore_dir" >> "$GITHUB_ENV"
          echo "P6V11_RESULT_FILE=$result_file" >> "$GITHUB_ENV"

      - name: Verify backup checksums and manifest
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RESTORE_DIR"
            sha256sum -c SHA256SUMS
          ) | tee "$AUDIT_DIR/03-restore-kit-sha256.txt"

          if test -f "$RESTORE_DIR/p5i/SHA256SUMS"; then
            (
              cd "$RESTORE_DIR/p5i"
              sha256sum -c SHA256SUMS
            ) | tee "$AUDIT_DIR/03b-p5i-sha256.txt"
          fi

          jq -e \
            --arg p5commit "$EXPECTED_P5I_COMMIT" \
            --arg p5tree "$EXPECTED_P5I_TREE" \
            --arg rhead "$EXPECTED_RESUKISU_HEAD" \
            --arg rtree "$EXPECTED_RESUKISU_TREE" \
            '.stage == "CLEAN_GEN1_P6V11_SOURCE"
             and .p5i_commit == $p5commit
             and .p5i_tree == $p5tree
             and .resukisu_head == $rhead
             and .resukisu_tree == $rtree' \
            "$RESTORE_DIR/manifest.json" >/dev/null

          cp "$RESTORE_DIR/manifest.json" "$AUDIT_DIR/03-source-manifest.json"

      - name: Restore exact accepted P6-v11 source tree
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git reset --hard "$EXPECTED_VENDOR_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"

          p5_patch="$RESTORE_DIR/p5i/vendor-20240619-to-p5i-outer.patch"
          p6_patch="$RESTORE_DIR/p5i-to-p6-source-compat.patch"
          p6v11_patch="$RESTORE_DIR/p6v10-to-p6v11-full-susfs-outer.patch"

          for patch in "$p5_patch" "$p6_patch" "$p6v11_patch"; do
            test -s "$patch"
          done

          git apply --check --whitespace=error --binary "$p5_patch"
          git apply --index --whitespace=error --binary "$p5_patch"
          test "$(git write-tree)" = "$EXPECTED_P5I_TREE"

          git apply --check --whitespace=error --binary "$p6_patch"
          git apply --index --whitespace=error --binary "$p6_patch"

          git apply --check --whitespace=error --binary "$p6v11_patch"
          git apply --index --whitespace=error --binary "$p6v11_patch"

          # Final P6-v11 tree is authenticated by the restore manifest.
          final_expected_tree="$(jq -r '.p6_source_tree' "$RESTORE_DIR/manifest.json")"
          test "$final_expected_tree" != "null"
          test "${#final_expected_tree}" -eq 40
          test "$(git write-tree)" = "$final_expected_tree"

          rm -rf KernelSU
          git init -q KernelSU
          git -C KernelSU fetch -q \
            "$RESTORE_DIR/p5i/resukisu-p5i-full.bundle" \
            refs/heads/clean-gen1-p5i-resukisu:refs/heads/clean-gen1-p5i-resukisu
          git -C KernelSU checkout -q --detach refs/heads/clean-gen1-p5i-resukisu

          test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_RESUKISU_HEAD"
          test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_RESUKISU_TREE"

          {
            echo "P6V11_OUTER_TREE=$final_expected_tree"
            echo "P6V11_RESUKISU_HEAD=$(git -C KernelSU rev-parse HEAD)"
            echo "P6V11_RESUKISU_TREE=$(git -C KernelSU rev-parse HEAD^{tree})"
          } | tee "$AUDIT_DIR/04-restored-source.txt"

      - name: Freeze SUSFS 2.3 baseline before ReSukiSU update
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          grep -Fxq 'CONFIG_KSU=y' arch/arm64/configs/veux_defconfig
          grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' arch/arm64/configs/veux_defconfig
          grep -Fxq 'CONFIG_KSU_SUSFS=y' arch/arm64/configs/veux_defconfig
          grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' arch/arm64/configs/veux_defconfig
          grep -Fxq 'CONFIG_LOCALVERSION="-qgki"' arch/arm64/configs/veux_defconfig

          grep -Fq 'DEFINE_SRCU(susfs_srcu_open_redirect)' fs/susfs.c
          grep -Fq 'srcu_read_lock(&susfs_srcu_open_redirect)' fs/susfs.c
          grep -Fq 'srcu_dereference(open_redirect_list, &susfs_srcu_open_redirect)' fs/susfs.c
          grep -Fq 'synchronize_srcu(&susfs_srcu_open_redirect)' fs/susfs.c

          grep -Fq 'susfs_set_current_proc_no_su' KernelSU/kernel/feature/susfs.c
          grep -Fq 'susfs_set_current_proc_umounted' KernelSU/kernel/feature/susfs.c
          grep -Fq 'susfs_set_current_proc_umounted_for_zygote_next' \
            KernelSU/kernel/feature/susfs.c

          sha256sum \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h \
            KernelSU/kernel/feature/susfs.c \
            KernelSU/kernel/feature/susfs.h \
            > "$AUDIT_DIR/05-susfs-before.sha256"

          sha256sum KernelSU/kernel/Kbuild > "$AUDIT_DIR/05-ksu-kbuild-before.sha256"

      - name: Fetch immutable reviewed ReSukiSU commits
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/resukisu-upstream"
          git clone -q --no-tags "$RESUKISU_REPO" "$GITHUB_WORKSPACE/resukisu-upstream"

          for sha in "$R1_POLICYDB_FIX" "$R2_WEBVIEW_ALLOWLIST" "$R3_APK_SIGN_HARDENING"; do
            git -C "$GITHUB_WORKSPACE/resukisu-upstream" cat-file -e "${sha}^{commit}"
            git -C "$GITHUB_WORKSPACE/resukisu-upstream" cat-file -e "${sha}^{tree}"
          done

          {
            echo "R1=$R1_POLICYDB_FIX"
            echo "R2=$R2_WEBVIEW_ALLOWLIST"
            echo "R3=$R3_APK_SIGN_HARDENING"
          } | tee "$AUDIT_DIR/06-reviewed-commits.txt"

      - name: Audit exact upstream kernel path scopes
        shell: bash
        run: |
          set -euo pipefail
          up="$GITHUB_WORKSPACE/resukisu-upstream"

          check_scope() {
            local label="$1" sha="$2" expected_file="$3"
            local actual="$AUDIT_DIR/${label}-actual-paths.txt"
            git -C "$up" diff --name-only "${sha}^" "$sha" -- kernel \
              | LC_ALL=C sort > "$actual"
            diff -u "$expected_file" "$actual"
          }

          printf '%s\n' \
            kernel/selinux/sepolicy.c \
            > "$AUDIT_DIR/r1-expected-paths.txt"

          printf '%s\n' \
            kernel/feature/kernel_umount.c \
            kernel/feature/kernel_umount.h \
            kernel/hook/setuid_hook.c \
            kernel/policy/allowlist.c \
            | LC_ALL=C sort > "$AUDIT_DIR/r2-expected-paths.txt"

          printf '%s\n' \
            kernel/manager/apk_sign.c \
            > "$AUDIT_DIR/r3-expected-paths.txt"

          check_scope r1 "$R1_POLICYDB_FIX" "$AUDIT_DIR/r1-expected-paths.txt"
          check_scope r2 "$R2_WEBVIEW_ALLOWLIST" "$AUDIT_DIR/r2-expected-paths.txt"
          check_scope r3 "$R3_APK_SIGN_HARDENING" "$AUDIT_DIR/r3-expected-paths.txt"

          echo 'REVIEWED_KERNEL_PATH_SCOPES=PASS' | tee "$AUDIT_DIR/07-scope-result.txt"

      - name: Apply R1 policydb fix fail-closed
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          apply_reviewed_delta() {
            local label="$1" sha="$2"; shift 2
            local up="$GITHUB_WORKSPACE/resukisu-upstream"
            local patch="$AUDIT_DIR/${label}.patch"
            local parent
            parent="$(git -C "$up" rev-parse "${sha}^")"

            git -C "$up" diff --binary "$parent" "$sha" -- "$@" > "$patch"
            test -s "$patch"

            if git -C KernelSU apply --reverse --check "$patch" >/dev/null 2>&1; then
              echo "${label}=ALREADY_EQUIVALENT" | tee "$AUDIT_DIR/${label}-apply.txt"
              return 0
            fi

            if git -C KernelSU apply --check --whitespace=error "$patch"; then
              git -C KernelSU apply --index --whitespace=error "$patch"
              echo "${label}=CLEAN_APPLY" | tee "$AUDIT_DIR/${label}-apply.txt"
              return 0
            fi

            # Controlled fallback: make the exact upstream pre/post blobs available
            # and let git attempt a 3-way merge. Conflicts are fatal.
            git -C KernelSU fetch -q --no-tags "$RESUKISU_REPO" "$parent" "$sha"
            if ! git -C KernelSU apply --3way --check "$patch"; then
              echo "${label}=INCOMPATIBLE_WITH_CURRENT_TREE" | tee "$AUDIT_DIR/${label}-apply.txt"
              exit 1
            fi
            git -C KernelSU apply --3way --index "$patch"
            test -z "$(git -C KernelSU ls-files -u)"
            git -C KernelSU diff --check
            echo "${label}=THREE_WAY_CLEAN" | tee "$AUDIT_DIR/${label}-apply.txt"
          }

          apply_reviewed_delta r1 "$R1_POLICYDB_FIX" kernel/selinux/sepolicy.c

          f=KernelSU/kernel/selinux/sepolicy.c
          grep -Fq 'old_db->p_types.nprim * (sizeof(u32) + sizeof(u64))' "$f"
          grep -Fq 'len -= fp.len;' "$f"
          grep -Fq 'new_db->len = len;' "$f"
          ! grep -Fq 'new_db->len = old_db->len;' "$f"

      - name: Apply R2 WebView allowlist refactor fail-closed
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          up="$GITHUB_WORKSPACE/resukisu-upstream"
          patch="$AUDIT_DIR/r2.patch"
          parent="$(git -C "$up" rev-parse "${R2_WEBVIEW_ALLOWLIST}^")"

          git -C "$up" diff --binary "$parent" "$R2_WEBVIEW_ALLOWLIST" -- \
            kernel/feature/kernel_umount.c \
            kernel/feature/kernel_umount.h \
            kernel/hook/setuid_hook.c \
            kernel/policy/allowlist.c > "$patch"
          test -s "$patch"

          if git -C KernelSU apply --reverse --check "$patch" >/dev/null 2>&1; then
            echo 'r2=ALREADY_EQUIVALENT' | tee "$AUDIT_DIR/r2-apply.txt"
          elif git -C KernelSU apply --check --whitespace=error "$patch"; then
            git -C KernelSU apply --index --whitespace=error "$patch"
            echo 'r2=CLEAN_APPLY' | tee "$AUDIT_DIR/r2-apply.txt"
          else
            git -C KernelSU fetch -q --no-tags "$RESUKISU_REPO" \
              "$parent" "$R2_WEBVIEW_ALLOWLIST"
            if ! git -C KernelSU apply --3way --check "$patch"; then
              echo 'r2=INCOMPATIBLE_WITH_CURRENT_WEBVIEW_BACKPORT' \
                | tee "$AUDIT_DIR/r2-apply.txt"
              exit 1
            fi
            git -C KernelSU apply --3way --index "$patch"
            test -z "$(git -C KernelSU ls-files -u)"
            git -C KernelSU diff --check
            echo 'r2=THREE_WAY_CLEAN' | tee "$AUDIT_DIR/r2-apply.txt"
          fi

          # Exact semantic gate: the old independent global feature must be gone.
          ! grep -RFn 'ksu_webview_zygote_umount_enabled' \
            KernelSU/kernel/feature/kernel_umount.c \
            KernelSU/kernel/feature/kernel_umount.h \
            KernelSU/kernel/hook/setuid_hook.c \
            KernelSU/kernel/policy/allowlist.c

          ! grep -RFn 'KSU_FEATURE_WEBVIEW_ZYGOTE_UMOUNT' \
            KernelSU/kernel/feature/kernel_umount.c \
            KernelSU/kernel/feature/kernel_umount.h \
            KernelSU/kernel/hook/setuid_hook.c \
            KernelSU/kernel/policy/allowlist.c

          grep -Fq 'WEBVIEW_ZYGOTE_UID' KernelSU/kernel/policy/allowlist.c

      - name: Apply R3 APK-signing hardening fail-closed
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          up="$GITHUB_WORKSPACE/resukisu-upstream"
          patch="$AUDIT_DIR/r3.patch"
          parent="$(git -C "$up" rev-parse "${R3_APK_SIGN_HARDENING}^")"

          git -C "$up" diff --binary "$parent" "$R3_APK_SIGN_HARDENING" -- \
            kernel/manager/apk_sign.c > "$patch"
          test -s "$patch"

          if git -C KernelSU apply --reverse --check "$patch" >/dev/null 2>&1; then
            echo 'r3=ALREADY_EQUIVALENT' | tee "$AUDIT_DIR/r3-apply.txt"
          elif git -C KernelSU apply --check --whitespace=error "$patch"; then
            git -C KernelSU apply --index --whitespace=error "$patch"
            echo 'r3=CLEAN_APPLY' | tee "$AUDIT_DIR/r3-apply.txt"
          else
            git -C KernelSU fetch -q --no-tags "$RESUKISU_REPO" \
              "$parent" "$R3_APK_SIGN_HARDENING"
            if ! git -C KernelSU apply --3way --check "$patch"; then
              echo 'r3=INCOMPATIBLE_WITH_CURRENT_APK_SIGN_CODE' \
                | tee "$AUDIT_DIR/r3-apply.txt"
              exit 1
            fi
            git -C KernelSU apply --3way --index "$patch"
            test -z "$(git -C KernelSU ls-files -u)"
            git -C KernelSU diff --check
            echo 'r3=THREE_WAY_CLEAN' | tee "$AUDIT_DIR/r3-apply.txt"
          fi

          f=KernelSU/kernel/manager/apk_sign.c
          grep -Fq 'id == 0x7109871au' "$f"
          grep -Fq 'id != 0x42726577u' "$f"
          grep -Fq 'Unexpected signature block id' "$f"
          ! grep -Fq 'v3_signing_exist' "$f"
          ! grep -Fq 'v3_1_signing_exist' "$f"

      - name: Prove SUSFS and version-identity boundaries were not touched
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h \
            KernelSU/kernel/feature/susfs.c \
            KernelSU/kernel/feature/susfs.h \
            > "$AUDIT_DIR/08-susfs-after.sha256"
          cmp -s "$AUDIT_DIR/05-susfs-before.sha256" "$AUDIT_DIR/08-susfs-after.sha256"

          sha256sum KernelSU/kernel/Kbuild > "$AUDIT_DIR/08-ksu-kbuild-after.sha256"
          cmp -s "$AUDIT_DIR/05-ksu-kbuild-before.sha256" \
                 "$AUDIT_DIR/08-ksu-kbuild-after.sha256"

          # Approved delta paths only. No accidental outer-kernel mutation.
          git -C KernelSU diff --name-only HEAD | LC_ALL=C sort \
            > "$AUDIT_DIR/08-resukisu-changed-paths.txt"

          cat > "$AUDIT_DIR/08-expected-resukisu-changed-paths.txt" <<'EOF'
          kernel/feature/kernel_umount.c
          kernel/feature/kernel_umount.h
          kernel/hook/setuid_hook.c
          kernel/manager/apk_sign.c
          kernel/policy/allowlist.c
          kernel/selinux/sepolicy.c
          EOF

          # Some deltas may already have been equivalent in P6-v11. In that case the
          # actual set is a strict subset, never a superset. Validate every actual path.
          while IFS= read -r path; do
            grep -Fxq "$path" "$AUDIT_DIR/08-expected-resukisu-changed-paths.txt"
          done < "$AUDIT_DIR/08-resukisu-changed-paths.txt"

          grep -Fq 'CLEAN_GEN1_UPSTREAM_COMPAT_VERSION' KernelSU/kernel/Kbuild
          grep -Eq '35102' KernelSU/kernel/Kbuild

          {
            echo "SUSFS_2_3_BASELINE_BYTE_PRESERVED=PASS"
            echo "KSU_KBUILD_IDENTITY_BYTE_PRESERVED=PASS"
            echo "KSU_VERSION_IDENTITY_EXPECTED=$EXPECTED_KSU_VERSION"
            echo "MANAGER_API4_SPOOFED=NO"
            echo "APPROVED_RESUKISU_DELTA_SCOPE=PASS"
          } | tee "$AUDIT_DIR/08-boundaries.txt"

      - name: Save exact P9 ReSukiSU delta and hashes
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          git -C KernelSU diff --binary HEAD > "$AUDIT_DIR/09-p9-resukisu-delta.patch"
          test -s "$AUDIT_DIR/09-p9-resukisu-delta.patch"

          sha256sum \
            KernelSU/kernel/selinux/sepolicy.c \
            KernelSU/kernel/feature/kernel_umount.c \
            KernelSU/kernel/feature/kernel_umount.h \
            KernelSU/kernel/hook/setuid_hook.c \
            KernelSU/kernel/policy/allowlist.c \
            KernelSU/kernel/manager/apk_sign.c \
            > "$AUDIT_DIR/09-updated-files.sha256"

          git -C KernelSU diff --check
          test -z "$(git -C KernelSU ls-files -u)"

      - name: Install pinned Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TOOLCHAIN_DIR"
          mkdir -p "$TOOLCHAIN_DIR"
          url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz"
          curl --fail --location --retry 3 "$url" \
            -o "$RUNNER_TEMP/clang-r416183b.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang-r416183b.tar.gz" -C "$TOOLCHAIN_DIR"

          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            test -x "$TOOLCHAIN_DIR/bin/$tool"
          done

          "$TOOLCHAIN_DIR/bin/clang" --version | tee "$AUDIT_DIR/10-clang-version.txt"
          sha256sum "$RUNNER_TEMP/clang-r416183b.tar.gz" \
            | tee "$AUDIT_DIR/10-clang-archive.sha256"

      - name: Configure and build A
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export KBUILD_BUILD_USER KBUILD_BUILD_HOST KBUILD_BUILD_TIMESTAMP
          export KBUILD_BUILD_VERSION SOURCE_DATE_EPOCH KBUILD_FIXED_SCM_SUFFIX

          rm -rf "$OUT_A"
          make O="$OUT_A" \
            ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            veux_defconfig \
            2>&1 | tee "$AUDIT_DIR/11-build-a-config.log"

          grep -Fxq 'CONFIG_KSU=y' "$OUT_A/.config"
          grep -Fxq 'CONFIG_KSU_SUSFS=y' "$OUT_A/.config"
          grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' "$OUT_A/.config"
          grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' "$OUT_A/.config"

          make -j"$(nproc)" \
            O="$OUT_A" \
            ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            KCFLAGS="$P9_EFFECTIVE_KCFLAGS" \
            Image dtbs \
            2>&1 | tee "$AUDIT_DIR/11-build-a.log"

          image="$OUT_A/arch/arm64/boot/Image"
          test -s "$image"
          test "$(stat -c '%s' "$image")" -gt 20000000

          strings -a "$image" > "$AUDIT_DIR/11-image-a-strings.txt"
          grep -Fq "Linux version $STOCK_KERNEL_RELEASE ($KBUILD_BUILD_USER@$KBUILD_BUILD_HOST)" \
            "$AUDIT_DIR/11-image-a-strings.txt"
          grep -Fq "#1 SMP PREEMPT $KBUILD_BUILD_TIMESTAMP" \
            "$AUDIT_DIR/11-image-a-strings.txt"

          sha256sum "$image" | tee "$AUDIT_DIR/11-image-a.sha256"
          (
            cd "$OUT_A"
            find arch/arm64/boot/dts -type f -name '*.dtb' -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$AUDIT_DIR/11-dtbs-a.sha256"

      - name: Configure and build B for reproducibility
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export KBUILD_BUILD_USER KBUILD_BUILD_HOST KBUILD_BUILD_TIMESTAMP
          export KBUILD_BUILD_VERSION SOURCE_DATE_EPOCH KBUILD_FIXED_SCM_SUFFIX

          rm -rf "$OUT_B"
          make O="$OUT_B" \
            ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            veux_defconfig \
            2>&1 | tee "$AUDIT_DIR/12-build-b-config.log"

          cmp -s "$OUT_A/.config" "$OUT_B/.config"

          make -j"$(nproc)" \
            O="$OUT_B" \
            ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            KCFLAGS="$P9_EFFECTIVE_KCFLAGS" \
            Image dtbs \
            2>&1 | tee "$AUDIT_DIR/12-build-b.log"

          image_a="$OUT_A/arch/arm64/boot/Image"
          image_b="$OUT_B/arch/arm64/boot/Image"
          cmp -s "$image_a" "$image_b"

          (
            cd "$OUT_B"
            find arch/arm64/boot/dts -type f -name '*.dtb' -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$AUDIT_DIR/12-dtbs-b.sha256"
          cmp -s "$AUDIT_DIR/11-dtbs-a.sha256" "$AUDIT_DIR/12-dtbs-b.sha256"

          {
            echo "IMAGE_REPRODUCIBLE=PASS"
            echo "DTBS_REPRODUCIBLE=PASS"
            echo "IMAGE_SHA256=$(sha256sum "$image_a" | awk '{print $1}')"
            echo "IMAGE_BYTES=$(stat -c '%s' "$image_a")"
          } | tee "$AUDIT_DIR/12-reproducibility.txt"

      - name: Build VEUX AnyKernel3 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/AnyKernel3"
          git clone -q "$AK3_REPO" "$GITHUB_WORKSPACE/AnyKernel3"
          git -C "$GITHUB_WORKSPACE/AnyKernel3" checkout -q --detach "$AK3_COMMIT"

          cp "$OUT_A/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/AnyKernel3/Image"

          cat > "$GITHUB_WORKSPACE/AnyKernel3/anykernel.sh" <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          properties() { '
          kernel.string=VEUX GEN1 P9 Linux 5.4.274 ReSukiSU audited deltas + SUSFS 2.3
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=veux
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF

          cat > "$GITHUB_WORKSPACE/AnyKernel3/P9-AUDIT-NOTE.txt" <<EOF
          CLEAN GEN1 P9
          Base: P6-v11 FULL SUSFS 2.3
          Linux: 5.4.274
          Device: veux
          ReSukiSU base: $EXPECTED_RESUKISU_HEAD
          Audited kernel deltas:
            $R1_POLICYDB_FIX
            $R2_WEBVIEW_ALLOWLIST
            $R3_APK_SIGN_HARDENING

          SUSFS outer implementation changed by P9: NO
          ReSukiSU Kbuild/version identity changed by P9: NO
          Forced/spoofed API4 identity: NO

          This package is a real kernel-source update, but it intentionally does not
          claim a newer API contract that was not audited. A Manager update warning
          may therefore remain until a dedicated API migration is verified.
          EOF

          rm -rf "$GITHUB_WORKSPACE/AnyKernel3/.git"
          zip_name="VEUX-GEN1-P9-5.4.274-ReSukiSU-Audited-SUSFS-2.3-AK3.zip"

          (
            cd "$GITHUB_WORKSPACE/AnyKernel3"
            zip -r9 "$DIST_DIR/$zip_name" . \
              -x '.github/*' 'README.md' '*placeholder'
          )

          test -s "$DIST_DIR/$zip_name"
          unzip -t "$DIST_DIR/$zip_name" | tee "$AUDIT_DIR/13-ak3-unzip-test.txt"
          unzip -l "$DIST_DIR/$zip_name" | tee "$AUDIT_DIR/13-ak3-contents.txt"

          # AK3 must contain exactly the built kernel payload named Image.
          unzip -p "$DIST_DIR/$zip_name" Image > "$RUNNER_TEMP/p9-ak3-Image"
          cmp -s "$RUNNER_TEMP/p9-ak3-Image" "$OUT_A/arch/arm64/boot/Image"

          sha256sum "$DIST_DIR/$zip_name" | tee "$DIST_DIR/SHA256SUMS"
          cp "$AUDIT_DIR/00-plan.txt" "$DIST_DIR/P9-WORKFLOW-POLICY.txt"
          cp "$AUDIT_DIR/12-reproducibility.txt" "$DIST_DIR/P9-REPRODUCIBILITY.txt"
          cp "$AUDIT_DIR/08-boundaries.txt" "$DIST_DIR/P9-BOUNDARIES.txt"
          cp "$AUDIT_DIR/09-p9-resukisu-delta.patch" "$DIST_DIR/P9-RESUKISU-DELTA.patch"

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail

          grep -Fxq 'SUSFS_2_3_BASELINE_BYTE_PRESERVED=PASS' "$AUDIT_DIR/08-boundaries.txt"
          grep -Fxq 'KSU_KBUILD_IDENTITY_BYTE_PRESERVED=PASS' "$AUDIT_DIR/08-boundaries.txt"
          grep -Fxq 'APPROVED_RESUKISU_DELTA_SCOPE=PASS' "$AUDIT_DIR/08-boundaries.txt"
          grep -Fxq 'IMAGE_REPRODUCIBLE=PASS' "$AUDIT_DIR/12-reproducibility.txt"
          grep -Fxq 'DTBS_REPRODUCIBLE=PASS' "$AUDIT_DIR/12-reproducibility.txt"

          test "$(find "$DIST_DIR" -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1
          zip_file="$(find "$DIST_DIR" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -s "$zip_file"

          {
            echo "CLEAN_GEN1_P9_AUDITED_RESUKISU_SUSFS23_AK3=PASS"
            echo "BASE_RESUKISU=$EXPECTED_RESUKISU_HEAD"
            echo "R1=$R1_POLICYDB_FIX"
            echo "R2=$R2_WEBVIEW_ALLOWLIST"
            echo "R3=$R3_APK_SIGN_HARDENING"
            echo "SUSFS_OUTER_CHANGED=NO"
            echo "KSU_API_IDENTITY_SPOOFED=NO"
            echo "AK3=$(basename "$zip_file")"
            echo "AK3_SHA256=$(sha256sum "$zip_file" | awk '{print $1}')"
          } | tee "$DIST_DIR/FINAL-RESULT.txt"

          (
            cd "$DIST_DIR"
            sha256sum \
              P9-WORKFLOW-POLICY.txt \
              P9-REPRODUCIBILITY.txt \
              P9-BOUNDARIES.txt \
              P9-RESUKISU-DELTA.patch \
              FINAL-RESULT.txt \
              > SUPPORT-SHA256SUMS
          )

      - name: Upload P9 AK3 release
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p9-veux-5.4.274-resukisu-audited-susfs-2.3-ak3-${{ github.run_id }}
          path: clean-gen1-p9-dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload P9 audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p9-audit-${{ github.run_id }}
          path: clean-gen1-p9-audit/
          if-no-files-found: warn
          retention-days: 90
