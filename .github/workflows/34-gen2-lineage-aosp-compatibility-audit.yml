      - name: Build failure safe W34 audit
        if: always()
        shell: bash
        run: |
          set +e

          REPORT='GEN2_34_LINEAGE_AOSP_COMPATIBILITY_AUDIT.txt'

          if [ ! -s "$REPORT" ]; then
            {
              echo "AUDIT=GEN2_34_LINEAGE_AOSP_COMPATIBILITY"
              echo "RESULT=INCOMPLETE_OR_FAILED"
              echo "FAILURE_SAFE_AUDIT_GENERATED=YES"
              echo "DATE_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo
              for f in \
                w34/evidence/audit-header.txt \
                w34/evidence/w33-artifact-fetch-status.txt \
                w34/evidence/w33-v7-evidence-status.txt \
                w34/evidence/gen2-source-status.txt \
                w34/evidence/lineage-branch-fetch-status.txt \
                w34/evidence/public-kernel-branch-contract.txt \
                w34/evidence/lineage-23.2-boot-contract.txt \
                w34/evidence/historical-module-compat-status.txt \
                w34/evidence/kernel-version-comparison-status.txt \
                w34/evidence/ak3-static-feasibility.txt \
                w34/evidence/compatibility-scope-status.txt
