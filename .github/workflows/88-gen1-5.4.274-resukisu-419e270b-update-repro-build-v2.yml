name: 88 - GEN1 5.4.274 ReSukiSU 419e270b Update Repro Build v2

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

env:
  ARCH: arm64

  W72_RECIPE: .github/workflows/72-veux-5.4.274-resukisu-input-hook-stability-repro-v1.yml
  W65_PATH: .github/workflows/65-kernelsu-v0.9.5-susfs-2.2.0-cross-run-reproducibility-v1.yml
  RECIPE_PATH: .github/workflows/46C7-final-cumulative-resukisu-susfs-deterministic-cross-run-reference.yml
  RECIPE_JOB: full-build
  RECIPE_STOP_STEP: "27"

  BASE_REF: faccf4c5edc7be37776216e7d43dd3dca0239331
  PREVIOUS_REF: 4a3785025a920e4f52584f14c663eea4850dc919
  TARGET_REF: 419e270b50ad61725185dec74f438b8cb59c6889

  SUCOMPAT_REFACTOR: 75b99e3e2f312377fc9e5d3720324c0caaf1e610
  EXECVEAT_SUPPORT: 9671b9d11e459467d41884c98e1366b13aaae2cc
  OLD_HOOK_COMPAT: cc44ff62d9dc8b84dbd7c3e4d2703f6a6fb844c3
  SUSFS_SYNC: 03b60f260cce36f23efbd26c9c334edfdc9ce7eb
  INPUT_HOOK_STABILITY: 4a3785025a920e4f52584f14c663eea4850dc919
  SELINUX_HIDE_UPDATE: 6f50cba2a3919cfcec9f9061580a04588fb465b7
  WEBVIEW_ZYGOTE_UPDATE: 419e270b50ad61725185dec74f438b8cb59c6889

  BUILDER_DIR: ${{ github.workspace }}/builder-repo
  DRIVER_DIR: ${{ github.workspace }}/w72-driver
  ARTIFACT_DIR: ${{ github.workspace }}/w72-artifact
  PATCH_DIR: ${{ github.workspace }}/w72-patches
  OUT_DIR_NAME: out-w68

  KBUILD_BUILD_USER: w68
  KBUILD_BUILD_HOST: veux-w68
  KBUILD_BUILD_TIMESTAMP: "Tue Aug 25 00:00:00 UTC 2026"
  KBUILD_BUILD_VERSION: "1"
  SOURCE_DATE_EPOCH: "1787616000"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 210

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          path: builder-repo
          fetch-depth: 0

      - name: Checkout ReSukiSU 419e270b target
        uses: actions/checkout@v6
        with:
          repository: ReSukiSU/ReSukiSU
          ref: 419e270b50ad61725185dec74f438b8cb59c6889
          path: ReSukiSU-target
          fetch-depth: 0

      - name: Verify GEN1 update target before replay
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C ReSukiSU-target rev-parse HEAD)" = "$TARGET_REF"
          git -C ReSukiSU-target merge-base --is-ancestor "$BASE_REF" "$TARGET_REF"
          git -C ReSukiSU-target merge-base --is-ancestor "$PREVIOUS_REF" "$TARGET_REF"
          git -C ReSukiSU-target merge-base --is-ancestor "$SELINUX_HIDE_UPDATE" "$TARGET_REF"

          test "$(git -C ReSukiSU-target rev-list --count "$PREVIOUS_REF..$TARGET_REF")" -eq 11

          if git -C ReSukiSU-target diff --name-only "$PREVIOUS_REF..$TARGET_REF" \
              -- kernel uapi | grep -Fq 'module_load_filter'
          then
            echo "ERROR: module_load_filter appears in 4a378502..419e270b delta" >&2
            exit 1
          fi

          mkdir -p w88-compact
          {
            echo "W88_TARGET_PREFLIGHT=PASS"
            echo "KERNEL=5.4.274"
            echo "DEVICE_SCOPE=VEUX"
            echo "PREVIOUS_RESUKISU=$PREVIOUS_REF"
            echo "TARGET_RESUKISU=$TARGET_REF"
            echo "COMMITS_AFTER_PREVIOUS=11"
            echo "MODULE_LOAD_FILTER_INCLUDED=NO"
          } > w88-compact/W88-PREFLIGHT.txt

      - name: Replay proven W72 pipeline with 419e270b kernel delta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          export W88_W72_FILE="$BUILDER_DIR/$W72_RECIPE"
          test -s "$W88_W72_FILE"

          export W88_ENV_FILE="$RUNNER_TEMP/w88-github-env"
          export W88_OUTPUT_FILE="$RUNNER_TEMP/w88-github-output"
          : > "$W88_ENV_FILE"
          : > "$W88_OUTPUT_FILE"
          export GITHUB_ENV="$W88_ENV_FILE"
          export GITHUB_OUTPUT="$W88_OUTPUT_FILE"

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          recipe = Path(os.environ["W88_W72_FILE"])
          doc = yaml.load(recipe.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          steps = doc["jobs"]["integrate-compile"]["steps"]

          skip_names = {
              "Write W72 verdict",
              "Upload W72 artifact",
              "Fail when SUSFS 5.4 API adaptation is required",
          }

          env = os.environ.copy()
          log = Path("w88-compact/W88-W72-REPLAY.log")
          state = Path("w88-compact/W88-W72-REPLAY-STATE.txt")
          completed = 0
          delta_applied = False

          def expand(value):
              if not isinstance(value, str):
                  return value
              replacements = {
                  "$" + "{{ github.workspace }}": env["GITHUB_WORKSPACE"],
                  "$" + "{{ runner.temp }}": env["RUNNER_TEMP"],
                  "$" + "{{ github.token }}": env.get("GH_TOKEN", ""),
              }
              for old, new in replacements.items():
                  value = value.replace(old, new)
              return value

          def import_env():
              p = Path(env["GITHUB_ENV"])
              if not p.exists():
                  return
              lines = p.read_text(encoding="utf-8", errors="replace").splitlines()
              for line in lines:
                  if not line or line.startswith("#"):
                      continue
                  if "<<" in line:
                      raise SystemExit("unsupported multiline GITHUB_ENV entry: " + line)
                  if "=" in line:
                      k, v = line.split("=", 1)
                      if k:
                          env[k] = v
              p.write_text("", encoding="utf-8")

          delta_script = r'''
          set -euo pipefail

          DELTA="$PATCH_DIR/w88-4a378502-to-419e270b-kernel-uapi.patch"

          git -C ReSukiSU-target diff \
            --binary \
            "$PREVIOUS_REF..$TARGET_REF" \
            -- kernel/ uapi/ \
            > "$DELTA"

          test -s "$DELTA"

          if grep -Fq 'module_load_filter' "$DELTA"; then
            echo "ERROR: excluded module_load_filter leaked into W88 delta" >&2
            exit 1
          fi

          git -C "$KSU_ROOT" apply --check --verbose "$DELTA"
          git -C "$KSU_ROOT" apply --verbose "$DELTA"

          grep -Fq 'KSU_FEATURE_WEBVIEW_ZYGOTE_UMOUNT' "$KSU_ROOT/uapi/feature.h"
          grep -Fq 'ksu_webview_zygote_umount_enabled' \
            "$KSU_ROOT/kernel/feature/kernel_umount.c"
          grep -Fq 'WEBVIEW_ZYGOTE_UID' \
            "$KSU_ROOT/kernel/feature/kernel_umount.c"

          grep -Fq 'avd.seqno = 1;' \
            "$KSU_ROOT/kernel/feature/selinux_hide.c"
          grep -Fq 'new_status->sequence = 0;' \
            "$KSU_ROOT/kernel/feature/selinux_hide.c"
          grep -Fq 'new_status->policyload = 0;' \
            "$KSU_ROOT/kernel/feature/selinux_hide.c"

          python3 - "$KSU_ROOT/kernel/hook/setuid_hook.c" <<'PYS'
          import re, sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          m = re.search(
              r"static int handle_zygote_next_setresuid\s*\([^)]*\)\s*\{",
              text,
          )
          if not m:
              raise SystemExit("zygote_next handler missing")
          i = m.end()
          depth = 1
          while i < len(text) and depth:
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
              i += 1
          body = text[m.end():i-1]

          for label, pat in (
              ("isolated", r"if\s*\(is_isolated_process\(new_uid\)\)\s*\{(.*?)\n\s*\}"),
              (
                  "normal_app",
                  r"if\s*\(likely\(is_appuid\(new_uid\)\s*&&\s*"
                  r"ksu_uid_should_umount\(new_uid\)\)\)\s*\{(.*?)\n\s*\}",
              ),
          ):
              x = re.search(pat, body, re.S)
              if not x:
                  raise SystemExit(label + " block missing")
              b = x.group(1)
              for call in (
                  "susfs_set_current_proc_no_su();",
                  "susfs_set_current_proc_umounted();",
                  "susfs_set_current_proc_umounted_for_zygote_next();",
              ):
                  if call not in b:
                      raise SystemExit(label + ": missing " + call)

          if "WEBVIEW_ZYGOTE_UID" not in body:
              raise SystemExit("webview zygote branch missing")
          print("SUSFS_0FF93279_SEMANTIC=PASS")
          PYS

          {
            echo "W88_419E270B_KERNEL_UAPI_DELTA=PASS"
            echo "WEBVIEW_ZYGOTE_UMOUNT=PASS"
            echo "SELINUX_HIDE_5_4=PASS"
            echo "AVD_SEQNO_1=PASS"
            echo "SUSFS_ZYGOTE_NEXT_TIF_PROC_UMOUNTED=PASS"
            echo "MODULE_LOAD_FILTER_INCLUDED=NO"
            echo "DELTA_SHA256=$(sha256sum "$DELTA" | awk '{print $1}')"
          } > "$ARTIFACT_DIR/07b-w88-419e270b-delta.txt"
          '''

          with log.open("w", encoding="utf-8") as fp:
              for step in steps:
                  name = step.get("name", "")
                  script = step.get("run")
                  if not script or name in skip_names:
                      continue

                  script = expand(script)
                  if ("$" + "{{") in script:
                      raise SystemExit("unresolved GitHub expression in " + name)

                  step_env = env.copy()
                  for k, v in step.get("env", {}).items():
                      step_env[k] = expand(v)

                  banner = f"\n===== W88 REPLAY: {name} =====\n"
                  print(banner, end="")
                  fp.write(banner)
                  fp.flush()

                  cp = subprocess.run(
                      ["bash", "-euo", "pipefail", "-c", script],
                      env=step_env,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                  )
                  print(cp.stdout or "", end="")
                  fp.write(cp.stdout or "")
                  fp.flush()

                  if cp.returncode != 0:
                      state.write_text(
                          "\n".join([
                              "W88_W72_REPLAY=FAIL",
                              f"FAILED_STEP={name}",
                              f"EXIT_CODE={cp.returncode}",
                              f"COMPLETED_RUN_BLOCKS={completed}",
                          ]) + "\n",
                          encoding="utf-8",
                      )
                      raise SystemExit(cp.returncode)

                  completed += 1
                  import_env()

                  if name == "Apply selected ReSukiSU kernel chain":
                      cp = subprocess.run(
                          ["bash", "-euo", "pipefail", "-c", delta_script],
                          env=env.copy(),
                          text=True,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,
                      )
                      print(cp.stdout or "", end="")
                      fp.write(cp.stdout or "")
                      fp.flush()
                      if cp.returncode != 0:
                          state.write_text(
                              "\n".join([
                                  "W88_W72_REPLAY=FAIL",
                                  "FAILED_STEP=Apply 419e270b cumulative kernel/uapi delta",
                                  f"EXIT_CODE={cp.returncode}",
                                  f"COMPLETED_RUN_BLOCKS={completed}",
                              ]) + "\n",
                              encoding="utf-8",
                          )
                          raise SystemExit(cp.returncode)
                      delta_applied = True

          if not delta_applied:
              raise SystemExit("W88 delta insertion point was never reached")

          state.write_text(
              "\n".join([
                  "W88_W72_REPLAY=PASS",
                  f"COMPLETED_RUN_BLOCKS={completed}",
                  "419E270B_DELTA_APPLIED=YES",
                  "FAILED_STEP=NONE",
              ]) + "\n",
              encoding="utf-8",
          )
          PY

          grep -Fxq 'W88_W72_REPLAY=PASS' \
            w88-compact/W88-W72-REPLAY-STATE.txt

      - name: Promote compact GEN1 W88 outputs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p w88-compact

          IMAGE="$GITHUB_WORKSPACE/w72-build-a/Image"
          CONFIG="$GITHUB_WORKSPACE/w72-build-a/config"

          test -s "$IMAGE"
          test -s "$CONFIG"
          test -s "$ARTIFACT_DIR/14-reproducibility.txt"
          test -s "$ARTIFACT_DIR/15-hook-contracts.txt"
          test -s "$ARTIFACT_DIR/16-susfs-stability-contracts.txt"
          test -s "$ARTIFACT_DIR/07b-w88-419e270b-delta.txt"

          grep -Fq 'REPRODUCIBILITY=PASS' "$ARTIFACT_DIR/14-reproducibility.txt"
          grep -Fq 'MANUAL_HOOK_CONTRACTS=PASS' "$ARTIFACT_DIR/15-hook-contracts.txt"
          grep -Fq 'SUSFS_STABILITY_CONTRACTS=PASS' "$ARTIFACT_DIR/16-susfs-stability-contracts.txt"
          grep -Fq 'W88_419E270B_KERNEL_UAPI_DELTA=PASS' \
            "$ARTIFACT_DIR/07b-w88-419e270b-delta.txt"

          strings "$IMAGE" | grep -m1 '^Linux version 5\.4\.274' \
            > w88-compact/W88-IMAGE-LINUX-VERSION.txt

          cp "$IMAGE" w88-compact/GEN1_W88_Image
          cp "$CONFIG" w88-compact/GEN1_W88_final.config
          cp "$ARTIFACT_DIR/07b-w88-419e270b-delta.txt" w88-compact/
          cp "$ARTIFACT_DIR/14-reproducibility.txt" w88-compact/
          cp "$ARTIFACT_DIR/15-hook-contracts.txt" w88-compact/
          cp "$ARTIFACT_DIR/16-susfs-stability-contracts.txt" w88-compact/

          sha256sum \
            w88-compact/GEN1_W88_Image \
            w88-compact/GEN1_W88_final.config \
            > w88-compact/W88-SHA256SUMS.txt

          {
            echo "W88_GEN1_5.4.274_UPDATE=PASS"
            echo "DEVICE_SCOPE=VEUX"
            echo "RESUKISU_PIN=$TARGET_REF"
            echo "SUSFS_VERSION=2.2"
            echo "WEBVIEW_ZYGOTE_UMOUNT=PASS"
            echo "SELINUX_HIDE_5_4=PASS"
            echo "AVD_SEQNO_1=PASS"
            echo "SUSFS_ZYGOTE_NEXT_TIF_PROC_UMOUNTED=PASS"
            echo "MODULE_LOAD_FILTER_INCLUDED=NO"
            echo "REPRODUCIBILITY=PASS"
            echo "IMAGE_SHA256=$(sha256sum w88-compact/GEN1_W88_Image | awk '{print $1}')"
            echo "IMAGE_BYTES=$(stat -c '%s' w88-compact/GEN1_W88_Image)"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHING_PERFORMED=NO"
            echo "NEXT_STAGE=GEN1_CLEAN_RELEASE"
          } > w88-compact/W88-FINAL-VERDICT.txt

      - name: Preserve failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p w88-compact
          {
            echo "W88_RESULT=FAILURE"
            echo "TARGET=$TARGET_REF"
            if [ -f w88-compact/W88-W72-REPLAY-STATE.txt ]; then
              cat w88-compact/W88-W72-REPLAY-STATE.txt
            fi
            echo "REPLAY_LOG_TAIL_BEGIN"
            tail -n 400 w88-compact/W88-W72-REPLAY.log 2>/dev/null || true
            echo "REPLAY_LOG_TAIL_END"
          } > w88-compact/W88-FAILURE-SUMMARY.txt

      - name: Upload compact W88 artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: GEN1_W88_5.4.274_ReSukiSU_419E270B_COMPACT-${{ github.run_number }}
          path: w88-compact/
          if-no-files-found: error
          retention-days: 60
          compression-level: 6

      - name: Final W88 gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'W88_GEN1_5.4.274_UPDATE=PASS' \
            w88-compact/W88-FINAL-VERDICT.txt
