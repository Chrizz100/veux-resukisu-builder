name: VEUX GEN1 U1D P13 Runtime Role + Link Graph Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: veux-gen1-u1d-p13-runtime-role-linkgraph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p13-runtime-role-linkgraph-audit:
    name: Reproduce exact P13 then resolve runtime module roles
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    env:
      ARCH: arm64
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      EXPECTED_VENDOR_KERNEL_VERSION: 5.4.268
      EXPECTED_OUTER_TREE: 19b68131d7a3955085f60c4fb8cf64442427af0c

      RESTORE_ARTIFACT_ID: "9989363798"
      RESTORE_ARTIFACT_NAME: clean-gen1-p6v11-v6-full-susfs-outer-integration-p7-test-boot-34031837372
      EXPECTED_P5I_COMMIT: f353a9475e40ca866d570c1d0ef55e24cf6556e4
      EXPECTED_P5I_TREE: a947c1f2891c796a08373fc755e29b23139dc761
      EXPECTED_RESUKISU_BASE_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_RESUKISU_BASE_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb

      RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
      RESUKISU_COMMON_BASE: faccf4c5edc7be37776216e7d43dd3dca0239331
      RESUKISU_TARGET: 7741f87849f7ad7cebf82bbb4c5b89880e61e37e
      RESUKISU_EXCLUDED_MODULE_FILTER: b2ac2fc8703ce9f5226e2a38a59f8b72f8a3005c
      P13_KSU_VERSION: "35141"
      P13_KSU_UAPI: "4"
      P13_TARGET_TAG: v4.2.0-rc1
      P13_TARGET_SHORT: 7741f878
      EXPECTED_IMPORT_PATCH_SHA256: 902e427888714266d9771908cd593191a478cd32ae7a895c77b76c976939c76f

      EXPECTED_P13_PATCH_SHA256: d56725a9d6a6dc7bf1e73a5763b894bdabb544119f4c75df5f437ccd4ff29a52
      EXPECTED_P12_EXEC_SHA256: fa3b73421f35d6220fb9e03e112a9509b76c04933af2353c9a8c65d6fb6bd6a9
      EXPECTED_P12_CONTRACT_SHA256: b6d1875f6a79231465bc78df6484f2856a427259998eb93ba9fd2597cb45ca53
      EXPECTED_P12_SUSFS_C_SHA256: e430d573ba5875a55d1ca70ba1b304e4b6727bbc42b8c3ac16f2c175b29a59c1
      EXPECTED_P12_SUSFS_H_SHA256: 3c5fb1bcc28a70c82ee5cfe0a7375bb8e7babd26618ce9b451e598fa31aa3b6e
      EXPECTED_P12_SUSFS_DEF_SHA256: b16108a5fcd4cdd7203d9f084c2154da708ab3ae6bed17109e4ec63f04ff0f68

      CLANG_PREBUILT_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      OUT_DIR: ${{ github.workspace }}/kernel/out-p13
      BACKUP_DIR: ${{ github.workspace }}/u1d-restore
      AUDIT_DIR: ${{ github.workspace }}/u1d-evidence
      SNAPSHOT_DIR: ${{ github.workspace }}/u1d-snapshots

      KBUILD_BUILD_USER: builder
      KBUILD_BUILD_HOST: pangu-build-component-vendor-345942-54r9t-tw0tk-tq90c
      KBUILD_BUILD_TIMESTAMP: Thu Dec 5 14:47:59 UTC 2024
      KBUILD_BUILD_VERSION: "1"
      SOURCE_DATE_EPOCH: "1733410079"
      KBUILD_FIXED_SCM_SUFFIX: -g82179e362f33
      EFFECTIVE_KCFLAGS: -D__ANDROID_COMMON_KERNEL__

      EXPECTED_KERNEL_RELEASE: 5.4.274-qgki-g82179e362f33
      EXPECTED_IMAGE_BYTES: "29843968"
      EXPECTED_IMAGE_SHA256: 12f2eae90243878aa8c5fbd7cb14e9cbfb422869dae6bb14491feb987269a1b2
      EXPECTED_VEUX_DTB_SHA256: 42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37

      P13_REFERENCE_RUN_ID: "34811720288"
      P13_REFERENCE_ARTIFACT_ID: "10335461893"
      P13_REFERENCE_ARTIFACT_NAME: clean-gen1-p13-veux-susfs153f-postexec-ak3-34811720288
      P13_REFERENCE_ARTIFACT_DIGEST: sha256:5c0533566a99201c028ef9355267ef6cea38b74c11dc6d7f871e2d807aa0c0b3
      P13_REFERENCE_DIR: ${{ github.workspace }}/u1d-p13-reference

    steps:
      - name: Initialize U1D audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/kernel" \
                 "$BACKUP_DIR" "$AUDIT_DIR" "$SNAPSHOT_DIR" "$P13_REFERENCE_DIR" \
                 "$GITHUB_WORKSPACE/resukisu-upstream" \
                 "$GITHUB_WORKSPACE/toolchains"
          mkdir -p "$BACKUP_DIR" "$AUDIT_DIR" "$SNAPSHOT_DIR" "$TOOLCHAIN_DIR" "$P13_REFERENCE_DIR"

          cat > "$AUDIT_DIR/00-U1D-PLAN.txt" <<'EOF'
          VEUX GEN1 U1D - P13 Runtime Module Role + Link Graph Audit

          Established before U1D:
          - P13 is the immutable DEVICE-PASS master.
          - U1C-v2R2 reproduces the P13 Image bit-for-bit when the original
            output path kernel/out-p13 is used.
          - P13 exact Image:
            12f2eae90243878aa8c5fbd7cb14e9cbfb422869dae6bb14491feb987269a1b2
          - P13 has CONFIG_MODULES=n.
          - U1C-v2R2's first-pass coverage model was deliberately conservative
            and left 50 logical public module names unresolved.
          - Those same 50 logical names occur across all five public snapshots,
            so they are not yet evidence of separate firmware/ROM ABI groups.
          - The first-pass model looked mostly at final .config values.
            Qualcomm QGKI/techpack Make-time CONFIG exports can differ from
            normal Kconfig visibility, so final .config alone is insufficient.

          U1D purpose:
          1. reproduce P13 bit-for-bit again using the proven out-p13 path
          2. capture the effective Make variable database used by the P13 tree
          3. capture actual output .o/.cmd/built-in.a link-graph evidence
          4. read every public modules.load* file plus modules.dep closure
          5. compare only runtime-load-listed logical module roles
          6. compare each role against P13:
             - effective Make CONFIG=y evidence
             - normal .config CONFIG=y evidence
             - actual built-object/link-command evidence
             - exported-symbol identity against P13 vmlinux
             - conservative global-symbol overlap
          7. distinguish:
             - common runtime roles shared by all snapshots
             - snapshot-specific runtime roles
             - truly unresolved P13 runtime roles
          8. decide whether any technical compatibility-group split is
             statically justified

          Important:
          - Presence of a .ko file alone is NOT a runtime dependency.
          - A final .config "# CONFIG_FOO is not set" alone is NOT proof that a
            Qualcomm techpack/QGKI component was absent from the final Image.
          - No unresolved role is silently promoted to PASS.
          - Shared unresolved roles do not by themselves justify ROM/region
            kernel variants.
          - This remains a STATIC audit. It cannot create DEVICE PASS for an
            untested firmware.
          - No kernel patch, flash, push, commit, tag, release or workflow
            dispatch is performed.
          EOF

      - name: Install audit and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git git-lfs jq \
            libelf-dev libncurses-dev libssl-dev patch python3 rsync \
            unzip zip xz-utils zstd kmod binutils
          git lfs install --skip-repo

      - name: Checkout exact VEUX vendor source
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/dereference23/kernel_xiaomi_sm6375.git \
            "$GITHUB_WORKSPACE/kernel"
          git -C "$GITHUB_WORKSPACE/kernel" checkout -q --detach "$EXPECTED_VENDOR_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
          test "$(make -s -C "$GITHUB_WORKSPACE/kernel" kernelversion)" = "$EXPECTED_VENDOR_KERNEL_VERSION"
          {
            echo "VENDOR_SHA=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD)"
            echo "VENDOR_KERNEL_VERSION=$(make -s -C "$GITHUB_WORKSPACE/kernel" kernelversion)"
            echo "FRESH_VENDOR_CHECKOUT=PASS"
          } | tee "$AUDIT_DIR/01-vendor.txt"

      - name: Download exact frozen CLEAN-GEN1 restore artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          meta="$RUNNER_TEMP/restore-artifact.json"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RESTORE_ARTIFACT_ID}" \
            -o "$meta"

          test "$(jq -r '.id|tostring' "$meta")" = "$RESTORE_ARTIFACT_ID"
          test "$(jq -r '.name' "$meta")" = "$RESTORE_ARTIFACT_NAME"
          test "$(jq -r '.expired' "$meta")" = "false"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RESTORE_ARTIFACT_ID}/zip" \
            -o "$RUNNER_TEMP/u1c-restore.zip"

          unzip -q "$RUNNER_TEMP/u1c-restore.zip" -d "$BACKUP_DIR"
          restore_dir="$(find "$BACKUP_DIR" -type d -name source-restore-kit -print -quit)"
          test -n "$restore_dir"
          test -f "$restore_dir/manifest.json"
          test -f "$restore_dir/SHA256SUMS"
          echo "RESTORE_DIR=$restore_dir" >> "$GITHUB_ENV"

          {
            echo "RESTORE_ARTIFACT_ID=$RESTORE_ARTIFACT_ID"
            echo "RESTORE_ARTIFACT_NAME=$RESTORE_ARTIFACT_NAME"
            echo "RESTORE_ARTIFACT_CREATED=$(jq -r '.created_at' "$meta")"
            echo "RESTORE_ARTIFACT_EXACT_PIN=PASS"
          } | tee "$AUDIT_DIR/02-restore-selection.txt"

      - name: Reconstruct frozen P12 outer source
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          (
            cd "$RESTORE_DIR"
            sha256sum -c SHA256SUMS
          ) | tee "$AUDIT_DIR/03-restore-sha256.txt"

          jq -e \
            --arg p5commit "$EXPECTED_P5I_COMMIT" \
            --arg p5tree "$EXPECTED_P5I_TREE" \
            --arg rhead "$EXPECTED_RESUKISU_BASE_HEAD" \
            --arg rtree "$EXPECTED_RESUKISU_BASE_TREE" \
            '.stage == "CLEAN_GEN1_P6V11_SOURCE"
             and .p5i_commit == $p5commit
             and .p5i_tree == $p5tree
             and .resukisu_head == $rhead
             and .resukisu_tree == $rtree' \
            "$RESTORE_DIR/manifest.json" >/dev/null

          git reset --hard "$EXPECTED_VENDOR_SHA"
          git clean -fdx
          rm -rf "$OUT_DIR"

          p5_patch="$RESTORE_DIR/p5i/vendor-20240619-to-p5i-outer.patch"
          p6_patch="$RESTORE_DIR/p5i-to-p6-source-compat.patch"
          p6v11_patch="$RESTORE_DIR/p6v10-to-p6v11-full-susfs-outer.patch"

          for p in "$p5_patch" "$p6_patch" "$p6v11_patch"; do
            test -s "$p"
            git apply --check --whitespace=error --binary "$p"
            git apply --index --whitespace=error --binary "$p"
          done

          final_expected_tree="$(jq -r '.p6_source_tree' "$RESTORE_DIR/manifest.json")"
          test "$final_expected_tree" = "$EXPECTED_OUTER_TREE"
          test "$(git write-tree)" = "$EXPECTED_OUTER_TREE"
          test "$(make -s kernelversion)" = "5.4.274"

          grep -Fxq 'CONFIG_KSU=y' arch/arm64/configs/veux_defconfig
          grep -Fxq 'CONFIG_KSU_SUSFS=y' arch/arm64/configs/veux_defconfig
          grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' arch/arm64/configs/veux_defconfig
          grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' arch/arm64/configs/veux_defconfig
          grep -Fxq 'CONFIG_LOCALVERSION="-qgki"' arch/arm64/configs/veux_defconfig

          {
            echo "CLEAN_SOURCE_RECONSTRUCTION=PASS"
            echo "OUTER_SOURCE_TREE=$final_expected_tree"
            echo "KERNEL_VERSION=$(make -s kernelversion)"
          } | tee "$AUDIT_DIR/04-source.txt"

      - name: Construct exact pinned ReSukiSU kernel UAPI import without module filter
        shell: bash
        run: |
          set -euo pipefail
          up="$GITHUB_WORKSPACE/resukisu-upstream"
          rm -rf "$up"
          git clone -q "$RESUKISU_REPO" "$up"

          for c in "$RESUKISU_COMMON_BASE" "$RESUKISU_TARGET" "$RESUKISU_EXCLUDED_MODULE_FILTER"; do
            git -C "$up" cat-file -e "${c}^{commit}"
          done
          git -C "$up" checkout -q --detach "$RESUKISU_TARGET"
          git -C "$up" reset --hard -q "$RESUKISU_TARGET"
          git -C "$up" clean -fdx -q

          test "$(git -C "$up" rev-list --count "$RESUKISU_TARGET" | awk '{print 30700+$1}')" = "$P13_KSU_VERSION"
          test "$(git -C "$up" describe --abbrev=0 --tags "$RESUKISU_TARGET")" = "$P13_TARGET_TAG"
          test "$(git -C "$up" rev-parse --short=8 "$RESUKISU_TARGET")" = "$P13_TARGET_SHORT"
          git -C "$up" show "$RESUKISU_TARGET:uapi/supercall.h" \
            | grep -Eq "KERNEL_SU_UAPI_VERSION = ${P13_KSU_UAPI};"

          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "resukisu-upstream"

          def remove_exact(path, block, expected=1):
              p = root / path
              text = p.read_text(encoding="utf-8")
              count = text.count(block)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected}, found {count}: {block!r}")
              p.write_text(text.replace(block, "", expected), encoding="utf-8")

          for rel in (
              "kernel/feature/module_load_filter.c",
              "kernel/feature/module_load_filter.h",
          ):
              p = root / rel
              if not p.is_file():
                  raise SystemExit(f"missing expected file: {rel}")
              p.unlink()

          remove_exact("kernel/Kbuild", "kernelsu-objs += feature/module_load_filter.o\n")
          remove_exact("kernel/core/init.c", '#include "feature/module_load_filter.h"\n')
          remove_exact(
              "kernel/core/init.c",
              'char ksu_block_modules[256];\n'
              'module_param_string(block_modules, ksu_block_modules, sizeof(ksu_block_modules), 0);\n'
              'MODULE_PARM_DESC(block_modules, "Comma-separated preset module names to acknowledge without loading");\n\n'
          )
          remove_exact("kernel/core/init.c", "        ksu_module_load_filter_hook_init();\n\n")
          remove_exact("kernel/core/init.c", "    ksu_module_load_filter_hook_exit();\n")
          PY

          test ! -e "$up/kernel/feature/module_load_filter.c"
          test ! -e "$up/kernel/feature/module_load_filter.h"
          ! grep -RFn 'module_load_filter' "$up/kernel" "$up/uapi"
          ! grep -RFn 'ksu_block_modules' "$up/kernel" "$up/uapi"
          ! grep -RFn 'block_modules' "$up/kernel" "$up/uapi"

          patch="$AUDIT_DIR/05-current-kernel-uapi-minus-module-filter.patch"
          git -C "$up" diff --binary "$RESUKISU_COMMON_BASE" -- kernel uapi > "$patch"
          test -s "$patch"
          test "$(sha256sum "$patch" | awk '{print $1}')" = "$EXPECTED_IMPORT_PATCH_SHA256"

          {
            echo "CURRENT_KERNEL_UAPI_PATCH=PASS"
            echo "MODULE_LOAD_FILTER_EXCLUDED=PASS"
            echo "PATCH_SHA256=$(sha256sum "$patch" | awk '{print $1}')"
          } | tee "$AUDIT_DIR/05-resukisu-import.txt"

      - name: Replace ReSukiSU subtree and restore CLEAN-GEN1 integration contract
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          up="$GITHUB_WORKSPACE/resukisu-upstream"
          patch="$AUDIT_DIR/05-current-kernel-uapi-minus-module-filter.patch"

          rm -rf KernelSU
          git clone -q "$RESUKISU_REPO" KernelSU
          git -C KernelSU checkout -q --detach "$RESUKISU_COMMON_BASE"
          git -C KernelSU reset --hard -q "$RESUKISU_COMMON_BASE"
          git -C KernelSU clean -fdx -q

          git -C KernelSU apply --check --whitespace=nowarn "$patch"
          git -C KernelSU apply --index --whitespace=nowarn "$patch"
          test -z "$(git -C KernelSU ls-files -u)"

          if ! diff -qr "$up/kernel" KernelSU/kernel > "$AUDIT_DIR/06-kernel-parity.txt" 2>&1; then
            cat "$AUDIT_DIR/06-kernel-parity.txt"
            exit 1
          fi
          if ! diff -qr "$up/uapi" KernelSU/uapi > "$AUDIT_DIR/06-uapi-parity.txt" 2>&1; then
            cat "$AUDIT_DIR/06-uapi-parity.txt"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import os

          def ensure_include(path, anchor):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              inc = '#include <linux/ksu_hook_contract.h>'
              if inc not in text:
                  if anchor not in text:
                      raise SystemExit(f"anchor missing in {path}: {anchor!r}")
                  text = text.replace(anchor, anchor + "\n" + inc, 1)
                  p.write_text(text, encoding="utf-8")

          ensure_include("KernelSU/kernel/feature/sucompat.h", '#include "compat/kernel_compat.h"')
          ensure_include("KernelSU/kernel/runtime/ksud_integration.c", "#include <linux/version.h>")
          ensure_include("KernelSU/kernel/supercall/supercall.c", "#include <linux/anon_inodes.h>")

          p = Path("KernelSU/kernel/Kbuild")
          text = p.read_text(encoding="utf-8")
          old = dedent("""\
          KSU_LOCAL_VERSION := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-list --count HEAD)
          KSU_VERSION := $(shell expr 30000 + $(KSU_LOCAL_VERSION) + 700)

          KSU_TAG_NAME    := $(shell cd $(KSU_SRC); $(GIT_BIN) describe --abbrev=0 --tags 2>/dev/null || echo "v4.1.0")
          KSU_COMMIT_SHA  := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-parse --short=8 HEAD 2>/dev/null || echo "unknown")
          ifneq ($(shell cd $(KSU_SRC); $(GIT_BIN) diff-index --quiet HEAD; echo $$?),0)
          KSU_COMMIT_SHA  := $(KSU_COMMIT_SHA)-dirty
          endif
          KSU_BRANCH_NAME := $(shell cd $(KSU_SRC); $(GIT_BIN) branch --show-current 2>/dev/null || echo "unknown")""")
          version = os.environ["P13_KSU_VERSION"]
          tag = os.environ["P13_TARGET_TAG"]
          short = os.environ["P13_TARGET_SHORT"]
          target = os.environ["RESUKISU_TARGET"]
          new = dedent(f"""\
          KSU_LOCAL_VERSION := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-list --count HEAD)
          CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := {version}
          CLEAN_GEN1_UPSTREAM_TARGET := {target}
          KSU_VERSION := $(CLEAN_GEN1_UPSTREAM_COMPAT_VERSION)

          KSU_TAG_NAME    := {tag}
          KSU_COMMIT_SHA  := {short}-p13
          KSU_BRANCH_NAME := clean-gen1-p13""")
          if old not in text:
              raise SystemExit("expected ReSukiSU Kbuild version block not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git -C KernelSU add kernel uapi
          test -z "$(git -C KernelSU ls-files -u)"

          grep -Fq '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/feature/sucompat.h
          grep -Fq '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/runtime/ksud_integration.c
          grep -Fq '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/supercall/supercall.c
          grep -Fq "CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := $P13_KSU_VERSION" KernelSU/kernel/Kbuild
          grep -Fq "CLEAN_GEN1_UPSTREAM_TARGET := $RESUKISU_TARGET" KernelSU/kernel/Kbuild

      - name: Verify frozen P12 boundaries and apply exact P13 delta
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          grep -Eq "KERNEL_SU_UAPI_VERSION = ${P13_KSU_UAPI};" KernelSU/uapi/supercall.h
          grep -Fq 'always flag that, to avoid old version of susfs hang in boot' \
            KernelSU/kernel/feature/sucompat.c
          grep -Fq '#define TIF_PROC_IN_KSU_EXECVE 61' KernelSU/kernel/feature/sucompat.h
          grep -Fq 'if (profile->uid != 0)' KernelSU/kernel/policy/app_profile.c

          test ! -e KernelSU/kernel/feature/module_load_filter.c
          test ! -e KernelSU/kernel/feature/module_load_filter.h
          ! grep -RFn 'module_load_filter' KernelSU/kernel KernelSU/uapi
          ! grep -RFn 'block_modules' KernelSU/kernel KernelSU/uapi

          test "$(sha256sum fs/exec.c | awk '{print $1}')" = "$EXPECTED_P12_EXEC_SHA256"
          test "$(sha256sum include/linux/ksu_hook_contract.h | awk '{print $1}')" = "$EXPECTED_P12_CONTRACT_SHA256"
          test "$(sha256sum fs/susfs.c | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_C_SHA256"
          test "$(sha256sum include/linux/susfs.h | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_H_SHA256"
          test "$(sha256sum include/linux/susfs_def.h | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_DEF_SHA256"

          python3 - <<'PY'
          from pathlib import Path

          hdr = Path("include/linux/ksu_hook_contract.h")
          text = hdr.read_text(encoding="utf-8")
          anchor = """int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
                                  void *argv, void *envp, int *flags);
          """
          addition = anchor + """
          #ifdef CONFIG_KSU_SUSFS
          int ksu_handle_post_execve(int *fd, const char *filename,
                                     void *argv, void *envp,
                                     int *flags, int *retval);
          #endif
          """
          if text.count(anchor) != 1:
              raise SystemExit(f"header anchor count={text.count(anchor)}")
          if "int ksu_handle_post_execve(" in text:
              raise SystemExit("post-exec prototype unexpectedly present")
          hdr.write_text(text.replace(anchor, addition, 1), encoding="utf-8")

          execp = Path("fs/exec.c")
          text = execp.read_text(encoding="utf-8")
          anchor = """\tsecurity_bprm_committed_creds(bprm);
          \tmutex_unlock(&current->signal->cred_guard_mutex);
          """
          replacement = """\tsecurity_bprm_committed_creds(bprm);
          #ifdef CONFIG_KSU_SUSFS
          \tksu_handle_post_execve(NULL, NULL, NULL, NULL, NULL, NULL);
          #endif
          \tmutex_unlock(&current->signal->cred_guard_mutex);
          """
          if text.count(anchor) != 1:
              raise SystemExit(f"fs/exec.c anchor count={text.count(anchor)}")
          if "ksu_handle_post_execve(" in text:
              raise SystemExit("post-exec call unexpectedly present")
          execp.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY

          git diff --check
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "fs/exec.c"
          test "${changed[1]}" = "include/linux/ksu_hook_contract.h"

          p13_patch="$AUDIT_DIR/07-P13-post-exec.patch"
          git diff --binary -- fs/exec.c include/linux/ksu_hook_contract.h > "$p13_patch"
          test "$(sha256sum "$p13_patch" | awk '{print $1}')" = "$EXPECTED_P13_PATCH_SHA256"

          test "$(sha256sum fs/susfs.c | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_C_SHA256"
          test "$(sha256sum include/linux/susfs.h | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_H_SHA256"
          test "$(sha256sum include/linux/susfs_def.h | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_DEF_SHA256"

          {
            echo "P13_DELTA=PASS"
            echo "P13_PATCH_SHA256=$EXPECTED_P13_PATCH_SHA256"
            echo "P13_CHANGED_FILES=fs/exec.c include/linux/ksu_hook_contract.h"
            echo "P13_MODULE_LOAD_FILTER_EXCLUDED=PASS"
          } | tee "$AUDIT_DIR/07-p13-source-gate.txt"

      - name: Install pinned Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TOOLCHAIN_DIR"
          mkdir -p "$TOOLCHAIN_DIR"
          url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz"
          curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/clang-r416183b.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang-r416183b.tar.gz" -C "$TOOLCHAIN_DIR"

          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            test -x "$TOOLCHAIN_DIR/bin/$tool"
          done
          "$TOOLCHAIN_DIR/bin/clang" --version | tee "$AUDIT_DIR/08-clang.txt"

      - name: Download and verify exact original P13 reference binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          meta="$RUNNER_TEMP/p13-reference-artifact.json"
          archive="$RUNNER_TEMP/p13-reference-artifact.zip"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P13_REFERENCE_ARTIFACT_ID}" \
            -o "$meta"

          test "$(jq -r '.id|tostring' "$meta")" = "$P13_REFERENCE_ARTIFACT_ID"
          test "$(jq -r '.name' "$meta")" = "$P13_REFERENCE_ARTIFACT_NAME"
          test "$(jq -r '.expired' "$meta")" = "false"
          test "$(jq -r '.workflow_run.id|tostring' "$meta")" = "$P13_REFERENCE_RUN_ID"
          test "$(jq -r '.digest' "$meta")" = "$P13_REFERENCE_ARTIFACT_DIGEST"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P13_REFERENCE_ARTIFACT_ID}/zip" \
            -o "$archive"

          test "sha256:$(sha256sum "$archive" | awk '{print $1}')" = "$P13_REFERENCE_ARTIFACT_DIGEST"

          rm -rf "$P13_REFERENCE_DIR"
          mkdir -p "$P13_REFERENCE_DIR"
          unzip -q "$archive" -d "$P13_REFERENCE_DIR"

          test -s "$P13_REFERENCE_DIR/Image"
          test -s "$P13_REFERENCE_DIR/veux.dtb"
          test -s "$P13_REFERENCE_DIR/FINAL-RESULT.txt"
          test -s "$P13_REFERENCE_DIR/SUPPORT-SHA256SUMS"

          test "$(stat -c '%s' "$P13_REFERENCE_DIR/Image")" = "$EXPECTED_IMAGE_BYTES"
          test "$(sha256sum "$P13_REFERENCE_DIR/Image" | awk '{print $1}')" = "$EXPECTED_IMAGE_SHA256"
          test "$(sha256sum "$P13_REFERENCE_DIR/veux.dtb" | awk '{print $1}')" = "$EXPECTED_VEUX_DTB_SHA256"

          grep -Fxq "IMAGE_SHA256=$EXPECTED_IMAGE_SHA256" "$P13_REFERENCE_DIR/FINAL-RESULT.txt"
          grep -Fxq "VEUX_DTB_SHA256=$EXPECTED_VEUX_DTB_SHA256" "$P13_REFERENCE_DIR/FINAL-RESULT.txt"
          grep -Fxq "KSU_VERSION=$P13_KSU_VERSION" "$P13_REFERENCE_DIR/FINAL-RESULT.txt"
          grep -Fxq "KSU_UAPI=$P13_KSU_UAPI" "$P13_REFERENCE_DIR/FINAL-RESULT.txt"

          {
            echo "REFERENCE_RUN_ID=$P13_REFERENCE_RUN_ID"
            echo "REFERENCE_ARTIFACT_ID=$P13_REFERENCE_ARTIFACT_ID"
            echo "REFERENCE_ARTIFACT_NAME=$P13_REFERENCE_ARTIFACT_NAME"
            echo "REFERENCE_ARTIFACT_DIGEST=$P13_REFERENCE_ARTIFACT_DIGEST"
            echo "REFERENCE_IMAGE_BYTES=$(stat -c '%s' "$P13_REFERENCE_DIR/Image")"
            echo "REFERENCE_IMAGE_SHA256=$(sha256sum "$P13_REFERENCE_DIR/Image" | awk '{print $1}')"
            echo "REFERENCE_DTB_SHA256=$(sha256sum "$P13_REFERENCE_DIR/veux.dtb" | awk '{print $1}')"
            echo "REFERENCE_BINARY_GATE=PASS"
          } | tee "$AUDIT_DIR/08-p13-reference.txt"

          strings -a "$P13_REFERENCE_DIR/Image" \
            | grep -E 'Linux version 5\.4\.274-qgki-g82179e362f33|v4\.2\.0-rc1-7741f878-p13@ReSukiSU' \
            | head -n 20 \
            > "$AUDIT_DIR/08-p13-reference-identity-strings.txt" || true

      - name: Reproduce exact P13 Image with full mismatch diagnostics
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export KBUILD_BUILD_USER KBUILD_BUILD_HOST KBUILD_BUILD_TIMESTAMP
          export KBUILD_BUILD_VERSION SOURCE_DATE_EPOCH KBUILD_FIXED_SCM_SUFFIX

          rm -rf "$OUT_DIR"
          make O="$OUT_DIR" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            veux_defconfig 2>&1 | tee "$AUDIT_DIR/09-config.log"

          grep -Fxq 'CONFIG_KSU=y' "$OUT_DIR/.config"
          grep -Fxq 'CONFIG_KSU_SUSFS=y' "$OUT_DIR/.config"
          grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' "$OUT_DIR/.config"
          grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' "$OUT_DIR/.config"
          grep -Fxq '# CONFIG_MODULES is not set' "$OUT_DIR/.config"
          if grep -Eq '^CONFIG_MODULES=y$' "$OUT_DIR/.config"; then
            echo "Unexpected CONFIG_MODULES=y in frozen P13 config" >&2
            exit 1
          fi

          {
            echo "P13_MODULES_CONFIG=# CONFIG_MODULES is not set"
            grep -E '^(CONFIG_MODVERSIONS=|# CONFIG_MODVERSIONS is not set)' "$OUT_DIR/.config" || true
            grep -E '^(CONFIG_MODULE_UNLOAD=|# CONFIG_MODULE_UNLOAD is not set)' "$OUT_DIR/.config" || true
            grep -E '^(CONFIG_MODULE_SIG=|# CONFIG_MODULE_SIG is not set)' "$OUT_DIR/.config" || true
          } | tee "$AUDIT_DIR/09-module-config-gates.txt"

          {
            echo "KBUILD_BUILD_USER=$KBUILD_BUILD_USER"
            echo "KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST"
            echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP"
            echo "KBUILD_BUILD_VERSION=$KBUILD_BUILD_VERSION"
            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
            echo "KBUILD_FIXED_SCM_SUFFIX=$KBUILD_FIXED_SCM_SUFFIX"
            echo "EFFECTIVE_KCFLAGS=$EFFECTIVE_KCFLAGS"
            echo "OUT_DIR=$OUT_DIR"
            echo "PWD=$PWD"
            echo "CLANG=$("$TOOLCHAIN_DIR/bin/clang" --version | head -n 1)"
            echo "LD_LLD=$("$TOOLCHAIN_DIR/bin/ld.lld" --version | head -n 1)"
          } > "$AUDIT_DIR/09-build-environment.txt"

          make -j"$(nproc)" \
            O="$OUT_DIR" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            KCFLAGS="$EFFECTIVE_KCFLAGS" Image dtbs \
            2>&1 | tee "$AUDIT_DIR/09-build-image.log"

          image="$OUT_DIR/arch/arm64/boot/Image"
          dtb="$OUT_DIR/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"
          test -s "$image"
          test -s "$dtb"
          test -s "$OUT_DIR/vmlinux"
          test -s "$OUT_DIR/System.map"

          cp "$OUT_DIR/.config" "$AUDIT_DIR/P13-config.txt"
          cp "$OUT_DIR/System.map" "$AUDIT_DIR/P13-System.map"

          for f in \
            include/generated/compile.h \
            include/generated/utsrelease.h \
            include/generated/autoconf.h \
            include/config/auto.conf \
            include/config/kernel.release; do
            if test -f "$OUT_DIR/$f"; then
              mkdir -p "$AUDIT_DIR/generated/$(dirname "$f")"
              cp "$OUT_DIR/$f" "$AUDIT_DIR/generated/$f"
            fi
          done

          image_bytes="$(stat -c '%s' "$image")"
          image_sha="$(sha256sum "$image" | awk '{print $1}')"
          dtb_bytes="$(stat -c '%s' "$dtb")"
          dtb_sha="$(sha256sum "$dtb" | awk '{print $1}')"
          kernelrelease="$(
            make -s O="$OUT_DIR" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 kernelrelease
          )"
          config_sha="$(sha256sum "$OUT_DIR/.config" | awk '{print $1}')"
          vmlinux_bytes="$(stat -c '%s' "$OUT_DIR/vmlinux")"
          vmlinux_sha="$(sha256sum "$OUT_DIR/vmlinux" | awk '{print $1}')"
          system_map_sha="$(sha256sum "$OUT_DIR/System.map" | awk '{print $1}')"

          status() {
            if test "$1" = "$2"; then
              printf 'PASS'
            else
              printf 'FAIL'
            fi
          }

          image_bytes_status="$(status "$image_bytes" "$EXPECTED_IMAGE_BYTES")"
          image_sha_status="$(status "$image_sha" "$EXPECTED_IMAGE_SHA256")"
          dtb_sha_status="$(status "$dtb_sha" "$EXPECTED_VEUX_DTB_SHA256")"
          kernelrelease_status="$(status "$kernelrelease" "$EXPECTED_KERNEL_RELEASE")"

          {
            printf 'gate\tactual\texpected\tstatus\n'
            printf 'IMAGE_BYTES\t%s\t%s\t%s\n' \
              "$image_bytes" "$EXPECTED_IMAGE_BYTES" "$image_bytes_status"
            printf 'IMAGE_SHA256\t%s\t%s\t%s\n' \
              "$image_sha" "$EXPECTED_IMAGE_SHA256" "$image_sha_status"
            printf 'VEUX_DTB_SHA256\t%s\t%s\t%s\n' \
              "$dtb_sha" "$EXPECTED_VEUX_DTB_SHA256" "$dtb_sha_status"
            printf 'KERNEL_RELEASE\t%s\t%s\t%s\n' \
              "$kernelrelease" "$EXPECTED_KERNEL_RELEASE" "$kernelrelease_status"
            printf 'CONFIG_SHA256\t%s\t-\tINFO\n' "$config_sha"
            printf 'VMLINUX_BYTES\t%s\t-\tINFO\n' "$vmlinux_bytes"
            printf 'VMLINUX_SHA256\t%s\t-\tINFO\n' "$vmlinux_sha"
            printf 'SYSTEM_MAP_SHA256\t%s\t-\tINFO\n' "$system_map_sha"
            printf 'DTB_BYTES\t%s\t-\tINFO\n' "$dtb_bytes"
          } | tee "$AUDIT_DIR/09-reproduction-values.tsv"

          strings -a "$image" \
            | grep -E 'Linux version 5\.4\.274-qgki-g82179e362f33|v4\.2\.0-rc1-7741f878-p13@ReSukiSU' \
            | head -n 20 \
            > "$AUDIT_DIR/09-built-image-identity-strings.txt" || true

          export BUILT_IMAGE="$image"
          export BUILT_DTB="$dtb"
          export REF_IMAGE="$P13_REFERENCE_DIR/Image"
          export REF_DTB="$P13_REFERENCE_DIR/veux.dtb"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          audit = Path(os.environ["AUDIT_DIR"])
          pairs = [
              ("IMAGE", Path(os.environ["REF_IMAGE"]), Path(os.environ["BUILT_IMAGE"])),
              ("DTB", Path(os.environ["REF_DTB"]), Path(os.environ["BUILT_DTB"])),
          ]

          def sha256_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def compare(label, ref_path, built_path):
              ref = ref_path.read_bytes()
              built = built_path.read_bytes()
              overlap = min(len(ref), len(built))
              differing = [i for i in range(overlap) if ref[i] != built[i]]
              trailing = abs(len(ref) - len(built))
              total_diff = len(differing) + trailing
              first = differing[0] if differing else (overlap if trailing else -1)
              if differing:
                  last = differing[-1]
              elif trailing:
                  last = max(len(ref), len(built)) - 1
              else:
                  last = -1

              chunk_size = 1024 * 1024
              max_len = max(len(ref), len(built))
              chunks = []
              for off in range(0, max_len, chunk_size):
                  r = ref[off:off + chunk_size]
                  b = built[off:off + chunk_size]
                  rsha = sha256_bytes(r)
                  bsha = sha256_bytes(b)
                  if rsha != bsha:
                      chunks.append((off // chunk_size, off, len(r), len(b), rsha, bsha))

              out = audit / f"09-{label.lower()}-binary-diff.txt"
              lines = [
                  f"LABEL={label}",
                  f"REFERENCE_PATH={ref_path}",
                  f"BUILT_PATH={built_path}",
                  f"REFERENCE_BYTES={len(ref)}",
                  f"BUILT_BYTES={len(built)}",
                  f"REFERENCE_SHA256={sha256_bytes(ref)}",
                  f"BUILT_SHA256={sha256_bytes(built)}",
                  f"BYTE_IDENTICAL={'YES' if total_diff == 0 else 'NO'}",
                  f"FIRST_DIFFERING_OFFSET={first}",
                  f"LAST_DIFFERING_OFFSET={last}",
                  f"TOTAL_DIFFERING_BYTES={total_diff}",
                  f"CHANGED_1MIB_CHUNKS={len(chunks)}",
                  "",
                  "chunk_index\toffset\tref_bytes\tbuilt_bytes\tref_sha256\tbuilt_sha256",
              ]
              lines.extend("\t".join(map(str, row)) for row in chunks)
              out.write_text("\n".join(lines) + "\n", encoding="utf-8")
              return total_diff == 0

          results = {}
          for label, ref, built in pairs:
              results[label] = compare(label, ref, built)

          (audit / "09-byte-identity-result.txt").write_text(
              "\n".join(
                  [
                      f"IMAGE_BYTE_IDENTICAL={'PASS' if results['IMAGE'] else 'FAIL'}",
                      f"DTB_BYTE_IDENTICAL={'PASS' if results['DTB'] else 'FAIL'}",
                  ]
              ) + "\n",
              encoding="utf-8",
          )
          PY

          image_binary_status="$(
            awk -F= '$1=="IMAGE_BYTE_IDENTICAL"{print $2}' "$AUDIT_DIR/09-byte-identity-result.txt"
          )"
          dtb_binary_status="$(
            awk -F= '$1=="DTB_BYTE_IDENTICAL"{print $2}' "$AUDIT_DIR/09-byte-identity-result.txt"
          )"

          gate_fail=0
          for s in \
            "$image_bytes_status" \
            "$image_sha_status" \
            "$dtb_sha_status" \
            "$kernelrelease_status" \
            "$image_binary_status" \
            "$dtb_binary_status"; do
            if test "$s" != "PASS"; then
              gate_fail=1
            fi
          done

          if test "$gate_fail" -ne 0; then
            cp "$image" "$AUDIT_DIR/U1C-v2R2-built-Image.bin"
            cp "$dtb" "$AUDIT_DIR/U1C-v2R2-built-veux.dtb"
            {
              echo "P13_IMAGE_REPRODUCTION=FAIL"
              echo "P13_CONFIG_MODULES_N=PASS"
              echo "DETAILS=09-reproduction-values.tsv,09-image-binary-diff.txt,09-dtb-binary-diff.txt"
            } | tee "$AUDIT_DIR/09-reproduction-result.txt"
            exit 1
          fi

          "$TOOLCHAIN_DIR/bin/llvm-nm" -g --defined-only -P "$OUT_DIR/vmlinux" \
            | LC_ALL=C sort -u \
            > "$AUDIT_DIR/P13-vmlinux-global-symbols.txt"
          test -s "$AUDIT_DIR/P13-vmlinux-global-symbols.txt"

          {
            echo "P13_IMAGE_REPRODUCTION=PASS"
            echo "P13_CONFIG_MODULES_N=PASS"
            echo "IMAGE_BYTES=$image_bytes"
            echo "IMAGE_SHA256=$image_sha"
            echo "VEUX_DTB_SHA256=$dtb_sha"
            echo "KERNEL_RELEASE=$kernelrelease"
            echo "VMLINUX_BYTES=$vmlinux_bytes"
            echo "VMLINUX_SHA256=$vmlinux_sha"
            echo "SYSTEM_MAP_SHA256=$system_map_sha"
            echo "VMLINUX_GLOBAL_SYMBOLS=$(wc -l < "$AUDIT_DIR/P13-vmlinux-global-symbols.txt")"
            echo "REFERENCE_IMAGE_BYTE_IDENTICAL=PASS"
            echo "REFERENCE_DTB_BYTE_IDENTICAL=PASS"
          } | tee "$AUDIT_DIR/09-reproduction-result.txt"

      - name: Capture P13 effective Make database and link graph
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export KBUILD_BUILD_USER KBUILD_BUILD_HOST KBUILD_BUILD_TIMESTAMP
          export KBUILD_BUILD_VERSION SOURCE_DATE_EPOCH KBUILD_FIXED_SCM_SUFFIX

          # U1C-v2R2 already proved the build itself.  U1D now captures what
          # Make and Kbuild actually resolved after that exact build.
          make -pn \
            O="$OUT_DIR" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            KCFLAGS="$EFFECTIVE_KCFLAGS" Image \
            > "$RUNNER_TEMP/u1d-make-db.txt" 2> "$AUDIT_DIR/10-make-db.stderr.txt"

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          src = Path(os.environ["RUNNER_TEMP"]) / "u1d-make-db.txt"
          out = Path(os.environ["AUDIT_DIR"]) / "10-P13-EFFECTIVE-MAKE-CONFIG.tsv"

          # Keep the last visible Make-database value for each CONFIG_* name.
          values = {}
          rx = re.compile(
              r'^(CONFIG_[A-Za-z0-9_]+)\s*(?::=|\?=|\+=|=)\s*(.*?)\s*$'
          )
          for raw in src.read_text(errors="replace").splitlines():
              m = rx.match(raw)
              if not m:
                  continue
              key, val = m.group(1), m.group(2).strip()
              values[key] = val

          with out.open("w", encoding="utf-8") as fh:
              fh.write("config\tmake_value\n")
              for key in sorted(values):
                  fh.write(f"{key}\t{values[key]}\n")

          print(f"Effective CONFIG variables captured: {len(values)}")
          PY

          find "$OUT_DIR" -type f -name '*.o' -printf '%P\n' \
            | LC_ALL=C sort -u \
            > "$AUDIT_DIR/10-P13-BUILT-OBJECTS.txt"

          find "$OUT_DIR" -type f -name '*.cmd' -printf '%P\n' \
            | LC_ALL=C sort -u \
            > "$AUDIT_DIR/10-P13-CMD-FILES.txt"

          python3 - <<'PY'
          from pathlib import Path
          import os

          out_dir = Path(os.environ["OUT_DIR"])
          audit = Path(os.environ["AUDIT_DIR"])

          with (audit / "10-P13-CMD-CONTENT.tsv").open(
              "w", encoding="utf-8"
          ) as fh:
              fh.write("cmd_file\tline\n")
              for path in sorted(out_dir.rglob("*.cmd")):
                  rel = path.relative_to(out_dir)
                  try:
                      lines = path.read_text(errors="replace").splitlines()
                  except OSError:
                      continue
                  for line in lines:
                      s = line.strip()
                      if not s:
                          continue
                      fh.write(f"{rel}\t{s.replace(chr(9), ' ')}\n")
          PY

          {
            printf 'archive\tmember\n'
            while IFS= read -r -d '' archive; do
              rel="${archive#"$OUT_DIR"/}"
              while IFS= read -r member; do
                test -n "$member" || continue
                printf '%s\t%s\n' "$rel" "$member"
              done < <("$TOOLCHAIN_DIR/bin/llvm-ar" t "$archive" 2>/dev/null || true)
            done < <(find "$OUT_DIR" -type f -name 'built-in.a' -print0 | sort -z)
          } > "$AUDIT_DIR/10-P13-BUILTIN-ARCHIVE-MEMBERS.tsv"

          "$TOOLCHAIN_DIR/bin/llvm-nm" -a -P "$OUT_DIR/vmlinux" \
            | LC_ALL=C sort -u \
            > "$AUDIT_DIR/10-P13-VMLINUX-ALL-SYMBOLS.txt"

          {
            echo "BUILT_OBJECTS=$(wc -l < "$AUDIT_DIR/10-P13-BUILT-OBJECTS.txt")"
            echo "CMD_FILES=$(wc -l < "$AUDIT_DIR/10-P13-CMD-FILES.txt")"
            echo "BUILTIN_ARCHIVE_MEMBER_ROWS=$(( $(wc -l < "$AUDIT_DIR/10-P13-BUILTIN-ARCHIVE-MEMBERS.tsv") - 1 ))"
            echo "VMLINUX_ALL_SYMBOLS=$(wc -l < "$AUDIT_DIR/10-P13-VMLINUX-ALL-SYMBOLS.txt")"
            echo "MAKE_CONFIG_ROWS=$(( $(wc -l < "$AUDIT_DIR/10-P13-EFFECTIVE-MAKE-CONFIG.tsv") - 1 ))"
          } | tee "$AUDIT_DIR/10-P13-LINKGRAPH-SUMMARY.txt"

      - name: Clone representative public VEUX runtime module snapshots
        shell: bash
        run: |
          set -euo pipefail
          meta="$AUDIT_DIR/11-public-snapshots.tsv"
          printf 'label\trepository\tref\tcommit\tko_count\tload_file_count\n' > "$meta"

          clone_sparse() {
            label="$1"
            repo="$2"
            ref="$3"
            dest="$SNAPSHOT_DIR/$label"

            git clone -q --depth 1 --filter=blob:none --sparse \
              --single-branch --branch "$ref" \
              "https://github.com/$repo.git" "$dest"
            git -C "$dest" sparse-checkout set ramdisk-modules vendor-modules
            git -C "$dest" lfs pull --include='ramdisk-modules/**,vendor-modules/**'

            commit="$(git -C "$dest" rev-parse HEAD)"
            ko_count="$(find "$dest/ramdisk-modules" "$dest/vendor-modules" \
              -type f -name '*.ko' 2>/dev/null | wc -l)"
            load_count="$(find "$dest/ramdisk-modules" "$dest/vendor-modules" \
              -type f -name 'modules.load*' 2>/dev/null | wc -l)"

            test "$ko_count" -gt 0
            test "$load_count" -gt 0

            while IFS= read -r -d '' f; do
              if head -c 64 "$f" | grep -Fq \
                'version https://git-lfs.github.com/spec/v1'; then
                echo "Unresolved Git-LFS pointer: $f" >&2
                exit 1
              fi
            done < <(
              find "$dest/ramdisk-modules" "$dest/vendor-modules" \
                -type f -name '*.ko' -print0 2>/dev/null
            )

            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$label" "$repo" "$ref" "$commit" "$ko_count" "$load_count" \
              >> "$meta"
          }

          clone_sparse a12 \
            sunil98025/android_device_xiaomi_veux-kernel twelve
          clone_sparse a13_arrow \
            ArrowOS-Devices/android_device_xiaomi_veux-kernel arrow-13.0
          clone_sparse a13_alt \
            nnippon99/android_device_xiaomi_veux-kernel thirteen
          clone_sparse lineage20 \
            xiaomi-sm6375-devs/android_device_xiaomi_veux-kernel lineage-20
          clone_sparse a14_crdroid \
            crdroidandroid/android_device_xiaomi_veux-kernel 14.0

          cat "$meta"

      - name: Resolve modules.load dependency closure against exact P13
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export LLVM_NM="$TOOLCHAIN_DIR/bin/llvm-nm"
          export P13_CONFIG="$AUDIT_DIR/P13-config.txt"
          export P13_GLOBAL_SYMBOLS="$AUDIT_DIR/P13-vmlinux-global-symbols.txt"
          export P13_ALL_SYMBOLS="$AUDIT_DIR/10-P13-VMLINUX-ALL-SYMBOLS.txt"
          export P13_MAKE_CONFIG="$AUDIT_DIR/10-P13-EFFECTIVE-MAKE-CONFIG.tsv"
          export P13_OBJECTS="$AUDIT_DIR/10-P13-BUILT-OBJECTS.txt"
          export P13_CMD_CONTENT="$AUDIT_DIR/10-P13-CMD-CONTENT.tsv"
          export P13_ARCHIVE_MEMBERS="$AUDIT_DIR/10-P13-BUILTIN-ARCHIVE-MEMBERS.tsv"
          export KERNEL_SOURCE="$GITHUB_WORKSPACE/kernel"

          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict, deque
          import csv
          import hashlib
          import os
          import re
          import subprocess

          audit = Path(os.environ["AUDIT_DIR"])
          snaps = Path(os.environ["SNAPSHOT_DIR"])
          source = Path(os.environ["KERNEL_SOURCE"])
          llvm_nm = os.environ["LLVM_NM"]

          def normalize(s):
              s = Path(s).name
              s = s[:-3] if s.endswith(".ko") else s
              return re.sub(r"[^a-z0-9]+", "", s.lower())

          def read_kconfig(path):
              cfg = {}
              for raw in Path(path).read_text(errors="replace").splitlines():
                  line = raw.strip()
                  m = re.match(r'^(CONFIG_[A-Za-z0-9_]+)=(.*)$', line)
                  if m:
                      cfg[m.group(1)] = m.group(2)
                      continue
                  m = re.match(r'^# (CONFIG_[A-Za-z0-9_]+) is not set$', line)
                  if m:
                      cfg[m.group(1)] = "n"
              return cfg

          p13_cfg = read_kconfig(os.environ["P13_CONFIG"])
          if p13_cfg.get("CONFIG_MODULES") != "n":
              raise SystemExit("P13 CONFIG_MODULES is not n")

          make_cfg = {}
          with open(os.environ["P13_MAKE_CONFIG"], encoding="utf-8") as fh:
              for row in csv.DictReader(fh, delimiter="\t"):
                  make_cfg[row["config"]] = row["make_value"]

          def symbol_names(path):
              names = set()
              for line in Path(path).read_text(errors="replace").splitlines():
                  parts = line.split()
                  if parts:
                      names.add(parts[0])
              return names

          p13_global = symbol_names(os.environ["P13_GLOBAL_SYMBOLS"])
          p13_all = symbol_names(os.environ["P13_ALL_SYMBOLS"])

          export_prefixes = (
              "__ksymtab_", "__ksymtab_gpl_", "__ksymtab_unused_",
              "__ksymtab_unused_gpl_", "__ksymtab_gpl_future_",
          )

          def exported_api(symbols):
              out = set()
              for sym in symbols:
                  for pref in export_prefixes:
                      if sym.startswith(pref):
                          out.add(sym[len(pref):])
                          break
              return out

          p13_exports = exported_api(p13_all)

          built_objects = set(
              x.strip() for x in
              Path(os.environ["P13_OBJECTS"]).read_text(errors="replace").splitlines()
              if x.strip()
          )
          normalized_object_text = "\n".join(normalize(x) for x in built_objects)

          cmd_text = Path(os.environ["P13_CMD_CONTENT"]).read_text(errors="replace").lower()
          archive_text = Path(os.environ["P13_ARCHIVE_MEMBERS"]).read_text(errors="replace").lower()

          def run_text(args):
              cp = subprocess.run(
                  args, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE
              )
              return cp.returncode, cp.stdout, cp.stderr

          def modinfo(path, field):
              rc, out, _ = run_text(["modinfo", "-F", field, str(path)])
              return out.strip() if rc == 0 else ""

          def module_symbols(path):
              rc, out, err = run_text(
                  [llvm_nm, "-a", "--defined-only", "-P", str(path)]
              )
              if rc != 0:
                  return set(), set(), err.strip() or "llvm-nm failed"
              syms = set()
              for line in out.splitlines():
                  parts = line.split()
                  if parts:
                      syms.add(parts[0])
              exports = exported_api(syms)

              ignore = {
                  "init_module", "cleanup_module", "__this_module",
                  "_GLOBAL_OFFSET_TABLE_",
              }
              defs = set()
              for sym in syms:
                  if sym in ignore or sym.startswith("$"):
                      continue
                  if sym.startswith((
                      "__UNIQUE_ID", "__ksymtab", "__kstrtab", "__kstrtabns",
                      "__crc_", "__param_", "__mod_", "__modver_",
                      "__jump_table", "__tracepoint_", "__traceiter_",
                      "__tracepoint_str_",
                  )):
                      continue
                  defs.add(sym)
              return defs, exports, ""

          def subsystem(text):
              s = text.lower()
              groups = [
                  ("camera", ("camera", "cam_", "cam-", "spectra")),
                  ("display", ("display", "drm", "dsi", "panel", "sde", "rotator")),
                  ("touch", ("touch", "goodix", "focal", "novatek", "synaptics", "fts")),
                  ("wlan", ("wlan", "wifi", "qca_cld", "qcacld", "cnss")),
                  ("bluetooth", ("bluetooth", "btpower", "btfm", "hci_")),
                  ("modem_ipa", ("modem", "ipa", "rmnet", "qrtr", "glink", "mhi")),
                  ("audio", ("audio", "snd", "q6", "apr", "codec", "wcd",
                             "macro_dlkm", "bolero", "soundwire", "swr_")),
                  ("power_thermal", ("charger", "battery", "power", "smb", "pmic",
                                     "thermal", "cpufreq", "pd_", "pd-")),
                  ("fingerprint", ("fingerprint", "goodix_fp", "fpc")),
                  ("sensors", ("sensor", "ssc")),
              ]
              for label, keys in groups:
                  if any(k in s for k in keys):
                      return label
              return "misc_platform"

          # Index Kbuild/Makefile rules by logical target text and candidate CONFIGs.
          build_rules = []
          for bp in source.rglob("*"):
              if not bp.is_file() or bp.name not in ("Makefile", "Kbuild"):
                  continue
              try:
                  lines = bp.read_text(errors="replace").splitlines()
              except OSError:
                  continue
              rel = str(bp.relative_to(source))
              for lineno, raw in enumerate(lines, 1):
                  code = raw.split("#", 1)[0].strip()
                  if not code:
                      continue
                  configs = sorted(set(re.findall(r"CONFIG_[A-Za-z0-9_]+", code)))
                  target_text = re.sub(
                      r"\$\(CONFIG_[A-Za-z0-9_]+\)|CONFIG_[A-Za-z0-9_]+",
                      "", code,
                  )
                  build_rules.append(
                      (rel, lineno, code, configs, normalize(target_text))
                  )

          # Supporting source-side Make/config exports.  These are evidence,
          # but only effective Make-database values are treated as decisive.
          source_assignments = defaultdict(list)
          assign_rx = re.compile(
              r'^\s*(?:export\s+)?(CONFIG_[A-Za-z0-9_]+)\s*(?::=|\?=|\+=|=)\s*([ymn])\s*$'
          )
          for bp in source.rglob("*"):
              if not bp.is_file():
                  continue
              if not (
                  bp.name in ("Makefile", "Kbuild")
                  or bp.suffix in (".conf", ".mk")
                  or bp.name.startswith("build.config")
              ):
                  continue
              try:
                  lines = bp.read_text(errors="replace").splitlines()
              except OSError:
                  continue
              rel = str(bp.relative_to(source))
              for lineno, raw in enumerate(lines, 1):
                  m = assign_rx.match(raw)
                  if m:
                      source_assignments[m.group(1)].append(
                          (rel, lineno, m.group(2), raw.strip())
                      )

          snapshot_roles = {}
          snapshot_direct = {}
          role_paths = defaultdict(list)
          load_rows = []

          for snap in sorted(p for p in snaps.iterdir() if p.is_dir()):
              module_index = defaultdict(list)
              for ko in snap.rglob("*.ko"):
                  module_index[normalize(ko.name)].append(ko)

              dep_graph = defaultdict(set)
              for depfile in snap.rglob("modules.dep"):
                  base = depfile.parent
                  for raw in depfile.read_text(errors="replace").splitlines():
                      if ":" not in raw:
                          continue
                      lhs, rhs = raw.split(":", 1)
                      src = normalize(lhs.strip())
                      for dep in rhs.split():
                          dep_graph[src].add(normalize(dep))

              direct = set()
              load_files = sorted(snap.rglob("modules.load*"))
              for lf in load_files:
                  if not lf.is_file():
                      continue
                  area = (
                      "ramdisk" if "ramdisk-modules" in lf.parts
                      else "vendor" if "vendor-modules" in lf.parts
                      else "other"
                  )
                  for raw in lf.read_text(errors="replace").splitlines():
                      line = raw.split("#", 1)[0].strip()
                      if not line or ".ko" not in line:
                          continue
                      role = normalize(line)
                      direct.add(role)
                      load_rows.append({
                          "snapshot": snap.name,
                          "area": area,
                          "load_file": str(lf.relative_to(snap)),
                          "entry": line,
                          "role": role,
                          "kind": "DIRECT",
                      })

              closure = set(direct)
              q = deque(direct)
              while q:
                  cur = q.popleft()
                  for dep in dep_graph.get(cur, ()):
                      if dep and dep not in closure:
                          closure.add(dep)
                          q.append(dep)

              snapshot_direct[snap.name] = direct
              snapshot_roles[snap.name] = closure

              for role in closure:
                  for ko in module_index.get(role, ()):
                      role_paths[role].append((snap.name, ko))

              for role in sorted(closure - direct):
                  load_rows.append({
                      "snapshot": snap.name,
                      "area": "dependency",
                      "load_file": "modules.dep",
                      "entry": role,
                      "role": role,
                      "kind": "DEPENDENCY",
                  })

          snapshots = sorted(snapshot_roles)
          if len(snapshots) != 5:
              raise SystemExit(f"Expected 5 snapshots, got {snapshots}")

          union_roles = set().union(*(snapshot_roles[s] for s in snapshots))
          intersection_roles = set.intersection(*(snapshot_roles[s] for s in snapshots))

          def overlap_ratio(a, b):
              return (len(a & b) / len(a)) if a else 0.0

          evidence_rows = []
          unresolved = []

          for role in sorted(union_roles):
              occurrences = role_paths.get(role, [])
              cfg_candidates = set()
              rule_hits = []
              for bf, lineno, code, cfgs, normline in build_rules:
                  if role and role in normline:
                      cfg_candidates.update(cfgs)
                      rule_hits.append((bf, lineno, code, cfgs))

              kconfig_y = sorted(
                  c for c in cfg_candidates if p13_cfg.get(c) == "y"
              )
              make_y = sorted(
                  c for c in cfg_candidates if make_cfg.get(c) == "y"
              )
              make_m = sorted(
                  c for c in cfg_candidates if make_cfg.get(c) == "m"
              )

              source_y = []
              for cfg in sorted(cfg_candidates):
                  for rel, lineno, val, raw in source_assignments.get(cfg, ()):
                      if val == "y":
                          source_y.append(f"{cfg}@{rel}:{lineno}")

              object_hits = sorted(
                  x for x in built_objects if role in normalize(x)
              )
              cmd_hit = role in re.sub(r"[^a-z0-9]+", "", cmd_text)
              archive_hit = role in re.sub(r"[^a-z0-9]+", "", archive_text)

              best_export_count = 0
              best_export_match = 0
              best_export_ratio = 0.0
              best_def_count = 0
              best_def_match = 0
              best_def_ratio = 0.0
              representative_name = role
              vermagics = set()
              depends = set()
              sym_errors = []

              for snap_name, ko in occurrences:
                  mi_name = modinfo(ko, "name")
                  if mi_name:
                      representative_name = mi_name
                  vm = modinfo(ko, "vermagic")
                  if vm:
                      vermagics.add(vm)
                  dp = modinfo(ko, "depends")
                  if dp:
                      depends.add(dp)

                  defs, exports, err = module_symbols(ko)
                  if err:
                      sym_errors.append(f"{snap_name}:{err}")
                      continue

                  ex_match = len(exports & p13_exports)
                  ex_ratio = overlap_ratio(exports, p13_exports)
                  if (
                      ex_ratio > best_export_ratio
                      or (ex_ratio == best_export_ratio and len(exports) > best_export_count)
                  ):
                      best_export_count = len(exports)
                      best_export_match = ex_match
                      best_export_ratio = ex_ratio

                  d_match = len(defs & p13_global)
                  d_ratio = overlap_ratio(defs, p13_global)
                  if (
                      d_ratio > best_def_ratio
                      or (d_ratio == best_def_ratio and len(defs) > best_def_count)
                  ):
                      best_def_count = len(defs)
                      best_def_match = d_match
                      best_def_ratio = d_ratio

              # Strong evidence is intentionally redundant.  One noisy heuristic
              # is not enough for an automatic PASS.
              build_graph = bool(object_hits or cmd_hit or archive_hit)
              config_effective = bool(kconfig_y or make_y)

              if (
                  best_export_count >= 2
                  and best_export_ratio >= 0.90
                  and (build_graph or config_effective)
              ):
                  status = "P13_BUILTIN_STRONG_EXPORT_AND_BUILD"
              elif build_graph and config_effective:
                  status = "P13_BUILTIN_STRONG_LINK_AND_CONFIG"
              elif (
                  best_def_count >= 5
                  and best_def_ratio >= 0.80
                  and (build_graph or config_effective)
              ):
                  status = "P13_BUILTIN_STRONG_SYMBOL_EQUIVALENCE"
              elif make_y and rule_hits:
                  status = "P13_BUILTIN_EFFECTIVE_MAKE_CONFIG"
              elif kconfig_y and rule_hits:
                  status = "P13_BUILTIN_KCONFIG"
              else:
                  status = "UNRESOLVED_RUNTIME_ROLE"

              row = {
                  "role": role,
                  "module_name": representative_name,
                  "subsystem": subsystem(
                      " ".join([role, representative_name, ",".join(depends)])
                  ),
                  "snapshots": ",".join(
                      s for s in snapshots if role in snapshot_roles[s]
                  ),
                  "snapshot_count": sum(
                      role in snapshot_roles[s] for s in snapshots
                  ),
                  "direct_snapshot_count": sum(
                      role in snapshot_direct[s] for s in snapshots
                  ),
                  "all_snapshots": "YES" if role in intersection_roles else "NO",
                  "occurrence_files": len(occurrences),
                  "config_candidates": ",".join(sorted(cfg_candidates)),
                  "kconfig_y": ",".join(kconfig_y),
                  "make_y": ",".join(make_y),
                  "make_m": ",".join(make_m),
                  "source_y_assignments": ",".join(source_y[:30]),
                  "kbuild_rule_hits": len(rule_hits),
                  "output_object_hits": len(object_hits),
                  "cmd_hit": "YES" if cmd_hit else "NO",
                  "archive_hit": "YES" if archive_hit else "NO",
                  "export_symbols": best_export_count,
                  "export_matches": best_export_match,
                  "export_ratio": f"{best_export_ratio:.6f}",
                  "defined_symbols": best_def_count,
                  "defined_matches": best_def_match,
                  "defined_ratio": f"{best_def_ratio:.6f}",
                  "vermagics": " | ".join(sorted(vermagics)),
                  "depends": " | ".join(sorted(depends)),
                  "symbol_errors": " | ".join(sym_errors),
                  "status": status,
              }
              evidence_rows.append(row)
              if status == "UNRESOLVED_RUNTIME_ROLE":
                  unresolved.append(row)

          fields = list(evidence_rows[0].keys()) if evidence_rows else []

          def write_tsv(path, rows, fieldnames):
              with path.open("w", newline="", encoding="utf-8") as fh:
                  w = csv.DictWriter(
                      fh, fieldnames=fieldnames, delimiter="\t",
                      extrasaction="ignore",
                  )
                  w.writeheader()
                  w.writerows(rows)

          write_tsv(
              audit / "12-RUNTIME-LOAD-ENTRIES.tsv",
              load_rows,
              ["snapshot","area","load_file","entry","role","kind"],
          )
          write_tsv(
              audit / "12-P13-RUNTIME-ROLE-EVIDENCE.tsv",
              evidence_rows,
              fields,
          )
          write_tsv(
              audit / "12-UNRESOLVED-RUNTIME-ROLES.tsv",
              unresolved,
              fields,
          )

          # Pairwise load-role deltas show whether ROM/kernel snapshots create
          # actual compatibility groups at the runtime module-role level.
          pair_rows = []
          for i, a in enumerate(snapshots):
              for b in snapshots[i+1:]:
                  sa, sb = snapshot_roles[a], snapshot_roles[b]
                  inter = len(sa & sb)
                  union = len(sa | sb)
                  pair_rows.append({
                      "a": a,
                      "b": b,
                      "a_roles": len(sa),
                      "b_roles": len(sb),
                      "common": inter,
                      "only_a": len(sa - sb),
                      "only_b": len(sb - sa),
                      "jaccard": f"{(inter / union if union else 1.0):.6f}",
                  })
          write_tsv(
              audit / "12-LOADLIST-PAIRWISE.tsv",
              pair_rows,
              ["a","b","a_roles","b_roles","common","only_a","only_b","jaccard"],
          )

          set_groups = defaultdict(list)
          for snap in snapshots:
              digest = hashlib.sha256(
                  "\n".join(sorted(snapshot_roles[snap])).encode()
              ).hexdigest()
              set_groups[digest].append(snap)

          with (audit / "12-LOADLIST-GROUPS.tsv").open(
              "w", newline="", encoding="utf-8"
          ) as fh:
              w = csv.writer(fh, delimiter="\t")
              w.writerow(["role_set_sha256","snapshots","role_count"])
              for digest, members in sorted(set_groups.items()):
                  w.writerow([
                      digest, ",".join(members),
                      len(snapshot_roles[members[0]])
                  ])

          shared_unresolved = [
              r for r in unresolved if r["all_snapshots"] == "YES"
          ]
          specific_unresolved = [
              r for r in unresolved if r["all_snapshots"] != "YES"
          ]

          stats = {
              "SNAPSHOTS": len(snapshots),
              "LOADLIST_GROUPS": len(set_groups),
              "UNION_RUNTIME_ROLES": len(union_roles),
              "INTERSECTION_RUNTIME_ROLES": len(intersection_roles),
              "P13_RESOLVED_RUNTIME_ROLES": len(evidence_rows) - len(unresolved),
              "P13_UNRESOLVED_RUNTIME_ROLES": len(unresolved),
              "SHARED_UNRESOLVED_RUNTIME_ROLES": len(shared_unresolved),
              "SNAPSHOT_SPECIFIC_UNRESOLVED_RUNTIME_ROLES": len(specific_unresolved),
          }
          with (audit / "12-RUNTIME-ROLE-SUMMARY.txt").open(
              "w", encoding="utf-8"
          ) as fh:
              for k, v in stats.items():
                  fh.write(f"{k}={v}\n")

          print(stats)
          PY

      - name: Classify U1D compatibility boundary
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import csv
          import os

          audit = Path(os.environ["AUDIT_DIR"])

          stats = {}
          for line in (audit / "12-RUNTIME-ROLE-SUMMARY.txt").read_text().splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  stats[k] = int(v)

          rows = list(csv.DictReader(
              (audit / "12-P13-RUNTIME-ROLE-EVIDENCE.tsv").open(),
              delimiter="\t",
          ))
          unresolved = [
              r for r in rows if r["status"] == "UNRESOLVED_RUNTIME_ROLE"
          ]
          shared = [r for r in unresolved if r["all_snapshots"] == "YES"]
          specific = [r for r in unresolved if r["all_snapshots"] != "YES"]

          if specific and stats["LOADLIST_GROUPS"] > 1:
              result = "STATIC_CANDIDATE_C_RUNTIME_ROLE_GROUPS"
              next_gate = "REVIEW_SNAPSHOT_SPECIFIC_RUNTIME_ROLES"
          elif specific:
              result = "STATIC_RUNTIME_ROLE_REVIEW_NO_GROUP_PROOF"
              next_gate = "REVIEW_SNAPSHOT_SPECIFIC_RUNTIME_ROLES"
          elif shared:
              result = "STATIC_SUPPORTS_A_NO_VARIANT_SPLIT_SHARED_RUNTIME_REVIEW"
              next_gate = "NO_U2_KERNEL_CHANGE_JUSTIFIED"
          else:
              result = "STATIC_SUPPORTS_A_P13_RUNTIME_ROLE_COVERAGE"
              next_gate = "UNIVERSAL_AK3_PACKAGING_SAFETY_NEXT"

          subsystems = {}
          for row in unresolved:
              subsystems[row["subsystem"]] = subsystems.get(row["subsystem"], 0) + 1

          lines = [
              "# VEUX GEN1 U1D — P13 Runtime Role + Link Graph Audit",
              "",
              "## Authority",
              "",
              "- Exact P13 Image reproduction: **PASS**",
              "- Exact P13 VEUX DTB reproduction: **PASS**",
              "- Exact P13 kernel release: **PASS**",
              "- P13 `CONFIG_MODULES=n`: **PASS**",
              "",
              "## Runtime-role scope",
              "",
              f"- Public snapshots: **{stats['SNAPSHOTS']}**",
              f"- Distinct runtime load-role sets: **{stats['LOADLIST_GROUPS']}**",
              f"- Union runtime roles: **{stats['UNION_RUNTIME_ROLES']}**",
              f"- Roles shared by all snapshots: **{stats['INTERSECTION_RUNTIME_ROLES']}**",
              f"- Roles resolved against P13: **{stats['P13_RESOLVED_RUNTIME_ROLES']}**",
              f"- Unresolved runtime roles: **{stats['P13_UNRESOLVED_RUNTIME_ROLES']}**",
              f"- Shared unresolved roles: **{stats['SHARED_UNRESOLVED_RUNTIME_ROLES']}**",
              f"- Snapshot-specific unresolved roles: **{stats['SNAPSHOT_SPECIFIC_UNRESOLVED_RUNTIME_ROLES']}**",
              "",
              "## Unresolved roles by subsystem",
              "",
          ]
          if subsystems:
              for key in sorted(subsystems):
                  lines.append(f"- {key}: **{subsystems[key]}**")
          else:
              lines.append("- none")

          lines += [
              "",
              "## Classification",
              "",
              f"**{result}**",
              "",
              f"Next gate: **{next_gate}**",
              "",
              "Interpretation rules:",
              "- `modules.load*` plus `modules.dep` closure is used instead of raw `.ko` presence.",
              "- Effective Make `CONFIG_*=y` values can establish QGKI/techpack built-in evidence even when the ordinary final `.config` does not expose that value.",
              "- Actual output objects/link commands/archive members and P13 vmlinux export symbols provide independent build evidence.",
              "- A shared unresolved role across every public snapshot is not evidence for a region/ROM-specific kernel split.",
              "- A snapshot-specific unresolved runtime role may justify a technical compatibility group, but only after targeted review.",
              "",
              "This remains a STATIC audit. Untested firmware is not DEVICE PASS.",
              "P13 remains immutable and no kernel patch is introduced by U1D.",
          ]

          (audit / "13-U1D-REPORT.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          (audit / "13-U1D-RESULT.txt").write_text(
              result + "\n" + next_gate + "\n", encoding="utf-8"
          )

          with (audit / "13-U1D-UNRESOLVED-SHORTLIST.tsv").open(
              "w", newline="", encoding="utf-8"
          ) as fh:
              fields = [
                  "role","module_name","subsystem","snapshots","snapshot_count",
                  "direct_snapshot_count","all_snapshots","config_candidates",
                  "kconfig_y","make_y","make_m","kbuild_rule_hits",
                  "output_object_hits","cmd_hit","archive_hit",
                  "export_symbols","export_matches","export_ratio",
                  "defined_symbols","defined_matches","defined_ratio","status",
              ]
              w = csv.DictWriter(
                  fh, fieldnames=fields, delimiter="\t",
                  extrasaction="ignore",
              )
              w.writeheader()
              w.writerows(unresolved)

          print(result)
          print(next_gate)
          PY

          cat "$AUDIT_DIR/13-U1D-RESULT.txt"
          sed -n '1,260p' "$AUDIT_DIR/13-U1D-REPORT.md"

      - name: Build self-verifying U1D evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d "$AUDIT_DIR"
          cd "$AUDIT_DIR"
          find . -type f ! -name 'U1D-EVIDENCE-SHA256SUMS.txt' -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            > U1D-EVIDENCE-SHA256SUMS.txt
          sha256sum -c U1D-EVIDENCE-SHA256SUMS.txt

      - name: Upload U1D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-GEN1-U1D-P13-runtime-role-linkgraph-audit
          path: u1d-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
