name: VEUX GEN1 U5-O40 5.4.302 Final Six-Block Conflict Resolution Train

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: veux-gen1-u5-o40-final-six-blocks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

      O39_ARTIFACT_ID: '10494375339'
      O39_ARTIFACT_NAME: VEUX-GEN1-U5-O39-binder-split-layout-max-threads-type-union-semantic-resolution-official-stable-5.4.300-5.4.302-port-audit
      O39_ARTIFACT_SHA256: 08c99ceb59060467a00e68f72d4cbcc95d210533738fd2329c895dff30045f64
      O39_INTERNAL_SHA_COUNT: '396'

      REGMAP_FIX_COMMIT: 4b48bfa2e5b5f26bd198943b0153b54fdef1f28a
      IVTV_DMA_API_COMMIT: 1b00b7335000c0e107f774cc8ee4d5340f824f28
      SDHCI_SDR50_COMMIT: 363f28adc0e0e2746db1abfcd2d869d3d5bba81a
      RPMH_TRIGGER_COMMIT: cdf96ac33a4854cdcf5c15e0aeca394360055420
      FNCM_MAC_COMMIT: a3f918b791cd8dd143845376ae0d58c32506b714
      XHCI_AUTOSUSPEND_COMMIT: ac91ada020c161f8a60d16d54568750d5ec0204a

      REGMAP_OURS_SHA256: cdeed445772cf1aea4e086afc198d856d8d7295764c8a3563c541d13c3e164a3
      REGMAP_PREVIEW_SHA256: 2616e79406c7c91f485e8a7450dbc7d323571046855f4ae391fc120140a043f4
      REGMAP_CANDIDATE_SHA256: 892df435693b2c0b386107b4862d93cfa4e1861de4d62b41af0dec3afa61cd27

      IVTV_OURS_SHA256: 85607cd90ceeb11766ab0a146cb60462ef37e4b0d163389fb1616f61e29a3943
      IVTV_PREVIEW_SHA256: 4b7538e379effefec6aa198e2577259d19dae4cfe6c36a476bf873b419508db3
      IVTV_CANDIDATE_SHA256: dcd2ea466fe31d79fb227da06463d4c871ed99bddd884a3bc911eff5ff50bab4

      SDHCI_OURS_SHA256: 70da2f86e6d8a538c4ce23bf5a0cab05db8317bf27d777ba9e04eb7aeed14e7f
      SDHCI_PREVIEW_SHA256: 040c32f53847298cfdb35334773becf5b111a54e5efdc13bdf3226ddd1ff284d
      SDHCI_CANDIDATE_SHA256: af11579543046eacc5910e94ff40696311e897d7ea9953dfc74d4217997e2667

      RPMH_OURS_SHA256: 3d87f01be6c41c2525549130cdc4fe584b8b79df717ce3175423fadee9ee525b
      RPMH_PREVIEW_SHA256: 1455c389feba95e8d636c659e0cdcceccba8c67640083b364b0053925e485bf5
      RPMH_CANDIDATE_SHA256: 845007d3c7a7cc3975f8750dfc34a88eb6db318a10f6285b1948fabca9086acb

      FNCM_OURS_SHA256: 36058bf08ecde9cbbbff4e26d2c54e52b575bfa0bd69700f2eb09cbb10ed612c
      FNCM_PREVIEW_SHA256: b98c0e6770cd190ffa369a9dc1b7612eb8c9bff73af02f53941b5204b38e72c7
      FNCM_CANDIDATE_SHA256: 219831e186156f3ce9b749b9ceb54337d6d070ad8af18a6415aeab36e4891745

      XHCI_OURS_SHA256: b2a03da3dbe5b047185e63565d36363f91984b08e2de1e0b0cdd21bcae36d1bf
      XHCI_PREVIEW_SHA256: 55d5bee404c875950d942a5952368f464f5707ed89e74c46156ef3e2bb021306
      XHCI_CANDIDATE_SHA256: c617bbcef020c8fb161e0d4d499c4c8eca4687350dd33ae6f7b2d67cbae7dd25

    steps:
      - name: Initialize U5-O40 final six-block workspace
        shell: bash
        run: |
          set -euo pipefail
          O39_DIR="$RUNNER_TEMP/u5-o40-o39-parent"
          AUDIT_DIR="$GITHUB_WORKSPACE/u5-o40-evidence"
          VERIFY_DIR="$RUNNER_TEMP/u5-o40-verify"
          rm -rf "$O39_DIR" "$AUDIT_DIR" "$VERIFY_DIR"
          mkdir -p "$O39_DIR" "$AUDIT_DIR" "$VERIFY_DIR"
          {
            echo "O39_DIR=$O39_DIR"
            echo "AUDIT_DIR=$AUDIT_DIR"
            echo "VERIFY_DIR=$VERIFY_DIR"
          } >> "$GITHUB_ENV"

          cat > "$AUDIT_DIR/40-O40-PLAN.txt" <<'EOF'
          U5-O40 5.4.302 FINAL SIX-BLOCK CONFLICT RESOLUTION TRAIN

          Runtime source parent: U5-O39.
          5.4.300 is already conflict-free and is kept byte-for-byte unchanged.
          5.4.302 has exactly six remaining conflict paths / eleven conflict hunks.

          This workflow resolves six independent logical source steps in a single atomic train.
          Each path has its own provenance check, exact parent anchors, deterministic resolver,
          incremental patch and source-application gate. No partial O40 artifact is uploaded.

          Steps:
          1. regmap: preserve P13 removal of the obsolete bulk-callback branch; Stable null-check cleanup is inapplicable.
          2. ivtv: preserve P13 VFL_TYPE_GRABBER ABI naming while taking Stable pci_dma -> dma API conversion.
          3. sdhci-msm: preserve P13 msm_offset helper while integrating Stable SDR50 tuning config variable/path.
          4. rpmh-rsc: integrate unconditional trigger clearing through P13 __tcs_trigger, retain vendor conditional IRQ disable.
          5. f_ncm: preserve P13 bind-time address retrieval and Stable bind-time string assignment; remove defunct alloc assignment.
          6. xhci-plat: preserve P13 relocated runtime-PM/autosuspend sequence because Stable autosuspend intent is already satisfied.

          Expected closure:
            5.4.300: 0 conflicts / 0 hunks, semantic resolutions 38.
            5.4.302: 6 conflicts / 11 hunks -> 0 / 0, semantic resolutions 38 -> 44.

          No kernel build. No AK3. No flash. No Device PASS claim.
          EOF

      - name: Download verify and restore complete O39 Runtime-PASS parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/o39-artifact-meta.json"
          zip="$RUNNER_TEMP/o39-artifact.zip"

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${O39_ARTIFACT_ID}" \
            -o "$meta"

          python3 - "$meta" <<'PY'
          import json,os,sys
          with open(sys.argv[1],encoding='utf-8') as f: m=json.load(f)
          assert str(m.get('id'))==os.environ['O39_ARTIFACT_ID']
          assert m.get('name')==os.environ['O39_ARTIFACT_NAME']
          assert m.get('expired') is False
          digest=m.get('digest')
          assert digest in (None,'','sha256:'+os.environ['O39_ARTIFACT_SHA256'])
          print('O39_METADATA=PASS')
          PY

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${O39_ARTIFACT_ID}/zip" \
            -o "$zip"
          echo "$O39_ARTIFACT_SHA256  $zip" | sha256sum -c -

          python3 - "$zip" "$O39_DIR" <<'PY'
          from pathlib import Path
          import sys,zipfile
          archive,destination=sys.argv[1:]
          root=Path(destination).resolve()
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  out=(root/info.filename).resolve()
                  if out != root and root not in out.parents:
                      raise SystemExit(f'unsafe archive member: {info.filename}')
              zf.extractall(root)
          PY

          test -f "$O39_DIR/SHA256SUMS.txt"
          (cd "$O39_DIR" && sha256sum -c SHA256SUMS.txt) | tee "$RUNNER_TEMP/o39-internal-sha.txt"
          test "$(grep -c 'OK$' "$RUNNER_TEMP/o39-internal-sha.txt")" -eq "$O39_INTERNAL_SHA_COUNT"
          test "$(wc -l < "$O39_DIR/SHA256SUMS.txt")" -eq "$O39_INTERNAL_SHA_COUNT"
          grep -Fxq 'O39_FINAL=RUNTIME_GREEN_PASS' "$O39_DIR/99-O39-FINAL-GATE.txt"
          grep -Fxq 'CURRENT_RUNTIME_PARENT=U5-O39' "$O39_DIR/99-O39-FINAL-GATE.txt"
          grep -Fxq 'RUNTIME_CONFLICTS_5.4.300=0' "$O39_DIR/99-O39-FINAL-GATE.txt"
          grep -Fxq 'TEXT_CONFLICT_HUNKS_5.4.300=0' "$O39_DIR/99-O39-FINAL-GATE.txt"
          grep -Fxq 'RUNTIME_CONFLICTS_5.4.302=6' "$O39_DIR/99-O39-FINAL-GATE.txt"
          grep -Fxq 'TEXT_CONFLICT_HUNKS_5.4.302=11' "$O39_DIR/99-O39-FINAL-GATE.txt"
          grep -Fxq 'SEMANTIC_RESOLUTIONS=38' "$O39_DIR/99-O39-FINAL-GATE.txt"
          grep -Fxq 'COMPREHENSIVE_ARTIFACT_COMPLETENESS=PASS' "$O39_DIR/99-O39-FINAL-GATE.txt"

          cp -a "$O39_DIR/." "$AUDIT_DIR/"
          mkdir -p "$AUDIT_DIR/lineage"
          cp "$O39_DIR/SHA256SUMS.txt" "$AUDIT_DIR/lineage/O39-SHA256SUMS.original.txt"
          cp "$meta" "$AUDIT_DIR/lineage/O39-ARTIFACT-METADATA.json"
          cp "$RUNNER_TEMP/o39-internal-sha.txt" "$AUDIT_DIR/lineage/O39-INTERNAL-SHA256-CHECK.txt"
          sha256sum "$zip" > "$AUDIT_DIR/lineage/O39-ZIP-SHA256.txt"
          rm -f "$AUDIT_DIR/SHA256SUMS.txt"

          cat > "$AUDIT_DIR/lineage/O39-PARENT-GATE.txt" <<EOF
          O39_ARTIFACT_ID=$O39_ARTIFACT_ID
          O39_ARTIFACT_SHA256=$O39_ARTIFACT_SHA256
          O39_INTERNAL_SHA256SUMS=$O39_INTERNAL_SHA_COUNT/$O39_INTERNAL_SHA_COUNT PASS
          O39_RUNTIME_GATE=PASS
          RUNTIME_SOURCE_PARENT=U5-O39
          EOF

      - name: Verify all six Stable provenance commits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pdir="$RUNNER_TEMP/o40-provenance"
          mkdir -p "$pdir"
          for spec in \
            "regmap:$REGMAP_FIX_COMMIT" \
            "ivtv:$IVTV_DMA_API_COMMIT" \
            "sdhci:$SDHCI_SDR50_COMMIT" \
            "rpmh:$RPMH_TRIGGER_COMMIT" \
            "fncm:$FNCM_MAC_COMMIT" \
            "xhci:$XHCI_AUTOSUSPEND_COMMIT"; do
            name="${spec%%:*}"; sha="${spec#*:}"
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/gregkh/linux/commits/$sha" -o "$pdir/$name.json"
          done

          python3 - "$pdir" "$AUDIT_DIR/40-O40-STABLE-PROVENANCE.txt" <<'PY'
          import json,os,sys
          from pathlib import Path
          pdir=Path(sys.argv[1]); report=Path(sys.argv[2])
          specs=[
              ('regmap','REGMAP_FIX_COMMIT','drivers/base/regmap/regmap.c',['if (config->read && config->write)']),
              ('ivtv','IVTV_DMA_API_COMMIT','drivers/media/pci/ivtv/ivtv-streams.c',['DMA_FROM_DEVICE','DMA_TO_DEVICE']),
              ('sdhci','SDHCI_SDR50_COMMIT','drivers/mmc/host/sdhci-msm.c',['CORE_HC_SELECT_IN_SDR50','SDHCI_SDR50_NEEDS_TUNING','u32 config;']),
              ('rpmh','RPMH_TRIGGER_COMMIT','drivers/soc/qcom/rpmh-rsc.c',['__tcs_set_trigger(drv, i, false)']),
              ('fncm','FNCM_MAC_COMMIT','drivers/usb/gadget/function/f_ncm.c',['ncm_string_defs[1].s = ncm->ethaddr','ncm_string_defs[STRING_MAC_IDX].s = ncm->ethaddr']),
              ('xhci','XHCI_AUTOSUSPEND_COMMIT','drivers/usb/host/xhci-plat.c',['pm_runtime_use_autosuspend(&pdev->dev)']),
          ]
          lines=[]
          for name,env,path,tokens in specs:
              with open(pdir/f'{name}.json',encoding='utf-8') as f: c=json.load(f)
              assert c['sha']==os.environ[env],(name,c.get('sha'),os.environ[env])
              files={x['filename']:x for x in c.get('files',[])}
              assert path in files,(name,path,files.keys())
              patch=files[path].get('patch') or ''
              for token in tokens:
                  assert token in patch,(name,token)
              lines += [f'{name.upper()}_COMMIT={c["sha"]}',f'{name.upper()}_PATH={path}',f'{name.upper()}_PATCH_GATE=PASS']
          lines += ['PROVENANCE_COMMITS=6/6 PASS','PROVENANCE_GATE=PASS','']
          report.write_text('\n'.join(lines),encoding='utf-8')
          print('O40_STABLE_PROVENANCE=PASS')
          PY

      - name: Resolve six independent 5.4.302 conflict blocks atomically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import difflib,hashlib,os,shutil,re

          audit=Path(os.environ['AUDIT_DIR'])
          td=audit/'target-5.4.302'
          td300=audit/'target-5.4.300'
          checks=[]
          def gate(c,label):
              if not c: raise AssertionError(label)
              checks.append(label)
          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8',newline='\n')
          def sha(s): return hashlib.sha256(s.encode()).hexdigest()
          def file_diff(rel,old,new):
              d=''.join(difflib.unified_diff(old.splitlines(True),new.splitlines(True),fromfile=f'a/{rel}',tofile=f'b/{rel}',n=3))
              return '' if not d else f'diff --git a/{rel} b/{rel}\n'+d
          def parse_and_resolve(preview,resolvers):
              lines=preview.splitlines(keepends=True); out=[]; i=0; bi=0; captures=[]
              while i<len(lines):
                  if lines[i].startswith('<<<<<<<'):
                      i+=1; ours=[]
                      while i<len(lines) and not lines[i].startswith('|||||||'): ours.append(lines[i]); i+=1
                      gate(i<len(lines),f'block {bi}: base marker'); i+=1; base=[]
                      while i<len(lines) and not lines[i].startswith('======='): base.append(lines[i]); i+=1
                      gate(i<len(lines),f'block {bi}: middle marker'); i+=1; theirs=[]
                      while i<len(lines) and not lines[i].startswith('>>>>>>>'): theirs.append(lines[i]); i+=1
                      gate(i<len(lines),f'block {bi}: end marker'); i+=1
                      o,b,t=''.join(ours),''.join(base),''.join(theirs)
                      captures.append((o,b,t))
                      r=resolvers[bi]
                      out.append(r(o,b,t) if callable(r) else r)
                      bi+=1
                  else:
                      out.append(lines[i]); i+=1
              gate(bi==len(resolvers),f'exact resolver count {bi}')
              return ''.join(out),captures

          gate(not read(td300/'runtime-conflicts.txt').strip(),'5.4.300 remains conflict free before O40')
          gate('RUNTIME_CONFLICTS=0' in read(td300/'RESULT.txt'),'5.4.300 RESULT conflict-free anchor')
          gate('SEMANTIC_RESOLUTIONS=38' in read(td300/'RESULT.txt'),'5.4.300 semantic count stays 38')

          specs=[]

          # 1) regmap: Stable only removes a redundant !config check from a branch P13 already removed.
          rel='drivers/base/regmap/regmap.c'; cdir=td/f'conflicts/{rel}'
          preview=read(cdir/'MERGE-PREVIEW'); ours=read(cdir/'OURS')
          gate(sha(ours)==os.environ['REGMAP_OURS_SHA256'],'regmap exact OURS anchor')
          gate(sha(preview)==os.environ['REGMAP_PREVIEW_SHA256'],'regmap exact preview anchor')
          cand,cap=parse_and_resolve(preview,[lambda o,b,t:o])
          gate(sha(cand)==os.environ['REGMAP_CANDIDATE_SHA256'],'regmap exact candidate SHA')
          gate('if (!bus) {' in cand,'regmap P13 no-bus branch preserved')
          gate('if (config->read && config->write)' not in cand,'regmap removed branch not reintroduced')
          specs.append((rel,cand,'REGMAP_P13_REMOVED_BULK_CALLBACK_BRANCH_PRESERVE_SEMANTIC_RESOLUTION',1,
                        ['P13_REMOVED_BULK_CALLBACK_BRANCH=PRESERVED','STABLE_REDUNDANT_NULLCHECK_CHANGE=INAPPLICABLE']))

          # 2) ivtv: preserve P13 VFL type while taking Stable DMA API migration in all 5 overlaps.
          rel='drivers/media/pci/ivtv/ivtv-streams.c'; cdir=td/f'conflicts/{rel}'
          preview=read(cdir/'MERGE-PREVIEW'); ours=read(cdir/'OURS')
          gate(sha(ours)==os.environ['IVTV_OURS_SHA256'],'ivtv exact OURS anchor')
          gate(sha(preview)==os.environ['IVTV_PREVIEW_SHA256'],'ivtv exact preview anchor')
          def ivtv_union(o,b,t):
              ol=o.splitlines(keepends=True); tl=t.splitlines(keepends=True)
              gate(len(ol)==2 and len(tl)==2,'ivtv overlap shape 2+2')
              gate('VFL_TYPE_GRABBER' in ol[0],'ivtv P13 VFL type anchor')
              gate('DMA_' in tl[1],'ivtv Stable DMA enum anchor')
              return ol[0]+tl[1]
          cand,cap=parse_and_resolve(preview,[ivtv_union]*5)
          gate(sha(cand)==os.environ['IVTV_CANDIDATE_SHA256'],'ivtv exact candidate SHA')
          gate(cand.count('VFL_TYPE_GRABBER')==6,'ivtv P13 grabber naming retained')
          gate('PCI_DMA_FROMDEVICE' not in cand and 'PCI_DMA_TODEVICE' not in cand,'ivtv legacy PCI DMA direction enums removed')
          gate(cand.count('DMA_FROM_DEVICE')>=4 and cand.count('DMA_TO_DEVICE')>=2,'ivtv Stable DMA direction enums integrated')
          specs.append((rel,cand,'IVTV_P13_VIDEO_TYPE_DMA_API_UNION_SEMANTIC_RESOLUTION',5,
                        ['P13_VFL_TYPE_GRABBER=PRESERVED','STABLE_DMA_API=INTEGRATED']))

          # 3) sdhci-msm: use P13 offset helper plus Stable SDR50 config local.
          rel='drivers/mmc/host/sdhci-msm.c'; cdir=td/f'conflicts/{rel}'
          preview=read(cdir/'MERGE-PREVIEW'); ours=read(cdir/'OURS')
          gate(sha(ours)==os.environ['SDHCI_OURS_SHA256'],'sdhci exact OURS anchor')
          gate(sha(preview)==os.environ['SDHCI_PREVIEW_SHA256'],'sdhci exact preview anchor')
          def sdhci_union(o,b,t):
              gate('sdhci_priv_msm_offset(host)' in o,'sdhci P13 offset helper anchor')
              gate('u32 config;' in t,'sdhci Stable config local anchor')
              return o+'\tu32 config;\n'
          cand,cap=parse_and_resolve(preview,[sdhci_union])
          gate(sha(cand)==os.environ['SDHCI_CANDIDATE_SHA256'],'sdhci exact candidate SHA')
          gate('sdhci_priv_msm_offset(host)' in cand,'sdhci P13 offset helper preserved')
          gate('CORE_HC_SELECT_IN_SDR50' in cand and 'SDHCI_SDR50_NEEDS_TUNING' in cand,'sdhci Stable SDR50 tuning retained')
          gate('u32 config;' in cand,'sdhci config local integrated')
          specs.append((rel,cand,'SDHCI_MSM_SDR50_VENDOR_OFFSET_UNION_SEMANTIC_RESOLUTION',1,
                        ['P13_MSM_OFFSET_HELPER=PRESERVED','STABLE_SDR50_TUNING=INTEGRATED']))

          # 4) rpmh-rsc: unconditional trigger clear through P13 helper; vendor IRQ disable remains conditional.
          rel='drivers/soc/qcom/rpmh-rsc.c'; cdir=td/f'conflicts/{rel}'
          preview=read(cdir/'MERGE-PREVIEW'); ours=read(cdir/'OURS')
          gate(sha(ours)==os.environ['RPMH_OURS_SHA256'],'rpmh exact OURS anchor')
          gate(sha(preview)==os.environ['RPMH_PREVIEW_SHA256'],'rpmh exact preview anchor')
          first='\t\t/* Clear AMC trigger & enable modes and\n'
          second=('\t\t__tcs_trigger(drv, i, false);\n'
                  '\t\tif (!drv->tcs[ACTIVE_TCS].num_tcs) {\n'
                  '\t\t\t/*\n'
                  '\t\t\t * Disable interrupt for this TCS to avoid being\n'
                  '\t\t\t * spammed with interrupts coming when the solver\n'
                  '\t\t\t * sends its wake votes.\n'
                  '\t\t\t */\n'
                  '\t\t\tenable_tcs_irq(drv, i, false);\n'
                  '\t\t}\n')
          cand,cap=parse_and_resolve(preview,[first,second])
          gate(sha(cand)==os.environ['RPMH_CANDIDATE_SHA256'],'rpmh exact candidate SHA')
          gate(cand.count('__tcs_trigger(drv, i, false);')==1,'rpmh unconditional P13 trigger clear exactly once')
          gate('__tcs_set_trigger(drv, i, false);' not in cand,'rpmh upstream helper name not reintroduced')
          gate(cand.count('if (!drv->tcs[ACTIVE_TCS].num_tcs)')==1,'rpmh vendor IRQ condition retained')
          gate(cand.count('enable_tcs_irq(drv, i, false);')==1,'rpmh vendor IRQ disable retained')
          specs.append((rel,cand,'RPMH_RSC_UNCONDITIONAL_TRIGGER_VENDOR_IRQ_UNION_SEMANTIC_RESOLUTION',2,
                        ['P13_TRIGGER_HELPER=PRESERVED','STABLE_UNCONDITIONAL_TRIGGER_CLEAR=INTEGRATED','VENDOR_IRQ_DISABLE_CONDITION=PRESERVED']))

          # 5) f_ncm: clean merge already adds bind-time assignment; remove obsolete alloc-time conflict block.
          rel='drivers/usb/gadget/function/f_ncm.c'; cdir=td/f'conflicts/{rel}'
          preview=read(cdir/'MERGE-PREVIEW'); ours=read(cdir/'OURS')
          gate(sha(ours)==os.environ['FNCM_OURS_SHA256'],'f_ncm exact OURS anchor')
          gate(sha(preview)==os.environ['FNCM_PREVIEW_SHA256'],'f_ncm exact preview anchor')
          cand,cap=parse_and_resolve(preview,[''])
          gate(sha(cand)==os.environ['FNCM_CANDIDATE_SHA256'],'f_ncm exact candidate SHA')
          gate(cand.count('ncm_string_defs[1].s = ncm->ethaddr;')==1,'f_ncm Stable bind-time MAC string assignment retained once')
          gate('ncm_string_defs[STRING_MAC_IDX].s = ncm->ethaddr;' not in cand,'f_ncm defunct alloc assignment removed')
          gate(cand.count('gether_get_host_addr_cdc')==1,'f_ncm P13 bind-time address retrieval retained once')
          specs.append((rel,cand,'F_NCM_BIND_TIME_MAC_ASSIGNMENT_P13_UNION_SEMANTIC_RESOLUTION',1,
                        ['P13_BIND_TIME_ADDR_RETRIEVAL=PRESERVED','STABLE_BIND_TIME_MAC_ASSIGNMENT=INTEGRATED','ALLOC_TIME_ASSIGNMENT=REMOVED']))

          # 6) xhci-plat: Stable autosuspend intent already exists in P13's relocated runtime-PM sequence.
          rel='drivers/usb/host/xhci-plat.c'; cdir=td/f'conflicts/{rel}'
          preview=read(cdir/'MERGE-PREVIEW'); ours=read(cdir/'OURS')
          gate(sha(ours)==os.environ['XHCI_OURS_SHA256'],'xhci exact OURS anchor')
          gate(sha(preview)==os.environ['XHCI_PREVIEW_SHA256'],'xhci exact preview anchor')
          cand,cap=parse_and_resolve(preview,[''])
          gate(sha(cand)==os.environ['XHCI_CANDIDATE_SHA256'],'xhci exact candidate SHA')
          gate(cand.count('pm_runtime_use_autosuspend(&pdev->dev);')==1,'xhci autosuspend enabled exactly once')
          gate(cand.count('pm_runtime_set_autosuspend_delay(&pdev->dev, 1000);')==1,'xhci P13 autosuspend delay retained')
          gate(cand.count('pm_runtime_get_sync(&pdev->dev);')==1,'xhci P13 runtime get_sync retained')
          gate('pm_runtime_get_noresume(&pdev->dev);' not in cand,'xhci obsolete early runtime sequence not reintroduced')
          specs.append((rel,cand,'XHCI_PLAT_P13_AUTOSUSPEND_ALREADY_PRESENT_SEMANTIC_RESOLUTION',1,
                        ['P13_RELOCATED_RUNTIME_PM=PRESERVED','STABLE_AUTOSUSPEND_INTENT=ALREADY_SATISFIED']))

          gate(len(specs)==6,'six logical resolution steps assembled')
          expected_hunks=sum(x[3] for x in specs)
          gate(expected_hunks==11,'eleven conflict hunks accounted for')

          runtime=read(td/'runtime-conflicts.txt').splitlines()
          gate(len(runtime)==6,'O39 has exactly six 5.4.302 runtime conflicts')
          gate(set(runtime)=={x[0] for x in specs},'O39 six paths exactly match O40 train')

          partial=td/'P13-to-5.4.302-AUTO-MERGED-PARTIAL.patch'
          ptext=read(partial)
          running_conf=6; running_hunks=11; running_sem=38
          summary=[]
          for index,(rel,cand,classification,hunks,notes) in enumerate(specs,1):
              cdir=td/f'conflicts/{rel}'
              gate(cdir.is_dir(),f'{index}: conflict dir exists {rel}')
              meta=read(cdir/'META.txt')
              gate(f'MERGE_CONFLICT_HUNKS={hunks}' in meta,f'{index}: exact hunk count for {rel}')
              ours=read(cdir/'OURS')
              patch=file_diff(rel,ours,cand)
              gate(bool(patch),f'{index}: nonempty incremental patch {rel}')
              gate(f'diff --git a/{rel} b/{rel}' not in ptext,f'{index}: unresolved path absent from cumulative patch before append')

              rdir=td/f'resolved-evidence/{rel}'
              rdir.parent.mkdir(parents=True,exist_ok=True)
              shutil.move(str(cdir),str(rdir))
              write(rdir/'RESOLVED-O40',cand)
              write(rdir/'O40-LOGICAL-STEP.txt','\n'.join([
                  f'STEP={index}',f'PATH={rel}',f'CLASSIFICATION={classification}',*notes,
                  f'CANDIDATE_SHA256={sha(cand)}','SOURCE_RESOLUTION=PASS','']))
              ipath=td/f'o40-step-{index:02d}-{rel.replace("/","__")}.patch'
              write(ipath,patch)
              if ptext and not ptext.endswith('\n'): ptext+='\n'
              ptext+=patch

              runtime=[x for x in runtime if x!=rel]
              running_conf-=1; running_hunks-=hunks; running_sem+=1
              summary.append((index,rel,running_conf,running_hunks,running_sem,sha(cand),classification))

          write(partial,ptext)
          write(td/'runtime-conflicts.txt','')

          rows=read(td/'path-classification.tsv').splitlines()
          classmap={x[0]:x[2] for x in specs}; hits={k:0 for k in classmap}
          for i,row in enumerate(rows):
              cols=row.split('\t')
              if len(cols)>=3 and cols[1] in classmap:
                  gate(cols[2]=='TEXT_CONFLICT',f'classification prior TEXT_CONFLICT {cols[1]}')
                  cols[2]=classmap[cols[1]]; rows[i]='\t'.join(cols); hits[cols[1]]+=1
          gate(all(v==1 for v in hits.values()),'each of six classification rows updated exactly once')
          gate(sum(1 for r in rows[1:] if len(r.split('\t'))>=3 and r.split('\t')[2]=='TEXT_CONFLICT')==0,'no TEXT_CONFLICT rows remain')
          write(td/'path-classification.tsv','\n'.join(rows)+'\n')

          result=read(td/'RESULT.txt')
          for a,b in [('TEXT_CONFLICT=6\n','TEXT_CONFLICT=0\n'),('RUNTIME_CONFLICTS=6\n','RUNTIME_CONFLICTS=0\n'),('TEXT_CONFLICT_HUNKS=11\n','TEXT_CONFLICT_HUNKS=0\n'),('SEMANTIC_RESOLUTIONS=38\n','SEMANTIC_RESOLUTIONS=44\n')]:
              gate(result.count(a)==1,f'RESULT marker {a.strip()} unique')
              result=result.replace(a,b,1)
          insert='BINDER_SPLIT_LAYOUT_MAX_THREADS_TYPE_UNION_SEMANTIC_RESOLUTION=1\n'
          gate(result.count(insert)==1,'RESULT semantic insertion anchor')
          extra=''.join(f'{x[2]}=1\n' for x in specs)
          result=result.replace(insert,insert+extra,1)
          yes='BINDER_SPLIT_LAYOUT_MAX_THREADS_TYPE_UNION=YES\n'
          gate(result.count(yes)==1,'RESULT yes insertion anchor')
          yes_extra=''.join(f'{x[2].replace("_SEMANTIC_RESOLUTION","")}=YES\n' for x in specs)
          result=result.replace(yes,yes+yes_extra,1)
          write(td/'RESULT.txt',result)

          write(audit/'40-O40-RESOLUTION-TRAIN-GATE.txt','\n'.join([
              f'ASSERTIONS={len(checks)}','LOGICAL_STEPS=6/6 PASS','CONFLICT_HUNKS_ACCOUNTED=11/11 PASS',
              '5.4.300_UNCHANGED_CONFLICT_FREE=PASS','5.4.302_ALL_CONFLICTS_RESOLVED=PASS',
              'SEMANTIC_RESOLUTIONS_5.4.300=38','SEMANTIC_RESOLUTIONS_5.4.302=44','RESOLUTION_TRAIN=PASS','']))
          write(audit/'40-O40-STEP-SUMMARY.tsv','STEP\tPATH\tREMAINING_CONFLICTS\tREMAINING_HUNKS\tSEMANTIC_RESOLUTIONS\tCANDIDATE_SHA256\tCLASSIFICATION\n'+'\n'.join('\t'.join(map(str,x)) for x in summary)+'\n')
          print(f'O40_RESOLUTION_ASSERTIONS={len(checks)}')
          PY

      - name: Validate six incremental source steps and final closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess,hashlib
          audit=Path(os.environ['AUDIT_DIR']); td=audit/'target-5.4.302'; verify=Path(os.environ['VERIFY_DIR'])
          paths=[
              ('drivers/base/regmap/regmap.c',os.environ['REGMAP_CANDIDATE_SHA256']),
              ('drivers/media/pci/ivtv/ivtv-streams.c',os.environ['IVTV_CANDIDATE_SHA256']),
              ('drivers/mmc/host/sdhci-msm.c',os.environ['SDHCI_CANDIDATE_SHA256']),
              ('drivers/soc/qcom/rpmh-rsc.c',os.environ['RPMH_CANDIDATE_SHA256']),
              ('drivers/usb/gadget/function/f_ncm.c',os.environ['FNCM_CANDIDATE_SHA256']),
              ('drivers/usb/host/xhci-plat.c',os.environ['XHCI_CANDIDATE_SHA256']),
          ]
          checks=[]
          def gate(c,l):
              if not c: raise AssertionError(l)
              checks.append(l)
          for index,(rel,expected) in enumerate(paths,1):
              rdir=td/f'resolved-evidence/{rel}'
              ours=rdir/'OURS'; resolved=rdir/'RESOLVED-O40'
              patch=td/f'o40-step-{index:02d}-{rel.replace("/","__")}.patch'
              repo=verify/f'step{index:02d}'
              repo.mkdir(parents=True,exist_ok=True)
              dst=repo/rel; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(ours.read_bytes())
              subprocess.run(['git','-C',str(repo),'init','-q'],check=True)
              subprocess.run(['git','-C',str(repo),'config','user.name','VEUX U5-O40 Audit'],check=True)
              subprocess.run(['git','-C',str(repo),'config','user.email','veux-u5-o40@invalid.local'],check=True)
              subprocess.run(['git','-C',str(repo),'add',rel],check=True)
              subprocess.run(['git','-C',str(repo),'commit','-qm','base'],check=True)
              subprocess.run(['git','-C',str(repo),'apply','--check','--whitespace=error',str(patch)],check=True)
              subprocess.run(['git','-C',str(repo),'apply','--index','--whitespace=error',str(patch)],check=True)
              subprocess.run(['git','-C',str(repo),'diff','--cached','--check'],check=True)
              changed=subprocess.check_output(['git','-C',str(repo),'diff','--cached','--name-only'],text=True).splitlines()
              gate(changed==[rel],f'step {index}: exactly one logical source path changed')
              got=hashlib.sha256(dst.read_bytes()).hexdigest()
              gate(got==expected,f'step {index}: candidate SHA exact')
              gate(dst.read_bytes()==resolved.read_bytes(),f'step {index}: applied file equals resolved evidence')

          gate(not (td/'runtime-conflicts.txt').read_text().strip(),'5.4.302 runtime conflicts empty')
          gate('RUNTIME_CONFLICTS=0' in (td/'RESULT.txt').read_text(),'5.4.302 RESULT runtime zero')
          gate('TEXT_CONFLICT_HUNKS=0' in (td/'RESULT.txt').read_text(),'5.4.302 RESULT hunk zero')
          gate('SEMANTIC_RESOLUTIONS=44' in (td/'RESULT.txt').read_text(),'5.4.302 semantic resolutions 44')
          gate(len(list((td/'conflicts').rglob('META.txt')))==0,'5.4.302 conflict evidence directories exhausted')
          td300=audit/'target-5.4.300'
          gate(not (td300/'runtime-conflicts.txt').read_text().strip(),'5.4.300 remains runtime conflict free')
          gate('SEMANTIC_RESOLUTIONS=38' in (td300/'RESULT.txt').read_text(),'5.4.300 semantic count remains 38')

          partial=(td/'P13-to-5.4.302-AUTO-MERGED-PARTIAL.patch').read_text()
          for rel,_ in paths:
              gate(partial.count(f'diff --git a/{rel} b/{rel}')==1,f'cumulative .302 patch contains {rel} exactly once')
          (audit/'40-O40-SOURCE-APPLICATION-GATE.txt').write_text('\n'.join([
              f'ASSERTIONS={len(checks)}','INDEPENDENT_GIT_APPLY_CHECKS=6/6 PASS','INDEPENDENT_GIT_DIFF_CHECKS=6/6 PASS',
              'RUNTIME_CONFLICTS_5.4.300=0','TEXT_CONFLICT_HUNKS_5.4.300=0',
              'RUNTIME_CONFLICTS_5.4.302=0','TEXT_CONFLICT_HUNKS_5.4.302=0',
              'SEMANTIC_RESOLUTIONS_5.4.300=38','SEMANTIC_RESOLUTIONS_5.4.302=44','SOURCE_APPLICATION_GATE=PASS','']),encoding='utf-8')
          print(f'O40_SOURCE_APPLICATION_ASSERTIONS={len(checks)}')
          PY

      - name: Finalize comprehensive O40 conflict-free source artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'PROVENANCE_GATE=PASS' "$AUDIT_DIR/40-O40-STABLE-PROVENANCE.txt"
          grep -Fxq 'RESOLUTION_TRAIN=PASS' "$AUDIT_DIR/40-O40-RESOLUTION-TRAIN-GATE.txt"
          grep -Fxq 'SOURCE_APPLICATION_GATE=PASS' "$AUDIT_DIR/40-O40-SOURCE-APPLICATION-GATE.txt"

          cat > "$AUDIT_DIR/40-O40-SUMMARY.txt" <<'EOF'
          O40_MODE=5.4.302_FINAL_SIX_BLOCK_CONFLICT_RESOLUTION_TRAIN
          SOURCE_PARENT=U5-O39
          O40_BECOMES_RUNTIME_PARENT=YES
          LOGICAL_STEPS=6
          RUNTIME_CONFLICTS_5.4.300=0
          TEXT_CONFLICT_HUNKS_5.4.300=0
          SEMANTIC_RESOLUTIONS_5.4.300=38
          RUNTIME_CONFLICTS_5.4.302=0
          TEXT_CONFLICT_HUNKS_5.4.302=0
          SEMANTIC_RESOLUTIONS_5.4.302=44
          BOTH_TARGET_SOURCE_CONFLICTS_CLOSED=YES
          READY_FOR_FULL_BUILD_AUDIT=YES
          KERNEL_BUILD_PERFORMED=NO
          AK3_CREATED=NO
          FLASH_PERFORMED=NO
          DEVICE_PASS=NO
          O40_RUNTIME_GATE=PASS
          EOF

          rm -f "$AUDIT_DIR/99-FILE-LIST.txt" "$AUDIT_DIR/SHA256SUMS.txt"
          file_count="$(find "$AUDIT_DIR" -type f | wc -l)"
          byte_count="$(du -sb "$AUDIT_DIR" | awk '{print $1}')"
          patch300_bytes="$(stat -c '%s' "$AUDIT_DIR/target-5.4.300/P13-to-5.4.300-AUTO-MERGED-PARTIAL.patch")"
          patch302_bytes="$(stat -c '%s' "$AUDIT_DIR/target-5.4.302/P13-to-5.4.302-AUTO-MERGED-PARTIAL.patch")"
          test "$file_count" -ge 400
          test "$byte_count" -ge 20500000
          test "$patch300_bytes" -ge 4000000
          test "$patch302_bytes" -ge 4400000
          test "$(wc -l < "$AUDIT_DIR/lineage/O39-SHA256SUMS.original.txt")" -eq "$O39_INTERNAL_SHA_COUNT"
          grep -Fxq 'O39_RUNTIME_GATE=PASS' "$AUDIT_DIR/lineage/O39-PARENT-GATE.txt"

          cat > "$AUDIT_DIR/99-O40-FINAL-GATE.txt" <<EOF
          O39_EXACT_ARTIFACT=PASS
          O39_INTERNAL_SHA256SUMS=$O39_INTERNAL_SHA_COUNT/$O39_INTERNAL_SHA_COUNT PASS
          O39_RUNTIME_GATE=PASS
          STABLE_PROVENANCE_COMMITS=6/6 PASS
          LOGICAL_RESOLUTION_STEPS=6/6 PASS
          CONFLICT_HUNKS_ACCOUNTED=11/11 PASS
          INDEPENDENT_PATCH_APPLY_GATES=6/6 PASS
          RUNTIME_CONFLICTS_5.4.300=0
          TEXT_CONFLICT_HUNKS_5.4.300=0
          SEMANTIC_RESOLUTIONS_5.4.300=38
          RUNTIME_CONFLICTS_5.4.302=0
          TEXT_CONFLICT_HUNKS_5.4.302=0
          SEMANTIC_RESOLUTIONS_5.4.302=44
          BOTH_TARGET_SOURCE_CONFLICTS_CLOSED=PASS
          READY_FOR_FULL_BUILD_AUDIT=YES
          ARTIFACT_FILE_COUNT=$file_count
          ARTIFACT_UNCOMPRESSED_BYTES=$byte_count
          PARTIAL_PATCH_5.4.300_BYTES=$patch300_bytes
          PARTIAL_PATCH_5.4.302_BYTES=$patch302_bytes
          COMPREHENSIVE_ARTIFACT_COMPLETENESS=PASS
          CURRENT_RUNTIME_PARENT=U5-O40
          KERNEL_BUILD_PERFORMED=NO
          AK3_CREATED=NO
          FLASH_PERFORMED=NO
          DEVICE_PASS=NO
          O40_FINAL=RUNTIME_GREEN_PASS
          EOF

          (
            cd "$AUDIT_DIR"
            find . -type f ! -name SHA256SUMS.txt -print | LC_ALL=C sort
          ) > "$AUDIT_DIR/99-FILE-LIST.txt"
          (
            cd "$AUDIT_DIR"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          ) | tee "$RUNNER_TEMP/o40-final-sha256-check.txt"
          test "$(grep -c 'OK$' "$RUNNER_TEMP/o40-final-sha256-check.txt")" -eq "$(wc -l < "$AUDIT_DIR/SHA256SUMS.txt")"
          echo 'O40_FINAL=RUNTIME_GREEN_PASS'

      - name: Upload one comprehensive U5-O40 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-GEN1-U5-O40-5.4.302-final-six-block-conflict-resolution-train-official-stable-port-audit
          path: ${{ env.AUDIT_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
