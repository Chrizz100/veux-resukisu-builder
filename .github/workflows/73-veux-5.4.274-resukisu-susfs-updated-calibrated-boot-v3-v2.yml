          rm -rf "$CANDIDATE"
          mkdir -p "$CANDIDATE"

          cp "$OUT_DIR/arch/arm64/boot/Image" "$CANDIDATE/Image"
          cp "$OUT_DIR/.config" "$CANDIDATE/config"
          cp "$OUT_DIR/System.map" "$CANDIDATE/System.map"

          test "$(sha256sum "$CANDIDATE/Image" | awk '{print $1}')" = \
