      - name: Validate candidate has no accidental flash payload
        if: steps.susfs_api.outputs.ready == 'yes'
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATE="$GITHUB_WORKSPACE/w71-kernel-candidate"

