            exit 1
          fi

          grep -Fq 'FLASHABLE=NO' "$CANDIDATE/CANDIDATE_MANIFEST.txt"

          {
            echo "BOOT_IMAGE_PRESENT=NO"
            echo "FLASHABLE_ZIP_PRESENT=NO"
            echo "ANYKERNEL_PAYLOAD_PRESENT=NO"
            echo "STATIC_CANDIDATE_BOUNDARY=PASS"
