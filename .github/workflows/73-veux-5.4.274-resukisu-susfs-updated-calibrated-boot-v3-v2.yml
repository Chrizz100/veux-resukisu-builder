          test "$(sha256sum "$CANDIDATE/config" | awk '{print $1}')" = \
            "d7cd955abd59da45804acc9c5e450cf8fc953da3e66bbc274212b40ee9a0b372"

          {
            echo "TARGET=VEUX"
            echo "KERNEL=5.4.274"
            echo "RESUKISU_TARGET=$TARGET_REF"
            echo "IMAGE_SHA256=$(sha256sum "$CANDIDATE/Image" | awk '{print $1}')"
            echo "CONFIG_SHA256=$(sha256sum "$CANDIDATE/config" | awk '{print $1}')"
            echo "SYSTEM_MAP_SHA256=$(sha256sum "$CANDIDATE/System.map" | awk '{print $1}')"
            echo "REPRODUCIBILITY=PASS"
