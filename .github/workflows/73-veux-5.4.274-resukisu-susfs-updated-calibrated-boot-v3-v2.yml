          test -s "$CANDIDATE/CANDIDATE_MANIFEST.txt"

          if find "$CANDIDATE" -type f \( \
              -name 'boot.img' -o \
              -name '*.zip' -o \
              -name 'anykernel.sh' -o \
              -name 'flash*.sh' \
