          : > "$ALL"

          page=1
          while :; do
            PAGE="$BOOT_WORK/repository-artifacts-${page}.json"

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=${page}" \
              -o "$PAGE"

            COUNT="$(jq '.artifacts | length' "$PAGE")"
            jq -c '.artifacts[]' "$PAGE" >> "$ALL"

            if [ "$COUNT" -lt 100 ]; then
              break
            fi

            page=$((page + 1))
            [ "$page" -le 30 ] || {
              echo "ERROR: artifact pagination safety limit" >&2
              exit 1
            }
          done

          MATCHES="$(
            jq -s \
              --arg NAME "$W21_ARTIFACT_NAME" \
              '[.[] | select(.name == $NAME and .expired == false)] | sort_by(.created_at)' \
              "$ALL"
          )"

          test "$(jq 'length' <<< "$MATCHES")" -ge 1

          SELECTED="$(jq '.[-1]' <<< "$MATCHES")"
          URL="$(jq -r '.archive_download_url' <<< "$SELECTED")"

          jq . <<< "$SELECTED" \
            > "$ARTIFACT_DIR/20-w21-artifact-metadata.json"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$URL" \
            -o "$BOOT_INPUTS/w21-artifact.zip"

          unzip -t "$BOOT_INPUTS/w21-artifact.zip" \
            > "$ARTIFACT_DIR/20-w21-outer-zip-crc.txt"

          unzip -q \
            "$BOOT_INPUTS/w21-artifact.zip" \
            -d "$BOOT_W21"

          echo "W21_CALIBRATION_ARTIFACT_DOWNLOAD=PASS" \
            | tee "$ARTIFACT_DIR/20-w21-download.txt"

      - name: Verify exact stock and historical custom boot inputs
        if: steps.susfs_api.outputs.ready == 'yes'
        shell: bash
        run: |
          set -euo pipefail

          FINAL_OLD="$BOOT_W21/$W21_FINAL_ZIP_NAME"
          test -s "$FINAL_OLD"

          test "$(stat -c '%s' "$FINAL_OLD")" = \
            "$W21_FINAL_ZIP_BYTES"
          test "$(sha256sum "$FINAL_OLD" | awk '{print $1}')" = \
            "$W21_FINAL_ZIP_SHA256"

          unzip -t "$FINAL_OLD" \
            > "$ARTIFACT_DIR/21-w21-final-zip-crc.txt"

          unzip -q "$FINAL_OLD" -d "$BOOT_OLD_PACKAGE"

          test -s "$BOOT_OLD_PACKAGE/boot.img"
          test -s "$BOOT_OLD_PACKAGE/rollback_stock_boot.img.gz"
          test -s "$BOOT_OLD_PACKAGE/tools/magiskboot"

          test "$(sha256sum "$BOOT_OLD_PACKAGE/boot.img" | awk '{print $1}')" = \
            "$OLD_CUSTOM_BOOT_SHA256"
          test "$(sha256sum "$BOOT_OLD_PACKAGE/rollback_stock_boot.img.gz" | awk '{print $1}')" = \
            "$ROLLBACK_GZIP_SHA256"
          test "$(sha256sum "$BOOT_OLD_PACKAGE/tools/magiskboot" | awk '{print $1}')" = \
            "$MAGISKBOOT_SHA256"

          gzip -t "$BOOT_OLD_PACKAGE/rollback_stock_boot.img.gz"
          gzip -dc \
            "$BOOT_OLD_PACKAGE/rollback_stock_boot.img.gz" \
            > "$BOOT_BUILD/stock_boot.img"

          test "$(stat -c '%s' "$BOOT_BUILD/stock_boot.img")" = \
            "$STOCK_BOOT_BYTES"
          test "$(sha256sum "$BOOT_BUILD/stock_boot.img" | awk '{print $1}')" = \
            "$STOCK_BOOT_SHA256"

          NEW_IMAGE="$GITHUB_WORKSPACE/w71-kernel-candidate/Image"
          test -s "$NEW_IMAGE"
          test "$(stat -c '%s' "$NEW_IMAGE")" = "$W70_IMAGE_BYTES"
          test "$(sha256sum "$NEW_IMAGE" | awk '{print $1}')" = "$W70_IMAGE_SHA256"

          {
            echo "BOOT_INPUT_GATE=PASS"
            echo "STOCK_BOOT_SHA256=$STOCK_BOOT_SHA256"
            echo "STOCK_BOOT_BYTES=$STOCK_BOOT_BYTES"
            echo "OLD_CUSTOM_BOOT_SHA256=$OLD_CUSTOM_BOOT_SHA256"
            echo "NEW_KERNEL_SHA256=$W70_IMAGE_SHA256"
            echo "NEW_KERNEL_BYTES=$W70_IMAGE_BYTES"
            echo "STOCK_RAMDISK_SHA256=$STOCK_RAMDISK_SHA256"
            echo "MAGISKBOOT_SHA256=$MAGISKBOOT_SHA256"
          } | tee "$ARTIFACT_DIR/21-boot-input-gate.txt"

      - name: Build calibrated Boot v3 candidate twice
        if: steps.susfs_api.outputs.ready == 'yes'
        shell: bash
        run: |
          set -euo pipefail

          python3 - \
            "$BOOT_BUILD/stock_boot.img" \
            "$BOOT_OLD_PACKAGE/boot.img" \
            "$GITHUB_WORKSPACE/w71-kernel-candidate/Image" \
            "$BOOT_BUILD/candidate-A.img" \
            "$BOOT_BUILD/candidate-B.img" \
            "$ARTIFACT_DIR/22-boot-build.json" \
            "$ARTIFACT_DIR/22-boot-build.txt" <<'PY'
          import hashlib
          import json
          import struct
          import sys
          from pathlib import Path

          stock_path = Path(sys.argv[1])
          old_boot_path = Path(sys.argv[2])
          new_image_path = Path(sys.argv[3])
          out_a = Path(sys.argv[4])
          out_b = Path(sys.argv[5])
          json_out = Path(sys.argv[6])
          text_out = Path(sys.argv[7])

          STOCK_SHA = "ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5"
          OLD_BOOT_SHA = "2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e"
          OLD_KERNEL_SHA = "e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96"
          NEW_IMAGE_SHA = "1ff4c57bb524b1d01de1d56739133ea4a9c9b3269ad87e013b8140f3654d8aea"
          RAMDISK_SHA = "0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a"
          OLD_KERNEL_BYTES = 29839872
          NEW_IMAGE_BYTES = 29843968
          BOOT_BYTES = 134217728

          stock = stock_path.read_bytes()
          old_boot = old_boot_path.read_bytes()
          new_image = new_image_path.read_bytes()

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def align(value, size=4096):
              return (value + size - 1) // size * size

          def need(condition, message):
              if not condition:
                  raise SystemExit("ERROR: " + message)

          def arm64_header(image):
              need(len(image) >= 64, "ARM64 Image too small")
              text_offset, image_size, flags = struct.unpack_from(
                  "<QQQ", image, 8
              )
              magic, res5 = struct.unpack_from("<II", image, 56)
              return {
                  "text_offset": text_offset,
                  "image_size": image_size,
                  "flags": flags,
                  "magic": magic,
                  "res5": res5,
              }

          def parse_footer(data):
              raw = data[-64:]
              need(raw[:4] == b"AVBf", "AVB footer magic")
              major, minor = struct.unpack_from(">II", raw, 4)
              original, offset, size = struct.unpack_from(">QQQ", raw, 12)
              need(offset + size <= len(data) - 64, "AVB footer geometry")
              return {
                  "major": major,
                  "minor": minor,
                  "original": original,
                  "offset": offset,
                  "size": size,
                  "raw": raw,
                  "vbmeta": data[offset:offset + size],
              }

          def parse_vbmeta(vb):
              need(vb[:4] == b"AVB0", "AVB0 magic")
              auth_size, aux_size = struct.unpack_from(">QQ", vb, 12)
              algorithm_type = struct.unpack_from(">I", vb, 28)[0]
              values = struct.unpack_from(">QQQQQQQQQQQ", vb, 32)
              descriptors_offset = values[8]
              descriptors_size = values[9]
              aux_start = 256 + auth_size
              pos = aux_start + descriptors_offset
              end = pos + descriptors_size
              need(end <= aux_start + aux_size, "AVB descriptor geometry")

              descriptors = []
              while pos < end:
                  tag, following = struct.unpack_from(">QQ", vb, pos)
                  raw = vb[pos:pos + 16 + following]
                  need(len(raw) == 16 + following, "truncated AVB descriptor")
                  item = {
                      "tag": tag,
                      "offset": pos,
                      "raw": raw,
                      "following": following,
                  }
                  if tag == 2:
                      image_size = struct.unpack_from(">Q", raw, 16)[0]
                      algorithm = (
                          raw[24:56].split(b"\0", 1)[0]
                          .decode("ascii", "replace")
                      )
                      name_len, salt_len, digest_len, dflags = \
                          struct.unpack_from(">IIII", raw, 56)
                      q = 132
                      partition = raw[q:q + name_len].decode(
                          "ascii", "replace"
                      )
                      q += name_len
                      salt = raw[q:q + salt_len]
                      q += salt_len
                      digest = raw[q:q + digest_len]
                      item.update({
                          "type": "hash",
                          "image_size": image_size,
                          "hash_algorithm": algorithm,
                          "partition": partition,
                          "salt": salt,
                          "digest": digest,
                          "digest_offset": pos + q,
                          "digest_len": digest_len,
                          "image_size_offset": pos + 16,
                          "flags": dflags,
                      })
                  else:
                      item["type"] = "other"
                  descriptors.append(item)
                  pos += 16 + following

              need(pos == end, "AVB descriptor parse end")
              return {
                  "algorithm_type": algorithm_type,
                  "descriptors": descriptors,
              }

          def hash_descriptor(info, partition):
              found = [
                  d for d in info["descriptors"]
                  if d.get("type") == "hash"
                  and d.get("partition") == partition
              ]
              need(
                  len(found) == 1,
                  f"one hash descriptor for {partition}",
              )
              return found[0]

          def verify_descriptor(data, descriptor):
              need(
                  descriptor["hash_algorithm"] == "sha256",
                  "AVB hash algorithm",
              )
              calculated = hashlib.sha256(
                  descriptor["salt"] + data[:descriptor["image_size"]]
              ).digest()
              return calculated == descriptor["digest"], calculated

          need(len(stock) == BOOT_BYTES, "stock boot size")
          need(sha(stock) == STOCK_SHA, "stock boot hash")
          need(len(old_boot) == BOOT_BYTES, "old custom boot size")
          need(sha(old_boot) == OLD_BOOT_SHA, "old custom boot hash")
          need(len(new_image) == NEW_IMAGE_BYTES, "new Image bytes")
          need(sha(new_image) == NEW_IMAGE_SHA, "new Image hash")
          need(stock[:8] == b"ANDROID!", "stock Android boot magic")
          need(old_boot[:8] == b"ANDROID!", "old Android boot magic")

          stock_kernel_size, ramdisk_size, _, header_size = \
              struct.unpack_from("<4I", stock, 8)
          header_version = struct.unpack_from("<I", stock, 40)[0]

          need(stock_kernel_size == 45480448, "stock kernel size")
          need(ramdisk_size == 22061278, "stock ramdisk size")
          need(header_size == 1580, "Boot v3 header size")
          need(header_version == 3, "Boot v3 header version")

          stock_ramdisk_offset = 4096 + align(stock_kernel_size)
          ramdisk = stock[
              stock_ramdisk_offset:
              stock_ramdisk_offset + ramdisk_size
          ]
          need(sha(ramdisk) == RAMDISK_SHA, "stock ramdisk hash")

          stock_footer = parse_footer(stock)
          need(
              (stock_footer["major"], stock_footer["minor"]) == (1, 0),
              "stock AVB footer version",
          )
          need(stock_footer["size"] == 896, "embedded vbmeta size")

          stock_embedded = parse_vbmeta(stock_footer["vbmeta"])
          need(
              stock_embedded["algorithm_type"] == 0,
              "embedded vbmeta algorithm NONE",
          )
          stock_boot_desc = hash_descriptor(stock_embedded, "boot")
          stock_ok, _ = verify_descriptor(stock, stock_boot_desc)
          need(stock_ok, "stock embedded boot descriptor")

          old_kernel_size = struct.unpack_from("<I", old_boot, 8)[0]
          old_kernel = old_boot[4096:4096 + old_kernel_size]
          need(
              old_kernel_size == OLD_KERNEL_BYTES,
              "historical custom kernel size",
          )
          need(
              sha(old_kernel) == OLD_KERNEL_SHA,
              "historical custom kernel hash",
          )

          def build_custom(image):
              new_ramdisk_offset = 4096 + align(len(image))
              new_payload_end = (
                  new_ramdisk_offset + align(len(ramdisk))
              )

              output = bytearray(len(stock))
              header = bytearray(stock[:4096])
              struct.pack_into("<I", header, 8, len(image))

              output[:4096] = header
              output[4096:4096 + len(image)] = image
              output[
                  new_ramdisk_offset:
                  new_ramdisk_offset + len(ramdisk)
              ] = ramdisk

              new_vbmeta = bytearray(stock_footer["vbmeta"])
              struct.pack_into(
                  ">Q",
                  new_vbmeta,
                  stock_boot_desc["image_size_offset"],
                  new_payload_end,
              )

              digest = hashlib.sha256(
                  stock_boot_desc["salt"] + bytes(output[:new_payload_end])
              ).digest()

              start = stock_boot_desc["digest_offset"]
              end = start + stock_boot_desc["digest_len"]
              new_vbmeta[start:end] = digest

              output[
                  new_payload_end:
                  new_payload_end + len(new_vbmeta)
              ] = new_vbmeta

              new_footer = bytearray(stock_footer["raw"])
              struct.pack_into(">Q", new_footer, 12, new_payload_end)
              struct.pack_into(">Q", new_footer, 20, new_payload_end)
              output[-64:] = new_footer

              result = bytes(output)
              footer = parse_footer(result)
              embedded = parse_vbmeta(footer["vbmeta"])
              desc = hash_descriptor(embedded, "boot")
              ok, calculated = verify_descriptor(result, desc)
              need(ok, "custom embedded boot descriptor")
              need(
                  calculated == digest,
                  "custom embedded AVB digest",
              )

              return {
                  "bytes": result,
                  "ramdisk_offset": new_ramdisk_offset,
                  "payload_end": new_payload_end,
                  "digest": digest.hex(),
              }

          # Hard calibration gate: the W53 algorithm must first reproduce
          # the historical W19/W21 custom boot byte-for-byte.
          calibrated = build_custom(old_kernel)
          need(
              sha(calibrated["bytes"]) == OLD_BOOT_SHA,
              "historical W19 calibration hash",
          )
          need(
              calibrated["bytes"] == old_boot,
              "historical W19 calibration byte identity",
          )

          new_a = build_custom(new_image)
          new_b = build_custom(new_image)
          need(
              new_a["bytes"] == new_b["bytes"],
              "updated A/B build byte identity",
          )

          out_a.write_bytes(new_a["bytes"])
          out_b.write_bytes(new_b["bytes"])

          new_kernel_size = struct.unpack_from("<I", new_a["bytes"], 8)[0]
          new_kernel = new_a["bytes"][
              4096:4096 + new_kernel_size
          ]
          new_ramdisk = new_a["bytes"][
              new_a["ramdisk_offset"]:
              new_a["ramdisk_offset"] + ramdisk_size
          ]

          need(
              new_kernel_size == len(new_image),
              "updated boot kernel size",
          )
          need(
              sha(new_kernel) == NEW_IMAGE_SHA,
              "updated boot exact W70 kernel",
          )
          need(
              new_ramdisk == ramdisk,
              "updated boot stock ramdisk preserved",
          )
          need(
              new_a["ramdisk_offset"] == 29851648,
              "updated ramdisk offset",
          )
          need(
              new_a["payload_end"] == 51916800,
              "updated payload end",
          )

          arm = arm64_header(new_image)
          need(arm["text_offset"] == 0x80000, "ARM64 text_offset")
          need(arm["image_size"] == 38825984, "ARM64 image_size")
          need(arm["flags"] == 0xA, "ARM64 flags")
          need(arm["magic"] == 0x644D5241, "ARM64 magic")
          need(arm["res5"] == 0x40, "ARM64 res5")

          report = {
              "result": "PASS_W71_CALIBRATED_BOOT_V3_BUILD",
              "historical_calibration": {
                  "old_boot_sha256": OLD_BOOT_SHA,
                  "byte_identical": True,
              },
              "candidate": {
                  "boot_sha256": sha(new_a["bytes"]),
                  "boot_bytes": len(new_a["bytes"]),
                  "kernel_sha256": NEW_IMAGE_SHA,
                  "kernel_bytes": len(new_image),
                  "ramdisk_sha256": sha(new_ramdisk),
                  "ramdisk_bytes": len(new_ramdisk),
                  "ramdisk_offset": new_a["ramdisk_offset"],
                  "payload_end": new_a["payload_end"],
                  "embedded_avb_digest": new_a["digest"],
                  "build_a_b_byte_identical": True,
                  "arm64": arm,
              },
          }

          json_out.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          text_out.write_text(
              "\n".join([
                  "W71_CALIBRATED_BOOT_BUILD=PASS",
                  "HISTORICAL_W19_W21_CALIBRATION=PASS",
                  "HISTORICAL_CALIBRATION_BYTE_IDENTICAL=YES",
                  f"BOOT_IMG_SHA256={sha(new_a['bytes'])}",
                  f"BOOT_IMG_BYTES={len(new_a['bytes'])}",
                  f"KERNEL_SHA256={NEW_IMAGE_SHA}",
                  f"KERNEL_BYTES={len(new_image)}",
                  f"RAMDISK_SHA256={sha(new_ramdisk)}",
                  f"RAMDISK_BYTES={len(new_ramdisk)}",
                  f"RAMDISK_OFFSET={new_a['ramdisk_offset']}",
                  f"PAYLOAD_END={new_a['payload_end']}",
                  f"EMBEDDED_AVB_DIGEST={new_a['digest']}",
                  "EMBEDDED_AVB_VERIFIES=YES",
                  "BUILD_A_B_BYTE_IDENTICAL=YES",
                  "BOOT_HEADER_VERSION=3",
              ]) + "\n",
              encoding="utf-8",
          )
          PY

          cmp -s \
            "$BOOT_BUILD/candidate-A.img" \
            "$BOOT_BUILD/candidate-B.img"

          grep -Fxq \
            'W71_CALIBRATED_BOOT_BUILD=PASS' \
            "$ARTIFACT_DIR/22-boot-build.txt"
          grep -Fxq \
            'HISTORICAL_W19_W21_CALIBRATION=PASS' \
            "$ARTIFACT_DIR/22-boot-build.txt"
          grep -Fxq \
            'EMBEDDED_AVB_VERIFIES=YES' \
            "$ARTIFACT_DIR/22-boot-build.txt"
          grep -Fxq \
            'BUILD_A_B_BYTE_IDENTICAL=YES' \
            "$ARTIFACT_DIR/22-boot-build.txt"

      - name: Independently audit candidate Boot v3 binary
        if: steps.susfs_api.outputs.ready == 'yes'
        shell: bash
        run: |
          set -euo pipefail

          cp \
            "$BOOT_BUILD/candidate-A.img" \
            "$BOOT_OUTPUT/boot.img"

          python3 - \
            "$BOOT_OUTPUT/boot.img" \
            "$ARTIFACT_DIR/23-boot-independent-audit.json" \
            "$ARTIFACT_DIR/23-boot-independent-audit.txt" <<'PY'
          import hashlib
          import json
          import struct
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          json_out = Path(sys.argv[2])
          text_out = Path(sys.argv[3])

          EXPECT_IMAGE_SHA = "1ff4c57bb524b1d01de1d56739133ea4a9c9b3269ad87e013b8140f3654d8aea"
          EXPECT_RAMDISK_SHA = "0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a"

          data = path.read_bytes()

          def sha(blob):
              return hashlib.sha256(blob).hexdigest()

          def need(cond, msg):
              if not cond:
                  raise SystemExit("ERROR: " + msg)

          need(len(data) == 134217728, "boot.img size")
          need(data[:8] == b"ANDROID!", "Android boot magic")

          kernel_size = struct.unpack_from("<I", data, 8)[0]
          ramdisk_size = struct.unpack_from("<I", data, 12)[0]
          header_size = struct.unpack_from("<I", data, 20)[0]
          header_version = struct.unpack_from("<I", data, 40)[0]

          need(kernel_size == 29843968, "kernel size")
          need(ramdisk_size == 22061278, "ramdisk size")
          need(header_size == 1580, "header size")
          need(header_version == 3, "header version")

          kernel_offset = 4096
          ramdisk_offset = 29851648

          kernel = data[kernel_offset:kernel_offset + kernel_size]
          ramdisk = data[
              ramdisk_offset:ramdisk_offset + ramdisk_size
          ]

          need(sha(kernel) == EXPECT_IMAGE_SHA, "embedded kernel hash")
          need(sha(ramdisk) == EXPECT_RAMDISK_SHA, "raw stock ramdisk hash")

          footer = data[-64:]
          need(footer[:4] == b"AVBf", "AVB footer magic")
          major, minor = struct.unpack_from(">II", footer, 4)
          original_size, vbmeta_offset, vbmeta_size = \
              struct.unpack_from(">QQQ", footer, 12)

          need((major, minor) == (1, 0), "AVB footer version")
          need(original_size == 51916800, "AVB original image size")
          need(vbmeta_offset == 51916800, "AVB vbmeta offset")
          need(vbmeta_size == 896, "AVB vbmeta size")

          vbmeta = data[vbmeta_offset:vbmeta_offset + vbmeta_size]
          need(vbmeta[:4] == b"AVB0", "embedded vbmeta magic")
          algorithm_type = struct.unpack_from(">I", vbmeta, 28)[0]
          need(algorithm_type == 0, "embedded vbmeta algorithm NONE")

          auth_size, _ = struct.unpack_from(">QQ", vbmeta, 12)
          values = struct.unpack_from(">QQQQQQQQQQQ", vbmeta, 32)
          descriptors_offset = values[8]
          descriptors_size = values[9]

          pos = 256 + auth_size + descriptors_offset
          end = pos + descriptors_size
          matches = []

          while pos < end:
              tag, following = struct.unpack_from(">QQ", vbmeta, pos)
              raw = vbmeta[pos:pos + 16 + following]
              need(
                  len(raw) == 16 + following,
                  "AVB descriptor truncation",
              )

              if tag == 2:
                  desc_image_size = struct.unpack_from(">Q", raw, 16)[0]
                  algorithm = (
                      raw[24:56].split(b"\0", 1)[0]
                      .decode("ascii", "replace")
                  )
                  name_len, salt_len, digest_len, desc_flags = \
                      struct.unpack_from(">IIII", raw, 56)
                  q = 132
                  partition = raw[q:q + name_len].decode(
                      "ascii", "replace"
                  )
                  q += name_len
                  salt = raw[q:q + salt_len]
                  q += salt_len
                  digest = raw[q:q + digest_len]

                  if partition == "boot":
                      calculated = hashlib.sha256(
                          salt + data[:desc_image_size]
                      ).digest()
                      matches.append({
                          "image_size": desc_image_size,
                          "algorithm": algorithm,
                          "flags": desc_flags,
                          "digest": digest.hex(),
                          "calculated": calculated.hex(),
                          "verifies": digest == calculated,
                      })

              pos += 16 + following

          need(len(matches) == 1, "exactly one boot hash descriptor")
          desc = matches[0]
          need(desc["image_size"] == 51916800, "descriptor image size")
          need(desc["algorithm"] == "sha256", "descriptor algorithm")
          need(desc["verifies"] is True, "embedded boot descriptor verifies")

          result = {
              "result": "PASS_W71_INDEPENDENT_BOOT_V3_AUDIT",
              "boot_sha256": sha(data),
              "boot_bytes": len(data),
              "header_version": header_version,
              "header_size": header_size,
              "kernel_sha256": sha(kernel),
              "kernel_bytes": len(kernel),
              "ramdisk_sha256": sha(ramdisk),
              "ramdisk_bytes": len(ramdisk),
              "ramdisk_offset": ramdisk_offset,
              "avb": {
                  "footer_version": f"{major}.{minor}",
                  "original_image_size": original_size,
                  "vbmeta_offset": vbmeta_offset,
                  "vbmeta_size": vbmeta_size,
                  "algorithm": "NONE",
                  "boot_descriptor": desc,
              },
          }

          json_out.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          text_out.write_text(
              "\n".join([
                  "W71_INDEPENDENT_BOOT_AUDIT=PASS",
                  f"BOOT_IMG_SHA256={sha(data)}",
                  f"BOOT_IMG_BYTES={len(data)}",
                  "BOOT_HEADER_VERSION=3",
                  "BOOT_HEADER_SIZE=1580",
                  f"KERNEL_SHA256={sha(kernel)}",
                  f"RAMDISK_SHA256={sha(ramdisk)}",
                  "EMBEDDED_AVB_VERIFIES=YES",
                  f"EMBEDDED_AVB_DIGEST={desc['digest']}",
              ]) + "\n",
              encoding="utf-8",
          )
          PY

          grep -Fxq \
            'W71_INDEPENDENT_BOOT_AUDIT=PASS' \
            "$ARTIFACT_DIR/23-boot-independent-audit.txt"
          grep -Fxq \
            "KERNEL_SHA256=$W70_IMAGE_SHA256" \
            "$ARTIFACT_DIR/23-boot-independent-audit.txt"
          grep -Fxq \
            "RAMDISK_SHA256=$STOCK_RAMDISK_SHA256" \
            "$ARTIFACT_DIR/23-boot-independent-audit.txt"
          grep -Fxq \
            'EMBEDDED_AVB_VERIFIES=YES' \
            "$ARTIFACT_DIR/23-boot-independent-audit.txt"

      - name: Magiskboot architecture audit and structural validation
        if: steps.susfs_api.outputs.ready == 'yes'
        shell: bash
        run: |
          set -euo pipefail

          MAGISKBOOT="$BOOT_OLD_PACKAGE/tools/magiskboot"
          test -s "$MAGISKBOOT"
          test "$(sha256sum "$MAGISKBOOT" | awk '{print $1}')" = \
            "$MAGISKBOOT_SHA256"

          FILE_DESC="$(file -b "$MAGISKBOOT")"
          RUNNER_ARCH="$(uname -m)"

          {
            echo "MAGISKBOOT_SHA256=$MAGISKBOOT_SHA256"
            echo "MAGISKBOOT_FILE=$FILE_DESC"
            echo "RUNNER_ARCH=$RUNNER_ARCH"
          } | tee "$ARTIFACT_DIR/24-magiskboot-architecture.txt"

          # The historical package carries a device-side ARM64 magiskboot.
          # Never treat an x86_64 Exec format error as a boot.img defect.
          if printf '%s\n' "$FILE_DESC" | grep -Eqi '(^|[,[:space:]])ARM([,[:space:]]|$)|aarch64|ARM64|EABI'; then
            if printf '%s\n' "$FILE_DESC" | grep -Eqi 'aarch64|ARM64'; then
              DETECTED_ARCH="ARM64"
            else
              DETECTED_ARCH="ARM32"
            fi

            echo "MAGISKBOOT_ARCH=$DETECTED_ARCH" \
              | tee -a "$ARTIFACT_DIR/24-magiskboot-architecture.txt"

            if [ "$RUNNER_ARCH" != "aarch64" ] && [ "$RUNNER_ARCH" != "arm64" ]; then
              {
                echo "MAGISKBOOT_NATIVE_EXECUTION=SKIPPED_ARCH_MISMATCH"
                echo "MAGISKBOOT_EXEC_FORMAT_ERROR_EXPECTED_IF_RUN=YES"
                echo "BOOT_BINARY_STRUCTURAL_AUDIT=PASS"
                echo "MAGISKBOOT_ARCH_AUDIT=PASS"
                echo "MAGISKBOOT_ARCH_DETECTOR_VERSION=v6-arm32-arm64-eabi"
              } | tee "$ARTIFACT_DIR/24-magiskboot-validation.txt"
              exit 0
            fi
          fi

          chmod +x "$MAGISKBOOT"
          BEFORE="$(sha256sum "$BOOT_OUTPUT/boot.img" | awk '{print $1}')"

          rm -rf "$BOOT_UNPACK"
          mkdir -p "$BOOT_UNPACK"
          cp "$BOOT_OUTPUT/boot.img" "$BOOT_UNPACK/boot.img"

          (
            cd "$BOOT_UNPACK"
            "$MAGISKBOOT" unpack boot.img \
              > "$ARTIFACT_DIR/24-magiskboot-unpack.log" 2>&1
          )

          test -s "$BOOT_UNPACK/kernel"
          test "$(sha256sum "$BOOT_UNPACK/kernel" | awk '{print $1}')" = \
            "$W70_IMAGE_SHA256"
          test -e "$BOOT_UNPACK/ramdisk.cpio"

          AFTER="$(sha256sum "$BOOT_OUTPUT/boot.img" | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"

          {
            echo "MAGISKBOOT_NATIVE_EXECUTION=PASS"
            echo "UNPACKED_KERNEL_SHA256=$(sha256sum "$BOOT_UNPACK/kernel" | awk '{print $1}')"
            echo "RAMDISK_CPIO_PRESENT=YES"
            echo "SOURCE_BOOT_MUTATED_BY_UNPACK=NO"
            echo "BOOT_BINARY_STRUCTURAL_AUDIT=PASS"
            echo "MAGISKBOOT_ARCH_AUDIT=PASS"
          } | tee "$ARTIFACT_DIR/24-magiskboot-validation.txt"

      - name: Promote W71 nonflashed boot candidate
        if: steps.susfs_api.outputs.ready == 'yes'
        shell: bash
        run: |
          set -euo pipefail

          test -s "$BOOT_OUTPUT/boot.img"
          test "$(stat -c '%s' "$BOOT_OUTPUT/boot.img")" = "$STOCK_BOOT_BYTES"

          BOOT_SHA="$(
            sha256sum "$BOOT_OUTPUT/boot.img" | awk '{print $1}'
          )"
          BOOT_BYTES="$(
            stat -c '%s' "$BOOT_OUTPUT/boot.img"
          )"
          AVB_DIGEST="$(
            sed -n 's/^EMBEDDED_AVB_DIGEST=//p' \
              "$ARTIFACT_DIR/23-boot-independent-audit.txt"
          )"

          test -n "$BOOT_SHA"
          test -n "$AVB_DIGEST"

          printf '%s  boot.img\n' "$BOOT_SHA" \
            > "$BOOT_OUTPUT/boot.img.sha256"

          gzip -n -9 -c "$BOOT_OUTPUT/boot.img" \
            > "$BOOT_OUTPUT/boot.img.gz"

          GZIP_SHA="$(
            sha256sum "$BOOT_OUTPUT/boot.img.gz" | awk '{print $1}'
          )"
          printf '%s  boot.img.gz\n' "$GZIP_SHA" \
            > "$BOOT_OUTPUT/boot.img.gz.sha256"

          cat > "$BOOT_OUTPUT/W71-BOOT-CANDIDATE-MANIFEST.txt" <<EOF
          W71_BOOT_CANDIDATE=PASS
          DEVICE=veux
          KERNEL_VERSION=5.4.274
          ROM_FAMILY=Xiaomi_HyperOS_Stock
          ROM_VERSION=$STOCK_ROM_VERSION
          ANDROID_VERSION=$STOCK_ANDROID_VERSION
          SECURITY_PATCH=$STOCK_SECURITY_PATCH
          RESUKISU_TARGET=$TARGET_REF
          SUSFS_VERSION=2.2.0_plus_process_state_backport
          BOOT_HEADER_VERSION=3
          BOOT_IMG_SHA256=$BOOT_SHA
          BOOT_IMG_BYTES=$BOOT_BYTES
          KERNEL_SHA256=$W70_IMAGE_SHA256
          KERNEL_BYTES=$W70_IMAGE_BYTES
          STOCK_RAMDISK_SHA256=$STOCK_RAMDISK_SHA256
          EMBEDDED_AVB_DIGEST=$AVB_DIGEST
          EMBEDDED_AVB_VERIFIES=YES
          HISTORICAL_W19_W21_CALIBRATION=PASS
          BUILD_A_B_BYTE_IDENTICAL=YES
          MAGISKBOOT_ARCH_AUDIT=PASS
          MAGISKBOOT_NATIVE_EXECUTION=ARCH_DEPENDENT
          DEVICE_ACCESSED=NO
          ADB_USED=NO
          FASTBOOT_USED=NO
          FLASHING_PERFORMED=NO
          PHYSICAL_DEVICE_BOOT_TESTED=NO
          EOF

          sha256sum \
            "$BOOT_OUTPUT/boot.img" \
            "$BOOT_OUTPUT/boot.img.gz" \
            "$BOOT_OUTPUT/W71-BOOT-CANDIDATE-MANIFEST.txt" \
            | sort -k2 \
            > "$BOOT_OUTPUT/SHA256SUMS.txt"

          {
            echo "W71_BOOT_PROMOTION=PASS"
            echo "BOOT_IMG_SHA256=$BOOT_SHA"
            echo "BOOT_IMG_BYTES=$BOOT_BYTES"
            echo "KERNEL_SHA256=$W70_IMAGE_SHA256"
            echo "RAMDISK_SHA256=$STOCK_RAMDISK_SHA256"
            echo "EMBEDDED_AVB_DIGEST=$AVB_DIGEST"
            echo "EMBEDDED_AVB_VERIFIES=YES"
            echo "MAGISKBOOT_ARCH_AUDIT=PASS"
            echo "FLASHING_PERFORMED=NO"
          } | tee "$ARTIFACT_DIR/25-boot-promotion.txt"

      - name: Upload W71 boot.img candidate
        if: steps.susfs_api.outputs.ready == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: W73-v2-VEUX-5.4.274-ReSukiSU-SUSFS-boot-img-candidate
          path: w71-boot/output/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: Write W71 verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          ready="${{ steps.susfs_api.outputs.ready }}"

          if [ "$ready" = "yes" ]              && grep -Fq 'REPRODUCIBILITY=PASS' "$ARTIFACT_DIR/14-reproducibility.txt"              && grep -Fq 'MANUAL_HOOK_CONTRACTS=PASS' "$ARTIFACT_DIR/15-hook-contracts.txt"              && grep -Fq 'SUSFS_STABILITY_CONTRACTS=PASS' "$ARTIFACT_DIR/16-susfs-stability-contracts.txt"              && grep -Fq 'KERNEL_CANDIDATE_STAGE=PASS' "$ARTIFACT_DIR/17-candidate-stage.txt"              && grep -Fq 'STATIC_CANDIDATE_BOUNDARY=PASS' "$ARTIFACT_DIR/18-static-boundary.txt"              && grep -Fq 'W71_KERNEL_CANDIDATE_PATH_GUARD=PASS' "$ARTIFACT_DIR/18a-kernel-candidate-path-guard.txt"              && grep -Fq 'W53_BOOT_CONTRACT_AUTH=PASS' "$ARTIFACT_DIR/19-w53-boot-contract.txt"              && grep -Fq 'BOOT_INPUT_GATE=PASS' "$ARTIFACT_DIR/21-boot-input-gate.txt"              && grep -Fq 'W71_CALIBRATED_BOOT_BUILD=PASS' "$ARTIFACT_DIR/22-boot-build.txt"              && grep -Fq 'W71_INDEPENDENT_BOOT_AUDIT=PASS' "$ARTIFACT_DIR/23-boot-independent-audit.txt"              && grep -Fq 'MAGISKBOOT_ARCH_AUDIT=PASS' "$ARTIFACT_DIR/24-magiskboot-validation.txt"              && grep -Fq 'W71_BOOT_PROMOTION=PASS' "$ARTIFACT_DIR/25-boot-promotion.txt"
          then
            result="BOOT_REPACK_STATIC_VALIDATION_PASS"
            next="CONTROLLED_DEVICE_BOOT_TEST"
          elif [ "$ready" = "no" ]; then
            result="SUSFS_PROCESS_STATE_BACKPORT_FAILED"
            next="INSPECT_W71_PROCESS_STATE_BACKPORT"
          else
            result="REPRO_OR_CONTRACT_VALIDATION_FAILED"
            next="INSPECT_W71_ARTIFACT"
          fi

          {
            echo "W73_V2_RESULT=$result"
            echo "TARGET_KERNEL=VEUX_LINUX_5.4.274"
            echo "REFERENCE=46C7"
            echo "OLD_RESUKISU_PIN=$BASE_REF"
            echo "SELECTED_TARGET=$TARGET_REF"
            echo "W68_V3_IMAGE_SHA256=1ff4c57bb524b1d01de1d56739133ea4a9c9b3269ad87e013b8140f3654d8aea"
            echo "W68_V3_VMLINUX_SHA256=c2bf54a67f21c2ef1ef208ed114b7b44de37c1867011947d8f467d92a48d66d9"
            echo "W68_V3_SYSTEM_MAP_SHA256=d89b1f87b66a21f34b4c99f9d1658a8894cf05ef5c78d65e5e5dde37b9e883a0"
            echo "W68_V3_CONFIG_SHA256=d7cd955abd59da45804acc9c5e450cf8fc953da3e66bbc274212b40ee9a0b372"
            echo "MODULE_LOAD_FILTER_INCLUDED=NO"
            if [ -s "$BOOT_OUTPUT/boot.img" ]; then
              echo "BOOT_IMAGE_CREATED=YES"
            else
              echo "BOOT_IMAGE_CREATED=NO"
            fi
            echo "FLASHABLE_ZIP_CREATED=NO"
            if grep -Fq 'W71_BOOT_PROMOTION=PASS' "$ARTIFACT_DIR/25-boot-promotion.txt" 2>/dev/null; then
              echo "BOOT_IMAGE_STATIC_VALIDATION=PASS"
            else
              echo "BOOT_IMAGE_STATIC_VALIDATION=NOT_COMPLETED"
            fi
            echo "PHYSICAL_DEVICE_BOOT_TESTED=NO"
            echo "DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
            echo "NEXT_STAGE=$next"
          } | tee "$ARTIFACT_DIR/12-verdict.txt"

          sha256sum "$ARTIFACT_DIR"/* \
            2>/dev/null \
            | sort -k2 \
            > "$ARTIFACT_DIR/SHA256SUMS.txt" || true

      - name: Upload W71 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W73-v2-VEUX-5.4.274-ReSukiSU-SUSFS-boot-v3-validation
          path: w71-artifact/
          if-no-files-found: error

      - name: Fail when SUSFS 5.4 API adaptation is required
        if: steps.susfs_api.outputs.ready == 'no'
        shell: bash
        run: |
          echo "W71 stopped intentionally: current proven SUSFS 2.2 5.4 tree lacks one or more APIs required by ReSukiSU 03b60f26."
          exit 2
