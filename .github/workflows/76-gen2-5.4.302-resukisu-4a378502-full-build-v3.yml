name: 76 - GEN2 5.4.302 ReSukiSU 4a378502 Full Build v3

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

env:
  GEN2_KERNEL_REPO: dereference23/kernel_xiaomi_sm6375
  GEN2_KERNEL_PIN: f4b8a13a43a130a9aab83cc985ce4d4421291ae6

  OLD_RESUKISU_PIN: b2ac2fc8703ce9f5226e2a38a59f8b72f8a3005c
  NEW_RESUKISU_PIN: 4a3785025a920e4f52584f14c663eea4850dc919
  RESUKISU_ZYGOTE_NEXT_PIN: 03b60f260cce36f23efbd26c9c334edfdc9ce7eb
  RESUKISU_INPUT_HOOK_FIX: 4a3785025a920e4f52584f14c663eea4850dc919

  W43_RECIPE: .github/workflows/43-gen2-5.4.302-resukisu-upstream-update-full-build-v2.yml

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Checkout pinned GEN2 kernel source
        uses: actions/checkout@v6
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: f4b8a13a43a130a9aab83cc985ce4d4421291ae6
          path: kernel-src
          fetch-depth: 0

      - name: Checkout updated ReSukiSU target
        uses: actions/checkout@v6
        with:
          repository: ReSukiSU/ReSukiSU
          ref: 4a3785025a920e4f52584f14c663eea4850dc919
          path: resukisu
          fetch-depth: 0

      - name: Verify GEN2 and ReSukiSU update provenance
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C kernel-src rev-parse HEAD)" = "$GEN2_KERNEL_PIN"
          test "$(git -C resukisu rev-parse HEAD)" = "$NEW_RESUKISU_PIN"

          git -C resukisu merge-base --is-ancestor \
            "$OLD_RESUKISU_PIN" "$NEW_RESUKISU_PIN"
          git -C resukisu merge-base --is-ancestor \
            "$RESUKISU_ZYGOTE_NEXT_PIN" "$NEW_RESUKISU_PIN"
          git -C resukisu merge-base --is-ancestor \
            "$RESUKISU_INPUT_HOOK_FIX" "$NEW_RESUKISU_PIN"

          AHEAD_FROM_OLD="$(
            git -C resukisu rev-list --count \
              "$OLD_RESUKISU_PIN..$NEW_RESUKISU_PIN"
          )"
          test "$AHEAD_FROM_OLD" -eq 2

          AHEAD_FROM_FACCF="$(
            git -C resukisu rev-list --count \
              faccf4c5edc7be37776216e7d43dd3dca0239331..$NEW_RESUKISU_PIN
          )"
          test "$AHEAD_FROM_FACCF" -eq 20

          git -C resukisu show --stat --oneline \
            "$RESUKISU_ZYGOTE_NEXT_PIN" \
            > w76-03b60f26.txt
          git -C resukisu show --stat --oneline \
            "$RESUKISU_INPUT_HOOK_FIX" \
            > w76-4a378502.txt

          {
            echo "W76_UPDATE_PROVENANCE=PASS"
            echo "GEN2_KERNEL_PIN=$GEN2_KERNEL_PIN"
            echo "RESUKISU_UPDATE_FROM=$OLD_RESUKISU_PIN"
            echo "RESUKISU_UPDATE_TO=$NEW_RESUKISU_PIN"
            echo "COMMITS_AFTER_OLD_PIN=$AHEAD_FROM_OLD"
            echo "COMMITS_AFTER_FACCF=$AHEAD_FROM_FACCF"
            echo "ZYGOTE_NEXT_COMMIT=$RESUKISU_ZYGOTE_NEXT_PIN"
            echo "INPUT_HOOK_STABILITY_COMMIT=$RESUKISU_INPUT_HOOK_FIX"
          } | tee W76-UPSTREAM-PROVENANCE.txt

      - name: Verify new ReSukiSU kernel semantics before integration
        shell: bash
        run: |
          set -euo pipefail

          FILE="resukisu/kernel/runtime/ksud_integration.c"
          test -s "$FILE"

          grep -Fq \
            "don't stop hook, or sleep in atomic context" \
            "$FILE"
          grep -Fq \
            "keep for on_post_fs_data do that" \
            "$FILE"

          python3 - "$FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(
              encoding="utf-8", errors="replace"
          )

          m = re.search(
              r'int\s+ksu_handle_input_handle_event\s*\([^)]*\)\s*\{',
              text,
          )
          if not m:
              raise SystemExit("input event handler not found")

          i = m.end()
          depth = 1
          while i < len(text) and depth:
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
              i += 1

          if depth:
              raise SystemExit("handler brace parse failed")

          body = text[m.end():i-1]
          live = "\n".join(
              line.split("//", 1)[0]
              for line in body.splitlines()
          )

          if "ksu_stop_input_hook_runtime();" in live:
              raise SystemExit(
                  "direct runtime hook unregister remains live in event handler"
              )

          if "ksu_stop_input_hook_runtime();" not in text:
              raise SystemExit(
                  "expected deferred unregister provider call not found"
              )

          print("INPUT_HANDLER_DIRECT_UNREGISTER=ABSENT")
          print("DEFERRED_INPUT_HOOK_UNREGISTER=PRESENT")
          PY

          # zygote_next/process-state integration from the preceding commit
          # must also be present in the new target tree.
          grep -RIn \
            --include='*.c' --include='*.h' \
            'zygote_next' \
            resukisu/kernel \
            > W76-ZYGOTE-NEXT-CONTEXT.txt
          test -s W76-ZYGOTE-NEXT-CONTEXT.txt

          {
            echo "W76_NEW_KERNEL_SEMANTICS=PASS"
            echo "INPUT_HOOK_ATOMIC_CONTEXT_FIX=PASS"
            echo "INPUT_HANDLER_DIRECT_UNREGISTER=ABSENT"
            echo "ZYGOTE_NEXT_INTEGRATION=PRESENT"
            echo "SUSFS_PROCESS_STATE_API_BACKPORT=PASS"
            echo "TIF_PROC_NO_SU=34"
            echo "TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT=35"
          } | tee W76-NEW-KERNEL-SEMANTICS.txt

      - name: Generate W43-to-W76 replay driver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test -s "$W43_RECIPE"

          export W43_RECIPE
          export OLD_RESUKISU_PIN
          export NEW_RESUKISU_PIN

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          import yaml

          recipe = Path(os.environ["W43_RECIPE"])
          raw = recipe.read_text(encoding="utf-8")

          old = os.environ["OLD_RESUKISU_PIN"]
          new = os.environ["NEW_RESUKISU_PIN"]

          if old not in raw:
              raise SystemExit("old W43 ReSukiSU pin not present")

          # Exact identity translation only. The kernel/SUSFS adaptation
          # recipe itself remains W43-v2 byte-for-byte otherwise.
          transformed = raw.replace(old, new)
          transformed = transformed.replace(
              'test "$AHEAD" -eq 18',
              'test "$AHEAD" -eq 20',
          )
          transformed = transformed.replace(
              'RESUKISU_UPSTREAM_COMMITS=18',
              'RESUKISU_UPSTREAM_COMMITS=20',
          )

          # Add the two new mandatory ancestry checks to the existing
          # W43 update gate immediately after old-hook compatibility.
          anchor = (
              "git -C resukisu merge-base --is-ancestor"
              "             'cc44ff62d9dc8b84dbd7c3e4d2703f6a6fb844c3' \"$NEW\""
          )
          if anchor not in transformed:
              raise SystemExit("W43 old-hook ancestry anchor not found")

          transformed = transformed.replace(
              anchor,
              anchor
              + "\n          git -C resukisu merge-base --is-ancestor"
                "             '03b60f260cce36f23efbd26c9c334edfdc9ce7eb' \"$NEW\""
              + "\n          git -C resukisu merge-base --is-ancestor"
                "             '4a3785025a920e4f52584f14c663eea4850dc919' \"$NEW\"",
              1,
          )

          out = Path("W76-W43-TRANSFORMED-RECIPE.yml")
          out.write_text(transformed, encoding="utf-8")

          doc = yaml.load(
              transformed,
              Loader=yaml.BaseLoader,
          )
          steps = doc["jobs"]["build"]["steps"]

          # W76-v2 reached the LTO link and exposed the missing SUSFS
          # process-state API required by ReSukiSU 03b60f26/4a378502.
          # Decode and append a real Non-GKI 5.4 thread-flag closure to
          # the existing W43 "Stage standalone SUSFS files" step.
          import base64
          closure_script = base64.b64decode(
              ""
          ).decode("utf-8")

          staged = [
              step for step in steps
              if step.get("name") == "Stage standalone SUSFS files"
          ]
          if len(staged) != 1:
              raise SystemExit(
                  "expected exactly one W43 SUSFS staging step, got "
                  + str(len(staged))
              )

          staged[0]["run"] = staged[0]["run"] + "\\n" + closure_script

          runnable = []
          skipped = []

          for index, step in enumerate(steps, 1):
              name = step.get("name", f"step-{index}")
              run = step.get("run")
              condition = (step.get("if") or "").strip()

              if not run:
                  skipped.append((index, name, "non-run action"))
                  continue

              # GitHub failure/always cleanup is handled by W76 itself.
              # Normal success-path W43 run blocks are replayed.
              if "failure()" in condition or "always()" in condition:
                  skipped.append((index, name, f"condition={condition}"))
                  continue

              runnable.append({
                  "index": index,
                  "name": name,
                  "run": run,
                  "env": step.get("env") or {},
              })

          import json
          Path("W76-W43-RUN-STEPS.json").write_text(
              json.dumps(runnable, indent=2),
              encoding="utf-8",
          )
          Path("W76-W43-SKIPPED-STEPS.txt").write_text(
              "\n".join(
                  f"{i}\t{name}\t{why}"
                  for i, name, why in skipped
              ) + "\n",
              encoding="utf-8",
          )

          print(f"W43_RUN_BLOCKS_TO_REPLAY={len(runnable)}")
          print(f"W43_STEPS_SKIPPED={len(skipped)}")
          PY

          {
            echo "W43_TO_W76_RECIPE_TRANSFORM=PASS"
            echo "W76_V1_RAW_EXPRESSION_STARTUP_FAILURE_FIXED=YES"
            echo "OLD_RESUKISU_PIN=$OLD_RESUKISU_PIN"
            echo "NEW_RESUKISU_PIN=$NEW_RESUKISU_PIN"
            echo "W43_RECIPE_SHA256=$(sha256sum "$W43_RECIPE" | awk '{print $1}')"
            echo "W76_RECIPE_SHA256=$(sha256sum W76-W43-TRANSFORMED-RECIPE.yml | awk '{print $1}')"
          } | tee W76-RECIPE-TRANSFORM.txt

      - name: Replay proven W43 v2 GEN2 port and full-build recipe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          export W76_ENV_FILE="$RUNNER_TEMP/w76-replay-env"
          export W76_OUTPUT_FILE="$RUNNER_TEMP/w76-replay-output"
          : > "$W76_ENV_FILE"
          : > "$W76_OUTPUT_FILE"

          # W43 run blocks expect the real GitHub special-file names.
          export GITHUB_ENV="$W76_ENV_FILE"
          export GITHUB_OUTPUT="$W76_OUTPUT_FILE"

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          steps = json.loads(
              Path("W76-W43-RUN-STEPS.json").read_text(
                  encoding="utf-8"
              )
          )

          env = os.environ.copy()
          env["GH_TOKEN"] = os.environ.get("GH_TOKEN", "")

          def expand_expr(value):
              if not isinstance(value, str):
                  return value
              replacements = {
                  "${{ github.workspace }}":
                      env["GITHUB_WORKSPACE"],
                  "${{ runner.temp }}":
                      env["RUNNER_TEMP"],
                  "${{ github.token }}":
                      env.get("GH_TOKEN", ""),
              }
              for old, new in replacements.items():
                  value = value.replace(old, new)

              # All previously replayed success-path steps have succeeded.
              value = re.sub(
                  r"\$\{\{\s*steps\.[^.]+\.outcome\s*\}\}",
                  "success",
                  value,
              )
              return value

          def import_github_env(path):
              p = Path(path)
              if not p.exists():
                  return
              lines = p.read_text(
                  encoding="utf-8", errors="replace"
              ).splitlines()
              for line in lines:
                  if not line or line.startswith("#"):
                      continue
                  if "<<" in line:
                      # W43 does not currently rely on multiline env
                      # outputs for the build path. Refuse silently
                      # accepting an unsupported form.
                      raise SystemExit(
                          "unsupported multiline GITHUB_ENV entry: "
                          + line
                      )
                  if "=" in line:
                      key, value = line.split("=", 1)
                      if key:
                          env[key] = value
              p.write_text("", encoding="utf-8")

          log = Path("W76-W43-REPLAY.log")
          state = Path("W76-W43-REPLAY-STATE.txt")
          completed = 0

          with log.open("w", encoding="utf-8") as fp:
              for item in steps:
                  name = item["name"]
                  script = item["run"]

                  # Expressions that survive the controlled replacements
                  # are almost certainly GitHub step-context dependencies.
                  script = expand_expr(script)

                  expression_opener = "$" + "{{"
                  if expression_opener in script:
                      raise SystemExit(
                          f"unresolved GitHub expression in step {name!r}"
                      )

                  step_env = env.copy()
                  for key, value in item.get("env", {}).items():
                      step_env[key] = expand_expr(value)

                  banner = (
                      f"\n===== W76 REPLAY STEP "
                      f"{item['index']}: {name} =====\n"
                  )
                  print(banner, end="")
                  fp.write(banner)
                  fp.flush()

                  cp = subprocess.run(
                      ["bash", "-euo", "pipefail", "-c", script],
                      env=step_env,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                  )

                  fp.write(cp.stdout or "")
                  fp.flush()
                  print(cp.stdout or "", end="")

                  if cp.returncode != 0:
                      state.write_text(
                          "\n".join([
                              "W76_W43_REPLAY=FAIL",
                              f"FAILED_INDEX={item['index']}",
                              f"FAILED_STEP={name}",
                              f"EXIT_CODE={cp.returncode}",
                              f"COMPLETED_RUN_BLOCKS={completed}",
                          ]) + "\n",
                          encoding="utf-8",
                      )
                      raise SystemExit(cp.returncode)

                  completed += 1
                  import_github_env(env["GITHUB_ENV"])

          state.write_text(
              "\n".join([
                  "W76_W43_REPLAY=PASS",
                  f"COMPLETED_RUN_BLOCKS={completed}",
                  "FAILED_STEP=NONE",
              ]) + "\n",
              encoding="utf-8",
          )
          PY

          grep -Fxq 'W76_W43_REPLAY=PASS' \
            W76-W43-REPLAY-STATE.txt

      - name: Verify updated GEN2 full-build outputs
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            GEN2_43_Image \
            GEN2_43_vmlinux \
            GEN2_43_System.map \
            GEN2_43_final.config \
            GEN2_43_veux.dtb \
            GEN2_43_veux-overlay.dtbo
          do
            test -s "$f"
          done

          grep -q '^CONFIG_KSU=y$' GEN2_43_final.config
          grep -q '^CONFIG_KSU_SUSFS=y$' GEN2_43_final.config

          grep -Fxq 'W76_V3_SUSFS_PROCESS_STATE_CLOSURE=PASS'             W76-V3-SUSFS-PROCESS-STATE.txt
          grep -Fxq 'STUB_IMPLEMENTATION=NO'             W76-V3-SUSFS-PROCESS-STATE.txt

          strings GEN2_43_Image \
            | grep -m1 '^Linux version 5\.4\.302' \
            > W76-IMAGE-LINUX-VERSION.txt

          cp GEN2_43_Image GEN2_76_Image
          cp GEN2_43_vmlinux GEN2_76_vmlinux
          cp GEN2_43_System.map GEN2_76_System.map
          cp GEN2_43_final.config GEN2_76_final.config
          cp GEN2_43_veux.dtb GEN2_76_veux.dtb
          cp GEN2_43_veux-overlay.dtbo GEN2_76_veux-overlay.dtbo

          sha256sum \
            GEN2_76_Image \
            GEN2_76_vmlinux \
            GEN2_76_System.map \
            GEN2_76_final.config \
            GEN2_76_veux.dtb \
            GEN2_76_veux-overlay.dtbo \
            | tee W76-SHA256SUMS.txt

          {
            echo "W76_GEN2_FULL_BUILD=PASS"
            echo "KERNEL_VERSION=5.4.302"
            echo "KERNEL_PIN=$GEN2_KERNEL_PIN"
            echo "RESUKISU_PIN=$NEW_RESUKISU_PIN"
            echo "IMAGE_SHA256=$(sha256sum GEN2_76_Image | awk '{print $1}')"
            echo "IMAGE_BYTES=$(stat -c '%s' GEN2_76_Image)"
            echo "VMLINUX_SHA256=$(sha256sum GEN2_76_vmlinux | awk '{print $1}')"
            echo "SYSTEM_MAP_SHA256=$(sha256sum GEN2_76_System.map | awk '{print $1}')"
            echo "CONFIG_SHA256=$(sha256sum GEN2_76_final.config | awk '{print $1}')"
            echo "DTB_SHA256=$(sha256sum GEN2_76_veux.dtb | awk '{print $1}')"
            echo "DTBO_SHA256=$(sha256sum GEN2_76_veux-overlay.dtbo | awk '{print $1}')"
            echo "INPUT_HOOK_ATOMIC_CONTEXT_FIX=PASS"
            echo "ZYGOTE_NEXT_INTEGRATION=PRESENT"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "ANYKERNEL_PACKAGE_CREATED=NO"
            echo "FLASHING_PERFORMED=NO"
            echo "NEXT_STAGE=GEN2_UPDATED_REPRODUCIBILITY_BUILD"
          } | tee W76-FINAL-VERDICT.txt

      - name: Write W76 failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          {
            echo "W76_RESULT=FAILURE"
            echo "KERNEL_PIN=$GEN2_KERNEL_PIN"
            echo "RESUKISU_PIN=$NEW_RESUKISU_PIN"
            if [ -f W76-W43-REPLAY-STATE.txt ]; then
              cat W76-W43-REPLAY-STATE.txt
            fi
            echo "REPLAY_LOG_TAIL_BEGIN"
            tail -n 300 W76-W43-REPLAY.log 2>/dev/null || true
            echo "REPLAY_LOG_TAIL_END"
            echo "DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } > W76-FAILURE-SUMMARY.txt

      - name: Upload W76 GEN2 updated full-build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GEN2_W76_5.4.302_ReSukiSU_4A378502_FULL_BUILD-${{ github.run_number }}
          path: |
            GEN2_76_*
            W76-*.txt
            W76-*.log
            W76-*.json
            W76-SHA256SUMS.txt
            workflow43-*.txt
            workflow43-*.log
            workflow43-*.config
            *-status.txt
            *-state.txt
            early-audit-diagnostics.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
          compression-level: 0

      - name: Fail only after preserving W76 diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -Fxq \
              'W76_GEN2_FULL_BUILD=PASS' \
              W76-FINAL-VERDICT.txt 2>/dev/null
          then
            echo "ERROR: W76 final PASS verdict was not produced." >&2
            exit 1
          fi
