name: VEUX GEN1 U5-O41 v3 PM Runtime Dependency Closure Dual Build Audit

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: veux-gen1-u5-o41-v3-pm-runtime-dependency-closure-dual-build-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARCH: arm64
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

      # Exact U5-O40 Runtime-PASS parent.
      O40_ARTIFACT_ID: '10493354572'
      O40_ARTIFACT_NAME: VEUX-GEN1-U5-O40-5.4.302-final-six-block-conflict-resolution-train-official-stable-port-audit
      O40_ARTIFACT_SHA256: 48a514fa835a068736898d6a273e2af0af6aa79933b202c0075d789532f4f2c0
      O40_INTERNAL_SHA_COUNT: '426'
      PATCH300_SHA256: 960cf65c673423f2fe7c08d26612d477f898595f7d259e1f2700ebc5e24e57e8
      PATCH302_SHA256: e89094cb64aa714e4093b3892ef7420fea0536e35e3cde28f7dff172c0828f0f

      # Frozen outer-kernel reconstruction pins.
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      EXPECTED_VENDOR_KERNEL_VERSION: 5.4.268
      EXPECTED_OUTER_TREE: 19b68131d7a3955085f60c4fb8cf64442427af0c
      RESTORE_ARTIFACT_ID: '9989363798'
      RESTORE_ARTIFACT_NAME: clean-gen1-p6v11-v6-full-susfs-outer-integration-p7-test-boot-34031837372
      RESTORE_ARTIFACT_SHA256: 87c15eac72ff64b6c65c9e993594f3cbe2404b327592afae94796ad655e1f45d
      EXPECTED_P5I_COMMIT: f353a9475e40ca866d570c1d0ef55e24cf6556e4
      EXPECTED_P5I_TREE: a947c1f2891c796a08373fc755e29b23139dc761
      EXPECTED_RESUKISU_BASE_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_RESUKISU_BASE_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      EXPECTED_IMPORT_PATCH_SHA256: 902e427888714266d9771908cd593191a478cd32ae7a895c77b76c976939c76f
      EXPECTED_P13_PATCH_SHA256: d56725a9d6a6dc7bf1e73a5763b894bdabb544119f4c75df5f437ccd4ff29a52
      EXPECTED_P12_EXEC_SHA256: fa3b73421f35d6220fb9e03e112a9509b76c04933af2353c9a8c65d6fb6bd6a9
      EXPECTED_P12_CONTRACT_SHA256: b6d1875f6a79231465bc78df6484f2856a427259998eb93ba9fd2597cb45ca53
      EXPECTED_P12_SUSFS_C_SHA256: e430d573ba5875a55d1ca70ba1b304e4b6727bbc42b8c3ac16f2c175b29a59c1
      EXPECTED_P12_SUSFS_H_SHA256: 3c5fb1bcc28a70c82ee5cfe0a7375bb8e7babd26618ce9b451e598fa31aa3b6e
      EXPECTED_P12_SUSFS_DEF_SHA256: b16108a5fcd4cdd7203d9f084c2154da708ab3ae6bed17109e4ec63f04ff0f68
      EXPECTED_P13_TREE: 27f712099ca93c93f7b6db8884cc1f3b6e61ae0f
      EXPECTED_P13_KERNEL_VERSION: 5.4.274

      # Exact ReSukiSU state used by the proven P13 build.
      RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
      RESUKISU_COMMON_BASE: faccf4c5edc7be37776216e7d43dd3dca0239331
      RESUKISU_DEVICE_PASS_BASE: 052ca27775cc9c8570e3b1ba3db7c29486d6020e
      RESUKISU_TARGET: 7741f87849f7ad7cebf82bbb4c5b89880e61e37e
      RESUKISU_EXCLUDED_MODULE_FILTER: b2ac2fc8703ce9f5226e2a38a59f8b72f8a3005c
      EXPECTED_KSU_VERSION: '35141'
      EXPECTED_KSU_UAPI: '4'
      RESUKISU_IMAGE_IDENTITY: v4.2.0-rc1-7741f878-p13@ReSukiSU

      # Proven P13 toolchain/build identity.
      CLANG_PREBUILT_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
      KBUILD_BUILD_USER: builder
      KBUILD_BUILD_HOST: pangu-build-component-vendor-345942-54r9t-tw0tk-tq90c
      KBUILD_BUILD_TIMESTAMP: Thu Dec 5 14:47:59 UTC 2024
      KBUILD_BUILD_VERSION: '1'
      SOURCE_DATE_EPOCH: '1733410079'
      KBUILD_FIXED_SCM_SUFFIX: -g82179e362f33
      EFFECTIVE_KCFLAGS: -D__ANDROID_COMMON_KERNEL__
      EXPECTED_RELEASE_300: 5.4.300-qgki-g82179e362f33
      EXPECTED_RELEASE_302: 5.4.302-qgki-g82179e362f33
      PM_RUNTIME_DEP_COMMIT: c745253e2a691a40c66790defe85c104a887e14a

    steps:
      - name: Initialize O41 v3 dependency-closure build audit workspace
        shell: bash
        run: |
          set -euo pipefail
          O40_DIR="$RUNNER_TEMP/u5-o41-o40"
          RESTORE_ROOT="$RUNNER_TEMP/u5-o41-restore"
          P13_DIR="$GITHUB_WORKSPACE/kernel-p13"
          T300_DIR="$GITHUB_WORKSPACE/kernel-5.4.300"
          T302_DIR="$GITHUB_WORKSPACE/kernel-5.4.302"
          RESUKISU_UPSTREAM="$GITHUB_WORKSPACE/resukisu-upstream"
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/toolchains/clang-r416183b"
          OUT300="$GITHUB_WORKSPACE/out-5.4.300"
          OUT302="$GITHUB_WORKSPACE/out-5.4.302"
          AUDIT_DIR="$GITHUB_WORKSPACE/u5-o41-build-audit"
          DIST_DIR="$GITHUB_WORKSPACE/u5-o41-build-dist"
          rm -rf "$O40_DIR" "$RESTORE_ROOT" "$P13_DIR" "$T300_DIR" "$T302_DIR" \
                 "$RESUKISU_UPSTREAM" "$GITHUB_WORKSPACE/toolchains" \
                 "$OUT300" "$OUT302" "$AUDIT_DIR" "$DIST_DIR"
          mkdir -p "$O40_DIR" "$RESTORE_ROOT" "$AUDIT_DIR" "$DIST_DIR" "$TOOLCHAIN_DIR"
          {
            echo "O40_DIR=$O40_DIR"
            echo "RESTORE_ROOT=$RESTORE_ROOT"
            echo "P13_DIR=$P13_DIR"
            echo "T300_DIR=$T300_DIR"
            echo "T302_DIR=$T302_DIR"
            echo "RESUKISU_UPSTREAM=$RESUKISU_UPSTREAM"
            echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR"
            echo "OUT300=$OUT300"
            echo "OUT302=$OUT302"
            echo "AUDIT_DIR=$AUDIT_DIR"
            echo "DIST_DIR=$DIST_DIR"
          } >> "$GITHUB_ENV"
          cat > "$AUDIT_DIR/00-plan.txt" <<'EOF'
          U5-O41 v3 PM RUNTIME DEPENDENCY CLOSURE + DUAL STABLE FULL BUILD AUDIT
          Runtime source parent: exact U5-O40 Runtime-PASS artifact.
          Targets: Linux 5.4.300 and Linux 5.4.302 for VEUX/SM6375.
          P13 reconstruction follows the proven P13 build order exactly:
          outer restore -> authenticated ReSukiSU target -> module-filter exclusion ->
          KernelSU subtree reconstruction -> CLEAN-GEN1 5.4 contract -> exact P13 delta.
          Each target receives the exact reconstructed KernelSU subtree before build.
          Both targets are attempted even if one build fails.
          No AnyKernel3. No flash. No Device PASS claim.
          EOF

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git jq \
            libelf-dev libncurses-dev libssl-dev patch python3 rsync unzip zip xz-utils zstd file

      - name: Download and verify exact O40 Runtime-PASS parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/o40-meta.json"
          zip="$RUNNER_TEMP/o40.zip"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${O40_ARTIFACT_ID}" -o "$meta"
          python3 - "$meta" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              m = json.load(f)
          assert str(m.get('id')) == os.environ['O40_ARTIFACT_ID']
          assert m.get('name') == os.environ['O40_ARTIFACT_NAME']
          assert m.get('expired') is False
          assert m.get('digest') in (None, '', 'sha256:' + os.environ['O40_ARTIFACT_SHA256'])
          print('O40_METADATA=PASS')
          PY
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${O40_ARTIFACT_ID}/zip" -o "$zip"
          echo "$O40_ARTIFACT_SHA256  $zip" | sha256sum -c -
          python3 - "$zip" "$O40_DIR" <<'PY'
          from pathlib import Path
          import sys, zipfile
          z, d = sys.argv[1:]
          root = Path(d).resolve()
          with zipfile.ZipFile(z) as zf:
              for info in zf.infolist():
                  out = (root / info.filename).resolve()
                  if out != root and root not in out.parents:
                      raise SystemExit('unsafe archive member: ' + info.filename)
              zf.extractall(root)
          PY
          test -f "$O40_DIR/SHA256SUMS.txt"
          (cd "$O40_DIR" && sha256sum -c SHA256SUMS.txt) | tee "$AUDIT_DIR/01-o40-sha256.txt"
          test "$(grep -c 'OK$' "$AUDIT_DIR/01-o40-sha256.txt")" -eq "$O40_INTERNAL_SHA_COUNT"
          test "$(wc -l < "$O40_DIR/SHA256SUMS.txt")" -eq "$O40_INTERNAL_SHA_COUNT"
          grep -Fxq 'O40_FINAL=RUNTIME_GREEN_PASS' "$O40_DIR/99-O40-FINAL-GATE.txt"
          grep -Fxq 'CURRENT_RUNTIME_PARENT=U5-O40' "$O40_DIR/99-O40-FINAL-GATE.txt"
          grep -Fxq 'RUNTIME_CONFLICTS_5.4.300=0' "$O40_DIR/99-O40-FINAL-GATE.txt"
          grep -Fxq 'TEXT_CONFLICT_HUNKS_5.4.300=0' "$O40_DIR/99-O40-FINAL-GATE.txt"
          grep -Fxq 'RUNTIME_CONFLICTS_5.4.302=0' "$O40_DIR/99-O40-FINAL-GATE.txt"
          grep -Fxq 'TEXT_CONFLICT_HUNKS_5.4.302=0' "$O40_DIR/99-O40-FINAL-GATE.txt"
          grep -Fxq 'READY_FOR_FULL_BUILD_AUDIT=YES' "$O40_DIR/99-O40-FINAL-GATE.txt"
          p300="$O40_DIR/target-5.4.300/P13-to-5.4.300-AUTO-MERGED-PARTIAL.patch"
          p302="$O40_DIR/target-5.4.302/P13-to-5.4.302-AUTO-MERGED-PARTIAL.patch"
          echo "$PATCH300_SHA256  $p300" | sha256sum -c -
          echo "$PATCH302_SHA256  $p302" | sha256sum -c -
          {
            echo "O40_EXACT_PARENT=PASS"
            echo "O40_INTERNAL_SHA256=$O40_INTERNAL_SHA_COUNT/$O40_INTERNAL_SHA_COUNT PASS"
            echo "PATCH300_SHA256=$PATCH300_SHA256"
            echo "PATCH302_SHA256=$PATCH302_SHA256"
          } | tee "$AUDIT_DIR/01-o40-parent-gate.txt"

      - name: Reconstruct exact P13 outer source and restore kit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone -q https://github.com/dereference23/kernel_xiaomi_sm6375.git "$P13_DIR"
          git -C "$P13_DIR" checkout -q --detach "$EXPECTED_VENDOR_SHA"
          test "$(git -C "$P13_DIR" rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
          test "$(make -s -C "$P13_DIR" kernelversion)" = "$EXPECTED_VENDOR_KERNEL_VERSION"

          meta="$RUNNER_TEMP/restore-meta.json"
          zip="$RUNNER_TEMP/restore.zip"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RESTORE_ARTIFACT_ID}" -o "$meta"
          python3 - "$meta" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              m = json.load(f)
          assert str(m.get('id')) == os.environ['RESTORE_ARTIFACT_ID']
          assert m.get('name') == os.environ['RESTORE_ARTIFACT_NAME']
          assert m.get('expired') is False
          assert m.get('digest') in (None, '', 'sha256:' + os.environ['RESTORE_ARTIFACT_SHA256'])
          print('RESTORE_METADATA=PASS')
          PY
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RESTORE_ARTIFACT_ID}/zip" -o "$zip"
          echo "$RESTORE_ARTIFACT_SHA256  $zip" | sha256sum -c -
          python3 - "$zip" "$RESTORE_ROOT" <<'PY'
          from pathlib import Path
          import sys, zipfile
          z, d = sys.argv[1:]
          root = Path(d).resolve()
          with zipfile.ZipFile(z) as zf:
              for info in zf.infolist():
                  out = (root / info.filename).resolve()
                  if out != root and root not in out.parents:
                      raise SystemExit('unsafe restore member: ' + info.filename)
              zf.extractall(root)
          PY
          restore_dir="$(find "$RESTORE_ROOT" -type d -name source-restore-kit -print -quit)"
          test -n "$restore_dir"
          test -f "$restore_dir/manifest.json"
          test -f "$restore_dir/SHA256SUMS"
          (cd "$restore_dir" && sha256sum -c SHA256SUMS) | tee "$AUDIT_DIR/02-restore-sha256.txt"
          jq -e \
            --arg p5commit "$EXPECTED_P5I_COMMIT" \
            --arg p5tree "$EXPECTED_P5I_TREE" \
            --arg rhead "$EXPECTED_RESUKISU_BASE_HEAD" \
            --arg rtree "$EXPECTED_RESUKISU_BASE_TREE" \
            --arg outer "$EXPECTED_OUTER_TREE" \
            '.stage == "CLEAN_GEN1_P6V11_SOURCE" and .p5i_commit == $p5commit and .p5i_tree == $p5tree and .resukisu_head == $rhead and .resukisu_tree == $rtree and .p6_source_tree == $outer' \
            "$restore_dir/manifest.json" >/dev/null

          git -C "$P13_DIR" reset --hard "$EXPECTED_VENDOR_SHA"
          git -C "$P13_DIR" clean -fdx
          for p in \
            "$restore_dir/p5i/vendor-20240619-to-p5i-outer.patch" \
            "$restore_dir/p5i-to-p6-source-compat.patch" \
            "$restore_dir/p6v10-to-p6v11-full-susfs-outer.patch"; do
            test -s "$p"
            git -C "$P13_DIR" apply --check --whitespace=error --binary "$p"
            git -C "$P13_DIR" apply --index --whitespace=error --binary "$p"
          done
          test "$(git -C "$P13_DIR" write-tree)" = "$EXPECTED_OUTER_TREE"
          test "$(make -s -C "$P13_DIR" kernelversion)" = 5.4.274
          grep -Fxq 'CONFIG_KSU=y' "$P13_DIR/arch/arm64/configs/veux_defconfig"
          grep -Fxq 'CONFIG_KSU_SUSFS=y' "$P13_DIR/arch/arm64/configs/veux_defconfig"
          grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' "$P13_DIR/arch/arm64/configs/veux_defconfig"
          grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' "$P13_DIR/arch/arm64/configs/veux_defconfig"
          grep -Fxq 'CONFIG_LOCALVERSION="-qgki"' "$P13_DIR/arch/arm64/configs/veux_defconfig"
          test "$(sha256sum "$P13_DIR/fs/exec.c" | awk '{print $1}')" = "$EXPECTED_P12_EXEC_SHA256"
          test "$(sha256sum "$P13_DIR/include/linux/ksu_hook_contract.h" | awk '{print $1}')" = "$EXPECTED_P12_CONTRACT_SHA256"
          test "$(sha256sum "$P13_DIR/fs/susfs.c" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_C_SHA256"
          test "$(sha256sum "$P13_DIR/include/linux/susfs.h" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_H_SHA256"
          test "$(sha256sum "$P13_DIR/include/linux/susfs_def.h" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_DEF_SHA256"
          echo "RESTORE_DIR=$restore_dir" >> "$GITHUB_ENV"
          echo 'P13_OUTER_RESTORE=PASS' | tee "$AUDIT_DIR/02-p13-outer-gate.txt"

      - name: Authenticate and construct exact P13 ReSukiSU subtree
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "$RESUKISU_REPO" "$RESUKISU_UPSTREAM"
          git -C "$RESUKISU_UPSTREAM" cat-file -e "${RESUKISU_COMMON_BASE}^{commit}"
          git -C "$RESUKISU_UPSTREAM" cat-file -e "${RESUKISU_DEVICE_PASS_BASE}^{commit}"
          git -C "$RESUKISU_UPSTREAM" cat-file -e "${RESUKISU_TARGET}^{commit}"
          git -C "$RESUKISU_UPSTREAM" cat-file -e "${RESUKISU_EXCLUDED_MODULE_FILTER}^{commit}"
          git -C "$RESUKISU_UPSTREAM" merge-base --is-ancestor "$RESUKISU_COMMON_BASE" "$RESUKISU_TARGET"
          git -C "$RESUKISU_UPSTREAM" merge-base --is-ancestor "$RESUKISU_DEVICE_PASS_BASE" "$RESUKISU_TARGET"
          delta_count="$(git -C "$RESUKISU_UPSTREAM" rev-list --count "${RESUKISU_DEVICE_PASS_BASE}..${RESUKISU_TARGET}")"
          test "$delta_count" -eq 7
          mapfile -t kernel_uapi_delta < <(git -C "$RESUKISU_UPSTREAM" diff --name-only "$RESUKISU_DEVICE_PASS_BASE" "$RESUKISU_TARGET" -- kernel uapi)
          test "${#kernel_uapi_delta[@]}" -eq 1
          test "${kernel_uapi_delta[0]}" = 'kernel/policy/app_profile.c'
          target_count="$(git -C "$RESUKISU_UPSTREAM" rev-list --count "$RESUKISU_TARGET")"
          target_version="$((30700 + target_count))"
          test "$target_version" = "$EXPECTED_KSU_VERSION"
          target_tag="$(git -C "$RESUKISU_UPSTREAM" describe --abbrev=0 --tags "$RESUKISU_TARGET")"
          target_short="$(git -C "$RESUKISU_UPSTREAM" rev-parse --short=8 "$RESUKISU_TARGET")"
          test "$target_short" = '7741f878'
          git -C "$RESUKISU_UPSTREAM" show "$RESUKISU_TARGET:uapi/supercall.h" | grep -Eq "KERNEL_SU_UAPI_VERSION = ${EXPECTED_KSU_UAPI};"

          git -C "$RESUKISU_UPSTREAM" checkout -q --detach "$RESUKISU_TARGET"
          git -C "$RESUKISU_UPSTREAM" reset --hard -q "$RESUKISU_TARGET"
          git -C "$RESUKISU_UPSTREAM" clean -fdx -q
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['RESUKISU_UPSTREAM'])
          def remove_exact(path, block, expected=1):
              p = root / path
              text = p.read_text(encoding='utf-8')
              count = text.count(block)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {count}: {block!r}')
              p.write_text(text.replace(block, '', expected), encoding='utf-8')
          for rel in ('kernel/feature/module_load_filter.c', 'kernel/feature/module_load_filter.h'):
              p = root / rel
              if not p.is_file():
                  raise SystemExit(f'missing expected file: {rel}')
              p.unlink()
          remove_exact('kernel/Kbuild', 'kernelsu-objs += feature/module_load_filter.o\n')
          remove_exact('kernel/core/init.c', '#include "feature/module_load_filter.h"\n')
          remove_exact('kernel/core/init.c',
              'char ksu_block_modules[256];\n'
              'module_param_string(block_modules, ksu_block_modules, sizeof(ksu_block_modules), 0);\n'
              'MODULE_PARM_DESC(block_modules, "Comma-separated preset module names to acknowledge without loading");\n\n')
          remove_exact('kernel/core/init.c', '        ksu_module_load_filter_hook_init();\n\n')
          remove_exact('kernel/core/init.c', '    ksu_module_load_filter_hook_exit();\n')
          PY
          test ! -e "$RESUKISU_UPSTREAM/kernel/feature/module_load_filter.c"
          test ! -e "$RESUKISU_UPSTREAM/kernel/feature/module_load_filter.h"
          ! grep -RFn 'module_load_filter' "$RESUKISU_UPSTREAM/kernel" "$RESUKISU_UPSTREAM/uapi"
          ! grep -RFn 'ksu_block_modules' "$RESUKISU_UPSTREAM/kernel" "$RESUKISU_UPSTREAM/uapi"
          ! grep -RFn 'block_modules' "$RESUKISU_UPSTREAM/kernel" "$RESUKISU_UPSTREAM/uapi"

          import_patch="$AUDIT_DIR/03-current-kernel-uapi-minus-module-filter.patch"
          git -C "$RESUKISU_UPSTREAM" diff --binary "$RESUKISU_COMMON_BASE" -- kernel uapi > "$import_patch"
          test -s "$import_patch"
          test "$(sha256sum "$import_patch" | awk '{print $1}')" = "$EXPECTED_IMPORT_PATCH_SHA256"

          rm -rf "$P13_DIR/KernelSU"
          git clone -q "$RESUKISU_REPO" "$P13_DIR/KernelSU"
          git -C "$P13_DIR/KernelSU" checkout -q --detach "$RESUKISU_COMMON_BASE"
          git -C "$P13_DIR/KernelSU" reset --hard -q "$RESUKISU_COMMON_BASE"
          git -C "$P13_DIR/KernelSU" clean -fdx -q
          git -C "$P13_DIR/KernelSU" apply --check --whitespace=nowarn "$import_patch"
          git -C "$P13_DIR/KernelSU" apply --index --whitespace=nowarn "$import_patch"
          test -z "$(git -C "$P13_DIR/KernelSU" ls-files -u)"
          diff -qr "$RESUKISU_UPSTREAM/kernel" "$P13_DIR/KernelSU/kernel" > "$AUDIT_DIR/03-kernel-parity.txt"
          diff -qr "$RESUKISU_UPSTREAM/uapi" "$P13_DIR/KernelSU/uapi" > "$AUDIT_DIR/03-uapi-parity.txt"

          echo "P13_KSU_VERSION=$target_version" >> "$GITHUB_ENV"
          echo "P13_TARGET_TAG=$target_tag" >> "$GITHUB_ENV"
          echo "P13_TARGET_SHORT=$target_short" >> "$GITHUB_ENV"
          {
            echo "RESUKISU_TARGET=$RESUKISU_TARGET"
            echo "KSU_VERSION=$target_version"
            echo "KSU_UAPI=$EXPECTED_KSU_UAPI"
            echo "MODULE_LOAD_FILTER_EXCLUDED=PASS"
            echo "IMPORT_PATCH_SHA256=$EXPECTED_IMPORT_PATCH_SHA256"
            echo "RESUKISU_SUBTREE_RECONSTRUCTION=PASS"
          } | tee "$AUDIT_DIR/03-resukisu-gate.txt"

      - name: Reapply proven CLEAN-GEN1 5.4 contract and exact P13 delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import os
          root = Path(os.environ['P13_DIR'])
          def ensure_include(rel, anchor):
              p = root / rel
              text = p.read_text(encoding='utf-8')
              inc = '#include <linux/ksu_hook_contract.h>'
              if inc not in text:
                  if anchor not in text:
                      raise SystemExit(f'anchor missing in {rel}: {anchor!r}')
                  p.write_text(text.replace(anchor, anchor + '\n' + inc, 1), encoding='utf-8')
          ensure_include('KernelSU/kernel/feature/sucompat.h', '#include "compat/kernel_compat.h"')
          ensure_include('KernelSU/kernel/runtime/ksud_integration.c', '#include <linux/version.h>')
          ensure_include('KernelSU/kernel/supercall/supercall.c', '#include <linux/anon_inodes.h>')

          p = root / 'KernelSU/kernel/Kbuild'
          text = p.read_text(encoding='utf-8')
          old = dedent('''\
          KSU_LOCAL_VERSION := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-list --count HEAD)
          KSU_VERSION := $(shell expr 30000 + $(KSU_LOCAL_VERSION) + 700)

          KSU_TAG_NAME    := $(shell cd $(KSU_SRC); $(GIT_BIN) describe --abbrev=0 --tags 2>/dev/null || echo "v4.1.0")
          KSU_COMMIT_SHA  := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-parse --short=8 HEAD 2>/dev/null || echo "unknown")
          ifneq ($(shell cd $(KSU_SRC); $(GIT_BIN) diff-index --quiet HEAD; echo $$?),0)
          KSU_COMMIT_SHA  := $(KSU_COMMIT_SHA)-dirty
          endif
          KSU_BRANCH_NAME := $(shell cd $(KSU_SRC); $(GIT_BIN) branch --show-current 2>/dev/null || echo "unknown")''')
          version = os.environ['P13_KSU_VERSION']
          tag = os.environ['P13_TARGET_TAG']
          short = os.environ['P13_TARGET_SHORT']
          target = os.environ['RESUKISU_TARGET']
          new = dedent(f'''\
          KSU_LOCAL_VERSION := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-list --count HEAD)
          CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := {version}
          CLEAN_GEN1_UPSTREAM_TARGET := {target}
          KSU_VERSION := $(CLEAN_GEN1_UPSTREAM_COMPAT_VERSION)

          KSU_TAG_NAME    := {tag}
          KSU_COMMIT_SHA  := {short}-p13
          KSU_BRANCH_NAME := clean-gen1-p13''')
          if old not in text:
              raise SystemExit('expected ReSukiSU Kbuild version block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git -C "$P13_DIR/KernelSU" add kernel uapi
          test -z "$(git -C "$P13_DIR/KernelSU" ls-files -u)"
          grep -Fq '#include <linux/ksu_hook_contract.h>' "$P13_DIR/KernelSU/kernel/feature/sucompat.h"
          grep -Fq '#include <linux/ksu_hook_contract.h>' "$P13_DIR/KernelSU/kernel/runtime/ksud_integration.c"
          grep -Fq '#include <linux/ksu_hook_contract.h>' "$P13_DIR/KernelSU/kernel/supercall/supercall.c"
          grep -Fq "CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := $P13_KSU_VERSION" "$P13_DIR/KernelSU/kernel/Kbuild"
          grep -Fq "CLEAN_GEN1_UPSTREAM_TARGET := $RESUKISU_TARGET" "$P13_DIR/KernelSU/kernel/Kbuild"
          grep -Eq "KERNEL_SU_UAPI_VERSION = ${EXPECTED_KSU_UAPI};" "$P13_DIR/KernelSU/uapi/supercall.h"
          test ! -e "$P13_DIR/KernelSU/kernel/feature/module_load_filter.c"
          test ! -e "$P13_DIR/KernelSU/kernel/feature/module_load_filter.h"
          ! grep -RFn 'module_load_filter' "$P13_DIR/KernelSU/kernel" "$P13_DIR/KernelSU/uapi"
          ! grep -RFn 'block_modules' "$P13_DIR/KernelSU/kernel" "$P13_DIR/KernelSU/uapi"

          p13_patch="$O40_DIR/07-P13-post-exec.patch"
          echo "$EXPECTED_P13_PATCH_SHA256  $p13_patch" | sha256sum -c -
          test "$(sha256sum "$P13_DIR/fs/exec.c" | awk '{print $1}')" = "$EXPECTED_P12_EXEC_SHA256"
          test "$(sha256sum "$P13_DIR/include/linux/ksu_hook_contract.h" | awk '{print $1}')" = "$EXPECTED_P12_CONTRACT_SHA256"
          git -C "$P13_DIR" apply --check --whitespace=error --binary "$p13_patch"
          git -C "$P13_DIR" apply --index --whitespace=error --binary "$p13_patch"
          git -C "$P13_DIR" diff --cached --check
          test "$(git -C "$P13_DIR" write-tree)" = "$EXPECTED_P13_TREE"
          test "$(make -s -C "$P13_DIR" kernelversion)" = "$EXPECTED_P13_KERNEL_VERSION"
          grep -Fq 'ksu_handle_post_execve' "$P13_DIR/fs/exec.c"
          ! grep -Fq 'ksu_install_su_fd' "$P13_DIR/fs/exec.c"
          grep -Fq 'grep -q "ksu_handle_post_execve" $(srctree)/fs/exec.c' "$P13_DIR/KernelSU/kernel/tools/kernel_compat.mk"
          test "$(sha256sum "$P13_DIR/fs/susfs.c" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_C_SHA256"
          test "$(sha256sum "$P13_DIR/include/linux/susfs.h" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_H_SHA256"
          test "$(sha256sum "$P13_DIR/include/linux/susfs_def.h" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_DEF_SHA256"

          P13_KSU_TREE="$(git -C "$P13_DIR/KernelSU" write-tree)"
          echo "P13_KSU_TREE=$P13_KSU_TREE" >> "$GITHUB_ENV"
          git -C "$P13_DIR" config user.name 'VEUX U5-O41 Build Audit'
          git -C "$P13_DIR" config user.email 'veux-u5-o41@invalid.local'
          p13_tree="$(git -C "$P13_DIR" write-tree)"
          p13_commit="$(printf '%s\n' 'U5-O41 exact P13 local snapshot' | git -C "$P13_DIR" commit-tree "$p13_tree" -p "$EXPECTED_VENDOR_SHA")"
          git -C "$P13_DIR" reset --hard "$p13_commit"
          test "$(git -C "$P13_DIR" write-tree)" = "$EXPECTED_P13_TREE"
          test -d "$P13_DIR/KernelSU/.git"
          test "$(git -C "$P13_DIR/KernelSU" write-tree)" = "$P13_KSU_TREE"
          echo "P13_LOCAL_COMMIT=$p13_commit" >> "$GITHUB_ENV"
          {
            echo "P13_OUTER_TREE=$p13_tree"
            echo "P13_KERNELSU_TREE=$P13_KSU_TREE"
            echo "P13_KERNELVERSION=$(make -s -C "$P13_DIR" kernelversion)"
            echo "P13_RECONSTRUCTION=PASS"
          } | tee "$AUDIT_DIR/04-p13-reconstruction-gate.txt"

      - name: Materialize conflict-free 5.4.300 and 5.4.302 source trees with KernelSU
        shell: bash
        run: |
          set -euo pipefail
          git -C "$P13_DIR" worktree add -q --detach "$T300_DIR" "$P13_LOCAL_COMMIT"
          git -C "$P13_DIR" worktree add -q --detach "$T302_DIR" "$P13_LOCAL_COMMIT"
          p300="$O40_DIR/target-5.4.300/P13-to-5.4.300-AUTO-MERGED-PARTIAL.patch"
          p302="$O40_DIR/target-5.4.302/P13-to-5.4.302-AUTO-MERGED-PARTIAL.patch"

          materialize_target() {
            local src="$1" patch="$2" ver="$3"
            git -C "$src" apply --check --whitespace=error --binary "$patch"
            git -C "$src" apply --index --whitespace=error --binary "$patch"
            git -C "$src" diff --cached --check
            test "$(make -s -C "$src" kernelversion)" = "$ver"
            rm -rf "$src/KernelSU"
            cp -a "$P13_DIR/KernelSU" "$src/KernelSU"
            test -d "$src/KernelSU/.git"
            test "$(git -C "$src/KernelSU" write-tree)" = "$P13_KSU_TREE"
            diff -qr "$P13_DIR/KernelSU/kernel" "$src/KernelSU/kernel" >/dev/null
            diff -qr "$P13_DIR/KernelSU/uapi" "$src/KernelSU/uapi" >/dev/null
            grep -Fxq 'CONFIG_KSU=y' "$src/arch/arm64/configs/veux_defconfig"
            grep -Fxq 'CONFIG_KSU_SUSFS=y' "$src/arch/arm64/configs/veux_defconfig"
            grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' "$src/arch/arm64/configs/veux_defconfig"
            grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' "$src/arch/arm64/configs/veux_defconfig"
            grep -Fxq 'CONFIG_LOCALVERSION="-qgki"' "$src/arch/arm64/configs/veux_defconfig"
            test "$(sha256sum "$src/fs/susfs.c" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_C_SHA256"
            test "$(sha256sum "$src/include/linux/susfs.h" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_H_SHA256"
            test "$(sha256sum "$src/include/linux/susfs_def.h" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_DEF_SHA256"
            grep -Eq "KERNEL_SU_UAPI_VERSION = ${EXPECTED_KSU_UAPI};" "$src/KernelSU/uapi/supercall.h"
            grep -Fq 'ksu_handle_post_execve' "$src/fs/exec.c"
            test ! -e "$src/KernelSU/kernel/feature/module_load_filter.c"
            test ! -e "$src/KernelSU/kernel/feature/module_load_filter.h"
          }
          materialize_target "$T300_DIR" "$p300" 5.4.300
          materialize_target "$T302_DIR" "$p302" 5.4.302
          {
            echo "TARGET_300_KERNELVERSION=$(make -s -C "$T300_DIR" kernelversion)"
            echo "TARGET_300_TREE=$(git -C "$T300_DIR" write-tree)"
            echo "TARGET_302_KERNELVERSION=$(make -s -C "$T302_DIR" kernelversion)"
            echo "TARGET_302_TREE=$(git -C "$T302_DIR" write-tree)"
            echo "TARGET_KERNELSU_TREE=$P13_KSU_TREE"
            echo "BOTH_CONFLICT_FREE_SOURCE_TREES_MATERIALIZED=PASS"
          } | tee "$AUDIT_DIR/05-source-application-gate.txt"
          git -C "$T300_DIR" diff --cached --stat > "$AUDIT_DIR/05-target-300-stat.txt"
          git -C "$T302_DIR" diff --cached --stat > "$AUDIT_DIR/05-target-302-stat.txt"

      - name: Close and verify PM runtime needs_force_resume dependency contract
        shell: bash
        run: |
          set -euo pipefail
          close_pm_runtime_contract() {
            local src="$1" ver="$2" idx="$3"
            local pm="$src/include/linux/pm.h"
            local rt="$src/drivers/base/power/runtime.c"
            local patch="$AUDIT_DIR/${idx}-pm-runtime-needs-force-resume-${ver}.patch"

            test -s "$pm"
            test -s "$rt"
            grep -Fq '#ifdef __GENKSYMS__' "$pm"
            grep -Fq 'dev->power.needs_force_resume = false;' "$rt"

            python3 - "$src" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          pm = root / 'include/linux/pm.h'
          rt = root / 'drivers/base/power/runtime.c'

          ptext = pm.read_text(encoding='utf-8')
          if 'needs_force_resume:1;' in ptext:
              raise SystemExit('pm.h already contains needs_force_resume before dependency closure')
          p_anchor = '\tunsigned int\t\tdeferred_resume:1;\n\tunsigned int\t\truntime_auto:1;\n'
          p_repl = '\tunsigned int\t\tdeferred_resume:1;\n\tunsigned int\t\tneeds_force_resume:1;\n\tunsigned int\t\truntime_auto:1;\n'
          if ptext.count(p_anchor) != 1:
              raise SystemExit(f'pm.h deferred/runtime_auto anchor count={ptext.count(p_anchor)}')
          ptext = ptext.replace(p_anchor, p_repl, 1)
          pm.write_text(ptext, encoding='utf-8')

          text = rt.read_text(encoding='utf-8')

          init_anchor = '\tdev->power.request = RPM_REQ_NONE;\n\tdev->power.deferred_resume = false;\n\tINIT_WORK(&dev->power.work, pm_runtime_work);\n'
          init_repl = '\tdev->power.request = RPM_REQ_NONE;\n\tdev->power.deferred_resume = false;\n\tdev->power.needs_force_resume = 0;\n\tINIT_WORK(&dev->power.work, pm_runtime_work);\n'
          if text.count(init_anchor) != 1:
              raise SystemExit(f'runtime init anchor count={text.count(init_anchor)}')
          text = text.replace(init_anchor, init_repl, 1)

          suspend_anchor = ('\tif (pm_runtime_need_not_resume(dev))\n'
                            '\t\tpm_runtime_set_suspended(dev);\n'
                            '\telse\n'
                            '\t\t__update_runtime_status(dev, RPM_SUSPENDED);\n')
          suspend_repl = ('\tif (pm_runtime_need_not_resume(dev)) {\n'
                          '\t\tpm_runtime_set_suspended(dev);\n'
                          '\t} else {\n'
                          '\t\t__update_runtime_status(dev, RPM_SUSPENDED);\n'
                          '\t\tdev->power.needs_force_resume = 1;\n'
                          '\t}\n')
          if text.count(suspend_anchor) != 1:
              raise SystemExit(f'force_suspend anchor count={text.count(suspend_anchor)}')
          text = text.replace(suspend_anchor, suspend_repl, 1)

          resume_anchor = '\tif (!pm_runtime_status_suspended(dev) || pm_runtime_need_not_resume(dev))\n'
          resume_repl = '\tif (!pm_runtime_status_suspended(dev) || !dev->power.needs_force_resume)\n'
          if text.count(resume_anchor) != 1:
              raise SystemExit(f'force_resume condition anchor count={text.count(resume_anchor)}')
          text = text.replace(resume_anchor, resume_repl, 1)

          out_anchor = '\tpm_runtime_mark_last_busy(dev);\nout:\n\tpm_runtime_enable(dev);\n\treturn ret;\n}\nEXPORT_SYMBOL_GPL(pm_runtime_force_resume);\n'
          out_repl = '\tpm_runtime_mark_last_busy(dev);\nout:\n\tdev->power.needs_force_resume = 0;\n\tpm_runtime_enable(dev);\n\treturn ret;\n}\nEXPORT_SYMBOL_GPL(pm_runtime_force_resume);\n'
          if text.count(out_anchor) != 1:
              raise SystemExit(f'force_resume out anchor count={text.count(out_anchor)}')
          text = text.replace(out_anchor, out_repl, 1)
          rt.write_text(text, encoding='utf-8')

          pfinal = pm.read_text(encoding='utf-8')
          rfinal = rt.read_text(encoding='utf-8')
          checks = [
              ('pm field', '\tunsigned int\t\tneeds_force_resume:1;' in pfinal),
              ('init zero', '\tdev->power.needs_force_resume = 0;\n\tINIT_WORK' in rfinal),
              ('suspend set', '\t\tdev->power.needs_force_resume = 1;' in rfinal),
              ('resume condition', '|| !dev->power.needs_force_resume)' in rfinal),
              ('resume clear', 'out:\n\tdev->power.needs_force_resume = 0;\n\tpm_runtime_enable(dev);' in rfinal),
              ('reinit clear', '\tdev->power.needs_force_resume = false;\n}' in rfinal),
          ]
          bad = [name for name, ok in checks if not ok]
          if bad:
              raise SystemExit('PM runtime dependency closure failed: ' + ', '.join(bad))
          print('PM_RUNTIME_DEPENDENCY_CLOSURE=PASS')
          PY

            git -C "$src" diff --check
            git -C "$src" diff -- include/linux/pm.h drivers/base/power/runtime.c > "$patch"
            test -s "$patch"
            mapfile -t unstaged < <(git -C "$src" diff --name-only | LC_ALL=C sort)
            test "${#unstaged[@]}" -eq 2
            test "${unstaged[0]}" = 'drivers/base/power/runtime.c'
            test "${unstaged[1]}" = 'include/linux/pm.h'
            git -C "$src" add drivers/base/power/runtime.c include/linux/pm.h
            test -z "$(git -C "$src" diff --name-only)"
            git -C "$src" diff --cached --check

            grep -Fqx $'\tunsigned int\t\tneeds_force_resume:1;' "$pm"
            test "$(grep -Fc 'dev->power.needs_force_resume = 1;' "$rt")" -eq 1
            test "$(grep -Fc '!dev->power.needs_force_resume' "$rt")" -eq 1
            test "$(grep -Fc 'dev->power.needs_force_resume = false;' "$rt")" -eq 1
            test "$(grep -Fc 'dev->power.needs_force_resume = 0;' "$rt")" -eq 2
          }

          close_pm_runtime_contract "$T300_DIR" 5.4.300 06
          close_pm_runtime_contract "$T302_DIR" 5.4.302 07
          cmp -s "$AUDIT_DIR/06-pm-runtime-needs-force-resume-5.4.300.patch" \
                 "$AUDIT_DIR/07-pm-runtime-needs-force-resume-5.4.302.patch"
          {
            echo "PM_RUNTIME_STABLE_DEPENDENCY_COMMIT=$PM_RUNTIME_DEP_COMMIT"
            echo 'PM_RUNTIME_COUPLED_FILES=drivers/base/power/runtime.c include/linux/pm.h'
            echo 'PM_RUNTIME_ANDROID_GENKSYMS_LAYOUT_PRESERVED=PASS'
            echo 'PM_RUNTIME_5.4.300_CLOSURE=PASS'
            echo 'PM_RUNTIME_5.4.302_CLOSURE=PASS'
            echo 'PM_RUNTIME_BOTH_TARGET_PATCHES_IDENTICAL=PASS'
          } | tee "$AUDIT_DIR/07-pm-runtime-dependency-gate.txt"

      - name: Install exact proven Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail
          url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz"
          curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/clang-r416183b.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang-r416183b.tar.gz" -C "$TOOLCHAIN_DIR"
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            test -x "$TOOLCHAIN_DIR/bin/$tool"
          done
          "$TOOLCHAIN_DIR/bin/clang" --version | tee "$AUDIT_DIR/06-clang.txt"
          echo "CLANG_PREBUILT_COMMIT=$CLANG_PREBUILT_COMMIT" > "$AUDIT_DIR/06-toolchain-gate.txt"
          echo 'TOOLCHAIN=PASS' >> "$AUDIT_DIR/06-toolchain-gate.txt"

      - name: Build and validate both stable candidates
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export KBUILD_BUILD_USER KBUILD_BUILD_HOST KBUILD_BUILD_TIMESTAMP
          export KBUILD_BUILD_VERSION SOURCE_DATE_EPOCH KBUILD_FIXED_SCM_SUFFIX

          build_one() {
            local ver="$1" src="$2" out="$3" expected_release="$4" idx="$5"
            local dest="$DIST_DIR/$ver"
            local cfglog="$AUDIT_DIR/${idx}-config-${ver}.log"
            local buildlog="$AUDIT_DIR/${idx}-build-${ver}.log"
            local result="$AUDIT_DIR/${idx}-result-${ver}.txt"
            local status=0 cfg_rc=99 build_rc=99 release=UNKNOWN dtb_count=0
            local image="$out/arch/arm64/boot/Image"
            local dtb="$out/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"
            rm -rf "$out" "$dest"
            mkdir -p "$dest"

            set +e
            make -C "$src" O="$out" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
              veux_defconfig 2>&1 | tee "$cfglog"
            cfg_rc=${PIPESTATUS[0]}
            set -u
            [ "$cfg_rc" -eq 0 ] || status=1

            if [ "$status" -eq 0 ]; then
              for q in \
                'CONFIG_KSU=y' \
                'CONFIG_KSU_SUSFS=y' \
                '# CONFIG_KSU_MANUAL_HOOK is not set' \
                'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' \
                'CONFIG_LOCALVERSION="-qgki"'; do
                grep -Fxq "$q" "$out/.config" || status=1
              done
            fi

            if [ "$status" -eq 0 ]; then
              set +e
              make -C "$src" -j"$(nproc)" O="$out" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
                KCFLAGS="$EFFECTIVE_KCFLAGS" Image dtbs 2>&1 | tee "$buildlog"
              build_rc=${PIPESTATUS[0]}
              set -u
              [ "$build_rc" -eq 0 ] || status=1
            fi

            if [ "$status" -eq 0 ] && [ ! -s "$image" ]; then status=1; fi
            if [ "$status" -eq 0 ] && [ ! -s "$dtb" ]; then status=1; fi
            if [ "$status" -eq 0 ] && [ "$(stat -c '%s' "$image" 2>/dev/null || echo 0)" -le 20000000 ]; then status=1; fi

            if [ "$status" -eq 0 ]; then
              set +e
              release="$(make -s -C "$src" O="$out" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 kernelrelease 2>>"$buildlog")"
              rel_rc=$?
              set -u
              [ "$rel_rc" -eq 0 ] || status=1
              [ "$release" = "$expected_release" ] || status=1
            fi

            if [ "$status" -eq 0 ]; then
              strings -a "$image" > "$AUDIT_DIR/${idx}-image-strings-${ver}.txt" || status=1
            fi
            if [ "$status" -eq 0 ]; then
              grep -Fq "Linux version $expected_release ($KBUILD_BUILD_USER@$KBUILD_BUILD_HOST)" \
                "$AUDIT_DIR/${idx}-image-strings-${ver}.txt" || status=1
              grep -Fq "$RESUKISU_IMAGE_IDENTITY" "$AUDIT_DIR/${idx}-image-strings-${ver}.txt" || status=1
            fi
            if [ "$status" -eq 0 ]; then
              dtb_count="$(find "$out/arch/arm64/boot/dts" -type f -name '*.dtb' -size +0c | wc -l)"
              [ "$dtb_count" -gt 0 ] || status=1
            fi

            if [ "$status" -eq 0 ]; then
              cp "$image" "$dest/Image" || status=1
              cp "$dtb" "$dest/veux.dtb" || status=1
              cp "$out/.config" "$dest/config" || status=1
            fi
            if [ "$status" -eq 0 ]; then
              (cd "$out/arch/arm64/boot" && find dts -type f -name '*.dtb' -size +0c -print0 | \
                tar --null -T - -czf "$dest/dtbs.tar.gz") || status=1
            fi
            if [ "$status" -eq 0 ]; then
              sha256sum "$dest/Image" "$dest/veux.dtb" "$dest/dtbs.tar.gz" > "$dest/SHA256SUMS.txt" || status=1
              file "$image" > "$AUDIT_DIR/${idx}-image-file-${ver}.txt" || status=1
              stat -c 'IMAGE_BYTES=%s' "$image" > "$AUDIT_DIR/${idx}-image-size-${ver}.txt" || status=1
            fi

            {
              echo "CONFIG_RC=$cfg_rc"
              echo "BUILD_RC=$build_rc"
              echo "KERNEL_RELEASE=$release"
              echo "DTB_COUNT=$dtb_count"
              if [ "$status" -eq 0 ]; then echo "BUILD_${ver}=PASS"; else echo "BUILD_${ver}=FAIL"; fi
            } | tee "$result"
            return "$status"
          }

          rc300=0
          build_one 5.4.300 "$T300_DIR" "$OUT300" "$EXPECTED_RELEASE_300" 10 || rc300=$?
          rc302=0
          build_one 5.4.302 "$T302_DIR" "$OUT302" "$EXPECTED_RELEASE_302" 11 || rc302=$?
          echo "BUILD300_STATUS=$rc300" >> "$GITHUB_ENV"
          echo "BUILD302_STATUS=$rc302" >> "$GITHUB_ENV"
          {
            echo "BUILD300_STATUS=$rc300"
            echo "BUILD302_STATUS=$rc302"
            echo 'BOTH_BUILD_ATTEMPTS_COMPLETED=PASS'
          } | tee "$AUDIT_DIR/12-build-attempt-summary.txt"
          exit 0

      - name: Final O41 v3 dependency-closure dual-build gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BUILD300_STATUS:-}"
          test -n "${BUILD302_STATUS:-}"
          pass=1
          [ "$BUILD300_STATUS" = '0' ] || pass=0
          [ "$BUILD302_STATUS" = '0' ] || pass=0
          {
            echo 'O40_RUNTIME_SOURCE_PARENT=PASS'
            echo 'P13_RECONSTRUCTION=PASS'
            echo 'SOURCE_CONFLICTS_5.4.300=0'
            echo 'SOURCE_CONFLICTS_5.4.302=0'
            echo 'PM_RUNTIME_DEPENDENCY_CLOSURE=PASS'
            if [ "$BUILD300_STATUS" = '0' ]; then echo 'FULL_BUILD_5.4.300=PASS'; else echo 'FULL_BUILD_5.4.300=FAIL'; fi
            if [ "$BUILD302_STATUS" = '0' ]; then echo 'FULL_BUILD_5.4.302=PASS'; else echo 'FULL_BUILD_5.4.302=FAIL'; fi
            echo 'AK3_CREATED=NO'
            echo 'FLASH_PERFORMED=NO'
            echo 'DEVICE_PASS=NO'
            if [ "$pass" -eq 1 ]; then
              echo 'BOTH_TARGET_FULL_BUILD=PASS'
              echo 'READY_FOR_BUILD_COMPARISON_AND_AK3_AUDIT=YES'
              echo 'O41_FINAL=BUILD_GREEN_PASS'
            else
              echo 'BOTH_TARGET_FULL_BUILD=FAIL'
              echo 'READY_FOR_BUILD_COMPARISON_AND_AK3_AUDIT=NO'
              echo 'O41_FINAL=BUILD_FAILED'
            fi
          } | tee "$AUDIT_DIR/99-O41-FINAL-GATE.txt"
          find "$AUDIT_DIR" "$DIST_DIR" -type f ! -path "$AUDIT_DIR/99-O41-FILE-SHA256.txt" -print0 | \
            sort -z | xargs -0 sha256sum > "$AUDIT_DIR/99-O41-FILE-SHA256.txt"
          [ "$pass" -eq 1 ]

      - name: Upload O41 v3 build audit evidence and successful outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-GEN1-U5-O41-v3-pm-runtime-dependency-closure-dual-build-audit-${{ github.run_id }}
          path: |
            u5-o41-build-audit
            u5-o41-build-dist
          if-no-files-found: error
          retention-days: 30
