      - name: Normalize proven SUSFS core boundary and remove duplicate setresuid path
        shell: bash
        run: |
          set -euo pipefail

          STAGE="$(cat "$DRIVER_DIR/kernel-stage.path")"

          STAGE="$STAGE" ARTIFACT_DIR="$ARTIFACT_DIR" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          stage = Path(os.environ["STAGE"])
          artifact = Path(os.environ["ARTIFACT_DIR"])

          susfs = stage / "fs/susfs.c"
          data = susfs.read_text(encoding="utf-8", errors="replace")

          old_decl = (
              'extern void setup_selinux(const char *domain, '
              'struct cred *cred);'
          )
          new_decl = (
              'extern int ksu_setup_selinux_cred(const char *domain, '
              'struct cred *cred);'
          )

          if old_decl in data:
              if data.count(old_decl) != 1:
                  raise SystemExit("multiple modern setup_selinux externs")
              data = data.replace(old_decl, new_decl, 1)
          elif new_decl not in data:
              raise SystemExit(
                  "neither modern nor W63 SELinux boundary declaration found"
              )

          old_call = 'setup_selinux("u:r:ksu:s0", cred);'
          new_call_marker = 'ksu_setup_selinux_cred("u:r:su:s0", cred)'

          if old_call in data:
              if data.count(old_call) != 1:
                  raise SystemExit("multiple modern hard-coded KSU domain calls")
              replacement = '''if (ksu_setup_selinux_cred("u:r:su:s0", cred)) {
          		SUSFS_LOGE("failed to apply v0.9.5 KernelSU SELinux domain to sdcard monitor cred!\\n");
          		abort_creds(cred);
          		return -EINVAL;
          	}'''
              data = data.replace(old_call, replacement, 1)
          elif new_call_marker not in data:
              raise SystemExit(
                  "SUSFS sdcard-monitor SELinux call shape not recognized"
              )

          # The proven 5.4 recipes already carry a version-gated
          # fsnotify compatibility layer. Its source legitimately contains
          # both .handle_inode_event and .handle_event, with only the 5.4
          # handle_event side selected by the preprocessor.
          susfs_def = (
              stage / "include/linux/susfs_def.h"
          ).read_text(encoding="utf-8", errors="replace")

          proven_macro = (
              "SUSFS_DECL_FSNOTIFY_OPS" in susfs_def
              and "SUSFS_DECL_FSNOTIFY_OPS(susfs_handle_sdcard_inode_event)"
                  in data
              and "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)"
                  in data
              and ".handle_inode_event = susfs_handle_sdcard_inode_event"
                  in data
              and ".handle_event = susfs_handle_sdcard_inode_event"
                  in data
          )

          if proven_macro:
              if (
                  "#elif LINUX_VERSION_CODE >= KERNEL_VERSION(5, 2, 0)"
                  not in susfs_def
              ):
                  raise SystemExit(
                      "proven SUSFS fsnotify macro lacks Linux 5.4 branch"
                  )
              fsnotify_mode = "PROVEN_VERSION_GATED_5_4_COMPAT"

          elif ".handle_inode_event" in data:
              # Fallback only for a raw, unadapted modern SUSFS source.
              callback_pattern = re.compile(
                  r"static\s+int\s+susfs_handle_sdcard_inode_event\s*\("
                  r"\s*struct\s+fsnotify_mark\s*\*\s*mark\s*,\s*u32\s+mask\s*,"
                  r"\s*struct\s+inode\s*\*\s*inode\s*,\s*struct\s+inode\s*\*\s*dir\s*,"
                  r"\s*const\s+struct\s+qstr\s*\*\s*file_name\s*,\s*u32\s+cookie\s*\)"
                  r"\s*\{",
                  re.S,
              )
              if len(list(callback_pattern.finditer(data))) != 1:
                  raise SystemExit(
                      "raw modern fsnotify callback structural match failed"
                  )

              signature = (
                  "static int susfs_handle_sdcard_event_5_4(struct fsnotify_group *group,\n"
                  "\t\t\t\t\t\t\t\t\t\t struct inode *inode, u32 mask,\n"
                  "\t\t\t\t\t\t\t\t\t\t const void *event_data, int data_type,\n"
                  "\t\t\t\t\t\t\t\t\t\t const struct qstr *file_name, u32 cookie,\n"
                  "\t\t\t\t\t\t\t\t\t\t struct fsnotify_iter_info *iter_info)\n"
                  "{\n"
                  "\t(void)group;\n"
                  "\t(void)inode;\n"
                  "\t(void)event_data;\n"
                  "\t(void)data_type;\n"
                  "\t(void)cookie;\n"
                  "\t(void)iter_info;"
              )
              data = callback_pattern.sub(
                  lambda _m: signature,
                  data,
                  count=1,
              )

              ops = re.compile(
                  r"static\s+const\s+struct\s+fsnotify_ops\s+fsnotify_ops\s*=\s*\{\s*"
                  r"\.handle_inode_event\s*=\s*susfs_handle_sdcard_inode_event\s*,\s*"
                  r"\};",
                  re.S,
              )
              if len(list(ops.finditer(data))) != 1:
                  raise SystemExit(
                      "raw modern fsnotify ops structural match failed"
                  )

              data = ops.sub(
                  lambda _m: (
                      "static const struct fsnotify_ops fsnotify_ops = {\n"
                      "\t.handle_event = susfs_handle_sdcard_event_5_4,\n"
                      "};"
                  ),
                  data,
                  count=1,
              )

              if ".handle_inode_event" in data:
                  raise SystemExit(
                      "unconditional newer fsnotify ABI remains after fallback"
                  )

              fsnotify_mode = "W63_STRUCTURAL_5_4_ADAPTER"

          else:
              if ".handle_event" not in data:
                  raise SystemExit(
                      "no recognizable Linux 5.4 fsnotify path"
                  )
              fsnotify_mode = "ALREADY_HANDLE_EVENT_ONLY"

          (artifact / "FSNOTIFY-NORMALIZATION.txt").write_text(
              "\n".join([
                  f"FSNOTIFY_MODE={fsnotify_mode}",
                  f"PROVEN_VERSION_GATED_COMPAT={'YES' if proven_macro else 'NO'}",
                  "TARGET_KERNEL_FAMILY=Linux_5_4",
              ]) + "\n",
              encoding="utf-8",
          )

          if "synchronize_srcu(&susfs_srcu_open_redirect)" not in data:
              raise SystemExit("OPEN_REDIRECT synchronize_srcu fix missing")

          susfs.write_text(data, encoding="utf-8")

          sysc = stage / "kernel/sys.c"
          text = sysc.read_text(encoding="utf-8", errors="replace")

          before = text.count("ksu_handle_setresuid")
          text = re.sub(
              r"\n#ifdef CONFIG_KSU_SUSFS\n"
              r"\s*(?:\(void\)\s*)?ksu_handle_setresuid"
              r"\s*\(\s*ruid\s*,\s*euid\s*,\s*suid\s*\)\s*;\s*\n"
              r"#endif\n",
              "\n",
              text,
              count=1,
          )
          text = re.sub(
              r"^extern\s+[^;]*\bksu_handle_setresuid\s*\([^;]*;\s*\n",
              "",
              text,
              flags=re.M,
          )
          sysc.write_text(text, encoding="utf-8")

          after = text.count("ksu_handle_setresuid")

          (artifact / "BOUNDARY-NORMALIZATION.txt").write_text(
              "\n".join([
                  "V095_SELINUX_DOMAIN=u:r:su:s0",
                  "MODERN_SUSFS_HARDCODED_KSU_DOMAIN_REMOVED=YES",
                  "OPEN_REDIRECT_SRCU_FIX_PRESENT=YES",
                  f"KSU_HANDLE_SETRESUID_REFS_BEFORE={before}",
                  f"KSU_HANDLE_SETRESUID_REFS_AFTER={after}",
                  "SECOND_COMPETING_SETRESUID_HOOK=NO",
                  f"FSNOTIFY_MODE={fsnotify_mode}",
              ]) + "\n",
              encoding="utf-8",
          )

          if after != 0:
              raise SystemExit(
                  "ReSukiSU-specific setresuid hook reference remains"
              )

          print("SUSFS_BOUNDARY_NORMALIZATION=PASS")
          print("DUPLICATE_SETRESUID_PATH_REMOVAL=PASS")
          PY

      - name: Port W63-v7 zygote behavior onto v0.9.5 task_fix_setuid
        shell: bash
        run: |
          set -euo pipefail

          STAGE="$(cat "$DRIVER_DIR/kernel-stage.path")"

          STAGE="$STAGE" python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["STAGE"]) / "KernelSU/kernel/core_hook.c"
          data = p.read_text(encoding="utf-8")

          include_anchor = '#include <linux/mount.h>\n'
          if data.count(include_anchor) != 1:
              raise SystemExit("core_hook mount include anchor drifted")
          data = data.replace(
              include_anchor,
              include_anchor
              + '\n#ifdef CONFIG_KSU_SUSFS\n'
              + '#include <linux/susfs.h>\n'
              + '#include <linux/susfs_def.h>\n'
              + '#include <linux/workqueue.h>\n'
              + '#endif\n',
              1,
          )

          marker = 'static bool ksu_module_mounted = false;\n'
          if data.count(marker) != 1:
              raise SystemExit("core_hook module mounted anchor drifted")

          helpers = r'''
          #ifdef CONFIG_KSU_SUSFS
          extern struct work_struct susfs_extra_works;

          static inline bool ksu_susfs_is_isolated_process(uid_t uid)
          {
          	uid_t appid = uid % 100000;

          	return appid >= 99000 && appid <= 99999;
          }

          static inline void ksu_schedule_susfs_extra_works(void)
          {
          	if (!work_pending(&susfs_extra_works))
          		schedule_work(&susfs_extra_works);
          }
          #endif

          '''
          data = data.replace(marker, marker + '\n' + helpers, 1)

          start = data.find(
              'int ksu_handle_setuid(struct cred *new, const struct cred *old)\n{'
          )
          if start < 0:
              raise SystemExit("v0.9.5 ksu_handle_setuid start not found")

          brace = data.find('{', start)
          depth = 0
          end = None
          for i in range(brace, len(data)):
              if data[i] == '{':
                  depth += 1
              elif data[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit("v0.9.5 ksu_handle_setuid end not found")

          replacement = r'''int ksu_handle_setuid(struct cred *new, const struct cred *old)
          {
          	bool is_zygote_child;
          	kuid_t new_uid;
          	kuid_t old_uid;
          #ifdef CONFIG_KSU_SUSFS
          	bool isolated;
          #endif

          	if (!ksu_module_mounted)
          		return 0;

          	if (!new || !old)
          		return 0;

          	new_uid = new->uid;
          	old_uid = old->uid;

          	if (old_uid.val != 0)
          		return 0;

          #ifdef CONFIG_KSU_SUSFS
          	isolated = ksu_susfs_is_isolated_process(new_uid.val);

          	if (!isolated && (!is_appuid(new_uid) ||
          			  is_unsupported_uid(new_uid.val)))
          		return 0;

          	if (!isolated) {
          		if (ksu_is_allow_uid(new_uid.val))
          			return 0;

          		if (!ksu_uid_should_umount(new_uid.val))
          			return 0;
          	}
          #else
          	if (!is_appuid(new_uid) || is_unsupported_uid(new_uid.val))
          		return 0;

          	if (ksu_is_allow_uid(new_uid.val))
          		return 0;

          	if (!ksu_uid_should_umount(new_uid.val))
          		return 0;
          #endif

          	is_zygote_child = is_zygote(old->security);
          	if (!is_zygote_child) {
          		pr_info("handle umount ignore non zygote child: %d\n",
          			current->pid);
          		return 0;
          	}

          	try_umount("/system", true, 0);
          	try_umount("/vendor", true, 0);
          	try_umount("/product", true, 0);
          	try_umount("/data/adb/modules", false, MNT_DETACH);
          	try_umount("/debug_ramdisk", false, MNT_DETACH);
          	try_umount("/sbin", false, MNT_DETACH);

          #ifdef CONFIG_KSU_SUSFS
          	ksu_schedule_susfs_extra_works();
          	susfs_set_current_proc_umounted();
          #endif

          	return 0;
          }'''
          data = data[:start] + replacement + data[end:]

          boot_old = '''		case EVENT_BOOT_COMPLETED: {
          			static bool boot_complete_lock = false;
          			if (!boot_complete_lock) {
          				boot_complete_lock = true;
          				pr_info("boot_complete triggered\\n");
          			}
          			break;
          		}
          '''
          boot_new = '''		case EVENT_BOOT_COMPLETED: {
          			static bool boot_complete_lock = false;
          			if (!boot_complete_lock) {
          				boot_complete_lock = true;
          				pr_info("boot_complete triggered\\n");
          #ifdef CONFIG_KSU_SUSFS
          				susfs_start_sdcard_monitor_fn();
          #endif
          			}
          			break;
          		}
          '''

          if data.count(boot_old) != 1:
              raise SystemExit("v0.9.5 boot completed anchor drifted")
          data = data.replace(boot_old, boot_new, 1)

          p.write_text(data, encoding="utf-8")

          print("V095_TASK_FIX_SETUID_SUSFS_BEHAVIOR=PASS")
          print("SECOND_COMPETING_SETRESUID_HOOK=NO")
          print("SDCARD_MONITOR_BOOT_COMPLETED=PASS")
          PY

      - name: Normalize reboot consumer hook for W63 dispatcher
        shell: bash
        run: |
          set -euo pipefail

          STAGE="$(cat "$DRIVER_DIR/kernel-stage.path")"

          STAGE="$STAGE" python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["STAGE"]) / "kernel/reboot.c"
          data = p.read_text(encoding="utf-8")

          call = 'ret = ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);'

          if call not in data:
              syscall_anchor = (
                  'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, '
                  'unsigned int, cmd,\n'
                  '\t\tvoid __user *, arg)\n'
              )
              if data.count(syscall_anchor) != 1:
                  raise SystemExit("reboot syscall anchor drifted")

              decl = (
                  '#ifdef CONFIG_KSU_SUSFS\n'
                  'extern int ksu_handle_sys_reboot(int magic1, int magic2, '
                  'unsigned int cmd, void __user **arg);\n'
                  '#endif\n\n'
              )
              data = data.replace(
                  syscall_anchor,
                  decl + syscall_anchor,
                  1,
              )

              body_anchor = '\tchar buffer[256];\n\tint ret = 0;\n'
              if data.count(body_anchor) != 1:
                  raise SystemExit("reboot body anchor drifted")

              hook = (
                  body_anchor
                  + '\n#ifdef CONFIG_KSU_SUSFS\n'
                  + '\tret = ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n'
                  + '\tif (ret)\n'
                  + '\t\tgoto ksu_susfs_orig_flow;\n'
                  + '\treturn ret;\n'
                  + 'ksu_susfs_orig_flow:\n'
                  + '#endif\n'
              )
              data = data.replace(body_anchor, hook, 1)

          if data.count(call) != 1:
              raise SystemExit(
                  f"unexpected reboot SUSFS dispatcher call count: {data.count(call)}"
              )

          p.write_text(data, encoding="utf-8")
          print("REBOOT_CONSUMER_HOOK=PASS")
          PY

      - name: Audit remaining external KSU compatibility references before full build
        shell: bash
        run: |
          set -euo pipefail

          STAGE="$(cat "$DRIVER_DIR/kernel-stage.path")"

          python3 - "$STAGE" "$ARTIFACT_DIR" <<'PY'
          import re
          import sys
          from pathlib import Path

          stage = Path(sys.argv[1])
          artifact = Path(sys.argv[2])

          roots = [
              stage / "fs",
              stage / "kernel",
              stage / "security",
              stage / "drivers/input",
              stage / "include",
              stage / "mm",
          ]

          refs = {}
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob("*"):
                  if not p.is_file() or p.suffix not in {".c", ".h"}:
                      continue
                  text = p.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )
                  for sym in re.findall(r"\bksu_[A-Za-z0-9_]+", text):
                      refs.setdefault(sym, set()).add(
                          str(p.relative_to(stage))
                      )

          ksu_root = stage / "KernelSU/kernel"
          provider_text = "\n".join(
              p.read_text(encoding="utf-8", errors="replace")
              for p in ksu_root.rglob("*")
              if p.is_file() and p.suffix in {".c", ".h"}
          )

          lines = []
          unresolved_candidates = []

          for sym in sorted(refs):
              provided = bool(
                  re.search(rf"\b{re.escape(sym)}\b", provider_text)
              )
              lines += [
                  f"SYMBOL={sym}",
                  f"PROVIDER_TEXT_PRESENT={'YES' if provided else 'NO'}",
                  "FILES=" + ",".join(sorted(refs[sym])),
                  "",
              ]
              if not provided:
                  unresolved_candidates.append(sym)

          (artifact / "PRELINK-KSU-REFERENCE-INVENTORY.txt").write_text(
              "\n".join(lines),
              encoding="utf-8",
          )
          (artifact / "PRELINK-KSU-PROVIDER-GAP-CANDIDATES.txt").write_text(
              "\n".join(unresolved_candidates) + (
                  "\n" if unresolved_candidates else ""
              ),
              encoding="utf-8",
          )

          print(
              "PRELINK_PROVIDER_GAP_CANDIDATES="
              + str(len(unresolved_candidates))
          )
          for sym in unresolved_candidates:
              print("PRELINK_GAP=" + sym)
          PY

          echo "PRELINK_REFERENCE_INVENTORY=PASS" \
            | tee "$ARTIFACT_DIR/PRELINK-INVENTORY-STATUS.txt"

      - name: Download official Android clang-r416183b for W64
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/toolchain/$CLANG_REVISION"
          mkdir -p "$GITHUB_WORKSPACE/toolchain/$CLANG_REVISION"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            "$CLANG_URL" \
            -o "$RUNNER_TEMP/${CLANG_REVISION}.tar.gz"

          tar \
            -xzf "$RUNNER_TEMP/${CLANG_REVISION}.tar.gz" \
            -C "$GITHUB_WORKSPACE/toolchain/$CLANG_REVISION"

          "$GITHUB_WORKSPACE/toolchain/$CLANG_REVISION/bin/clang" --version \
            | tee "$ARTIFACT_DIR/clang-version.txt"

          "$GITHUB_WORKSPACE/toolchain/$CLANG_REVISION/bin/ld.lld" --version \
            | tee -a "$ARTIFACT_DIR/clang-version.txt"

      - name: Resolve W64 config for original KSU v0.9.5 plus SUSFS 2.2
        shell: bash
        run: |
          set -euo pipefail

          STAGE="$(cat "$DRIVER_DIR/kernel-stage.path")"
          cd "$STAGE"

          export PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_REVISION/bin:$PATH"
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"

          rm -rf "$OUT_DIR"

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            veux_defconfig \
            2>&1 | tee "$ARTIFACT_DIR/config-initial.log"

          scripts/config --file "$OUT_DIR/.config" \
            -e THREAD_INFO_IN_TASK \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -e KSU_SUSFS_SUS_MAP \
            -d MODULES \
            -d KPROBES \
            -d KPROBE_EVENTS

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            olddefconfig \
            2>&1 | tee "$ARTIFACT_DIR/config-olddefconfig.log"

          for cfg in \
            CONFIG_THREAD_INFO_IN_TASK=y \
            CONFIG_KSU=y \
            CONFIG_KSU_SUSFS=y \
            CONFIG_KSU_SUSFS_SUS_PATH=y \
            CONFIG_KSU_SUSFS_SUS_MOUNT=y \
            CONFIG_KSU_SUSFS_SUS_KSTAT=y \
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
            CONFIG_KSU_SUSFS_ENABLE_LOG=y \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=y \
            CONFIG_KSU_SUSFS_SUS_MAP=y
          do
            grep -Fxq "$cfg" "$OUT_DIR/.config"
          done

          grep -Fxq '# CONFIG_MODULES is not set' "$OUT_DIR/.config"

          cp "$OUT_DIR/.config" "$ARTIFACT_DIR/w64-final.config"

          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_MODULES=n"
            echo "CONFIG_KPROBES=n_or_unavailable"
            echo "CONFIG_KPROBE_EVENTS=n_or_unavailable"
            echo "CONFIG_LTO_CLANG=$(grep -Fx 'CONFIG_LTO_CLANG=y' "$OUT_DIR/.config" >/dev/null && echo y || echo n)"
            echo "CONFIG_CONTRACT=PASS"
          } | tee "$ARTIFACT_DIR/CONFIG-CONTRACT.txt"

      - name: Provision Full-LTO runner memory guard
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=== before ==="
            free -h
            swapon --show || true
          } | tee "$ARTIFACT_DIR/memory-before.txt"

          if ! swapon --show=NAME --noheadings \
            | grep -Fxq /mnt/w64-extra-swap
          then
            sudo fallocate -l 16G /mnt/w64-extra-swap
            sudo chmod 600 /mnt/w64-extra-swap
            sudo mkswap /mnt/w64-extra-swap
            sudo swapon /mnt/w64-extra-swap
          fi

          sudo sysctl -w vm.swappiness=100 \
            | tee "$ARTIFACT_DIR/swappiness.txt"

          {
            echo "=== after ==="
            free -h
            swapon --show
          } | tee "$ARTIFACT_DIR/memory-after.txt"

      - name: Full vmlinux and Image link with KSU v0.9.5 plus SUSFS 2.2
        id: full_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          STAGE="$(cat "$DRIVER_DIR/kernel-stage.path")"
          cd "$STAGE"

          export PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_REVISION/bin:$PATH"
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"

          start="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          set +e
          make \
            -j1 \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            Image \
            2>&1 | tee "$ARTIFACT_DIR/full-build.log"
          rc=${PIPESTATUS[0]}
          set -e

          end="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          {
            echo "MAKE_EXIT_CODE=$rc"
            echo "BUILD_START=$start"
            echo "BUILD_END=$end"
          } | tee "$ARTIFACT_DIR/full-build-exit.txt"

          exit "$rc"

      - name: Record W64 full-build outcome and diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          STAGE="$(cat "$DRIVER_DIR/kernel-stage.path")"

          {
            echo "STEP_OUTCOME=${{ steps.full_build.outcome }}"
            echo "STEP_CONCLUSION=${{ steps.full_build.conclusion }}"
            echo "LANE=${{ matrix.id }}"
          } | tee "$ARTIFACT_DIR/full-build-step-outcome.txt"

          if [ -f "$ARTIFACT_DIR/full-build.log" ]; then
            grep -E \
              'undefined symbol:|ld\.lld: error:|(^|[^[:alpha:]])error:|Error [0-9]+' \
              "$ARTIFACT_DIR/full-build.log" \
              | tail -n 250 \
              > "$ARTIFACT_DIR/full-build-error-summary.txt" \
              || true

            grep -oE \
              'undefined symbol: [A-Za-z0-9_]+' \
              "$ARTIFACT_DIR/full-build.log" \
              | sed 's/^undefined symbol: //' \
              | LC_ALL=C sort -u \
              > "$ARTIFACT_DIR/undefined-symbols.txt" \
              || true

            tail -n 400 "$ARTIFACT_DIR/full-build.log" \
              > "$ARTIFACT_DIR/full-build-tail.txt"
          fi

          if [ -f "$STAGE/$OUT_DIR/arch/arm64/boot/Image" ]; then
            sha256sum \
              "$STAGE/$OUT_DIR/arch/arm64/boot/Image" \
              > "$ARTIFACT_DIR/Image.sha256"
          fi

          if [ -f "$STAGE/$OUT_DIR/vmlinux" ]; then
            sha256sum "$STAGE/$OUT_DIR/vmlinux" \
              > "$ARTIFACT_DIR/vmlinux.sha256"
          fi

          if [ -f "$STAGE/$OUT_DIR/System.map" ]; then
            sha256sum "$STAGE/$OUT_DIR/System.map" \
              > "$ARTIFACT_DIR/System.map.sha256"
          fi

          exit 0

      - name: Verify successful W64 full link
        if: ${{ steps.full_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          STAGE="$(cat "$DRIVER_DIR/kernel-stage.path")"

          IMAGE="$STAGE/$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX="$STAGE/$OUT_DIR/vmlinux"
          SYSTEM_MAP="$STAGE/$OUT_DIR/System.map"
          CONFIG="$STAGE/$OUT_DIR/.config"

          test -s "$IMAGE"
          test -s "$VMLINUX"
          test -s "$SYSTEM_MAP"
          test -s "$CONFIG"

          grep -Fxq 'MAKE_EXIT_CODE=0' \
            "$ARTIFACT_DIR/full-build-exit.txt"

          grep -Fq -- '-- KernelSU version: 11872' \
            "$ARTIFACT_DIR/full-build.log"

          grep -Fxq 'CONFIG_KSU=y' "$CONFIG"
          grep -Fxq 'CONFIG_KSU_SUSFS=y' "$CONFIG"

          ! grep -Fq 'undefined symbol:' \
            "$ARTIFACT_DIR/full-build.log"

          grep -Fq \
            'synchronize_srcu(&susfs_srcu_open_redirect)' \
            "$STAGE/fs/susfs.c"

          grep -Fq \
            'ksu_setup_selinux_cred("u:r:su:s0", cred)' \
            "$STAGE/fs/susfs.c"

          ! grep -q \
            'ksu_handle_setresuid' \
            "$STAGE/kernel/sys.c"

          {
            echo "W64_FULL_LINK=PASS"
            echo "LANE=${{ matrix.id }}"
            echo "KERNEL_VERSION=${{ matrix.kernel_version }}"
            echo "KSU_VERSION=11872"
            echo "SUSFS_VERSION=2.2.0"
            echo "PROVEN_SUSFS_HOOK_RECIPE=${{ matrix.source_recipe }}"
            echo "FINAL_ROOT_MANAGER=ORIGINAL_KERNELSU_V0_9_5"
            echo "VMLINUX_FINAL_LINK=PASS"
            echo "IMAGE_BUILD=PASS"
            echo "IMAGE_BYTES=$(stat -c '%s' "$IMAGE")"
            echo "IMAGE_SHA256=$(sha256sum "$IMAGE" | awk '{print $1}')"
            echo "VMLINUX_SHA256=$(sha256sum "$VMLINUX" | awk '{print $1}')"
            echo "SYSTEM_MAP_SHA256=$(sha256sum "$SYSTEM_MAP" | awk '{print $1}')"
            echo "CONFIG_SHA256=$(sha256sum "$CONFIG" | awk '{print $1}')"
            echo "OPEN_REDIRECT_SRCU_FIX_PRESERVED=YES"
            echo "V095_DOMAIN=u:r:su:s0"
            echo "SECOND_COMPETING_SETRESUID_HOOK=NO"
            echo "W64_V2_WORKTREE_GITDIR_TYPE_BUG_CORRECTED=YES"
            echo "W64_V2_PROVEN_FSNOTIFY_COMPAT_RECOGNITION_BUG_CORRECTED=YES"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } | tee "$ARTIFACT_DIR/FINAL-STATUS.txt"

          cp "$IMAGE" "$ARTIFACT_DIR/Image"
          cp "$SYSTEM_MAP" "$ARTIFACT_DIR/System.map"

      - name: Export W64 source delta and failure-safe status
        if: always()
        shell: bash
        run: |
          set +e

          STAGE="$(cat "$DRIVER_DIR/kernel-stage.path")"

          git -C "$STAGE" diff --binary \
            > "$ARTIFACT_DIR/W64-final-source-diff.patch" \
            2>/dev/null || true

          if [ -d "$STAGE/KernelSU/.git" ]; then
            git -C "$STAGE/KernelSU" diff --binary \
              > "$ARTIFACT_DIR/W64-KernelSU-v095-bridge.patch" \
              2>/dev/null || true
          fi

          if [ ! -f "$ARTIFACT_DIR/FINAL-STATUS.txt" ]; then
            {
              echo "W64_FULL_LINK=FAIL_OR_INCOMPLETE"
              echo "LANE=${{ matrix.id }}"
              echo "KERNEL_VERSION=${{ matrix.kernel_version }}"
              echo "FULL_BUILD_STEP_OUTCOME=${{ steps.full_build.outcome }}"
              echo "PROVEN_SUSFS_HOOK_RECIPE=${{ matrix.source_recipe }}"
              echo "FINAL_ROOT_MANAGER=ORIGINAL_KERNELSU_V0_9_5"
              echo "BOOT_IMAGE_CREATED=NO"
              echo "FLASHABLE_ZIP_CREATED=NO"
              echo "DEVICE_ACCESSED=NO"
              echo "FLASHING_PERFORMED=NO"
            } > "$ARTIFACT_DIR/FAILURE-STATUS.txt"
          fi

          {
            echo "PRE_MANIFEST_JOB_STATUS=${{ job.status }}"
            echo "FULL_BUILD_STEP_OUTCOME=${{ steps.full_build.outcome }}"
            echo "UPLOAD_HIDDEN_FILES=YES"
            echo "SHA256SUMS_WILL_BE_FINAL_ARTIFACT_MUTATION=YES"
            echo "NO_ARTIFACT_FILE_MAY_CHANGE_AFTER_MANIFEST=YES"
          } > "$ARTIFACT_DIR/MANIFEST-CONTRACT.txt"

          exit 0

      - name: Create final W64 artifact SHA256 manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          cd "$ARTIFACT_DIR"
          : > SHA256SUMS.txt

          while IFS= read -r -d '' file; do
            rel="${file#./}"
            [ "$rel" = "SHA256SUMS.txt" ] && continue
            sha256sum "$rel" >> SHA256SUMS.txt
          done < <(find . -type f -print0 | sort -z)

          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload W64 full-link artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W64-v3-v095-SUSFS220-proven-hook-full-link-${{ matrix.id }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 0

      - name: Fail after preserving W64 diagnostics
        if: ${{ steps.full_build.outcome != 'success' }}
        shell: bash
        run: |
          echo "W64-v3 full vmlinux/Image link did not complete successfully."
          exit 1
