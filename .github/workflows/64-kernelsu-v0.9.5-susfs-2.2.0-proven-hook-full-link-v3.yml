name: 64 - KernelSU v0.9.5 + SUSFS 2.2.0 Proven Hook Full Link v3

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w64-v3-v095-susfs220-proven-hook-full-link-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-link:
    name: W64 v3 ${{ matrix.id }} proven-hook full link
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-5_4_274
            kernel_version: "5.4.274"
            source_recipe: "46C7"
            recipe_path: ".github/workflows/46C7-final-cumulative-resukisu-susfs-deterministic-cross-run-reference.yml"
            recipe_job: "full-build"
            recipe_stop_step: "27"
            source_proven_nofault_fix: "no"
          - id: linux-5_4_302
            kernel_version: "5.4.302"
            source_recipe: "W43-v2"
            recipe_path: ".github/workflows/43-gen2-5.4.302-resukisu-upstream-update-full-build-v2.yml"
            recipe_job: "build"
            recipe_stop_step: "72"
            source_proven_nofault_fix: "yes"

    env:
      KSU_REPOSITORY: tiann/KernelSU
      KSU_REF: b766b98513b5a7eb33bc1c4a76b5702bf1288f07
      KSU_EXPECTED_VERSION: "11872"
      KSU_302_SOURCE_FIX_COMMIT: 3993167ca932b05b4bab1ce2168bd5c4777db640

      SUSFS_EXPECTED_VERSION: "2.2.0"
      CLANG_REVISION: r416183b
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz

      BUILDER_DIR: ${{ github.workspace }}/builder-repo
      DRIVER_DIR: ${{ github.workspace }}/w64-driver
      ARTIFACT_DIR: ${{ github.workspace }}/w64-artifact
      OUT_DIR: out-w64

      KBUILD_BUILD_USER: w64
      KBUILD_BUILD_HOST: veux-w64
      KBUILD_BUILD_TIMESTAMP: "Tue Aug 25 00:00:00 UTC 2026"
      KBUILD_BUILD_VERSION: "1"
      SOURCE_DATE_EPOCH: "1787616000"
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Initialize W64 full-link artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$DRIVER_DIR" "$ARTIFACT_DIR"
          mkdir -p "$DRIVER_DIR" "$ARTIFACT_DIR"

          {
            echo "W64_VERSION=v3"
            echo "LANE=${{ matrix.id }}"
            echo "KERNEL_VERSION=${{ matrix.kernel_version }}"
            echo "SOURCE_RECIPE=${{ matrix.source_recipe }}"
            echo "SOURCE_RECIPE_PATH=${{ matrix.recipe_path }}"
            echo "SOURCE_RECIPE_STOP_STEP=${{ matrix.recipe_stop_step }}"
            echo "KSU_REF=$KSU_REF"
            echo "KSU_VERSION=$KSU_EXPECTED_VERSION"
            echo "SUSFS_VERSION=$SUSFS_EXPECTED_VERSION"
            echo "PURPOSE=FIRST_FULL_VMLINUX_IMAGE_LINK_ORIGINAL_KSU_V095_PLUS_SUSFS220"
            echo "PROVEN_5_4_SUSFS_HOOK_RECIPE_REUSED=YES"
            echo "W64_V1_LITERAL_EXPRESSION_OPENER_BUG=CORRECTED"
            echo "W64_V2_WORKTREE_GITDIR_TYPE_BUG=CORRECTED"
            echo "W64_V2_PROVEN_FSNOTIFY_COMPAT_RECOGNITION_BUG=CORRECTED"
            echo "FINAL_ROOT_MANAGER=ORIGINAL_KERNELSU_V0_9_5"
            echo "RESUKISU_FINAL_DRIVER_TREE=NO"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } | tee "$ARTIFACT_DIR/W64-HEADER.txt"

      - name: Install W64 dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            flex \
            git \
            jq \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            patch \
            python3 \
            python3-pip \
            rsync \
            xz-utils \
            zstd

          python3 -m pip install \
            --disable-pip-version-check \
            --no-input \
            'PyYAML==6.0.2'

          python3 - <<'PY'
          import yaml
          assert yaml.__version__ == "6.0.2"
          print("PYYAML_VERSION=6.0.2")
          PY

      - name: Checkout builder repository with proven recipes
        uses: actions/checkout@v6
        with:
          path: builder-repo
          fetch-depth: 0

      - name: Checkout immutable original KernelSU v0.9.5
        uses: actions/checkout@v6
        with:
          repository: ${{ env.KSU_REPOSITORY }}
          ref: ${{ env.KSU_REF }}
          path: KernelSU-v095-clean
          fetch-depth: 0

      - name: Authenticate W64 recipe and KSU identities
        shell: bash
        run: |
          set -euo pipefail

          RECIPE="$BUILDER_DIR/${{ matrix.recipe_path }}"
          test -s "$RECIPE"

          case "${{ matrix.source_recipe }}" in
            46C7)
              grep -Fxq \
                'name: 46C7 - VEUX Final Cumulative ReSukiSU SUSFS Deterministic Cross-Run Reference' \
                "$RECIPE"
              ;;
            W43-v2)
              grep -Fxq \
                'name: 43 - GEN2 5.4.302 ReSukiSU Upstream Update Full Build v2' \
                "$RECIPE"
              ;;
            *)
              echo "unknown recipe lane" >&2
              exit 1
              ;;
          esac

          test "$(git -C KernelSU-v095-clean rev-parse HEAD)" = "$KSU_REF"

          count="$(git -C KernelSU-v095-clean rev-list --count HEAD)"
          version="$((10000 + count + 200))"
          test "$version" = "$KSU_EXPECTED_VERSION"

          {
            echo "RECIPE_SHA256=$(sha256sum "$RECIPE" | awk '{print $1}')"
            echo "KSU_HEAD=$(git -C KernelSU-v095-clean rev-parse HEAD)"
            echo "KSU_VERSION=$version"
            echo "SOURCE_IDENTITY=PASS"
          } | tee "$ARTIFACT_DIR/SOURCE-IDENTITY.txt"

      - name: Write generic proven-recipe staging driver
        shell: bash
        run: |
          set -euo pipefail

          cat > "$DRIVER_DIR/run_recipe_until.py" <<'PY'
          import os
          import re
          import shlex
          import subprocess
          from pathlib import Path

          import yaml


          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          builder = Path(os.environ["BUILDER_DIR"]).resolve()
          artifact = Path(os.environ["ARTIFACT_DIR"]).resolve()

          recipe_rel = os.environ["W64_RECIPE_PATH"]
          recipe_job = os.environ["W64_RECIPE_JOB"]
          stop_step = int(os.environ["W64_RECIPE_STOP_STEP"])
          lane = os.environ["W64_LANE"]

          recipe_path = builder / recipe_rel
          recipe_text = recipe_path.read_text(encoding="utf-8")
          recipe = yaml.load(recipe_text, Loader=yaml.BaseLoader)
          job = recipe["jobs"][recipe_job]

          dynamic_env_file = Path(os.environ["DRIVER_DIR"]) / "recipe-github-env.txt"
          dynamic_path_file = Path(os.environ["DRIVER_DIR"]) / "recipe-github-path.txt"
          dynamic_env_file.write_text("", encoding="utf-8")
          dynamic_path_file.write_text("", encoding="utf-8")

          env = dict(os.environ)
          env["GITHUB_ENV"] = str(dynamic_env_file)
          env["GITHUB_PATH"] = str(dynamic_path_file)

          expression_open = "$" + "{{"

          def marker(name):
              return "$" + "{{ " + name + " }}"

          def resolve(value):
              value = str(value)

              replacements = {
                  marker("github.workspace"): str(workspace),
                  marker("runner.temp"): env["RUNNER_TEMP"],
                  marker("github.repository"): env.get("GITHUB_REPOSITORY", ""),
                  marker("github.sha"): env.get("GITHUB_SHA", ""),
                  marker("github.ref"): env.get("GITHUB_REF", ""),
                  marker("github.token"): env.get("GITHUB_TOKEN", ""),
              }

              for src, dst in replacements.items():
                  value = value.replace(src, dst)

              def repl_env(match):
                  key = match.group(1)
                  return env.get(key, "")

              value = re.sub(
                  r"\$\{\{\s*env\.([A-Za-z_][A-Za-z0-9_]*)\s*\}\}",
                  repl_env,
                  value,
              )
              return value

          for key, value in job.get("env", {}).items():
              env[str(key)] = resolve(value)

          seen_env_lines = 0
          seen_path_lines = 0

          def absorb_github_files():
              global seen_env_lines, seen_path_lines

              lines = dynamic_env_file.read_text(
                  encoding="utf-8"
              ).splitlines()

              i = seen_env_lines
              while i < len(lines):
                  line = lines[i]
                  if "<<" in line:
                      key, delim = line.split("<<", 1)
                      key = key.strip()
                      delim = delim.strip()
                      i += 1
                      values = []
                      while i < len(lines) and lines[i] != delim:
                          values.append(lines[i])
                          i += 1
                      if i >= len(lines):
                          raise SystemExit(
                              f"unterminated GITHUB_ENV multiline for {key}"
                          )
                      env[key] = "\n".join(values)
                  elif "=" in line:
                      key, value = line.split("=", 1)
                      env[key] = value
                  elif line.strip():
                      raise SystemExit(
                          f"unsupported GITHUB_ENV line: {line!r}"
                      )
                  i += 1

              seen_env_lines = len(lines)

              path_lines = dynamic_path_file.read_text(
                  encoding="utf-8"
              ).splitlines()
              new_paths = [
                  p for p in path_lines[seen_path_lines:] if p.strip()
              ]
              if new_paths:
                  env["PATH"] = ":".join(
                      list(reversed(new_paths))
                      + [env.get("PATH", "")]
                  )
              seen_path_lines = len(path_lines)

          def run(args, cwd=None):
              print(
                  "+",
                  " ".join(shlex.quote(str(x)) for x in args),
                  flush=True,
              )
              cp = subprocess.run(
                  [str(x) for x in args],
                  cwd=str(cwd) if cwd else None,
                  env=env,
              )
              if cp.returncode:
                  raise subprocess.CalledProcessError(
                      cp.returncode,
                      args,
                  )

          def checkout_action(step):
              cfg = step.get("with", {})
              repo = resolve(
                  cfg.get(
                      "repository",
                      env.get("GITHUB_REPOSITORY", ""),
                  )
              )
              ref = resolve(cfg.get("ref", "main"))
              rel = resolve(cfg.get("path", "."))

              if any(expression_open in x for x in (repo, ref, rel)):
                  raise SystemExit(
                      f"unresolved checkout expression: {repo=} {ref=} {rel=}"
                  )

              dest = workspace if rel in ("", ".") else workspace / rel
              if dest == workspace:
                  raise SystemExit(
                      "recipe attempted checkout into W64 workspace root"
                  )

              if dest.exists():
                  run(["rm", "-rf", str(dest)])

              run(
                  [
                      "git",
                      "clone",
                      "--no-tags",
                      f"https://github.com/{repo}.git",
                      str(dest),
                  ]
              )
              run(
                  [
                      "git",
                      "fetch",
                      "--no-tags",
                      "origin",
                      ref,
                  ],
                  cwd=dest,
              )
              run(
                  ["git", "checkout", "--detach", "FETCH_HEAD"],
                  cwd=dest,
              )

              if cfg.get("fetch-depth") == "0":
                  shallow = dest / ".git" / "shallow"
                  if shallow.exists():
                      run(["git", "fetch", "--unshallow"], cwd=dest)

          status_lines = [
              f"LANE={lane}",
              f"RECIPE={recipe_rel}",
              f"JOB={recipe_job}",
              f"STOP_STEP={stop_step}",
          ]

          for index, step in enumerate(job["steps"], 1):
              if index > stop_step:
                  break

              name = step.get("name", f"step-{index}")
              uses = step.get("uses")

              print(
                  f"\n===== W64 RECIPE STEP {index}: {name} =====",
                  flush=True,
              )

              if uses:
                  if uses.startswith("actions/checkout@"):
                      checkout_action(step)
                      status_lines.append(
                          f"STEP_{index}=CHECKOUT_PASS:{name}"
                      )
                      continue
                  raise SystemExit(
                      f"unsupported action before stop step: {uses}"
                  )

              if "run" not in step:
                  raise SystemExit(
                      f"unsupported recipe step shape at {index}: {name}"
                  )

              script = resolve(step["run"])
              if expression_open in script:
                  raise SystemExit(
                      f"unresolved GitHub expression in step {index}: {name}"
                  )

              step_env = dict(env)
              for key, value in step.get("env", {}).items():
                  step_env[str(key)] = resolve(value)

              workdir = step.get("working-directory")
              cwd = workspace
              if workdir:
                  resolved = resolve(workdir)
                  cwd = (
                      Path(resolved)
                      if Path(resolved).is_absolute()
                      else workspace / resolved
                  )

              script_path = (
                  Path(os.environ["DRIVER_DIR"])
                  / f"recipe-step-{index:03d}.sh"
              )
              script_path.write_text(script, encoding="utf-8")

              cp = subprocess.run(
                  ["bash", str(script_path)],
                  cwd=str(cwd),
                  env=step_env,
              )
              if cp.returncode:
                  raise SystemExit(
                      f"recipe step failed: {index} {name} rc={cp.returncode}"
                  )

              absorb_github_files()
              status_lines.append(
                  f"STEP_{index}=RUN_PASS:{name}"
              )

          if lane == "linux-5_4_274":
              stage = workspace / "kernel"
          elif lane == "linux-5_4_302":
              stage_path_file = workspace / "kernel-simulation.path"
              if not stage_path_file.is_file():
                  raise SystemExit(
                      "kernel-simulation.path missing after W43 staging"
                  )
              stage = Path(
                  stage_path_file.read_text(encoding="utf-8").strip()
              )
          else:
              raise SystemExit(f"unknown lane: {lane}")

          if not (stage / "Makefile").is_file():
              raise SystemExit(f"staged kernel root invalid: {stage}")

          status_lines += [
              f"STAGE_PATH={stage}",
              "RECIPE_STAGING=PASS",
          ]

          (Path(os.environ["DRIVER_DIR"]) / "kernel-stage.path").write_text(
              str(stage) + "\n",
              encoding="utf-8",
          )
          (artifact / "PROVEN-RECIPE-STAGING.txt").write_text(
              "\n".join(status_lines) + "\n",
              encoding="utf-8",
          )

          print("\n".join(status_lines))
          PY

          python3 -m py_compile "$DRIVER_DIR/run_recipe_until.py"

          {
            echo "RECIPE_DRIVER_PY_COMPILE=PASS"
            echo "RECIPE_DRIVER_MODE=EXECUTE_PROVEN_SOURCE_RECIPE_UNTIL_PREBUILD_BOUNDARY"
          } | tee "$ARTIFACT_DIR/RECIPE-DRIVER-IDENTITY.txt"

      - name: Stage proven per-lane SUSFS kernel source state
        shell: bash
        env:
          W64_LANE: ${{ matrix.id }}
          W64_RECIPE_PATH: ${{ matrix.recipe_path }}
          W64_RECIPE_JOB: ${{ matrix.recipe_job }}
          W64_RECIPE_STOP_STEP: ${{ matrix.recipe_stop_step }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 "$DRIVER_DIR/run_recipe_until.py"

          STAGE="$(cat "$DRIVER_DIR/kernel-stage.path")"

          test "$(
            git -C "$STAGE" rev-parse --is-inside-work-tree
          )" = "true"

          git -C "$STAGE" rev-parse --git-dir             | tee "$ARTIFACT_DIR/staged-kernel-git-dir.txt"

          test "$(make -s -C "$STAGE" kernelversion)" = "${{ matrix.kernel_version }}"
          test -f "$STAGE/fs/susfs.c"
          test -f "$STAGE/include/linux/susfs.h"
          test -f "$STAGE/include/linux/susfs_def.h"

          {
            echo "STAGE=$STAGE"
            echo "KERNEL_VERSION=$(make -s -C "$STAGE" kernelversion)"
            echo "SUSFS_C_SHA256=$(sha256sum "$STAGE/fs/susfs.c" | awk '{print $1}')"
            echo "PROVEN_HOOK_STAGE=PASS"
          } | tee "$ARTIFACT_DIR/PROVEN-HOOK-STAGE.txt"

      - name: Snapshot proven stage before root-manager swap
        shell: bash
        run: |
          set -euo pipefail

          STAGE="$(cat "$DRIVER_DIR/kernel-stage.path")"

          git -C "$STAGE" status --short \
            > "$ARTIFACT_DIR/proven-stage-git-status.txt"

          git -C "$STAGE" diff --binary \
            > "$ARTIFACT_DIR/proven-stage-before-v095.diff"

          {
            echo "PROVEN_STAGE_HEAD=$(git -C "$STAGE" rev-parse HEAD)"
            echo "PROVEN_STAGE_TREE=$(git -C "$STAGE" write-tree)"
            echo "PROVEN_STAGE_DIRTY_FILE_COUNT=$(git -C "$STAGE" status --short | wc -l | tr -d ' ')"
            echo "SNAPSHOT_BEFORE_V095_SWAP=PASS"
          } | tee "$ARTIFACT_DIR/PROVEN-STAGE-IDENTITY.txt"

      - name: Replace final ReSukiSU tree with original KernelSU v0.9.5
        shell: bash
        run: |
          set -euo pipefail

          STAGE="$(cat "$DRIVER_DIR/kernel-stage.path")"

          rm -rf "$STAGE/KernelSU"
          cp -a "$GITHUB_WORKSPACE/KernelSU-v095-clean" "$STAGE/KernelSU"

          rm -rf "$STAGE/drivers/kernelsu"
          ln -s ../KernelSU/kernel "$STAGE/drivers/kernelsu"

          test "$(git -C "$STAGE/KernelSU" rev-parse HEAD)" = "$KSU_REF"

          count="$(git -C "$STAGE/KernelSU" rev-list --count HEAD)"
          version="$((10000 + count + 200))"
          test "$version" = "$KSU_EXPECTED_VERSION"

          test "$(readlink "$STAGE/drivers/kernelsu")" = "../KernelSU/kernel"

          test "$(grep -Fc 'source "drivers/kernelsu/Kconfig"' "$STAGE/drivers/Kconfig")" -eq 1
          test "$(grep -Ec 'obj-\$\(CONFIG_KSU\).*kernelsu/' "$STAGE/drivers/Makefile")" -eq 1

          {
            echo "FINAL_KSU_HEAD=$(git -C "$STAGE/KernelSU" rev-parse HEAD)"
            echo "FINAL_KSU_VERSION=$version"
            echo "DRIVERS_KERNELSU_SYMLINK=PASS"
            echo "FINAL_RESUKISU_TREE=REMOVED"
            echo "ROOT_MANAGER_SWAP=PASS"
          } | tee "$ARTIFACT_DIR/ROOT-MANAGER-SWAP.txt"

      - name: Apply source-proven 5.4.302 nofault compatibility
        if: ${{ matrix.source_proven_nofault_fix == 'yes' }}
        shell: bash
        run: |
          set -euo pipefail

          STAGE="$(cat "$DRIVER_DIR/kernel-stage.path")"
          target="$STAGE/KernelSU/kernel/kernel_compat.c"

          git -C "$STAGE" cat-file -e "${KSU_302_SOURCE_FIX_COMMIT}^{commit}"
          git -C "$STAGE" merge-base --is-ancestor \
            "$KSU_302_SOURCE_FIX_COMMIT" \
            f4b8a13a43a130a9aab83cc985ce4d4421291ae6

          old='#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 8, 0)'
          new='#if 1 || LINUX_VERSION_CODE >= KERNEL_VERSION(5, 8, 0)'

          test "$(grep -Fxc "$old" "$target" || true)" = "1"

          python3 - "$target" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          data = p.read_text(encoding="utf-8")
          old = "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 8, 0)"
          new = "#if 1 || LINUX_VERSION_CODE >= KERNEL_VERSION(5, 8, 0)"
          if data.count(old) != 1:
              raise SystemExit("unexpected nofault baseline")
          p.write_text(data.replace(old, new, 1), encoding="utf-8")
          PY

          grep -Fqx "$new" "$target"

          echo "SOURCE_PROVEN_302_NOFAULT_COMPAT=PASS" \
            | tee "$ARTIFACT_DIR/NOFAULT-COMPAT.txt"

      - name: Apply W63-v7 direct ABI and lifecycle bridge to v0.9.5
        shell: bash
        run: |
          set -euo pipefail

          STAGE="$(cat "$DRIVER_DIR/kernel-stage.path")"

          STAGE="$STAGE" python3 - <<'PY'
          import os
          from pathlib import Path

          stage = Path(os.environ["STAGE"])
          root = stage / "KernelSU"
          ksu_c = root / "kernel/ksu.c"
          ksu_h = root / "kernel/ksu.h"
          ksud_c = root / "kernel/ksud.c"
          selinux_c = root / "kernel/selinux/selinux.c"
          selinux_h = root / "kernel/selinux/selinux.h"
          kconfig = root / "kernel/Kconfig"
          makefile = root / "kernel/Makefile"

          def read(p):
              return p.read_text(encoding="utf-8")

          def write(p, data):
              p.write_text(data, encoding="utf-8")

          data = read(ksu_c)

          inc = '#include <linux/workqueue.h>\n'
          if data.count(inc) != 1:
              raise SystemExit("ksu.c workqueue include anchor drifted")
          data = data.replace(
              inc,
              inc + '#include <linux/cred.h>\n',
              1,
          )

          global_anchor = 'static struct workqueue_struct *ksu_workqueue;\n'
          if data.count(global_anchor) != 1:
              raise SystemExit("ksu.c workqueue global anchor drifted")
          data = data.replace(
              global_anchor,
              global_anchor
              + '\n#ifdef CONFIG_KSU_SUSFS\n'
              + 'struct cred *ksu_cred;\n'
              + '#endif\n',
              1,
          )

          init_anchor = '\tksu_core_init();\n'
          if data.count(init_anchor) != 1:
              raise SystemExit("ksu.c core init anchor drifted")
          data = data.replace(
              init_anchor,
              '#ifdef CONFIG_KSU_SUSFS\n'
              '\tksu_cred = prepare_creds();\n'
              '\tif (!ksu_cred) {\n'
              '\t\tpr_err("prepare SUSFS credential failed!\\n");\n'
              '\t\treturn -ENOMEM;\n'
              '\t}\n'
              '#endif\n\n'
              '\tksu_core_init();\n',
              1,
          )

          include_anchor = '#include "throne_tracker.h"\n'
          if data.count(include_anchor) != 1:
              raise SystemExit("ksu.c throne include anchor drifted")
          data = data.replace(
              include_anchor,
              include_anchor
              + '\n#ifdef CONFIG_KSU_SUSFS\n'
              + 'extern void susfs_init(void);\n'
              + '#endif\n',
              1,
          )

          workq_anchor = (
              '\tksu_workqueue = alloc_ordered_workqueue('
              '"kernelsu_work_queue", 0);\n'
          )
          if data.count(workq_anchor) != 1:
              raise SystemExit("ksu.c workqueue init anchor drifted")
          data = data.replace(
              workq_anchor,
              workq_anchor
              + '\n#ifdef CONFIG_KSU_SUSFS\n'
              + '\tsusfs_init();\n'
              + '#endif\n',
              1,
          )

          exit_anchor = '\tksu_core_exit();\n'
          if data.count(exit_anchor) != 1:
              raise SystemExit("ksu.c exit anchor drifted")
          data = data.replace(
              exit_anchor,
              '\tksu_core_exit();\n\n'
              '#ifdef CONFIG_KSU_SUSFS\n'
              '\tif (ksu_cred) {\n'
              '\t\tput_cred(ksu_cred);\n'
              '\t\tksu_cred = NULL;\n'
              '\t}\n'
              '#endif\n',
              1,
          )
          write(ksu_c, data)

          data = read(ksu_h)
          anchor = '#include <linux/workqueue.h>\n'
          if data.count(anchor) != 1:
              raise SystemExit("ksu.h workqueue anchor drifted")
          data = data.replace(
              anchor,
              anchor
              + '\n#ifdef CONFIG_KSU_SUSFS\n'
              + 'struct cred;\n'
              + 'extern struct cred *ksu_cred;\n'
              + '#endif\n',
              1,
          )
          write(ksu_h, data)

          data = read(selinux_h)
          anchor = '#include "linux/version.h"\n'
          if data.count(anchor) != 1:
              raise SystemExit("selinux.h version include anchor drifted")
          data = data.replace(
              anchor,
              anchor
              + '\n#ifdef CONFIG_KSU_SUSFS\n'
              + 'struct cred;\n'
              + '#endif\n',
              1,
          )

          decl = 'void setup_selinux(const char *);\n'
          if data.count(decl) != 1:
              raise SystemExit("selinux.h setup_selinux anchor drifted")
          data = data.replace(
              decl,
              decl
              + '#ifdef CONFIG_KSU_SUSFS\n'
              + 'int ksu_setup_selinux_cred(const char *, struct cred *);\n'
              + 'void ksu_setup_susfs_cred(void);\n'
              + 'bool susfs_is_current_ksu_domain(void);\n'
              + '#endif\n',
              1,
          )
          write(selinux_h, data)

          data = read(selinux_c)
          anchor = '#include "linux/version.h"\n'
          if data.count(anchor) != 1:
              raise SystemExit("selinux.c version include anchor drifted")
          data = data.replace(
              anchor,
              anchor + '#include "../ksu.h"\n',
              1,
          )

          insertion = '\nvoid setenforce(bool enforce)\n'
          if data.count(insertion) != 1:
              raise SystemExit("selinux.c setenforce anchor drifted")

          helper = r'''
          #ifdef CONFIG_KSU_SUSFS
          int ksu_setup_selinux_cred(const char *domain, struct cred *cred)
          {
          	struct task_security_struct *tsec;
          	u32 sid;
          	int error;

          	if (!cred)
          		return -EINVAL;

          	tsec = selinux_cred(cred);
          	if (!tsec)
          		return -EINVAL;

          	error = security_secctx_to_secid(domain, strlen(domain), &sid);
          	if (error)
          		return error;

          	tsec->sid = sid;
          	tsec->create_sid = 0;
          	tsec->keycreate_sid = 0;
          	tsec->sockcreate_sid = 0;
          	return 0;
          }

          void ksu_setup_susfs_cred(void)
          {
          	int error;

          	if (!ksu_cred) {
          		pr_err("SUSFS credential is NULL\n");
          		return;
          	}

          	error = ksu_setup_selinux_cred(KERNEL_SU_DOMAIN, ksu_cred);
          	if (error)
          		pr_err("setup SUSFS credential failed: %d\n", error);
          }

          bool susfs_is_current_ksu_domain(void)
          {
          	return is_ksu_domain();
          }
          #endif

          '''
          data = data.replace(
              insertion,
              '\n' + helper + 'void setenforce(bool enforce)\n',
              1,
          )
          write(selinux_c, data)

          data = read(ksud_c)
          output = []
          count = 0
          for line in data.splitlines(keepends=True):
              output.append(line)
              if line.strip() == 'apply_kernelsu_rules();':
                  indent = line[:len(line) - len(line.lstrip())]
                  output.append(
                      '#ifdef CONFIG_KSU_SUSFS\n'
                      + indent
                      + 'ksu_setup_susfs_cred();\n'
                      + '#endif\n'
                  )
                  count += 1
          if count != 3:
              raise SystemExit(
                  f"expected three v0.9.5 policy apply sites, got {count}"
              )
          write(ksud_c, ''.join(output))

          data = read(kconfig)
          final = '\nendmenu\n'
          if data.count(final) != 1:
              raise SystemExit("KSU v0.9.5 Kconfig endmenu anchor drifted")

          block = r'''
          menu "KernelSU - SUSFS"

          config KSU_SUSFS
          	bool "KernelSU addon - SUSFS"
          	depends on KSU
          	depends on THREAD_INFO_IN_TASK
          	default y

          config KSU_SUSFS_SUS_PATH
          	bool "Enable SUS_PATH"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_MOUNT
          	bool "Enable SUS_MOUNT"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_KSTAT
          	bool "Enable SUS_KSTAT"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SPOOF_UNAME
          	bool "Enable uname spoofing"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_ENABLE_LOG
          	bool "Enable SUSFS kernel logging"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          	bool "Enable KSU/SUSFS symbol hiding"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	bool "Enable cmdline/bootconfig spoofing"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_OPEN_REDIRECT
          	bool "Enable OPEN_REDIRECT"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_MAP
          	bool "Enable SUS_MAP"
          	depends on KSU_SUSFS
          	default y

          endmenu
          '''
          data = data.replace(final, '\n' + block + '\nendmenu\n', 1)
          write(kconfig, data)

          data = read(makefile)
          anchor = 'kernelsu-objs += core_hook.o\n'
          if data.count(anchor) != 1:
              raise SystemExit("KSU v0.9.5 Makefile core_hook anchor drifted")
          data = data.replace(
              anchor,
              anchor + 'kernelsu-objs += susfs_bridge.o\n',
              1,
          )
          write(makefile, data)

          bridge = root / "kernel/susfs_bridge.c"
          bridge.write_text(r'''#include <linux/cred.h>
          #include <linux/errno.h>
          #include <linux/types.h>
          #include <linux/uaccess.h>

          #include "ksu.h"

