      - name: Freeze P4 safe filename bridge checkpoint
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          git add fs/stat.c fs/open.c
          git diff --cached --check

          GIT_AUTHOR_NAME="CLEAN-GEN1 Builder" \
          GIT_AUTHOR_EMAIL="clean-gen1@invalid.local" \
          GIT_AUTHOR_DATE="2026-09-01T00:00:00Z" \
