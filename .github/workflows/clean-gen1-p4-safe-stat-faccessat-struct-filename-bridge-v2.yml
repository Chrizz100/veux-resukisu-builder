          cp "$ARTIFACT_DIR/10-p4-stat-faccessat.diff" \
             "$RESTORE/P4-STAT-FACCESSAT-DIFF.patch"

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          out = Path(os.environ["ARTIFACT_DIR"]) / "restore-kit" / "manifest.json"
          data = {
              "schema": 4,
              "project": "CLEAN-GEN1-VEUX-5.4.274",
              "stage": "P4",
              "vendor_sha": os.environ["EXPECTED_VENDOR_SHA"],
