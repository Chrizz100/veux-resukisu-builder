          {
            echo "P4_CHECKPOINT_COMMIT=$P4_CHECKPOINT_COMMIT"
            echo "P4_OUTER_TREE=$P4_OUTER_TREE"
            echo "P4_RESUKISU_HEAD=$P4_RESUKISU_HEAD"
