      - name: Create complete P4 restore kit
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          RESTORE="$ARTIFACT_DIR/restore-kit"
          mkdir -p "$RESTORE"

          git diff --binary "$P3_RESTORED_OUTER_COMMIT" "$P4_CHECKPOINT_COMMIT" \
            > "$RESTORE/p3-to-p4-outer.patch"
          test -s "$RESTORE/p3-to-p4-outer.patch"

