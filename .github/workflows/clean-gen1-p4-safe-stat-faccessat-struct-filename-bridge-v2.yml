          7. Verify HEAD $P4_RESUKISU_HEAD and tree $P4_RESUKISU_TREE.

          Lifetime contract:
          - one owner ref is retained across retry
          - refcnt++ gives filename_lookup one disposable ref per attempt
          - filename_lookup consumes that added ref
          - caller releases the owner ref once at function exit
          - no raw __user pathname is reinterpreted as struct filename

          Outer-repo working-tree policy:
