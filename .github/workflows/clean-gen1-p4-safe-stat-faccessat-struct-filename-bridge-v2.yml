          cat > "$RESTORE/RESTORE-INSTRUCTIONS.txt" <<EOF
          CLEAN-GEN1 P4 deterministic restore

          Full outer restore:
          1. Checkout $VENDOR_REPO tag $VENDOR_TAG.
