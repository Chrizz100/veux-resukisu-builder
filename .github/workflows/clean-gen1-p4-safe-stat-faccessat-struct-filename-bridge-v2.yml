              "filename_lookup_consumes_one_non_err_ref": True,
              "bridge_owner_ref_retained_across_retry": True,
              "bridge_extra_lookup_ref_per_attempt": True,
              "raw_user_pointer_reinterpret_cast": False,
              "stat_faccessat_bridge_integrated": True,
              "susfs_source_foundation_present": True,
