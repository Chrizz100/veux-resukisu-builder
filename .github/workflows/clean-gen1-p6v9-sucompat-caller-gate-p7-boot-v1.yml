          echo "P6V9_TEST_BOOT_SHA256=$(sha256sum "$ARTIFACT_DIR/device-test/$P6V9_TEST_BOOT_NAME" | awk '{print $1}')"
          echo "P6V9_HISTORICAL_FINAL_BOOT_CALIBRATION=PASS"
