          grep -Fq 'ksu_handle_stat(&dfd, &ksu_filename, &flags)' fs/stat.c
          for spec in     'kernel/sys.c:ksu_handle_setresuid'     'fs/exec.c:ksu_handle_execveat'     'fs/open.c:ksu_handle_faccessat'     'fs/read_write.c:ksu_handle_sys_read'     'fs/stat.c:ksu_handle_stat'     'kernel/reboot.c:ksu_handle_sys_reboot'     'drivers/input/input.c:ksu_handle_input_handle_event'
