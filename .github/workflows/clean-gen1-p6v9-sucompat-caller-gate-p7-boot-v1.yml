    - name: Validate source invariants immediately before canonical Build A
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        test "$(make -s kernelversion)" = "5.4.274"
        test "$(git rev-parse HEAD^{tree})" = "$P6_SOURCE_TREE"
        test -z "$(git status --porcelain)"
        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_RESUKISU_TREE"
        test -z "$(git -C KernelSU status --porcelain)"

        grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' arch/arm64/configs/veux_defconfig
        grep -Fxq 'CONFIG_KSU_SUSFS=y' arch/arm64/configs/veux_defconfig

        for sym in \
          KSU_SUSFS_SUS_PATH \
          KSU_SUSFS_SUS_MOUNT \
          KSU_SUSFS_SUS_KSTAT \
          KSU_SUSFS_SPOOF_UNAME \
          KSU_SUSFS_ENABLE_LOG \
          KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
          KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
          KSU_SUSFS_OPEN_REDIRECT \
          KSU_SUSFS_SUS_MAP
        do
          grep -Fxq "CONFIG_${sym}=y" arch/arm64/configs/veux_defconfig
        done

        for spec in \
          'kernel/sys.c:ksu_handle_setresuid' \
          'fs/exec.c:ksu_handle_execveat' \
          'fs/open.c:ksu_handle_faccessat' \
          'fs/read_write.c:ksu_handle_sys_read' \
          'fs/stat.c:ksu_handle_stat' \
          'kernel/reboot.c:ksu_handle_sys_reboot' \
          'drivers/input/input.c:ksu_handle_input_handle_event'
        do
          file="${spec%%:*}"
          hook="${spec#*:}"
          grep -Fq "$hook" "$file"
          ! grep -wq 'CONFIG_KSU_MANUAL_HOOK' "$file"
        done

        grep -Fq 'ssize_t (*const write_op[])(struct file *, char *, size_t) = {' \
          security/selinux/selinuxfs.c
        grep -Fq 'const struct file_operations sel_handle_status_ops = {' \
          security/selinux/selinuxfs.c
        grep -Fxq '#include <linux/cred.h>' include/linux/susfs_def.h
        grep -Fq 'current_uid().val >= 10000' include/linux/susfs_def.h

        grep -Fq 'CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := 35102' KernelSU/kernel/Kbuild
        test ! -e KernelSU/kernel/feature/module_load_filter.c

        {
          echo "P6_SOURCE_INVARIANTS=PASS"
          echo "P6_NATIVE_SUSFS_DEFCONFIG=PASS"
          echo "P6_NATIVE_INLINE_HOOK_SITES=7/7=PASS"
          echo "P6_LITERAL_MANUAL_GUARDS_IN_INLINE_TARGETS=0"
          echo "P6_ARTIFICIAL_COMPILE_PREFLIGHT=NO"
          echo "P6_STANDALONE_MAKE_PREFLIGHT=NO"
          echo "P6_NEXT_COMPILER_ACTION=CANONICAL_FULL_BUILD_A"
        } | tee "$ARTIFACT_DIR/06a-source-invariants.txt"

        cat > "$ARTIFACT_DIR/05-effective-build-config.txt" <<EOF
        P6_EFFECTIVE_HOOK_MODE=NATIVE_KSU_SUSFS
        P6_KCONFIG_KSU_MANUAL_HOOK=NO
        P6_KCONFIG_KSU_SUSFS=YES
        P6_KSU_CONFIG_CPP_FORCE=NO
        P6_EFFECTIVE_KCFLAGS=$P6_EFFECTIVE_KCFLAGS
        P6_NATIVE_INLINE_HOOK_COUNT=7
        P6_KSU_VERSION=$EXPECTED_KSU_VERSION
        P6_MODULE_LOAD_FILTER_INCLUDED=NO
        EOF


        python3 - <<'PY' | tee "$ARTIFACT_DIR/06b-p6v9-sucompat-caller-contract.txt"
        from pathlib import Path

        def function_body(text, signature):
            start = text.find(signature)
            if start < 0:
                raise SystemExit("missing function: " + signature)
            brace = text.find("{", start)
            depth = 0
            for pos in range(brace, len(text)):
                if text[pos] == "{":
                    depth += 1
                elif text[pos] == "}":
                    depth -= 1
                    if depth == 0:
                        return text[start:pos + 1]
            raise SystemExit("unterminated function: " + signature)

        open_text = Path("fs/open.c").read_text(encoding="utf-8")
        stat_text = Path("fs/stat.c").read_text(encoding="utf-8")
        sucompat = Path("KernelSU/kernel/feature/sucompat.c").read_text(encoding="utf-8")

        open_fn = function_body(open_text, "long do_faccessat(")
        stat_fn = function_body(stat_text, "int vfs_statx(")
        handler = function_body(
            sucompat,
            "int ksu_handle_faccessat(int *dfd, struct filename **filename"
        )

        gate = (
            "!likely(susfs_is_current_proc_umounted())",
            "static_branch_likely(&ksu_su_compat_enabled)",
            "__ksu_is_allow_uid_for_current(current_uid().val)",
            "ksu_handle_faccessat(&dfd, &ksu_filename, &mode, NULL)",
        )
        for token in gate:
            if token not in open_fn:
                raise SystemExit("P6-v9 faccessat contract missing: " + token)

        stat_gate = (
            "!likely(susfs_is_current_proc_umounted())",
            "static_branch_likely(&ksu_su_compat_enabled)",
            "__ksu_is_allow_uid_for_current(current_uid().val)",
            "ksu_handle_stat(&dfd, &ksu_filename, &flags)",
        )
        for token in stat_gate:
            if token not in stat_fn:
                raise SystemExit("P6-v9 stat contract missing: " + token)

        # This is the upstream-selected SUSFS handler contract that made the
        # caller gate necessary.  We do not patch the handler itself.
        if "susfs already complete in caller" not in handler:
            raise SystemExit("ReSukiSU caller-responsibility marker missing")
        if 'memcpy((void *)((*filename)->name), sh_path, sizeof(sh_path));' not in handler:
            raise SystemExit("expected ReSukiSU su->sh redirection missing")

        print("P6V9_RESUKISU_FACCESSAT_HANDLER_UNMODIFIED=PASS")
        print("P6V9_RESUKISU_HANDLER_EXPECTS_CALLER_FILTER=YES")
        print("P6V9_FACCESSAT_CALLER_AUTHORIZATION_GATE=PASS")
        print("P6V9_STAT_CALLER_AUTHORIZATION_GATE=PASS")
