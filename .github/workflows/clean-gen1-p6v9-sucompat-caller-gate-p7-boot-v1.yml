name: CLEAN GEN1 P6-v9 - ReSukiSU sucompat caller gate + calibrated P7 boot v1
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  p6-deterministic-image-dtb:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      ARCH: arm64
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
      VENDOR_TAG: '20240619'
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      P5I_RUN_ID: '33513399363'
      P5I_ARTIFACT_NAME: 
        clean-gen1-p5i-proc-maps-open-redirect-srcu-v1-33513399363
      EXPECTED_P5I_COMMIT: f353a9475e40ca866d570c1d0ef55e24cf6556e4
      EXPECTED_P5I_TREE: a947c1f2891c796a08373fc755e29b23139dc761
      EXPECTED_RESUKISU_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_RESUKISU_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      EXPECTED_KSU_VERSION: '35102'
      RESUKISU_SNAPSHOT_HEAD: 0b5efe9e0102c43ca5c41174d500f5a7080cd0c7
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_54_HEAD: 76affd70abf61d77feb0a132f61365d6848505df
      SUSFS_510_HEAD: ec785f47d49f7b3871ca9356f450411020af7017
      SUSFS_515_HEAD: bca0d2333c1a7d717e7278b019d7af7ba1d16005
      SUSFS_61_HEAD: 4fc9c1898ea66f51847cdbc0d1473ea4ef525a70
      CLANG_PREBUILT_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      OUT_DIR: ${{ github.workspace }}/kernel/out-p6
      ARTIFACT_DIR: ${{ github.workspace }}/clean-gen1-p6
      P5I_ARTIFACT_DIR: ${{ github.workspace }}/p5i-artifact
      KBUILD_BUILD_USER: clean-gen1
      KBUILD_BUILD_HOST: veux-p6
      KBUILD_BUILD_TIMESTAMP: Tue Sep 1 00:00:00 UTC 2026
      KBUILD_BUILD_VERSION: '1'
      SOURCE_DATE_EPOCH: '1788220800'
      P6_EFFECTIVE_KCFLAGS: -D__ANDROID_COMMON_KERNEL__
      P6_PARENT_RUN_ID: '33527695472'
      P6_PARENT_FAILURE: REAL_LINK_SPLIT_BRAIN_MANUAL_KBUILD_FORCED_SUSFS_CPP
      P6_REQUIRED_EXPORT_FILE: security/selinux/selinuxfs.c
      FINAL_BOOT_RELEASE_TAG: Final_Boot
      FINAL_BOOT_RELEASE_ASSET: Boot.img.zip
      FINAL_BOOT_RELEASE_ZIP_SHA256: 
        920f2aa04d495771506c9e34ef81776de50273bde82835553cadbb73a864b4b8
      FINAL_BOOT_REFERENCE_BOOT_SHA256: 
        2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e
      FINAL_BOOT_REFERENCE_KERNEL_SHA256: 
        e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96
      ROLLBACK_GZIP_SHA256: 
        9a1532ccfc57b465256bba97863f927b80823fa8812a4d13e4f4c8bf9af0c78b
      STOCK_BOOT_SHA256: 
        ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5
      STOCK_BOOT_BYTES: '134217728'
      STOCK_RAMDISK_SHA256: 
        0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a
      P6V9_TEST_BOOT_NAME: CLEAN_GEN1_P7_SU_VISIBILITY_FIX_TEST_boot.img
    steps:
    - name: Initialize P6-v9 sucompat caller-gate correction
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf "$ARTIFACT_DIR" "$P5I_ARTIFACT_DIR" "$TOOLCHAIN_DIR" \
               "$GITHUB_WORKSPACE/toolchains" \
               "$GITHUB_WORKSPACE/p6-outer-replay" \
               "$GITHUB_WORKSPACE/p6-resukisu-replay"
        mkdir -p "$ARTIFACT_DIR" "$TOOLCHAIN_DIR"

        cat > "$ARTIFACT_DIR/00-plan.txt" <<'EOF'
        CLEAN GEN1 P6-v9 v8 - native SUSFS deterministic Image + DTB build

        P6-v7 reached the canonical full build and failed only at final vmlinux link:
          undefined symbol ksu_init_rc_hook.

        Root cause:
        - the generated Kconfig selected CONFIG_KSU_MANUAL_HOOK=y;
        - GNU make/KCFLAGS simultaneously forced CONFIG_KSU_SUSFS;
        - ReSukiSU Kbuild therefore selected Manual Hook while C preprocessing selected
          SUSFS branches in other translation units;
        - core/init.c would also take the Manual-Hook branch first and skip susfs_init().

        P6-v8 rejects this split-brain model completely.
        It uses native CONFIG_KSU_SUSFS=y in the real VEUX defconfig, MANUAL_HOOK=n,
        and the seven source inline hooks required by ReSukiSU's own
        inline_hook_check.mk.

        P6 validation policy:
        - native Kconfig hook mode only; no Make/KCFLAGS CONFIG_KSU_SUSFS forcing;
        - no artificial subdir compile or standalone make preflight;
        - source invariants before build, canonical full build for compile truth;
        - post-build symbol/output/reproducibility validation after compiler success;

        P6 source policy:
        - restore exact P5I tree and selected ReSukiSU bundle;
        - fresh upstream-drift gate BEFORE the first full kernel compile;
        - exactly one required ReSukiSU static-export source repair is permitted;
        - permitted scope: security/selinux/selinuxfs.c only;
        - remove static from write_op and sel_handle_status_ops exactly as documented;
        - module_load_filter remains excluded.

        Toolchain:
        - Android clang-r416183b pinned to prebuilts commit aa2e4a...

        Native configuration model:
        - real VEUX defconfig selects CONFIG_KSU_SUSFS=y;
        - CONFIG_KSU_MANUAL_HOOK is disabled by the ReSukiSU hook-method choice;
        - all integrated SUSFS features are real .config symbols;
        - KCFLAGS contains only the Android-common compatibility define;
        - no CONFIG_KSU_* symbol is injected through compiler command-line defines;
        - ReSukiSU Kbuild and C preprocessing therefore see one identical hook mode.

        Determinism:
        - Build A from clean out-p6
        - archive hashes/output
        - delete out-p6 completely
        - Build B again at the same absolute out-p6 path
        - compare Image, VEUX DTB, vmlinux, System.map, .config and complete DTB hash list

        Outputs:
        - Image
        - VEUX DTB
        - base .config
        - effective-build-config manifest
        - complete provenance/build/reproducibility evidence

        No boot.img, AnyKernel3 ZIP, device access or flashing in P6.
        EOF


        {
          echo "P6V9_TRIGGER=P7_REAL_DEVICE_SU_PATH_VISIBILITY_REGRESSION"
          echo "P6V9_OBSERVED_PATH=/system/bin/su"
          echo "P6V9_FIX_SCOPE=RESTORE_RESUKISU_SUSFS_CALLER_AUTHORIZATION_GATE"
          echo "P6V9_HANDLER_SOURCE_MODIFIED=NO"
          echo "P6V9_P4_STRUCT_FILENAME_LIFETIME_MODEL_CHANGED=NO"
          echo "P6V9_MANAGER_PIN=NO"
        } >> "$ARTIFACT_DIR/00-plan.txt"
    - name: Install P6 dependencies
      shell: bash
      run: |2

        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates cpio curl flex git jq \
          libelf-dev libncurses-dev libssl-dev patch python3 rsync unzip xz-utils zstd
    - name: Checkout exact VEUX vendor source
      uses: actions/checkout@v6
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: '20240619'
        path: kernel
        fetch-depth: 1
        persist-credentials: false
    - name: Download accepted P5I artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.P5I_ARTIFACT_NAME }}
        path: p5i-artifact
        github-token: ${{ github.token }}
        run-id: ${{ env.P5I_RUN_ID }}
    - name: Authenticate P5I Last Good
      shell: bash
      run: |2

        set -euo pipefail
        (
          cd "$P5I_ARTIFACT_DIR/restore-kit"
          sha256sum -c SHA256SUMS
        ) > "$ARTIFACT_DIR/01-p5i-restore-sha256.txt"

        jq -e \
          --arg commit "$EXPECTED_P5I_COMMIT" \
          --arg tree "$EXPECTED_P5I_TREE" \
          --arg rhead "$EXPECTED_RESUKISU_HEAD" \
          --arg rtree "$EXPECTED_RESUKISU_TREE" \
          '.stage=="CLEAN_GEN1_P5I" and
           .p5i_commit==$commit and
           .p5i_tree==$tree and
           .resukisu_head==$rhead and
           .resukisu_tree==$rtree and
           .normal_path_open_redirect_integrated==true and
           .tmpfile_open_redirect_integrated==true and
           .o_path_open_redirect_integrated==true and
           .vfs_readlink_open_redirect_integrated==true and
           .proc_readlink_open_redirect_integrated==true and
           .vfs_statfs_open_redirect_integrated==true and
           .fdinfo_mnt_id_open_redirect_integrated==true and
           .proc_maps_open_redirect_integrated==true and
           .proc_maps_caller_held_srcu==true and
           .proc_maps_redirect_pointer_used_only_under_srcu==true and
           .susfs_runtime_enabled==false and
           .full_kernel_build_performed==false' \
          "$P5I_ARTIFACT_DIR/restore-kit/manifest.json" \
          > "$ARTIFACT_DIR/01-p5i-manifest-auth.json"

        grep -Fxq 'CLEAN_GEN1_P5I_PROC_MAPS_OPEN_REDIRECT_SRCU=PASS' \
          "$P5I_ARTIFACT_DIR/16-result.txt"
        grep -Fxq 'P5I_MAPS_SYMBOL_CONTRACT=PASS' \
          "$P5I_ARTIFACT_DIR/11-object-builds.txt"

        {
          echo "P5I_RESTORE_ARTIFACT=PASS"
          echo "P5I_CHECKPOINT_AUTH=PASS"
          echo "P5I_INPUT_TREE=$EXPECTED_P5I_TREE"
          echo "P6_FULL_BUILD_ALLOWED=YES"
        } | tee "$ARTIFACT_DIR/01-p5i-auth.txt"
    - name: Fresh upstream audit immediately before full build
      shell: bash
      run: |2

        set -euo pipefail
        current_resu="$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main | awk '{print $1}')"
        current_54="$(git ls-remote "$SUSFS_REPO" refs/heads/kernel-5.4 | awk '{print $1}')"
        current_510="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android12-5.10 | awk '{print $1}')"
        current_515="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android13-5.15 | awk '{print $1}')"
        current_61="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android14-6.1 | awk '{print $1}')"

        {
          echo "RESUKISU_CURRENT=$current_resu"
          echo "RESUKISU_REVIEWED=$RESUKISU_SNAPSHOT_HEAD"
          echo "SUSFS_54_CURRENT=$current_54"
          echo "SUSFS_54_REVIEWED=$SUSFS_54_HEAD"
          echo "SUSFS_510_CURRENT=$current_510"
          echo "SUSFS_510_REVIEWED=$SUSFS_510_HEAD"
          echo "SUSFS_515_CURRENT=$current_515"
          echo "SUSFS_515_REVIEWED=$SUSFS_515_HEAD"
          echo "SUSFS_61_CURRENT=$current_61"
          echo "SUSFS_61_REVIEWED=$SUSFS_61_HEAD"
        } > "$ARTIFACT_DIR/02-upstream-current.txt"

        test "$current_resu" = "$RESUKISU_SNAPSHOT_HEAD"
        test "$current_54" = "$SUSFS_54_HEAD"
        test "$current_510" = "$SUSFS_510_HEAD"
        test "$current_515" = "$SUSFS_515_HEAD"
        test "$current_61" = "$SUSFS_61_HEAD"

        echo "P6_FRESH_UPSTREAM_AUDIT=PASS" | tee -a "$ARTIFACT_DIR/02-upstream-current.txt"
    - name: Restore exact accepted P5I outer tree
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
        test -z "$(git status --porcelain)"

        PATCH="$P5I_ARTIFACT_DIR/restore-kit/vendor-20240619-to-p5i-outer.patch"
        git apply --check --binary "$PATCH"
        git apply --index --binary "$PATCH"
        test "$(git write-tree)" = "$EXPECTED_P5I_TREE"

        GIT_AUTHOR_NAME="CLEAN-GEN1 Restore" \
        GIT_AUTHOR_EMAIL="clean-gen1@invalid.local" \
        GIT_AUTHOR_DATE="2026-09-01T00:00:00Z" \
        GIT_COMMITTER_NAME="CLEAN-GEN1 Restore" \
        GIT_COMMITTER_EMAIL="clean-gen1@invalid.local" \
        GIT_COMMITTER_DATE="2026-09-01T00:00:00Z" \
          git commit -m "CLEAN GEN1 restore accepted P5I outer tree"

        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P5I_TREE"
        echo "P5I_RESTORED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

        echo "P5I_OUTER_RESTORE_FOR_P6=PASS" \
          | tee "$ARTIFACT_DIR/03-p5i-outer-restore.txt"
    - name: Restore exact accepted P5I ReSukiSU
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf KernelSU
        git init KernelSU >/dev/null
        git -C KernelSU fetch \
          "$P5I_ARTIFACT_DIR/restore-kit/resukisu-p5i-full.bundle" \
          refs/heads/clean-gen1-p5i-resukisu:refs/heads/clean-gen1-p5i-resukisu
        git -C KernelSU checkout --detach refs/heads/clean-gen1-p5i-resukisu >/dev/null

        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_RESUKISU_TREE"
        test -z "$(git -C KernelSU status --porcelain)"

        mkdir -p .git/info
        touch .git/info/exclude
        grep -Fxq '/KernelSU/' .git/info/exclude || echo '/KernelSU/' >> .git/info/exclude

        test -L drivers/kernelsu
        test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
        test -z "$(git status --porcelain)"

        echo "P5I_RESUKISU_RESTORE_FOR_P6=PASS" \
          | tee "$ARTIFACT_DIR/04-p5i-resukisu-restore.txt"
    - name: Audit v7 split-brain failure and native SUSFS architecture
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        test "$(make -s kernelversion)" = "5.4.274"
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P5I_TREE"
        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_RESUKISU_TREE"

        python3 - <<'PY' > "$ARTIFACT_DIR/05-hook-choice-audit.txt"
        from pathlib import Path

        kconfig = Path("KernelSU/kernel/Kconfig").read_text(encoding="utf-8")
        kbuild = Path("KernelSU/kernel/Kbuild").read_text(encoding="utf-8")
        core = Path("KernelSU/kernel/core/init.c").read_text(encoding="utf-8")
        runtime = Path("KernelSU/kernel/runtime/ksud_integration.c").read_text(encoding="utf-8")
        inline = Path("KernelSU/kernel/tools/inline_hook_check.mk").read_text(encoding="utf-8")

        choice = kconfig.find("choice")
        choice_end = kconfig.find("endchoice", choice)
        if choice < 0 or choice_end < 0:
            raise SystemExit("ReSukiSU hook-method choice missing")
        choice_body = kconfig[choice:choice_end]

        for sym in ("config KSU_TRACEPOINT_HOOK", "config KSU_MANUAL_HOOK", "config KSU_SUSFS"):
            if sym not in choice_body:
                raise SystemExit("hook-method choice missing " + sym)

        manual_kbuild = kbuild.find("else ifdef CONFIG_KSU_MANUAL_HOOK")
        susfs_kbuild = kbuild.find("else ifdef CONFIG_KSU_SUSFS")
        if not (0 <= manual_kbuild < susfs_kbuild):
            raise SystemExit("expected ReSukiSU Kbuild Manual->SUSFS precedence not found")

        manual_core = core.find("#elif defined(CONFIG_KSU_MANUAL_HOOK)")
        susfs_core = core.find("#elif defined(CONFIG_KSU_SUSFS)")
        susfs_init = core.find("susfs_init();", susfs_core)
        if not (0 <= manual_core < susfs_core < susfs_init):
            raise SystemExit("expected core init Manual->SUSFS/susfs_init ordering not found")

        susfs_key = runtime.find("DEFINE_STATIC_KEY_TRUE(ksu_is_init_rc_hook_enabled)")
        manual_key = runtime.find("DEFINE_STATIC_KEY_TRUE(ksu_init_rc_hook)")
        if susfs_key < 0 or manual_key < 0:
            raise SystemExit("expected SUSFS/manual init-rc static-key variants missing")

        required_hooks = {
            "kernel/sys.c": "ksu_handle_setresuid",
            "fs/exec.c": "ksu_handle_execveat",
            "fs/open.c": "ksu_handle_faccessat",
            "fs/read_write.c": "ksu_handle_sys_read",
            "fs/stat.c": "ksu_handle_stat",
            "kernel/reboot.c": "ksu_handle_sys_reboot",
            "drivers/input/input.c": "ksu_handle_input_handle_event",
        }
        for path, hook in required_hooks.items():
            if hook not in inline:
                raise SystemExit(f"inline hook checker missing {hook} / {path}")

        print("P6_V7_SPLIT_BRAIN_MODEL=CONFIRMED")
        print("P6_V7_KBUILD_SELECTED_MANUAL=YES")
        print("P6_V7_CPP_FORCED_SUSFS=YES")
        print("P6_V7_SUSFS_INIT_WOULD_BE_SKIPPED=YES")
        print("P6_NATIVE_KCONFIG_SUSFS_REQUIRED=YES")
        print("P6_NATIVE_KCONFIG_MANUAL_HOOK_REQUIRED=NO")
        print("P6_REQUIRES_SEVEN_INLINE_HOOK_SITES=YES")
        print("P6_NATIVE_SUSFS_ARCHITECTURE=PASS")
        PY

        grep -Fq 'P6_NATIVE_SUSFS_ARCHITECTURE=PASS' "$ARTIFACT_DIR/05-hook-choice-audit.txt"
        grep -Fq 'CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := 35102' KernelSU/kernel/Kbuild
        test ! -e KernelSU/kernel/feature/module_load_filter.c
    - name: Integrate native SUSFS contract plus P6-v9 sucompat caller gate
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        test -s "$P6_REQUIRED_EXPORT_FILE"
        grep -Fq 'struct selinux_state {' security/selinux/include/security.h

        for f in \
          arch/arm64/configs/veux_defconfig \
          drivers/input/input.c \
          fs/exec.c \
          fs/open.c \
          fs/read_write.c \
          fs/stat.c \
          include/linux/ksu_hook_contract.h \
          include/linux/susfs_def.h \
          kernel/reboot.c \
          kernel/sys.c \
          security/selinux/selinuxfs.c
        do
          cp "$f" "$ARTIFACT_DIR/05a-before-$(echo "$f" | tr '/' '_')"
        done

        python3 - <<'PY'
        from pathlib import Path

        def replace_once(path, old, new, label):
            p = Path(path)
            s = p.read_text(encoding="utf-8")
            count = s.count(old)
            if count != 1:
                raise SystemExit(f"{label}: expected one anchor in {path}, got {count}")
            s = s.replace(old, new, 1)
            p.write_text(s, encoding="utf-8")

        # ------------------------------------------------------------------
        # Required ReSukiSU 5.4 static exports.
        # ------------------------------------------------------------------
        replace_once(
            "security/selinux/selinuxfs.c",
            "static ssize_t (*const write_op[])(struct file *, char *, size_t) = {",
            "ssize_t (*const write_op[])(struct file *, char *, size_t) = {",
            "write_op export",
        )
        replace_once(
            "security/selinux/selinuxfs.c",
            "static const struct file_operations sel_handle_status_ops = {",
            "const struct file_operations sel_handle_status_ops = {",
            "sel_handle_status_ops export",
        )

        # ------------------------------------------------------------------
        # SUSFS header self-containment for current_uid().
        # ------------------------------------------------------------------
        replace_once(
            "include/linux/susfs_def.h",
            "#include <linux/bits.h>\n#include <linux/string.h>\n",
            "#include <linux/bits.h>\n#include <linux/cred.h>\n#include <linux/string.h>\n",
            "susfs_def cred include",
        )

        # ------------------------------------------------------------------
        # Authoritative hook contract:
        # - shared source-hook macro supports Manual and native SUSFS source hooks;
        # - manual-only fstat-return macro preserves the optional Manual behavior;
        # - add the three native-inline hook prototypes previously absent.
        # Target kernel files no longer contain CONFIG_KSU_MANUAL_HOOK text, so
        # ReSukiSU's inline checker sees native SUSFS call sites without warnings.
        # ------------------------------------------------------------------
        replace_once(
            "include/linux/ksu_hook_contract.h",
            """#ifdef CONFIG_KSU

        int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
        """,
            """#ifdef CONFIG_KSU

        #if defined(CONFIG_KSU_MANUAL_HOOK) || defined(CONFIG_KSU_SUSFS)
        #define KSU_SOURCE_INLINE_HOOK 1
        #endif

        #ifdef CONFIG_KSU_MANUAL_HOOK
        #define KSU_MANUAL_RET_HOOK 1
        #endif

        int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);
        int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr,
                                size_t *count_ptr);
        int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code,
                                          int *value);

        int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
        """,
            "authoritative inline hook contract",
        )

        # ------------------------------------------------------------------
        # exec: common source inline hook. Native SUSFS gets the same call while
        # still allowing Manual mode if a future non-SUSFS config intentionally uses it.
        # ------------------------------------------------------------------
        replace_once(
            "fs/exec.c",
            """#ifdef CONFIG_KSU_MANUAL_HOOK
        	ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
        #endif
        """,
            """#ifdef KSU_SOURCE_INLINE_HOOK
        	ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
        #endif
        """,
            "exec inline hook guard",
        )

        # faccessat: keep the proven struct-filename SUSFS bridge; only normalize
        # the non-SUSFS/manual fallback guard.
        replace_once(
            "fs/open.c",
            "#elif defined(CONFIG_KSU_MANUAL_HOOK)\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n",
            "#elif defined(KSU_SOURCE_INLINE_HOOK)\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n",
            "faccessat fallback guard",
        )

        # stat: same proven struct-filename bridge. fstat-return hooks are Manual-only
        # implementation details and remain Manual-only via the shared macro.
        replace_once(
            "fs/stat.c",
            "#elif defined(CONFIG_KSU_MANUAL_HOOK)\n\tksu_handle_stat(&dfd, &filename, &flags);\n",
            "#elif defined(KSU_SOURCE_INLINE_HOOK)\n\tksu_handle_stat(&dfd, &filename, &flags);\n",
            "stat fallback guard",
        )
        stat = Path("fs/stat.c")
        ss = stat.read_text(encoding="utf-8")
        if ss.count("#ifdef CONFIG_KSU_MANUAL_HOOK") != 2:
            raise SystemExit(
                "stat manual fstat-return guard count mismatch: "
                f"{ss.count('#ifdef CONFIG_KSU_MANUAL_HOOK')}"
            )
        ss = ss.replace("#ifdef CONFIG_KSU_MANUAL_HOOK", "#ifdef KSU_MANUAL_RET_HOOK")
        stat.write_text(ss, encoding="utf-8")

        # reboot: required source inline hook in native SUSFS.
        replace_once(
            "kernel/reboot.c",
            """#ifdef CONFIG_KSU_MANUAL_HOOK
        	ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
        #endif
        """,
            """#ifdef KSU_SOURCE_INLINE_HOOK
        	ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
        #endif
        """,
            "reboot inline hook guard",
        )

        # setresuid: required native SUSFS source hook.
        replace_once(
            "kernel/sys.c",
            "#include <linux/syscalls.h>\n#include <linux/kprobes.h>\n",
            "#include <linux/syscalls.h>\n#include <linux/ksu_hook_contract.h>\n#include <linux/kprobes.h>\n",
            "kernel sys contract include",
        )
        replace_once(
            "kernel/sys.c",
            """	kuid_t kruid, keuid, ksuid;

        	kruid = make_kuid(ns, ruid);
        """,
            """	kuid_t kruid, keuid, ksuid;

        #ifdef KSU_SOURCE_INLINE_HOOK
        	ksu_handle_setresuid(ruid, euid, suid);
        #endif

        	kruid = make_kuid(ns, ruid);
        """,
            "setresuid inline hook",
        )

        # read: required init-rc source hook. In native SUSFS, ReSukiSU's own
        # ksu_handle_sys_read() uses ksu_is_init_rc_hook_enabled.
        replace_once(
            "fs/read_write.c",
            "#include <linux/syscalls.h>\n#include <linux/pagemap.h>\n",
            "#include <linux/syscalls.h>\n#include <linux/ksu_hook_contract.h>\n#include <linux/pagemap.h>\n",
            "read_write contract include",
        )
        replace_once(
            "fs/read_write.c",
            """SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
        {
        	return ksys_read(fd, buf, count);
        }
        """,
            """SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
        {
        #ifdef KSU_SOURCE_INLINE_HOOK
        	ksu_handle_sys_read(fd, &buf, &count);
        #endif
        	return ksys_read(fd, buf, count);
        }
        """,
            "sys_read inline hook",
        )

        # input: required native SUSFS input hook; handler owns the static-key check.
        replace_once(
            "drivers/input/input.c",
            "#include <linux/rcupdate.h>\n#include \"input-compat.h\"\n",
            "#include <linux/rcupdate.h>\n#include <linux/ksu_hook_contract.h>\n#include \"input-compat.h\"\n",
            "input contract include",
        )
        replace_once(
            "drivers/input/input.c",
            """{
        	unsigned long flags;

        	if (is_event_supported(type, dev->evbit, EV_MAX)) {
        """,
            """{
        	unsigned long flags;

        #ifdef KSU_SOURCE_INLINE_HOOK
        	ksu_handle_input_handle_event(&type, &code, &value);
        #endif

        	if (is_event_supported(type, dev->evbit, EV_MAX)) {
        """,
            "input inline hook",
        )

        # ------------------------------------------------------------------
        # Real VEUX defconfig: select one and only one native ReSukiSU hook mode.
        # All SUSFS feature toggles become genuine Kconfig symbols.
        # ------------------------------------------------------------------
        replace_once(
            "arch/arm64/configs/veux_defconfig",
            """CONFIG_KSU=y
        # CONFIG_KSU_TRACEPOINT_HOOK is not set
        CONFIG_KSU_MANUAL_HOOK=y
        # CONFIG_KSU_SUSFS is not set
        CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y
        CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y
        CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y
        CONFIG_KSU_MULTI_MANAGER_SUPPORT=y
        """,
            """CONFIG_KSU=y
        # CONFIG_KSU_TRACEPOINT_HOOK is not set
        # CONFIG_KSU_MANUAL_HOOK is not set
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_MULTI_MANAGER_SUPPORT=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_SUS_MAP=y
        """,
            "VEUX native SUSFS defconfig",
        )


        # ------------------------------------------------------------------
        # P6-v9: restore the caller-side authorization gate required by the
        # ReSukiSU CONFIG_KSU_SUSFS sucompat contract.
        #
        # Current ReSukiSU's SUSFS faccessat handler intentionally assumes that
        # the hook caller already filtered ordinary/unprivileged processes.
        # P6-v8 preserved the safe P4 struct-filename ownership bridge but called
        # ksu_handle_faccessat() unconditionally, so an ordinary app probing
        # /system/bin/su could have its lookup redirected to /system/bin/sh and
        # receive a false "exists" result.
        #
        # Do NOT change ReSukiSU's handler. Restore the proven caller contract:
        #   - process is not in the SUSFS-unmounted state,
        #   - sucompat feature is enabled,
        #   - current UID is explicitly allowed.
        #
        # getname_flags()/putname() ownership remains exactly P4/P6-v8.
        # ------------------------------------------------------------------
        replace_once(
            "include/linux/ksu_hook_contract.h",
            """int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code,
                                          int *value);

        int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
        """,
            """int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code,
                                          int *value);

        #ifdef CONFIG_KSU_SUSFS
        struct static_key_true;
        extern struct static_key_true ksu_su_compat_enabled;
        bool __ksu_is_allow_uid_for_current(uid_t uid);
        #endif

        int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
        """,
            "P6-v9 shared sucompat caller declarations",
        )

        replace_once(
            "fs/open.c",
            "#include <linux/ksu_hook_contract.h>\n#include <linux/rcupdate.h>\n",
            """#include <linux/ksu_hook_contract.h>
        #ifdef CONFIG_KSU_SUSFS
        #include <linux/cred.h>
        #include <linux/jump_label.h>
        #include <linux/susfs_def.h>
        #endif
        #include <linux/rcupdate.h>
        """,
            "P6-v9 faccessat gate includes",
        )

        replace_once(
            "fs/stat.c",
            "#include <linux/ksu_hook_contract.h>\n#include <linux/pagemap.h>\n",
            """#include <linux/ksu_hook_contract.h>
        #ifdef CONFIG_KSU_SUSFS
        #include <linux/jump_label.h>
        #include <linux/susfs_def.h>
        #endif
        #include <linux/pagemap.h>
        """,
            "P6-v9 stat gate includes",
        )

        replace_once(
            "fs/open.c",
            """	ksu_handle_faccessat(&dfd, &ksu_filename, &mode, NULL);
        #elif defined(KSU_SOURCE_INLINE_HOOK)
        """,
            """	if (!likely(susfs_is_current_proc_umounted()) &&
        	    static_branch_likely(&ksu_su_compat_enabled) &&
        	    unlikely(__ksu_is_allow_uid_for_current(current_uid().val)))
        		ksu_handle_faccessat(&dfd, &ksu_filename, &mode, NULL);
        #elif defined(KSU_SOURCE_INLINE_HOOK)
        """,
            "P6-v9 faccessat caller authorization gate",
        )

        replace_once(
            "fs/stat.c",
            """	ksu_handle_stat(&dfd, &ksu_filename, &flags);
        #elif defined(KSU_SOURCE_INLINE_HOOK)
        """,
            """	if (!likely(susfs_is_current_proc_umounted()) &&
        	    static_branch_likely(&ksu_su_compat_enabled) &&
        	    unlikely(__ksu_is_allow_uid_for_current(current_uid().val)))
        		ksu_handle_stat(&dfd, &ksu_filename, &flags);
        #elif defined(KSU_SOURCE_INLINE_HOOK)
        """,
            "P6-v9 stat caller authorization gate",
        )

        # Exact source-shape proof.  The unprivileged path must keep the real
        # filesystem lookup semantics; only an explicitly allowed UID may enter
        # the sucompat redirection handler.
        open_text = Path("fs/open.c").read_text(encoding="utf-8")
        stat_text = Path("fs/stat.c").read_text(encoding="utf-8")
        contract_text = Path("include/linux/ksu_hook_contract.h").read_text(encoding="utf-8")

        gate_terms = (
            "susfs_is_current_proc_umounted()",
            "static_branch_likely(&ksu_su_compat_enabled)",
            "__ksu_is_allow_uid_for_current(current_uid().val)",
        )
        for term in gate_terms:
            if open_text.count(term) < 1:
                raise SystemExit("P6-v9 faccessat gate term missing: " + term)
            if stat_text.count(term) < 1:
                raise SystemExit("P6-v9 stat gate term missing: " + term)

        if contract_text.count("extern struct static_key_true ksu_su_compat_enabled;") != 1:
            raise SystemExit("P6-v9 shared sucompat static-key declaration mismatch")
        if contract_text.count("bool __ksu_is_allow_uid_for_current(uid_t uid);") != 1:
            raise SystemExit("P6-v9 shared allow-UID declaration mismatch")

        # Behavioral dispatch model for the caller condition itself.
        def dispatch_to_sucompat(proc_umounted, sucompat_enabled, uid_allowed):
            return (
                (not proc_umounted)
                and sucompat_enabled
                and uid_allowed
            )

        if dispatch_to_sucompat(False, True, False):
            raise SystemExit("ordinary UID must not enter sucompat path")
        if dispatch_to_sucompat(True, True, True):
            raise SystemExit("SUSFS-unmounted process must not enter sucompat path")
        if dispatch_to_sucompat(False, False, True):
            raise SystemExit("disabled sucompat must not enter sucompat path")
        if not dispatch_to_sucompat(False, True, True):
            raise SystemExit("allowed UID lost sucompat functionality")

        # ------------------------------------------------------------------
        # Cross-file invariants.
        # ------------------------------------------------------------------
        targets = {
            "kernel/sys.c": "ksu_handle_setresuid",
            "fs/exec.c": "ksu_handle_execveat",
            "fs/open.c": "ksu_handle_faccessat",
            "fs/read_write.c": "ksu_handle_sys_read",
            "fs/stat.c": "ksu_handle_stat",
            "kernel/reboot.c": "ksu_handle_sys_reboot",
            "drivers/input/input.c": "ksu_handle_input_handle_event",
        }
        for path, hook in targets.items():
            text = Path(path).read_text(encoding="utf-8")
            if hook not in text:
                raise SystemExit(f"{hook} missing from {path}")
            if "CONFIG_KSU_MANUAL_HOOK" in text:
                raise SystemExit(
                    f"literal CONFIG_KSU_MANUAL_HOOK remains in inline target {path}"
                )

        cfg = Path("arch/arm64/configs/veux_defconfig").read_text(encoding="utf-8")
        if "CONFIG_KSU_MANUAL_HOOK=y" in cfg:
            raise SystemExit("native defconfig still selects Manual Hook")
        if cfg.count("CONFIG_KSU_SUSFS=y") != 1:
            raise SystemExit("native defconfig SUSFS selection count mismatch")

        hdr = Path("include/linux/ksu_hook_contract.h").read_text(encoding="utf-8")
        for proto in (
            "int ksu_handle_setresuid(",
            "int ksu_handle_sys_read(",
            "int ksu_handle_input_handle_event(",
        ):
            if hdr.count(proto) != 1:
                raise SystemExit(f"hook contract prototype count mismatch: {proto}")

        # The P4 struct-filename bridge must remain intact.
        for path in ("fs/open.c", "fs/stat.c"):
            text = Path(path).read_text(encoding="utf-8")
            if "#ifdef CONFIG_KSU_SUSFS" not in text:
                raise SystemExit(f"SUSFS struct-filename bridge lost in {path}")

        # The two previous real 5.4 fixes remain exact.
        if Path("include/linux/susfs_def.h").read_text().count("#include <linux/cred.h>") != 1:
            raise SystemExit("susfs_def cred include count mismatch")
        sel = Path("security/selinux/selinuxfs.c").read_text()
        if "static const struct file_operations sel_handle_status_ops" in sel:
            raise SystemExit("sel_handle_status_ops became static again")
        PY

        git diff --check

        mapfile -t changed < <(git diff --name-only | sort)
        printf '%s\n' "${changed[@]}" | tee "$ARTIFACT_DIR/05a-changed-files.txt"

        test "${#changed[@]}" -eq 11
        for f in \
          arch/arm64/configs/veux_defconfig \
          drivers/input/input.c \
          fs/exec.c \
          fs/open.c \
          fs/read_write.c \
          fs/stat.c \
          include/linux/ksu_hook_contract.h \
          include/linux/susfs_def.h \
          kernel/reboot.c \
          kernel/sys.c \
          security/selinux/selinuxfs.c
        do
          printf '%s\n' "${changed[@]}" | grep -Fxq "$f"
        done

        # ReSukiSU's own native inline-hook source expectations.
        for spec in \
          'kernel/sys.c:ksu_handle_setresuid' \
          'fs/exec.c:ksu_handle_execveat' \
          'fs/open.c:ksu_handle_faccessat' \
          'fs/read_write.c:ksu_handle_sys_read' \
          'fs/stat.c:ksu_handle_stat' \
          'kernel/reboot.c:ksu_handle_sys_reboot' \
          'drivers/input/input.c:ksu_handle_input_handle_event'
        do
          file="${spec%%:*}"
          hook="${spec#*:}"
          grep -Fq "$hook" "$file"
          ! grep -wq 'CONFIG_KSU_MANUAL_HOOK' "$file"
        done

        git diff --binary -- "${changed[@]}" \
          > "$ARTIFACT_DIR/p5i-to-p6-source-compat.patch"
        test -s "$ARTIFACT_DIR/p5i-to-p6-source-compat.patch"

        git add "${changed[@]}"
        git diff --cached --check

        P6_SOURCE_TREE="$(git write-tree)"
        test -n "$P6_SOURCE_TREE"

        GIT_AUTHOR_NAME="CLEAN-GEN1 P6" \
        GIT_AUTHOR_EMAIL="clean-gen1@invalid.local" \
        GIT_AUTHOR_DATE="2026-09-01T00:00:00Z" \
        GIT_COMMITTER_NAME="CLEAN-GEN1 P6" \
        GIT_COMMITTER_EMAIL="clean-gen1@invalid.local" \
        GIT_COMMITTER_DATE="2026-09-01T00:00:00Z" \
          git commit -m "CLEAN GEN1 P6-v9 restore ReSukiSU SUSFS sucompat caller gate"

        P6_SOURCE_COMMIT="$(git rev-parse HEAD)"
        test "$(git rev-parse HEAD^{tree})" = "$P6_SOURCE_TREE"
        test -z "$(git status --porcelain)"

        {
          echo "P6_SOURCE_TREE=$P6_SOURCE_TREE"
          echo "P6_SOURCE_COMMIT=$P6_SOURCE_COMMIT"
        } >> "$GITHUB_ENV"

        {
          echo "P6_PARENT_RUN_ID=$P6_PARENT_RUN_ID"
          echo "P6_PARENT_FAILURE=$P6_PARENT_FAILURE"
          echo "P6_V7_FAILURE_CLASS=REAL_LINK_SPLIT_BRAIN_MANUAL_KBUILD_FORCED_SUSFS_CPP"
          echo "P6_V7_FAILURE_IS_WORKFLOW_ERROR=NO"
          echo "P6_V7_HYBRID_MODEL_REJECTED=YES"
          echo "P6_NATIVE_KCONFIG_SUSFS=YES"
          echo "P6_NATIVE_KCONFIG_MANUAL_HOOK=NO"
          echo "P6_NATIVE_INLINE_HOOK_COUNT=7"
          echo "P6_STATIC_EXPORT_WRITE_OP=PASS"
          echo "P6_STATIC_EXPORT_SEL_HANDLE_STATUS_OPS=PASS"
          echo "P6_SUSFS_DEF_CRED_INCLUDE=PASS"
          echo "P6_SUSFS_UID_SEMANTICS_CHANGED=NO"
          echo "P6_P4_STRUCT_FILENAME_BRIDGE_PRESERVED=YES"
          echo "P6_SOURCE_CHANGED_FILE_COUNT=11"
          echo "P6_SOURCE_COMPAT_CHANGE_SCOPE=PASS"
          echo "P6_SOURCE_COMMIT=$P6_SOURCE_COMMIT"
          echo "P6_SOURCE_TREE=$P6_SOURCE_TREE"
          echo "P6_NATIVE_SUSFS_SOURCE_INTEGRATION=PASS"
          echo "P6V9_SUCOMPAT_CALLER_GATE_FIX=PASS"
          echo "P6V9_UNPRIVILEGED_SU_REDIRECT_DISPATCH=NO"
          echo "P6V9_ALLOWED_SUCOMPAT_DISPATCH=YES"
          echo "P6V9_HANDLER_SOURCE_MODIFIED=NO"
          echo "P6V9_P4_STRUCT_FILENAME_LIFETIME_MODEL_CHANGED=NO"
        } | tee "$ARTIFACT_DIR/05a-source-integration.txt"
