            || true

          ROTATION_SYMBOL_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/ROTATION-SYMBOLS.txt" \
              | tr -d ' '
          )"

          if [ "$ROTATION_SYMBOL_COUNT" -ne 0 ]; then
            echo "ERROR: SPRD rotation symbols remain linked"
            exit 1
          fi

          grep -Ei \
            '[[:space:]][A-Za-z0-9_]*cpuset[A-Za-z0-9_]*$' \
            "$ARTIFACT_DIR/vmlinux-symbols.txt" \
            > "$ARTIFACT_DIR/vmlinux-cpuset-symbols.txt" \
            || true

          CPUSET_SYMBOL_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/vmlinux-cpuset-symbols.txt" \
              | tr -d ' '
          )"

          if [ "$CPUSET_SYMBOL_COUNT" -lt 1 ]; then
            echo "ERROR: CPUSET symbols missing"
            exit 1
          fi

          grep -E \
            '[[:space:]]lpm_sleep_disabled$' \
            "$ARTIFACT_DIR/vmlinux-symbols.txt" \
            > "$ARTIFACT_DIR/LPM-SLEEP-SYMBOLS.txt" \
            || true

          LPM_SLEEP_SYMBOL_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/LPM-SLEEP-SYMBOLS.txt" \
              | tr -d ' '
          )"

          if [ "$LPM_SLEEP_SYMBOL_COUNT" -ne 0 ]; then
            echo "ERROR: lpm_sleep_disabled remains linked"
            exit 1
          fi

          {
            echo "CASS_SYMBOL_COUNT=$CASS_SYMBOL_COUNT"
            echo "ROTATION_SYMBOL_COUNT=$ROTATION_SYMBOL_COUNT"
            echo "CPUSET_SYMBOL_COUNT=$CPUSET_SYMBOL_COUNT"
            echo "LPM_SLEEP_DISABLED_SYMBOL_COUNT=$LPM_SLEEP_SYMBOL_COUNT"
          } | tee "$ARTIFACT_DIR/LINKED-KERNEL-STATE.txt"

      - name: Verify complete build outputs
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VEUX_DTB="$OUT_DIR/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"
          VMLINUX="$OUT_DIR/vmlinux"

          for FILE in \
            "$IMAGE" \
            "$VEUX_DTB" \
            "$VMLINUX"
          do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: build output missing: $FILE"
              exit 1
            fi
          done

          "$OUT_DIR/scripts/dtc/dtc" \
            -I dtb \
            -O dts \
            -o /dev/null \
            "$VEUX_DTB"

          DTB_SHA="$(
            sha256sum "$VEUX_DTB" \
              | awk '{print $1}'
          )"

          if [ "$DTB_SHA" != "$EXPECTED_VEUX_DTB_SHA256" ]; then
            echo "ERROR: VEUX DTB unexpectedly changed"
            echo "Expected: $EXPECTED_VEUX_DTB_SHA256"
            echo "Actual:   $DTB_SHA"
            exit 1
          fi

          {
            echo "IMAGE_BYTES=$(stat -c '%s' "$IMAGE")"
            echo "VEUX_DTB_BYTES=$(stat -c '%s' "$VEUX_DTB")"
            echo "VMLINUX_BYTES=$(stat -c '%s' "$VMLINUX")"

            echo
            sha256sum "$IMAGE"
            sha256sum "$VEUX_DTB"
            sha256sum "$VMLINUX"
          } | tee "$ARTIFACT_DIR/OUTPUT-HASHES.txt"

          echo "VEUX_DTB_PARSE=PASS" \
            | tee "$ARTIFACT_DIR/DTB-CHECK.txt"

      - name: Audit compiler diagnostics
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LOG="$ARTIFACT_DIR/full-build.log"

          grep -Ei \
            '(^|[[:space:]])error:' \
            "$LOG" \
            > "$ARTIFACT_DIR/ERRORS.txt" \
            || true

          grep -Ei \
            '(^|[[:space:]])warning:' \
            "$LOG" \
            > "$ARTIFACT_DIR/WARNINGS.txt" \
            || true

          grep -E \
            'drivers/cpufreq/cpufreq\.c:.*warning:' \
            "$LOG" \
            > "$ARTIFACT_DIR/CPUFREQ-CORE-WARNINGS.txt" \
            || true

          grep -Ei \
            '(drivers/cpuidle/cpuidle\.c|drivers/cpuidle/lpm-levels\.c):.*warning:' \
            "$LOG" \
            > "$ARTIFACT_DIR/IDLE-WARNINGS.txt" \
            || true

          ERROR_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/ERRORS.txt" \
              | tr -d ' '
          )"

          WARNING_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/WARNINGS.txt" \
              | tr -d ' '
          )"

          CPUFREQ_WARNING_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/CPUFREQ-CORE-WARNINGS.txt" \
              | tr -d ' '
          )"

          IDLE_WARNING_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/IDLE-WARNINGS.txt" \
              | tr -d ' '
          )"

          if [ "$ERROR_COUNT" -ne 0 ]; then
            echo "ERROR: compiler errors detected"
            cat "$ARTIFACT_DIR/ERRORS.txt"
            exit 1
          fi

          if [ "$WARNING_COUNT" -ne "$EXPECTED_WARNING_COUNT" ]; then
            echo "ERROR: warning count changed"
            echo "Expected: $EXPECTED_WARNING_COUNT"
            echo "Actual:   $WARNING_COUNT"
            cat "$ARTIFACT_DIR/WARNINGS.txt"
            exit 1
          fi

          if [ "$CPUFREQ_WARNING_COUNT" -ne 0 ]; then
            echo "ERROR: drivers/cpufreq/cpufreq.c emitted warnings"
            cat "$ARTIFACT_DIR/CPUFREQ-CORE-WARNINGS.txt"
            exit 1
          fi

          if [ "$IDLE_WARNING_COUNT" -ne 0 ]; then
            echo "ERROR: idle source emitted warnings"
            cat "$ARTIFACT_DIR/IDLE-WARNINGS.txt"
            exit 1
          fi

          {
            echo "ERROR_COUNT=$ERROR_COUNT"
            echo "WARNING_COUNT=$WARNING_COUNT"
            echo "CPUFREQ_CORE_WARNING_COUNT=$CPUFREQ_WARNING_COUNT"
            echo "IDLE_WARNING_COUNT=$IDLE_WARNING_COUNT"
          } | tee "$ARTIFACT_DIR/DIAGNOSTICS.txt"

      - name: Prepare final 44C report
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VEUX_DTB="$OUT_DIR/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"
          VMLINUX="$OUT_DIR/vmlinux"

          cp \
            "$IMAGE" \
            "$ARTIFACT_DIR/Image"

          cp \
            "$VEUX_DTB" \
            "$ARTIFACT_DIR/veux.dtb"

          IMAGE_SHA="$(
            sha256sum "$IMAGE" \
              | awk '{print $1}'
          )"

          DTB_SHA="$(
            sha256sum "$VEUX_DTB" \
              | awk '{print $1}'
          )"

          VMLINUX_SHA="$(
            sha256sum "$VMLINUX" \
              | awk '{print $1}'
          )"

          WARNING_COUNT="$(
            awk -F= \
              '$1=="WARNING_COUNT" {print $2}' \
              "$ARTIFACT_DIR/DIAGNOSTICS.txt"
          )"

          CASS_SYMBOL_COUNT="$(
            awk -F= \
              '$1=="CASS_SYMBOL_COUNT" {print $2}' \
              "$ARTIFACT_DIR/LINKED-KERNEL-STATE.txt"
          )"

          ROTATION_SYMBOL_COUNT="$(
            awk -F= \
              '$1=="ROTATION_SYMBOL_COUNT" {print $2}' \
              "$ARTIFACT_DIR/LINKED-KERNEL-STATE.txt"
          )"

          CPUSET_SYMBOL_COUNT="$(
            awk -F= \
              '$1=="CPUSET_SYMBOL_COUNT" {print $2}' \
              "$ARTIFACT_DIR/LINKED-KERNEL-STATE.txt"
          )"

          LPM_SLEEP_SYMBOL_COUNT="$(
            awk -F= \
              '$1=="LPM_SLEEP_DISABLED_SYMBOL_COUNT" {print $2}' \
              "$ARTIFACT_DIR/LINKED-KERNEL-STATE.txt"
          )"

          CPUFREQ_OBJ_SHA="$(
            awk -F= \
              '$1=="CPUFREQ_OBJECT_SHA256" {print $2}' \
              "$ARTIFACT_DIR/CPUFREQ-OBJECT-STATE.txt"
          )"

          LB_DIFF_SHA="$(
            awk -F= \
              '$1=="LB_CAPACITY_RESTORE_DIFF_SHA256" {print $2}' \
              "$ARTIFACT_DIR/LB-CAPACITY-STATE.txt"
          )"

          {
            echo "RESULT=PASS"
            echo "BASE_CANDIDATE_TREE=$EXPECTED_CANDIDATE_TREE"

            echo "CPUFREQ_MIN_COMMIT=$CPUFREQ_MIN_COMMIT"
            echo "CPUFREQ_MAX_COMMIT=$CPUFREQ_MAX_COMMIT"
            echo "CPUFREQ_MIN_COMMIT_ANCESTOR=YES"
            echo "CPUFREQ_MAX_COMMIT_ANCESTOR=YES"
            echo "CPUFREQ_MAX_PARENT_EQUALS_MIN_COMMIT=YES"

            echo "CPUFREQ_BEFORE_SHA256=$EXPECTED_CPUFREQ_BEFORE_SHA256"
            echo "CPUFREQ_AFTER_SHA256=$EXPECTED_CPUFREQ_AFTER_SHA256"
            echo "STORE_ONE_BEFORE_SHA256=$EXPECTED_STORE_ONE_BEFORE_SHA256"
            echo "STORE_ONE_AFTER_SHA256=$EXPECTED_STORE_ONE_AFTER_SHA256"
            echo "CPUFREQ_TARGETED_DIFF_SHA256=$EXPECTED_CPUFREQ_TARGETED_DIFF_SHA256"

            echo "SCALING_MIN_WRITE_NOOP_REMOVED=YES"
            echo "SCALING_MAX_BELOW_MIN_CLAMP_REMOVED=YES"
            echo "STANDARD_CPUFREQ_QOS_WRITE_RESTORED=YES"
            echo "CORRECTED_STORE_ONE_EQUALS_XIAOMI=YES"
            echo "CORRECTED_STORE_ONE_EQUALS_ANDROID_COMMON=YES"
            echo "CPUFREQ_OBJECT_BUILT=YES"
            echo "CPUFREQ_OBJECT_SHA256=$CPUFREQ_OBJ_SHA"

            echo "IDLE_FEATURE_CHAIN_REVERSED=YES"
            echo "DISPLAY_COUPLED_SLEEP_POLICY_REMOVED=YES"
            echo "SCREEN_ON_FORCED_WFI_REMOVED=YES"
            echo "SLEEP_DISABLED_DEFAULT_FALSE=YES"
            echo "SLEEP_DISABLED_PARAM_0664=YES"
            echo "LPM_SLEEP_DISABLED_SYMBOL_COUNT=$LPM_SLEEP_SYMBOL_COUNT"

            echo "SCHEDUTIL_BEFORE_SHA256=$EXPECTED_SCHEDUTIL_BEFORE_SHA256"
            echo "SCHEDUTIL_AFTER_SHA256=$EXPECTED_SCHEDUTIL_AFTER_SHA256"
            echo "LOWER_STEP_20_PERCENT_REMOVED=YES"
            echo "NORMAL_BOOST_CAP_UCLAMP_RESTORED=YES"

            echo "CASS_PATCH_SHA256=$EXPECTED_CASS_DIFF_SHA256"
            echo "CASS_PATCH_MATCHES_PROVEN_VERSION=YES"
            echo "CASS_SYMBOL_COUNT=$CASS_SYMBOL_COUNT"

            echo "SPRD_ROTATION_DISABLED=YES"
            echo "ROTATION_SYMBOL_COUNT=$ROTATION_SYMBOL_COUNT"

            echo "LB_CAPACITY_UNGATED_COMMIT=$LB_CAPACITY_COMMIT"
            echo "LB_CAPACITY_UNGATED_COMMIT_REVERSED=YES"
            echo "LB_CAPACITY_RESTORE_DIFF_SHA256=$LB_DIFF_SHA"
            echo "LB_CAPACITY_TIME_GATE=RESTORED"

            echo "CPUSETS_ENABLED=YES"
            echo "CPUSET_HARDCODED_0_7=NO"
            echo "CPUSET_SYMBOL_COUNT=$CPUSET_SYMBOL_COUNT"

            echo "PELT_RESTORED_PERIOD=8"
            echo "PELT_RESTORE_SOURCE=XIAOMI_VEUX"
            echo "PELT_HEADER_SHA256=$EXPECTED_XIAOMI_PELT_SHA256"

            echo "CONFIG_HZ_100_REMOVED=YES"
            echo "VEUX_DEFCONFIG_EXPLICIT_HZ=NO"
            echo "HZ_KCONFIG_DEFAULT=250"
            echo "HZ_RESOLVED_CHOICE=250"
            echo "CONFIG_HZ=250"

            echo "FULL_KERNEL_BUILD=PASS"
            echo "COMPILER_ERRORS=0"
            echo "COMPILER_WARNINGS=$WARNING_COUNT"
            echo "CPUFREQ_CORE_COMPILER_WARNINGS=0"
            echo "IDLE_COMPILER_WARNINGS=0"

            echo "IMAGE_CREATED=YES"
            echo "DTBS_BUILT=YES"
            echo "VEUX_DTB_PARSE=PASS"
            echo "IMAGE_SHA256=$IMAGE_SHA"
            echo "VMLINUX_SHA256=$VMLINUX_SHA"
            echo "VEUX_DTB_SHA256=$DTB_SHA"

            echo "RESUKISU_CHANGED=NO"
            echo "SUSFS_CHANGED=NO"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "DEVICE_FLASHED=NO"
          } | tee "$ARTIFACT_DIR/RESULT.txt"

      - name: Upload CPUFreq min max restore full build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-CPUFreq-Min-Max-Restore-Full-Build
          path: cpufreq-min-max-restore-full-build/
          if-no-files-found: error
          retention-days: 30
