        import hashlib, json, struct, sys
        from pathlib import Path
        boot=Path(sys.argv[1]).read_bytes()
        header_out,vbmeta_out,footer_out,report_out=map(Path,sys.argv[2:])
        sha=lambda b: hashlib.sha256(b).hexdigest()
        need=lambda c,m: None if c else (_ for _ in ()).throw(SystemExit('ERROR: '+m))
        need(len(boot)==134217728,'updated boot size')
        need(sha(boot)=='ab02eda6e4315ea20d672a580acb09a7d48646dd709ff07f7ebbe70b5cc4c96b','updated boot SHA')
        header=boot[:4096]; footer=boot[-64:]
        need(footer[:4]==b'AVBf','AVB footer magic')
        major,minor=struct.unpack_from('>II',footer,4)
        original,offset,size=struct.unpack_from('>QQQ',footer,12)
        need((major,minor)==(1,0),'AVB footer version')
        need((original,offset,size)==(51916800,51916800,896),'AVB footer geometry')
        vbmeta=boot[offset:offset+size]
        need(vbmeta[:4]==b'AVB0','embedded vbmeta magic')
        need(sha(header)=='fda70b19269443dca783ec0198ad0117de8dc895f95a70fce3698fd8cb523bd6','header SHA')
        need(sha(vbmeta)=='ad684b315b9c3f006123fac2cf5efe57f1b7de4e243624e98e51999690ee7cc3','vbmeta SHA')
        need(sha(footer)=='04cccbbae2ffcce73c324de576be36cca6e00b809e387157619e2d4226537790','footer SHA')
        header_out.write_bytes(header); vbmeta_out.write_bytes(vbmeta); footer_out.write_bytes(footer)
        report_out.write_text(json.dumps({'result':'PASS','boot_sha256':sha(boot),'header_sha256':sha(header),'vbmeta_sha256':sha(vbmeta),'footer_sha256':sha(footer),'vbmeta_offset':offset,'vbmeta_size':size},indent=2,sort_keys=True)+'\n')
        PYCOMP

        cat > "$PACKAGE/anykernel.sh" <<'EOF_AK3'
        ### AnyKernel3 Ramdisk Mod Script
        ## VEUX 5.4.274 standalone kernel installer

        properties() { '
        kernel.string=VEUX 5.4.274 ReSukiSU b2ac2fc8 SUSFS 2.2 HyperOS OS1.0.12.0
        do.devicecheck=1
        do.modules=0
        do.systemless=0
        do.cleanup=1
        do.cleanuponabort=1
        device.name1=veux
        device.name2=
        device.name3=
        device.name4=
        device.name5=
        supported.versions=13
        supported.patchlevels=2024-12 - 2024-12
        supported.vendorpatchlevels=2024-12 - 2024-12
