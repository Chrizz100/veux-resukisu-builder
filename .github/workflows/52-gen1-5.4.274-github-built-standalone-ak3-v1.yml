        p=Path(sys.argv[1]); stock=Path(sys.argv[2]).read_bytes(); expected=Path(sys.argv[3]).read_bytes(); out=Path(sys.argv[4])
        image=(p/'Image').read_bytes(); header=(p/'tools/boot-header-v3.bin').read_bytes(); vb=(p/'tools/boot-vbmeta-v3.bin').read_bytes(); footer=(p/'tools/boot-footer-v3.bin').read_bytes()
        r=bytearray(134217728); r[:4096]=header; r[4096:4096+len(image)]=image; r[29851648:29851648+22065152]=stock[45486080:45486080+22065152]; r[51916800:51916800+len(vb)]=vb; r[-64:]=footer; r=bytes(r)
        if r!=expected: raise SystemExit('ERROR standalone components do not recreate exact boot')
        sha=hashlib.sha256(r).hexdigest()
        if sha!='ab02eda6e4315ea20d672a580acb09a7d48646dd709ff07f7ebbe70b5cc4c96b': raise SystemExit('ERROR reconstructed SHA')
        out.write_text(json.dumps({'result':'PASS','byte_identical':True,'boot_sha256':sha,'boot_bytes':len(r)},indent=2,sort_keys=True)+'\n')
        PYREC

        python3 - "$PACKAGE" <<'PYSCAN'
        import re,sys
        from pathlib import Path
        root=Path(sys.argv[1]); pats=[re.compile(r'(?i)(?:\bAI\b|\bKI\b|ChatGPT|OpenAI|artificial intelligence|künstliche intelligenz|\bassistant\b)'),re.compile(r'(?i)(?:\bworkflow\b|\baudit\b|provenance|\btest plan\b|fake[- ]slot)')]; hits=[]
        for p in sorted(root.rglob('*')):
            if not p.is_file(): continue
            try: t=p.read_bytes().decode('utf-8')
            except UnicodeDecodeError: continue
            for pat in pats:
                for n,line in enumerate(t.splitlines(),1):
                    if pat.search(line): hits.append((p.relative_to(root).as_posix(),n,line))
        if hits: raise SystemExit('ERROR forbidden text '+repr(hits[:20]))
        print('AI_KI_CHATGPT_OPENAI_ASSISTANT_TEXT_HITS=0'); print('WORKFLOW_AUDIT_PROVENANCE_TESTPLAN_TEXT_HITS=0')
        PYSCAN

        find "$PACKAGE" -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
        build_zip() { local DEST="$1"; rm -f "$DEST"; (cd "$PACKAGE"; find . -type f -printf '%P\n' | LC_ALL=C sort | zip -X -9 "$DEST" -@ >/dev/null); }
        ZIP_A="$BUILD/standalone-A.zip"; ZIP_B="$BUILD/standalone-B.zip"
        build_zip "$ZIP_A"; build_zip "$ZIP_B"
        unzip -t "$ZIP_A" > "$OUTPUT/STANDALONE-A-ZIP-CRC.txt"; unzip -t "$ZIP_B" > "$OUTPUT/STANDALONE-B-ZIP-CRC.txt"
        cmp -s "$ZIP_A" "$ZIP_B"
        test "$(sha256sum "$ZIP_A" | awk '{print $1}')" = "$(sha256sum "$ZIP_B" | awk '{print $1}')"
        RELEASE_BYTES="$(stat -c '%s' "$ZIP_A")"; test "$RELEASE_BYTES" -lt "$MAX_RELEASE_BYTES"
        cp "$ZIP_A" "$OUTPUT/$RELEASE_ZIP_NAME"
        RELEASE_SHA256="$(sha256sum "$OUTPUT/$RELEASE_ZIP_NAME" | awk '{print $1}')"
        echo "RELEASE_SHA256=$RELEASE_SHA256" >> "$GITHUB_ENV"; echo "RELEASE_BYTES=$RELEASE_BYTES" >> "$GITHUB_ENV"
        printf '%s  %s\n' "$RELEASE_SHA256" "$RELEASE_ZIP_NAME" > "$OUTPUT/$RELEASE_ZIP_NAME.sha256"
        (cd "$PACKAGE"; find . -type f -printf '%P\n' | LC_ALL=C sort) > "$OUTPUT/STANDALONE-FILE-LIST.txt"
        (cd "$PACKAGE"; find . -type f -printf '%P\n' | LC_ALL=C sort | xargs -r sha256sum) > "$OUTPUT/STANDALONE-FILE-SHA256SUMS.txt"
        { echo 'STANDALONE_PACKAGE_ASSEMBLY=PASS'; echo "RELEASE_ZIP_NAME=$RELEASE_ZIP_NAME"; echo "RELEASE_ZIP_SHA256=$RELEASE_SHA256"; echo "RELEASE_ZIP_BYTES=$RELEASE_BYTES"; echo 'RELEASE_FILE_COUNT=17'; echo 'BOOT_IMG_PACKAGED=NO'; echo 'KERNEL_IMAGE_PACKAGED=YES'; echo 'DETERMINISTIC_RELEASE_BYTES=YES'; echo 'UNDER_65MB=YES'; echo "EXPECTED_RUNTIME_BOOT_SHA256=$EXPECTED_BOOT_SHA256"; echo "EXPECTED_RUNTIME_AVB_DIGEST=$EXPECTED_AVB_DIGEST"; echo 'AI_KI_CHATGPT_OPENAI_ASSISTANT_TEXT_HITS=0'; echo 'WORKFLOW_AUDIT_PROVENANCE_TESTPLAN_TEXT_HITS=0'; } | tee "$OUTPUT/W52-STANDALONE-PACKAGE.txt"
    - name: Runtime simulate GitHub-built Standalone AK3 on fake slot A and B
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$HARNESS"; mkdir -p "$HARNESS/package" "$HARNESS/bin" "$FAKE_BLOCK_ROOT"
        unzip -q "$OUTPUT/$RELEASE_ZIP_NAME" -d "$HARNESS/package"
        cat > "$HARNESS/package/tools/ak3-core.sh" <<'EOF'
        #!/bin/sh
        AKHOME="${AKHOME:-$(pwd)}"
        abort(){ printf '%s\n' "$*" >&2; exit 1; }
        ui_print(){ printf '%s\n' "$*"; }
        EOF
        cat > "$HARNESS/package/tools/busybox" <<'EOF'
        #!/bin/sh
        cmd="${1:-}"; shift || true
        case "$cmd" in
          dd)
            target=""; generated_write=0
            for arg in "$@"; do case "$arg" in of=*) target="${arg#of=}";; if=*.gen1-boot-new.img) generated_write=1;; esac; done
            /usr/bin/dd "$@"; rc=$?
            if [ "$rc" -eq 0 ] && [ "${INJECT_POSTWRITE_CORRUPT:-0}" = 1 ] && [ "$generated_write" = 1 ] && [ -n "$target" ]; then printf '\000' | /usr/bin/dd of="$target" bs=1 seek=0 count=1 conv=notrunc status=none; fi
            exit "$rc";;
          gzip) exec /usr/bin/gzip "$@";; sha256sum) exec /usr/bin/sha256sum "$@";; wc) exec /usr/bin/wc "$@";; tr) exec /usr/bin/tr "$@";; rm) exec /usr/bin/rm "$@";; sync) exec /usr/bin/sync "$@";; *) exec "$cmd" "$@";;
        esac
        EOF
        cat > "$HARNESS/bin/getprop" <<'EOF'
        #!/bin/sh
        case "${1:-}" in ro.boot.slot_suffix) printf '%s\n' "${FAKE_SLOT:-}";; ro.boot.flash.locked) printf '%s\n' "${FAKE_FLASH_LOCKED:-}";; ro.boot.vbmeta.device_state) printf '%s\n' "${FAKE_VBMETA_STATE:-}";; *) exit 0;; esac
        EOF
        chmod 755 "$HARNESS/package/tools/ak3-core.sh" "$HARNESS/package/tools/busybox" "$HARNESS/bin/getprop"
        sudo mkdir -p /dev/block/by-name; sudo rm -f /dev/block/by-name/boot_a /dev/block/by-name/boot_b
        sudo ln -s "$FAKE_BLOCK_ROOT/boot_a" /dev/block/by-name/boot_a; sudo ln -s "$FAKE_BLOCK_ROOT/boot_b" /dev/block/by-name/boot_b
        trap 'sudo rm -f /dev/block/by-name/boot_a /dev/block/by-name/boot_b' EXIT
        reset_slots(){ cp "$BUILD/stock_boot.img" "$FAKE_BLOCK_ROOT/boot_a"; cp "$BUILD/stock_boot.img" "$FAKE_BLOCK_ROOT/boot_b"; chmod 666 "$FAKE_BLOCK_ROOT/boot_a" "$FAKE_BLOCK_ROOT/boot_b"; }
        run_installer(){ local SLOT="$1" LOCKED="$2" STATE="$3" INJECT="${4:-0}"; (cd "$HARNESS/package"; env PATH="$HARNESS/bin:$PATH" AKHOME="$HARNESS/package" FAKE_SLOT="$SLOT" FAKE_FLASH_LOCKED="$LOCKED" FAKE_VBMETA_STATE="$STATE" INJECT_POSTWRITE_CORRUPT="$INJECT" bash ./anykernel.sh); }
        hash_slot(){ sha256sum "$1" | awk '{print $1}'; }
        reset_slots; run_installer _a 0 unlocked 0 > "$OUTPUT/RUNTIME-SLOT-A.log" 2>&1
        test "$(hash_slot "$FAKE_BLOCK_ROOT/boot_a")" = "$EXPECTED_BOOT_SHA256"; test "$(hash_slot "$FAKE_BLOCK_ROOT/boot_b")" = "$STOCK_BOOT_SHA256"
        reset_slots; run_installer _b 0 unlocked 0 > "$OUTPUT/RUNTIME-SLOT-B.log" 2>&1
        test "$(hash_slot "$FAKE_BLOCK_ROOT/boot_b")" = "$EXPECTED_BOOT_SHA256"; test "$(hash_slot "$FAKE_BLOCK_ROOT/boot_a")" = "$STOCK_BOOT_SHA256"
        { echo 'STANDALONE_RUNTIME_SLOT_A=PASS'; echo 'STANDALONE_RUNTIME_SLOT_B=PASS'; echo "EXPECTED_BOOT_SHA256=$EXPECTED_BOOT_SHA256"; echo 'OTHER_SLOT_PRESERVED=YES'; } | tee "$OUTPUT/W52-RUNTIME-A-B.txt"
    - name: Prove fail-closed gates and rollback for GitHub-built package
      shell: bash
      run: |
        set -euo pipefail
        sudo mkdir -p /dev/block/by-name; sudo rm -f /dev/block/by-name/boot_a /dev/block/by-name/boot_b
        sudo ln -s "$FAKE_BLOCK_ROOT/boot_a" /dev/block/by-name/boot_a; sudo ln -s "$FAKE_BLOCK_ROOT/boot_b" /dev/block/by-name/boot_b
        trap 'sudo rm -f /dev/block/by-name/boot_a /dev/block/by-name/boot_b' EXIT
        reset_slots(){ cp "$BUILD/stock_boot.img" "$FAKE_BLOCK_ROOT/boot_a"; cp "$BUILD/stock_boot.img" "$FAKE_BLOCK_ROOT/boot_b"; chmod 666 "$FAKE_BLOCK_ROOT/boot_a" "$FAKE_BLOCK_ROOT/boot_b"; }
        run_installer(){ local SLOT="$1" LOCKED="$2" STATE="$3" INJECT="${4:-0}"; (cd "$HARNESS/package"; env PATH="$HARNESS/bin:$PATH" AKHOME="$HARNESS/package" FAKE_SLOT="$SLOT" FAKE_FLASH_LOCKED="$LOCKED" FAKE_VBMETA_STATE="$STATE" INJECT_POSTWRITE_CORRUPT="$INJECT" bash ./anykernel.sh); }
        hash_slot(){ sha256sum "$1" | awk '{print $1}'; }
        reset_slots; set +e; run_installer _c 0 unlocked 0 > "$OUTPUT/RUNTIME-INVALID-SLOT.log" 2>&1; RC=$?; set -e; test "$RC" -ne 0; test "$(hash_slot "$FAKE_BLOCK_ROOT/boot_a")" = "$STOCK_BOOT_SHA256"; test "$(hash_slot "$FAKE_BLOCK_ROOT/boot_b")" = "$STOCK_BOOT_SHA256"
        reset_slots; set +e; run_installer _a 1 locked 0 > "$OUTPUT/RUNTIME-LOCKED.log" 2>&1; RC=$?; set -e; test "$RC" -ne 0; test "$(hash_slot "$FAKE_BLOCK_ROOT/boot_a")" = "$STOCK_BOOT_SHA256"; test "$(hash_slot "$FAKE_BLOCK_ROOT/boot_b")" = "$STOCK_BOOT_SHA256"
        reset_slots; printf '\001' | dd of="$FAKE_BLOCK_ROOT/boot_a" bs=1 seek=0 count=1 conv=notrunc status=none; NONSTOCK="$(hash_slot "$FAKE_BLOCK_ROOT/boot_a")"; test "$NONSTOCK" != "$STOCK_BOOT_SHA256"; set +e; run_installer _a 0 unlocked 0 > "$OUTPUT/RUNTIME-NONSTOCK.log" 2>&1; RC=$?; set -e; test "$RC" -ne 0; test "$(hash_slot "$FAKE_BLOCK_ROOT/boot_a")" = "$NONSTOCK"; test "$(hash_slot "$FAKE_BLOCK_ROOT/boot_b")" = "$STOCK_BOOT_SHA256"
        reset_slots; cp "$HARNESS/package/Image" "$HARNESS/package/Image.original"; printf '\001' | dd of="$HARNESS/package/Image" bs=1 seek=0 count=1 conv=notrunc status=none; set +e; run_installer _a 0 unlocked 0 > "$OUTPUT/RUNTIME-TAMPERED-IMAGE.log" 2>&1; RC=$?; set -e; test "$RC" -ne 0; test "$(hash_slot "$FAKE_BLOCK_ROOT/boot_a")" = "$STOCK_BOOT_SHA256"; test "$(hash_slot "$FAKE_BLOCK_ROOT/boot_b")" = "$STOCK_BOOT_SHA256"; mv "$HARNESS/package/Image.original" "$HARNESS/package/Image"
        reset_slots; set +e; run_installer _a 0 unlocked 1 > "$OUTPUT/RUNTIME-ROLLBACK.log" 2>&1; RC=$?; set -e; test "$RC" -ne 0; test "$(hash_slot "$FAKE_BLOCK_ROOT/boot_a")" = "$STOCK_BOOT_SHA256"; test "$(hash_slot "$FAKE_BLOCK_ROOT/boot_b")" = "$STOCK_BOOT_SHA256"; grep -Fq 'Exact stock boot was restored and verified.' "$OUTPUT/RUNTIME-ROLLBACK.log"
        { echo 'INVALID_SLOT_FAIL_CLOSED=PASS'; echo 'LOCKED_BOOTLOADER_FAIL_CLOSED=PASS'; echo 'NONSTOCK_BOOT_FAIL_CLOSED=PASS'; echo 'TAMPERED_IMAGE_FAIL_CLOSED=PASS'; echo 'POSTWRITE_CORRUPTION_ROLLBACK=PASS'; echo 'ROLLBACK_STOCK_HASH_VERIFIED=YES'; echo 'OTHER_SLOT_PRESERVED=YES'; } | tee "$OUTPUT/W52-RUNTIME-FAIL-CLOSED.txt"
    - name: Derive GEN1 W52 final standalone release verdict
      shell: bash
      run: |
        set -euo pipefail
        grep -Fxq 'W49_UPDATED_KERNEL_GATE=PASS' "$OUTPUT/W49-UPDATED-KERNEL-GATE.txt"
        grep -Fxq 'W21_DIRECT_INSTALLER_TEMPLATE_GATE=PASS' "$OUTPUT/W21-TEMPLATE-GATE.txt"
        grep -Fxq 'GEN1_W52_UPDATED_BOOT_RECONSTRUCTION=PASS' "$OUTPUT/W52-BOOT-BRIDGE.txt"
        grep -Fxq 'HISTORICAL_W19_CALIBRATION=PASS' "$OUTPUT/W52-BOOT-BRIDGE.txt"
        grep -Fxq 'STANDALONE_PACKAGE_ASSEMBLY=PASS' "$OUTPUT/W52-STANDALONE-PACKAGE.txt"
        grep -Fxq 'STANDALONE_RUNTIME_SLOT_A=PASS' "$OUTPUT/W52-RUNTIME-A-B.txt"
        grep -Fxq 'STANDALONE_RUNTIME_SLOT_B=PASS' "$OUTPUT/W52-RUNTIME-A-B.txt"
        grep -Fxq 'INVALID_SLOT_FAIL_CLOSED=PASS' "$OUTPUT/W52-RUNTIME-FAIL-CLOSED.txt"
        grep -Fxq 'LOCKED_BOOTLOADER_FAIL_CLOSED=PASS' "$OUTPUT/W52-RUNTIME-FAIL-CLOSED.txt"
        grep -Fxq 'NONSTOCK_BOOT_FAIL_CLOSED=PASS' "$OUTPUT/W52-RUNTIME-FAIL-CLOSED.txt"
        grep -Fxq 'TAMPERED_IMAGE_FAIL_CLOSED=PASS' "$OUTPUT/W52-RUNTIME-FAIL-CLOSED.txt"
        grep -Fxq 'POSTWRITE_CORRUPTION_ROLLBACK=PASS' "$OUTPUT/W52-RUNTIME-FAIL-CLOSED.txt"
        test -s "$OUTPUT/$RELEASE_ZIP_NAME"; test "$(stat -c '%s' "$OUTPUT/$RELEASE_ZIP_NAME")" = "$RELEASE_BYTES"; test "$(sha256sum "$OUTPUT/$RELEASE_ZIP_NAME" | awk '{print $1}')" = "$RELEASE_SHA256"
        { echo 'FINAL_RESULT=PASS_GEN1_52_V1_GITHUB_BUILT_STANDALONE_AK3'; echo 'DEVICE=veux'; echo 'ROM_FAMILY=Xiaomi_HyperOS_Stock'; echo "ROM_VERSION=$STOCK_ROM_VERSION"; echo "ANDROID_VERSION=$STOCK_ANDROID_VERSION"; echo "SECURITY_PATCH=$STOCK_SECURITY_PATCH"; echo "KERNEL_RELEASE=$W49_KERNEL_RELEASE"; echo "W49_IMAGE_SHA256=$W49_IMAGE_SHA256"; echo "RESUKISU_COMMIT=$UPDATED_RESUKISU_COMMIT"; echo 'RESUKISU_VERSION=v4.2.0-rc1-b2ac2fc8@ReSukiSU'; echo 'SUSFS_VERSION=v2.2.0'; echo 'SUSFS_FIXSET_CHANGED=NO'; echo 'SOURCE=GITHUB_W49_PLUS_GITHUB_W21_ARTIFACTS'; echo 'BOOT_V3_RECONSTRUCTION=PASS'; echo 'HISTORICAL_W19_CALIBRATION=PASS'; echo "EXPECTED_RUNTIME_BOOT_SHA256=$EXPECTED_BOOT_SHA256"; echo "EXPECTED_RUNTIME_AVB_DIGEST=$EXPECTED_AVB_DIGEST"; echo 'STANDALONE_RUNTIME_FILE_COUNT=17'; echo 'BOOT_IMG_PACKAGED=NO'; echo 'KERNEL_IMAGE_PACKAGED=YES'; echo "RELEASE_ZIP_NAME=$RELEASE_ZIP_NAME"; echo "RELEASE_ZIP_SHA256=$RELEASE_SHA256"; echo "RELEASE_ZIP_BYTES=$RELEASE_BYTES"; echo 'UNDER_65MB=YES'; echo 'DETERMINISTIC_RELEASE_BYTES=YES'; echo 'ACTIVE_SLOT_A_RUNTIME=PASS'; echo 'ACTIVE_SLOT_B_RUNTIME=PASS'; echo 'INVALID_SLOT_FAIL_CLOSED=PASS'; echo 'LOCKED_BOOTLOADER_FAIL_CLOSED=PASS'; echo 'NONSTOCK_BOOT_FAIL_CLOSED=PASS'; echo 'TAMPERED_IMAGE_FAIL_CLOSED=PASS'; echo 'ROLLBACK_FAULT_INJECTION=PASS'; echo 'OTHER_SLOT_PRESERVED=YES'; echo 'AI_KI_CHATGPT_OPENAI_ASSISTANT_TEXT_HITS=0'; echo 'WORKFLOW_AUDIT_PROVENANCE_TESTPLAN_TEXT_HITS=0'; echo 'VENDOR_BOOT_TOUCHED=NO'; echo 'DTBO_TOUCHED=NO'; echo 'TOP_LEVEL_VBMETA_TOUCHED=NO'; echo 'REAL_DEVICE_ACCESSED=NO'; echo 'ADB_USED=NO'; echo 'FASTBOOT_USED=NO'; echo 'FLASHING_PERFORMED=NO'; echo 'PHYSICAL_DEVICE_BOOT_TESTED=NO'; } | tee "$OUTPUT/W52-FINAL-VERDICT.txt"
    - name: Write W52 failure summary
      if: failure()
      shell: bash
      run: |
        set +e
        { echo 'GEN1 W52 v1: FAILURE'; echo "DATE_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"; echo "RELEASE_ZIP_NAME=$RELEASE_ZIP_NAME"; echo "W49_IMAGE_SHA256=$W49_IMAGE_SHA256"; echo "EXPECTED_BOOT_SHA256=$EXPECTED_BOOT_SHA256"; echo "RESUKISU_COMMIT=$UPDATED_RESUKISU_COMMIT"; echo 'SUSFS_VERSION=v2.2.0'; echo 'REAL_DEVICE_ACCESSED=NO'; echo 'ADB_USED=NO'; echo 'FASTBOOT_USED=NO'; echo 'FLASHING_PERFORMED=NO'; } > "$OUTPUT/W52-FAILURE-SUMMARY.txt"
    - name: Upload GitHub-built Standalone AK3 and diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: GEN1_52_V1_GITHUB_BUILT_STANDALONE_AK3-${{ github.run_number }}
        path: gen1-52-v1/output/
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 90
        compression-level: 0
    - name: Fail only after preserving W52 diagnostics
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if ! grep -Fxq 'FINAL_RESULT=PASS_GEN1_52_V1_GITHUB_BUILT_STANDALONE_AK3' "$OUTPUT/W52-FINAL-VERDICT.txt" 2>/dev/null; then echo 'ERROR: W52 final PASS verdict was not produced.'; exit 1; fi
        echo 'GEN1 W52 v1 GitHub-built Standalone AK3 PASS.'
'on':
  workflow_dispatch: {}
