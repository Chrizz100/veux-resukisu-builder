        FOOTER="$AKHOME/tools/boot-footer-v3.bin";
        NEWBOOT="$AKHOME/.gen1-boot-new.img";

        EXPECT_STOCK_SHA="ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5";
        EXPECT_IMAGE_SHA="0a00b12dc8d4f114b4343f473054b03d6e32767961077e43d345f0dc7271b4d3";
        EXPECT_BOOT_SHA="ab02eda6e4315ea20d672a580acb09a7d48646dd709ff07f7ebbe70b5cc4c96b";
        EXPECT_ROLLBACK_GZ_SHA="9a1532ccfc57b465256bba97863f927b80823fa8812a4d13e4f4c8bf9af0c78b";
        EXPECT_HEADER_SHA="fda70b19269443dca783ec0198ad0117de8dc895f95a70fce3698fd8cb523bd6";
        EXPECT_VBMETA_SHA="ad684b315b9c3f006123fac2cf5efe57f1b7de4e243624e98e51999690ee7cc3";
        EXPECT_FOOTER_SHA="04cccbbae2ffcce73c324de576be36cca6e00b809e387157619e2d4226537790";

        EXPECT_IMAGE_BYTES="29843968";
        EXPECT_BOOT_BYTES="134217728";

