name: Irena X 7371 R2 v1 R1-runtime-pass + LoadedApk boot-deopt rollback

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRAMEWORK_FAMILY: Irena-X
  FRAMEWORK_VERSION: v2.0.1
  FRAMEWORK_BUILD: "7371"
  XPOSED_API_LINE: "100+101"

  IRENA_REPO: silvzr/LSP-IrenaX
  IRENA_COMMIT: da439fbbed506dac6c66074af7fda8982aa4fc6a
  CURRENT_LSPLANT_SHA: c5b46bb4f6a99ffe0c77ce3ab006d3f67d5a2b1c
  CURRENT_DOBBY_SHA: dc7b4be06ad6c5dcfb0bb4ca2082b007d69eaed5

  OLD_WORKING_REPO: mywalkb/LSPosed_mod
  OLD_WORKING_COMMIT: 9770579f313de44397c295fd1cc44e3fcec4777c

  OFFICIAL_RELEASE_URL: https://github.com/silvzr/LSP-IrenaX/releases/download/v2.0.1/LSPosed-v2.0.1-7371-IrenaX-release.zip
  OFFICIAL_RELEASE_SHA256: 99e7aaf54dda0e6fa746c55613483a80620174f255dd05e102713778a9966d2f

  FINAL_ZIP: LSPosed-v2.0.1-7371-IrenaX-R2-v1-R1-base-loadedapk-deopt-rollback-release.zip

jobs:
  build:
    name: Build R2 v1 from confirmed R1-v2 runtime base
    runs-on: ubuntu-latest

    steps:
      - name: Freeze R2 development contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r2-output
          {
            echo "PARENT_RUNTIME=R1-v2"
            echo "PARENT_PACKAGE_SHA256=7ed948db19d92b0dd7776c424f93783e10210082ea807345228e901ab9ce4af7"
            echo "PARENT_DEVICE_FRAMEWORK=PASS (user-confirmed)"
            echo "PARENT_INGRESS=REPEATED_CRASH (user-confirmed)"
            echo "R2_BASE=official Irena X 7371 + exact R1-v2 mIncludeCode compatibility fix"
            echo "R2_ONLY_NEW_CHANGE=rollback exactly the three LoadedApk BOOT_IMAGE deopt entries to working 7244"
            echo "R2_REASON=the three LoadedApk deopts are absent in working 7244 and remain an untested PairIP hypothesis"
            echo "M_INCLUDE_CODE_FIX=PRESERVED_FROM_R1"
            echo "P7_MOUNT_SUPPRESSION=NOT_APPLIED"
            echo "P10_CERT_REBUILD_PATCH=NOT_APPLIED"
            echo "PAIRIP_BYPASS=NOT_ATTEMPTED"
            echo "MANAGER=official Irena 7371"
            echo "DAEMON=official Irena 7371"
            echo "NATIVE_LIBLSPD=official Irena 7371"
            echo "FIRST_DEVICE_GATE=manager remains clean; then reproduce Ingress under unchanged module configuration"
          } | tee r2-output/R2_DEVELOPMENT_CONTRACT.txt

      - name: Checkout pinned Irena X 7371
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IRENA_REPO }}
          ref: ${{ env.IRENA_COMMIT }}
          submodules: recursive
          fetch-depth: 0
          path: LSP-IrenaX
          persist-credentials: false

      - name: Checkout old working 7244 reference
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OLD_WORKING_REPO }}
          ref: ${{ env.OLD_WORKING_COMMIT }}
          submodules: false
          fetch-depth: 1
          path: LSPosed-7244-reference
          persist-credentials: false

      - name: Verify exact source pins and regression preconditions
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C LSP-IrenaX rev-parse HEAD)" = "$IRENA_COMMIT"
          test -z "$(git -C LSP-IrenaX status --porcelain)"
          test "$(git -C LSP-IrenaX/external/lsplant rev-parse HEAD)" = "$CURRENT_LSPLANT_SHA"
          test "$(git -C LSP-IrenaX/external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
          test -z "$(git -C LSP-IrenaX/external/lsplant status --porcelain)"
          test -z "$(git -C LSP-IrenaX/external/dobby status --porcelain)"

          test "$(git -C LSPosed-7244-reference rev-parse HEAD)" = "$OLD_WORKING_COMMIT"

          current="LSP-IrenaX/core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"
          old="LSPosed-7244-reference/core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"

          test -f "$current"
          test -f "$old"

          grep -Fq 'boolean includeCode = XposedHelpers.getBooleanField(loadedApk, "mIncludeCode");' "$current"
          grep -Fq 'else if (!includeCode)' "$current"

          if grep -Fq 'mIncludeCode' "$old"; then
            echo "old working 7244 unexpectedly contains mIncludeCode access"
            exit 1
          fi

          {
            echo "IRENA=$(git -C LSP-IrenaX rev-parse HEAD)"
            echo "LSPLANT=$(git -C LSP-IrenaX/external/lsplant rev-parse HEAD)"
            echo "DOBBY=$(git -C LSP-IrenaX/external/dobby rev-parse HEAD)"
            echo "OLD_WORKING_7244=$(git -C LSPosed-7244-reference rev-parse HEAD)"
            echo "CURRENT_7371_M_INCLUDE_CODE=PRESENT"
            echo "OLD_7244_M_INCLUDE_CODE=ABSENT"
          } | tee r2-output/R2_SOURCE_PINS_AND_PRECONDITIONS.txt

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: irena-x-r1-clean-base-${{ runner.os }}
          restore-keys: |
            irena-x-${{ runner.os }}
          save: false

      - name: Setup Ninja 1.12.1
        uses: seanmiddleditch/gha-setup-ninja@master
        with:
          version: 1.12.1

      - name: Remove Android bundled CMake
        shell: bash
        run: rm -rf "$ANDROID_HOME/cmake"

      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.caching=true'
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC'
            echo 'android.native.buildOutput=verbose'
          } >> ~/.gradle/gradle.properties

      - name: Download and verify official Irena 7371 release
        id: official
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            -o OFFICIAL_RELEASE.zip \
            "$OFFICIAL_RELEASE_URL"

          echo "$OFFICIAL_RELEASE_SHA256  OFFICIAL_RELEASE.zip" | sha256sum -c -

          rm -rf officialcmp
          mkdir officialcmp
          unzip -q OFFICIAL_RELEASE.zip -d officialcmp
          unzip -t OFFICIAL_RELEASE.zip

          test -f officialcmp/manager.apk
          test -f officialcmp/daemon.apk
          test -f officialcmp/framework/lspd.dex

          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("OFFICIAL_RELEASE.zip") as z:
              names = z.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit("duplicate names in official release")
              if len([n for n in names if not n.endswith("/")]) != 56:
                  raise SystemExit("official release file count is not 56")
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"official release CRC failure: {bad}")
          PY

          sha256sum OFFICIAL_RELEASE.zip \
            > r2-output/R2_OFFICIAL_RELEASE_SHA256.txt

      - name: Apply R1 fix plus only R2 LoadedApk deopt rollback
        id: patch
        if: steps.official.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -euo pipefail

          # A) Reproduce the confirmed R1-v2 mIncludeCode compatibility fix exactly.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java")
          s = p.read_text()

          line = '            boolean includeCode = XposedHelpers.getBooleanField(loadedApk, "mIncludeCode");\n'
          branch = (
              '            } else if (!includeCode) {\n'
              '                Hookers.logD("LoadedApk#<init> has no code, skip: " + mAppDir);\n'
              '                return;\n'
          )

          if s.count(line) != 1:
              raise SystemExit(f"R1 precondition failed: mIncludeCode read count={s.count(line)}")
          if s.count(branch) != 1:
              raise SystemExit(f"R1 precondition failed: no-code branch count={s.count(branch)}")

          s = s.replace(line, "", 1)
          s = s.replace(branch, "", 1)

          good = (
              '                    packageName = "system";\n'
              '                }\n'
              '            }\n'
              '\n'
              '            if (!XposedInit.loadedPackagesInProcess.add(packageName)) {\n'
          )
          if s.count(good) != 1:
              raise SystemExit("R1-v2 control-flow reproduction failed")
          if 'mIncludeCode' in s:
              raise SystemExit("R1-v2 mIncludeCode regression")

          p.write_text(s)
          PY

          # B) R2's only new variable relative to R1-v2:
          #    exact working-7244 InlinedMethodCallers.java.
          old_ref="../LSPosed-7244-reference/core/src/main/java/org/lsposed/lspd/deopt/InlinedMethodCallers.java"
          target="core/src/main/java/org/lsposed/lspd/deopt/InlinedMethodCallers.java"

          test -f "$old_ref"
          test -f "$target"

          grep -Fq '{"android.app.LoadedApk", "makeApplication", Boolean.TYPE, Instrumentation.class},' "$target"
          grep -Fq '{"android.app.LoadedApk", "makeApplicationInner", Boolean.TYPE, Instrumentation.class},' "$target"
          grep -Fq '{"android.app.LoadedApk", "makeApplicationInner", Boolean.TYPE, Instrumentation.class, Boolean.TYPE},' "$target"

          if grep -Fq '"android.app.LoadedApk", "makeApplication"' "$old_ref"; then
            echo "working 7244 reference unexpectedly contains LoadedApk makeApplication deopts"
            exit 1
          fi
          if grep -Fq 'import android.app.Instrumentation;' "$old_ref"; then
            echo "working 7244 reference unexpectedly imports Instrumentation"
            exit 1
          fi

          cp "$old_ref" "$target"
          cmp -s "$target" "$old_ref"

          sha256sum "$target" "$old_ref" \
            | tee ../r2-output/R2_INLINEDMETHODCALLERS_SHA256.txt

          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}" | tee ../r2-output/R2_SOURCE_DIFF_NAMES.txt

          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "core/src/main/java/org/lsposed/lspd/deopt/InlinedMethodCallers.java"
          test "${changed[1]}" = "core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"

          loaded="core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"
          if grep -Fq 'mIncludeCode' "$loaded"; then
            echo "R1-v2 mIncludeCode fix was lost"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("core/src/main/java/org/lsposed/lspd/deopt/InlinedMethodCallers.java")
          s = p.read_text()

          if "import android.app.Instrumentation;" in s:
              raise SystemExit("Instrumentation import remained after R2 rollback")

          for forbidden in (
              '{"android.app.LoadedApk", "makeApplication"',
              '{"android.app.LoadedApk", "makeApplicationInner"',
          ):
              if forbidden in s:
                  raise SystemExit(f"LoadedApk deopt remained: {forbidden}")

          required = (
              '{"android.app.Instrumentation", "newApplication", ClassLoader.class, String.class, Context.class},',
              '{"android.app.Instrumentation", "newApplication", ClassLoader.class, Context.class},',
              '{"android.app.ContextImpl", "getSharedPreferencesPath", String.class}',
          )
          for line in required:
              if line not in s:
                  raise SystemExit(f"required working-7244 BOOT_IMAGE caller missing: {line}")
          PY

          # Freeze every unrelated path.
          git diff --exit-code "$IRENA_COMMIT" -- \
            daemon/build.gradle.kts \
            daemon/src/main/java/org/lsposed/lspd/service/Dex2OatService.java \
            daemon/src/main/java/org/lsposed/lspd/util/InstallerVerifier.java \
            core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java \
            core/src/main/java/org/lsposed/lspd/core/Startup.java \
            core/src/main/java/org/lsposed/lspd/impl/LSPosedBridge.java \
            core/src/main/java/org/lsposed/lspd/impl/LSPosedHelper.java \
            core/src/main/jni/src/jni/hook_bridge.cpp \
            core/src/main/jni/src/native_api.cpp \
            magisk-loader/src/main/jni/api/zygisk_main.cpp \
            magisk-loader/src/main/jni/src/magisk_loader.cpp

          test "$(git -C external/lsplant rev-parse HEAD)" = "$CURRENT_LSPLANT_SHA"
          test "$(git -C external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
          test -z "$(git -C external/lsplant status --porcelain)"
          test -z "$(git -C external/dobby status --porcelain)"

          git diff > ../r2-output/R2_SOURCE_FULL.patch

          {
            echo "PARENT=R1-v2 device framework PASS"
            echo "PARENT_PACKAGE_SHA256=7ed948db19d92b0dd7776c424f93783e10210082ea807345228e901ab9ce4af7"
            echo "SOURCE_DELTA_VS_OFFICIAL=LoadedApkCtorHooker.java + InlinedMethodCallers.java"
            echo "NEW_DELTA_VS_R1=InlinedMethodCallers.java only"
            echo "M_INCLUDE_CODE_FIX=PRESERVED"
            echo "LOADEDAPK_BOOT_DEOPTS=ROLLED_BACK_EXACTLY_TO_WORKING_7244"
            echo "P7_MOUNT_SUPPRESSION=ABSENT"
            echo "P10_CERT_PATCH=ABSENT"
            echo "PAIRIP_BYPASS=ABSENT"
            echo "LSPLANT=$CURRENT_LSPLANT_SHA"
            echo "DOBBY=$CURRENT_DOBBY_SHA"
          } | tee ../r2-output/R2_PROVENANCE.txt

      - name: Build R2 v1 framework candidate
        id: r2build
        if: steps.patch.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ./gradlew clean zipAll --stacktrace --info 2>&1 | tee ../r2-build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > ../R2_BUILD_EXIT_CODE.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Freeze rebuilt framework payload
        id: framework
        if: steps.r2build.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t rel < <(find LSP-IrenaX/magisk-loader/release -maxdepth 1 -type f \
            -name 'LSPosed-v*-IrenaX-release.zip' -print | sort)

          test "${#rel[@]}" -eq 1
          cp "${rel[0]}" R2_BUILD_RELEASE.zip

          rm -rf r2buildcmp
          mkdir r2buildcmp
          unzip -q R2_BUILD_RELEASE.zip -d r2buildcmp

          test -f r2buildcmp/framework/lspd.dex
          sha256sum r2buildcmp/framework/lspd.dex \
            > r2-output/R2_REBUILT_FRAMEWORK_DEX_SHA256.txt

      - name: Create official-base R2 final package
        id: package
        if: steps.framework.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          official = Path("OFFICIAL_RELEASE.zip")
          out = Path("${{ env.FINAL_ZIP }}")
          rebuilt_dex = Path("r2buildcmp/framework/lspd.dex").read_bytes()
          rebuilt_dex_sha = hashlib.sha256(rebuilt_dex).hexdigest().encode()

          replacements = {
              "framework/lspd.dex": rebuilt_dex,
              "framework/lspd.dex.sha256": rebuilt_dex_sha,
          }

          with zipfile.ZipFile(official, "r") as zin, zipfile.ZipFile(out, "w") as zout:
              infos = zin.infolist()
              names = [i.filename for i in infos]

              if len(names) != len(set(names)):
                  raise SystemExit("duplicate names in official ZIP")

              for required in replacements:
                  if required not in names:
                      raise SystemExit(f"missing official payload: {required}")

              for info in infos:
                  data = replacements.get(info.filename)
                  if data is None:
                      data = zin.read(info.filename)
                  zout.writestr(info, data)

          def tree(path):
              with zipfile.ZipFile(path) as z:
                  names = z.namelist()
                  if len(names) != len(set(names)):
                      raise SystemExit(f"duplicate names: {path}")
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f"ZIP CRC failure {path}: {bad}")
                  return {
                      n: hashlib.sha256(z.read(n)).hexdigest()
                      for n in names
                      if not n.endswith("/")
                  }

          a = tree(official)
          b = tree(out)

          if set(a) != set(b):
              raise SystemExit("official/R2 file sets differ")
          if len(a) != 56:
              raise SystemExit(f"expected 56 files, got {len(a)}")

          diff = sorted(k for k in a if a[k] != b[k])
          expected = ["framework/lspd.dex", "framework/lspd.dex.sha256"]
          if diff != expected:
              raise SystemExit(f"unexpected official->R2 final delta: {diff}")

          # All manager/daemon/native payload must remain exact official 7371.
          for rel in (
              "manager.apk",
              "daemon.apk",
              "lib/arm64-v8a/liblspd.so",
              "lib/armeabi-v7a/liblspd.so",
              "lib/x86/liblspd.so",
              "lib/x86_64/liblspd.so",
          ):
              if a[rel] != b[rel]:
                  raise SystemExit(f"official payload changed unexpectedly: {rel}")

          with zipfile.ZipFile(out) as z:
              names = set(z.namelist())
              checked = 0
              for n in sorted(names):
                  if not n.endswith(".sha256"):
                      continue
                  payload = n[:-7]
                  if payload not in names:
                      continue
                  expected_hash = z.read(n).decode().strip().split()[0]
                  actual_hash = hashlib.sha256(z.read(payload)).hexdigest()
                  if expected_hash != actual_hash:
                      raise SystemExit(f"sidecar mismatch: {n}")
                  checked += 1

              if checked != 28:
                  raise SystemExit(f"expected 28 verified sidecars, got {checked}")

          sha = hashlib.sha256(out.read_bytes()).hexdigest()
          Path("r2-output/R2_FINAL_PACKAGE_SHA256.txt").write_text(
              f"{sha}  {out.name}\n"
          )
          Path("r2-output/R2_FINAL_PACKAGE_DIFF.txt").write_text(
              "framework/lspd.dex\nframework/lspd.dex.sha256\n"
          )
          Path("r2-output/R2_FINAL_SCOPE.txt").write_text(
              "BASE=official Irena X 7371 release\n"
              "ONLY_FINAL_PAYLOAD_CHANGE=framework/lspd.dex + sidecar\n"
              "MANAGER=official 7371 byte-identical\n"
              "DAEMON=official 7371 byte-identical\n"
              "DEX2OAT_BEHAVIOR=official 7371 unchanged\n"
              "ALL_LIBLSPD=official 7371 byte-identical\n"
              "M_INCLUDE_CODE_DIRECT_READ=removed (R1 preserved)\n"
              "LOADEDAPK_BOOT_DEOPTS=working 7244 exact rollback\n"
              "P7_MOUNT_SUPPRESSION=not present\n"
              "P10_CERT_REBUILD_PATCH=not needed because official daemon+manager are retained\n"
              "P11_DEOPT_ROLLBACK=not present\n"
              "PAIRIP_BYPASS=not present\n"
          )
          PY

          unzip -t "$FINAL_ZIP"
          cp "$FINAL_ZIP" "r2-output/INSTALL_THIS_${FINAL_ZIP}"

      - name: Write R2 device gates
        if: steps.package.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          cat > r2-output/R2_DEVICE_TEST_PLAN.txt <<'EOF'
          R2 DEVICE TEST ORDER

          Keep exactly the same module configuration and scopes used for the R1-v2 Ingress crash.
          Do not add or remove modules between the A/B runs.

          PHASE A — FRAMEWORK REGRESSION GATE
          1. Install the inner INSTALL_THIS_*.zip and reboot fully.
          2. Open Irena manager FIVE times from a closed state.
          3. PASS requires the same clean working framework behavior as R1-v2.
          4. If manager/framework regresses even once: R2 DEVICE FAIL. STOP.

          PHASE B — HOOK-ACTIVE CHECK
          5. Confirm the Xposed/module path is active with the same known module setup.
          6. If hooks are not active, do not count an Ingress start as a PairIP PASS.

          PHASE C — PAIRIP A/B TEST
          7. Cold-start Ingress THREE times.
          8. PASS target: 3/3 starts without the recurring crash while hooks remain active.
          9. FAIL: any recurring crash. Stop and preserve fresh LSPosed/tombstone logs.

          INTERPRETATION
          - 3/3 starts + hooks active: strong evidence the added 7371 LoadedApk boot deopts are causal.
          - crash persists: deopt hypothesis FAIL; preserve R1-v2 as framework checkpoint and move to the next isolated HookBridge/API-101 difference.
          - This test changes no dex2oat behavior, LSPlant, Dobby, manager, daemon or signature handling.
          EOF

      - name: Collect R2 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r2-output

          cp R2_BUILD_EXIT_CODE.txt r2-output/ 2>/dev/null || true
          cp r2-build.log r2-output/ 2>/dev/null || true
          cp R2_BUILD_RELEASE.zip r2-output/ 2>/dev/null || true
          cp OFFICIAL_RELEASE.zip r2-output/OFFICIAL_7371_RELEASE_REFERENCE.zip 2>/dev/null || true

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          out = Path("r2-output")
          manifest = out / "R2_EVIDENCE_SHA256SUMS.txt"

          files = sorted(
              p for p in out.rglob("*")
              if p.is_file() and p != manifest
          )

          with manifest.open("w") as f:
              for p in files:
                  rel = p.relative_to(out).as_posix()
                  f.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}\n")
          PY

          (
            cd r2-output
            sha256sum -c R2_EVIDENCE_SHA256SUMS.txt
          )

      - name: Final R2 fail-closed static gate
        id: finalgate
        shell: bash
        run: |
          set -euo pipefail

          test -f R2_BUILD_EXIT_CODE.txt
          test "$(cat R2_BUILD_EXIT_CODE.txt)" = "0"

          diff -u <(printf '%s\n' \
            core/src/main/java/org/lsposed/lspd/deopt/InlinedMethodCallers.java \
            core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java) \
            r2-output/R2_SOURCE_DIFF_NAMES.txt

          diff -u <(printf '%s\n' \
            framework/lspd.dex \
            framework/lspd.dex.sha256) \
            r2-output/R2_FINAL_PACKAGE_DIFF.txt

          grep -q '^P7_MOUNT_SUPPRESSION=ABSENT$' r2-output/R2_PROVENANCE.txt
          grep -q '^P10_CERT_PATCH=ABSENT$' r2-output/R2_PROVENANCE.txt
          grep -q '^LOADEDAPK_BOOT_DEOPTS=ROLLED_BACK_EXACTLY_TO_WORKING_7244$' r2-output/R2_PROVENANCE.txt
          grep -q '^PAIRIP_BYPASS=ABSENT$' r2-output/R2_PROVENANCE.txt

          test -f "r2-output/INSTALL_THIS_${FINAL_ZIP}"

          (
            cd r2-output
            sha256sum -c R2_EVIDENCE_SHA256SUMS.txt
          )

          {
            echo "RESULT=R2_V1_STATIC_FULL_PASS_DEVICE_CANDIDATE_CREATED"
            echo "PARENT=R1-v2 device framework PASS"
            echo "PARENT_PACKAGE_SHA256=7ed948db19d92b0dd7776c424f93783e10210082ea807345228e901ab9ce4af7"
            echo "BASE=official Irena X 7371"
            echo "SOURCE_CHANGE_VS_OFFICIAL=LoadedApkCtorHooker.java + InlinedMethodCallers.java"
            echo "NEW_CHANGE_VS_R1=InlinedMethodCallers.java only"
            echo "FINAL_PACKAGE_DELTA=framework/lspd.dex + framework/lspd.dex.sha256 only"
            echo "MANAGER=official 7371"
