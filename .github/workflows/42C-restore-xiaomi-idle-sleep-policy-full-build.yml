name: 42C - VEUX Restore Xiaomi Idle Sleep Policy Full Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      ARCH: arm64

      COMMON_REF: "android11-5.4.274_r00"
      STOCK_REF: "veux-r-oss"

      STABILITY_REVERT: "f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80"

      LB_CAPACITY_COMMIT: "2c1495be9eabac845acc8da45f070622d6455091"

      IDLE_SCREEN_COMMIT: "64e34240600a0c90072972a6c3d86f1d6ec85c53"
      IDLE_EXPOSE_COMMIT: "4ac606c780ae02a075d75a2703be68880761531a"
      IDLE_NOTIFIER_COMMIT: "8bc9cc6e197c0d1cf166ed94bb53ce41add1c828"
      IDLE_OPTIMIZE_COMMIT: "1d49e9b3308a7eacd75ed67f4112914e74ee60db"

      EXPECTED_CANDIDATE_TREE: "5d25b7e0124d7fb695f3f07b45928fcb5780d0e8"

      EXPECTED_SCHEDUTIL_BEFORE_SHA256: "9d56491a427ee12f1156ae907c5aa647bf1a1b35bf13c725a08e73ef295274b7"
      EXPECTED_SCHEDUTIL_AFTER_SHA256: "987c9598f16b22a1e7b343475691687d309122de447494cd1a2b5ea8cbbafffc"

      EXPECTED_CASS_DIFF_SHA256: "67abb81be8c2d7727c3e4c8a92419c9e9a3d97ee3d3e5355d3acabce34adf659"

      EXPECTED_XIAOMI_PELT_SHA256: "bad23ba491cc5d4669936507b392888765aa65fd8063b2a95a492d6b0dca0cb0"

      EXPECTED_HZ_KCONFIG_SHA256: "685e9a79f3dbf17e9bd5b402dfd25ad014886fbe1b6975a0913b3621519cd7fe"

      EXPECTED_VEUX_DTB_SHA256: "42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37"

      CLANG_PREBUILT_COMMIT: "aa2e4a514a6c85eebcc4a27149eaf9244e951a1e"

      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      OUT_DIR: out
      ARTIFACT_DIR: ${{ github.workspace }}/idle-sleep-restore-full-build

    steps:
      - name: Prepare probe directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$ARTIFACT_DIR" \
            "$TOOLCHAIN_DIR"

          cat > "$ARTIFACT_DIR/PLAN.txt" <<'EOF'
          VEUX Restore Xiaomi Idle Sleep Policy Full Build
          =================================================

          41P established:

          Candidate 2:
          - sleep_disabled defaults to true under CONFIG_DRM_PANEL
          - the module parameter is read-only there
          - display UNBLANK sets sleep_disabled=true
          - display POWERDOWN/LP sets sleep_disabled=false
          - Goodix panel is connected to a DRM panel notifier
          - idle selection returns state 0 while sleep_disabled
          - idle entry falls back to cpu_do_idle()
          - lpm_sleep_disabled() is exported
          - generic cpuidle latency notifier depends on lpm_sleep_disabled()

          Xiaomi VEUX:
          - no display-coupled sleep_disabled policy
          - normal sleep_disabled default false
          - normal writable 0664 module parameter
          - no lpm_sleep_disabled() export
          - no generic cpuidle lpm_sleep_disabled() integration

          Exact current-tree blame identified four active feature commits:

          64e34240600a0c90072972a6c3d86f1d6ec85c53
          lpm-levels: Disable deep idle states when the screen is on

          4ac606c780ae02a075d75a2703be68880761531a
          lpm-levels: Expose `sleep_disabled`

          8bc9cc6e197c0d1cf166ed94bb53ce41add1c828
          cpuidle: Make notifier no-op when restricted to WFI

          1d49e9b3308a7eacd75ed67f4112914e74ee60db
          lpm-levels: Optimize `sleep_disabled`

          42C reverses exactly those four commits in reverse chronological
          dependency order:

          1. 1d49e9b...
          2. 8bc9cc6...
          3. 4ac606c...
          4. 64e3424...

          Cumulative previously validated corrections retained:
          - CASS MaxFreq/Thermal adaptation
          - SPRD task rotation disabled
          - standard LB CPU-capacity rate limit restored
          - CONFIG_CPUSETS restored
          - exact Xiaomi VEUX PELT8 restored
          - custom CONFIG_HZ_100 removed
          - Kconfig default HZ250 restored
          - custom schedutil 20% lower-step heuristic removed
          - normal schedutil boost-and-cap UClamp restored

          No ReSukiSU change.
          No SUSFS change.
          No boot.img.
          No flashable ZIP.
          No device access.
          No flashing.
          EOF

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python-is-python3 \
            rsync \
            xz-utils \
            zstd

      - name: Install exact Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz" \
            -o "${RUNNER_TEMP}/clang-r416183b.tar.gz"

          tar \
            -xzf "${RUNNER_TEMP}/clang-r416183b.tar.gz" \
            -C "$TOOLCHAIN_DIR"

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

          "$TOOLCHAIN_DIR/bin/clang" --version \
            | tee "$ARTIFACT_DIR/clang-version.txt"

          "$TOOLCHAIN_DIR/bin/ld.lld" --version \
            | tee -a "$ARTIFACT_DIR/clang-version.txt"

          if ! "$TOOLCHAIN_DIR/bin/clang" --version \
            | grep -q 'r416183b'
          then
            echo "ERROR: expected clang-r416183b"
            exit 1
          fi

          for tool in \
            clang \
            ld.lld \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-size \
            llvm-strip
          do
            if [ ! -x "$TOOLCHAIN_DIR/bin/$tool" ]; then
              echo "ERROR: missing toolchain binary: $tool"
              exit 1
            fi
          done

      - name: Checkout exact VEUX source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: "20240619"
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Recreate exact Candidate 2
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          BASE_SHA="$(git rev-parse HEAD)"
          BASE_TREE="$(git rev-parse HEAD^{tree})"

          git remote remove android-common 2>/dev/null || true

          git remote add \
            android-common \
            https://android.googlesource.com/kernel/common

          git fetch \
            --no-tags \
            android-common \
            "$COMMON_REF"

          COMMON_SHA="$(git rev-parse FETCH_HEAD)"

          git update-ref \
            refs/remotes/android-common/audit-base \
            "$COMMON_SHA"

          git merge \
            --no-edit \
            "$COMMON_SHA"

          MERGED_SHA="$(git rev-parse HEAD)"
          MERGED_TREE="$(git rev-parse HEAD^{tree})"

          git cat-file -e \
            "${STABILITY_REVERT}^{commit}"

          git revert \
            --no-edit \
            "$STABILITY_REVERT"

          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"

          KERNEL_VERSION="$(
            make -s kernelversion
          )"

          if [ "$KERNEL_VERSION" != "5.4.274" ]; then
            echo "ERROR: expected Linux 5.4.274"
            echo "Actual: $KERNEL_VERSION"
            exit 1
          fi

          if [ "$CANDIDATE_TREE" != "$EXPECTED_CANDIDATE_TREE" ]; then
            echo "ERROR: Candidate 2 tree mismatch"
            echo "Expected: $EXPECTED_CANDIDATE_TREE"
            echo "Actual:   $CANDIDATE_TREE"
            exit 1
          fi

          echo "CANDIDATE_TIP=$CANDIDATE_SHA" \
            >> "$GITHUB_ENV"

          {
            echo "BASE_SHA=$BASE_SHA"
            echo "BASE_TREE=$BASE_TREE"
            echo "COMMON_SHA=$COMMON_SHA"
            echo "MERGED_SHA=$MERGED_SHA"
            echo "MERGED_TREE=$MERGED_TREE"
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "CANDIDATE_TREE=$CANDIDATE_TREE"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "COMMON_REF=$COMMON_REF"
            echo "STABILITY_REVERT=$STABILITY_REVERT"
            echo "LB_CAPACITY_COMMIT=$LB_CAPACITY_COMMIT"
            echo "IDLE_SCREEN_COMMIT=$IDLE_SCREEN_COMMIT"
            echo "IDLE_EXPOSE_COMMIT=$IDLE_EXPOSE_COMMIT"
            echo "IDLE_NOTIFIER_COMMIT=$IDLE_NOTIFIER_COMMIT"
            echo "IDLE_OPTIMIZE_COMMIT=$IDLE_OPTIMIZE_COMMIT"
          } | tee "$ARTIFACT_DIR/IDENTITY.txt"

      - name: Fetch official Xiaomi VEUX reference
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git remote remove xiaomi 2>/dev/null || true

          git remote add \
            xiaomi \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git

          git fetch \
            --no-tags \
            xiaomi \
            "+refs/heads/${STOCK_REF}:refs/remotes/xiaomi/${STOCK_REF}"

          STOCK_SHA="$(
            git rev-parse "xiaomi/${STOCK_REF}"
          )"

          {
            echo "STOCK_REF=$STOCK_REF"
            echo "STOCK_SHA=$STOCK_SHA"
          } | tee "$ARTIFACT_DIR/XIAOMI-REFERENCE.txt"

      - name: Verify exact 41P idle feature commits
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          for COMMIT in \
            "$IDLE_SCREEN_COMMIT" \
            "$IDLE_EXPOSE_COMMIT" \
            "$IDLE_NOTIFIER_COMMIT" \
            "$IDLE_OPTIMIZE_COMMIT"
          do
            git cat-file -e \
              "${COMMIT}^{commit}"

            if ! git merge-base \
              --is-ancestor \
              "$COMMIT" \
              "$CANDIDATE_TIP"
            then
              echo "ERROR: idle commit is not an ancestor of Candidate 2"
              echo "COMMIT=$COMMIT"
              exit 1
            fi
          done

          mapfile -t SCREEN_FILES < <(
            git diff-tree \
              --no-commit-id \
              --name-only \
              -r \
              "$IDLE_SCREEN_COMMIT" \
              | sort
          )

          if [ "${#SCREEN_FILES[@]}" -ne 1 ] \
            || [ "${SCREEN_FILES[0]}" != "drivers/cpuidle/lpm-levels.c" ]
          then
            echo "ERROR: unexpected screen-idle commit file set"
            printf '%s\n' "${SCREEN_FILES[@]}"
            exit 1
          fi

          mapfile -t EXPOSE_FILES < <(
            git diff-tree \
              --no-commit-id \
              --name-only \
              -r \
              "$IDLE_EXPOSE_COMMIT" \
              | sort
          )

          EXPECTED_EXPOSE=(
            "drivers/cpuidle/lpm-levels.c"
            "include/linux/cpuidle.h"
          )

          if [ "${EXPOSE_FILES[*]}" != "${EXPECTED_EXPOSE[*]}" ]; then
            echo "ERROR: unexpected expose commit file set"
            printf '%s\n' "${EXPOSE_FILES[@]}"
            exit 1
          fi

          mapfile -t NOTIFIER_FILES < <(
            git diff-tree \
              --no-commit-id \
              --name-only \
              -r \
              "$IDLE_NOTIFIER_COMMIT" \
              | sort
          )

          if [ "${#NOTIFIER_FILES[@]}" -ne 1 ] \
            || [ "${NOTIFIER_FILES[0]}" != "drivers/cpuidle/cpuidle.c" ]
          then
            echo "ERROR: unexpected notifier commit file set"
            printf '%s\n' "${NOTIFIER_FILES[@]}"
            exit 1
          fi

          mapfile -t OPTIMIZE_FILES < <(
            git diff-tree \
              --no-commit-id \
              --name-only \
              -r \
              "$IDLE_OPTIMIZE_COMMIT" \
              | sort
          )

          if [ "${#OPTIMIZE_FILES[@]}" -ne 1 ] \
            || [ "${OPTIMIZE_FILES[0]}" != "drivers/cpuidle/lpm-levels.c" ]
          then
            echo "ERROR: unexpected optimize commit file set"
            printf '%s\n' "${OPTIMIZE_FILES[@]}"
            exit 1
          fi

          git show \
            --format= \
            --no-ext-diff \
            --no-color \
            "$IDLE_SCREEN_COMMIT" \
            > "$ARTIFACT_DIR/IDLE-SCREEN-COMMIT.diff"

          git show \
            --format= \
            --no-ext-diff \
            --no-color \
            "$IDLE_EXPOSE_COMMIT" \
            > "$ARTIFACT_DIR/IDLE-EXPOSE-COMMIT.diff"

          git show \
            --format= \
            --no-ext-diff \
            --no-color \
            "$IDLE_NOTIFIER_COMMIT" \
            > "$ARTIFACT_DIR/IDLE-NOTIFIER-COMMIT.diff"

          git show \
            --format= \
            --no-ext-diff \
            --no-color \
            "$IDLE_OPTIMIZE_COMMIT" \
            > "$ARTIFACT_DIR/IDLE-OPTIMIZE-COMMIT.diff"

          grep -qF \
            'static bool sleep_disabled = true;' \
            "$ARTIFACT_DIR/IDLE-SCREEN-COMMIT.diff"

          grep -qF \
            'goodix_get_panel' \
            "$ARTIFACT_DIR/IDLE-SCREEN-COMMIT.diff"

          grep -qF \
            'bool lpm_sleep_disabled(void)' \
            "$ARTIFACT_DIR/IDLE-EXPOSE-COMMIT.diff"

          grep -qF \
            'if (!lpm_sleep_disabled())' \
            "$ARTIFACT_DIR/IDLE-NOTIFIER-COMMIT.diff"

          grep -qF \
            'if (!cpu || sleep_disabled)' \
            "$ARTIFACT_DIR/IDLE-OPTIMIZE-COMMIT.diff"

          grep -qF \
            'cpu_do_idle();' \
            "$ARTIFACT_DIR/IDLE-OPTIMIZE-COMMIT.diff"

          {
            echo "IDLE_SCREEN_COMMIT_VERIFIED=YES"
            echo "IDLE_EXPOSE_COMMIT_VERIFIED=YES"
            echo "IDLE_NOTIFIER_COMMIT_VERIFIED=YES"
            echo "IDLE_OPTIMIZE_COMMIT_VERIFIED=YES"
            echo "ALL_IDLE_COMMITS_ARE_CANDIDATE_ANCESTORS=YES"
          } | tee "$ARTIFACT_DIR/IDLE-COMMIT-STATE.txt"

      - name: Capture Candidate idle state before restore
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LPM="drivers/cpuidle/lpm-levels.c"
          CORE="drivers/cpuidle/cpuidle.c"
          HEADER="include/linux/cpuidle.h"

          for FILE in \
            "$LPM" \
            "$CORE" \
            "$HEADER"
          do
            sha256sum "$FILE"
          done | tee "$ARTIFACT_DIR/IDLE-BEFORE-HASHES.txt"

          cp "$LPM" \
            "$ARTIFACT_DIR/lpm-levels-before.c"

          cp "$CORE" \
            "$ARTIFACT_DIR/cpuidle-core-before.c"

          cp "$HEADER" \
            "$ARTIFACT_DIR/cpuidle-header-before.h"

          REQUIRED=(
            'static bool sleep_disabled = true;'
            'module_param_named(sleep_disabled, sleep_disabled, bool, 0444);'
            'lpm_drm_panel_notify'
            'goodix_get_panel'
            'drm_panel_notifier_register'
            'if (!cpu || sleep_disabled)'
            'bool lpm_sleep_disabled(void)'
          )

          for TOKEN in "${REQUIRED[@]}"; do
            if ! grep -qF "$TOKEN" "$LPM"; then
              echo "ERROR: expected Candidate idle token missing: $TOKEN"
              exit 1
            fi
          done

          if ! grep -qF \
            'if (!lpm_sleep_disabled())' \
            "$CORE"
          then
            echo "ERROR: Candidate generic cpuidle guard missing"
            exit 1
          fi

          if ! grep -qF \
            'extern bool lpm_sleep_disabled(void);' \
            "$HEADER"
          then
            echo "ERROR: Candidate lpm_sleep_disabled header declaration missing"
            exit 1
          fi

          {
            echo "CANDIDATE_DISPLAY_COUPLED_SLEEP_POLICY=YES"
            echo "CANDIDATE_SCREEN_ON_WFI_POLICY=YES"
            echo "CANDIDATE_LPM_SLEEP_EXPORT=YES"
          } | tee "$ARTIFACT_DIR/IDLE-BEFORE-STATE.txt"

      - name: Reverse exact display coupled idle feature chain
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git revert \
            --no-edit \
            "$IDLE_OPTIMIZE_COMMIT"

          git revert \
            --no-edit \
            "$IDLE_NOTIFIER_COMMIT"

          git revert \
            --no-edit \
            "$IDLE_EXPOSE_COMMIT"

          git revert \
            --no-edit \
            "$IDLE_SCREEN_COMMIT"

          IDLE_RESTORED_TIP="$(git rev-parse HEAD)"

          echo "IDLE_RESTORED_TIP=$IDLE_RESTORED_TIP" \
            >> "$GITHUB_ENV"

          git diff \
            --no-ext-diff \
            --no-color \
            "$CANDIDATE_TIP" \
            "$IDLE_RESTORED_TIP" \
            -- \
            drivers/cpuidle/lpm-levels.c \
            drivers/cpuidle/cpuidle.c \
            include/linux/cpuidle.h \
            > "$ARTIFACT_DIR/IDLE-SLEEP-RESTORE.diff"

          IDLE_DIFF_SHA="$(
            sha256sum \
              "$ARTIFACT_DIR/IDLE-SLEEP-RESTORE.diff" \
              | awk '{print $1}'
          )"

          mapfile -t CHANGED_FILES < <(
            git diff \
              --name-only \
              "$CANDIDATE_TIP" \
              "$IDLE_RESTORED_TIP" \
              | sort
          )

          EXPECTED_FILES=(
            "drivers/cpuidle/cpuidle.c"
            "drivers/cpuidle/lpm-levels.c"
            "include/linux/cpuidle.h"
          )

          if [ "${CHANGED_FILES[*]}" != "${EXPECTED_FILES[*]}" ]; then
            echo "ERROR: idle feature reversal changed unexpected files"
            printf '%s\n' "${CHANGED_FILES[@]}"
            exit 1
          fi

          {
            echo "IDLE_FEATURE_CHAIN_REVERSED=YES"
            echo "IDLE_RESTORE_CHANGED_FILE_COUNT=${#CHANGED_FILES[@]}"
            echo "IDLE_RESTORE_DIFF_SHA256=$IDLE_DIFF_SHA"
            echo "IDLE_RESTORED_TIP=$IDLE_RESTORED_TIP"
          } | tee "$ARTIFACT_DIR/IDLE-RESTORE-STATE.txt"

      - name: Verify restored Xiaomi style idle semantics
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LPM="drivers/cpuidle/lpm-levels.c"
          CORE="drivers/cpuidle/cpuidle.c"
          HEADER="include/linux/cpuidle.h"

          if grep -qF \
            'static bool sleep_disabled = true;' \
            "$LPM"
          then
            echo "ERROR: sleep_disabled still defaults true"
            exit 1
          fi

          if ! grep -qF \
            'static bool sleep_disabled;' \
            "$LPM"
          then
            echo "ERROR: normal sleep_disabled declaration missing"
            exit 1
          fi

          if ! grep -qF \
            'module_param_named(sleep_disabled, sleep_disabled, bool, 0664);' \
            "$LPM"
          then
            echo "ERROR: normal writable sleep_disabled parameter missing"
            exit 1
          fi

          FORBIDDEN_LPM=(
            'lpm_drm_panel_notify'
            'goodix_get_panel'
            'drm_panel_notifier_register'
            'if (!cpu || sleep_disabled)'
            'bool lpm_sleep_disabled(void)'
            'EXPORT_SYMBOL(lpm_sleep_disabled);'
          )

          for TOKEN in "${FORBIDDEN_LPM[@]}"; do
            if grep -qF "$TOKEN" "$LPM"; then
              echo "ERROR: custom idle token remains: $TOKEN"
              exit 1
            fi
          done

          if grep -qF \
            'if (!lpm_sleep_disabled())' \
            "$CORE"
          then
            echo "ERROR: generic cpuidle custom sleep guard remains"
            exit 1
          fi

          if grep -qF \
            'lpm_sleep_disabled' \
            "$HEADER"
          then
            echo "ERROR: lpm_sleep_disabled header integration remains"
            exit 1
          fi

          if ! grep -qF \
            'if (!cpu)' \
            "$LPM"
          then
            echo "ERROR: normal idle selection CPU guard missing"
            exit 1
          fi

          if ! grep -qF \
            'if (sleep_disabled)' \
            "$LPM"
          then
            echo "ERROR: normal sleep_disabled restriction path missing"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          core = Path(
              "drivers/cpuidle/cpuidle.c"
          ).read_text()

          marker = """\
          static int cpuidle_latency_notify(struct notifier_block *b,
                  unsigned long l, void *v)
          {
          """

          start = core.find(marker)

          if start < 0:
              raise SystemExit(
                  "ERROR: cpuidle_latency_notify function not found"
              )

          end = core.find(
              "\n}",
              start,
          )

          if end < 0:
              raise SystemExit(
                  "ERROR: cpuidle_latency_notify function end not found"
              )

          body = core[
              start:end + 2
          ]

          if "wake_up_all_idle_cpus();" not in body:
              raise SystemExit(
                  "ERROR: unconditional idle wake call missing"
              )

          if "lpm_sleep_disabled" in body:
              raise SystemExit(
                  "ERROR: custom sleep-disabled notifier guard remains"
              )
          PY

          cp "$LPM" \
            "$ARTIFACT_DIR/lpm-levels-after-idle-restore.c"

          cp "$CORE" \
            "$ARTIFACT_DIR/cpuidle-core-after-idle-restore.c"

          cp "$HEADER" \
            "$ARTIFACT_DIR/cpuidle-header-after-idle-restore.h"

          for FILE in \
            "$LPM" \
            "$CORE" \
            "$HEADER"
          do
            sha256sum "$FILE"
          done | tee "$ARTIFACT_DIR/IDLE-AFTER-HASHES.txt"

          {
            echo "DISPLAY_COUPLED_SLEEP_POLICY_REMOVED=YES"
            echo "SLEEP_DISABLED_DEFAULT_FALSE=YES"
            echo "SLEEP_DISABLED_PARAM_0664=YES"
            echo "DRM_IDLE_NOTIFIER_REMOVED=YES"
            echo "GOODIX_IDLE_PANEL_BINDING_REMOVED=YES"
            echo "SCREEN_ON_FORCED_WFI_REMOVED=YES"
            echo "LPM_SLEEP_DISABLED_EXPORT_REMOVED=YES"
            echo "GENERIC_CPUIDLE_SLEEP_GUARD_REMOVED=YES"
            echo "CPUIDLE_LATENCY_WAKE_RESTORED=YES"
          } | tee "$ARTIFACT_DIR/IDLE-SEMANTIC-STATE.txt"

      - name: Restore schedutil standard behaviour
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="kernel/sched/cpufreq_schedutil.c"

          SOURCE_SHA="$(
            sha256sum "$SOURCE" \
              | awk '{print $1}'
          )"

          if [ "$SOURCE_SHA" != "$EXPECTED_SCHEDUTIL_BEFORE_SHA256" ]; then
            echo "ERROR: schedutil Candidate baseline mismatch"
            echo "Expected: $EXPECTED_SCHEDUTIL_BEFORE_SHA256"
            echo "Actual:   $SOURCE_SHA"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/sched/cpufreq_schedutil.c"
          )

          text = path.read_text()

          declaration = (
              "\tunsigned int idx, l_freq, h_freq;\n"
          )

          if text.count(declaration) != 1:
              raise SystemExit(
                  "ERROR: schedutil declaration anchor mismatch"
              )

          text = text.replace(
              declaration,
              "",
              1,
          )

          old_frequency_block = """\
          \tl_freq = cpufreq_driver_resolve_freq(policy, freq);
          \tidx = cpufreq_frequency_table_target(policy, freq, CPUFREQ_RELATION_H);
          \th_freq = policy->freq_table[idx].frequency;
          \th_freq = clamp(h_freq, policy->min, policy->max);
          \tif (l_freq <= h_freq || l_freq == policy->min)
          \t\treturn l_freq;

          \t/*
          \t * Use the frequency step below if the calculated frequency is <20%
          \t * higher than it.
          \t */
          \tif (mult_frac(100, freq - h_freq, l_freq - h_freq) < 20)
          \t\treturn h_freq;

          \treturn l_freq;
          """

          standard_frequency_block = """\
          \treturn cpufreq_driver_resolve_freq(policy, freq);
          """

          if text.count(old_frequency_block) != 1:
              raise SystemExit(
                  "ERROR: schedutil lower-step block anchor mismatch"
              )

          text = text.replace(
              old_frequency_block,
              standard_frequency_block,
              1,
          )

          cap_only = (
              "\tif (type == FREQUENCY_UTIL && "
              "uclamp_rq_util_with(rq, util, p) < util)\n"
          )

          normal_uclamp = (
              "\tif (type == FREQUENCY_UTIL)\n"
          )

          if text.count(cap_only) != 1:
              raise SystemExit(
                  "ERROR: schedutil UClamp anchor mismatch"
              )

          text = text.replace(
              cap_only,
              normal_uclamp,
              1,
          )

          path.write_text(text)
          PY

          RESTORED_SHA="$(
            sha256sum "$SOURCE" \
              | awk '{print $1}'
          )"

          if [ "$RESTORED_SHA" != "$EXPECTED_SCHEDUTIL_AFTER_SHA256" ]; then
            echo "ERROR: restored schedutil hash mismatch"
            echo "Expected: $EXPECTED_SCHEDUTIL_AFTER_SHA256"
            echo "Actual:   $RESTORED_SHA"
            exit 1
          fi

          git diff \
            --no-ext-diff \
            --no-color \
            -- "$SOURCE" \
            > "$ARTIFACT_DIR/SCHEDUTIL-RESTORE.diff"

          {
            echo "SCHEDUTIL_BEFORE_SHA256=$SOURCE_SHA"
            echo "SCHEDUTIL_AFTER_SHA256=$RESTORED_SHA"
            echo "LOWER_STEP_20_PERCENT_REMOVED=YES"
            echo "STANDARD_DRIVER_RESOLVE_RESTORED=YES"
            echo "CAP_ONLY_UCLAMP_REMOVED=YES"
            echo "NORMAL_BOOST_CAP_UCLAMP_RESTORED=YES"
          } | tee "$ARTIFACT_DIR/SCHEDUTIL-STATE.txt"

