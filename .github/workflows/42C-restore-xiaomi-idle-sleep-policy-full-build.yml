      - name: Apply proven CASS MaxFreq Thermal patch
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/sched/cass.c"
          )

          text = path.read_text()

          old = """\
          \tunsigned long cap;
          \tunsigned long cap_max;
          \tunsigned long eff_util;
          """

          new = """\
          \tunsigned long cap;
          \tunsigned long cap_max;
          \tunsigned long cap_no_therm;
          \tunsigned long cap_orig;
          \tunsigned long eff_util;
          """

          if text.count(old) != 1:
              raise SystemExit(
                  "ERROR: CASS struct anchor mismatch"
              )

          text = text.replace(
              old,
              new,
              1,
          )

          old = """\
          \tc->cap = c->cap_max - min(c->hard_util, c->cap_max - 1);
          """

          new = """\
          \tc->cap = c->cap_max - min(c->hard_util, c->cap_max - 1);

          \t/*
          \t * Keep a non-throttled capacity denominator for relative load
          \t * balancing, matching the original CASS capacity separation.
          \t */
          \tc->cap_no_therm =
          \t\tc->cap_orig - min(c->hard_util, c->cap_orig - 1);
          """

          if text.count(old) != 1:
              raise SystemExit(
                  "ERROR: CASS capacity anchor mismatch"
              )

          text = text.replace(
              old,
              new,
              1,
          )

          old = """\
          \t\t/* Get the original, maximum _possible_ capacity of this CPU */
          \t\tcurr->cap_max = arch_scale_cpu_capacity(cpu);
          """

          new = """\
          \t\t/* Get the original, maximum possible capacity of this CPU. */
          \t\tcurr->cap_orig = arch_scale_cpu_capacity(cpu);

          \t\t/* Account for the current maximum allowed CPU frequency. */
          \t\tcurr->cap_max =
          \t\t\tcurr->cap_orig *
          \t\t\tarch_scale_max_freq_capacity(NULL, cpu) >>
          \t\t\tSCHED_CAPACITY_SHIFT;

          \t\t/* Keep all later capacity divisions well-defined. */
          \t\tcurr->cap_max = max(curr->cap_max, 1UL);
          """

          if text.count(old) != 1:
              raise SystemExit(
                  "ERROR: CASS cap_max anchor mismatch"
              )

          text = text.replace(
              old,
              new,
              1,
          )

          old = """\
          \t\tcurr->util =
          \t\t\tcurr->util * SCHED_CAPACITY_SCALE / curr->cap;
          """

          new = """\
          \t\tcurr->util =
          \t\t\tcurr->util * SCHED_CAPACITY_SCALE /
          \t\t\tcurr->cap_no_therm;
          """

          if text.count(old) != 1:
              raise SystemExit(
                  "ERROR: CASS relative-util anchor mismatch"
              )

          text = text.replace(
              old,
              new,
              1,
          )

          path.write_text(text)
          PY

          git diff \
            --no-ext-diff \
            --no-color \
            -- kernel/sched/cass.c \
            > "$ARTIFACT_DIR/CASS-PATCH.diff"

          CASS_DIFF_SHA="$(
            sha256sum \
              "$ARTIFACT_DIR/CASS-PATCH.diff" \
              | awk '{print $1}'
          )"

          if [ "$CASS_DIFF_SHA" != "$EXPECTED_CASS_DIFF_SHA256" ]; then
            echo "ERROR: CASS patch differs from proven version"
            echo "Expected: $EXPECTED_CASS_DIFF_SHA256"
            echo "Actual:   $CASS_DIFF_SHA"
            exit 1
          fi

          {
            echo "CASS_PATCH=PASS"
            echo "CASS_DIFF_SHA256=$CASS_DIFF_SHA"
            echo "CAP_ORIG_RESTORED=YES"
            echo "CAP_NO_THERM_RESTORED=YES"
            echo "CAP_MAX_USES_MAX_FREQ_SCALE=YES"
          } | tee "$ARTIFACT_DIR/CASS-STATE.txt"

      - name: Restore VEUX defconfig cumulative state
        working-directory: kernel
        shell: bash
        run: |
