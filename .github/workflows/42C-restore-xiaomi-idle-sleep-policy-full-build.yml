              < "$ARTIFACT_DIR/vmlinux-cpuset-symbols.txt" \
              | tr -d ' '
          )"

          if [ "$CPUSET_SYMBOL_COUNT" -lt 1 ]; then
            echo "ERROR: CPUSET symbols missing"
