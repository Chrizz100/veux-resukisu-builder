name: VEUX GEN1 U5-O33 SOCINFO Vendor Sysfs Stable Safety Union Semantic Resolution

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: veux-gen1-u5-o33-socinfo-vendor-sysfs-stable-safety-union-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

      # Exact U5-O32 Runtime-PASS parent.
      O32_ARTIFACT_ID: '10484964428'
      O32_ARTIFACT_NAME: VEUX-GEN1-U5-O32-spi-devres-controller-lifetime-union-semantic-resolution-official-stable-5.4.300-5.4.302-port-audit
      O32_ARTIFACT_SHA256: 7963406483385a7a6852719b393512b6111029cd8ed823ae04e432ff81996178
      O32_INTERNAL_SHA_COUNT: '261'

      # Independently derived SOCINFO union candidates from exact O32 evidence.
      SOCINFO_CANDIDATE_SHA300: a4576bb2449207a6c8265ecf5d1c58e6617d80c497ca0c36e962cb9aa016773d
      SOCINFO_CANDIDATE_SHA302: a4576bb2449207a6c8265ecf5d1c58e6617d80c497ca0c36e962cb9aa016773d

      # Stable provenance for the safety side of the union.
      SOCINFO_ALLOC_CHECK_STABLE_COMMIT: e5137997b84931d5f8011eed0c6d47dad3de991f
      SOCINFO_REVISION_FIX_STABLE_COMMIT: f7b0952a700ae8455795a5ff328add9dbe03b024
      SOCINFO_SERIAL_BOUNDS_STABLE_COMMIT: 7445fa05317534bbd8b373c0eff8319187916030

      # Frozen P13 reconstruction pins inherited unchanged from O32.
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      EXPECTED_VENDOR_KERNEL_VERSION: 5.4.268
      EXPECTED_OUTER_TREE: 19b68131d7a3955085f60c4fb8cf64442427af0c
      RESTORE_ARTIFACT_ID: '9989363798'
      RESTORE_ARTIFACT_NAME: clean-gen1-p6v11-v6-full-susfs-outer-integration-p7-test-boot-34031837372
      EXPECTED_P5I_COMMIT: f353a9475e40ca866d570c1d0ef55e24cf6556e4
      EXPECTED_P5I_TREE: a947c1f2891c796a08373fc755e29b23139dc761
      EXPECTED_RESUKISU_BASE_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_RESUKISU_BASE_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      EXPECTED_IMPORT_PATCH_SHA256: 902e427888714266d9771908cd593191a478cd32ae7a895c77b76c976939c76f
      EXPECTED_P13_PATCH_SHA256: d56725a9d6a6dc7bf1e73a5763b894bdabb544119f4c75df5f437ccd4ff29a52
      EXPECTED_P12_EXEC_SHA256: fa3b73421f35d6220fb9e03e112a9509b76c04933af2353c9a8c65d6fb6bd6a9
      EXPECTED_P12_CONTRACT_SHA256: b6d1875f6a79231465bc78df6484f2856a427259998eb93ba9fd2597cb45ca53
      EXPECTED_P12_SUSFS_C_SHA256: e430d573ba5875a55d1ca70ba1b304e4b6727bbc42b8c3ac16f2c175b29a59c1
      EXPECTED_P12_SUSFS_H_SHA256: 3c5fb1bcc28a70c82ee5cfe0a7375bb8e7babd26618ce9b451e598fa31aa3b6e
      EXPECTED_P12_SUSFS_DEF_SHA256: b16108a5fcd4cdd7203d9f084c2154da708ab3ae6bed17109e4ec63f04ff0f68
      EXPECTED_P13_TREE: 27f712099ca93c93f7b6db8884cc1f3b6e61ae0f
      EXPECTED_P13_KERNEL_VERSION: 5.4.274

      STABLE_COMMIT_300: 86b57fd7c54e976bdcee78ead678932821a68e2d
      STABLE_COMMIT_302: 9e3157c56ec7917e6a80ea53a8bd752e0037f2cb

    steps:
      - name: Initialize U5-O33 comprehensive evidence workspace
        shell: bash
        run: |
          set -euo pipefail

          O32_DIR="$RUNNER_TEMP/u5-o33-o32-parent"
          RESTORE_DIR_ROOT="$RUNNER_TEMP/u5-o33-restore"
          P13_DIR="$GITHUB_WORKSPACE/u5-o33-p13"
          CAND300_DIR="$GITHUB_WORKSPACE/u5-o33-candidate-300"
          CAND302_DIR="$GITHUB_WORKSPACE/u5-o33-candidate-302"
          AUDIT_DIR="$GITHUB_WORKSPACE/u5-o33-evidence"

          rm -rf "$O32_DIR" "$RESTORE_DIR_ROOT" "$P13_DIR" \
                 "$CAND300_DIR" "$CAND302_DIR" "$AUDIT_DIR"
          mkdir -p "$O32_DIR" "$RESTORE_DIR_ROOT" "$AUDIT_DIR"

          {
            echo "O32_DIR=$O32_DIR"
            echo "RESTORE_DIR_ROOT=$RESTORE_DIR_ROOT"
            echo "P13_DIR=$P13_DIR"
            echo "CAND300_DIR=$CAND300_DIR"
            echo "CAND302_DIR=$CAND302_DIR"
            echo "AUDIT_DIR=$AUDIT_DIR"
          } >> "$GITHUB_ENV"

          cat > "$AUDIT_DIR/33-O33-PLAN.txt" <<EOF
          U5-O33 QCOM SOCINFO VENDOR-SYSFS / STABLE-SAFETY UNION SEMANTIC RESOLUTION

          Runtime source parent:
            U5-O32 artifact ID: $O32_ARTIFACT_ID
            U5-O32 SHA-256: $O32_ARTIFACT_SHA256

          Exactly one new logical source resolver:
            drivers/soc/qcom/socinfo.c

          Required semantic union:
          - preserve P13 global socinfo/socinfo_format initialization;
          - preserve P13 machine/eSKU/SKU mapping;
          - preserve P13 qsocinfo/current_image_rwsem/custom sysfs population and socinfo_print();
          - preserve P13 final soc_id override, but fail closed if that allocation fails;
          - preserve Stable soc_id/revision allocation failure checks;
          - preserve Stable serial-number allocation failure check;
          - preserve Stable offsetofend() bound so serial_num is read only when the complete field is in SMEM;
          - do not reintroduce Stable debugfs lifecycle removed by P13;
          - do not touch any other unresolved source path.

          Stable provenance:
            allocation check: $SOCINFO_ALLOC_CHECK_STABLE_COMMIT
            revision-check correction: $SOCINFO_REVISION_FIX_STABLE_COMMIT
            serial bounds fix: $SOCINFO_SERIAL_BOUNDS_STABLE_COMMIT

          Expected incremental result:
            5.4.300: runtime conflicts 9 -> 8, hunks 29 -> 28
            5.4.302: runtime conflicts 15 -> 14, hunks 40 -> 39
            semantic resolutions 29 -> 30

          Artifact policy:
          - carry the complete O32 evidence tree forward;
          - preserve full prior lineage and large partial-port patches;
          - add O33 provenance, resolved evidence and source-application gates;
          - reject report-only/thin artifacts using completeness gates;
          - one final artifact only.

          No kernel build. No AK3. No flash. No Device PASS claim.
          EOF

      - name: Download verify and restore complete O32 Runtime-PASS parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          meta="$RUNNER_TEMP/o32-artifact-meta.json"
          zip="$RUNNER_TEMP/o32-artifact.zip"

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${O32_ARTIFACT_ID}" \
            -o "$meta"

          python3 - "$meta" "$O32_ARTIFACT_ID" "$O32_ARTIFACT_NAME" "$O32_ARTIFACT_SHA256" <<'PY'
          import json, sys
          path, expected_id, expected_name, expected_sha = sys.argv[1:]
          with open(path, encoding='utf-8') as fh:
              meta = json.load(fh)
          assert str(meta.get('id')) == expected_id, (meta.get('id'), expected_id)
          assert meta.get('name') == expected_name, (meta.get('name'), expected_name)
          assert meta.get('expired') is False, 'O32 artifact expired'
          digest = meta.get('digest')
          if digest not in (None, '', 'sha256:' + expected_sha):
              raise AssertionError((digest, expected_sha))
          print('O32_METADATA=PASS')
          PY

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${O32_ARTIFACT_ID}/zip" \
            -o "$zip"

          echo "$O32_ARTIFACT_SHA256  $zip" | sha256sum -c -

          python3 - "$zip" "$O32_DIR" <<'PY'
          from pathlib import Path
          import sys, zipfile
          archive, destination = sys.argv[1:]
          root = Path(destination).resolve()
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  out = (root / info.filename).resolve()
                  if out != root and root not in out.parents:
                      raise SystemExit(f'unsafe archive member: {info.filename}')
              zf.extractall(root)
          PY

          test -f "$O32_DIR/SHA256SUMS.txt"
          (
            cd "$O32_DIR"
            sha256sum -c SHA256SUMS.txt
          ) | tee "$RUNNER_TEMP/o32-internal-sha.txt"
          test "$(grep -c 'OK$' "$RUNNER_TEMP/o32-internal-sha.txt")" -eq "$O32_INTERNAL_SHA_COUNT"
          test "$(wc -l < "$O32_DIR/SHA256SUMS.txt")" -eq "$O32_INTERNAL_SHA_COUNT"

          grep -Fxq 'O32_FINAL=RUNTIME_GREEN_PASS' "$O32_DIR/99-O32-FINAL-GATE.txt"
          grep -Fxq 'CURRENT_RUNTIME_PARENT=U5-O32' "$O32_DIR/99-O32-FINAL-GATE.txt"
          grep -Fxq 'RUNTIME_CONFLICTS_5.4.300=9' "$O32_DIR/99-O32-FINAL-GATE.txt"
          grep -Fxq 'TEXT_CONFLICT_HUNKS_5.4.300=29' "$O32_DIR/99-O32-FINAL-GATE.txt"
          grep -Fxq 'RUNTIME_CONFLICTS_5.4.302=15' "$O32_DIR/99-O32-FINAL-GATE.txt"
          grep -Fxq 'TEXT_CONFLICT_HUNKS_5.4.302=40' "$O32_DIR/99-O32-FINAL-GATE.txt"
          grep -Fxq 'SEMANTIC_RESOLUTIONS=29' "$O32_DIR/99-O32-FINAL-GATE.txt"
          grep -Fxq 'COMPREHENSIVE_ARTIFACT_COMPLETENESS=PASS' "$O32_DIR/99-O32-FINAL-GATE.txt"

          # Start O33 from the entire O32 evidence state, not from a thin subset.
          cp -a "$O32_DIR/." "$AUDIT_DIR/"
          mkdir -p "$AUDIT_DIR/lineage"
          cp "$O32_DIR/SHA256SUMS.txt" "$AUDIT_DIR/lineage/O32-SHA256SUMS.original.txt"
          cp "$meta" "$AUDIT_DIR/lineage/O32-ARTIFACT-METADATA.json"
          cp "$RUNNER_TEMP/o32-internal-sha.txt" "$AUDIT_DIR/lineage/O32-INTERNAL-SHA256-CHECK.txt"
          sha256sum "$zip" > "$AUDIT_DIR/lineage/O32-ZIP-SHA256.txt"
          rm -f "$AUDIT_DIR/SHA256SUMS.txt"

          {
            echo "O32_ARTIFACT_ID=$O32_ARTIFACT_ID"
            echo "O32_ARTIFACT_SHA256=$O32_ARTIFACT_SHA256"
            echo "O32_INTERNAL_SHA256SUMS=$O32_INTERNAL_SHA_COUNT/$O32_INTERNAL_SHA_COUNT PASS"
            echo "O32_RUNTIME_GATE=PASS"
            echo "RUNTIME_SOURCE_PARENT=U5-O32"
          } > "$AUDIT_DIR/lineage/O32-PARENT-GATE.txt"

      - name: Reconstruct exact frozen P13 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git clone -q https://github.com/dereference23/kernel_xiaomi_sm6375.git "$P13_DIR"
          git -C "$P13_DIR" checkout -q --detach "$EXPECTED_VENDOR_SHA"
          test "$(git -C "$P13_DIR" rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
          test "$(make -s -C "$P13_DIR" kernelversion)" = "$EXPECTED_VENDOR_KERNEL_VERSION"

          restore_meta="$RUNNER_TEMP/restore-artifact-meta.json"
          restore_zip="$RUNNER_TEMP/restore-artifact.zip"

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RESTORE_ARTIFACT_ID}" \
            -o "$restore_meta"

          python3 - "$restore_meta" "$RESTORE_ARTIFACT_ID" "$RESTORE_ARTIFACT_NAME" <<'PY'
          import json, sys
          path, expected_id, expected_name = sys.argv[1:]
          with open(path, encoding='utf-8') as fh:
              meta = json.load(fh)
          assert str(meta.get('id')) == expected_id, (meta.get('id'), expected_id)
          assert meta.get('name') == expected_name, (meta.get('name'), expected_name)
          assert meta.get('expired') is False, 'restore artifact expired'
          print('RESTORE_ARTIFACT_METADATA=PASS')
          PY

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RESTORE_ARTIFACT_ID}/zip" \
            -o "$restore_zip"

          python3 - "$restore_zip" "$RESTORE_DIR_ROOT" <<'PY'
          from pathlib import Path
          import sys, zipfile
          archive, destination = sys.argv[1:]
          root = Path(destination).resolve()
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  out = (root / info.filename).resolve()
                  if out != root and root not in out.parents:
                      raise SystemExit(f'unsafe restore archive member: {info.filename}')
              zf.extractall(root)
          PY

          restore_dir="$(find "$RESTORE_DIR_ROOT" -type d -name source-restore-kit -print -quit)"
          test -n "$restore_dir"
          test -f "$restore_dir/manifest.json"
          test -f "$restore_dir/SHA256SUMS"
          echo "RESTORE_DIR=$restore_dir" >> "$GITHUB_ENV"

          (
            cd "$restore_dir"
            sha256sum -c SHA256SUMS
          ) > "$AUDIT_DIR/lineage/P13-RESTORE-SHA256-CHECK-O33.txt"

          python3 - "$restore_dir/manifest.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              manifest = json.load(fh)
          expected = {
              'stage': 'CLEAN_GEN1_P6V11_SOURCE',
              'p5i_commit': os.environ['EXPECTED_P5I_COMMIT'],
              'p5i_tree': os.environ['EXPECTED_P5I_TREE'],
              'resukisu_head': os.environ['EXPECTED_RESUKISU_BASE_HEAD'],
              'resukisu_tree': os.environ['EXPECTED_RESUKISU_BASE_TREE'],
          }
          for key, value in expected.items():
              assert manifest.get(key) == value, (key, manifest.get(key), value)
          assert manifest.get('p6_source_tree') == os.environ['EXPECTED_OUTER_TREE'], (
              manifest.get('p6_source_tree'), os.environ['EXPECTED_OUTER_TREE'])
          print('RESTORE_MANIFEST=PASS')
          PY

          git -C "$P13_DIR" reset --hard "$EXPECTED_VENDOR_SHA"
          git -C "$P13_DIR" clean -fdx

          for p in \
            "$restore_dir/p5i/vendor-20240619-to-p5i-outer.patch" \
            "$restore_dir/p5i-to-p6-source-compat.patch" \
            "$restore_dir/p6v10-to-p6v11-full-susfs-outer.patch"; do
            test -s "$p"
            git -C "$P13_DIR" apply --check --whitespace=error --binary "$p"
            git -C "$P13_DIR" apply --index --whitespace=error --binary "$p"
          done

          test "$(git -C "$P13_DIR" write-tree)" = "$EXPECTED_OUTER_TREE"

          import_patch="$O32_DIR/05-current-kernel-uapi-minus-module-filter.patch"
          p13_patch="$O32_DIR/07-P13-post-exec.patch"
          test -s "$import_patch"
          test -s "$p13_patch"
          echo "$EXPECTED_IMPORT_PATCH_SHA256  $import_patch" | sha256sum -c -
          echo "$EXPECTED_P13_PATCH_SHA256  $p13_patch" | sha256sum -c -

          test "$(sha256sum "$P13_DIR/fs/exec.c" | awk '{print $1}')" = "$EXPECTED_P12_EXEC_SHA256"
          test "$(sha256sum "$P13_DIR/include/linux/ksu_hook_contract.h" | awk '{print $1}')" = "$EXPECTED_P12_CONTRACT_SHA256"
          test "$(sha256sum "$P13_DIR/fs/susfs.c" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_C_SHA256"
          test "$(sha256sum "$P13_DIR/include/linux/susfs.h" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_H_SHA256"
          test "$(sha256sum "$P13_DIR/include/linux/susfs_def.h" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_DEF_SHA256"

          git -C "$P13_DIR" apply --check --whitespace=error --binary "$p13_patch"
          git -C "$P13_DIR" apply --index --whitespace=error --binary "$p13_patch"

          test "$(git -C "$P13_DIR" write-tree)" = "$EXPECTED_P13_TREE"
          test "$(make -s -C "$P13_DIR" kernelversion)" = "$EXPECTED_P13_KERNEL_VERSION"

          {
            echo "VENDOR_SHA=$EXPECTED_VENDOR_SHA"
            echo "P12_OUTER_TREE=$EXPECTED_OUTER_TREE"
            echo "O32_CARRIED_RESUKISU_IMPORT_PATCH_SHA256=$EXPECTED_IMPORT_PATCH_SHA256"
            echo "O32_CARRIED_RESUKISU_CONTRACT=INHERITED_AND_HASH_VERIFIED"
            echo "P13_OUTER_PATCH_SHA256=$EXPECTED_P13_PATCH_SHA256"
            echo "P13_TREE=$(git -C "$P13_DIR" write-tree)"
            echo "P13_KERNELVERSION=$(make -s -C "$P13_DIR" kernelversion)"
            echo "P13_OUTER_SOURCE_RECONSTRUCTION=PASS"
          } | tee "$AUDIT_DIR/lineage/P13-RECONSTRUCTION-GATE-O33.txt"

          git -C "$P13_DIR" config user.name 'VEUX U5-O33 Audit'
          git -C "$P13_DIR" config user.email 'veux-u5-o33-audit@invalid.local'
          p13_commit="$(printf '%s\n' 'U5-O33 exact frozen P13 audit snapshot' | \
            git -C "$P13_DIR" commit-tree "$EXPECTED_P13_TREE" -p "$EXPECTED_VENDOR_SHA")"
          echo "P13_AUDIT_COMMIT=$p13_commit" >> "$GITHUB_ENV"
          echo "P13_AUDIT_COMMIT=$p13_commit" >> "$AUDIT_DIR/lineage/P13-RECONSTRUCTION-GATE-O33.txt"

      - name: Resolve SOCINFO conflict and update complete O32 evidence state
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import difflib
          import hashlib
          import os
          import re
          import shutil

          audit = Path(os.environ['AUDIT_DIR'])
          expected_candidates = {
              '5.4.300': os.environ['SOCINFO_CANDIDATE_SHA300'],
              '5.4.302': os.environ['SOCINFO_CANDIDATE_SHA302'],
          }
          old_conflicts = {'5.4.300': 9, '5.4.302': 15}
          old_hunks = {'5.4.300': 29, '5.4.302': 40}
          new_conflicts = {'5.4.300': 8, '5.4.302': 14}
          new_hunks = {'5.4.300': 28, '5.4.302': 39}
          rel = Path('drivers/soc/qcom/socinfo.c')
          checks: list[str] = []

          def gate(condition: bool, label: str) -> None:
              if not condition:
                  raise AssertionError(label)
              checks.append(label)

          def derive_candidate(preview: str, target: str) -> str:
              pattern = re.compile(
                  r'<<<<<<<[^\n]*\n(.*?)'
                  r'\|\|\|\|\|\|\|[^\n]*\n(.*?)'
                  r'=======\n(.*?)'
                  r'>>>>>>>[^\n]*\n',
                  re.S,
              )
              matches = list(pattern.finditer(preview))
              gate(len(matches) == 1, f'{target}: exactly one SOCINFO diff3 conflict')
              match = matches[0]
              ours, base, theirs = match.group(1), match.group(2), match.group(3)

              gate('qs->attr.soc_id = kasprintf(GFP_KERNEL, "%d", socinfo_get_id());' in ours,
                   f'{target}: P13 final soc_id override present in OURS')
              gate('socinfo_populate_sysfs(qs);' in ours,
                   f'{target}: P13 custom sysfs population present in OURS')
              gate('socinfo_print();' in ours, f'{target}: P13 socinfo_print present in OURS')
              gate('if (!qs->attr.soc_id || !qs->attr.revision)' in theirs,
                   f'{target}: Stable allocation guard present in THEIRS')
              gate('offsetofend(struct socinfo, serial_num) <= item_size' in theirs,
                   f'{target}: Stable complete-field serial bound present in THEIRS')
              gate('if (!qs->attr.serial_number)' in theirs,
                   f'{target}: Stable serial allocation guard present in THEIRS')
              gate('offsetof(struct socinfo, serial_num) <= item_size' in base,
                   f'{target}: BASE has old start-offset serial bound')

              union = (
                  '\tif (!qs->attr.soc_id || !qs->attr.revision)\n'
                  '\t\treturn -ENOMEM;\n'
                  '\n'
                  '\tqs->attr.soc_id = kasprintf(GFP_KERNEL, "%d", socinfo_get_id());\n'
                  '\tif (!qs->attr.soc_id)\n'
                  '\t\treturn -ENOMEM;\n'
                  '\n'
                  '\tif (offsetofend(struct socinfo, serial_num) <= item_size) {\n'
                  '\t\tqs->attr.serial_number = devm_kasprintf(&pdev->dev, GFP_KERNEL,\n'
                  '\t\t\t\t\t\t\t"%u",\n'
                  '\t\t\t\t\t\t\tle32_to_cpu(info->serial_num));\n'
                  '\t\tif (!qs->attr.serial_number)\n'
                  '\t\t\treturn -ENOMEM;\n'
                  '\t}\n'
                  '\n'
                  '\tif (socinfo_format >= SOCINFO_VERSION(0, 16)) {\n'
                  '\t\tmachine = socinfo_machine(le32_to_cpu(info->id));\n'
                  '\t\tesku = socinfo_get_esku_mapping();\n'
                  '\t\tif (machine && esku)\n'
                  '\t\t\tsku = devm_kasprintf(&pdev->dev, GFP_KERNEL, "%s-%u-%s",\n'
                  '\t\t\t\tmachine, socinfo_get_nproduct_code(), esku);\n'
                  '\t}\n'
                  '\n'
                  '\tqsocinfo = qs;\n'
                  '\tinit_rwsem(&qs->current_image_rwsem);\n'
                  '\tsocinfo_populate_sysfs(qs);\n'
                  '\tsocinfo_print();\n'
              )
              return preview[:match.start()] + union + preview[match.end():]

          def update_result(path: Path, target: str) -> None:
              text = path.read_text(encoding='utf-8')
              replacements = {
                  f'TEXT_CONFLICT={old_conflicts[target]}\n': f'TEXT_CONFLICT={new_conflicts[target]}\n',
                  f'RUNTIME_CONFLICTS={old_conflicts[target]}\n': f'RUNTIME_CONFLICTS={new_conflicts[target]}\n',
                  f'TEXT_CONFLICT_HUNKS={old_hunks[target]}\n': f'TEXT_CONFLICT_HUNKS={new_hunks[target]}\n',
                  'SEMANTIC_RESOLUTIONS=29\n': 'SEMANTIC_RESOLUTIONS=30\n',
              }
              for old, new in replacements.items():
                  gate(text.count(old) == 1, f'{target}: RESULT contains exactly one {old.strip()}')
                  text = text.replace(old, new, 1)

              marker_count = 'SPI_DEVRES_CONTROLLER_LIFETIME_UNION_SEMANTIC_RESOLUTION=1\n'
              gate(text.count(marker_count) == 1, f'{target}: count insertion marker unique')
              text = text.replace(
                  marker_count,
                  marker_count + 'SOCINFO_VENDOR_SYSFS_STABLE_SAFETY_UNION_SEMANTIC_RESOLUTION=1\n',
                  1,
              )
              marker_yes = 'SPI_DEVRES_CONTROLLER_LIFETIME_UNION_SEMANTIC_RESOLUTION=YES\n'
              gate(text.count(marker_yes) == 1, f'{target}: YES insertion marker unique')
              text = text.replace(
                  marker_yes,
                  marker_yes + 'SOCINFO_VENDOR_SYSFS_STABLE_SAFETY_UNION_SEMANTIC_RESOLUTION=YES\n',
                  1,
              )
              path.write_text(text, encoding='utf-8', newline='\n')

          for target in ('5.4.300', '5.4.302'):
              target_dir = audit / f'target-{target}'
              conflict_dir = target_dir / 'conflicts' / rel
              gate(conflict_dir.is_dir(), f'{target}: O32 SOCINFO conflict directory exists')

              ours_path = conflict_dir / 'OURS'
              base_path = conflict_dir / 'BASE-v5.4.274'
              theirs_path = conflict_dir / 'THEIRS-target'
              preview_path = conflict_dir / 'MERGE-PREVIEW'
              meta_path = conflict_dir / 'META.txt'
              for p in (ours_path, base_path, theirs_path, preview_path, meta_path):
                  gate(p.is_file(), f'{target}: {p.name} exists')

              meta = meta_path.read_text(encoding='utf-8')
              gate('MERGE_CONFLICT_HUNKS=1' in meta, f'{target}: SOCINFO is exactly one merge hunk')

              ours = ours_path.read_text(encoding='utf-8')
              preview = preview_path.read_text(encoding='utf-8')
              candidate = derive_candidate(preview, target)
              candidate_sha = hashlib.sha256(candidate.encode()).hexdigest()
              gate(candidate_sha == expected_candidates[target],
                   f'{target}: derived SOCINFO candidate SHA-256 exact')

              gate('<<<<<<< ' not in candidate and '||||||| ' not in candidate and '>>>>>>> ' not in candidate,
                   f'{target}: candidate has no diff3 markers')
              gate(candidate.count('if (!qs->attr.soc_id || !qs->attr.revision)') == 1,
                   f'{target}: one Stable soc_id/revision guard')
              gate(candidate.count('qs->attr.soc_id = kasprintf(GFP_KERNEL, "%d", socinfo_get_id());') == 1,
                   f'{target}: one P13 final soc_id override')
              gate(candidate.count('if (!qs->attr.soc_id)') == 1,
                   f'{target}: final P13 soc_id override is allocation-checked')
              gate(candidate.count('offsetofend(struct socinfo, serial_num) <= item_size') == 1,
                   f'{target}: one complete-field serial bound')
              gate('offsetof(struct socinfo, serial_num) <= item_size' not in candidate,
                   f'{target}: old start-offset serial bound absent')
              gate(candidate.count('if (!qs->attr.serial_number)') == 1,
                   f'{target}: one serial allocation guard')
              gate(candidate.count('socinfo_populate_sysfs(qs);') == 1,
                   f'{target}: P13 custom sysfs retained')
              gate(candidate.count('socinfo_print();') == 1,
                   f'{target}: P13 socinfo_print retained')
              gate(candidate.count('qsocinfo = qs;') == 1,
                   f'{target}: P13 global qcom_socinfo assignment retained')
              gate(candidate.count('init_rwsem(&qs->current_image_rwsem);') == 1,
                   f'{target}: P13 current-image rwsem retained')
              gate(candidate.count('socinfo_debugfs_init(qs, info);') == 0,
                   f'{target}: Stable debugfs lifecycle not reintroduced')
              gate(candidate.count('socinfo_debugfs_exit(qs);') == 0,
                   f'{target}: Stable debugfs removal hook not reintroduced')

              # Persist the exact resolved full-path evidence.
              resolved_dir = target_dir / 'resolved-evidence' / rel
              resolved_dir.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(conflict_dir), str(resolved_dir))
              (resolved_dir / 'RESOLVED-O33').write_text(candidate, encoding='utf-8', newline='\n')

              diff_body = ''.join(difflib.unified_diff(
                  ours.splitlines(keepends=True),
                  candidate.splitlines(keepends=True),
                  fromfile='a/drivers/soc/qcom/socinfo.c',
                  tofile='b/drivers/soc/qcom/socinfo.c',
                  n=3,
              ))
              gate(diff_body.startswith(
                  '--- a/drivers/soc/qcom/socinfo.c\n+++ b/drivers/soc/qcom/socinfo.c\n'),
                  f'{target}: SOCINFO incremental diff headers valid')
              soc_patch = 'diff --git a/drivers/soc/qcom/socinfo.c b/drivers/soc/qcom/socinfo.c\n' + diff_body
              soc_patch_path = target_dir / 'socinfo-vendor-sysfs-stable-safety-union-semantic-resolution.patch'
              soc_patch_path.write_text(soc_patch, encoding='utf-8', newline='\n')

              partial_patch = target_dir / f'P13-to-{target}-AUTO-MERGED-PARTIAL.patch'
              gate(partial_patch.is_file(), f'{target}: O32 partial patch exists')
              old_patch = partial_patch.read_text(encoding='utf-8')
              gate('diff --git a/drivers/soc/qcom/socinfo.c b/drivers/soc/qcom/socinfo.c\n' not in old_patch,
                   f'{target}: O32 partial patch did not already resolve SOCINFO')
              old_patch_sha = hashlib.sha256(old_patch.encode()).hexdigest()
              separator = '' if old_patch.endswith('\n') else '\n'
              new_patch = old_patch + separator + soc_patch
              gate(new_patch.count(
                  'diff --git a/drivers/soc/qcom/socinfo.c b/drivers/soc/qcom/socinfo.c\n') == 1,
                  f'{target}: updated partial patch contains exactly one SOCINFO diff')
              partial_patch.write_text(new_patch, encoding='utf-8', newline='\n')
              new_patch_sha = hashlib.sha256(new_patch.encode()).hexdigest()

              runtime_path = target_dir / 'runtime-conflicts.txt'
              conflicts = runtime_path.read_text(encoding='utf-8').splitlines()
              gate(len(conflicts) == old_conflicts[target], f'{target}: O32 runtime conflict count exact')
              gate(conflicts.count(str(rel)) == 1, f'{target}: SOCINFO appears once in O32 conflict list')
              conflicts = [x for x in conflicts if x != str(rel)]
              gate(len(conflicts) == new_conflicts[target], f'{target}: only SOCINFO conflict removed')
              runtime_path.write_text('\n'.join(conflicts) + '\n', encoding='utf-8', newline='\n')

              class_path = target_dir / 'path-classification.tsv'
              rows = class_path.read_text(encoding='utf-8').splitlines()
              hits = 0
              for i, row in enumerate(rows):
                  cols = row.split('\t')
                  if len(cols) >= 3 and cols[1] == str(rel):
                      gate(cols[2] == 'TEXT_CONFLICT', f'{target}: SOCINFO was TEXT_CONFLICT in O32')
                      cols[2] = 'SOCINFO_VENDOR_SYSFS_STABLE_SAFETY_UNION_SEMANTIC_RESOLUTION'
                      rows[i] = '\t'.join(cols)
                      hits += 1
              gate(hits == 1, f'{target}: exactly one SOCINFO classification row updated')
              class_path.write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')
              gate(sum(1 for row in rows[1:] if row.split('\t')[2] == 'TEXT_CONFLICT') == new_conflicts[target],
                   f'{target}: remaining TEXT_CONFLICT classifications exact')

              update_result(target_dir / 'RESULT.txt', target)

              report = target_dir / 'socinfo-vendor-sysfs-stable-safety-union-semantic-resolution.txt'
              report.write_text(
                  '\n'.join([
                      f'TARGET={target}',
                      'SOURCE_PATH=drivers/soc/qcom/socinfo.c',
                      'LOGICAL_RESOLUTION=SOCINFO_VENDOR_SYSFS_STABLE_SAFETY_UNION',
                      f'CANDIDATE_SHA256={candidate_sha}',
                      f'O32_PARTIAL_PATCH_SHA256_BEFORE={old_patch_sha}',
                      f'O33_PARTIAL_PATCH_SHA256_AFTER={new_patch_sha}',
                      f'STABLE_ALLOC_CHECK_COMMIT={os.environ["SOCINFO_ALLOC_CHECK_STABLE_COMMIT"]}',
                      f'STABLE_REVISION_FIX_COMMIT={os.environ["SOCINFO_REVISION_FIX_STABLE_COMMIT"]}',
                      f'STABLE_SERIAL_BOUNDS_COMMIT={os.environ["SOCINFO_SERIAL_BOUNDS_STABLE_COMMIT"]}',
                      'P13_SOCINFO_GLOBALS=PRESERVED',
                      'P13_MACHINE_ESKU_SKU_MAPPING=PRESERVED',
                      'P13_CUSTOM_SYSFS=PRESERVED',
                      'P13_FINAL_SOC_ID_OVERRIDE=PRESERVED_AND_NULL_CHECKED',
                      'STABLE_SOC_ID_REVISION_NULL_CHECKS=PRESERVED',
                      'STABLE_SERIAL_ALLOCATION_CHECK=PRESERVED',
                      'STABLE_SERIAL_OFFSETOFEND_BOUND=PRESERVED',
                      'STABLE_DEBUGFS_LIFECYCLE=NOT_REINTRODUCED',
                      f'RUNTIME_CONFLICTS_BEFORE={old_conflicts[target]}',
                      f'RUNTIME_CONFLICTS_AFTER={new_conflicts[target]}',
                      f'TEXT_CONFLICT_HUNKS_BEFORE={old_hunks[target]}',
                      f'TEXT_CONFLICT_HUNKS_AFTER={new_hunks[target]}',
                      'SOURCE_RESOLUTION=PASS',
                      '',
                  ]),
                  encoding='utf-8', newline='\n'
              )

          (audit / '33-O33-RESOLUTION-DERIVATION-GATE.txt').write_text(
              '\n'.join([
                  f'ASSERTIONS={len(checks)}',
                  'SOCINFO_RESOLUTION_5.4.300=PASS',
                  'SOCINFO_RESOLUTION_5.4.302=PASS',
                  'ONLY_NEW_SOURCE_RESOLVER=drivers/soc/qcom/socinfo.c',
                  'RESOLUTION_DERIVATION=PASS',
                  '',
              ]), encoding='utf-8', newline='\n'
          )
          print(f'O33_RESOLUTION_ASSERTIONS={len(checks)}')
          PY

      - name: Apply updated partial port patches to exact P13
        shell: bash
        run: |
          set -euo pipefail

          git -C "$P13_DIR" worktree add --detach "$CAND300_DIR" "$P13_AUDIT_COMMIT"
          git -C "$P13_DIR" worktree add --detach "$CAND302_DIR" "$P13_AUDIT_COMMIT"

          validate_target() {
            local target="$1"
            local tree="$2"
            local expected_sha="$3"
            local expected_conflicts="$4"
            local expected_hunks="$5"
            local expected_stable_commit="$6"
            local patch="$AUDIT_DIR/target-${target}/P13-to-${target}-AUTO-MERGED-PARTIAL.patch"
            local result="$AUDIT_DIR/target-${target}/RESULT.txt"
            local gate="$AUDIT_DIR/target-${target}/o33-source-application-gate.txt"

            test -s "$patch"
            test "$(grep -c '^diff --git a/drivers/soc/qcom/socinfo.c b/drivers/soc/qcom/socinfo.c$' "$patch")" -eq 1

            git -C "$tree" apply --check --whitespace=error "$patch"
            git -C "$tree" apply --index --whitespace=error "$patch"
            git -C "$tree" diff --cached --check

            test "$(make -s -C "$tree" kernelversion)" = "$target"
            test "$(sha256sum "$tree/drivers/soc/qcom/socinfo.c" | awk '{print $1}')" = "$expected_sha"
            test "$(wc -l < "$AUDIT_DIR/target-${target}/runtime-conflicts.txt")" -eq "$expected_conflicts"
            test "$(grep -c $'\tTEXT_CONFLICT\t' "$AUDIT_DIR/target-${target}/path-classification.tsv")" -eq "$expected_conflicts"
            test "$(find "$AUDIT_DIR/target-${target}/conflicts" -type f -name META.txt | wc -l)" -eq "$expected_conflicts"
            test ! -d "$AUDIT_DIR/target-${target}/conflicts/drivers/soc/qcom/socinfo.c"
            test -f "$AUDIT_DIR/target-${target}/resolved-evidence/drivers/soc/qcom/socinfo.c/RESOLVED-O33"
            ! grep -R -n -E '^(<<<<<<<|\|\|\|\|\|\|\||=======|>>>>>>>)' \
                "$tree/drivers/soc/qcom/socinfo.c"

            grep -Fxq "RUNTIME_CONFLICTS=$expected_conflicts" "$result"
            grep -Fxq "TEXT_CONFLICT_HUNKS=$expected_hunks" "$result"
            grep -Fxq 'SEMANTIC_RESOLUTIONS=30' "$result"
            grep -Fxq 'SOCINFO_VENDOR_SYSFS_STABLE_SAFETY_UNION_SEMANTIC_RESOLUTION=YES' "$result"
            grep -Fxq 'KERNEL_BUILD_PERFORMED=NO' "$result"
            grep -Fxq 'DEVICE_PASS=NO' "$result"

            grep -Fq 'if (!qs->attr.soc_id || !qs->attr.revision)' "$tree/drivers/soc/qcom/socinfo.c"
            grep -Fq 'qs->attr.soc_id = kasprintf(GFP_KERNEL, "%d", socinfo_get_id());' "$tree/drivers/soc/qcom/socinfo.c"
            grep -Fq 'offsetofend(struct socinfo, serial_num) <= item_size' "$tree/drivers/soc/qcom/socinfo.c"
            grep -Fq 'socinfo_populate_sysfs(qs);' "$tree/drivers/soc/qcom/socinfo.c"
            grep -Fq 'socinfo_print();' "$tree/drivers/soc/qcom/socinfo.c"
            ! grep -Fq 'socinfo_debugfs_init(qs, info);' "$tree/drivers/soc/qcom/socinfo.c"

            {
              echo "TARGET=$target"
              echo "OFFICIAL_STABLE_TARGET_COMMIT=$expected_stable_commit"
              echo "P13_AUDIT_COMMIT=$P13_AUDIT_COMMIT"
              echo "UPDATED_PARTIAL_PATCH_SHA256=$(sha256sum "$patch" | awk '{print $1}')"
              echo "APPLIED_SOCINFO_SHA256=$(sha256sum "$tree/drivers/soc/qcom/socinfo.c" | awk '{print $1}')"
              echo "CANDIDATE_KERNELVERSION=$(make -s -C "$tree" kernelversion)"
              echo "CANDIDATE_INDEX_TREE=$(git -C "$tree" write-tree)"
              echo "RUNTIME_CONFLICTS=$expected_conflicts"
              echo "TEXT_CONFLICT_HUNKS=$expected_hunks"
              echo "SEMANTIC_RESOLUTIONS=30"
              echo "GIT_APPLY_CHECK=PASS"
              echo "GIT_DIFF_CHECK=PASS"
              echo "SOCINFO_SOURCE_HASH=PASS"
              echo "SOURCE_APPLICATION_GATE=PASS"
            } > "$gate"
          }

          validate_target 5.4.300 "$CAND300_DIR" "$SOCINFO_CANDIDATE_SHA300" 8 28 "$STABLE_COMMIT_300"
          validate_target 5.4.302 "$CAND302_DIR" "$SOCINFO_CANDIDATE_SHA302" 14 39 "$STABLE_COMMIT_302"

      - name: Finalize comprehensive O33 artifact and completeness gate
        shell: bash
        run: |
          set -euo pipefail

          grep -Fxq 'SOURCE_APPLICATION_GATE=PASS' "$AUDIT_DIR/target-5.4.300/o33-source-application-gate.txt"
          grep -Fxq 'SOURCE_APPLICATION_GATE=PASS' "$AUDIT_DIR/target-5.4.302/o33-source-application-gate.txt"

          cat > "$AUDIT_DIR/33-O33-SUMMARY.txt" <<EOF
          O33_MODE=INCREMENTAL_RUNTIME_SOURCE_RESOLUTION
          SOURCE_PARENT=U5-O32
          O33_BECOMES_RUNTIME_PARENT=YES
          ONLY_NEW_SOURCE_RESOLVER=drivers/soc/qcom/socinfo.c
          SOCINFO_RESOLUTION=VENDOR_SYSFS_STABLE_SAFETY_UNION
          RUNTIME_CONFLICTS_5.4.300=8
          TEXT_CONFLICT_HUNKS_5.4.300=28
          RUNTIME_CONFLICTS_5.4.302=14
          TEXT_CONFLICT_HUNKS_5.4.302=39
          SEMANTIC_RESOLUTIONS=30
          FULL_O32_EVIDENCE_CARRIED_FORWARD=YES
          KERNEL_BUILD_PERFORMED=NO
          AK3_CREATED=NO
          FLASH_PERFORMED=NO
          DEVICE_PASS=NO
          O33_RUNTIME_GATE=PASS
          EOF

          rm -f "$AUDIT_DIR/99-FILE-LIST.txt" "$AUDIT_DIR/SHA256SUMS.txt"
          (
            cd "$AUDIT_DIR"
            find . -type f -print | LC_ALL=C sort
          ) > "$AUDIT_DIR/99-FILE-LIST.txt"

          file_count="$(find "$AUDIT_DIR" -type f | wc -l)"
          byte_count="$(du -sb "$AUDIT_DIR" | awk '{print $1}')"
          patch300_bytes="$(stat -c '%s' "$AUDIT_DIR/target-5.4.300/P13-to-5.4.300-AUTO-MERGED-PARTIAL.patch")"
          patch302_bytes="$(stat -c '%s' "$AUDIT_DIR/target-5.4.302/P13-to-5.4.302-AUTO-MERGED-PARTIAL.patch")"

          # Completeness gates prevent any return to thin/report-only artifacts.
          test "$file_count" -ge 265
          test "$byte_count" -ge 17000000
          test "$patch300_bytes" -ge 4000000
          test "$patch302_bytes" -ge 4400000
          test "$(wc -l < "$AUDIT_DIR/lineage/O32-SHA256SUMS.original.txt")" -eq "$O32_INTERNAL_SHA_COUNT"
          grep -Fxq 'O32_RUNTIME_GATE=PASS' "$AUDIT_DIR/lineage/O32-PARENT-GATE.txt"

          cat > "$AUDIT_DIR/99-O33-FINAL-GATE.txt" <<EOF
          O32_EXACT_ARTIFACT=PASS
          O32_INTERNAL_SHA256SUMS=$O32_INTERNAL_SHA_COUNT/$O32_INTERNAL_SHA_COUNT PASS
          O32_RUNTIME_GATE=PASS
          P13_EXACT_OUTER_SOURCE_RECONSTRUCTION=PASS
          SOCINFO_VENDOR_SYSFS_STABLE_SAFETY_UNION_5.4.300=PASS
          SOCINFO_VENDOR_SYSFS_STABLE_SAFETY_UNION_5.4.302=PASS
          UPDATED_PARTIAL_PATCH_APPLY_5.4.300=PASS
          UPDATED_PARTIAL_PATCH_APPLY_5.4.302=PASS
          RUNTIME_CONFLICTS_5.4.300=8
          TEXT_CONFLICT_HUNKS_5.4.300=28
          RUNTIME_CONFLICTS_5.4.302=14
          TEXT_CONFLICT_HUNKS_5.4.302=39
          SEMANTIC_RESOLUTIONS=30
          ONLY_NEW_SOURCE_RESOLVER=drivers/soc/qcom/socinfo.c
          ARTIFACT_FILE_COUNT=$file_count
          ARTIFACT_UNCOMPRESSED_BYTES=$byte_count
          PARTIAL_PATCH_5.4.300_BYTES=$patch300_bytes
          PARTIAL_PATCH_5.4.302_BYTES=$patch302_bytes
          COMPREHENSIVE_ARTIFACT_COMPLETENESS=PASS
          CURRENT_RUNTIME_PARENT=U5-O33
          KERNEL_BUILD_PERFORMED=NO
          AK3_CREATED=NO
          FLASH_PERFORMED=NO
          DEVICE_PASS=NO
          O33_FINAL=RUNTIME_GREEN_PASS
          EOF

          (
            cd "$AUDIT_DIR"
            find . -type f ! -name SHA256SUMS.txt -print | LC_ALL=C sort
          ) > "$AUDIT_DIR/99-FILE-LIST.txt"

          (
            cd "$AUDIT_DIR"
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          ) | tee "$RUNNER_TEMP/o33-final-sha256-check.txt"

          test "$(grep -c 'OK$' "$RUNNER_TEMP/o33-final-sha256-check.txt")" -eq \
               "$(wc -l < "$AUDIT_DIR/SHA256SUMS.txt")"

          echo "O33 comprehensive artifact files: $file_count"
          echo "O33 comprehensive artifact bytes: $byte_count"
          echo "O33_FINAL=RUNTIME_GREEN_PASS"

      - name: Upload one comprehensive U5-O33 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-GEN1-U5-O33-socinfo-vendor-sysfs-stable-safety-union-semantic-resolution-official-stable-5.4.300-5.4.302-port-audit
          path: ${{ env.AUDIT_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
