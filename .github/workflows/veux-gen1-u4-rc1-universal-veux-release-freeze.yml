        if: always()
        shell: bash
        run: |
          set -euo pipefail

          test -d "$EVIDENCE_DIR"

          cd "$EVIDENCE_DIR"
          find . -type f ! -name 'U2-EVIDENCE-SHA256SUMS.txt' -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            > U2-EVIDENCE-SHA256SUMS.txt

          sha256sum -c U2-EVIDENCE-SHA256SUMS.txt

      - name: Upload U2 install candidate
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-GEN1-U2-R3-P13-universal-VEUX-AK3-candidate
          path: |
            u2-dist/*.zip
            u2-dist/*.sha256
