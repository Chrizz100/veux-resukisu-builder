              echo "REAL_DEVICE_PARTITION_WRITTEN=NO"
              echo "ANYKERNEL_FLASHABLE_ZIP_CREATED=NO"
              echo "FLASHING_PERFORMED=NO"
            } > "$REPORT"
          fi

          test -s "$REPORT"

      - name: Upload W36 real boot validation audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GEN2_36_V12_REAL_LINEAGE_BOOT_AK3_MAGISKBOOT_VALIDATION_AUDIT-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          path: |
            GEN2_36_V12_REAL_LINEAGE_BOOT_AK3_MAGISKBOOT_VALIDATION_AUDIT.txt
            w36/evidence/

      - name: Finalize W36 result after audit artifact upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          REPORT='GEN2_36_V12_REAL_LINEAGE_BOOT_AK3_MAGISKBOOT_VALIDATION_AUDIT.txt'
          test -s "$REPORT"

          if grep -q '^FINAL_RESULT=PASS_GEN2_36_V12_' "$REPORT"; then
            echo "W36_V12_FINAL_JOB_STATUS=PASS"
            exit 0
          fi

          echo "W36_V12_FINAL_JOB_STATUS=FAIL_AFTER_AUDIT_ARTIFACT_UPLOAD"
          echo "The audit artifact was uploaded before this intentional failure."
          exit 1
