            echo
            echo "=== DIRECT VS AK3 ==="
            cat w36/evidence/direct-vs-ak3-status.txt
            echo
            echo "=== VERDICT ==="
            cat w36/evidence/w36-verdict.txt
            echo
            FINAL_RESULT_LINE="$(grep '^FINAL_RESULT=' w36/evidence/w36-verdict.txt | tail -n1)"
            test -n "$FINAL_RESULT_LINE"
            echo "$FINAL_RESULT_LINE"
            echo "REAL_DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
            echo "ANYKERNEL_FLASHABLE_ZIP_CREATED=NO"
          } > "$REPORT"

          test -s "$REPORT"

      - name: Build failure safe W36 audit
        if: always()
        shell: bash
        run: |
          set +e

          REPORT='GEN2_36_V12_REAL_LINEAGE_BOOT_AK3_MAGISKBOOT_VALIDATION_AUDIT.txt'

          if [ ! -s "$REPORT" ]; then
            {
              echo "AUDIT=GEN2_36_V12_REAL_LINEAGE_BOOT_ANYKERNEL3_MAGISKBOOT_VALIDATION"
              echo "RESULT=INCOMPLETE_OR_FAILED"
              echo "FAILURE_SAFE_AUDIT_GENERATED=YES"
              echo "DATE_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo
              for f in \
                w36/evidence/audit-header.txt \
                w36/evidence/input-artifact-status.txt \
                w36/evidence/prerequisite-status.txt \
                w36/evidence/lineage-contract-status.txt \
                w36/evidence/source-discovery-status.txt \
                w36/evidence/input-artifact-metadata.json \
                w36/evidence/input-artifact-ziptest.txt \
