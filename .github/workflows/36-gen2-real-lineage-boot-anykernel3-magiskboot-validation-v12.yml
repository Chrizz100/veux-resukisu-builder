name: 36 - GEN2 Real Lineage Boot AnyKernel3 Magiskboot Validation v12

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: Optional direct HTTPS URL to the exact validated real veux Lineage Android 16 boot.img
        required: false
        default: ""
        type: string
      boot_sha256:
        description: Exact SHA-256 of the selected boot.img
        required: false
        default: "b4f8a81c19f89f2cfc0a179a3a01b3079119411e0325bbde758e885bf9d4aa8d"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: gen2-36-real-lineage-boot-ak3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: GEN2 36 real Lineage boot AK3 magiskboot validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      W33_IMAGE_SHA256: 98e608f7c30540b6cb5a1731b0edecd9a3b4960ebf388763452685858916037f
      W33_CONFIG_SHA256: 2931b6b74bf34a85f2a71cb4b76d1a3277a5538514411dd1047c841d46e92cbb

      LINEAGE_API: https://download.lineageos.org/api/v2/devices/veux/builds
      LINEAGE_VEUX_REPO: https://github.com/xiaomi-sm6375-devs/android_device_xiaomi_veux.git
      LINEAGE_COMMON_REPO: https://github.com/xiaomi-sm6375-devs/android_device_xiaomi_sm6375-common.git
      LINEAGE_VEUX_PIN: 423b9b6e00301e181a85d886b3c67c47c48d096e
      LINEAGE_COMMON_PIN: 4cd108d5cd933e5cdaf1293bee233621e8008ac8

      AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
      AK3_PIN: af770f7b16cf8f8eb7c68614b2a693b3b361c90c

      MAGISK_REPO: topjohnwu/Magisk
      MAGISK_TAG: v30.7
      MAGISK_APK_NAME: Magisk-v30.7.apk

      AVB_REPO: https://github.com/LineageOS/android_external_avb.git
      AVB_PIN: 91f1bfc948d35265c3b1e5e97bf1c410e65d18fa

      VALIDATED_BOOT_SHA256: b4f8a81c19f89f2cfc0a179a3a01b3079119411e0325bbde758e885bf9d4aa8d
      VALIDATED_BOOT_GZIP_NAME: GEN2_W36_VALIDATED_LINEAGE_VEUX_ANDROID16_BOOT.img.gz
      VALIDATED_BOOT_INPUT_ARTIFACT_NAME: GEN2_W36_VALIDATED_LINEAGE_ANDROID16_BOOT_INPUT
      VALIDATED_BOOT_REPO_SEED_PATH: .github/workflows/GEN2_W36_VALIDATED_LINEAGE_VEUX_ANDROID16_BOOT.img.gz
      VALIDATED_BOOT_GZIP_SHA256: 183984c727524325b36696a43419802fa9894a56bfc4c51c3b3cc6fa242a7bfa
      VALIDATED_BOOT_GZIP_SIZE: 16498759
      VALIDATED_BOOT_SIZE: 133300224
      VALIDATED_BOOT_ANDROID_VERSION: 16
      VALIDATED_BOOT_SECURITY_PATCH: 2026-04
      VALIDATED_BOOT_HEADER_VERSION: 3
      VALIDATED_BOOT_KERNEL_VERSION: 5.4.302~positron/341987108
      VALIDATED_BOOT_KERNEL_BUILD_UTC: 2026-04-18T21:21:05Z
      VALIDATED_BOOT_LINEAGE_FINGERPRINT_PREFIX: Redmi/lineage_veux/veux:16/

      BOOT_PARTITION_SIZE: 134217728
      EXPECTED_BOOT_HEADER_VERSION: 3

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6

      - name: Initialize W36 workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            w36/evidence \
            w36/w33 \
            w36/w35 \
            w36/lineage \
            w36/ak3 \
            w36/magisk \
            w36/avb \
            w36/real \
            w36/input-seed \
            w36/direct \
            w36/ak3-run \
            w36/verify

          {
            echo "AUDIT=GEN2_36_V12_REAL_LINEAGE_BOOT_ANYKERNEL3_MAGISKBOOT_VALIDATION"
            echo "DATE_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "REPOSITORY=$GITHUB_REPOSITORY"
            echo "REAL_LINEAGE_BOOT_REQUIRED=YES"
            echo "SYNTHETIC_BOOT_ONLY=NO"
            echo "REAL_DEVICE_ACCESSED=NO"
            echo "REAL_DEVICE_PARTITION_WRITTEN=NO"
            echo "SANDBOX_REGULAR_FILE_PARTITION_ONLY=YES"
            echo "ANYKERNEL_FLASHABLE_ZIP_CREATED=NO"
            echo "FLASHING_PERFORMED=NO"
            echo "W36_V1_RESULT=FAILURE_SAFE_SOURCE_AVAILABILITY_STOP"
            echo "W36_V1_OFFICIAL_LINEAGE_API_RESPONSE=EMPTY_ARRAY"
            echo "W36_V1_KERNEL_OR_REPACK_FAILURE=NO"
            echo "W36_V2_RESULT=FAILURE_SAFE_NATIVE_BUILD_DEPENDENCY_STOP"
            echo "W36_V2_KERNEL_OR_REPACK_FAILURE=NO"
            echo "W36_V3_RESULT=FAILURE_SAFE_ARCHIVE_SHORTLINK_REDIRECT_STOP"
            echo "W36_V3_KERNEL_OR_REPACK_FAILURE=NO"
            echo "W36_V4_RESULT=FAILURE_SAFE_HISTORICAL_LINEAGE_MIRROR_404_STOP"
            echo "W36_V4_KERNEL_OR_REPACK_FAILURE=NO"
            echo "W36_V5_STATUS=SUPERSEDED_BY_LOCALLY_VALIDATED_REAL_VEUX_LINEAGE_ANDROID16_BOOT"
            echo "W36_V6_RESULT=FAILURE_SAFE_VALIDATED_BOOT_BYTES_NOT_REACHABLE_FROM_GITHUB_ACTIONS"
            echo "W36_V6_KERNEL_OR_REPACK_FAILURE=NO"
            echo "W36_V7_RESULT=FAILURE_SAFE_VALIDATED_REPOSITORY_GZIP_NOT_PRESENT"
            echo "W36_V7_KERNEL_OR_REPACK_FAILURE=NO"
            echo "W36_V12_POLICY=PREFER_EXISTING_EXACT_ACTIONS_INPUT_ARTIFACT_THEN_ONE_TIME_REPO_SEED_THEN_OFFICIAL_LINEAGE_API"
            echo "W36_V12_INPUT_ARTIFACT=$VALIDATED_BOOT_INPUT_ARTIFACT_NAME"
            echo "W36_V12_ONE_TIME_REPO_SEED_PATH=$VALIDATED_BOOT_REPO_SEED_PATH"
            echo "W36_V12_ARTIFACT_CHAIN_MODEL=WORKFLOW18_TO_WORKFLOW19_COMPATIBLE"
            echo "W36_V12_VALIDATED_BOOT_SHA256=$VALIDATED_BOOT_SHA256"
            echo "W36_V12_VALIDATED_BOOT_SIZE=$VALIDATED_BOOT_SIZE"
            echo "W36_V12_EXACT_20260401_OFFICIAL_BUILD_PROVENANCE=NOT_CLAIMED"
            echo "W36_V12_VALIDATED_BOOT_GZIP_SHA256=$VALIDATED_BOOT_GZIP_SHA256"
            echo "W36_V12_VALIDATED_BOOT_GZIP_SIZE=$VALIDATED_BOOT_GZIP_SIZE"
            echo "W36_V12_ARTIFACT_BEFORE_FINAL_FAILURE=YES"
            echo "W36_V12_REAL_DEVICE_ACCESS=NO"
            echo "W36_V11_AK3_FAILURE=SLOT_UNBOUND_UNDER_NOUNSET_AND_NONDEVICE_BLOCK_HARNESS"
            echo "W36_V12_AK3_FIX=RESTORE_OLD_FAKE_DEV_BLOCK_BY_NAME_ACTIVE_SLOT_HARNESS_AND_NO_NOUNSET"
          } | tee w36/evidence/audit-header.txt

          echo "W36_SOURCE_READY=NO" >> "$GITHUB_ENV"
          echo "W36_SEED_INPUT_ARTIFACT=NO" >> "$GITHUB_ENV"

      - name: Download exact W33 v7 and W35 v3 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          VERSION="X-GitHub-Api-Version: 2022-11-28"

          curl -fsSL \
            -H "$AUTH" -H "$ACCEPT" -H "$VERSION" \
            "$API/actions/artifacts?per_page=100" \
            -o w36/evidence/actions-artifacts.json

          fetch_artifact() {
            prefix="$1"
            outzip="$2"
            outdir="$3"

            id="$(
              jq -r --arg prefix "$prefix" '
                [
                  .artifacts[]
                  | select(
                      (.expired == false)
                      and
                      (.name | startswith($prefix))
                    )
                ]
                | sort_by(.created_at)
                | reverse
                | .[0].id // empty
              ' w36/evidence/actions-artifacts.json
            )"

            name="$(
              jq -r --argjson id "$id" '
                .artifacts[]
                | select(.id == $id)
                | .name
              ' w36/evidence/actions-artifacts.json
            )"

            test -n "$id"
            test -n "$name"

            curl -fLsS \
              -H "$AUTH" -H "$ACCEPT" -H "$VERSION" \
              "$API/actions/artifacts/$id/zip" \
              -o "$outzip"

            unzip -t "$outzip" >/dev/null
            unzip -q "$outzip" -d "$outdir"

            echo "$name|$id|$(sha256sum "$outzip" | awk '{print $1}')"
          }

          W33_INFO="$(
            fetch_artifact \
              'GEN2_33_V7_FINAL_FULL_IMAGE_DTB_DTBO_BUILD_AUDIT-' \
              w36/W33_V7.zip \
              w36/w33
          )"

          W35_INFO="$(
            fetch_artifact \
              'GEN2_35_V3_ANYKERNEL3_BOOT_REPACK_CONTRACT_AUDIT-' \
              w36/W35_V3.zip \
              w36/w35
          )"

          {
            echo "W33_ARTIFACT=$W33_INFO"
            echo "W35_ARTIFACT=$W35_INFO"
            echo "W33_FILE_COUNT=$(find w36/w33 -type f | wc -l | tr -d ' ')"
            echo "W35_FILE_COUNT=$(find w36/w35 -type f | wc -l | tr -d ' ')"
          } | tee w36/evidence/input-artifact-status.txt

      - name: Verify W33 and W35 prerequisite contracts
        shell: bash
        run: |
          set -euo pipefail

          test -s w36/w33/GEN2_33_Image
          test -s w36/w33/GEN2_33_final.config
          test -s w36/w33/GEN2_33_V7_SHA256SUMS

          (
            cd w36/w33
            sha256sum -c GEN2_33_V7_SHA256SUMS
          ) | tee w36/evidence/w33-manifest-check.txt

          test "$(grep -c ': OK$' w36/evidence/w33-manifest-check.txt)" -eq 8
          test "$(
            sha256sum w36/w33/GEN2_33_Image | awk '{print $1}'
          )" = "$W33_IMAGE_SHA256"
          test "$(
            sha256sum w36/w33/GEN2_33_final.config | awk '{print $1}'
          )" = "$W33_CONFIG_SHA256"

          W35_REPORT='w36/w35/GEN2_35_V3_ANYKERNEL3_BOOT_REPACK_CONTRACT_AUDIT.txt'
          test -s "$W35_REPORT"

          grep -q \
            '^FINAL_RESULT=PASS_GEN2_35_V3_ANYKERNEL3_BOOT_REPACK_STATIC_SYNTHETIC_CONTRACT$' \
            "$W35_REPORT"
          grep -q '^W35_STATIC_SYNTHETIC_AK3_CONTRACT=PASS$' "$W35_REPORT"
          grep -q '^DTB_POLICY=PRESERVE_ROM_DTB_IN_VENDOR_BOOT$' "$W35_REPORT"
          grep -q '^DTBO_POLICY=PRESERVE$' "$W35_REPORT"
          grep -q '^RAMDISK_POLICY=PRESERVE$' "$W35_REPORT"
          grep -q '^REAL_BOOT_IMAGE_REPACK_REQUIRED_BEFORE_RELEASE=YES$' "$W35_REPORT"

          {
            echo "W36_PREREQUISITES=PASS"
            echo "W33_V7=PASS"
            echo "W35_V3=PASS"
            echo "W33_IMAGE_SHA256=$W33_IMAGE_SHA256"
          } | tee w36/evidence/prerequisite-status.txt

      - name: Fetch exact current Lineage device contract pins
        shell: bash
        run: |
          set -euo pipefail

          git clone --filter=blob:none --no-checkout \
            "$LINEAGE_VEUX_REPO" w36/lineage/veux >/dev/null 2>&1
          git -C w36/lineage/veux checkout --detach "$LINEAGE_VEUX_PIN" >/dev/null 2>&1

          git clone --filter=blob:none --no-checkout \
            "$LINEAGE_COMMON_REPO" w36/lineage/common >/dev/null 2>&1
          git -C w36/lineage/common checkout --detach "$LINEAGE_COMMON_PIN" >/dev/null 2>&1

          test "$(git -C w36/lineage/veux rev-parse HEAD)" = "$LINEAGE_VEUX_PIN"
          test "$(git -C w36/lineage/common rev-parse HEAD)" = "$LINEAGE_COMMON_PIN"

          DEVICE='w36/lineage/veux/BoardConfig.mk'
          COMMON='w36/lineage/common/BoardConfigCommon.mk'

          grep -q 'TARGET_KERNEL_CONFIG := veux_defconfig' "$DEVICE"
          grep -q 'BOARD_KERNEL_IMAGE_NAME := Image' "$COMMON"
          grep -q 'BOARD_BOOT_HEADER_VERSION := 3' "$COMMON"
          grep -q 'BOARD_INCLUDE_DTB_IN_BOOTIMG := true' "$COMMON"
          grep -q 'BOARD_KERNEL_SEPARATED_DTBO := true' "$COMMON"
          grep -q 'BOARD_BOOTIMAGE_PARTITION_SIZE := 134217728' "$COMMON"
          grep -q 'BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE := 100663296' "$COMMON"

          {
            echo "LINEAGE_DEVICE_CONTRACT=PASS"
            echo "DEVICE=veux"
            echo "KERNEL_IMAGE_NAME=Image"
            echo "BOOT_HEADER_VERSION=3"
            echo "BOOT_PARTITION_SIZE=134217728"
            echo "VENDOR_BOOT_POLICY=PRESERVE"
            echo "DTBO_POLICY=PRESERVE"
          } | tee w36/evidence/lineage-contract-status.txt

      - name: Resolve exact validated real veux Lineage Android 16 boot
        id: real_boot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          USER_BOOT_URL: ${{ inputs.boot_url }}
          USER_BOOT_SHA256: ${{ inputs.boot_sha256 }}
        run: |
          set -uo pipefail

          : > w36/evidence/lineage-api.json
          : > w36/evidence/source-discovery-status.txt
          : > w36/evidence/real-boot-source-selection.txt
          : > w36/evidence/source-ready-status.txt
          : > w36/evidence/input-artifact-metadata.json

          SOURCE_MODE=''
          BOOT_URL=''
          EXPECTED_SHA=''
          EXPECTED_SHA_SOURCE=''
          BUILD_DATE=''
          BUILD_VERSION=''
          BUILD_FILENAME=''
          SOURCE_REFERENCE=''
          EXACT_LINEAGE_23_2_PROVENANCE='NO'
          VALIDATED_BOOT_SHA_MATCH='NO'
          SOURCE_READY='NO'
          SOURCE_FAILURE_REASON=''
          SEED_INPUT_ARTIFACT='NO'

          USER_BOOT_SHA256="$(printf '%s' "$USER_BOOT_SHA256" | tr '[:upper:]' '[:lower:]')"

          verify_and_expand_gzip() {
            local gzip_path="$1"
            local source_label="$2"

            test -s "$gzip_path" || {
              SOURCE_FAILURE_REASON="${source_label}_GZIP_MISSING"
              return 40
            }

            local gzip_sha gzip_size
            gzip_sha="$(sha256sum "$gzip_path" | awk '{print $1}')"
            gzip_size="$(stat -c '%s' "$gzip_path")"

            {
              echo "${source_label}_GZIP_PATH=$gzip_path"
              echo "${source_label}_GZIP_SHA256=$gzip_sha"
              echo "${source_label}_GZIP_SIZE=$gzip_size"
              echo "EXPECTED_GZIP_SHA256=$VALIDATED_BOOT_GZIP_SHA256"
              echo "EXPECTED_GZIP_SIZE=$VALIDATED_BOOT_GZIP_SIZE"
            } >> w36/evidence/source-discovery-status.txt

            if [ "$gzip_sha" != "$VALIDATED_BOOT_GZIP_SHA256" ]; then
              SOURCE_FAILURE_REASON="${source_label}_GZIP_SHA256_MISMATCH"
              return 41
            fi

            if [ "$gzip_size" -ne "$VALIDATED_BOOT_GZIP_SIZE" ]; then
              SOURCE_FAILURE_REASON="${source_label}_GZIP_SIZE_MISMATCH"
              return 42
            fi

            if ! gzip -t "$gzip_path"; then
              SOURCE_FAILURE_REASON="${source_label}_GZIP_INTEGRITY_FAILED"
              return 43
            fi

            if ! gzip -dc "$gzip_path" > w36/real/selected-veux-boot.img; then
              SOURCE_FAILURE_REASON="${source_label}_GZIP_DECOMPRESSION_FAILED"
              return 44
            fi

            EXPECTED_SHA="$VALIDATED_BOOT_SHA256"
            EXPECTED_SHA_SOURCE='PINNED_VALIDATED_BOOT_SHA256'
            BUILD_VERSION='LINEAGE_ANDROID16_VALIDATED_CANDIDATE'
            BUILD_FILENAME='boot.img'
            SOURCE_READY='YES'
            SOURCE_FAILURE_REASON=''
            return 0
          }

          resolve_existing_input_artifact() {
            local api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
            local auth="Authorization: Bearer $GH_TOKEN"
            local accept="Accept: application/vnd.github+json"
            local version="X-GitHub-Api-Version: 2022-11-28"
            local all="w36/evidence/input-artifacts.ndjson"
            : > "$all"

            local page=1
            while :; do
              local page_json="w36/evidence/input-artifacts-page-${page}.json"

              if ! curl -fsSL \
                -H "$auth" -H "$accept" -H "$version" \
                "$api/actions/artifacts?per_page=100&page=${page}" \
                -o "$page_json"; then
                SOURCE_FAILURE_REASON='ACTIONS_ARTIFACT_LIST_FAILED'
                return 50
              fi

              local count
              count="$(jq '.artifacts | length' "$page_json")"
              jq -c '.artifacts[]' "$page_json" >> "$all"

              if [ "$count" -lt 100 ]; then
                break
              fi

              page=$((page + 1))
              if [ "$page" -gt 20 ]; then
                SOURCE_FAILURE_REASON='ACTIONS_ARTIFACT_PAGINATION_LIMIT'
                return 51
              fi
            done

            local matches count selected id url
            matches="$(
              jq -s \
                --arg NAME "$VALIDATED_BOOT_INPUT_ARTIFACT_NAME" \
                '[.[] | select(.name == $NAME and .expired == false)] | sort_by(.created_at)' \
                "$all"
            )"
            count="$(jq 'length' <<< "$matches")"

            {
              echo "INPUT_ARTIFACT_NAME=$VALIDATED_BOOT_INPUT_ARTIFACT_NAME"
              echo "INPUT_ARTIFACT_MATCH_COUNT=$count"
            } >> w36/evidence/source-discovery-status.txt

            if [ "$count" -lt 1 ]; then
              SOURCE_FAILURE_REASON='VALIDATED_ACTIONS_INPUT_ARTIFACT_NOT_FOUND'
              return 52
            fi

            selected="$(jq '.[-1]' <<< "$matches")"
            id="$(jq -r '.id' <<< "$selected")"
            url="$(jq -r '.archive_download_url' <<< "$selected")"
            jq . <<< "$selected" > w36/evidence/input-artifact-metadata.json

            {
              echo "INPUT_ARTIFACT_SELECTED_ID=$id"
              echo "INPUT_ARTIFACT_SELECTED_CREATED_AT=$(jq -r '.created_at' <<< "$selected")"
            } >> w36/evidence/source-discovery-status.txt

            if ! curl -fLsS \
              -H "$auth" -H "$accept" -H "$version" \
              "$url" \
              -o w36/real/input-artifact.zip; then
              SOURCE_FAILURE_REASON='VALIDATED_ACTIONS_INPUT_ARTIFACT_DOWNLOAD_FAILED'
              return 53
            fi

            if ! unzip -t w36/real/input-artifact.zip \
              > w36/evidence/input-artifact-ziptest.txt 2>&1; then
              SOURCE_FAILURE_REASON='VALIDATED_ACTIONS_INPUT_ARTIFACT_ZIP_INVALID'
              return 54
            fi

            rm -rf w36/real/input-artifact
            mkdir -p w36/real/input-artifact
            unzip -q w36/real/input-artifact.zip -d w36/real/input-artifact

            mapfile -t gzips < <(
              find w36/real/input-artifact \
                -type f \
                -name "$VALIDATED_BOOT_GZIP_NAME" \
                -print \
                | LC_ALL=C sort
            )

            if [ "${#gzips[@]}" -ne 1 ]; then
              {
                echo "INPUT_ARTIFACT_GZIP_CANDIDATE_COUNT=${#gzips[@]}"
              } >> w36/evidence/source-discovery-status.txt
              SOURCE_FAILURE_REASON='VALIDATED_ACTIONS_INPUT_ARTIFACT_EXPECTED_ONE_GZIP'
              return 55
            fi

            if verify_and_expand_gzip "${gzips[0]}" 'ACTIONS_INPUT_ARTIFACT'; then
              SOURCE_MODE='ACTIONS_ARTIFACT_CHAIN_EXACT_VALIDATED_BOOT'
              SOURCE_REFERENCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
              BOOT_URL='GITHUB_ACTIONS_ARTIFACT'
              return 0
            fi

            return $?
          }

          resolve_repo_seed_once() {
            local seed="$VALIDATED_BOOT_REPO_SEED_PATH"

            if [ ! -f "$seed" ]; then
              SOURCE_FAILURE_REASON='ONE_TIME_REPO_SEED_NOT_PRESENT'
              return 60
            fi

            if verify_and_expand_gzip "$seed" 'ONE_TIME_REPO_SEED'; then
              SOURCE_MODE='ONE_TIME_REPO_SEED_TO_ACTIONS_ARTIFACT_CHAIN'
              SOURCE_REFERENCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/$seed"
              BOOT_URL='REPOSITORY_SEED_THIS_RUN_ONLY'
              SEED_INPUT_ARTIFACT='YES'

              rm -rf w36/input-seed/*
              cp "$seed" "w36/input-seed/$VALIDATED_BOOT_GZIP_NAME"

              {
                echo "ARTIFACT_ROLE=CANONICAL_W36_VALIDATED_LINEAGE_ANDROID16_BOOT_INPUT"
                echo "SOURCE_WORKFLOW=W36_V12"
                echo "GZIP_NAME=$VALIDATED_BOOT_GZIP_NAME"
                echo "GZIP_SHA256=$VALIDATED_BOOT_GZIP_SHA256"
                echo "GZIP_SIZE=$VALIDATED_BOOT_GZIP_SIZE"
                echo "BOOT_SHA256=$VALIDATED_BOOT_SHA256"
                echo "BOOT_SIZE=$VALIDATED_BOOT_SIZE"
                echo "ANDROID_VERSION=$VALIDATED_BOOT_ANDROID_VERSION"
                echo "SECURITY_PATCH=$VALIDATED_BOOT_SECURITY_PATCH"
                echo "BOOT_HEADER_VERSION=$VALIDATED_BOOT_HEADER_VERSION"
                echo "EXACT_20260401_OFFICIAL_BUILD_PROVENANCE=NOT_CLAIMED"
              } > w36/input-seed/INPUT-MANIFEST.txt

              sha256sum \
                "w36/input-seed/$VALIDATED_BOOT_GZIP_NAME" \
                w36/input-seed/INPUT-MANIFEST.txt \
                > w36/input-seed/SHA256SUMS

              return 0
            fi

            return $?
          }

          if [ -n "$USER_BOOT_URL" ]; then
            if ! [[ "$USER_BOOT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              SOURCE_FAILURE_REASON='MANUAL_BOOT_URL_REQUIRES_VALID_SHA256'
            else
              SOURCE_MODE='MANUAL_EXACT_SHA256_PINNED_VALIDATED_BOOT_URL'
              BOOT_URL="$USER_BOOT_URL"
              EXPECTED_SHA="$USER_BOOT_SHA256"
              EXPECTED_SHA_SOURCE='WORKFLOW_INPUT_SHA256'
              BUILD_VERSION='LINEAGE_ANDROID16_VALIDATED_CANDIDATE'
              BUILD_FILENAME='boot.img'
              SOURCE_REFERENCE="$USER_BOOT_URL"

              if curl -fL \
                --proto '=https' \
                --proto-redir '=https' \
                --retry 4 \
                --retry-delay 3 \
                --connect-timeout 30 \
                --max-redirs 10 \
                "$BOOT_URL" \
                -o w36/real/selected-veux-boot.img; then
                SOURCE_READY='YES'
                SOURCE_FAILURE_REASON=''
              else
                SOURCE_FAILURE_REASON='MANUAL_BOOT_URL_DOWNLOAD_FAILED'
              fi
            fi
          else
            # Restore the proven W18 -> W19 transport model:
            # use an exact, unexpired Actions artifact if one already exists.
            resolve_existing_input_artifact || true

            # First bootstrap only: the exact gzip currently present in the
            # workflow directory is validated and promoted into an Actions
            # artifact. Future runs no longer require this repository seed.
            if [ "$SOURCE_READY" != YES ] && \
               [ "$SOURCE_FAILURE_REASON" = 'VALIDATED_ACTIONS_INPUT_ARTIFACT_NOT_FOUND' ]; then
              resolve_repo_seed_once || true
            fi

            # Last automatic fallback: current official LineageOS API.
            if [ "$SOURCE_READY" != YES ]; then
              set +e
              curl -fsSL --retry 3 --retry-delay 2 \
                "$LINEAGE_API" \
                -o w36/evidence/lineage-api.json
              API_RC=$?
              set -e

              CANDIDATE=''
              if [ "$API_RC" -eq 0 ] && [ -s w36/evidence/lineage-api.json ]; then
                CANDIDATE="$(
                  jq -c '
                    [
                      .[]
                      | select((.version | tostring) == "23.2")
                      | . as $build
                      | ($build.files // [])[]
                      | select(
                          (.filename == "boot.img")
                          or
                          (.filename | endswith("-boot.img"))
                        )
                      | {
                          url: .url,
                          sha256: .sha256,
                          filename: .filename,
                          date: $build.date,
                          version: $build.version
                        }
                    ]
                    | sort_by(.date)
                    | reverse
                    | .[0] // empty
                  ' w36/evidence/lineage-api.json
                )"
              fi

              if [ -n "$CANDIDATE" ]; then
                SOURCE_MODE='OFFICIAL_LINEAGE_API_DIRECT_BOOT'
                BOOT_URL="$(jq -r '.url' <<< "$CANDIDATE")"
                EXPECTED_SHA="$(jq -r '.sha256 // empty' <<< "$CANDIDATE" | tr '[:upper:]' '[:lower:]')"
                EXPECTED_SHA_SOURCE='OFFICIAL_LINEAGE_API'
                BUILD_DATE="$(jq -r '.date // empty' <<< "$CANDIDATE")"
                BUILD_VERSION="$(jq -r '.version // empty' <<< "$CANDIDATE")"
                BUILD_FILENAME="$(jq -r '.filename // empty' <<< "$CANDIDATE")"
                SOURCE_REFERENCE="$LINEAGE_API"
                EXACT_LINEAGE_23_2_PROVENANCE='YES'

                if [ -n "$BOOT_URL" ] && [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]] && \
                   curl -fL \
                     --proto '=https' \
                     --proto-redir '=https' \
                     --retry 4 \
                     --retry-delay 3 \
                     --connect-timeout 30 \
                     --max-redirs 10 \
                     "$BOOT_URL" \
                     -o w36/real/selected-veux-boot.img; then
                  SOURCE_READY='YES'
                  SOURCE_FAILURE_REASON=''
                else
                  SOURCE_FAILURE_REASON='OFFICIAL_LINEAGE_API_BOOT_DOWNLOAD_FAILED'
                fi
              elif [ "$SOURCE_FAILURE_REASON" = 'ONE_TIME_REPO_SEED_NOT_PRESENT' ] || \
                   [ "$SOURCE_FAILURE_REASON" = 'VALIDATED_ACTIONS_INPUT_ARTIFACT_NOT_FOUND' ]; then
                SOURCE_FAILURE_REASON='NO_ACTIONS_INPUT_ARTIFACT_NO_REPO_SEED_AND_OFFICIAL_LINEAGE_API_HAS_NO_BOOT'
              fi

              {
                echo "OFFICIAL_LINEAGE_API_RC=$API_RC"
                echo "OFFICIAL_LINEAGE_API_23_2_BOOT_CANDIDATE=$([ -n "$CANDIDATE" ] && echo YES || echo NONE)"
              } >> w36/evidence/source-discovery-status.txt
            fi
          fi

          if [ "$SOURCE_READY" = YES ] && [ ! -s w36/real/selected-veux-boot.img ]; then
            SOURCE_READY='NO'
            SOURCE_FAILURE_REASON='SELECTED_BOOT_MISSING_OR_EMPTY'
          fi

          if [ "$SOURCE_READY" = YES ]; then
            ACTUAL_SHA="$(sha256sum w36/real/selected-veux-boot.img | awk '{print $1}')"
            ACTUAL_SIZE="$(stat -c '%s' w36/real/selected-veux-boot.img)"

            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              SOURCE_READY='NO'
              SOURCE_FAILURE_REASON='SELECTED_BOOT_SHA256_MISMATCH'
            elif [ "$ACTUAL_SHA" = "$VALIDATED_BOOT_SHA256" ] && [ "$ACTUAL_SIZE" -ne "$VALIDATED_BOOT_SIZE" ]; then
              SOURCE_READY='NO'
              SOURCE_FAILURE_REASON='VALIDATED_BOOT_SIZE_MISMATCH'
            fi
          fi

          if [ "$SOURCE_READY" = YES ]; then
            if python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import struct

          p = Path("w36/real/selected-veux-boot.img")
          data = p.read_bytes()

          if len(data) < 1580:
              raise RuntimeError("selected real boot image is too small")
          if data[:8] != b"ANDROID!":
              raise RuntimeError("selected real boot image lacks ANDROID! magic")

          header_version = struct.unpack_from("<I", data, 40)[0]
          if header_version != 3:
              raise RuntimeError(f"expected Android boot header v3, got {header_version}")

          if len(data) > 134217728:
              raise RuntimeError(
                  f"selected real boot image exceeds 128 MiB boot partition: {len(data)}"
              )

          actual_sha = hashlib.sha256(data).hexdigest()
          if actual_sha == os.environ["VALIDATED_BOOT_SHA256"]:
              if len(data) != 133300224:
                  raise RuntimeError("validated candidate size changed")
              raw_os_version = struct.unpack_from("<I", data, 16)[0]
              android_major = (raw_os_version >> 25) & 0x7f
              patch_year = ((raw_os_version >> 4) & 0x7f) + 2000
              patch_month = raw_os_version & 0xf
              if android_major != 16:
                  raise RuntimeError(f"validated candidate is not Android 16: {android_major}")
              if (patch_year, patch_month) != (2026, 4):
                  raise RuntimeError(
                      f"validated candidate patch level mismatch: {patch_year}-{patch_month:02d}"
                  )
              if b"5.4.302~positron/341987108" not in data:
                  raise RuntimeError("validated candidate kernel identity string missing")
              if b"Redmi/lineage_veux/veux:16/" not in data:
                  raise RuntimeError("validated candidate Lineage veux Android 16 fingerprint missing")

          print("REAL_BOOT_ANDROID_MAGIC=PASS")
          print("REAL_BOOT_HEADER_VERSION=3")
          print("REAL_BOOT_FITS_PARTITION=YES")
          PY
            then
              ACTUAL_SHA="$(sha256sum w36/real/selected-veux-boot.img | awk '{print $1}')"
              ACTUAL_SIZE="$(stat -c '%s' w36/real/selected-veux-boot.img)"
              SHA256_MATCH='YES'
              if [ "$ACTUAL_SHA" = "$VALIDATED_BOOT_SHA256" ]; then
                VALIDATED_BOOT_SHA_MATCH='YES'
              fi

              {
                echo "REAL_BOOT_SOURCE_SELECTION=PASS"
                echo "SOURCE_MODE=$SOURCE_MODE"
                echo "SOURCE_REFERENCE=$SOURCE_REFERENCE"
                echo "BUILD_VERSION=$BUILD_VERSION"
                echo "BUILD_DATE=$BUILD_DATE"
                echo "BUILD_FILENAME=$BUILD_FILENAME"
                echo "BOOT_SOURCE_URL=$BOOT_URL"
                echo "EXPECTED_SHA256=$EXPECTED_SHA"
                echo "EXPECTED_SHA256_SOURCE=$EXPECTED_SHA_SOURCE"
                echo "ACTUAL_SHA256=$ACTUAL_SHA"
                echo "SHA256_MATCH=$SHA256_MATCH"
                echo "VALIDATED_BOOT_SHA256=$VALIDATED_BOOT_SHA256"
                echo "VALIDATED_BOOT_SHA_MATCH=$VALIDATED_BOOT_SHA_MATCH"
                echo "REAL_BOOT_SIZE=$ACTUAL_SIZE"
                echo "REAL_BOOT_ANDROID_MAGIC=PASS"
                echo "REAL_BOOT_HEADER_VERSION=3"
                echo "REAL_BOOT_FITS_PARTITION=YES"
                echo "EXACT_LINEAGE_23_2_PROVENANCE=$EXACT_LINEAGE_23_2_PROVENANCE"
                echo "VALIDATED_LINEAGE_ANDROID16_VEUX_CANDIDATE=$([ "$VALIDATED_BOOT_SHA_MATCH" = YES ] && echo YES || echo NO)"
                echo "EXACT_20260401_OFFICIAL_BUILD_PROVENANCE=NOT_CLAIMED"
                echo "REAL_DEVICE_ACCESSED=NO"
                echo "FLASHING_PERFORMED=NO"
              } | tee w36/evidence/real-boot-source-selection.txt
            else
              SOURCE_READY='NO'
              SOURCE_FAILURE_REASON='SELECTED_BOOT_PROVENANCE_GUARD_FAILED'
            fi
          fi

          if [ "$SOURCE_READY" != YES ]; then
            {
              echo "REAL_BOOT_SOURCE_SELECTION=FAIL"
              echo "REASON=${SOURCE_FAILURE_REASON:-UNKNOWN_SOURCE_FAILURE}"
              echo "VALIDATED_BOOT_SHA256=$VALIDATED_BOOT_SHA256"
              echo "VALIDATED_BOOT_SIZE=$VALIDATED_BOOT_SIZE"
              echo "EXPECTED_INPUT_ARTIFACT=$VALIDATED_BOOT_INPUT_ARTIFACT_NAME"
              echo "ONE_TIME_REPO_SEED_PATH=$VALIDATED_BOOT_REPO_SEED_PATH"
              echo "REMEDIATION=RESTORE_EXACT_ACTIONS_ARTIFACT_CHAIN_OR_SUPPLY_DIRECT_HTTPS_BOOT_URL"
              echo "REAL_DEVICE_ACCESSED=NO"
              echo "FLASHING_PERFORMED=NO"
            } | tee w36/evidence/real-boot-source-selection.txt
          fi

          {
            echo "W36_SOURCE_READY=$SOURCE_READY"
            echo "SOURCE_FAILURE_REASON=${SOURCE_FAILURE_REASON:-NONE}"
            echo "SEED_INPUT_ARTIFACT=$SEED_INPUT_ARTIFACT"
          } | tee w36/evidence/source-ready-status.txt

          echo "W36_SOURCE_READY=$SOURCE_READY" >> "$GITHUB_ENV"
          echo "W36_SEED_INPUT_ARTIFACT=$SEED_INPUT_ARTIFACT" >> "$GITHUB_ENV"

      - name: Seed canonical validated boot Actions input artifact
        if: env.W36_SEED_INPUT_ARTIFACT == 'YES'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.VALIDATED_BOOT_INPUT_ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          path: |
            w36/input-seed/GEN2_W36_VALIDATED_LINEAGE_VEUX_ANDROID16_BOOT.img.gz
            w36/input-seed/INPUT-MANIFEST.txt
            w36/input-seed/SHA256SUMS

      - name: Fetch pinned AnyKernel3 and host compatible Magiskboot
        if: env.W36_SOURCE_READY == 'YES'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git clone --filter=blob:none --no-checkout \
            "$AK3_REPO" w36/ak3/repo >/dev/null 2>&1
          git -C w36/ak3/repo checkout --detach "$AK3_PIN" >/dev/null 2>&1

          test "$(git -C w36/ak3/repo rev-parse HEAD)" = "$AK3_PIN"
          test -s w36/ak3/repo/tools/ak3-core.sh

          RELEASE_API="$GITHUB_API_URL/repos/$MAGISK_REPO/releases/tags/$MAGISK_TAG"

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$RELEASE_API" \
            -o w36/evidence/magisk-release.json

          ASSET_URL="$(
            jq -r --arg name "$MAGISK_APK_NAME" '
              .assets[]
              | select(.name == $name)
              | .browser_download_url
            ' w36/evidence/magisk-release.json | head -n1
          )"

          ASSET_DIGEST="$(
            jq -r --arg name "$MAGISK_APK_NAME" '
              .assets[]
              | select(.name == $name)
              | .digest // empty
            ' w36/evidence/magisk-release.json | head -n1
          )"

          test -n "$ASSET_URL"

          curl -fL \
            --retry 4 \
            --retry-delay 2 \
            "$ASSET_URL" \
            -o w36/magisk/Magisk-v30.7.apk

          APK_SHA="$(
            sha256sum w36/magisk/Magisk-v30.7.apk | awk '{print $1}'
          )"

          if [[ "$ASSET_DIGEST" == sha256:* ]]; then
            test "$APK_SHA" = "${ASSET_DIGEST#sha256:}"
            DIGEST_VERIFIED=YES
          else
            DIGEST_VERIFIED=NOT_PUBLISHED_BY_RELEASE_API
          fi

          unzip -p \
            w36/magisk/Magisk-v30.7.apk \
            lib/x86_64/libmagiskboot.so \
            > w36/magisk/magiskboot

          chmod +x w36/magisk/magiskboot
          test -s w36/magisk/magiskboot

          file w36/magisk/magiskboot \
            | tee w36/evidence/magiskboot-file.txt
          grep -qi 'x86-64' w36/evidence/magiskboot-file.txt

          set +e
          w36/magisk/magiskboot --help \
            > w36/evidence/magiskboot-help.txt 2>&1
          HELP_RC=$?
          set -e

          if [ "$HELP_RC" -ne 0 ]; then
            # Magiskboot may use a non-zero help exit but must execute.
            grep -qi 'magiskboot' w36/evidence/magiskboot-help.txt
          fi

          {
            echo "AK3_AND_MAGISKBOOT_FETCH=PASS"
            echo "AK3_PIN=$AK3_PIN"
            echo "MAGISK_TAG=$MAGISK_TAG"
            echo "MAGISK_APK_SHA256=$APK_SHA"
            echo "MAGISK_RELEASE_DIGEST=$ASSET_DIGEST"
            echo "MAGISK_RELEASE_DIGEST_VERIFIED=$DIGEST_VERIFIED"
            echo "MAGISKBOOT_SHA256=$(sha256sum w36/magisk/magiskboot | awk '{print $1}')"
            echo "MAGISKBOOT_HOST_ARCH=x86_64"
          } | tee w36/evidence/tooling-status.txt

      - name: Fetch pinned Lineage avbtool
        if: env.W36_SOURCE_READY == 'YES'
        shell: bash
        run: |
          set -euo pipefail

          git clone --filter=blob:none --no-checkout \
            "$AVB_REPO" w36/avb/repo >/dev/null 2>&1
          git -C w36/avb/repo checkout --detach "$AVB_PIN" >/dev/null 2>&1

          test "$(git -C w36/avb/repo rev-parse HEAD)" = "$AVB_PIN"

          AVBTOOL="$(
            find w36/avb/repo -maxdepth 2 -type f \
              \( -name avbtool -o -name avbtool.py \) \
              -print \
              | head -n1
          )"

          test -n "$AVBTOOL"
          test -s "$AVBTOOL"

          echo "$AVBTOOL" > w36/evidence/avbtool.path

          {
            echo "AVBTOOL_FETCH=PASS"
            echo "AVB_PIN=$AVB_PIN"
            echo "AVBTOOL_PATH=$AVBTOOL"
            echo "AVBTOOL_SHA256=$(sha256sum "$AVBTOOL" | awk '{print $1}')"
          } | tee w36/evidence/avbtool-status.txt

      - name: Unpack selected real boot with host Magiskboot
        if: env.W36_SOURCE_READY == 'YES'
        shell: bash
        run: |
          set -euo pipefail

          MB="$GITHUB_WORKSPACE/w36/magisk/magiskboot"
          BOOT="$GITHUB_WORKSPACE/w36/real/selected-veux-boot.img"

          mkdir -p w36/verify/source
          cd w36/verify/source

          set +e
          "$MB" unpack -h "$BOOT" \
            > "$GITHUB_WORKSPACE/w36/evidence/source-magiskboot-unpack.txt" \
            2>&1
          RC=$?
          set -e

          test "$RC" -eq 0
          test -s kernel
          test -s ramdisk.cpio

          sha256sum kernel \
            > "$GITHUB_WORKSPACE/w36/evidence/source-kernel.sha256"
          sha256sum ramdisk.cpio \
            > "$GITHUB_WORKSPACE/w36/evidence/source-ramdisk.sha256"

          strings kernel \
            | grep -m1 -E '^Linux version ' \
            > "$GITHUB_WORKSPACE/w36/evidence/source-kernel-version.txt" || true

          EXTRA_DTB=NO
          for f in dtb kernel_dtb extra recovery_dtbo; do
            if [ -s "$f" ]; then
              echo "$f" >> "$GITHUB_WORKSPACE/w36/evidence/source-boot-extra-fdt-files.txt"
              EXTRA_DTB=YES
            fi
          done

          {
            echo "REAL_BOOT_MAGISKBOOT_UNPACK=PASS"
            echo "SOURCE_KERNEL_SHA256=$(sha256sum kernel | awk '{print $1}')"
            echo "SOURCE_RAMDISK_SHA256=$(sha256sum ramdisk.cpio | awk '{print $1}')"
            echo "BOOT_CONTAINS_EXTRA_DTB_PAYLOAD=$EXTRA_DTB"
          } | tee "$GITHUB_WORKSPACE/w36/evidence/source-unpack-status.txt"

          if [ "$EXTRA_DTB" = YES ]; then
            echo "ERROR: real Lineage boot contains an extra DTB payload; W35 boot-only policy must be re-audited"
            exit 1
          fi

      - name: Run direct real Magiskboot kernel only repack control
        if: env.W36_SOURCE_READY == 'YES'
        shell: bash
        run: |
          set -euo pipefail

          MB="$GITHUB_WORKSPACE/w36/magisk/magiskboot"
          BOOT="$GITHUB_WORKSPACE/w36/real/selected-veux-boot.img"
          IMAGE="$GITHUB_WORKSPACE/w36/w33/GEN2_33_Image"

          rm -rf w36/direct/work
          mkdir -p w36/direct/work
          cd w36/direct/work

          "$MB" unpack -h "$BOOT" \
            > "$GITHUB_WORKSPACE/w36/evidence/direct-unpack.txt" 2>&1

          test -s kernel
          test -s ramdisk.cpio

          SOURCE_RAMDISK_SHA="$(
            sha256sum ramdisk.cpio | awk '{print $1}'
          )"

          cp "$IMAGE" kernel

          export PATCHVBMETAFLAG=false
          "$MB" repack "$BOOT" direct-repacked.img \
            > "$GITHUB_WORKSPACE/w36/evidence/direct-repack.txt" 2>&1
          unset PATCHVBMETAFLAG

          test -s direct-repacked.img
          test "$(stat -c '%s' direct-repacked.img)" -le "$BOOT_PARTITION_SIZE"

          mkdir verify
          cd verify
          "$MB" unpack -h ../direct-repacked.img \
            > "$GITHUB_WORKSPACE/w36/evidence/direct-repacked-unpack.txt" 2>&1

          test -s kernel
          test -s ramdisk.cpio
          test "$(sha256sum kernel | awk '{print $1}')" = "$W33_IMAGE_SHA256"
          test "$(sha256sum ramdisk.cpio | awk '{print $1}')" = "$SOURCE_RAMDISK_SHA"

          {
            echo "DIRECT_MAGISKBOOT_REAL_REPACK=PASS"
            echo "DIRECT_REPACKED_SHA256=$(sha256sum ../direct-repacked.img | awk '{print $1}')"
            echo "DIRECT_REPACKED_SIZE=$(stat -c '%s' ../direct-repacked.img)"
            echo "DIRECT_KERNEL_SHA256=$(sha256sum kernel | awk '{print $1}')"
            echo "DIRECT_RAMDISK_SHA256=$(sha256sum ramdisk.cpio | awk '{print $1}')"
            echo "DIRECT_RAMDISK_LOGICAL_BYTES_PRESERVED=YES"
            echo "PATCHVBMETAFLAG=false"
          } | tee "$GITHUB_WORKSPACE/w36/evidence/direct-repack-status.txt"

      - name: Prepare old style fake A/B boot partition AnyKernel3 sandbox
        if: env.W36_SOURCE_READY == 'YES'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf w36/ak3-run
          cp -a w36/ak3/repo w36/ak3-run

          cp w36/w33/GEN2_33_Image w36/ak3-run/Image
          cp w36/magisk/magiskboot w36/ak3-run/tools/magiskboot
          chmod +x w36/ak3-run/tools/magiskboot

          cp \
            w36/real/selected-veux-boot.img \
            w36/ak3-run/real-source-boot.img

          truncate -s "$BOOT_PARTITION_SIZE" \
            w36/ak3-run/sandbox-boot-partition.img

          dd \
            if=w36/ak3-run/real-source-boot.img \
            of=w36/ak3-run/sandbox-boot-partition.img \
            bs=1048576 \
            conv=notrunc \
            status=none

          mkdir -p w36/ak3-run/hostwrap

          cat > w36/ak3-run/hostwrap/blockdev <<'EOF'
          #!/usr/bin/env bash
          # W36 host sandbox: ak3-core calls blockdev --setrw before writing.
          # The resolved /dev/block/by-name/boot_a is a symlink to an ordinary
          # workspace file, so no block-device operation is required.
          case "${1:-}" in
            --setrw) exit 0 ;;
            --getro) echo 0; exit 0 ;;
            *) exit 0 ;;
          esac
          EOF
          sed -i 's/^          //' w36/ak3-run/hostwrap/blockdev
          chmod +x w36/ak3-run/hostwrap/blockdev

          cat > w36/ak3-run/hostwrap/getprop <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            ro.boot.slot_suffix)
              printf '%s\n' '_a'
              ;;
            ro.boot.slot)
              printf '%s\n' 'a'
              ;;
            *)
              exit 0
              ;;
          esac
          EOF
          sed -i 's/^          //' w36/ak3-run/hostwrap/getprop
          chmod +x w36/ak3-run/hostwrap/getprop

          FAKE_BOOT_LINK='/dev/block/by-name/boot_a'

          if sudo test -e "$FAKE_BOOT_LINK" || sudo test -L "$FAKE_BOOT_LINK"; then
            echo "ERROR: refusing to replace an existing $FAKE_BOOT_LINK"
            exit 1
          fi

          sudo mkdir -p /dev/block/by-name
          sudo ln -s \
            "$GITHUB_WORKSPACE/w36/ak3-run/sandbox-boot-partition.img" \
            "$FAKE_BOOT_LINK"

          test -L "$FAKE_BOOT_LINK"
          test "$(readlink -f "$FAKE_BOOT_LINK")" = \
            "$GITHUB_WORKSPACE/w36/ak3-run/sandbox-boot-partition.img"

          sha256sum \
            w36/ak3-run/real-source-boot.img \
            w36/ak3-run/sandbox-boot-partition.img \
            > w36/evidence/ak3-sandbox-before.sha256

          {
            echo "AK3_SANDBOX_PREPARE=PASS"
            echo "HARNESS_MODEL=OLD_WORKFLOW21R_FAKE_DEV_BLOCK_BY_NAME"
            echo "FAKE_ACTIVE_SLOT=_a"
            echo "AK3_BLOCK_SELECTOR=boot"
            echo "AK3_IS_SLOT_DEVICE=1"
            echo "AK3_SLOT_SELECT=active"
            echo "FAKE_BLOCK_PATH=$FAKE_BOOT_LINK"
            echo "FAKE_BLOCK_RESOLVES_TO=$(readlink -f "$FAKE_BOOT_LINK")"
            echo "BLOCK_TARGET_TYPE=REGULAR_FILE_VIA_SYMLINK"
            echo "BLOCK_TARGET_SIZE=$(stat -c '%s' w36/ak3-run/sandbox-boot-partition.img)"
            echo "REAL_DEVICE_BLOCK_TARGET=NO"
            echo "HOST_BLOCKDEV_WRAPPER=NO_OP_SUCCESS"
            echo "HOST_GETPROP_SLOT_SUFFIX=_a"
            echo "CUSTOMDD_POLICY=FIXED_128_MIB_REGULAR_FILE"
            echo "AK3_CORE_NOUNSET=DISABLED_FOR_UPSTREAM_SHELL_COMPATIBILITY"
          } | tee w36/evidence/ak3-sandbox-status.txt

      - name: Execute real AnyKernel3 split boot and flash boot against fake active slot
        if: env.W36_SOURCE_READY == 'YES'
        shell: bash
        run: |
          set -euo pipefail

          cleanup_fake_block() {
            sudo rm -f /dev/block/by-name/boot_a 2>/dev/null || true
            sudo rmdir /dev/block/by-name 2>/dev/null || true
            sudo rmdir /dev/block 2>/dev/null || true
          }
          trap cleanup_fake_block EXIT

          test -L /dev/block/by-name/boot_a
          test "$(readlink -f /dev/block/by-name/boot_a)" = \
            "$GITHUB_WORKSPACE/w36/ak3-run/sandbox-boot-partition.img"

          cat > w36/ak3-run/run-w36-host-sandbox.sh <<'EOF'
          #!/usr/bin/env bash
          #
          # Deliberately DO NOT enable `set -u` here.
          # AnyKernel3 ak3-core.sh is written for Android/BusyBox shell semantics
          # and references unset variables as empty strings during setup_ak.
          set -o pipefail

          cd "$(dirname "$0")" || exit 1

          export OUTFD=1
          export AKHOME="$PWD"
          export PATH="$PWD/hostwrap:$PWD/tools:$PATH"

          BLOCK=boot
          CUSTOMDD="bs=1048576 count=128 conv=notrunc status=none"
          IS_SLOT_DEVICE=1
          SLOT_SELECT=active
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=0
          NO_MAGISK_CHECK=1

          # setup_ak runs automatically at the end of ak3-core.sh.
          # Fake getprop returns slot _a and /dev/block/by-name/boot_a points
          # only to the ordinary W36 sandbox file.
          . tools/ak3-core.sh
          source_rc=$?
          echo "W36_AK3_SOURCE_RC=$source_rc"
          [ "$source_rc" -eq 0 ] || exit "$source_rc"

          echo "W36_AK3_RESOLVED_SLOT=${SLOT:-UNSET}"
          echo "W36_AK3_RESOLVED_BLOCK=${BLOCK:-UNSET}"

          [ "${SLOT:-}" = "_a" ] || {
            echo "ERROR: AnyKernel3 did not resolve fake active slot _a"
            exit 91
          }

          [ "${BLOCK:-}" = "/dev/block/by-name/boot_a" ] || {
            echo "ERROR: AnyKernel3 did not resolve fake boot_a path"
            exit 92
          }

          split_boot
          split_rc=$?
          echo "W36_AK3_SPLIT_BOOT_RC=$split_rc"
          [ "$split_rc" -eq 0 ] || exit "$split_rc"

          test -s "$SPLITIMG/kernel"
          test -s "$SPLITIMG/ramdisk.cpio"

          sha256sum "$SPLITIMG/kernel" > source-split-kernel.sha256
          sha256sum "$SPLITIMG/ramdisk.cpio" > source-split-ramdisk.sha256

          flash_boot
          flash_rc=$?
          echo "W36_AK3_FLASH_BOOT_RC=$flash_rc"

          [ "$flash_rc" -eq 0 ] || exit "$flash_rc"
          test -s boot-new.img
          test -s sandbox-boot-partition.img
          EOF

          sed -i 's/^          //' w36/ak3-run/run-w36-host-sandbox.sh
          chmod +x w36/ak3-run/run-w36-host-sandbox.sh
          bash -n w36/ak3-run/run-w36-host-sandbox.sh

          set +e
          bash w36/ak3-run/run-w36-host-sandbox.sh \
            > w36/evidence/ak3-execution.log 2>&1
          AK3_RC=$?
          set -e

          tail -n 300 w36/evidence/ak3-execution.log \
            > w36/evidence/ak3-execution-tail.txt

          test "$AK3_RC" -eq 0
          test -s w36/ak3-run/boot-new.img
          test -s w36/ak3-run/sandbox-boot-partition.img

          test "$(stat -c '%s' w36/ak3-run/boot-new.img)" \
            -le "$BOOT_PARTITION_SIZE"
          test "$(stat -c '%s' w36/ak3-run/sandbox-boot-partition.img)" \
            -eq "$BOOT_PARTITION_SIZE"

          grep -q '^W36_AK3_SOURCE_RC=0$' \
            w36/evidence/ak3-execution.log
          grep -q '^W36_AK3_RESOLVED_SLOT=_a$' \
            w36/evidence/ak3-execution.log
          grep -q '^W36_AK3_RESOLVED_BLOCK=/dev/block/by-name/boot_a$' \
            w36/evidence/ak3-execution.log
          grep -q '^W36_AK3_SPLIT_BOOT_RC=0$' \
            w36/evidence/ak3-execution.log
          grep -q '^W36_AK3_FLASH_BOOT_RC=0$' \
            w36/evidence/ak3-execution.log

          {
            echo "REAL_ANYKERNEL3_HOST_SANDBOX_EXECUTION=PASS"
            echo "AK3_EXIT_CODE=$AK3_RC"
            echo "AK3_UPSTREAM_CORE_MODIFIED=NO"
            echo "AK3_CORE_NOUNSET=DISABLED"
            echo "AK3_FAKE_SLOT=_a"
            echo "AK3_RESOLVED_BLOCK=/dev/block/by-name/boot_a"
            echo "AK3_SPLIT_BOOT_EXECUTED=YES"
            echo "AK3_FLASH_BOOT_EXECUTED=YES"
            echo "TARGET_WAS_REGULAR_FILE_VIA_FAKE_DEV_SYMLINK=YES"
            echo "REAL_DEVICE_WRITE=NO"
            echo "AK3_BOOT_NEW_SHA256=$(sha256sum w36/ak3-run/boot-new.img | awk '{print $1}')"
            echo "AK3_BOOT_NEW_SIZE=$(stat -c '%s' w36/ak3-run/boot-new.img)"
            echo "SANDBOX_PARTITION_SHA256=$(sha256sum w36/ak3-run/sandbox-boot-partition.img | awk '{print $1}')"
          } | tee w36/evidence/ak3-execution-status.txt

      - name: Verify AnyKernel3 real repack payload invariants
        if: env.W36_SOURCE_READY == 'YES'
        shell: bash
        run: |
          set -euo pipefail

          MB="$GITHUB_WORKSPACE/w36/magisk/magiskboot"
          SOURCE_BOOT="$GITHUB_WORKSPACE/w36/real/selected-veux-boot.img"
          AK3_BOOT="$GITHUB_WORKSPACE/w36/ak3-run/boot-new.img"

          rm -rf w36/verify/source-final w36/verify/ak3-final
          mkdir -p w36/verify/source-final w36/verify/ak3-final

          (
            cd w36/verify/source-final
            "$MB" unpack -h "$SOURCE_BOOT" \
              > "$GITHUB_WORKSPACE/w36/evidence/source-final-unpack.txt" 2>&1
          )

          (
            cd w36/verify/ak3-final
            "$MB" unpack -h "$AK3_BOOT" \
              > "$GITHUB_WORKSPACE/w36/evidence/ak3-final-unpack.txt" 2>&1
          )

          test -s w36/verify/source-final/kernel
          test -s w36/verify/source-final/ramdisk.cpio
          test -s w36/verify/ak3-final/kernel
          test -s w36/verify/ak3-final/ramdisk.cpio

          SOURCE_RAMDISK_SHA="$(
            sha256sum w36/verify/source-final/ramdisk.cpio | awk '{print $1}'
          )"
          AK3_RAMDISK_SHA="$(
            sha256sum w36/verify/ak3-final/ramdisk.cpio | awk '{print $1}'
          )"
          AK3_KERNEL_SHA="$(
            sha256sum w36/verify/ak3-final/kernel | awk '{print $1}'
          )"

          test "$SOURCE_RAMDISK_SHA" = "$AK3_RAMDISK_SHA"
          test "$AK3_KERNEL_SHA" = "$W33_IMAGE_SHA256"

          for f in dtb kernel_dtb extra recovery_dtbo; do
            if [ -s "w36/verify/ak3-final/$f" ]; then
              echo "ERROR: AnyKernel3 repack unexpectedly contains $f"
              exit 1
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct

          src = Path("w36/real/selected-veux-boot.img").read_bytes()
          new = Path("w36/ak3-run/boot-new.img").read_bytes()

          def parse(data):
              if data[:8] != b"ANDROID!":
                  raise RuntimeError("ANDROID! magic missing")
              if len(data) < 1580:
                  raise RuntimeError("image too small for boot v3 header")
              vals = struct.unpack("<8s9I1536s", data[:1580])
              return {
                  "magic": vals[0],
                  "kernel_size": vals[1],
                  "ramdisk_size": vals[2],
                  "os_version": vals[3],
                  "header_size": vals[4],
                  "reserved": vals[5:9],
                  "header_version": vals[9],
                  "cmdline": vals[10],
              }

          a = parse(src)
          b = parse(new)

          immutable = (
              "magic",
              "os_version",
              "header_size",
              "reserved",
              "header_version",
              "cmdline",
          )

          for key in immutable:
              if a[key] != b[key]:
                  raise RuntimeError(f"boot header invariant changed: {key}")

          if a["header_version"] != 3:
              raise RuntimeError("source is not boot header v3")

          report = [
              "REAL_BOOT_HEADER_INVARIANTS=PASS",
              "BOOT_MAGIC_PRESERVED=YES",
              "BOOT_HEADER_VERSION_PRESERVED=YES",
              "BOOT_HEADER_SIZE_PRESERVED=YES",
              "BOOT_OS_VERSION_FIELD_PRESERVED=YES",
              "BOOT_RESERVED_FIELDS_PRESERVED=YES",
              "BOOT_CMDLINE_PRESERVED=YES",
              f"SOURCE_KERNEL_SIZE={a['kernel_size']}",
              f"AK3_KERNEL_SIZE={b['kernel_size']}",
              f"SOURCE_RAMDISK_SIZE_FIELD={a['ramdisk_size']}",
              f"AK3_RAMDISK_SIZE_FIELD={b['ramdisk_size']}",
          ]

          Path("w36/evidence/boot-header-invariants.txt").write_text(
              "\n".join(report) + "\n",
              encoding="utf-8",
          )
          PY

          {
            echo "AK3_REAL_REPACK_PAYLOAD_INVARIANTS=PASS"
            echo "W33_IMAGE_SHA256_MATCH=YES"
            echo "SOURCE_RAMDISK_SHA256=$SOURCE_RAMDISK_SHA"
            echo "AK3_RAMDISK_SHA256=$AK3_RAMDISK_SHA"
            echo "RAMDISK_LOGICAL_BYTES_PRESERVED=YES"
            echo "BOOT_EXTRA_DTB_ADDED=NO"
            echo "VENDOR_BOOT_TOUCHED=NO"
            echo "DTBO_TOUCHED=NO"
          } | tee w36/evidence/ak3-payload-invariants.txt

      - name: Compare AVB metadata before and after AnyKernel3 repack
        if: env.W36_SOURCE_READY == 'YES'
        shell: bash
        run: |
          set -euo pipefail

          AVBTOOL="$(cat w36/evidence/avbtool.path)"
          SOURCE='w36/real/selected-veux-boot.img'
          REPACKED='w36/ak3-run/boot-new.img'

          set +e
          python3 "$AVBTOOL" info_image --image "$SOURCE" \
            > w36/evidence/source-avb-info.txt 2>&1
          SRC_RC=$?

          python3 "$AVBTOOL" info_image --image "$REPACKED" \
            > w36/evidence/repacked-avb-info.txt 2>&1
          NEW_RC=$?
          set -e

          if [ "$SRC_RC" -eq 0 ]; then
            SOURCE_AVB=YES
          else
            SOURCE_AVB=NO
          fi

          if [ "$NEW_RC" -eq 0 ]; then
            REPACKED_AVB=YES
          else
            REPACKED_AVB=NO
          fi

          if [ "$SOURCE_AVB" != "$REPACKED_AVB" ]; then
            echo "ERROR: AVB footer/info presence changed across repack"
            exit 1
          fi

          FLAGS_MATCH=NOT_APPLICABLE
          if [ "$SOURCE_AVB" = YES ]; then
            SRC_FLAGS="$(
              grep -E '^Flags:' w36/evidence/source-avb-info.txt \
                | head -n1 \
                | sed 's/[[:space:]]//g'
            )"
            NEW_FLAGS="$(
              grep -E '^Flags:' w36/evidence/repacked-avb-info.txt \
                | head -n1 \
                | sed 's/[[:space:]]//g'
            )"

            test -n "$SRC_FLAGS"
            test -n "$NEW_FLAGS"
            test "$SRC_FLAGS" = "$NEW_FLAGS"
            FLAGS_MATCH=YES
          fi

          {
            echo "AVB_METADATA_AUDIT=PASS"
            echo "SOURCE_AVB_INFO_PRESENT=$SOURCE_AVB"
            echo "REPACKED_AVB_INFO_PRESENT=$REPACKED_AVB"
            echo "AVB_FLAGS_PRESERVED=$FLAGS_MATCH"
            echo "AVB_SIGNATURE_VALIDITY_AFTER_KERNEL_REPLACEMENT=NOT_CLAIMED"
            echo "PATCH_VBMETA_FLAG_POLICY=0"
          } | tee w36/evidence/avb-audit-status.txt

      - name: Compare direct and AnyKernel3 Magiskboot repack results
        if: env.W36_SOURCE_READY == 'YES'
        shell: bash
        run: |
          set -euo pipefail

          DIRECT='w36/direct/work/direct-repacked.img'
          AK3='w36/ak3-run/boot-new.img'

          test -s "$DIRECT"
          test -s "$AK3"

          DIRECT_SHA="$(sha256sum "$DIRECT" | awk '{print $1}')"
          AK3_SHA="$(sha256sum "$AK3" | awk '{print $1}')"

          if cmp -s "$DIRECT" "$AK3"; then
            BYTE_IDENTICAL=YES
          else
            BYTE_IDENTICAL=NO
          fi

          {
            echo "DIRECT_VS_AK3_REPACK_COMPARISON=PASS"
            echo "DIRECT_SHA256=$DIRECT_SHA"
            echo "AK3_SHA256=$AK3_SHA"
            echo "BYTE_IDENTICAL=$BYTE_IDENTICAL"
            echo "BYTE_IDENTITY_REQUIRED=NO"
            echo "SEMANTIC_PAYLOAD_INVARIANTS_REQUIRED=YES"
          } | tee w36/evidence/direct-vs-ak3-status.txt

      - name: Derive W36 real boot validation verdict
        if: env.W36_SOURCE_READY == 'YES'
        shell: bash
        run: |
          set -euo pipefail

          grep -q '^W36_PREREQUISITES=PASS$' \
            w36/evidence/prerequisite-status.txt
          grep -q '^LINEAGE_DEVICE_CONTRACT=PASS$' \
            w36/evidence/lineage-contract-status.txt
          grep -q '^REAL_BOOT_SOURCE_SELECTION=PASS$' \
            w36/evidence/real-boot-source-selection.txt
          grep -q '^AK3_AND_MAGISKBOOT_FETCH=PASS$' \
            w36/evidence/tooling-status.txt
          grep -q '^REAL_BOOT_MAGISKBOOT_UNPACK=PASS$' \
            w36/evidence/source-unpack-status.txt
          grep -q '^DIRECT_MAGISKBOOT_REAL_REPACK=PASS$' \
            w36/evidence/direct-repack-status.txt
          grep -q '^AK3_SANDBOX_PREPARE=PASS$' \
            w36/evidence/ak3-sandbox-status.txt
          grep -q '^REAL_ANYKERNEL3_HOST_SANDBOX_EXECUTION=PASS$' \
            w36/evidence/ak3-execution-status.txt
          grep -q '^REAL_BOOT_HEADER_INVARIANTS=PASS$' \
            w36/evidence/boot-header-invariants.txt
          grep -q '^AK3_REAL_REPACK_PAYLOAD_INVARIANTS=PASS$' \
            w36/evidence/ak3-payload-invariants.txt
          grep -q '^AVB_METADATA_AUDIT=PASS$' \
            w36/evidence/avb-audit-status.txt

          EXACT_LINEAGE_23_2_PROVENANCE="$(
            sed -n 's/^EXACT_LINEAGE_23_2_PROVENANCE=//p' \
              w36/evidence/real-boot-source-selection.txt | tail -n1
          )"
          VALIDATED_BOOT_SHA_MATCH="$(
            sed -n 's/^VALIDATED_BOOT_SHA_MATCH=//p' \
              w36/evidence/real-boot-source-selection.txt | tail -n1
          )"

          if [ "$EXACT_LINEAGE_23_2_PROVENANCE" = YES ]; then
            FINAL_RESULT='PASS_GEN2_36_V12_REAL_LINEAGE_23_2_BOOT_ANYKERNEL3_MAGISKBOOT_VALIDATION'
            LINEAGE_23_2_VERDICT='PASS_OFFICIAL_API_PROVENANCE'
          else
            test "$VALIDATED_BOOT_SHA_MATCH" = YES
            FINAL_RESULT='PASS_GEN2_36_V12_VALIDATED_LINEAGE_ANDROID16_VEUX_BOOT_AK3_MAGISKBOOT_VALIDATION'
            LINEAGE_23_2_VERDICT='COMPATIBILITY_STRONGLY_SUPPORTED_EXACT_23_2_RELEASE_PROVENANCE_NOT_CLAIMED'
          fi

          {
            echo "FINAL_RESULT=$FINAL_RESULT"
            echo "W36_REAL_BOOT_AK3_MAGISKBOOT_VALIDATION=PASS"
            echo "LINEAGE_23_2_VERDICT=$LINEAGE_23_2_VERDICT"
            echo "EXACT_LINEAGE_23_2_PROVENANCE=$EXACT_LINEAGE_23_2_PROVENANCE"
            echo "VALIDATED_BOOT_SHA_MATCH=$VALIDATED_BOOT_SHA_MATCH"
            echo "REAL_BOOT_SOURCE_PROVENANCE_FILE=w36/evidence/real-boot-source-selection.txt"
            echo "REAL_MAGISKBOOT_UNPACK_REPACK=PASS"
            echo "REAL_ANYKERNEL3_SPLIT_BOOT_FLASH_BOOT=PASS"
            echo "AK3_TARGET_TYPE=REGULAR_FILE_SANDBOX"
            echo "W33_KERNEL_INSERTED_EXACTLY=YES"
            echo "RAMDISK_LOGICAL_BYTES_PRESERVED=YES"
            echo "BOOT_HEADER_METADATA_PRESERVED=YES"
            echo "VENDOR_BOOT_POLICY=PRESERVE"
            echo "DTBO_POLICY=PRESERVE"
            echo "W33_CUSTOM_DTB_FLASH_POLICY=NO"
            echo "W33_CUSTOM_DTBO_FLASH_POLICY=NO"
            echo "REAL_DEVICE_WRITE=NO"
            echo "FLASHABLE_RELEASE_READY=NO"
            echo "RUNTIME_DEVICE_BOOT_TEST_REQUIRED=YES"
            echo "NEXT_STEP=WORKFLOW37_NONFLASHING_AK3_RELEASE_CANDIDATE_ARCHIVE_AND_DEVICE_TEST_PLAN"
          } | tee w36/evidence/w36-verdict.txt

      - name: Write final W36 audit report
        if: env.W36_SOURCE_READY == 'YES'
        shell: bash
        run: |
          set -euo pipefail

          REPORT='GEN2_36_V12_REAL_LINEAGE_BOOT_AK3_MAGISKBOOT_VALIDATION_AUDIT.txt'

          {
            cat w36/evidence/audit-header.txt
            echo
            echo "=== PREREQUISITES ==="
            cat w36/evidence/input-artifact-status.txt
            cat w36/evidence/prerequisite-status.txt
            echo
            echo "=== LINEAGE CONTRACT ==="
            cat w36/evidence/lineage-contract-status.txt
            echo
            echo "=== REAL BOOT SOURCE ==="
            cat w36/evidence/source-discovery-status.txt 2>/dev/null || true
            cat w36/evidence/input-artifact-metadata.json 2>/dev/null || true
            cat w36/evidence/real-boot-source-selection.txt
            echo
            echo "=== TOOLING ==="
            cat w36/evidence/tooling-status.txt
            cat w36/evidence/avbtool-status.txt
            echo
            echo "=== SOURCE UNPACK ==="
            cat w36/evidence/source-unpack-status.txt
            cat w36/evidence/source-kernel-version.txt 2>/dev/null || true
            echo
            echo "=== DIRECT MAGISKBOOT CONTROL ==="
            cat w36/evidence/direct-repack-status.txt
            echo
            echo "=== ANYKERNEL3 SANDBOX ==="
            cat w36/evidence/ak3-sandbox-status.txt
            cat w36/evidence/ak3-execution-status.txt
            echo
            echo "=== PAYLOAD INVARIANTS ==="
            cat w36/evidence/boot-header-invariants.txt
            cat w36/evidence/ak3-payload-invariants.txt
            echo
            echo "=== AVB ==="
