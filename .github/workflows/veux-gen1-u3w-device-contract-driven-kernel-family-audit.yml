          ))

          a = sum(r["classification"]=="A_DIRECT_VEUX_5_4_LE302" for r in rows)
          gt = sum(r["classification"]=="B_DIRECT_VEUX_5_4_GT302" for r in rows)
          new = sum(r["classification"]=="C_DIRECT_VEUX_NEW_KERNEL_FAMILY" for r in rows)
          d61 = sum(
              r["classification"]=="C_DIRECT_VEUX_NEW_KERNEL_FAMILY"
              and r["kernel_version"].startswith("6.1.")
              for r in rows
          )

          classic = sum(r["config_family"]=="veux_defconfig" for r in dev)
          vendor = sum(r["config_family"]=="vendor_veux_qgki_defconfig" for r in dev)
          smsrc = sum(r["source_family"]=="sm6375" for r in dev)
          vxsrc = sum(r["source_family"]=="veux" for r in dev)

          gt_result = (
              "NO_PUBLIC_DIRECT_VEUX_5_4_GT302_FOUND"
              if gt == 0 else "PUBLIC_DIRECT_VEUX_GT302_FOUND_REVIEW_REQUIRED"
          )
          new_result = (
              "DIRECT_VEUX_6_1_FOUND_SEPARATE_FAMILY"
              if d61 else "NO_DIRECT_VEUX_6_1_FOUND"
          )

          result = (
              "U3W_DEVICE_CONTRACT_DRIVEN_KERNEL_FAMILY_AUDIT=PASS\n"
              f"DIRECT_VEUX_5_4_LE302_BRANCHES={a}\n"
              f"DIRECT_VEUX_5_4_GT302_BRANCHES={gt}\n"
              f"DIRECT_VEUX_NEW_FAMILY_BRANCHES={new}\n"
              f"DIRECT_VEUX_6_1_BRANCHES={d61}\n"
              f"DEVICE_TREES_CLASSIC_VEUX_DEFCONFIG={classic}\n"
              f"DEVICE_TREES_VENDOR_VEUX_QGKI_DEFCONFIG={vendor}\n"
              f"DEVICE_TREES_SOURCE_SM6375={smsrc}\n"
              f"DEVICE_TREES_SOURCE_VEUX={vxsrc}\n"
              f"GT302_RESULT={gt_result}\n"
              f"NEW_FAMILY_RESULT={new_result}\n"
              "P13_UNIVERSAL_SOURCE_SCOPE=DIRECT_VEUX_LINUX_5_4_THROUGH_5_4_302\n"
              "ANDROID_ROM_REGION_GATES=NONE\n"
              "DEVICE_PASS=NO\n"
              "KERNEL_CHANGE_JUSTIFIED=NO\n"
          )
          (audit/"15-U3W-RESULT.txt").write_text(result)

          report = [
              "# VEUX GEN1 U3W — Device-Contract Driven Kernel Family Audit",
              "",
              "## Result",
              "",
              "**U3W_DEVICE_CONTRACT_DRIVEN_KERNEL_FAMILY_AUDIT=PASS**",
              "",
              f"- Direct VEUX Linux 5.4 <=302 branches: **{a}**",
              f"- Direct VEUX Linux 5.4 >302 branches: **{gt}**",
              f"- Direct VEUX new-family branches: **{new}**",
              f"- Direct VEUX Linux 6.1 branches: **{d61}**",
              f"- Device trees using `veux_defconfig`: **{classic}**",
              f"- Device trees using `vendor/veux-qgki_defconfig`: **{vendor}**",
              f"- Device trees using `kernel/xiaomi/sm6375`: **{smsrc}**",
              f"- Device trees using `kernel/xiaomi/veux`: **{vxsrc}**",
              "",
              f"- >302 result: **{gt_result}**",
              f"- new-family result: **{new_result}**",
              "",
              "Frozen P13 universal source scope:",
              "**direct VEUX Linux-5.4 family through 5.4.302**.",
              "",
              "Android version, ROM name and firmware region are not source-family gates.",
              "",
              "This remains source/statistical evidence only, not DEVICE PASS.",
          ]
          (audit/"15-U3W-REPORT.md").write_text("\n".join(report)+"\n")
          print(result)
          PY

          cat "$AUDIT_DIR/15-U3W-REPORT.md"

      - name: Assert U3W interpretation and safety gates
        shell: bash
        run: |
          set -euo pipefail

          grep -Fxq 'U3W_DEVICE_CONTRACT_DRIVEN_KERNEL_FAMILY_AUDIT=PASS' \
            "$AUDIT_DIR/15-U3W-RESULT.txt"
          grep -Fxq \
            'P13_UNIVERSAL_SOURCE_SCOPE=DIRECT_VEUX_LINUX_5_4_THROUGH_5_4_302' \
            "$AUDIT_DIR/15-U3W-RESULT.txt"
          grep -Fxq 'ANDROID_ROM_REGION_GATES=NONE' \
            "$AUDIT_DIR/15-U3W-RESULT.txt"
          grep -Fxq 'DEVICE_PASS=NO' "$AUDIT_DIR/15-U3W-RESULT.txt"
          grep -Fxq 'KERNEL_CHANGE_JUSTIFIED=NO' "$AUDIT_DIR/15-U3W-RESULT.txt"
          grep -Fxq 'SOURCE_FAMILY_DISCOVERY=PASS' \
            "$AUDIT_DIR/13-correlation-summary.txt"

          {
            echo "U3W_GITHUB_MODE=READ_ONLY"
            echo "U3W_DEVICE_REQUIRED=NO"
            echo "U3W_FLASH_ACTIONS=NONE"
            echo "U3W_SAFETY_GATE=PASS"
          } | tee "$AUDIT_DIR/16-U3W-SAFETY.txt"

      - name: Build self-verifying U3W evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$AUDIT_DIR"
          find . -type f ! -name 'U3W-EVIDENCE-SHA256SUMS.txt' -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            > U3W-EVIDENCE-SHA256SUMS.txt
          sha256sum -c U3W-EVIDENCE-SHA256SUMS.txt

      - name: Upload U3W device-contract family evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-GEN1-U3W-device-contract-driven-kernel-family-audit
          path: u3w-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
