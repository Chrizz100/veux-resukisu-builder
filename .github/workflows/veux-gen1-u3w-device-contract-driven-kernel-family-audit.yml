        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          import csv, json, os, re, subprocess

          audit = Path(os.environ["AUDIT_DIR"])
          token = os.environ.get("GH_TOKEN", "")
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "VEUX-U3W-readonly-audit",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def api_json(url):
              req = Request(url, headers=headers)
              with urlopen(req, timeout=45) as r:
                  return json.loads(r.read().decode())

          def raw_bytes(full, sha, path):
              url = f"https://raw.githubusercontent.com/{full}/{sha}/{path}"
              try:
                  req = Request(url, headers={"User-Agent":"VEUX-U3W-readonly-audit"})
                  with urlopen(req, timeout=30) as r:
                      return r.read()
              except Exception:
                  return b""

          repos = {}
          raw_search = {}
          for query in ("kernel_xiaomi_sm6375 in:name", "kernel_xiaomi_veux in:name"):
              qpages = []
              for page in range(1, 4):
                  data = api_json(
                      "https://api.github.com/search/repositories?"
                      f"q={quote(query)}&per_page=100&page={page}"
                  )
                  qpages.append(data)
                  for item in data.get("items", []):
                      repos[item["full_name"]] = item
                  if len(data.get("items", [])) < 100:
                      break
              raw_search[query] = qpages

          (audit/"11-kernel-repository-search.json").write_text(
              json.dumps(raw_search, indent=2, sort_keys=True) + "\n"
          )

          rows = []
          for full in sorted(repos, key=str.lower):
              item = repos[full]
              if int(item.get("size") or 0) == 0:
                  continue
              default = item.get("default_branch") or ""

              cp = subprocess.run(
                  ["git","ls-remote","--heads",item["clone_url"]],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  timeout=90
              )
              if cp.returncode != 0:
                  continue

              heads = []
              for line in cp.stdout.splitlines():
                  if not line.strip():
                      continue
                  sha, ref = line.split("\t", 1)
                  branch = ref.removeprefix("refs/heads/")
                  heads.append((sha, branch))
              heads = sorted(heads, key=lambda x:(x[1] != default, x[1]))[:100]

              repo_name = item["name"].lower()
              repo_family = (
                  "sm6375_name" if "sm6375" in repo_name
                  else "veux_name" if "veux" in repo_name
                  else "other_name"
              )

              for sha, branch in heads:
                  mf = raw_bytes(full, sha, "Makefile").decode("utf-8","replace")
                  vals = {}
                  for key in ("VERSION","PATCHLEVEL","SUBLEVEL"):
                      m = re.search(rf"^{key}\s*=\s*([0-9]+)\s*$", mf, re.M)
                      vals[key] = int(m.group(1)) if m else None

                  if None in vals.values():
                      version = "UNKNOWN"
                      major = minor = sub = ""
                  else:
                      major = vals["VERSION"]
                      minor = vals["PATCHLEVEL"]
                      sub = vals["SUBLEVEL"]
                      version = f"{major}.{minor}.{sub}"

                  cfg_classic = bool(raw_bytes(
                      full, sha, "arch/arm64/configs/veux_defconfig"
                  ))
                  cfg_vendor = bool(raw_bytes(
                      full, sha, "arch/arm64/configs/vendor/veux-qgki_defconfig"
                  ))
                  cfg_direct = cfg_classic or cfg_vendor

                  if version == "UNKNOWN":
                      cls = "UNCLASSIFIED_NO_ROOT_VERSION"
                  elif cfg_direct and major == 5 and minor == 4 and sub <= 302:
                      cls = "A_DIRECT_VEUX_5_4_LE302"
                  elif cfg_direct and major == 5 and minor == 4 and sub > 302:
                      cls = "B_DIRECT_VEUX_5_4_GT302"
                  elif cfg_direct:
                      cls = "C_DIRECT_VEUX_NEW_KERNEL_FAMILY"
                  elif major == 5 and minor == 4:
                      cls = "UNBOUND_5_4_NO_DIRECT_VEUX_CONFIG"
                  else:
                      cls = "UNBOUND_NEW_FAMILY_NO_DIRECT_VEUX_CONFIG"

                  rows.append({
                      "repository": full,
                      "repo_family": repo_family,
                      "branch": branch,
                      "sha": sha,
                      "kernel_version": version,
                      "major": major,
                      "minor": minor,
                      "sublevel": sub,
                      "classic_veux_defconfig": int(cfg_classic),
                      "vendor_veux_qgki_defconfig": int(cfg_vendor),
                      "classification": cls,
                      "is_default": int(branch == default),
                  })

          fields = list(rows[0].keys()) if rows else []
          with (audit/"11-kernel-branches.tsv").open(
              "w", newline="", encoding="utf-8"
          ) as fh:
              w = csv.DictWriter(fh, fieldnames=fields, delimiter="\t")
              w.writeheader(); w.writerows(rows)

          summary = {}
          for r in rows:
              k = (r["kernel_version"], r["classification"])
              summary[k] = summary.get(k, 0) + 1
          with (audit/"12-kernel-summary.tsv").open(
              "w", newline="", encoding="utf-8"
          ) as fh:
              w = csv.writer(fh, delimiter="\t")
              w.writerow(["kernel_version","classification","branch_count"])
              for (ver, cls), n in sorted(summary.items()):
                  w.writerow([ver, cls, n])

          direct_gt302 = [r for r in rows if r["classification"]=="B_DIRECT_VEUX_5_4_GT302"]
          direct_new = [r for r in rows if r["classification"]=="C_DIRECT_VEUX_NEW_KERNEL_FAMILY"]
          direct_61 = [r for r in direct_new if str(r["kernel_version"]).startswith("6.1.")]

          with (audit/"12-boundary-summary.txt").open("w") as fh:
              fh.write(f"KERNEL_BRANCH_ROWS={len(rows)}\n")
              fh.write(
                  f"DIRECT_VEUX_5_4_LE302="
                  f"{sum(r['classification']=='A_DIRECT_VEUX_5_4_LE302' for r in rows)}\n"
              )
              fh.write(f"DIRECT_VEUX_5_4_GT302={len(direct_gt302)}\n")
              fh.write(f"DIRECT_VEUX_NEW_FAMILY={len(direct_new)}\n")
              fh.write(f"DIRECT_VEUX_6_1={len(direct_61)}\n")

          # Write exact >302 candidate set for automatic source comparison.
          with (audit/"12-direct-veux-gt302.tsv").open(
              "w", newline="", encoding="utf-8"
          ) as fh:
              w = csv.DictWriter(fh, fieldnames=fields, delimiter="\t")
              w.writeheader(); w.writerows(direct_gt302)

          print((audit/"12-boundary-summary.txt").read_text())
          PY

          cat "$AUDIT_DIR/12-kernel-summary.tsv"

