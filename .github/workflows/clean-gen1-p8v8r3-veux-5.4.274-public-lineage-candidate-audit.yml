name: CLEAN GEN1 P8 v8 r3 - VEUX 5.4.274 public lineage candidate audit

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: clean-gen1-p8v8r3-veux-5-4-274-public-lineage-candidate
  cancel-in-progress: false

env:
  TARGET_REGION_COUNT: '8'
  TARGET_REGION_IDS: china,global,india,indonesia,japan,russia,taiwan,turkey
  EEA_INCLUDED: 'NO'

  P8V8_R2_RUN_ID: '33722447606'
  P8V8_R2_ARTIFACT: clean-gen1-p8v8r2-veux-5.4.274-public-lineage-candidate-33722447606
  P8V8_R2_ARTIFACT_DIGEST: b8976216590025e41909a36b2f470bb41f1087bea73477442ff0cf557d48192e
  P8V8_R2_FAILURE: DISCOVERED_5_4_274_STATE_LACKS_VEUX_DEFCONFIG_HARD_FAIL
  P8V8_R2_DISCOVERED_STATE: fa50f7173c1227f423c254c4cd33b8807001cfa3

  P8V7_RUN_ID: '33721117592'
  P8V7_ARTIFACT: clean-gen1-p8v7-veux-5.4.274-qcom-conflict-provenance-33721117592
  P8V7_ARTIFACT_DIGEST: bb1207284e60817ab872f01f72cab984d7f2887e1e57b95199b76d9d97c72c5c

  VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
  LATER_PUBLIC_TAG: '20240819'
  LATER_PUBLIC_TAG_SHA: 494122af9e9875662d3113496b437652af466f7d
  LATER_PUBLIC_TAG_SUBLEVEL: '280'

  TARGET_SUBLEVEL: '274'
  MIN_COVERAGE_SUBLEVEL: '268'
  INITIAL_FETCH_DEPTH: '256'
  MAX_FETCH_DEPTH: '16384'

jobs:
  public-lineage-candidate:
    name: Exhaustively identify a first-parent VEUX 5.4.274 state or stop
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      WORK_DIR: ${{ github.workspace }}/p8v8r3
      REPO_DIR: ${{ github.workspace }}/p8v8r3/repo
      P8V8_R2_DIR: ${{ github.workspace }}/p8v8r3/p8v8r2
      P8V7_DIR: ${{ github.workspace }}/p8v8r3/p8v7
      EVIDENCE_DIR: ${{ github.workspace }}/p8v8r3/evidence

    steps:
      - name: Initialize same-stage r3 evidence audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR"
          mkdir -p \
            "$REPO_DIR" "$P8V8_R2_DIR" "$P8V7_DIR" "$EVIDENCE_DIR"

          cat > "$EVIDENCE_DIR/00-plan.txt" <<'EOF'
          CLEAN GEN1 P8-v8 r3 - exhaustive public first-parent 5.4.274 VEUX audit

          Retry discipline:
          - P8-v8 r2 run 33722447606 is GitHub RED.
          - Therefore no P8-v9 is authorized.
          - This is the same P8-v8 scientific question, retried as r3.

          P8-v8 r2 established before its hard failure:
          - parent P8-v7 authenticated;
          - first-parent history search completed;
          - history coverage reached SUBLEVEL 254;
          - candidate search found commit
            fa50f7173c1227f423c254c4cd33b8807001cfa3;
          - that commit is a first-parent state with SUBLEVEL 274;
          - candidate-authentication then failed because
            arch/arm64/configs/veux_defconfig does not exist there.

          The absence of VEUX defconfig is a scientific candidate rejection,
          not a mechanical reason to leave the whole P8-v8 job red.

          r3 therefore:
          1. authenticates both P8-v7 and the red r2 evidence;
          2. reconstructs the 20240819 first-parent history until <=5.4.268;
          3. examines EVERY first-parent commit whose tree reports SUBLEVEL 274;
          4. records whether each such state contains
             arch/arm64/configs/veux_defconfig;
          5. for every 5.4.274 + VEUX state, checks the four P8-v7 conflict
             files for presence and conflict markers;
          6. selects the newest qualifying state only if it already exists
             publicly and passes those identity checks without any edit;
          7. otherwise finishes GREEN with
             NO_PUBLIC_FIRST_PARENT_5_4_274_VEUX_CANDIDATE_STOP.

          Additional provenance:
          - the audit identifies the first first-parent commit where
            veux_defconfig appears in the 20240819 lineage and records the
            kernel SUBLEVEL at that point.

          Prohibited:
          - no conflict resolution;
          - no ours/theirs choice;
          - no source or defconfig patch;
          - no ReSukiSU/SUSFS restore;
          - no kernel build;
          - no CRC/vermagic patch;
          - no boot image;
          - no flashable ZIP;
          - no device access/flashing;
          - no compatibility claim;
          - no P9 authorization.

          Scientific rejection must be GREEN if this audit completes correctly.
          EOF

      - name: Download red P8-v8 r2 retry evidence
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.P8V8_R2_ARTIFACT }}
          path: ${{ env.P8V8_R2_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V8_R2_RUN_ID }}

      - name: Download green P8-v7 conflict provenance
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.P8V7_ARTIFACT }}
          path: ${{ env.P8V7_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V7_RUN_ID }}

      - name: Authenticate r2 failure evidence and P8-v7 parent
        shell: bash
        run: |
          set -euo pipefail

          for dir in "$P8V8_R2_DIR" "$P8V7_DIR"; do
            test -s "$dir/SHA256SUMS"
            (
              cd "$dir"
              sha256sum -c SHA256SUMS
            )
          done > "$EVIDENCE_DIR/01-parent-sha256.txt"

          grep -Fxq 'JOB_STATUS=failure' \
            "$P8V8_R2_DIR/99-job-end-state.txt"
          grep -Fxq 'P8V8_RETRY=R2' \
            "$P8V8_R2_DIR/99-job-end-state.txt"
          grep -Fxq 'P8V8_LINEAGE_SEARCH=PASS' \
            "$P8V8_R2_DIR/02-lineage-search.txt"
          grep -Fxq 'SEARCH_STATUS=CANDIDATE_FOUND' \
            "$P8V8_R2_DIR/02-lineage-search.txt"
          grep -Fxq \
            'CANDIDATE_COMMIT=fa50f7173c1227f423c254c4cd33b8807001cfa3' \
            "$P8V8_R2_DIR/02-lineage-search.txt"

          python3 - \
            "$P8V8_R2_DIR/02-lineage-scan.json" \
            "$EVIDENCE_DIR/01-r2-lineage-auth.txt" <<'PY'
          import json
          import sys
          from pathlib import Path

          source, output = map(Path, sys.argv[1:])
          data = json.loads(source.read_text(encoding="utf-8"))

          expected = "fa50f7173c1227f423c254c4cd33b8807001cfa3"
          if data.get("status") != "CANDIDATE_FOUND":
              raise SystemExit("r2 lineage status drift")
          if data.get("candidate_commit") != expected:
              raise SystemExit("r2 candidate drift")
          if data.get("candidate_on_first_parent") is not True:
              raise SystemExit("r2 candidate no longer first-parent")
          if data.get("oldest_fetched_sublevel") != 254:
              raise SystemExit("r2 history coverage drift")

          output.write_text(
              "\n".join([
                  "P8V8_R2_LINEAGE_EVIDENCE_AUTH=PASS",
                  f"R2_DISCOVERED_STATE={expected}",
                  "R2_DISCOVERED_STATE_ON_FIRST_PARENT=YES",
                  "R2_DISCOVERED_STATE_SUBLEVEL=274",
                  "R2_HISTORY_OLDEST_FETCHED_SUBLEVEL=254",
                  "R2_FINAL_SCIENTIFIC_RESULT=NOT_REACHED",
              ]) + "\n",
              encoding="utf-8",
          )
          PY

          grep -Fxq \
            'P8V7_RESULT=CONFLICT_PROVENANCE_COLLECTED_NO_RESOLUTION_AUTHORIZED' \
            "$P8V7_DIR/P8V7-RESULT.txt"
          grep -Fxq 'JOB_STATUS=success' \
            "$P8V7_DIR/99-job-end-state.txt"
          test -s "$P8V7_DIR/03-file-provenance.json"

          {
            echo "P8V8_R3_PARENT_AUTH=PASS"
            echo "P8V8_R2_RUN_ID=$P8V8_R2_RUN_ID"
            echo "P8V8_R2_ARTIFACT_DIGEST=$P8V8_R2_ARTIFACT_DIGEST"
            echo "P8V8_R2_REQUIRED_STATUS=FAILURE"
            echo "P8V8_R2_FAILURE=$P8V8_R2_FAILURE"
            echo "P8V8_R2_DISCOVERED_STATE=$P8V8_R2_DISCOVERED_STATE"
            echo "P8V7_RUN_ID=$P8V7_RUN_ID"
            echo "P8V7_ARTIFACT_DIGEST=$P8V7_ARTIFACT_DIGEST"
            echo "P8V7_REQUIRED_STATUS=SUCCESS"
          } > "$EVIDENCE_DIR/01-parent-auth.txt"

      - name: Fetch 20240819 first-parent history to proven coverage
        shell: bash
        run: |
          set -euo pipefail

          git init -q "$REPO_DIR"
          git -C "$REPO_DIR" remote add origin \
            "https://github.com/$VENDOR_REPO.git"

          git -C "$REPO_DIR" fetch -q \
            --filter=blob:none \
            --no-tags \
            --depth="$INITIAL_FETCH_DEPTH" \
            origin \
            "$LATER_PUBLIC_TAG_SHA:refs/remotes/origin/p8v8r3-later"

          depth="$INITIAL_FETCH_DEPTH"
          round=1

          while :; do
            git -C "$REPO_DIR" rev-list \
              --first-parent refs/remotes/origin/p8v8r3-later \
              > "$EVIDENCE_DIR/02-first-parent-chain.txt"

            newest="$(
              sed -n '1p' "$EVIDENCE_DIR/02-first-parent-chain.txt"
            )"
            oldest="$(
              tail -n 1 "$EVIDENCE_DIR/02-first-parent-chain.txt"
            )"

            newest_sublevel="$(
              git -C "$REPO_DIR" show "$newest:Makefile" \
                | awk '/^SUBLEVEL = / {print $3; exit}'
            )"
            oldest_sublevel="$(
              git -C "$REPO_DIR" show "$oldest:Makefile" \
                | awk '/^SUBLEVEL = / {print $3; exit}'
            )"

            test "$newest_sublevel" = "$LATER_PUBLIC_TAG_SUBLEVEL"

            {
              echo "ROUND=$round"
              echo "REQUESTED_DEPTH=$depth"
              echo "FIRST_PARENT_COMMIT_COUNT=$(
                wc -l < "$EVIDENCE_DIR/02-first-parent-chain.txt"
              )"
              echo "NEWEST_SUBLEVEL=$newest_sublevel"
              echo "OLDEST_SUBLEVEL=$oldest_sublevel"
            } >> "$EVIDENCE_DIR/02-fetch-rounds.txt"

            if [ "$oldest_sublevel" -le "$MIN_COVERAGE_SUBLEVEL" ]; then
              break
            fi

            shallow="$(
              git -C "$REPO_DIR" rev-parse --is-shallow-repository
            )"
            if [ "$shallow" != "true" ]; then
              break
            fi

            if [ "$depth" -ge "$MAX_FETCH_DEPTH" ]; then
              echo "::error::Insufficient first-parent history coverage"
              exit 41
            fi

            git -C "$REPO_DIR" fetch -q \
              --filter=blob:none \
              --no-tags \
              --deepen="$depth" \
              origin \
              "$LATER_PUBLIC_TAG_SHA:refs/remotes/origin/p8v8r3-later"

            depth=$((depth * 2))
            round=$((round + 1))
          done

          final_oldest="$(
            tail -n 1 "$EVIDENCE_DIR/02-first-parent-chain.txt"
          )"
          final_oldest_sublevel="$(
            git -C "$REPO_DIR" show "$final_oldest:Makefile" \
              | awk '/^SUBLEVEL = / {print $3; exit}'
          )"

          if [ "$final_oldest_sublevel" -gt "$MIN_COVERAGE_SUBLEVEL" ]; then
            echo "::error::First-parent history did not reach <=5.4.268"
            exit 42
          fi

          {
            echo "P8V8_R3_HISTORY_COVERAGE=PASS"
            echo "NEWEST_PUBLIC_TAG=$LATER_PUBLIC_TAG"
            echo "NEWEST_PUBLIC_TAG_SUBLEVEL=$LATER_PUBLIC_TAG_SUBLEVEL"
            echo "OLDEST_COVERED_SUBLEVEL=$final_oldest_sublevel"
            echo "TARGET_SUBLEVEL=$TARGET_SUBLEVEL"
          } > "$EVIDENCE_DIR/02-history-coverage.txt"

      - name: Exhaustively classify every first-parent 5.4.274 state
        id: audit
        shell: bash
        run: |
          set -euo pipefail

          python3 - \
            "$REPO_DIR" \
            "$EVIDENCE_DIR/02-first-parent-chain.txt" \
            "$P8V7_DIR/03-file-provenance.json" \
            "$P8V8_R2_DISCOVERED_STATE" \
            "$EVIDENCE_DIR/03-first-parent-274-states.tsv" \
            "$EVIDENCE_DIR/03-first-parent-274-audit.json" \
            "$EVIDENCE_DIR/03-first-parent-274-audit.txt" <<'PY'
          import csv
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          repo = Path(sys.argv[1])
          chain_path = Path(sys.argv[2])
          p8v7_path = Path(sys.argv[3])
          r2_state = sys.argv[4]
          tsv_out = Path(sys.argv[5])
          json_out = Path(sys.argv[6])
          text_out = Path(sys.argv[7])

          target_sublevel = 274
          defconfig = "arch/arm64/configs/veux_defconfig"
          conflict_files = [
              "include/linux/timer.h",
              "mm/mlock.c",
              "mm/mprotect.c",
              "mm/pgsize_migration.c",
          ]
          marker_tokens = (b"<<<<<<<", b"=======", b">>>>>>>")

          chain = [
              line.strip()
              for line in chain_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if not chain:
              raise SystemExit("empty first-parent chain")

          p8v7 = json.loads(p8v7_path.read_text(encoding="utf-8"))
          if sorted(p8v7["files"]) != conflict_files:
              raise SystemExit("P8-v7 conflict-file set drift")

          def run(*args, check=True, text=False):
              return subprocess.run(
                  args,
                  cwd=repo,
                  check=check,
                  capture_output=True,
                  text=text,
              )

          sublevel_cache = {}
          def sublevel(commit):
              if commit in sublevel_cache:
                  return sublevel_cache[commit]
              proc = run(
                  "git", "show", f"{commit}:Makefile",
                  check=False, text=True
              )
              if proc.returncode != 0:
                  value = None
              else:
                  value = None
                  for raw in proc.stdout.splitlines():
                      if raw.startswith("SUBLEVEL = "):
                          value = int(raw.split("=", 1)[1].strip())
                          break
              sublevel_cache[commit] = value
              return value

          def exists(commit, path):
              proc = run(
                  "git", "cat-file", "-e", f"{commit}:{path}",
                  check=False
              )
              return proc.returncode == 0

          def blob_bytes(commit, path):
              proc = run(
                  "git", "show", f"{commit}:{path}",
                  check=False
              )
              if proc.returncode != 0:
                  return None
              return proc.stdout

          # First explicitly close the r2 hard-fail condition as evidence.
          if r2_state not in chain:
              raise SystemExit("r2 state not on reconstructed first-parent chain")
          if sublevel(r2_state) != target_sublevel:
              raise SystemExit("r2 state is no longer SUBLEVEL 274")
          if exists(r2_state, defconfig):
              raise SystemExit(
                  "r2 hard-fail premise drift: VEUX defconfig now exists"
              )

          # Find all first-parent states whose tree itself reports 5.4.274.
          states_274 = [commit for commit in chain if sublevel(commit) == 274]
          if not states_274:
              raise SystemExit(
                  "unexpected: no first-parent SUBLEVEL 274 states after r2 found one"
              )

          rows = []
          qualifying = []
          states_with_veux = []

          for commit in states_274:
              has_veux = exists(commit, defconfig)
              if has_veux:
                  states_with_veux.append(commit)

              files_present = True
              markers_present = False
              file_states = {}

              if has_veux:
                  for path in conflict_files:
                      data = blob_bytes(commit, path)
                      present = data is not None
                      if not present:
                          files_present = False
                          file_states[path] = {
                              "present": False,
                              "conflict_markers": None,
                              "sha256": None,
                          }
                          continue

                      markers = any(token in data for token in marker_tokens)
                      markers_present = markers_present or markers
                      sha = hashlib.sha256(data).hexdigest()

                      parent_versions = p8v7["files"][path]["versions"]
                      matches = sorted(
                          label
                          for label, meta in parent_versions.items()
                          if meta["exists"] and meta["sha256"] == sha
                      )
                      file_states[path] = {
                          "present": True,
                          "conflict_markers": markers,
                          "sha256": sha,
                          "matches_p8v7_versions": matches,
                      }

              qualifies = (
                  has_veux
                  and files_present
                  and not markers_present
              )
              if qualifies:
                  qualifying.append(commit)

              subject = run(
                  "git", "show", "-s", "--format=%s", commit, text=True
              ).stdout.strip()
              date = run(
                  "git", "show", "-s", "--format=%cI", commit, text=True
              ).stdout.strip()

              rows.append({
                  "commit": commit,
                  "sublevel": 274,
                  "subject": subject,
                  "committer_date": date,
                  "veux_defconfig_present": has_veux,
                  "four_conflict_files_present": files_present if has_veux else None,
                  "conflict_markers_present": markers_present if has_veux else None,
                  "qualifies": qualifies,
                  "file_states": file_states,
              })

          # Identify first appearance of VEUX defconfig on this first-parent chain.
          # chain is newest -> oldest. A transition true -> false while walking
          # toward older commits identifies the first chronological appearance.
          presence = [exists(commit, defconfig) for commit in chain]
          introduction = None
          for index, present in enumerate(presence):
              if not present:
                  continue
              older_present = (
                  presence[index + 1]
                  if index + 1 < len(presence)
                  else False
              )
              if not older_present:
                  introduction = chain[index]
                  break

          introduction_info = None
          if introduction is not None:
              introduction_info = {
                  "commit": introduction,
                  "sublevel": sublevel(introduction),
                  "subject": run(
                      "git", "show", "-s", "--format=%s",
                      introduction, text=True
                  ).stdout.strip(),
                  "committer_date": run(
                      "git", "show", "-s", "--format=%cI",
                      introduction, text=True
                  ).stdout.strip(),
              }

          selected = qualifying[0] if qualifying else None

          result = {
              "stage": "CLEAN_GEN1_P8_V8_R3_FIRST_PARENT_274_VEUX_AUDIT",
              "r2_discovered_state": r2_state,
              "r2_state_sublevel": 274,
              "r2_state_veux_defconfig_present": False,
              "first_parent_274_state_count": len(states_274),
              "first_parent_274_states_with_veux_defconfig_count": len(states_with_veux),
              "first_parent_274_qualifying_state_count": len(qualifying),
              "selected_candidate": selected,
              "states": rows,
              "veux_defconfig_first_parent_introduction": introduction_info,
              "manual_conflict_resolution_performed": False,
              "source_patch_applied": False,
              "kernel_build_performed": False,
              "p9_release_authorized": False,
          }

          with tsv_out.open("w", encoding="utf-8", newline="") as handle:
              fields = [
                  "commit",
                  "sublevel",
                  "subject",
                  "committer_date",
                  "veux_defconfig_present",
                  "four_conflict_files_present",
                  "conflict_markers_present",
                  "qualifies",
              ]
              writer = csv.DictWriter(
                  handle, fieldnames=fields, delimiter="\t",
                  extrasaction="ignore"
              )
              writer.writeheader()
              writer.writerows(rows)

          json_out.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "P8V8_R3_FIRST_PARENT_274_AUDIT=PASS",
              f"R2_DISCOVERED_STATE={r2_state}",
              "R2_DISCOVERED_STATE_SUBLEVEL=274",
              "R2_DISCOVERED_STATE_VEUX_DEFCONFIG_PRESENT=NO",
              f"FIRST_PARENT_274_STATE_COUNT={len(states_274)}",
              (
                  "FIRST_PARENT_274_STATES_WITH_VEUX_DEFCONFIG_COUNT="
                  f"{len(states_with_veux)}"
              ),
              (
                  "FIRST_PARENT_274_QUALIFYING_STATE_COUNT="
                  f"{len(qualifying)}"
              ),
              f"SELECTED_CANDIDATE={selected or 'NONE'}",
          ]
          if introduction_info is None:
              lines.extend([
                  "VEUX_DEFCONFIG_FIRST_PARENT_INTRODUCTION=NONE_IN_COVERED_HISTORY",
                  "VEUX_DEFCONFIG_FIRST_PARENT_INTRODUCTION_SUBLEVEL=UNKNOWN",
              ])
          else:
              lines.extend([
                  (
                      "VEUX_DEFCONFIG_FIRST_PARENT_INTRODUCTION="
                      + introduction_info["commit"]
                  ),
                  (
                      "VEUX_DEFCONFIG_FIRST_PARENT_INTRODUCTION_SUBLEVEL="
                      + str(introduction_info["sublevel"])
                  ),
                  (
                      "VEUX_DEFCONFIG_FIRST_PARENT_INTRODUCTION_SUBJECT="
                      + introduction_info["subject"]
                  ),
              ])
          lines.extend([
              "MANUAL_CONFLICT_RESOLUTION_PERFORMED=NO",
              "SOURCE_PATCH_APPLIED=NO",
              "KERNEL_BUILD_PERFORMED=NO",
              "P9_RELEASE_AUTHORIZED=NO",
          ])
          text_out.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

          grep -Fxq 'P8V8_R3_FIRST_PARENT_274_AUDIT=PASS' \
            "$EVIDENCE_DIR/03-first-parent-274-audit.txt"
          grep -Fxq \
            'R2_DISCOVERED_STATE=fa50f7173c1227f423c254c4cd33b8807001cfa3' \
            "$EVIDENCE_DIR/03-first-parent-274-audit.txt"
          grep -Fxq 'R2_DISCOVERED_STATE_VEUX_DEFCONFIG_PRESENT=NO' \
            "$EVIDENCE_DIR/03-first-parent-274-audit.txt"
          grep -Fxq 'MANUAL_CONFLICT_RESOLUTION_PERFORMED=NO' \
            "$EVIDENCE_DIR/03-first-parent-274-audit.txt"
          grep -Fxq 'KERNEL_BUILD_PERFORMED=NO' \
            "$EVIDENCE_DIR/03-first-parent-274-audit.txt"

          selected="$(
            sed -n 's/^SELECTED_CANDIDATE=//p' \
              "$EVIDENCE_DIR/03-first-parent-274-audit.txt"
          )"
          test -n "$selected"

          if [ "$selected" = "NONE" ]; then
            echo "classification=NO_CANDIDATE" >> "$GITHUB_OUTPUT"
            echo "candidate=" >> "$GITHUB_OUTPUT"
          else
            echo "classification=CANDIDATE_FOUND" >> "$GITHUB_OUTPUT"
            echo "candidate=$selected" >> "$GITHUB_OUTPUT"
          fi

      - name: Build final green P8-v8 r3 scientific classification
        shell: bash
        run: |
          set -euo pipefail

          classification="${{ steps.audit.outputs.classification }}"
          candidate="${{ steps.audit.outputs.candidate }}"

          case "$classification" in
            CANDIDATE_FOUND)
              result="PUBLIC_FIRST_PARENT_5_4_274_VEUX_CANDIDATE_IDENTIFIED_NO_BUILD_AUTHORIZED"
              next_gate="P8V9_REVIEW_AND_BASELINE_BUILD_IDENTIFIED_PUBLIC_5_4_274_CANDIDATE"
              ;;
            NO_CANDIDATE)
              result="NO_PUBLIC_FIRST_PARENT_5_4_274_VEUX_CANDIDATE_STOP"
              candidate="NONE"
              next_gate="STOP_PUBLIC_SOURCE_PROVENANCE_INSUFFICIENT"
              ;;
            *)
              echo "::error::Unexpected P8-v8 r3 audit classification"
              exit 52
              ;;
          esac

          {
            echo "P8V8_RESULT=$result"
            echo "P8V8_RETRY=R3"
            echo "P8V8_R2_RUN_ID=$P8V8_R2_RUN_ID"
            echo "P8V8_R2_REQUIRED_STATUS=FAILURE"
            echo "P8V8_R2_FAILURE=$P8V8_R2_FAILURE"
            echo "P8V8_R2_DISCOVERED_STATE=$P8V8_R2_DISCOVERED_STATE"
            echo "PUBLIC_5_4_274_VEUX_CANDIDATE_COMMIT=$candidate"
            echo "MANUAL_CONFLICT_RESOLUTION_PERFORMED=NO"
            echo "OURS_SELECTED_AS_FIX=NO"
            echo "THEIRS_SELECTED_AS_FIX=NO"
            echo "SOURCE_PATCH_APPLIED=NO"
            echo "DEFCONFIG_PATCH_APPLIED=NO"
            echo "RESUKISU_SUSFS_RESTORE_PERFORMED=NO"
            echo "KERNEL_BUILD_PERFORMED=NO"
            echo "CRC_PATCHED=NO"
            echo "VERMAGIC_PATCHED=NO"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
            echo "DEVICE_COMPATIBILITY_PROVEN=NO"
            echo "KERNEL_CHANGE_AUTHORIZED=NO"
            echo "P9_RELEASE_AUTHORIZED=NO"
            echo "NEXT_GATE=$next_gate"
          } > "$EVIDENCE_DIR/P8V8-RESULT.txt"

          python3 - \
            "$EVIDENCE_DIR/P8V8-RESULT.txt" \
            "$EVIDENCE_DIR/03-first-parent-274-audit.json" \
            "$EVIDENCE_DIR/P8V8-RESULT.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          text_path, audit_path, output = map(Path, sys.argv[1:])
          values = {}
          for line in text_path.read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  values[key] = value

          audit = json.loads(audit_path.read_text(encoding="utf-8"))

          result = {
              "stage": "CLEAN_GEN1_P8_V8_R3_PUBLIC_LINEAGE_CANDIDATE_AUDIT",
              "result": values["P8V8_RESULT"],
              "retry": "R3",
              "r2_run": 33722447606,
              "r2_required_status": "FAILURE",
              "r2_failure": values["P8V8_R2_FAILURE"],
              "r2_discovered_state": values["P8V8_R2_DISCOVERED_STATE"],
              "public_candidate": (
                  None
                  if values["PUBLIC_5_4_274_VEUX_CANDIDATE_COMMIT"] == "NONE"
                  else values["PUBLIC_5_4_274_VEUX_CANDIDATE_COMMIT"]
              ),
              "first_parent_274_audit": audit,
              "safety": {
                  "manual_conflict_resolution_performed": False,
                  "ours_selected_as_fix": False,
                  "theirs_selected_as_fix": False,
                  "source_patch_applied": False,
                  "defconfig_patch_applied": False,
                  "resukisu_susfs_restore_performed": False,
                  "kernel_build_performed": False,
                  "crc_patched": False,
                  "vermagic_patched": False,
                  "boot_image_created": False,
                  "flashable_zip_created": False,
                  "device_accessed": False,
                  "flashing_performed": False,
                  "device_compatibility_proven": False,
                  "kernel_change_authorized": False,
                  "p9_release_authorized": False,
              },
              "next_gate": values["NEXT_GATE"],
          }
          output.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          grep -Fxq 'P8V8_RETRY=R3' \
            "$EVIDENCE_DIR/P8V8-RESULT.txt"
          grep -Fxq 'P8V8_R2_REQUIRED_STATUS=FAILURE' \
            "$EVIDENCE_DIR/P8V8-RESULT.txt"
          grep -Fxq 'MANUAL_CONFLICT_RESOLUTION_PERFORMED=NO' \
            "$EVIDENCE_DIR/P8V8-RESULT.txt"
          grep -Fxq 'KERNEL_BUILD_PERFORMED=NO' \
            "$EVIDENCE_DIR/P8V8-RESULT.txt"
          grep -Fxq 'P9_RELEASE_AUTHORIZED=NO' \
            "$EVIDENCE_DIR/P8V8-RESULT.txt"

      - name: Close immutable P8-v8 r3 evidence package
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$EVIDENCE_DIR"

          {
            echo "JOB_STATUS=${{ job.status }}"
            echo "P8V8_RETRY=R3"
            echo "P8V8_R2_RUN_ID=$P8V8_R2_RUN_ID"
            echo "P8V8_R2_REQUIRED_STATUS=FAILURE"
            echo "P8V8_TARGET_REGION_COUNT=8"
            echo "P8V8_TARGET_REGION_IDS=$TARGET_REGION_IDS"
            echo "P8V8_EEA_INCLUDED=NO"
            echo "P8V8_MANUAL_CONFLICT_RESOLUTION_PERFORMED=NO"
            echo "P8V8_SOURCE_PATCH_APPLIED=NO"
            echo "P8V8_DEFCONFIG_PATCH_APPLIED=NO"
            echo "P8V8_RESUKISU_SUSFS_RESTORE_PERFORMED=NO"
            echo "P8V8_KERNEL_BUILD_PERFORMED=NO"
            echo "P8V8_CRC_PATCHED=NO"
            echo "P8V8_VERMAGIC_PATCHED=NO"
            echo "P8V8_BOOT_IMAGE_CREATED=NO"
            echo "P8V8_FLASHABLE_ZIP_CREATED=NO"
            echo "P8V8_DEVICE_ACCESSED=NO"
            echo "P8V8_FLASHING_PERFORMED=NO"
            echo "P8V8_DEVICE_COMPATIBILITY_PROVEN=NO"
            echo "P8V8_KERNEL_CHANGE_AUTHORIZED=NO"
            echo "P8V8_P9_RELEASE_AUTHORIZED=NO"
          } > "$EVIDENCE_DIR/99-job-end-state.txt"

          (
            cd "$EVIDENCE_DIR" || exit 1
            find . -type f \
              ! -name 'FILES.txt' \
              ! -name 'SHA256SUMS' \
              ! -name 'SHA256SUMS.verify.txt' \
              -printf '%P\n' | sort > FILES.txt
            while IFS= read -r file; do
              sha256sum "$file"
            done < FILES.txt > SHA256SUMS
            sha256sum -c SHA256SUMS > SHA256SUMS.verify.txt
          )
          exit 0

      - name: Upload P8-v8 r3 lineage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p8v8r3-veux-5.4.274-public-lineage-candidate-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 90
