      - name: Recover exact current-phone Final_Boot calibration inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOT_WORK/reference"
          mkdir -p "$BOOT_WORK/reference"
          release_zip="$BOOT_WORK/$FINAL_BOOT_RELEASE_ASSET"

          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${FINAL_BOOT_RELEASE_TAG}/${FINAL_BOOT_RELEASE_ASSET}" \
            -o "$release_zip"

          test "$(sha256sum "$release_zip" | awk '{print $1}')" = "$FINAL_BOOT_RELEASE_ZIP_SHA256"
          unzip -t "$release_zip" >/dev/null
          unzip -q "$release_zip" -d "$BOOT_WORK/reference"

          test -s "$BOOT_WORK/reference/boot.img"
          test -s "$BOOT_WORK/reference/rollback_stock_boot.img.gz"
          test "$(sha256sum "$BOOT_WORK/reference/boot.img" | awk '{print $1}')" = \
            "$FINAL_BOOT_REFERENCE_BOOT_SHA256"
          test "$(sha256sum "$BOOT_WORK/reference/rollback_stock_boot.img.gz" | awk '{print $1}')" = \
            "$ROLLBACK_GZIP_SHA256"

          gzip -t "$BOOT_WORK/reference/rollback_stock_boot.img.gz"
          gzip -dc "$BOOT_WORK/reference/rollback_stock_boot.img.gz" > "$BOOT_WORK/stock_boot.img"

          test "$(stat -c '%s' "$BOOT_WORK/stock_boot.img")" = "$STOCK_BOOT_BYTES"
          test "$(sha256sum "$BOOT_WORK/stock_boot.img" | awk '{print $1}')" = "$STOCK_BOOT_SHA256"

          {
            echo "P9_FINAL_BOOT_RELEASE_CALIBRATION_INPUT=PASS"
            echo "FINAL_BOOT_RELEASE_ZIP_SHA256=$FINAL_BOOT_RELEASE_ZIP_SHA256"
            echo "FINAL_BOOT_REFERENCE_BOOT_SHA256=$FINAL_BOOT_REFERENCE_BOOT_SHA256"
            echo "STOCK_BOOT_SHA256=$STOCK_BOOT_SHA256"
            echo "STOCK_RAMDISK_SHA256=$STOCK_RAMDISK_SHA256"
          } | tee "$AUDIT_DIR/13-final-boot-calibration-input.txt"

      - name: Build calibrated P9 boot image first
        shell: bash
        run: |
          set -euo pipefail
          image="$OUT_A/arch/arm64/boot/Image"
          test_boot="$DIST_DIR/$P9_BOOT_NAME"
          test -s "$image"

          python3 - \
            "$BOOT_WORK/stock_boot.img" \
            "$BOOT_WORK/reference/boot.img" \
            "$image" \
            "$test_boot" \
            "$AUDIT_DIR/14-boot-build.json" \
            "$AUDIT_DIR/14-boot-build.txt" <<'PY'
          import hashlib
          import json
          import struct
          import sys
          from pathlib import Path

          stock_path = Path(sys.argv[1])
          old_boot_path = Path(sys.argv[2])
          new_image_path = Path(sys.argv[3])
          out_path = Path(sys.argv[4])
          json_out = Path(sys.argv[5])
          txt_out = Path(sys.argv[6])

          STOCK_SHA = "ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5"
          OLD_BOOT_SHA = "2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e"
          OLD_KERNEL_SHA = "e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96"
          RAMDISK_SHA = "0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a"
          BOOT_BYTES = 134217728
          PAGE = 4096

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def align(value):
              return (value + PAGE - 1) // PAGE * PAGE

          def need(condition, message):
              if not condition:
                  raise SystemExit("ERROR: " + message)

          def parse_footer(data):
              raw = data[-64:]
              need(raw[:4] == b"AVBf", "AVB footer magic")
              major, minor = struct.unpack_from(">II", raw, 4)
              original, offset, size = struct.unpack_from(">QQQ", raw, 12)
              need(offset + size <= len(data) - 64, "AVB footer geometry")
              return {
                  "major": major, "minor": minor, "original": original,
                  "offset": offset, "size": size, "raw": raw,
                  "vbmeta": data[offset:offset + size],
              }

          def parse_vbmeta(vb):
              need(vb[:4] == b"AVB0", "AVB0 magic")
              auth_size, aux_size = struct.unpack_from(">QQ", vb, 12)
              algorithm_type = struct.unpack_from(">I", vb, 28)[0]
              values = struct.unpack_from(">QQQQQQQQQQQ", vb, 32)
              descriptors_offset = values[8]
              descriptors_size = values[9]
              aux_start = 256 + auth_size
              pos = aux_start + descriptors_offset
              end = pos + descriptors_size
              need(end <= aux_start + aux_size, "AVB descriptor geometry")
              items = []
              while pos < end:
                  tag, following = struct.unpack_from(">QQ", vb, pos)
                  raw = vb[pos:pos + 16 + following]
                  need(len(raw) == 16 + following, "truncated AVB descriptor")
                  item = {"tag": tag, "offset": pos}
                  if tag == 2:
                      image_size = struct.unpack_from(">Q", raw, 16)[0]
                      algorithm = raw[24:56].split(b"\0", 1)[0].decode("ascii", "replace")
                      name_len, salt_len, digest_len, flags = struct.unpack_from(">IIII", raw, 56)
                      q = 132
                      partition = raw[q:q + name_len].decode("ascii", "replace")
                      q += name_len
                      salt = raw[q:q + salt_len]
                      q += salt_len
                      digest = raw[q:q + digest_len]
                      item.update({
                          "type": "hash", "image_size": image_size,
                          "hash_algorithm": algorithm, "partition": partition,
                          "salt": salt, "digest": digest,
                          "digest_offset": pos + q, "digest_len": digest_len,
                          "image_size_offset": pos + 16, "flags": flags,
                      })
                  else:
                      item["type"] = "other"
                  items.append(item)
                  pos += 16 + following
              need(pos == end, "AVB descriptor parse end")
              return {"algorithm_type": algorithm_type, "descriptors": items}

          def boot_descriptor(info):
              found = [d for d in info["descriptors"]
                       if d.get("type") == "hash" and d.get("partition") == "boot"]
              need(len(found) == 1, "exactly one boot hash descriptor")
              return found[0]

          def verify_descriptor(data, desc):
              need(desc["hash_algorithm"] == "sha256", "AVB hash algorithm")
              calculated = hashlib.sha256(desc["salt"] + data[:desc["image_size"]]).digest()
              return calculated == desc["digest"], calculated

          stock = stock_path.read_bytes()
          old_boot = old_boot_path.read_bytes()
          new_image = new_image_path.read_bytes()

          need(len(stock) == BOOT_BYTES, "stock boot size")
          need(sha(stock) == STOCK_SHA, "stock boot hash")
          need(len(old_boot) == BOOT_BYTES, "reference boot size")
          need(sha(old_boot) == OLD_BOOT_SHA, "reference boot hash")
          need(stock[:8] == b"ANDROID!", "stock Android magic")
          need(old_boot[:8] == b"ANDROID!", "reference Android magic")
          need(len(new_image) > 1024 * 1024, "candidate Image too small")

          stock_kernel_size = struct.unpack_from("<I", stock, 8)[0]
          ramdisk_size = struct.unpack_from("<I", stock, 12)[0]
          header_size = struct.unpack_from("<I", stock, 20)[0]
          header_version = struct.unpack_from("<I", stock, 40)[0]
          need(header_version == 3, "Boot header v3")
          need(header_size == 1580, "Boot header size")
          need(stock_kernel_size == 45480448, "stock kernel size")
          need(ramdisk_size == 22061278, "stock ramdisk size")

          stock_ramdisk_offset = PAGE + align(stock_kernel_size)
          ramdisk = stock[stock_ramdisk_offset:stock_ramdisk_offset + ramdisk_size]
          need(sha(ramdisk) == RAMDISK_SHA, "stock ramdisk hash")

          stock_footer = parse_footer(stock)
          stock_vbmeta = parse_vbmeta(stock_footer["vbmeta"])
          need(stock_vbmeta["algorithm_type"] == 0, "stock vbmeta algorithm NONE")
          stock_desc = boot_descriptor(stock_vbmeta)
          valid, _ = verify_descriptor(stock, stock_desc)
          need(valid, "stock embedded AVB descriptor")

          old_kernel_size = struct.unpack_from("<I", old_boot, 8)[0]
          old_kernel = old_boot[PAGE:PAGE + old_kernel_size]
          need(sha(old_kernel) == OLD_KERNEL_SHA, "reference embedded kernel hash")

          def build_custom(image):
              ramdisk_offset = PAGE + align(len(image))
              payload_end = ramdisk_offset + align(len(ramdisk))
              footer_len = 64
              vbmeta_size = len(stock_footer["vbmeta"])
              need(payload_end + vbmeta_size <= BOOT_BYTES - footer_len,
                   "candidate boot payload exceeds partition")

              output = bytearray(BOOT_BYTES)
              header = bytearray(stock[:PAGE])
              struct.pack_into("<I", header, 8, len(image))
              output[:PAGE] = header
              output[PAGE:PAGE + len(image)] = image
              output[ramdisk_offset:ramdisk_offset + len(ramdisk)] = ramdisk

              vbmeta = bytearray(stock_footer["vbmeta"])
              struct.pack_into(">Q", vbmeta, stock_desc["image_size_offset"], payload_end)
              digest = hashlib.sha256(stock_desc["salt"] + bytes(output[:payload_end])).digest()
              d0 = stock_desc["digest_offset"]
              d1 = d0 + stock_desc["digest_len"]
              vbmeta[d0:d1] = digest
              output[payload_end:payload_end + len(vbmeta)] = vbmeta

              footer = bytearray(stock_footer["raw"])
              struct.pack_into(">Q", footer, 12, payload_end)
              struct.pack_into(">Q", footer, 20, payload_end)
              output[-64:] = footer

              result = bytes(output)
              parsed_footer = parse_footer(result)
              parsed_vbmeta = parse_vbmeta(parsed_footer["vbmeta"])
              parsed_desc = boot_descriptor(parsed_vbmeta)
              ok, calculated = verify_descriptor(result, parsed_desc)
              need(ok, "rebuilt embedded AVB descriptor")
              need(calculated == digest, "rebuilt AVB digest")
              return {
                  "bytes": result, "ramdisk_offset": ramdisk_offset,
                  "payload_end": payload_end, "digest": digest.hex(),
              }

          calibration = build_custom(old_kernel)
          need(calibration["bytes"] == old_boot, "Final_Boot calibration byte identity")
          need(sha(calibration["bytes"]) == OLD_BOOT_SHA, "Final_Boot calibration hash")

          candidate = build_custom(new_image)
          data = candidate["bytes"]
          kernel_size = struct.unpack_from("<I", data, 8)[0]
          embedded_kernel = data[PAGE:PAGE + kernel_size]
          embedded_ramdisk = data[candidate["ramdisk_offset"]:candidate["ramdisk_offset"] + ramdisk_size]
          need(embedded_kernel == new_image, "candidate embedded kernel byte identity")
          need(sha(embedded_ramdisk) == RAMDISK_SHA, "candidate stock ramdisk identity")

          need(len(new_image) >= 64, "ARM64 Image header")
          text_offset, arm_image_size, arm_flags = struct.unpack_from("<QQQ", new_image, 8)
          arm_magic, arm_res5 = struct.unpack_from("<II", new_image, 56)
          need(text_offset == 0x80000, "ARM64 text offset")
          need(arm_magic == 0x644D5241, "ARM64 magic")
          need(arm_flags == 0xA, "ARM64 flags")
          need(arm_res5 == 0x40, "ARM64 res5")
          need(b"Linux version 5.4.274-qgki-g82179e362f33 "
               b"(builder@pangu-build-component-vendor-345942-54r9t-tw0tk-tq90c)" in new_image,
               "verified stock kernel identity")
          need(b"#1 SMP PREEMPT Thu Dec 5 14:47:59 UTC 2024" in new_image,
               "verified stock build timestamp")

          out_path.write_bytes(data)
          report = {
              "result": "PASS_P9_CALIBRATED_BOOT",
              "historical_final_boot_calibration_byte_identical": True,
              "stock_boot_sha256": STOCK_SHA,
              "stock_ramdisk_sha256": RAMDISK_SHA,
              "candidate_image_sha256": sha(new_image),
              "candidate_image_bytes": len(new_image),
              "candidate_boot_sha256": sha(data),
              "candidate_boot_bytes": len(data),
              "ramdisk_offset": candidate["ramdisk_offset"],
              "payload_end": candidate["payload_end"],
              "embedded_avb_digest": candidate["digest"],
              "verified_kernel_release": "5.4.274-qgki-g82179e362f33",
              "arm64_text_offset": text_offset,
              "arm64_image_size": arm_image_size,
              "arm64_flags": arm_flags,
          }
          json_out.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          lines = [
              "P9_CALIBRATED_BOOT=PASS",
              "HISTORICAL_FINAL_BOOT_CALIBRATION=PASS",
              "HISTORICAL_FINAL_BOOT_CALIBRATION_BYTE_IDENTICAL=YES",
              "SAME_STOCK_BOOT_TEMPLATE=YES",
              "SAME_STOCK_RAMDISK=YES",
              "BOOT_HEADER_VERSION=3",
              "BOOT_BYTES=134217728",
              "P9_IMAGE_SHA256=" + sha(new_image),
              "P9_IMAGE_BYTES=" + str(len(new_image)),
              "P9_BOOT_SHA256=" + sha(data),
              "P9_BOOT_BYTES=" + str(len(data)),
              "STOCK_RAMDISK_SHA256=" + RAMDISK_SHA,
              "P9_EMBEDDED_AVB_VERIFIES=YES",
          ]
          txt_out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

          test -s "$test_boot"
          test "$(stat -c '%s' "$test_boot")" = "$STOCK_BOOT_BYTES"
          (cd "$DIST_DIR" && sha256sum "$P9_BOOT_NAME" > "$P9_BOOT_NAME.sha256")
          grep -Fxq 'P9_CALIBRATED_BOOT=PASS' "$AUDIT_DIR/14-boot-build.txt"
          grep -Fxq 'HISTORICAL_FINAL_BOOT_CALIBRATION_BYTE_IDENTICAL=YES' "$AUDIT_DIR/14-boot-build.txt"
          grep -Fxq 'P9_EMBEDDED_AVB_VERIFIES=YES' "$AUDIT_DIR/14-boot-build.txt"

      - name: Independently validate P9 boot image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$AUDIT_DIR/15-boot-independent-audit.txt"
          import hashlib
          import os
          import struct
          from pathlib import Path

          dist = Path(os.environ["DIST_DIR"])
          boot = (dist / os.environ["P9_BOOT_NAME"]).read_bytes()
          image = Path(os.environ["OUT_A"] + "/arch/arm64/boot/Image").read_bytes()

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def need(condition, message):
              if not condition:
                  raise SystemExit("ERROR: " + message)

          need(len(boot) == 134217728, "boot size")
          need(boot[:8] == b"ANDROID!", "Android magic")
          kernel_size = struct.unpack_from("<I", boot, 8)[0]
          ramdisk_size = struct.unpack_from("<I", boot, 12)[0]
          header_size = struct.unpack_from("<I", boot, 20)[0]
          header_version = struct.unpack_from("<I", boot, 40)[0]
          need(kernel_size == len(image), "kernel size")
          need(header_size == 1580, "header size")
          need(header_version == 3, "header version")
          need(ramdisk_size == 22061278, "ramdisk size")

          page = 4096
          align = lambda n: (n + page - 1) // page * page
          ramdisk_offset = page + align(kernel_size)
          kernel = boot[page:page + kernel_size]
          ramdisk = boot[ramdisk_offset:ramdisk_offset + ramdisk_size]
          need(kernel == image, "embedded kernel byte identity")
          need(sha(ramdisk) == os.environ["STOCK_RAMDISK_SHA256"], "stock ramdisk hash")

          expected_banner = (
              "Linux version " + os.environ["STOCK_KERNEL_RELEASE"] +
              " (" + os.environ["KBUILD_BUILD_USER"] + "@" + os.environ["KBUILD_BUILD_HOST"] + ")"
          ).encode()
          need(expected_banner in kernel, "embedded verified kernel identity")
          need(("#1 SMP PREEMPT " + os.environ["KBUILD_BUILD_TIMESTAMP"]).encode() in kernel,
               "embedded verified build timestamp")

          footer = boot[-64:]
          need(footer[:4] == b"AVBf", "AVB footer")
          major, minor = struct.unpack_from(">II", footer, 4)
          original, vbmeta_offset, vbmeta_size = struct.unpack_from(">QQQ", footer, 12)
          need((major, minor) == (1, 0), "AVB footer version")
          need(original == vbmeta_offset, "AVB original/vbmeta offset")
          need(vbmeta_size == 896, "vbmeta size")

          vbmeta = boot[vbmeta_offset:vbmeta_offset + vbmeta_size]
          need(vbmeta[:4] == b"AVB0", "vbmeta magic")
          need(struct.unpack_from(">I", vbmeta, 28)[0] == 0, "vbmeta algorithm NONE")
          auth_size, aux_size = struct.unpack_from(">QQ", vbmeta, 12)
          vals = struct.unpack_from(">QQQQQQQQQQQ", vbmeta, 32)
          desc_off, desc_size = vals[8], vals[9]
          pos = 256 + auth_size + desc_off
          end = pos + desc_size
          found = None

          while pos < end:
              tag, following = struct.unpack_from(">QQ", vbmeta, pos)
              raw = vbmeta[pos:pos + 16 + following]
              need(len(raw) == 16 + following, "descriptor length")
              if tag == 2:
                  image_size = struct.unpack_from(">Q", raw, 16)[0]
                  algo = raw[24:56].split(b"\0", 1)[0].decode()
                  name_len, salt_len, digest_len, flags = struct.unpack_from(">IIII", raw, 56)
                  q = 132
                  part = raw[q:q + name_len].decode()
                  q += name_len
                  salt = raw[q:q + salt_len]
                  q += salt_len
                  digest = raw[q:q + digest_len]
                  if part == "boot":
                      need(found is None, "duplicate boot descriptor")
                      found = (image_size, algo, salt, digest, flags)
              pos += 16 + following

          need(found is not None, "boot hash descriptor")
          image_size, algo, salt, digest, flags = found
          need(algo == "sha256", "descriptor hash algorithm")
          need(flags == 0, "descriptor flags")
          need(image_size == original, "descriptor image size")
          calculated = hashlib.sha256(salt + boot[:image_size]).digest()
          need(calculated == digest, "embedded AVB digest")

          print("P9_BOOT_INDEPENDENT_AUDIT=PASS")
          print("P9_BOOT_SHA256=" + sha(boot))
          print("P9_IMAGE_SHA256=" + sha(image))
          print("P9_STOCK_RAMDISK_SHA256=" + sha(ramdisk))
          print("P9_EMBEDDED_AVB_VERIFIES=YES")
          print("P9_EMBEDDED_KERNEL_BYTE_IDENTICAL=YES")
          PY

          grep -Fxq 'P9_BOOT_INDEPENDENT_AUDIT=PASS' "$AUDIT_DIR/15-boot-independent-audit.txt"
          grep -Fxq 'P9_EMBEDDED_AVB_VERIFIES=YES' "$AUDIT_DIR/15-boot-independent-audit.txt"
          grep -Fxq 'P9_EMBEDDED_KERNEL_BYTE_IDENTICAL=YES' "$AUDIT_DIR/15-boot-independent-audit.txt"

      - name: Checkout proven AnyKernel3 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/AnyKernel3"
          git clone -q "$AK3_REPO" "$GITHUB_WORKSPACE/AnyKernel3"
          git -C "$GITHUB_WORKSPACE/AnyKernel3" checkout -q --detach "$AK3_COMMIT"
          test "$(git -C "$GITHUB_WORKSPACE/AnyKernel3" rev-parse HEAD)" = "$AK3_COMMIT"
          {
            echo "AK3_CHECKOUT=PASS"
            echo "AK3_COMMIT=$AK3_COMMIT"
          } | tee "$AUDIT_DIR/16-ak3-checkout.txt"

      - name: Build VEUX AnyKernel3 package after boot validation
        shell: bash
        run: |
          set -euo pipefail
          ak3="$GITHUB_WORKSPACE/AnyKernel3"
          test -s "$DIST_DIR/$P9_BOOT_NAME"
          grep -Fxq 'P9_BOOT_INDEPENDENT_AUDIT=PASS' "$AUDIT_DIR/15-boot-independent-audit.txt"

          rm -f "$ak3/Image" "$ak3/Image.gz" "$ak3/Image.gz-dtb" "$ak3/dtb" "$ak3/dtbo.img"
          cp "$OUT_A/arch/arm64/boot/Image" "$ak3/Image"
          test -s "$ak3/Image"

          cat > "$ak3/anykernel.sh" <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          properties() { '
          kernel.string=VEUX GEN1 P9 Linux 5.4.274 ReSukiSU audited deltas + SUSFS 2.3
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=veux
          supported.versions=13
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          chmod 0755 "$ak3/anykernel.sh"

          cat > "$ak3/P9-AUDIT-NOTE.txt" <<EOF
          CLEAN GEN1 P9
          Base: P6-v11 FULL SUSFS 2.3
          Linux: 5.4.274
          Device: veux
          ReSukiSU base: $EXPECTED_RESUKISU_HEAD
          Audited kernel deltas:
            $R1_POLICYDB_FIX
            $R2_WEBVIEW_ALLOWLIST
            $R3_APK_SIGN_HARDENING
          SUSFS outer implementation changed by P9: NO
          ReSukiSU Kbuild/version identity changed by P9: NO
          Forced/spoofed API4 identity: NO
          EOF

          rm -rf "$ak3/.git" "$ak3/.github"
          rm -f "$ak3/README.md"
          find "$ak3" -type f -name '*placeholder' -delete

          zip_name="VEUX-GEN1-P9-5.4.274-ReSukiSU-Audited-SUSFS-2.3-AK3.zip"
          (
            cd "$ak3"
            zip -r9 "$DIST_DIR/$zip_name" . \
              -x '.github/*' 'README.md' '*placeholder'
          )
          test -s "$DIST_DIR/$zip_name"
          echo "AK3_ZIP=$DIST_DIR/$zip_name" >> "$GITHUB_ENV"
          {
            echo "AK3_BUILD=PASS"
            echo "AK3_ZIP=$zip_name"
          } | tee "$AUDIT_DIR/17-ak3-build.txt"

      - name: Validate VEUX AnyKernel3 package
        shell: bash
        run: |
          set -euo pipefail
          zip_name="$(basename "$AK3_ZIP")"
          cd "$DIST_DIR"
          test -s "$zip_name"
          unzip -t "$zip_name" | tee "$AUDIT_DIR/18-ak3-unzip-test.txt"
          unzip -l "$zip_name" | tee "$AUDIT_DIR/18-ak3-contents.txt"

          for required in anykernel.sh tools/ak3-core.sh Image; do
            unzip -Z1 "$zip_name" | grep -Fxq "$required" || {
              echo "ERROR: AK3 payload missing $required"
              exit 1
            }
          done

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          unzip -p "$zip_name" Image > "$tmpdir/Image"
          cmp -s Image "$tmpdir/Image"
          cmp -s "$OUT_A/arch/arm64/boot/Image" "$tmpdir/Image"

          unzip -p "$zip_name" anykernel.sh > "$tmpdir/anykernel.sh"
          grep -Fqx 'device.name1=veux' "$tmpdir/anykernel.sh"
          grep -Fqx 'block=/dev/block/bootdevice/by-name/boot;' "$tmpdir/anykernel.sh"
          grep -Fqx 'is_slot_device=1;' "$tmpdir/anykernel.sh"
          grep -Fqx 'supported.versions=13' "$tmpdir/anykernel.sh"

          sha256sum "$zip_name" > "$zip_name.sha256"
          file_count="$(unzip -Z1 "$zip_name" | grep -Ev '/$' | wc -l)"
          {
            echo "P9_AK3_VALIDATION=PASS"
            echo "AK3_ZIP=$zip_name"
            echo "AK3_ZIP_SHA256=$(sha256sum "$zip_name" | awk '{print $1}')"
            echo "AK3_FILE_COUNT=$file_count"
            echo "AK3_PIN=$AK3_COMMIT"
            echo "AK3_IMAGE_BYTE_IDENTICAL=YES"
          } | tee "$AUDIT_DIR/18-ak3-validation.txt"

      - name: Final fail-closed boot-first release gate
        shell: bash
        run: |
          set -euo pipefail

          grep -Fxq 'SUSFS_2_3_BASELINE_BYTE_PRESERVED=PASS' "$AUDIT_DIR/08-boundaries.txt"
          grep -Fxq 'KSU_KBUILD_IDENTITY_BYTE_PRESERVED=PASS' "$AUDIT_DIR/08-boundaries.txt"
          grep -Fxq 'APPROVED_RESUKISU_DELTA_SCOPE=PASS' "$AUDIT_DIR/08-boundaries.txt"
          grep -Eq '^IMAGE_REPRODUCIBLE=(PASS|NO)$' "$AUDIT_DIR/12-reproducibility.txt"
          grep -Fxq 'DTBS_REPRODUCIBLE=PASS' "$AUDIT_DIR/12-reproducibility.txt"
          grep -Fxq 'P9_CALIBRATED_BOOT=PASS' "$AUDIT_DIR/14-boot-build.txt"
          grep -Fxq 'P9_BOOT_INDEPENDENT_AUDIT=PASS' "$AUDIT_DIR/15-boot-independent-audit.txt"
          grep -Fxq 'AK3_CHECKOUT=PASS' "$AUDIT_DIR/16-ak3-checkout.txt"
          grep -Fxq 'AK3_BUILD=PASS' "$AUDIT_DIR/17-ak3-build.txt"
          grep -Fxq 'P9_AK3_VALIDATION=PASS' "$AUDIT_DIR/18-ak3-validation.txt"

          boot_file="$DIST_DIR/$P9_BOOT_NAME"
          test -s "$boot_file"
          test "$(stat -c '%s' "$boot_file")" = "$STOCK_BOOT_BYTES"

          test "$(find "$DIST_DIR" -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1
          zip_file="$(find "$DIST_DIR" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -s "$zip_file"

          cp "$AUDIT_DIR/00-plan.txt" "$DIST_DIR/P9-WORKFLOW-POLICY.txt"
          cp "$AUDIT_DIR/12-reproducibility.txt" "$DIST_DIR/P9-REPRODUCIBILITY.txt"
          cp "$AUDIT_DIR/08-boundaries.txt" "$DIST_DIR/P9-BOUNDARIES.txt"
          cp "$AUDIT_DIR/09-p9-resukisu-delta.patch" "$DIST_DIR/P9-RESUKISU-DELTA.patch"
          cp "$AUDIT_DIR/14-boot-build.txt" "$DIST_DIR/P9-BOOT-BUILD.txt"
          cp "$AUDIT_DIR/15-boot-independent-audit.txt" "$DIST_DIR/P9-BOOT-AUDIT.txt"
          cp "$AUDIT_DIR/18-ak3-validation.txt" "$DIST_DIR/P9-AK3-VALIDATION.txt"

          {
            echo "CLEAN_GEN1_P9_BOOT_FIRST_AK3_RELEASE=PASS"
            echo "BASE_RESUKISU=$EXPECTED_RESUKISU_HEAD"
            echo "R1=$R1_POLICYDB_FIX"
            echo "R2=$R2_WEBVIEW_ALLOWLIST"
            echo "R3=$R3_APK_SIGN_HARDENING"
            echo "SUSFS_OUTER_CHANGED=NO"
            echo "KSU_API_IDENTITY_SPOOFED=NO"
            echo "BOOT=$(basename "$boot_file")"
            echo "BOOT_SHA256=$(sha256sum "$boot_file" | awk '{print $1}')"
            echo "AK3=$(basename "$zip_file")"
            echo "AK3_SHA256=$(sha256sum "$zip_file" | awk '{print $1}')"
            echo "AK3_PIN=$AK3_COMMIT"
            echo "REAL_DEVICE_BOOT_TEST=NOT_PERFORMED"
          } | tee "$DIST_DIR/FINAL-RESULT.txt"

          (
            cd "$DIST_DIR"
            sha256sum \
              Image Image.sha256 \
              "$P9_BOOT_NAME" "$P9_BOOT_NAME.sha256" \
              "$(basename "$zip_file")" "$(basename "$zip_file").sha256" \
              P9-WORKFLOW-POLICY.txt P9-REPRODUCIBILITY.txt P9-BOUNDARIES.txt \
              P9-RESUKISU-DELTA.patch P9-BOOT-BUILD.txt P9-BOOT-AUDIT.txt \
              P9-AK3-VALIDATION.txt FINAL-RESULT.txt \
              > SUPPORT-SHA256SUMS
          )

      - name: Upload P9 boot + AK3 release
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p9-veux-5.4.274-resukisu-audited-susfs-2.3-boot-ak3-${{ github.run_id }}
          path: clean-gen1-p9-dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload P9 audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p9-audit-${{ github.run_id }}
          path: clean-gen1-p9-audit/
          if-no-files-found: warn
          retention-days: 90
