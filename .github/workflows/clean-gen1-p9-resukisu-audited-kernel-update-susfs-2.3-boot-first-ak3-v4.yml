name: CLEAN GEN1 P9 - Audited ReSukiSU update + SUSFS 2.3 boot-first AK3 v4

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: clean-gen1-p9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-boot-ak3:
    runs-on: ubuntu-24.04
    timeout-minutes: 210

    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

      VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
      VENDOR_TAG: '20240619'
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632

      # Exact accepted P6-v11 FULL-SUSFS-2.3 backup lineage.
      P6V11_ARTIFACT_PREFIX: clean-gen1-p6v11-v6-full-susfs-outer-integration-p7-test-boot-
      EXPECTED_P5I_COMMIT: f353a9475e40ca866d570c1d0ef55e24cf6556e4
      EXPECTED_P5I_TREE: a947c1f2891c796a08373fc755e29b23139dc761
      EXPECTED_RESUKISU_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_RESUKISU_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      EXPECTED_KSU_VERSION: '35102'

      # Reviewed upstream deltas. Apply in this exact order.
      RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
      R1_POLICYDB_FIX: f5992bfce3b292c69989ae8f41e49769563d2db9
      R2_WEBVIEW_ALLOWLIST: 5fe98409dc52506f7a5cc1bb8f94d6f5c849b7f0
      R3_APK_SIGN_HARDENING: 830a5aedc742cb7399cccb61df60d55fd7cbcb90

      # Proven build identity/toolchain; unchanged from the successful P9 build.
      CLANG_PREBUILT_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      KBUILD_BUILD_USER: builder
      KBUILD_BUILD_HOST: pangu-build-component-vendor-345942-54r9t-tw0tk-tq90c
      KBUILD_BUILD_TIMESTAMP: Thu Dec 5 14:47:59 UTC 2024
      KBUILD_BUILD_VERSION: '1'
      SOURCE_DATE_EPOCH: '1733410079'
      KBUILD_FIXED_SCM_SUFFIX: -g82179e362f33
      STOCK_KERNEL_RELEASE: 5.4.274-qgki-g82179e362f33
      P9_EFFECTIVE_KCFLAGS: -D__ANDROID_COMMON_KERNEL__

      # P7 calibrated boot-container identity.
      FINAL_BOOT_RELEASE_TAG: Final_Boot
      FINAL_BOOT_RELEASE_ASSET: Boot.img.zip
      FINAL_BOOT_RELEASE_ZIP_SHA256: 920f2aa04d495771506c9e34ef81776de50273bde82835553cadbb73a864b4b8
      FINAL_BOOT_REFERENCE_BOOT_SHA256: 2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e
      FINAL_BOOT_REFERENCE_KERNEL_SHA256: e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96
      ROLLBACK_GZIP_SHA256: 9a1532ccfc57b465256bba97863f927b80823fa8812a4d13e4f4c8bf9af0c78b
      STOCK_BOOT_SHA256: ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5
      STOCK_BOOT_BYTES: '134217728'
      STOCK_RAMDISK_SHA256: 0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a
      P9_BOOT_NAME: VEUX-GEN1-P9-5.4.274-ReSukiSU-Audited-SUSFS-2.3-boot.img

      # Proven successful AK3 checkpoint from the repository's W89 packaging line.
      # The previous P9 pin e3849cc81950620f8043e69c06e330935ade2eec does not exist upstream.
      AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
      AK3_COMMIT: af770f7b16cf8f8eb7c68614b2a693b3b361c90c

      BACKUP_DIR: ${{ github.workspace }}/p6v11-backup
      AUDIT_DIR: ${{ github.workspace }}/clean-gen1-p9-audit
      OUT_A: ${{ github.workspace }}/kernel/out-p9-a
      OUT_B: ${{ github.workspace }}/kernel/out-p9-b
      DIST_DIR: ${{ github.workspace }}/clean-gen1-p9-dist
      BOOT_WORK: ${{ github.workspace }}/p9-boot-calibration

    steps:
      - name: Initialize audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BACKUP_DIR" "$AUDIT_DIR" "$DIST_DIR" "$BOOT_WORK"
          mkdir -p "$BACKUP_DIR" "$AUDIT_DIR" "$DIST_DIR" "$BOOT_WORK"

          cat > "$AUDIT_DIR/00-plan.txt" <<'EOF'
          CLEAN GEN1 P9 boot-first release
          Base: exact last accepted P6-v11 FULL SUSFS 2.3 restore kit.
          Device: VEUX / Linux 5.4.274.
          Release order: Image -> calibrated boot.img -> boot audit -> AnyKernel3 ZIP -> AK3 audit.

          ReSukiSU update policy:
            1) f5992bfc policydb ebitmap buffer fix
            2) 5fe98409 WebView zygote allowlist refactor
            3) 830a5aed APK signing-block hardening

          Every commit is scope-audited before application.
          No full upstream merge/cherry-pick is allowed.
          SUSFS 2.3 outer-kernel implementation and KSU version identity are preserved.
          No real-device boot PASS is claimed by this workflow.
          EOF

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git jq \
            libelf-dev libssl-dev python3 unzip zip zstd

      - name: Checkout exact VEUX vendor source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: '20240619'
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Authenticate vendor source
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
          test "$(make -s kernelversion)" = "5.4.268"
          {
            echo "VENDOR_SHA=$(git rev-parse HEAD)"
            echo "VENDOR_KERNEL_VERSION=$(make -s kernelversion)"
          } | tee "$AUDIT_DIR/01-vendor.txt"

      - name: Locate newest non-expired P6-v11 FULL-SUSFS backup artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidates="$RUNNER_TEMP/p6v11-candidates.tsv"
          : > "$candidates"

          for page in $(seq 1 20); do
            json="$RUNNER_TEMP/artifacts-${page}.json"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}" \
              -o "$json"

            count="$(jq '.artifacts | length' "$json")"
            jq -r --arg prefix "$P6V11_ARTIFACT_PREFIX" '
              .artifacts[]
              | select(.expired == false)
              | select(.name | startswith($prefix))
              | [.created_at, (.id|tostring), .name, .archive_download_url]
              | @tsv
            ' "$json" >> "$candidates"

            test "$count" -eq 100 || break
          done

          test -s "$candidates"
          IFS=$'\t' read -r created artifact_id artifact_name archive_url \
            < <(LC_ALL=C sort -r "$candidates" | head -n1)

          test -n "$artifact_id"
          test -n "$artifact_name"
          test -n "$archive_url"

          {
            echo "P6V11_BACKUP_CREATED=$created"
            echo "P6V11_BACKUP_ARTIFACT_ID=$artifact_id"
            echo "P6V11_BACKUP_ARTIFACT_NAME=$artifact_name"
          } | tee "$AUDIT_DIR/02-backup-selection.txt"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$archive_url" -o "$RUNNER_TEMP/p6v11-backup.zip"

          unzip -q "$RUNNER_TEMP/p6v11-backup.zip" -d "$BACKUP_DIR"

          restore_dir="$(find "$BACKUP_DIR" -type d -name source-restore-kit -print -quit)"
          test -n "$restore_dir"
          test -f "$restore_dir/manifest.json"
          test -f "$restore_dir/SHA256SUMS"
          test -f "$restore_dir/p5i/resukisu-p5i-full.bundle"

          result_file="$(find "$BACKUP_DIR" -type f -name 17-result.txt -print -quit)"
          test -n "$result_file"
          grep -Fxq 'CLEAN_GEN1_P6V11_FULL_SUSFS_OUTER_INTEGRATION_DETERMINISTIC_BUILD=PASS' \
            "$result_file"

          echo "RESTORE_DIR=$restore_dir" >> "$GITHUB_ENV"
          echo "P6V11_RESULT_FILE=$result_file" >> "$GITHUB_ENV"

      - name: Verify backup checksums and manifest
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RESTORE_DIR"
            sha256sum -c SHA256SUMS
          ) | tee "$AUDIT_DIR/03-restore-kit-sha256.txt"

          if test -f "$RESTORE_DIR/p5i/SHA256SUMS"; then
            (
              cd "$RESTORE_DIR/p5i"
              sha256sum -c SHA256SUMS
            ) | tee "$AUDIT_DIR/03b-p5i-sha256.txt"
          fi

          jq -e \
            --arg p5commit "$EXPECTED_P5I_COMMIT" \
            --arg p5tree "$EXPECTED_P5I_TREE" \
            --arg rhead "$EXPECTED_RESUKISU_HEAD" \
            --arg rtree "$EXPECTED_RESUKISU_TREE" \
            '.stage == "CLEAN_GEN1_P6V11_SOURCE"
             and .p5i_commit == $p5commit
             and .p5i_tree == $p5tree
             and .resukisu_head == $rhead
             and .resukisu_tree == $rtree' \
            "$RESTORE_DIR/manifest.json" >/dev/null

          cp "$RESTORE_DIR/manifest.json" "$AUDIT_DIR/03-source-manifest.json"

      - name: Restore exact accepted P6-v11 source tree
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git reset --hard "$EXPECTED_VENDOR_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"

          p5_patch="$RESTORE_DIR/p5i/vendor-20240619-to-p5i-outer.patch"
          p6_patch="$RESTORE_DIR/p5i-to-p6-source-compat.patch"
          p6v11_patch="$RESTORE_DIR/p6v10-to-p6v11-full-susfs-outer.patch"

          for patch in "$p5_patch" "$p6_patch" "$p6v11_patch"; do
            test -s "$patch"
          done

          git apply --check --whitespace=error --binary "$p5_patch"
          git apply --index --whitespace=error --binary "$p5_patch"
          test "$(git write-tree)" = "$EXPECTED_P5I_TREE"

          git apply --check --whitespace=error --binary "$p6_patch"
          git apply --index --whitespace=error --binary "$p6_patch"

          git apply --check --whitespace=error --binary "$p6v11_patch"
          git apply --index --whitespace=error --binary "$p6v11_patch"

          final_expected_tree="$(jq -r '.p6_source_tree' "$RESTORE_DIR/manifest.json")"
          test "$final_expected_tree" != "null"
          test "${#final_expected_tree}" -eq 40
          test "$(git write-tree)" = "$final_expected_tree"
          test "$(make -s kernelversion)" = "5.4.274"

          rm -rf KernelSU
          git init -q KernelSU
          git -C KernelSU fetch -q \
            "$RESTORE_DIR/p5i/resukisu-p5i-full.bundle" \
            refs/heads/clean-gen1-p5i-resukisu:refs/heads/clean-gen1-p5i-resukisu
          git -C KernelSU checkout -q --detach refs/heads/clean-gen1-p5i-resukisu

          test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_RESUKISU_HEAD"
          test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_RESUKISU_TREE"

          {
            echo "P6V11_OUTER_TREE=$final_expected_tree"
            echo "P6V11_RESUKISU_HEAD=$(git -C KernelSU rev-parse HEAD)"
            echo "P6V11_RESUKISU_TREE=$(git -C KernelSU rev-parse HEAD^{tree})"
          } | tee "$AUDIT_DIR/04-restored-source.txt"

      - name: Freeze SUSFS 2.3 baseline before ReSukiSU update
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          grep -Fxq 'CONFIG_KSU=y' arch/arm64/configs/veux_defconfig
          grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' arch/arm64/configs/veux_defconfig
          grep -Fxq 'CONFIG_KSU_SUSFS=y' arch/arm64/configs/veux_defconfig
          grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' arch/arm64/configs/veux_defconfig
          grep -Fxq 'CONFIG_LOCALVERSION="-qgki"' arch/arm64/configs/veux_defconfig

          grep -Fq 'DEFINE_SRCU(susfs_srcu_open_redirect)' fs/susfs.c
          grep -Fq 'srcu_read_lock(&susfs_srcu_open_redirect)' fs/susfs.c
          grep -Fq 'hash_for_each_possible_rcu(OPEN_REDIRECT_HLIST' fs/susfs.c
          grep -Fq 'srcu_read_unlock(&susfs_srcu_open_redirect' fs/susfs.c
          grep -Fq 'synchronize_srcu(&susfs_srcu_open_redirect)' fs/susfs.c
          grep -Fq 'susfs_set_current_proc_no_su' include/linux/susfs_def.h
          grep -Fq 'susfs_set_current_proc_umounted' include/linux/susfs_def.h
          grep -Fq 'susfs_set_current_proc_umounted_for_zygote_next' include/linux/susfs_def.h
          grep -Fq 'susfs_set_current_proc_no_su' KernelSU/kernel/hook/setuid_hook.c
          grep -Fq 'susfs_set_current_proc_umounted_for_zygote_next' KernelSU/kernel/hook/setuid_hook.c
          test -s KernelSU/kernel/tools/susfs_compat.mk

          sha256sum \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h \
            KernelSU/kernel/tools/susfs_compat.mk \
            > "$AUDIT_DIR/05-susfs-before.sha256"
          sha256sum KernelSU/kernel/Kbuild > "$AUDIT_DIR/05-ksu-kbuild-before.sha256"

      - name: Fetch immutable reviewed ReSukiSU commits
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/resukisu-upstream"
          git clone -q --no-tags "$RESUKISU_REPO" "$GITHUB_WORKSPACE/resukisu-upstream"

          for sha in "$R1_POLICYDB_FIX" "$R2_WEBVIEW_ALLOWLIST" "$R3_APK_SIGN_HARDENING"; do
            git -C "$GITHUB_WORKSPACE/resukisu-upstream" cat-file -e "${sha}^{commit}"
            git -C "$GITHUB_WORKSPACE/resukisu-upstream" cat-file -e "${sha}^{tree}"
          done

          {
            echo "R1=$R1_POLICYDB_FIX"
            echo "R2=$R2_WEBVIEW_ALLOWLIST"
            echo "R3=$R3_APK_SIGN_HARDENING"
          } | tee "$AUDIT_DIR/06-reviewed-commits.txt"

      - name: Audit exact upstream kernel path scopes
        shell: bash
        run: |
          set -euo pipefail
          up="$GITHUB_WORKSPACE/resukisu-upstream"

          check_scope() {
            local label="$1" sha="$2" expected_file="$3"
            local actual="$AUDIT_DIR/${label}-actual-paths.txt"
            git -C "$up" diff --name-only "${sha}^" "$sha" -- kernel | LC_ALL=C sort > "$actual"
            diff -u "$expected_file" "$actual"
          }

          printf '%s\n' kernel/selinux/sepolicy.c > "$AUDIT_DIR/r1-expected-paths.txt"
          printf '%s\n' \
            kernel/feature/kernel_umount.c \
            kernel/feature/kernel_umount.h \
            kernel/hook/setuid_hook.c \
            kernel/policy/allowlist.c \
            | LC_ALL=C sort > "$AUDIT_DIR/r2-expected-paths.txt"
          printf '%s\n' kernel/manager/apk_sign.c > "$AUDIT_DIR/r3-expected-paths.txt"

          check_scope r1 "$R1_POLICYDB_FIX" "$AUDIT_DIR/r1-expected-paths.txt"
          check_scope r2 "$R2_WEBVIEW_ALLOWLIST" "$AUDIT_DIR/r2-expected-paths.txt"
          check_scope r3 "$R3_APK_SIGN_HARDENING" "$AUDIT_DIR/r3-expected-paths.txt"

          echo 'REVIEWED_KERNEL_PATH_SCOPES=PASS' | tee "$AUDIT_DIR/07-scope-result.txt"

      - name: Apply R1 policydb fix fail-closed
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          apply_reviewed_delta() {
            local label="$1" sha="$2"; shift 2
            local up="$GITHUB_WORKSPACE/resukisu-upstream"
            local patch="$AUDIT_DIR/${label}.patch"
            local parent
            parent="$(git -C "$up" rev-parse "${sha}^")"

            git -C "$up" diff --binary "$parent" "$sha" -- "$@" > "$patch"
            test -s "$patch"

            if git -C KernelSU apply --reverse --check "$patch" >/dev/null 2>&1; then
              echo "${label}=ALREADY_EQUIVALENT" | tee "$AUDIT_DIR/${label}-apply.txt"
              return 0
            fi
            if git -C KernelSU apply --check --whitespace=error "$patch"; then
              git -C KernelSU apply --index --whitespace=error "$patch"
              echo "${label}=CLEAN_APPLY" | tee "$AUDIT_DIR/${label}-apply.txt"
              return 0
            fi

            git -C KernelSU fetch -q --no-tags "$RESUKISU_REPO" "$parent" "$sha"
            if ! git -C KernelSU apply --3way --check "$patch"; then
              echo "${label}=INCOMPATIBLE_WITH_CURRENT_TREE" | tee "$AUDIT_DIR/${label}-apply.txt"
              exit 1
            fi
            git -C KernelSU apply --3way --index "$patch"
            test -z "$(git -C KernelSU ls-files -u)"
            git -C KernelSU diff --check
            echo "${label}=THREE_WAY_CLEAN" | tee "$AUDIT_DIR/${label}-apply.txt"
          }

          apply_reviewed_delta r1 "$R1_POLICYDB_FIX" kernel/selinux/sepolicy.c

          f=KernelSU/kernel/selinux/sepolicy.c
          grep -Fq 'old_db->p_types.nprim * (sizeof(u32) + sizeof(u64))' "$f"
          grep -Fq 'len -= fp.len;' "$f"
          grep -Fq 'new_db->len = len;' "$f"
          ! grep -Fq 'new_db->len = old_db->len;' "$f"

      - name: Apply R2 WebView allowlist refactor fail-closed
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          up="$GITHUB_WORKSPACE/resukisu-upstream"
          patch="$AUDIT_DIR/r2.patch"
          parent="$(git -C "$up" rev-parse "${R2_WEBVIEW_ALLOWLIST}^")"

          git -C "$up" diff --binary "$parent" "$R2_WEBVIEW_ALLOWLIST" -- \
            kernel/feature/kernel_umount.c \
            kernel/feature/kernel_umount.h \
            kernel/hook/setuid_hook.c \
            kernel/policy/allowlist.c > "$patch"
          test -s "$patch"

          if git -C KernelSU apply --reverse --check "$patch" >/dev/null 2>&1; then
            echo 'r2=ALREADY_EQUIVALENT' | tee "$AUDIT_DIR/r2-apply.txt"
          elif git -C KernelSU apply --check --whitespace=error "$patch"; then
            git -C KernelSU apply --index --whitespace=error "$patch"
            echo 'r2=CLEAN_APPLY' | tee "$AUDIT_DIR/r2-apply.txt"
          else
            git -C KernelSU fetch -q --no-tags "$RESUKISU_REPO" "$parent" "$R2_WEBVIEW_ALLOWLIST"
            if ! git -C KernelSU apply --3way --check "$patch"; then
              echo 'r2=INCOMPATIBLE_WITH_CURRENT_WEBVIEW_BACKPORT' | tee "$AUDIT_DIR/r2-apply.txt"
              exit 1
            fi
            git -C KernelSU apply --3way --index "$patch"
            test -z "$(git -C KernelSU ls-files -u)"
            git -C KernelSU diff --check
            echo 'r2=THREE_WAY_CLEAN' | tee "$AUDIT_DIR/r2-apply.txt"
          fi

          ! grep -RFn 'ksu_webview_zygote_umount_enabled' \
            KernelSU/kernel/feature/kernel_umount.c \
            KernelSU/kernel/feature/kernel_umount.h \
            KernelSU/kernel/hook/setuid_hook.c \
            KernelSU/kernel/policy/allowlist.c
          ! grep -RFn 'KSU_FEATURE_WEBVIEW_ZYGOTE_UMOUNT' \
            KernelSU/kernel/feature/kernel_umount.c \
            KernelSU/kernel/feature/kernel_umount.h \
            KernelSU/kernel/hook/setuid_hook.c \
            KernelSU/kernel/policy/allowlist.c
          grep -Fq 'new_uid != WEBVIEW_ZYGOTE_UID' KernelSU/kernel/feature/kernel_umount.c
          grep -Fq 'ksu_uid_should_umount(new_uid)' KernelSU/kernel/feature/kernel_umount.c
          grep -Fq 'Now app_profile for webview_zygote is available in KernelSU manager' \
            KernelSU/kernel/hook/setuid_hook.c
          ! grep -Fq 'WEBVIEW_ZYGOTE_UID' KernelSU/kernel/policy/allowlist.c

      - name: Apply R3 APK-signing hardening fail-closed
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          up="$GITHUB_WORKSPACE/resukisu-upstream"
          patch="$AUDIT_DIR/r3.patch"
          parent="$(git -C "$up" rev-parse "${R3_APK_SIGN_HARDENING}^")"

          git -C "$up" diff --binary "$parent" "$R3_APK_SIGN_HARDENING" -- \
            kernel/manager/apk_sign.c > "$patch"
          test -s "$patch"

          if git -C KernelSU apply --reverse --check "$patch" >/dev/null 2>&1; then
            echo 'r3=ALREADY_EQUIVALENT' | tee "$AUDIT_DIR/r3-apply.txt"
          elif git -C KernelSU apply --check --whitespace=error "$patch"; then
            git -C KernelSU apply --index --whitespace=error "$patch"
            echo 'r3=CLEAN_APPLY' | tee "$AUDIT_DIR/r3-apply.txt"
          else
            git -C KernelSU fetch -q --no-tags "$RESUKISU_REPO" "$parent" "$R3_APK_SIGN_HARDENING"
            if ! git -C KernelSU apply --3way --check "$patch"; then
              echo 'r3=INCOMPATIBLE_WITH_CURRENT_APK_SIGN_CODE' | tee "$AUDIT_DIR/r3-apply.txt"
              exit 1
            fi
            git -C KernelSU apply --3way --index "$patch"
            test -z "$(git -C KernelSU ls-files -u)"
            git -C KernelSU diff --check
            echo 'r3=THREE_WAY_CLEAN' | tee "$AUDIT_DIR/r3-apply.txt"
          fi

          f=KernelSU/kernel/manager/apk_sign.c
          grep -Fq 'id == 0x7109871au' "$f"
          grep -Fq 'id != 0x42726577u' "$f"
          grep -Fq 'Unexpected signature block id' "$f"
          ! grep -Fq 'v3_signing_exist' "$f"
          ! grep -Fq 'v3_1_signing_exist' "$f"

      - name: Prove SUSFS and version-identity boundaries were not touched
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h \
            KernelSU/kernel/tools/susfs_compat.mk \
            > "$AUDIT_DIR/08-susfs-after.sha256"
          cmp -s "$AUDIT_DIR/05-susfs-before.sha256" "$AUDIT_DIR/08-susfs-after.sha256"

          sha256sum KernelSU/kernel/Kbuild > "$AUDIT_DIR/08-ksu-kbuild-after.sha256"
          cmp -s "$AUDIT_DIR/05-ksu-kbuild-before.sha256" "$AUDIT_DIR/08-ksu-kbuild-after.sha256"

          git -C KernelSU diff --name-only HEAD | LC_ALL=C sort > "$AUDIT_DIR/08-resukisu-changed-paths.txt"
          cat > "$AUDIT_DIR/08-expected-resukisu-changed-paths.txt" <<'EOF'
