name: CLEAN GEN1 P9 v5-v4 - Hardened AK3 packaging + same O= reproducibility + audited ReSukiSU + SUSFS 2.3

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: clean-gen1-p9v5-v4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ak3:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

      # Immutable builder-side reference identity: P9-v3 workflow that completed both kernel builds.
      P9V3_PATH: .github/workflows/clean-gen1-p9-resukisu-audited-kernel-update-susfs-2.3-ak3-v3.yml
      P9V3_BLOB_SHA: 810de534081ac9fb98f064ba65f523759e035855
      EXPECTED_P9V3_IMAGE_A_SHA256: 49e6f03678fb69541fb1d0de0e06676fedd094bbb08b4a1a5bbf914e2a7d2799
      EXPECTED_P9V3_VEUX_DTB_A_SHA256: 42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37

      VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
      VENDOR_TAG: '20240619'
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632

      # Exact accepted P6-v11 FULL-SUSFS-2.3 backup lineage used by P9-v3.
      P6V11_ARTIFACT_PREFIX: clean-gen1-p6v11-v6-full-susfs-outer-integration-p7-test-boot-
      EXPECTED_P5I_COMMIT: f353a9475e40ca866d570c1d0ef55e24cf6556e4
      EXPECTED_P5I_TREE: a947c1f2891c796a08373fc755e29b23139dc761
      EXPECTED_RESUKISU_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_RESUKISU_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      EXPECTED_KSU_VERSION: '35102'

      # Exactly the three reviewed kernel deltas already selected by P9-v3.
      RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
      R1_POLICYDB_FIX: f5992bfce3b292c69989ae8f41e49769563d2db9
      R2_WEBVIEW_ALLOWLIST: 5fe98409dc52506f7a5cc1bb8f94d6f5c849b7f0
      R3_APK_SIGN_HARDENING: 830a5aedc742cb7399cccb61df60d55fd7cbcb90

      # ReSukiSU main observed 2026-09-11. The commits after R3 are manager-only.
      # This ref is audit evidence only and is NEVER merged/cherry-picked.
      AUDITED_UPSTREAM_HEAD: 246d3e52e667cb72ce8f70c93b70d3b42b100b76

      # Explicitly excluded from automatic inclusion in this CLEAN-GEN1 line.
      EXCLUDED_RESUKISU_COMMIT: b2ac2fc8703ce9f5226e2a38a59f8b72f8a3005c

      # P6-v11/P9-v3 proven build identity and toolchain.
      CLANG_PREBUILT_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      KBUILD_BUILD_USER: builder
      KBUILD_BUILD_HOST: pangu-build-component-vendor-345942-54r9t-tw0tk-tq90c
      KBUILD_BUILD_TIMESTAMP: Thu Dec 5 14:47:59 UTC 2024
      KBUILD_BUILD_VERSION: '1'
      SOURCE_DATE_EPOCH: '1733410079'
      KBUILD_FIXED_SCM_SUFFIX: -g82179e362f33
      STOCK_KERNEL_RELEASE: 5.4.274-qgki-g82179e362f33
      P9_EFFECTIVE_KCFLAGS: -D__ANDROID_COMMON_KERNEL__

      AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
      PREVIOUS_UNRESOLVABLE_AK3_COMMIT: e3849cc81950620f8043e69c06e330935ade2eec
      AK3_COMMIT: af770f7b16cf8f8eb7c68614b2a693b3b361c90c

      BACKUP_DIR: ${{ github.workspace }}/p6v11-backup
      AUDIT_DIR: ${{ github.workspace }}/clean-gen1-p9v5-v4-audit
      OUT_DIR: ${{ github.workspace }}/kernel/out-p9-a
      DIST_DIR: ${{ github.workspace }}/clean-gen1-p9v5-v4-dist

    steps:
      - name: Initialize audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BACKUP_DIR" "$AUDIT_DIR" "$DIST_DIR"
          mkdir -p "$BACKUP_DIR" "$AUDIT_DIR" "$DIST_DIR"

          cat > "$AUDIT_DIR/00-plan.txt" <<'EOF'
          CLEAN GEN1 P9 v5-v4
          Reference workflow: exact P9-v3 source identity (not used as a source artifact parent).
          Kernel source base: exact accepted P6-v11 FULL SUSFS 2.3 restore kit.
          Device: VEUX only.
          Linux target: 5.4.274.
          Output: AnyKernel3 ZIP carrying Image only.

          Functional kernel delta policy:
            R1 f5992bfc policydb ebitmap buffer fix
            R2 5fe98409 WebView zygote allowlist refactor
            R3 830a5aed APK signing-block hardening

          No fourth ReSukiSU kernel delta is introduced by P9-v5-v4.
          P9-v5-v3 run 34556952285 proved the narrow same-absolute-O= hypothesis:
          Build A and Build B were byte-identical for .config, Image, VEUX DTB and all DTBs.
          Its kernel/reproducibility checkpoint is retained exactly, including the same
          absolute O= path kernel/out-p9-a and the archived P9-v3 Build-A continuity hashes.
          P9-v5-v4 changes only the AnyKernel3 packaging/audit path after those gates.
          The old AK3 pin e3849cc81950620f8043e69c06e330935ade2eec is no longer
          resolvable in the official osm0sis/AnyKernel3 repository. Packaging is therefore
          pinned to verified official commit af770f7b16cf8f8eb7c68614b2a693b3b361c90c,
          the immediate parent before the 2026-09-05 Magisk-utils v31 beta update.
          The AK3 stage is fail-closed and writes stage evidence before each later gate,
          verifies the pinned AK3 checkout, source/copy Image identity, exact AK3 properties,
          ZIP integrity and a root-Image extraction roundtrip. A packaging failure therefore
          remains diagnosable from the always-uploaded audit artifact.
          The actual VEUX DTB is vendor/xiaomi/veux.dtb; no qcom path is used.
          ReSukiSU main observed at 246d3e52 is used only as an audit boundary.
          R3..246d3e52 must contain no kernel/, uapi/, or userspace/ksud change.
          Live upstream may advance, but any new kernel/uapi/ksud delta is fatal and
          must receive a separate review before a future workflow may include it.

          SUSFS 2.3 outer implementation remains byte-for-byte preserved.
          No full ReSukiSU merge or full cherry-pick is allowed.
          No KSU version/API spoofing is allowed.
          EOF

      - name: Checkout builder repository for P9-v3 reference identity
        uses: actions/checkout@v7
        with:
          path: builder-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate exact P9-v3 reference workflow
        shell: bash
        run: |
          set -euo pipefail
          reference="$GITHUB_WORKSPACE/builder-repo/$P9V3_PATH"
          test -s "$reference"
          actual="$(git -C "$GITHUB_WORKSPACE/builder-repo" hash-object "$P9V3_PATH")"
          test "$actual" = "$P9V3_BLOB_SHA"
          {
            echo "P9V3_PATH=$P9V3_PATH"
            echo "P9V3_BLOB_EXPECTED=$P9V3_BLOB_SHA"
            echo "P9V3_BLOB_ACTUAL=$actual"
            echo "P9V3_REFERENCE_IDENTITY=PASS"
          } | tee "$AUDIT_DIR/01-p9v3-reference.txt"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git jq \
            libelf-dev libssl-dev python3 unzip zip zstd

      - name: Checkout exact VEUX vendor source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: '20240619'
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Authenticate vendor source
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
          test "$(make -s kernelversion)" = "5.4.268"
          {
            echo "VENDOR_SHA=$(git rev-parse HEAD)"
            echo "VENDOR_KERNEL_VERSION=$(make -s kernelversion)"
          } | tee "$AUDIT_DIR/02-vendor.txt"

      - name: Locate newest non-expired P6-v11 FULL-SUSFS backup artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidates="$RUNNER_TEMP/p6v11-candidates.tsv"
          : > "$candidates"

          for page in $(seq 1 20); do
            json="$RUNNER_TEMP/artifacts-${page}.json"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}" \
              -o "$json"

            count="$(jq '.artifacts | length' "$json")"
            jq -r --arg prefix "$P6V11_ARTIFACT_PREFIX" '
              .artifacts[]
              | select(.expired == false)
              | select(.name | startswith($prefix))
              | [.created_at, (.id|tostring), .name, .archive_download_url]
              | @tsv
            ' "$json" >> "$candidates"
            test "$count" -eq 100 || break
          done

          test -s "$candidates"
          IFS=$'\t' read -r created artifact_id artifact_name archive_url \
            < <(LC_ALL=C sort -r "$candidates" | head -n1)
          test -n "$artifact_id"
          test -n "$artifact_name"
          test -n "$archive_url"

          {
            echo "P6V11_BACKUP_CREATED=$created"
            echo "P6V11_BACKUP_ARTIFACT_ID=$artifact_id"
            echo "P6V11_BACKUP_ARTIFACT_NAME=$artifact_name"
          } | tee "$AUDIT_DIR/03-backup-selection.txt"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$archive_url" -o "$RUNNER_TEMP/p6v11-backup.zip"
          unzip -q "$RUNNER_TEMP/p6v11-backup.zip" -d "$BACKUP_DIR"

          restore_dir="$(find "$BACKUP_DIR" -type d -name source-restore-kit -print -quit)"
          result_file="$(find "$BACKUP_DIR" -type f -name 17-result.txt -print -quit)"
          test -n "$restore_dir"
          test -n "$result_file"
          test -f "$restore_dir/manifest.json"
          test -f "$restore_dir/SHA256SUMS"
          test -f "$restore_dir/p5i/resukisu-p5i-full.bundle"
          grep -Fxq 'CLEAN_GEN1_P6V11_FULL_SUSFS_OUTER_INTEGRATION_DETERMINISTIC_BUILD=PASS' \
            "$result_file"

          echo "RESTORE_DIR=$restore_dir" >> "$GITHUB_ENV"
          echo "P6V11_RESULT_FILE=$result_file" >> "$GITHUB_ENV"

      - name: Verify backup and restore exact accepted P6-v11 source
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RESTORE_DIR"
            sha256sum -c SHA256SUMS
          ) | tee "$AUDIT_DIR/04-restore-kit-sha256.txt"

          if test -f "$RESTORE_DIR/p5i/SHA256SUMS"; then
            (
              cd "$RESTORE_DIR/p5i"
              sha256sum -c SHA256SUMS
            ) | tee "$AUDIT_DIR/04b-p5i-sha256.txt"
          fi

          jq -e \
            --arg p5commit "$EXPECTED_P5I_COMMIT" \
            --arg p5tree "$EXPECTED_P5I_TREE" \
            --arg rhead "$EXPECTED_RESUKISU_HEAD" \
            --arg rtree "$EXPECTED_RESUKISU_TREE" \
            '.stage == "CLEAN_GEN1_P6V11_SOURCE"
             and .p5i_commit == $p5commit
             and .p5i_tree == $p5tree
             and .resukisu_head == $rhead
             and .resukisu_tree == $rtree' \
            "$RESTORE_DIR/manifest.json" >/dev/null
          cp "$RESTORE_DIR/manifest.json" "$AUDIT_DIR/04-source-manifest.json"

          git reset --hard "$EXPECTED_VENDOR_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"

          p5_patch="$RESTORE_DIR/p5i/vendor-20240619-to-p5i-outer.patch"
          p6_patch="$RESTORE_DIR/p5i-to-p6-source-compat.patch"
          p6v11_patch="$RESTORE_DIR/p6v10-to-p6v11-full-susfs-outer.patch"
          for patch in "$p5_patch" "$p6_patch" "$p6v11_patch"; do
            test -s "$patch"
          done

          git apply --check --whitespace=error --binary "$p5_patch"
          git apply --index --whitespace=error --binary "$p5_patch"
          test "$(git write-tree)" = "$EXPECTED_P5I_TREE"

          git apply --check --whitespace=error --binary "$p6_patch"
          git apply --index --whitespace=error --binary "$p6_patch"

          git apply --check --whitespace=error --binary "$p6v11_patch"
          git apply --index --whitespace=error --binary "$p6v11_patch"

          final_expected_tree="$(jq -r '.p6_source_tree' "$RESTORE_DIR/manifest.json")"
          test "$final_expected_tree" != "null"
          test "${#final_expected_tree}" -eq 40
          test "$(git write-tree)" = "$final_expected_tree"
          test "$(make -s kernelversion)" = "5.4.274"

          rm -rf KernelSU
          git init -q KernelSU
          git -C KernelSU fetch -q \
            "$RESTORE_DIR/p5i/resukisu-p5i-full.bundle" \
            refs/heads/clean-gen1-p5i-resukisu:refs/heads/clean-gen1-p5i-resukisu
          git -C KernelSU checkout -q --detach refs/heads/clean-gen1-p5i-resukisu
          test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_RESUKISU_HEAD"
          test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_RESUKISU_TREE"

          {
            echo "P6V11_OUTER_TREE=$final_expected_tree"
            echo "P6V11_RESUKISU_HEAD=$(git -C KernelSU rev-parse HEAD)"
            echo "P6V11_RESUKISU_TREE=$(git -C KernelSU rev-parse HEAD^{tree})"
            echo "RESTORED_KERNEL_VERSION=$(make -s kernelversion)"
          } | tee "$AUDIT_DIR/05-restored-source.txt"

      - name: Freeze SUSFS 2.3 and ReSukiSU identity boundaries
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'CONFIG_KSU=y' arch/arm64/configs/veux_defconfig
          grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' arch/arm64/configs/veux_defconfig
          grep -Fxq 'CONFIG_KSU_SUSFS=y' arch/arm64/configs/veux_defconfig
          grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' arch/arm64/configs/veux_defconfig
          grep -Fxq 'CONFIG_LOCALVERSION="-qgki"' arch/arm64/configs/veux_defconfig

          grep -Fq 'DEFINE_SRCU(susfs_srcu_open_redirect)' fs/susfs.c
          grep -Fq 'srcu_read_lock(&susfs_srcu_open_redirect)' fs/susfs.c
          grep -Fq 'hash_for_each_possible_rcu(OPEN_REDIRECT_HLIST' fs/susfs.c
          grep -Fq 'srcu_read_unlock(&susfs_srcu_open_redirect' fs/susfs.c
          grep -Fq 'synchronize_srcu(&susfs_srcu_open_redirect)' fs/susfs.c
          grep -Fq 'susfs_set_current_proc_no_su' include/linux/susfs_def.h
          grep -Fq 'susfs_set_current_proc_umounted_for_zygote_next' include/linux/susfs_def.h
          grep -Fq 'susfs_set_current_proc_no_su' KernelSU/kernel/hook/setuid_hook.c
          grep -Fq 'susfs_set_current_proc_umounted_for_zygote_next' KernelSU/kernel/hook/setuid_hook.c
          test -s KernelSU/kernel/tools/susfs_compat.mk

          sha256sum \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h \
            KernelSU/kernel/tools/susfs_compat.mk \
            > "$AUDIT_DIR/06-susfs-before.sha256"
          sha256sum KernelSU/kernel/Kbuild > "$AUDIT_DIR/06-ksu-kbuild-before.sha256"

      - name: Clone ReSukiSU and enforce current upstream delta gate
        shell: bash
        run: |
          set -euo pipefail
          up="$GITHUB_WORKSPACE/resukisu-upstream"
          rm -rf "$up"
          git clone -q --no-tags "$RESUKISU_REPO" "$up"

          for sha in \
            "$R1_POLICYDB_FIX" \
            "$R2_WEBVIEW_ALLOWLIST" \
            "$R3_APK_SIGN_HARDENING" \
            "$AUDITED_UPSTREAM_HEAD" \
            "$EXCLUDED_RESUKISU_COMMIT"; do
            git -C "$up" cat-file -e "${sha}^{commit}"
          done

          git -C "$up" merge-base --is-ancestor "$R3_APK_SIGN_HARDENING" "$AUDITED_UPSTREAM_HEAD"
          test "$(git -C "$up" rev-list --count "$R3_APK_SIGN_HARDENING..$AUDITED_UPSTREAM_HEAD")" -eq 3

          # As audited on 2026-09-11, the three commits after R3 are manager-only.
          git -C "$up" diff --name-status \
            "$R3_APK_SIGN_HARDENING..$AUDITED_UPSTREAM_HEAD" \
            > "$AUDIT_DIR/07-r3-to-audited-head-files.txt"
          git -C "$up" diff --quiet \
            "$R3_APK_SIGN_HARDENING..$AUDITED_UPSTREAM_HEAD" -- \
            kernel uapi userspace/ksud

          live="$(git -C "$up" rev-parse origin/main)"
          {
            echo "R3_KERNEL_BOUNDARY=$R3_APK_SIGN_HARDENING"
            echo "AUDITED_UPSTREAM_HEAD=$AUDITED_UPSTREAM_HEAD"
            echo "LIVE_UPSTREAM_HEAD=$live"
            echo "R3_TO_AUDITED_SENSITIVE_SCOPE=UNCHANGED"
          } | tee "$AUDIT_DIR/07-upstream-gate.txt"

          if test "$live" != "$AUDITED_UPSTREAM_HEAD"; then
            git -C "$up" merge-base --is-ancestor "$AUDITED_UPSTREAM_HEAD" "$live" || {
              echo 'LIVE_UPSTREAM_DIVERGED_FROM_AUDITED_HEAD=FAIL' >&2
              exit 1
            }
            git -C "$up" diff --name-status "$AUDITED_UPSTREAM_HEAD..$live" \
              > "$AUDIT_DIR/07-live-new-files.txt"
            if ! git -C "$up" diff --quiet "$AUDITED_UPSTREAM_HEAD..$live" -- \
              kernel uapi userspace/ksud; then
              echo 'NEW_RESUKISU_KERNEL_UAPI_OR_KSUD_DELTA_REVIEW_REQUIRED=FAIL' \
                | tee -a "$AUDIT_DIR/07-upstream-gate.txt"
              exit 1
            fi
            echo 'LIVE_ADVANCE_MANAGER_OR_OTHER_ONLY=PASS' \
              | tee -a "$AUDIT_DIR/07-upstream-gate.txt"
          else
            echo 'LIVE_HEAD_MATCHES_AUDITED_HEAD=PASS' \
              | tee -a "$AUDIT_DIR/07-upstream-gate.txt"
          fi

          echo "RESUKISU_UPSTREAM_DIR=$up" >> "$GITHUB_ENV"

      - name: Audit exact selected ReSukiSU kernel path scopes
        shell: bash
        run: |
          set -euo pipefail
          up="$RESUKISU_UPSTREAM_DIR"

          check_scope() {
            local label="$1" sha="$2" expected_file="$3"
            local actual="$AUDIT_DIR/${label}-actual-paths.txt"
            git -C "$up" diff --name-only "${sha}^" "$sha" -- kernel \
              | LC_ALL=C sort > "$actual"
            diff -u "$expected_file" "$actual"
          }

          printf '%s\n' kernel/selinux/sepolicy.c \
            > "$AUDIT_DIR/r1-expected-paths.txt"
          printf '%s\n' \
            kernel/feature/kernel_umount.c \
            kernel/feature/kernel_umount.h \
            kernel/hook/setuid_hook.c \
            kernel/policy/allowlist.c \
            | LC_ALL=C sort > "$AUDIT_DIR/r2-expected-paths.txt"
          printf '%s\n' kernel/manager/apk_sign.c \
            > "$AUDIT_DIR/r3-expected-paths.txt"

          check_scope r1 "$R1_POLICYDB_FIX" "$AUDIT_DIR/r1-expected-paths.txt"
          check_scope r2 "$R2_WEBVIEW_ALLOWLIST" "$AUDIT_DIR/r2-expected-paths.txt"
          check_scope r3 "$R3_APK_SIGN_HARDENING" "$AUDIT_DIR/r3-expected-paths.txt"
          echo 'REVIEWED_KERNEL_PATH_SCOPES=PASS' | tee "$AUDIT_DIR/08-scope-result.txt"

      - name: Apply only the three reviewed ReSukiSU kernel deltas
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          up="$RESUKISU_UPSTREAM_DIR"

          apply_reviewed_delta() {
            local label="$1" sha="$2"; shift 2
            local patch="$AUDIT_DIR/${label}.patch"
            local parent
            parent="$(git -C "$up" rev-parse "${sha}^")"
            git -C "$up" diff --binary "$parent" "$sha" -- "$@" > "$patch"
            test -s "$patch"

            if git -C KernelSU apply --reverse --check "$patch" >/dev/null 2>&1; then
              echo "${label}=ALREADY_EQUIVALENT" | tee "$AUDIT_DIR/${label}-apply.txt"
              return 0
            fi

            if git -C KernelSU apply --check --whitespace=error "$patch"; then
              git -C KernelSU apply --index --whitespace=error "$patch"
              echo "${label}=CLEAN_APPLY" | tee "$AUDIT_DIR/${label}-apply.txt"
              return 0
            fi

            git -C KernelSU fetch -q --no-tags "$RESUKISU_REPO" "$parent" "$sha"
            if ! git -C KernelSU apply --3way --check "$patch"; then
              echo "${label}=INCOMPATIBLE_WITH_CURRENT_TREE" | tee "$AUDIT_DIR/${label}-apply.txt"
              exit 1
            fi
            git -C KernelSU apply --3way --index "$patch"
            test -z "$(git -C KernelSU ls-files -u)"
            git -C KernelSU diff --check
            echo "${label}=THREE_WAY_CLEAN" | tee "$AUDIT_DIR/${label}-apply.txt"
          }

          apply_reviewed_delta r1 "$R1_POLICYDB_FIX" \
            kernel/selinux/sepolicy.c
          apply_reviewed_delta r2 "$R2_WEBVIEW_ALLOWLIST" \
            kernel/feature/kernel_umount.c \
            kernel/feature/kernel_umount.h \
            kernel/hook/setuid_hook.c \
            kernel/policy/allowlist.c
          apply_reviewed_delta r3 "$R3_APK_SIGN_HARDENING" \
            kernel/manager/apk_sign.c

          # R1 semantic postconditions.
          f=KernelSU/kernel/selinux/sepolicy.c
          grep -Fq 'old_db->p_types.nprim * (sizeof(u32) + sizeof(u64))' "$f"
          grep -Fq 'len -= fp.len;' "$f"
          grep -Fq 'new_db->len = len;' "$f"
          ! grep -Fq 'new_db->len = old_db->len;' "$f"

          # R2 semantic postconditions: old independent WebView global feature is gone.
          ! grep -RFn 'ksu_webview_zygote_umount_enabled' \
            KernelSU/kernel/feature/kernel_umount.c \
            KernelSU/kernel/feature/kernel_umount.h \
            KernelSU/kernel/hook/setuid_hook.c \
            KernelSU/kernel/policy/allowlist.c
          ! grep -RFn 'KSU_FEATURE_WEBVIEW_ZYGOTE_UMOUNT' \
            KernelSU/kernel/feature/kernel_umount.c \
            KernelSU/kernel/feature/kernel_umount.h \
            KernelSU/kernel/hook/setuid_hook.c \
            KernelSU/kernel/policy/allowlist.c
          grep -Fq 'new_uid != WEBVIEW_ZYGOTE_UID' KernelSU/kernel/feature/kernel_umount.c
          grep -Fq 'ksu_uid_should_umount(new_uid)' KernelSU/kernel/feature/kernel_umount.c
          grep -Fq 'Now app_profile for webview_zygote is available in KernelSU manager' \
            KernelSU/kernel/hook/setuid_hook.c
          ! grep -Fq 'WEBVIEW_ZYGOTE_UID' KernelSU/kernel/policy/allowlist.c

          # R3 semantic postconditions.
          f=KernelSU/kernel/manager/apk_sign.c
          grep -Fq 'id == 0x7109871au' "$f"
          grep -Fq 'id != 0x42726577u' "$f"
          grep -Fq 'Unexpected signature block id' "$f"
          ! grep -Fq 'v3_signing_exist' "$f"
          ! grep -Fq 'v3_1_signing_exist' "$f"

      - name: Prove SUSFS and KSU identity boundaries remain unchanged
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h \
            KernelSU/kernel/tools/susfs_compat.mk \
            > "$AUDIT_DIR/09-susfs-after.sha256"
          cmp -s "$AUDIT_DIR/06-susfs-before.sha256" "$AUDIT_DIR/09-susfs-after.sha256"

          sha256sum KernelSU/kernel/Kbuild > "$AUDIT_DIR/09-ksu-kbuild-after.sha256"
          cmp -s "$AUDIT_DIR/06-ksu-kbuild-before.sha256" "$AUDIT_DIR/09-ksu-kbuild-after.sha256"

          git -C KernelSU diff --name-only HEAD | LC_ALL=C sort \
            > "$AUDIT_DIR/09-resukisu-changed-paths.txt"
          cat > "$AUDIT_DIR/09-allowed-resukisu-paths.txt" <<'EOF'
          kernel/feature/kernel_umount.c
          kernel/feature/kernel_umount.h
          kernel/hook/setuid_hook.c
          kernel/manager/apk_sign.c
          kernel/policy/allowlist.c
          kernel/selinux/sepolicy.c
          EOF
          while IFS= read -r path; do
            grep -Fxq "$path" "$AUDIT_DIR/09-allowed-resukisu-paths.txt"
          done < "$AUDIT_DIR/09-resukisu-changed-paths.txt"

          grep -Fq 'CLEAN_GEN1_UPSTREAM_COMPAT_VERSION' KernelSU/kernel/Kbuild
          grep -Eq '35102' KernelSU/kernel/Kbuild
          git -C KernelSU diff --check
          test -z "$(git -C KernelSU ls-files -u)"

          git -C KernelSU diff --binary HEAD > "$AUDIT_DIR/09-p9v5-v4-resukisu-delta.patch"
          test -s "$AUDIT_DIR/09-p9v5-v4-resukisu-delta.patch"

          {
            echo 'SUSFS_2_3_BASELINE_BYTE_PRESERVED=PASS'
            echo 'KSU_KBUILD_IDENTITY_BYTE_PRESERVED=PASS'
            echo "KSU_VERSION_IDENTITY_EXPECTED=$EXPECTED_KSU_VERSION"
            echo 'MANAGER_API4_SPOOFED=NO'
            echo 'APPROVED_RESUKISU_DELTA_SCOPE=PASS'
            echo 'NEW_RESUKISU_KERNEL_DELTA_ADDED_BY_P9V5V4=NO'
          } | tee "$AUDIT_DIR/09-boundaries.txt"

      - name: Install pinned Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TOOLCHAIN_DIR"
          mkdir -p "$TOOLCHAIN_DIR"
          url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz"
          curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/clang-r416183b.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang-r416183b.tar.gz" -C "$TOOLCHAIN_DIR"
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            test -x "$TOOLCHAIN_DIR/bin/$tool"
          done
          "$TOOLCHAIN_DIR/bin/clang" --version | tee "$AUDIT_DIR/10-clang-version.txt"
          sha256sum "$RUNNER_TEMP/clang-r416183b.tar.gz" | tee "$AUDIT_DIR/10-clang-archive.sha256"

      - name: Configure and build A
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export KBUILD_BUILD_USER KBUILD_BUILD_HOST KBUILD_BUILD_TIMESTAMP
          export KBUILD_BUILD_VERSION SOURCE_DATE_EPOCH KBUILD_FIXED_SCM_SUFFIX

          rm -rf "$OUT_DIR"
          make O="$OUT_DIR" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            veux_defconfig 2>&1 | tee "$AUDIT_DIR/11-build-a-config.log"
          grep -Fxq 'CONFIG_KSU=y' "$OUT_DIR/.config"
          grep -Fxq 'CONFIG_KSU_SUSFS=y' "$OUT_DIR/.config"
          grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' "$OUT_DIR/.config"
          grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' "$OUT_DIR/.config"

          make -j"$(nproc)" O="$OUT_DIR" ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            KCFLAGS="$P9_EFFECTIVE_KCFLAGS" Image dtbs \
            2>&1 | tee "$AUDIT_DIR/11-build-a.log"

          image="$OUT_DIR/arch/arm64/boot/Image"
          veux_dtb="$OUT_DIR/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"
          test -s "$image"
          test -s "$veux_dtb"
          echo "VEUX_DTB_PATH=arch/arm64/boot/dts/vendor/xiaomi/veux.dtb" | tee "$AUDIT_DIR/11-veux-dtb-path.txt"
          test "$(stat -c '%s' "$image")" -gt 20000000

          strings -a "$image" > "$AUDIT_DIR/11-image-a-strings.txt"
          grep -Fq "Linux version $STOCK_KERNEL_RELEASE ($KBUILD_BUILD_USER@$KBUILD_BUILD_HOST)" \
            "$AUDIT_DIR/11-image-a-strings.txt"
          grep -Fq "#1 SMP PREEMPT $KBUILD_BUILD_TIMESTAMP" \
            "$AUDIT_DIR/11-image-a-strings.txt"

          mkdir -p "$AUDIT_DIR/build-a"
          cp "$OUT_DIR/.config" "$AUDIT_DIR/build-a/.config"
          cp "$image" "$AUDIT_DIR/build-a/Image"
          cp "$veux_dtb" "$AUDIT_DIR/build-a/veux.dtb"
          sha256sum "$AUDIT_DIR/build-a/Image" | tee "$AUDIT_DIR/11-image-a.sha256"
          sha256sum "$veux_dtb" | tee "$AUDIT_DIR/11-veux-dtb-a.sha256"
          image_a_sha="$(sha256sum "$AUDIT_DIR/build-a/Image" | awk '{print $1}')"
          veux_dtb_a_sha="$(sha256sum "$veux_dtb" | awk '{print $1}')"
          test "$image_a_sha" = "$EXPECTED_P9V3_IMAGE_A_SHA256"
          test "$veux_dtb_a_sha" = "$EXPECTED_P9V3_VEUX_DTB_A_SHA256"
          {
            echo "P9V3_IMAGE_A_SHA256_EXPECTED=$EXPECTED_P9V3_IMAGE_A_SHA256"
            echo "P9V3_IMAGE_A_SHA256_ACTUAL=$image_a_sha"
            echo "P9V3_VEUX_DTB_A_SHA256_EXPECTED=$EXPECTED_P9V3_VEUX_DTB_A_SHA256"
            echo "P9V3_VEUX_DTB_A_SHA256_ACTUAL=$veux_dtb_a_sha"
            echo 'P9V3_BUILD_A_BINARY_CONTINUITY=PASS'
          } | tee "$AUDIT_DIR/11-p9v3-build-a-continuity.txt"
          (
            cd "$OUT_DIR"
            find arch/arm64/boot/dts -type f -name '*.dtb' -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$AUDIT_DIR/11-dtbs-a.sha256"

      - name: Configure and build B for reproducibility
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export KBUILD_BUILD_USER KBUILD_BUILD_HOST KBUILD_BUILD_TIMESTAMP
          export KBUILD_BUILD_VERSION SOURCE_DATE_EPOCH KBUILD_FIXED_SCM_SUFFIX

          rm -rf "$OUT_DIR"
          make O="$OUT_DIR" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            veux_defconfig 2>&1 | tee "$AUDIT_DIR/12-build-b-config.log"

          config_match=PASS
          if ! cmp -s "$AUDIT_DIR/build-a/.config" "$OUT_DIR/.config"; then
            config_match=FAIL
            diff -u "$AUDIT_DIR/build-a/.config" "$OUT_DIR/.config" \
              > "$AUDIT_DIR/12-config-diff.txt" || true
          fi

          make -j"$(nproc)" O="$OUT_DIR" ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            KCFLAGS="$P9_EFFECTIVE_KCFLAGS" Image dtbs \
            2>&1 | tee "$AUDIT_DIR/12-build-b.log"

          image_b="$OUT_DIR/arch/arm64/boot/Image"
          veux_dtb_b="$OUT_DIR/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"
          test -s "$image_b"
          test -s "$veux_dtb_b"
          grep -Fxq 'VEUX_DTB_PATH=arch/arm64/boot/dts/vendor/xiaomi/veux.dtb' "$AUDIT_DIR/11-veux-dtb-path.txt"

          sha256sum "$image_b" | tee "$AUDIT_DIR/12-image-b.sha256"
          sha256sum "$veux_dtb_b" | tee "$AUDIT_DIR/12-veux-dtb-b.sha256"
          (
            cd "$OUT_DIR"
            find arch/arm64/boot/dts -type f -name '*.dtb' -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$AUDIT_DIR/12-dtbs-b.sha256"

          image_match=PASS
          veux_dtb_match=PASS
          dtbs_match=PASS
          if ! cmp -s "$AUDIT_DIR/build-a/Image" "$image_b"; then
            image_match=FAIL
            # Preserve a bounded first-difference sample for diagnosis.
            cmp -l "$AUDIT_DIR/build-a/Image" "$image_b" \
              | head -n 32 > "$AUDIT_DIR/12-image-first-differences.txt" || true
          fi
          cmp -s "$AUDIT_DIR/build-a/veux.dtb" "$veux_dtb_b" || veux_dtb_match=FAIL
          cmp -s "$AUDIT_DIR/11-dtbs-a.sha256" "$AUDIT_DIR/12-dtbs-b.sha256" || dtbs_match=FAIL

          {
            echo "CONFIG_REPRODUCIBLE=$config_match"
            echo "IMAGE_REPRODUCIBLE=$image_match"
            echo "VEUX_DTB_REPRODUCIBLE=$veux_dtb_match"
            echo "DTBS_REPRODUCIBLE=$dtbs_match"
            echo "IMAGE_A_SHA256=$(sha256sum "$AUDIT_DIR/build-a/Image" | awk '{print $1}')"
            echo "IMAGE_B_SHA256=$(sha256sum "$image_b" | awk '{print $1}')"
            echo "IMAGE_A_BYTES=$(stat -c '%s' "$AUDIT_DIR/build-a/Image")"
            echo "IMAGE_B_BYTES=$(stat -c '%s' "$image_b")"
            echo "REPRO_BUILD_O_PATH=$OUT_DIR"
          } | tee "$AUDIT_DIR/12-reproducibility.txt"

          test "$config_match" = PASS
          test "$image_match" = PASS
          test "$veux_dtb_match" = PASS
          test "$dtbs_match" = PASS

      - name: Build VEUX AnyKernel3 package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$AUDIT_DIR" "$DIST_DIR"

          pack_log="$AUDIT_DIR/13-ak3-packaging.log"
          : > "$pack_log"
          echo 'PACK_STAGE=START' | tee -a "$pack_log"
          echo "PREVIOUS_UNRESOLVABLE_AK3_COMMIT=$PREVIOUS_UNRESOLVABLE_AK3_COMMIT" | tee -a "$pack_log"
          echo "SELECTED_AK3_COMMIT=$AK3_COMMIT" | tee -a "$pack_log"

          # The kernel payload comes from the just-reproduced same-O= Build B and must
          # still match the archived P9-v3 Build-A identity before packaging starts.
          src_image="$OUT_DIR/arch/arm64/boot/Image"
          test -s "$src_image"
          src_image_sha="$(sha256sum "$src_image" | awk '{print $1}')"
          test "$src_image_sha" = "$EXPECTED_P9V3_IMAGE_A_SHA256"
          echo "SOURCE_IMAGE_SHA256=$src_image_sha" | tee -a "$pack_log"

          ak3="$GITHUB_WORKSPACE/AnyKernel3"
          rm -rf "$ak3"
          git clone -q "$AK3_REPO" "$ak3"
          echo 'PACK_STAGE=CLONE_PASS' | tee -a "$pack_log"

          git -C "$ak3" checkout -q --detach "$AK3_COMMIT"
          actual_ak3_commit="$(git -C "$ak3" rev-parse HEAD)"
          test "$actual_ak3_commit" = "$AK3_COMMIT"
          test -s "$ak3/tools/ak3-core.sh"
          test -s "$ak3/META-INF/com/google/android/update-binary"
          echo "AK3_CHECKOUT=$actual_ak3_commit" | tee -a "$pack_log"
          echo 'PACK_STAGE=PIN_PASS' | tee -a "$pack_log"

          cp -- "$src_image" "$ak3/Image"
          test -s "$ak3/Image"
          cmp -s "$src_image" "$ak3/Image"
          copied_image_sha="$(sha256sum "$ak3/Image" | awk '{print $1}')"
          test "$copied_image_sha" = "$src_image_sha"
          echo "COPIED_IMAGE_SHA256=$copied_image_sha" | tee -a "$pack_log"
          echo 'PACK_STAGE=IMAGE_COPY_PASS' | tee -a "$pack_log"

          # Use the current AnyKernel3 variable contract from the pinned official tree.
          # Only the Image is supplied; no DTB/DTBO/ramdisk payload is added.
          cat > "$ak3/anykernel.sh" <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## VEUX CLEAN GEN1 P9 v5-v4

          properties() { '
          kernel.string=VEUX GEN1 P9v5-v4 Linux 5.4.274 ReSukiSU audited deltas + SUSFS 2.3
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=veux
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF

          grep -Fxq 'device.name1=veux' "$ak3/anykernel.sh"
          grep -Fxq 'BLOCK=/dev/block/bootdevice/by-name/boot;' "$ak3/anykernel.sh"
          grep -Fxq 'IS_SLOT_DEVICE=1;' "$ak3/anykernel.sh"
          grep -Fxq 'RAMDISK_COMPRESSION=auto;' "$ak3/anykernel.sh"
          grep -Fxq 'PATCH_VBMETA_FLAG=auto;' "$ak3/anykernel.sh"
          grep -Fxq '. tools/ak3-core.sh;' "$ak3/anykernel.sh"
          grep -Fxq 'dump_boot;' "$ak3/anykernel.sh"
          grep -Fxq 'write_boot;' "$ak3/anykernel.sh"
          test "$(grep -c '^device.name1=veux$' "$ak3/anykernel.sh")" -eq 1
          test "$(grep -c '^BLOCK=/dev/block/bootdevice/by-name/boot;$' "$ak3/anykernel.sh")" -eq 1
          test "$(grep -c '^IS_SLOT_DEVICE=1;$' "$ak3/anykernel.sh")" -eq 1
          echo 'PACK_STAGE=ANYKERNEL_CONFIG_PASS' | tee -a "$pack_log"

          cat > "$ak3/P9V5V4-AUDIT-NOTE.txt" <<EOF
          CLEAN GEN1 P9 v5-v4
          Reference P9-v3 Git blob: $P9V3_BLOB_SHA
          Confirmed kernel/repro checkpoint: P9-v5-v3 run 34556952285
          Base: P6-v11 FULL SUSFS 2.3
          Linux: 5.4.274
          Device: veux
          ReSukiSU restore base: $EXPECTED_RESUKISU_HEAD
          Reviewed kernel deltas:
            $R1_POLICYDB_FIX
            $R2_WEBVIEW_ALLOWLIST
            $R3_APK_SIGN_HARDENING
          Audited ReSukiSU upstream head: $AUDITED_UPSTREAM_HEAD
          AnyKernel3 repository: $AK3_REPO
          Previous unresolved AK3 pin: $PREVIOUS_UNRESOLVABLE_AK3_COMMIT
          Selected verified AK3 pin: $AK3_COMMIT

          New ReSukiSU kernel delta added by P9-v5-v4: NO
          SUSFS outer implementation changed by P9-v5-v4: NO
          ReSukiSU Kbuild/version identity changed by P9-v5-v4: NO
          Forced/spoofed API identity: NO
          Functional delta from P9-v5-v3: AnyKernel3 packaging repair/hardening only
          EOF

          zip_name="VEUX-GEN1-P9v5-v4-5.4.274-ReSukiSU-Audited-SUSFS-2.3-AK3.zip"
          zip_path="$DIST_DIR/$zip_name"
          rm -f "$zip_path"
          test ! -e "$zip_path"

          (
            cd "$ak3"
            git status --short | tee "$AUDIT_DIR/13-ak3-git-status.txt"
            zip -r9 "$zip_path" . \
              -x '.git/*' '.github/*' 'README.md' '*placeholder'
          )
          test -s "$zip_path"
          echo 'PACK_STAGE=ZIP_CREATE_PASS' | tee -a "$pack_log"

          unzip -t "$zip_path" | tee "$AUDIT_DIR/13-ak3-unzip-test.txt"
          unzip -Z1 "$zip_path" | tee "$AUDIT_DIR/13-ak3-zip-list.txt"
          test "$(grep -xc 'Image' "$AUDIT_DIR/13-ak3-zip-list.txt")" -eq 1
          test "$(grep -xc 'anykernel.sh' "$AUDIT_DIR/13-ak3-zip-list.txt")" -eq 1
          test "$(grep -xc 'tools/ak3-core.sh' "$AUDIT_DIR/13-ak3-zip-list.txt")" -eq 1
          echo 'PACK_STAGE=ZIP_TEST_PASS' | tee -a "$pack_log"

          check_dir="$RUNNER_TEMP/p9v5-v4-ak3-check"
          rm -rf "$check_dir"
          mkdir -p "$check_dir"
          unzip -q "$zip_path" Image -d "$check_dir"
          test -s "$check_dir/Image"
          cmp -s "$src_image" "$check_dir/Image"
          extracted_image_sha="$(sha256sum "$check_dir/Image" | awk '{print $1}')"
          test "$extracted_image_sha" = "$src_image_sha"
          echo "EXTRACTED_IMAGE_SHA256=$extracted_image_sha" | tee -a "$pack_log"
          echo 'PACK_STAGE=IMAGE_ROUNDTRIP_PASS' | tee -a "$pack_log"

          zip_sha="$(sha256sum "$zip_path" | awk '{print $1}')"
          {
            echo "AK3_REPO=$AK3_REPO"
            echo "AK3_PREVIOUS_UNRESOLVABLE_COMMIT=$PREVIOUS_UNRESOLVABLE_AK3_COMMIT"
            echo "AK3_COMMIT=$AK3_COMMIT"
            echo "AK3_ZIP=$zip_name"
            echo "AK3_ZIP_SHA256=$zip_sha"
            echo "AK3_SOURCE_IMAGE_SHA256=$src_image_sha"
            echo "AK3_EXTRACTED_IMAGE_SHA256=$extracted_image_sha"
            echo 'AK3_IMAGE_ROUNDTRIP=PASS'
            echo 'AK3_PACKAGE_ROUNDTRIP=PASS'
          } | tee "$AUDIT_DIR/13-ak3.txt"

          sha256sum "$zip_path" | tee "$DIST_DIR/SHA256SUMS"
          cp "$AUDIT_DIR/00-plan.txt" "$DIST_DIR/P9V5V4-WORKFLOW-POLICY.txt"
          cp "$AUDIT_DIR/07-upstream-gate.txt" "$DIST_DIR/P9V5V4-UPSTREAM-GATE.txt"
          cp "$AUDIT_DIR/09-boundaries.txt" "$DIST_DIR/P9V5V4-BOUNDARIES.txt"
          cp "$AUDIT_DIR/11-p9v3-build-a-continuity.txt" "$DIST_DIR/P9V5V4-BINARY-CONTINUITY.txt"
          cp "$AUDIT_DIR/12-reproducibility.txt" "$DIST_DIR/P9V5V4-REPRODUCIBILITY.txt"
          cp "$AUDIT_DIR/09-p9v5-v4-resukisu-delta.patch" "$DIST_DIR/P9V5V4-RESUKISU-DELTA.patch"

      - name: Final fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'P9V3_REFERENCE_IDENTITY=PASS' "$AUDIT_DIR/01-p9v3-reference.txt"
          grep -Fxq 'P9V3_BUILD_A_BINARY_CONTINUITY=PASS' "$AUDIT_DIR/11-p9v3-build-a-continuity.txt"
          grep -Fq 'R3_TO_AUDITED_SENSITIVE_SCOPE=UNCHANGED' "$AUDIT_DIR/07-upstream-gate.txt"
          grep -Fxq 'SUSFS_2_3_BASELINE_BYTE_PRESERVED=PASS' "$AUDIT_DIR/09-boundaries.txt"
          grep -Fxq 'KSU_KBUILD_IDENTITY_BYTE_PRESERVED=PASS' "$AUDIT_DIR/09-boundaries.txt"
          grep -Fxq 'APPROVED_RESUKISU_DELTA_SCOPE=PASS' "$AUDIT_DIR/09-boundaries.txt"
          grep -Fxq 'NEW_RESUKISU_KERNEL_DELTA_ADDED_BY_P9V5V4=NO' "$AUDIT_DIR/09-boundaries.txt"
          grep -Fxq 'IMAGE_REPRODUCIBLE=PASS' "$AUDIT_DIR/12-reproducibility.txt"
          grep -Fxq 'VEUX_DTB_REPRODUCIBLE=PASS' "$AUDIT_DIR/12-reproducibility.txt"
          grep -Fxq 'DTBS_REPRODUCIBLE=PASS' "$AUDIT_DIR/12-reproducibility.txt"

          test -s "$AUDIT_DIR/13-ak3-packaging.log"
          for stage in \
            START \
            CLONE_PASS \
            PIN_PASS \
            IMAGE_COPY_PASS \
            ANYKERNEL_CONFIG_PASS \
            ZIP_CREATE_PASS \
            ZIP_TEST_PASS \
            IMAGE_ROUNDTRIP_PASS
          do
            grep -Fxq "PACK_STAGE=$stage" "$AUDIT_DIR/13-ak3-packaging.log"
          done
          grep -Fxq 'AK3_IMAGE_ROUNDTRIP=PASS' "$AUDIT_DIR/13-ak3.txt"
          grep -Fxq 'AK3_PACKAGE_ROUNDTRIP=PASS' "$AUDIT_DIR/13-ak3.txt"
          grep -Fxq "AK3_SOURCE_IMAGE_SHA256=$EXPECTED_P9V3_IMAGE_A_SHA256" "$AUDIT_DIR/13-ak3.txt"
          grep -Fxq "AK3_EXTRACTED_IMAGE_SHA256=$EXPECTED_P9V3_IMAGE_A_SHA256" "$AUDIT_DIR/13-ak3.txt"

          test "$(find "$DIST_DIR" -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1
          zip_file="$(find "$DIST_DIR" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -s "$zip_file"
          test "$(basename "$zip_file")" = 'VEUX-GEN1-P9v5-v4-5.4.274-ReSukiSU-Audited-SUSFS-2.3-AK3.zip'

          {
            echo 'CLEAN_GEN1_P9V5V4_CURRENT_UPSTREAM_GATED_SUSFS23_AK3=PASS'
            echo "REFERENCE_P9V3_BLOB=$P9V3_BLOB_SHA"
            echo "BASE_RESUKISU=$EXPECTED_RESUKISU_HEAD"
            echo "R1=$R1_POLICYDB_FIX"
            echo "R2=$R2_WEBVIEW_ALLOWLIST"
            echo "R3=$R3_APK_SIGN_HARDENING"
            echo "AUDITED_UPSTREAM_HEAD=$AUDITED_UPSTREAM_HEAD"
            echo 'NEW_KERNEL_DELTA_AFTER_P9V3=NO'
            echo 'REPRO_FIX_TEST=SAME_ABSOLUTE_O_PATH'
            echo 'P9V5V3_KERNEL_REPRO_RUN=34556952285'
            echo 'P9V5V4_FUNCTIONAL_DELTA=AK3_PACKAGING_HARDENING_ONLY'
            echo 'SUSFS_OUTER_CHANGED=NO'
            echo 'KSU_API_IDENTITY_SPOOFED=NO'
            echo "AK3=$(basename "$zip_file")"
            echo "AK3_SHA256=$(sha256sum "$zip_file" | awk '{print $1}')"
          } | tee "$DIST_DIR/FINAL-RESULT.txt"

          (
            cd "$DIST_DIR"
            sha256sum \
              P9V5V4-WORKFLOW-POLICY.txt \
              P9V5V4-UPSTREAM-GATE.txt \
              P9V5V4-BOUNDARIES.txt \
              P9V5V4-BINARY-CONTINUITY.txt \
              P9V5V4-REPRODUCIBILITY.txt \
              P9V5V4-RESUKISU-DELTA.patch \
              FINAL-RESULT.txt \
              > SUPPORT-SHA256SUMS
          )

      - name: Upload P9-v5-v4 AK3 release
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p9v5-v4-veux-5.4.274-resukisu-audited-susfs-2.3-ak3-${{ github.run_id }}
          path: clean-gen1-p9v5-v4-dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload P9-v5-v4 audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p9v5-v4-audit-${{ github.run_id }}
          path: clean-gen1-p9v5-v4-audit/
          if-no-files-found: warn
          retention-days: 90
