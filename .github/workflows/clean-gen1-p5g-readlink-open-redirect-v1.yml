        grep -Fq 'P5G_PRE_READLINK_SHAPES=PASS' "$ARTIFACT_DIR/06-pre-readlink-audit.txt"
        grep -Fq 'P5G_P5E_READLINK_BASELINE_COMPILE=PASS' "$ARTIFACT_DIR/07-p5e-readlink-baseline-build.txt"
        grep -Fq 'P5G_VFS_READLINK_INTEGRATION=PASS' "$ARTIFACT_DIR/09-p5g-readlink-audit.txt"
        grep -Fq 'P5G_PROC_READLINK_INTEGRATION=PASS' "$ARTIFACT_DIR/09-p5g-readlink-audit.txt"
        grep -Fq 'P5G_READLINK_BYTE_COUNT_CONTRACT=PASS' "$ARTIFACT_DIR/09-p5g-readlink-audit.txt"
        grep -Fq 'P5G_STANDARD_TRUNCATION_SEMANTICS=PASS' "$ARTIFACT_DIR/09-p5g-readlink-audit.txt"
        grep -Fq 'P5G_CHANGE_SCOPE=PASS' "$ARTIFACT_DIR/10-scope.txt"
        grep -Fq 'P5G_READLINK_SYMBOL_CONTRACT=PASS' "$ARTIFACT_DIR/11-object-builds.txt"
        grep -Fq 'P5G_OUTER_RESTORE_REPLAY=PASS' "$ARTIFACT_DIR/14-restore-replays.txt"
        grep -Fq 'P5G_RESUKISU_BUNDLE_REPLAY=PASS' "$ARTIFACT_DIR/14-restore-replays.txt"

        grep -Fxq '# CONFIG_KSU_SUSFS is not set' arch/arm64/configs/veux_defconfig
        test ! -e KernelSU/kernel/feature/module_load_filter.c

        (
          cd "$ARTIFACT_DIR/restore-kit"
          sha256sum -c SHA256SUMS
        ) > "$ARTIFACT_DIR/15-final-restore-sha256.txt"

        {
          echo "CLEAN_GEN1_P5G_READLINK_OPEN_REDIRECT=PASS"
          echo "KERNEL_VERSION=5.4.274"
          echo "P5E_INPUT_TREE=$EXPECTED_P5E_TREE"
          echo "P5G_CHECKPOINT_COMMIT=$P5G_COMMIT"
          echo "P5G_OUTER_TREE=$P5G_TREE"
          echo "P5G_RESUKISU_HEAD=$EXPECTED_RESUKISU_HEAD"
          echo "P5G_RESUKISU_TREE=$EXPECTED_RESUKISU_TREE"
          echo "VFS_READLINK_OPEN_REDIRECT_INTEGRATED=YES"
          echo "VFS_READLINK_CUSTOM_CALLBACK_BRANCH=YES"
          echo "VFS_READLINK_DEFAULT_GET_LINK_BRANCH=YES"
          echo "PROC_READLINK_OPEN_REDIRECT_INTEGRATED=YES"
          echo "READLINK_HELPER_SUCCESS_RETURNS_BYTE_COUNT=YES"
          echo "READLINK_TRUNCATES_TO_BUFLEN=YES"
          echo "READLINK_NO_MATCH_FALLS_BACK=YES"
          echo "READLINK_HELPER_ERRORS_PROPAGATE=YES"
          echo "DELAYED_CALL_STOCK_PATH_PRESERVED=YES"
          echo "SHARED_SUSFS_HEADER_DECLARATIONS=YES"
          echo "HANDWRITTEN_READLINK_EXTERNS=NO"
          echo "NON_READLINK_OPEN_REDIRECT_HELPERS_PRESERVED=YES"
          echo "VFS_STATFS_HOOK_REMAINING=YES"
          echo "FDINFO_SEQ_SHOW_HOOK_REMAINING=YES"
          echo "PROC_MAPS_HOOK_REMAINING=YES"
          echo "P5G_CHANGED_FILES=fs/namei.c,fs/proc/base.c,fs/susfs.c,include/linux/susfs.h"
          echo "SUSFS_RUNTIME_ENABLED=NO"
          echo "MODULE_LOAD_FILTER_INCLUDED=NO"
          echo "P5G_OUTER_RESTORE_REPLAY=PASS"
          echo "P5G_RESUKISU_BUNDLE_REPLAY=PASS"
          echo "FULL_KERNEL_BUILD_PERFORMED=NO"
          echo "IMAGE_CREATED=NO"
          echo "DTB_BUILD_PERFORMED=NO"
          echo "BOOT_IMAGE_CREATED=NO"
          echo "FLASHABLE_ZIP_CREATED=NO"
          echo "DEVICE_ACCESSED=NO"
          echo "FLASHING_PERFORMED=NO"
          echo "NEXT_STAGE=CLEAN_GEN1_P5H_STATFS_FDINFO_OPEN_REDIRECT_INTEGRATION"
        } | tee "$ARTIFACT_DIR/16-result.txt"
    - name: Preserve P5G failure evidence
      if: always()
      shell: bash
      run: |2

        set +e
        mkdir -p "$ARTIFACT_DIR"
        {
          echo "JOB_STATUS=${{ job.status }}"
          if [ -d "$GITHUB_WORKSPACE/kernel/.git" ]; then
            echo "OUTER_HEAD=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD 2>/dev/null || true)"
            echo "OUTER_TREE=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD^{tree} 2>/dev/null || true)"
            echo "OUTER_STATUS_BEGIN"
            git -C "$GITHUB_WORKSPACE/kernel" status --porcelain 2>/dev/null || true
            echo "OUTER_STATUS_END"
          fi
          if [ -d "$GITHUB_WORKSPACE/kernel/KernelSU/.git" ]; then
            echo "RESUKISU_HEAD=$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD 2>/dev/null || true)"
            echo "RESUKISU_TREE=$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD^{tree} 2>/dev/null || true)"
          fi
        } > "$ARTIFACT_DIR/99-job-end-state.txt"
        find "$ARTIFACT_DIR" -maxdepth 2 -type f -printf '%P\n' \
          | sort > "$ARTIFACT_DIR/99-artifact-file-list.txt"
        exit 0
    - name: Upload P5G checkpoint and evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: clean-gen1-p5g-readlink-open-redirect-v1-${{ github.run_id }}
        path: clean-gen1-p5g/
        if-no-files-found: error
        retention-days: 90
