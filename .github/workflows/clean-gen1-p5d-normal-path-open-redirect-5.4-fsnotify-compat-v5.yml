        cp "$ARTIFACT_DIR/08c-susfs-5.4-compat-audit.txt" "$kit/P5D-SUSFS-5.4-COMPAT-AUDIT.txt"
        cp "$ARTIFACT_DIR/09-p5d-lifetime-audit.txt" "$kit/P5D-NESTED-NAMEIDATA-AUDIT.txt"
        cp "$ARTIFACT_DIR/10-p5d-feature-scope.txt" "$kit/P5D-FEATURE-SCOPE.txt"

        git -C KernelSU branch -f clean-gen1-p5d-resukisu "$EXPECTED_P5C_RESUKISU_HEAD"
        git -C KernelSU bundle create "$kit/resukisu-p5d-full.bundle" \
          refs/heads/clean-gen1-p5d-resukisu
        git -C KernelSU bundle verify "$kit/resukisu-p5d-full.bundle" \
          > "$kit/resukisu-p5d-bundle-verify.txt" 2>&1
        tar -C KernelSU --exclude=.git -cf - . \
          | zstd -19 -T0 -o "$kit/resukisu-p5d-source.tar.zst"

        python3 - <<'PY'
        from pathlib import Path
        import json, os

        kit = Path(os.environ["ARTIFACT_DIR"]) / "restore-kit"
        manifest = {
            "stage": "CLEAN_GEN1_P5D",
            "kernel_version": "5.4.274",
            "vendor_sha": os.environ["EXPECTED_VENDOR_SHA"],
            "p5c_tree": os.environ["EXPECTED_P5C_TREE"],
            "p5d_commit": os.environ["P5D_COMMIT"],
            "p5d_tree": os.environ["P5D_TREE"],
            "resukisu_head": os.environ["EXPECTED_P5C_RESUKISU_HEAD"],
            "resukisu_tree": os.environ["EXPECTED_P5C_RESUKISU_TREE"],
            "changed_files": ["fs/namei.c", "fs/susfs.c", "include/linux/susfs.h"],
            "normal_path_open_redirect_integrated": True,
            "tmpfile_open_redirect_integrated": False,
            "o_path_open_redirect_integrated": False,
            "separate_nested_nameidata": True,
            "outer_nameidata_name_replaced": False,
            "fake_filename_put_after_nested_restore": True,
            "lookup_root_preserved": True,
            "open_redirect_runtime_enabled": False,
            "susfs_fsnotify_5_4_handle_event_adapted": True,
            "susfs_5_9_plus_handle_inode_event_preserved": True,
            "enabled_features_enomem_copy_to_user_checked": True,
            "susfs_runtime_enabled": False,
            "full_kernel_build_performed": False,
        }
        (kit / "manifest.json").write_text(
            json.dumps(manifest, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        PY

        cat > "$kit/RESTORE-INSTRUCTIONS.txt" <<EOF
        CLEAN GEN1 P5D deterministic restore

        Apply vendor-20240619-to-p5d-outer.patch on:
          $VENDOR_REPO @ $EXPECTED_VENDOR_SHA

        Expected outer tree:
          $P5D_TREE

        Expected ReSukiSU:
          head $EXPECTED_P5C_RESUKISU_HEAD
          tree $EXPECTED_P5C_RESUKISU_TREE

        P5D changes:
          fs/namei.c
          fs/susfs.c
          include/linux/susfs.h

        Normal path OPEN_REDIRECT is integrated but CONFIG_KSU_SUSFS remains disabled.
        fs/susfs.c carries only the compiler-proven 5.4 fsnotify ABI adaptation
        and checked ENOMEM fallback copy_to_user result in addition to P5C.
        do_tmpfile and do_o_path OPEN_REDIRECT are deferred to P5E.
        EOF

        (
          cd "$kit"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
        ) | tee "$ARTIFACT_DIR/15-restore-kit-sha256.txt"
    - name: Replay P5D outer and ReSukiSU restore
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail

        outer="$GITHUB_WORKSPACE/p5d-outer-replay"
        rm -rf "$outer"
        git worktree add --detach "$outer" "$EXPECTED_VENDOR_SHA" >/dev/null
        (
          cd "$outer"
          git apply --check --binary \
            "$ARTIFACT_DIR/restore-kit/vendor-20240619-to-p5d-outer.patch"
          git apply --index --binary \
            "$ARTIFACT_DIR/restore-kit/vendor-20240619-to-p5d-outer.patch"
          test "$(git write-tree)" = "$P5D_TREE"
        )
        git worktree remove --force "$outer"

        resu="$GITHUB_WORKSPACE/p5d-resukisu-replay"
        rm -rf "$resu"
        git init "$resu" >/dev/null
        git -C "$resu" fetch \
          "$ARTIFACT_DIR/restore-kit/resukisu-p5d-full.bundle" \
          refs/heads/clean-gen1-p5d-resukisu:refs/heads/clean-gen1-p5d-resukisu
        git -C "$resu" checkout --detach refs/heads/clean-gen1-p5d-resukisu >/dev/null
        test "$(git -C "$resu" rev-parse HEAD)" = "$EXPECTED_P5C_RESUKISU_HEAD"
        test "$(git -C "$resu" rev-parse HEAD^{tree})" = "$EXPECTED_P5C_RESUKISU_TREE"
        rm -rf "$resu"

        {
          echo "P5D_OUTER_RESTORE_REPLAY=PASS"
          echo "P5D_RESUKISU_BUNDLE_REPLAY=PASS"
        } | tee "$ARTIFACT_DIR/16-restore-replays.txt"
    - name: Final P5D safety gate
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail

        test "$(make -s kernelversion)" = "5.4.274"
        test "$(git rev-parse HEAD)" = "$P5D_COMMIT"
        test "$(git rev-parse HEAD^{tree})" = "$P5D_TREE"
        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_P5C_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_P5C_RESUKISU_TREE"
        test -z "$(git status --porcelain)"
        test -z "$(git -C KernelSU status --porcelain)"

        grep -Fq 'P5D_SUSFS_HELPER_LIFETIME=PASS' "$ARTIFACT_DIR/06-susfs-helper-lifetime.txt"
        grep -Fq 'P5D_NORMAL_PATH_NESTED_NAMEIDATA_CONTRACT=PASS' "$ARTIFACT_DIR/09-p5d-lifetime-audit.txt"
        grep -Fq 'P5D_SCOPE_PARTIAL_OPEN_REDIRECT=PASS' "$ARTIFACT_DIR/10-p5d-feature-scope.txt"
        grep -Fq 'P5D_CHANGE_SCOPE=PASS' "$ARTIFACT_DIR/11-scope.txt"
        grep -Fq 'P5D_SUSFS_5_4_FSNOTIFY_ABI_ADAPTATION=PASS' "$ARTIFACT_DIR/08c-susfs-5.4-compat-audit.txt"
        grep -Fq 'P5D_SUSFS_MODERN_FSNOTIFY_BRANCH_PRESERVED=PASS' "$ARTIFACT_DIR/08c-susfs-5.4-compat-audit.txt"
        grep -Fq 'P5D_SUSFS_DEFERRED_CLEANUP_PRESERVED=PASS' "$ARTIFACT_DIR/08c-susfs-5.4-compat-audit.txt"
        grep -Fq 'P5D_ENABLED_FEATURES_FALLBACK_COPY_RESULT=CHECKED' "$ARTIFACT_DIR/08c-susfs-5.4-compat-audit.txt"
        grep -Fq 'P5D_SUSFS_COMPAT_EDIT_BLOCKS=5' "$ARTIFACT_DIR/08c-susfs-5.4-compat-audit.txt"
        grep -Fq 'P5D_V4_FAILURE_CLASS=COMPAT_EDIT_BLOCK_ACCOUNTING_GUARD' "$ARTIFACT_DIR/08c-susfs-5.4-compat-audit.txt"
        grep -Fq 'P5D_V4_SOURCE_TRANSFORM_COMPLETED=YES' "$ARTIFACT_DIR/08c-susfs-5.4-compat-audit.txt"
        grep -Fq 'P5D_V4_SEQUENCE_MATCHER_EDIT_BLOCKS=5' "$ARTIFACT_DIR/08c-susfs-5.4-compat-audit.txt"
        grep -Fq 'P5D_FS_MAKEFILE_SUSFS_OBJECT_WIRING=PASS' "$ARTIFACT_DIR/12a-kbuild-preflight.txt"
        grep -Fq 'P5D_V2_FAILURE_CLASS=KBUILD_CONFIG_TARGET_GATE' "$ARTIFACT_DIR/12a-kbuild-preflight.txt"
        grep -Fq 'P5D_FORCED_KBUILD_CONFIG_VARS=PASS' "$ARTIFACT_DIR/12-object-builds.txt"
        grep -Fq 'P5D_REDIRECT_SYMBOL_CONTRACT=PASS' "$ARTIFACT_DIR/12-object-builds.txt"
        grep -Fq 'P5D_OUTER_RESTORE_REPLAY=PASS' "$ARTIFACT_DIR/16-restore-replays.txt"
        grep -Fq 'P5D_RESUKISU_BUNDLE_REPLAY=PASS' "$ARTIFACT_DIR/16-restore-replays.txt"

        grep -Fxq '# CONFIG_KSU_SUSFS is not set' arch/arm64/configs/veux_defconfig
        test ! -e KernelSU/kernel/feature/module_load_filter.c

        (
          cd "$ARTIFACT_DIR/restore-kit"
          sha256sum -c SHA256SUMS
        ) > "$ARTIFACT_DIR/17-final-restore-sha256.txt"

        {
          echo "CLEAN_GEN1_P5D_NORMAL_PATH_OPEN_REDIRECT=PASS"
          echo "P5D_V4_FAILURE_CLASS=COMPAT_EDIT_BLOCK_ACCOUNTING_GUARD"
          echo "P5D_V4_SOURCE_TRANSFORM_COMPLETED=YES"
          echo "P5D_V4_SEQUENCE_MATCHER_EDIT_BLOCKS=5"
          echo "P5D_SUSFS_COMPAT_EDIT_BLOCKS=5"
          echo "P5D_V1_DESIGNATED_INIT_COMPILE_FIX=PASS"
          echo "P5D_V1_C90_DECLARATION_WARNING_FIX=PASS"
          echo "P5D_V2_FAILURE_CLASS=KBUILD_CONFIG_TARGET_GATE"
          echo "P5D_FORCED_KBUILD_CONFIG_VARS=PASS"
          echo "P5D_NORMAL_PATH_SOURCE_SEMANTICS_CHANGED_FROM_V3=NO"
          echo "P5D_V3_FAILURE_CLASS=SUSFS_FSNOTIFY_5_4_CALLBACK_ABI"
          echo "P5D_SUSFS_5_4_FSNOTIFY_ABI_ADAPTATION=PASS"
          echo "P5D_ENABLED_FEATURES_FALLBACK_COPY_RESULT=CHECKED"
          echo "KERNEL_VERSION=5.4.274"
          echo "P5C_RESTORE_REPLAY=PASS"
          echo "P5C_TREE=$EXPECTED_P5C_TREE"
          echo "P5D_CHECKPOINT_COMMIT=$P5D_COMMIT"
          echo "P5D_OUTER_TREE=$P5D_TREE"
          echo "P5D_RESUKISU_HEAD=$EXPECTED_P5C_RESUKISU_HEAD"
          echo "P5D_RESUKISU_TREE=$EXPECTED_P5C_RESUKISU_TREE"
          echo "NORMAL_PATH_OPEN_REDIRECT_INTEGRATED=YES"
          echo "SEPARATE_REDIRECT_NAMEIDATA=YES"
          echo "ORIGINAL_ND_NAME_REPLACED=NO"
          echo "FAKE_FILENAME_PUT_AFTER_NESTED_RESTORE=YES"
          echo "LOOKUP_ROOT_PRESERVED=YES"
          echo "REDIRECT_RECURSION_ALLOWED=NO"
          echo "CREATED_PHASE_REDIRECT_ELIGIBLE=NO"
          echo "ATOMIC_OPENED_PHASE_REDIRECT_ELIGIBLE=NO"
          echo "DO_TMPFILE_OPEN_REDIRECT_INTEGRATED=NO"
          echo "DO_O_PATH_OPEN_REDIRECT_INTEGRATED=NO"
          echo "P5D_REDIRECT_SYMBOL_CONTRACT=PASS"
          echo "SUSFS_RUNTIME_ENABLED=NO"
          echo "MODULE_LOAD_FILTER_INCLUDED=NO"
          echo "P5D_OUTER_RESTORE_REPLAY=PASS"
          echo "P5D_RESUKISU_BUNDLE_REPLAY=PASS"
          echo "FULL_KERNEL_BUILD_PERFORMED=NO"
          echo "IMAGE_CREATED=NO"
          echo "DTB_BUILD_PERFORMED=NO"
          echo "BOOT_IMAGE_CREATED=NO"
          echo "FLASHABLE_ZIP_CREATED=NO"
          echo "DEVICE_ACCESSED=NO"
          echo "FLASHING_PERFORMED=NO"
          echo "NEXT_STAGE=CLEAN_GEN1_P5E_TMPFILE_O_PATH_OPEN_REDIRECT_INTEGRATION"
        } | tee "$ARTIFACT_DIR/18-result.txt"
    - name: Preserve P5D failure evidence
      if: always()
      shell: bash
      run: |2

        set +e
        mkdir -p "$ARTIFACT_DIR"
        {
          echo "JOB_STATUS=${{ job.status }}"
          if [ -d "$GITHUB_WORKSPACE/kernel/.git" ]; then
            echo "OUTER_HEAD=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD 2>/dev/null || true)"
            echo "OUTER_TREE=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD^{tree} 2>/dev/null || true)"
            echo "OUTER_STATUS_BEGIN"
            git -C "$GITHUB_WORKSPACE/kernel" status --porcelain 2>/dev/null || true
            echo "OUTER_STATUS_END"
          fi
          if [ -d "$GITHUB_WORKSPACE/kernel/KernelSU/.git" ]; then
            echo "RESUKISU_HEAD=$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD 2>/dev/null || true)"
            echo "RESUKISU_TREE=$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD^{tree} 2>/dev/null || true)"
            echo "RESUKISU_STATUS_BEGIN"
            git -C "$GITHUB_WORKSPACE/kernel/KernelSU" status --porcelain 2>/dev/null || true
            echo "RESUKISU_STATUS_END"
          fi
        } > "$ARTIFACT_DIR/99-job-end-state.txt"

        find "$ARTIFACT_DIR" -maxdepth 2 -type f -printf '%P\n' \
          | sort > "$ARTIFACT_DIR/99-artifact-file-list.txt"
        exit 0
    - name: Upload P5D checkpoint and evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: clean-gen1-p5d-normal-path-open-redirect-v5-${{ github.run_id }}
        path: clean-gen1-p5d/
        if-no-files-found: error
        retention-days: 90
