name: CLEAN GEN1 P5D - normal-path OPEN_REDIRECT 5.4 fsnotify compatibility v5
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  p5d-normal-path-open-redirect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARCH: arm64
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
      VENDOR_TAG: '20240619'
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      P5C_RUN_ID: '33476335464'
      P5C_ARTIFACT_NAME: clean-gen1-p5c-54-lookup-open-structural-split-v1-33476335464
      EXPECTED_P5C_COMMIT: 58255edb04ca382d471ecf53b1da94d41ce1222a
      EXPECTED_P5C_TREE: 1f9a3a59a8691440c4e344705ddedea1b7caeedc
      EXPECTED_P5C_RESUKISU_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_P5C_RESUKISU_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      RESUKISU_SNAPSHOT_HEAD: 0b5efe9e0102c43ca5c41174d500f5a7080cd0c7
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_54_HEAD: 76affd70abf61d77feb0a132f61365d6848505df
      SUSFS_510_HEAD: ec785f47d49f7b3871ca9356f450411020af7017
      SUSFS_515_HEAD: bca0d2333c1a7d717e7278b019d7af7ba1d16005
      SUSFS_61_HEAD: 4fc9c1898ea66f51847cdbc0d1473ea4ef525a70
      ARTIFACT_DIR: ${{ github.workspace }}/clean-gen1-p5d
      P5C_ARTIFACT_DIR: ${{ github.workspace }}/p5c-artifact
      BASELINE_BUILD_DIR: ${{ github.workspace }}/out-p5d-baseline
      NORMAL_BUILD_DIR: ${{ github.workspace }}/out-p5d-normal
      REDIRECT_BUILD_DIR: ${{ github.workspace }}/out-p5d-redirect
    steps:
    - name: Initialize P5D
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf "$ARTIFACT_DIR" "$P5C_ARTIFACT_DIR" \
               "$BASELINE_BUILD_DIR" "$NORMAL_BUILD_DIR" "$REDIRECT_BUILD_DIR" \
               "$GITHUB_WORKSPACE/p5d-outer-replay" \
               "$GITHUB_WORKSPACE/p5d-resukisu-replay"
        mkdir -p "$ARTIFACT_DIR"

        cat > "$ARTIFACT_DIR/00-plan.txt" <<'EOF'
        CLEAN GEN1 P5D v5 - OPEN_REDIRECT normal-path nested-nameidata integration

        v5 changes only the v4 audit accounting guard. Replaying the exact v4
        source transform with the workflow's own SequenceMatcher logic produces
        exactly five non-equal edit blocks, because the preprocessor guards are
        split around unchanged callback/ops body lines. The v4 source transform
        itself is byte-identical in v5.

        v4 keeps the v3 normal-path OPEN_REDIRECT transformation unchanged and
        adapts only two compiler-proven SUSFS 5.4 compatibility points:
        - fsnotify callback/ops ABI: pre-5.9 uses fsnotify_ops.handle_event with
          the VEUX 5.4 callback signature; 5.9+ handle_inode_event is preserved.
        - the ENOMEM enabled-features fallback now consumes copy_to_user()'s
          return value instead of triggering warn_unused_result.
        The v3 Kbuild harness fix is retained unchanged.


        Integrate only normal path_openat OPEN_REDIRECT:
        - outer nd->name remains untouched;
        - only FINAL phase is redirect-eligible;
        - fake_filename gets a separate redirect_nd;
        - original walk is terminated before redirect restart;
        - redirect_nd is terminated and restore_nameidata runs before putname;
        - LOOKUP_ROOT context is preserved;
        - redirect recursion is impossible in nested helper;
        - do_tmpfile and do_o_path are deferred to P5E;
        - CONFIG_KSU_SUSFS remains disabled;
        - no full kernel build.
        EOF
    - name: Install P5D dependencies
      shell: bash
      run: |2

        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison binutils-aarch64-linux-gnu build-essential ca-certificates flex \
          gcc-aarch64-linux-gnu git jq libelf-dev libssl-dev patch python3 rsync zstd
        git --version
        aarch64-linux-gnu-gcc --version | head -1
        aarch64-linux-gnu-nm --version | head -1
        python3 --version
    - name: Checkout exact VEUX vendor source
      uses: actions/checkout@v6
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: '20240619'
        path: kernel
        fetch-depth: 1
    - name: Download accepted P5C artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.P5C_ARTIFACT_NAME }}
        path: p5c-artifact
        github-token: ${{ github.token }}
        run-id: ${{ env.P5C_RUN_ID }}
    - name: Authenticate accepted P5C checkpoint
      shell: bash
      run: |2

        set -euo pipefail

        test -s "$P5C_ARTIFACT_DIR/restore-kit/SHA256SUMS"
        (
          cd "$P5C_ARTIFACT_DIR/restore-kit"
          sha256sum -c SHA256SUMS
        ) > "$ARTIFACT_DIR/01-p5c-restore-sha256.txt"

        jq -e \
          --arg commit "$EXPECTED_P5C_COMMIT" \
          --arg tree "$EXPECTED_P5C_TREE" \
          --arg rhead "$EXPECTED_P5C_RESUKISU_HEAD" \
          --arg rtree "$EXPECTED_P5C_RESUKISU_TREE" \
          '.stage=="CLEAN_GEN1_P5C" and
           .p5c_commit==$commit and
           .p5c_tree==$tree and
           .resukisu_head==$rhead and
           .resukisu_tree==$rtree and
           .open_redirect_decision_integrated==false and
           .susfs_runtime_enabled==false and
           .p5d_requires_separate_nested_nameidata==true and
           .full_kernel_build_performed==false' \
          "$P5C_ARTIFACT_DIR/restore-kit/manifest.json" \
          > "$ARTIFACT_DIR/01-p5c-manifest-auth.json"

        grep -Fxq 'CLEAN_GEN1_P5C_54_LOOKUP_OPEN_STRUCTURAL_SPLIT=PASS' \
          "$P5C_ARTIFACT_DIR/19-result.txt"
        grep -Fxq 'P5D_SEPARATE_REDIRECT_NAMEIDATA_REQUIRED=YES' \
          "$P5C_ARTIFACT_DIR/19-result.txt"
        grep -Fxq 'P5D_ORIGINAL_ND_NAME_MUST_REMAIN_UNCHANGED=YES' \
          "$P5C_ARTIFACT_DIR/19-result.txt"
        grep -Fq 'P5D_LIFETIME_CONTRACT=PASS' \
          "$P5C_ARTIFACT_DIR/11-p5d-lifetime-contract.txt"

        {
          echo "P5C_RESTORE_ARTIFACT=PASS"
          echo "P5C_COMMIT=$EXPECTED_P5C_COMMIT"
          echo "P5C_TREE=$EXPECTED_P5C_TREE"
          echo "P5D_LIFETIME_CONTRACT_AUTH=PASS"
        } | tee "$ARTIFACT_DIR/01-p5c-auth.txt"
    - name: Refuse stale reviewed upstream before P5D
      shell: bash
      run: |2

        set -euo pipefail
        current_resu="$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main | awk '{print $1}')"
        current_54="$(git ls-remote "$SUSFS_REPO" refs/heads/kernel-5.4 | awk '{print $1}')"
        current_510="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android12-5.10 | awk '{print $1}')"
        current_515="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android13-5.15 | awk '{print $1}')"
        current_61="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android14-6.1 | awk '{print $1}')"

        test "$current_resu" = "$RESUKISU_SNAPSHOT_HEAD"
        test "$current_54" = "$SUSFS_54_HEAD"
        test "$current_510" = "$SUSFS_510_HEAD"
        test "$current_515" = "$SUSFS_515_HEAD"
        test "$current_61" = "$SUSFS_61_HEAD"

        {
          echo "UPSTREAM_REVIEW_SNAPSHOT_CURRENT=YES"
          echo "P5D_ALLOWED=YES"
        } | tee "$ARTIFACT_DIR/02-upstream-state.txt"
    - name: Restore exact accepted P5C outer tree
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
        test -z "$(git status --porcelain)"

        PATCH="$P5C_ARTIFACT_DIR/restore-kit/vendor-20240619-to-p5c-outer.patch"
        git apply --check --binary "$PATCH"
        git apply --index --binary "$PATCH"
        test "$(git write-tree)" = "$EXPECTED_P5C_TREE"

        GIT_AUTHOR_NAME="CLEAN-GEN1 Restore" \
        GIT_AUTHOR_EMAIL="clean-gen1@invalid.local" \
        GIT_AUTHOR_DATE="2026-09-01T00:00:00Z" \
        GIT_COMMITTER_NAME="CLEAN-GEN1 Restore" \
        GIT_COMMITTER_EMAIL="clean-gen1@invalid.local" \
        GIT_COMMITTER_DATE="2026-09-01T00:00:00Z" \
          git commit -m "CLEAN GEN1 restore accepted P5C outer tree"

        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P5C_TREE"
        echo "P5C_RESTORED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

        echo "P5C_OUTER_RESTORE_REPLAY=PASS" \
          | tee "$ARTIFACT_DIR/03-p5c-outer-restore.txt"
    - name: Restore exact accepted P5C ReSukiSU
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf KernelSU
        git init KernelSU >/dev/null
        git -C KernelSU fetch \
          "$P5C_ARTIFACT_DIR/restore-kit/resukisu-p5c-full.bundle" \
          refs/heads/clean-gen1-p5c-resukisu:refs/heads/clean-gen1-p5c-resukisu
        git -C KernelSU checkout --detach refs/heads/clean-gen1-p5c-resukisu >/dev/null

        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_P5C_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_P5C_RESUKISU_TREE"
        test -z "$(git -C KernelSU status --porcelain)"

        mkdir -p .git/info
        touch .git/info/exclude
        grep -Fxq '/KernelSU/' .git/info/exclude || echo '/KernelSU/' >> .git/info/exclude

        test -L drivers/kernelsu
        test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
        test -z "$(git status --porcelain)"

        echo "P5C_RESUKISU_RESTORE_REPLAY=PASS" \
          | tee "$ARTIFACT_DIR/04-p5c-resukisu-restore.txt"
    - name: Gate exact P5C boundary
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P5C_TREE"

        grep -Fq 'static int clean_gen1_open_last_lookups' fs/namei.c
        grep -Fq 'static int clean_gen1_do_open' fs/namei.c
        grep -Fq '#ifndef CONFIG_KSU_SUSFS_OPEN_REDIRECT' fs/namei.c
        ! grep -Fq 'clean_gen1_open_redirect_nested' fs/namei.c
        ! grep -Fq 'susfs_open_redirect_spoof_do_sys_openat(redirect_inode)' fs/namei.c

        grep -Fxq '# CONFIG_KSU_SUSFS is not set' arch/arm64/configs/veux_defconfig
        test ! -e KernelSU/kernel/feature/module_load_filter.c

        sha256sum \
          fs/namei.c fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h \
          fs/open.c fs/stat.c \
          > "$ARTIFACT_DIR/05-p5c-source-before.sha256"

        echo "P5C_BOUNDARY=PASS" | tee "$ARTIFACT_DIR/05-p5c-boundary.txt"
    - name: Audit accepted SUSFS redirect helper ownership
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' > "$ARTIFACT_DIR/06-susfs-helper-lifetime.txt"
        from pathlib import Path

        text = Path("fs/susfs.c").read_text(encoding="utf-8")
        start = text.find(
            "struct filename *susfs_open_redirect_spoof_do_sys_openat(struct inode *inode)"
        )
        end = text.find("int susfs_open_redirect_spoof_vfs_readlink", start)
        if start < 0 or end < 0:
            raise SystemExit("OPEN_REDIRECT helper boundary missing")
        body = text[start:end]

        checks = {
            "SRCU_READ_LOCK":
                "srcu_read_lock(&susfs_srcu_open_redirect)" in body,
            "GETNAME_KERNEL_COPY":
                "new_filename = getname_kernel(entry->info.redirected_pathname);" in body,
            "SRCU_UNLOCK_BEFORE_RETURN":
                body.find("srcu_read_unlock(&susfs_srcu_open_redirect, srcu_idx);") <
                body.find("return new_filename;"),
            "NO_ENTRY_POINTER_RETURNED":
                "return entry" not in body,
        }
        for label, ok in checks.items():
            print(f"{label}={'PASS' if ok else 'FAIL'}")
        if not all(checks.values()):
            raise SystemExit("SUSFS helper ownership audit failed")

        print("P5D_REDIRECT_FILENAME_OWNERSHIP=CALLER_MUST_PUTNAME")
        print("P5D_SUSFS_HELPER_LIFETIME=PASS")
        PY
        grep -Fq 'P5D_SUSFS_HELPER_LIFETIME=PASS' "$ARTIFACT_DIR/06-susfs-helper-lifetime.txt"
    - name: Target-compile accepted P5C baseline namei
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf "$BASELINE_BUILD_DIR"
        make O="$BASELINE_BUILD_DIR" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- veux_defconfig
        make O="$BASELINE_BUILD_DIR" \
          ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          -j2 fs/namei.o 2>&1 | tee "$ARTIFACT_DIR/07-p5c-baseline-namei-build.log"
        test -s "$BASELINE_BUILD_DIR/fs/namei.o"

        echo "P5C_BASELINE_NAMEI_OBJECT_COMPILE=PASS" \
          | tee "$ARTIFACT_DIR/07-p5c-baseline-namei-build.txt"
    - name: Integrate P5D normal-path nested-nameidata redirect
      working-directory: kernel
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nfrom pathlib import Path\n\nnamei_path = Path(\"fs/namei.c\")\nsusfs_h_path = Path(\"include/linux/susfs.h\")\n\nnamei = namei_path.read_text(encoding=\"utf-8\")\nsusfs_h = susfs_h_path.read_text(encoding=\"utf-8\")\n\ninclude_anchor = \"#include <linux/uaccess.h>\\n\"\ninclude_replacement = (\n    \"#include <linux/uaccess.h>\\n\"\n    \"\\n\"\n    \"#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\\n\"\n    \"#include <linux/susfs.h>\\n\"\n    \"#endif\\n\"\n)\nif namei.count(include_anchor) != 1:\n    raise SystemExit(\"namei include anchor mismatch\")\nnamei = namei.replace(include_anchor, include_replacement, 1)\n\nopen_sig = \"static int clean_gen1_do_open(struct nameidata *nd,\"\nopen_start = namei.find(open_sig)\nif open_start < 0:\n    raise SystemExit(\"clean_gen1_do_open missing\")\n\nbrace = namei.find(\"{\", open_start)\ndepth = 0\nopen_end = None\nfor i in range(brace, len(namei)):\n    if namei[i] == \"{\":\n        depth += 1\n    elif\
        \ namei[i] == \"}\":\n        depth -= 1\n        if depth == 0:\n            open_end = i + 1\n            break\nif open_end is None:\n    raise SystemExit(\"clean_gen1_do_open end missing\")\n\nnested_helper = r\"\"\"\n#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n/*\n * Run the redirected pathname with a distinct nested nameidata.\n *\n * The caller's original nameidata stays current as redirect_nd.saved and its\n * nd->name is never overwritten. This keeps the outer -ECHILD/-ESTALE retry\n * pathname alive after fake_filename is released.\n */\nstatic int clean_gen1_open_redirect_nested(struct nameidata *outer_nd,\n\t\t\t\t\t   const struct path *outer_root,\n\t\t\t\t\t   struct file *file,\n\t\t\t\t\t   const struct open_flags *op,\n\t\t\t\t\t   unsigned flags,\n\t\t\t\t\t   struct filename *fake_filename)\n{\n\tstruct nameidata redirect_nd;\n\tstruct clean_gen1_open_state redirect_state;\n\tconst char *s;\n\tint error;\n\n\tif (WARN_ON(file->f_mode & FMODE_OPENED))\n\t\treturn -EINVAL;\n\
        \n\tif (flags & LOOKUP_ROOT)\n\t\tredirect_nd.root = *outer_root;\n\n\tset_nameidata(&redirect_nd, outer_nd->dfd, fake_filename);\n\ts = path_init(&redirect_nd, flags);\n\n\twhile (!(error = link_path_walk(s, &redirect_nd)) &&\n\t       (error = clean_gen1_open_last_lookups(&redirect_nd, file, op,\n\t\t\t\t\t\t     &redirect_state)) > 0) {\n\t\tredirect_nd.flags &= ~(LOOKUP_OPEN | LOOKUP_CREATE | LOOKUP_EXCL);\n\t\ts = trailing_symlink(&redirect_nd);\n\t}\n\n\tif (!error)\n\t\terror = clean_gen1_do_open(&redirect_nd, file, op, &redirect_state);\n\n\tterminate_walk(&redirect_nd);\n\trestore_nameidata();\n\treturn error;\n}\n#endif\n\"\"\".strip()\n\nnamei = namei[:open_end] + \"\\n\\n\" + nested_helper + \"\\n\" + namei[open_end:]\n\nold_path_block = (\n    \"\\t} else {\\n\"\n    \"\\t\\tstruct clean_gen1_open_state open_state;\\n\"\n    \"\\t\\tconst char *s = path_init(nd, flags);\\n\"\n    \"\\n\"\n    \"\\t\\twhile (!(error = link_path_walk(s, nd)) &&\\n\"\n    \"\\t\\t\\t(error\
        \ = clean_gen1_open_last_lookups(nd, file, op,\\n\"\n    \"\\t\\t\\t\\t\\t\\t\\t       &open_state)) > 0) {\\n\"\n    \"\\t\\t\\tnd->flags &= ~(LOOKUP_OPEN|LOOKUP_CREATE|LOOKUP_EXCL);\\n\"\n    \"\\t\\t\\ts = trailing_symlink(nd);\\n\"\n    \"\\t\\t}\\n\"\n    \"\\n\"\n    \"\\t\\tif (!error)\\n\"\n    \"\\t\\t\\terror = clean_gen1_do_open(nd, file, op, &open_state);\\n\"\n    \"\\n\"\n    \"\\t\\tterminate_walk(nd);\\n\"\n    \"\\t}\"\n)\n\nnew_path_block = (\n    \"\\t} else {\\n\"\n    \"\\t\\tstruct clean_gen1_open_state open_state;\\n\"\n    \"\\t\\tconst char *s;\\n\"\n    \"#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\\n\"\n    \"\\t\\tbool outer_walk_terminated = false;\\n\"\n    \"\\t\\tstruct path redirect_root = { .mnt = NULL, .dentry = NULL };\\n\"\n    \"\\n\"\n    \"\\t\\tif (flags & LOOKUP_ROOT)\\n\"\n    \"\\t\\t\\tredirect_root = nd->root;\\n\"\n    \"#endif\\n\"\n    \"\\t\\ts = path_init(nd, flags);\\n\"\n    \"\\n\"\n    \"\\t\\twhile (!(error = link_path_walk(s, nd))\
        \ &&\\n\"\n    \"\\t\\t\\t(error = clean_gen1_open_last_lookups(nd, file, op,\\n\"\n    \"\\t\\t\\t\\t\\t\\t\\t       &open_state)) > 0) {\\n\"\n    \"\\t\\t\\tnd->flags &= ~(LOOKUP_OPEN|LOOKUP_CREATE|LOOKUP_EXCL);\\n\"\n    \"\\t\\t\\ts = trailing_symlink(nd);\\n\"\n    \"\\t\\t}\\n\"\n    \"\\n\"\n    \"\\t\\tif (!error) {\\n\"\n    \"#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\\n\"\n    \"\\t\\t\\tstruct inode *redirect_inode = d_backing_inode(nd->path.dentry);\\n\"\n    \"\\t\\t\\tstruct filename *fake_filename = NULL;\\n\"\n    \"\\n\"\n    \"\\t\\t\\tif (open_state.phase == CLEAN_GEN1_OPEN_PHASE_FINAL &&\\n\"\n    \"\\t\\t\\t    SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK(redirect_inode))\\n\"\n    \"\\t\\t\\t\\tfake_filename =\\n\"\n    \"\\t\\t\\t\\t\\tsusfs_open_redirect_spoof_do_sys_openat(redirect_inode);\\n\"\n    \"\\n\"\n    \"\\t\\t\\tif (IS_ERR(fake_filename)) {\\n\"\n    \"\\t\\t\\t\\terror = PTR_ERR(fake_filename);\\n\"\n    \"\\t\\t\\t} else if (fake_filename) {\\\
        n\"\n    \"\\t\\t\\t\\tif (WARN_ON(open_state.got_write)) {\\n\"\n    \"\\t\\t\\t\\t\\terror = -EINVAL;\\n\"\n    \"\\t\\t\\t\\t} else {\\n\"\n    \"\\t\\t\\t\\t\\tBUG_ON(file->f_mode & FMODE_OPENED);\\n\"\n    \"\\t\\t\\t\\t\\tterminate_walk(nd);\\n\"\n    \"\\t\\t\\t\\t\\touter_walk_terminated = true;\\n\"\n    \"\\t\\t\\t\\t\\terror = clean_gen1_open_redirect_nested(nd,\\n\"\n    \"\\t\\t\\t\\t\\t\\t\\t\\t\\t  &redirect_root,\\n\"\n    \"\\t\\t\\t\\t\\t\\t\\t\\t\\t  file, op, flags,\\n\"\n    \"\\t\\t\\t\\t\\t\\t\\t\\t\\t  fake_filename);\\n\"\n    \"\\t\\t\\t\\t\\tputname(fake_filename);\\n\"\n    \"\\t\\t\\t\\t}\\n\"\n    \"\\t\\t\\t} else\\n\"\n    \"#endif\\n\"\n    \"\\t\\t\\t{\\n\"\n    \"\\t\\t\\t\\terror = clean_gen1_do_open(nd, file, op, &open_state);\\n\"\n    \"\\t\\t\\t}\\n\"\n    \"\\t\\t}\\n\"\n    \"\\n\"\n    \"#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\\n\"\n    \"\\t\\tif (!outer_walk_terminated)\\n\"\n    \"#endif\\n\"\n    \"\\t\\t\\tterminate_walk(nd);\\n\"\n \
        \   \"\\t}\"\n)\n\nif namei.count(old_path_block) != 1:\n    raise SystemExit(f\"path_openat block mismatch: {namei.count(old_path_block)}\")\nnamei = namei.replace(old_path_block, new_path_block, 1)\n\nheader_anchor = (\n    \"#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\\n\"\n    \"void susfs_add_open_redirect(void __user **user_info);\\n\"\n    \"#endif\\n\"\n)\nheader_replacement = (\n    \"#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\\n\"\n    \"void susfs_add_open_redirect(void __user **user_info);\\n\"\n    \"struct filename *susfs_open_redirect_spoof_do_sys_openat(struct inode *inode);\\n\"\n    \"#endif\\n\"\n)\nif susfs_h.count(header_anchor) != 1:\n    raise SystemExit(\"susfs.h OPEN_REDIRECT declaration anchor mismatch\")\nsusfs_h = susfs_h.replace(header_anchor, header_replacement, 1)\n\nfor forbidden in (\"nd->name = fake_filename\", \"outer_nd->name = fake_filename\"):\n    if forbidden in namei:\n        raise SystemExit(\"forbidden outer nameidata rewrite: \" + forbidden)\n\n\
        required = (\n    \"clean_gen1_open_redirect_nested\",\n    \"set_nameidata(&redirect_nd, outer_nd->dfd, fake_filename);\",\n    \"terminate_walk(&redirect_nd);\",\n    \"restore_nameidata();\",\n    \"putname(fake_filename);\",\n    \"SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK\",\n    \"susfs_open_redirect_spoof_do_sys_openat(redirect_inode)\",\n)\nmissing = [token for token in required if token not in namei]\nif missing:\n    raise SystemExit(\"P5D transform missing: \" + repr(missing))\n\nnamei_path.write_text(namei, encoding=\"utf-8\")\nsusfs_h_path.write_text(susfs_h, encoding=\"utf-8\")\nPY\ngit diff --check -- fs/namei.c include/linux/susfs.h\ngit diff -- fs/namei.c include/linux/susfs.h > \"$ARTIFACT_DIR/08-p5d-source.diff\"\ntest -s \"$ARTIFACT_DIR/08-p5d-source.diff\"\n"
    - name: Adapt compiler-proven SUSFS fsnotify ABI for VEUX 5.4
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        cp fs/susfs.c "$ARTIFACT_DIR/08a-susfs-before-5.4-compat.c"

        python3 - <<'PY'
        from pathlib import Path

        path = Path("fs/susfs.c")
        text = path.read_text(encoding="utf-8")

        old_fallback = """\
        \tif (!info) {
        \t\tstruct st_susfs_enabled_features fallback = { .err = -ENOMEM };
        \t\tcopy_to_user((struct st_susfs_enabled_features __user*)*user_info,
        \t\t\t\t &fallback, sizeof(fallback));
        \t\treturn;
        \t}
        """
        new_fallback = """\
        \tif (!info) {
        \t\tstruct st_susfs_enabled_features fallback = { .err = -ENOMEM };
        \t\tif (copy_to_user((struct st_susfs_enabled_features __user*)*user_info,
        \t\t\t\t &fallback, sizeof(fallback)))
        \t\t\tSUSFS_LOGE("failed to copy enabled-features ENOMEM fallback\\n");
        \t\treturn;
        \t}
        """

        old_fsnotify = """\
        static int susfs_handle_sdcard_inode_event(struct fsnotify_mark *mark, u32 mask,
        \t\t\t\t\t\t\t\t\t\t\tstruct inode *inode, struct inode *dir,
        \t\t\t\t\t\t\t\t\t\t\tconst struct qstr *file_name, u32 cookie)
        {
        \tif (!file_name || file_name->len != 7 ||
        \t    memcmp(file_name->name, "Android", 7))
        \t\treturn 0;

        \tif (test_and_set_bit(0, &sdcard_cleanup_scheduled))
        \t\treturn 0;

        \tSUSFS_LOGI("'%s' detected, mask: 0x%x\\n", SDCARD_ANDROID_PATH, mask);
        \tSUSFS_LOGI("deferring cleanup for 5 seconds\\n");
        \tqueue_delayed_work(system_unbound_wq, &sdcard_cleanup_dwork, 5 * HZ);
        \treturn 0;
        }

        static const struct fsnotify_ops fsnotify_ops = {
        \t.handle_inode_event = susfs_handle_sdcard_inode_event,
        };
        """

        new_fsnotify = """\
        #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)
        static int susfs_handle_sdcard_inode_event(struct fsnotify_mark *mark, u32 mask,
        \t\t\t\t\t\t\t\t\t\t\tstruct inode *inode, struct inode *dir,
        \t\t\t\t\t\t\t\t\t\t\tconst struct qstr *file_name, u32 cookie)
        #else
        static int susfs_handle_sdcard_inode_event(struct fsnotify_group *group,
        \t\t\t\t\t\t\t\t\t\t\tstruct inode *inode,
        \t\t\t\t\t\t\t\t\t\t\tu32 mask, const void *data, int data_type,
        \t\t\t\t\t\t\t\t\t\t\tconst struct qstr *file_name, u32 cookie,
        \t\t\t\t\t\t\t\t\t\t\tstruct fsnotify_iter_info *iter_info)
        #endif
        {
        \tif (!file_name || file_name->len != 7 ||
        \t    memcmp(file_name->name, "Android", 7))
        \t\treturn 0;

        \tif (test_and_set_bit(0, &sdcard_cleanup_scheduled))
        \t\treturn 0;

        \tSUSFS_LOGI("'%s' detected, mask: 0x%x\\n", SDCARD_ANDROID_PATH, mask);
        \tSUSFS_LOGI("deferring cleanup for 5 seconds\\n");
        \tqueue_delayed_work(system_unbound_wq, &sdcard_cleanup_dwork, 5 * HZ);
        \treturn 0;
        }

        static const struct fsnotify_ops fsnotify_ops = {
        #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)
        \t.handle_inode_event = susfs_handle_sdcard_inode_event,
        #else
        \t.handle_event = susfs_handle_sdcard_inode_event,
        #endif
        };
        """

        if text.count(old_fallback) != 1:
            raise SystemExit(f"enabled-features fallback anchor mismatch: {text.count(old_fallback)}")
        if text.count(old_fsnotify) != 1:
            raise SystemExit(f"fsnotify ABI anchor mismatch: {text.count(old_fsnotify)}")

        text = text.replace(old_fallback, new_fallback, 1)
        text = text.replace(old_fsnotify, new_fsnotify, 1)

        required = (
            "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)",
            "static int susfs_handle_sdcard_inode_event(struct fsnotify_group *group,",
            "struct fsnotify_iter_info *iter_info)",
            ".handle_event = susfs_handle_sdcard_inode_event,",
            ".handle_inode_event = susfs_handle_sdcard_inode_event,",
            'SUSFS_LOGE("failed to copy enabled-features ENOMEM fallback\\n");',
            "queue_delayed_work(system_unbound_wq, &sdcard_cleanup_dwork, 5 * HZ);",
        )
        missing = [token for token in required if token not in text]
        if missing:
            raise SystemExit("5.4 SUSFS compatibility transform missing: " + repr(missing))

        if text.count(".handle_event = susfs_handle_sdcard_inode_event,") != 1:
            raise SystemExit("legacy handle_event assignment count mismatch")
        if text.count(".handle_inode_event = susfs_handle_sdcard_inode_event,") != 1:
            raise SystemExit("modern handle_inode_event assignment count mismatch")

        unchecked = """\
        \t\tcopy_to_user((struct st_susfs_enabled_features __user*)*user_info,
        \t\t\t\t &fallback, sizeof(fallback));
        """
        if unchecked in text:
            raise SystemExit("unchecked fallback copy_to_user still present")

        path.write_text(text, encoding="utf-8")
        PY

        git diff --check -- fs/susfs.c
        git diff -- fs/susfs.c > "$ARTIFACT_DIR/08b-susfs-5.4-compat.diff"
        test -s "$ARTIFACT_DIR/08b-susfs-5.4-compat.diff"

        python3 - <<'PY'
        from pathlib import Path
        import difflib
        import os

        before = Path(os.environ["ARTIFACT_DIR"]) / "08a-susfs-before-5.4-compat.c"
        after = Path("fs/susfs.c")

        old = before.read_text(encoding="utf-8")
        new = after.read_text(encoding="utf-8")

        required = {
            "LEGACY_5_4_HANDLER_SIGNATURE":
                "static int susfs_handle_sdcard_inode_event(struct fsnotify_group *group," in new and
                "struct fsnotify_iter_info *iter_info)" in new,
            "LEGACY_5_4_OPS_MEMBER":
                ".handle_event = susfs_handle_sdcard_inode_event," in new,
            "MODERN_HANDLER_PRESERVED":
                "static int susfs_handle_sdcard_inode_event(struct fsnotify_mark *mark, u32 mask," in new,
            "MODERN_OPS_MEMBER_PRESERVED":
                ".handle_inode_event = susfs_handle_sdcard_inode_event," in new,
            "VERSION_SPLIT_5_9":
                new.count("#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)") >= 2,
            "DEFERRED_CLEANUP_PRESERVED":
                "queue_delayed_work(system_unbound_wq, &sdcard_cleanup_dwork, 5 * HZ);" in new,
            "FALLBACK_COPY_RESULT_CONSUMED":
                'SUSFS_LOGE("failed to copy enabled-features ENOMEM fallback\\n");' in new,
        }
        failed = [k for k,v in required.items() if not v]
        if failed:
            raise SystemExit("compat audit failed: " + repr(failed))

        sm = difflib.SequenceMatcher(a=old.splitlines(), b=new.splitlines())
        changed_blocks = [op for op in sm.get_opcodes() if op[0] != "equal"]
        if len(changed_blocks) != 5:
            raise SystemExit(f"unexpected SUSFS compatibility edit blocks: {changed_blocks!r}")

        out = Path(os.environ["ARTIFACT_DIR"]) / "08c-susfs-5.4-compat-audit.txt"
        out.write_text(
            "\n".join([
                "P5D_V4_FAILURE_CLASS=COMPAT_EDIT_BLOCK_ACCOUNTING_GUARD",
                "P5D_V4_SOURCE_TRANSFORM_COMPLETED=YES",
                "P5D_V4_SEQUENCE_MATCHER_EDIT_BLOCKS=5",
                "P5D_V3_FAILURE_CLASS=SUSFS_FSNOTIFY_5_4_CALLBACK_ABI",
                "VEUX_5_4_FSNOTIFY_OPS_MEMBER=handle_event",
                "SUSFS_5_9_PLUS_FSNOTIFY_OPS_MEMBER=handle_inode_event",
                "P5D_SUSFS_5_4_FSNOTIFY_ABI_ADAPTATION=PASS",
                "P5D_SUSFS_MODERN_FSNOTIFY_BRANCH_PRESERVED=PASS",
                "P5D_SUSFS_DEFERRED_CLEANUP_PRESERVED=PASS",
                "P5D_ENABLED_FEATURES_FALLBACK_COPY_RESULT=CHECKED",
                "P5D_SUSFS_COMPAT_EDIT_BLOCKS=5",
                "P5D_NORMAL_PATH_SOURCE_SEMANTICS_CHANGED_FROM_V3=NO",
            ]) + "\n",
            encoding="utf-8",
        )
        PY

        cat "$ARTIFACT_DIR/08c-susfs-5.4-compat-audit.txt"
    - name: Audit nested-nameidata lifetime contract
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' > "$ARTIFACT_DIR/09-p5d-lifetime-audit.txt"
        from pathlib import Path

        text = Path("fs/namei.c").read_text(encoding="utf-8")
        hdr = Path("include/linux/susfs.h").read_text(encoding="utf-8")

        nested_start = text.find("static int clean_gen1_open_redirect_nested(")
        tmp_start = text.find("struct dentry *vfs_tmpfile(", nested_start)
        path_start = text.find("static struct file *path_openat(")
        do_filp_start = text.find("struct file *do_filp_open(", path_start)
        if min(nested_start, tmp_start, path_start, do_filp_start) < 0:
            raise SystemExit("P5D function boundary missing")

        nested = text[nested_start:tmp_start]
        path = text[path_start:do_filp_start]
        do_filp = text[do_filp_start:text.find("struct file *do_file_open_root(", do_filp_start)]

        checks = {
            "AUTHORITATIVE_SUSFS_PROTOTYPE":
                "struct filename *susfs_open_redirect_spoof_do_sys_openat(struct inode *inode);" in hdr,
            "NESTED_NAMEIDATA_LOCAL":
                "struct nameidata redirect_nd;" in nested,
            "NESTED_SET_NAMEIDATA":
                "set_nameidata(&redirect_nd, outer_nd->dfd, fake_filename);" in nested,
            "NESTED_PATH_INIT":
                "s = path_init(&redirect_nd, flags);" in nested,
            "NESTED_LOOKUP_USES_REDIRECT_ND":
                "clean_gen1_open_last_lookups(&redirect_nd, file, op," in nested,
            "NESTED_OPEN_USES_REDIRECT_ND":
                "clean_gen1_do_open(&redirect_nd, file, op, &redirect_state)" in nested,
            "NESTED_TERMINATE_BEFORE_RESTORE":
                nested.find("terminate_walk(&redirect_nd);") <
                nested.find("restore_nameidata();"),
            "LOOKUP_ROOT_PRESERVED":
                "if (flags & LOOKUP_ROOT)" in nested and
                "redirect_nd.root = *outer_root;" in nested,
            "OUTER_ND_NAME_NOT_REPLACED":
                "nd->name =" not in path and "outer_nd->name =" not in nested,
            "ONLY_FINAL_PHASE_ELIGIBLE":
                "open_state.phase == CLEAN_GEN1_OPEN_PHASE_FINAL" in path,
            "INODE_FLAG_PRECHECK":
                "SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK(redirect_inode)" in path,
            "HELPER_ERR_PTR_PROPAGATED":
                "if (IS_ERR(fake_filename))" in path and
                "error = PTR_ERR(fake_filename);" in path,
            "OUTER_TERMINATED_BEFORE_NESTED_RESTART":
                path.find("terminate_walk(nd);") <
                path.find("clean_gen1_open_redirect_nested(nd,"),
            "OUTER_DOUBLE_TERMINATE_GUARDED":
                "bool outer_walk_terminated = false;" in path and
                "outer_walk_terminated = true;" in path and
                "if (!outer_walk_terminated)" in path,
            "FAKE_FILENAME_RELEASE_AFTER_NESTED_RETURNS":
                path.find("clean_gen1_open_redirect_nested(nd,") <
                path.find("putname(fake_filename);"),
            "ALREADY_OPENED_FILE_REJECTED":
                "BUG_ON(file->f_mode & FMODE_OPENED);" in path and
                "WARN_ON(file->f_mode & FMODE_OPENED)" in nested,
            "OUTER_ECHILD_RETRY_PRESERVED":
                "filp = path_openat(&nd, op, flags | LOOKUP_RCU);" in do_filp and
                "filp = path_openat(&nd, op, flags);" in do_filp,
            "OUTER_ESTALE_RETRY_PRESERVED":
                "filp = path_openat(&nd, op, flags | LOOKUP_REVAL);" in do_filp,
        }
        for label, ok in checks.items():
            print(f"{label}={'PASS' if ok else 'FAIL'}")
        failed = [label for label, ok in checks.items() if not ok]
        if failed:
            raise SystemExit("P5D lifetime audit failed: " + ", ".join(failed))

        print("P5D_ORIGINAL_ND_NAME_REMAINS_VALID_ACROSS_OUTER_RETRIES=YES")
        print("P5D_FAKE_FILENAME_LIFETIME_ENDS_AFTER_NESTED_NAMEIDATA_RESTORE=YES")
        print("P5D_NORMAL_PATH_NESTED_NAMEIDATA_CONTRACT=PASS")
        PY
        grep -Fq 'P5D_NORMAL_PATH_NESTED_NAMEIDATA_CONTRACT=PASS' "$ARTIFACT_DIR/09-p5d-lifetime-audit.txt"
