          set -euo pipefail
          test "$P0_CHECKPOINT_COMMIT" = "$EXPECTED_P0_CHECKPOINT_COMMIT"
          test "$P1_CHECKPOINT_COMMIT" = "$EXPECTED_P1_CHECKPOINT_COMMIT"
          test "$P1_OUTER_TREE" = "$EXPECTED_P1_OUTER_TREE"
          test "$RESUKISU_SELECTED_HEAD" = "$EXPECTED_P1_RESUKISU_HEAD"
          test "$RESUKISU_SELECTED_TREE" = "$EXPECTED_P1_RESUKISU_TREE"
