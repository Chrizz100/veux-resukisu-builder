            echo "P1_RESUKISU_TREE=$RESUKISU_SELECTED_TREE"
          } | tee "$ARTIFACT_DIR/22-p1-identity.txt"

      - name: Refuse stale reviewed upstream snapshot
        shell: bash
        run: |
          set -euo pipefail
          current_resu="$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main | awk '{print $1}')"
          current_54="$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/kernel-5.4 | awk '{print $1}')"
          current_510="$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android12-5.10 | awk '{print $1}')"
          current_515="$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android13-5.15 | awk '{print $1}')"
          current_61="$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android14-6.1 | awk '{print $1}')"

          {
            printf 'ReSukiSU-main\t%s\t%s\n' "$SNAPSHOT_RESUKISU_HEAD" "$current_resu"
            printf 'SUSFS-kernel-5.4\t%s\t%s\n' "$SNAPSHOT_SUSFS_54_HEAD" "$current_54"
            printf 'SUSFS-5.10\t%s\t%s\n' "$SNAPSHOT_SUSFS_510_HEAD" "$current_510"
            printf 'SUSFS-5.15\t%s\t%s\n' "$SNAPSHOT_SUSFS_515_HEAD" "$current_515"
            printf 'SUSFS-6.1\t%s\t%s\n' "$SNAPSHOT_SUSFS_61_HEAD" "$current_61"
          } | tee "$ARTIFACT_DIR/23-upstream-drift.tsv"

          drift=0
          [ "$current_resu" = "$SNAPSHOT_RESUKISU_HEAD" ] || drift=1
          [ "$current_54" = "$SNAPSHOT_SUSFS_54_HEAD" ] || drift=1
          [ "$current_510" = "$SNAPSHOT_SUSFS_510_HEAD" ] || drift=1
          [ "$current_515" = "$SNAPSHOT_SUSFS_515_HEAD" ] || drift=1
          [ "$current_61" = "$SNAPSHOT_SUSFS_61_HEAD" ] || drift=1

          if [ "$drift" -ne 0 ]; then
            {
              echo "UPSTREAM_REVIEW_SNAPSHOT_CURRENT=NO"
              echo "P2_MUTATION_ALLOWED=NO"
              echo "ACTION=RERUN_UPSTREAM_SNAPSHOT_AND_REVIEW"
            } | tee "$ARTIFACT_DIR/23-upstream-drift-state.txt"
            echo "ERROR: upstream moved after the reviewed candidate snapshot; stop before P2 mutation." >&2
            exit 1
          fi
          {
            echo "UPSTREAM_REVIEW_SNAPSHOT_CURRENT=YES"
            echo "P2_MUTATION_ALLOWED=YES"
          } | tee "$ARTIFACT_DIR/23-upstream-drift-state.txt"

      - name: Configure P2 manual-hook source contract mode
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("arch/arm64/configs/veux_defconfig")
          lines=p.read_text(encoding="utf-8").splitlines()

          def set_bool(key, enabled):
              kept=[]
              pos=None
              for line in lines:
                  if line.startswith(f"CONFIG_{key}=") or line == f"# CONFIG_{key} is not set":
                      if pos is None:
                          pos=len(kept)
                      continue
                  kept.append(line)
              value=f"CONFIG_{key}=y" if enabled else f"# CONFIG_{key} is not set"
              if pos is None:
                  kept.append(value)
              else:
                  kept.insert(pos, value)
              lines[:] = kept

          set_bool("KSU", True)
          set_bool("KSU_TRACEPOINT_HOOK", False)
          set_bool("KSU_MANUAL_HOOK", True)
          set_bool("KSU_SUSFS", False)
          set_bool("KSU_MANUAL_HOOK_AUTO_SETUID_HOOK", True)
          set_bool("KSU_MANUAL_HOOK_AUTO_INITRC_HOOK", True)
          set_bool("KSU_MANUAL_HOOK_AUTO_INPUT_HOOK", True)
          set_bool("KSU_MULTI_MANAGER_SUPPORT", True)
          p.write_text("\n".join(lines)+"\n", encoding="utf-8")
          PY

          for want in \
            'CONFIG_KSU=y' \
            'CONFIG_KSU_MANUAL_HOOK=y' \
            'CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y' \
            'CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y' \
            'CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y' \
            'CONFIG_KSU_MULTI_MANAGER_SUPPORT=y'
          do
            grep -Fxq "$want" arch/arm64/configs/veux_defconfig
          done
          grep -Fxq '# CONFIG_KSU_TRACEPOINT_HOOK is not set' arch/arm64/configs/veux_defconfig
          grep -Fxq '# CONFIG_KSU_SUSFS is not set' arch/arm64/configs/veux_defconfig
          git diff --check
          git diff -- arch/arm64/configs/veux_defconfig > "$ARTIFACT_DIR/24-p2-defconfig.diff"
          echo "P2_MANUAL_HOOK_CONFIG_SOURCE=PASS" | tee "$ARTIFACT_DIR/24-p2-defconfig-state.txt"

      - name: Create authoritative shared outer-kernel hook contract header
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          cat > include/linux/ksu_hook_contract.h <<'EOF'
          /* SPDX-License-Identifier: GPL-2.0-only */
          #ifndef _LINUX_KSU_HOOK_CONTRACT_H
          #define _LINUX_KSU_HOOK_CONTRACT_H

          #include <linux/compiler.h>
          #include <linux/types.h>

          struct filename;
          struct inode;
          struct stat;
          struct stat64;

          #ifdef CONFIG_KSU

          int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
                                  void *argv, void *envp, int *flags);

          #ifdef CONFIG_KSU_SUSFS
          int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
                                           void *argv, void *envp, int *flags);
          int ksu_handle_faccessat(int *dfd, struct filename **filename,
                                   int *mode, int *flags);
          int ksu_handle_stat(int *dfd, struct filename **filename, int *flags);
          #else
          int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
                                   int *mode, int *flags);
          int ksu_handle_stat(int *dfd, const char __user **filename_user,
                              int *flags);
          #endif

          int ksu_handle_devpts(struct inode *inode);
          void ksu_handle_newfstat_ret(unsigned int *fd,
                                       struct stat __user **statbuf_ptr);

          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          void ksu_handle_fstat64_ret(unsigned long *fd,
                                      struct stat64 __user **statbuf_ptr);
          #endif

          int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,
                                    void __user **arg);

          #endif /* CONFIG_KSU */
          #endif /* _LINUX_KSU_HOOK_CONTRACT_H */
          EOF
          grep -Fq 'const char __user **filename_user' include/linux/ksu_hook_contract.h
          grep -Fq 'struct filename **filename' include/linux/ksu_hook_contract.h
          grep -Fq 'ksu_handle_newfstat_ret' include/linux/ksu_hook_contract.h
          grep -Fq 'ksu_handle_sys_reboot' include/linux/ksu_hook_contract.h
          echo "AUTHORITATIVE_HOOK_CONTRACT_HEADER=PASS" \
            | tee "$ARTIFACT_DIR/25-hook-contract-header-state.txt"

      - name: Make selected ReSukiSU consume authoritative contract and exact upstream version identity
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          su=Path("KernelSU/kernel/feature/sucompat.h")
          t=su.read_text(encoding="utf-8")
          inc='#include <linux/ksu_hook_contract.h>\n'
          if inc not in t:
              anchor='#include "compat/kernel_compat.h"\n'
              if t.count(anchor)!=1:
                  raise SystemExit("sucompat.h include anchor mismatch")
              t=t.replace(anchor, anchor+inc, 1)

          pattern=re.compile(
              r'\n// Handler functions exported for hook_manager\n'
              r'#ifdef CONFIG_KSU_SUSFS\n'
              r'int ksu_handle_faccessat\(.*?\n'
              r'#endif // #ifdef CONFIG_KSU_SUSFS\n',
              re.S
          )
          t,n=pattern.subn('\n', t, count=1)
          if n != 1:
              raise SystemExit("sucompat.h duplicate handler declaration block mismatch")
          su.write_text(t, encoding="utf-8")

          for f in [
              Path("KernelSU/kernel/runtime/ksud_integration.c"),
              Path("KernelSU/kernel/supercall/supercall.c"),
          ]:
              x=f.read_text(encoding="utf-8")
              if inc not in x:
                  m=re.search(r'(^#include [^\n]+\n)', x, flags=re.M)
                  if not m:
                      raise SystemExit(f"include anchor missing: {f}")
                  x=x[:m.end()]+inc+x[m.end():]
                  f.write_text(x, encoding="utf-8")

          kb=Path("KernelSU/kernel/Kbuild")
          x=kb.read_text(encoding="utf-8")
          old='KSU_VERSION := $(shell expr 30000 + $(KSU_LOCAL_VERSION) + 700)\n'
          new=(
              '# CLEAN-GEN1: selected kernel/UAPI lineage is anchored to upstream 419e270b.\n'
              '# Keep manager-visible kernel ABI/version identity explicit; do not fake Git history.\n'
              'CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := 35102\n'
              'KSU_VERSION := $(CLEAN_GEN1_UPSTREAM_COMPAT_VERSION)\n'
          )
          if x.count(old)!=1:
              raise SystemExit("KSU_VERSION Kbuild anchor mismatch")
          kb.write_text(x.replace(old,new,1), encoding="utf-8")
          PY

          test "$(grep -Fc '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/feature/sucompat.h)" -eq 1
          test "$(grep -Fc '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/runtime/ksud_integration.c)" -eq 1
          test "$(grep -Fc '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/supercall/supercall.c)" -eq 1
          ! grep -A12 -F '// Handler functions exported for hook_manager' \
            KernelSU/kernel/feature/sucompat.h | grep -q 'ksu_handle_stat'
          grep -Fxq 'CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := 35102' KernelSU/kernel/Kbuild
          grep -Fxq 'KSU_VERSION := $(CLEAN_GEN1_UPSTREAM_COMPAT_VERSION)' KernelSU/kernel/Kbuild
          ! grep -Fq 'feature/module_load_filter.o' KernelSU/kernel/Kbuild
          test ! -e KernelSU/kernel/feature/module_load_filter.c

          git -C KernelSU add kernel/feature/sucompat.h kernel/runtime/ksud_integration.c \
            kernel/supercall/supercall.c kernel/Kbuild
          git -C KernelSU diff --cached --check
          GIT_AUTHOR_NAME="CLEAN-GEN1 Builder" \
          GIT_AUTHOR_EMAIL="clean-gen1@invalid.local" \
          GIT_AUTHOR_DATE="2026-08-31T00:00:00Z" \
          GIT_COMMITTER_NAME="CLEAN-GEN1 Builder" \
          GIT_COMMITTER_EMAIL="clean-gen1@invalid.local" \
          GIT_COMMITTER_DATE="2026-08-31T00:00:00Z" \
            git -C KernelSU commit -m "CLEAN GEN1 P2 authoritative outer hook contracts"

          P2_RESUKISU_HEAD="$(git -C KernelSU rev-parse HEAD)"
          P2_RESUKISU_TREE="$(git -C KernelSU rev-parse HEAD^{tree})"
          echo "P2_RESUKISU_HEAD=$P2_RESUKISU_HEAD" >> "$GITHUB_ENV"
          echo "P2_RESUKISU_TREE=$P2_RESUKISU_TREE" >> "$GITHUB_ENV"
          {
            echo "P2_RESUKISU_HEAD=$P2_RESUKISU_HEAD"
            echo "P2_RESUKISU_TREE=$P2_RESUKISU_TREE"
            echo "RESUKISU_DEFINITIONS_SHARE_OUTER_CONTRACT=YES"
            echo "MODULE_LOAD_FILTER_PRESENT=NO"
          } | tee "$ARTIFACT_DIR/26-resukisu-contract-state.txt"

      - name: Normalize P1 external hook call sites to the shared contract
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          INC='#include <linux/ksu_hook_contract.h>\n'

          def add_include(path, preferred):
              p=Path(path); t=p.read_text(encoding="utf-8")
              if INC in t:
                  return
              if preferred in t:
                  p.write_text(t.replace(preferred, preferred+INC, 1), encoding="utf-8")
                  return
              m=re.search(r'(^#include [^\n]+\n)', t, flags=re.M)
              if not m:
                  raise SystemExit(f"{path}: include anchor missing")
              p.write_text(t[:m.end()]+INC+t[m.end():], encoding="utf-8")

          p=Path("fs/stat.c")
          add_include(p, '#include <linux/syscalls.h>\n')
          t=p.read_text(encoding="utf-8")
          t,n=re.subn(
              r'\n#ifdef CONFIG_KSU\nextern int ksu_handle_stat\(int \*dfd, const char __user \*\*filename_user,\n'
              r'\s*int \*flags\);\n#endif\n',
              '\n', t, count=1
          )
          if n != 1:
              raise SystemExit("fs/stat.c old local stat extern block mismatch")
          old="#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flags);\n#endif\n"
          new="#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flags);\n#endif\n"
          if t.count(old)!=1:
              raise SystemExit("fs/stat.c manual stat call anchor mismatch")
          t=t.replace(old,new,1)

          if 'ksu_handle_newfstat_ret(&fd, &statbuf);' not in t:
              old_nf="\tif (!error)\n\t\terror = cp_new_stat(&stat, statbuf);\n\n\treturn error;\n"
              new_nf=(
                  "\tif (!error)\n\t\terror = cp_new_stat(&stat, statbuf);\n\n"
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_newfstat_ret(&fd, &statbuf);\n"
                  "#endif\n\treturn error;\n"
              )
              if t.count(old_nf)!=1:
                  raise SystemExit("fs/stat.c newfstat return anchor mismatch")
              t=t.replace(old_nf,new_nf,1)

          if 'SYSCALL_DEFINE2(fstat64' in t and 'ksu_handle_fstat64_ret(&fd, &statbuf);' not in t:
              pat=re.compile(
                  r'(SYSCALL_DEFINE2\(fstat64, unsigned long, fd, struct stat64 __user \*, statbuf\)\n'
                  r'\{\n.*?\n\tif \(!error\)\n\t\terror = cp_new_stat64\(&stat, statbuf\);\n)(\n\treturn error;\n)',
                  re.S
              )
              repl=(
                  r'\1' + '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n'
                  r'\tksu_handle_fstat64_ret(&fd, &statbuf);' + '\n#endif\n' + r'\2'
              )
              t,n=pat.subn(repl,t,count=1)
              if n != 1:
                  raise SystemExit("fs/stat.c fstat64 return anchor mismatch")
          p.write_text(t, encoding="utf-8")

          p=Path("fs/open.c")
          add_include(p, '#include <linux/syscalls.h>\n')
          t=p.read_text(encoding="utf-8")
          t,n=re.subn(
              r'\n#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat\(int \*dfd, const char __user \*\*filename_user,\n'
              r'\s*int \*mode, int \*flags\);\n#endif\n',
              '\n', t, count=1
          )
          if n != 1:
              raise SystemExit("fs/open.c old local faccessat extern block mismatch")
          old="#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n"
          new="#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n"
          if t.count(old)!=1:
              raise SystemExit("fs/open.c faccessat call anchor mismatch")
          p.write_text(t.replace(old,new,1), encoding="utf-8")

          p=Path("fs/exec.c")
          add_include(p, '#include <linux/syscalls.h>\n')
          t=p.read_text(encoding="utf-8")
          decl=re.compile(
              r'\n#ifdef CONFIG_KSU\n'
              r'extern bool ksu_execveat_hook __read_mostly;\n'
              r'extern int ksu_handle_execveat\(.*?\n'
              r'extern int ksu_handle_execveat_sucompat\(.*?\n'
              r'#endif\n',
              re.S
          )
          t,n=decl.subn('\n',t,count=1)
          if n != 1:
              raise SystemExit("fs/exec.c legacy declaration block mismatch")
          dispatch=re.compile(
              r'#ifdef CONFIG_KSU\n'
              r'\tif \(unlikely\(ksu_execveat_hook\)\)\n'
              r'\t\tksu_handle_execveat\(&fd, &filename, &argv, &envp, &flags\);\n'
              r'\telse\n'
              r'\t\tksu_handle_execveat_sucompat\(&fd, &filename, &argv, &envp,\n'
              r'\t\t\t\t\t     &flags\);\n'
              r'#endif\n'
          )
          replacement=(
              '#ifdef CONFIG_KSU_MANUAL_HOOK\n'
              '\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n'
              '#endif\n'
          )
          t,n=dispatch.subn(replacement,t,count=1)
          if n != 1:
              raise SystemExit("fs/exec.c legacy dispatch block mismatch")
          p.write_text(t, encoding="utf-8")

          p=Path("fs/read_write.c")
          t=p.read_text(encoding="utf-8")
          decl=re.compile(
              r'\n#ifdef CONFIG_KSU\n'
              r'extern bool ksu_vfs_read_hook __read_mostly;\n'
              r'extern int ksu_handle_vfs_read\(.*?\n'
              r'#endif\n',
              re.S
          )
          t,n=decl.subn('\n',t,count=1)
          if n != 1:
              raise SystemExit("fs/read_write.c legacy vfs_read declaration block mismatch")
          call=re.compile(
              r'\n#ifdef CONFIG_KSU\n'
              r'\tif \(unlikely\(ksu_vfs_read_hook\)\)\n'
              r'\t\tksu_handle_vfs_read\(&file, &buf, &count, &pos\);\n'
              r'#endif\n'
          )
          t,n=call.subn('\n',t,count=1)
          if n != 1:
              raise SystemExit("fs/read_write.c legacy vfs_read call block mismatch")
          p.write_text(t, encoding="utf-8")

          p=Path("fs/devpts/inode.c")
          add_include(p, '#include <linux/fs.h>\n')
          t=p.read_text(encoding="utf-8")
          t,n=re.subn(
              r'\n#ifdef CONFIG_KSU\nextern int ksu_handle_devpts\(struct inode\*\);\n#endif\n',
              '\n',t,count=1
          )
          if n != 1:
              raise SystemExit("fs/devpts/inode.c local extern mismatch")
          p.write_text(t, encoding="utf-8")

          p=Path("kernel/reboot.c")
          add_include(p, '#include <linux/syscalls.h>\n')
          t=p.read_text(encoding="utf-8")
          if 'ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);' not in t:
              old="\tchar buffer[256];\n\tint ret = 0;\n\n\t/* We only trust the superuser with rebooting the system. */\n"
              new=(
                  "\tchar buffer[256];\n\tint ret = 0;\n\n"
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
                  "#endif\n\n"
                  "\t/* We only trust the superuser with rebooting the system. */\n"
              )
              if t.count(old)!=1:
                  raise SystemExit("kernel/reboot.c syscall anchor mismatch")
              t=t.replace(old,new,1)
          p.write_text(t, encoding="utf-8")
          PY

          git diff --check
          git diff -- fs/stat.c fs/open.c fs/exec.c fs/read_write.c fs/devpts/inode.c \
            kernel/reboot.c include/linux/ksu_hook_contract.h \
            > "$ARTIFACT_DIR/27-p2-hook-contract.diff"
          test -s "$ARTIFACT_DIR/27-p2-hook-contract.diff"
          echo "P2_EXTERNAL_CALLSITE_NORMALIZATION=PASS" \
            | tee "$ARTIFACT_DIR/27-p2-hook-contract-state.txt"

      - name: Prove cross-TU contract source invariants before SUSFS
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          for f in fs/stat.c fs/open.c fs/exec.c fs/devpts/inode.c kernel/reboot.c; do
            if grep -nE '^[[:space:]]*extern[[:space:]].*ksu_(handle|vfs_)' "$f"; then
              echo "ERROR: handwritten KSU extern remains in $f" >&2
              exit 1
            fi
            grep -Fq '#include <linux/ksu_hook_contract.h>' "$f"
          done

          ! grep -RInE '\bksu_vfs_read_hook\b|\bksu_handle_vfs_read\b' fs/read_write.c
          ! grep -RInE '\bksu_execveat_hook\b' fs/exec.c

          grep -Fq 'ksu_handle_stat(&dfd, &filename, &flags);' fs/stat.c
          grep -Fq 'ksu_handle_faccessat(&dfd, &filename, &mode, NULL);' fs/open.c
          grep -Fq '#ifdef CONFIG_KSU_MANUAL_HOOK' fs/stat.c
          grep -Fq '#ifdef CONFIG_KSU_MANUAL_HOOK' fs/open.c
          grep -Fq 'const char __user **filename_user' include/linux/ksu_hook_contract.h

          grep -Fq '#ifdef CONFIG_KSU_SUSFS' include/linux/ksu_hook_contract.h
          grep -Fq 'struct filename **filename' include/linux/ksu_hook_contract.h
          test ! -e fs/susfs.c
          test ! -e include/linux/susfs.h

          grep -Fq 'ksu_handle_execveat' fs/exec.c
          grep -Fq 'ksu_handle_faccessat' fs/open.c
          grep -Fq 'ksu_handle_stat' fs/stat.c
          grep -Fq 'ksu_handle_newfstat_ret' fs/stat.c
          grep -Fq 'ksu_handle_fstat64_ret' fs/stat.c
          grep -Fq 'ksu_handle_sys_reboot' kernel/reboot.c

          grep -Fq '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/feature/sucompat.h
          grep -Fq '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/runtime/ksud_integration.c
          grep -Fq '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/supercall/supercall.c
          grep -Fxq '# CONFIG_KSU_SUSFS is not set' arch/arm64/configs/veux_defconfig

          {
            echo "AUTHORITATIVE_SHARED_HOOK_HEADER=PASS"
            echo "HANDWRITTEN_OUTER_EXTERNS=NONE"
            echo "LEGACY_VFS_READ_HOOK=REMOVED"
            echo "LEGACY_EXECVEAT_BOOL_DISPATCH=REMOVED"
            echo "MANUAL_STAT_FACCESSAT_CONTRACT=CONST_CHAR_USER_DOUBLE_POINTER"
            echo "FUTURE_SUSFS_CONTRACT=STRUCT_FILENAME_DOUBLE_POINTER_DECLARED_ONLY"
            echo "P2_CROSS_TU_SOURCE_CONTRACT=PASS"
          } | tee "$ARTIFACT_DIR/28-cross-tu-contract.txt"

      - name: Prove explicit ReSukiSU version identity without fake Git history
        working-directory: kernel
