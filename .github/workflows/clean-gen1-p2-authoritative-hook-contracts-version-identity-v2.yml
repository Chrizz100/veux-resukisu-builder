      - name: Create P2 reusable vendor-to-checkpoint restore kit
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR/restore-kit"

          git diff --binary "$EXPECTED_VENDOR_SHA" "$P2_CHECKPOINT_COMMIT" \
            > "$ARTIFACT_DIR/restore-kit/vendor-20240619-to-p2-outer.patch"
          test -s "$ARTIFACT_DIR/restore-kit/vendor-20240619-to-p2-outer.patch"

          git -C KernelSU diff --binary \
            "$EXPECTED_P1_RESUKISU_HEAD" "$P2_RESUKISU_HEAD" \
            > "$ARTIFACT_DIR/restore-kit/resukisu-p1-to-p2.patch"
          test -s "$ARTIFACT_DIR/restore-kit/resukisu-p1-to-p2.patch"
          rm -rf "$GITHUB_WORKSPACE/resukisu-p2-patch-check"
          git -C KernelSU worktree add --detach \
            "$GITHUB_WORKSPACE/resukisu-p2-patch-check" \
            "$EXPECTED_P1_RESUKISU_HEAD" >/dev/null
          git -C "$GITHUB_WORKSPACE/resukisu-p2-patch-check" apply --check \
            "$ARTIFACT_DIR/restore-kit/resukisu-p1-to-p2.patch" \
            > "$ARTIFACT_DIR/restore-kit/resukisu-p2-patch-check.txt" 2>&1 || {
              cat "$ARTIFACT_DIR/restore-kit/resukisu-p2-patch-check.txt" >&2
              git -C KernelSU worktree remove --force "$GITHUB_WORKSPACE/resukisu-p2-patch-check" || true
              exit 1
            }
          git -C KernelSU worktree remove --force "$GITHUB_WORKSPACE/resukisu-p2-patch-check"

          git -C KernelSU archive --format=tar "$P2_RESUKISU_HEAD" \
            | zstd -T0 -19 -o "$ARTIFACT_DIR/restore-kit/resukisu-p2-source.tar.zst"

          cat > "$ARTIFACT_DIR/restore-kit/RESTORE-INSTRUCTIONS.txt" <<EOF
          CLEAN-GEN1 P2 deterministic restore
          1. Checkout dereference23/kernel_xiaomi_sm6375 tag 20240619.
          2. Verify vendor HEAD: $EXPECTED_VENDOR_SHA
          3. Apply vendor-20240619-to-p2-outer.patch.
          4. Restore ReSukiSU source from resukisu-p2-source.tar.zst into KernelSU/.
             The resukisu-p1-to-p2.patch is retained as the auditable P1->P2 delta.
          5. Verify outer tree: $P2_OUTER_TREE
          6. Verify ReSukiSU tree: $P2_RESUKISU_TREE
          7. Do not promote or compile if either tree differs.
          EOF

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ["ARTIFACT_DIR"])/"restore-kit"/"manifest.json"
          data={
            "schema":2,
            "project":"CLEAN-GEN1-VEUX-5.4.274",
            "stage":"P2",
            "vendor_sha":os.environ["EXPECTED_VENDOR_SHA"],
            "p0_tree":os.environ["EXPECTED_CUMULATIVE_TREE"],
            "p1_commit":os.environ["EXPECTED_P1_CHECKPOINT_COMMIT"],
            "p1_tree":os.environ["EXPECTED_P1_OUTER_TREE"],
            "p2_commit":os.environ["P2_CHECKPOINT_COMMIT"],
            "p2_tree":os.environ["P2_OUTER_TREE"],
            "p1_resukisu_head":os.environ["EXPECTED_P1_RESUKISU_HEAD"],
            "p2_resukisu_head":os.environ["P2_RESUKISU_HEAD"],
            "p2_resukisu_tree":os.environ["P2_RESUKISU_TREE"],
            "manager_visible_ksu_version":int(os.environ["EXPECTED_UPSTREAM_419_KSU_VERSION"]),
            "fake_empty_commits":False,
            "module_load_filter":False,
            "susfs_integrated":False,
            "kernel_build_performed":False,
            "fast_restore_from_vendor_patch":True,
          }
          out.write_text(json.dumps(data,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY

          (
            cd "$ARTIFACT_DIR/restore-kit"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          echo "P2_REUSABLE_RESTORE_KIT=PASS" | tee "$ARTIFACT_DIR/32-restore-kit-state.txt"

      - name: Final P2 no-build safety gate
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          test "$(make -s kernelversion)" = "5.4.274"
          test "$(git rev-parse HEAD)" = "$P2_CHECKPOINT_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$P2_OUTER_TREE"
          test "$(git -C KernelSU rev-parse HEAD)" = "$P2_RESUKISU_HEAD"
          test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$P2_RESUKISU_TREE"
          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
          test -f include/linux/ksu_hook_contract.h
          test ! -e fs/susfs.c
          test ! -e include/linux/susfs.h
          test ! -e KernelSU/kernel/feature/module_load_filter.c
          ! grep -Fq 'feature/module_load_filter.o' KernelSU/kernel/Kbuild
          ! grep -RInE '\bksu_vfs_read_hook\b|\bksu_handle_vfs_read\b' fs/read_write.c
          ! grep -RInE '\bksu_execveat_hook\b' fs/exec.c
          test -z "$(git status --porcelain)"
          test -z "$(git -C KernelSU status --porcelain)"
          {
            echo "CLEAN_GEN1_P2_AUTHORITATIVE_CONTRACTS=PASS"
            echo "KERNEL_VERSION=5.4.274"
            echo "P1_OUTER_TREE=$EXPECTED_P1_OUTER_TREE"
            echo "P2_OUTER_TREE=$P2_OUTER_TREE"
            echo "P2_RESUKISU_HEAD=$P2_RESUKISU_HEAD"
            echo "P2_RESUKISU_TREE=$P2_RESUKISU_TREE"
            echo "KSU_VERSION=$EXPECTED_UPSTREAM_419_KSU_VERSION"
            echo "KSU_VERSION_IDENTITY_EXPLICIT=YES"
            echo "FAKE_EMPTY_COMMITS_ADDED=NO"
            echo "AUTHORITATIVE_HOOK_HEADER=include/linux/ksu_hook_contract.h"
            echo "MODULE_LOAD_FILTER_INCLUDED=NO"
            echo "SUSFS_IMPLEMENTATION_INTEGRATED=NO"
            echo "UPSTREAM_REVIEW_SNAPSHOT_CURRENT=YES"
            echo "P2_FAST_RESTORE_FROM_VENDOR_PATCH=YES"
            echo "KERNEL_COMPILE_PERFORMED=NO"
            echo "IMAGE_CREATED=NO"
            echo "DTB_BUILD_PERFORMED=NO"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
            echo "NEXT_STAGE=CLEAN_GEN1_P3"
          } | tee "$ARTIFACT_DIR/33-result.txt"

      - name: Preserve P2 failure evidence if needed
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$ARTIFACT_DIR"
          {
            echo "JOB_STATUS=${{ job.status }}"
            if [ -d "$GITHUB_WORKSPACE/kernel/.git" ]; then
              echo "OUTER_HEAD=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD 2>/dev/null || true)"
              echo "OUTER_TREE=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD^{tree} 2>/dev/null || true)"
              echo "OUTER_STATUS_BEGIN"
              git -C "$GITHUB_WORKSPACE/kernel" status --porcelain 2>/dev/null || true
              echo "OUTER_STATUS_END"
            fi
            if [ -d "$GITHUB_WORKSPACE/kernel/KernelSU/.git" ]; then
              echo "RESUKISU_HEAD=$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD 2>/dev/null || true)"
              echo "RESUKISU_TREE=$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD^{tree} 2>/dev/null || true)"
              echo "RESUKISU_STATUS_BEGIN"
              git -C "$GITHUB_WORKSPACE/kernel/KernelSU" status --porcelain 2>/dev/null || true
              echo "RESUKISU_STATUS_END"
            fi
          } > "$ARTIFACT_DIR/99-job-end-state.txt"
          find "$ARTIFACT_DIR" -maxdepth 2 -type f -printf '%P\n' | sort \
            > "$ARTIFACT_DIR/99-artifact-file-list.txt"
          exit 0

      - name: Upload P2 source checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p2-authoritative-contracts-v2-${{ github.run_id }}
          path: clean-gen1-p2-audit/
          if-no-files-found: error
          retention-days: 90
