name: 57 - VEUX 5.4.302 KernelSU v0.9.5 Manual Hooks Full Compile v3

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w57-v3-veux-5-4-302-kernelsu-v095-manual-hooks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: KernelSU v0.9.5 Manual Hooks - Linux 5.4.302
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      KERNEL_REPOSITORY: dereference23/kernel_xiaomi_sm6375
      KERNEL_REF: f4b8a13a43a130a9aab83cc985ce4d4421291ae6

      KSU_REPOSITORY: tiann/KernelSU
      KSU_REF: b766b98513b5a7eb33bc1c4a76b5702bf1288f07
      KSU_EXPECTED_VERSION: "11872"

      CLANG_REVISION: r416183b
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz

    steps:
      - name: Checkout exact VEUX Linux 5.4.302 source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.KERNEL_REPOSITORY }}
          ref: ${{ env.KERNEL_REF }}
          path: kernel
          fetch-depth: 0
          filter: blob:none

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            cpio \
            rsync \
            python3 \
            xz-utils \
            zstd

      - name: Verify exact Linux 5.4.302 source identity
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          version="$(make -s kernelversion)"

          test "$head" = "$KERNEL_REF"
          test "$version" = "5.4.302"
          test -f arch/arm64/configs/veux_defconfig
          test -f arch/arm64/boot/dts/vendor/xiaomi/veux.dts
          test -d drivers/kernelsu
          test -f drivers/kernelsu/Makefile
          test -f drivers/kernelsu/Kconfig

          {
            echo "W57_VERSION=v3"
            echo "KERNEL_REF=$KERNEL_REF"
            echo "KERNEL_HEAD=$head"
            echo "KERNEL_TREE=$tree"
            echo "KERNEL_VERSION=$version"
            echo "ANDROID_COMMON_MERGE_PERFORMED=NO"
          } | tee "$GITHUB_WORKSPACE/source-identity.log"

      - name: Snapshot original KernelSU integration contract
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"
          mkdir -p "$GITHUB_WORKSPACE/pre-integration"

          makefile_count="$(
            grep -Ec '^[[:space:]]*obj-\$\(CONFIG_KSU\)[[:space:]]*\+=[[:space:]]*kernelsu/[[:space:]]*$' \
              drivers/Makefile || true
          )"

          kconfig_count="$(
            grep -Fc 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || true
          )"

          test "$makefile_count" -eq 1
          test "$kconfig_count" -eq 1

          embedded_version="$(
            sed -nE \
              's/^[[:space:]]*ccflags-y[[:space:]]*\+=[[:space:]]*-DKSU_VERSION=([0-9]+).*/\1/p' \
              drivers/kernelsu/Makefile \
              | head -n1
          )"

          test "$embedded_version" = "12142"

          grep -RhoE '\bksu_[A-Za-z0-9_]+' \
            fs kernel security drivers/input include \
            --exclude-dir=kernelsu \
            --exclude='*.o' \
            2>/dev/null \
            | LC_ALL=C sort -u \
            > "$GITHUB_WORKSPACE/pre-integration/external-ksu-symbols.txt" || true

          external_count="$(
            wc -l < "$GITHUB_WORKSPACE/pre-integration/external-ksu-symbols.txt" \
              | tr -d ' '
          )"

          test "$external_count" -eq 8

          grep -RIlE '\bksu_[A-Za-z0-9_]+' \
            fs kernel security drivers/input include \
            --exclude-dir=kernelsu \
            --exclude='*.o' \
            2>/dev/null \
            | LC_ALL=C sort -u \
            > "$GITHUB_WORKSPACE/pre-integration/hook-source-files.txt" || true

          test -s "$GITHUB_WORKSPACE/pre-integration/hook-source-files.txt"

          while IFS= read -r file; do
            sha256sum "$file"
          done < "$GITHUB_WORKSPACE/pre-integration/hook-source-files.txt" \
            > "$GITHUB_WORKSPACE/pre-integration/hook-source-files.sha256"

          susfs_refs="$(
            {
              grep -RInEi \
                'susfs|sus_path|sus_mount|sus_kstat|open_redirect|spoof_uname|spoof_cmdline' \
                fs kernel security include \
                --exclude='*.o' \
                2>/dev/null || true
            } | wc -l | tr -d ' '
          )"

          test "$susfs_refs" -eq 0

          {
            echo "ORIGINAL_EMBEDDED_KSU_VERSION=$embedded_version"
            echo "DRIVERS_MAKEFILE_KSU_ENTRY_COUNT=$makefile_count"
            echo "DRIVERS_KCONFIG_KSU_ENTRY_COUNT=$kconfig_count"
            echo "EXTERNAL_KSU_SYMBOL_COUNT=$external_count"
            echo "BASE_SUSFS_REFERENCE_LINES=$susfs_refs"
            echo
            cat "$GITHUB_WORKSPACE/pre-integration/external-ksu-symbols.txt"
          } | tee "$GITHUB_WORKSPACE/pre-integration/BASE-CONTRACT.txt"

      - name: Checkout immutable KernelSU v0.9.5
        uses: actions/checkout@v7
        with:
          repository: ${{ env.KSU_REPOSITORY }}
          ref: ${{ env.KSU_REF }}
          path: kernel/KernelSU
          fetch-depth: 0

      - name: Verify KernelSU identity and version
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          test "$(git -C KernelSU rev-parse HEAD)" = "$KSU_REF"
          test -d KernelSU/.git
          test -d KernelSU/kernel
          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Makefile

          ksu_git_count="$(git -C KernelSU rev-list --count HEAD)"
          ksu_version="$((10000 + ksu_git_count + 200))"

          {
            echo "KSU_REF=$KSU_REF"
            echo "KSU_HEAD=$(git -C KernelSU rev-parse HEAD)"
            echo "KSU_GIT_COUNT=$ksu_git_count"
            echo "KSU_CALCULATED_VERSION=$ksu_version"
            echo "KSU_EXPECTED_VERSION=$KSU_EXPECTED_VERSION"
          } | tee "$GITHUB_WORKSPACE/ksu-identity.txt"

          test "$ksu_version" = "$KSU_EXPECTED_VERSION"

          grep -q 'depends on OVERLAY_FS' KernelSU/kernel/Kconfig
          grep -q 'obj-\$(CONFIG_KSU) += kernelsu.o' KernelSU/kernel/Makefile
          grep -q 'KSU_GIT_VERSION.*git rev-list --count HEAD' KernelSU/kernel/Makefile

          # The candidate must satisfy every existing external ksu_* hook symbol.
          grep -RhoE '\bksu_[A-Za-z0-9_]+' \
            KernelSU/kernel \
            2>/dev/null \
            | LC_ALL=C sort -u \
            > "$GITHUB_WORKSPACE/candidate-ksu-symbols.txt" || true

          : > "$GITHUB_WORKSPACE/missing-candidate-symbols.txt"

          while IFS= read -r symbol; do
            [[ -n "$symbol" ]] || continue
            if ! grep -Fxq "$symbol" "$GITHUB_WORKSPACE/candidate-ksu-symbols.txt"; then
              echo "$symbol" >> "$GITHUB_WORKSPACE/missing-candidate-symbols.txt"
            fi
          done < "$GITHUB_WORKSPACE/pre-integration/external-ksu-symbols.txt"

          test ! -s "$GITHUB_WORKSPACE/missing-candidate-symbols.txt"

      - name: Replace embedded KernelSU with pinned v0.9.5 symlink
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          rm -rf drivers/kernelsu
          ln -s ../KernelSU/kernel drivers/kernelsu

          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
          test "$(realpath drivers/kernelsu)" = "$(realpath KernelSU/kernel)"

          makefile_count="$(
            grep -Ec '^[[:space:]]*obj-\$\(CONFIG_KSU\)[[:space:]]*\+=[[:space:]]*kernelsu/[[:space:]]*$' \
              drivers/Makefile || true
          )"

          kconfig_count="$(
            grep -Fc 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || true
          )"

          test "$makefile_count" -eq 1
          test "$kconfig_count" -eq 1

          # Integration must not modify any of the existing VEUX hook source files.
          sha256sum -c "$GITHUB_WORKSPACE/pre-integration/hook-source-files.sha256"

          {
            echo "KSU_DRIVER_MODE=BUILT_IN_SOURCE_SYMLINK"
            echo "KSU_SYMLINK=drivers/kernelsu -> ../KernelSU/kernel"
            echo "DRIVERS_MAKEFILE_KSU_ENTRY_COUNT=$makefile_count"
            echo "DRIVERS_KCONFIG_KSU_ENTRY_COUNT=$kconfig_count"
            echo "EXTERNAL_HOOK_SOURCE_FILES_UNCHANGED=YES"
            echo "SUSFS_INTEGRATED=NO"
          } | tee "$GITHUB_WORKSPACE/integration.txt"

      - name: Verify manual-hook prerequisites statically
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          # Do not run Kconfig here: the pinned Android Clang is intentionally
          # downloaded in the following step. Verify only immutable source facts.
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("arch/Kconfig").read_text(encoding="utf-8", errors="replace")
          match = re.search(
              r"(?ms)^config KPROBES\s*$"
              r"(.*?)(?=^config [A-Z0-9_]+\s*$|\Z)",
              text,
          )
          if not match:
              raise SystemExit("KPROBES stanza not found in arch/Kconfig")

          stanza = match.group(1)
          if not re.search(r"(?m)^\s*depends on MODULES\s*$", stanza):
              raise SystemExit("Expected KPROBES -> MODULES dependency not found")
          if not re.search(r"(?m)^\s*depends on HAVE_KPROBES\s*$", stanza):
              raise SystemExit("Expected KPROBES -> HAVE_KPROBES dependency not found")
          PY

          # The source defconfig must not opt into modules. The resolved config
          # is checked later, after the correct toolchain has been installed.
          if grep -Eq '^CONFIG_MODULES=y$' arch/arm64/configs/veux_defconfig; then
            echo "Source veux_defconfig unexpectedly enables CONFIG_MODULES" >&2
            exit 1
          fi

          # Reconfirm the five known manual-hook source files exist.
          for file in \
            fs/devpts/inode.c \
            fs/exec.c \
            fs/open.c \
            fs/read_write.c \
            fs/stat.c
          do
            test -f "$file"
          done

          {
            echo "KPROBES_REQUIRES_MODULES=YES"
            echo "KPROBES_REQUIRES_HAVE_KPROBES=YES"
            echo "SOURCE_DEFCONFIG_MODULES_ENABLED=NO"
            echo "MANUAL_HOOK_PATH_SELECTED=YES"
            echo "PRE_TOOLCHAIN_KCONFIG_RUN_PERFORMED=NO"
          } | tee "$GITHUB_WORKSPACE/manual-hook-prerequisites.txt"

      - name: Download official Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchain/$CLANG_REVISION"

          curl \
            --fail \
            --location \
            --retry 3 \
            "$CLANG_URL" \
            -o "$RUNNER_TEMP/${CLANG_REVISION}.tar.gz"

          tar \
            -xzf "$RUNNER_TEMP/${CLANG_REVISION}.tar.gz" \
            -C "$GITHUB_WORKSPACE/toolchain/$CLANG_REVISION"

          rm -f "$RUNNER_TEMP/${CLANG_REVISION}.tar.gz"

          echo "$GITHUB_WORKSPACE/toolchain/$CLANG_REVISION/bin" >> "$GITHUB_PATH"

          "$GITHUB_WORKSPACE/toolchain/$CLANG_REVISION/bin/clang" --version \
            | tee "$GITHUB_WORKSPACE/clang-version.txt"

          "$GITHUB_WORKSPACE/toolchain/$CLANG_REVISION/bin/ld.lld" --version \
            | tee -a "$GITHUB_WORKSPACE/clang-version.txt"

      - name: Configure VEUX for KernelSU v0.9.5 manual hooks
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          export PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_REVISION/bin:$PATH"
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"

          rm -rf out-w57

          make \
            O=out-w57 \
            ARCH=arm64 \
            LLVM=1 \
            veux_defconfig \
            2>&1 | tee "$GITHUB_WORKSPACE/config-initial.log"

          test -s out-w57/.config

          # This VEUX 5.4.302 tree already carries the official-style manual KernelSU
          # call sites. Enable only KernelSU itself. Keep MODULES and KPROBES off,
          # matching the existing kernel policy and avoiding a broad config change.
          scripts/config --file out-w57/.config \
            -e KSU \
            -d MODULES \
            -d KPROBES \
            -d KPROBE_EVENTS

          make \
            O=out-w57 \
            ARCH=arm64 \
            LLVM=1 \
            olddefconfig \
            2>&1 | tee "$GITHUB_WORKSPACE/config-olddefconfig.log"

          grep -Fxq 'CONFIG_KSU=y' out-w57/.config
          grep -Fxq 'CONFIG_HAVE_KPROBES=y' out-w57/.config
          grep -Fxq '# CONFIG_MODULES is not set' out-w57/.config

          # On this Kconfig tree, symbols whose dependencies are unsatisfied can
          # disappear from .config entirely instead of being emitted as
          # "# CONFIG_FOO is not set". Both forms mean disabled.
          if grep -q '^CONFIG_KPROBES=' out-w57/.config; then
            echo "CONFIG_KPROBES unexpectedly enabled" >&2
            exit 1
          fi

          if grep -q '^CONFIG_KPROBE_EVENTS=' out-w57/.config; then
            echo "CONFIG_KPROBE_EVENTS unexpectedly enabled" >&2
            exit 1
          fi

          grep -Fxq 'CONFIG_OVERLAY_FS=y' out-w57/.config
          grep -Fxq 'CONFIG_KALLSYMS=y' out-w57/.config

          # We deliberately do not add SUSFS in W57.
          if grep -Eq '^CONFIG_KSU_SUSFS=' out-w57/.config; then
            echo "Unexpected SUSFS config found" >&2
            exit 1
          fi

          # Reconfirm the complete manual-hook contract immediately before build.
          for symbol in \
            ksu_execveat_hook \
            ksu_handle_devpts \
            ksu_handle_execveat \
            ksu_handle_execveat_sucompat \
            ksu_handle_faccessat \
            ksu_handle_stat \
            ksu_handle_vfs_read \
            ksu_vfs_read_hook
          do
            grep -RqsE "\b${symbol}\b" \
              fs kernel security drivers/input include \
              --exclude-dir=kernelsu
            grep -RqsE "\b${symbol}\b" KernelSU/kernel
          done

          sha256sum -c "$GITHUB_WORKSPACE/pre-integration/hook-source-files.sha256"

          {
            echo "W57_CONFIG_CONTRACT"
            echo "KSU_INTEGRATION_PATH=MANUAL_EXISTING_VEUX_HOOKS"
            echo
            grep -E \
              '^(CONFIG_KSU=|CONFIG_HAVE_KPROBES=|CONFIG_OVERLAY_FS=|CONFIG_KALLSYMS=)' \
              out-w57/.config
            grep -F '# CONFIG_MODULES is not set' out-w57/.config
            echo "CONFIG_KPROBES=DISABLED_OR_UNAVAILABLE"
            echo "CONFIG_KPROBE_EVENTS=DISABLED_OR_UNAVAILABLE"
            echo
            echo "SOURCE_DEFCONFIG_SHA256=$(sha256sum arch/arm64/configs/veux_defconfig | awk '{print $1}')"
            echo "GENERATED_CONFIG_SHA256=$(sha256sum out-w57/.config | awk '{print $1}')"
            echo "MANUAL_HOOK_SYMBOL_CONTRACT=8_OF_8"
            echo "EXTERNAL_HOOK_SOURCE_FILES_UNCHANGED=YES"
          } | tee "$GITHUB_WORKSPACE/config-contract.txt"

          make \
            -s \
            O=out-w57 \
            ARCH=arm64 \
            LLVM=1 \
            kernelrelease \
            | tee "$GITHUB_WORKSPACE/kernelrelease.txt"

      - name: Prepare runner memory headroom for LTO
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=== BEFORE SWAP ==="
            date -Is
            free -h
            echo
            swapon --show || true
            echo
            df -h /
            df -h "$GITHUB_WORKSPACE"
          } | tee "$GITHUB_WORKSPACE/resource-before.txt"

          current_swap_bytes="$(
            swapon \
              --show \
              --bytes \
              --noheadings \
              --output SIZE \
              2>/dev/null \
              | awk '{sum += $1} END {printf "%.0f\n", sum + 0}'
          )"
          target_swap_bytes=$((8 * 1024 * 1024 * 1024))

          {
            echo "CURRENT_SWAP_BYTES=$current_swap_bytes"
            echo "TARGET_MINIMUM_SWAP_BYTES=$target_swap_bytes"
          } | tee -a "$GITHUB_WORKSPACE/resource-before.txt"

          # v2 saw an existing 3 GiB /swapfile and therefore did not create its
          # intended 8 GiB headroom. In v3 we require at least 8 GiB total swap.
          # If the hosted runner starts below that threshold, add a separate
          # 8 GiB swap file; do not replace or disable runner-provided swap.
          if (( current_swap_bytes < target_swap_bytes )); then
            available_kb="$(
              df --output=avail -k / \
                | tail -n1 \
                | tr -d ' '
            )"
            required_kb=$((12 * 1024 * 1024))

            if (( available_kb < required_kb )); then
              echo "Insufficient free disk for safe supplemental 8 GiB swap." >&2
              echo "AVAILABLE_KB=$available_kb" >&2
              exit 1
            fi

            sudo swapoff /swapfile-w57-v3 2>/dev/null || true
            sudo rm -f /swapfile-w57-v3

            if ! sudo fallocate -l 8G /swapfile-w57-v3; then
              sudo dd \
                if=/dev/zero \
                of=/swapfile-w57-v3 \
                bs=1M \
                count=8192 \
                status=progress
            fi

            sudo chmod 600 /swapfile-w57-v3
            sudo mkswap /swapfile-w57-v3
            sudo swapon /swapfile-w57-v3
          fi

          final_swap_bytes="$(
            swapon \
              --show \
              --bytes \
              --noheadings \
              --output SIZE \
              2>/dev/null \
              | awk '{sum += $1} END {printf "%.0f\n", sum + 0}'
          )"

          {
            echo
            echo "=== AFTER SWAP ==="
            date -Is
            echo "FINAL_SWAP_BYTES=$final_swap_bytes"
            free -h
            echo
            swapon --show
            echo
            df -h /
            df -h "$GITHUB_WORKSPACE"
          } | tee -a "$GITHUB_WORKSPACE/resource-before.txt"

          if (( final_swap_bytes < target_swap_bytes )); then
            echo "Swap headroom contract not reached." >&2
            exit 1
          fi

      - name: Full compile Linux 5.4.302 Image
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          export PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_REVISION/bin:$PATH"
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"

          {
            echo "Starting W57-v3 VEUX 5.4.302 KernelSU v0.9.5 manual-hook Image build"
            echo "Requested make jobs: 2"
            echo "Host CPUs: $(nproc)"
            echo "RUN_ID=${GITHUB_RUN_ID:-unknown}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT:-unknown}"
            echo
            free -h
            echo
            swapon --show || true
            echo
            df -h "$GITHUB_WORKSPACE"
          } | tee "$GITHUB_WORKSPACE/build-resource-start.txt"

          # Keep a lightweight heartbeat in BOTH the Actions console log and
          # a file. If the hosted runner/job is externally cancelled before
          # artifact upload can execute, the console log still preserves the
          # last observed memory/swap state and timestamp.
          (
            while true; do
              now="$(date -Is)"
              mem_available_kb="$(
                awk '/^MemAvailable:/ {print $2}' /proc/meminfo
              )"
              swap_free_kb="$(
                awk '/^SwapFree:/ {print $2}' /proc/meminfo
              )"
              swap_total_kb="$(
                awk '/^SwapTotal:/ {print $2}' /proc/meminfo
              )"
              loadavg="$(cut -d ' ' -f1-3 /proc/loadavg)"

              printf \
                'W57_RESOURCE_HEARTBEAT time=%s mem_available_kb=%s swap_free_kb=%s swap_total_kb=%s load="%s"\n' \
                "$now" \
                "$mem_available_kb" \
                "$swap_free_kb" \
                "$swap_total_kb" \
                "$loadavg" \
                | tee -a "$GITHUB_WORKSPACE/resource-monitor.log"

              sleep 30
            done
          ) &
          monitor_pid=$!

          cleanup_monitor() {
            kill "$monitor_pid" >/dev/null 2>&1 || true
            wait "$monitor_pid" >/dev/null 2>&1 || true
          }
          trap cleanup_monitor EXIT

          log_signal_and_exit() {
            signal_name="$1"
            exit_code="$2"
            {
              echo "SIGNAL_RECEIVED=$signal_name"
              echo "SIGNAL_TIME=$(date -Is)"
              echo "SIGNAL_EXIT_CODE=$exit_code"
            } | tee -a "$GITHUB_WORKSPACE/compile-exit.txt"
            exit "$exit_code"
          }

          trap 'log_signal_and_exit INT 130' INT
          trap 'log_signal_and_exit TERM 143' TERM
          trap 'log_signal_and_exit HUP 129' HUP

          set +e
          make \
            -j2 \
            O=out-w57 \
            ARCH=arm64 \
            LLVM=1 \
            Image \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          make_rc=${PIPESTATUS[0]}
          set -e

          {
            echo "MAKE_EXIT_CODE=$make_rc"
            echo "COMPILE_END_TIME=$(date -Is)"
          } | tee -a "$GITHUB_WORKSPACE/compile-exit.txt"

          {
            echo "=== AFTER MAKE ==="
            date -Is
            free -h
            echo
            swapon --show || true
            echo
            df -h "$GITHUB_WORKSPACE"
          } | tee "$GITHUB_WORKSPACE/resource-after.txt"

          echo "make_exit_code=$make_rc" >> "$GITHUB_OUTPUT"

          exit "$make_rc"

      - name: Record compile step outcome
        if: ${{ always() }}
        shell: bash
        run: |
          set -u

          {
            echo "W57-v3 GitHub Actions compile outcome"
            echo "STEP_OUTCOME=${{ steps.compile.outcome }}"
            echo "STEP_CONCLUSION=${{ steps.compile.conclusion }}"
            echo "RUN_ID=${GITHUB_RUN_ID:-unknown}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT:-unknown}"
            echo "RECORDED_AT=$(date -Is)"
            echo
            free -h || true
            echo
            swapon --show || true
            echo
            df -h "$GITHUB_WORKSPACE" || true
          } | tee "$GITHUB_WORKSPACE/workflow-compile-outcome.txt"

          sudo dmesg -T 2>/dev/null \
            | tail -n 250 \
            > "$GITHUB_WORKSPACE/dmesg-tail.txt" || true

      - name: Verify compiled KernelSU image
        if: ${{ steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          IMAGE="out-w57/arch/arm64/boot/Image"
          VMLINUX="out-w57/vmlinux"
          SYSTEM_MAP="out-w57/System.map"
          CONFIG="out-w57/.config"

          test -s "$IMAGE"
          test -s "$VMLINUX"
          test -s "$SYSTEM_MAP"
          test -s "$CONFIG"

          # KernelSU Makefile prints the computed version while compiling.
          grep -F -- "-- KernelSU version: $KSU_EXPECTED_VERSION" \
            "$GITHUB_WORKSPACE/build.log"

          for symbol in \
            kernelsu_init \
            ksu_handle_execveat \
            ksu_handle_execveat_sucompat \
            ksu_handle_faccessat \
            ksu_handle_stat \
            ksu_handle_vfs_read \
            ksu_handle_devpts
          do
            grep -Eq "[[:space:]]${symbol}$" "$SYSTEM_MAP"
          done

          sha256sum -c "$GITHUB_WORKSPACE/pre-integration/hook-source-files.sha256"

          {
            echo "W57-v3 VEUX 5.4.302 KernelSU v0.9.5"
            echo
            echo "KERNEL_SOURCE_HEAD=$(git rev-parse HEAD)"
            echo "KERNEL_VERSION=$(make -s kernelversion)"
            echo "KERNEL_RELEASE=$(cat "$GITHUB_WORKSPACE/kernelrelease.txt")"
            echo "KSU_HEAD=$(git -C KernelSU rev-parse HEAD)"
            echo "KSU_VERSION=$KSU_EXPECTED_VERSION"
            echo "KSU_DRIVER_MODE=BUILT_IN_SOURCE_SYMLINK"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KPROBES=n"
            echo "CONFIG_HAVE_KPROBES=y"
            echo "CONFIG_KPROBE_EVENTS=n_or_unavailable"
            echo "CONFIG_MODULES=n"
            echo "KSU_INTEGRATION_PATH=MANUAL_EXISTING_VEUX_HOOKS"
            echo "SUSFS_INTEGRATED=NO"
            echo
            echo "IMAGE_BYTES=$(stat -c '%s' "$IMAGE")"
            echo "IMAGE_SHA256=$(sha256sum "$IMAGE" | awk '{print $1}')"
            echo "VMLINUX_SHA256=$(sha256sum "$VMLINUX" | awk '{print $1}')"
            echo "SYSTEM_MAP_SHA256=$(sha256sum "$SYSTEM_MAP" | awk '{print $1}')"
            echo "CONFIG_SHA256=$(sha256sum "$CONFIG" | awk '{print $1}')"
            echo
            echo "FULL_KERNEL_IMAGE_BUILD=PASS"
            echo "KERNELSU_SYMBOL_CHECK=PASS"
            echo "EXTERNAL_HOOK_SOURCE_FILES_UNCHANGED=YES"
            echo "BOOT_COMPATIBILITY_PROVEN=NO"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } | tee "$GITHUB_WORKSPACE/BUILD-INFO.txt"

      - name: Prepare build artifact
        if: ${{ steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"
          rm -rf artifact
          mkdir -p artifact

          cp kernel/out-w57/arch/arm64/boot/Image artifact/Image
          cp kernel/out-w57/.config artifact/veux-5.4.302-kernelsu-v0.9.5.config
          cp kernel/out-w57/System.map artifact/System.map
          cp BUILD-INFO.txt artifact/
          cp source-identity.log artifact/
          cp ksu-identity.txt artifact/
          cp integration.txt artifact/
          cp manual-hook-prerequisites.txt artifact/
          cp config-contract.txt artifact/
          cp clang-version.txt artifact/
          cp kernelrelease.txt artifact/
          cp config-initial.log artifact/
          cp config-olddefconfig.log artifact/
          cp build.log artifact/
          cp resource-before.txt artifact/
          cp build-resource-start.txt artifact/
          cp resource-monitor.log artifact/
          cp resource-after.txt artifact/
          cp compile-exit.txt artifact/
          cp workflow-compile-outcome.txt artifact/
          if [[ -f dmesg-tail.txt ]]; then cp dmesg-tail.txt artifact/; fi
          cp pre-integration/BASE-CONTRACT.txt artifact/
          cp pre-integration/external-ksu-symbols.txt artifact/
          cp pre-integration/hook-source-files.txt artifact/
          cp pre-integration/hook-source-files.sha256 artifact/

          sha256sum \
            artifact/Image \
            artifact/veux-5.4.302-kernelsu-v0.9.5.config \
            artifact/System.map \
            artifact/BUILD-INFO.txt \
            > artifact/SHA256SUMS.txt

      - name: Upload successful W57-v3 build
        if: ${{ steps.compile.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: W57-v3-VEUX-5_4_302-KernelSU-v0_9_5-MANUAL-HOOKS
          path: artifact/
          retention-days: 14
          if-no-files-found: error

      - name: Prepare failure diagnostics
        if: ${{ always() && steps.compile.outcome != 'success' }}
        shell: bash
        run: |
          set -u

          mkdir -p "$GITHUB_WORKSPACE/failure-artifact"

          for file in \
            source-identity.log \
            ksu-identity.txt \
            integration.txt \
            manual-hook-prerequisites.txt \
            clang-version.txt \
            config-initial.log \
            config-olddefconfig.log \
            config-contract.txt \
            kernelrelease.txt \
            build.log \
            resource-before.txt \
            build-resource-start.txt \
            resource-monitor.log \
            resource-after.txt \
            compile-exit.txt \
            workflow-compile-outcome.txt \
            dmesg-tail.txt \
            candidate-ksu-symbols.txt \
            missing-candidate-symbols.txt
          do
            if [[ -f "$GITHUB_WORKSPACE/$file" ]]; then
              cp "$GITHUB_WORKSPACE/$file" "$GITHUB_WORKSPACE/failure-artifact/"
            fi
          done

          if [[ -f "$GITHUB_WORKSPACE/kernel/out-w57/.config" ]]; then
            cp \
              "$GITHUB_WORKSPACE/kernel/out-w57/.config" \
              "$GITHUB_WORKSPACE/failure-artifact/failed.config"
          fi

          if [[ -d "$GITHUB_WORKSPACE/pre-integration" ]]; then
            cp -a \
              "$GITHUB_WORKSPACE/pre-integration" \
              "$GITHUB_WORKSPACE/failure-artifact/"
          fi

          {
            echo "W57-v3 compile step did not reach a successful Image verification."
            echo "No boot image was created."
            echo "No flashable ZIP was created."
            echo "No device was accessed."
            echo "No flashing was performed."
          } > "$GITHUB_WORKSPACE/failure-artifact/FAILURE-SCOPE.txt"

      - name: Upload W57-v3 failure diagnostics
        if: ${{ always() && steps.compile.outcome != 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: W57-v3-VEUX-5_4_302-KernelSU-v0_9_5-MANUAL-HOOKS-FAILURE
          path: failure-artifact/
          retention-days: 14
          if-no-files-found: warn

      - name: Mark compile failure after diagnostics
        if: ${{ always() && steps.compile.outcome != 'success' }}
        shell: bash
        run: |
          echo "The compile did not finish successfully; diagnostics were attempted above."
          exit 1
