          import gzip
          import hashlib
          import json
          import sys
          from pathlib import Path

          stock = Path(sys.argv[1]).read_bytes()
          custom = Path(sys.argv[2]).read_bytes()
          rollback_gz = Path(sys.argv[3])
          json_out = Path(sys.argv[4])
          text_out = Path(sys.argv[5])

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def need(condition, message):
              if not condition:
                  raise SystemExit("ERROR: " + message)

          with gzip.open(rollback_gz, "rb") as handle:
              rollback = handle.read()

          need(len(stock) == len(custom) == len(rollback) == 134217728, "partition sizes")
          need(sha(stock) == "ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5", "stock identity")
          need(sha(custom) == "2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e", "custom identity")
          need(rollback == stock, "rollback payload differs from exact stock")

          fake_partition = bytearray(stock)
          prewrite = sha(fake_partition)

          fake_partition[:] = custom
          after_custom = sha(fake_partition)

          fake_partition[:] = rollback
          after_rollback = sha(fake_partition)

          need(prewrite == sha(stock), "prewrite stock hash")
          need(after_custom == sha(custom), "direct custom write hash")
          need(after_rollback == sha(stock), "direct rollback hash")

          result = {
              "result": "PASS_DIRECT_WRITE_AND_ROLLBACK_MODEL",
              "partition_bytes": len(stock),
              "prewrite_stock_sha256": prewrite,
              "after_custom_write_sha256": after_custom,
              "after_stock_rollback_sha256": after_rollback,
              "custom_write_exact": True,
              "rollback_exact_stock": rollback == stock,
              "device_accessed": False,
              "flashed": False,
          }

          json_out.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          text = f"""DIRECT WRITE / ROLLBACK MODEL
          =============================
          RESULT: PASS_DIRECT_WRITE_AND_ROLLBACK_MODEL

          Fake partition bytes: {len(stock)}
          Initial stock SHA-256: {prewrite}
          After exact custom write: {after_custom}
          After exact rollback: {after_rollback}

          No boot repack occurred.
          No device was accessed.
          Nothing was flashed.
          """

