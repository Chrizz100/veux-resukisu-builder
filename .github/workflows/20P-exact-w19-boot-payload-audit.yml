name: 20P - VEUX Exact W19 Boot Payload Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  W17_ARTIFACT_NAME: "veux-5.4.274-resukisu-susfs-2.2-final-release-candidate-1"
  W18_ARTIFACT_NAME: "veux-os1.0.12.0-workflow18-stock-rom-audit-3"
  W19_ARTIFACT_NAME: "veux-5.4.274-workflow19-boot-v3-dryrun-repack-avb-audit-1"
  W20R2_ARTIFACT_NAME: "veux-5.4.274-workflow20R2-anykernel3-runtime-differential-1"

  W17_IMAGE_BYTES: "29839872"
  W17_IMAGE_SHA256: "e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96"
  W17_CANDIDATE_TREE: "5d25b7e0124d7fb695f3f07b45928fcb5780d0e8"
  W17_RESUKISU_COMMIT: "faccf4c5edc7be37776216e7d43dd3dca0239331"

  STOCK_BOOT_BYTES: "134217728"
  STOCK_BOOT_SHA256: "ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5"
  STOCK_VENDOR_BOOT_SHA256: "583e1f4c0e09c2267cda88bd48a8b4f56cf5c5e034fbda7b25bd65aa86385425"
  STOCK_DTBO_SHA256: "e9f3bae2c5417ff297162f1e7d2652ee98b347488fdf091d61daa986fbfb7690"
  STOCK_VBMETA_SHA256: "62a5b1a94c2247c786e8148b9d9d0aea943b57b1034b3fd82d9cac9a85fcde97"

  W19_BOOT_SHA256: "2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e"
  W19_AVB_DIGEST: "8b6af8a52796027ece9afb816e2354e0a9548808226749400fe8de86e0fdf397"
  W19_PAYLOAD_END: "51912704"

  W20R2_MAGISKBOOT_SHA256: "bd355dc513524105216ce89f5bdbf286629473b315d7f702fa2f183715ef06ec"
  STOCK_BOOT_AVB_DIGEST: "fc6d91cd4ce2e89703c59e6a35c60e3efd984cfb54a29760e4a3105c42399d8a"

  AK3_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_COMMIT: "e4b1bb25ca2aabcfd57f694a5998d87130701b71"
  AK3_CORE_BLOB: "d9692acdb3501a7ccb60576ecce435e7a30156dc"
  UPDATE_BINARY_BLOB: "8c7006e7e3f6ef10f8f4117b291d6df204ef285e"
  MAGISKBOOT_BLOB: "56207debdf74b28059672c9ae39cc51897c7ca02"

jobs:
  audit:
    name: Exact W19 direct-boot payload staging audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      WORK: ${{ github.workspace }}/workflow20P
      INPUTS: ${{ github.workspace }}/workflow20P/inputs
      W17: ${{ github.workspace }}/workflow20P/inputs/w17
      W18: ${{ github.workspace }}/workflow20P/inputs/w18
      W19: ${{ github.workspace }}/workflow20P/inputs/w19
      W20R2: ${{ github.workspace }}/workflow20P/inputs/w20r2
      AK3: ${{ github.workspace }}/workflow20P/anykernel3
      PACKAGE: ${{ github.workspace }}/workflow20P/package
      OUTPUT: ${{ github.workspace }}/workflow20P/output
      STAGING_NAME: "DO_NOT_FLASH_VEUX_5.4.274_EXACT_W19_BOOT_PAYLOAD_WORKFLOW20P.zip"

    steps:
      - name: Prepare audit workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORK"

          mkdir -p \
            "$INPUTS" \
            "$W17" \
            "$W18" \
            "$W19" \
            "$W20R2" \
            "$PACKAGE" \
            "$OUTPUT"

          cat > "$OUTPUT/SCOPE.txt" <<'EOF'
          VEUX Workflow 20P
          =================

          PURPOSE:
          Build a DO_NOT_FLASH staging package that writes the exact,
          already-audited Workflow-19 boot image directly.

          THERE IS NO RUNTIME BOOT REPACK.

          The package contains:
          - exact Workflow-19 custom boot.img
          - compressed exact Workflow-18 stock boot rollback image
          - frozen AnyKernel3 shell/runtime tools
          - a hard Workflow-20P staging guard

          The future final installer is designed to:
          - require veux
          - require an A/B slot suffix
          - require positive bootloader-unlocked evidence
          - require the currently installed boot partition to be the exact
            Workflow-18 stock boot
          - require the payload hashes before writing
          - write the exact Workflow-19 boot image directly
          - read back and verify the exact Workflow-19 SHA-256
          - attempt an exact stock rollback if write/readback verification fails

          THIS WORKFLOW DOES NOT ACCESS A PHONE AND DOES NOT FLASH ANYTHING.
          EOF

      - name: Download canonical W17 W18 W19 and W20R2 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ALL="$WORK/artifacts.ndjson"
          : > "$ALL"

          page=1

          while :; do
            PAGE_JSON="$WORK/artifacts-page-${page}.json"

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}" \
              -o "$PAGE_JSON"

            COUNT="$(jq '.artifacts | length' "$PAGE_JSON")"
            jq -c '.artifacts[]' "$PAGE_JSON" >> "$ALL"

            if [ "$COUNT" -lt 100 ]; then
              break
            fi

            page=$((page + 1))

            [ "$page" -le 20 ] || {
              echo "ERROR: artifact pagination safety limit"
              exit 1
            }
          done

          download_artifact() {
            local NAME="$1"
            local DEST="$2"
            local META="$3"

            MATCHES="$(
              jq -s \
                --arg NAME "$NAME" \
                '[.[] | select(.name == $NAME and .expired == false)] | sort_by(.created_at)' \
                "$ALL"
            )"

            COUNT="$(jq 'length' <<< "$MATCHES")"

            [ "$COUNT" -ge 1 ] || {
              echo "ERROR: artifact not found: $NAME"
              exit 1
            }

            SELECTED="$(jq '.[-1]' <<< "$MATCHES")"
            URL="$(jq -r '.archive_download_url' <<< "$SELECTED")"

            jq . <<< "$SELECTED" > "$META"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$URL" \
              -o "$DEST"

            unzip -t "$DEST" > "${DEST}.ziptest.txt"
          }

          download_artifact \
            "$W17_ARTIFACT_NAME" \
            "$INPUTS/w17.zip" \
            "$OUTPUT/W17-ARTIFACT-METADATA.json"

          download_artifact \
            "$W18_ARTIFACT_NAME" \
            "$INPUTS/w18.zip" \
            "$OUTPUT/W18-ARTIFACT-METADATA.json"

          download_artifact \
            "$W19_ARTIFACT_NAME" \
            "$INPUTS/w19.zip" \
            "$OUTPUT/W19-ARTIFACT-METADATA.json"

          download_artifact \
            "$W20R2_ARTIFACT_NAME" \
            "$INPUTS/w20r2.zip" \
            "$OUTPUT/W20R2-ARTIFACT-METADATA.json"

      - name: Verify exact Workflow 17 kernel
        shell: bash
        run: |
          set -euo pipefail

          unzip -q "$INPUTS/w17.zip" -d "$W17"

          (
            cd "$W17"
            sha256sum -c SHA256SUMS > "$OUTPUT/W17-SHA256SUMS.verify.txt"
          )

          test "$(stat -c '%s' "$W17/Image")" = "$W17_IMAGE_BYTES"
          test "$(sha256sum "$W17/Image" | awk '{print $1}')" = "$W17_IMAGE_SHA256"

          grep -Fxq 'RESULT: PASS' "$W17/RELEASE-MANIFEST.txt"
          grep -Fq "Candidate tree: $W17_CANDIDATE_TREE" "$W17/RELEASE-MANIFEST.txt"
          grep -Fq "ReSukiSU commit: $W17_RESUKISU_COMMIT" "$W17/RELEASE-MANIFEST.txt"

          {
            echo "WORKFLOW17=PASS"
            echo "IMAGE_BYTES=$W17_IMAGE_BYTES"
            echo "IMAGE_SHA256=$W17_IMAGE_SHA256"
            echo "CANDIDATE_TREE=$W17_CANDIDATE_TREE"
            echo "RESUKISU_COMMIT=$W17_RESUKISU_COMMIT"
          } > "$OUTPUT/W17-GATE.txt"

      - name: Verify exact Workflow 18 stock images
        shell: bash
        run: |
          set -euo pipefail

          unzip -q "$INPUTS/w18.zip" -d "$W18"

          (
            cd "$W18"
            sha256sum -c SHA256SUMS > "$OUTPUT/W18-SHA256SUMS.verify.txt"
          )

          grep -Fxq \
            'RESULT: PASS_READ_ONLY_REPRODUCED_FROM_FASTBOOT_ROM' \
            "$W18/audit/WORKFLOW18-SUMMARY.txt"

          test "$(stat -c '%s' "$W18/stock_images/stock_boot.img")" = "$STOCK_BOOT_BYTES"
          test "$(sha256sum "$W18/stock_images/stock_boot.img" | awk '{print $1}')" = "$STOCK_BOOT_SHA256"
          test "$(sha256sum "$W18/stock_images/stock_vendor_boot.img" | awk '{print $1}')" = "$STOCK_VENDOR_BOOT_SHA256"
          test "$(sha256sum "$W18/stock_images/stock_dtbo.img" | awk '{print $1}')" = "$STOCK_DTBO_SHA256"
          test "$(sha256sum "$W18/stock_images/stock_vbmeta.img" | awk '{print $1}')" = "$STOCK_VBMETA_SHA256"

          jq -e \
            --arg BOOT "$STOCK_BOOT_SHA256" \
            --arg VENDOR "$STOCK_VENDOR_BOOT_SHA256" \
            --arg DTBO "$STOCK_DTBO_SHA256" \
            --arg VBMETA "$STOCK_VBMETA_SHA256" \
            '
              .result == "PASS_READ_ONLY_REPRODUCED_FROM_FASTBOOT_ROM"
              and .boot.sha256 == $BOOT
              and .vendor_boot.sha256 == $VENDOR
              and .dtbo.sha256 == $DTBO
              and .vbmeta.sha256 == $VBMETA
              and .vbmeta.signature_verifies == true
              and .vbmeta.direct_hashes_verify == true
            ' \
            "$W18/audit/STOCK-ROM-AUDIT.json" \
            > /dev/null

          {
            echo "WORKFLOW18=PASS"
            echo "STOCK_BOOT_SHA256=$STOCK_BOOT_SHA256"
            echo "STOCK_VENDOR_BOOT_SHA256=$STOCK_VENDOR_BOOT_SHA256"
            echo "STOCK_DTBO_SHA256=$STOCK_DTBO_SHA256"
            echo "STOCK_VBMETA_SHA256=$STOCK_VBMETA_SHA256"
          } > "$OUTPUT/W18-GATE.txt"

      - name: Verify exact Workflow 19 custom boot
        shell: bash
        run: |
          set -euo pipefail

          unzip -q "$INPUTS/w19.zip" -d "$W19"

          (
            cd "$W19"
            sha256sum -c SHA256SUMS > "$OUTPUT/W19-SHA256SUMS.verify.txt"
          )

          grep -Fxq \
            'RESULT: PASS_DRYRUN_REPRODUCED_FROM_W17_W18' \
            "$W19/WORKFLOW19-DRYRUN-REPACK-AUDIT.txt"

          CUSTOM="$W19/DO_NOT_FLASH_workflow19_dryrun_boot.img"

          test "$(stat -c '%s' "$CUSTOM")" = "$STOCK_BOOT_BYTES"
          test "$(sha256sum "$CUSTOM" | awk '{print $1}')" = "$W19_BOOT_SHA256"

          jq -e \
            --arg SHA "$W19_BOOT_SHA256" \
            --arg DIGEST "$W19_AVB_DIGEST" \
            --arg IMAGE "$W17_IMAGE_SHA256" \
            '
              .result == "PASS_DRYRUN_REPRODUCED_FROM_W17_W18"
              and .dryrun_boot.sha256 == $SHA
              and .w17_image.sha256 == $IMAGE
              and .embedded_boot_avb.dryrun_digest_hex == $DIGEST
              and .embedded_boot_avb.dryrun_digest_verifies == true
              and .top_level_stock_vbmeta.stock_boot_descriptor_verifies_stock_boot == true
              and .top_level_stock_vbmeta.stock_boot_descriptor_verifies_dryrun_boot == false
              and .top_level_stock_vbmeta.expected_mismatch_for_modified_boot == true
              and .safety.flashed == false
              and .safety.vendor_boot_modified == false
              and .safety.dtbo_modified == false
              and .safety.top_level_vbmeta_modified == false
            ' \
            "$W19/WORKFLOW19-STRUCTURE.json" \
            > /dev/null

          {
            echo "WORKFLOW19=PASS"
            echo "CUSTOM_BOOT_BYTES=$STOCK_BOOT_BYTES"
            echo "CUSTOM_BOOT_SHA256=$W19_BOOT_SHA256"
            echo "EMBEDDED_AVB_DIGEST=$W19_AVB_DIGEST"
            echo "TOP_LEVEL_STOCK_VBMETA_CUSTOM_BOOT_MISMATCH=EXPECTED"
          } > "$OUTPUT/W19-GATE.txt"

      - name: Independently reproduce the W20R2 stale-AVB finding
        shell: bash
        run: |
          set -euo pipefail

          unzip -q "$INPUTS/w20r2.zip" -d "$W20R2"

          (
            cd "$W20R2"
            sha256sum -c SHA256SUMS > "$OUTPUT/W20R2-SHA256SUMS.verify.txt"
          )

          BAD="$W20R2/DO_NOT_FLASH_MAGISKBOOT_EMULATED_BOOT.img"
          GOOD="$W19/DO_NOT_FLASH_workflow19_dryrun_boot.img"

          test "$(stat -c '%s' "$BAD")" = "$STOCK_BOOT_BYTES"
          test "$(sha256sum "$BAD" | awk '{print $1}')" = "$W20R2_MAGISKBOOT_SHA256"

          python3 - \
            "$GOOD" \
            "$BAD" \
            "$OUTPUT/W20R2-INDEPENDENT-DIFFERENTIAL.json" \
            "$OUTPUT/W20R2-INDEPENDENT-DIFFERENTIAL.txt" <<'PY'
          import hashlib
          import json
          import struct
          import sys
          from pathlib import Path

          good = Path(sys.argv[1]).read_bytes()
          bad = Path(sys.argv[2]).read_bytes()
          json_out = Path(sys.argv[3])
          text_out = Path(sys.argv[4])

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def need(condition, message):
              if not condition:
                  raise SystemExit("ERROR: " + message)

          def boot_descriptor(data):
              footer = data[-64:]
              need(footer[:4] == b"AVBf", "footer magic")

              major, minor = struct.unpack_from(">II", footer, 4)
              original, vbmeta_offset, vbmeta_size = struct.unpack_from(">QQQ", footer, 12)

              vb = data[vbmeta_offset:vbmeta_offset + vbmeta_size]
              need(vb[:4] == b"AVB0", "vbmeta magic")

              auth_size, _ = struct.unpack_from(">QQ", vb, 12)
              values = struct.unpack_from(">QQQQQQQQQQQ", vb, 32)
              descriptors_offset = values[8]
              descriptors_size = values[9]

              pos = 256 + auth_size + descriptors_offset
              end = pos + descriptors_size

              while pos < end:
                  tag, following = struct.unpack_from(">QQ", vb, pos)
                  raw = vb[pos:pos + 16 + following]

                  if tag == 2:
                      image_size = struct.unpack_from(">Q", raw, 16)[0]
                      algorithm = raw[24:56].split(b"\0", 1)[0].decode("ascii", "replace")
                      name_len, salt_len, digest_len, flags = struct.unpack_from(">IIII", raw, 56)
                      q = 132
                      partition = raw[q:q + name_len].decode("ascii", "replace")
                      q += name_len
                      salt = raw[q:q + salt_len]
                      q += salt_len
                      digest = raw[q:q + digest_len]

                      if partition == "boot":
                          calculated = hashlib.sha256(salt + data[:image_size]).digest()
                          return {
                              "footer_version": f"{major}.{minor}",
                              "original_image_size": original,
                              "vbmeta_offset": vbmeta_offset,
                              "vbmeta_size": vbmeta_size,
                              "image_size": image_size,
                              "algorithm": algorithm,
                              "flags": flags,
                              "digest": digest.hex(),
                              "calculated": calculated.hex(),
                              "verifies": digest == calculated,
                          }

                  pos += 16 + following

              raise SystemExit("ERROR: boot hash descriptor not found")

          need(len(good) == len(bad) == 134217728, "partition lengths")

          differences = [
              index
              for index, (left, right) in enumerate(zip(good, bad))
              if left != right
          ]

          ranges = []

          if differences:
              start = previous = differences[0]

              for value in differences[1:]:
                  if value == previous + 1:
                      previous = value
                      continue

                  ranges.append([start, previous])
                  start = previous = value

              ranges.append([start, previous])

          good_avb = boot_descriptor(good)
          bad_avb = boot_descriptor(bad)

          need(sha(good) == "2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e", "W19 identity")
          need(sha(bad) == "bd355dc513524105216ce89f5bdbf286629473b315d7f702fa2f183715ef06ec", "W20R2 identity")
          need(len(differences) == 35, f"expected 35 differing bytes, got {len(differences)}")
          need(ranges == [[51912980, 51912982], [51913128, 51913159]], f"unexpected diff ranges: {ranges}")

          need(good_avb["image_size"] == 51912704, "W19 AVB image_size")
          need(good_avb["digest"] == "8b6af8a52796027ece9afb816e2354e0a9548808226749400fe8de86e0fdf397", "W19 AVB digest")
          need(good_avb["verifies"] is True, "W19 AVB verification")

          need(bad_avb["image_size"] == 67551232, "magiskboot stale AVB image_size")
          need(bad_avb["digest"] == "fc6d91cd4ce2e89703c59e6a35c60e3efd984cfb54a29760e4a3105c42399d8a", "magiskboot stale AVB digest")
          need(bad_avb["verifies"] is False, "magiskboot stale AVB must fail verification")

          result = {
              "result": "PASS_W20R2_STALE_AVB_REPRODUCED",
              "workflow19_sha256": sha(good),
              "magiskboot_sha256": sha(bad),
              "different_bytes": len(differences),
              "difference_ranges": ranges,
              "workflow19_avb": good_avb,
              "magiskboot_avb": bad_avb,
          }

          json_out.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          text = f"""W20R2 INDEPENDENT DIFFERENTIAL
          =================================
          RESULT: PASS_W20R2_STALE_AVB_REPRODUCED

          Workflow-19 SHA-256:
          {sha(good)}

          magiskboot runtime SHA-256:
          {sha(bad)}

          Different bytes: {len(differences)}
          Difference ranges: {ranges}

          Workflow-19 embedded boot descriptor:
          image_size={good_avb['image_size']}
          digest={good_avb['digest']}
          verifies={good_avb['verifies']}

          magiskboot embedded boot descriptor:
          image_size={bad_avb['image_size']}
          digest={bad_avb['digest']}
          calculated={bad_avb['calculated']}
          verifies={bad_avb['verifies']}

          INTERPRETATION:
          The magiskboot result kept the stock descriptor image_size and stock
          digest even though the footer/vbmeta moved to the new payload end.
          Therefore the runtime-repack path is intentionally abandoned.
          """

          text_out.write_text(
              "\n".join(line.strip() for line in text.splitlines()).strip() + "\n",
              encoding="utf-8",
          )
          PY

      - name: Deep-audit W19 direct payload against W17 and W18
        shell: bash
        run: |
          set -euo pipefail

          python3 - \
            "$W17/Image" \
            "$W18/stock_images/stock_boot.img" \
            "$W19/DO_NOT_FLASH_workflow19_dryrun_boot.img" \
            "$OUTPUT/DIRECT-PAYLOAD-STRUCTURE.json" \
            "$OUTPUT/DIRECT-PAYLOAD-STRUCTURE.txt" <<'PY'
          import hashlib
          import json
          import struct
          import sys
          from pathlib import Path

          image = Path(sys.argv[1]).read_bytes()
          stock = Path(sys.argv[2]).read_bytes()
          custom = Path(sys.argv[3]).read_bytes()
          json_out = Path(sys.argv[4])
          text_out = Path(sys.argv[5])

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def align(value, size=4096):
              return (value + size - 1) // size * size

          def need(condition, message):
              if not condition:
                  raise SystemExit("ERROR: " + message)

          def boot_parts(data):
              need(data[:8] == b"ANDROID!", "Android boot magic")
              kernel_size, ramdisk_size, os_raw, header_size = struct.unpack_from("<4I", data, 8)
              header_version = struct.unpack_from("<I", data, 40)[0]
              kernel_offset = 4096
              ramdisk_offset = kernel_offset + align(kernel_size)
              kernel = data[kernel_offset:kernel_offset + kernel_size]
              ramdisk = data[ramdisk_offset:ramdisk_offset + ramdisk_size]
              return {
                  "kernel_size": kernel_size,
                  "ramdisk_size": ramdisk_size,
                  "header_size": header_size,
                  "header_version": header_version,
                  "kernel_offset": kernel_offset,
                  "ramdisk_offset": ramdisk_offset,
                  "kernel": kernel,
                  "ramdisk": ramdisk,
                  "os_raw": os_raw,
              }

          def boot_avb(data):
              footer = data[-64:]
              need(footer[:4] == b"AVBf", "AVB footer magic")
              major, minor = struct.unpack_from(">II", footer, 4)
              original, offset, size = struct.unpack_from(">QQQ", footer, 12)
              vb = data[offset:offset + size]
              need(vb[:4] == b"AVB0", "AVB0 magic")
              auth_size, _ = struct.unpack_from(">QQ", vb, 12)
              algorithm_type = struct.unpack_from(">I", vb, 28)[0]
              values = struct.unpack_from(">QQQQQQQQQQQ", vb, 32)
              pos = 256 + auth_size + values[8]
              end = pos + values[9]

              while pos < end:
                  tag, following = struct.unpack_from(">QQ", vb, pos)
                  raw = vb[pos:pos + 16 + following]

                  if tag == 2:
                      image_size = struct.unpack_from(">Q", raw, 16)[0]
                      algorithm = raw[24:56].split(b"\0", 1)[0].decode("ascii", "replace")
                      name_len, salt_len, digest_len, flags = struct.unpack_from(">IIII", raw, 56)
                      q = 132
                      partition = raw[q:q + name_len].decode("ascii", "replace")
                      q += name_len
                      salt = raw[q:q + salt_len]
                      q += salt_len
                      digest = raw[q:q + digest_len]

                      if partition == "boot":
                          calculated = hashlib.sha256(salt + data[:image_size]).digest()
                          return {
                              "footer_version": f"{major}.{minor}",
                              "original_image_size": original,
                              "vbmeta_offset": offset,
                              "vbmeta_size": size,
                              "algorithm_type": algorithm_type,
                              "image_size": image_size,
                              "hash_algorithm": algorithm,
                              "flags": flags,
                              "digest": digest.hex(),
                              "calculated": calculated.hex(),
                              "verifies": digest == calculated,
                          }

                  pos += 16 + following

              raise SystemExit("ERROR: boot descriptor not found")

          need(len(image) == 29839872, "W17 Image size")
          need(sha(image) == "e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96", "W17 Image identity")
          need(len(stock) == len(custom) == 134217728, "boot partition size")
          need(sha(stock) == "ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5", "stock boot identity")
          need(sha(custom) == "2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e", "custom boot identity")

          stock_parts = boot_parts(stock)
          custom_parts = boot_parts(custom)
