      - name: Build deterministic staging ZIP twice
        shell: bash
        run: |
          set -euo pipefail

          python3 - \
            "$PACKAGE" \
            "$OUTPUT/build-A.zip" \
            "$OUTPUT/build-B.zip" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import Path

          root = Path(sys.argv[1])
          outputs = [Path(sys.argv[2]), Path(sys.argv[3])]
          files = sorted(path for path in root.rglob("*") if path.is_file())

          for output in outputs:
              with zipfile.ZipFile(
                  output,
                  "w",
                  compression=zipfile.ZIP_DEFLATED,
                  compresslevel=9,
                  strict_timestamps=True,
              ) as archive:
                  for path in files:
                      relative = path.relative_to(root).as_posix()
                      info = zipfile.ZipInfo(relative, date_time=(2024, 1, 1, 0, 0, 0))
                      mode = stat.S_IMODE(path.stat().st_mode)
                      info.create_system = 3
                      info.external_attr = mode << 16
                      info.compress_type = zipfile.ZIP_DEFLATED
                      archive.writestr(
                          info,
                          path.read_bytes(),
                          compress_type=zipfile.ZIP_DEFLATED,
                          compresslevel=9,
                      )
          PY

          A_SHA="$(sha256sum "$OUTPUT/build-A.zip" | awk '{print $1}')"
          B_SHA="$(sha256sum "$OUTPUT/build-B.zip" | awk '{print $1}')"

          test "$A_SHA" = "$B_SHA"
          cmp -s "$OUTPUT/build-A.zip" "$OUTPUT/build-B.zip"

          mv "$OUTPUT/build-A.zip" "$OUTPUT/$STAGING_NAME"
          rm -f "$OUTPUT/build-B.zip"

          {
            echo "DETERMINISTIC_STAGING_ZIP=PASS"
            echo "SHA256=$A_SHA"
            echo "BYTES=$(stat -c '%s' "$OUTPUT/$STAGING_NAME")"
            echo "BYTE_IDENTICAL_TWO_BUILDS=YES"
          } > "$OUTPUT/STAGING-ZIP-REPRODUCIBILITY.txt"

      - name: Independently inspect final staging ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$OUTPUT/$STAGING_NAME"

          unzip -t "$ZIP" > "$OUTPUT/STAGING-ZIP-CRC.txt"

          python3 - "$ZIP" "$OUTPUT/STAGING-ZIP-INDEPENDENT-AUDIT.txt" <<'PY'
          import gzip
          import hashlib
          import sys
          import zipfile
          from pathlib import Path

          path = Path(sys.argv[1])
          report_path = Path(sys.argv[2])

          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()

              if len(names) != 18:
                  raise SystemExit(f"ERROR: expected 18 entries, found {len(names)}")

              if len(names) != len(set(names)):
                  raise SystemExit("ERROR: duplicate ZIP entries")

              if archive.testzip() is not None:
                  raise SystemExit("ERROR: ZIP CRC failure")

              required = {
                  "boot.img",
                  "rollback_stock_boot.img.gz",
                  "LICENSE",
                  "META-INF/com/google/android/update-binary",
                  "META-INF/com/google/android/updater-script",
                  "PACKAGE-SHA256SUMS",
                  "PROVENANCE.json",
                  "VEUX-PACKAGE-MANIFEST.txt",
                  "WORKFLOW20P_DO_NOT_FLASH",
                  "anykernel.sh",
                  "tools/ak3-core.sh",
                  "tools/busybox",
                  "tools/fec",
                  "tools/httools_static",
                  "tools/lptools_static",
                  "tools/magiskboot",
                  "tools/magiskpolicy",
                  "tools/snapshotupdater_static",
              }

              if set(names) != required:
                  raise SystemExit("ERROR: staging ZIP entry set mismatch")

              boot = archive.read("boot.img")
              rollback_gz = archive.read("rollback_stock_boot.img.gz")
              anykernel = archive.read("anykernel.sh").decode("utf-8", "replace")

              if len(boot) != 134217728:
                  raise SystemExit("ERROR: custom boot payload size")

              if hashlib.sha256(boot).hexdigest() != "2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e":
                  raise SystemExit("ERROR: custom boot payload hash")

              rollback = gzip.decompress(rollback_gz)

              if len(rollback) != 134217728:
                  raise SystemExit("ERROR: rollback boot size")

              if hashlib.sha256(rollback).hexdigest() != "ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5":
                  raise SystemExit("ERROR: rollback boot hash")

              if "WORKFLOW20P_DO_NOT_FLASH" not in anykernel:
                  raise SystemExit("ERROR: staging guard missing")

              for forbidden in (
                  "split_boot;",
                  "flash_boot;",
              ):
                  if forbidden in anykernel:
                      raise SystemExit(f"ERROR: forbidden runtime repack path: {forbidden}")

              executable_magiskboot_lines = [
                  line
                  for line in anykernel.splitlines()
                  if "magiskboot" in line and not line.lstrip().startswith("#")
              ]

              if executable_magiskboot_lines:
                  raise SystemExit("ERROR: runtime magiskboot invocation present")

              if 'dd if="$PAYLOAD" of="$TARGET" bs=1048576' not in anykernel:
                  raise SystemExit("ERROR: exact direct write path missing")

              if "restore_stock()" not in anykernel:
                  raise SystemExit("ERROR: rollback function missing")

              if "ro.boot.flash.locked" not in anykernel or "ro.boot.vbmeta.device_state" not in anykernel:
                  raise SystemExit("ERROR: positive unlock gate missing")

              sums = archive.read("PACKAGE-SHA256SUMS").decode().splitlines()

              if len(sums) != 17:
                  raise SystemExit(f"ERROR: expected 17 package hashes, found {len(sums)}")

              checked = 0

              for line in sums:
                  digest, filename = line.split(None, 1)
                  filename = filename.strip()

                  if filename.startswith("./"):
                      filename = filename[2:]

                  if filename not in names:
                      raise SystemExit(f"ERROR: checksum target missing: {filename}")

                  actual = hashlib.sha256(archive.read(filename)).hexdigest()

                  if actual != digest:
                      raise SystemExit(f"ERROR: checksum mismatch: {filename}")

                  checked += 1

          report = f"""STAGING ZIP INDEPENDENT AUDIT
          =================================
          RESULT: PASS
          ZIP_ENTRIES=18
          ZIP_CRC=PASS
          INTERNAL_HASHES={checked}/17
          CUSTOM_BOOT_BYTES=134217728
          CUSTOM_BOOT_SHA256=2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e
          ROLLBACK_BOOT_BYTES=134217728
          ROLLBACK_BOOT_SHA256=ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5
          STAGING_GUARD=FOUND
          DIRECT_WRITE_PATH=FOUND
          ROLLBACK_PATH=FOUND
          POSITIVE_UNLOCK_GATE=FOUND
          RUNTIME_REPACK=NO
          RUNTIME_MAGISKBOOT=NO
          VENDOR_BOOT_PAYLOAD=NO
          DTBO_PAYLOAD=NO
          VBMETA_PAYLOAD=NO
          """

          report_path.write_text(
              "\n".join(line.strip() for line in report.splitlines()).strip() + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create Workflow 20P decision report
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$OUTPUT/$STAGING_NAME"

          cat > "$OUTPUT/WORKFLOW20P-SUMMARY.txt" <<EOF
          VEUX Workflow 20P - Exact W19 Boot Payload Audit
          =================================================

          RESULT: PASS_EXACT_W19_BOOT_PAYLOAD_STAGING

          WHY THIS PATH EXISTS
          --------------------
          W20R2 reproduced the real AnyKernel3/magiskboot runtime output:
          $W20R2_MAGISKBOOT_SHA256

          It differs from the valid Workflow-19 boot image in exactly 35 bytes.

          Independent Workflow-20P analysis confirms the differences are:
          - 3 bytes in the embedded AVB hash-descriptor image_size field
          - 32 bytes in the embedded AVB hash digest

          The runtime-repack image retained:
          image_size = 67551232
          digest = $STOCK_BOOT_AVB_DIGEST

          and its embedded boot descriptor does NOT verify.

          Therefore runtime boot repacking is abandoned for the final path.

          DIRECT PAYLOAD
          --------------
          Exact Workflow-19 boot image:
          bytes: $STOCK_BOOT_BYTES
          SHA-256: $W19_BOOT_SHA256

          Exact W17 Image inside it:
          $W17_IMAGE_SHA256

          Embedded AVB digest:
          $W19_AVB_DIGEST

          Embedded AVB descriptor verifies: YES
          Exact stock compressed ramdisk preserved: YES

          ROLLBACK
          --------
          Exact Workflow-18 stock boot is included gzip-compressed.

          Decompressed rollback SHA-256:
          $STOCK_BOOT_SHA256

          INSTALLER DESIGN
          ----------------
          No split_boot.
          No flash_boot.
          No runtime magiskboot.
          No boot repack.

          Future final installer requires before write:
          - VEUX device check
          - valid _a/_b slot suffix
          - positive bootloader-unlocked evidence
          - exact current stock boot SHA-256
          - exact custom payload SHA-256
          - exact rollback payload SHA-256

          It then performs a direct full-partition boot write and requires exact
          readback SHA-256. On write/readback failure it attempts the exact
          Workflow-18 stock boot rollback and verifies that rollback hash.

          UNTOUCHED
          ---------
          vendor_boot: $STOCK_VENDOR_BOOT_SHA256
          dtbo: $STOCK_DTBO_SHA256
          top-level vbmeta: $STOCK_VBMETA_SHA256

          STAGING PACKAGE
          ---------------
          $STAGING_NAME

          bytes:
          $(stat -c '%s' "$ZIP")

          SHA-256:
          $(sha256sum "$ZIP" | awk '{print $1}')

          Deterministic two-build ZIP reproduction: PASS

          SAFETY
          ------
          WORKFLOW20P_DO_NOT_FLASH is present.
          anykernel.sh exits before loading ak3-core while the marker exists.

          NO DEVICE OPERATION WAS PERFORMED.
          NOTHING WAS FLASHED.

          This PASS establishes package/provenance/direct-write-model validity.
          It still does NOT prove that the phone will boot the custom kernel.
          EOF

          grep -Fxq \
            'RESULT: PASS_EXACT_W19_BOOT_PAYLOAD_STAGING' \
            "$OUTPUT/WORKFLOW20P-SUMMARY.txt"

      - name: Create complete output checksums
        shell: bash
        run: |
          set -euo pipefail

          (
            cd "$OUTPUT"

            find . \
              -maxdepth 1 \
              -type f \
              ! -name SHA256SUMS \
              ! -name SHA256SUMS.verify.txt \
              -printf '%f\n' \
              | LC_ALL=C sort \
              | while IFS= read -r FILE; do
                  sha256sum "$FILE"
                done \
              > SHA256SUMS

            sha256sum -c SHA256SUMS \
              > SHA256SUMS.verify.txt
          )

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p "$OUTPUT"

          {
            echo "WORKFLOW20P_STATUS=REQUIRES_REVIEW"
            echo "Finished: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "No device operation was performed."
            echo "Nothing was flashed."
          } > "$OUTPUT/FAILURE-SUMMARY.txt"

          find "$WORK" \
            -maxdepth 7 \
            -type f \
            -printf '%s %p\n' \
            > "$OUTPUT/FAILURE-FILE-TREE.txt" \
            2>/dev/null || true

      - name: Upload Workflow 20P audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veux-5.4.274-workflow20P-exact-w19-boot-payload-audit-${{ github.run_number }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 0
