name: 18 - VEUX Exact Stock ROM Read-Only Audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ROM_VERSION: "OS1.0.12.0.TKCMIXM"
  ROM_FILE: "veux_global_images_OS1.0.12.0.TKCMIXM_20241205.0000.00_13.0_global_cda1240a45.tgz"
  ROM_URL: "https://bigota.d.miui.com/OS1.0.12.0.TKCMIXM/veux_global_images_OS1.0.12.0.TKCMIXM_20241205.0000.00_13.0_global_cda1240a45.tgz"
  ROM_MD5: "cda1240a451dd4f75776878b52f0cea3"

  BOOT_BYTES: "134217728"
  BOOT_SHA: "ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5"

  VENDOR_BOOT_BYTES: "100663296"
  VENDOR_BOOT_SHA: "583e1f4c0e09c2267cda88bd48a8b4f56cf5c5e034fbda7b25bd65aa86385425"

  DTBO_BYTES: "8388608"
  DTBO_SHA: "e9f3bae2c5417ff297162f1e7d2652ee98b347488fdf091d61daa986fbfb7690"

  VBMETA_BYTES: "8192"
  VBMETA_SHA: "62a5b1a94c2247c786e8148b9d9d0aea943b57b1034b3fd82d9cac9a85fcde97"

  STOCK_KERNEL_BYTES: "45480448"
  STOCK_KERNEL_SHA: "6e513b3652aa1de599c26b6aaeefef12dac569daf8648bbb67de99932782c50b"

  RAMDISK_BYTES: "22061278"
  RAMDISK_SHA: "0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a"

  BOOT_AVB_DIGEST: "fc6d91cd4ce2e89703c59e6a35c60e3efd984cfb54a29760e4a3105c42399d8a"

  VENDOR_BOOT_AVB_DIGEST: "370f9c242bd161bd36effc3e7b56f208e21700a9a4e848b004f68595df2190c6"

  DTBO_AVB_DIGEST: "a49a514a35a1ee60c19716407eb70f8bf5f9a8fec7aa8394c00c370f7ca0c6d9"

  VENDOR_DTB_BYTES: "651045"
  VENDOR_DTB_SHA: "10b7b848141bff201e1953d44128a3de92272a4fdc1afbf90b4e60682830ff46"

  VBMETA_SIGNED_DIGEST: "4ba69147c283e7a43aec1c5f951901f9060057e21bae4e2c3df17400698bdb4c"

  VBMETA_KEY_SHA: "c5d3c71bc70d58e3e0409ca9d9b34c0dbac1d2f09a5de948a4b8f090f1926965"

  STOCK_FINGERPRINT: "qti/veux/veux:13/TKQ1.221114.001/V816.0.12.0.TKCMIXM:user/release-keys"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      WORK: ${{ github.workspace }}/workflow18
      DOWNLOAD: ${{ github.workspace }}/workflow18/download
      EXTRACT: ${{ github.workspace }}/workflow18/extract
      STOCK: ${{ github.workspace }}/workflow18/output/stock_images
      AUDIT: ${{ github.workspace }}/workflow18/output/audit
      OUTPUT: ${{ github.workspace }}/workflow18/output

    steps:
      - name: Prepare workspace and disk
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORK"

          mkdir -p \
            "$DOWNLOAD" \
            "$EXTRACT" \
            "$STOCK" \
            "$AUDIT"

          # Free runner space. None of these components are needed here.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            2>/dev/null || true

          df -h / | tee "$AUDIT/DISK-BEFORE.txt"

          free_kb="$(
            df -Pk / \
              | awk 'NR==2 {print $4}'
          )"

          if [ "$free_kb" -lt 9000000 ]; then
            echo "ERROR: less than 9 GB free disk space"
            echo "Available KB: $free_kb"
            exit 1
          fi

      - name: Install download dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            --no-install-recommends \
            aria2 \
            ca-certificates \
            curl

          aria2c --version \
            | head -n 3 \
            | tee "$AUDIT/ARIA2-VERSION.txt"

          curl --version \
            | head -n 2 \
            | tee "$AUDIT/CURL-VERSION.txt"

      - name: Probe exact fastboot ROM source
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "ROM_VERSION=$ROM_VERSION"
            echo "ROM_FILE=$ROM_FILE"
            echo "ROM_URL=$ROM_URL"
            echo "EXPECTED_MD5=$ROM_MD5"
            echo
          } > "$AUDIT/FASTBOOT-ROM-SOURCE.txt"

          # HEAD is informational only. The later MD5 gate is authoritative.
          curl \
            --silent \
            --show-error \
            --location \
            --head \
            --connect-timeout 20 \
            --max-time 60 \
            "$ROM_URL" \
            > "$AUDIT/ROM-HEADERS.txt" \
            || true

          cat "$AUDIT/ROM-HEADERS.txt" || true

      - name: Download and authenticate exact fastboot ROM
        shell: bash
        run: |
          set -euo pipefail

          file="$DOWNLOAD/$ROM_FILE"

          rm -f \
            "$file" \
            "$file.aria2"

          echo "Trying accelerated resumable aria2 download..."
          echo "Maximum aria2 wall time: 45 minutes."

          set +e

          timeout \
            --signal=TERM \
            --kill-after=30s \
            45m \
            aria2c \
              --dir="$DOWNLOAD" \
              --out="$ROM_FILE" \
              --continue=true \
              --allow-overwrite=true \
              --auto-file-renaming=false \
              --file-allocation=none \
              --max-connection-per-server=8 \
              --split=8 \
              --min-split-size=16M \
              --piece-length=4M \
              --connect-timeout=30 \
              --timeout=30 \
              --max-tries=10 \
              --retry-wait=3 \
              --lowest-speed-limit=32K \
              --summary-interval=30 \
              --console-log-level=notice \
              --download-result=full \
              "$ROM_URL" \
            2>&1 \
            | tee "$AUDIT/ARIA2-DOWNLOAD.log"

          aria_rc="${PIPESTATUS[0]}"

          set -e

          if [ "$aria_rc" -eq 124 ] \
            || [ "$aria_rc" -eq 137 ]; then

            {
              echo
              echo "ERROR: accelerated ROM download exceeded 45 minutes."
              echo "The source/CDN is still too slow for a reproducible"
              echo "GitHub Actions workflow."
              echo
              echo "No slow single-stream fallback will be attempted after"
              echo "a download timeout because that would only consume the"
              echo "remaining runner time."
            } | tee "$AUDIT/DOWNLOAD-FAILURE.txt"

            exit 1
          fi

          if [ "$aria_rc" -ne 0 ]; then
            echo
            echo "aria2 returned $aria_rc before its timeout."
            echo "Trying one resumable curl fallback..."

            rm -f \
              "$file" \
              "$file.aria2"

            timeout \
              --signal=TERM \
              --kill-after=30s \
              60m \
              curl \
                --fail \
                --location \
                --retry 8 \
                --retry-delay 5 \
                --retry-all-errors \
                --connect-timeout 30 \
                --speed-time 120 \
                --speed-limit 32768 \
                --continue-at - \
                --output "$file" \
                "$ROM_URL" \
              2>&1 \
              | tee "$AUDIT/CURL-FALLBACK.log"
          fi

          [ -f "$file" ] || {
            echo "ERROR: ROM archive was not downloaded"
            exit 1
          }

          bytes="$(
            stat -c '%s' "$file"
          )"

          echo "Downloaded bytes: $bytes"

          echo "Calculating exact ROM MD5..."

          actual_md5="$(
            md5sum "$file" \
              | awk '{print $1}'
          )"

          if [ "$actual_md5" != "$ROM_MD5" ]; then
            echo "ERROR: ROM MD5 mismatch"
            echo "Expected: $ROM_MD5"
            echo "Actual:   $actual_md5"
            exit 1
          fi

          echo "MD5 PASS."

          echo "Calculating SHA-256 for reproducibility record..."

          actual_sha="$(
            sha256sum "$file" \
              | awk '{print $1}'
          )"

          {
            echo "ROM_VERSION=$ROM_VERSION"
            echo "ROM_FILE=$ROM_FILE"
            echo "ROM_URL=$ROM_URL"
            echo "ROM_BYTES=$bytes"
            echo "ROM_MD5=$actual_md5"
            echo "ROM_SHA256=$actual_sha"
          } | tee -a "$AUDIT/FASTBOOT-ROM-SOURCE.txt"

          df -h / \
            | tee "$AUDIT/DISK-AFTER-DOWNLOAD.txt"

      - name: Locate exact image members
        shell: bash
        run: |
          set -euo pipefail

          file="$DOWNLOAD/$ROM_FILE"

          tar -tzf "$file" \
            > "$AUDIT/ROM-TAR-FILELIST.txt"

          python3 - \
            "$AUDIT/ROM-TAR-FILELIST.txt" \
            "$AUDIT/SELECTED-ROM-MEMBERS.txt" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])

          targets = {
              "boot.img",
              "vendor_boot.img",
              "dtbo.img",
              "vbmeta.img",
          }

          found = {}

          for raw in source.read_text(
              encoding="utf-8",
              errors="replace",
          ).splitlines():

              name = raw.strip()

              if not name:
                  continue

              base = name.rsplit("/", 1)[-1]

              if (
                  base in targets
                  and "/images/" in "/" + name
              ):
                  found.setdefault(base, []).append(name)

          missing = sorted(
              targets - set(found)
          )

          if missing:
              raise SystemExit(
                  f"Missing expected ROM images: {missing}"
              )

          ambiguous = {
              key: value
              for key, value in found.items()
              if len(value) != 1
          }

          if ambiguous:
              raise SystemExit(
                  f"Ambiguous ROM image paths: {ambiguous}"
              )

          ordered = [
              found["boot.img"][0],
              found["vendor_boot.img"][0],
              found["dtbo.img"][0],
              found["vbmeta.img"][0],
          ]

          output.write_text(
              "\n".join(ordered) + "\n",
              encoding="utf-8",
          )

          print("\n".join(ordered))
          PY

      - name: Extract only boot vendor_boot dtbo and vbmeta
        shell: bash
        run: |
          set -euo pipefail

          file="$DOWNLOAD/$ROM_FILE"

          mapfile -t members \
            < "$AUDIT/SELECTED-ROM-MEMBERS.txt"

          [ "${#members[@]}" -eq 4 ] || {
            echo "ERROR: expected exactly four selected ROM members"
            exit 1
          }

          tar \
            -xzf "$file" \
            -C "$EXTRACT" \
            "${members[@]}"

          for member in "${members[@]}"; do
            base="$(
              basename "$member"
            )"

            src="$EXTRACT/$member"

            [ -f "$src" ] || {
              echo "ERROR: extracted member missing: $member"
              exit 1
            }

            case "$base" in
              boot.img)
                cp "$src" "$STOCK/stock_boot.img"
                ;;
              vendor_boot.img)
                cp "$src" "$STOCK/stock_vendor_boot.img"
                ;;
              dtbo.img)
                cp "$src" "$STOCK/stock_dtbo.img"
                ;;
              vbmeta.img)
                cp "$src" "$STOCK/stock_vbmeta.img"
                ;;
              *)
                echo "ERROR: unexpected extracted image: $base"
                exit 1
                ;;
            esac
          done

          rm -rf "$EXTRACT"

          # The multi-gigabyte archive is no longer needed after the
          # four exact source images have been extracted and authenticated.
          rm -f "$file" "$file.aria2"

          df -h / \
            | tee "$AUDIT/DISK-AFTER-EXTRACTION.txt"

      - name: Require byte-identical stock images
        shell: bash
        run: |
          set -euo pipefail

          check() {
            local file="$1"
            local expected_bytes="$2"
            local expected_sha="$3"
            local label="$4"

            local actual_bytes
            local actual_sha

            actual_bytes="$(
              stat -c '%s' "$file"
            )"

            actual_sha="$(
              sha256sum "$file" \
                | awk '{print $1}'
            )"

            if [ "$actual_bytes" != "$expected_bytes" ]; then
              echo "ERROR: $label size mismatch"
              echo "Expected: $expected_bytes"
              echo "Actual:   $actual_bytes"
              exit 1
            fi

            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "ERROR: $label SHA-256 mismatch"
              echo "Expected: $expected_sha"
              echo "Actual:   $actual_sha"
              exit 1
            fi

            echo "${label}_BYTES=$actual_bytes"
            echo "${label}_SHA256=$actual_sha"
          }

          {
            check \
              "$STOCK/stock_boot.img" \
              "$BOOT_BYTES" \
              "$BOOT_SHA" \
              BOOT

            check \
              "$STOCK/stock_vendor_boot.img" \
              "$VENDOR_BOOT_BYTES" \
              "$VENDOR_BOOT_SHA" \
              VENDOR_BOOT

            check \
              "$STOCK/stock_dtbo.img" \
              "$DTBO_BYTES" \
              "$DTBO_SHA" \
              DTBO

            check \
              "$STOCK/stock_vbmeta.img" \
              "$VBMETA_BYTES" \
              "$VBMETA_SHA" \
              VBMETA

          } | tee "$AUDIT/PARTITION-HASH-AUDIT.txt"

      - name: Deep read-only boot and AVB audit
        shell: bash
        run: |
          set -euo pipefail

          cat > "$WORK/audit.py" <<'PY'
          import hashlib
          import json
          import os
          import struct
          import sys
          from pathlib import Path

          STOCK = Path(sys.argv[1])
          OUT = Path(sys.argv[2])

          boot = (
              STOCK / "stock_boot.img"
          ).read_bytes()

          vendor = (
              STOCK / "stock_vendor_boot.img"
          ).read_bytes()

          dtbo = (
              STOCK / "stock_dtbo.img"
          ).read_bytes()

          vbmeta = (
              STOCK / "stock_vbmeta.img"
          ).read_bytes()

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def align(value, alignment):
              return (
                  value + alignment - 1
              ) // alignment * alignment

          def need(condition, message):
              if not condition:
                  raise SystemExit(
                      "ERROR: " + message
                  )

          def parse_footer(image):
              footer = image[-64:]

              need(
                  footer[:4] == b"AVBf",
                  "AVB footer missing",
              )

              major, minor = struct.unpack_from(
                  ">II",
                  footer,
                  4,
              )

              original, offset, size = (
                  struct.unpack_from(
                      ">QQQ",
                      footer,
                      12,
                  )
              )

              need(
                  offset + size
                  <= len(image) - 64,
                  "invalid AVB footer geometry",
              )

              return {
                  "version": f"{major}.{minor}",
                  "original_size": original,
                  "offset": offset,
                  "size": size,
                  "vbmeta": image[
                      offset:offset + size
                  ],
              }

          def parse_vbmeta(data):
              need(
                  data[:4] == b"AVB0",
                  "AVB0 magic missing",
              )

              req_major, req_minor = (
                  struct.unpack_from(
                      ">II",
                      data,
                      4,
                  )
              )

              auth_size, aux_size = (
                  struct.unpack_from(
                      ">QQ",
                      data,
                      12,
                  )
              )

              algorithm_type = (
                  struct.unpack_from(
                      ">I",
                      data,
                      28,
                  )[0]
              )

              values = struct.unpack_from(
                  ">QQQQQQQQQQQ",
                  data,
                  32,
              )

              (
                  hash_offset,
                  hash_size,
                  signature_offset,
                  signature_size,
                  public_key_offset,
                  public_key_size,
                  public_key_metadata_offset,
                  public_key_metadata_size,
                  descriptors_offset,
                  descriptors_size,
                  rollback_index,
              ) = values

              flags, rollback_location = (
                  struct.unpack_from(
                      ">II",
                      data,
                      120,
                  )
              )

              release = (
                  data[128:176]
                  .split(b"\0", 1)[0]
                  .decode(
                      "ascii",
                      "replace",
                  )
              )

              auth_start = 256
              aux_start = 256 + auth_size

              need(
                  aux_start + aux_size
                  <= len(data),
                  "vbmeta blocks exceed image",
              )

              signed_digest = None
              hash_verifies = True

              if hash_size:
                  need(
                      hash_size == 32,
                      "unexpected vbmeta hash size",
                  )

                  signed_digest = hashlib.sha256(
                      data[:256]
                      + data[
                          aux_start:
                          aux_start + aux_size
                      ]
                  ).digest()

                  stored_digest = data[
                      auth_start + hash_offset:
                      auth_start
                      + hash_offset
                      + hash_size
                  ]

                  hash_verifies = (
                      signed_digest
                      == stored_digest
                  )

              signature_verifies = True
              public_key_sha = None

              if algorithm_type == 1:
                  need(
                      hash_size == 32
                      and signature_size == 256
                      and public_key_size == 520,
                      "unexpected RSA2048 geometry",
                  )

                  signature = data[
                      auth_start + signature_offset:
                      auth_start
                      + signature_offset
                      + signature_size
                  ]

                  public_key = data[
                      aux_start + public_key_offset:
                      aux_start
                      + public_key_offset
                      + public_key_size
                  ]

                  public_key_sha = sha(
                      public_key
                  )

                  bits = struct.unpack_from(
                      ">I",
                      public_key,
                      0,
                  )[0]

                  need(
                      bits == 2048,
                      "unexpected RSA key size",
                  )

                  modulus_bytes = bits // 8

                  modulus = int.from_bytes(
                      public_key[
                          8:
                          8 + modulus_bytes
                      ],
                      "big",
                  )

                  decoded = pow(
                      int.from_bytes(
                          signature,
                          "big",
                      ),
                      65537,
                      modulus,
                  ).to_bytes(
                      modulus_bytes,
                      "big",
                  )

                  digest_info = bytes.fromhex(
                      "3031300d060960864801650304020105000420"
                  )

                  expected = (
                      b"\x00\x01"
                      + b"\xff"
                      * (
                          modulus_bytes
                          - 3
                          - len(digest_info)
                          - 32
                      )
                      + b"\x00"
                      + digest_info
                      + signed_digest
                  )

                  signature_verifies = (
                      decoded == expected
                  )

              elif algorithm_type == 0:
                  need(
                      auth_size == 0
                      and hash_size == 0
                      and signature_size == 0,
                      "unexpected unsigned vbmeta auth block",
                  )

              else:
                  raise SystemExit(
                      "ERROR: unsupported AVB "
                      f"algorithm type "
                      f"{algorithm_type}"
                  )

              descriptors = []
              properties = {}

              pos = (
                  aux_start
                  + descriptors_offset
              )

              end = (
                  pos
                  + descriptors_size
              )

              need(
                  end
                  <= aux_start + aux_size,
                  "descriptors outside auxiliary block",
              )

              while pos < end:
                  tag, following = (
                      struct.unpack_from(
                          ">QQ",
                          data,
                          pos,
                      )
                  )

                  descriptor = data[
                      pos:
                      pos + 16 + following
                  ]

                  need(
                      len(descriptor)
                      == 16 + following,
                      "truncated descriptor",
                  )

                  if tag == 0:
                      key_len, value_len = (
                          struct.unpack_from(
                              ">QQ",
                              descriptor,
                              16,
                          )
                      )

                      cursor = 32

                      key = descriptor[
                          cursor:
                          cursor + key_len
                      ].decode(
                          "utf-8",
                          "replace",
                      )

                      cursor += key_len

                      if (
                          cursor < len(descriptor)
                          and descriptor[cursor] == 0
                      ):
                          cursor += 1

                      value = descriptor[
                          cursor:
                          cursor + value_len
                      ].decode(
                          "utf-8",
                          "replace",
                      )

                      properties.setdefault(
                          key,
                          [],
                      ).append(value)

                  elif tag == 1:
                      (
                          partition_name_len,
                          salt_len,
                          root_digest_len,
                          descriptor_flags,
                      ) = struct.unpack_from(
                          ">IIII",
                          descriptor,
                          104,
                      )

                      hash_algorithm = (
                          descriptor[72:104]
                          .split(b"\0", 1)[0]
                          .decode()
                      )

                      cursor = 180

                      partition = descriptor[
                          cursor:
                          cursor
                          + partition_name_len
                      ].decode()

                      descriptors.append({
                          "type": "hashtree",
                          "partition": partition,
                          "algorithm": hash_algorithm,
                          "flags": descriptor_flags,
                      })

                  elif tag == 2:
                      image_size = (
                          struct.unpack_from(
                              ">Q",
                              descriptor,
                              16,
                          )[0]
                      )

                      hash_algorithm = (
                          descriptor[24:56]
                          .split(b"\0", 1)[0]
                          .decode()
                      )

                      (
                          partition_name_len,
                          salt_len,
                          digest_len,
                          descriptor_flags,
                      ) = struct.unpack_from(
                          ">IIII",
                          descriptor,
                          56,
                      )

                      cursor = 132

                      partition = descriptor[
                          cursor:
                          cursor
                          + partition_name_len
                      ].decode()

                      cursor += (
                          partition_name_len
                      )

                      salt = descriptor[
                          cursor:
                          cursor + salt_len
                      ]

                      cursor += salt_len

                      digest = descriptor[
                          cursor:
                          cursor + digest_len
                      ]

                      descriptors.append({
                          "type": "hash",
                          "partition": partition,
                          "image_size": image_size,
                          "algorithm": hash_algorithm,
                          "salt": salt.hex(),
                          "digest": digest.hex(),
                          "flags": descriptor_flags,
                      })

                  elif tag == 4:
                      (
                          rollback_index_location,
                          partition_name_len,
                          public_key_len,
                      ) = struct.unpack_from(
                          ">III",
                          descriptor,
                          16,
                      )

                      cursor = 92

                      partition = descriptor[
                          cursor:
                          cursor
                          + partition_name_len
                      ].decode()

                      cursor += (
                          partition_name_len
                      )

                      chain_key = descriptor[
                          cursor:
                          cursor
                          + public_key_len
                      ]

                      descriptors.append({
                          "type": "chain",
                          "partition": partition,
                          "rollback_index_location":
                              rollback_index_location,
                          "public_key_sha256":
                              sha(chain_key),
                      })

                  pos += (
                      16 + following
                  )

              need(
                  pos == end,
                  "descriptor parse did not "
                  "end exactly",
              )

              return {
                  "required_libavb":
                      f"{req_major}.{req_minor}",
                  "algorithm_type":
                      algorithm_type,
                  "auth_bytes":
                      auth_size,
                  "aux_bytes":
                      aux_size,
                  "hash_verifies":
                      hash_verifies,
                  "signature_verifies":
                      signature_verifies,
                  "signed_digest":
                      (
                          signed_digest.hex()
                          if signed_digest
                          else None
                      ),
                  "public_key_sha256":
                      public_key_sha,
                  "rollback_index":
                      rollback_index,
                  "flags":
                      flags,
                  "rollback_index_location":
                      rollback_location,
                  "release_string":
                      release,
                  "descriptors":
                      descriptors,
                  "properties":
                      properties,
              }

          def hash_descriptors(info):
              return {
                  descriptor["partition"]:
                      descriptor
                  for descriptor
                  in info["descriptors"]
                  if descriptor["type"]
                  == "hash"
              }

          def verify_hash_descriptor(
              image,
              descriptor,
          ):
              need(
                  descriptor["algorithm"]
                  == "sha256",
                  "non-sha256 hash descriptor",
              )

              size = descriptor[
                  "image_size"
              ]

              need(
                  size <= len(image),
                  "hash descriptor size "
                  "exceeds partition",
              )

              calculated = hashlib.sha256(
                  bytes.fromhex(
                      descriptor["salt"]
                  )
                  + image[:size]
              ).hexdigest()

              return (
                  calculated
                  == descriptor["digest"]
              )

          # --------------------------------------------------
          # boot.img
          # --------------------------------------------------

          need(
              boot[:8] == b"ANDROID!",
              "boot magic",
          )

          (
              kernel_size,
              ramdisk_size,
              os_version_raw,
              header_size,
          ) = struct.unpack_from(
              "<4I",
              boot,
              8,
          )

          header_version = (
              struct.unpack_from(
                  "<I",
                  boot,
                  40,
              )[0]
          )

          reserved = struct.unpack_from(
              "<4I",
              boot,
              24,
          )

          ramdisk_offset = (
              4096
              + align(
                  kernel_size,
                  4096,
              )
          )

          payload_end = (
              ramdisk_offset
              + align(
                  ramdisk_size,
                  4096,
              )
          )

          kernel = boot[
              4096:
              4096 + kernel_size
          ]

          ramdisk = boot[
              ramdisk_offset:
              ramdisk_offset
              + ramdisk_size
          ]

          (
              text_offset,
              arm_image_size,
              arm_flags,
          ) = struct.unpack_from(
              "<QQQ",
              kernel,
              8,
          )

          (
              arm_magic,
              arm_res5,
          ) = struct.unpack_from(
              "<II",
              kernel,
              56,
          )

          boot_footer = parse_footer(
              boot
          )

          boot_vbmeta = parse_vbmeta(
              boot_footer["vbmeta"]
          )

          boot_hashes = (
              hash_descriptors(
                  boot_vbmeta
              )
          )

          need(
              set(boot_hashes)
              == {"boot"},
              "boot embedded descriptor set",
          )

          need(
              verify_hash_descriptor(
                  boot,
                  boot_hashes["boot"],
              ),
              "boot embedded AVB hash",
          )

          # --------------------------------------------------
          # vendor_boot.img
          # --------------------------------------------------

          need(
              vendor[:8] == b"VNDRBOOT",
              "vendor_boot magic",
          )

          (
              vendor_header_version,
              vendor_page_size,
              kernel_addr,
              ramdisk_addr,
              vendor_ramdisk_size,
          ) = struct.unpack_from(
              "<IIIII",
              vendor,
              8,
          )

          tags_addr = struct.unpack_from(
              "<I",
              vendor,
              2076,
          )[0]

          vendor_header_size = (
              struct.unpack_from(
                  "<I",
                  vendor,
                  2096,
              )[0]
          )

          vendor_dtb_size = (
              struct.unpack_from(
                  "<I",
                  vendor,
                  2100,
              )[0]
          )

          vendor_dtb_addr = (
              struct.unpack_from(
                  "<Q",
                  vendor,
                  2104,
              )[0]
          )

          vendor_ramdisk_offset = (
              align(
                  vendor_header_size,
                  vendor_page_size,
              )
          )

          vendor_dtb_offset = (
              vendor_ramdisk_offset
              + align(
                  vendor_ramdisk_size,
                  vendor_page_size,
              )
          )

          vendor_dtb = vendor[
              vendor_dtb_offset:
              vendor_dtb_offset
              + vendor_dtb_size
          ]

          vendor_fdt_blobs = []

          cursor = 0

          while cursor < len(vendor_dtb):
              need(
                  vendor_dtb[
                      cursor:
                      cursor + 4
                  ]
                  == b"\xd0\r\xfe\xed",
                  "vendor DTB contains "
                  f"non-FDT at offset "
                  f"{cursor}",
              )

              fdt_size = (
                  struct.unpack_from(
                      ">I",
                      vendor_dtb,
                      cursor + 4,
                  )[0]
              )

              need(
                  fdt_size >= 40
                  and cursor + fdt_size
                  <= len(vendor_dtb),
                  "invalid vendor FDT size",
              )

              vendor_fdt_blobs.append({
                  "offset": cursor,
                  "bytes": fdt_size,
              })

              cursor += fdt_size

          vendor_footer = (
              parse_footer(vendor)
          )

          vendor_vbmeta = (
              parse_vbmeta(
                  vendor_footer[
                      "vbmeta"
                  ]
              )
          )

          vendor_hashes = (
              hash_descriptors(
                  vendor_vbmeta
              )
          )

          need(
              set(vendor_hashes)
              == {"vendor_boot"},
              "vendor_boot embedded "
              "descriptor set",
          )

          need(
              verify_hash_descriptor(
                  vendor,
                  vendor_hashes[
                      "vendor_boot"
                  ],
              ),
              "vendor_boot embedded AVB hash",
          )

          # --------------------------------------------------
          # dtbo.img
          # --------------------------------------------------

          (
              dtbo_magic,
              dtbo_table_size,
              dtbo_header_size,
              dtbo_entry_size,
              dtbo_entry_count,
              dtbo_entries_offset,
              dtbo_page_size,
              dtbo_version,
          ) = struct.unpack_from(
              ">8I",
              dtbo,
              0,
          )

          for index in range(
              dtbo_entry_count
          ):
              offset = (
                  dtbo_entries_offset
                  + index
                  * dtbo_entry_size
              )

              size, start = (
                  struct.unpack_from(
                      ">II",
                      dtbo,
                      offset,
                  )
              )

              need(
                  start + size
                  <= dtbo_table_size,
                  "DTBO entry "
                  f"{index} outside table",
              )

              need(
                  dtbo[
                      start:
                      start + 4
                  ]
                  == b"\xd0\r\xfe\xed",
                  "DTBO entry "
                  f"{index} not FDT",
              )

          dtbo_footer = (
              parse_footer(dtbo)
          )

          dtbo_vbmeta = (
              parse_vbmeta(
                  dtbo_footer[
                      "vbmeta"
                  ]
              )
          )

          dtbo_hashes = (
              hash_descriptors(
                  dtbo_vbmeta
              )
          )

          need(
              set(dtbo_hashes)
              == {"dtbo"},
              "dtbo embedded descriptor set",
          )

          need(
              verify_hash_descriptor(
                  dtbo,
                  dtbo_hashes["dtbo"],
              ),
              "dtbo embedded AVB hash",
          )

          # --------------------------------------------------
          # top-level vbmeta.img
          # --------------------------------------------------

          top = parse_vbmeta(
              vbmeta
          )

          top_hashes = (
              hash_descriptors(top)
          )

          need(
              top["algorithm_type"] == 1,
              "top-level vbmeta algorithm",
          )

          need(
              top["hash_verifies"],
              "top-level vbmeta "
              "authentication hash",
          )

          need(
              top["signature_verifies"],
              "top-level vbmeta RSA signature",
          )

          need(
              set(top_hashes)
              == {
                  "boot",
                  "dtbo",
                  "vendor_boot",
              },
              "top-level hash descriptor set",
          )

          source_images = {
              "boot": boot,
              "dtbo": dtbo,
              "vendor_boot": vendor,
          }

          for partition, descriptor in (
              top_hashes.items()
          ):
              need(
                  verify_hash_descriptor(
                      source_images[
                          partition
                      ],
                      descriptor,
                  ),
                  "top-level "
                  f"{partition} hash",
              )

          chains = {
              descriptor["partition"]:
                  descriptor
              for descriptor
              in top["descriptors"]
              if descriptor["type"]
              == "chain"
          }

          hashtrees = sorted(
              descriptor["partition"]
              for descriptor
              in top["descriptors"]
              if descriptor["type"]
              == "hashtree"
          )

          # --------------------------------------------------
          # Exact identity gates
          # --------------------------------------------------

          need(
              len(boot)
              == int(
                  os.environ[
                      "BOOT_BYTES"
                  ]
              )
              and sha(boot)
              == os.environ[
                  "BOOT_SHA"
              ],
              "boot identity",
          )

          need(
              len(vendor)
              == int(
                  os.environ[
                      "VENDOR_BOOT_BYTES"
                  ]
              )
              and sha(vendor)
              == os.environ[
                  "VENDOR_BOOT_SHA"
              ],
              "vendor_boot identity",
          )

          need(
              len(dtbo)
              == int(
                  os.environ[
                      "DTBO_BYTES"
                  ]
              )
              and sha(dtbo)
              == os.environ[
                  "DTBO_SHA"
              ],
              "dtbo identity",
          )

          need(
              len(vbmeta)
              == int(
                  os.environ[
                      "VBMETA_BYTES"
                  ]
              )
              and sha(vbmeta)
              == os.environ[
                  "VBMETA_SHA"
              ],
              "vbmeta identity",
          )

          need(
              header_version == 3
              and header_size == 1580
              and reserved
              == (0, 0, 0, 0),
              "boot v3 header",
          )

          need(
              kernel_size
              == int(
                  os.environ[
                      "STOCK_KERNEL_BYTES"
                  ]
              )
              and sha(kernel)
              == os.environ[
                  "STOCK_KERNEL_SHA"
              ],
              "stock kernel identity",
          )

          need(
              ramdisk_size
              == int(
                  os.environ[
                      "RAMDISK_BYTES"
                  ]
              )
              and sha(ramdisk)
              == os.environ[
                  "RAMDISK_SHA"
              ],
              "stock ramdisk identity",
          )

          need(
              ramdisk[:4]
              == bytes.fromhex(
                  "02214c18"
              ),
              "ramdisk is not LZ4 legacy",
          )

          need(
              text_offset == 0x80000
              and arm_flags == 0xA
              and arm_magic
              == 0x644D5241
              and arm_res5 == 0x40,
              "ARM64 header",
          )

          need(
              boot_footer[
                  "original_size"
              ]
              == payload_end,
              "boot AVB footer geometry",
          )

          need(
              boot_hashes[
                  "boot"
              ]["digest"]
              == os.environ[
                  "BOOT_AVB_DIGEST"
              ],
              "boot AVB digest identity",
          )

          need(
              vendor_header_version
              == 3
              and vendor_header_size
              == 2112
              and vendor_page_size
              == 4096,
              "vendor_boot v3 header",
          )

          need(
              kernel_addr == 32768
              and ramdisk_addr
              == 16777216
              and tags_addr == 256
              and vendor_dtb_addr
              == 0x1F00000,
              "vendor_boot addresses",
          )

          need(
              vendor_dtb_size
              == int(
                  os.environ[
                      "VENDOR_DTB_BYTES"
                  ]
              )
              and sha(vendor_dtb)
              == os.environ[
                  "VENDOR_DTB_SHA"
              ]
              and len(
                  vendor_fdt_blobs
              ) == 3,
              "vendor DTB identity",
          )

          need(
              vendor_hashes[
                  "vendor_boot"
              ]["digest"]
              == os.environ[
                  "VENDOR_BOOT_AVB_DIGEST"
              ],
              "vendor_boot AVB identity",
          )

          need(
              dtbo_magic
              == 0xD7B7AB1E
              and dtbo_table_size
              == 2760081,
              "DTBO table identity",
          )

          need(
              dtbo_header_size == 32
              and dtbo_entry_size == 32
              and dtbo_entry_count == 16
              and dtbo_entries_offset
              == 32
              and dtbo_page_size
              == 4096
              and dtbo_version == 0,
              "DTBO geometry",
          )

          need(
              dtbo_hashes[
                  "dtbo"
              ]["digest"]
              == os.environ[
                  "DTBO_AVB_DIGEST"
              ],
              "dtbo AVB identity",
          )

          need(
              top["signed_digest"]
              == os.environ[
                  "VBMETA_SIGNED_DIGEST"
              ],
              "vbmeta signed digest",
          )

          need(
              top[
                  "public_key_sha256"
              ]
              == os.environ[
                  "VBMETA_KEY_SHA"
              ],
              "vbmeta public key",
          )

          need(
              sorted(chains)
              == ["vbmeta_system"]
              and chains[
                  "vbmeta_system"
              ][
                  "rollback_index_location"
              ] == 2,
              "vbmeta chain",
          )

          need(
              hashtrees
              == [
                  "mi_ext",
                  "odm",
                  "vendor",
              ],
              "vbmeta hashtrees",
          )

          need(
              top_hashes[
                  "boot"
              ]["digest"]
              == os.environ[
                  "BOOT_AVB_DIGEST"
              ],
              "top-level boot digest",
          )

          need(
              top_hashes[
                  "dtbo"
              ]["digest"]
              == os.environ[
                  "DTBO_AVB_DIGEST"
              ],
              "top-level dtbo digest",
          )

          need(
              top_hashes[
                  "vendor_boot"
              ]["digest"]
              == os.environ[
                  "VENDOR_BOOT_AVB_DIGEST"
              ],
              "top-level vendor_boot digest",
          )

          need(
              os.environ[
                  "STOCK_FINGERPRINT"
              ]
              in top[
                  "properties"
              ].get(
                  "com.android.build.boot.fingerprint",
                  [],
              ),
              "boot fingerprint",
          )

          need(
              "2024-12-01"
              in top[
                  "properties"
              ].get(
                  "com.android.build.boot.security_patch",
                  [],
              ),
              "security patch",
          )

          major = (
              os_version_raw >> 25
          ) & 0x7F

          minor = (
              os_version_raw >> 18
          ) & 0x7F

          patch = (
              os_version_raw >> 11
          ) & 0x7F

          year = (
              (
                  os_version_raw >> 4
              )
              & 0x7F
          ) + 2000

          month = (
              os_version_raw
              & 0xF
          )

          result = {
              "result":
                  "PASS_READ_ONLY_REPRODUCED_FROM_FASTBOOT_ROM",

              "source": {
                  "version":
                      os.environ[
                          "ROM_VERSION"
                      ],
                  "file":
                      os.environ[
                          "ROM_FILE"
                      ],
                  "md5":
                      os.environ[
                          "ROM_MD5"
                      ],
              },

              "boot": {
                  "bytes":
                      len(boot),
                  "sha256":
                      sha(boot),
                  "header_version":
                      header_version,
                  "header_size":
                      header_size,
                  "kernel_bytes":
                      kernel_size,
                  "kernel_sha256":
                      sha(kernel),
                  "ramdisk_bytes":
                      ramdisk_size,
                  "ramdisk_sha256":
                      sha(ramdisk),
                  "ramdisk_format":
                      "lz4_legacy",
                  "ramdisk_offset":
                      ramdisk_offset,
                  "payload_end":
                      payload_end,
                  "os_version":
                      f"{major}.{minor}.{patch}",
                  "security_patch":
                      f"{year:04d}-{month:02d}",
                  "arm64": {
                      "text_offset":
                          text_offset,
                      "image_size":
                          arm_image_size,
                      "flags":
                          arm_flags,
                      "magic":
                          (
                              "0x"
                              f"{arm_magic:08x}"
                          ),
                      "res5":
                          arm_res5,
                  },
                  "embedded_avb_digest":
                      boot_hashes[
                          "boot"
                      ]["digest"],
              },

              "vendor_boot": {
                  "bytes":
                      len(vendor),
                  "sha256":
                      sha(vendor),
                  "header_version":
                      vendor_header_version,
                  "header_size":
                      vendor_header_size,
                  "page_size":
                      vendor_page_size,
                  "vendor_ramdisk_bytes":
                      vendor_ramdisk_size,
                  "dtb_bytes":
                      vendor_dtb_size,
                  "dtb_sha256":
                      sha(vendor_dtb),
                  "dtb_fdt_blobs":
                      vendor_fdt_blobs,
                  "embedded_avb_digest":
                      vendor_hashes[
                          "vendor_boot"
                      ]["digest"],
              },

              "dtbo": {
                  "bytes":
                      len(dtbo),
                  "sha256":
                      sha(dtbo),
                  "table_bytes":
                      dtbo_table_size,
                  "entry_count":
                      dtbo_entry_count,
                  "page_size":
                      dtbo_page_size,
                  "embedded_avb_digest":
                      dtbo_hashes[
                          "dtbo"
                      ]["digest"],
              },

              "vbmeta": {
                  "bytes":
                      len(vbmeta),
                  "sha256":
                      sha(vbmeta),
                  "required_libavb":
                      top[
                          "required_libavb"
                      ],
                  "algorithm_type":
                      top[
                          "algorithm_type"
                      ],
                  "signature_verifies":
                      top[
                          "signature_verifies"
                      ],
                  "signed_digest":
                      top[
                          "signed_digest"
                      ],
                  "public_key_sha256":
                      top[
                          "public_key_sha256"
                      ],
                  "direct_hashes": {
                      name:
                          descriptor[
                              "digest"
                          ]
                      for name, descriptor
                      in top_hashes.items()
                  },
                  "direct_hashes_verify":
                      True,
                  "chain_partitions":
                      sorted(chains),
                  "hashtree_partitions":
                      hashtrees,
              },
          }

          (
              OUT
              / "STOCK-ROM-AUDIT.json"
          ).write_text(
              json.dumps(
                  result,
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          summary = f"""
          VEUX Workflow 18 - Exact Stock ROM Read-Only Audit
          ==================================================
          RESULT: PASS_READ_ONLY_REPRODUCED_FROM_FASTBOOT_ROM

          Source ROM: {os.environ['ROM_VERSION']}
          Source package: {os.environ['ROM_FILE']}
          Package MD5 gate: {os.environ['ROM_MD5']}

          boot.img:
          {len(boot)} bytes
          SHA-256 {sha(boot)}

          vendor_boot.img:
          {len(vendor)} bytes
          SHA-256 {sha(vendor)}

          dtbo.img:
          {len(dtbo)} bytes
          SHA-256 {sha(dtbo)}

          vbmeta.img:
          {len(vbmeta)} bytes
          SHA-256 {sha(vbmeta)}

          Boot header:
          v{header_version}
          header size {header_size}
          alignment 4096

          Stock kernel:
          {kernel_size} bytes
          SHA-256 {sha(kernel)}

          Stock ramdisk:
          {ramdisk_size} bytes
          LZ4 legacy
          SHA-256 {sha(ramdisk)}

          Boot embedded AVB hash: PASS

          vendor_boot:
          v{vendor_header_version}
          page size {vendor_page_size}

          vendor DTB:
          {vendor_dtb_size} bytes
          SHA-256 {sha(vendor_dtb)}
          FDT blobs {len(vendor_fdt_blobs)}

          vendor_boot embedded AVB hash: PASS

          DTBO table:
          {dtbo_entry_count} entries
          {dtbo_table_size} bytes

          dtbo embedded AVB hash: PASS

          Top-level vbmeta:
          SHA256_RSA2048

          Authentication hash: PASS
          RSA signature against embedded public key: PASS
          Direct hash descriptors boot/dtbo/vendor_boot: PASS

          Chain:
          vbmeta_system

          Hashtrees:
          mi_ext
          odm
          vendor

          REPRODUCIBILITY:
          The four images extracted by GitHub are byte-identical
          to the four original images previously extracted from
          this exact ROM.

          No stock image was modified.
          No repack.
          No device operation.
          No flash.
          """

          cleaned = "\n".join(
              line.strip()
              for line
              in summary.splitlines()
          ).strip() + "\n"

          (
              OUT
              / "WORKFLOW18-SUMMARY.txt"
          ).write_text(
              cleaned,
              encoding="utf-8",
          )

          print(cleaned)
          PY

          python3 \
            "$WORK/audit.py" \
            "$STOCK" \
            "$AUDIT"

      - name: Create and verify artifact manifest
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "VEUX Workflow 18 artifact"
            echo "========================="
            echo
            echo "Source ROM:"
            echo "$ROM_FILE"
            echo
            echo "Version:"
            echo "$ROM_VERSION"
            echo
            echo "Expected source MD5:"
            echo "$ROM_MD5"
            echo
            echo "Contains:"
            echo "- exact stock boot.img"
            echo "- exact stock vendor_boot.img"
            echo "- exact stock dtbo.img"
            echo "- exact stock vbmeta.img"
            echo "- complete read-only audit records"
            echo
            echo "The multi-gigabyte source ROM archive is intentionally"
            echo "not included in the final artifact."
          } > "$AUDIT/ARTIFACT-MANIFEST.txt"

          (
            cd "$OUTPUT"

            find . \
              -type f \
              ! -name SHA256SUMS \
              ! -name SHA256SUMS.verify.txt \
              -printf '%P\n' \
              | LC_ALL=C sort \
              | while IFS= read -r file; do
                  sha256sum "$file"
                done \
              > SHA256SUMS

            sha256sum \
              -c SHA256SUMS \
              | tee SHA256SUMS.verify.txt
          )

          grep \
            -qx \
            'RESULT: PASS_READ_ONLY_REPRODUCED_FROM_FASTBOOT_ROM' \
            "$AUDIT/WORKFLOW18-SUMMARY.txt"

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p "$AUDIT"

          {
            echo "VEUX Workflow 18: FAILURE"
            echo
            echo "Finished:"
            date -u '+%Y-%m-%dT%H:%M:%SZ'
            echo
            echo "No device operation was performed."
            echo "Nothing was flashed."
            echo
            df -h /
          } > "$AUDIT/FAILURE-SUMMARY.txt"

          find "$WORK" \
            -maxdepth 7 \
            -type f \
            -printf '%s %p\n' \
            > "$AUDIT/FAILURE-FILE-TREE.txt" \
            2>/dev/null || true

      - name: Upload Workflow 18 PASS artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: veux-os1.0.12.0-workflow18-stock-rom-audit-${{ github.run_number }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6

      - name: Upload Workflow 18 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: veux-os1.0.12.0-workflow18-failure-${{ github.run_number }}
          path: ${{ env.WORK }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          compression-level: 0
