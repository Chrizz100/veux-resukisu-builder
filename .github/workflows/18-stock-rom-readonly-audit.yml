name: 18 - VEUX Exact Stock ROM Read-Only Audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ROM_VERSION: "OS1.0.12.0.TKCMIXM"
  ROM_FILE: "veux_global_images_OS1.0.12.0.TKCMIXM_20241205.0000.00_13.0_global_cda1240a45.tgz"
  ROM_MD5: "cda1240a451dd4f75776878b52f0cea3"

  HUGEOTA_URL: "https://hugeota.d.miui.com/OS1.0.12.0.TKCMIXM/veux_global_images_OS1.0.12.0.TKCMIXM_20241205.0000.00_13.0_global_cda1240a45.tgz"
  BIGOTA_URL: "https://bigota.d.miui.com/OS1.0.12.0.TKCMIXM/veux_global_images_OS1.0.12.0.TKCMIXM_20241205.0000.00_13.0_global_cda1240a45.tgz"
  AFH_FID: "5649633102268470957"

  BOOT_BYTES: "134217728"
  BOOT_SHA: "ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5"
  VENDOR_BOOT_BYTES: "100663296"
  VENDOR_BOOT_SHA: "583e1f4c0e09c2267cda88bd48a8b4f56cf5c5e034fbda7b25bd65aa86385425"
  DTBO_BYTES: "8388608"
  DTBO_SHA: "e9f3bae2c5417ff297162f1e7d2652ee98b347488fdf091d61daa986fbfb7690"
  VBMETA_BYTES: "8192"
  VBMETA_SHA: "62a5b1a94c2247c786e8148b9d9d0aea943b57b1034b3fd82d9cac9a85fcde97"

  STOCK_KERNEL_BYTES: "45480448"
  STOCK_KERNEL_SHA: "6e513b3652aa1de599c26b6aaeefef12dac569daf8648bbb67de99932782c50b"
  RAMDISK_BYTES: "22061278"
  RAMDISK_SHA: "0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a"

  BOOT_AVB_DIGEST: "fc6d91cd4ce2e89703c59e6a35c60e3efd984cfb54a29760e4a3105c42399d8a"
  VENDOR_BOOT_AVB_DIGEST: "370f9c242bd161bd36effc3e7b56f208e21700a9a4e848b004f68595df2190c6"
  DTBO_AVB_DIGEST: "a49a514a35a1ee60c19716407eb70f8bf5f9a8fec7aa8394c00c370f7ca0c6d9"

  VENDOR_DTB_BYTES: "651045"
  VENDOR_DTB_SHA: "10b7b848141bff201e1953d44128a3de92272a4fdc1afbf90b4e60682830ff46"

  VBMETA_SIGNED_DIGEST: "4ba69147c283e7a43aec1c5f951901f9060057e21bae4e2c3df17400698bdb4c"
  VBMETA_KEY_SHA: "c5d3c71bc70d58e3e0409ca9d9b34c0dbac1d2f09a5de948a4b8f090f1926965"
  STOCK_FINGERPRINT: "qti/veux/veux:13/TKQ1.221114.001/V816.0.12.0.TKCMIXM:user/release-keys"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      WORK: ${{ github.workspace }}/workflow18
      DOWNLOAD: ${{ github.workspace }}/workflow18/download
      EXTRACT: ${{ github.workspace }}/workflow18/extract
      STOCK: ${{ github.workspace }}/workflow18/output/stock_images
      AUDIT: ${{ github.workspace }}/workflow18/output/audit
      OUTPUT: ${{ github.workspace }}/workflow18/output

    steps:
      - name: Prepare workspace and disk
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK"
          mkdir -p "$DOWNLOAD" "$EXTRACT" "$STOCK" "$AUDIT"

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            2>/dev/null || true

          df -h / | tee "$AUDIT/DISK-BEFORE.txt"
          free_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          [ "$free_kb" -ge 9000000 ] || {
            echo "ERROR: less than 9 GB free disk space"
            exit 1
          }

      - name: Install download dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 \
            ca-certificates \
            curl

          aria2c --version | head -n 3 | tee "$AUDIT/ARIA2-VERSION.txt"
          curl --version | head -n 2 | tee "$AUDIT/CURL-VERSION.txt"

      - name: Resolve independent ROM mirrors
        shell: bash
        run: |
          set -euo pipefail

          candidates="$AUDIT/ROM-CANDIDATES.txt"
          : > "$candidates"

          printf '%s\n' "$HUGEOTA_URL" >> "$candidates"
          printf '%s\n' "$BIGOTA_URL" >> "$candidates"

          # AndroidFileHost independently hosts the exact same filename/MD5.
          # Its direct download URLs are generated dynamically, so resolve them
          # at run time. Failure here is non-fatal because Xiaomi mirrors remain.
          set +e
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            --user-agent 'Mozilla/5.0' \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data "submit=submit&action=getdownloadmirrors&fid=$AFH_FID" \
            'https://androidfilehost.com/libs/otf/mirrors.otf.php' \
            -o "$AUDIT/AFH-MIRRORS.json"
          afh_rc=$?
          set -e

          if [ "$afh_rc" -eq 0 ]; then
            python3 - \
              "$AUDIT/AFH-MIRRORS.json" \
              "$candidates" <<'PY'
          import json
          import sys

          source, output = sys.argv[1:3]

          try:
              data = json.load(open(source, "r", encoding="utf-8"))
          except Exception as exc:
              print(f"AFH mirror JSON ignored: {exc}")
              raise SystemExit(0)

          urls = []

          def walk(value):
              if isinstance(value, dict):
                  for k, v in value.items():
                      if k.lower() == "url" and isinstance(v, str):
                          if v.startswith(("https://", "http://")):
                              urls.append(v.replace("\\/", "/"))
                      walk(v)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)

          walk(data)

          with open(output, "a", encoding="utf-8") as f:
              for url in urls:
                  f.write(url + "\n")

          print(f"Resolved {len(urls)} AndroidFileHost mirror URL(s).")
          PY
          else
            echo "AndroidFileHost mirror resolver unavailable; continuing."
          fi

          awk 'NF && !seen[$0]++' "$candidates" \
            > "$AUDIT/ROM-CANDIDATES.unique.txt"

          mv "$AUDIT/ROM-CANDIDATES.unique.txt" "$candidates"

          count="$(wc -l < "$candidates" | tr -d ' ')"
          [ "$count" -ge 2 ] || {
            echo "ERROR: fewer than two ROM candidates"
            exit 1
          }

          {
            echo "ROM_VERSION=$ROM_VERSION"
            echo "ROM_FILE=$ROM_FILE"
            echo "EXPECTED_MD5=$ROM_MD5"
            echo "CANDIDATES=$count"
          } | tee "$AUDIT/ROM-SOURCE-PLAN.txt"

          # Do not print signed AFH query strings into the public log.
          nl -ba "$candidates" \
            | sed -E 's#(https?://[^/? ]+).*#\1 ...#' \
            | tee "$AUDIT/ROM-CANDIDATE-HOSTS.txt"

      - name: Benchmark mirrors and select fastest
        shell: bash
        run: |
          set -euo pipefail

          candidates="$AUDIT/ROM-CANDIDATES.txt"
          results="$AUDIT/ROM-BENCHMARK.tsv"
          : > "$results"

          index=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            index=$((index + 1))

            host="$(
              python3 - "$url" <<'PY'
          import sys
          from urllib.parse import urlparse
          print(urlparse(sys.argv[1]).netloc)
          PY
            )"

            probe="$DOWNLOAD/probe-$index.bin"
            rm -f "$probe"

            start="$(date +%s%N)"

            set +e
            timeout \
              --signal=TERM \
              --kill-after=5s \
              22s \
              curl \
                --fail \
                --location \
                --silent \
                --show-error \
                --connect-timeout 8 \
                --max-time 20 \
                --range 0-50331647 \
                --output "$probe" \
                "$url" \
              > "$AUDIT/probe-$index.stdout" \
              2> "$AUDIT/probe-$index.stderr"
            rc=$?
            set -e

            end="$(date +%s%N)"
            elapsed_ns=$((end - start))
            elapsed_ms=$((elapsed_ns / 1000000))
            [ "$elapsed_ms" -gt 0 ] || elapsed_ms=1

            if [ -f "$probe" ]; then
              bytes="$(stat -c '%s' "$probe")"
            else
              bytes=0
            fi

            bps=$((bytes * 1000 / elapsed_ms))

            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$index" "$host" "$bytes" "$elapsed_ms" "$bps" \
              >> "$results"

            rm -f "$probe"
          done < "$candidates"

          cat "$results"

          best_index="$(
            sort -t $'\t' -k5,5nr "$results" \
              | awk 'NR==1 {print $1}'
          )"

          best_bps="$(
            sort -t $'\t' -k5,5nr "$results" \
              | awk 'NR==1 {print $5}'
          )"

          [ -n "$best_index" ] || {
            echo "ERROR: no usable mirror benchmark result"
            exit 1
          }

          # Fail early instead of spending another two hours on an unusable CDN.
          [ "$best_bps" -ge 1000000 ] || {
            echo "ERROR: all ROM mirrors are too slow from this runner."
            echo "Fastest probe: $best_bps bytes/s"
            echo "Aborting early instead of wasting ~2 hours."
            exit 1
          }

          selected="$(
            sed -n "${best_index}p" "$candidates"
          )"

          printf '%s\n' "$selected" \
            > "$AUDIT/SELECTED-ROM-URL.txt"

          selected_host="$(
            python3 - "$selected" <<'PY'
          import sys
          from urllib.parse import urlparse
          print(urlparse(sys.argv[1]).netloc)
          PY
          )"

          {
            echo "SELECTED_INDEX=$best_index"
            echo "SELECTED_HOST=$selected_host"
            echo "PROBE_BYTES_PER_SECOND=$best_bps"
          } | tee "$AUDIT/SELECTED-ROM-MIRROR.txt"

      - name: Download and authenticate exact fastboot ROM
        shell: bash
        run: |
          set -euo pipefail

          file="$DOWNLOAD/$ROM_FILE"
          selected="$(cat "$AUDIT/SELECTED-ROM-URL.txt")"

          rm -f "$file" "$file.aria2"

          timeout \
            --signal=TERM \
            --kill-after=30s \
            75m \
            aria2c \
              --dir="$DOWNLOAD" \
              --out="$ROM_FILE" \
              --continue=true \
              --allow-overwrite=true \
              --auto-file-renaming=false \
              --file-allocation=none \
              --max-connection-per-server=16 \
              --split=16 \
              --min-split-size=8M \
              --piece-length=4M \
              --connect-timeout=20 \
              --timeout=30 \
              --max-tries=15 \
              --retry-wait=3 \
              --lowest-speed-limit=64K \
              --summary-interval=30 \
              --console-log-level=notice \
              "$selected" \
            2>&1 \
            | tee "$AUDIT/ROM-DOWNLOAD.log"

          [ -f "$file" ] || {
            echo "ERROR: ROM archive missing after download"
            exit 1
          }

          bytes="$(stat -c '%s' "$file")"
          actual_md5="$(md5sum "$file" | awk '{print $1}')"

          [ "$actual_md5" = "$ROM_MD5" ] || {
            echo "ERROR: ROM MD5 mismatch"
            echo "Expected: $ROM_MD5"
            echo "Actual:   $actual_md5"
            exit 1
          }

          actual_sha="$(sha256sum "$file" | awk '{print $1}')"

          {
            echo "ROM_VERSION=$ROM_VERSION"
            echo "ROM_FILE=$ROM_FILE"
            echo "ROM_BYTES=$bytes"
            echo "ROM_MD5=$actual_md5"
            echo "ROM_SHA256=$actual_sha"
          } | tee "$AUDIT/FASTBOOT-ROM-SOURCE.txt"

      - name: Locate and extract only required stock images
        shell: bash
        run: |
          set -euo pipefail

          file="$DOWNLOAD/$ROM_FILE"

          tar -tzf "$file" > "$AUDIT/ROM-TAR-FILELIST.txt"

          python3 - \
            "$AUDIT/ROM-TAR-FILELIST.txt" \
            "$AUDIT/SELECTED-ROM-MEMBERS.txt" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])

          targets = {
              "boot.img",
              "vendor_boot.img",
              "dtbo.img",
              "vbmeta.img",
          }

          found = {}

          for raw in source.read_text(
              encoding="utf-8",
              errors="replace",
          ).splitlines():
              name = raw.strip()
              if not name:
                  continue

              base = name.rsplit("/", 1)[-1]

              if base in targets and "/images/" in "/" + name:
                  found.setdefault(base, []).append(name)

          missing = sorted(targets - set(found))
          if missing:
              raise SystemExit(
                  f"Missing expected ROM images: {missing}"
              )

          ambiguous = {
              key: value
              for key, value in found.items()
              if len(value) != 1
          }
          if ambiguous:
              raise SystemExit(
                  f"Ambiguous ROM image paths: {ambiguous}"
              )

          ordered = [
              found["boot.img"][0],
              found["vendor_boot.img"][0],
              found["dtbo.img"][0],
              found["vbmeta.img"][0],
          ]

          output.write_text(
              "\n".join(ordered) + "\n",
              encoding="utf-8",
          )
          PY

          mapfile -t members \
            < "$AUDIT/SELECTED-ROM-MEMBERS.txt"

          tar -xzf "$file" -C "$EXTRACT" "${members[@]}"

          for member in "${members[@]}"; do
            base="$(basename "$member")"
            src="$EXTRACT/$member"

            [ -f "$src" ] || {
              echo "ERROR: extracted member missing: $member"
              exit 1
            }

            case "$base" in
              boot.img)
                cp "$src" "$STOCK/stock_boot.img"
                ;;
              vendor_boot.img)
                cp "$src" "$STOCK/stock_vendor_boot.img"
                ;;
              dtbo.img)
                cp "$src" "$STOCK/stock_dtbo.img"
                ;;
              vbmeta.img)
                cp "$src" "$STOCK/stock_vbmeta.img"
                ;;
              *)
                echo "ERROR: unexpected image: $base"
                exit 1
                ;;
            esac
          done

          rm -rf "$EXTRACT"
          rm -f "$file" "$file.aria2"

      - name: Require byte-identical stock images
        shell: bash
        run: |
          set -euo pipefail

          check() {
            local file="$1"
            local expected_bytes="$2"
            local expected_sha="$3"
            local label="$4"

            local actual_bytes actual_sha
            actual_bytes="$(stat -c '%s' "$file")"
            actual_sha="$(sha256sum "$file" | awk '{print $1}')"

            [ "$actual_bytes" = "$expected_bytes" ] || {
              echo "ERROR: $label size mismatch"
              exit 1
            }

            [ "$actual_sha" = "$expected_sha" ] || {
              echo "ERROR: $label SHA-256 mismatch"
              echo "Expected: $expected_sha"
              echo "Actual:   $actual_sha"
              exit 1
            }

            echo "${label}_BYTES=$actual_bytes"
            echo "${label}_SHA256=$actual_sha"
          }

          {
            check "$STOCK/stock_boot.img" \
              "$BOOT_BYTES" "$BOOT_SHA" BOOT
            check "$STOCK/stock_vendor_boot.img" \
              "$VENDOR_BOOT_BYTES" "$VENDOR_BOOT_SHA" VENDOR_BOOT
            check "$STOCK/stock_dtbo.img" \
              "$DTBO_BYTES" "$DTBO_SHA" DTBO
            check "$STOCK/stock_vbmeta.img" \
              "$VBMETA_BYTES" "$VBMETA_SHA" VBMETA
          } | tee "$AUDIT/PARTITION-HASH-AUDIT.txt"

      - name: Deep read-only boot and AVB audit
        shell: bash
        run: |
          set -euo pipefail

          cat > "$WORK/audit.py" <<'PY'
          import hashlib
          import json
          import os
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          out = Path(sys.argv[2])

          boot = (root / "stock_boot.img").read_bytes()
          vendor = (root / "stock_vendor_boot.img").read_bytes()
          dtbo = (root / "stock_dtbo.img").read_bytes()
          vbmeta = (root / "stock_vbmeta.img").read_bytes()

          def h(data):
              return hashlib.sha256(data).hexdigest()

          def align(value, size):
              return (value + size - 1) // size * size

          def need(value, message):
              if not value:
                  raise SystemExit("ERROR: " + message)

          def avb_footer(image):
              f = image[-64:]
              need(f[:4] == b"AVBf", "AVB footer missing")
              major, minor = struct.unpack_from(">II", f, 4)
              original, offset, size = struct.unpack_from(">QQQ", f, 12)
              need(
                  offset + size <= len(image) - 64,
                  "invalid AVB footer geometry",
              )
              return {
                  "version": f"{major}.{minor}",
                  "original_size": original,
                  "offset": offset,
                  "size": size,
                  "vbmeta": image[offset:offset + size],
              }

          def parse_vbmeta(data):
              need(data[:4] == b"AVB0", "AVB0 magic missing")

              req_major, req_minor = struct.unpack_from(">II", data, 4)
              auth_size, aux_size = struct.unpack_from(">QQ", data, 12)
              algorithm = struct.unpack_from(">I", data, 28)[0]

              (
                  hash_offset,
                  hash_size,
                  signature_offset,
                  signature_size,
                  key_offset,
                  key_size,
                  key_meta_offset,
                  key_meta_size,
                  descriptors_offset,
                  descriptors_size,
                  rollback_index,
              ) = struct.unpack_from(">QQQQQQQQQQQ", data, 32)

              flags, rollback_location = struct.unpack_from(">II", data, 120)

              auth_start = 256
              aux_start = auth_start + auth_size

              need(
                  aux_start + aux_size <= len(data),
                  "vbmeta blocks exceed image",
              )

              digest = None
              hash_ok = True
              signature_ok = True
              key_sha = None

              if hash_size:
                  need(hash_size == 32, "unexpected vbmeta hash size")
                  digest = hashlib.sha256(
                      data[:256] + data[aux_start:aux_start + aux_size]
                  ).digest()

                  stored = data[
                      auth_start + hash_offset:
                      auth_start + hash_offset + hash_size
                  ]
                  hash_ok = digest == stored

              if algorithm == 1:
                  need(
                      hash_size == 32
                      and signature_size == 256
                      and key_size == 520,
                      "unexpected SHA256_RSA2048 geometry",
                  )

                  signature = data[
                      auth_start + signature_offset:
                      auth_start + signature_offset + signature_size
                  ]

                  key = data[
                      aux_start + key_offset:
                      aux_start + key_offset + key_size
                  ]
                  key_sha = h(key)

                  bits = struct.unpack_from(">I", key, 0)[0]
                  need(bits == 2048, "unexpected RSA key size")
                  nbytes = bits // 8
                  modulus = int.from_bytes(key[8:8 + nbytes], "big")

                  decoded = pow(
                      int.from_bytes(signature, "big"),
                      65537,
                      modulus,
                  ).to_bytes(nbytes, "big")

                  der = bytes.fromhex(
                      "3031300d060960864801650304020105000420"
                  )
                  expected = (
                      b"\x00\x01"
                      + b"\xff" * (nbytes - 3 - len(der) - 32)
                      + b"\x00"
                      + der
                      + digest
                  )
                  signature_ok = decoded == expected

              elif algorithm == 0:
                  need(
                      auth_size == 0
                      and hash_size == 0
                      and signature_size == 0,
                      "unexpected unsigned vbmeta auth block",
                  )
              else:
                  raise SystemExit(
                      f"ERROR: unsupported AVB algorithm {algorithm}"
                  )

              descriptors = []
              properties = {}

              pos = aux_start + descriptors_offset
              end = pos + descriptors_size
              need(
                  end <= aux_start + aux_size,
                  "descriptors outside auxiliary block",
              )

              while pos < end:
                  tag, following = struct.unpack_from(">QQ", data, pos)
                  d = data[pos:pos + 16 + following]
                  need(
                      len(d) == 16 + following,
                      "truncated AVB descriptor",
                  )

                  if tag == 0:
                      key_len, value_len = struct.unpack_from(">QQ", d, 16)
                      q = 32
                      key = d[q:q + key_len].decode("utf-8", "replace")
                      q += key_len
                      if q < len(d) and d[q] == 0:
                          q += 1
                      value = d[q:q + value_len].decode(
                          "utf-8",
                          "replace",
                      )
                      properties.setdefault(key, []).append(value)

                  elif tag == 1:
                      name_len, salt_len, root_len, dflags = (
                          struct.unpack_from(">IIII", d, 104)
                      )
                      alg = d[72:104].split(b"\0", 1)[0].decode()
                      q = 180
                      name = d[q:q + name_len].decode()
                      descriptors.append({
                          "type": "hashtree",
                          "partition": name,
                          "algorithm": alg,
                          "flags": dflags,
                      })

                  elif tag == 2:
                      image_size = struct.unpack_from(">Q", d, 16)[0]
                      alg = d[24:56].split(b"\0", 1)[0].decode()
                      name_len, salt_len, digest_len, dflags = (
                          struct.unpack_from(">IIII", d, 56)
                      )
                      q = 132
                      name = d[q:q + name_len].decode()
                      q += name_len
                      salt = d[q:q + salt_len]
                      q += salt_len
                      digest_value = d[q:q + digest_len]
                      descriptors.append({
                          "type": "hash",
                          "partition": name,
                          "image_size": image_size,
                          "algorithm": alg,
                          "salt": salt.hex(),
                          "digest": digest_value.hex(),
                          "flags": dflags,
                      })

                  elif tag == 4:
                      rollback_loc, name_len, public_key_len = (
                          struct.unpack_from(">III", d, 16)
                      )
                      q = 92
                      name = d[q:q + name_len].decode()
                      q += name_len
                      chain_key = d[q:q + public_key_len]
                      descriptors.append({
                          "type": "chain",
                          "partition": name,
                          "rollback_index_location": rollback_loc,
                          "public_key_sha256": h(chain_key),
                      })

                  pos += 16 + following

              need(pos == end, "descriptor parse did not end exactly")

              return {
                  "required_libavb": f"{req_major}.{req_minor}",
                  "algorithm_type": algorithm,
                  "hash_verifies": hash_ok,
                  "signature_verifies": signature_ok,
                  "signed_digest": digest.hex() if digest else None,
                  "public_key_sha256": key_sha,
                  "rollback_index": rollback_index,
                  "flags": flags,
                  "rollback_index_location": rollback_location,
                  "descriptors": descriptors,
                  "properties": properties,
              }

          def hash_descriptors(info):
              return {
                  d["partition"]: d
                  for d in info["descriptors"]
                  if d["type"] == "hash"
              }

          def verify_descriptor(image, descriptor):
              need(
                  descriptor["algorithm"] == "sha256",
                  "non-sha256 hash descriptor",
              )
              size = descriptor["image_size"]
              need(size <= len(image), "descriptor size exceeds image")
              calculated = hashlib.sha256(
                  bytes.fromhex(descriptor["salt"]) + image[:size]
              ).hexdigest()
              return calculated == descriptor["digest"]

          need(
              len(boot) == int(os.environ["BOOT_BYTES"])
              and h(boot) == os.environ["BOOT_SHA"],
              "boot identity",
          )
          need(
              len(vendor) == int(os.environ["VENDOR_BOOT_BYTES"])
              and h(vendor) == os.environ["VENDOR_BOOT_SHA"],
              "vendor_boot identity",
          )
          need(
              len(dtbo) == int(os.environ["DTBO_BYTES"])
              and h(dtbo) == os.environ["DTBO_SHA"],
              "dtbo identity",
          )
          need(
              len(vbmeta) == int(os.environ["VBMETA_BYTES"])
              and h(vbmeta) == os.environ["VBMETA_SHA"],
              "vbmeta identity",
          )

          need(boot[:8] == b"ANDROID!", "boot magic")
          kernel_size, ramdisk_size, os_raw, header_size = (
              struct.unpack_from("<4I", boot, 8)
          )
          header_version = struct.unpack_from("<I", boot, 40)[0]
          reserved = struct.unpack_from("<4I", boot, 24)

          need(
              header_version == 3
              and header_size == 1580
              and reserved == (0, 0, 0, 0),
              "boot v3 header",
          )

          ramdisk_offset = 4096 + align(kernel_size, 4096)
          payload_end = ramdisk_offset + align(ramdisk_size, 4096)

          kernel = boot[4096:4096 + kernel_size]
          ramdisk = boot[
              ramdisk_offset:
              ramdisk_offset + ramdisk_size
          ]

          need(
              kernel_size == int(os.environ["STOCK_KERNEL_BYTES"])
              and h(kernel) == os.environ["STOCK_KERNEL_SHA"],
              "stock kernel identity",
          )
          need(
              ramdisk_size == int(os.environ["RAMDISK_BYTES"])
              and h(ramdisk) == os.environ["RAMDISK_SHA"],
              "stock ramdisk identity",
          )
          need(
              ramdisk[:4] == bytes.fromhex("02214c18"),
              "ramdisk is not LZ4 legacy",
          )

          text_offset, arm_size, arm_flags = struct.unpack_from(
              "<QQQ",
              kernel,
              8,
          )
          arm_magic, arm_res5 = struct.unpack_from("<II", kernel, 56)

          need(
              text_offset == 0x80000
              and arm_flags == 0xA
              and arm_magic == 0x644D5241
              and arm_res5 == 0x40,
              "ARM64 Image header mismatch",
          )

          bf = avb_footer(boot)
          bi = parse_vbmeta(bf["vbmeta"])
          bh = hash_descriptors(bi)

          need(
              bf["original_size"] == payload_end,
              "boot AVB footer geometry",
          )
          need(
              set(bh) == {"boot"}
              and verify_descriptor(boot, bh["boot"]),
              "boot embedded AVB hash",
          )
          need(
              bh["boot"]["digest"] == os.environ["BOOT_AVB_DIGEST"],
              "boot AVB digest identity",
          )

          need(vendor[:8] == b"VNDRBOOT", "vendor_boot magic")
          vhv, page, kaddr, raddr, vrsize = struct.unpack_from(
              "<IIIII",
              vendor,
              8,
          )
          tags = struct.unpack_from("<I", vendor, 2076)[0]
          vhsize = struct.unpack_from("<I", vendor, 2096)[0]
          vdsize = struct.unpack_from("<I", vendor, 2100)[0]
          vdaddr = struct.unpack_from("<Q", vendor, 2104)[0]

          need(
              vhv == 3
              and vhsize == 2112
              and page == 4096
              and kaddr == 32768
              and raddr == 16777216
              and tags == 256
              and vdaddr == 0x1F00000,
              "vendor_boot v3 geometry",
          )

          vrd_offset = align(vhsize, page)
          vdt_offset = vrd_offset + align(vrsize, page)
          vdt = vendor[vdt_offset:vdt_offset + vdsize]

          need(
              vdsize == int(os.environ["VENDOR_DTB_BYTES"])
              and h(vdt) == os.environ["VENDOR_DTB_SHA"],
              "vendor DTB identity",
          )

          fdt_count = 0
          pos = 0

          while pos < len(vdt):
              need(
                  vdt[pos:pos + 4] == b"\xd0\r\xfe\xed",
                  f"vendor DTB non-FDT at {pos}",
              )
              size = struct.unpack_from(">I", vdt, pos + 4)[0]
              need(
                  size >= 40 and pos + size <= len(vdt),
                  "invalid vendor FDT size",
              )
              fdt_count += 1
              pos += size

          need(fdt_count == 3, "vendor DTB FDT count")

          vf = avb_footer(vendor)
          vi = parse_vbmeta(vf["vbmeta"])
          vh = hash_descriptors(vi)

          need(
              set(vh) == {"vendor_boot"}
              and verify_descriptor(vendor, vh["vendor_boot"]),
              "vendor_boot embedded AVB hash",
          )
          need(
              vh["vendor_boot"]["digest"]
              == os.environ["VENDOR_BOOT_AVB_DIGEST"],
              "vendor_boot AVB digest identity",
          )

          (
              dt_magic,
              table_size,
              dt_header_size,
              entry_size,
              entry_count,
              entries_offset,
              dt_page,
              dt_version,
          ) = struct.unpack_from(">8I", dtbo, 0)

          need(
              dt_magic == 0xD7B7AB1E
              and table_size == 2760081
              and dt_header_size == 32
              and entry_size == 32
              and entry_count == 16
              and entries_offset == 32
              and dt_page == 4096
              and dt_version == 0,
              "DTBO table geometry",
          )

          for i in range(entry_count):
              offset = entries_offset + i * entry_size
              size, start = struct.unpack_from(">II", dtbo, offset)
              need(
                  start + size <= table_size,
                  f"DTBO entry {i} outside table",
              )
              need(
                  dtbo[start:start + 4] == b"\xd0\r\xfe\xed",
                  f"DTBO entry {i} is not FDT",
              )

          df = avb_footer(dtbo)
          di = parse_vbmeta(df["vbmeta"])
          dh = hash_descriptors(di)

          need(
              set(dh) == {"dtbo"}
              and verify_descriptor(dtbo, dh["dtbo"]),
              "dtbo embedded AVB hash",
          )
          need(
              dh["dtbo"]["digest"] == os.environ["DTBO_AVB_DIGEST"],
              "dtbo AVB digest identity",
          )

          top = parse_vbmeta(vbmeta)
          top_hashes = hash_descriptors(top)

          need(
              top["algorithm_type"] == 1
              and top["hash_verifies"]
              and top["signature_verifies"],
              "top-level vbmeta signature verification",
          )
          need(
              top["signed_digest"] == os.environ["VBMETA_SIGNED_DIGEST"],
              "top-level signed digest identity",
          )
          need(
              top["public_key_sha256"] == os.environ["VBMETA_KEY_SHA"],
              "top-level public key identity",
          )
          need(
              set(top_hashes) == {"boot", "dtbo", "vendor_boot"},
              "top-level direct hash set",
          )

          images = {
              "boot": boot,
              "dtbo": dtbo,
              "vendor_boot": vendor,
          }

          for name, descriptor in top_hashes.items():
              need(
                  verify_descriptor(images[name], descriptor),
                  f"top-level {name} hash verification",
              )

          need(
              top_hashes["boot"]["digest"]
              == os.environ["BOOT_AVB_DIGEST"],
              "top-level boot digest",
          )
          need(
              top_hashes["dtbo"]["digest"]
              == os.environ["DTBO_AVB_DIGEST"],
              "top-level dtbo digest",
          )
          need(
              top_hashes["vendor_boot"]["digest"]
              == os.environ["VENDOR_BOOT_AVB_DIGEST"],
              "top-level vendor_boot digest",
          )

          chains = {
              d["partition"]: d
              for d in top["descriptors"]
              if d["type"] == "chain"
          }

          trees = sorted(
              d["partition"]
              for d in top["descriptors"]
              if d["type"] == "hashtree"
          )

          need(
              sorted(chains) == ["vbmeta_system"]
              and chains["vbmeta_system"][
                  "rollback_index_location"
              ] == 2,
              "vbmeta chain",
          )
          need(
              trees == ["mi_ext", "odm", "vendor"],
              "vbmeta hashtrees",
          )
          need(
              os.environ["STOCK_FINGERPRINT"]
              in top["properties"].get(
                  "com.android.build.boot.fingerprint",
                  [],
              ),
              "stock boot fingerprint",
          )
          need(
              "2024-12-01"
              in top["properties"].get(
                  "com.android.build.boot.security_patch",
                  [],
              ),
              "stock boot security patch",
          )

          result = {
              "result": "PASS_READ_ONLY_REPRODUCED_FROM_FASTBOOT_ROM",
              "source": {
                  "version": os.environ["ROM_VERSION"],
                  "file": os.environ["ROM_FILE"],
                  "md5": os.environ["ROM_MD5"],
              },
              "boot": {
                  "bytes": len(boot),
                  "sha256": h(boot),
                  "header_version": header_version,
                  "kernel_bytes": kernel_size,
                  "kernel_sha256": h(kernel),
                  "ramdisk_bytes": ramdisk_size,
                  "ramdisk_sha256": h(ramdisk),
                  "ramdisk_format": "lz4_legacy",
                  "arm64_text_offset": text_offset,
                  "arm64_image_size": arm_size,
                  "embedded_avb_digest": bh["boot"]["digest"],
              },
              "vendor_boot": {
                  "bytes": len(vendor),
                  "sha256": h(vendor),
                  "header_version": vhv,
                  "dtb_bytes": vdsize,
                  "dtb_sha256": h(vdt),
                  "dtb_fdt_count": fdt_count,
                  "embedded_avb_digest": vh["vendor_boot"]["digest"],
              },
              "dtbo": {
                  "bytes": len(dtbo),
                  "sha256": h(dtbo),
                  "entry_count": entry_count,
                  "embedded_avb_digest": dh["dtbo"]["digest"],
              },
              "vbmeta": {
                  "bytes": len(vbmeta),
                  "sha256": h(vbmeta),
                  "signature_verifies": top["signature_verifies"],
                  "direct_hashes_verify": True,
                  "chain_partitions": sorted(chains),
                  "hashtree_partitions": trees,
              },
          }

          (out / "STOCK-ROM-AUDIT.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          summary = f"""VEUX Workflow 18 - Exact Stock ROM Read-Only Audit
          ==================================================
          RESULT: PASS_READ_ONLY_REPRODUCED_FROM_FASTBOOT_ROM

          Source ROM: {os.environ['ROM_VERSION']}
          Source package: {os.environ['ROM_FILE']}
          Source MD5: {os.environ['ROM_MD5']}

          boot.img: {len(boot)} bytes
          SHA-256: {h(boot)}

          vendor_boot.img: {len(vendor)} bytes
          SHA-256: {h(vendor)}

          dtbo.img: {len(dtbo)} bytes
          SHA-256: {h(dtbo)}

          vbmeta.img: {len(vbmeta)} bytes
          SHA-256: {h(vbmeta)}

          Boot v3 / ARM64 / LZ4 ramdisk: PASS
          Embedded boot AVB hash: PASS
          vendor_boot v3 / 3 FDT blobs: PASS
          Embedded vendor_boot AVB hash: PASS
          DTBO table / 16 entries: PASS
          Embedded dtbo AVB hash: PASS
          Top-level SHA256_RSA2048 vbmeta signature: PASS
          Direct boot/dtbo/vendor_boot hashes: PASS
          Chain vbmeta_system: PASS
          Hashtrees mi_ext/odm/vendor: PASS

          The four images extracted by GitHub are byte-identical to the
          previously verified originals from this exact ROM.

          No image modified.
          No repack.
          No device operation.
          No flash.
          """

          cleaned = "\n".join(
              line.strip()
              for line in summary.splitlines()
          ).strip() + "\n"

          (out / "WORKFLOW18-SUMMARY.txt").write_text(
              cleaned,
              encoding="utf-8",
          )

          print(cleaned)
          PY

          python3 "$WORK/audit.py" "$STOCK" "$AUDIT"

      - name: Create and verify artifact manifest
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "VEUX Workflow 18 artifact"
            echo "========================="
            echo
            echo "Source ROM: $ROM_VERSION"
            echo "Source package: $ROM_FILE"
            echo "Source MD5: $ROM_MD5"
            echo
            echo "Contains exact stock images plus read-only audit records."
            echo "The multi-gigabyte ROM archive itself is intentionally omitted."
          } > "$AUDIT/ARTIFACT-MANIFEST.txt"

          (
            cd "$OUTPUT"

            find . \
              -type f \
              ! -name SHA256SUMS \
              ! -name SHA256SUMS.verify.txt \
              -printf '%P\n' \
              | LC_ALL=C sort \
              | while IFS= read -r file; do
                  sha256sum "$file"
                done \
              > SHA256SUMS

            sha256sum -c SHA256SUMS \
              | tee SHA256SUMS.verify.txt
          )

          grep -qx \
            'RESULT: PASS_READ_ONLY_REPRODUCED_FROM_FASTBOOT_ROM' \
            "$AUDIT/WORKFLOW18-SUMMARY.txt"

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p "$AUDIT"

          {
            echo "VEUX Workflow 18: FAILURE"
            echo "Finished: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "No device operation was performed."
            echo "Nothing was flashed."
            echo
            df -h /
          } > "$AUDIT/FAILURE-SUMMARY.txt"

          find "$WORK" \
            -maxdepth 7 \
            -type f \
            -printf '%s %p\n' \
            > "$AUDIT/FAILURE-FILE-TREE.txt" \
            2>/dev/null || true

      - name: Upload Workflow 18 PASS artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: veux-os1.0.12.0-workflow18-stock-rom-audit-${{ github.run_number }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6

      - name: Upload Workflow 18 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: veux-os1.0.12.0-workflow18-failure-${{ github.run_number }}
          path: ${{ env.WORK }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          compression-level: 0
