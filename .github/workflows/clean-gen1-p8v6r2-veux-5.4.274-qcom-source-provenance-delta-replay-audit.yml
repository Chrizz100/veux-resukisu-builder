name: CLEAN GEN1 P8 v6 r2 - VEUX 5.4.274 QCOM source provenance delta replay audit

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: clean-gen1-p8v6r2-veux-5-4-274-qcom-source-provenance
  cancel-in-progress: false

env:
  TARGET_REGION_COUNT: '8'
  TARGET_REGION_IDS: china,global,india,indonesia,japan,russia,taiwan,turkey
  EEA_INCLUDED: 'NO'

  P8V6_R1_RUN_ID: '33719642189'
  P8V6_R1_ARTIFACT: clean-gen1-p8v6-veux-5.4.274-qcom-source-provenance-33719642189
  P8V6_R1_ARTIFACT_DIGEST: 4304c08f513c164df0aaf967edd7da05f66c89155b38aed4b89f08e97fd75953
  P8V6_R1_FAILURE: PARENT_ASSERTION_KEY_PREFIX_MISMATCH

  P8V5_R2_RUN_ID: '33718297502'
  P8V5_R2_ARTIFACT: clean-gen1-p8v5r2-veux-5.4.274-stock-abi-baseline-33718297502
  P8V5_R2_ARTIFACT_DIGEST: 440883f706ac670c362acfd99781188fd54309bf750f54e1a21b5ad4328645f7

  P8V4_RUN_ID: '33715851349'
  P8V4_ARTIFACT: clean-gen1-p8v4-veux-5.4.274-stock-module-abi-root-cause-33715851349
  P8V4_ARTIFACT_DIGEST: a6bc6c381502428a368bb2110ea520da1a8d9b6c6dadd1e276ade616348bfe16

  P8V3_R4_RUN_ID: '33714473183'
  P8V3_R4_ARTIFACT: clean-gen1-p8v3r4-veux-5.4.274-normal-boot-module-crc-proof-33714473183
  P8V3_R4_ARTIFACT_DIGEST: 02b2d90fb53a0bc6d5f4e34efee0ae884f8735bbd72b24ed70f399afb815a115

  VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
  VENDOR_TAG: '20240619'
  EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632

  QCOM_5_4_268_BASE: 01f564dfc631489d652fe1fdacb8f096e31390d6
  QCOM_5_4_274_MERGE: 13dd90963a13d7ed0aa628748fe521e328fa93af
  QCOM_5_4_274_SECOND_PARENT: f60d08db833bc56f054420abe0c16e8ca60fb1a0

  STOCK_CLANG_REPO: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
  STOCK_CLANG_PREBUILT_COMMIT: 4c6fbc28d3b078a5308894fc175f962bb26a5718
  STOCK_CLANG_DIRNAME: clang-r383902b1
  STOCK_CLANG_BUILD: '6877366'
  STOCK_CLANG_REV: r383902b1
  STOCK_CLANG_VERSION: '11.0.2'
  STOCK_LLVM_COMMIT: b397f81060ce6d701042b782172ed13bee898b79

  EXPECTED_STOCK_CONFIG_SHA256: 334536114ee2c11287bc73c20a18073bc4fcc4d59656991e43a16bb917c7c868
  EXPECTED_STOCK_GKI_MODULE_LAYOUT_CRC: '0x1e5b7ab7'
  EXPECTED_STOCK_QGKI_MODULE_LAYOUT_CRC: '0x945d02f2'
  EXPECTED_OLD_CANDIDATE_MODULE_LAYOUT_CRC: '0x0221efb9'

  EXPECTED_R4_KERNEL_MISMATCH_COUNT: '9456'
  EXPECTED_R4_UNRESOLVED_IMPORT_COUNT: '1251'
  EXPECTED_R4_KNOWN_FAILURE_PAIR_COUNT: '10707'
  EXPECTED_R4_GKI_PAIR_COUNT: '8783'
  EXPECTED_R4_QGKI_PAIR_COUNT: '1924'

  KBUILD_BUILD_USER: builder
  KBUILD_BUILD_HOST: pangu-build-component-vendor-345942-54r9t-tw0tk-tq90c
  KBUILD_BUILD_TIMESTAMP: Thu Dec 5 14:47:59 UTC 2024
  KBUILD_BUILD_VERSION: '1'
  SOURCE_DATE_EPOCH: '1733410079'
  BASELINE_EFFECTIVE_KCFLAGS: -D__ANDROID_COMMON_KERNEL__

jobs:
  qcom-provenance-replay:
    name: Replay public QCOM 5.4.268 to 5.4.274 merge delta
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      WORK_DIR: ${{ github.workspace }}/p8v6
      KERNEL_DIR: ${{ github.workspace }}/p8v6/kernel
      OUT_DIR: ${{ github.workspace }}/p8v6/out
      P8V5_DIR: ${{ github.workspace }}/p8v6/p8v5r2
      P8V4_DIR: ${{ github.workspace }}/p8v6/p8v4
      R4_DIR: ${{ github.workspace }}/p8v6/r4
      TOOLCHAIN_DIR: ${{ github.workspace }}/p8v6/toolchain
      ARTIFACT_DIR: ${{ github.workspace }}/p8v6/artifact
      QCOM_DELTA_PATCH: ${{ github.workspace }}/p8v6/qcom-5.4.268-to-5.4.274.patch

    steps:
      - name: Initialize fail-closed provenance audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR"
          mkdir -p \
            "$KERNEL_DIR" "$OUT_DIR" "$P8V5_DIR" "$P8V4_DIR" "$R4_DIR" \
            "$TOOLCHAIN_DIR" "$ARTIFACT_DIR"

          cat > "$ARTIFACT_DIR/00-plan.txt" <<'EOF'
          CLEAN GEN1 P8-v6 r2 - VEUX 5.4.274 QCOM source-provenance delta replay

          Retry provenance:
          - P8-v6 r1 run 33719642189 stopped before source checkout.
          - All three parent artifact downloads and internal SHA256SUMS passed.
          - The only failing parent assertion expected the unprefixed key
            VENDOR_LEGACY_KERNELSU_ENABLED=NO.
          - The authenticated P8-v5 r2 artifact actually records
            P8V5_VENDOR_LEGACY_KERNELSU_ENABLED=NO.
          - This r2 changes only that assertion key plus retry naming/provenance.

          P8-v5 r2 established a meaningful source-provenance failure:
          - public VEUX tag 20240619 authenticates to b2b7a3bbc36d...;
          - its baseline kernelrelease is 5.4.268~positron/b2b7a3bb;
          - stock kernel is 5.4.274-qgki-g82179e362f33;
          - stock IKCONFIG olddefconfig replay changes 74 semantic Kconfig states;
          - stock-config build on the untouched 20240619 tree fails;
          - primary compile errors include undeclared shrinker_rwsem and __PS;
          - no Module.symvers/CRC conclusion was reached.

          Public QCOM evidence in the same repository:
          - first-parent msm-5.4 commit 01f564df... is Linux 5.4.268;
          - merge commit 13dd9096... is Linux 5.4.274;
          - its commit subject is:
            Merge "Merge android11-5.4.274 (564901b) into msm-5.4"
          - first parent: 01f564df...
          - second parent: f60d08db...

          Controlled hypothesis:
          Replay exactly the first-parent diff 01f564df..13dd9096 onto the
          untouched VEUX 20240619 snapshot using git apply --3way --index.

          Rules:
          - NO manual conflict resolution.
          - A replay conflict is an evidence result, not permission to edit code.
          - If replay succeeds, use authenticated stock IKCONFIG and exact stock
            Android clang r383902b1 / 11.0.2.
          - Build only an evidence baseline (Image + modules).
          - If Module.symvers exists, retest the exact 10,707 module/symbol CRC
            pairs that P8-v3 r4 proved failed against the old ReSukiSU candidate.
          - No ReSukiSU/SUSFS restore.
          - No hand-written source fix.
          - No defconfig patch.
          - No CRC/vermagic patch.
          - No force-load.
          - No boot image or flashable ZIP.
          - No device access or flashing.
          - No P9 authorization.

          A successful known-failure-set match is still NOT the complete 17,647
          import contract and is not a device compatibility proof.
          EOF

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl flex git jq \
            kmod libelf-dev libncurses-dev libssl-dev patch python3 rsync \
            unzip xz-utils zstd

      - name: Download P8-v5 r2 evidence
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.P8V5_R2_ARTIFACT }}
          path: ${{ env.P8V5_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V5_R2_RUN_ID }}

      - name: Download P8-v4 root-cause evidence
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.P8V4_ARTIFACT }}
          path: ${{ env.P8V4_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V4_RUN_ID }}

      - name: Download P8-v3 r4 CRC evidence
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.P8V3_R4_ARTIFACT }}
          path: ${{ env.R4_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V3_R4_RUN_ID }}

      - name: Authenticate parent evidence and P8-v5 r2 provenance failure
        shell: bash
        run: |
          set -euo pipefail

          for dir in "$P8V5_DIR" "$P8V4_DIR" "$R4_DIR"; do
            test -s "$dir/SHA256SUMS"
            (
              cd "$dir"
              sha256sum -c SHA256SUMS
            )
          done > "$ARTIFACT_DIR/01-parent-sha256.txt"

          grep -Fxq 'P8V5_R2_SOURCE_AUTH=PASS' \
            "$P8V5_DIR/02-source-provenance.txt"
          grep -Fxq 'VENDOR_COMMIT=b2b7a3bbc36d120ee523ebc8d68e0f13a97df632' \
            "$P8V5_DIR/02-source-provenance.txt"
          grep -Fxq 'EXTERNAL_RESUKISU_TREE_PRESENT=NO' \
            "$P8V5_DIR/02-source-provenance.txt"
          grep -Fxq 'P8V5_VENDOR_LEGACY_KERNELSU_ENABLED=NO' \
            "$P8V5_DIR/99-job-end-state.txt"

          grep -Fxq 'P8V5_STOCK_CLANG_AUTH=PASS' \
            "$P8V5_DIR/03-stock-clang-auth.txt"
          grep -Fxq 'P8V5_STOCK_CONFIG_REPLAY=PASS' \
            "$P8V5_DIR/04-config-replay.txt"
          grep -Fxq 'SEMANTIC_CONFIG_DIFFERENCE_COUNT=74' \
            "$P8V5_DIR/04-config-replay.txt"
          grep -Fxq 'P8V5_BASELINE_BUILD_EXIT_CODE=2' \
            "$P8V5_DIR/05-baseline-build-state.txt"
          grep -Fxq 'P8V5_BASELINE_KERNEL_RELEASE=5.4.268~positron/b2b7a3bb' \
            "$P8V5_DIR/05-baseline-build-state.txt"
          grep -Fxq 'P8V5_BASELINE_KERNEL_RELEASE_MATCH=NO' \
            "$P8V5_DIR/05-baseline-build-state.txt"
          grep -Fq "undeclared identifier 'shrinker_rwsem'" \
            "$P8V5_DIR/05-baseline-build.log"
          grep -Fq "implicit declaration of function '__PS'" \
            "$P8V5_DIR/05-baseline-build.log"

          test -s "$P8V4_DIR/06-stock.config"
          test "$(sha256sum "$P8V4_DIR/06-stock.config" | awk '{print $1}')" \
            = "$EXPECTED_STOCK_CONFIG_SHA256"

          grep -Fxq 'P8V3_R4_GLOBAL_NORMAL_BOOT_STOCK_SYMBOL_CRC_PROOF=FAIL' \
            "$R4_DIR/P8V3R4-GLOBAL-NORMAL-BOOT-STOCK-CRC.txt"
          test -s "$R4_DIR/P8V3R4-GLOBAL-NORMAL-BOOT-STOCK-CRC.json"

          {
            echo "P8V6_PARENT_AUTH=PASS"
            echo "P8V6_RETRY=R2"
            echo "P8V6_R1_RUN_ID=$P8V6_R1_RUN_ID"
            echo "P8V6_R1_ARTIFACT_DIGEST=$P8V6_R1_ARTIFACT_DIGEST"
            echo "P8V6_R1_FAILURE=$P8V6_R1_FAILURE"
            echo "P8V5_R2_RUN_ID=$P8V5_R2_RUN_ID"
            echo "P8V5_R2_ARTIFACT_DIGEST=$P8V5_R2_ARTIFACT_DIGEST"
            echo "P8V5_R2_PROVEN_SOURCE_VERSION=5.4.268"
            echo "STOCK_REQUIRED_VERSION=5.4.274"
            echo "P8V5_R2_CONFIG_REPLAY_DIFFERENCE_COUNT=74"
            echo "P8V5_R2_BUILD_RESULT=FAIL"
            echo "P8V5_R2_CRC_ANALYSIS_REACHED=NO"
          } > "$ARTIFACT_DIR/01-parent-auth.txt"

      - name: Checkout untouched VEUX 20240619 vendor snapshot
        uses: actions/checkout@v6
        with:
          repository: ${{ env.VENDOR_REPO }}
          ref: ${{ env.VENDOR_TAG }}
          path: p8v6/kernel
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate public QCOM 5.4.274 merge provenance
        shell: bash
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
          test -z "$(git status --porcelain)"

          git fetch -q --no-tags --depth=2 origin "$QCOM_5_4_274_MERGE"
          git fetch -q --no-tags --depth=1 origin "$QCOM_5_4_268_BASE"
          git fetch -q --no-tags --depth=1 origin "$QCOM_5_4_274_SECOND_PARENT"

          git cat-file -e "$QCOM_5_4_268_BASE^{commit}"
          git cat-file -e "$QCOM_5_4_274_MERGE^{commit}"
          git cat-file -e "$QCOM_5_4_274_SECOND_PARENT^{commit}"

          parents="$(git rev-list --parents -n1 "$QCOM_5_4_274_MERGE")"
          test "$parents" = \
            "$QCOM_5_4_274_MERGE $QCOM_5_4_268_BASE $QCOM_5_4_274_SECOND_PARENT"

          subject="$(git show -s --format=%s "$QCOM_5_4_274_MERGE")"
          test "$subject" = \
            'Merge "Merge android11-5.4.274 (564901b) into msm-5.4"'

          base_sublevel="$(
            git show "$QCOM_5_4_268_BASE:Makefile" \
              | awk '/^SUBLEVEL = / {print $3; exit}'
          )"
          merge_sublevel="$(
            git show "$QCOM_5_4_274_MERGE:Makefile" \
              | awk '/^SUBLEVEL = / {print $3; exit}'
          )"
          test "$base_sublevel" = 268
          test "$merge_sublevel" = 274

          {
            echo "P8V6_QCOM_MERGE_AUTH=PASS"
            echo "QCOM_BASE=$QCOM_5_4_268_BASE"
            echo "QCOM_BASE_SUBLEVEL=$base_sublevel"
            echo "QCOM_MERGE=$QCOM_5_4_274_MERGE"
            echo "QCOM_MERGE_SUBLEVEL=$merge_sublevel"
            echo "QCOM_MERGE_SECOND_PARENT=$QCOM_5_4_274_SECOND_PARENT"
            echo "QCOM_MERGE_SUBJECT=$subject"
            echo "MANUAL_CONFLICT_RESOLUTION_ALLOWED=NO"
          } > "$ARTIFACT_DIR/02-qcom-merge-provenance.txt"

      - name: Generate and replay exact QCOM first-parent delta
        id: delta
        shell: bash
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
          test -z "$(git status --porcelain)"

          git diff --binary --full-index \
            "$QCOM_5_4_268_BASE" "$QCOM_5_4_274_MERGE" \
            > "$QCOM_DELTA_PATCH"
          test -s "$QCOM_DELTA_PATCH"

          delta_sha="$(sha256sum "$QCOM_DELTA_PATCH" | awk '{print $1}')"
          delta_bytes="$(stat -c '%s' "$QCOM_DELTA_PATCH")"
          delta_files="$(
            git diff --name-only \
              "$QCOM_5_4_268_BASE" "$QCOM_5_4_274_MERGE" \
              | wc -l
          )"

          {
            echo "QCOM_DELTA_SHA256=$delta_sha"
            echo "QCOM_DELTA_BYTES=$delta_bytes"
            echo "QCOM_DELTA_CHANGED_FILE_COUNT=$delta_files"
          } > "$ARTIFACT_DIR/03-qcom-delta-identity.txt"

          set +e
          git apply --3way --index "$QCOM_DELTA_PATCH" \
            > "$ARTIFACT_DIR/03-delta-apply.stdout.txt" \
            2> "$ARTIFACT_DIR/03-delta-apply.stderr.txt"
          apply_rc=$?
          set -e

          if [ "$apply_rc" -ne 0 ]; then
            git status --porcelain \
              > "$ARTIFACT_DIR/03-delta-apply-status.txt" || true
            git diff --name-only --diff-filter=U \
              > "$ARTIFACT_DIR/03-delta-conflicts.txt" || true

            {
              echo "P8V6_QCOM_DELTA_REPLAY=CONFLICT"
              echo "APPLY_EXIT_CODE=$apply_rc"
              echo "MANUAL_CONFLICT_RESOLUTION_PERFORMED=NO"
              echo "SOURCE_BASE=$EXPECTED_VENDOR_SHA"
              echo "QCOM_DELTA_SHA256=$delta_sha"
            } > "$ARTIFACT_DIR/03-delta-replay.txt"

            git reset --hard "$EXPECTED_VENDOR_SHA" >/dev/null
            git clean -fd >/dev/null
            test -z "$(git status --porcelain)"

            echo "P8V6_DELTA_REPLAY=CONFLICT" >> "$GITHUB_ENV"
            echo "result=CONFLICT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --cached --check
          test -z "$(git diff --name-only --diff-filter=U)"

          replay_sublevel="$(awk '/^SUBLEVEL = / {print $3; exit}' Makefile)"
          test "$replay_sublevel" = 274

          replay_tree="$(git write-tree)"
          test "$replay_tree" != "$(git rev-parse "$EXPECTED_VENDOR_SHA^{tree}")"

          git diff --cached --name-only \
            > "$ARTIFACT_DIR/03-delta-replayed-files.txt"
          test "$(wc -l < "$ARTIFACT_DIR/03-delta-replayed-files.txt")" \
            = "$delta_files"

          {
            echo "P8V6_QCOM_DELTA_REPLAY=PASS"
            echo "APPLY_EXIT_CODE=0"
            echo "MANUAL_CONFLICT_RESOLUTION_PERFORMED=NO"
            echo "SOURCE_BASE=$EXPECTED_VENDOR_SHA"
            echo "QCOM_DELTA_SHA256=$delta_sha"
            echo "REPLAYED_TREE=$replay_tree"
            echo "REPLAYED_SUBLEVEL=$replay_sublevel"
          } > "$ARTIFACT_DIR/03-delta-replay.txt"

          echo "P8V6_DELTA_REPLAY=PASS" >> "$GITHUB_ENV"
          echo "result=PASS" >> "$GITHUB_OUTPUT"

      - name: Install exact stock Android clang r383902b1
        if: steps.delta.outputs.result == 'PASS'
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/$STOCK_CLANG_DIRNAME.tar.gz"
          url="${STOCK_CLANG_REPO}/+archive/${STOCK_CLANG_PREBUILT_COMMIT}/${STOCK_CLANG_DIRNAME}.tar.gz"

          curl --fail --location --silent --show-error \
            --retry 8 --retry-delay 3 --retry-all-errors \
            "$url" -o "$archive"

          tar -xzf "$archive" -C "$TOOLCHAIN_DIR"

          "$TOOLCHAIN_DIR/bin/clang" --version \
            > "$ARTIFACT_DIR/04-stock-clang-version.txt"
          "$TOOLCHAIN_DIR/bin/ld.lld" --version \
            >> "$ARTIFACT_DIR/04-stock-clang-version.txt"

          grep -Fq \
            "Android (${STOCK_CLANG_BUILD} based on ${STOCK_CLANG_REV}) clang version ${STOCK_CLANG_VERSION}" \
            "$ARTIFACT_DIR/04-stock-clang-version.txt"
          grep -Fq "$STOCK_LLVM_COMMIT" \
            "$ARTIFACT_DIR/04-stock-clang-version.txt"

          {
            echo "P8V6_STOCK_CLANG_AUTH=PASS"
            echo "STOCK_CLANG_PREBUILT_COMMIT=$STOCK_CLANG_PREBUILT_COMMIT"
            echo "STOCK_CLANG_BUILD=$STOCK_CLANG_BUILD"
            echo "STOCK_CLANG_REV=$STOCK_CLANG_REV"
            echo "STOCK_CLANG_VERSION=$STOCK_CLANG_VERSION"
            echo "STOCK_LLVM_COMMIT=$STOCK_LLVM_COMMIT"
          } > "$ARTIFACT_DIR/04-stock-clang-auth.txt"

      - name: Replay authenticated stock IKCONFIG on reconstructed source
        id: config
        if: steps.delta.outputs.result == 'PASS'
        shell: bash
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          cp "$P8V4_DIR/06-stock.config" "$OUT_DIR/.config"
          cp "$P8V4_DIR/06-stock.config" "$ARTIFACT_DIR/05-stock-input.config"

          make O="$OUT_DIR" \
            ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            olddefconfig \
            2>&1 | tee "$ARTIFACT_DIR/05-olddefconfig.log"

          cp "$OUT_DIR/.config" "$ARTIFACT_DIR/05-replayed.config"

          for required in \
            'CONFIG_MODULES=y' \
            'CONFIG_MODVERSIONS=y' \
            'CONFIG_MODULE_UNLOAD=y' \
            '# CONFIG_MODULE_FORCE_LOAD is not set' \
            '# CONFIG_MODULE_FORCE_UNLOAD is not set' \
            '# CONFIG_MODULE_SIG is not set' \
            'CONFIG_CFI_CLANG=y' \
            'CONFIG_CFI_CLANG_SHADOW=y' \
            'CONFIG_STACKPROTECTOR=y' \
            'CONFIG_STACKPROTECTOR_STRONG=y' \
            'CONFIG_TRACEPOINTS=y' \
            'CONFIG_TRACING=y' \
            'CONFIG_EVENT_TRACING=y' \
            'CONFIG_BPF_EVENTS=y' \
            'CONFIG_FUNCTION_ERROR_INJECTION=y'
          do
            grep -Fxq "$required" "$OUT_DIR/.config"
          done

          if grep -Eq '^CONFIG_KSU=(y|m)$' "$OUT_DIR/.config"; then
            echo "::error::Vendor legacy KernelSU became enabled"
            exit 30
          fi

          python3 - \
            "$ARTIFACT_DIR/05-stock-input.config" \
            "$ARTIFACT_DIR/05-replayed.config" \
            "$ARTIFACT_DIR/05-config-replay-diff.tsv" \
            "$ARTIFACT_DIR/05-config-replay.json" \
            "$ARTIFACT_DIR/05-config-replay.txt" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          source_path, replay_path, diff_path, json_out, text_out = map(
              Path, sys.argv[1:]
          )

          def parse(path):
              result = {}
              for raw in path.read_text(encoding="utf-8").splitlines():
                  if raw.startswith("CONFIG_") and "=" in raw:
                      key, value = raw.split("=", 1)
                      result[key] = value
                      continue
                  match = re.fullmatch(
                      r"# (CONFIG_[A-Za-z0-9_]+) is not set", raw
                  )
                  if match:
                      result[match.group(1)] = "n"
              return result

          stock = parse(source_path)
          replay = parse(replay_path)
          rows = []
          for key in sorted(set(stock) | set(replay)):
              left = stock.get(key, "<ABSENT>")
              right = replay.get(key, "<ABSENT>")
              if left != right:
                  rows.append((key, left, right))

          with diff_path.open("w", encoding="utf-8") as handle:
              handle.write("config_key\tstock_input\treplayed\n")
              for key, left, right in rows:
                  handle.write(f"{key}\t{left}\t{right}\n")

          result = {
              "stage": "P8V6_STOCK_CONFIG_REPLAY_ON_QCOM_5_4_274_DELTA",
              "stock_key_count": len(stock),
              "replayed_key_count": len(replay),
              "semantic_identity": not rows,
              "semantic_difference_count": len(rows),
              "critical_stock_abi_states_preserved": True,
              "vendor_legacy_kernelsu_enabled": replay.get("CONFIG_KSU") in ("y", "m"),
              "source_hand_edit_performed": False,
          }
          json_out.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          text_out.write_text(
              "\n".join([
                  "P8V6_STOCK_CONFIG_REPLAY=PASS",
                  f"STOCK_CONFIG_KEY_COUNT={len(stock)}",
                  f"REPLAYED_CONFIG_KEY_COUNT={len(replay)}",
                  f"SEMANTIC_CONFIG_IDENTITY={'YES' if not rows else 'NO'}",
                  f"SEMANTIC_CONFIG_DIFFERENCE_COUNT={len(rows)}",
                  "CRITICAL_STOCK_ABI_STATES_PRESERVED=YES",
                  "VENDOR_LEGACY_KERNELSU_ENABLED=NO",
                  "SOURCE_HAND_EDIT_PERFORMED=NO",
              ]) + "\n",
              encoding="utf-8",
          )
          PY

          echo "result=PASS" >> "$GITHUB_OUTPUT"

      - name: Build reconstructed stock-provenance baseline
        id: build
        if: steps.delta.outputs.result == 'PASS' && steps.config.outputs.result == 'PASS'
        shell: bash
        working-directory: ${{ env.KERNEL_DIR }}
        timeout-minutes: 160
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          baseline_release="$(
            make -s O="$OUT_DIR" \
              ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
              kernelrelease
          )"
          printf '%s\n' "$baseline_release" \
            > "$ARTIFACT_DIR/06-baseline-kernelrelease.txt"

          set +e
          make -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            KCFLAGS="$BASELINE_EFFECTIVE_KCFLAGS" \
            Image modules \
            2>&1 | tee "$ARTIFACT_DIR/06-baseline-build.log"
          build_rc="${PIPESTATUS[0]}"
          set -e

          grep -E \
            '(^|: )[a-zA-Z0-9_./-]+:[0-9]+(:[0-9]+)?: (fatal )?error:|LLVM ERROR:' \
            "$ARTIFACT_DIR/06-baseline-build.log" \
            | head -n 100 \
            > "$ARTIFACT_DIR/06-primary-build-errors.txt" || true

          {
            echo "P8V6_BASELINE_BUILD_EXIT_CODE=$build_rc"
            echo "P8V6_BASELINE_EFFECTIVE_KCFLAGS=$BASELINE_EFFECTIVE_KCFLAGS"
            echo "P8V6_BASELINE_KERNEL_RELEASE=$baseline_release"
            echo "P8V6_SOURCE_HAND_EDIT_PERFORMED=NO"
          } > "$ARTIFACT_DIR/06-baseline-build-state.txt"

          if [ "$build_rc" -ne 0 ]; then
            echo "P8V6_BASELINE_BUILD=FAIL" \
              >> "$ARTIFACT_DIR/06-baseline-build-state.txt"
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -s "$OUT_DIR/arch/arm64/boot/Image"
          test -s "$OUT_DIR/vmlinux"
          test -s "$OUT_DIR/System.map"
          test -s "$OUT_DIR/Module.symvers"

          cp "$OUT_DIR/Module.symvers" \
            "$ARTIFACT_DIR/06-baseline-Module.symvers"
          cp "$OUT_DIR/.config" "$ARTIFACT_DIR/06-baseline-final.config"

          sha256sum \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$OUT_DIR/vmlinux" \
            "$OUT_DIR/System.map" \
            "$OUT_DIR/Module.symvers" \
            "$OUT_DIR/.config" \
            > "$ARTIFACT_DIR/06-baseline-core.sha256"

          echo "P8V6_BASELINE_BUILD=PASS" \
            >> "$ARTIFACT_DIR/06-baseline-build-state.txt"
          echo "result=PASS" >> "$GITHUB_OUTPUT"

      - name: Retest all R4 known-failing CRC pairs
        id: crc
        if: steps.build.outputs.result == 'PASS'
        shell: bash
        run: |
          set -euo pipefail

          python3 - \
            "$OUT_DIR/Module.symvers" \
            "$R4_DIR/P8V3R4-GLOBAL-NORMAL-BOOT-STOCK-CRC.json" \
            "$ARTIFACT_DIR/07-known-failure-pairs.tsv" \
            "$ARTIFACT_DIR/07-crc-proof.json" \
            "$ARTIFACT_DIR/07-crc-proof.txt" <<'PY'
          import collections
          import csv
          import json
          import sys
          from pathlib import Path

          symvers_path, r4_path, tsv_out, json_out, text_out = map(
              Path, sys.argv[1:]
          )

          vmlinux = {}
          module_provider = {}
          for number, raw in enumerate(
              symvers_path.read_text(encoding="utf-8").splitlines(), 1
          ):
              if not raw.strip():
                  continue
              fields = raw.split()
              if len(fields) < 3:
                  raise SystemExit(
                      f"bad Module.symvers line {number}: {raw!r}"
                  )
              crc, symbol, provider = fields[:3]
              normalized = f"0x{int(crc, 16):08x}"
              target = vmlinux if provider == "vmlinux" else module_provider
              previous = target.get(symbol)
              if previous is not None and previous != normalized:
                  raise SystemExit(f"conflicting CRC for {symbol}")
              target[symbol] = normalized

          if "module_layout" not in vmlinux:
              raise SystemExit("reconstructed baseline lacks module_layout")
          if len(vmlinux) < 500:
              raise SystemExit(
                  f"suspiciously small vmlinux export set: {len(vmlinux)}"
              )

          r4 = json.loads(r4_path.read_text(encoding="utf-8"))
          mismatches = r4["kernel_mismatches"]
          unresolved = r4["unresolved_imports"]
          if len(mismatches) != 9456:
              raise SystemExit("R4 mismatch count drift")
          if len(unresolved) != 1251:
              raise SystemExit("R4 unresolved count drift")

          pairs = []
          for old_class, source in (
              ("OLD_CANDIDATE_CRC_MISMATCH", mismatches),
              ("OLD_CANDIDATE_UNRESOLVED", unresolved),
          ):
              for item in source:
                  module = item["module"]
                  family = (
                      "GKI"
                      if ":lib/modules/5.4-gki/" in module
                      else "QGKI"
                  )
                  pairs.append({
                      "family": family,
                      "old_class": old_class,
                      "module": module,
                      "symbol": item["symbol"],
                      "stock_required_crc": item["stock_required_crc"],
                  })

          if len(pairs) != 10707:
              raise SystemExit(
                  f"known-failure pair count drift: {len(pairs)}"
              )
          unique = {
              (item["module"], item["symbol"]) for item in pairs
          }
          if len(unique) != 10707:
              raise SystemExit("duplicate known-failure module/symbol pair")

          family_inputs = collections.Counter(
              item["family"] for item in pairs
          )
          if family_inputs != collections.Counter(
              {"GKI": 8783, "QGKI": 1924}
          ):
              raise SystemExit(
                  f"family input drift: {family_inputs}"
              )

          counters = collections.defaultdict(collections.Counter)
          rows = []
          for item in pairs:
              actual = vmlinux.get(item["symbol"])
              if actual is None:
                  outcome = "MISSING"
              elif actual == item["stock_required_crc"]:
                  outcome = "MATCH"
              else:
                  outcome = "MISMATCH"
              counters[item["family"]][outcome] += 1
              rows.append({
                  **item,
                  "baseline_vmlinux_crc": actual or "",
                  "baseline_result": outcome,
              })

          with tsv_out.open("w", encoding="utf-8", newline="") as handle:
              fields = [
                  "family", "old_class", "module", "symbol",
                  "stock_required_crc", "baseline_vmlinux_crc",
                  "baseline_result",
              ]
              writer = csv.DictWriter(
                  handle, fieldnames=fields, delimiter="\t"
              )
              writer.writeheader()
              writer.writerows(rows)

          layout = vmlinux["module_layout"]
          if layout == "0x1e5b7ab7":
              layout_family = "GKI"
          elif layout == "0x945d02f2":
              layout_family = "QGKI"
          else:
              layout_family = "NONE"

          gki = counters["GKI"]
          qgki = counters["QGKI"]
          gki_full = (
              gki["MATCH"] == 8783
              and gki["MISMATCH"] == 0
              and gki["MISSING"] == 0
          )
          qgki_full = (
              qgki["MATCH"] == 1924
              and qgki["MISMATCH"] == 0
              and qgki["MISSING"] == 0
          )

          if gki_full and qgki_full:
              raise SystemExit(
                  "impossible result: both distinct stock families fully match"
              )

          if gki_full:
              classification = (
                  "QCOM_5_4_274_GKI_KNOWN_FAILURE_SET_FULL_MATCH"
              )
              next_gate = "P8V7_FULL_GKI_17647_IMPORT_CONTRACT"
          elif qgki_full:
              classification = (
                  "QCOM_5_4_274_QGKI_KNOWN_FAILURE_SET_FULL_MATCH"
              )
              next_gate = "P8V7_FULL_QGKI_17647_IMPORT_CONTRACT"
          elif layout_family != "NONE":
              classification = (
                  "QCOM_5_4_274_LAYOUT_MATCH_BUT_KNOWN_FAILURE_SET_INCOMPLETE"
              )
              next_gate = "P8V7_SOURCE_BUILD_PROVENANCE_DIFFERENTIAL"
          else:
              classification = (
                  "QCOM_5_4_274_NO_STOCK_LAYOUT_FAMILY_MATCH"
              )
              next_gate = "P8V7_SOURCE_BUILD_PROVENANCE_DIFFERENTIAL"

          result = {
              "stage": "CLEAN_GEN1_P8_V6_QCOM_5_4_274_CRC_RETEST",
              "baseline_vmlinux_export_count": len(vmlinux),
              "baseline_module_provider_symbol_count": len(module_provider),
              "baseline_module_layout_crc": layout,
              "baseline_module_layout_family": layout_family,
              "known_failure_pair_count": 10707,
              "gki": {
                  "input": 8783,
                  "match": gki["MATCH"],
                  "mismatch": gki["MISMATCH"],
                  "missing": gki["MISSING"],
                  "full_match": gki_full,
              },
              "qgki": {
                  "input": 1924,
                  "match": qgki["MATCH"],
                  "mismatch": qgki["MISMATCH"],
                  "missing": qgki["MISSING"],
                  "full_match": qgki_full,
              },
              "classification": classification,
              "full_17647_import_contract_proven": False,
              "device_compatibility_proven": False,
              "kernel_change_authorized": False,
              "p9_release_authorized": False,
              "next_gate": next_gate,
          }
          json_out.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          text_out.write_text(
              "\n".join([
                  "P8V6_CRC_RETEST=PASS",
                  f"BASELINE_VMLINUX_EXPORT_COUNT={len(vmlinux)}",
                  f"BASELINE_MODULE_PROVIDER_SYMBOL_COUNT={len(module_provider)}",
                  f"BASELINE_MODULE_LAYOUT_CRC={layout}",
                  f"BASELINE_MODULE_LAYOUT_FAMILY={layout_family}",
                  "KNOWN_FAILURE_PAIR_COUNT=10707",
                  f"GKI_MATCH={gki['MATCH']}",
                  f"GKI_MISMATCH={gki['MISMATCH']}",
                  f"GKI_MISSING={gki['MISSING']}",
                  f"GKI_KNOWN_FAILURE_SET_FULL_MATCH={'YES' if gki_full else 'NO'}",
                  f"QGKI_MATCH={qgki['MATCH']}",
                  f"QGKI_MISMATCH={qgki['MISMATCH']}",
                  f"QGKI_MISSING={qgki['MISSING']}",
                  f"QGKI_KNOWN_FAILURE_SET_FULL_MATCH={'YES' if qgki_full else 'NO'}",
                  f"P8V6_CRC_CLASSIFICATION={classification}",
                  "FULL_17647_IMPORT_CONTRACT_PROVEN=NO",
                  "DEVICE_COMPATIBILITY_PROVEN=NO",
                  "KERNEL_CHANGE_AUTHORIZED=NO",
                  "P9_RELEASE_AUTHORIZED=NO",
                  f"NEXT_GATE={next_gate}",
              ]) + "\n",
              encoding="utf-8",
          )
          PY

          classification="$(
            sed -n 's/^P8V6_CRC_CLASSIFICATION=//p' \
              "$ARTIFACT_DIR/07-crc-proof.txt"
          )"
          test -n "$classification"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"

      - name: Build final evidence classification
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.delta.outputs.result }}" = "CONFLICT" ]; then
            result="QCOM_5_4_274_DELTA_REPLAY_CONFLICT"
            next_gate="P8V7_SOURCE_PROVENANCE_ALTERNATIVE"
          elif [ "${{ steps.delta.outputs.result }}" != "PASS" ]; then
            result="P8V6_MECHANICAL_INCOMPLETE"
            next_gate="P8V6_WORKFLOW_DIAGNOSIS"
          elif [ "${{ steps.config.outputs.result }}" != "PASS" ]; then
            result="QCOM_5_4_274_STOCK_CONFIG_REPLAY_FAILED"
            next_gate="P8V7_SOURCE_PROVENANCE_ALTERNATIVE"
          elif [ "${{ steps.build.outputs.result }}" = "FAIL" ]; then
            result="QCOM_5_4_274_REPLAY_BUILD_FAILED"
            next_gate="P8V7_SOURCE_BUILD_PROVENANCE_DIFFERENTIAL"
          elif [ "${{ steps.build.outputs.result }}" != "PASS" ]; then
            result="P8V6_MECHANICAL_INCOMPLETE"
            next_gate="P8V6_WORKFLOW_DIAGNOSIS"
          elif [ -n "${{ steps.crc.outputs.classification }}" ]; then
            result="${{ steps.crc.outputs.classification }}"
            case "$result" in
              QCOM_5_4_274_GKI_KNOWN_FAILURE_SET_FULL_MATCH)
                next_gate="P8V7_FULL_GKI_17647_IMPORT_CONTRACT"
                ;;
              QCOM_5_4_274_QGKI_KNOWN_FAILURE_SET_FULL_MATCH)
                next_gate="P8V7_FULL_QGKI_17647_IMPORT_CONTRACT"
                ;;
              *)
                next_gate="P8V7_SOURCE_BUILD_PROVENANCE_DIFFERENTIAL"
                ;;
            esac
          else
            result="P8V6_MECHANICAL_INCOMPLETE"
            next_gate="P8V6_WORKFLOW_DIAGNOSIS"
          fi

          {
            echo "P8V6_RESULT=$result"
            echo "P8V6_RETRY=R2"
            echo "P8V6_R1_RUN_ID=$P8V6_R1_RUN_ID"
            echo "P8V6_R1_FAILURE=$P8V6_R1_FAILURE"
            echo "P8V6_PARENT_P8V5_R2_RUN_ID=$P8V5_R2_RUN_ID"
            echo "P8V6_SOURCE_BASE=$EXPECTED_VENDOR_SHA"
            echo "P8V6_QCOM_DELTA_BASE=$QCOM_5_4_268_BASE"
            echo "P8V6_QCOM_DELTA_MERGE=$QCOM_5_4_274_MERGE"
            echo "P8V6_MANUAL_CONFLICT_RESOLUTION_PERFORMED=NO"
            echo "P8V6_EXTERNAL_RESUKISU_RESTORE=NO"
            echo "P8V6_SUSFS_RESTORE=NO"
            echo "P8V6_HAND_WRITTEN_SOURCE_FIX=NO"
            echo "P8V6_DEFCONFIG_PATCH=NO"
            echo "P8V6_CRC_PATCH=NO"
            echo "P8V6_VERMAGIC_PATCH=NO"
            echo "P8V6_FORCE_LOAD_ENABLED=NO"
            echo "P8V6_BOOT_IMAGE_CREATED=NO"
            echo "P8V6_FLASHABLE_ZIP_CREATED=NO"
            echo "P8V6_DEVICE_ACCESSED=NO"
            echo "P8V6_FLASHING_PERFORMED=NO"
            echo "P8V6_FULL_17647_IMPORT_CONTRACT_PROVEN=NO"
            echo "P8V6_DEVICE_BOOT_FAILURE_PROVEN=NO"
            echo "P8V6_DEVICE_COMPATIBILITY_PROVEN=NO"
            echo "P8V6_KERNEL_CHANGE_AUTHORIZED=NO"
            echo "P8V6_P9_RELEASE_AUTHORIZED=NO"
            echo "P8V6_NEXT_GATE=$next_gate"
          } > "$ARTIFACT_DIR/P8V6-RESULT.txt"

          python3 - \
            "$ARTIFACT_DIR/P8V6-RESULT.txt" \
            "$ARTIFACT_DIR/P8V6-RESULT.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          source, output = map(Path, sys.argv[1:])
          values = {}
          for line in source.read_text(encoding="utf-8").splitlines():
              if "=" not in line:
                  continue
              key, value = line.split("=", 1)
              values[key] = value

          result = {
              "stage": "CLEAN_GEN1_P8_V6_QCOM_SOURCE_PROVENANCE_DELTA_REPLAY",
              "result": values["P8V6_RESULT"],
              "source_base": values["P8V6_SOURCE_BASE"],
              "qcom_delta_base": values["P8V6_QCOM_DELTA_BASE"],
              "qcom_delta_merge": values["P8V6_QCOM_DELTA_MERGE"],
              "scope": {
                  "target_region_count": 8,
                  "eea_included": False,
                  "known_failure_pair_retest_maximum": 10707,
                  "full_17647_import_contract_proven": False,
              },
              "safety": {
                  "manual_conflict_resolution_performed": False,
                  "external_resukisu_restore": False,
                  "susfs_restore": False,
                  "hand_written_source_fix": False,
                  "defconfig_patch": False,
                  "crc_patch": False,
                  "vermagic_patch": False,
                  "force_load_enabled": False,
                  "boot_image_created": False,
                  "flashable_zip_created": False,
                  "device_accessed": False,
                  "flashing_performed": False,
                  "device_boot_failure_proven": False,
                  "device_compatibility_proven": False,
                  "kernel_change_authorized": False,
                  "p9_release_authorized": False,
              },
              "next_gate": values["P8V6_NEXT_GATE"],
          }
          output.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Close immutable P8-v6 evidence package
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$ARTIFACT_DIR"

          {
            echo "JOB_STATUS=${{ job.status }}"
            echo "P8V6_RETRY=R2"
            echo "P8V6_R1_RUN_ID=$P8V6_R1_RUN_ID"
            echo "P8V6_R1_FAILURE=$P8V6_R1_FAILURE"
            echo "P8V6_TARGET_REGION_COUNT=8"
            echo "P8V6_TARGET_REGION_IDS=$TARGET_REGION_IDS"
            echo "P8V6_EEA_INCLUDED=NO"
            echo "P8V6_PARENT_P8V5_R2_RUN_ID=$P8V5_R2_RUN_ID"
            echo "P8V6_PARENT_P8V4_RUN_ID=$P8V4_RUN_ID"
            echo "P8V6_PARENT_P8V3_R4_RUN_ID=$P8V3_R4_RUN_ID"
            echo "P8V6_SOURCE_BASE=$EXPECTED_VENDOR_SHA"
            echo "P8V6_QCOM_DELTA_BASE=$QCOM_5_4_268_BASE"
            echo "P8V6_QCOM_DELTA_MERGE=$QCOM_5_4_274_MERGE"
            echo "P8V6_MANUAL_CONFLICT_RESOLUTION_PERFORMED=NO"
            echo "P8V6_EXTERNAL_RESUKISU_RESTORE=NO"
            echo "P8V6_SUSFS_RESTORE=NO"
            echo "P8V6_HAND_WRITTEN_SOURCE_FIX=NO"
            echo "P8V6_DEFCONFIG_PATCH=NO"
            echo "P8V6_CRC_PATCH=NO"
            echo "P8V6_VERMAGIC_PATCH=NO"
            echo "P8V6_FORCE_LOAD_ENABLED=NO"
            echo "P8V6_BOOT_IMAGE_CREATED=NO"
            echo "P8V6_FLASHABLE_ZIP_CREATED=NO"
            echo "P8V6_DEVICE_ACCESSED=NO"
            echo "P8V6_FLASHING_PERFORMED=NO"
            echo "P8V6_DEVICE_COMPATIBILITY_PROVEN=NO"
            echo "P8V6_KERNEL_CHANGE_AUTHORIZED=NO"
            echo "P8V6_P9_RELEASE_AUTHORIZED=NO"
          } > "$ARTIFACT_DIR/99-job-end-state.txt"

          (
            cd "$ARTIFACT_DIR" || exit 1
            find . -type f \
              ! -name 'FILES.txt' \
              ! -name 'SHA256SUMS' \
              ! -name 'SHA256SUMS.verify.txt' \
              -printf '%P\n' | sort > FILES.txt
            while IFS= read -r file; do
              sha256sum "$file"
            done < FILES.txt > SHA256SUMS
            sha256sum -c SHA256SUMS > SHA256SUMS.verify.txt
          )
          exit 0

      - name: Upload P8-v6 provenance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p8v6r2-veux-5.4.274-qcom-source-provenance-${{ github.run_id }}
          path: ${{ env.ARTIFACT_DIR }}/
          if-no-files-found: error
          retention-days: 90
