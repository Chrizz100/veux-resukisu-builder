name: 00 - GitHub Actions Runner Sanity Check v1

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Show runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "SANITY=STARTED"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          echo "GITHUB_RUN_NUMBER=$GITHUB_RUN_NUMBER"
          uname -a

      - name: Verify basic filesystem
        shell: bash
        run: |
          set -euo pipefail
          pwd
          df -h .
          test -d "$GITHUB_WORKSPACE"
          echo "FILESYSTEM=PASS"

      - name: Verify network basics
        shell: bash
        run: |
          set -euo pipefail
          git --version
          curl --version | head -n1
          python3 --version
          echo "BASIC_TOOLS=PASS"

      - name: Final sanity verdict
        shell: bash
        run: |
          set -euo pipefail
          echo "FINAL_RESULT=PASS_GITHUB_ACTIONS_RUNNER_SANITY"
