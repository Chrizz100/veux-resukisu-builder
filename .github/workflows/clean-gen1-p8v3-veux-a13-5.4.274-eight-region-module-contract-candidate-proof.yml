name: CLEAN GEN1 P8 v3 - VEUX A13 5.4.274 eight-region module contract candidate proof

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: clean-gen1-p8v3-veux-a13-5-4-274-eight-region-module-contract
  cancel-in-progress: false

env:
  TARGET_KERNEL_RELEASE: 5.4.274-qgki-g82179e362f33
  TARGET_KERNEL_VERSION: '5.4.274'
  TARGET_REGION_COUNT: '8'
  TARGET_REGION_IDS: china,global,india,indonesia,japan,russia,taiwan,turkey
  EXPECTED_P8V2_SHARED_ABI_SHA256: ee6a6230c9e17cb1b32cf187a3e85b4f1cba8f478ff225f9d0e1144ac809f9e5

  P6V10_V2_RUN_ID: '33603757875'
  P6V10_V2_ARTIFACT: clean-gen1-p6v10-stock-kernel-release-sucompat-p7-boot-v2-33603757875
  P6V10_V2_ARTIFACT_DIGEST: 83de3f4ba5f58cf99c25ed2107b4ee3a2114c99ba6a03be973bcdfee6ab2b85b

  P8V2_R2_RUN_ID: '33676494739'
  P8V2_R2_MATRIX_ARTIFACT: clean-gen1-p8v2r2-veux-a13-module-abi-matrix-33676494739

  VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
  VENDOR_TAG: '20240619'
  EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
  CLANG_PREBUILT_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e

  KBUILD_BUILD_USER: builder
  KBUILD_BUILD_HOST: pangu-build-component-vendor-345942-54r9t-tw0tk-tq90c
  KBUILD_BUILD_TIMESTAMP: Thu Dec 5 14:47:59 UTC 2024
  KBUILD_BUILD_VERSION: '1'
  SOURCE_DATE_EPOCH: '1733410079'
  KBUILD_FIXED_SCM_SUFFIX: -g82179e362f33
  P8V3_EFFECTIVE_KCFLAGS: -D__ANDROID_COMMON_KERNEL__

  TRACKER_REPO: https://github.com/XiaomiFirmwareUpdater/miui-updates-tracker.git
  TRACKER_COMMIT: c9d55af855fa504a199daf4e41da58c538d326b0

  GLOBAL_ROM_CODENAME: veux_global
  GLOBAL_ROM_VERSION: OS1.0.12.0.TKCMIXM
  GLOBAL_ROM_ANDROID: '13.0'
  GLOBAL_ROM_MD5: cda1240a451dd4f75776878b52f0cea3
  GLOBAL_ROM_URL: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.12.0.TKCMIXM/veux_global_images_OS1.0.12.0.TKCMIXM_20241205.0000.00_13.0_global_cda1240a45.tgz

  LPUNPACK_REPO: unix3dgforce/lpunpack
  LPUNPACK_COMMIT: c59b8f3b069c5a8aa438a049fa4a091177172434
  LPUNPACK_PY_BLOB: 9671d1d731d28f04f0d65dad0dacb2110da87029

jobs:
  candidate-build:
    name: Build deterministic 5.4.274 module-contract candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel
      P6_DIR: ${{ github.workspace }}/p6v10-v2
      OUT_DIR: ${{ github.workspace }}/kernel/out-p8v3
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      ARTIFACT_DIR: ${{ github.workspace }}/p8v3-candidate

    steps:
      - name: Initialize P8-v3 candidate proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ARTIFACT_DIR" "$OUT_DIR" "$TOOLCHAIN_DIR"
          mkdir -p "$ARTIFACT_DIR" "$TOOLCHAIN_DIR"

          cat > "$ARTIFACT_DIR/00-plan.txt" <<'EOF'
          CLEAN GEN1 P8-v3 - VEUX Android 13 / Linux 5.4.274 eight-region module-contract candidate proof

          Target regions only:
          - Global
          - China
          - India
          - Indonesia
          - Japan
          - Russia
          - Taiwan
          - Turkey

          EEA policy:
          - EEA is outside the target set and is not a release blocker for this path.
          - No 5.4.289 compatibility claim is made.

          Proven parent evidence:
          - P6-v10-v2 supplies the exact accepted GEN1 source-restore kit.
          - P8-v2 r2 proved all eight target regions share stock release
            5.4.274-qgki-g82179e362f33 and one common module-ABI fingerprint.
          - P8-v2 r2 also proved that the unchanged P6-v10-v2 candidate had
            CONFIG_MODULES=n and could not service declared stock module-load paths.

          Candidate delta:
          - restore exact P6-v10-v2 source;
          - change only arch/arm64/configs/veux_defconfig;
          - enable CONFIG_MODULES=y;
          - enable CONFIG_MODVERSIONS=y;
          - enable CONFIG_MODULE_UNLOAD=y;
          - keep CONFIG_MODULE_FORCE_LOAD=n;
          - keep CONFIG_MODULE_FORCE_UNLOAD=n;
          - keep CONFIG_MODULE_SIG=n.

          Proof model:
          - clean deterministic Build A and Build B at the same output path;
          - require Image, dtbs, modules, vmlinux and Module.symvers;
          - require Build A/B Module.symvers identity;
          - later compare stock module required CRCs against candidate vmlinux CRCs.

          Explicit exclusions:
          - NO boot.img creation or repack;
          - NO AnyKernel3/flashable ZIP;
          - NO device access;
          - NO flashing;
          - NO device boot-success claim;
          - NO P9 release authorization in this workflow.
          EOF

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl flex git jq \
            kmod libelf-dev libncurses-dev libssl-dev patch python3 rsync \
            unzip xz-utils zstd

      - name: Checkout exact VEUX vendor source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.VENDOR_REPO }}
          ref: ${{ env.VENDOR_TAG }}
          path: kernel
          fetch-depth: 1
          persist-credentials: false

      - name: Download accepted P6-v10-v2 source proof
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.P6V10_V2_ARTIFACT }}
          path: ${{ env.P6_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ env.P6V10_V2_RUN_ID }}

      - name: Authenticate P6-v10-v2 and restore exact accepted source
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
          test -z "$(git status --porcelain)"

          test -s "$P6_DIR/ARTIFACT-SHA256SUMS"
          (
            cd "$P6_DIR"
            sha256sum -c ARTIFACT-SHA256SUMS
          ) > "$ARTIFACT_DIR/01-p6-artifact-sha256.txt"

          restore="$P6_DIR/source-restore-kit"
          test -s "$restore/manifest.json"
          test -s "$restore/SHA256SUMS"
          test -s "$restore/p5i-to-p6-source-compat.patch"
          test -s "$restore/p5i/vendor-20240619-to-p5i-outer.patch"
          test -s "$restore/p5i/resukisu-p5i-full.bundle"
          (
            cd "$restore"
            sha256sum -c SHA256SUMS
          ) > "$ARTIFACT_DIR/01-p6-restore-kit-sha256.txt"
          (
            cd "$restore/p5i"
            sha256sum -c SHA256SUMS
          ) > "$ARTIFACT_DIR/01-p5i-restore-kit-sha256.txt"

          python3 - "$restore/manifest.json" "$ARTIFACT_DIR/01-p6-manifest-auth.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])
          m = json.loads(src.read_text(encoding="utf-8"))

          required = {
              "stage": "CLEAN_GEN1_P6_SOURCE",
              "parent_stage": "CLEAN_GEN1_P5I",
              "hook_mode": "native_kconfig_susfs",
              "manual_hook_enabled": False,
              "susfs_enabled": True,
              "native_inline_hook_count": 7,
              "forced_ksu_config_cpp_macros": False,
              "module_load_filter_included": False,
              "boot_image_created": False,
              "flashing_performed": False,
          }
          for key, expected in required.items():
              if m.get(key) != expected:
                  raise SystemExit(f"P6 manifest mismatch {key}: {m.get(key)!r} != {expected!r}")

          stock = m.get("verified_stock_identity") or {}
          if stock.get("kernel_release") != "5.4.274-qgki-g82179e362f33":
              raise SystemExit("P6 manifest stock release mismatch")
          if stock.get("config_localversion") != "-qgki":
              raise SystemExit("P6 manifest localversion mismatch")
          if stock.get("scm_suffix") != "-g82179e362f33":
              raise SystemExit("P6 manifest SCM suffix mismatch")

          for key in ("p5i_tree", "p6_source_tree", "resukisu_head", "resukisu_tree"):
              value = m.get(key)
              if not isinstance(value, str) or len(value) != 40:
                  raise SystemExit(f"P6 manifest invalid {key}: {value!r}")

          dst.write_text(json.dumps(m, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          with Path("/tmp/p8v3-p6-env").open("w", encoding="utf-8") as handle:
              for key in ("p5i_tree", "p6_source_tree", "resukisu_head", "resukisu_tree"):
                  env_name = "RESTORE_" + key.upper()
                  handle.write(f"{env_name}={m[key]}\n")
          PY

          cat /tmp/p8v3-p6-env >> "$GITHUB_ENV"
          # shellcheck disable=SC1091
          source /tmp/p8v3-p6-env

          git apply --check --binary "$restore/p5i/vendor-20240619-to-p5i-outer.patch"
          git apply --index --binary "$restore/p5i/vendor-20240619-to-p5i-outer.patch"
          test "$(git write-tree)" = "$RESTORE_P5I_TREE"

          git apply --check --binary "$restore/p5i-to-p6-source-compat.patch"
          git apply --index --binary "$restore/p5i-to-p6-source-compat.patch"
          test "$(git write-tree)" = "$RESTORE_P6_SOURCE_TREE"

          GIT_AUTHOR_NAME="CLEAN-GEN1 P8-v3 restore" \
          GIT_AUTHOR_EMAIL="clean-gen1@invalid.local" \
          GIT_AUTHOR_DATE="2026-09-02T00:00:00Z" \
          GIT_COMMITTER_NAME="CLEAN-GEN1 P8-v3 restore" \
          GIT_COMMITTER_EMAIL="clean-gen1@invalid.local" \
          GIT_COMMITTER_DATE="2026-09-02T00:00:00Z" \
            git commit -m "CLEAN GEN1 P8-v3 restore accepted P6-v10-v2 source"

          test "$(git rev-parse HEAD^{tree})" = "$RESTORE_P6_SOURCE_TREE"
          test -z "$(git status --porcelain)"

          rm -rf KernelSU
          git init KernelSU >/dev/null
          git -C KernelSU fetch \
            "$restore/p5i/resukisu-p5i-full.bundle" \
            refs/heads/clean-gen1-p5i-resukisu:refs/heads/clean-gen1-p5i-resukisu
          git -C KernelSU checkout --detach refs/heads/clean-gen1-p5i-resukisu >/dev/null

          test "$(git -C KernelSU rev-parse HEAD)" = "$RESTORE_RESUKISU_HEAD"
          test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$RESTORE_RESUKISU_TREE"
          test -z "$(git -C KernelSU status --porcelain)"

          mkdir -p .git/info
          touch .git/info/exclude
          grep -Fxq '/KernelSU/' .git/info/exclude || echo '/KernelSU/' >> .git/info/exclude
          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
          test -z "$(git status --porcelain)"

          {
            echo "P8V3_P6_PARENT_AUTH=PASS"
            echo "P8V3_PARENT_P6_RUN_ID=$P6V10_V2_RUN_ID"
            echo "P8V3_RESTORED_P6_TREE=$RESTORE_P6_SOURCE_TREE"
            echo "P8V3_RESTORED_RESUKISU_HEAD=$RESTORE_RESUKISU_HEAD"
            echo "P8V3_PARENT_MODULE_LOAD_FILTER_INCLUDED=NO"
          } > "$ARTIFACT_DIR/01-source-restore.txt"

      - name: Apply only the proven stock module-contract delta
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD^{tree})" = "$RESTORE_P6_SOURCE_TREE"
          test -z "$(git status --porcelain)"

          cfg=arch/arm64/configs/veux_defconfig
          cp "$cfg" "$ARTIFACT_DIR/02-parent-veux_defconfig"

          grep -Fxq 'CONFIG_KSU_SUSFS=y' "$cfg"
          grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' "$cfg"
          grep -Fxq 'CONFIG_LOCALVERSION="-qgki"' "$cfg"

          if grep -Fxq 'CONFIG_MODULES=y' "$cfg"; then
            echo "::error::Parent P6 source unexpectedly already has CONFIG_MODULES=y"
            exit 20
          fi

          scripts/config --file "$cfg" \
            --enable MODULES \
            --enable MODVERSIONS \
            --enable MODULE_UNLOAD \
            --disable MODULE_FORCE_LOAD \
            --disable MODULE_FORCE_UNLOAD \
            --disable MODULE_SIG

          grep -Fxq 'CONFIG_MODULES=y' "$cfg"
          grep -Fxq 'CONFIG_MODVERSIONS=y' "$cfg"
          grep -Fxq 'CONFIG_MODULE_UNLOAD=y' "$cfg"
          grep -Fxq '# CONFIG_MODULE_FORCE_LOAD is not set' "$cfg"
          grep -Fxq '# CONFIG_MODULE_FORCE_UNLOAD is not set' "$cfg"
          grep -Fxq '# CONFIG_MODULE_SIG is not set' "$cfg"

          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "arch/arm64/configs/veux_defconfig"

          git diff -- "$cfg" > "$ARTIFACT_DIR/02-module-contract-delta.patch"
          test -s "$ARTIFACT_DIR/02-module-contract-delta.patch"

          git add "$cfg"
          git diff --cached --check
          candidate_tree="$(git write-tree)"
          test "$candidate_tree" != "$RESTORE_P6_SOURCE_TREE"

          GIT_AUTHOR_NAME="CLEAN-GEN1 P8-v3 module contract" \
          GIT_AUTHOR_EMAIL="clean-gen1@invalid.local" \
          GIT_AUTHOR_DATE="2026-09-02T00:00:01Z" \
          GIT_COMMITTER_NAME="CLEAN-GEN1 P8-v3 module contract" \
          GIT_COMMITTER_EMAIL="clean-gen1@invalid.local" \
          GIT_COMMITTER_DATE="2026-09-02T00:00:01Z" \
            git commit -m "CLEAN GEN1 P8-v3 enable proven stock module contract"

          test "$(git rev-parse HEAD^{tree})" = "$candidate_tree"
          test -z "$(git status --porcelain)"
          echo "P8V3_CANDIDATE_SOURCE_TREE=$candidate_tree" >> "$GITHUB_ENV"

          {
            echo "P8V3_SOURCE_DELTA_FILE_COUNT=1"
            echo "P8V3_SOURCE_DELTA_FILE=arch/arm64/configs/veux_defconfig"
            echo "P8V3_CONFIG_MODULES=Y"
            echo "P8V3_CONFIG_MODVERSIONS=Y"
            echo "P8V3_CONFIG_MODULE_UNLOAD=Y"
            echo "P8V3_CONFIG_MODULE_FORCE_LOAD=N"
            echo "P8V3_CONFIG_MODULE_FORCE_UNLOAD=N"
            echo "P8V3_CONFIG_MODULE_SIG=N"
            echo "P8V3_OTHER_SOURCE_FILES_CHANGED=NO"
          } > "$ARTIFACT_DIR/02-module-contract-delta.txt"

      - name: Install pinned Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail
          url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 "$url" \
            -o "$RUNNER_TEMP/clang-r416183b.tar.gz"

          sha256sum "$RUNNER_TEMP/clang-r416183b.tar.gz" \
            > "$ARTIFACT_DIR/03-clang-archive.sha256"
          tar -xzf "$RUNNER_TEMP/clang-r416183b.tar.gz" -C "$TOOLCHAIN_DIR"

          "$TOOLCHAIN_DIR/bin/clang" --version > "$ARTIFACT_DIR/03-clang-version.txt"
          "$TOOLCHAIN_DIR/bin/ld.lld" --version >> "$ARTIFACT_DIR/03-clang-version.txt"
          grep -Fq 'r416183b' "$ARTIFACT_DIR/03-clang-version.txt"

          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-size llvm-strip; do
            test -x "$TOOLCHAIN_DIR/bin/$tool"
          done

      - name: Clean deterministic Build A with modules
        shell: bash
        working-directory: kernel
        timeout-minutes: 110
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          test "$(git rev-parse HEAD^{tree})" = "$P8V3_CANDIDATE_SOURCE_TREE"
          test -z "$(git status --porcelain)"
          test "$(git -C KernelSU rev-parse HEAD)" = "$RESTORE_RESUKISU_HEAD"
          test ! -e KernelSU/kernel/feature/module_load_filter.c

          rm -rf "$OUT_DIR"
          make O="$OUT_DIR" \
            ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            veux_defconfig \
            2>&1 | tee "$ARTIFACT_DIR/04-build-a-config.log"

          for required in \
            'CONFIG_MODULES=y' \
            'CONFIG_MODVERSIONS=y' \
            'CONFIG_MODULE_UNLOAD=y' \
            '# CONFIG_MODULE_FORCE_LOAD is not set' \
            '# CONFIG_MODULE_FORCE_UNLOAD is not set' \
            '# CONFIG_MODULE_SIG is not set' \
            'CONFIG_KSU_SUSFS=y' \
            '# CONFIG_KSU_MANUAL_HOOK is not set' \
            'CONFIG_LOCALVERSION="-qgki"' \
            'CONFIG_LOCALVERSION_AUTO=y'
          do
            grep -Fxq "$required" "$OUT_DIR/.config"
          done

          release="$(
            make -s O="$OUT_DIR" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 kernelrelease
          )"
          test "$release" = "$TARGET_KERNEL_RELEASE"
          [[ "$release" != *%* ]]
          printf '%s\n' "$release" > "$ARTIFACT_DIR/04-kernelrelease.txt"

          cp "$OUT_DIR/.config" "$ARTIFACT_DIR/04-build-a.config"

          make -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            KCFLAGS="$P8V3_EFFECTIVE_KCFLAGS" \
            Image dtbs modules \
            2>&1 | tee "$ARTIFACT_DIR/04-build-a.log"

          grep -Fq -- '-- ReSukiSU: using SuSFS Inline hook' "$ARTIFACT_DIR/04-build-a.log"
          ! grep -Fq -- '-- ReSukiSU: using Manual Hook' "$ARTIFACT_DIR/04-build-a.log"

          test -s "$OUT_DIR/arch/arm64/boot/Image"
          test -s "$OUT_DIR/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"
          test -s "$OUT_DIR/vmlinux"
          test -s "$OUT_DIR/System.map"
          test -s "$OUT_DIR/Module.symvers"

          mkdir -p "$ARTIFACT_DIR/build-a"
          cp "$OUT_DIR/arch/arm64/boot/Image" "$ARTIFACT_DIR/build-a/Image"
          cp "$OUT_DIR/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb" "$ARTIFACT_DIR/build-a/veux.dtb"
          cp "$OUT_DIR/.config" "$ARTIFACT_DIR/build-a/veux-5.4.274.module-contract.config"
          cp "$OUT_DIR/Module.symvers" "$ARTIFACT_DIR/build-a/Module.symvers"

          find "$OUT_DIR" -type f -name '*.ko' -print0 | sort -z \
            | xargs -0 -r sha256sum > "$ARTIFACT_DIR/04-build-a-modules.sha256"

          sha256sum \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$OUT_DIR/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb" \
            "$OUT_DIR/vmlinux" \
            "$OUT_DIR/System.map" \
            "$OUT_DIR/.config" \
            "$OUT_DIR/Module.symvers" \
            > "$ARTIFACT_DIR/04-build-a-core.sha256"

          python3 - "$OUT_DIR/Module.symvers" "$ARTIFACT_DIR/04-build-a-symvers.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          out = Path(sys.argv[2])

          total = 0
          vmlinux = {}
          module_providers = {}
          for number, raw in enumerate(path.read_text(encoding="utf-8", errors="strict").splitlines(), 1):
              if not raw.strip():
                  continue
              fields = raw.split()
              if len(fields) < 3:
                  raise SystemExit(f"bad Module.symvers line {number}: {raw!r}")
              crc, symbol, provider = fields[:3]
              try:
                  normalized = f"0x{int(crc, 16):08x}"
              except ValueError:
                  raise SystemExit(f"bad CRC line {number}: {crc!r}")
              total += 1
              target = vmlinux if provider == "vmlinux" else module_providers
              if symbol in target and target[symbol] != normalized:
                  raise SystemExit(f"conflicting candidate CRC for {symbol}")
              target[symbol] = normalized

          if total < 1000:
              raise SystemExit(f"suspiciously small Module.symvers: {total}")
          if len(vmlinux) < 500:
              raise SystemExit(f"suspiciously small vmlinux export set: {len(vmlinux)}")
          if "module_layout" not in vmlinux:
              raise SystemExit("candidate Module.symvers lacks vmlinux module_layout CRC")

          result = {
              "total_entries": total,
              "vmlinux_export_count": len(vmlinux),
              "module_provider_symbol_count": len(module_providers),
              "module_layout_crc": vmlinux["module_layout"],
          }
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          {
            echo "P8V3_BUILD_A=PASS"
            echo "P8V3_BUILD_A_MODULES_TARGET=PASS"
            echo "P8V3_BUILD_A_MODULE_SYMVERS=PASS"
            echo "P8V3_KERNEL_RELEASE=$TARGET_KERNEL_RELEASE"
          } > "$ARTIFACT_DIR/04-build-a-state.txt"

      - name: Clean deterministic Build B and prove Module.symvers reproducibility
        shell: bash
        working-directory: kernel
        timeout-minutes: 110
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          test "$(git rev-parse HEAD^{tree})" = "$P8V3_CANDIDATE_SOURCE_TREE"
          test -z "$(git status --porcelain)"

          rm -rf "$OUT_DIR"
          make O="$OUT_DIR" \
            ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            veux_defconfig \
            2>&1 | tee "$ARTIFACT_DIR/05-build-b-config.log"

          cmp -s "$OUT_DIR/.config" "$ARTIFACT_DIR/04-build-a.config"
          test "$(
            make -s O="$OUT_DIR" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 kernelrelease
          )" = "$TARGET_KERNEL_RELEASE"

          make -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            KCFLAGS="$P8V3_EFFECTIVE_KCFLAGS" \
            Image dtbs modules \
            2>&1 | tee "$ARTIFACT_DIR/05-build-b.log"

          grep -Fq -- '-- ReSukiSU: using SuSFS Inline hook' "$ARTIFACT_DIR/05-build-b.log"
          ! grep -Fq -- '-- ReSukiSU: using Manual Hook' "$ARTIFACT_DIR/05-build-b.log"

          test -s "$OUT_DIR/Module.symvers"
          cmp -s "$OUT_DIR/Module.symvers" "$ARTIFACT_DIR/build-a/Module.symvers"
          cmp -s "$OUT_DIR/.config" "$ARTIFACT_DIR/build-a/veux-5.4.274.module-contract.config"
          cmp -s "$OUT_DIR/arch/arm64/boot/Image" "$ARTIFACT_DIR/build-a/Image"
          cmp -s "$OUT_DIR/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb" "$ARTIFACT_DIR/build-a/veux.dtb"

          sha256sum "$OUT_DIR/Module.symvers" > "$ARTIFACT_DIR/05-build-b-Module.symvers.sha256"
          sha256sum "$ARTIFACT_DIR/build-a/Module.symvers" > "$ARTIFACT_DIR/05-build-a-Module.symvers.sha256"

          {
            echo "P8V3_BUILD_B=PASS"
            echo "P8V3_IMAGE_REPRODUCIBLE=YES"
            echo "P8V3_VEUX_DTB_REPRODUCIBLE=YES"
            echo "P8V3_CONFIG_REPRODUCIBLE=YES"
            echo "P8V3_MODULE_SYMVERS_REPRODUCIBLE=YES"
            echo "P8V3_BOOT_IMAGE_CREATED=NO"
            echo "P8V3_FLASHABLE_ZIP_CREATED=NO"
            echo "P8V3_DEVICE_ACCESSED=NO"
            echo "P8V3_FLASHING_PERFORMED=NO"
          } > "$ARTIFACT_DIR/05-build-b-state.txt"

      - name: Close candidate artifact
        shell: bash
        run: |
          set -euo pipefail

          cat > "$ARTIFACT_DIR/P8V3-CANDIDATE-RESULT.txt" <<EOF
          CLEAN_GEN1_P8_V3_CANDIDATE_BUILD=PASS
          TARGET_KERNEL_RELEASE=$TARGET_KERNEL_RELEASE
          TARGET_REGION_COUNT=$TARGET_REGION_COUNT
          TARGET_REGION_IDS=$TARGET_REGION_IDS
          EEA_INCLUDED=NO
          P6_PARENT_RUN_ID=$P6V10_V2_RUN_ID
          P8V2_PARENT_RUN_ID=$P8V2_R2_RUN_ID
          SOURCE_DELTA_FILE_COUNT=1
          SOURCE_DELTA_FILE=arch/arm64/configs/veux_defconfig
          CONFIG_MODULES=Y
          CONFIG_MODVERSIONS=Y
          CONFIG_MODULE_UNLOAD=Y
          CONFIG_MODULE_FORCE_LOAD=N
          CONFIG_MODULE_FORCE_UNLOAD=N
          CONFIG_MODULE_SIG=N
          MODULE_SYMVERS_REPRODUCIBLE=YES
          BOOT_IMAGE_CREATED=NO
          FLASHABLE_ZIP_CREATED=NO
          DEVICE_ACCESSED=NO
          FLASHING_PERFORMED=NO
          DEVICE_COMPATIBILITY_PROVEN=NO
          P9_RELEASE_AUTHORIZED=NO
          NEXT_GATE=P8V3_GLOBAL_STOCK_SYMBOL_CRC_PROOF
          EOF

          (
            cd "$ARTIFACT_DIR"
            find . -type f \
              ! -name 'FILES.txt' \
              ! -name 'SHA256SUMS' \
              ! -name 'SHA256SUMS.verify.txt' \
              -printf '%P\n' | sort > FILES.txt
            while IFS= read -r file; do sha256sum "$file"; done < FILES.txt > SHA256SUMS
            sha256sum -c SHA256SUMS > SHA256SUMS.verify.txt
          )

      - name: Upload P8-v3 candidate
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p8v3-veux-5.4.274-module-contract-candidate-${{ github.run_id }}
          path: ${{ env.ARTIFACT_DIR }}/
          if-no-files-found: error
          retention-days: 90

  global-stock-crc-proof:
    name: Global representative stock symbol CRC proof
    needs: candidate-build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      WORK_DIR: ${{ github.workspace }}/p8v3-crc
      CANDIDATE_DIR: ${{ github.workspace }}/p8v3-crc/candidate
      P8_DIR: ${{ github.workspace }}/p8v3-crc/p8v2
      ROM_DIR: ${{ github.workspace }}/p8v3-crc/rom
      LOGICAL_DIR: ${{ github.workspace }}/p8v3-crc/logical
      RAMDISK_DIR: ${{ github.workspace }}/p8v3-crc/vendor-ramdisks
      MOUNT_DIR: ${{ github.workspace }}/p8v3-crc/mounts
      ROOTS_TSV: ${{ github.workspace }}/p8v3-crc/roots.tsv
      OUTPUT_DIR: ${{ github.workspace }}/p8v3-crc/output

    steps:
      - name: Initialize CRC proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR"
          mkdir -p \
            "$CANDIDATE_DIR" "$P8_DIR" "$ROM_DIR" "$LOGICAL_DIR" \
            "$RAMDISK_DIR/fragments" "$RAMDISK_DIR/roots" \
            "$MOUNT_DIR" "$OUTPUT_DIR"
          : > "$ROOTS_TSV"

      - name: Download P8-v3 candidate
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v3-veux-5.4.274-module-contract-candidate-${{ github.run_id }}
          path: ${{ env.CANDIDATE_DIR }}

      - name: Download P8-v2 r2 aggregate matrix
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.P8V2_R2_MATRIX_ARTIFACT }}
          path: ${{ env.P8_DIR }}/matrix
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 Global evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-global-33676494739
          path: ${{ env.P8_DIR }}/global
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 China evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-china-33676494739
          path: ${{ env.P8_DIR }}/china
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 India evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-india-33676494739
          path: ${{ env.P8_DIR }}/india
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 Indonesia evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-indonesia-33676494739
          path: ${{ env.P8_DIR }}/indonesia
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 Japan evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-japan-33676494739
          path: ${{ env.P8_DIR }}/japan
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 Russia evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-russia-33676494739
          path: ${{ env.P8_DIR }}/russia
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 Taiwan evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-taiwan-33676494739
          path: ${{ env.P8_DIR }}/taiwan
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 Turkey evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-turkey-33676494739
          path: ${{ env.P8_DIR }}/turkey
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Authenticate eight-region P8-v2 r2 family proof
        shell: bash
        run: |
          set -euo pipefail

          for region in china global india indonesia japan russia taiwan turkey; do
            dir="$P8_DIR/$region"
            test -s "$dir/SHA256SUMS"
            (
              cd "$dir"
              sha256sum -c SHA256SUMS
            ) > "$OUTPUT_DIR/01-${region}-p8v2-sha256.txt"
          done

          test -s "$P8_DIR/matrix/SHA256SUMS"
          (
            cd "$P8_DIR/matrix"
            sha256sum -c SHA256SUMS
          ) > "$OUTPUT_DIR/01-matrix-sha256.txt"

          python3 - "$P8_DIR" "$OUTPUT_DIR/01-eight-region-family.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          out = Path(sys.argv[2])
          target = {"china", "global", "india", "indonesia", "japan", "russia", "taiwan", "turkey"}
          release = "5.4.274-qgki-g82179e362f33"
          abi = "ee6a6230c9e17cb1b32cf187a3e85b4f1cba8f478ff225f9d0e1144ac809f9e5"

          matrix = json.loads(
              (root / "matrix" / "P8V2-MODULE-ABI-MATRIX.json").read_text(encoding="utf-8")
          )
          release_group = set(matrix["groups"]["stock_kernel_release"].get(release, []))
          abi_group = set(matrix["groups"]["module_abi_fingerprint"].get(abi, []))
          if release_group != target:
              raise SystemExit(f"P8-v2 5.4.274 region set mismatch: {sorted(release_group)}")
          if abi_group != target:
              raise SystemExit(f"P8-v2 shared ABI region set mismatch: {sorted(abi_group)}")

          docs = {}
          direct_commands = set()
          for region in sorted(target):
              doc = json.loads(
                  (root / region / "region-module-abi.json").read_text(encoding="utf-8")
              )
              if doc["region"]["id"] != region:
                  raise SystemExit(f"region evidence identity mismatch: {region}")
              if doc["stock"]["kernel_release"] != release:
                  raise SystemExit(f"stock release mismatch: {region}")
              if doc["module_inventory"]["module_abi_set_sha256"] != abi:
                  raise SystemExit(f"module ABI fingerprint mismatch: {region}")
              if doc["module_inventory"]["module_file_count"] != 284:
                  raise SystemExit(f"unexpected P8-v2 module count: {region}")
              if doc["module_inventory"]["modules_with___versions"] != 284:
                  raise SystemExit(f"missing __versions coverage: {region}")
              if doc["load_contract"]["modules_load_entry_count"] != 286:
                  raise SystemExit(f"unexpected modules.load entry count: {region}")
              if doc["load_contract"]["init_rc_module_command_count"] != 1:
                  raise SystemExit(f"unexpected direct module command count: {region}")
              if doc["assessment"]["classification"] != "DECLARED_MODULE_LOAD_CONTRACT_MISMATCH":
                  raise SystemExit(f"unexpected P8-v2 classification: {region}")

              commands = {
                  item["command"]
                  for item in doc["load_contract"]["rc_commands"]
              }
              direct_commands |= commands
              docs[region] = {
                  "rom_version": doc["region"]["version"],
                  "module_abi_set_sha256": doc["module_inventory"]["module_abi_set_sha256"],
                  "module_file_count": doc["module_inventory"]["module_file_count"],
                  "modules_load_entry_count": doc["load_contract"]["modules_load_entry_count"],
                  "direct_module_commands": sorted(commands),
              }

          expected_command = "insmod /system/lib/modules/pronto/pronto_wlan.ko con_mode=5"
          if direct_commands != {expected_command}:
              raise SystemExit(f"eight-region direct insmod contract differs: {sorted(direct_commands)}")

          result = {
              "stage": "P8V3_EIGHT_REGION_PARENT_PROOF",
              "target_regions": sorted(target),
              "target_region_count": len(target),
              "stock_kernel_release": release,
              "shared_p8v2_module_abi_sha256": abi,
              "p8v2_inventory_module_count_per_region": 284,
              "p8v2_modules_load_entries_per_region": 286,
              "shared_direct_insmod_command": expected_command,
              "regions": docs,
              "eea_included": False,
          }
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          {
            echo "P8V3_EIGHT_REGION_PARENT_PROOF=PASS"
            echo "TARGET_REGION_COUNT=8"
            echo "TARGET_REGION_IDS=$TARGET_REGION_IDS"
            echo "SHARED_STOCK_KERNEL_RELEASE=$TARGET_KERNEL_RELEASE"
            echo "SHARED_P8V2_ABI_SHA256=$EXPECTED_P8V2_SHARED_ABI_SHA256"
            echo "SHARED_DIRECT_INSMOD=/system/lib/modules/pronto/pronto_wlan.ko"
            echo "EEA_INCLUDED=NO"
          } > "$OUTPUT_DIR/01-eight-region-family.txt"

      - name: Authenticate P8-v3 candidate artifact
        shell: bash
        run: |
          set -euo pipefail

          test -s "$CANDIDATE_DIR/SHA256SUMS"
          (
            cd "$CANDIDATE_DIR"
            sha256sum -c SHA256SUMS
          ) > "$OUTPUT_DIR/02-candidate-sha256.txt"

          grep -Fxq 'CLEAN_GEN1_P8_V3_CANDIDATE_BUILD=PASS' \
            "$CANDIDATE_DIR/P8V3-CANDIDATE-RESULT.txt"
          grep -Fxq "TARGET_KERNEL_RELEASE=$TARGET_KERNEL_RELEASE" \
            "$CANDIDATE_DIR/P8V3-CANDIDATE-RESULT.txt"
          grep -Fxq 'SOURCE_DELTA_FILE_COUNT=1' \
            "$CANDIDATE_DIR/P8V3-CANDIDATE-RESULT.txt"
          grep -Fxq 'SOURCE_DELTA_FILE=arch/arm64/configs/veux_defconfig' \
            "$CANDIDATE_DIR/P8V3-CANDIDATE-RESULT.txt"
          grep -Fxq 'CONFIG_MODULES=Y' "$CANDIDATE_DIR/P8V3-CANDIDATE-RESULT.txt"
          grep -Fxq 'CONFIG_MODVERSIONS=Y' "$CANDIDATE_DIR/P8V3-CANDIDATE-RESULT.txt"
          grep -Fxq 'MODULE_SYMVERS_REPRODUCIBLE=YES' \
            "$CANDIDATE_DIR/P8V3-CANDIDATE-RESULT.txt"
          test -s "$CANDIDATE_DIR/build-a/Module.symvers"

      - name: Install stock-analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            android-sdk-libsparse-utils binutils ca-certificates cpio curl \
            e2fsprogs f2fs-tools file git gzip jq kmod lz4 python3 tar \
            util-linux xz-utils zstd

          command -v simg2img
          command -v modinfo
          command -v modprobe
          command -v readelf
          command -v blkid
          command -v cpio

      - name: Checkout pinned read-only lpunpack source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LPUNPACK_REPO }}
          ref: ${{ env.LPUNPACK_COMMIT }}
          path: lpunpack-tool
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate lpunpack and Global ROM catalog entry
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C "$GITHUB_WORKSPACE/lpunpack-tool" rev-parse HEAD)" = "$LPUNPACK_COMMIT"
          test "$(git hash-object "$GITHUB_WORKSPACE/lpunpack-tool/lpunpack.py")" = "$LPUNPACK_PY_BLOB"
          python3 -m py_compile "$GITHUB_WORKSPACE/lpunpack-tool/lpunpack.py"

          git init -q "$WORK_DIR/tracker"
          git -C "$WORK_DIR/tracker" remote add origin "$TRACKER_REPO"
          git -C "$WORK_DIR/tracker" fetch -q --depth=1 origin "$TRACKER_COMMIT"
          git -C "$WORK_DIR/tracker" checkout -q --detach FETCH_HEAD
          test "$(git -C "$WORK_DIR/tracker" rev-parse HEAD)" = "$TRACKER_COMMIT"

          python3 - \
            "$WORK_DIR/tracker/data/latest.yml" \
            "$GLOBAL_ROM_CODENAME" "$GLOBAL_ROM_VERSION" \
            "$GLOBAL_ROM_URL" "$GLOBAL_ROM_MD5" \
            "$OUTPUT_DIR/03-global-rom-input-auth.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          source, codename, version, url, md5, output = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          blocks = re.split(r"(?m)^- ", text)
          matches = []
          for raw in blocks:
              block = "- " + raw
              required = (
                  f"codename: {codename}\n",
                  f"version: {version}\n",
                  f"link: {url}\n",
                  f"md5: {md5}\n",
                  "method: Fastboot\n",
                  "branch: Stable\n",
                  "android: '13.0'\n",
              )
              if all(token in block for token in required):
                  matches.append(block)

          if len(matches) != 1:
              raise SystemExit(f"expected one pinned Global tracker entry, got {len(matches)}")

          Path(output).write_text(
              "P8V3_GLOBAL_ROM_INPUT_AUTH=PASS\n"
              f"ROM_CODENAME={codename}\n"
              f"ROM_VERSION={version}\n"
              f"ROM_MD5={md5}\n",
              encoding="utf-8",
          )
          PY

      - name: Stream Global ROM and extract vendor_boot plus super
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/p8v3-extract-global.py" <<'PY'
          import json
          import shutil
          import sys
          import tarfile
          from pathlib import Path

          out_dir = Path(sys.argv[1])
          manifest = Path(sys.argv[2])
          wanted = {"vendor_boot.img", "super.img"}
          found = {}

          with tarfile.open(fileobj=sys.stdin.buffer, mode="r|gz") as archive:
              for member in archive:
                  if not member.isfile():
                      continue
                  base = Path(member.name).name
                  if base not in wanted:
                      continue
                  if "/images/" not in "/" + member.name:
                      continue
                  if base in found:
                      raise SystemExit(f"duplicate ROM member {base}")
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"cannot read {member.name}")
                  target = out_dir / base
                  with target.open("wb") as handle:
                      shutil.copyfileobj(source, handle, length=8 * 1024 * 1024)
                  found[base] = {
                      "archive_member": member.name,
                      "bytes": target.stat().st_size,
                  }

          if set(found) != wanted:
              raise SystemExit(f"missing required ROM images: {sorted(wanted - set(found))}")

          manifest.write_text(
              json.dumps(found, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          fifo="$RUNNER_TEMP/p8v3-global-archive.fifo"
          rm -f "$fifo"
          mkfifo "$fifo"
          md5sum < "$fifo" > "$OUTPUT_DIR/04-global-rom-archive-md5.txt" &
          md5_pid=$!

          set +e
          curl \
            --fail --location --silent --show-error \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "$GLOBAL_ROM_URL" \
            | tee "$fifo" \
            | python3 "$RUNNER_TEMP/p8v3-extract-global.py" \
                "$ROM_DIR" "$OUTPUT_DIR/04-global-rom-members.json"
          status=("${PIPESTATUS[@]}")
          wait "$md5_pid"
          md5_rc=$?
          set -e

          rm -f "$fifo"
          test "${status[0]}" -eq 0
          test "${status[1]}" -eq 0
          test "${status[2]}" -eq 0
          test "$md5_rc" -eq 0
          test "$(awk '{print $1}' "$OUTPUT_DIR/04-global-rom-archive-md5.txt")" = "$GLOBAL_ROM_MD5"

      - name: Extract vendor ramdisks and module-bearing logical partitions
        shell: bash
        run: |
          set -euo pipefail

          cleanup_mounts() {
            set +e
            find "$MOUNT_DIR" -mindepth 1 -maxdepth 1 -type d -print0 2>/dev/null \
              | while IFS= read -r -d '' mnt; do
                  mountpoint -q "$mnt" && sudo umount "$mnt"
                done
          }
          trap cleanup_mounts EXIT

          python3 - "$ROM_DIR/vendor_boot.img" "$RAMDISK_DIR/fragments" "$OUTPUT_DIR/05-vendor-boot.json" <<'PY'
          import hashlib
          import json
          import struct
          import sys
          from pathlib import Path

          image_path = Path(sys.argv[1])
          out_dir = Path(sys.argv[2])
          output = Path(sys.argv[3])
          data = image_path.read_bytes()

          if data[:8] != b"VNDRBOOT":
              raise SystemExit("vendor_boot magic missing")

          u32 = lambda off: struct.unpack_from("<I", data, off)[0]
          version = u32(8)
          page_size = u32(12)
          total_ramdisk_size = u32(24)
          header_size = u32(2096)
          dtb_size = u32(2100)

          if version not in (3, 4):
              raise SystemExit(f"unsupported vendor_boot version {version}")
          align = lambda value: (value + page_size - 1) // page_size * page_size
          ramdisk_offset = align(header_size)
          if ramdisk_offset + total_ramdisk_size > len(data):
              raise SystemExit("vendor ramdisk outside image")
          aggregate = data[ramdisk_offset:ramdisk_offset + total_ramdisk_size]

          fragments = []
          if version == 4:
              table_size = u32(2112)
              entry_count = u32(2116)
              entry_size = u32(2120)
              table_offset = ramdisk_offset + align(total_ramdisk_size) + align(dtb_size)
              if entry_count and entry_size < 108:
                  raise SystemExit("unexpected vendor ramdisk entry size")
              for index in range(entry_count):
                  off = table_offset + index * entry_size
                  size, rel, rtype = struct.unpack_from("<III", data, off)
                  name = data[off + 12:off + 44].split(b"\0", 1)[0].decode("ascii", "replace")
                  if rel + size > len(aggregate):
                      raise SystemExit("vendor ramdisk fragment outside aggregate")
                  fragments.append((index, name or f"fragment-{index}", rtype, aggregate[rel:rel+size]))

          if not fragments:
              fragments = [(0, "vendor_ramdisk", None, aggregate)]

          manifest = []
          for index, name, rtype, blob in fragments:
              path = out_dir / f"ramdisk-{index:02d}.bin"
              path.write_bytes(blob)
              manifest.append({
                  "index": index,
                  "name": name,
                  "type": rtype,
                  "bytes": len(blob),
                  "sha256": hashlib.sha256(blob).hexdigest(),
              })

          output.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          unpack_fragment() {
            local src="$1"
            local root="$2"
            local cpio_file="$RUNNER_TEMP/$(basename "$src").cpio"
            local magic6 magic4

            rm -rf "$root"
            mkdir -p "$root"
            magic6="$(head -c 6 "$src" | xxd -p -c 32)"
            magic4="$(head -c 4 "$src" | xxd -p -c 32)"

            case "$magic6" in
              303730373031|303730373032)
                cp "$src" "$cpio_file"
                ;;
              *)
                case "$magic4" in
                  1f8b08*) gzip -dc "$src" > "$cpio_file" ;;
                  02214c18|04224d18) lz4 -dc "$src" > "$cpio_file" ;;
                  28b52ffd) zstd -dc "$src" > "$cpio_file" ;;
                  fd377a58) xz -dc "$src" > "$cpio_file" ;;
                  *)
                    echo "::error::unsupported vendor ramdisk compression: $(file -b "$src")"
                    return 1
                    ;;
                esac
                ;;
            esac

            test -s "$cpio_file"
            (
              cd "$root"
              cpio -idm --quiet --no-absolute-filenames < "$cpio_file"
            )
          }

          while IFS= read -r fragment; do
            root="$RAMDISK_DIR/roots/$(basename "$fragment" .bin)"
            unpack_fragment "$fragment" "$root"
            printf 'vendor_boot:%s\t%s\n' "$(basename "$fragment" .bin)" "$root" >> "$ROOTS_TSV"
          done < <(find "$RAMDISK_DIR/fragments" -type f -name 'ramdisk-*.bin' | sort)

          python_lpunpack="$GITHUB_WORKSPACE/lpunpack-tool/lpunpack.py"
          python3 "$python_lpunpack" --info -f json "$ROM_DIR/super.img" \
            > "$OUTPUT_DIR/05-super-info.raw.txt"

          python3 - "$OUTPUT_DIR/05-super-info.raw.txt" "$OUTPUT_DIR/05-selected-partitions.txt" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          start = raw.find("{")
          end = raw.rfind("}")
          if start < 0 or end <= start:
              raise SystemExit("lpunpack JSON metadata missing")
          data = json.loads(raw[start:end+1])
          partitions = data.get("partitions")
          if not isinstance(partitions, list):
              raise SystemExit("lpunpack partitions list missing")

          names = []
          for item in partitions:
              if not isinstance(item, dict):
                  continue
              name = item.get("name")
              if isinstance(name, str) and re.fullmatch(
                  r"(?:vendor|vendor_dlkm|system|system_dlkm|odm)(?:_[ab])?", name
              ):
                  names.append(name)

          names = sorted(set(names))
          if not any(name in {"vendor", "vendor_a", "vendor_b"} for name in names):
              raise SystemExit("vendor partition missing")
          if not any(name in {"system", "system_a", "system_b"} for name in names):
              raise SystemExit("system partition missing")

          Path(sys.argv[2]).write_text("\n".join(names) + "\n", encoding="utf-8")
          PY

          selected="$(paste -sd, "$OUTPUT_DIR/05-selected-partitions.txt")"
          python3 "$python_lpunpack" -p "$selected" "$ROM_DIR/super.img" "$LOGICAL_DIR"

          normalize_and_mount() {
            local img="$1"
            local label="$2"
            local normalized="$img"
            local fstype desc mnt="$MOUNT_DIR/$label"

            if [ ! -s "$img" ]; then
              printf '%s\tEMPTY_INACTIVE_SLOT\n' "$label" >> "$OUTPUT_DIR/05-partition-state.tsv"
              return 2
            fi

            desc="$(file -b "$img")"
            if grep -qi 'Android sparse image' <<<"$desc"; then
              normalized="$WORK_DIR/normalized-${label}.img"
              simg2img "$img" "$normalized"
            fi
            if [ ! -s "$normalized" ]; then
              printf '%s\tEMPTY_AFTER_UNSPARSE\n' "$label" >> "$OUTPUT_DIR/05-partition-state.tsv"
              return 2
            fi

            fstype="$(blkid -p -s TYPE -o value "$normalized" 2>/dev/null || true)"
            mkdir -p "$mnt"
            case "$fstype" in
              ext4) sudo mount -t ext4 -o loop,ro,noload "$normalized" "$mnt" ;;
              erofs) sudo mount -t erofs -o loop,ro "$normalized" "$mnt" ;;
              f2fs) sudo mount -t f2fs -o loop,ro "$normalized" "$mnt" ;;
              *)
                echo "::error::unsupported non-empty filesystem '$fstype': $img ($desc)"
                return 1
                ;;
            esac
            mountpoint -q "$mnt"
            printf 'partition:%s\t%s\n' "$label" "$mnt" >> "$ROOTS_TSV"
            printf '%s\tMOUNTED\t%s\n' "$label" "$fstype" >> "$OUTPUT_DIR/05-partition-state.tsv"
            return 0
          }

          : > "$OUTPUT_DIR/05-partition-state.tsv"
          mounted=0
          system_mounted=0
          vendor_mounted=0

          mapfile -t images < <(find "$LOGICAL_DIR" -maxdepth 1 -type f -name '*.img' -print | sort)
          test "${#images[@]}" -ge 1
          for img in "${images[@]}"; do
            base="$(basename "$img" .img)"
            set +e
            normalize_and_mount "$img" "$base"
            rc=$?
            set -e
            case "$rc" in
              0)
                mounted=$((mounted + 1))
                case "$base" in system|system_a|system_b) system_mounted=$((system_mounted + 1));; esac
                case "$base" in vendor|vendor_a|vendor_b) vendor_mounted=$((vendor_mounted + 1));; esac
                ;;
              2) ;;
              *) exit "$rc" ;;
            esac
          done

          test "$mounted" -ge 2
          test "$system_mounted" -ge 1
          test "$vendor_mounted" -ge 1
          test -s "$ROOTS_TSV"

          # Collector and CRC comparator execute while read-only mounts are alive.
          sudo -E python3 - \
            "$ROOTS_TSV" \
            "$P8_DIR/global/region-module-abi.json" \
            "$CANDIDATE_DIR/build-a/Module.symvers" \
            "$OUTPUT_DIR" <<'PY'
          import gzip
          import hashlib
          import json
          import lzma
          import os
          import posixpath
          import re
          import subprocess
          import sys
          import tempfile
          from collections import defaultdict
          from pathlib import Path

          roots_path = Path(sys.argv[1])
          parent_path = Path(sys.argv[2])
          candidate_symvers_path = Path(sys.argv[3])
          output = Path(sys.argv[4])

          parent = json.loads(parent_path.read_text(encoding="utf-8"))
          roots = []
          for line in roots_path.read_text(encoding="utf-8").splitlines():
              if not line:
                  continue
              label, root = line.split("\t", 1)
              path = Path(root)
              if not path.is_dir():
                  raise SystemExit(f"missing declared root: {label}: {root}")
              roots.append((label, path))

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def normalize_crc(value):
              return f"0x{int(value, 16):08x}"

          candidate_vmlinux = {}
          candidate_other = {}
          for number, raw in enumerate(
              candidate_symvers_path.read_text(encoding="utf-8", errors="strict").splitlines(), 1
          ):
              if not raw.strip():
                  continue
              fields = raw.split()
              if len(fields) < 3:
                  raise SystemExit(f"bad candidate Module.symvers line {number}: {raw!r}")
              crc, symbol, provider = fields[:3]
              crc = normalize_crc(crc)
              target = candidate_vmlinux if provider == "vmlinux" else candidate_other
              if symbol in target and target[symbol] != crc:
                  raise SystemExit(f"conflicting candidate CRC for {symbol}")
              target[symbol] = crc

          if "module_layout" not in candidate_vmlinux:
              raise SystemExit("candidate vmlinux module_layout CRC missing")

          module_re = re.compile(r"\.ko(?:\.(?:xz|gz|zst))?$")
          modules = []
          module_lookup = {}

          def run(args):
              return subprocess.run(
                  args,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )

          def decompress(path, temp_dir):
              name = path.name
              if name.endswith(".xz"):
                  dst = temp_dir / name[:-3]
                  dst.write_bytes(lzma.decompress(path.read_bytes()))
                  return dst
              if name.endswith(".gz"):
                  dst = temp_dir / name[:-3]
                  dst.write_bytes(gzip.decompress(path.read_bytes()))
                  return dst
              if name.endswith(".zst"):
                  dst = temp_dir / name[:-4]
                  proc = subprocess.run(
                      ["zstd", "-dc", str(path)],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=False,
                  )
                  if proc.returncode:
                      raise SystemExit(
                          f"zstd failed for {path}: {proc.stderr.decode('utf-8', 'replace')}"
                      )
                  dst.write_bytes(proc.stdout)
                  return dst
              return path

          def parse_modprobe_lines(mode, elf):
              proc = run(["modprobe", mode, str(elf)])
              if proc.returncode:
                  raise SystemExit(
                      f"modprobe {mode} failed for {elf}: {proc.stderr.strip()}"
                  )
              result = {}
              for line in proc.stdout.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  fields = line.split()
                  if len(fields) != 2:
                      raise SystemExit(f"unexpected {mode} line for {elf}: {line!r}")
                  crc, symbol = fields
                  crc = normalize_crc(crc)
                  if symbol in result and result[symbol] != crc:
                      raise SystemExit(f"conflicting {mode} CRC for {symbol} in {elf}")
                  result[symbol] = crc
              return result

          with tempfile.TemporaryDirectory(prefix="p8v3-stock-modules-") as td:
              temp_dir = Path(td)
              for label, root in roots:
                  for dirpath, _, filenames in os.walk(root):
                      current = Path(dirpath)
                      for filename in filenames:
                          if not module_re.search(filename):
                              continue
                          path = current / filename
                          rel = path.relative_to(root).as_posix()
                          raw = path.read_bytes()
                          elf = decompress(path, temp_dir)
                          elf_bytes = elf.read_bytes()
                          if not elf_bytes.startswith(b"\x7fELF"):
                              raise SystemExit(f"not ELF after decompression: {label}:{rel}")

                          info = run(["modinfo", "-F", "vermagic", str(elf)])
                          if info.returncode:
                              raise SystemExit(f"modinfo vermagic failed: {label}:{rel}")
                          vermagic = info.stdout.strip()

                          imports = parse_modprobe_lines("--show-modversions", elf)
                          exports = parse_modprobe_lines("--show-exports", elf)
                          if not imports:
                              raise SystemExit(f"module lacks modversion imports: {label}:{rel}")

                          item = {
                              "source": label,
                              "path": rel,
                              "filename": filename,
                              "file_sha256": sha(raw),
                              "elf_sha256": sha(elf_bytes),
                              "vermagic": vermagic,
                              "imports": imports,
                              "exports": exports,
                          }
                          key = (label, rel)
                          if key in module_lookup:
                              raise SystemExit(f"duplicate module path: {key}")
                          module_lookup[key] = item
                          modules.append(item)

          modules.sort(key=lambda x: (x["source"], x["path"]))

          # Continuity gate: every one of the 284 modules audited by P8-v2 must
          # reappear byte-identically in the same source/path. System modules are
          # intentionally additional because P8-v2 did not mount system.
          parent_modules = {
              (item["source"], item["path"]): item
              for item in parent["module_inventory"]["modules"]
          }
          if len(parent_modules) != 284:
              raise SystemExit(f"unexpected parent module map size: {len(parent_modules)}")

          missing_parent = []
          changed_parent = []
          for key, previous in parent_modules.items():
              current = module_lookup.get(key)
              if current is None:
                  missing_parent.append(f"{key[0]}:{key[1]}")
              elif current["file_sha256"] != previous["file_sha256"]:
                  changed_parent.append(f"{key[0]}:{key[1]}")

          if missing_parent:
              raise SystemExit(f"P8-v2 modules missing in P8-v3: {missing_parent[:10]}")
          if changed_parent:
              raise SystemExit(f"P8-v2 modules changed in P8-v3: {changed_parent[:10]}")

          # Resolve all P8-v2 modules.load entries. P8-v2 established that the
          # 286 entries resolve to 284 unique module paths.
          loaded_keys = set()
          for manifest in parent["load_contract"]["manifests"]:
              directory = posixpath.dirname(manifest["path"])
              for entry in manifest["entries"]:
                  rel = posixpath.normpath(posixpath.join(directory, entry))
                  key = (manifest["source"], rel)
                  if key not in module_lookup:
                      candidates = [
                          k for k in module_lookup
                          if k[0] == manifest["source"]
                          and posixpath.basename(k[1]) == posixpath.basename(entry)
                      ]
                      if len(candidates) != 1:
                          raise SystemExit(
                              f"cannot uniquely resolve modules.load entry "
                              f"{manifest['source']}:{manifest['path']}:{entry}"
                          )
                      key = candidates[0]
                  loaded_keys.add(key)

          if len(loaded_keys) != 284:
              raise SystemExit(f"unexpected unique P8-v2 modules.load set: {len(loaded_keys)}")

          # P8-v2 found the same direct system insmod command in all eight target
          # regions. Resolve the actual system module now.
          pronto_candidates = [
              key for key in module_lookup
              if key[0].startswith("partition:system")
              and key[1] == "lib/modules/pronto/pronto_wlan.ko"
          ]
          if len(pronto_candidates) != 1:
              raise SystemExit(
                  f"expected exactly one non-empty system pronto_wlan.ko, got {pronto_candidates}"
              )
          pronto_key = pronto_candidates[0]
          loaded_keys.add(pronto_key)

          if len(loaded_keys) != 285:
              raise SystemExit(f"expected 285 unique declared-loaded modules, got {len(loaded_keys)}")

          # Build stock-module export map for module-to-module dependencies.
          stock_exports = defaultdict(list)
          for key in sorted(loaded_keys):
              item = module_lookup[key]
              for symbol, crc in item["exports"].items():
                  stock_exports[symbol].append(
                      {
                          "crc": crc,
                          "provider": f"{key[0]}:{key[1]}",
                      }
                  )

          kernel_matches = 0
          kernel_mismatches = []
          module_chain_matches = 0
          module_chain_mismatches = []
          unresolved = []
          import_count = 0

          per_module = []
          for key in sorted(loaded_keys):
              item = module_lookup[key]
              kmatch = 0
              mmatch = 0
              problems = 0

              for symbol, expected_crc in sorted(item["imports"].items()):
                  import_count += 1

                  if symbol in candidate_vmlinux:
                      actual_crc = candidate_vmlinux[symbol]
                      if actual_crc == expected_crc:
                          kernel_matches += 1
                          kmatch += 1
                      else:
                          kernel_mismatches.append({
                              "module": f"{key[0]}:{key[1]}",
                              "symbol": symbol,
                              "stock_required_crc": expected_crc,
                              "candidate_vmlinux_crc": actual_crc,
                          })
                          problems += 1
                      continue

                  providers = stock_exports.get(symbol, [])
                  matching = [p for p in providers if p["crc"] == expected_crc]
                  if matching:
                      module_chain_matches += 1
                      mmatch += 1
                  elif providers:
                      module_chain_mismatches.append({
                          "module": f"{key[0]}:{key[1]}",
                          "symbol": symbol,
                          "stock_required_crc": expected_crc,
                          "stock_provider_crcs": sorted({p["crc"] for p in providers}),
                          "providers": sorted(p["provider"] for p in providers),
                      })
                      problems += 1
                  else:
                      unresolved.append({
                          "module": f"{key[0]}:{key[1]}",
                          "symbol": symbol,
                          "stock_required_crc": expected_crc,
                      })
                      problems += 1

              per_module.append({
                  "module": f"{key[0]}:{key[1]}",
                  "vermagic": item["vermagic"],
                  "import_count": len(item["imports"]),
                  "kernel_crc_match_count": kmatch,
                  "stock_module_chain_match_count": mmatch,
                  "problem_count": problems,
                  "is_system_pronto": key == pronto_key,
              })

          # Fail closed on any actual required-CRC problem.
          passed = (
              not kernel_mismatches
              and not module_chain_mismatches
              and not unresolved
              and import_count > 0
          )

          result = {
              "stage": "CLEAN_GEN1_P8_V3_GLOBAL_STOCK_SYMBOL_CRC_PROOF",
              "representative_region": "global",
              "representative_rom": "OS1.0.12.0.TKCMIXM",
              "eight_region_parent_abi_sha256": "ee6a6230c9e17cb1b32cf187a3e85b4f1cba8f478ff225f9d0e1144ac809f9e5",
              "candidate_release": "5.4.274-qgki-g82179e362f33",
              "candidate_vmlinux_export_count": len(candidate_vmlinux),
              "candidate_module_provider_symbol_count_ignored_for_stock_contract": len(candidate_other),
              "discovered_module_file_count": len(modules),
              "p8v2_parent_modules_reverified_byte_identical": 284,
              "declared_loaded_unique_module_count": len(loaded_keys),
              "system_pronto_module": f"{pronto_key[0]}:{pronto_key[1]}",
              "required_import_crc_count": import_count,
              "candidate_vmlinux_crc_match_count": kernel_matches,
              "stock_module_chain_crc_match_count": module_chain_matches,
              "candidate_vmlinux_crc_mismatch_count": len(kernel_mismatches),
              "stock_module_chain_crc_mismatch_count": len(module_chain_mismatches),
              "unresolved_import_count": len(unresolved),
              "global_crc_contract_pass": passed,
              "kernel_mismatches": kernel_mismatches,
              "stock_module_chain_mismatches": module_chain_mismatches,
              "unresolved_imports": unresolved,
              "modules": per_module,
              "claims": {
                  "eea_included": False,
                  "boot_image_created": False,
                  "flashable_zip_created": False,
                  "device_accessed": False,
                  "flashing_performed": False,
                  "device_boot_success_proven": False,
                  "eight_region_system_module_crc_equivalence_proven": False,
                  "p9_release_authorized": False,
              },
          }

          output.joinpath("P8V3-GLOBAL-STOCK-CRC.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          summary = [
              f"P8V3_GLOBAL_STOCK_SYMBOL_CRC_PROOF={'PASS' if passed else 'FAIL'}",
              f"DISCOVERED_MODULE_FILE_COUNT={len(modules)}",
              f"P8V2_PARENT_MODULES_REVERIFIED=284",
              f"DECLARED_LOADED_UNIQUE_MODULE_COUNT={len(loaded_keys)}",
              f"SYSTEM_PRONTO_MODULE={pronto_key[0]}:{pronto_key[1]}",
              f"REQUIRED_IMPORT_CRC_COUNT={import_count}",
              f"CANDIDATE_VMLINUX_CRC_MATCH_COUNT={kernel_matches}",
              f"STOCK_MODULE_CHAIN_CRC_MATCH_COUNT={module_chain_matches}",
              f"CANDIDATE_VMLINUX_CRC_MISMATCH_COUNT={len(kernel_mismatches)}",
              f"STOCK_MODULE_CHAIN_CRC_MISMATCH_COUNT={len(module_chain_mismatches)}",
              f"UNRESOLVED_IMPORT_COUNT={len(unresolved)}",
              "EEA_INCLUDED=NO",
              "BOOT_IMAGE_CREATED=NO",
              "FLASHABLE_ZIP_CREATED=NO",
              "DEVICE_ACCESSED=NO",
              "FLASHING_PERFORMED=NO",
              "DEVICE_BOOT_SUCCESS_PROVEN=NO",
              "EIGHT_REGION_SYSTEM_MODULE_CRC_EQUIVALENCE_PROVEN=NO",
              "P9_RELEASE_AUTHORIZED=NO",
          ]
          output.joinpath("P8V3-GLOBAL-STOCK-CRC.txt").write_text(
              "\n".join(summary) + "\n",
              encoding="utf-8",
          )

          if not passed:
              raise SystemExit(
                  "P8-v3 CRC contract failed: "
                  f"kernel_mismatch={len(kernel_mismatches)} "
                  f"module_chain_mismatch={len(module_chain_mismatches)} "
                  f"unresolved={len(unresolved)}"
              )
          PY

          grep -Fxq 'P8V3_GLOBAL_STOCK_SYMBOL_CRC_PROOF=PASS' \
            "$OUTPUT_DIR/P8V3-GLOBAL-STOCK-CRC.txt"
          grep -Fxq 'DECLARED_LOADED_UNIQUE_MODULE_COUNT=285' \
            "$OUTPUT_DIR/P8V3-GLOBAL-STOCK-CRC.txt"
          grep -Fxq 'CANDIDATE_VMLINUX_CRC_MISMATCH_COUNT=0' \
            "$OUTPUT_DIR/P8V3-GLOBAL-STOCK-CRC.txt"
          grep -Fxq 'STOCK_MODULE_CHAIN_CRC_MISMATCH_COUNT=0' \
            "$OUTPUT_DIR/P8V3-GLOBAL-STOCK-CRC.txt"
          grep -Fxq 'UNRESOLVED_IMPORT_COUNT=0' \
            "$OUTPUT_DIR/P8V3-GLOBAL-STOCK-CRC.txt"
          grep -Fxq 'P9_RELEASE_AUTHORIZED=NO' \
            "$OUTPUT_DIR/P8V3-GLOBAL-STOCK-CRC.txt"

          cleanup_mounts
          trap - EXIT

      - name: Close P8-v3 proof package
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$OUTPUT_DIR"

          {
            echo "JOB_STATUS=${{ job.status }}"
            echo "P8V3_TARGET_REGION_COUNT=8"
            echo "P8V3_TARGET_REGION_IDS=$TARGET_REGION_IDS"
            echo "P8V3_EEA_INCLUDED=NO"
            echo "P8V3_P6_PARENT_RUN_ID=$P6V10_V2_RUN_ID"
            echo "P8V3_P8V2_PARENT_RUN_ID=$P8V2_R2_RUN_ID"
            echo "P8V3_KERNEL_SOURCE_DELTA=DEFCONFIG_MODULE_CONTRACT_ONLY"
            echo "P8V3_BOOT_IMAGE_CREATED=NO"
            echo "P8V3_FLASHABLE_ZIP_CREATED=NO"
            echo "P8V3_DEVICE_ACCESSED=NO"
            echo "P8V3_FLASHING_PERFORMED=NO"
            echo "P8V3_DEVICE_BOOT_SUCCESS_PROVEN=NO"
            echo "P8V3_P9_RELEASE_AUTHORIZED=NO"
          } > "$OUTPUT_DIR/99-job-end-state.txt"

          (
            cd "$OUTPUT_DIR" || exit 1
            find . -type f \
              ! -name 'FILES.txt' \
              ! -name 'SHA256SUMS' \
              ! -name 'SHA256SUMS.verify.txt' \
              -printf '%P\n' | sort > FILES.txt
            while IFS= read -r file; do sha256sum "$file"; done < FILES.txt > SHA256SUMS
            sha256sum -c SHA256SUMS > SHA256SUMS.verify.txt
          )
          exit 0

      - name: Upload P8-v3 CRC proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p8v3-veux-5.4.274-eight-region-module-crc-proof-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 90
