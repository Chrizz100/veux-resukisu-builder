            r9-output/R9_SOURCE_DIFF_NAMES.txt

          diff -u <(printf '%s\n' \
            framework/lspd.dex \
            framework/lspd.dex.sha256) \
            r9-output/R9_FINAL_PACKAGE_DIFF.txt

          grep -q '^R8_V4_DEVICE_RESULT=VALID_MARKER_PLUS_SAME_PAIRIP_0x65768_CRASH$' r9-output/R9_PROVENANCE.txt
          grep -q '^R9_V2_DEVICE_RESULT=MANAGER_STARTS_AND_INGRESS_SAME_PAIRIP_0x65768_CRASH$' r9-output/R9_PROVENANCE.txt
          grep -q '^R9_V3_DEVICE_RESULT=SAME_PAIRIP_0x65768_CRASH_WITH_CRASHDUMP_HOOK_SUPPRESSED$' r9-output/R9_PROVENANCE.txt
