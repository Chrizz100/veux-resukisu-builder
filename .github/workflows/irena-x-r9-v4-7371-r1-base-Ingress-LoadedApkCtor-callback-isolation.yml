          grep -q '^LOADEDAPK_CTOR_CALLBACK_IN_INGRESS=SUPPRESSED$' r9-output/R9_PROVENANCE.txt
          grep -q '^LOADEDAPK_CREATECL_REGISTRATION=UNCHANGED$' r9-output/R9_PROVENANCE.txt
