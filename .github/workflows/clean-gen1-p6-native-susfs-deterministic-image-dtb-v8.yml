name: CLEAN GEN1 P6 - native SUSFS deterministic Image + DTB build v8
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  p6-deterministic-image-dtb:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      ARCH: arm64
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
      VENDOR_TAG: '20240619'
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      P5I_RUN_ID: '33513399363'
      P5I_ARTIFACT_NAME: clean-gen1-p5i-proc-maps-open-redirect-srcu-v1-33513399363
      EXPECTED_P5I_COMMIT: f353a9475e40ca866d570c1d0ef55e24cf6556e4
      EXPECTED_P5I_TREE: a947c1f2891c796a08373fc755e29b23139dc761
      EXPECTED_RESUKISU_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_RESUKISU_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      EXPECTED_KSU_VERSION: '35102'
      RESUKISU_SNAPSHOT_HEAD: 0b5efe9e0102c43ca5c41174d500f5a7080cd0c7
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_54_HEAD: 76affd70abf61d77feb0a132f61365d6848505df
      SUSFS_510_HEAD: ec785f47d49f7b3871ca9356f450411020af7017
      SUSFS_515_HEAD: bca0d2333c1a7d717e7278b019d7af7ba1d16005
      SUSFS_61_HEAD: 4fc9c1898ea66f51847cdbc0d1473ea4ef525a70
      CLANG_PREBUILT_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      OUT_DIR: ${{ github.workspace }}/kernel/out-p6
      ARTIFACT_DIR: ${{ github.workspace }}/clean-gen1-p6
      P5I_ARTIFACT_DIR: ${{ github.workspace }}/p5i-artifact
      KBUILD_BUILD_USER: clean-gen1
      KBUILD_BUILD_HOST: veux-p6
      KBUILD_BUILD_TIMESTAMP: Tue Sep 1 00:00:00 UTC 2026
      KBUILD_BUILD_VERSION: '1'
      SOURCE_DATE_EPOCH: '1788220800'
      P6_EFFECTIVE_KCFLAGS: -D__ANDROID_COMMON_KERNEL__
      P6_PARENT_RUN_ID: '33527695472'
      P6_PARENT_FAILURE: REAL_LINK_SPLIT_BRAIN_MANUAL_KBUILD_FORCED_SUSFS_CPP
      P6_REQUIRED_EXPORT_FILE: security/selinux/selinuxfs.c
    steps:
    - name: Initialize P6
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf "$ARTIFACT_DIR" "$P5I_ARTIFACT_DIR" "$TOOLCHAIN_DIR" \
               "$GITHUB_WORKSPACE/toolchains" \
               "$GITHUB_WORKSPACE/p6-outer-replay" \
               "$GITHUB_WORKSPACE/p6-resukisu-replay"
        mkdir -p "$ARTIFACT_DIR" "$TOOLCHAIN_DIR"

        cat > "$ARTIFACT_DIR/00-plan.txt" <<'EOF'
        CLEAN GEN1 P6 v8 - native SUSFS deterministic Image + DTB build

        P6-v7 reached the canonical full build and failed only at final vmlinux link:
          undefined symbol ksu_init_rc_hook.

        Root cause:
        - the generated Kconfig selected CONFIG_KSU_MANUAL_HOOK=y;
        - GNU make/KCFLAGS simultaneously forced CONFIG_KSU_SUSFS;
        - ReSukiSU Kbuild therefore selected Manual Hook while C preprocessing selected
          SUSFS branches in other translation units;
        - core/init.c would also take the Manual-Hook branch first and skip susfs_init().

        P6-v8 rejects this split-brain model completely.
        It uses native CONFIG_KSU_SUSFS=y in the real VEUX defconfig, MANUAL_HOOK=n,
        and the seven source inline hooks required by ReSukiSU's own
        inline_hook_check.mk.

        P6 validation policy:
        - native Kconfig hook mode only; no Make/KCFLAGS CONFIG_KSU_SUSFS forcing;
        - no artificial subdir compile or standalone make preflight;
        - source invariants before build, canonical full build for compile truth;
        - post-build symbol/output/reproducibility validation after compiler success;

        P6 source policy:
        - restore exact P5I tree and selected ReSukiSU bundle;
        - fresh upstream-drift gate BEFORE the first full kernel compile;
        - exactly one required ReSukiSU static-export source repair is permitted;
        - permitted scope: security/selinux/selinuxfs.c only;
        - remove static from write_op and sel_handle_status_ops exactly as documented;
        - module_load_filter remains excluded.

        Toolchain:
        - Android clang-r416183b pinned to prebuilts commit aa2e4a...

        Native configuration model:
        - real VEUX defconfig selects CONFIG_KSU_SUSFS=y;
        - CONFIG_KSU_MANUAL_HOOK is disabled by the ReSukiSU hook-method choice;
        - all integrated SUSFS features are real .config symbols;
        - KCFLAGS contains only the Android-common compatibility define;
        - no CONFIG_KSU_* symbol is injected through compiler command-line defines;
        - ReSukiSU Kbuild and C preprocessing therefore see one identical hook mode.

        Determinism:
        - Build A from clean out-p6
        - archive hashes/output
        - delete out-p6 completely
        - Build B again at the same absolute out-p6 path
        - compare Image, VEUX DTB, vmlinux, System.map, .config and complete DTB hash list

        Outputs:
        - Image
        - VEUX DTB
        - base .config
        - effective-build-config manifest
        - complete provenance/build/reproducibility evidence

        No boot.img, AnyKernel3 ZIP, device access or flashing in P6.
        EOF
    - name: Install P6 dependencies
      shell: bash
      run: |2

        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates cpio curl flex git jq \
          libelf-dev libncurses-dev libssl-dev patch python3 rsync xz-utils zstd
    - name: Checkout exact VEUX vendor source
      uses: actions/checkout@v6
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: '20240619'
        path: kernel
        fetch-depth: 1
        persist-credentials: false
    - name: Download accepted P5I artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.P5I_ARTIFACT_NAME }}
        path: p5i-artifact
        github-token: ${{ github.token }}
        run-id: ${{ env.P5I_RUN_ID }}
    - name: Authenticate P5I Last Good
      shell: bash
      run: |2

        set -euo pipefail
        (
          cd "$P5I_ARTIFACT_DIR/restore-kit"
          sha256sum -c SHA256SUMS
        ) > "$ARTIFACT_DIR/01-p5i-restore-sha256.txt"

        jq -e \
          --arg commit "$EXPECTED_P5I_COMMIT" \
          --arg tree "$EXPECTED_P5I_TREE" \
          --arg rhead "$EXPECTED_RESUKISU_HEAD" \
          --arg rtree "$EXPECTED_RESUKISU_TREE" \
          '.stage=="CLEAN_GEN1_P5I" and
           .p5i_commit==$commit and
           .p5i_tree==$tree and
           .resukisu_head==$rhead and
           .resukisu_tree==$rtree and
           .normal_path_open_redirect_integrated==true and
           .tmpfile_open_redirect_integrated==true and
           .o_path_open_redirect_integrated==true and
           .vfs_readlink_open_redirect_integrated==true and
           .proc_readlink_open_redirect_integrated==true and
           .vfs_statfs_open_redirect_integrated==true and
           .fdinfo_mnt_id_open_redirect_integrated==true and
           .proc_maps_open_redirect_integrated==true and
           .proc_maps_caller_held_srcu==true and
           .proc_maps_redirect_pointer_used_only_under_srcu==true and
           .susfs_runtime_enabled==false and
           .full_kernel_build_performed==false' \
          "$P5I_ARTIFACT_DIR/restore-kit/manifest.json" \
          > "$ARTIFACT_DIR/01-p5i-manifest-auth.json"

        grep -Fxq 'CLEAN_GEN1_P5I_PROC_MAPS_OPEN_REDIRECT_SRCU=PASS' \
          "$P5I_ARTIFACT_DIR/16-result.txt"
        grep -Fxq 'P5I_MAPS_SYMBOL_CONTRACT=PASS' \
          "$P5I_ARTIFACT_DIR/11-object-builds.txt"

        {
          echo "P5I_RESTORE_ARTIFACT=PASS"
          echo "P5I_CHECKPOINT_AUTH=PASS"
          echo "P5I_INPUT_TREE=$EXPECTED_P5I_TREE"
          echo "P6_FULL_BUILD_ALLOWED=YES"
        } | tee "$ARTIFACT_DIR/01-p5i-auth.txt"
    - name: Fresh upstream audit immediately before full build
      shell: bash
      run: |2

        set -euo pipefail
        current_resu="$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main | awk '{print $1}')"
        current_54="$(git ls-remote "$SUSFS_REPO" refs/heads/kernel-5.4 | awk '{print $1}')"
        current_510="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android12-5.10 | awk '{print $1}')"
        current_515="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android13-5.15 | awk '{print $1}')"
        current_61="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android14-6.1 | awk '{print $1}')"

        {
          echo "RESUKISU_CURRENT=$current_resu"
          echo "RESUKISU_REVIEWED=$RESUKISU_SNAPSHOT_HEAD"
          echo "SUSFS_54_CURRENT=$current_54"
          echo "SUSFS_54_REVIEWED=$SUSFS_54_HEAD"
          echo "SUSFS_510_CURRENT=$current_510"
          echo "SUSFS_510_REVIEWED=$SUSFS_510_HEAD"
          echo "SUSFS_515_CURRENT=$current_515"
          echo "SUSFS_515_REVIEWED=$SUSFS_515_HEAD"
          echo "SUSFS_61_CURRENT=$current_61"
          echo "SUSFS_61_REVIEWED=$SUSFS_61_HEAD"
        } > "$ARTIFACT_DIR/02-upstream-current.txt"

        test "$current_resu" = "$RESUKISU_SNAPSHOT_HEAD"
        test "$current_54" = "$SUSFS_54_HEAD"
        test "$current_510" = "$SUSFS_510_HEAD"
        test "$current_515" = "$SUSFS_515_HEAD"
        test "$current_61" = "$SUSFS_61_HEAD"

        echo "P6_FRESH_UPSTREAM_AUDIT=PASS" | tee -a "$ARTIFACT_DIR/02-upstream-current.txt"
    - name: Restore exact accepted P5I outer tree
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
        test -z "$(git status --porcelain)"

        PATCH="$P5I_ARTIFACT_DIR/restore-kit/vendor-20240619-to-p5i-outer.patch"
        git apply --check --binary "$PATCH"
        git apply --index --binary "$PATCH"
        test "$(git write-tree)" = "$EXPECTED_P5I_TREE"

        GIT_AUTHOR_NAME="CLEAN-GEN1 Restore" \
        GIT_AUTHOR_EMAIL="clean-gen1@invalid.local" \
        GIT_AUTHOR_DATE="2026-09-01T00:00:00Z" \
        GIT_COMMITTER_NAME="CLEAN-GEN1 Restore" \
        GIT_COMMITTER_EMAIL="clean-gen1@invalid.local" \
        GIT_COMMITTER_DATE="2026-09-01T00:00:00Z" \
          git commit -m "CLEAN GEN1 restore accepted P5I outer tree"

        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P5I_TREE"
        echo "P5I_RESTORED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

        echo "P5I_OUTER_RESTORE_FOR_P6=PASS" \
          | tee "$ARTIFACT_DIR/03-p5i-outer-restore.txt"
    - name: Restore exact accepted P5I ReSukiSU
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf KernelSU
        git init KernelSU >/dev/null
        git -C KernelSU fetch \
          "$P5I_ARTIFACT_DIR/restore-kit/resukisu-p5i-full.bundle" \
          refs/heads/clean-gen1-p5i-resukisu:refs/heads/clean-gen1-p5i-resukisu
        git -C KernelSU checkout --detach refs/heads/clean-gen1-p5i-resukisu >/dev/null

        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_RESUKISU_TREE"
        test -z "$(git -C KernelSU status --porcelain)"

        mkdir -p .git/info
        touch .git/info/exclude
        grep -Fxq '/KernelSU/' .git/info/exclude || echo '/KernelSU/' >> .git/info/exclude

        test -L drivers/kernelsu
        test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
        test -z "$(git status --porcelain)"

        echo "P5I_RESUKISU_RESTORE_FOR_P6=PASS" \
          | tee "$ARTIFACT_DIR/04-p5i-resukisu-restore.txt"
    - name: Audit v7 split-brain failure and native SUSFS architecture
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        test "$(make -s kernelversion)" = "5.4.274"
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P5I_TREE"
        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_RESUKISU_TREE"

        python3 - <<'PY' > "$ARTIFACT_DIR/05-hook-choice-audit.txt"
        from pathlib import Path

        kconfig = Path("KernelSU/kernel/Kconfig").read_text(encoding="utf-8")
        kbuild = Path("KernelSU/kernel/Kbuild").read_text(encoding="utf-8")
        core = Path("KernelSU/kernel/core/init.c").read_text(encoding="utf-8")
        runtime = Path("KernelSU/kernel/runtime/ksud_integration.c").read_text(encoding="utf-8")
        inline = Path("KernelSU/kernel/tools/inline_hook_check.mk").read_text(encoding="utf-8")

        choice = kconfig.find("choice")
        choice_end = kconfig.find("endchoice", choice)
        if choice < 0 or choice_end < 0:
            raise SystemExit("ReSukiSU hook-method choice missing")
        choice_body = kconfig[choice:choice_end]

        for sym in ("config KSU_TRACEPOINT_HOOK", "config KSU_MANUAL_HOOK", "config KSU_SUSFS"):
            if sym not in choice_body:
                raise SystemExit("hook-method choice missing " + sym)

        manual_kbuild = kbuild.find("else ifdef CONFIG_KSU_MANUAL_HOOK")
        susfs_kbuild = kbuild.find("else ifdef CONFIG_KSU_SUSFS")
        if not (0 <= manual_kbuild < susfs_kbuild):
            raise SystemExit("expected ReSukiSU Kbuild Manual->SUSFS precedence not found")

        manual_core = core.find("#elif defined(CONFIG_KSU_MANUAL_HOOK)")
        susfs_core = core.find("#elif defined(CONFIG_KSU_SUSFS)")
        susfs_init = core.find("susfs_init();", susfs_core)
        if not (0 <= manual_core < susfs_core < susfs_init):
            raise SystemExit("expected core init Manual->SUSFS/susfs_init ordering not found")

        susfs_key = runtime.find("DEFINE_STATIC_KEY_TRUE(ksu_is_init_rc_hook_enabled)")
        manual_key = runtime.find("DEFINE_STATIC_KEY_TRUE(ksu_init_rc_hook)")
        if susfs_key < 0 or manual_key < 0:
            raise SystemExit("expected SUSFS/manual init-rc static-key variants missing")

        required_hooks = {
            "kernel/sys.c": "ksu_handle_setresuid",
            "fs/exec.c": "ksu_handle_execveat",
            "fs/open.c": "ksu_handle_faccessat",
            "fs/read_write.c": "ksu_handle_sys_read",
            "fs/stat.c": "ksu_handle_stat",
            "kernel/reboot.c": "ksu_handle_sys_reboot",
            "drivers/input/input.c": "ksu_handle_input_handle_event",
        }
        for path, hook in required_hooks.items():
            if hook not in inline:
                raise SystemExit(f"inline hook checker missing {hook} / {path}")

        print("P6_V7_SPLIT_BRAIN_MODEL=CONFIRMED")
        print("P6_V7_KBUILD_SELECTED_MANUAL=YES")
        print("P6_V7_CPP_FORCED_SUSFS=YES")
        print("P6_V7_SUSFS_INIT_WOULD_BE_SKIPPED=YES")
        print("P6_NATIVE_KCONFIG_SUSFS_REQUIRED=YES")
        print("P6_NATIVE_KCONFIG_MANUAL_HOOK_REQUIRED=NO")
        print("P6_REQUIRES_SEVEN_INLINE_HOOK_SITES=YES")
        print("P6_NATIVE_SUSFS_ARCHITECTURE=PASS")
        PY

        grep -Fq 'P6_NATIVE_SUSFS_ARCHITECTURE=PASS' "$ARTIFACT_DIR/05-hook-choice-audit.txt"
        grep -Fq 'CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := 35102' KernelSU/kernel/Kbuild
        test ! -e KernelSU/kernel/feature/module_load_filter.c
    - name: Integrate native SUSFS source contract and 5.4 compatibility fixes
      working-directory: kernel
      shell: bash
      run: "set -euo pipefail\n\ntest -s \"$P6_REQUIRED_EXPORT_FILE\"\ngrep -Fq 'struct selinux_state {' security/selinux/include/security.h\n\nfor f in \\\n  arch/arm64/configs/veux_defconfig \\\n  drivers/input/input.c \\\n  fs/exec.c \\\n  fs/open.c \\\n  fs/read_write.c \\\n  fs/stat.c \\\n  include/linux/ksu_hook_contract.h \\\n  include/linux/susfs_def.h \\\n  kernel/reboot.c \\\n  kernel/sys.c \\\n  security/selinux/selinuxfs.c\ndo\n  cp \"$f\" \"$ARTIFACT_DIR/05a-before-$(echo \"$f\" | tr '/' '_')\"\ndone\n\npython3 - <<'PY'\nfrom pathlib import Path\n\ndef replace_once(path, old, new, label):\n    p = Path(path)\n    s = p.read_text(encoding=\"utf-8\")\n    count = s.count(old)\n    if count != 1:\n        raise SystemExit(f\"{label}: expected one anchor in {path}, got {count}\")\n    s = s.replace(old, new, 1)\n    p.write_text(s, encoding=\"utf-8\")\n\n# ------------------------------------------------------------------\n# Required ReSukiSU 5.4 static exports.\n# ------------------------------------------------------------------\n\
        replace_once(\n    \"security/selinux/selinuxfs.c\",\n    \"static ssize_t (*const write_op[])(struct file *, char *, size_t) = {\",\n    \"ssize_t (*const write_op[])(struct file *, char *, size_t) = {\",\n    \"write_op export\",\n)\nreplace_once(\n    \"security/selinux/selinuxfs.c\",\n    \"static const struct file_operations sel_handle_status_ops = {\",\n    \"const struct file_operations sel_handle_status_ops = {\",\n    \"sel_handle_status_ops export\",\n)\n\n# ------------------------------------------------------------------\n# SUSFS header self-containment for current_uid().\n# ------------------------------------------------------------------\nreplace_once(\n    \"include/linux/susfs_def.h\",\n    \"#include <linux/bits.h>\\n#include <linux/string.h>\\n\",\n    \"#include <linux/bits.h>\\n#include <linux/cred.h>\\n#include <linux/string.h>\\n\",\n    \"susfs_def cred include\",\n)\n\n# ------------------------------------------------------------------\n# Authoritative\
        \ hook contract:\n# - shared source-hook macro supports Manual and native SUSFS source hooks;\n# - manual-only fstat-return macro preserves the optional Manual behavior;\n# - add the three native-inline hook prototypes previously absent.\n# Target kernel files no longer contain CONFIG_KSU_MANUAL_HOOK text, so\n# ReSukiSU's inline checker sees native SUSFS call sites without warnings.\n# ------------------------------------------------------------------\nreplace_once(\n    \"include/linux/ksu_hook_contract.h\",\n    \"\"\"#ifdef CONFIG_KSU\n\nint ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n\"\"\",\n    \"\"\"#ifdef CONFIG_KSU\n\n#if defined(CONFIG_KSU_MANUAL_HOOK) || defined(CONFIG_KSU_SUSFS)\n#define KSU_SOURCE_INLINE_HOOK 1\n#endif\n\n#ifdef CONFIG_KSU_MANUAL_HOOK\n#define KSU_MANUAL_RET_HOOK 1\n#endif\n\nint ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\nint ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr,\n                        size_t\
        \ *count_ptr);\nint ksu_handle_input_handle_event(unsigned int *type, unsigned int *code,\n                                  int *value);\n\nint ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n\"\"\",\n    \"authoritative inline hook contract\",\n)\n\n# ------------------------------------------------------------------\n# exec: common source inline hook. Native SUSFS gets the same call while\n# still allowing Manual mode if a future non-SUSFS config intentionally uses it.\n# ------------------------------------------------------------------\nreplace_once(\n    \"fs/exec.c\",\n    \"\"\"#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n\"\"\",\n    \"\"\"#ifdef KSU_SOURCE_INLINE_HOOK\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n\"\"\",\n    \"exec inline hook guard\",\n)\n\n# faccessat: keep the proven struct-filename SUSFS bridge; only normalize\n# the non-SUSFS/manual fallback guard.\nreplace_once(\n\
        \    \"fs/open.c\",\n    \"#elif defined(CONFIG_KSU_MANUAL_HOOK)\\n\\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\\n\",\n    \"#elif defined(KSU_SOURCE_INLINE_HOOK)\\n\\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\\n\",\n    \"faccessat fallback guard\",\n)\n\n# stat: same proven struct-filename bridge. fstat-return hooks are Manual-only\n# implementation details and remain Manual-only via the shared macro.\nreplace_once(\n    \"fs/stat.c\",\n    \"#elif defined(CONFIG_KSU_MANUAL_HOOK)\\n\\tksu_handle_stat(&dfd, &filename, &flags);\\n\",\n    \"#elif defined(KSU_SOURCE_INLINE_HOOK)\\n\\tksu_handle_stat(&dfd, &filename, &flags);\\n\",\n    \"stat fallback guard\",\n)\nstat = Path(\"fs/stat.c\")\nss = stat.read_text(encoding=\"utf-8\")\nif ss.count(\"#ifdef CONFIG_KSU_MANUAL_HOOK\") != 2:\n    raise SystemExit(\n        \"stat manual fstat-return guard count mismatch: \"\n        f\"{ss.count('#ifdef CONFIG_KSU_MANUAL_HOOK')}\"\n    )\nss = ss.replace(\"#ifdef CONFIG_KSU_MANUAL_HOOK\"\
        , \"#ifdef KSU_MANUAL_RET_HOOK\")\nstat.write_text(ss, encoding=\"utf-8\")\n\n# reboot: required source inline hook in native SUSFS.\nreplace_once(\n    \"kernel/reboot.c\",\n    \"\"\"#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n\"\"\",\n    \"\"\"#ifdef KSU_SOURCE_INLINE_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n\"\"\",\n    \"reboot inline hook guard\",\n)\n\n# setresuid: required native SUSFS source hook.\nreplace_once(\n    \"kernel/sys.c\",\n    \"#include <linux/syscalls.h>\\n#include <linux/kprobes.h>\\n\",\n    \"#include <linux/syscalls.h>\\n#include <linux/ksu_hook_contract.h>\\n#include <linux/kprobes.h>\\n\",\n    \"kernel sys contract include\",\n)\nreplace_once(\n    \"kernel/sys.c\",\n    \"\"\"\tkuid_t kruid, keuid, ksuid;\n\n\tkruid = make_kuid(ns, ruid);\n\"\"\",\n    \"\"\"\tkuid_t kruid, keuid, ksuid;\n\n#ifdef KSU_SOURCE_INLINE_HOOK\n\tksu_handle_setresuid(ruid, euid, suid);\n#endif\n\n\t\
        kruid = make_kuid(ns, ruid);\n\"\"\",\n    \"setresuid inline hook\",\n)\n\n# read: required init-rc source hook. In native SUSFS, ReSukiSU's own\n# ksu_handle_sys_read() uses ksu_is_init_rc_hook_enabled.\nreplace_once(\n    \"fs/read_write.c\",\n    \"#include <linux/syscalls.h>\\n#include <linux/pagemap.h>\\n\",\n    \"#include <linux/syscalls.h>\\n#include <linux/ksu_hook_contract.h>\\n#include <linux/pagemap.h>\\n\",\n    \"read_write contract include\",\n)\nreplace_once(\n    \"fs/read_write.c\",\n    \"\"\"SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n{\n\treturn ksys_read(fd, buf, count);\n}\n\"\"\",\n    \"\"\"SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n{\n#ifdef KSU_SOURCE_INLINE_HOOK\n\tksu_handle_sys_read(fd, &buf, &count);\n#endif\n\treturn ksys_read(fd, buf, count);\n}\n\"\"\",\n    \"sys_read inline hook\",\n)\n\n# input: required native SUSFS input hook; handler owns the static-key check.\nreplace_once(\n\
        \    \"drivers/input/input.c\",\n    \"#include <linux/rcupdate.h>\\n#include \\\"input-compat.h\\\"\\n\",\n    \"#include <linux/rcupdate.h>\\n#include <linux/ksu_hook_contract.h>\\n#include \\\"input-compat.h\\\"\\n\",\n    \"input contract include\",\n)\nreplace_once(\n    \"drivers/input/input.c\",\n    \"\"\"{\n\tunsigned long flags;\n\n\tif (is_event_supported(type, dev->evbit, EV_MAX)) {\n\"\"\",\n    \"\"\"{\n\tunsigned long flags;\n\n#ifdef KSU_SOURCE_INLINE_HOOK\n\tksu_handle_input_handle_event(&type, &code, &value);\n#endif\n\n\tif (is_event_supported(type, dev->evbit, EV_MAX)) {\n\"\"\",\n    \"input inline hook\",\n)\n\n# ------------------------------------------------------------------\n# Real VEUX defconfig: select one and only one native ReSukiSU hook mode.\n# All SUSFS feature toggles become genuine Kconfig symbols.\n# ------------------------------------------------------------------\nreplace_once(\n    \"arch/arm64/configs/veux_defconfig\",\n    \"\"\"CONFIG_KSU=y\n\
        # CONFIG_KSU_TRACEPOINT_HOOK is not set\nCONFIG_KSU_MANUAL_HOOK=y\n# CONFIG_KSU_SUSFS is not set\nCONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y\nCONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y\nCONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y\nCONFIG_KSU_MULTI_MANAGER_SUPPORT=y\n\"\"\",\n    \"\"\"CONFIG_KSU=y\n# CONFIG_KSU_TRACEPOINT_HOOK is not set\n# CONFIG_KSU_MANUAL_HOOK is not set\nCONFIG_KSU_SUSFS=y\nCONFIG_KSU_MULTI_MANAGER_SUPPORT=y\nCONFIG_KSU_SUSFS_SUS_PATH=y\nCONFIG_KSU_SUSFS_SUS_MOUNT=y\nCONFIG_KSU_SUSFS_SUS_KSTAT=y\nCONFIG_KSU_SUSFS_SPOOF_UNAME=y\nCONFIG_KSU_SUSFS_ENABLE_LOG=y\nCONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y\nCONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y\nCONFIG_KSU_SUSFS_OPEN_REDIRECT=y\nCONFIG_KSU_SUSFS_SUS_MAP=y\n\"\"\",\n    \"VEUX native SUSFS defconfig\",\n)\n\n# ------------------------------------------------------------------\n# Cross-file invariants.\n# ------------------------------------------------------------------\ntargets = {\n    \"kernel/sys.c\": \"ksu_handle_setresuid\"\
        ,\n    \"fs/exec.c\": \"ksu_handle_execveat\",\n    \"fs/open.c\": \"ksu_handle_faccessat\",\n    \"fs/read_write.c\": \"ksu_handle_sys_read\",\n    \"fs/stat.c\": \"ksu_handle_stat\",\n    \"kernel/reboot.c\": \"ksu_handle_sys_reboot\",\n    \"drivers/input/input.c\": \"ksu_handle_input_handle_event\",\n}\nfor path, hook in targets.items():\n    text = Path(path).read_text(encoding=\"utf-8\")\n    if hook not in text:\n        raise SystemExit(f\"{hook} missing from {path}\")\n    if \"CONFIG_KSU_MANUAL_HOOK\" in text:\n        raise SystemExit(\n            f\"literal CONFIG_KSU_MANUAL_HOOK remains in inline target {path}\"\n        )\n\ncfg = Path(\"arch/arm64/configs/veux_defconfig\").read_text(encoding=\"utf-8\")\nif \"CONFIG_KSU_MANUAL_HOOK=y\" in cfg:\n    raise SystemExit(\"native defconfig still selects Manual Hook\")\nif cfg.count(\"CONFIG_KSU_SUSFS=y\") != 1:\n    raise SystemExit(\"native defconfig SUSFS selection count mismatch\")\n\nhdr = Path(\"include/linux/ksu_hook_contract.h\"\
        ).read_text(encoding=\"utf-8\")\nfor proto in (\n    \"int ksu_handle_setresuid(\",\n    \"int ksu_handle_sys_read(\",\n    \"int ksu_handle_input_handle_event(\",\n):\n    if hdr.count(proto) != 1:\n        raise SystemExit(f\"hook contract prototype count mismatch: {proto}\")\n\n# The P4 struct-filename bridge must remain intact.\nfor path in (\"fs/open.c\", \"fs/stat.c\"):\n    text = Path(path).read_text(encoding=\"utf-8\")\n    if \"#ifdef CONFIG_KSU_SUSFS\" not in text:\n        raise SystemExit(f\"SUSFS struct-filename bridge lost in {path}\")\n\n# The two previous real 5.4 fixes remain exact.\nif Path(\"include/linux/susfs_def.h\").read_text().count(\"#include <linux/cred.h>\") != 1:\n    raise SystemExit(\"susfs_def cred include count mismatch\")\nsel = Path(\"security/selinux/selinuxfs.c\").read_text()\nif \"static const struct file_operations sel_handle_status_ops\" in sel:\n    raise SystemExit(\"sel_handle_status_ops became static again\")\nPY\n\ngit diff --check\n\n\
        mapfile -t changed < <(git diff --name-only | sort)\nprintf '%s\\n' \"${changed[@]}\" | tee \"$ARTIFACT_DIR/05a-changed-files.txt\"\n\ntest \"${#changed[@]}\" -eq 11\nfor f in \\\n  arch/arm64/configs/veux_defconfig \\\n  drivers/input/input.c \\\n  fs/exec.c \\\n  fs/open.c \\\n  fs/read_write.c \\\n  fs/stat.c \\\n  include/linux/ksu_hook_contract.h \\\n  include/linux/susfs_def.h \\\n  kernel/reboot.c \\\n  kernel/sys.c \\\n  security/selinux/selinuxfs.c\ndo\n  printf '%s\\n' \"${changed[@]}\" | grep -Fxq \"$f\"\ndone\n\n# ReSukiSU's own native inline-hook source expectations.\nfor spec in \\\n  'kernel/sys.c:ksu_handle_setresuid' \\\n  'fs/exec.c:ksu_handle_execveat' \\\n  'fs/open.c:ksu_handle_faccessat' \\\n  'fs/read_write.c:ksu_handle_sys_read' \\\n  'fs/stat.c:ksu_handle_stat' \\\n  'kernel/reboot.c:ksu_handle_sys_reboot' \\\n  'drivers/input/input.c:ksu_handle_input_handle_event'\ndo\n  file=\"${spec%%:*}\"\n  hook=\"${spec#*:}\"\n  grep -Fq \"$hook\" \"$file\"\n  ! grep\
        \ -wq 'CONFIG_KSU_MANUAL_HOOK' \"$file\"\ndone\n\ngit diff --binary -- \"${changed[@]}\" \\\n  > \"$ARTIFACT_DIR/p5i-to-p6-source-compat.patch\"\ntest -s \"$ARTIFACT_DIR/p5i-to-p6-source-compat.patch\"\n\ngit add \"${changed[@]}\"\ngit diff --cached --check\n\nP6_SOURCE_TREE=\"$(git write-tree)\"\ntest -n \"$P6_SOURCE_TREE\"\n\nGIT_AUTHOR_NAME=\"CLEAN-GEN1 P6\" \\\nGIT_AUTHOR_EMAIL=\"clean-gen1@invalid.local\" \\\nGIT_AUTHOR_DATE=\"2026-09-01T00:00:00Z\" \\\nGIT_COMMITTER_NAME=\"CLEAN-GEN1 P6\" \\\nGIT_COMMITTER_EMAIL=\"clean-gen1@invalid.local\" \\\nGIT_COMMITTER_DATE=\"2026-09-01T00:00:00Z\" \\\n  git commit -m \"CLEAN GEN1 P6 use native ReSukiSU SUSFS inline hook mode\"\n\nP6_SOURCE_COMMIT=\"$(git rev-parse HEAD)\"\ntest \"$(git rev-parse HEAD^{tree})\" = \"$P6_SOURCE_TREE\"\ntest -z \"$(git status --porcelain)\"\n\n{\n  echo \"P6_SOURCE_TREE=$P6_SOURCE_TREE\"\n  echo \"P6_SOURCE_COMMIT=$P6_SOURCE_COMMIT\"\n} >> \"$GITHUB_ENV\"\n\n{\n  echo \"P6_PARENT_RUN_ID=$P6_PARENT_RUN_ID\"\
        \n  echo \"P6_PARENT_FAILURE=$P6_PARENT_FAILURE\"\n  echo \"P6_V7_FAILURE_CLASS=REAL_LINK_SPLIT_BRAIN_MANUAL_KBUILD_FORCED_SUSFS_CPP\"\n  echo \"P6_V7_FAILURE_IS_WORKFLOW_ERROR=NO\"\n  echo \"P6_V7_HYBRID_MODEL_REJECTED=YES\"\n  echo \"P6_NATIVE_KCONFIG_SUSFS=YES\"\n  echo \"P6_NATIVE_KCONFIG_MANUAL_HOOK=NO\"\n  echo \"P6_NATIVE_INLINE_HOOK_COUNT=7\"\n  echo \"P6_STATIC_EXPORT_WRITE_OP=PASS\"\n  echo \"P6_STATIC_EXPORT_SEL_HANDLE_STATUS_OPS=PASS\"\n  echo \"P6_SUSFS_DEF_CRED_INCLUDE=PASS\"\n  echo \"P6_SUSFS_UID_SEMANTICS_CHANGED=NO\"\n  echo \"P6_P4_STRUCT_FILENAME_BRIDGE_PRESERVED=YES\"\n  echo \"P6_SOURCE_CHANGED_FILE_COUNT=11\"\n  echo \"P6_SOURCE_COMPAT_CHANGE_SCOPE=PASS\"\n  echo \"P6_SOURCE_COMMIT=$P6_SOURCE_COMMIT\"\n  echo \"P6_SOURCE_TREE=$P6_SOURCE_TREE\"\n  echo \"P6_NATIVE_SUSFS_SOURCE_INTEGRATION=PASS\"\n} | tee \"$ARTIFACT_DIR/05a-source-integration.txt\"\n"
    - name: Install pinned Android clang-r416183b
      shell: bash
      run: |2

        set -euo pipefail
        url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz"
        curl --fail --location --retry 3 "$url" \
          -o "$RUNNER_TEMP/clang-r416183b.tar.gz"

        sha256sum "$RUNNER_TEMP/clang-r416183b.tar.gz" \
          | tee "$ARTIFACT_DIR/06-clang-archive.sha256"

        tar -xzf "$RUNNER_TEMP/clang-r416183b.tar.gz" -C "$TOOLCHAIN_DIR"
        echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

        "$TOOLCHAIN_DIR/bin/clang" --version \
          | tee "$ARTIFACT_DIR/06-clang-version.txt"
        "$TOOLCHAIN_DIR/bin/ld.lld" --version \
          | tee -a "$ARTIFACT_DIR/06-clang-version.txt"

        grep -q 'r416183b' "$ARTIFACT_DIR/06-clang-version.txt"

        for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-size llvm-strip
        do
          test -x "$TOOLCHAIN_DIR/bin/$tool"
        done

        {
          echo "CLANG_PREBUILT_COMMIT=$CLANG_PREBUILT_COMMIT"
          echo "CLANG_R416183B_PINNED=PASS"
        } | tee "$ARTIFACT_DIR/06-toolchain.txt"
    - name: Validate source invariants immediately before canonical Build A
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        test "$(make -s kernelversion)" = "5.4.274"
        test "$(git rev-parse HEAD^{tree})" = "$P6_SOURCE_TREE"
        test -z "$(git status --porcelain)"
        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_RESUKISU_TREE"
        test -z "$(git -C KernelSU status --porcelain)"

        grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' arch/arm64/configs/veux_defconfig
        grep -Fxq 'CONFIG_KSU_SUSFS=y' arch/arm64/configs/veux_defconfig

        for sym in \
          KSU_SUSFS_SUS_PATH \
          KSU_SUSFS_SUS_MOUNT \
          KSU_SUSFS_SUS_KSTAT \
          KSU_SUSFS_SPOOF_UNAME \
          KSU_SUSFS_ENABLE_LOG \
          KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
          KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
          KSU_SUSFS_OPEN_REDIRECT \
          KSU_SUSFS_SUS_MAP
        do
          grep -Fxq "CONFIG_${sym}=y" arch/arm64/configs/veux_defconfig
        done

        for spec in \
          'kernel/sys.c:ksu_handle_setresuid' \
          'fs/exec.c:ksu_handle_execveat' \
          'fs/open.c:ksu_handle_faccessat' \
          'fs/read_write.c:ksu_handle_sys_read' \
          'fs/stat.c:ksu_handle_stat' \
          'kernel/reboot.c:ksu_handle_sys_reboot' \
          'drivers/input/input.c:ksu_handle_input_handle_event'
        do
          file="${spec%%:*}"
          hook="${spec#*:}"
          grep -Fq "$hook" "$file"
          ! grep -wq 'CONFIG_KSU_MANUAL_HOOK' "$file"
        done

        grep -Fq 'ssize_t (*const write_op[])(struct file *, char *, size_t) = {' \
          security/selinux/selinuxfs.c
        grep -Fq 'const struct file_operations sel_handle_status_ops = {' \
          security/selinux/selinuxfs.c
        grep -Fxq '#include <linux/cred.h>' include/linux/susfs_def.h
        grep -Fq 'current_uid().val >= 10000' include/linux/susfs_def.h

        grep -Fq 'CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := 35102' KernelSU/kernel/Kbuild
        test ! -e KernelSU/kernel/feature/module_load_filter.c

        {
          echo "P6_SOURCE_INVARIANTS=PASS"
          echo "P6_NATIVE_SUSFS_DEFCONFIG=PASS"
          echo "P6_NATIVE_INLINE_HOOK_SITES=7/7=PASS"
          echo "P6_LITERAL_MANUAL_GUARDS_IN_INLINE_TARGETS=0"
          echo "P6_ARTIFICIAL_COMPILE_PREFLIGHT=NO"
          echo "P6_STANDALONE_MAKE_PREFLIGHT=NO"
          echo "P6_NEXT_COMPILER_ACTION=CANONICAL_FULL_BUILD_A"
        } | tee "$ARTIFACT_DIR/06a-source-invariants.txt"

        cat > "$ARTIFACT_DIR/05-effective-build-config.txt" <<EOF
        P6_EFFECTIVE_HOOK_MODE=NATIVE_KSU_SUSFS
        P6_KCONFIG_KSU_MANUAL_HOOK=NO
        P6_KCONFIG_KSU_SUSFS=YES
        P6_KSU_CONFIG_CPP_FORCE=NO
        P6_EFFECTIVE_KCFLAGS=$P6_EFFECTIVE_KCFLAGS
        P6_NATIVE_INLINE_HOOK_COUNT=7
        P6_KSU_VERSION=$EXPECTED_KSU_VERSION
        P6_MODULE_LOAD_FILTER_INCLUDED=NO
        EOF
    - name: Configure clean Build A native SUSFS Kconfig
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$TOOLCHAIN_DIR/bin:$PATH"

        rm -rf "$OUT_DIR"
        make O="$OUT_DIR" \
          ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
          veux_defconfig \
          2>&1 | tee "$ARTIFACT_DIR/07-build-a-config.log"

        test -s "$OUT_DIR/.config"
        grep -Fxq 'CONFIG_KSU=y' "$OUT_DIR/.config"
        grep -Fxq '# CONFIG_KSU_TRACEPOINT_HOOK is not set' "$OUT_DIR/.config"
        grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' "$OUT_DIR/.config"
        grep -Fxq 'CONFIG_KSU_SUSFS=y' "$OUT_DIR/.config"
        ! grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_' "$OUT_DIR/.config"

        for sym in \
          KSU_SUSFS_SUS_PATH \
          KSU_SUSFS_SUS_MOUNT \
          KSU_SUSFS_SUS_KSTAT \
          KSU_SUSFS_SPOOF_UNAME \
          KSU_SUSFS_ENABLE_LOG \
          KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
          KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
          KSU_SUSFS_OPEN_REDIRECT \
          KSU_SUSFS_SUS_MAP
        do
          grep -Fxq "CONFIG_${sym}=y" "$OUT_DIR/.config"
        done

        grep -Fxq 'CONFIG_KSU_MULTI_MANAGER_SUPPORT=y' "$OUT_DIR/.config"
        grep -Fxq 'CONFIG_64BIT=y' "$OUT_DIR/.config"
        grep -Fxq 'CONFIG_THREAD_INFO_IN_TASK=y' "$OUT_DIR/.config"
        grep -Fxq 'CONFIG_ARCH_QCOM=y' "$OUT_DIR/.config"
        grep -Fxq 'CONFIG_ARCH_HOLI=y' "$OUT_DIR/.config"
        grep -Fxq 'CONFIG_ARCH_BLAIR=y' "$OUT_DIR/.config"
        grep -Fxq 'CONFIG_WT_QGKI=y' "$OUT_DIR/.config"
        grep -Fxq 'CONFIG_LTO_CLANG=y' "$OUT_DIR/.config"
        grep -Fxq 'CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y' "$OUT_DIR/.config"

        cp "$OUT_DIR/.config" "$ARTIFACT_DIR/build-a.base.config"
        sha256sum "$OUT_DIR/.config" \
          | tee "$ARTIFACT_DIR/07-build-a-config.sha256"

        make -s O="$OUT_DIR" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
          kernelrelease | tee "$ARTIFACT_DIR/07-kernelrelease.txt"

        {
          echo "P6_BUILD_A_BASE_CONFIG=PASS"
          echo "P6_BUILD_A_NATIVE_SUSFS_CONFIG=PASS"
          echo "P6_BUILD_A_MANUAL_HOOK_CONFIG=NO"
        } | tee "$ARTIFACT_DIR/07-build-a-config.txt"
    - name: Full Build A Image and dtbs
      working-directory: kernel
      shell: bash
      timeout-minutes: 90
      run: |
        set -euo pipefail
        export PATH="$TOOLCHAIN_DIR/bin:$PATH"

        {
          echo "P6_BUILD_MODE=NATIVE_KCONFIG_SUSFS"
          echo "P6_CONFIG_KSU_SUSFS=FROM_DOT_CONFIG"
          echo "P6_CONFIG_KSU_MANUAL_HOOK=DISABLED"
          echo "P6_CONFIG_KSU_CPP_FORCE=NO"
          echo "KCFLAGS=$P6_EFFECTIVE_KCFLAGS"
        } | tee "$ARTIFACT_DIR/08-build-a-command.txt"

        make -j"$(nproc)" \
          O="$OUT_DIR" \
          ARCH=arm64 \
          CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
          KCFLAGS="$P6_EFFECTIVE_KCFLAGS" \
          Image dtbs \
          2>&1 | tee "$ARTIFACT_DIR/08-build-a.log"

        grep -Fq -- '-- ReSukiSU: using SuSFS Inline hook' "$ARTIFACT_DIR/08-build-a.log"
        ! grep -Fq -- '-- ReSukiSU: using Manual Hook' "$ARTIFACT_DIR/08-build-a.log"

        {
          echo "P6_BUILD_A_FULL_COMPILE=PASS"
          echo "P6_BUILD_A_RESUKISU_HOOK_MODE=NATIVE_SUSFS"
        } | tee "$ARTIFACT_DIR/08-build-a.txt"
    - name: Validate Build A outputs and full link contracts
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        export PATH="$TOOLCHAIN_DIR/bin:$PATH"

        IMAGE="$OUT_DIR/arch/arm64/boot/Image"
        VEUX_DTB="$OUT_DIR/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"
        VMLINUX="$OUT_DIR/vmlinux"
        SYSTEM_MAP="$OUT_DIR/System.map"

        test -s "$IMAGE"
        test -s "$VEUX_DTB"
        test -s "$VMLINUX"
        test -s "$SYSTEM_MAP"
        test "$(stat -c '%s' "$IMAGE")" -gt 20000000

        "$OUT_DIR/scripts/dtc/dtc" -I dtb -O dts -o /dev/null "$VEUX_DTB"

        llvm-readelf -h "$VMLINUX" > "$ARTIFACT_DIR/09-build-a-vmlinux-elf.txt"
        llvm-nm "$VMLINUX" > "$ARTIFACT_DIR/09-build-a-vmlinux-nm.txt"

        for sym in \
          ksu_handle_setresuid \
          ksu_handle_execveat \
          ksu_handle_faccessat \
          ksu_handle_sys_read \
          ksu_handle_stat \
          ksu_handle_sys_reboot \
          ksu_handle_input_handle_event \
          ksu_is_init_rc_hook_enabled \
          ksu_is_input_hook_enabled \
          susfs_init \
          susfs_open_redirect_spoof_do_sys_openat \
          susfs_open_redirect_spoof_vfs_readlink \
          susfs_open_redirect_spoof_do_proc_readlink \
          susfs_open_redirect_spoof_vfs_statfs \
          susfs_open_redirect_spoof_seq_show \
          susfs_open_redirect_spoof_show_map_vma_srcu \
          susfs_srcu_open_redirect
        do
          grep -Eq "[[:space:]][A-Za-z][[:space:]]+${sym}$" \
            "$ARTIFACT_DIR/09-build-a-vmlinux-nm.txt"
        done

        ! grep -Eq '[[:space:]][A-Za-z][[:space:]]+ksu_init_rc_hook$'   "$ARTIFACT_DIR/09-build-a-vmlinux-nm.txt"

        mkdir -p "$ARTIFACT_DIR/build-a"

        cp "$IMAGE" "$ARTIFACT_DIR/build-a/Image"
        cp "$VEUX_DTB" "$ARTIFACT_DIR/build-a/veux.dtb"
        cp "$OUT_DIR/.config" "$ARTIFACT_DIR/build-a/veux-5.4.274.base.config"

        sha256sum "$IMAGE" "$VEUX_DTB" "$VMLINUX" "$SYSTEM_MAP" "$OUT_DIR/.config" \
          > "$ARTIFACT_DIR/09-build-a-core.sha256"

        find "$OUT_DIR/arch/arm64/boot/dts" -type f -name '*.dtb' -print0 \
          | sort -z | xargs -0 sha256sum \
          > "$ARTIFACT_DIR/09-build-a-all-dtbs.sha256"
        test -s "$ARTIFACT_DIR/09-build-a-all-dtbs.sha256"
        grep -Fq 'vendor/xiaomi/veux.dtb' "$ARTIFACT_DIR/09-build-a-all-dtbs.sha256"

