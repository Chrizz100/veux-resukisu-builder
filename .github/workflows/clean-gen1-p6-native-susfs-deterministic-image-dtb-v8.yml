        \ = \"$P6_SOURCE_TREE\" \ntest -z \"$(git status --porcelain)\"\ntest \"$(git -C KernelSU rev-parse HEAD)\" = \"$EXPECTED_RESUKISU_HEAD\"\ntest \"$(git -C KernelSU rev-parse HEAD^{tree})\" = \"$EXPECTED_RESUKISU_TREE\"\ntest -z \"$(git -C KernelSU status --porcelain)\"\ntest ! -e KernelSU/kernel/feature/module_load_filter.c\n\n{\n  echo \"P6_BUILD_B_FULL_LINK_CONTRACT=PASS\"\n  echo \"P6_BUILD_B_SOURCE_IMMUTABILITY=PASS\"\n  echo \"P6_MODULE_LOAD_FILTER_INCLUDED=NO\"\n} | tee \"$ARTIFACT_DIR/14-build-b-final.txt\"\n"
    - name: Create P6 source restore kit and provenance
