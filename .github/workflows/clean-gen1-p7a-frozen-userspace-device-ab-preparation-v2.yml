    - name: Freeze complete final inventory and SHA256 closure
      shell: bash
      run: |
        set -euo pipefail

        python3 - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path

        kit = Path(os.environ["KIT_DIR"])

        def sha256(path):
            h = hashlib.sha256()
            with path.open("rb") as f:
                for chunk in iter(lambda: f.read(1024 * 1024), b""):
                    h.update(chunk)
            return h.hexdigest()

        rows = []
        for p in sorted(kit.rglob("*")):
            if not p.is_file():
                continue
            rel = p.relative_to(kit).as_posix()
            if rel in {"P7A_FILE_INVENTORY.json", "P7A_SHA256SUMS"}:
                continue
            rows.append({
                "path": rel,
                "size": p.stat().st_size,
                "sha256": sha256(p),
            })

        (kit / "P7A_FILE_INVENTORY.json").write_text(
            json.dumps(rows, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        PY

        (
          cd "$KIT_DIR"
          find . -type f \
            ! -name 'P7A_SHA256SUMS' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > P7A_SHA256SUMS
        )

        test -s "$KIT_DIR/P7A_FILE_INVENTORY.json"
        test -s "$KIT_DIR/P7A_SHA256SUMS"
