      run: |
        set -euo pipefail

        cd "$KIT_DIR"

        sha256sum -c P7A_SHA256SUMS

        python3 - <<'PY'
        import hashlib
        import json
        from pathlib import Path

        root = Path(".")
        checksum_file = root / "P7A_SHA256SUMS"
        inventory_file = root / "P7A_FILE_INVENTORY.json"

        checksum_paths = set()
        for line in checksum_file.read_text(encoding="utf-8").splitlines():
            _, rel = line.split("  ", 1)
            rel = rel[2:] if rel.startswith("./") else rel
            checksum_paths.add(rel)

        actual_non_checksum = {
            p.as_posix()[2:] if p.as_posix().startswith("./") else p.as_posix()
            for p in root.rglob("*")
            if p.is_file() and p.name != "P7A_SHA256SUMS"
        }

        if checksum_paths != actual_non_checksum:
            missing = sorted(actual_non_checksum - checksum_paths)
            extra = sorted(checksum_paths - actual_non_checksum)
            raise SystemExit(
                f"final checksum closure mismatch missing={missing} extra={extra}"
            )

        rows = json.loads(inventory_file.read_text(encoding="utf-8"))
        inv_paths = {r["path"] for r in rows}
        expected_inv = actual_non_checksum - {"P7A_FILE_INVENTORY.json"}
        if inv_paths != expected_inv:
            missing = sorted(expected_inv - inv_paths)
            extra = sorted(inv_paths - expected_inv)
            raise SystemExit(
                f"final inventory closure mismatch missing={missing} extra={extra}"
            )

        for row in rows:
            p = root / row["path"]
            data = p.read_bytes()
            got = hashlib.sha256(data).hexdigest()
            if len(data) != row["size"]:
                raise SystemExit("inventory size mismatch: " + row["path"])
            if got != row["sha256"]:
                raise SystemExit("inventory sha mismatch: " + row["path"])

        required = {
            "99-result.txt",
            "provenance/06-v1-correction.txt",
            "provenance/07-kit-manifest.txt",
            "provenance/08-pre-freeze-validation.txt",
            "P7A_MANIFEST.json",
            "P7A_FILE_INVENTORY.json",
        }
        if not required <= checksum_paths:
            raise SystemExit(
                "required final files missing from checksum closure: "
                + repr(sorted(required - checksum_paths))
            )

        print("P7A_V2_FINAL_CHECKSUM_CLOSURE=PASS")
        print("P7A_V2_FINAL_INVENTORY_CLOSURE=PASS")
        print("P7A_V2_FINAL_CHECKSUM_FILE_COUNT=" + str(len(checksum_paths)))
        print("P7A_V2_FINAL_INVENTORY_FILE_COUNT=" + str(len(inv_paths)))
        PY

        grep -Fxq 'P7A_V1_INTEGRITY_CLOSURE=INCOMPLETE' 99-result.txt
        grep -Fxq 'P7A_V1_ACCEPT_AS_FINAL_PREP_LAST_GOOD=NO' 99-result.txt
        grep -Fxq 'P7A_FINAL_INTEGRITY_FREEZE_PENDING=YES' 99-result.txt
        grep -Fxq 'P7A_REAL_DEVICE_TEST_PERFORMED=NO' 99-result.txt
        grep -Fxq 'P7B_BLOCKED_UNTIL_P7A_DEVICE_EVIDENCE=YES' 99-result.txt

        echo "CLEAN_GEN1_P7A_V2_FINAL_INTEGRITY_CLOSURE=PASS"
    - name: Upload P7-A v2 frozen-userspace A-B preparation kit
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: clean-gen1-p7a-frozen-userspace-device-ab-preparation-v2-${{ github.run_id }}
        path: ${{ env.KIT_DIR }}
        if-no-files-found: error
        retention-days: 90
