        {
          echo "KERNEL_VERSION=$(make -s kernelversion)"
          echo "IMAGE_BYTES=$(stat -c '%s' "$image")"
          echo "IMAGE_SHA256=$(sha256sum "$image" | awk '{print $1}')"
          echo "VEUX_DTB_BYTES=$(stat -c '%s' "$dtb")"
          echo "VEUX_DTB_SHA256=$(sha256sum "$dtb" | awk '{print $1}')"
          echo "VMLINUX_SHA256=$(sha256sum out-p5/vmlinux | awk '{print $1}')"
          echo "SYSTEM_MAP_SHA256=$(sha256sum out-p5/System.map | awk '{print $1}')"
          echo "CONFIG_SHA256=$(sha256sum out-p5/.config | awk '{print $1}')"
