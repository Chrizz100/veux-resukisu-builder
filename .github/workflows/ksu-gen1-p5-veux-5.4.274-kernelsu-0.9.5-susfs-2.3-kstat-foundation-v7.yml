        } > "$GITHUB_WORKSPACE/evidence/13-P5V7-BUILD-IDENTITY.txt"
    - name: 23 - Audit linked P5-v7 KSTAT foundation boundary
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V7_LINK_AUDIT" > evidence/STAGE.txt
        cd kernel

        map=out-p5/System.map

        for sym in \
          kernelsu_init \
          ksu_handle_prctl \
          ksu_handle_setuid \
          ksu_handle_faccessat \
          ksu_handle_stat \
          susfs_init \
          susfs_set_uname \
          susfs_spoof_uname \
          susfs_set_cmdline_or_bootconfig \
          susfs_spoof_cmdline_or_bootconfig \
          susfs_add_sus_kstat \
          susfs_update_sus_kstat \
          susfs_sus_kstat_spoof_generic_fillattr \
          susfs_show_version \
          susfs_get_enabled_features \
          susfs_show_variant \
          susfs_is_current_ksu_domain
        do
          grep -Eq "[[:space:]]${sym}$" "$map"
        done

        : > "$GITHUB_WORKSPACE/evidence/14-UNEXPECTED-FEATURE-SYMBOLS.txt"
        for sym in \
          susfs_add_sus_path \
          susfs_set_hide_sus_mnts_for_non_su_procs \
          susfs_add_open_redirect \
          susfs_add_sus_map
        do
          if grep -Eq "[[:space:]]${sym}$" "$map"; then
            echo "$sym" >> "$GITHUB_WORKSPACE/evidence/14-UNEXPECTED-FEATURE-SYMBOLS.txt"
          fi
        done
        test ! -s "$GITHUB_WORKSPACE/evidence/14-UNEXPECTED-FEATURE-SYMBOLS.txt"

        ! nm out-p5/fs/stat.o \
          | grep -Eq '[[:space:]]U[[:space:]]+susfs_sus_kstat_spoof_generic_fillattr$'

        grep -Fq 'susfs_clear_current_proc_umounted();' KernelSU/kernel/core_hook.c
        grep -Fq 'susfs_set_current_proc_umounted();' KernelSU/kernel/core_hook.c

        sha256sum \
          fs/stat.c \
          fs/open.c \
          kernel/sys.c \
          fs/proc/cmdline.c \
          KernelSU/kernel/sucompat.c \
          > "$RUNNER_TEMP/p5v7-protected-linked.sha256"

        cmp "$RUNNER_TEMP/p5v6-protected-outer-and-sucompat.sha256" \
            "$RUNNER_TEMP/p5v7-protected-linked.sha256"

        {
          echo "P5_V6_TIF_PROC_UMOUNTED_BRIDGE_PRESERVED=YES"
          echo "P5_V7_KSTAT_SOURCE_LINKED=YES"
          echo "P5_V7_KSTAT_ROOT_ONLY_DISPATCH_LINKED=YES"
          echo "P5_V7_KSTAT_DISPATCH_COMMAND_COUNT=3"
          echo "P5_V7_TOTAL_ROOT_ONLY_DISPATCH_COMMAND_COUNT=8"
          echo "P5_V7_KSTAT_MARK_ERROR_RETURN_FIX=YES"
          echo "P5_V7_KSTAT_GENERIC_FILLATTR_HOOK=NO"
          echo "P5_V7_KSTAT_PROC_MAPS_HOOK=NO"
          echo "P5_V7_ACTIVE_SUBOPTION_COUNT=3"
          echo "P4_STAT_FACCESSAT_BRIDGE_PRESERVED=YES"
          echo "SUS_PATH_ACTIVE=NO"
          echo "SUS_MOUNT_ACTIVE=NO"
          echo "OPEN_REDIRECT_ACTIVE=NO"
          echo "SUS_MAP_ACTIVE=NO"
          echo "PROC_MAPS_ACTIVE=NO"
          echo "P5_V7_LINKED_BOUNDARY=PASS"
        } > "$GITHUB_WORKSPACE/evidence/14-P5V7-LINKED-BOUNDARY.txt"
    - name: 24 - Create and replay-check P5-v7 restore kit
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V7_RESTORE_KIT" > evidence/STAGE.txt
        cd kernel

        cp "$RUNNER_TEMP/p5v6-to-p5v7-outer-kstat-foundation.patch" \
          "$GITHUB_WORKSPACE/restore-kit/p5v6-to-p5v7-outer-kstat-foundation.patch"

        cp "$RUNNER_TEMP/p5v6-to-p5v7-kernelsu-kstat-foundation.patch" \
          "$GITHUB_WORKSPACE/restore-kit/p5v6-to-p5v7-kernelsu-kstat-foundation.patch"

        cp "$GITHUB_WORKSPACE/p5v6-artifact/restore-kit/manifest.json" \
          "$GITHUB_WORKSPACE/restore-kit/PARENT-P5-V6-MANIFEST.json"

        cp "$GITHUB_WORKSPACE/evidence/14-P5V7-LINKED-BOUNDARY.txt" \
          "$GITHUB_WORKSPACE/restore-kit/P5V7-LINKED-BOUNDARY.txt"

        tmp="$RUNNER_TEMP/p5v7-replay"
        rm -rf "$tmp"
        mkdir -p "$tmp/fs" "$tmp/KernelSU/kernel"

        cp "$RUNNER_TEMP/p5v6-parent/susfs.c" "$tmp/fs/susfs.c"
        cp "$RUNNER_TEMP/p5v6-parent/ksu/Kconfig" "$tmp/KernelSU/kernel/Kconfig"
        cp "$RUNNER_TEMP/p5v6-parent/ksu/core_hook.c" "$tmp/KernelSU/kernel/core_hook.c"

        (
          cd "$tmp"
          patch -p1 --dry-run \
            < "$GITHUB_WORKSPACE/restore-kit/p5v6-to-p5v7-outer-kstat-foundation.patch"
          patch -p1 \
            < "$GITHUB_WORKSPACE/restore-kit/p5v6-to-p5v7-outer-kstat-foundation.patch"
        )

        (
          cd "$tmp/KernelSU"
          patch -p1 --dry-run \
            < "$GITHUB_WORKSPACE/restore-kit/p5v6-to-p5v7-kernelsu-kstat-foundation.patch"
          patch -p1 \
            < "$GITHUB_WORKSPACE/restore-kit/p5v6-to-p5v7-kernelsu-kstat-foundation.patch"
        )

        cmp "$tmp/fs/susfs.c" fs/susfs.c
        cmp "$tmp/KernelSU/kernel/Kconfig" KernelSU/kernel/Kconfig
        cmp "$tmp/KernelSU/kernel/core_hook.c" KernelSU/kernel/core_hook.c

        image_sha="$(sha256sum out-p5/arch/arm64/boot/Image | awk '{print $1}')"
        dtb_sha="$(sha256sum out-p5/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb | awk '{print $1}')"
        config_sha="$(sha256sum out-p5/.config | awk '{print $1}')"

        python3 - <<PY
        import json
        from pathlib import Path

        m = {
            "stage": "KSU-GEN1-P5-v7",
            "device": "VEUX",
            "kernel_version": "$TARGET_VERSION",
            "parent_p5_v6_pass_run_id": "$P5_V6_PASS_RUN_ID",
            "parent_p5_v6_backup_tag": "$P5_V6_PARENT_BACKUP_TAG",
            "kernelsu_head": "$KSU_COMMIT",
            "kernelsu_version": int("$KSU_EXPECTED_VERSION"),
            "susfs_source_head": "$SUSFS_SOURCE_COMMIT",
            "susfs_version": "$SUSFS_EXPECTED_VERSION",
            "config_ksu_susfs": True,
            "config_ksu_susfs_spoof_uname": True,
            "config_ksu_susfs_spoof_cmdline_or_bootconfig": True,
            "config_ksu_susfs_sus_kstat": True,
            "susfs_feature_suboptions_enabled": 3,
            "enabled_susfs_suboptions": [
                "KSU_SUSFS_SPOOF_UNAME",
                "KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG",
                "KSU_SUSFS_SUS_KSTAT"
            ],
            "root_only_user_command_dispatch": True,
            "dispatch_command_count": 8,
            "kstat_dispatch_commands": [
                "CMD_SUSFS_ADD_SUS_KSTAT",
                "CMD_SUSFS_UPDATE_SUS_KSTAT",
                "CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY"
            ],
            "kstat_foundation_only": True,
            "kstat_mark_inode_error_return_fixed": True,
            "kstat_ctime_tv_sec_flag_fixed": True,
            "kstat_generic_fillattr_hook_integrated": False,
            "kstat_proc_maps_hook_integrated": False,
            "tif_proc_umounted_bridge_integrated": True,
            "tif_proc_umounted_bit": 33,
            "as_flags_sus_kstat_bit": 35,
            "p4_stat_faccessat_bridge_preserved": True,
            "raw_user_pointer_reinterpret_cast": False,
            "sus_path_active": False,
            "sus_mount_active": False,
            "open_redirect_active": False,
            "sus_map_active": False,
            "proc_maps_changed": False,
            "namei_changed": False,
            "namespace_changed": False,
            "resukisu_integrated": False,
            "kernel_build_performed": True,
            "image_sha256": "$image_sha",
            "veux_dtb_sha256": "$dtb_sha",
            "config_sha256": "$config_sha",
            "boot_image_created": False,
            "device_accessed": False,
            "flashing_performed": False,
            "auto_github_backup_required_after_pass": True,
            "next_if_pass_and_backup_pass": "P5 KSTAT generic_fillattr hook"
        }

        Path("$GITHUB_WORKSPACE/restore-kit/manifest.json").write_text(
            json.dumps(m, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        PY

        cat > "$GITHUB_WORKSPACE/restore-kit/RESTORE-INSTRUCTIONS.txt" <<EOF
        KSU GEN1 P5-v7 KSTAT foundation recovery

        Permanent parent backup:
          $P5_V6_PARENT_BACKUP_TAG

        Parent PASS run:
          $P5_V6_PASS_RUN_ID

        Restore:
        1. Restore exact P5-v6 from its permanent GitHub recovery release.
        2. At outer kernel root apply:
           p5v6-to-p5v7-outer-kstat-foundation.patch
        3. Inside KernelSU apply:
           p5v6-to-p5v7-kernelsu-kstat-foundation.patch
        4. Enable exactly:
           CONFIG_KSU_SUSFS_SPOOF_UNAME=y
           CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
           CONFIG_KSU_SUSFS_SUS_KSTAT=y
        5. Keep SUS_PATH, SUS_MOUNT, OPEN_REDIRECT and SUS_MAP disabled.

        P5-v7 compiles the KSTAT source and exposes the three root-only KSTAT
        commands. It intentionally does NOT hook generic_fillattr or proc maps.

        It also fixes susfs_mark_inode_sus_kstat() so errors are returned rather
        than incorrectly converted to success.

        This checkpoint proves source/object/full-kernel build and link gates.
        It does not prove real-device boot or runtime KSTAT behavior.
        EOF

        {
          echo "PARENT_P5_V6_RUN=$P5_V6_PASS_RUN_ID"
          echo "PARENT_P5_V6_BACKUP_TAG=$P5_V6_PARENT_BACKUP_TAG"
          echo "P5_V7_IMAGE_SHA256=$image_sha"
          echo "P5_V7_DTB_SHA256=$dtb_sha"
          echo "P5_V7_CONFIG_SHA256=$config_sha"
          echo "P5_V7_KSTAT_FOUNDATION=PASS"
          echo "P5_V7_RESTORE_KIT=PASS"
        } > "$GITHUB_WORKSPACE/evidence/15-P5V7-PROVENANCE.txt"
    - name: 25 - Close P5-v7 technical status
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p evidence
        echo "STAGE=FINAL_STATUS" > evidence/STAGE.txt

        if grep -Fxq 'P5_V7_RESTORE_KIT=PASS' evidence/15-P5V7-PROVENANCE.txt 2>/dev/null \
          && grep -Fxq 'P5_V7_LINKED_BOUNDARY=PASS' evidence/14-P5V7-LINKED-BOUNDARY.txt 2>/dev/null \
          && grep -Fxq 'P5_V7_IMAGE_DTBS_BUILD=PASS' evidence/13-P5V7-BUILD-IDENTITY.txt 2>/dev/null; then
          technical_pass=YES
          checkpoint=KSU-GEN1-P5-KSTAT-FOUNDATION-PASS
          build_performed=YES
        else
          technical_pass=NO
          checkpoint=KSU-GEN1-P5-V7-FAILED
          if grep -Fxq 'P5_V7_IMAGE_DTBS_BUILD=PASS' evidence/13-P5V7-BUILD-IDENTITY.txt 2>/dev/null; then
            build_performed=YES
          else
            build_performed=NO
          fi
        fi

        {
          echo "JOB_STATUS_BEFORE_TECHNICAL_CLOSE=${{ job.status }}"
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          echo "TECHNICAL_PASS=$technical_pass"
          echo "CHECKPOINT=$checkpoint"
          echo "PARENT_P5_V6_RUN_ID=$P5_V6_PASS_RUN_ID"
          echo "PARENT_P5_V6_BACKUP_TAG=$P5_V6_PARENT_BACKUP_TAG"
          echo "CONFIG_KSU_SUSFS_TARGET=YES"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME_TARGET=YES"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG_TARGET=YES"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT_TARGET=YES"
          echo "SUSFS_FEATURE_SUBOPTIONS_ENABLED=3"
          echo "KSTAT_FOUNDATION_ONLY=YES"
          echo "KSTAT_GENERIC_FILLATTR_HOOK=NO"
          echo "KSTAT_PROC_MAPS_HOOK=NO"
          echo "KSTAT_MARK_ERROR_RETURN_FIX=YES"
          echo "TIF_PROC_UMOUNTED_BRIDGE=YES"
          echo "TIF_PROC_UMOUNTED_BIT=33"
          echo "USER_COMMAND_DISPATCH=ROOT_ONLY"
          echo "USER_COMMAND_DISPATCH_COMMAND_COUNT=8"
          echo "P4_STAT_FACCESSAT_BRIDGE_PRESERVED=YES"
          echo "SUS_PATH_ACTIVE=NO"
          echo "SUS_MOUNT_ACTIVE=NO"
          echo "OPEN_REDIRECT_ACTIVE=NO"
          echo "SUS_MAP_ACTIVE=NO"
          echo "PROC_MAPS_CHANGED=NO"
          echo "NAMEI_CHANGED=NO"
          echo "NAMESPACE_CHANGED=NO"
          echo "KERNEL_BUILD_PERFORMED=$build_performed"
          echo "AUTO_GITHUB_BACKUP_REQUIRED=YES"
          echo "BOOT_IMAGE_CREATED=NO"
          echo "DEVICE_ACCESSED=NO"
          echo "FLASHING_PERFORMED=NO"
        } > evidence/98-FINAL-STATUS.txt

        test "$technical_pass" = YES
      if: ${{ always() }}
    - name: 26 - Build P5-v7 SHA256 manifests
      shell: bash
      run: |
        set -euo pipefail

        for dir in evidence restore-kit build-artifacts; do
          [ -d "$dir" ] || continue
          rm -f "$dir/SHA256SUMS" "$dir/EMPTY-DIRECTORY.txt"

          (
            cd "$dir"
            count="$(
              find . -type f ! -name SHA256SUMS ! -name EMPTY-DIRECTORY.txt \
                | wc -l | tr -d ' '
            )"

            if [ "$count" -eq 0 ]; then
              {
                echo "EMPTY_DIRECTORY_AT_MANIFEST_TIME=YES"
                echo "RUN_ID=$GITHUB_RUN_ID"
              } > EMPTY-DIRECTORY.txt
            fi

            find . -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 -r sha256sum \
              > SHA256SUMS

            test -s SHA256SUMS
            ! grep -Eq '[[:space:]]SHA256SUMS$' SHA256SUMS
            sha256sum -c SHA256SUMS
          )
        done
      if: ${{ always() }}
    - name: 27 - Upload P5-v7 evidence restore kit and build outputs
      uses: actions/upload-artifact@v7
      with:
        name: ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-kstat-foundation-v7-${{ github.run_id }}
        path: 'evidence/

          restore-kit/

          build-artifacts/

          '
        retention-days: 14
        if-no-files-found: error
      if: ${{ always() }}
    - name: 28 - P5-v7 technical summary
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "# KSU GEN1 P5-v7 - KSTAT foundation"
          echo
          if grep -Fxq 'TECHNICAL_PASS=YES' evidence/98-FINAL-STATUS.txt 2>/dev/null; then
            echo "**TECHNICAL PASS**"
            echo
            echo "KSTAT source + root-only commands compile and link."
            echo "generic_fillattr and proc maps hooks remain deliberately absent."
            echo "The automatic backup job must also pass before the next P5 block."
            echo
            echo '```text'
            cat evidence/13-P5V7-BUILD-IDENTITY.txt
            cat evidence/14-P5V7-LINKED-BOUNDARY.txt
            cat evidence/15-P5V7-PROVENANCE.txt
            echo '```'
          else
            echo "**FAIL — repair only the concrete P5-v7 KSTAT foundation boundary.**"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
      if: ${{ always() }}
  backup-pass:
    name: P5-v7 - automatic permanent GitHub recovery backup
    needs:
    - p5-kstat-foundation
    if: ${{ needs.p5-kstat-foundation.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: B01 - Initialize automatic P5-v7 backup
      shell: bash
      run: |
        set -euo pipefail
        rm -rf backup-work backup-evidence
        mkdir -p backup-work backup-evidence

        tag="ksu-gen1-p5-v7-pass-backup-${GITHUB_RUN_ID}"

        {
          echo "BACKUP_WORKFLOW=KSU-GEN1-P5-V7-AUTO-GITHUB-RECOVERY"
          echo "TECHNICAL_RUN_ID=$GITHUB_RUN_ID"
          echo "PARENT_BACKUP_TAG=$P5_V6_PARENT_BACKUP_TAG"
          echo "RELEASE_TAG=$tag"
          echo "RELEASE_TARGET_SHA=$GITHUB_SHA"
          echo "RELEASE_REDOWNLOAD_REVERIFY=YES"
        } > backup-evidence/00-CONTRACT.txt

        gh release view "$P5_V6_PARENT_BACKUP_TAG" \
          --repo "$GITHUB_REPOSITORY" >/dev/null
    - name: B02 - Resolve and download exact current P5-v7 Actions artifact
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-kstat-foundation-v7-${GITHUB_RUN_ID}"

        json="$(
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
        )"

        count="$(
          jq --arg n "$artifact_name" \
            '[.artifacts[] | select(.name == $n and .expired == false)] | length' \
            <<<"$json"
        )"
        test "$count" -eq 1

        artifact_id="$(
          jq -r --arg n "$artifact_name" \
            '.artifacts[] | select(.name == $n and .expired == false) | .id' \
            <<<"$json"
        )"
        expected_digest="$(
          jq -r --arg n "$artifact_name" \
            '.artifacts[] | select(.name == $n and .expired == false) | .digest' \
            <<<"$json"
        )"

        test -n "$artifact_id"
        test "$expected_digest" != "null"
        expected_sha="${expected_digest#sha256:}"

        gh api \
          -H "Accept: application/vnd.github+json" \
          "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
          > "${artifact_name}.zip"

        test -s "${artifact_name}.zip"
        actual_sha="$(sha256sum "${artifact_name}.zip" | awk '{print $1}')"
        test "$actual_sha" = "$expected_sha"

        {
          echo "CURRENT_ARTIFACT_NAME=$artifact_name"
          echo "CURRENT_ARTIFACT_ID=$artifact_id"
          echo "CURRENT_ARTIFACT_SHA256=$actual_sha"
          echo "CURRENT_ACTIONS_ARTIFACT_AUTH=PASS"
        } > "$GITHUB_WORKSPACE/backup-evidence/01-CURRENT-ARTIFACT-AUTH.txt"
    - name: B03 - Verify internal P5-v7 PASS manifests
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-kstat-foundation-v7-${GITHUB_RUN_ID}"
        rm -rf verify-current
        mkdir verify-current
        unzip -q "${artifact_name}.zip" -d verify-current

        for dir in evidence restore-kit build-artifacts; do
          test -s "verify-current/$dir/SHA256SUMS"
          (
            cd "verify-current/$dir"
            sha256sum -c SHA256SUMS
          )
        done

        grep -Fxq 'TECHNICAL_PASS=YES' \
          verify-current/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'CHECKPOINT=KSU-GEN1-P5-KSTAT-FOUNDATION-PASS' \
          verify-current/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'P5_V7_LINKED_BOUNDARY=PASS' \
          verify-current/evidence/14-P5V7-LINKED-BOUNDARY.txt
        grep -Fxq 'P5_V7_RESTORE_KIT=PASS' \
          verify-current/evidence/15-P5V7-PROVENANCE.txt

        jq -e \
          '.stage == "KSU-GEN1-P5-v7" and
           .config_ksu_susfs_sus_kstat == true and
           .kstat_foundation_only == true and
           .kstat_mark_inode_error_return_fixed == true and
           .kstat_generic_fillattr_hook_integrated == false and
           .kstat_proc_maps_hook_integrated == false and
           .susfs_feature_suboptions_enabled == 3 and
           .kernel_build_performed == true and
           .device_accessed == false and
           .flashing_performed == false' \
          verify-current/restore-kit/manifest.json >/dev/null

        echo "CURRENT_PASS_CHAIN_AUTH=PASS" \
          > "$GITHUB_WORKSPACE/backup-evidence/02-PASS-AUTH.txt"
    - name: B04 - Prepare P5-v7 recovery release payload
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-kstat-foundation-v7-${GITHUB_RUN_ID}"
        artifact_sha="$(sha256sum "${artifact_name}.zip" | awk '{print $1}')"
        image_sha="$(sha256sum verify-current/build-artifacts/Image | awk '{print $1}')"
        config_sha="$(sha256sum verify-current/build-artifacts/config | awk '{print $1}')"
        dtb_sha="$(sha256sum verify-current/build-artifacts/veux.dtb | awk '{print $1}')"

        cp verify-current/restore-kit/manifest.json P5V7-MANIFEST.json

        cat > RECOVERY.txt <<EOF
        KSU GEN1 VEUX P5-v7 PASS Recovery Backup
        ========================================

        Technical run: $GITHUB_RUN_ID
        Parent permanent backup:
        $P5_V6_PARENT_BACKUP_TAG

        Kernel: Linux 5.4.274
        KernelSU: official v0.9.5
        SUSFS: v2.3.0

        Active SUSFS suboptions:
        - KSU_SUSFS_SPOOF_UNAME
        - KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
        - KSU_SUSFS_SUS_KSTAT

        P5-v7 KSTAT scope:
        - KSTAT source compiled
        - ADD / UPDATE / ADD_STATICALLY root-only commands active
        - susfs_mark_inode_sus_kstat() error propagation fixed
        - generic_fillattr hook NOT active
        - proc maps hook NOT active

        Image SHA256:
        $image_sha

        Config SHA256:
        $config_sha

        VEUX DTB SHA256:
        $dtb_sha

        Current complete Actions artifact SHA256:
        $artifact_sha

        This is a build/recovery checkpoint.
        No real-device runtime or flashing is claimed.
        EOF

        {
          sha256sum "${artifact_name}.zip"
          sha256sum P5V7-MANIFEST.json
          sha256sum RECOVERY.txt
        } > RELEASE-SHA256SUMS.txt
        sha256sum -c RELEASE-SHA256SUMS.txt

        cat > release-notes.md <<EOF
        Permanent recovery checkpoint after successful P5-v7.

        - VEUX / Linux 5.4.274
        - official KernelSU 0.9.5
        - SUSFS 2.3.0
        - parent backup: \`$P5_V6_PARENT_BACKUP_TAG\`
        - technical run: \`$GITHUB_RUN_ID\`

        P5-v7 activates the KSTAT source and root-only KSTAT command interface,
        but deliberately leaves generic_fillattr and proc maps hooks disabled.

        The complete Actions artifact is attached and re-downloaded after
        release creation for byte-identity verification.
        EOF

        echo "RELEASE_PAYLOAD_PREPARED=PASS" \
          > "$GITHUB_WORKSPACE/backup-evidence/03-RELEASE-PAYLOAD.txt"
    - name: B05 - Create permanent P5-v7 GitHub Release
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        tag="ksu-gen1-p5-v7-pass-backup-${GITHUB_RUN_ID}"
        title="KSU GEN1 VEUX P5-v7 PASS Recovery Backup"

        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "release already exists: $tag" >&2
          exit 1
        fi

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-kstat-foundation-v7-${GITHUB_RUN_ID}"

        gh release create "$tag" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "$title" \
          --notes-file release-notes.md \
          "${artifact_name}.zip#P5-v7 complete PASS artifact" \
          "P5V7-MANIFEST.json#P5-v7 recovery manifest" \
          "RELEASE-SHA256SUMS.txt#Release checksums" \
          "RECOVERY.txt#Recovery metadata"

        gh release view "$tag" \
          --repo "$GITHUB_REPOSITORY" \
          --json tagName,name,isDraft,isPrerelease,url,assets \
          > "$GITHUB_WORKSPACE/backup-evidence/04-RELEASE.json"

        jq -e \
          --arg tag "$tag" \
          --arg title "$title" \
          '.tagName == $tag and
           .name == $title and
           .isDraft == false and
           .isPrerelease == false and
           (.assets | length) == 4' \
          "$GITHUB_WORKSPACE/backup-evidence/04-RELEASE.json" >/dev/null

        {
          echo "GITHUB_RELEASE_CREATED=PASS"
          echo "RELEASE_TAG=$tag"
        } > "$GITHUB_WORKSPACE/backup-evidence/04-RELEASE-CREATE.txt"
    - name: B06 - Redownload P5-v7 release assets and reverify
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        tag="ksu-gen1-p5-v7-pass-backup-${GITHUB_RUN_ID}"
        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-kstat-foundation-v7-${GITHUB_RUN_ID}"

        rm -rf release-download
        mkdir release-download

        gh release download "$tag" \
          --repo "$GITHUB_REPOSITORY" \
          --dir release-download

        cmp "${artifact_name}.zip" \
          "release-download/${artifact_name}.zip"
        cmp P5V7-MANIFEST.json \
          release-download/P5V7-MANIFEST.json
        cmp RELEASE-SHA256SUMS.txt \
          release-download/RELEASE-SHA256SUMS.txt
        cmp RECOVERY.txt \
          release-download/RECOVERY.txt

        {
          echo "CURRENT_ARTIFACT_RELEASE_BYTE_IDENTITY=PASS"
          echo "MANIFEST_RELEASE_BYTE_IDENTITY=PASS"
          echo "CHECKSUM_RELEASE_BYTE_IDENTITY=PASS"
          echo "RECOVERY_METADATA_RELEASE_BYTE_IDENTITY=PASS"
          echo "RELEASE_DOWNLOAD_REVERIFY=PASS"
        } > "$GITHUB_WORKSPACE/backup-evidence/05-RELEASE-REVERIFY.txt"
    - name: B07 - Close automatic P5-v7 backup status
      shell: bash
      run: |
        set -euo pipefail

        if grep -Fxq 'GITHUB_RELEASE_CREATED=PASS' backup-evidence/04-RELEASE-CREATE.txt \
          && grep -Fxq 'RELEASE_DOWNLOAD_REVERIFY=PASS' backup-evidence/05-RELEASE-REVERIFY.txt; then
          pass=YES
          checkpoint=KSU-GEN1-P5-V7-GITHUB-RECOVERY-BACKUP-PASS
        else
          pass=NO
          checkpoint=KSU-GEN1-P5-V7-GITHUB-RECOVERY-BACKUP-FAILED
        fi

        {
          echo "BACKUP_PASS=$pass"
          echo "CHECKPOINT=$checkpoint"
          echo "TECHNICAL_RUN_ID=$GITHUB_RUN_ID"
          echo "PARENT_BACKUP_TAG=$P5_V6_PARENT_BACKUP_TAG"
          echo "RELEASE_TAG=ksu-gen1-p5-v7-pass-backup-$GITHUB_RUN_ID"
          echo "CURRENT_FULL_ARTIFACT_BACKED_UP=YES"
          echo "RELEASE_ASSETS_REDOWNLOADED_AND_REVERIFIED=$pass"
        } > backup-evidence/98-BACKUP-STATUS.txt

        test "$pass" = YES
    - name: B08 - Build automatic P5-v7 backup evidence manifest
      shell: bash
      run: |
        set -euo pipefail
        cd backup-evidence
        rm -f SHA256SUMS
        find . -type f ! -name SHA256SUMS -printf '%P\0' \
          | sort -z \
          | xargs -0 -r sha256sum \
          > SHA256SUMS
        test -s SHA256SUMS
        sha256sum -c SHA256SUMS
      if: ${{ always() }}
    - name: B09 - Upload automatic P5-v7 backup evidence
      uses: actions/upload-artifact@v7
      with:
        name: ksu-gen1-p5-v7-github-recovery-backup-evidence-${{ github.run_id }}
        path: backup-evidence/
        retention-days: 90
        if-no-files-found: error
      if: ${{ always() }}
    - name: B10 - Automatic P5-v7 backup summary
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "# P5-v7 automatic GitHub recovery backup"
          echo
          if grep -Fxq 'BACKUP_PASS=YES' backup-evidence/98-BACKUP-STATUS.txt 2>/dev/null; then
            echo "**BACKUP PASS**"
            echo
            echo "Permanent release:"
            echo "\`ksu-gen1-p5-v7-pass-backup-$GITHUB_RUN_ID\`"
            echo
            echo "The release assets were downloaded again and verified byte-for-byte."
          else
            echo "**BACKUP FAIL — do not continue to the generic_fillattr block.**"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
      if: ${{ always() }}
