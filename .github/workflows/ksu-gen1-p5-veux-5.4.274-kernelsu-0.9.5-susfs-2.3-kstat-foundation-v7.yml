name: KSU GEN1 P5 VEUX 5.4.274 KSU 0.9.5 SUSFS 2.3 KSTAT Foundation v7
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: ksu-gen1-p5-kstat-foundation-v7-${{ github.ref }}
  cancel-in-progress: false
env:
  BASE_REPOSITORY: dereference23/kernel_xiaomi_sm6375
  BASE_COMMIT: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
  BASE_TREE: 1783b5008fc971b795ccaa374efe97aa996eef49
  BASE_VERSION: 5.4.268
  ANDROID_COMMON_REPO: https://android.googlesource.com/kernel/common
  ANDROID_TAG: android11-5.4.274_r00
  ANDROID_TAG_OBJECT: b5141f9d31a3d1875523c9e1ae0d4587c144d149
  ANDROID_COMMIT: 181edea14ae07024cc87699f3cd49116e6f8fbb3
  ANDROID_TREE: 0485f492b920bf72f7f623a0df2aa3c5d7661a9c
  TARGET_VERSION: 5.4.274
  EXPECTED_P0_MERGE_COMMIT: 763f39fff62ff914200a9ac6e7e2336fdf29a6f2
  EXPECTED_P0_MERGE_TREE: a50206971cf1d1eddc259f3aba3d63f87e7ec706
  KSU_COMMIT: b766b98513b5a7eb33bc1c4a76b5702bf1288f07
  KSU_EXPECTED_VERSION: '11872'
  SUSFS_SOURCE_COMMIT: ec785f47d49f7b3871ca9356f450411020af7017
  SUSFS_EXPECTED_VERSION: v2.3.0
  P4_PASS_RUN_ID: '33939213280'
  P4_ARTIFACT_NAME: ksu-gen1-p4-veux-5.4.274-ksu-0.9.5-susfs-2.3-safe-filename-bridge-v7-33939213280
  EXPECTED_P4_IMAGE_SHA256: b28113d51b58aa48683a64c06612bfd6d70f0e09d9b5c1866581a9a1a4971885
  EXPECTED_P4_CONFIG_SHA256: 4416cdb68d8a445afb2ce64891174cfb55b9746406ec40962fc819cd591b8316
  EXPECTED_P4_DTB_SHA256: 42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37
  P5_V4_PASS_RUN_ID: '33943099824'
  P5_V4_ARTIFACT_NAME: ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-active-spoof-uname-dispatch-v4-33943099824
  EXPECTED_P5_V4_IMAGE_SHA256: 795ecd62d3fdb698088ec91c127a423fad7ef7d937d1b3f90558defd42d265e3
  EXPECTED_P5_V4_CONFIG_SHA256: 11d6708381325751743d9d9f7359c97f3b2b2b3be85f3a2a869265eed5816c94
  EXPECTED_P5_V4_DTB_SHA256: 42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37
  TOOLCHAIN_REPO: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
  TOOLCHAIN_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
  TOOLCHAIN_DIR: clang-r416183b
  EXPECTED_TOOLCHAIN_TREE_SHA256: ed560f80e2009206b25cb963c8810faecdad06b18b75cc563ef2c9b900355a1f
  EXPECTED_CLANG_SHA256: b2ce016755bddbab76549895bca07b1dc8d14a3e315b8b3567097fef04eadae1
  EXPECTED_LLD_SHA256: 51dc9705420c136f583478ac08a3258cd970710296928b3bf24dc3ee2e6208e3
  KBUILD_BUILD_USER: clean-gen1
  KBUILD_BUILD_HOST: github-actions
  KBUILD_BUILD_TIMESTAMP: Thu Apr 18 11:05:25 UTC 2024
  P5_V5_PASS_RUN_ID: '33944423405'
  P5_V5_ARTIFACT_NAME: ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-spoof-cmdline-dispatch-v5-33944423405
  P5_V5_PARENT_BACKUP_TAG: ksu-gen1-p5-v5-pass-backup-2026-09-05
  EXPECTED_P5_V5_IMAGE_SHA256: e7afccc5c914ef1119390559495c3a3cdc91b5d3395c09b9e479580413440ffb
  EXPECTED_P5_V5_CONFIG_SHA256: fdf56e4222808d307709a51557378cb3b73d55ec294009e2184eb52f24ab0b62
  EXPECTED_P5_V5_DTB_SHA256: 42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37
  P5_V6_PASS_RUN_ID: '33946690122'
  P5_V6_ARTIFACT_NAME: ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-umounted-process-state-bridge-v6-33946690122
  P5_V6_PARENT_BACKUP_TAG: ksu-gen1-p5-v6-pass-backup-33946690122
  EXPECTED_P5_V6_IMAGE_SHA256: 388400a2e39a27072d4187976e52f188fecfa397bab0ed0b315e622fd9c095e8
  EXPECTED_P5_V6_CONFIG_SHA256: fdf56e4222808d307709a51557378cb3b73d55ec294009e2184eb52f24ab0b62
  EXPECTED_P5_V6_DTB_SHA256: 42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37
jobs:
  p5-kstat-foundation:
    name: P5-v7 - KSTAT foundation only
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - name: 01 - Checkout exact fresh VEUX base
      uses: actions/checkout@v7
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
        path: kernel
        fetch-depth: 0
        filter: blob:none
    - name: 02 - Initialize P5-v7 evidence
      shell: bash
      run: |
        set -euo pipefail
        rm -rf evidence restore-kit build-artifacts p4-artifact p5v4-artifact p5v5-artifact p5v6-artifact
        mkdir -p evidence restore-kit build-artifacts p4-artifact p5v4-artifact p5v5-artifact p5v6-artifact

        {
          echo "WORKFLOW=KSU-GEN1-P5-KSTAT-FOUNDATION-v7"
          echo "DEVICE=VEUX"
          echo "TARGET_KERNEL=$TARGET_VERSION"
          echo "PARENT_P5_V5_PASS_RUN_ID=$P5_V5_PASS_RUN_ID"
          echo "PARENT_P5_V6_PASS_RUN_ID=$P5_V6_PASS_RUN_ID"
          echo "PARENT_P5_V6_BACKUP_TAG=$P5_V6_PARENT_BACKUP_TAG"
          echo "ACTIVE_SUBOPTIONS=KSU_SUSFS_SPOOF_UNAME,KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG,KSU_SUSFS_SUS_KSTAT"
          echo "SUSFS_FEATURE_SUBOPTION_COUNT=3"
          echo "NEW_SUBOPTION=KSU_SUSFS_SUS_KSTAT"
          echo "NEW_KSTAT_MODE=FOUNDATION_ONLY"
          echo "KSTAT_GENERIC_FILLATTR_HOOK=NO"
          echo "KSTAT_PROC_MAPS_HOOK=NO"
          echo "KSTAT_DISPATCH_COMMAND_COUNT=3"
          echo "TOTAL_ROOT_ONLY_SUSFS_DISPATCH_COMMAND_COUNT=8"
          echo "KSTAT_COMMANDS=ADD_SUS_KSTAT,UPDATE_SUS_KSTAT,ADD_SUS_KSTAT_STATICALLY"
          echo "KSTAT_MARK_ERROR_RETURN_FIX=YES"
          echo "KSTAT_CTIME_FLAG_FIX_ALREADY_IN_PARENT=YES"
          echo "TIF_PROC_UMOUNTED_BRIDGE_PRESERVED=YES"
          echo "TIF_PROC_UMOUNTED_BIT=33"
          echo "AS_FLAGS_SUS_KSTAT_BIT=35"
          echo "USER_COMMAND_DISPATCH=ROOT_ONLY"
          echo "ONLY_INCREMENTAL_SOURCE=fs/susfs.c,KernelSU/kernel/Kconfig,KernelSU/kernel/core_hook.c"
          echo "SUS_PATH=SUS_MOUNT=OPEN_REDIRECT=SUS_MAP=DISABLED"
          echo "PROC_MAPS_CHANGE=NO"
          echo "NAMEI_CHANGE=NO"
          echo "NAMESPACE_CHANGE=NO"
          echo "RESUKISU_INTEGRATION=NO"
          echo "AUTO_GITHUB_BACKUP_ON_PASS=YES"
          echo "BOOT_IMAGE_CREATED=NO"
          echo "DEVICE_ACCESSED=NO"
          echo "FLASHING_PERFORMED=NO"
        } > evidence/00-CONTRACT.txt

        echo "STAGE=INITIALIZED" > evidence/STAGE.txt
    - name: 03 - Install build and audit dependencies
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=DEPENDENCIES" > evidence/STAGE.txt
        sudo apt-get update
        sudo apt-get install -y \
          bc bison ca-certificates cpio curl flex git jq \
          libelf-dev libssl-dev patch python3 rsync unzip xz-utils zip zstd
    - name: 04 - Reconstruct exact deterministic P0
      shell: bash
      run: "set -euo pipefail\necho \"STAGE=P0_RECONSTRUCTION\" > evidence/STAGE.txt\ncd kernel\n\ntest \"$(git rev-parse\
        \ HEAD)\" = \"$BASE_COMMIT\"\ntest \"$(git rev-parse HEAD^{tree})\" = \"$BASE_TREE\"\ntest \"$(make -s kernelversion)\"\
        \ = \"$BASE_VERSION\"\ntest -z \"$(git status --porcelain)\"\n\ngit remote remove android >/dev/null 2>&1 || true\n\
        git remote add android \"$ANDROID_COMMON_REPO\"\ngit fetch --no-tags android \"refs/tags/${ANDROID_TAG}:refs/tags/${ANDROID_TAG}\"\
        \n\ntest \"$(git cat-file -t \"refs/tags/${ANDROID_TAG}\")\" = \"tag\"\ntest \"$(git rev-parse \"refs/tags/${ANDROID_TAG}\"\
        )\" = \"$ANDROID_TAG_OBJECT\"\ntest \"$(git rev-parse \"refs/tags/${ANDROID_TAG}^{}\")\" = \"$ANDROID_COMMIT\"\ntest\
        \ \"$(git rev-parse \"${ANDROID_COMMIT}^{tree}\")\" = \"$ANDROID_TREE\"\n\ngit config user.name \"VEUX Clean Baseline\"\
        \ngit config user.email \"veux-clean-baseline@users.noreply.github.com\"\ngit merge --no-commit --no-ff \"$ANDROID_COMMIT\"\
        \ntest \"$(make -s kernelversion)\" = \"$TARGET_VERSION\"\n\nexport GIT_AUTHOR_DATE=\"2024-04-18T11:05:25Z\"\nexport\
        \ GIT_COMMITTER_DATE=\"2024-04-18T11:05:25Z\"\ngit commit -m \"CLEAN BASELINE: merge android11-5.4.274_r00 into VEUX\
        \ 5.4.268\"\n\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_P0_MERGE_COMMIT\"\ntest \"$(git rev-parse HEAD^{tree})\"\
        \ = \"$EXPECTED_P0_MERGE_TREE\"\n\n{\n  echo \"P0_RECONSTRUCTION=PASS\"\n  echo \"P0_COMMIT=$(git rev-parse HEAD)\"\
        \n  echo \"P0_TREE=$(git rev-parse HEAD^{tree})\"\n} > \"$GITHUB_WORKSPACE/evidence/01-P0.txt\"\n"
    - name: 05 - Download exact accepted P4-v7 artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.P4_ARTIFACT_NAME }}
        path: p4-artifact
        github-token: ${{ github.token }}
        run-id: ${{ env.P4_PASS_RUN_ID }}
        repository: Chrizz100/veux-resukisu-builder
    - name: 06 - Authenticate P4-v7 checkpoint
      shell: bash
      run: "set -euo pipefail\necho \"STAGE=P4_AUTH\" > evidence/STAGE.txt\n\nfor dir in evidence restore-kit build-artifacts;\
        \ do\n  test -s \"p4-artifact/$dir/SHA256SUMS\"\n  (\n    cd \"p4-artifact/$dir\"\n    sha256sum -c SHA256SUMS\n \
        \ ) > \"evidence/02-P4-${dir}-SHA256.txt\"\ndone\n\ngrep -Fxq 'TECHNICAL_PASS=YES' p4-artifact/evidence/98-FINAL-STATUS.txt\n\
        grep -Fxq 'CHECKPOINT=KSU-GEN1-P4-SAFE-STAT-FACCESSAT-FILENAME-BRIDGE-PASS' \\\n  p4-artifact/evidence/98-FINAL-STATUS.txt\n\
        \ntest \"$(sha256sum p4-artifact/build-artifacts/Image | awk '{print $1}')\" \\\n  = \"$EXPECTED_P4_IMAGE_SHA256\"\
        \ntest \"$(sha256sum p4-artifact/build-artifacts/config | awk '{print $1}')\" \\\n  = \"$EXPECTED_P4_CONFIG_SHA256\"\
        \ntest \"$(sha256sum p4-artifact/build-artifacts/veux.dtb | awk '{print $1}')\" \\\n  = \"$EXPECTED_P4_DTB_SHA256\"\
        \n\ntest -s p4-artifact/restore-kit/p0-to-p4-outer-full.patch\ntest -s p4-artifact/restore-kit/p4-kernelsu-0.9.5-full-bridge.patch\n\
        echo \"P4_ACCEPTED_ARTIFACT_AUTH=PASS\" > evidence/02-P4-AUTH.txt\n"
    - name: 07 - Restore exact P4-v7 source
      shell: bash
      run: "set -euo pipefail\necho \"STAGE=P4_SOURCE_RESTORE\" > evidence/STAGE.txt\ncd kernel\n\nouter=\"$GITHUB_WORKSPACE/p4-artifact/restore-kit/p0-to-p4-outer-full.patch\"\
        \nksup=\"$GITHUB_WORKSPACE/p4-artifact/restore-kit/p4-kernelsu-0.9.5-full-bridge.patch\"\n\ngit apply --check --binary\
        \ \"$outer\"\ngit apply --binary \"$outer\"\n\ngit clone --filter=blob:none https://github.com/tiann/KernelSU.git\
        \ KernelSU\ngit -C KernelSU checkout --detach \"$KSU_COMMIT\"\ntest \"$(git -C KernelSU rev-parse HEAD)\" = \"$KSU_COMMIT\"\
        \n\nksu_count=\"$(git -C KernelSU rev-list --count HEAD)\"\ntest \"$((10000 + ksu_count + 200))\" = \"$KSU_EXPECTED_VERSION\"\
        \n\ntest -L drivers/kernelsu\ntest \"$(readlink drivers/kernelsu)\" = \"../KernelSU/kernel\"\ntest \"$(realpath drivers/kernelsu)\"\
        \ = \"$(realpath KernelSU/kernel)\"\n\nmkdir -p .git/info\ntouch .git/info/exclude\ngrep -Fxq '/KernelSU/' .git/info/exclude\
        \ || echo '/KernelSU/' >> .git/info/exclude\n\ngit -C KernelSU apply --check --binary \"$ksup\"\ngit -C KernelSU apply\
        \ --binary \"$ksup\"\n\n{\n  git diff --name-only \"$EXPECTED_P0_MERGE_COMMIT\" --\n  git ls-files --others --exclude-standard\n\
        } | sed '/^$/d' | LC_ALL=C sort -u > \"$RUNNER_TEMP/p4-outer-actual-paths.txt\"\n\nawk '/^diff --git a\\// {p=$3;\
        \ sub(/^a\\//,\"\",p); print p}' \"$outer\" \\\n  | LC_ALL=C sort -u > \"$RUNNER_TEMP/p4-outer-expected-paths.txt\"\
        \n\ndiff -u \"$RUNNER_TEMP/p4-outer-expected-paths.txt\" \\\n        \"$RUNNER_TEMP/p4-outer-actual-paths.txt\"\n\n\
        {\n  git -C KernelSU diff --name-only \"$KSU_COMMIT\" --\n  git -C KernelSU ls-files --others --exclude-standard\n\
        } | sed '/^$/d' | LC_ALL=C sort -u > \"$RUNNER_TEMP/p4-ksu-actual-paths.txt\"\n\nawk '/^diff --git a\\// {p=$3; sub(/^a\\\
        //,\"\",p); print p}' \"$ksup\" \\\n  | LC_ALL=C sort -u > \"$RUNNER_TEMP/p4-ksu-expected-paths.txt\"\n\ndiff -u \"\
        $RUNNER_TEMP/p4-ksu-expected-paths.txt\" \\\n        \"$RUNNER_TEMP/p4-ksu-actual-paths.txt\"\n\n{\n  echo \"P4_SOURCE_RESTORE=PASS\"\
        \n  echo \"P4_OUTER_AUTHENTICATED_PATCH_APPLY=PASS\"\n  echo \"P4_KSU_AUTHENTICATED_PATCH_APPLY=PASS\"\n  echo \"\
        P4_TRACKED_PLUS_UNTRACKED_CHANGESET_GATE=PASS\"\n} > \"$GITHUB_WORKSPACE/evidence/03-P4-SOURCE-RESTORE.txt\"\n"
    - name: 08 - Download accepted P5-v4 PASS artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.P5_V4_ARTIFACT_NAME }}
        path: p5v4-artifact
        github-token: ${{ github.token }}
        run-id: ${{ env.P5_V4_PASS_RUN_ID }}
        repository: Chrizz100/veux-resukisu-builder
    - name: 09 - Authenticate P5-v4 PASS checkpoint
      shell: bash
      run: "set -euo pipefail\necho \"STAGE=P5_V4_AUTH\" > evidence/STAGE.txt\n\nfor dir in evidence restore-kit build-artifacts;\
        \ do\n  test -s \"p5v4-artifact/$dir/SHA256SUMS\"\n  (\n    cd \"p5v4-artifact/$dir\"\n    sha256sum -c SHA256SUMS\n\
        \  ) > \"evidence/04-P5V4-${dir}-SHA256.txt\"\ndone\n\ngrep -Fxq 'TECHNICAL_PASS=YES' p5v4-artifact/evidence/98-FINAL-STATUS.txt\n\
        grep -Fxq 'CHECKPOINT=KSU-GEN1-P5-ACTIVE-SPOOF-UNAME-DISPATCH-PASS' \\\n  p5v4-artifact/evidence/98-FINAL-STATUS.txt\n\
        grep -Fxq 'P5_LINKED_BOUNDARY=PASS' \\\n  p5v4-artifact/evidence/11-P5-LINKED-BOUNDARY.txt\ngrep -Fxq 'P5_RESTORE_KIT=PASS'\
        \ \\\n  p5v4-artifact/evidence/12-P5-PROVENANCE.txt\n\ntest \"$(sha256sum p5v4-artifact/build-artifacts/Image | awk\
        \ '{print $1}')\" \\\n  = \"$EXPECTED_P5_V4_IMAGE_SHA256\"\ntest \"$(sha256sum p5v4-artifact/build-artifacts/config\
        \ | awk '{print $1}')\" \\\n  = \"$EXPECTED_P5_V4_CONFIG_SHA256\"\ntest \"$(sha256sum p5v4-artifact/build-artifacts/veux.dtb\
        \ | awk '{print $1}')\" \\\n  = \"$EXPECTED_P5_V4_DTB_SHA256\"\n\njq -e \\\n  --arg image \"$EXPECTED_P5_V4_IMAGE_SHA256\"\
        \ \\\n  --arg cfg \"$EXPECTED_P5_V4_CONFIG_SHA256\" \\\n  --arg dtb \"$EXPECTED_P5_V4_DTB_SHA256\" \\\n  '.image_sha256\
        \ == $image and\n   .config_sha256 == $cfg and\n   .veux_dtb_sha256 == $dtb and\n   .root_only_user_command_dispatch\
        \ == true and\n   .config_ksu_susfs == true and\n   .config_ksu_susfs_spoof_uname == true and\n   .susfs_feature_suboptions_enabled\
        \ == 1 and\n   .only_enabled_susfs_suboption == \"KSU_SUSFS_SPOOF_UNAME\" and\n   .kernel_build_performed == true\
        \ and\n   .device_accessed == false and\n   .flashing_performed == false' \\\n  p5v4-artifact/restore-kit/manifest.json\
        \ \\\n  > evidence/04-P5V4-MANIFEST-AUTH.json\n\ntest -s p5v4-artifact/restore-kit/p4-to-p5-outer-spoof-uname.patch\n\
        test -s p5v4-artifact/restore-kit/p4-to-p5-kernelsu-dispatch-kconfig.patch\n\necho \"P5_V4_ACCEPTED_ARTIFACT_AUTH=PASS\"\
        \ > evidence/04-P5V4-AUTH.txt\n"
    - name: 10 - Restore exact P5-v4 source on P4-v7
      shell: bash
      run: "set -euo pipefail\necho \"STAGE=P5_V4_SOURCE_RESTORE\" > evidence/STAGE.txt\ncd kernel\n\nouter_inc=\"$GITHUB_WORKSPACE/p5v4-artifact/restore-kit/p4-to-p5-outer-spoof-uname.patch\"\
        \nksu_inc=\"$GITHUB_WORKSPACE/p5v4-artifact/restore-kit/p4-to-p5-kernelsu-dispatch-kconfig.patch\"\n\npatch -p1 --dry-run\
        \ < \"$outer_inc\"\npatch -p1 < \"$outer_inc\"\n\n(\n  cd KernelSU\n  patch -p1 --dry-run < \"$ksu_inc\"\n  patch\
        \ -p1 < \"$ksu_inc\"\n)\n\ngrep -Fq 'config KSU_SUSFS_SPOOF_UNAME' KernelSU/kernel/Kconfig\ngrep -Fq 'static bool\
        \ ksu_handle_susfs_command' KernelSU/kernel/core_hook.c\ngrep -Fq 'case CMD_SUSFS_SET_UNAME:' KernelSU/kernel/core_hook.c\n\
        grep -Fq 'susfs_spoof_uname(&tmp);' kernel/sys.c\ngrep -Fq 'static_key_enabled(&susfs_is_uname_spoof_buffer_set)'\
        \ fs/susfs.c\n\ntest -f fs/proc/cmdline.c\ntest ! -e fs/proc/bootconfig.c\n\nmkdir -p \"$RUNNER_TEMP/p5v4-parent/outer\"\
        \ \"$RUNNER_TEMP/p5v4-parent/ksu\"\ncp fs/proc/cmdline.c \"$RUNNER_TEMP/p5v4-parent/outer/cmdline.c\"\ncp KernelSU/kernel/Kconfig\
        \ \"$RUNNER_TEMP/p5v4-parent/ksu/Kconfig\"\ncp KernelSU/kernel/core_hook.c \"$RUNNER_TEMP/p5v4-parent/ksu/core_hook.c\"\
        \n\nsha256sum \\\n  fs/stat.c \\\n  fs/open.c \\\n  fs/susfs.c \\\n  kernel/sys.c \\\n  KernelSU/kernel/sucompat.c\
        \ \\\n  > \"$RUNNER_TEMP/p5v4-protected-source.sha256\"\n\ncp \"$RUNNER_TEMP/p5v4-protected-source.sha256\" \\\n \
        \ \"$GITHUB_WORKSPACE/evidence/05-P5V4-PROTECTED-SOURCE-BEFORE.txt\"\n\n{\n  echo \"P5_V4_SOURCE_RESTORE=PASS\"\n\
        \  echo \"P5_V4_PARENT_RUN_ID=$P5_V4_PASS_RUN_ID\"\n  echo \"P5_V4_RESTORE_METHOD=EXACT_P4_PLUS_AUTHENTICATED_P5V4_INCREMENTAL_PATCHES\"\
        \n  echo \"VEUX_NON_GKI_CMDLINE_FILE=fs/proc/cmdline.c\"\n  echo \"VEUX_BOOTCONFIG_FILE=ABSENT\"\n} > \"$GITHUB_WORKSPACE/evidence/05-P5V4-SOURCE-RESTORE.txt\"\
        \n"
    - name: 11 - Download accepted P5-v5 PASS artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.P5_V5_ARTIFACT_NAME }}
        path: p5v5-artifact
        github-token: ${{ github.token }}
        run-id: ${{ env.P5_V5_PASS_RUN_ID }}
        repository: Chrizz100/veux-resukisu-builder
    - name: 12 - Authenticate exact P5-v5 PASS checkpoint
      shell: bash
      run: "set -euo pipefail\necho \"STAGE=P5_V5_AUTH\" > evidence/STAGE.txt\n\nfor dir in evidence restore-kit build-artifacts;\
        \ do\n  test -s \"p5v5-artifact/$dir/SHA256SUMS\"\n  (\n    cd \"p5v5-artifact/$dir\"\n    sha256sum -c SHA256SUMS\n\
        \  ) > \"evidence/05-P5V5-${dir}-SHA256.txt\"\ndone\n\ngrep -Fxq 'TECHNICAL_PASS=YES' p5v5-artifact/evidence/98-FINAL-STATUS.txt\n\
        grep -Fxq 'CHECKPOINT=KSU-GEN1-P5-SPOOF-CMDLINE-DISPATCH-PASS' \\\n  p5v5-artifact/evidence/98-FINAL-STATUS.txt\n\
        grep -Fxq 'P5_V5_LINKED_BOUNDARY=PASS' \\\n  p5v5-artifact/evidence/12-P5V5-LINKED-BOUNDARY.txt\ngrep -Fxq 'P5_V5_RESTORE_KIT=PASS'\
        \ \\\n  p5v5-artifact/evidence/13-P5V5-PROVENANCE.txt\n\ntest \"$(sha256sum p5v5-artifact/build-artifacts/Image |\
        \ awk '{print $1}')\" \\\n  = \"$EXPECTED_P5_V5_IMAGE_SHA256\"\ntest \"$(sha256sum p5v5-artifact/build-artifacts/config\
        \ | awk '{print $1}')\" \\\n  = \"$EXPECTED_P5_V5_CONFIG_SHA256\"\ntest \"$(sha256sum p5v5-artifact/build-artifacts/veux.dtb\
        \ | awk '{print $1}')\" \\\n  = \"$EXPECTED_P5_V5_DTB_SHA256\"\n\njq -e \\\n  --arg image \"$EXPECTED_P5_V5_IMAGE_SHA256\"\
        \ \\\n  --arg cfg \"$EXPECTED_P5_V5_CONFIG_SHA256\" \\\n  --arg dtb \"$EXPECTED_P5_V5_DTB_SHA256\" \\\n  '.stage ==\
        \ \"KSU-GEN1-P5-v5\" and\n   .image_sha256 == $image and\n   .config_sha256 == $cfg and\n   .veux_dtb_sha256 == $dtb\
        \ and\n   .root_only_user_command_dispatch == true and\n   .config_ksu_susfs == true and\n   .config_ksu_susfs_spoof_uname\
        \ == true and\n   .config_ksu_susfs_spoof_cmdline_or_bootconfig == true and\n   .susfs_feature_suboptions_enabled\
        \ == 2 and\n   .sus_path_active == false and\n   .sus_mount_active == false and\n   .sus_kstat_active == false and\n\
        \   .open_redirect_active == false and\n   .sus_map_active == false and\n   .kernel_build_performed == true and\n\
        \   .device_accessed == false and\n   .flashing_performed == false' \\\n  p5v5-artifact/restore-kit/manifest.json\
        \ \\\n  > evidence/05-P5V5-MANIFEST-AUTH.json\n\ntest -s p5v5-artifact/restore-kit/p5v4-to-p5v5-outer-cmdline.patch\n\
        test -s p5v5-artifact/restore-kit/p5v4-to-p5v5-kernelsu-dispatch-kconfig.patch\n\necho \"P5_V5_ACCEPTED_ARTIFACT_AUTH=PASS\"\
        \ > evidence/05-P5V5-AUTH.txt\n"
    - name: 13 - Restore exact P5-v5 source and snapshot parent
      shell: bash
      run: "set -euo pipefail\necho \"STAGE=P5_V5_SOURCE_RESTORE\" > evidence/STAGE.txt\ncd kernel\n\nouter_inc=\"$GITHUB_WORKSPACE/p5v5-artifact/restore-kit/p5v4-to-p5v5-outer-cmdline.patch\"\
        \nksu_inc=\"$GITHUB_WORKSPACE/p5v5-artifact/restore-kit/p5v4-to-p5v5-kernelsu-dispatch-kconfig.patch\"\n\npatch -p1\
        \ --dry-run < \"$outer_inc\"\npatch -p1 < \"$outer_inc\"\n\n(\n  cd KernelSU\n  patch -p1 --dry-run < \"$ksu_inc\"\
        \n  patch -p1 < \"$ksu_inc\"\n)\n\ngrep -Fq 'config KSU_SUSFS_SPOOF_UNAME' KernelSU/kernel/Kconfig\ngrep -Fq 'config\
        \ KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG' KernelSU/kernel/Kconfig\ngrep -Fq 'case CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG:'\
        \ KernelSU/kernel/core_hook.c\ngrep -Fq 'susfs_spoof_cmdline_or_bootconfig(m)' fs/proc/cmdline.c\ntest \"$(grep -Ec\
        \ '^config KSU_SUSFS_' KernelSU/kernel/Kconfig)\" -eq 2\n\nmkdir -p \"$RUNNER_TEMP/p5v5-parent/ksu\"\ncp KernelSU/kernel/core_hook.c\
        \ \"$RUNNER_TEMP/p5v5-parent/ksu/core_hook.c\"\ncp KernelSU/kernel/Kconfig \"$RUNNER_TEMP/p5v5-parent/ksu/Kconfig\"\
        \n\nsha256sum \\\n  fs/stat.c \\\n  fs/open.c \\\n  fs/susfs.c \\\n  kernel/sys.c \\\n  fs/proc/cmdline.c \\\n  KernelSU/kernel/sucompat.c\
        \ \\\n  KernelSU/kernel/Kconfig \\\n  > \"$RUNNER_TEMP/p5v5-protected-source.sha256\"\n\ncp \"$RUNNER_TEMP/p5v5-protected-source.sha256\"\
        \ \\\n  \"$GITHUB_WORKSPACE/evidence/06-P5V5-PROTECTED-SOURCE-BEFORE.txt\"\n\n{\n  echo \"P5_V5_SOURCE_RESTORE=PASS\"\
        \n  echo \"P5_V5_PARENT_RUN_ID=$P5_V5_PASS_RUN_ID\"\n  echo \"P5_V5_PARENT_BACKUP_TAG=$P5_V5_PARENT_BACKUP_TAG\"\n\
        \  echo \"P5_V5_ACTIVE_SUBOPTIONS=2\"\n  echo \"P5_V5_ROOT_ONLY_DISPATCH_COMMANDS=5\"\n} > \"$GITHUB_WORKSPACE/evidence/06-P5V5-SOURCE-RESTORE.txt\"\
        \n"
    - name: 14 - Download accepted P5-v6 PASS artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.P5_V6_ARTIFACT_NAME }}
        path: p5v6-artifact
        github-token: ${{ github.token }}
        run-id: ${{ env.P5_V6_PASS_RUN_ID }}
        repository: Chrizz100/veux-resukisu-builder
    - name: 15 - Authenticate exact P5-v6 PASS checkpoint
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V6_AUTH" > evidence/STAGE.txt

        for dir in evidence restore-kit build-artifacts; do
          test -s "p5v6-artifact/$dir/SHA256SUMS"
          (
            cd "p5v6-artifact/$dir"
            sha256sum -c SHA256SUMS
          ) > "evidence/07-P5V6-${dir}-SHA256.txt"
        done

        grep -Fxq 'TECHNICAL_PASS=YES' p5v6-artifact/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'CHECKPOINT=KSU-GEN1-P5-UMOUNTED-PROCESS-STATE-BRIDGE-PASS' \
          p5v6-artifact/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'P5_V6_LINKED_BOUNDARY=PASS' \
          p5v6-artifact/evidence/13-P5V6-LINKED-BOUNDARY.txt
        grep -Fxq 'P5_V6_RESTORE_KIT=PASS' \
          p5v6-artifact/evidence/14-P5V6-PROVENANCE.txt

        test "$(sha256sum p5v6-artifact/build-artifacts/Image | awk '{print $1}')" \
          = "$EXPECTED_P5_V6_IMAGE_SHA256"
        test "$(sha256sum p5v6-artifact/build-artifacts/config | awk '{print $1}')" \
          = "$EXPECTED_P5_V6_CONFIG_SHA256"
        test "$(sha256sum p5v6-artifact/build-artifacts/veux.dtb | awk '{print $1}')" \
          = "$EXPECTED_P5_V6_DTB_SHA256"

        jq -e \
          --arg image "$EXPECTED_P5_V6_IMAGE_SHA256" \
          --arg cfg "$EXPECTED_P5_V6_CONFIG_SHA256" \
          --arg dtb "$EXPECTED_P5_V6_DTB_SHA256" \
          '.stage == "KSU-GEN1-P5-v6" and
           .image_sha256 == $image and
           .config_sha256 == $cfg and
           .veux_dtb_sha256 == $dtb and
           .root_only_user_command_dispatch == true and
           .dispatch_command_count == 5 and
           .tif_proc_umounted_bridge_integrated == true and
           .tif_proc_umounted_bit == 33 and
           .tif_proc_no_su_bridge_integrated == false and
           .zygote_next_bridge_integrated == false and
           .susfs_feature_suboptions_enabled == 2 and
           .sus_kstat_active == false and
           .open_redirect_active == false and
           .sus_map_active == false and
           .kernel_build_performed == true and
           .device_accessed == false and
           .flashing_performed == false' \
          p5v6-artifact/restore-kit/manifest.json \
          > evidence/07-P5V6-MANIFEST-AUTH.json

        test -s p5v6-artifact/restore-kit/p5v5-to-p5v6-kernelsu-umounted-process-state.patch

        echo "P5_V6_ACCEPTED_ARTIFACT_AUTH=PASS" > evidence/07-P5V6-AUTH.txt
    - name: 16 - Restore exact P5-v6 source and snapshot parent
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V6_SOURCE_RESTORE" > evidence/STAGE.txt
        cd kernel

        p5v6_patch="$GITHUB_WORKSPACE/p5v6-artifact/restore-kit/p5v5-to-p5v6-kernelsu-umounted-process-state.patch"

        (
          cd KernelSU
          patch -p1 --dry-run < "$p5v6_patch"
          patch -p1 < "$p5v6_patch"
        )

        grep -Fq 'susfs_clear_current_proc_umounted();' KernelSU/kernel/core_hook.c
        grep -Fq 'susfs_set_current_proc_umounted();' KernelSU/kernel/core_hook.c
        grep -Fq 'config KSU_SUSFS_SPOOF_UNAME' KernelSU/kernel/Kconfig
        grep -Fq 'config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG' KernelSU/kernel/Kconfig
        ! grep -Fq 'config KSU_SUSFS_SUS_KSTAT' KernelSU/kernel/Kconfig
        test "$(grep -Ec '^config KSU_SUSFS_' KernelSU/kernel/Kconfig)" -eq 2

        mkdir -p "$RUNNER_TEMP/p5v6-parent/ksu"
        cp KernelSU/kernel/Kconfig "$RUNNER_TEMP/p5v6-parent/ksu/Kconfig"
        cp KernelSU/kernel/core_hook.c "$RUNNER_TEMP/p5v6-parent/ksu/core_hook.c"
        cp fs/susfs.c "$RUNNER_TEMP/p5v6-parent/susfs.c"

        sha256sum \
          fs/stat.c \
          fs/open.c \
          kernel/sys.c \
          fs/proc/cmdline.c \
          KernelSU/kernel/sucompat.c \
          > "$RUNNER_TEMP/p5v6-protected-outer-and-sucompat.sha256"

        cp "$RUNNER_TEMP/p5v6-protected-outer-and-sucompat.sha256" \
          "$GITHUB_WORKSPACE/evidence/08-P5V6-PROTECTED-SOURCE-BEFORE.txt"

        {
          echo "P5_V6_SOURCE_RESTORE=PASS"
          echo "P5_V6_PARENT_RUN_ID=$P5_V6_PASS_RUN_ID"
          echo "P5_V6_PARENT_BACKUP_TAG=$P5_V6_PARENT_BACKUP_TAG"
          echo "P5_V6_ACTIVE_SUBOPTIONS=2"
          echo "P5_V6_ROOT_ONLY_DISPATCH_COMMANDS=5"
          echo "P5_V6_TIF_PROC_UMOUNTED_BRIDGE=YES"
        } > "$GITHUB_WORKSPACE/evidence/08-P5V6-SOURCE-RESTORE.txt"
    - name: 17 - Audit and activate KSTAT foundation only
      shell: bash
      run: "set -euo pipefail\necho \"STAGE=P5_V7_KSTAT_FOUNDATION\" > evidence/STAGE.txt\ncd kernel\n\npython3 - <<'PY' >\
        \ \"$GITHUB_WORKSPACE/evidence/09-P5V7-KSTAT-PRE-AUDIT.txt\"\nfrom pathlib import Path\nimport re\n\nsus = Path(\"\
        fs/susfs.c\").read_text(encoding=\"utf-8\")\nhdr = Path(\"include/linux/susfs.h\").read_text(encoding=\"utf-8\")\n\
        defs = Path(\"include/linux/susfs_def.h\").read_text(encoding=\"utf-8\")\ncfg = Path(\"KernelSU/kernel/Kconfig\").read_text(encoding=\"\
        utf-8\")\ncore = Path(\"KernelSU/kernel/core_hook.c\").read_text(encoding=\"utf-8\")\nstatc = Path(\"fs/stat.c\").read_text(encoding=\"\
        utf-8\")\npagemap = Path(\"include/linux/pagemap.h\").read_text(encoding=\"utf-8\")\n\nchecks = {\n    \"KSTAT_SOURCE_ADD_PRESENT\"\
        :\n        \"void susfs_add_sus_kstat(void __user **user_info)\" in sus,\n    \"KSTAT_SOURCE_UPDATE_PRESENT\":\n \
        \       \"void susfs_update_sus_kstat(void __user **user_info)\" in sus,\n    \"KSTAT_SOURCE_GENERIC_FILLATTR_PRESENT\"\
        :\n        \"void susfs_sus_kstat_spoof_generic_fillattr(struct inode *inode, struct kstat *stat)\" in sus,\n    \"\
        KSTAT_HEADER_ADD_PRESENT\":\n        \"void susfs_add_sus_kstat(void __user **user_info);\" in hdr,\n    \"KSTAT_HEADER_UPDATE_PRESENT\"\
        :\n        \"void susfs_update_sus_kstat(void __user **user_info);\" in hdr,\n    \"CMD_ADD_PRESENT\":\n        \"\
        #define CMD_SUSFS_ADD_SUS_KSTAT 0x55570\" in defs,\n    \"CMD_UPDATE_PRESENT\":\n        \"#define CMD_SUSFS_UPDATE_SUS_KSTAT\
        \ 0x55571\" in defs,\n    \"CMD_STATIC_PRESENT\":\n        \"#define CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY 0x55572\"\
        \ in defs,\n    \"KSTAT_CTIME_FLAG_FIXED\":\n        \"#define KSTAT_SPOOF_CTIME_TV_SEC (1 << 8)\" in hdr,\n    \"\
        AS_FLAGS_KSTAT_35\":\n        \"#define AS_FLAGS_SUS_KSTAT 35\" in defs,\n    \"TIF_PROC_UMOUNTED_33\":\n        re.search(r\"\
        ^#define\\s+TIF_PROC_UMOUNTED\\s+33\\s*$\", defs, re.M) is not None,\n    \"P5_V6_SET_STATE_PRESENT\":\n        \"\
        susfs_set_current_proc_umounted();\" in core,\n    \"P5_V6_CLEAR_STATE_PRESENT\":\n        \"susfs_clear_current_proc_umounted();\"\
        \ in core,\n    \"KSTAT_CONFIG_NOT_YET_PRESENT\":\n        \"config KSU_SUSFS_SUS_KSTAT\" not in cfg,\n    \"KSTAT_DISPATCH_NOT_YET_PRESENT\"\
        :\n        \"case CMD_SUSFS_ADD_SUS_KSTAT:\" not in core,\n    \"GENERIC_FILLATTR_NOT_YET_HOOKED\":\n        \"susfs_sus_kstat_spoof_generic_fillattr\"\
        \ not in statc,\n    \"BASE_MAPPING_FLAGS_LOW_ONLY\":\n        \"AS_NO_WRITEBACK_TAGS = 5\" in pagemap,\n}\n\nfor\
        \ key, ok in checks.items():\n    print(f\"{key}={'PASS' if ok else 'FAIL'}\")\n\nfailed = [key for key, ok in checks.items()\
        \ if not ok]\nif failed:\n    raise SystemExit(\"P5-v7 KSTAT prerequisite failure: \" + \", \".join(failed))\n\nprint(\"\
        P5_V7_KSTAT_PRE_ACTIVATION_AUDIT=PASS\")\nPY\n\npython3 - <<'PY'\nfrom pathlib import Path\n\n# Kconfig: one new feature\
        \ suboption only.\np = Path(\"KernelSU/kernel/Kconfig\")\nt = p.read_text(encoding=\"utf-8\")\n\nif \"config KSU_SUSFS_SUS_KSTAT\"\
        \ in t:\n    raise SystemExit(\"KSTAT config unexpectedly already present\")\nif t.count(\"\\nendmenu\\n\") != 1:\n\
        \    raise SystemExit(\"Kconfig endmenu mismatch\")\n\nblock = \"\"\"\nconfig KSU_SUSFS_SUS_KSTAT\n\tbool \"SUSFS:\
        \ KSTAT foundation\"\n\tdepends on KSU_SUSFS\n\tdefault n\n\thelp\n\t  Compile the SUSFS KSTAT source and root-only\
        \ command interface.\n\t  P5-v7 intentionally does not hook generic_fillattr or proc maps yet.\n\n\"\"\"\nt = t.replace(\"\
        \\nendmenu\\n\", \"\\n\" + block + \"endmenu\\n\", 1)\np.write_text(t, encoding=\"utf-8\")\n\n# Root-only dispatcher:\
        \ add exactly three KSTAT commands.\np = Path(\"KernelSU/kernel/core_hook.c\")\nt = p.read_text(encoding=\"utf-8\"\
        )\n\nanchor = \"\"\"#endif\n\tcase CMD_SUSFS_SHOW_VERSION:\n\"\"\"\nif t.count(anchor) != 1:\n    raise SystemExit(\"\
        dispatcher insertion anchor mismatch\")\n\naddition = \"\"\"#endif\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n\tcase CMD_SUSFS_ADD_SUS_KSTAT:\n\
        \t\tsusfs_add_sus_kstat(&user_info);\n\t\treturn true;\n\tcase CMD_SUSFS_UPDATE_SUS_KSTAT:\n\t\tsusfs_update_sus_kstat(&user_info);\n\
        \t\treturn true;\n\tcase CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY:\n\t\tsusfs_add_sus_kstat(&user_info);\n\t\treturn true;\n\
        #endif\n\tcase CMD_SUSFS_SHOW_VERSION:\n\"\"\"\nt = t.replace(anchor, addition, 1)\np.write_text(t, encoding=\"utf-8\"\
        )\n\n# Fix known 2.3 adaptation bug before exposing KSTAT commands:\n# susfs_mark_inode_sus_kstat() must propagate\
        \ the local error.\np = Path(\"fs/susfs.c\")\nt = p.read_text(encoding=\"utf-8\")\n\nsig = \"static int susfs_mark_inode_sus_kstat(char\
        \ *target_pathname, struct st_susfs_sus_kstat_hlist *new_entry)\"\nif t.count(sig) != 1:\n    raise SystemExit(\"\
        susfs_mark_inode_sus_kstat count mismatch\")\n\nstart = t.index(sig)\nend = t.index(\"\\n}\\n\\nvoid susfs_add_sus_kstat\"\
        , start) + 3\nfn = t[start:end]\n\nbad = \"out_path_put_path:\\n\\tpath_put(&path);\\n\\treturn 0;\\n\"\ngood = \"\
        out_path_put_path:\\n\\tpath_put(&path);\\n\\treturn err;\\n\"\n\nif fn.count(bad) != 1:\n    raise SystemExit(\"\
        KSTAT error-return adaptation anchor mismatch\")\nfn = fn.replace(bad, good, 1)\n\nt = t[:start] + fn + t[end:]\n\
        p.write_text(t, encoding=\"utf-8\")\nPY\n\ngit -C KernelSU diff --check -- kernel/Kconfig kernel/core_hook.c\n\npython3\
        \ - <<'PY' > \"$GITHUB_WORKSPACE/evidence/09-P5V7-KSTAT-SOURCE-AUDIT.txt\"\nfrom pathlib import Path\nimport re\n\n\
        sus = Path(\"fs/susfs.c\").read_text(encoding=\"utf-8\")\ncfg = Path(\"KernelSU/kernel/Kconfig\").read_text(encoding=\"\
        utf-8\")\ncore = Path(\"KernelSU/kernel/core_hook.c\").read_text(encoding=\"utf-8\")\nstatc = Path(\"fs/stat.c\").read_text(encoding=\"\
        utf-8\")\n\nassert cfg.count(\"config KSU_SUSFS_SPOOF_UNAME\") == 1\nassert cfg.count(\"config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\"\
        ) == 1\nassert cfg.count(\"config KSU_SUSFS_SUS_KSTAT\") == 1\nassert len(re.findall(r\"^config KSU_SUSFS_[A-Z0-9_]+$\"\
        , cfg, re.M)) == 3\n\ndstart = core.index(\"static bool ksu_handle_susfs_command\")\ndend = core.index(\"int ksu_handle_prctl\"\
        , dstart)\ndispatch = core[dstart:dend]\ncases = set(re.findall(r\"case (CMD_SUSFS_[A-Z0-9_]+):\", dispatch))\nexpected\
        \ = {\n    \"CMD_SUSFS_SET_UNAME\",\n    \"CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG\",\n    \"CMD_SUSFS_ADD_SUS_KSTAT\"\
        ,\n    \"CMD_SUSFS_UPDATE_SUS_KSTAT\",\n    \"CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY\",\n    \"CMD_SUSFS_SHOW_VERSION\"\
        ,\n    \"CMD_SUSFS_SHOW_ENABLED_FEATURES\",\n    \"CMD_SUSFS_SHOW_VARIANT\",\n}\nassert cases == expected\nassert\
        \ \"if (from_root && ksu_handle_susfs_command(arg2, arg3))\" in core\n\nsig = \"static int susfs_mark_inode_sus_kstat(char\
        \ *target_pathname, struct st_susfs_sus_kstat_hlist *new_entry)\"\nstart = sus.index(sig)\nend = sus.index(\"\\n}\\\
        n\\nvoid susfs_add_sus_kstat\", start) + 3\nmark_fn = sus[start:end]\nassert \"out_path_put_path:\\n\\tpath_put(&path);\\\
        n\\treturn err;\\n\" in mark_fn\nassert \"out_path_put_path:\\n\\tpath_put(&path);\\n\\treturn 0;\\n\" not in mark_fn\n\
        \nassert \"susfs_sus_kstat_spoof_generic_fillattr\" not in statc\n\nassert core.count(\"susfs_add_sus_kstat(&user_info);\"\
        ) == 2\nassert core.count(\"susfs_update_sus_kstat(&user_info);\") == 1\n\nprint(\"P5_V7_KSTAT_CONFIG=PASS\")\nprint(\"\
        P5_V7_KSTAT_ROOT_ONLY_DISPATCH=PASS\")\nprint(\"P5_V7_KSTAT_DISPATCH_COMMAND_COUNT=3\")\nprint(\"P5_V7_TOTAL_ROOT_ONLY_DISPATCH_COMMAND_COUNT=8\"\
        )\nprint(\"P5_V7_KSTAT_MARK_ERROR_RETURN_FIX=PASS\")\nprint(\"P5_V7_GENERIC_FILLATTR_HOOK=DEFERRED\")\nprint(\"P5_V7_PROC_MAPS_HOOK=DEFERRED\"\
        )\nprint(\"P5_V7_KSTAT_SOURCE_ACTIVATION=PASS\")\nPY\n"
    - name: 18 - Prove exact P5-v7 incremental scope
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V7_SCOPE_GATE" > evidence/STAGE.txt
        cd kernel

        sha256sum \
          fs/stat.c \
          fs/open.c \
          kernel/sys.c \
          fs/proc/cmdline.c \
          KernelSU/kernel/sucompat.c \
          > "$RUNNER_TEMP/p5v7-protected-outer-and-sucompat.sha256"

        cmp "$RUNNER_TEMP/p5v6-protected-outer-and-sucompat.sha256" \
            "$RUNNER_TEMP/p5v7-protected-outer-and-sucompat.sha256"

        cp "$RUNNER_TEMP/p5v7-protected-outer-and-sucompat.sha256" \
          "$GITHUB_WORKSPACE/evidence/10-P5V7-PROTECTED-SOURCE-AFTER.txt"

        diff -u \
          --label a/fs/susfs.c \
          --label b/fs/susfs.c \
          "$RUNNER_TEMP/p5v6-parent/susfs.c" \
          fs/susfs.c \
          > "$RUNNER_TEMP/p5v6-to-p5v7-outer-kstat-foundation.patch" || test $? -eq 1

        {
          diff -u \
            --label a/kernel/Kconfig \
            --label b/kernel/Kconfig \
            "$RUNNER_TEMP/p5v6-parent/ksu/Kconfig" \
            KernelSU/kernel/Kconfig || test $? -eq 1

          diff -u \
            --label a/kernel/core_hook.c \
            --label b/kernel/core_hook.c \
            "$RUNNER_TEMP/p5v6-parent/ksu/core_hook.c" \
            KernelSU/kernel/core_hook.c || test $? -eq 1
        } > "$RUNNER_TEMP/p5v6-to-p5v7-kernelsu-kstat-foundation.patch"

        test -s "$RUNNER_TEMP/p5v6-to-p5v7-outer-kstat-foundation.patch"
        test -s "$RUNNER_TEMP/p5v6-to-p5v7-kernelsu-kstat-foundation.patch"

        test "$(grep -c '^+++ b/fs/susfs.c$' "$RUNNER_TEMP/p5v6-to-p5v7-outer-kstat-foundation.patch")" -eq 1
        test "$(grep -c '^+++ b/kernel/Kconfig$' "$RUNNER_TEMP/p5v6-to-p5v7-kernelsu-kstat-foundation.patch")" -eq 1
        test "$(grep -c '^+++ b/kernel/core_hook.c$' "$RUNNER_TEMP/p5v6-to-p5v7-kernelsu-kstat-foundation.patch")" -eq 1

        test "$(grep -Ec '^config KSU_SUSFS_' KernelSU/kernel/Kconfig)" -eq 3

        {
          echo "P5_V6_PROTECTED_SOURCE_BYTE_IDENTICAL=YES"
          echo "P5_V7_INCREMENTAL_OUTER_SCOPE=fs/susfs.c"
          echo "P5_V7_INCREMENTAL_KSU_SCOPE=kernel/Kconfig,kernel/core_hook.c"
          echo "P5_V7_NEW_SUBOPTION=KSU_SUSFS_SUS_KSTAT"
          echo "P5_V7_ACTIVE_SUBOPTION_COUNT=3"
          echo "P5_V7_GENERIC_FILLATTR_CHANGED=NO"
          echo "P5_V7_PROC_MAPS_CHANGED=NO"
          echo "P5_V7_NAMEI_CHANGED=NO"
          echo "P5_V7_NAMESPACE_CHANGED=NO"
          echo "P5_V7_OPEN_REDIRECT_CHANGED=NO"
          echo "P5_V7_SCOPE_GATE=PASS"
        } > "$GITHUB_WORKSPACE/evidence/10-P5V7-SCOPE.txt"
    - name: 19 - Download and authenticate pinned clang-r416183b
      shell: bash
      run: "set -euo pipefail\necho \"STAGE=TOOLCHAIN\" > evidence/STAGE.txt\n\nroot=\"$RUNNER_TEMP/p5-toolchain\"\narchive=\"\
        $RUNNER_TEMP/${TOOLCHAIN_DIR}.tar.gz\"\nrm -rf \"$root\" \"$archive\"\nmkdir -p \"$root\"\n\nurl=\"${TOOLCHAIN_REPO}/+archive/${TOOLCHAIN_COMMIT}/${TOOLCHAIN_DIR}.tar.gz\"\
        \ncurl --fail --location --retry 4 --retry-delay 2 --retry-all-errors \\\n  -H 'Cache-Control: no-cache' \"$url\"\
        \ -o \"$archive\"\ntar -xzf \"$archive\" -C \"$root\"\n\npython3 - \"$root\" \"$GITHUB_WORKSPACE/evidence/08-TOOLCHAIN-TREE.tsv\"\
        \ <<'PY'\nimport hashlib\nimport os\nimport stat\nimport sys\nfrom pathlib import Path\n\nroot = Path(sys.argv[1]).resolve()\n\
        out = Path(sys.argv[2])\nrows = []\n\nfor p in sorted(root.rglob(\"*\"), key=lambda x: x.relative_to(root).as_posix()):\n\
        \    rel = p.relative_to(root).as_posix()\n    st = p.lstat()\n    mode = stat.S_IMODE(st.st_mode)\n    if p.is_symlink():\n\
        \        rows.append(f\"L\\t{mode:04o}\\t{rel}\\t{os.readlink(p)}\")\n    elif p.is_dir():\n        rows.append(f\"\
        D\\t{mode:04o}\\t{rel}\")\n    elif p.is_file():\n        h = hashlib.sha256()\n        with p.open(\"rb\") as f:\n\
        \            for chunk in iter(lambda: f.read(1024 * 1024), b\"\"):\n                h.update(chunk)\n        rows.append(\n\
        \            f\"F\\t{mode:04o}\\t{rel}\\t{st.st_size}\\t{h.hexdigest()}\"\n        )\n\nout.write_text(\"\\n\".join(rows)\
        \ + \"\\n\", encoding=\"utf-8\")\nPY\n\ntree_sha=\"$(sha256sum evidence/08-TOOLCHAIN-TREE.tsv | awk '{print $1}')\"\
        \nclang_sha=\"$(sha256sum \"$root/bin/clang\" | awk '{print $1}')\"\nlld_sha=\"$(sha256sum \"$root/bin/ld.lld\" |\
        \ awk '{print $1}')\"\n\ntest \"$tree_sha\" = \"$EXPECTED_TOOLCHAIN_TREE_SHA256\"\ntest \"$clang_sha\" = \"$EXPECTED_CLANG_SHA256\"\
        \ntest \"$lld_sha\" = \"$EXPECTED_LLD_SHA256\"\n\n\"$root/bin/clang\" --version > evidence/08-CLANG-VERSION.txt\n\"\
        $root/bin/ld.lld\" --version > evidence/08-LLD-VERSION.txt\n\n{\n  echo \"TOOLCHAIN_TREE_SHA256=$tree_sha\"\n  echo\
        \ \"CLANG_SHA256=$clang_sha\"\n  echo \"LLD_SHA256=$lld_sha\"\n  echo \"PINNED_TOOLCHAIN_IDENTITY=PASS\"\n} > evidence/08-TOOLCHAIN-IDENTITY.txt\n\
        \necho \"$root/bin\" >> \"$GITHUB_PATH\"\necho \"KCFLAGS=-D__ANDROID_COMMON_KERNEL__\" >> \"$GITHUB_ENV\"\n"
    - name: 20 - Configure KSTAT foundation as third active suboption
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V7_CONFIG" > evidence/STAGE.txt
        cd kernel
        rm -rf out-p5

        make -s O=out-p5 ARCH=arm64 LLVM=1 veux_defconfig

        scripts/config --file out-p5/.config \
          -e KSU \
          -e KSU_SUSFS \
          -e KSU_SUSFS_SPOOF_UNAME \
          -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
          -e KSU_SUSFS_SUS_KSTAT \
          -d MODULES \
          -d KPROBES \
          -d KPROBE_EVENTS

        make -s O=out-p5 ARCH=arm64 LLVM=1 olddefconfig

        grep -Fxq 'CONFIG_KSU=y' out-p5/.config
        grep -Fxq 'CONFIG_KSU_SUSFS=y' out-p5/.config
        grep -Fxq 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' out-p5/.config
        grep -Fxq 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y' out-p5/.config
        grep -Fxq 'CONFIG_KSU_SUSFS_SUS_KSTAT=y' out-p5/.config
        ! grep -Eq '^CONFIG_MODULES=y$' out-p5/.config
        ! grep -Eq '^CONFIG_KPROBES=y$' out-p5/.config

        mapfile -t opts < <(
          grep -E '^CONFIG_KSU_SUSFS_[A-Z0-9_]+=y$' out-p5/.config \
            | LC_ALL=C sort
        )
        test "${#opts[@]}" -eq 3
        printf '%s\n' "${opts[@]}" | grep -Fxq 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y'
        printf '%s\n' "${opts[@]}" | grep -Fxq 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y'
        printf '%s\n' "${opts[@]}" | grep -Fxq 'CONFIG_KSU_SUSFS_SUS_KSTAT=y'

        {
          echo "CONFIG_KSU=y"
          echo "CONFIG_KSU_SUSFS=y"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
          echo "SUSFS_FEATURE_SUBOPTIONS_ENABLED=3"
          echo "P5_V7_KSTAT_FOUNDATION=YES"
          echo "P5_V7_CONFIG_SHA256=$(sha256sum out-p5/.config | awk '{print $1}')"
          echo "P5_V7_CONFIG_GATE=PASS"
        } > "$GITHUB_WORKSPACE/evidence/11-P5V7-CONFIG.txt"
    - name: 21 - Compile KSTAT foundation and regression objects
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V7_OBJECT_COMPILE" > evidence/STAGE.txt
        cd kernel

        mkdir -p out-p5/scripts/selinux/genheaders
        HOSTCC_BIN="${HOSTCC:-cc}"
        "$HOSTCC_BIN" -O2 \
          -I"$PWD/include/uapi" \
          -I"$PWD/include" \
          -I"$PWD/security/selinux/include" \
          scripts/selinux/genheaders/genheaders.c \
          -o out-p5/scripts/selinux/genheaders/genheaders \
          2>&1 | tee "$GITHUB_WORKSPACE/evidence/12-P5V7-GENHEADERS-HOST.log"

        test -x out-p5/scripts/selinux/genheaders/genheaders
        mkdir -p out-p5/security/selinux
        out-p5/scripts/selinux/genheaders/genheaders \
          out-p5/security/selinux/flask.h \
          out-p5/security/selinux/av_permissions.h

        test -s out-p5/security/selinux/flask.h
        test -s out-p5/security/selinux/av_permissions.h

        set +e
        make -j"$(nproc)" \
          O=out-p5 \
          ARCH=arm64 \
          LLVM=1 \
          KCFLAGS="$KCFLAGS" \
          kernel/sys.o \
          fs/proc/cmdline.o \
          fs/susfs.o \
          drivers/kernelsu/core_hook.o \
          fs/stat.o \
          fs/open.o \
          drivers/kernelsu/sucompat.o \
          2>&1 | tee "$GITHUB_WORKSPACE/evidence/12-P5V7-OBJECT-COMPILE.log"
        rc=${PIPESTATUS[0]}
        set -e

        {
          echo "P5_V7_OBJECT_COMPILE_EXIT_CODE=$rc"
          if [ "$rc" -eq 0 ]; then
            echo "P5_V7_OBJECT_COMPILE=PASS"
          else
            echo "P5_V7_OBJECT_COMPILE=FAIL"
          fi
        } > "$GITHUB_WORKSPACE/evidence/12-P5V7-OBJECT-COMPILE.txt"

        test "$rc" -eq 0

        for f in \
          out-p5/kernel/sys.o \
          out-p5/fs/proc/cmdline.o \
          out-p5/fs/susfs.o \
          out-p5/drivers/kernelsu/core_hook.o \
          out-p5/fs/stat.o \
          out-p5/fs/open.o \
          out-p5/drivers/kernelsu/sucompat.o
        do
          test -s "$f"
        done

        for sym in susfs_add_sus_kstat susfs_update_sus_kstat; do
          nm out-p5/drivers/kernelsu/core_hook.o \
            | grep -Eq "[[:space:]]U[[:space:]]+${sym}$"
        done

        nm out-p5/fs/susfs.o \
          | grep -Eq '[[:space:]][Tt][[:space:]]+susfs_add_sus_kstat$'
        nm out-p5/fs/susfs.o \
          | grep -Eq '[[:space:]][Tt][[:space:]]+susfs_update_sus_kstat$'
        nm out-p5/fs/susfs.o \
          | grep -Eq '[[:space:]][Tt][[:space:]]+susfs_sus_kstat_spoof_generic_fillattr$'

        ! nm out-p5/fs/stat.o \
          | grep -Eq '[[:space:]]U[[:space:]]+susfs_sus_kstat_spoof_generic_fillattr$'

        {
          echo "P5_V7_KSTAT_ADD_DISPATCH_EDGE=PASS"
          echo "P5_V7_KSTAT_UPDATE_DISPATCH_EDGE=PASS"
          echo "P5_V7_KSTAT_SOURCE_SYMBOLS=PASS"
          echo "P5_V7_GENERIC_FILLATTR_CALL_EDGE=ABSENT_AS_DESIGNED"
          echo "P5_V7_P5V6_REGRESSION_OBJECTS=PASS"
          echo "P5_V7_OBJECT_BOUNDARY=PASS"
        } > "$GITHUB_WORKSPACE/evidence/12-P5V7-OBJECT-BOUNDARY.txt"
    - name: 22 - Compile full P5-v7 Image and dtbs
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V7_IMAGE_DTBS" > evidence/STAGE.txt
        cd kernel

        set +e
        make -j"$(nproc)" \
          O=out-p5 \
          ARCH=arm64 \
          LLVM=1 \
          KCFLAGS="$KCFLAGS" \
          Image dtbs \
          2>&1 | tee "$GITHUB_WORKSPACE/evidence/13-P5V7-IMAGE-DTBS-COMPILE.log"
        rc=${PIPESTATUS[0]}
        set -e

        {
          echo "P5_V7_IMAGE_DTBS_COMPILE_EXIT_CODE=$rc"
