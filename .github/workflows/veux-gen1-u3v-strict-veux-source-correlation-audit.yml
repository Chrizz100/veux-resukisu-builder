      - name: Compare directly evidenced VEUX greater-than-302 sources to P13
        shell: bash
        run: |
          set -euo pipefail
          export P13_ROOT="$GITHUB_WORKSPACE/kernel"

          python3 - <<'PY'
          from pathlib import Path
          import csv, os, re

          audit=Path(os.environ["AUDIT_DIR"])
          roots=Path(os.environ["SNAPSHOT_DIR"])/"gt302"
          p13=Path(os.environ["P13_ROOT"])

          groups={
              "wifi":["drivers/staging/qcacld-3.0","drivers/staging/qca-wifi-host-cmn"],
              "gpu":["drivers/gpu/msm"],
              "power":["drivers/power/supply/qcom"],
              "thermal":["drivers/thermal/qcom"],
              "ufs":["drivers/scsi/ufs"],
              "usb":["drivers/usb/dwc3"],
              "soc":["drivers/soc/qcom"],
              "audio":["techpack/audio"],
              "camera":["techpack/camera"],
              "video":["techpack/video"],
              "ipa":["techpack/dataipa"],
              "rmnet":["techpack/datarmnet"],
              "qrtr":["net/qrtr"],
          }
          exre=re.compile(r'EXPORT_SYMBOL(?:_GPL)?\s*\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)')
          kcre=re.compile(r'^\s*(?:menu)?config\s+([A-Za-z_][A-Za-z0-9_]*)\s*$',re.M)
          objre=re.compile(r'^\s*obj-[^:=+]*\+?=\s*(.+)$',re.M)

          def files(root):
              for ps in groups.values():
                  for rel in ps:
                      d=root/rel
                      if d.exists():
                          for p in d.rglob("*"):
                              if p.is_file() and p.suffix in {".c",".h"}:
                                  yield p

          def exports(root):
              s=set()
              for p in files(root):
                  s.update(exre.findall(p.read_text(errors="replace")))
              return s

          def kconfigs(root):
              s=set()
              for ps in groups.values():
                  for rel in ps:
                      d=root/rel
                      if d.exists():
                          for p in d.rglob("Kconfig*"):
                              if p.is_file():
                                  s.update(kcre.findall(p.read_text(errors="replace")))
              return s

          def kbuild(root):
              s=set()
              for ps in groups.values():
                  for rel in ps:
                      d=root/rel
                      if not d.exists(): continue
                      for name in ("Makefile","Kbuild"):
                          for p in d.rglob(name):
                              if not p.is_file(): continue
                              for rhs in objre.findall(p.read_text(errors="replace")):
                                  for tok in rhs.split():
                                      if tok.endswith((".o",".a")): s.add(tok)
              return s

          def jac(a,b):
              if not a and not b:return 1.0
              if not a or not b:return 0.0
              return len(a&b)/len(a|b)

          pe,pk,pb=exports(p13),kconfigs(p13),kbuild(p13)
          rows=[]
          for d in sorted(roots.glob("cand-*")):
              repo,branch,sha,ver=(d/".meta.tsv").read_text().strip().split("\t")
              present=sum(any((d/p).exists() for p in ps) for ps in groups.values())
              ratio=present/len(groups)
              ej,kj,bj=jac(pe,exports(d)),jac(pk,kconfigs(d)),jac(pb,kbuild(d))
              cls=(
                  "B_GT302_VEUX_SAME_SOURCE_FAMILY_REVIEW"
                  if ratio>=0.75 and ej>=0.65
                  else "C_GT302_VEUX_STRUCTURAL_DIVERGENCE"
              )
              rows.append({
                  "repository":repo,"branch":branch,"sha":sha,
                  "kernel_version":ver,
                  "structure_pct":f"{ratio*100:.2f}",
                  "export_symbol_jaccard":f"{ej:.6f}",
                  "kconfig_jaccard":f"{kj:.6f}",
                  "kbuild_jaccard":f"{bj:.6f}",
                  "classification":cls,
              })

          fields=[
              "repository","branch","sha","kernel_version","structure_pct",
              "export_symbol_jaccard","kconfig_jaccard","kbuild_jaccard",
              "classification"
          ]
          with (audit/"13-veux-gt302-p13-comparison.tsv").open(
              "w",newline="",encoding="utf-8"
          ) as fh:
              w=csv.DictWriter(fh,fieldnames=fields,delimiter="\t")
              w.writeheader();w.writerows(rows)

          with (audit/"13-veux-gt302-result.txt").open("w") as fh:
              fh.write(f"VEUX_DIRECT_GT302_COMPARED={len(rows)}\n")
              fh.write(
                  f"VEUX_DIRECT_GT302_SAME_FAMILY_REVIEW="
                  f"{sum(r['classification'].startswith('B_') for r in rows)}\n"
              )
              fh.write(
                  f"VEUX_DIRECT_GT302_DIVERGED="
                  f"{sum(r['classification'].startswith('C_') for r in rows)}\n"
              )
          PY

          cat "$AUDIT_DIR/13-veux-gt302-result.txt"
          cat "$AUDIT_DIR/13-veux-gt302-p13-comparison.tsv"

