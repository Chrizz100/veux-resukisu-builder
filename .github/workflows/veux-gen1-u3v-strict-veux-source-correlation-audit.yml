      - name: Inventory kernel branches with direct VEUX source markers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          from urllib.error import HTTPError
          import csv, json, os, re, subprocess

          audit = Path(os.environ["AUDIT_DIR"])
          token = os.environ.get("GH_TOKEN", "")
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "VEUX-U3V-readonly-audit",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def api_json(url):
              req = Request(url, headers=headers)
              with urlopen(req, timeout=45) as r:
                  return json.loads(r.read().decode("utf-8"))

          def raw_bytes(full, sha, path):
              url = f"https://raw.githubusercontent.com/{full}/{sha}/{path}"
              try:
                  req = Request(url, headers={"User-Agent":"VEUX-U3V-readonly-audit"})
                  with urlopen(req, timeout=30) as r:
                      return r.read()
              except Exception:
                  return b""

          repos = {}
          raw_pages = []
          query = "kernel_xiaomi_sm6375 in:name"
          for page in range(1, 4):
              data = api_json(
                  "https://api.github.com/search/repositories?"
                  f"q={quote(query)}&per_page=100&page={page}"
              )
              raw_pages.append(data)
              for item in data.get("items", []):
                  repos[item["full_name"]] = item
              if len(data.get("items", [])) < 100:
                  break

          (audit/"10-kernel-repository-search.json").write_text(
              json.dumps(raw_pages, indent=2, sort_keys=True) + "\n"
          )

          rows=[]
          for full in sorted(repos, key=str.lower):
              item=repos[full]
              if int(item.get("size") or 0) == 0:
                  continue
              default=item.get("default_branch") or ""
              cp=subprocess.run(
                  ["git","ls-remote","--heads",item["clone_url"]],
                  text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,
                  timeout=90
              )
              if cp.returncode != 0:
                  continue
              heads=[]
              for line in cp.stdout.splitlines():
                  if not line.strip():
                      continue
                  sha,ref=line.split("\t",1)
                  branch=ref.removeprefix("refs/heads/")
                  heads.append((sha,branch))
              heads=sorted(heads,key=lambda x:(x[1]!=default,x[1]))[:80]

              for sha,branch in heads:
                  mf=raw_bytes(full,sha,"Makefile").decode("utf-8","replace")
                  vals={}
                  for key in ("VERSION","PATCHLEVEL","SUBLEVEL"):
                      m=re.search(rf"^{key}\s*=\s*([0-9]+)\s*$",mf,re.M)
                      vals[key]=int(m.group(1)) if m else None

                  if None in vals.values():
                      version="UNKNOWN"
                      major=minor=sub=""
                  else:
                      major=vals["VERSION"]; minor=vals["PATCHLEVEL"]; sub=vals["SUBLEVEL"]
                      version=f"{major}.{minor}.{sub}"

                  veux_cfg=raw_bytes(
                      full,sha,"arch/arm64/configs/veux_defconfig"
                  )
                  direct_veux=bool(veux_cfg)

                  # Supplemental source-tree marker. It never substitutes for
                  # veux_defconfig but is useful supporting evidence.
                  dts_markers=[]
                  for p in (
                      "arch/arm64/boot/dts/vendor/xiaomi/veux.dts",
                      "arch/arm64/boot/dts/vendor/xiaomi/veux.dtsi",
                      "arch/arm64/boot/dts/vendor/qcom/veux.dts",
                  ):
                      if raw_bytes(full,sha,p):
                          dts_markers.append(p)

                  if version == "UNKNOWN":
                      cls="UNCLASSIFIED_NO_ROOT_VERSION"
                  elif direct_veux and major == 5 and minor == 4 and sub <= 302:
                      cls="A_VEUX_DIRECT_5_4_LE302"
                  elif direct_veux and major == 5 and minor == 4 and sub > 302:
                      cls="B_VEUX_DIRECT_5_4_GT302"
                  elif direct_veux:
                      cls="C_VEUX_DIRECT_NEW_KERNEL_FAMILY"
                  elif major == 5 and minor == 4 and sub <= 302:
                      cls="SM6375_GENERIC_5_4_LE302_NO_DIRECT_VEUX_MARKER"
                  elif major == 5 and minor == 4 and sub > 302:
                      cls="SM6375_GENERIC_5_4_GT302_NO_DIRECT_VEUX_MARKER"
                  else:
                      cls="SM6375_GENERIC_NEW_FAMILY_NO_DIRECT_VEUX_MARKER"

                  rows.append({
                      "repository":full,
                      "branch":branch,
                      "sha":sha,
                      "kernel_version":version,
                      "major":major,
                      "minor":minor,
                      "sublevel":sub,
                      "veux_defconfig":int(direct_veux),
                      "veux_dts_marker_count":len(dts_markers),
                      "classification":cls,
                      "is_default":int(branch==default),
                  })

          fields=list(rows[0].keys()) if rows else [
              "repository","branch","sha","kernel_version","major","minor",
              "sublevel","veux_defconfig","veux_dts_marker_count",
              "classification","is_default"
          ]
          with (audit/"10-kernel-branch-veux-correlation.tsv").open(
              "w",newline="",encoding="utf-8"
          ) as fh:
              w=csv.DictWriter(fh,fieldnames=fields,delimiter="\t")
              w.writeheader(); w.writerows(rows)

          summary={}
          for r in rows:
              k=(r["kernel_version"],r["classification"])
              summary[k]=summary.get(k,0)+1
          with (audit/"11-kernel-correlation-summary.tsv").open(
              "w",newline="",encoding="utf-8"
          ) as fh:
              w=csv.writer(fh,delimiter="\t")
              w.writerow(["kernel_version","classification","branch_count"])
              for (ver,cls),n in sorted(summary.items()):
                  w.writerow([ver,cls,n])

          direct_gt302=[
              r for r in rows if r["classification"]=="B_VEUX_DIRECT_5_4_GT302"
          ]
          with (audit/"11-veux-direct-gt302.tsv").open(
              "w",newline="",encoding="utf-8"
          ) as fh:
              w=csv.DictWriter(fh,fieldnames=fields,delimiter="\t")
              w.writeheader(); w.writerows(direct_gt302)

          direct_61=[
              r for r in rows
              if r["classification"]=="C_VEUX_DIRECT_NEW_KERNEL_FAMILY"
              and str(r["kernel_version"]).startswith("6.1.")
          ]
          generic_61=[
              r for r in rows
              if r["classification"]=="SM6375_GENERIC_NEW_FAMILY_NO_DIRECT_VEUX_MARKER"
              and str(r["kernel_version"]).startswith("6.1.")
          ]

          with (audit/"11-kernel-boundary-summary.txt").open("w") as fh:
              fh.write(f"KERNEL_BRANCH_ROWS={len(rows)}\n")
              fh.write(
                  f"VEUX_DIRECT_5_4_LE302="
                  f"{sum(r['classification']=='A_VEUX_DIRECT_5_4_LE302' for r in rows)}\n"
              )
              fh.write(f"VEUX_DIRECT_5_4_GT302={len(direct_gt302)}\n")
              fh.write(f"VEUX_DIRECT_6_1={len(direct_61)}\n")
              fh.write(f"SM6375_GENERIC_6_1_NO_DIRECT_VEUX_MARKER={len(generic_61)}\n")

          print((audit/"11-kernel-boundary-summary.txt").read_text())
          PY

          cat "$AUDIT_DIR/11-kernel-correlation-summary.tsv"

