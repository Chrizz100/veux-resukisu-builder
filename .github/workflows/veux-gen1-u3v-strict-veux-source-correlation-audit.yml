              "KERNEL_CHANGE_JUSTIFIED=NO\n"
          )
          (audit/"14-U3V-RESULT.txt").write_text(result)
          (audit/"14-U3V-REPORT.md").write_text(
              "# VEUX GEN1 U3V — Strict VEUX Source Correlation\n\n"
              "## Result\n\n"
              "**U3V_STRICT_VEUX_SOURCE_CORRELATION=PASS**\n\n"
              f"- Direct VEUX 5.4 <=302 branches: **{a}**\n"
              f"- Direct VEUX 5.4 >302 branches: **{b}**\n"
              f"- Direct VEUX 6.1 branches: **{direct_61}**\n"
              f"- Generic SM6375 6.1 branches without direct VEUX defconfig: **{generic_61}**\n"
              f"- VEUX device trees using veux_defconfig: **{dev_cfg}**\n"
              f"- >302 result: **{gt302}**\n"
              f"- new-family result: **{newfam}**\n\n"
              "The P13 universal source claim remains bounded to directly "
              "evidenced VEUX Linux-5.4 sources through sublevel 302.\n\n"
              "This is source/statistical evidence only, not DEVICE PASS.\n"
          )
          print(result)
          PY

          cat "$AUDIT_DIR/14-U3V-REPORT.md"

      - name: Assert U3V strict interpretation and safety
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'U3V_STRICT_VEUX_SOURCE_CORRELATION=PASS' \
            "$AUDIT_DIR/14-U3V-RESULT.txt"
          grep -Fxq \
            'P13_UNIVERSAL_SCOPE=VEUX_DIRECT_LINUX_5_4_FAMILY_LE302' \
            "$AUDIT_DIR/14-U3V-RESULT.txt"
          grep -Fxq 'DEVICE_PASS=NO' "$AUDIT_DIR/14-U3V-RESULT.txt"
          grep -Fxq 'KERNEL_CHANGE_JUSTIFIED=NO' "$AUDIT_DIR/14-U3V-RESULT.txt"

          {
            echo "U3V_GITHUB_MODE=READ_ONLY"
            echo "U3V_DEVICE_REQUIRED=NO"
            echo "U3V_FLASH_ACTIONS=NONE"
            echo "U3V_SAFETY_GATE=PASS"
          } | tee "$AUDIT_DIR/15-U3V-SAFETY.txt"

      - name: Build self-verifying U3V evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$AUDIT_DIR"
          find . -type f ! -name 'U3V-EVIDENCE-SHA256SUMS.txt' -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            > U3V-EVIDENCE-SHA256SUMS.txt
          sha256sum -c U3V-EVIDENCE-SHA256SUMS.txt

      - name: Upload U3V strict VEUX correlation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-GEN1-U3V-strict-VEUX-source-correlation-audit
          path: u3v-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
