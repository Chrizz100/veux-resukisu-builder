        test -s "$NORMAL_BUILD_DIR/fs/statfs.o"
        test -s "$NORMAL_BUILD_DIR/fs/proc/fd.o"
        ! aarch64-linux-gnu-nm "$NORMAL_BUILD_DIR/fs/statfs.o" \
          | grep -q 'susfs_open_redirect_spoof_vfs_statfs'
        ! aarch64-linux-gnu-nm "$NORMAL_BUILD_DIR/fs/proc/fd.o" \
          | grep -q 'susfs_open_redirect_spoof_seq_show'

        rm -rf "$REDIRECT_BUILD_DIR"
        make O="$REDIRECT_BUILD_DIR" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- veux_defconfig
        make O="$REDIRECT_BUILD_DIR" \
          ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          CONFIG_KSU_SUSFS=y CONFIG_KSU_SUSFS_OPEN_REDIRECT=y \
