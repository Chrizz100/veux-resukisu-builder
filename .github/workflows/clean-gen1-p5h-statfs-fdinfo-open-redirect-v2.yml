          echo "CLEAN_GEN1_P5H_STATFS_FDINFO_OPEN_REDIRECT=PASS"
          echo "P5H_V1_FAILURE_CLASS=P5G_SYMBOL_CONTRACT_WRONG_EVIDENCE_FILE"
          echo "P5H_SOURCE_TRANSFORM_CHANGED_FROM_V1=NO"
          echo "KERNEL_VERSION=5.4.274"
          echo "P5G_INPUT_TREE=$EXPECTED_P5G_TREE"
          echo "P5H_CHECKPOINT_COMMIT=$P5H_COMMIT"
          echo "P5H_OUTER_TREE=$P5H_TREE"
          echo "P5H_RESUKISU_HEAD=$EXPECTED_RESUKISU_HEAD"
          echo "P5H_RESUKISU_TREE=$EXPECTED_RESUKISU_TREE"
          echo "VFS_STATFS_OPEN_REDIRECT_INTEGRATED=YES"
          echo "STATFS_TARGET_KSTATFS_SHORT_CIRCUIT=YES"
          echo "STATFS_REDIRECTED_MOUNT_FLAGS_OVERWRITE=NO"
          echo "STATFS_NO_ENTRY_FALLS_BACK_TO_STOCK=YES"
          echo "FDINFO_OPEN_REDIRECT_INTEGRATED=YES"
          echo "FDINFO_SPOOFED_FIELD=mnt_id"
          echo "FDINFO_STOCK_FIELDS=pos,flags,mnt_id"
          echo "FDINFO_GLOBAL_INO_FIELD_ADDED=NO"
          echo "FDINFO_HELPER_OUT_INO_VISIBLE=NO"
          echo "SUSFS_HELPER_BODIES_CHANGED=NO"
          echo "P5G_READLINK_PATHS_PRESERVED=PASS"
          echo "PROC_MAPS_HOOK_REMAINING=YES"
          echo "P5H_CHANGED_FILES=fs/proc/fd.c,fs/statfs.c,include/linux/susfs.h"
          echo "SUSFS_RUNTIME_ENABLED=NO"
          echo "MODULE_LOAD_FILTER_INCLUDED=NO"
          echo "P5H_OUTER_RESTORE_REPLAY=PASS"
          echo "P5H_RESUKISU_BUNDLE_REPLAY=PASS"
          echo "FULL_KERNEL_BUILD_PERFORMED=NO"
          echo "IMAGE_CREATED=NO"
          echo "DTB_BUILD_PERFORMED=NO"
          echo "BOOT_IMAGE_CREATED=NO"
          echo "FLASHABLE_ZIP_CREATED=NO"
          echo "DEVICE_ACCESSED=NO"
          echo "FLASHING_PERFORMED=NO"
          echo "NEXT_STAGE=CLEAN_GEN1_P5I_PROC_MAPS_OPEN_REDIRECT_SRCU_INTEGRATION"
        } | tee "$ARTIFACT_DIR/16-result.txt"
    - name: Preserve P5H failure evidence
      if: always()
      shell: bash
      run: |2

        set +e
        mkdir -p "$ARTIFACT_DIR"
        {
          echo "JOB_STATUS=${{ job.status }}"
          if [ -d "$GITHUB_WORKSPACE/kernel/.git" ]; then
            echo "OUTER_HEAD=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD 2>/dev/null || true)"
            echo "OUTER_TREE=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD^{tree} 2>/dev/null || true)"
            echo "OUTER_STATUS_BEGIN"
            git -C "$GITHUB_WORKSPACE/kernel" status --porcelain 2>/dev/null || true
            echo "OUTER_STATUS_END"
          fi
          if [ -d "$GITHUB_WORKSPACE/kernel/KernelSU/.git" ]; then
            echo "RESUKISU_HEAD=$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD 2>/dev/null || true)"
            echo "RESUKISU_TREE=$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD^{tree} 2>/dev/null || true)"
          fi
        } > "$ARTIFACT_DIR/99-job-end-state.txt"
        find "$ARTIFACT_DIR" -maxdepth 2 -type f -printf '%P\n' \
          | sort > "$ARTIFACT_DIR/99-artifact-file-list.txt"
        exit 0
    - name: Upload P5H checkpoint and evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: clean-gen1-p5h-statfs-fdinfo-open-redirect-v2-${{ github.run_id }}
        path: clean-gen1-p5h/
        if-no-files-found: error
        retention-days: 90
