          -j2 fs/statfs.o fs/proc/fd.o fs/susfs.o \
          2>&1 | tee "$ARTIFACT_DIR/11-forced-metadata-objects.log"

        for obj in fs/statfs.o fs/proc/fd.o fs/susfs.o
        do
          test -s "$REDIRECT_BUILD_DIR/$obj"
        done

        aarch64-linux-gnu-nm "$REDIRECT_BUILD_DIR/fs/statfs.o" \
          > "$ARTIFACT_DIR/11-statfs-nm.txt"
        aarch64-linux-gnu-nm "$REDIRECT_BUILD_DIR/fs/proc/fd.o" \
          > "$ARTIFACT_DIR/11-proc-fd-nm.txt"
        aarch64-linux-gnu-nm "$REDIRECT_BUILD_DIR/fs/susfs.o" \
          > "$ARTIFACT_DIR/11-susfs-nm.txt"

        grep -Eq '[[:space:]]U[[:space:]]+susfs_open_redirect_spoof_vfs_statfs$' \
          "$ARTIFACT_DIR/11-statfs-nm.txt"
        grep -Eq '[[:space:]]U[[:space:]]+susfs_open_redirect_spoof_seq_show$' \
          "$ARTIFACT_DIR/11-proc-fd-nm.txt"
        grep -Eq '[[:space:]][Tt][[:space:]]+susfs_open_redirect_spoof_vfs_statfs$' \
          "$ARTIFACT_DIR/11-susfs-nm.txt"
        grep -Eq '[[:space:]][Tt][[:space:]]+susfs_open_redirect_spoof_seq_show$' \
          "$ARTIFACT_DIR/11-susfs-nm.txt"

        {
          echo "P5H_NORMAL_METADATA_OBJECT_COMPILE=PASS"
          echo "P5H_FORCED_STATFS_OBJECT_COMPILE=PASS"
          echo "P5H_FORCED_PROC_FD_OBJECT_COMPILE=PASS"
