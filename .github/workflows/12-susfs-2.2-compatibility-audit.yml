name: 12 - VEUX SUSFS 2.2 Compatibility Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ARCH: arm64
      COMMON_REF: "android11-5.4.274_r00"
      STABILITY_REVERT: "f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80"
      CASS_COMMIT_DO_NOT_REVERT: "b9b5ddba28bf9f23ac1a2af27f574291451244fd"
      EXPECTED_CANDIDATE_TREE: "5d25b7e0124d7fb695f3f07b45928fcb5780d0e8"

      RESUKISU_COMMIT: "faccf4c5edc7be37776216e7d43dd3dca0239331"

      BACKPORT_REPO: "JackA1ltman/NonGKI_Kernel_Build_2nd"
      BACKPORT_COMMIT: "90d9f91d43ecaaee044e79c75a01d6a512508eb3"
      BACKPORT_PATCH_PATH: "Patches/Patch/susfs_patch_to_5.4.patch"
      BACKPORT_PATCH_BLOB: "7533876188b65d78940b705d8e4462dbdc31c0a2"

      VEUX_FIX_REPO: "JackA1ltman/NonGKI_Kernel_Patches"
      VEUX_FIX_COMMIT: "e3777444f14b8b88328d5512ff76eaf4e01baf5f"
      VEUX_FIX_PATCH_PATH: "redmi_note11pro_5g_aosp_a16/susfs_fixed_eplus.patch"
      VEUX_FIX_PATCH_BLOB: "61872114e96a38f361cea88afb0e890f74deceb6"

      OUT_DIR: out
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      PATCH_DIR: ${{ github.workspace }}/reference-patches

    steps:
      - name: Prepare audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR" "$PATCH_DIR"

          {
            echo "VEUX 5.4.274 ReSukiSU SUSFS 2.2 compatibility audit"
            echo "Started: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Candidate tree: $EXPECTED_CANDIDATE_TREE"
            echo "ReSukiSU: $RESUKISU_COMMIT"
            echo "Backport: $BACKPORT_REPO@$BACKPORT_COMMIT"
            echo "VEUX fix: $VEUX_FIX_REPO@$VEUX_FIX_COMMIT"
            echo "CASS intentionally NOT reverted: $CASS_COMMIT_DO_NOT_REVERT"
            echo "No Image, no boot.img, no flashing"
          } > "$ARTIFACT_DIR/AUDIT-INFO.txt"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git \
            libelf-dev libssl-dev patch python3

      - name: Checkout VEUX source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: "20240619"
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Recreate exact Stability Candidate 2
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BASE_SHA="$(git rev-parse HEAD)"
          git remote remove android-common 2>/dev/null || true
          git remote add android-common https://android.googlesource.com/kernel/common
          git fetch --no-tags android-common "$COMMON_REF"
          git merge --no-edit FETCH_HEAD

          git cat-file -e "${STABILITY_REVERT}^{commit}"
          git revert --no-edit "$STABILITY_REVERT"

          KERNEL_VERSION="$(make -s kernelversion)"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE_SHA="$(git rev-parse HEAD^{tree})"

          {
            echo "BASE_SHA=$BASE_SHA"
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "CANDIDATE_TREE_SHA=$CANDIDATE_TREE_SHA"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "STABILITY_REVERT=$STABILITY_REVERT"
            echo "CASS_COMMIT_DO_NOT_REVERT=$CASS_COMMIT_DO_NOT_REVERT"
          } | tee "$ARTIFACT_DIR/candidate2.txt"

          [ "$KERNEL_VERSION" = "5.4.274" ]

          if [ "$CANDIDATE_TREE_SHA" != "$EXPECTED_CANDIDATE_TREE" ]; then
            echo "ERROR: Candidate 2 tree mismatch"
            echo "Expected: $EXPECTED_CANDIDATE_TREE"
            echo "Actual:   $CANDIDATE_TREE_SHA"
            exit 1
          fi

      - name: Verify clean pre-SUSFS kernel side
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          MATCHES="$(
            grep -RInE \
              --exclude-dir=.git \
              --exclude-dir=out \
              --exclude-dir=kernelsu \
              --include='*.c' \
              --include='*.h' \
              --include='Kconfig*' \
              --include='Makefile*' \
              --include='*.mk' \
              '(^|[^A-Za-z0-9_])(CONFIG_KSU_SUSFS|CONFIG_SUSFS|susfs_[A-Za-z0-9_]+|SUSFS_VERSION|susfs\.h|susfs_def\.h)([^A-Za-z0-9_]|$)' \
              fs include kernel security mm drivers 2>/dev/null || true
          )"

          if [ -n "$MATCHES" ]; then
            printf '%s\n' "$MATCHES" | tee "$ARTIFACT_DIR/PRE-SUSFS-GUARD.txt"
            echo "ERROR: pre-existing kernel-side SUSFS detected"
            exit 1
          fi

          echo "No existing SUSFS kernel-side backport detected." \
            | tee "$ARTIFACT_DIR/PRE-SUSFS-GUARD.txt"

      - name: Fetch exact SUSFS 2.2 and VEUX reference patches
        shell: bash
        run: |
          set -euo pipefail

          BASE_PATCH="$PATCH_DIR/susfs_patch_to_5.4-v2.2.00.patch"
          FIX_PATCH="$PATCH_DIR/susfs_fixed_eplus-veux.patch"

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/${BACKPORT_REPO}/${BACKPORT_COMMIT}/${BACKPORT_PATCH_PATH}" \
            -o "$BASE_PATCH"

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/${VEUX_FIX_REPO}/${VEUX_FIX_COMMIT}/${VEUX_FIX_PATCH_PATH}" \
            -o "$FIX_PATCH"

          ACTUAL_BASE_BLOB="$(git hash-object "$BASE_PATCH")"
          ACTUAL_FIX_BLOB="$(git hash-object "$FIX_PATCH")"

          if [ "$ACTUAL_BASE_BLOB" != "$BACKPORT_PATCH_BLOB" ]; then
            echo "ERROR: SUSFS 2.2 backport blob mismatch"
            echo "Expected: $BACKPORT_PATCH_BLOB"
            echo "Actual:   $ACTUAL_BASE_BLOB"
            exit 1
          fi

          if [ "$ACTUAL_FIX_BLOB" != "$VEUX_FIX_PATCH_BLOB" ]; then
            echo "ERROR: VEUX fix blob mismatch"
            echo "Expected: $VEUX_FIX_PATCH_BLOB"
            echo "Actual:   $ACTUAL_FIX_BLOB"
            exit 1
          fi

          cp "$BASE_PATCH" "$ARTIFACT_DIR/"
          cp "$FIX_PATCH" "$ARTIFACT_DIR/"

          {
            echo "BACKPORT_REPO=$BACKPORT_REPO"
            echo "BACKPORT_COMMIT=$BACKPORT_COMMIT"
            echo "BACKPORT_PATCH_GIT_BLOB=$ACTUAL_BASE_BLOB"
            echo "BACKPORT_PATCH_SHA256=$(sha256sum "$BASE_PATCH" | awk '{print $1}')"
            echo
            echo "VEUX_FIX_REPO=$VEUX_FIX_REPO"
            echo "VEUX_FIX_COMMIT=$VEUX_FIX_COMMIT"
            echo "VEUX_FIX_PATCH_GIT_BLOB=$ACTUAL_FIX_BLOB"
            echo "VEUX_FIX_PATCH_SHA256=$(sha256sum "$FIX_PATCH" | awk '{print $1}')"
          } | tee "$ARTIFACT_DIR/PATCH-SOURCES.txt"

      - name: Inventory and preserve pristine base-patch targets
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          BASE_PATCH="$PATCH_DIR/susfs_patch_to_5.4-v2.2.00.patch"

          awk '/^--- a\// {sub(/^--- a\//, ""); print}' "$BASE_PATCH" \
            | sort -u > "$ARTIFACT_DIR/BASE-EXPECTED-EXISTING-TARGETS.txt"

          awk '/^\+\+\+ b\// {sub(/^\+\+\+ b\//, ""); print}' "$BASE_PATCH" \
            | sort -u > "$ARTIFACT_DIR/BASE-ALL-RESULT-TARGETS.txt"

          if grep -Eq '^(drivers/kernelsu/|KernelSU/)' \
            "$ARTIFACT_DIR/BASE-ALL-RESULT-TARGETS.txt"; then
            echo "ERROR: SUSFS kernel patch unexpectedly modifies KernelSU/ReSukiSU"
            exit 1
          fi

          mkdir -p "$ARTIFACT_DIR/pre-base-sources"
          : > "$ARTIFACT_DIR/BASE-MISSING-EXPECTED-TARGETS.txt"
          : > "$ARTIFACT_DIR/BASE-PRE-PATCH-SHA256.txt"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if [ -f "$file" ]; then
              mkdir -p "$ARTIFACT_DIR/pre-base-sources/$(dirname "$file")"
              cp "$file" "$ARTIFACT_DIR/pre-base-sources/$file"
              sha256sum "$file" >> "$ARTIFACT_DIR/BASE-PRE-PATCH-SHA256.txt"
            else
              echo "$file" >> "$ARTIFACT_DIR/BASE-MISSING-EXPECTED-TARGETS.txt"
            fi
          done < "$ARTIFACT_DIR/BASE-EXPECTED-EXISTING-TARGETS.txt"

          {
            echo "Existing targets: $(wc -l < "$ARTIFACT_DIR/BASE-EXPECTED-EXISTING-TARGETS.txt" | tr -d ' ')"
            echo "Result targets: $(wc -l < "$ARTIFACT_DIR/BASE-ALL-RESULT-TARGETS.txt" | tr -d ' ')"
            echo "Missing expected targets: $(wc -l < "$ARTIFACT_DIR/BASE-MISSING-EXPECTED-TARGETS.txt" | tr -d ' ')"
            if [ -s "$ARTIFACT_DIR/BASE-MISSING-EXPECTED-TARGETS.txt" ]; then
              echo
              cat "$ARTIFACT_DIR/BASE-MISSING-EXPECTED-TARGETS.txt"
            fi
          } | tee "$ARTIFACT_DIR/BASE-TARGET-INVENTORY.txt"

      - name: Apply SUSFS 2.2 base patch with fuzz zero
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          BASE_PATCH="$PATCH_DIR/susfs_patch_to_5.4-v2.2.00.patch"

          find . -type f \( -name '*.rej' -o -name '*.orig' \) -delete

          set +e
          patch --batch --forward --fuzz=0 -p1 \
            < "$BASE_PATCH" > "$ARTIFACT_DIR/BASE-PATCH.log" 2>&1
          BASE_RC=$?
          set -e

          echo "$BASE_RC" > "$ARTIFACT_DIR/BASE-PATCH.exit-code"

          mkdir -p "$ARTIFACT_DIR/base-rejects" "$ARTIFACT_DIR/base-orig-files"

          find . -type f -name '*.rej' -print | sort \
            > "$ARTIFACT_DIR/BASE-REJECT-FILES.txt"
          find . -type f -name '*.orig' -print | sort \
            > "$ARTIFACT_DIR/BASE-ORIG-FILES.txt"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            clean="${file#./}"
            mkdir -p "$ARTIFACT_DIR/base-rejects/$(dirname "$clean")"
            cp "$clean" "$ARTIFACT_DIR/base-rejects/$clean"
          done < "$ARTIFACT_DIR/BASE-REJECT-FILES.txt"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            clean="${file#./}"
            mkdir -p "$ARTIFACT_DIR/base-orig-files/$(dirname "$clean")"
            cp "$clean" "$ARTIFACT_DIR/base-orig-files/$clean"
          done < "$ARTIFACT_DIR/BASE-ORIG-FILES.txt"

          {
            echo "BASE_PATCH_EXIT_CODE=$BASE_RC"
            echo "BASE_REJECT_FILE_COUNT=$(wc -l < "$ARTIFACT_DIR/BASE-REJECT-FILES.txt" | tr -d ' ')"
            echo
            if [ -s "$ARTIFACT_DIR/BASE-REJECT-FILES.txt" ]; then
              cat "$ARTIFACT_DIR/BASE-REJECT-FILES.txt"
            else
              echo "No base reject files."
            fi
          } | tee "$ARTIFACT_DIR/BASE-PATCH-SUMMARY.txt"

          git diff --no-ext-diff --no-color \
            > "$ARTIFACT_DIR/AFTER-BASE-PATCH.diff"
          git diff --stat \
            > "$ARTIFACT_DIR/AFTER-BASE-PATCH.diffstat"

      - name: Preserve pre-VEUX-fix context
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          FIX_PATCH="$PATCH_DIR/susfs_fixed_eplus-veux.patch"

          awk '/^--- a\// {sub(/^--- a\//, ""); print}' "$FIX_PATCH" \
            | sort -u > "$ARTIFACT_DIR/VEUX-FIX-EXPECTED-TARGETS.txt"

          mkdir -p "$ARTIFACT_DIR/pre-fix-sources"
          : > "$ARTIFACT_DIR/VEUX-FIX-MISSING-TARGETS.txt"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if [ -f "$file" ]; then
              mkdir -p "$ARTIFACT_DIR/pre-fix-sources/$(dirname "$file")"
              cp "$file" "$ARTIFACT_DIR/pre-fix-sources/$file"
            else
              echo "$file" >> "$ARTIFACT_DIR/VEUX-FIX-MISSING-TARGETS.txt"
            fi
          done < "$ARTIFACT_DIR/VEUX-FIX-EXPECTED-TARGETS.txt"

      - name: Apply pinned VEUX SUSFS fix with fuzz zero
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          FIX_PATCH="$PATCH_DIR/susfs_fixed_eplus-veux.patch"

          find . -type f \( -name '*.rej' -o -name '*.orig' \) -delete

          set +e
          patch --batch --forward --fuzz=0 -p1 \
            < "$FIX_PATCH" > "$ARTIFACT_DIR/VEUX-FIX-PATCH.log" 2>&1
          FIX_RC=$?
          set -e

          echo "$FIX_RC" > "$ARTIFACT_DIR/VEUX-FIX-PATCH.exit-code"

          mkdir -p "$ARTIFACT_DIR/veux-fix-rejects" "$ARTIFACT_DIR/veux-fix-orig-files"

          find . -type f -name '*.rej' -print | sort \
            > "$ARTIFACT_DIR/VEUX-FIX-REJECT-FILES.txt"
          find . -type f -name '*.orig' -print | sort \
            > "$ARTIFACT_DIR/VEUX-FIX-ORIG-FILES.txt"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            clean="${file#./}"
            mkdir -p "$ARTIFACT_DIR/veux-fix-rejects/$(dirname "$clean")"
            cp "$clean" "$ARTIFACT_DIR/veux-fix-rejects/$clean"
          done < "$ARTIFACT_DIR/VEUX-FIX-REJECT-FILES.txt"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            clean="${file#./}"
            mkdir -p "$ARTIFACT_DIR/veux-fix-orig-files/$(dirname "$clean")"
            cp "$clean" "$ARTIFACT_DIR/veux-fix-orig-files/$clean"
          done < "$ARTIFACT_DIR/VEUX-FIX-ORIG-FILES.txt"

          {
            echo "VEUX_FIX_EXIT_CODE=$FIX_RC"
            echo "VEUX_FIX_REJECT_FILE_COUNT=$(wc -l < "$ARTIFACT_DIR/VEUX-FIX-REJECT-FILES.txt" | tr -d ' ')"
            echo
            if [ -s "$ARTIFACT_DIR/VEUX-FIX-REJECT-FILES.txt" ]; then
              cat "$ARTIFACT_DIR/VEUX-FIX-REJECT-FILES.txt"
            else
              echo "No VEUX-fix reject files."
            fi
          } | tee "$ARTIFACT_DIR/VEUX-FIX-PATCH-SUMMARY.txt"

          git diff --no-ext-diff --no-color \
            > "$ARTIFACT_DIR/SUSFS-2.2-WITH-VEUX-FIX.diff"
          git diff --stat \
            > "$ARTIFACT_DIR/SUSFS-2.2-WITH-VEUX-FIX.diffstat"
          git diff --check \
            > "$ARTIFACT_DIR/SUSFS-2.2-DIFF-CHECK.txt" 2>&1 || true

      - name: Capture complete patched target sources
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          cat \
            "$ARTIFACT_DIR/BASE-ALL-RESULT-TARGETS.txt" \
            "$ARTIFACT_DIR/VEUX-FIX-EXPECTED-TARGETS.txt" \
            | sort -u > "$ARTIFACT_DIR/ALL-AUDITED-TARGETS.txt"

          mkdir -p "$ARTIFACT_DIR/post-patch-sources"
          : > "$ARTIFACT_DIR/POST-PATCH-SHA256.txt"
          : > "$ARTIFACT_DIR/POST-PATCH-MISSING-TARGETS.txt"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if [ -f "$file" ]; then
              mkdir -p "$ARTIFACT_DIR/post-patch-sources/$(dirname "$file")"
              cp "$file" "$ARTIFACT_DIR/post-patch-sources/$file"
              sha256sum "$file" >> "$ARTIFACT_DIR/POST-PATCH-SHA256.txt"
            else
              echo "$file" >> "$ARTIFACT_DIR/POST-PATCH-MISSING-TARGETS.txt"
            fi
          done < "$ARTIFACT_DIR/ALL-AUDITED-TARGETS.txt"

          git status --short > "$ARTIFACT_DIR/PATCHED-KERNEL-STATUS.txt"

      - name: Verify modern SUSFS interface material
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$ARTIFACT_DIR/SUSFS-2.2-INTERFACE-AUDIT.txt"
          : > "$REPORT"

          check_present() {
            local symbol="$1"
            if grep -Rqw --exclude-dir=.git --exclude-dir=out \
              "$symbol" fs include kernel security mm drivers/input 2>/dev/null; then
              echo "FOUND   $symbol" | tee -a "$REPORT"
            else
              echo "MISSING $symbol" | tee -a "$REPORT"
            fi
          }

          check_present susfs_add_sus_map
          check_present susfs_is_current_proc_umounted
          check_present susfs_get_non_sus_mnt_id_from_mnt
          check_present susfs_open_redirect_spoof_seq_show
          check_present susfs_spoof_uname
          check_present SUSFS_IS_INODE_OPEN_REDIRECT

      - name: Replace legacy KernelSU with pinned ReSukiSU
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          [ -d drivers/kernelsu ]
          find drivers/kernelsu -type f | sort \
            > "$ARTIFACT_DIR/legacy-kernelsu-files.txt"

          rm -rf drivers/kernelsu KernelSU

          git clone https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          git -C KernelSU checkout --detach "$RESUKISU_COMMIT"

          ACTUAL_KSU="$(git -C KernelSU rev-parse HEAD)"
          [ "$ACTUAL_KSU" = "$RESUKISU_COMMIT" ]

          ln -s ../KernelSU/kernel drivers/kernelsu

          if [ "$(readlink -f drivers/kernelsu)" != "$(readlink -f KernelSU/kernel)" ]; then
            echo "ERROR: ReSukiSU symlink mismatch"
            exit 1
          fi

          grep -qF 'config KSU_SUSFS' KernelSU/kernel/Kconfig
          grep -qF 'config KSU_SUSFS_SUS_MAP' KernelSU/kernel/Kconfig
          grep -qF 'include $(KSU_SRC)/tools/inline_hook_check.mk' KernelSU/kernel/Kbuild

          echo "$ACTUAL_KSU" > "$ARTIFACT_DIR/resukisu-commit.txt"

      - name: Preserve ReSukiSU static-symbol compatibility
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("security/selinux/selinuxfs.c")
          s = p.read_text()

          pairs = [
              (
                  "static const struct file_operations sel_handle_status_ops = {",
                  "const struct file_operations sel_handle_status_ops = {",
              ),
              (
                  "static ssize_t (*const write_op[])(struct file *, char *, size_t) = {",
                  "ssize_t (*const write_op[])(struct file *, char *, size_t) = {",
              ),
          ]

          for old, new in pairs:
              if s.count(old) == 1:
                  s = s.replace(old, new, 1)
              elif s.count(old) == 0 and new in s:
                  pass
              else:
                  raise SystemExit(f"unexpected SELinux symbol state: {old}")

          p.write_text(s)
          PY

          grep -qE \
            '^[[:space:]]*const[[:space:]]+struct[[:space:]]+file_operations[[:space:]]+sel_handle_status_ops' \
            security/selinux/selinuxfs.c

          grep -qE \
            '^[[:space:]]*ssize_t[[:space:]]+\(\*const[[:space:]]+write_op\[\]\)' \
            security/selinux/selinuxfs.c

          {
            echo "write_op: link-visible"
            echo "sel_handle_status_ops: link-visible"
            echo "CONFIG_DEBUG_KERNEL remains disabled"
            echo "CONFIG_KALLSYMS_ALL remains disabled"
          } > "$ARTIFACT_DIR/STATIC-SYMBOL-POLICY.txt"

      - name: Resolve ReSukiSU SUSFS Inline Hook config
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          DEFCONFIG="arch/arm64/configs/veux_defconfig"

          cat >> "$DEFCONFIG" <<'EOF'

          # ReSukiSU + SUSFS 2.2 compatibility audit
          CONFIG_THREAD_INFO_IN_TASK=y
          # CONFIG_DEBUG_KERNEL is not set
          CONFIG_KSU=y
          # CONFIG_KSU_TRACEPOINT_HOOK is not set
          # CONFIG_KSU_MANUAL_HOOK is not set
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

          rm -rf "$OUT_DIR"
          make O="$OUT_DIR" ARCH="$ARCH" veux_defconfig \
            2>&1 | tee "$ARTIFACT_DIR/defconfig.log"

          CONFIG="$OUT_DIR/.config"
          [ -f "$CONFIG" ]

          CONFIG_READY="YES"
          CONFIG_REPORT="$ARTIFACT_DIR/CONFIG-RESOLUTION-AUDIT.txt"
          : > "$CONFIG_REPORT"

          check_y() {
            local symbol="$1"
            if grep -qx "$symbol=y" "$CONFIG"; then
              echo "OK       $symbol=y" | tee -a "$CONFIG_REPORT"
            else
              echo "MISMATCH $symbol expected y" | tee -a "$CONFIG_REPORT"
              grep -E "^$symbol=|^# $symbol is not set$" "$CONFIG" \
                | tee -a "$CONFIG_REPORT" || true
              CONFIG_READY="NO"
            fi
          }

          check_not_y() {
            local symbol="$1"
            if grep -qx "$symbol=y" "$CONFIG"; then
              echo "MISMATCH $symbol must not be y" | tee -a "$CONFIG_REPORT"
              CONFIG_READY="NO"
            else
              echo "OK       $symbol is not active as y" | tee -a "$CONFIG_REPORT"
            fi
          }

          for symbol in \
            CONFIG_64BIT \
            CONFIG_THREAD_INFO_IN_TASK \
            CONFIG_KALLSYMS \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_ENABLE_LOG \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_MAP
          do
            check_y "$symbol"
          done

          check_not_y CONFIG_KSU_TRACEPOINT_HOOK
          check_not_y CONFIG_KSU_MANUAL_HOOK
          check_not_y CONFIG_DEBUG_KERNEL
          check_not_y CONFIG_KALLSYMS_ALL

          echo "CONFIG_READY=$CONFIG_READY" \
            | tee "$ARTIFACT_DIR/CONFIG-READINESS.txt"

          cp "$CONFIG" "$ARTIFACT_DIR/resolved-veux-susfs-2.2.config"

          grep -E \
            '^(CONFIG_64BIT=|CONFIG_THREAD_INFO_IN_TASK=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=|# CONFIG_KALLSYMS_ALL|CONFIG_DEBUG_KERNEL=|# CONFIG_DEBUG_KERNEL|CONFIG_KSU=|CONFIG_KSU_TRACEPOINT_HOOK=|# CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_KSU_MANUAL_HOOK=|# CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS=|CONFIG_KSU_SUSFS_)' \
            "$CONFIG" > "$ARTIFACT_DIR/resolved-susfs-config-important.txt"

      - name: Audit SUSFS Kconfig alignment
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          grep -RhoE 'CONFIG_KSU_SUSFS(_[A-Z0-9_]+)?' \
            fs include kernel security mm drivers/input 2>/dev/null \
            | sort -u > "$ARTIFACT_DIR/KERNEL-SUSFS-CONFIG-REFERENCES.txt" || true

          {
            echo "CONFIG_KSU_SUSFS"
            awk '/^config KSU_SUSFS_/ {print "CONFIG_" $2}' KernelSU/kernel/Kconfig
          } | sort -u > "$ARTIFACT_DIR/RESUKISU-SUSFS-CONFIG-DEFINITIONS.txt"

          comm -23 \
            "$ARTIFACT_DIR/KERNEL-SUSFS-CONFIG-REFERENCES.txt" \
            "$ARTIFACT_DIR/RESUKISU-SUSFS-CONFIG-DEFINITIONS.txt" \
            > "$ARTIFACT_DIR/KERNEL-CONFIGS-NOT-DEFINED-BY-RESUKISU.txt" || true

          comm -13 \
            "$ARTIFACT_DIR/KERNEL-SUSFS-CONFIG-REFERENCES.txt" \
            "$ARTIFACT_DIR/RESUKISU-SUSFS-CONFIG-DEFINITIONS.txt" \
            > "$ARTIFACT_DIR/RESUKISU-CONFIGS-NOT-REFERENCED-BY-KERNEL.txt" || true

          {
            echo "Kernel references missing from ReSukiSU Kconfig:"
            if [ -s "$ARTIFACT_DIR/KERNEL-CONFIGS-NOT-DEFINED-BY-RESUKISU.txt" ]; then
              cat "$ARTIFACT_DIR/KERNEL-CONFIGS-NOT-DEFINED-BY-RESUKISU.txt"
            else
              echo "NONE"
            fi
            echo
            echo "ReSukiSU options not referenced by patched kernel:"
            if [ -s "$ARTIFACT_DIR/RESUKISU-CONFIGS-NOT-REFERENCED-BY-KERNEL.txt" ]; then
              cat "$ARTIFACT_DIR/RESUKISU-CONFIGS-NOT-REFERENCED-BY-KERNEL.txt"
            else
              echo "NONE"
            fi
          } > "$ARTIFACT_DIR/SUSFS-KCONFIG-ALIGNMENT.txt"

      - name: Audit ReSukiSU SUSFS inline hooks
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$ARTIFACT_DIR/SUSFS-INLINE-HOOK-AUDIT.txt"
          MISSING="$ARTIFACT_DIR/SUSFS-INLINE-HOOK-MISSING.txt"
          : > "$REPORT"
          : > "$MISSING"

          REQUIRED=(
            "ksu_handle_setresuid:kernel/sys.c"
            "ksu_handle_execveat:fs/exec.c"
            "ksu_handle_faccessat:fs/open.c"
            "ksu_handle_sys_read:fs/read_write.c"
            "ksu_handle_stat:fs/stat.c"
            "ksu_handle_sys_reboot:kernel/reboot.c"
            "ksu_handle_input_handle_event:drivers/input/input.c"
          )

          for entry in "${REQUIRED[@]}"; do
            hook="${entry%%:*}"
            file="${entry#*:}"
            if grep -wq "$hook" "$file"; then
              echo "FOUND   $hook   $file" | tee -a "$REPORT"
            else
              echo "MISSING $hook   $file" | tee -a "$REPORT"
              echo "$hook:$file" >> "$MISSING"
            fi
          done

          INCOMPATIBLE=(
            "ksu_vfs_read_hook:fs/read_write.c"
            "ksu_input_hook:drivers/input/input.c"
            "ksu_execveat_hook:fs/exec.c"
            "ksu_init_rc_hook:fs/read_write.c"
            "ksu_init_rc_hook:fs/stat.c"
          )

          INCOMPATIBLE_COUNT=0
          for entry in "${INCOMPATIBLE[@]}"; do
            hook="${entry%%:*}"
            file="${entry#*:}"
            if grep -wq "$hook" "$file"; then
              echo "INCOMPATIBLE $hook   $file" | tee -a "$REPORT"
              INCOMPATIBLE_COUNT=$((INCOMPATIBLE_COUNT + 1))
            else
              echo "ABSENT       $hook   $file" | tee -a "$REPORT"
            fi
          done

          MANUAL_GUARD_COUNT=0
          for file in \
            kernel/sys.c fs/exec.c fs/open.c fs/read_write.c \
            fs/stat.c kernel/reboot.c drivers/input/input.c
          do
            if grep -wq 'CONFIG_KSU_MANUAL_HOOK' "$file"; then
              echo "MANUAL_GUARD $file" | tee -a "$REPORT"
              MANUAL_GUARD_COUNT=$((MANUAL_GUARD_COUNT + 1))
            fi
          done

          MISSING_COUNT="$(wc -l < "$MISSING" | tr -d ' ')"

          {
            echo
            echo "MISSING_REQUIRED_HOOKS=$MISSING_COUNT"
            echo "INCOMPATIBLE_HOOKS=$INCOMPATIBLE_COUNT"
            echo "MANUAL_GUARD_FILES=$MANUAL_GUARD_COUNT"
          } | tee -a "$REPORT"

          if [ "$MISSING_COUNT" -eq 0 ] && \
             [ "$INCOMPATIBLE_COUNT" -eq 0 ] && \
             [ "$MANUAL_GUARD_COUNT" -eq 0 ]; then
            echo "INLINE_HOOK_READY=YES" | tee "$ARTIFACT_DIR/INLINE-HOOK-READINESS.txt"
          else
            echo "INLINE_HOOK_READY=NO" | tee "$ARTIFACT_DIR/INLINE-HOOK-READINESS.txt"
          fi

      - name: Write audit summary
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          BASE_RC="$(tr -d '\r\n' < "$ARTIFACT_DIR/BASE-PATCH.exit-code")"
          FIX_RC="$(tr -d '\r\n' < "$ARTIFACT_DIR/VEUX-FIX-PATCH.exit-code")"
          BASE_REJECTS="$(wc -l < "$ARTIFACT_DIR/BASE-REJECT-FILES.txt" | tr -d ' ')"
          FIX_REJECTS="$(wc -l < "$ARTIFACT_DIR/VEUX-FIX-REJECT-FILES.txt" | tr -d ' ')"
          MISSING_TARGETS="$(wc -l < "$ARTIFACT_DIR/BASE-MISSING-EXPECTED-TARGETS.txt" | tr -d ' ')"
          CONFIG_GAPS="$(wc -l < "$ARTIFACT_DIR/KERNEL-CONFIGS-NOT-DEFINED-BY-RESUKISU.txt" | tr -d ' ')"
          CONFIG_READY="$(tr -d '\r\n' < "$ARTIFACT_DIR/CONFIG-READINESS.txt")"
          INLINE_READY="$(tr -d '\r\n' < "$ARTIFACT_DIR/INLINE-HOOK-READINESS.txt")"

          if [ "$BASE_REJECTS" -eq 0 ] && \
             [ "$FIX_REJECTS" -eq 0 ] && \
             [ "$MISSING_TARGETS" -eq 0 ] && \
             [ "$CONFIG_GAPS" -eq 0 ] && \
             [ "$CONFIG_READY" = "CONFIG_READY=YES" ] && \
             [ "$INLINE_READY" = "INLINE_HOOK_READY=YES" ]; then
            RESULT="READY_FOR_REAL_BUILD_PREP"
          else
            RESULT="ADAPTATION_REQUIRED"
          fi

          {
            echo "VEUX 5.4.274 ReSukiSU SUSFS 2.2 Compatibility Audit"
            echo "======================================================"
            echo
            echo "RESULT: $RESULT"
            echo
            echo "Candidate 2 tree: $EXPECTED_CANDIDATE_TREE"
            echo "ReSukiSU: $RESUKISU_COMMIT"
            echo "Backport commit: $BACKPORT_COMMIT"
            echo "Backport blob: $BACKPORT_PATCH_BLOB"
            echo "VEUX fix commit: $VEUX_FIX_COMMIT"
            echo "VEUX fix blob: $VEUX_FIX_PATCH_BLOB"
            echo
            echo "Base patch exit code: $BASE_RC"
            echo "Base reject files: $BASE_REJECTS"
            echo "VEUX fix exit code: $FIX_RC"
            echo "VEUX fix reject files: $FIX_REJECTS"
            echo "Missing expected base targets: $MISSING_TARGETS"
            echo "Kernel config refs missing from ReSukiSU: $CONFIG_GAPS"
            echo "$CONFIG_READY"
            echo "$INLINE_READY"
            echo
            echo "Resolved hook mode: CONFIG_KSU_SUSFS=y"
            echo "Manual Hook active: NO"
            echo "Tracepoint Hook active: NO"
            echo "CONFIG_DEBUG_KERNEL active: NO"
            echo "CONFIG_KALLSYMS_ALL active: NO"
            echo
            echo "Audit only: no Image, no boot.img, no flashing."
          } | tee "$ARTIFACT_DIR/SUSFS-2.2-COMPATIBILITY-SUMMARY.txt"

      - name: Upload SUSFS 2.2 compatibility audit
        uses: actions/upload-artifact@v7
        with:
          name: veux-5.4.274-resukisu-susfs-2.2-audit-${{ github.run_number }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
