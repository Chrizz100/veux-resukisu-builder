name: KSU2-P1 - VEUX 5.4.274 Inactive-KSU Proven Baseline Checkpoint v3

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ksu2-p1-v3-veux-5-4-274-inactive-ksu-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean-baseline:
    name: KSU2-P1 v3 VEUX 5.4.274 inactive-KSU proven baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ARCH: arm64

      SOURCE_REPOSITORY: dereference23/kernel_xiaomi_sm6375
      SOURCE_REF: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      COMMON_REF: android11-5.4.274_r00
      STOCK_REF: veux-r-oss

      STABILITY_REVERT: f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80
      EXPECTED_CANDIDATE_TREE: 5d25b7e0124d7fb695f3f07b45928fcb5780d0e8
      EXPECTED_CUMULATIVE_TREE: 9a1395f5e72d12d0fdb107dc7531c8e2c731693c

      IDLE_SCREEN_COMMIT: 64e34240600a0c90072972a6c3d86f1d6ec85c53
      IDLE_EXPOSE_COMMIT: 4ac606c780ae02a075d75a2703be68880761531a
      IDLE_NOTIFIER_COMMIT: 8bc9cc6e197c0d1cf166ed94bb53ce41add1c828
      IDLE_OPTIMIZE_COMMIT: 1d49e9b3308a7eacd75ed67f4112914e74ee60db

      CPUFREQ_MIN_COMMIT: 44242207c9afe2b3e7fb5bdc18da42e918043c63
      CPUFREQ_MAX_COMMIT: 3a25ef84be1d26cf0ddd526534358febd04529c5
      EXPECTED_CPUFREQ_BEFORE_SHA256: e1fa642651d4cf66fe59bf0eb615974bb403057dad5daeb3b7a8b1e9c06de646
      EXPECTED_CPUFREQ_AFTER_SHA256: 9ac85ecaafbdddfb43d2b361183b455448ce400fad1296ae290510ad33039ceb
      EXPECTED_STORE_ONE_BEFORE_SHA256: 5b85f632ef77eeee55d4b404a08e9d96ec87af0201ba1d634150c3ef418f37e3
      EXPECTED_STORE_ONE_AFTER_SHA256: 0bbe18c9eee2059f4d2ec636b604f50bda90b131261e857b0dbc717c512ef28e

      EXPECTED_SCHEDUTIL_BEFORE_SHA256: 9d56491a427ee12f1156ae907c5aa647bf1a1b35bf13c725a08e73ef295274b7
      EXPECTED_SCHEDUTIL_AFTER_SHA256: 987c9598f16b22a1e7b343475691687d309122de447494cd1a2b5ea8cbbafffc

      LB_CAPACITY_COMMIT: 2c1495be9eabac845acc8da45f070622d6455091
      EXPECTED_CASS_DIFF_SHA256: 67abb81be8c2d7727c3e4c8a92419c9e9a3d97ee3d3e5355d3acabce34adf659
      EXPECTED_XIAOMI_PELT_SHA256: bad23ba491cc5d4669936507b392888765aa65fd8063b2a95a492d6b0dca0cb0
      EXPECTED_HZ_KCONFIG_SHA256: 685e9a79f3dbf17e9bd5b402dfd25ad014886fbe1b6975a0913b3621519cd7fe

      EXPECTED_LPM_AFTER_SHA256: 6805651af0a60905ce04356df3a538be15e94b6c8599a1d35e414d0a50b67094
      EXPECTED_CPUIDLE_CORE_AFTER_SHA256: e7f7fba62ce2bbe82f23c6bfbf5a103161d1c8013b85f7f48e4c036758f6a603
      EXPECTED_CPUIDLE_HEADER_AFTER_SHA256: 9149734aa0eef1bba2e7ae16902dfd3aa203f23fe41657ce7df50ab947620506

      EXPECTED_VEUX_DTB_SHA256: 42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37
      EXPECTED_VEUX_DTB_BYTES: "275689"

      # P1-v2 independently observed PROVEN build identity.
      # v3 must reproduce these bytes before it may create the corrected backup.
      EXPECTED_P1_V2_IMAGE_BYTES: "29776384"
      EXPECTED_P1_V2_IMAGE_SHA256: 07b8058b251185c8fb75cee06ac54eae6dcb8114b3cfa4e58870a1bab4dc8052
      EXPECTED_P1_V2_VMLINUX_SHA256: 3b8bfc58ba6e4bd9463922076e7f0e116c4345a3bcf8564bdda043c25d9edf93
      EXPECTED_P1_V2_SYSTEM_MAP_SHA256: 1f0782c14be05d99d1335ea0725b4a60c6e2f1b961ae107922191dbe0194fffb
      EXPECTED_P1_V2_CONFIG_SHA256: aa488df7f11495c6d4a34ba22eca854c398158b6ea47a56717200d1527122fc2

      CLANG_PREBUILT_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      OUT_DIR: out-ksu2-p1
      ARTIFACT_DIR: ${{ github.workspace }}/ksu2-p1-artifact
      SOURCE_BACKUP_DIR: ${{ github.workspace }}/ksu2-p1-source-backup
      BUILD_BACKUP_DIR: ${{ github.workspace }}/ksu2-p1-build-backup

      KBUILD_BUILD_USER: ksu2-p1
      KBUILD_BUILD_HOST: veux-clean-baseline
      KBUILD_BUILD_TIMESTAMP: "Thu Sep 03 00:00:00 UTC 2026"
      KBUILD_BUILD_VERSION: "1"
      SOURCE_DATE_EPOCH: "1788393600"

      GIT_AUTHOR_DATE: "2026-09-03T00:00:00Z"
      GIT_COMMITTER_DATE: "2026-09-03T00:00:00Z"
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Initialize KSU2-P1 checkpoint audit
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ARTIFACT_DIR" "$SOURCE_BACKUP_DIR" "$BUILD_BACKUP_DIR"
          mkdir -p "$ARTIFACT_DIR" "$SOURCE_BACKUP_DIR" "$BUILD_BACKUP_DIR" "$TOOLCHAIN_DIR"

          cat > "$ARTIFACT_DIR/PLAN.txt" <<'EOF'
          KSU2-P1 - VEUX Linux 5.4.274 Inactive-KSU Proven Baseline Checkpoint v3
          =================================================================

          Purpose:
          - rebuild the already proven cumulative VEUX 5.4.274 baseline
          - preserve the inherited legacy KernelSU source exactly as part of the proven source tree
          - require inherited KernelSU to remain disabled by configuration and absent from linked output
          - do not integrate or update KernelSU in P1
          - do not integrate ReSukiSU
          - do not integrate SUSFS
          - require the exact proven pre-SUSFS Git tree
          - perform a complete Image + DTBs build
          - reproduce the exact P1-v2 build hashes before backup creation
          - create immutable source and build checkpoint artifacts only after PASS
          - preserve both .config and a non-hidden final.config copy in the build backup

          Proven source-tree target:
          9a1395f5e72d12d0fdb107dc7531c8e2c731693c

          Checkpoint policy:
          - a failed build creates no PROVEN checkpoint
          - a successful run records all important identities and hashes
          - later KSU2 stages must never modify this P1 checkpoint
          - later stages reconstruct or compare against this exact P1 identity

          No boot.img.
          No flashable ZIP.
          No device access.
          No flashing.
          EOF

          {
            echo "KSU2_STAGE=P1"
            echo "KERNEL=VEUX_5.4.274"
            echo "ACTIVE_ROOT_MANAGER=NONE"
            echo "INHERITED_KERNELSU_SOURCE=PRESENT_DISABLED"
            echo "SUSFS=NONE"
            echo "EXPECTED_CUMULATIVE_TREE=$EXPECTED_CUMULATIVE_TREE"
            echo "CHECKPOINT_POLICY=BUILD_PASS_BEFORE_BACKUP"
          } | tee "$ARTIFACT_DIR/HEADER.txt"

      - name: Install deterministic build dependencies
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail

          for FILE in \
            /etc/apt/apt-mirrors.txt \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/ubuntu.sources
          do
            if [ -f "$FILE" ]; then
              sudo sed -i \
                's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
                "$FILE"
            fi
          done

          sudo timeout 600 apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update

          sudo timeout 600 apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends \
              bc \
              bison \
              build-essential \
              ca-certificates \
              cpio \
              curl \
              flex \
              git \
              libelf-dev \
              libncurses-dev \
              libssl-dev \
              patch \
              python3 \
              python-is-python3 \
              rsync \
              xz-utils \
              zstd

          echo "DEPENDENCIES=PASS" | tee "$ARTIFACT_DIR/DEPENDENCIES.txt"

      - name: Install exact Android clang-r416183b
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 300 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz" \
            -o "${RUNNER_TEMP}/clang-r416183b.tar.gz"

          tar -xzf "${RUNNER_TEMP}/clang-r416183b.tar.gz" -C "$TOOLCHAIN_DIR"
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

          "$TOOLCHAIN_DIR/bin/clang" --version | tee "$ARTIFACT_DIR/clang-version.txt"
          "$TOOLCHAIN_DIR/bin/ld.lld" --version | tee -a "$ARTIFACT_DIR/clang-version.txt"

          "$TOOLCHAIN_DIR/bin/clang" --version | grep -q 'r416183b'

          for TOOL in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-size llvm-strip; do
            test -x "$TOOLCHAIN_DIR/bin/$TOOL"
          done

          echo "CLANG_R416183B=PASS" | tee "$ARTIFACT_DIR/TOOLCHAIN-STATE.txt"

      - name: Checkout immutable VEUX source base
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Recreate exact Linux 5.4.274 Candidate 2
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BASE_SHA="$(git rev-parse HEAD)"
          test "$BASE_SHA" = "$SOURCE_REF"

          git remote remove android-common 2>/dev/null || true
          git remote add android-common https://android.googlesource.com/kernel/common
          git fetch --no-tags android-common "$COMMON_REF"

          COMMON_SHA="$(git rev-parse FETCH_HEAD)"
          git update-ref refs/remotes/android-common/ksu2-p1 "$COMMON_SHA"

          git merge --no-edit "$COMMON_SHA"
          MERGED_SHA="$(git rev-parse HEAD)"

          git cat-file -e "${STABILITY_REVERT}^{commit}"
          git revert --no-edit "$STABILITY_REVERT"

          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"
          KERNEL_VERSION="$(make -s kernelversion)"

          test "$KERNEL_VERSION" = "5.4.274"

          if [ "$CANDIDATE_TREE" != "$EXPECTED_CANDIDATE_TREE" ]; then
            echo "ERROR: Candidate tree mismatch"
            echo "Expected: $EXPECTED_CANDIDATE_TREE"
            echo "Actual:   $CANDIDATE_TREE"
            exit 1
          fi

          {
            echo "SOURCE_BASE_SHA=$BASE_SHA"
            echo "COMMON_SHA=$COMMON_SHA"
            echo "MERGED_SHA=$MERGED_SHA"
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "CANDIDATE_TREE=$CANDIDATE_TREE"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
          } | tee "$ARTIFACT_DIR/CANDIDATE-IDENTITY.txt"

          {
            echo "SOURCE_BASE_SHA=$BASE_SHA"
            echo "COMMON_SHA=$COMMON_SHA"
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
          } >> "$GITHUB_ENV"

      - name: Fetch official Xiaomi VEUX reference
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git remote remove xiaomi 2>/dev/null || true
          git remote add xiaomi https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
          git fetch --no-tags xiaomi "+refs/heads/${STOCK_REF}:refs/remotes/xiaomi/${STOCK_REF}"

          STOCK_SHA="$(git rev-parse "xiaomi/${STOCK_REF}")"
          echo "STOCK_SHA=$STOCK_SHA" | tee "$ARTIFACT_DIR/XIAOMI-REFERENCE.txt"
          echo "STOCK_SHA=$STOCK_SHA" >> "$GITHUB_ENV"

      - name: Restore Xiaomi idle sleep policy
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          for COMMIT in \
            "$IDLE_SCREEN_COMMIT" \
            "$IDLE_EXPOSE_COMMIT" \
            "$IDLE_NOTIFIER_COMMIT" \
            "$IDLE_OPTIMIZE_COMMIT"
          do
            git cat-file -e "${COMMIT}^{commit}"
            git merge-base --is-ancestor "$COMMIT" "$CANDIDATE_SHA"
          done

          git revert --no-edit "$IDLE_OPTIMIZE_COMMIT"
          git revert --no-edit "$IDLE_NOTIFIER_COMMIT"
          git revert --no-edit "$IDLE_EXPOSE_COMMIT"
          git revert --no-edit "$IDLE_SCREEN_COMMIT"

          LPM_SHA="$(sha256sum drivers/cpuidle/lpm-levels.c | awk '{print $1}')"
          CORE_SHA="$(sha256sum drivers/cpuidle/cpuidle.c | awk '{print $1}')"
          HEADER_SHA="$(sha256sum include/linux/cpuidle.h | awk '{print $1}')"

          test "$LPM_SHA" = "$EXPECTED_LPM_AFTER_SHA256"
          test "$CORE_SHA" = "$EXPECTED_CPUIDLE_CORE_AFTER_SHA256"
          test "$HEADER_SHA" = "$EXPECTED_CPUIDLE_HEADER_AFTER_SHA256"

          {
            echo "IDLE_RESTORE=PASS"
            echo "LPM_SHA256=$LPM_SHA"
            echo "CPUIDLE_CORE_SHA256=$CORE_SHA"
            echo "CPUIDLE_HEADER_SHA256=$HEADER_SHA"
          } | tee "$ARTIFACT_DIR/IDLE-RESTORE-STATE.txt"

      - name: Restore standard CPUFreq min max sysfs behavior
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="drivers/cpufreq/cpufreq.c"
          BEFORE_SHA="$(sha256sum "$SOURCE" | awk '{print $1}')"
          test "$BEFORE_SHA" = "$EXPECTED_CPUFREQ_BEFORE_SHA256"

          git cat-file -e "${CPUFREQ_MIN_COMMIT}^{commit}"
          git cat-file -e "${CPUFREQ_MAX_COMMIT}^{commit}"
          test "$(git rev-parse "${CPUFREQ_MAX_COMMIT}^")" = "$CPUFREQ_MIN_COMMIT"

          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          path = Path("drivers/cpufreq/cpufreq.c")
          text = path.read_text(encoding="utf-8")
          start_marker = "#define store_one(file_name, object)"
          end_marker = "store_one(scaling_max_freq, max);"

          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("CPUFreq store_one anchors missing")
          end += len(end_marker)

          macro = text[start:end]
          if end < len(text) and text[end] == "\n":
              macro += "\n"

          before = hashlib.sha256(macro.encode()).hexdigest()
          if before != os.environ["EXPECTED_STORE_ONE_BEFORE_SHA256"]:
              raise SystemExit(f"CPUFreq macro baseline mismatch: {before}")

          lines = macro.splitlines(keepends=True)

          def unique(token):
              found = [i for i, line in enumerate(lines) if token in line]
              if len(found) != 1:
                  raise SystemExit(f"CPUFreq anchor count mismatch for {token}: {len(found)}")
              return found[0]

          min_condition = unique("if (&policy->object == &policy->min)")
          parse_line = unique('ret = sscanf(buf, "%lu", &val);')
          max_condition = unique("if (&policy->object == &policy->max)")
          qos_line = unique("freq_qos_update_request(")

          if not (min_condition < parse_line < max_condition < qos_line):
              raise SystemExit("CPUFreq anchor order mismatch")

          sanitized = "".join(lines[:min_condition] + lines[parse_line:max_condition] + lines[qos_line:])
          after = hashlib.sha256(sanitized.encode()).hexdigest()
          if after != os.environ["EXPECTED_STORE_ONE_AFTER_SHA256"]:
              raise SystemExit(f"CPUFreq sanitized macro mismatch: {after}")

          corrected = text[:start] + sanitized + text[start + len(macro):]
          corrected_sha = hashlib.sha256(corrected.encode()).hexdigest()
          if corrected_sha != os.environ["EXPECTED_CPUFREQ_AFTER_SHA256"]:
              raise SystemExit(f"CPUFreq corrected file mismatch: {corrected_sha}")

          path.write_text(corrected, encoding="utf-8")
          PY

          AFTER_SHA="$(sha256sum "$SOURCE" | awk '{print $1}')"
          test "$AFTER_SHA" = "$EXPECTED_CPUFREQ_AFTER_SHA256"

          {
            echo "CPUFREQ_RESTORE=PASS"
            echo "CPUFREQ_BEFORE_SHA256=$BEFORE_SHA"
            echo "CPUFREQ_AFTER_SHA256=$AFTER_SHA"
          } | tee "$ARTIFACT_DIR/CPUFREQ-RESTORE-STATE.txt"

      - name: Restore standard schedutil behavior
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="kernel/sched/cpufreq_schedutil.c"
          BEFORE_SHA="$(sha256sum "$SOURCE" | awk '{print $1}')"
          test "$BEFORE_SHA" = "$EXPECTED_SCHEDUTIL_BEFORE_SHA256"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("kernel/sched/cpufreq_schedutil.c")
          text = path.read_text(encoding="utf-8")

          declaration = "\tunsigned int idx, l_freq, h_freq;\n"
          if text.count(declaration) != 1:
              raise SystemExit("schedutil declaration anchor mismatch")
          text = text.replace(declaration, "", 1)

          old_frequency_block = """\
          \tl_freq = cpufreq_driver_resolve_freq(policy, freq);
          \tidx = cpufreq_frequency_table_target(policy, freq, CPUFREQ_RELATION_H);
          \th_freq = policy->freq_table[idx].frequency;
          \th_freq = clamp(h_freq, policy->min, policy->max);
          \tif (l_freq <= h_freq || l_freq == policy->min)
          \t\treturn l_freq;
          
          \t/*
          \t * Use the frequency step below if the calculated frequency is <20%
          \t * higher than it.
          \t */
          \tif (mult_frac(100, freq - h_freq, l_freq - h_freq) < 20)
          \t\treturn h_freq;
          
          \treturn l_freq;
          """
          standard_frequency_block = "\treturn cpufreq_driver_resolve_freq(policy, freq);\n"
          if text.count(old_frequency_block) != 1:
              raise SystemExit("schedutil lower-step block mismatch")
          text = text.replace(old_frequency_block, standard_frequency_block, 1)

          cap_only = "\tif (type == FREQUENCY_UTIL && uclamp_rq_util_with(rq, util, p) < util)\n"
          normal = "\tif (type == FREQUENCY_UTIL)\n"
          if text.count(cap_only) != 1:
              raise SystemExit("schedutil UClamp anchor mismatch")
          text = text.replace(cap_only, normal, 1)

          path.write_text(text, encoding="utf-8")
          PY

          AFTER_SHA="$(sha256sum "$SOURCE" | awk '{print $1}')"
          test "$AFTER_SHA" = "$EXPECTED_SCHEDUTIL_AFTER_SHA256"

          {
            echo "SCHEDUTIL_RESTORE=PASS"
            echo "SCHEDUTIL_BEFORE_SHA256=$BEFORE_SHA"
            echo "SCHEDUTIL_AFTER_SHA256=$AFTER_SHA"
          } | tee "$ARTIFACT_DIR/SCHEDUTIL-RESTORE-STATE.txt"

      - name: Remove custom HZ100
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="arch/arm64/configs/veux_defconfig"
          test "$(grep -xc 'CONFIG_HZ_100=y' "$DEFCONFIG" || true)" -eq 1

          python3 - <<'PY'
          from pathlib import Path
          path = Path("arch/arm64/configs/veux_defconfig")
          text = path.read_text(encoding="utf-8")
          target = "CONFIG_HZ_100=y\n"
          if text.count(target) != 1:
              raise SystemExit("HZ100 line count mismatch")
          path.write_text(text.replace(target, "", 1), encoding="utf-8")
          PY

          if grep -qE '^CONFIG_HZ_(100|250|300|1000)=y$' "$DEFCONFIG"; then
            echo "ERROR: explicit HZ selection remains in defconfig"
            exit 1
          fi

          HZ_SHA="$(sha256sum kernel/Kconfig.hz | awk '{print $1}')"
          test "$HZ_SHA" = "$EXPECTED_HZ_KCONFIG_SHA256"
          grep -qF 'default HZ_250' kernel/Kconfig.hz

          echo "HZ100_REMOVAL=PASS" | tee "$ARTIFACT_DIR/HZ-STATE.txt"

      - name: Restore standard load balance capacity rate limit
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git cat-file -e "${LB_CAPACITY_COMMIT}^{commit}"
          git show --format= --binary "$LB_CAPACITY_COMMIT" > "$ARTIFACT_DIR/LB-CAPACITY-ORIGINAL.patch"
          git apply --reverse --check "$ARTIFACT_DIR/LB-CAPACITY-ORIGINAL.patch"
          git apply --reverse "$ARTIFACT_DIR/LB-CAPACITY-ORIGINAL.patch"

          grep -qF 'time_after_eq(jiffies, sg->sgc->next_update)' kernel/sched/fair.c
          grep -qF 'next_update;' kernel/sched/sched.h

          echo "LB_CAPACITY_RESTORE=PASS" | tee "$ARTIFACT_DIR/LB-CAPACITY-STATE.txt"

      - name: Apply proven CASS max frequency thermal correction
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${RUNNER_TEMP}/cass-before.c"
          cp kernel/sched/cass.c "$BEFORE"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("kernel/sched/cass.c")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "\tunsigned long cap;\n\tunsigned long cap_max;\n\tunsigned long eff_util;\n",
                  "\tunsigned long cap;\n\tunsigned long cap_max;\n\tunsigned long cap_no_therm;\n\tunsigned long cap_orig;\n\tunsigned long eff_util;\n",
                  "CASS struct capacity fields",
              ),
              (
                  "\tc->cap = c->cap_max - min(c->hard_util, c->cap_max - 1);\n",
                  "\tc->cap = c->cap_max - min(c->hard_util, c->cap_max - 1);\n\n"
                  "\t/*\n"
                  "\t * Keep a non-throttled capacity denominator for relative load\n"
                  "\t * balancing, matching the original CASS capacity separation.\n"
                  "\t */\n"
                  "\tc->cap_no_therm =\n"
                  "\t\tc->cap_orig - min(c->hard_util, c->cap_orig - 1);\n",
                  "CASS non-thermal capacity",
              ),
              (
                  "\t\t/* Get the original, maximum _possible_ capacity of this CPU */\n"
                  "\t\tcurr->cap_max = arch_scale_cpu_capacity(cpu);\n",
                  "\t\t/* Get the original, maximum possible capacity of this CPU. */\n"
                  "\t\tcurr->cap_orig = arch_scale_cpu_capacity(cpu);\n\n"
                  "\t\t/* Account for the current maximum allowed CPU frequency. */\n"
                  "\t\tcurr->cap_max =\n"
                  "\t\t\tcurr->cap_orig *\n"
                  "\t\t\tarch_scale_max_freq_capacity(NULL, cpu) >>\n"
                  "\t\t\tSCHED_CAPACITY_SHIFT;\n\n"
                  "\t\t/* Keep all later capacity divisions well-defined. */\n"
                  "\t\tcurr->cap_max = max(curr->cap_max, 1UL);\n",
                  "CASS max-frequency capacity",
              ),
              (
                  "\t\tcurr->util =\n\t\t\tcurr->util * SCHED_CAPACITY_SCALE / curr->cap;\n",
                  "\t\tcurr->util =\n\t\t\tcurr->util * SCHED_CAPACITY_SCALE /\n\t\t\tcurr->cap_no_therm;\n",
                  "CASS utilization denominator",
              ),
          ]

          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"{label} anchor mismatch: {text.count(old)}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          git diff --no-ext-diff --no-color -- kernel/sched/cass.c > "$ARTIFACT_DIR/CASS-PATCH.diff"
          CASS_SHA="$(sha256sum "$ARTIFACT_DIR/CASS-PATCH.diff" | awk '{print $1}')"
          test "$CASS_SHA" = "$EXPECTED_CASS_DIFF_SHA256"

          {
            echo "CASS_PATCH=PASS"
            echo "CASS_DIFF_SHA256=$CASS_SHA"
          } | tee "$ARTIFACT_DIR/CASS-STATE.txt"

      - name: Restore cumulative VEUX defconfig
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/configs/veux_defconfig")
          text = path.read_text(encoding="utf-8")

          old_rotation = "CONFIG_SPRD_ROTATION_TASK=y"
          new_rotation = "# CONFIG_SPRD_ROTATION_TASK is not set"
          if text.count(old_rotation) != 1:
              raise SystemExit("SPRD rotation anchor mismatch")
          text = text.replace(old_rotation, new_rotation, 1)

          if "CONFIG_CPUSETS=y" in text:
              raise SystemExit("CPUSETS unexpectedly already present")

          old = "CONFIG_CGROUP_FREEZER=y\nCONFIG_CGROUP_CPUACCT=y\n"
          new = "CONFIG_CGROUP_FREEZER=y\nCONFIG_CPUSETS=y\nCONFIG_CGROUP_CPUACCT=y\n"
          if text.count(old) != 1:
              raise SystemExit("CPUSETS anchor mismatch")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          grep -qx '# CONFIG_SPRD_ROTATION_TASK is not set' arch/arm64/configs/veux_defconfig
          grep -qx 'CONFIG_CPUSETS=y' arch/arm64/configs/veux_defconfig

          echo "VEUX_DEFCONFIG_RESTORE=PASS" | tee "$ARTIFACT_DIR/DEFCONFIG-STATE.txt"

      - name: Restore exact Xiaomi VEUX PELT8
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          HEADER="kernel/sched/sched-pelt.h"
          git show "xiaomi/${STOCK_REF}:kernel/sched/sched-pelt.h" > "$HEADER"

          HEADER_SHA="$(sha256sum "$HEADER" | awk '{print $1}')"
          test "$HEADER_SHA" = "$EXPECTED_XIAOMI_PELT_SHA256"
          grep -qx '#define LOAD_AVG_PERIOD 8' "$HEADER"
          grep -qx '#define LOAD_AVG_MAX 12336' "$HEADER"

          {
            echo "PELT8_RESTORE=PASS"
            echo "PELT_HEADER_SHA256=$HEADER_SHA"
          } | tee "$ARTIFACT_DIR/PELT8-STATE.txt"

      - name: Gate exact root-free cumulative source tree
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CPUFREQ="drivers/cpufreq/cpufreq.c"
          SUGOV="kernel/sched/cpufreq_schedutil.c"
          LPM="drivers/cpuidle/lpm-levels.c"
          CORE="drivers/cpuidle/cpuidle.c"
          HEADER="include/linux/cpuidle.h"
          DEFCONFIG="arch/arm64/configs/veux_defconfig"

          test "$(sha256sum "$CPUFREQ" | awk '{print $1}')" = "$EXPECTED_CPUFREQ_AFTER_SHA256"
          test "$(sha256sum "$SUGOV" | awk '{print $1}')" = "$EXPECTED_SCHEDUTIL_AFTER_SHA256"
          test "$(sha256sum "$LPM" | awk '{print $1}')" = "$EXPECTED_LPM_AFTER_SHA256"
          test "$(sha256sum "$CORE" | awk '{print $1}')" = "$EXPECTED_CPUIDLE_CORE_AFTER_SHA256"
          test "$(sha256sum "$HEADER" | awk '{print $1}')" = "$EXPECTED_CPUIDLE_HEADER_AFTER_SHA256"

          grep -qF 'time_after_eq(jiffies, sg->sgc->next_update)' kernel/sched/fair.c
          grep -qF 'arch_scale_max_freq_capacity(NULL, cpu)' kernel/sched/cass.c
          grep -qF 'curr->cap_no_therm' kernel/sched/cass.c
          grep -qx '#define LOAD_AVG_PERIOD 8' kernel/sched/sched-pelt.h
          grep -qx 'CONFIG_CPUSETS=y' "$DEFCONFIG"
          grep -qx '# CONFIG_SPRD_ROTATION_TASK is not set' "$DEFCONFIG"

          if grep -qE '^CONFIG_HZ_(100|250|300|1000)=y$' "$DEFCONFIG"; then
            echo "ERROR: explicit HZ selection remains"
            exit 1
          fi

          if grep -qF 'mult_frac(100, freq - h_freq, l_freq - h_freq) < 20' "$SUGOV"; then
            echo "ERROR: schedutil lower-step heuristic remains"
            exit 1
          fi

          if grep -qF 'uclamp_rq_util_with(rq, util, p) < util' "$SUGOV"; then
            echo "ERROR: schedutil cap-only UClamp remains"
            exit 1
          fi

          if grep -qF 'lpm_sleep_disabled' "$CORE" || grep -qF 'lpm_sleep_disabled' "$HEADER"; then
            echo "ERROR: lpm_sleep_disabled residue remains"
            exit 1
          fi

          git diff --check
          git add -A
          TREE="$(git write-tree)"

          if [ "$TREE" != "$EXPECTED_CUMULATIVE_TREE" ]; then
            echo "ERROR: KSU2-P1 cumulative tree mismatch"
            echo "Expected: $EXPECTED_CUMULATIVE_TREE"
            echo "Actual:   $TREE"
            git diff --cached --stat
            exit 1
          fi

          git commit -m "ksu2-p1: exact clean proven VEUX 5.4.274 baseline"

          FINAL_TREE="$(git rev-parse HEAD^{tree})"
          test "$FINAL_TREE" = "$EXPECTED_CUMULATIVE_TREE"
          test -z "$(git status --porcelain)"

          {
            echo "KSU2_P1_SOURCE_TREE=PASS"
            echo "CUMULATIVE_SHA=$(git rev-parse HEAD)"
            echo "CUMULATIVE_TREE=$FINAL_TREE"
            echo "KERNEL_VERSION=$(make -s kernelversion)"
          } | tee "$ARTIFACT_DIR/P1-SOURCE-IDENTITY.txt"

          echo "P1_CUMULATIVE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prove inherited KernelSU is disabled and SUSFS ReSukiSU absent
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          # The proven dereference23 baseline intentionally contains an older
          # KernelSU source subtree and CONFIG_KSU wiring. P1 preserves the
          # exact proven Git tree; it proves that this inherited code is inert,
          # not that the source files are physically absent.
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_CUMULATIVE_TREE"
          test -d drivers/kernelsu
          test -s drivers/kernelsu/Kconfig
          test -s drivers/kernelsu/Makefile

          grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile

          KSU_SUBTREE="$(git rev-parse HEAD:drivers/kernelsu)"
          KSU_FILE_COUNT="$(git ls-tree -r --name-only HEAD drivers/kernelsu | wc -l | tr -d ' ')"

          # P1 must not already contain the new SUSFS/ReSukiSU layer anywhere.
          SUSFS_RESUKISU_MATCHES="$(
            grep -RInE \
              --exclude-dir=.git \
              --exclude-dir="$OUT_DIR" \
              --include='*.c' \
              --include='*.h' \
              --include='Kconfig*' \
              --include='Makefile*' \
              --include='*.mk' \
              'CONFIG_SUSFS|CONFIG_KSU_SUSFS|susfs_[A-Za-z0-9_]+|SUSFS_VERSION|ReSukiSU' \
              fs include kernel security mm drivers arch/arm64/configs \
              2>/dev/null || true
          )"

          if [ -n "$SUSFS_RESUKISU_MATCHES" ]; then
            printf '%s\n' "$SUSFS_RESUKISU_MATCHES" | tee "$ARTIFACT_DIR/ROOT-CODE-GUARD.txt"
            echo "ERROR: SUSFS/ReSukiSU residue detected in P1"
            exit 1
          fi

          # Record the inherited conditional KSU hook footprint. These hooks may
          # exist under CONFIG_KSU guards; the following config/link gates must
          # prove that none becomes active in the P1 kernel.
          grep -RInE \
            --exclude-dir=.git \
            --exclude-dir="$OUT_DIR" \
            --exclude-dir=kernelsu \
            --include='*.c' \
            --include='*.h' \
            'CONFIG_KSU|ksu_[A-Za-z0-9_]+' \
            fs include kernel security mm drivers arch/arm64/configs \
            2>/dev/null \
            | sort \
            > "$ARTIFACT_DIR/INHERITED-KSU-HOOK-FOOTPRINT.txt" \
            || true

          {
            echo "P1_SOURCE_GUARD=PASS"
            echo "INHERITED_KERNELSU_SOURCE=PRESENT"
            echo "INHERITED_KERNELSU_SUBTREE=$KSU_SUBTREE"
            echo "INHERITED_KERNELSU_FILE_COUNT=$KSU_FILE_COUNT"
            echo "INHERITED_KERNELSU_POLICY=MUST_REMAIN_CONFIG_DISABLED_AND_UNLINKED"
            echo "RESUKISU_CODE=ABSENT"
            echo "SUSFS_CODE=ABSENT"
            echo "ACTIVE_ROOT_MANAGER_EXPECTED=NONE"
          } | tee "$ARTIFACT_DIR/ROOT-CODE-GUARD.txt"

      - name: Resolve clean VEUX configuration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          rm -rf "$OUT_DIR"

          make O="$OUT_DIR" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 veux_defconfig 2>&1 | tee "$ARTIFACT_DIR/defconfig.log"

          CONFIG="$OUT_DIR/.config"
          test -s "$CONFIG"

          REQUIRED_Y=(
            CONFIG_64BIT
            CONFIG_CC_IS_CLANG
            CONFIG_LD_IS_LLD
            CONFIG_CPUSETS
            CONFIG_SCHED_CASS
            CONFIG_HZ_250
            CONFIG_CPU_FREQ
            CONFIG_CPU_FREQ_GOV_SCHEDUTIL
            CONFIG_ARM_QCOM_CPUFREQ_HW
            CONFIG_CPU_IDLE
            CONFIG_ARM_QCOM_LPM_CPUIDLE
          )

          for SYMBOL in "${REQUIRED_Y[@]}"; do
            grep -qx "${SYMBOL}=y" "$CONFIG" || {
              echo "ERROR: required config is not y: $SYMBOL"
              exit 1
            }
          done

          grep -qx 'CONFIG_HZ=250' "$CONFIG"
          grep -qx '# CONFIG_SPRD_ROTATION_TASK is not set' "$CONFIG"

          if grep -Eq '^CONFIG_(KSU|SUSFS|KSU_SUSFS)(=|_)' "$CONFIG"; then
            echo "ERROR: root/SUSFS config unexpectedly present"
            grep -E '^CONFIG_(KSU|SUSFS|KSU_SUSFS)(=|_)' "$CONFIG" || true
            exit 1
          fi

          CONFIG_SHA="$(sha256sum "$CONFIG" | awk '{print $1}')"
          cp "$CONFIG" "$ARTIFACT_DIR/config-before-build"

          make -s O="$OUT_DIR" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 kernelrelease | tee "$ARTIFACT_DIR/kernelrelease.txt"

          {
            echo "P1_CONFIG=PASS"
            echo "CONFIG_SHA256=$CONFIG_SHA"
            echo "CONFIG_HZ_250=y"
            echo "CONFIG_CPUSETS=y"
            echo "CONFIG_SCHED_CASS=y"
            echo "KSU_CONFIG=ABSENT"
            echo "SUSFS_CONFIG=ABSENT"
            echo "ACTIVE_ROOT_MANAGER=NONE"
          } | tee "$ARTIFACT_DIR/P1-CONFIG-STATE.txt"

      - name: Build complete clean kernel Image and DTBs
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          set +e
          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            Image \
            dtbs \
            2>&1 | tee "$ARTIFACT_DIR/full-build.log"
          BUILD_RC=${PIPESTATUS[0]}
          set -e

          printf '%s\n' "$BUILD_RC" > "$ARTIFACT_DIR/full-build.exit-code"
          test "$BUILD_RC" -eq 0

      - name: Audit compiler diagnostics and immutable config
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LOG="$ARTIFACT_DIR/full-build.log"
          CONFIG="$OUT_DIR/.config"

          test -s "$CONFIG"
          cmp -s "$ARTIFACT_DIR/config-before-build" "$CONFIG"

          grep -Ei '(^|[[:space:]])error:' "$LOG" > "$ARTIFACT_DIR/FULL-BUILD-ERRORS.txt" || true
          grep -Ei '(^|[[:space:]])warning:' "$LOG" > "$ARTIFACT_DIR/FULL-BUILD-WARNINGS.txt" || true
          grep -E 'drivers/cpufreq/cpufreq\.c:.*warning:' "$LOG" > "$ARTIFACT_DIR/CPUFREQ-WARNINGS.txt" || true
          grep -Ei '(drivers/cpuidle/cpuidle\.c|drivers/cpuidle/lpm-levels\.c):.*warning:' "$LOG" > "$ARTIFACT_DIR/IDLE-WARNINGS.txt" || true

          ERROR_COUNT="$(wc -l < "$ARTIFACT_DIR/FULL-BUILD-ERRORS.txt" | tr -d ' ')"
          WARNING_COUNT="$(wc -l < "$ARTIFACT_DIR/FULL-BUILD-WARNINGS.txt" | tr -d ' ')"
          CPUFREQ_WARNING_COUNT="$(wc -l < "$ARTIFACT_DIR/CPUFREQ-WARNINGS.txt" | tr -d ' ')"
          IDLE_WARNING_COUNT="$(wc -l < "$ARTIFACT_DIR/IDLE-WARNINGS.txt" | tr -d ' ')"

          test "$ERROR_COUNT" -eq 0
          test "$CPUFREQ_WARNING_COUNT" -eq 0
          test "$IDLE_WARNING_COUNT" -eq 0

          {
            echo "COMPILER_AUDIT=PASS"
            echo "ERROR_COUNT=$ERROR_COUNT"
            echo "WARNING_COUNT=$WARNING_COUNT"
            echo "WARNING_POLICY=MEASURED_NOT_HARDCODED"
            echo "CPUFREQ_WARNING_COUNT=$CPUFREQ_WARNING_COUNT"
            echo "IDLE_WARNING_COUNT=$IDLE_WARNING_COUNT"
            echo "CONFIG_BYTE_IDENTICAL_PRE_POST=YES"
          } | tee "$ARTIFACT_DIR/DIAGNOSTICS.txt"

      - name: Verify clean linked kernel state and VEUX DTB
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX="$OUT_DIR/vmlinux"
          SYSTEM_MAP="$OUT_DIR/System.map"
          NM="$TOOLCHAIN_DIR/bin/llvm-nm"

          for FILE in "$IMAGE" "$VMLINUX" "$SYSTEM_MAP"; do
            test -s "$FILE"
          done

          mapfile -t DTBS < <(find "$OUT_DIR/arch/arm64/boot/dts" -type f -name 'veux.dtb' -print | sort)
          if [ "${#DTBS[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one veux.dtb, found ${#DTBS[@]}"
            printf '%s\n' "${DTBS[@]}"
            exit 1
          fi

          DTB="${DTBS[0]}"
          DTB_SHA="$(sha256sum "$DTB" | awk '{print $1}')"
          DTB_BYTES="$(stat -c '%s' "$DTB")"
          test "$DTB_SHA" = "$EXPECTED_VEUX_DTB_SHA256"
          test "$DTB_BYTES" = "$EXPECTED_VEUX_DTB_BYTES"

          NM_FILE="$ARTIFACT_DIR/vmlinux-symbols.txt"
          "$NM" -n "$VMLINUX" > "$NM_FILE"

          if grep -Eq '[[:space:]](ksu_|susfs_)' "$NM_FILE"; then
            echo "ERROR: KernelSU/SUSFS symbol found in clean linked kernel"
            grep -E '[[:space:]](ksu_|susfs_)' "$NM_FILE" | head -n 100
            exit 1
          fi

          grep -E '[[:space:]]cass_[A-Za-z0-9_]+$' "$NM_FILE" > "$ARTIFACT_DIR/CASS-SYMBOLS.txt" || true
          test "$(wc -l < "$ARTIFACT_DIR/CASS-SYMBOLS.txt" | tr -d ' ')" -ge 1

          grep -Ei '[[:space:]][A-Za-z0-9_]*cpuset[A-Za-z0-9_]*$' "$NM_FILE" > "$ARTIFACT_DIR/CPUSET-SYMBOLS.txt" || true
          test "$(wc -l < "$ARTIFACT_DIR/CPUSET-SYMBOLS.txt" | tr -d ' ')" -ge 1

          if grep -Eq '[[:space:]]lpm_sleep_disabled$' "$NM_FILE"; then
            echo "ERROR: lpm_sleep_disabled linked"
            exit 1
          fi

          if grep -Eq '[[:space:]](check_for_task_rotation|try_rotation_task|do_rotation_task|rotation_task_init|set_rotation_enable)$' "$NM_FILE"; then
            echo "ERROR: SPRD rotation symbol linked"
            exit 1
          fi

          {
            echo "LINKED_STATE=PASS"
            echo "KSU_SUSFS_LINKED_SYMBOLS=ABSENT"
            echo "ACTIVE_ROOT_MANAGER=NONE"
            echo "VEUX_DTB_SHA256=$DTB_SHA"
            echo "VEUX_DTB_BYTES=$DTB_BYTES"
          } | tee "$ARTIFACT_DIR/LINKED-STATE.txt"

          echo "P1_DTB=$DTB" >> "$GITHUB_ENV"

      - name: Gate exact P1-v2 cross-run build identity
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX="$OUT_DIR/vmlinux"
          SYSTEM_MAP="$OUT_DIR/System.map"
          CONFIG="$OUT_DIR/.config"

          IMAGE_BYTES="$(stat -c '%s' "$IMAGE")"
          IMAGE_SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
          VMLINUX_SHA="$(sha256sum "$VMLINUX" | awk '{print $1}')"
          SYSTEM_MAP_SHA="$(sha256sum "$SYSTEM_MAP" | awk '{print $1}')"
          CONFIG_SHA="$(sha256sum "$CONFIG" | awk '{print $1}')"

          test "$IMAGE_BYTES" = "$EXPECTED_P1_V2_IMAGE_BYTES"
          test "$IMAGE_SHA" = "$EXPECTED_P1_V2_IMAGE_SHA256"
          test "$VMLINUX_SHA" = "$EXPECTED_P1_V2_VMLINUX_SHA256"
          test "$SYSTEM_MAP_SHA" = "$EXPECTED_P1_V2_SYSTEM_MAP_SHA256"
          test "$CONFIG_SHA" = "$EXPECTED_P1_V2_CONFIG_SHA256"

          {
            echo "P1_V2_CROSS_RUN_REPRODUCIBILITY=PASS"
            echo "IMAGE_BYTES=$IMAGE_BYTES"
            echo "IMAGE_SHA256=$IMAGE_SHA"
            echo "VMLINUX_SHA256=$VMLINUX_SHA"
            echo "SYSTEM_MAP_SHA256=$SYSTEM_MAP_SHA"
            echo "CONFIG_SHA256=$CONFIG_SHA"
          } | tee "$ARTIFACT_DIR/P1-V2-CROSS-RUN-REPRODUCIBILITY.txt"

      - name: Create PROVEN source and build checkpoint backups
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX="$OUT_DIR/vmlinux"
          SYSTEM_MAP="$OUT_DIR/System.map"
          CONFIG="$OUT_DIR/.config"
          DTB="$P1_DTB"

          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_CUMULATIVE_TREE"
          test -z "$(git status --porcelain)"

          git archive --format=tar HEAD | zstd -T0 -10 -q -o "$SOURCE_BACKUP_DIR/KSU2-P1-VEUX-5.4.274-SOURCE.tar.zst"
          git diff --binary "$SOURCE_BASE_SHA" HEAD > "$SOURCE_BACKUP_DIR/SOURCE-BASE-TO-P1.diff"
          git log --oneline --decorate --graph --all -n 250 > "$SOURCE_BACKUP_DIR/SOURCE-LINEAGE.txt"

          cp "$ARTIFACT_DIR/P1-SOURCE-IDENTITY.txt" "$SOURCE_BACKUP_DIR/"
          cp "$ARTIFACT_DIR/CANDIDATE-IDENTITY.txt" "$SOURCE_BACKUP_DIR/"
          cp "$ARTIFACT_DIR/XIAOMI-REFERENCE.txt" "$SOURCE_BACKUP_DIR/"

          cat > "$SOURCE_BACKUP_DIR/SOURCE-MANIFEST.txt" <<EOF
          CHECKPOINT=KSU2-P1-PROVEN
          KERNEL=VEUX Linux 5.4.274
          SOURCE_REPOSITORY=$SOURCE_REPOSITORY
          SOURCE_BASE_SHA=$SOURCE_BASE_SHA
          COMMON_REF=$COMMON_REF
          COMMON_SHA=$COMMON_SHA
          STOCK_REF=$STOCK_REF
          STOCK_SHA=$STOCK_SHA
          CANDIDATE_TREE=$EXPECTED_CANDIDATE_TREE
          P1_CUMULATIVE_SHA=$P1_CUMULATIVE_SHA
          P1_CUMULATIVE_TREE=$EXPECTED_CUMULATIVE_TREE
          ACTIVE_ROOT_MANAGER=NONE
          INHERITED_KERNELSU_SOURCE=PRESENT_DISABLED
          SUSFS=NONE
          BOOT_IMAGE_CREATED=NO
          FLASHING_PERFORMED=NO
          EOF

          cp "$IMAGE" "$BUILD_BACKUP_DIR/Image"
          cp "$VMLINUX" "$BUILD_BACKUP_DIR/vmlinux"
          cp "$SYSTEM_MAP" "$BUILD_BACKUP_DIR/System.map"
          cp "$CONFIG" "$BUILD_BACKUP_DIR/.config"
          cp "$CONFIG" "$BUILD_BACKUP_DIR/final.config"
          cmp -s "$BUILD_BACKUP_DIR/.config" "$BUILD_BACKUP_DIR/final.config"
          cp "$DTB" "$BUILD_BACKUP_DIR/veux.dtb"
          cp "$ARTIFACT_DIR/full-build.log" "$BUILD_BACKUP_DIR/"
          cp "$ARTIFACT_DIR/DIAGNOSTICS.txt" "$BUILD_BACKUP_DIR/"
          cp "$ARTIFACT_DIR/LINKED-STATE.txt" "$BUILD_BACKUP_DIR/"
          cp "$ARTIFACT_DIR/P1-V2-CROSS-RUN-REPRODUCIBILITY.txt" "$BUILD_BACKUP_DIR/"
          cp "$ARTIFACT_DIR/kernelrelease.txt" "$BUILD_BACKUP_DIR/"

          (
            cd "$SOURCE_BACKUP_DIR"
            sha256sum KSU2-P1-VEUX-5.4.274-SOURCE.tar.zst SOURCE-BASE-TO-P1.diff SOURCE-MANIFEST.txt > SHA256SUMS
          )

          (
            cd "$BUILD_BACKUP_DIR"
            sha256sum Image vmlinux System.map .config final.config veux.dtb full-build.log > SHA256SUMS
          )

          SOURCE_ARCHIVE_SHA="$(sha256sum "$SOURCE_BACKUP_DIR/KSU2-P1-VEUX-5.4.274-SOURCE.tar.zst" | awk '{print $1}')"
          IMAGE_SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
          VMLINUX_SHA="$(sha256sum "$VMLINUX" | awk '{print $1}')"
          SYSTEM_MAP_SHA="$(sha256sum "$SYSTEM_MAP" | awk '{print $1}')"
          CONFIG_SHA="$(sha256sum "$CONFIG" | awk '{print $1}')"
          DTB_SHA="$(sha256sum "$DTB" | awk '{print $1}')"
          IMAGE_BYTES="$(stat -c '%s' "$IMAGE")"

          {
            echo "CHECKPOINT=KSU2-P1-PROVEN"
            echo "SOURCE_TREE=$EXPECTED_CUMULATIVE_TREE"
            echo "SOURCE_ARCHIVE_SHA256=$SOURCE_ARCHIVE_SHA"
            echo "IMAGE_BYTES=$IMAGE_BYTES"
            echo "IMAGE_SHA256=$IMAGE_SHA"
            echo "VMLINUX_SHA256=$VMLINUX_SHA"
            echo "SYSTEM_MAP_SHA256=$SYSTEM_MAP_SHA"
            echo "CONFIG_SHA256=$CONFIG_SHA"
            echo "VEUX_DTB_SHA256=$DTB_SHA"
            echo "ACTIVE_ROOT_MANAGER=NONE"
            echo "INHERITED_KERNELSU_SOURCE=PRESENT_DISABLED"
            echo "SUSFS=NONE"
            echo "FULL_BUILD=PASS"
            echo "BACKUP_CREATED=YES"
            echo "BUILD_CONFIG_DOTFILE_BACKUP=YES"
            echo "BUILD_CONFIG_VISIBLE_COPY=final.config"
            echo "P1_V2_CROSS_RUN_REPRODUCIBILITY=PASS"
          } | tee "$ARTIFACT_DIR/P1-PROVEN-CHECKPOINT.txt"

          cp "$ARTIFACT_DIR/P1-PROVEN-CHECKPOINT.txt" "$SOURCE_BACKUP_DIR/"
          cp "$ARTIFACT_DIR/P1-PROVEN-CHECKPOINT.txt" "$BUILD_BACKUP_DIR/"

      - name: Upload KSU2-P1 source checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: ksu2-p1-veux-5.4.274-proven-source-v3
          path: ksu2-p1-source-backup/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload KSU2-P1 build checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: ksu2-p1-veux-5.4.274-proven-build-v3
          path: ksu2-p1-build-backup/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 1

      - name: Upload KSU2-P1 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ksu2-p1-veux-5.4.274-audit-v3
          path: ksu2-p1-artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Publish KSU2-P1 summary
        shell: bash
        run: |
          set -euo pipefail

          cat "$ARTIFACT_DIR/P1-PROVEN-CHECKPOINT.txt" | tee -a "$GITHUB_STEP_SUMMARY"

          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          KSU2-P1 v3 establishes the proven VEUX Linux 5.4.274 source/build baseline.
