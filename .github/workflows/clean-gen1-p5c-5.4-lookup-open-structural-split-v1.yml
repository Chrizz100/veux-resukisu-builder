name: CLEAN GEN1 P5C - 5.4 lookup-open structural split v1
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  p5c-54-lookup-open-structural-split:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARCH: arm64
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
      VENDOR_TAG: '20240619'
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      P4_RUN_ID: '33465800698'
      P4_ARTIFACT_NAME: clean-gen1-p4-safe-stat-faccessat-filename-bridge-v2-33465800698
      EXPECTED_P4_TREE: 49cbcba1725aadea523f4b139710e5d834af9788
      EXPECTED_P4_RESUKISU_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_P4_RESUKISU_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      P5B_RUN_ID: '33470373759'
      P5B_ARTIFACT_NAME: clean-gen1-p5b-54-lookup-open-split-audit-v1-33470373759
      MAINLINE_SPLIT_COMMIT: c5971b8c6354a95c9ee7eb722928af5000bac247
      RESUKISU_SNAPSHOT_HEAD: 0b5efe9e0102c43ca5c41174d500f5a7080cd0c7
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_54_HEAD: 76affd70abf61d77feb0a132f61365d6848505df
      SUSFS_510_HEAD: ec785f47d49f7b3871ca9356f450411020af7017
      SUSFS_515_HEAD: bca0d2333c1a7d717e7278b019d7af7ba1d16005
      SUSFS_61_HEAD: 4fc9c1898ea66f51847cdbc0d1473ea4ef525a70
      ARTIFACT_DIR: ${{ github.workspace }}/clean-gen1-p5c
      P4_ARTIFACT_DIR: ${{ github.workspace }}/p4-artifact
      P5B_ARTIFACT_DIR: ${{ github.workspace }}/p5b-artifact
      BASELINE_BUILD_DIR: ${{ github.workspace }}/out-p5c-baseline
      REFACTOR_BUILD_DIR: ${{ github.workspace }}/out-p5c-refactor
      REDIRECT_MACRO_BUILD_DIR: ${{ github.workspace }}/out-p5c-redirect-macro
    steps:
    - name: Initialize P5C
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf "$ARTIFACT_DIR" "$P4_ARTIFACT_DIR" "$P5B_ARTIFACT_DIR" \
               "$BASELINE_BUILD_DIR" "$REFACTOR_BUILD_DIR" \
               "$REDIRECT_MACRO_BUILD_DIR" \
               "$GITHUB_WORKSPACE/p5c-outer-replay" \
               "$GITHUB_WORKSPACE/p5c-resukisu-replay"
        mkdir -p "$ARTIFACT_DIR"

        cat > "$ARTIFACT_DIR/00-plan.txt" <<'EOF'
        CLEAN GEN1 P5C - Linux 5.4.274 lookup/open structural split

        Accepted evidence:
        - P4 is Last Good.
        - P5A forbids post-open retry with the same opened struct file.
        - P5B requires lookup -> redirect decision -> open.
        - atomic_open must not bypass that future decision.
        - O_TRUNC may affect only the final selected path.

        P5C:
        - changes only fs/namei.c;
        - splits old do_last into lookup and open phases;
        - retains default 5.4 atomic_open behavior;
        - bypasses atomic_open only when CONFIG_KSU_SUSFS_OPEN_REDIRECT is defined;
        - calls no SUSFS redirect helper yet;
        - keeps CONFIG_KSU_SUSFS disabled;
        - requires P5D to use separate nested nameidata for fake_filename;
        - target-compiles baseline, normal refactor and forced redirect-macro branch;
        - creates and replay-verifies a checkpoint.

        No full kernel build, Image, dtb, boot image, flash ZIP or device work.
        EOF
    - name: Install P5C dependencies
      shell: bash
      run: |2

        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates flex \
          gcc-aarch64-linux-gnu git jq libelf-dev libssl-dev \
          patch python3 rsync zstd
        git --version
        aarch64-linux-gnu-gcc --version | head -1
        python3 --version
    - name: Checkout exact VEUX vendor source
      uses: actions/checkout@v6
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: '20240619'
        path: kernel
        fetch-depth: 1
    - name: Download accepted P4 restore artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.P4_ARTIFACT_NAME }}
        path: p4-artifact
        github-token: ${{ github.token }}
        run-id: ${{ env.P4_RUN_ID }}
    - name: Download accepted P5B audit artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.P5B_ARTIFACT_NAME }}
        path: p5b-artifact
        github-token: ${{ github.token }}
        run-id: ${{ env.P5B_RUN_ID }}
    - name: Authenticate P4 and P5B
      shell: bash
      run: |2

        set -euo pipefail

        test -s "$P4_ARTIFACT_DIR/restore-kit/SHA256SUMS"
        (
          cd "$P4_ARTIFACT_DIR/restore-kit"
          sha256sum -c SHA256SUMS
        ) > "$ARTIFACT_DIR/01-p4-restore-sha256.txt"

        grep -Fxq 'CLEAN_GEN1_P5B_54_LOOKUP_OPEN_SPLIT_AUDIT=PASS' \
          "$P5B_ARTIFACT_DIR/14-result.txt"
        grep -Fxq 'P4_TREE=49cbcba1725aadea523f4b139710e5d834af9788' \
          "$P5B_ARTIFACT_DIR/14-result.txt"
        grep -Fxq 'ATOMIC_OPEN_PREOPEN_REDIRECT_GAP=PROVEN' \
          "$P5B_ARTIFACT_DIR/14-result.txt"
        grep -Fxq 'SINGLE_INSERTION_POINT_COMPLETE=NO' \
          "$P5B_ARTIFACT_DIR/14-result.txt"
        grep -Fxq 'REQUIRED_ARCHITECTURE=5_4_LOOKUP_OPEN_SPLIT' \
          "$P5B_ARTIFACT_DIR/14-result.txt"
        grep -Fxq 'P5C_ATOMIC_OPEN_MUST_BE_HANDLED_BEFORE_ACCEPTANCE=YES' \
          "$P5B_ARTIFACT_DIR/12-p5c-contract.txt"
        grep -Fxq 'P5C_CONTRACT=PASS' "$P5B_ARTIFACT_DIR/12-p5c-contract.txt"

        {
          echo "P4_RESTORE_KIT_AUTH=PASS"
          echo "P5B_AUDIT_AUTH=PASS"
          echo "P5C_ATOMIC_OPEN_PREOPEN_GAP_MUST_CLOSE=YES"
          echo "P5C_MUTATION_ALLOWED=YES"
        } | tee "$ARTIFACT_DIR/01-auth-state.txt"
    - name: Refuse stale reviewed upstream before P5C
      shell: bash
      run: |2

        set -euo pipefail
        current_resu="$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main | awk '{print $1}')"
        current_54="$(git ls-remote "$SUSFS_REPO" refs/heads/kernel-5.4 | awk '{print $1}')"
        current_510="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android12-5.10 | awk '{print $1}')"
        current_515="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android13-5.15 | awk '{print $1}')"
        current_61="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android14-6.1 | awk '{print $1}')"

        {
          printf 'ReSukiSU-main\t%s\t%s\n' "$RESUKISU_SNAPSHOT_HEAD" "$current_resu"
          printf 'SUSFS-kernel-5.4\t%s\t%s\n' "$SUSFS_54_HEAD" "$current_54"
          printf 'SUSFS-5.10\t%s\t%s\n' "$SUSFS_510_HEAD" "$current_510"
          printf 'SUSFS-5.15\t%s\t%s\n' "$SUSFS_515_HEAD" "$current_515"
          printf 'SUSFS-6.1\t%s\t%s\n' "$SUSFS_61_HEAD" "$current_61"
        } | tee "$ARTIFACT_DIR/02-upstream-drift.tsv"

        test "$current_resu" = "$RESUKISU_SNAPSHOT_HEAD"
        test "$current_54" = "$SUSFS_54_HEAD"
        test "$current_510" = "$SUSFS_510_HEAD"
        test "$current_515" = "$SUSFS_515_HEAD"
        test "$current_61" = "$SUSFS_61_HEAD"

        {
          echo "UPSTREAM_REVIEW_SNAPSHOT_CURRENT=YES"
          echo "P5C_ALLOWED=YES"
        } | tee "$ARTIFACT_DIR/02-upstream-state.txt"
    - name: Restore exact accepted P4 outer tree
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
        test -z "$(git status --porcelain)"

        PATCH="$P4_ARTIFACT_DIR/restore-kit/vendor-20240619-to-p4-outer.patch"
        git apply --check --binary "$PATCH"
        git apply --index --binary "$PATCH"
        test "$(git write-tree)" = "$EXPECTED_P4_TREE"

        GIT_AUTHOR_NAME="CLEAN-GEN1 Restore" \
        GIT_AUTHOR_EMAIL="clean-gen1@invalid.local" \
        GIT_AUTHOR_DATE="2026-09-01T00:00:00Z" \
        GIT_COMMITTER_NAME="CLEAN-GEN1 Restore" \
        GIT_COMMITTER_EMAIL="clean-gen1@invalid.local" \
        GIT_COMMITTER_DATE="2026-09-01T00:00:00Z" \
          git commit -m "CLEAN GEN1 restore accepted P4 outer tree"

        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P4_TREE"
        echo "P4_RESTORED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

        {
          echo "P4_OUTER_RESTORE_REPLAY=PASS"
          echo "P4_TREE=$(git rev-parse HEAD^{tree})"
        } | tee "$ARTIFACT_DIR/03-p4-outer-restore.txt"
    - name: Restore exact accepted P4 ReSukiSU
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf KernelSU
        git init KernelSU >/dev/null
        git -C KernelSU fetch \
          "$P4_ARTIFACT_DIR/restore-kit/resukisu-p4-full.bundle" \
          refs/heads/clean-gen1-p4-resukisu:refs/heads/clean-gen1-p4-resukisu
        git -C KernelSU checkout --detach refs/heads/clean-gen1-p4-resukisu >/dev/null

        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_P4_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_P4_RESUKISU_TREE"
        test -z "$(git -C KernelSU status --porcelain)"

        mkdir -p .git/info
        touch .git/info/exclude
        grep -Fxq '/KernelSU/' .git/info/exclude || echo '/KernelSU/' >> .git/info/exclude

        test -L drivers/kernelsu
        test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
        test -z "$(git status --porcelain)"

        {
          echo "P4_RESUKISU_RESTORE_REPLAY=PASS"
          echo "P4_RESUKISU_HEAD=$(git -C KernelSU rev-parse HEAD)"
          echo "P4_RESUKISU_TREE=$(git -C KernelSU rev-parse HEAD^{tree})"
        } | tee "$ARTIFACT_DIR/04-p4-resukisu-restore.txt"
    - name: Gate exact P4 source boundary
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P4_TREE"
        grep -Fxq '# CONFIG_KSU_SUSFS is not set' arch/arm64/configs/veux_defconfig
        ! grep -Fq 'clean_gen1_open_last_lookups' fs/namei.c
        ! grep -Fq 'clean_gen1_do_open' fs/namei.c
        ! grep -Fq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT' fs/namei.c
        ! grep -Fq 'susfs_open_redirect_spoof_do_sys_openat' fs/namei.c
        test ! -e KernelSU/kernel/feature/module_load_filter.c

        sha256sum fs/namei.c fs/susfs.c include/linux/susfs.h \
          include/linux/susfs_def.h fs/open.c fs/stat.c \
          > "$ARTIFACT_DIR/05-p4-source-before.sha256"

        {
          echo "P4_SOURCE_BOUNDARY=PASS"
          echo "SUSFS_RUNTIME_ENABLED=NO"
          echo "OPEN_REDIRECT_DECISION_INTEGRATED=NO"
        } | tee "$ARTIFACT_DIR/05-p4-boundary.txt"
    - name: Target-compile accepted P4 fs/namei.o
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf "$BASELINE_BUILD_DIR"
        make O="$BASELINE_BUILD_DIR" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- veux_defconfig
        grep -Fxq '# CONFIG_KSU_SUSFS is not set' "$BASELINE_BUILD_DIR/.config"

        make O="$BASELINE_BUILD_DIR" \
          ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          -j2 fs/namei.o 2>&1 | tee "$ARTIFACT_DIR/06-p4-namei-build.log"

        test -s "$BASELINE_BUILD_DIR/fs/namei.o"
        {
          echo "P4_BASELINE_NAMEI_OBJECT_COMPILE=PASS"
          echo "FULL_KERNEL_BUILD_PERFORMED=NO"
        } | tee "$ARTIFACT_DIR/06-p4-namei-build.txt"
    - name: Apply P5C structural split
      working-directory: kernel
      shell: bash
      run: "set -euo pipefail\ncp fs/namei.c \"$ARTIFACT_DIR/namei-p4-before.c\"\npython3 - <<'PY'\nfrom pathlib import Path\n\np = Path(\"fs/namei.c\")\ntext = p.read_text(encoding=\"utf-8\")\n\natomic_old = (\n    \"\\tif (dir_inode->i_op->atomic_open) {\\n\"\n    \"\\t\\terror = atomic_open(nd, dentry, path, file, op, open_flag,\\n\"\n    \"\\t\\t\\t\\t    mode);\\n\"\n    \"\\t\\tif (unlikely(error == -ENOENT) && create_error)\\n\"\n    \"\\t\\t\\terror = create_error;\\n\"\n    \"\\t\\treturn error;\\n\"\n    \"\\t}\\n\"\n)\n\natomic_new = (\n    \"#ifndef CONFIG_KSU_SUSFS_OPEN_REDIRECT\\n\"\n    \"\\tif (dir_inode->i_op->atomic_open) {\\n\"\n    \"\\t\\terror = atomic_open(nd, dentry, path, file, op, open_flag,\\n\"\n    \"\\t\\t\\t\\t    mode);\\n\"\n    \"\\t\\tif (unlikely(error == -ENOENT) && create_error)\\n\"\n    \"\\t\\t\\terror = create_error;\\n\"\n    \"\\t\\treturn error;\\n\"\n    \"\\t}\\n\"\n    \"#endif\\n\"\n)\n\nif text.count(atomic_old) != 1:\n    raise SystemExit(f\"\
        atomic_open anchor count mismatch: {text.count(atomic_old)}\")\ntext = text.replace(atomic_old, atomic_new, 1)\n\nsignature = \"static int do_last(struct nameidata *nd,\"\nstart = text.find(signature)\nif start < 0:\n    raise SystemExit(\"do_last signature missing\")\n\nbrace = text.find(\"{\", start)\ndepth = 0\nend = None\nfor i in range(brace, len(text)):\n    if text[i] == \"{\":\n        depth += 1\n    elif text[i] == \"}\":\n        depth -= 1\n        if depth == 0:\n            end = i + 1\n            break\nif end is None:\n    raise SystemExit(\"do_last closing brace missing\")\n\nold_func = text[start:end]\nrequired = [\n    \"kuid_t dir_uid = nd->inode->i_uid;\",\n    \"umode_t dir_mode = nd->inode->i_mode;\",\n    \"bool will_truncate = (open_flag & O_TRUNC) != 0;\",\n    \"error = lookup_open(nd, &path, file, op, got_write);\",\n    \"if (file->f_mode & FMODE_OPENED)\",\n    \"if (file->f_mode & FMODE_CREATED)\",\n    \"error = follow_managed(&path, nd);\",\n   \
        \ \"error = step_into(nd, &path, 0, inode, seq);\",\n    \"error = complete_walk(nd);\",\n    \"error = may_open(&nd->path, acc_mode, open_flag);\",\n    \"error = vfs_open(&nd->path, file);\",\n    \"error = ima_file_check(file, op->acc_mode);\",\n    \"error = handle_truncate(file);\",\n]\nmissing = [token for token in required if token not in old_func]\nif missing:\n    raise SystemExit(\"unexpected old do_last: \" + repr(missing))\n\nreplacement = r'''\nenum clean_gen1_open_phase {\n\tCLEAN_GEN1_OPEN_PHASE_FINAL = 0,\n\tCLEAN_GEN1_OPEN_PHASE_CREATED,\n\tCLEAN_GEN1_OPEN_PHASE_ATOMIC_OPENED,\n};\n\nstruct clean_gen1_open_state {\n\tkuid_t dir_uid;\n\tumode_t dir_mode;\n\tint open_flag;\n\tbool will_truncate;\n\tbool got_write;\n\tint acc_mode;\n\tenum clean_gen1_open_phase phase;\n};\n\n/*\n * CLEAN GEN1 5.4 lookup/open split.\n *\n * Preserve the old 5.4 semantics while exposing a final resolved-path\n * boundary before generic may_open(), vfs_open() and handle_truncate().\n *\
        \ OPEN_REDIRECT itself is deliberately not called in P5C.\n */\nstatic int clean_gen1_open_last_lookups(struct nameidata *nd,\n\t\t\t\t       struct file *file,\n\t\t\t\t       const struct open_flags *op,\n\t\t\t\t       struct clean_gen1_open_state *state)\n{\n\tstruct dentry *dir = nd->path.dentry;\n\tunsigned seq;\n\tstruct inode *inode;\n\tstruct path path;\n\tint error;\n\n\tstate->dir_uid = nd->inode->i_uid;\n\tstate->dir_mode = nd->inode->i_mode;\n\tstate->open_flag = op->open_flag;\n\tstate->will_truncate = (state->open_flag & O_TRUNC) != 0;\n\tstate->got_write = false;\n\tstate->acc_mode = op->acc_mode;\n\tstate->phase = CLEAN_GEN1_OPEN_PHASE_FINAL;\n\n\tnd->flags &= ~LOOKUP_PARENT;\n\tnd->flags |= op->intent;\n\n\tif (nd->last_type != LAST_NORM) {\n\t\terror = handle_dots(nd, nd->last_type);\n\t\tif (unlikely(error))\n\t\t\treturn error;\n\t\tgoto finish_walk;\n\t}\n\n\tif (!(state->open_flag & O_CREAT)) {\n\t\tif (nd->last.name[nd->last.len])\n\t\t\tnd->flags |= LOOKUP_FOLLOW\
        \ | LOOKUP_DIRECTORY;\n\n\t\terror = lookup_fast(nd, &path, &inode, &seq);\n\t\tif (likely(error > 0))\n\t\t\tgoto finish_lookup;\n\n\t\tif (error < 0)\n\t\t\treturn error;\n\n\t\tBUG_ON(nd->inode != dir->d_inode);\n\t\tBUG_ON(nd->flags & LOOKUP_RCU);\n\t} else {\n\t\terror = complete_walk(nd);\n\t\tif (error)\n\t\t\treturn error;\n\n\t\taudit_inode(nd->name, dir, AUDIT_INODE_PARENT);\n\t\tif (unlikely(nd->last.name[nd->last.len]))\n\t\t\treturn -EISDIR;\n\t}\n\n\tif (state->open_flag & (O_CREAT | O_TRUNC | O_WRONLY | O_RDWR)) {\n\t\terror = mnt_want_write(nd->path.mnt);\n\t\tif (!error)\n\t\t\tstate->got_write = true;\n\t}\n\n\tif (state->open_flag & O_CREAT)\n\t\tinode_lock(dir->d_inode);\n\telse\n\t\tinode_lock_shared(dir->d_inode);\n\n\terror = lookup_open(nd, &path, file, op, state->got_write);\n\n\tif (state->open_flag & O_CREAT)\n\t\tinode_unlock(dir->d_inode);\n\telse\n\t\tinode_unlock_shared(dir->d_inode);\n\n\tif (error)\n\t\tgoto out;\n\n\tif (file->f_mode & FMODE_OPENED)\
        \ {\n\t\tif ((file->f_mode & FMODE_CREATED) ||\n\t\t    !S_ISREG(file_inode(file)->i_mode))\n\t\t\tstate->will_truncate = false;\n\n\t\taudit_inode(nd->name, file->f_path.dentry, 0);\n\t\tstate->phase = CLEAN_GEN1_OPEN_PHASE_ATOMIC_OPENED;\n\t\treturn 0;\n\t}\n\n\tif (file->f_mode & FMODE_CREATED) {\n\t\tstate->open_flag &= ~O_TRUNC;\n\t\tstate->will_truncate = false;\n\t\tstate->acc_mode = 0;\n\t\tpath_to_nameidata(&path, nd);\n\t\tstate->phase = CLEAN_GEN1_OPEN_PHASE_CREATED;\n\t\treturn 0;\n\t}\n\n\tif (state->got_write) {\n\t\tmnt_drop_write(nd->path.mnt);\n\t\tstate->got_write = false;\n\t}\n\n\terror = follow_managed(&path, nd);\n\tif (unlikely(error < 0))\n\t\treturn error;\n\n\tif (unlikely(d_is_negative(path.dentry))) {\n\t\tpath_to_nameidata(&path, nd);\n\t\treturn -ENOENT;\n\t}\n\n\taudit_inode(nd->name, path.dentry, 0);\n\n\tif (unlikely((state->open_flag & (O_EXCL | O_CREAT)) ==\n\t\t     (O_EXCL | O_CREAT))) {\n\t\tpath_to_nameidata(&path, nd);\n\t\treturn -EEXIST;\n\
        \t}\n\n\tseq = 0;\n\tinode = d_backing_inode(path.dentry);\n\nfinish_lookup:\n\terror = step_into(nd, &path, 0, inode, seq);\n\tif (unlikely(error))\n\t\treturn error;\n\nfinish_walk:\n\terror = complete_walk(nd);\n\tif (error)\n\t\treturn error;\n\n\taudit_inode(nd->name, nd->path.dentry, 0);\n\tstate->phase = CLEAN_GEN1_OPEN_PHASE_FINAL;\n\treturn 0;\n\nout:\n\tif (unlikely(error > 0)) {\n\t\tWARN_ON(1);\n\t\terror = -EINVAL;\n\t}\n\tif (state->got_write) {\n\t\tmnt_drop_write(nd->path.mnt);\n\t\tstate->got_write = false;\n\t}\n\treturn error;\n}\n\nstatic int clean_gen1_do_open(struct nameidata *nd,\n\t\t\t      struct file *file,\n\t\t\t      const struct open_flags *op,\n\t\t\t      struct clean_gen1_open_state *state)\n{\n\tint error;\n\n\tif (state->phase == CLEAN_GEN1_OPEN_PHASE_ATOMIC_OPENED)\n\t\tgoto opened;\n\n\tif (state->phase == CLEAN_GEN1_OPEN_PHASE_CREATED)\n\t\tgoto finish_open_created;\n\n\tif (unlikely(state->phase != CLEAN_GEN1_OPEN_PHASE_FINAL))\n\t\treturn\
        \ -EINVAL;\n\n\tif (state->open_flag & O_CREAT) {\n\t\terror = -EISDIR;\n\t\tif (d_is_dir(nd->path.dentry))\n\t\t\tgoto out;\n\n\t\terror = may_create_in_sticky(state->dir_mode, state->dir_uid,\n\t\t\t\t\t     d_backing_inode(nd->path.dentry));\n\t\tif (unlikely(error))\n\t\t\tgoto out;\n\t}\n\n\terror = -ENOTDIR;\n\tif ((nd->flags & LOOKUP_DIRECTORY) &&\n\t    !d_can_lookup(nd->path.dentry))\n\t\tgoto out;\n\n\tif (!d_is_reg(nd->path.dentry))\n\t\tstate->will_truncate = false;\n\n\tif (state->will_truncate) {\n\t\terror = mnt_want_write(nd->path.mnt);\n\t\tif (error)\n\t\t\tgoto out;\n\t\tstate->got_write = true;\n\t}\n\nfinish_open_created:\n\terror = may_open(&nd->path, state->acc_mode, state->open_flag);\n\tif (error)\n\t\tgoto out;\n\n\tBUG_ON(file->f_mode & FMODE_OPENED);\n\terror = vfs_open(&nd->path, file);\n\tif (error)\n\t\tgoto out;\n\nopened:\n\terror = ima_file_check(file, op->acc_mode);\n\tif (!error && state->will_truncate)\n\t\terror = handle_truncate(file);\n\nout:\n\
