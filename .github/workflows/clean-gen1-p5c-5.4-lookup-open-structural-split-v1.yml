    - name: Audit P5C phase contract
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' > "$ARTIFACT_DIR/08-phase-contract.txt"
        from pathlib import Path

        text = Path("fs/namei.c").read_text(encoding="utf-8")

        lookup_start = text.find("static int clean_gen1_open_last_lookups(")
        open_start = text.find("static int clean_gen1_do_open(")
        path_start = text.find("static struct file *path_openat(")

        if min(lookup_start, open_start, path_start) < 0:
            raise SystemExit("P5C functions missing")
        if not (lookup_start < open_start < path_start):
            raise SystemExit("unexpected P5C function ordering")

        lookup = text[lookup_start:open_start]
        opener = text[open_start:path_start]
        path = text[path_start:text.find("struct file *do_filp_open(", path_start)]

        checks = {
            "LOOKUP_FAST_IN_LOOKUP_PHASE":
                "lookup_fast(nd, &path, &inode, &seq)" in lookup,
            "LOOKUP_OPEN_IN_LOOKUP_PHASE":
                "lookup_open(nd, &path, file, op, state->got_write)" in lookup,
            "FOLLOW_MANAGED_IN_LOOKUP_PHASE":
                "follow_managed(&path, nd)" in lookup,
            "STEP_INTO_IN_LOOKUP_PHASE":
                "step_into(nd, &path, 0, inode, seq)" in lookup,
            "COMPLETE_WALK_IN_LOOKUP_PHASE":
                "complete_walk(nd)" in lookup,
            "NO_GENERIC_MAY_OPEN_IN_LOOKUP_PHASE":
                "may_open(&nd->path" not in lookup,
            "NO_GENERIC_VFS_OPEN_IN_LOOKUP_PHASE":
                "vfs_open(&nd->path" not in lookup,
            "NO_TRUNCATE_IN_LOOKUP_PHASE":
                "handle_truncate(file)" not in lookup,
            "MAY_OPEN_IN_OPEN_PHASE":
                "may_open(&nd->path, state->acc_mode, state->open_flag)" in opener,
            "VFS_OPEN_IN_OPEN_PHASE":
                "vfs_open(&nd->path, file)" in opener,
            "IMA_IN_OPEN_PHASE":
                "ima_file_check(file, op->acc_mode)" in opener,
            "TRUNCATE_IN_OPEN_PHASE":
                "handle_truncate(file)" in opener,
            "FINAL_PHASE_EXPLICIT":
                "CLEAN_GEN1_OPEN_PHASE_FINAL" in lookup and
                "CLEAN_GEN1_OPEN_PHASE_FINAL" in opener,
            "CREATED_PHASE_EXPLICIT":
                "CLEAN_GEN1_OPEN_PHASE_CREATED" in lookup and
                "CLEAN_GEN1_OPEN_PHASE_CREATED" in opener,
            "ATOMIC_OPENED_PHASE_EXPLICIT":
                "CLEAN_GEN1_OPEN_PHASE_ATOMIC_OPENED" in lookup and
                "CLEAN_GEN1_OPEN_PHASE_ATOMIC_OPENED" in opener,
            "PATH_OPENAT_LOOKUP_BEFORE_OPEN":
                path.find("clean_gen1_open_last_lookups") >= 0 and
                path.find("clean_gen1_do_open") > path.find("clean_gen1_open_last_lookups"),
            "OLD_DO_LAST_CALL_REMOVED":
                "do_last(nd, file, op)" not in path,
        }

        for label, ok in checks.items():
            print(f"{label}={'PASS' if ok else 'FAIL'}")
        failed = [label for label, ok in checks.items() if not ok]
        if failed:
            raise SystemExit("P5C phase contract failed: " + ", ".join(failed))

        print("FINAL_REDIRECT_ELIGIBLE_BOUNDARY=AFTER_COMPLETE_WALK_BEFORE_MAY_OPEN")
        print("CREATED_PHASE_REDIRECT_ELIGIBLE=NO")
        print("ATOMIC_OPENED_PHASE_REDIRECT_ELIGIBLE=NO")
        print("OPEN_REDIRECT_DECISION_INTEGRATED=NO")
        print("P5C_PHASE_CONTRACT=PASS")
        PY
        grep -Fq 'P5C_PHASE_CONTRACT=PASS' "$ARTIFACT_DIR/08-phase-contract.txt"
    - name: Audit atomic-open closure
