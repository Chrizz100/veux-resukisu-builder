        Expected outer tree: $P5C_TREE

        ReSukiSU:
          head $EXPECTED_P4_RESUKISU_HEAD
          tree $EXPECTED_P4_RESUKISU_TREE

        P5C changes only fs/namei.c.
        CONFIG_KSU_SUSFS remains disabled.
        No OPEN_REDIRECT decision is integrated.
        P5D must obey P5D-NESTED-NAMEIDATA-CONTRACT.txt.
        EOF

        (
          cd "$kit"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
        ) | tee "$ARTIFACT_DIR/16-restore-kit-sha256.txt"
    - name: Replay P5C outer and ReSukiSU restore
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail

        outer="$GITHUB_WORKSPACE/p5c-outer-replay"
        rm -rf "$outer"
        git worktree add --detach "$outer" "$EXPECTED_VENDOR_SHA" >/dev/null
        (
          cd "$outer"
          git apply --check --binary "$ARTIFACT_DIR/restore-kit/vendor-20240619-to-p5c-outer.patch"
          git apply --index --binary "$ARTIFACT_DIR/restore-kit/vendor-20240619-to-p5c-outer.patch"
          test "$(git write-tree)" = "$P5C_TREE"
        )
        git worktree remove --force "$outer"

        resu="$GITHUB_WORKSPACE/p5c-resukisu-replay"
        rm -rf "$resu"
        git init "$resu" >/dev/null
        git -C "$resu" fetch \
          "$ARTIFACT_DIR/restore-kit/resukisu-p5c-full.bundle" \
          refs/heads/clean-gen1-p5c-resukisu:refs/heads/clean-gen1-p5c-resukisu
        git -C "$resu" checkout --detach refs/heads/clean-gen1-p5c-resukisu >/dev/null
        test "$(git -C "$resu" rev-parse HEAD)" = "$EXPECTED_P4_RESUKISU_HEAD"
        test "$(git -C "$resu" rev-parse HEAD^{tree})" = "$EXPECTED_P4_RESUKISU_TREE"
        rm -rf "$resu"

        {
          echo "P5C_OUTER_RESTORE_REPLAY=PASS"
          echo "P5C_RESUKISU_BUNDLE_REPLAY=PASS"
        } | tee "$ARTIFACT_DIR/17-restore-replays.txt"
    - name: Final P5C safety gate
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        test "$(make -s kernelversion)" = "5.4.274"
        test "$(git rev-parse HEAD)" = "$P5C_COMMIT"
        test "$(git rev-parse HEAD^{tree})" = "$P5C_TREE"
        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_P4_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_P4_RESUKISU_TREE"
        test -z "$(git status --porcelain)"
        test -z "$(git -C KernelSU status --porcelain)"

        grep -Fq 'P4_BASELINE_NAMEI_OBJECT_COMPILE=PASS' "$ARTIFACT_DIR/06-p4-namei-build.txt"
        grep -Fq 'P5C_PHASE_CONTRACT=PASS' "$ARTIFACT_DIR/08-phase-contract.txt"
        grep -Fq 'P5C_ATOMIC_OPEN_PREOPEN_GAP=CLOSED_FOR_FUTURE_OPEN_REDIRECT_MODE' "$ARTIFACT_DIR/09-atomic-open-gate.txt"
        grep -Fq 'P5C_5_4_SEMANTIC_STATE_TRANSFER=PASS' "$ARTIFACT_DIR/10-semantics-preservation.txt"
        grep -Fq 'P5D_LIFETIME_CONTRACT=PASS' "$ARTIFACT_DIR/11-p5d-lifetime-contract.txt"
        grep -Fq 'P5C_SCOPE=PASS' "$ARTIFACT_DIR/12-scope.txt"
        grep -Fq 'P5C_NORMAL_NAMEI_OBJECT_COMPILE=PASS' "$ARTIFACT_DIR/13-namei-builds.txt"
        grep -Fq 'P5C_OPEN_REDIRECT_MACRO_BRANCH_COMPILE=PASS' "$ARTIFACT_DIR/13-namei-builds.txt"
        grep -Fq 'P5C_OUTER_RESTORE_REPLAY=PASS' "$ARTIFACT_DIR/17-restore-replays.txt"
        grep -Fq 'P5C_RESUKISU_BUNDLE_REPLAY=PASS' "$ARTIFACT_DIR/17-restore-replays.txt"

        grep -Fxq '# CONFIG_KSU_SUSFS is not set' arch/arm64/configs/veux_defconfig
        ! grep -Fq 'susfs_open_redirect_spoof_do_sys_openat' fs/namei.c
        test ! -e KernelSU/kernel/feature/module_load_filter.c

        (
          cd "$ARTIFACT_DIR/restore-kit"
          sha256sum -c SHA256SUMS
        ) > "$ARTIFACT_DIR/18-final-restore-sha256.txt"

        {
          echo "CLEAN_GEN1_P5C_54_LOOKUP_OPEN_STRUCTURAL_SPLIT=PASS"
          echo "KERNEL_VERSION=5.4.274"
          echo "P4_RESTORE_REPLAY=PASS"
          echo "P5B_AUDIT_AUTH=PASS"
          echo "P4_TREE=$EXPECTED_P4_TREE"
          echo "P5C_CHECKPOINT_COMMIT=$P5C_COMMIT"
          echo "P5C_OUTER_TREE=$P5C_TREE"
          echo "P5C_RESUKISU_HEAD=$EXPECTED_P4_RESUKISU_HEAD"
          echo "P5C_RESUKISU_TREE=$EXPECTED_P4_RESUKISU_TREE"
          echo "MAINLINE_STRUCTURAL_REFERENCE=$MAINLINE_SPLIT_COMMIT"
          echo "LOOKUP_PHASE=clean_gen1_open_last_lookups"
          echo "OPEN_PHASE=clean_gen1_do_open"
          echo "FINAL_PREOPEN_BOUNDARY=PROVEN"
          echo "CREATED_PHASE=EXPLICIT"
          echo "ATOMIC_OPENED_PHASE=EXPLICIT"
          echo "DEFAULT_5_4_ATOMIC_OPEN_BEHAVIOR_RETAINED=YES"
          echo "OPEN_REDIRECT_MODE_ATOMIC_OPEN_BYPASSED=YES"
          echo "UNCACHED_EXISTING_TARGET_FORCED_THROUGH_NORMAL_LOOKUP=YES"
          echo "P5D_SEPARATE_REDIRECT_NAMEIDATA_REQUIRED=YES"
          echo "P5D_ORIGINAL_ND_NAME_MUST_REMAIN_UNCHANGED=YES"
          echo "P5C_NAMEI_OBJECT_BASELINE_COMPILE=PASS"
          echo "P5C_NAMEI_OBJECT_REFACTOR_COMPILE=PASS"
          echo "P5C_OPEN_REDIRECT_MACRO_BRANCH_COMPILE=PASS"
          echo "P5C_CHANGED_FILES=fs/namei.c"
          echo "OPEN_REDIRECT_DECISION_INTEGRATED=NO"
          echo "OPEN_REDIRECT_HOOKS_INTEGRATED=NO"
          echo "SUSFS_RUNTIME_ENABLED=NO"
          echo "MODULE_LOAD_FILTER_INCLUDED=NO"
          echo "P5C_OUTER_RESTORE_REPLAY=PASS"
          echo "P5C_RESUKISU_BUNDLE_REPLAY=PASS"
          echo "FULL_KERNEL_BUILD_PERFORMED=NO"
          echo "IMAGE_CREATED=NO"
          echo "DTB_BUILD_PERFORMED=NO"
          echo "BOOT_IMAGE_CREATED=NO"
          echo "FLASHABLE_ZIP_CREATED=NO"
          echo "DEVICE_ACCESSED=NO"
          echo "FLASHING_PERFORMED=NO"
          echo "NEXT_STAGE=CLEAN_GEN1_P5D_OPEN_REDIRECT_NESTED_NAMEIDATA_INTEGRATION"
        } | tee "$ARTIFACT_DIR/19-result.txt"
    - name: Preserve P5C failure evidence
      if: always()
      shell: bash
      run: |2

        set +e
        mkdir -p "$ARTIFACT_DIR"
        {
          echo "JOB_STATUS=${{ job.status }}"
          if [ -d "$GITHUB_WORKSPACE/kernel/.git" ]; then
            echo "OUTER_HEAD=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD 2>/dev/null || true)"
            echo "OUTER_TREE=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD^{tree} 2>/dev/null || true)"
            echo "OUTER_STATUS_BEGIN"
            git -C "$GITHUB_WORKSPACE/kernel" status --porcelain 2>/dev/null || true
            echo "OUTER_STATUS_END"
          fi
          if [ -d "$GITHUB_WORKSPACE/kernel/KernelSU/.git" ]; then
            echo "RESUKISU_HEAD=$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD 2>/dev/null || true)"
            echo "RESUKISU_TREE=$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD^{tree} 2>/dev/null || true)"
            echo "RESUKISU_STATUS_BEGIN"
            git -C "$GITHUB_WORKSPACE/kernel/KernelSU" status --porcelain 2>/dev/null || true
            echo "RESUKISU_STATUS_END"
          fi
        } > "$ARTIFACT_DIR/99-job-end-state.txt"
        find "$ARTIFACT_DIR" -maxdepth 2 -type f -printf '%P\n' | sort > "$ARTIFACT_DIR/99-artifact-file-list.txt"
        exit 0
    - name: Upload P5C checkpoint and evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: clean-gen1-p5c-54-lookup-open-structural-split-v1-${{ github.run_id }}
        path: clean-gen1-p5c/
        if-no-files-found: error
        retention-days: 90
