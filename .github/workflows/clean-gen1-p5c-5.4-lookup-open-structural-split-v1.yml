    - name: Write mandatory P5D nested-nameidata lifetime contract
      shell: bash
      run: |2

        set -euo pipefail
        cat > "$ARTIFACT_DIR/11-p5d-lifetime-contract.txt" <<'EOF'
        CLEAN GEN1 P5D MANDATORY LIFETIME CONTRACT

        P5D must keep the caller's original struct nameidata and original nd->name
        unchanged. fake_filename must never be installed into the outer nameidata and
        then freed before do_filp_open's -ECHILD/-ESTALE retry machinery is finished.

        Required model:
        1. obtain fake_filename;
        2. terminate the original active walk before redirect restart;
        3. create a distinct local struct nameidata redirect_nd;
        4. set_nameidata(&redirect_nd, original_dfd, fake_filename);
        5. run only the redirected walk on redirect_nd;
        6. terminate_walk(&redirect_nd) exactly once when initialized;
        7. restore_nameidata() exactly once after set_nameidata();
        8. putname(fake_filename) only after redirect_nd is no longer current;
        9. prevent redirect recursion;
        10. never reuse an already-FMODE_OPENED struct file for redirect;
        11. CREATED and ATOMIC_OPENED phases are not redirect-eligible;
        12. only FINAL resolved-existing-inode phase is redirect-eligible;
        13. do_tmpfile/do_o_path must obey equivalent independent-nameidata ownership.

        This is a hard gate for P5D.
        EOF

        {
          echo "P5D_ORIGINAL_ND_NAME_MUST_REMAIN_UNCHANGED=YES"
          echo "P5D_SEPARATE_REDIRECT_NAMEIDATA_REQUIRED=YES"
          echo "P5D_FAKE_FILENAME_PUT_AFTER_RESTORE_ONLY=YES"
          echo "P5D_REDIRECT_RECURSION_GUARD_REQUIRED=YES"
          echo "P5D_LIFETIME_CONTRACT=PASS"
        } | tee -a "$ARTIFACT_DIR/11-p5d-lifetime-contract.txt"
