name: 33 - GEN2 5.4.302 Full Image and VEUX DTB Build v2 Independent Audit Guard

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: GEN2 33 v2 build
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout pinned GEN2 kernel source with full history
        uses: actions/checkout@v6
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: f4b8a13a43a130a9aab83cc985ce4d4421291ae6
          path: kernel-src
          fetch-depth: 0

      - name: Checkout pinned ReSukiSU reference
        uses: actions/checkout@v6
        with:
          repository: ReSukiSU/ReSukiSU
          ref: faccf4c5edc7be37776216e7d43dd3dca0239331
          path: resukisu
          fetch-depth: 1

      - name: Initialize failure-safe audit diagnostics
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "AUDIT=GEN2_33_V2_FULL_IMAGE_DTB_BUILD_RETRY"
            echo "WORKFLOW_REVISION=GEN2_33_V2_INDEPENDENT_AUDIT_GUARD_W32_HEADER_CLOSURE_FULL_IMAGE_DTB_RETRY"
            echo "EARLY_AUDIT_DIAGNOSTICS=INITIALIZED"
            echo "KERNEL_PIN=f4b8a13a43a130a9aab83cc985ce4d4421291ae6"
            echo "RESUKISU_PIN=faccf4c5edc7be37776216e7d43dd3dca0239331"
            echo "SUSFS_BASE_PIN=4003ecf2d01c6d13fa8edf6c4f2607365738dc3d"
            echo "NO_KERNEL_BUILD_PERFORMED=YES"
          } > early-audit-diagnostics.txt

          : > susfs-fetch.log

      - name: Fetch pinned SUSFS reference history with resilient fallback
        shell: bash
        run: |
          set -euo pipefail

          BASE='4003ecf2d01c6d13fa8edf6c4f2607365738dc3d'
          FIXES=(
            'be08face56c347e7ba9c4fb420c2463598a14f5d'
            '86bb893e9a103b97d17045306f35eb239a623f2a'
            'c5723cc09c19786fcb701d25a8097e2edbee412a'
            '3c14ad549f826b1f53878ec8c12253efebeed75a'
          )
          ALL_SHAS=("$BASE" "${FIXES[@]}")
          ORIGIN='https://gitlab.com/simonpunk/susfs4ksu.git'

          fail_diag() {
            rc=$?
            {
              echo "SUSFS_FETCH_STEP_RESULT=FAIL"
              echo "SUSFS_FETCH_EXIT_CODE=$rc"
              echo "SUSFS_FETCH_MODE=${FETCH_MODE:-UNRESOLVED}"
              echo "SUSFS_FETCH_FAILURE_STAGE=${FETCH_STAGE:-UNKNOWN}"
              echo "SUSFS_FETCH_LOG_TAIL_BEGIN"
              tail -n 80 susfs-fetch.log 2>/dev/null || true
              echo "SUSFS_FETCH_LOG_TAIL_END"
            } >> early-audit-diagnostics.txt
            exit "$rc"
          }
          trap fail_diag ERR

          FETCH_MODE=''
          FETCH_STAGE='GIT_SMART_HTTP'

          echo "=== SUSFS git transport attempts ===" | tee -a susfs-fetch.log

          for attempt in 1 2 3; do
            echo "GIT_ATTEMPT=$attempt" | tee -a susfs-fetch.log
            rm -rf susfs
            mkdir -p susfs

            if git -C susfs init -q \
              && git -C susfs remote add origin "$ORIGIN" \
              && git -c http.version=HTTP/1.1 \
                   -C susfs fetch \
                   --filter=blob:none \
                   --no-tags \
                   origin gki-android12-5.10 \
                   >> susfs-fetch.log 2>&1
            then
              missing=0
              for sha in "${ALL_SHAS[@]}"; do
                if ! git -C susfs cat-file -e "${sha}^{commit}" 2>/dev/null; then
                  echo "GIT_MISSING_COMMIT=$sha" | tee -a susfs-fetch.log
                  missing=1
                fi
              done

              if [ "$missing" -eq 0 ]; then
                FETCH_MODE='GIT_HISTORY'
                echo "GIT_HISTORY_PIN_VERIFICATION=PASS" \
                  | tee -a susfs-fetch.log
                break
              fi
            fi

            rm -rf susfs
            sleep $((attempt * 5))
          done

          # ----------------------------------------------------------
          # Fallback: use GitLab's HTTPS archive + exact commit patches.
          # This avoids Git smart-HTTP/ref-listing entirely.
          # ----------------------------------------------------------
          if [ -z "$FETCH_MODE" ]; then
            FETCH_STAGE='HTTP_ARCHIVE_PATCH_FALLBACK'
            FETCH_MODE='HTTP_ARCHIVE_PATCH'

            echo "=== Falling back to HTTPS archive + commit patches ===" \
              | tee -a susfs-fetch.log

            rm -rf susfs-http
            mkdir -p susfs-http/base susfs-http/patches

            CURL_COMMON=(
              --fail
              --location
              --http1.1
              --retry 5
              --retry-delay 4
              --retry-all-errors
              --connect-timeout 20
              --max-time 240
              --user-agent "GEN2-SUSFS-Audit/27-v5 GitHub-Actions"
            )

            BASE_ARCHIVE="https://gitlab.com/simonpunk/susfs4ksu/-/archive/${BASE}/susfs4ksu-${BASE}.tar.gz"

            echo "BASE_ARCHIVE_URL=$BASE_ARCHIVE" \
              | tee -a susfs-fetch.log

            curl "${CURL_COMMON[@]}" \
              "$BASE_ARCHIVE" \
              -o susfs-http/base.tar.gz \
              >> susfs-fetch.log 2>&1

            tar -tzf susfs-http/base.tar.gz \
              > susfs-http/base-archive-list.txt

            test -s susfs-http/base-archive-list.txt

            tar -xzf susfs-http/base.tar.gz \
              -C susfs-http/base \
              --strip-components=1

            # The exact pinned base must contain the three standalone
            # SUSFS files and the main kernel patch used downstream.
            for rel in \
              kernel_patches/fs/susfs.c \
              kernel_patches/include/linux/susfs.h \
              kernel_patches/include/linux/susfs_def.h \
              kernel_patches/50_add_susfs_in_gki-android12-5.10.patch
            do
              test -f "susfs-http/base/$rel"
            done

            : > susfs-http-patch-headers.txt

            for sha in "${FIXES[@]}"; do
              url="https://gitlab.com/simonpunk/susfs4ksu/-/commit/${sha}.patch"
              out="susfs-http/patches/${sha}.patch"

              echo "PATCH_URL=$url" | tee -a susfs-fetch.log

              curl "${CURL_COMMON[@]}" \
                "$url" \
                -o "$out" \
                >> susfs-fetch.log 2>&1

              test -s "$out"

              first_line="$(head -n 1 "$out")"
              printf '%s %s\n' "$sha" "$first_line" \
                >> susfs-http-patch-headers.txt

              case "$first_line" in
                "From ${sha} "*)
                  ;;
                *)
                  echo "PATCH_HEADER_SHA_MISMATCH=$sha" \
                    | tee -a susfs-fetch.log
                  exit 1
                  ;;
              esac
            done

            echo "HTTP_ARCHIVE_BASE_REQUESTED_SHA=$BASE" \
              | tee -a susfs-fetch.log
            echo "HTTP_COMMIT_PATCH_HEADERS=PASS" \
              | tee -a susfs-fetch.log
          fi

          printf '%s\n' "$FETCH_MODE" > susfs-fetch.mode

          test "$(git -C kernel-src rev-parse HEAD)" = \
            "f4b8a13a43a130a9aab83cc985ce4d4421291ae6"

          test "$(git -C resukisu rev-parse HEAD)" = \
            "faccf4c5edc7be37776216e7d43dd3dca0239331"

          {
            echo "SOURCE_PINS=PASS"
            echo "SUSFS_FETCH_MODE=$FETCH_MODE"
            echo "SUSFS_BASE=$BASE"
            echo "SUSFS_SELECTED_FIX_COUNT=${#FIXES[@]}"
            echo "SUSFS_TRANSPORT_RESILIENCE=PASS"
          } | tee source-pin-status.txt susfs-fetch-status.txt

          {
            echo "SUSFS_FETCH_STEP_RESULT=PASS"
            echo "SUSFS_FETCH_MODE=$FETCH_MODE"
            echo "SUSFS_FETCH_FAILURE_STAGE=NONE"
          } >> early-audit-diagnostics.txt

          trap - ERR

      - name: Prepare exact legacy KernelSU removal patches
        shell: bash
        run: |
          set -euo pipefail

          INCLUDE_COMMIT='1c1b2124991bcaf7c93cad5e460e9b9dfb32e4ed'
          HOOK_COMMIT='3f95a98681655eeb1b928e001d30e00072ae0d8b'

          mkdir -p reverse-patches

          git -C kernel-src show \
            --format= \
            "$INCLUDE_COMMIT" \
            -- drivers/Kconfig drivers/Makefile \
            > reverse-patches/include-kernelsu.patch

          git -C kernel-src show \
            --format= \
            "$HOOK_COMMIT" \
            -- fs/devpts/inode.c fs/exec.c fs/namespace.c \
               fs/open.c fs/read_write.c fs/stat.c \
            > reverse-patches/legacy-hooks.patch

          git -C kernel-src apply \
            --reverse \
            --check \
            "$GITHUB_WORKSPACE/reverse-patches/include-kernelsu.patch"

          git -C kernel-src apply \
            --reverse \
            --check \
            "$GITHUB_WORKSPACE/reverse-patches/legacy-hooks.patch"

      - name: Create isolated hook-completion worktree
        shell: bash
        run: |
          set -euo pipefail

          SIM="$RUNNER_TEMP/gen2-inline-hook-stage"
          rm -rf "$SIM"

          git -C kernel-src worktree add \
            --detach \
            "$SIM" \
            f4b8a13a43a130a9aab83cc985ce4d4421291ae6

          echo "$SIM" > kernel-simulation.path

      - name: Remove legacy KernelSU in temporary worktree
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          git -C "$SIM" apply \
            --reverse \
            "$GITHUB_WORKSPACE/reverse-patches/include-kernelsu.patch"

          git -C "$SIM" apply \
            --reverse \
            "$GITHUB_WORKSPACE/reverse-patches/legacy-hooks.patch"

          rm -rf "$SIM/drivers/kernelsu"

          echo "LEGACY_KERNELSU_REMOVAL=PASS" \
            | tee legacy-removal-state.txt

      - name: Install exactly pinned ReSukiSU
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"
          PIN='faccf4c5edc7be37776216e7d43dd3dca0239331'

          git clone \
            --no-local \
            "$GITHUB_WORKSPACE/resukisu" \
            "$SIM/KernelSU"

          git -C "$SIM/KernelSU" checkout --detach "$PIN"

          test "$(git -C "$SIM/KernelSU" rev-parse HEAD)" = "$PIN"

          ln -s ../KernelSU/kernel "$SIM/drivers/kernelsu"

          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' \
            >> "$SIM/drivers/Makefile"

          sed -i \
            '/^endmenu$/i source "drivers/kernelsu/Kconfig"' \
            "$SIM/drivers/Kconfig"

          echo "PINNED_RESUKISU_INTEGRATION=PASS" \
            | tee resukisu-integration-state.txt

      - name: Materialize SUSFS v2.2 plus four OPEN_REDIRECT fixes deterministically
        shell: bash
        run: |
          set -euo pipefail

          BASE='4003ecf2d01c6d13fa8edf6c4f2607365738dc3d'
          FIXES=(
            'be08face56c347e7ba9c4fb420c2463598a14f5d'
            '86bb893e9a103b97d17045306f35eb239a623f2a'
            'c5723cc09c19786fcb701d25a8097e2edbee412a'
            '3c14ad549f826b1f53878ec8c12253efebeed75a'
          )

          FIX="$RUNNER_TEMP/susfs-v220-four-fix-hooks"
          PATCHDIR="$RUNNER_TEMP/susfs-selected-fix-patches"
          MODE="$(cat susfs-fetch.mode)"

          rm -rf "$FIX" "$PATCHDIR"
          mkdir -p "$FIX" "$PATCHDIR"

          : > susfs-materialize.log

          fail_diag() {
            rc=$?
            {
              echo "SUSFS_MATERIALIZATION_RESULT=FAIL"
              echo "SUSFS_MATERIALIZATION_EXIT_CODE=$rc"
              echo "SUSFS_MATERIALIZATION_STAGE=${MAT_STAGE:-UNKNOWN}"
              echo "SUSFS_FETCH_MODE=$MODE"
              echo "SUSFS_MATERIALIZE_LOG_TAIL_BEGIN"
              tail -n 120 susfs-materialize.log 2>/dev/null || true
              echo "SUSFS_MATERIALIZE_LOG_TAIL_END"
            } >> early-audit-diagnostics.txt
            exit "$rc"
          }
          trap fail_diag ERR

          # ----------------------------------------------------------
          # Preferred path when exact Git objects were already fetched:
          #   1. Export the exact v2.2 base commit with git archive.
          #   2. Generate each selected commit's exact binary diff locally.
          #   3. Apply only those four diffs, in the frozen order.
          #
          # This avoids git-worktree/cherry-pick state and performs zero
          # additional network requests.
          # ----------------------------------------------------------
          if [ "$MODE" = "GIT_HISTORY" ]; then
            MAT_STAGE='VERIFY_LOCAL_GIT_OBJECTS'

            for sha in "$BASE" "${FIXES[@]}"; do
              git -C susfs cat-file -e "${sha}^{commit}" \
                >> susfs-materialize.log 2>&1
            done

            MAT_STAGE='EXPORT_EXACT_BASE_COMMIT'
            git -C susfs archive --format=tar "$BASE" \
              | tar -xf - -C "$FIX"

            test -f "$FIX/kernel_patches/fs/susfs.c"
            test -f "$FIX/kernel_patches/include/linux/susfs.h"
            test -f "$FIX/kernel_patches/include/linux/susfs_def.h"
            test -f "$FIX/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"

            # Temporary local repo exists solely so git apply can perform
            # exact check/apply semantics against the exported base tree.
            git -C "$FIX" init -q
            git -C "$FIX" add -A
            git -C "$FIX" \
              -c user.name='GEN2 Audit' \
              -c user.email='gen2-audit@localhost' \
              commit -q -m 'SUSFS v2.2 exact base export'

            for sha in "${FIXES[@]}"; do
              MAT_STAGE="GENERATE_PATCH_$sha"
              patch="$PATCHDIR/${sha}.patch"

              git -C susfs diff \
                --binary \
                "${sha}^" "$sha" \
                > "$patch"

              test -s "$patch"

              {
                echo "PATCH_SHA=$sha"
                echo "PATCH_SHA256=$(sha256sum "$patch" | awk '{print $1}')"
                echo "PATCH_FILES_BEGIN"
                grep '^diff --git ' "$patch" || true
                echo "PATCH_FILES_END"
              } >> susfs-selected-fix-patch-manifest.txt

              MAT_STAGE="APPLY_CHECK_$sha"
              git -C "$FIX" apply --check "$patch" \
                >> susfs-materialize.log 2>&1

              MAT_STAGE="APPLY_$sha"
              git -C "$FIX" apply "$patch" \
                >> susfs-materialize.log 2>&1

              git -C "$FIX" diff --check -- \
                kernel_patches/fs/susfs.c \
                kernel_patches/include/linux/susfs.h \
                kernel_patches/include/linux/susfs_def.h \
                >> susfs-materialize.log 2>&1
            done

            echo "SUSFS_FIXSET_TRANSPORT=LOCAL_GIT_OBJECT_ARCHIVE_PLUS_EXACT_DIFFS" \
              | tee susfs-fixset-transport.txt

          elif [ "$MODE" = "HTTP_ARCHIVE_PATCH" ]; then
            MAT_STAGE='HTTP_FALLBACK_COPY'

            cp -a "$GITHUB_WORKSPACE/susfs-http/base/." "$FIX/"

            git -C "$FIX" init -q
            git -C "$FIX" add -A
            git -C "$FIX" \
              -c user.name='GEN2 Audit' \
              -c user.email='gen2-audit@localhost' \
              commit -q -m 'SUSFS v2.2 exact HTTP base'

            for sha in "${FIXES[@]}"; do
              patch="$GITHUB_WORKSPACE/susfs-http/patches/${sha}.patch"

              MAT_STAGE="HTTP_APPLY_CHECK_$sha"
              git -C "$FIX" apply --check "$patch" \
                >> susfs-materialize.log 2>&1

              MAT_STAGE="HTTP_APPLY_$sha"
              git -C "$FIX" apply "$patch" \
                >> susfs-materialize.log 2>&1

              git -C "$FIX" diff --check -- \
                kernel_patches/fs/susfs.c \
                kernel_patches/include/linux/susfs.h \
                kernel_patches/include/linux/susfs_def.h \
                >> susfs-materialize.log 2>&1
            done

            echo "SUSFS_FIXSET_TRANSPORT=HTTP_ARCHIVE_PATCH" \
              | tee susfs-fixset-transport.txt
          else
            echo "Unknown SUSFS fetch mode: $MODE" >&2
            exit 1
          fi

          MAT_STAGE='COMMON_OUTPUT_VERIFICATION'

          if [ "$MODE" = "GIT_HISTORY" ]; then
            test -f susfs-selected-fix-patch-manifest.txt
            test "$(grep -c '^PATCH_SHA=' susfs-selected-fix-patch-manifest.txt)" -eq 4
            for sha in "${FIXES[@]}"; do
              grep -q "^PATCH_SHA=$sha$" susfs-selected-fix-patch-manifest.txt
            done
          fi

          for rel in \
            kernel_patches/fs/susfs.c \
            kernel_patches/include/linux/susfs.h \
            kernel_patches/include/linux/susfs_def.h \
            kernel_patches/50_add_susfs_in_gki-android12-5.10.patch
          do
            test -f "$FIX/$rel"
          done

          # Frozen selected-fix fingerprints.
          grep -Rq 'synchronize_srcu' "$FIX/kernel_patches"
          grep -Rq 'DEFINE_SRCU' "$FIX/kernel_patches"

          # The fourth selected fix must preserve GEN2-compatible three-arg
          # set_nameidata in the materialized OPEN_REDIRECT reference.
          grep -Rq 'set_nameidata(nd, old_dfd, fake_filename)' \
            "$FIX/kernel_patches"

          git -C "$FIX" diff --check -- \
            kernel_patches/fs/susfs.c \
            kernel_patches/include/linux/susfs.h \
            kernel_patches/include/linux/susfs_def.h \
            > susfs-fixset-diff-check.txt

          {
            echo "PATCH_FILE_WHITESPACE_POLICY=EXCLUDED_FROM_SOURCE_DIFF_CHECK"
            echo "REASON=kernel_patches/50_add_susfs_in_gki-android12-5.10.patch_is_reference_data"
            echo "SOURCE_HEADER_DIFF_CHECK=PASS"
          } | tee susfs-reference-whitespace-policy.txt

          echo "$FIX" > susfs-fixset.path

          {
            echo "SUSFS_FIXSET_MATERIALIZATION=PASS"
            echo "SUSFS_FIXSET_MODE=$MODE"
            echo "SUSFS_FIXSET_METHOD=$(
              cat susfs-fixset-transport.txt | cut -d= -f2-
            )"
            echo "SUSFS_BASE=$BASE"
            echo "SUSFS_SELECTED_FIX_COUNT=${#FIXES[@]}"
            echo "SUSFS_SELECTED_FIX_ORDER=${FIXES[*]}"
            echo "SUSFS_MATERIALIZATION_NETWORK_REQUESTS_AFTER_FETCH=0"
            echo "SUSFS_FIXSET_SOURCE_HEADER_DIFF_CHECK=PASS"
          } | tee susfs-fixset-state.txt

          {
            echo "SUSFS_MATERIALIZATION_RESULT=PASS"
            echo "SUSFS_MATERIALIZATION_STAGE=COMPLETE"
            echo "SUSFS_MATERIALIZATION_METHOD=$(
              cat susfs-fixset-transport.txt | cut -d= -f2-
            )"
          } >> early-audit-diagnostics.txt

          trap - ERR

      - name: Stage standalone SUSFS files
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"
          FIX="$(cat susfs-fixset.path)"

          install -m 0644 \
            "$FIX/kernel_patches/fs/susfs.c" \
            "$SIM/fs/susfs.c"

          install -m 0644 \
            "$FIX/kernel_patches/include/linux/susfs.h" \
            "$SIM/include/linux/susfs.h"

          install -m 0644 \
            "$FIX/kernel_patches/include/linux/susfs_def.h" \
            "$SIM/include/linux/susfs_def.h"

          echo "STANDALONE_SUSFS_FILES_STAGED=PASS" \
            | tee standalone-susfs-state.txt

      - name: Reproduce Workflow 17 partial SUSFS application
        shell: bash
        run: |
          set -uo pipefail

          SIM="$(cat kernel-simulation.path)"
          FIX="$(cat susfs-fixset.path)"
          PATCH="$FIX/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"

          git -C "$SIM" apply \
            --reject \
            --whitespace=nowarn \
            "$PATCH" \
            > workflow17-apply.log 2>&1 || true

          find "$SIM" \
            -path "$SIM/KernelSU" -prune -o \
            -type f -name '*.rej' -print \
            | sort \
            > workflow17-rejects-absolute.txt

          sed "s#^$SIM/##" \
            workflow17-rejects-absolute.txt \
            > workflow17-rejects.txt

          echo "WORKFLOW17_PARTIAL_STAGE_REPRODUCED=YES" \
            | tee workflow17-stage-state.txt

      - name: Record callsite-aware hook state before completion
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY'
          import re
          from pathlib import Path

          sim = Path(Path("kernel-simulation.path").read_text().strip())

          specs = [
              ("ksu_handle_setresuid", "kernel/sys.c"),
              ("ksu_handle_execveat", "fs/exec.c"),
              ("ksu_handle_faccessat", "fs/open.c"),
              ("ksu_handle_sys_read", "fs/read_write.c"),
              ("ksu_handle_stat", "fs/stat.c"),
              ("ksu_handle_sys_reboot", "kernel/reboot.c"),
              ("ksu_handle_input_handle_event", "drivers/input/input.c"),
          ]

          def classify(sym, rel):
              text = (sim / rel).read_text(encoding="utf-8", errors="replace")
              lines = text.splitlines()

              refs = []
              declarations = []
              callsites = []

              for no, line in enumerate(lines, 1):
                  if sym not in line:
                      continue

                  refs.append(no)
                  stripped = line.strip()

                  if stripped.startswith("extern "):
                      declarations.append(no)
                      continue

                  # Function declarations split over lines can start with a return type.
                  if re.match(
                      rf"^(?:static\s+)?(?:inline\s+)?(?:__attribute__\(\([^)]+\)\)\s+)?"
                      rf"(?:int|long|void|bool|ssize_t|u32)\s+{re.escape(sym)}\s*\(",
                      stripped,
                  ):
                      declarations.append(no)
                      continue

                  if re.search(rf"\b{re.escape(sym)}\s*\(", line):
                      callsites.append(no)

              return refs, declarations, callsites

          out = []
          functional = 0

          for sym, rel in specs:
              refs, declarations, callsites = classify(sym, rel)

              if callsites:
                  state = "FUNCTIONAL_CALLSITE_PRESENT"
                  functional += 1
              elif refs:
                  state = "REFERENCE_ONLY_NO_CALLSITE"
              else:
                  state = "ABSENT"

              out += [
                  f"SYMBOL={sym}",
                  f"FILE={rel}",
                  f"STATE={state}",
                  "REFERENCE_LINES=" + (
                      ",".join(map(str, refs)) if refs else "NONE"
                  ),
                  "DECLARATION_LINES=" + (
                      ",".join(map(str, declarations)) if declarations else "NONE"
                  ),
                  "CALLSITE_LINES=" + (
                      ",".join(map(str, callsites)) if callsites else "NONE"
                  ),
                  "",
              ]

          out.append(f"FUNCTIONAL_REQUIRED_HOOK_CALLSITES={functional}")
          out.append(f"MISSING_FUNCTIONAL_REQUIRED_HOOK_CALLSITES={7-functional}")

          Path("hook-callsite-state-before.txt").write_text(
              "\n".join(out) + "\n", encoding="utf-8"
          )
          PY

          cat hook-callsite-state-before.txt

      - name: Complete three missing functional hook callsites with function-scoped edits
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY' 2>&1 | tee hook-completion-edit-log.txt
          import re
          from pathlib import Path

          sim = Path(Path("kernel-simulation.path").read_text().strip())

          def load(rel):
              p = sim / rel
              return p, p.read_text(encoding="utf-8")

          def save(path, text):
              path.write_text(text, encoding="utf-8")

          def function_region(text, start_regex, end_regex, label):
              sm = re.search(start_regex, text, flags=re.M)
              if not sm:
                  raise RuntimeError(f"{label}: function start not found")

              em = re.search(end_regex, text[sm.start():], flags=re.M)
              if not em:
                  raise RuntimeError(f"{label}: function end marker not found")

              end = sm.start() + em.start()
              return sm.start(), end

          def insert_before_function(text, function_regex, block, marker, label):
              if marker in text:
                  print(f"{label}: declaration/include marker already present")
                  return text

              m = re.search(function_regex, text, flags=re.M)
              if not m:
                  raise RuntimeError(f"{label}: target function not found")

              print(f"{label}: inserting before byte offset {m.start()}")
              return text[:m.start()] + block + text[m.start():]

          def insert_after_unique_line_in_region(
              text, region_start, region_end, line, block, marker, label
          ):
              region = text[region_start:region_end]

              if marker in region:
                  print(f"{label}: callsite marker already present")
                  return text

              count = region.count(line)
              print(f"{label}: scoped anchor count={count}")

              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected one scoped anchor, found {count}"
                  )

              idx = region.index(line) + len(line)
              absolute = region_start + idx
              return text[:absolute] + block + text[absolute:]

          # ============================================================
          # 1) kernel/sys.c :: __sys_setresuid()
          # ============================================================
          rel = "kernel/sys.c"
          path, text = load(rel)

          start, end = function_region(
              text,
              r"^long __sys_setresuid\(uid_t ruid, uid_t euid, uid_t suid\)\n\{\n",
              r"^SYSCALL_DEFINE3\(setresuid,",
              "kernel/sys.c::__sys_setresuid",
          )

          text = insert_after_unique_line_in_region(
              text,
              start,
              end,
              "\tkuid_t kruid, keuid, ksuid;\n",
              "\n#ifdef CONFIG_KSU_SUSFS\n"
              "\t(void)ksu_handle_setresuid(ruid, euid, suid);\n"
              "#endif\n",
              "ksu_handle_setresuid(ruid, euid, suid)",
              "kernel/sys.c setresuid hook",
          )

          save(path, text)
          print("kernel/sys.c setresuid hook: PASS")

          # ============================================================
          # 2) fs/open.c :: do_faccessat()
          # Exact GEN2 API has no flags argument.
          # ============================================================
          rel = "fs/open.c"
          path, text = load(rel)

          if "#include <linux/susfs_def.h>" not in text:
              include_re = re.compile(
                  r"^(#include <linux/compat\.h>\n)",
                  flags=re.M,
              )
              m = include_re.search(text)
              if not m:
                  raise RuntimeError(
                      "fs/open.c: <linux/compat.h> include not found"
                  )

              text = (
                  text[:m.end()]
                  + "#ifdef CONFIG_KSU_SUSFS\n"
                    "#include <linux/susfs_def.h>\n"
                    "#endif\n"
                  + text[m.end():]
              )
              print("fs/open.c SUSFS include: inserted")
          else:
              print("fs/open.c SUSFS include: already present")

          faccess_decl = (
              "#ifdef CONFIG_KSU_SUSFS\n"
              "extern struct static_key_true ksu_su_compat_enabled;\n"
              "extern bool __ksu_is_allow_uid_for_current(uid_t uid);\n"
              "extern int ksu_handle_faccessat(int *dfd, "
              "const char __user **filename_user, int *mode, int *flags);\n"
              "#endif\n\n"
          )

          text = insert_before_function(
              text,
              r"^long do_faccessat\(int dfd, const char __user \*filename, int mode\)\n",
              faccess_decl,
              "extern int ksu_handle_faccessat(int *dfd",
              "fs/open.c faccessat declarations",
          )

          start, end = function_region(
              text,
              r"^long do_faccessat\(int dfd, const char __user \*filename, int mode\)\n\{\n",
              r"^SYSCALL_DEFINE3\(faccessat,",
              "fs/open.c::do_faccessat",
          )

          text = insert_after_unique_line_in_region(
              text,
              start,
              end,
              "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n",
              "\n#ifdef CONFIG_KSU_SUSFS\n"
              "\tif (likely(susfs_is_current_proc_umounted()))\n"
              "\t\tgoto orig_flow;\n\n"
              "\tif (static_branch_likely(&ksu_su_compat_enabled)) {\n"
              "\t\tif (unlikely(__ksu_is_allow_uid_for_current(current_uid().val)))\n"
              "\t\t\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
              "\t}\n\n"
              "orig_flow:\n"
              "#endif\n",
              "ksu_handle_faccessat(&dfd, &filename, &mode, NULL)",
              "fs/open.c faccessat hook",
          )

          save(path, text)
          print("fs/open.c faccessat hook: PASS")

          # ============================================================
          # 3) fs/stat.c :: vfs_statx()
          # ============================================================
          rel = "fs/stat.c"
          path, text = load(rel)

          if "#include <linux/susfs_def.h>" not in text:
              include_re = re.compile(
                  r"^(#include <linux/compat\.h>\n)",
                  flags=re.M,
              )
              m = include_re.search(text)
              if not m:
                  raise RuntimeError(
                      "fs/stat.c: <linux/compat.h> include not found"
                  )

              text = (
                  text[:m.end()]
                  + "#ifdef CONFIG_KSU_SUSFS\n"
                    "#include <linux/susfs_def.h>\n"
                    "#include <linux/version.h>\n"
                    "#endif\n"
                  + text[m.end():]
              )
              print("fs/stat.c SUSFS include: inserted")
          else:
              print("fs/stat.c SUSFS include: already present")

          stat_decl = (
              "#ifdef CONFIG_KSU_SUSFS\n"
              "extern struct static_key_true ksu_su_compat_enabled;\n"
              "extern bool __ksu_is_allow_uid_for_current(uid_t uid);\n"
              "extern int ksu_handle_stat(int *dfd, "
              "const char __user **filename_user, int *flags);\n"
              "#endif\n\n"
          )

          text = insert_before_function(
              text,
              r"^int vfs_statx\(int dfd, const char __user \*filename, int flags,\n",
              stat_decl,
              "extern int ksu_handle_stat(int *dfd",
              "fs/stat.c stat declarations",
          )

          start, end = function_region(
              text,
              r"^int vfs_statx\(int dfd, const char __user \*filename, int flags,\n"
              r"\s*struct kstat \*stat, u32 request_mask\)\n\{\n",
              r"^EXPORT_SYMBOL\(vfs_statx\);",
              "fs/stat.c::vfs_statx",
          )

          text = insert_after_unique_line_in_region(
              text,
              start,
              end,
              "\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;\n",
              "\n#ifdef CONFIG_KSU_SUSFS\n"
              "\tif (likely(susfs_is_current_proc_umounted()))\n"
              "\t\tgoto orig_flow;\n\n"
              "\tif (static_branch_likely(&ksu_su_compat_enabled)) {\n"
              "\t\tif (unlikely(__ksu_is_allow_uid_for_current(current_uid().val)))\n"
              "\t\t\tksu_handle_stat(&dfd, &filename, &flags);\n"
              "\t}\n\n"
              "orig_flow:\n"
              "#endif\n",
              "ksu_handle_stat(&dfd, &filename, &flags)",
              "fs/stat.c stat hook",
          )

          save(path, text)
          print("fs/stat.c stat hook: PASS")

          print("THREE_MISSING_HOOK_CALLSITES_STAGED=PASS")
          PY

          grep -q '^THREE_MISSING_HOOK_CALLSITES_STAGED=PASS$' \
            hook-completion-edit-log.txt

          echo "THREE_MISSING_HOOK_CALLSITES_STAGED=PASS" \
            | tee hook-completion-state.txt

      - name: Verify all seven required hooks by functional callsite not symbol presence
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY'
          import re
          from pathlib import Path

          sim = Path(Path("kernel-simulation.path").read_text().strip())

          specs = [
              ("ksu_handle_setresuid", "kernel/sys.c"),
              ("ksu_handle_execveat", "fs/exec.c"),
              ("ksu_handle_faccessat", "fs/open.c"),
              ("ksu_handle_sys_read", "fs/read_write.c"),
              ("ksu_handle_stat", "fs/stat.c"),
              ("ksu_handle_sys_reboot", "kernel/reboot.c"),
              ("ksu_handle_input_handle_event", "drivers/input/input.c"),
          ]

          out = []
          functional = 0

          for sym, rel in specs:
              text = (sim / rel).read_text(
                  encoding="utf-8", errors="replace"
              )
              call_lines = []

              for no, line in enumerate(text.splitlines(), 1):
                  if not re.search(rf"\b{re.escape(sym)}\s*\(", line):
                      continue

                  stripped = line.strip()

                  if stripped.startswith("extern "):
                      continue

                  if re.match(
                      rf"^(?:static\s+)?(?:inline\s+)?"
                      rf"(?:__attribute__\(\([^)]+\)\)\s+)?"
                      rf"(?:int|long|void|bool|ssize_t|u32)\s+"
                      rf"{re.escape(sym)}\s*\(",
                      stripped,
                  ):
                      continue

                  call_lines.append(no)

              if call_lines:
                  functional += 1
                  state = "FUNCTIONAL_CALLSITE_PRESENT"
              else:
                  state = "MISSING_FUNCTIONAL_CALLSITE"

              out += [
                  f"SYMBOL={sym}",
                  f"FILE={rel}",
                  f"STATE={state}",
                  "CALLSITE_LINES=" + (
                      ",".join(map(str, call_lines))
                      if call_lines else "NONE"
                  ),
                  "",
              ]

          out += [
              f"FUNCTIONAL_REQUIRED_HOOK_CALLSITES={functional}",
              f"MISSING_FUNCTIONAL_REQUIRED_HOOK_CALLSITES={7-functional}",
          ]

          Path("hook-callsite-state-after.txt").write_text(
              "\n".join(out) + "\n", encoding="utf-8"
          )
          PY

          cat hook-callsite-state-after.txt

          grep -q '^FUNCTIONAL_REQUIRED_HOOK_CALLSITES=7$' \
            hook-callsite-state-after.txt

          grep -q '^MISSING_FUNCTIONAL_REQUIRED_HOOK_CALLSITES=0$' \
            hook-callsite-state-after.txt

      - name: Resolve low-risk SUSFS build and declaration plumbing rejects v2
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY' 2>&1 | tee plumbing-edit-log.txt
          from pathlib import Path

          sim = Path(Path("kernel-simulation.path").read_text().strip())

          def insert_after(rel, marker, anchor, addition, label):
              p = sim / rel
              text = p.read_text(encoding="utf-8")

              if marker in text:
                  print(f"{label}: already present")
                  return

              count = text.count(anchor)
              print(f"{label}: exact anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected exactly one anchor, found {count}"
                  )

              text = text.replace(anchor, anchor + addition, 1)
              p.write_text(text, encoding="utf-8")
              print(f"{label}: PASS")

          def replace_exact(rel, marker, old, new, label):
              p = sim / rel
              text = p.read_text(encoding="utf-8")

              if marker in text:
                  print(f"{label}: already present")
                  return

              count = text.count(old)
              print(f"{label}: exact block count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected exactly one block, found {count}"
                  )

              text = text.replace(old, new, 1)
              p.write_text(text, encoding="utf-8")
              print(f"{label}: PASS")

          # ------------------------------------------------------------
          # fs/Makefile
          # GEN2 5.4.302 ends the main obj-y list at fsopen.o;
          # unlike the 5.10 reference it has no kernel_read_file.o /
          # remap_range.o tail here.
          # ------------------------------------------------------------
          insert_after(
              "fs/Makefile",
              "obj-$(CONFIG_KSU_SUSFS) += susfs.o",
              "\t\tfs_types.o fs_context.o fs_parser.o fsopen.o\n",
              "\nobj-$(CONFIG_KSU_SUSFS) += susfs.o\n",
              "fs/Makefile susfs.o wiring",
          )

          # ------------------------------------------------------------
          # fs/exec.c
          # GEN2 5.4.302 has no linux/io_uring.h include at this point.
          # ------------------------------------------------------------
          insert_after(
              "fs/exec.c",
              "#include <linux/susfs_def.h>",
              "#include <linux/vmalloc.h>\n",
              "#ifdef CONFIG_KSU_SUSFS\n"
              "#include <linux/susfs_def.h>\n"
              "#endif\n",
              "fs/exec.c susfs_def include",
          )

          # ------------------------------------------------------------
          # fs/notify/fdinfo.c
          # ------------------------------------------------------------
          insert_after(
              "fs/notify/fdinfo.c",
              "#include <linux/susfs_def.h>",
              "#include <linux/exportfs.h>\n",
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "#include <linux/susfs_def.h>\n"
              "#endif\n",
              "fs/notify/fdinfo.c susfs_def include",
          )

          # ------------------------------------------------------------
          # fs/proc/base.c
          # ------------------------------------------------------------
          insert_after(
              "fs/proc/base.c",
              "#include <linux/susfs_def.h>",
              "#include <linux/cpufreq_times.h>\n",
              "#if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n"
              "#include <linux/susfs_def.h>\n"
              "#endif\n",
              "fs/proc/base.c susfs_def include",
          )

          # ------------------------------------------------------------
          # kernel/kallsyms.c
          # ------------------------------------------------------------
          insert_after(
              "kernel/kallsyms.c",
              "#include <linux/susfs_def.h>",
              "#include <linux/compiler.h>\n",
              "#ifdef CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS\n"
              "#include <linux/susfs_def.h>\n"
              "#endif\n",
              "kernel/kallsyms.c susfs_def include",
          )

          # ------------------------------------------------------------
          # security/selinux/hooks.c
          # GEN2 carries a QCOM_RTIC conditional around selinux_state.
          # Insert SUSFS externs after the whole conditional so both
          # QCOM_RTIC and non-RTIC builds see them.
          # ------------------------------------------------------------
          old = (
              "#ifdef CONFIG_QCOM_RTIC\n"
              "struct selinux_state selinux_state __rticdata;\n"
              "#else\n"
              "struct selinux_state selinux_state;\n"
              "#endif\n"
          )
          new = (
              old
              + "#ifdef CONFIG_KSU_SUSFS\n"
              "extern struct selinux_state fake_state;\n"
              "extern bool ksu_selinux_hide_running __read_mostly;\n"
              "#endif\n"
          )

          replace_exact(
              "security/selinux/hooks.c",
              "extern struct selinux_state fake_state;",
              old,
              new,
              "security/selinux/hooks.c SUSFS extern wiring",
          )

          print("PLUMBING_REJECT_COMPLETION=PASS")
          PY

          grep -q '^PLUMBING_REJECT_COMPLETION=PASS$' \
            plumbing-edit-log.txt

          echo "PLUMBING_REJECT_COMPLETION=PASS" \
            | tee plumbing-state.txt

