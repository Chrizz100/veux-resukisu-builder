          {
            echo "WORKFLOW33_VEUX_DTB_BUILD_RESULT=PASS"
            echo "WORKFLOW33_VEUX_DTB_SHA256=$(sha256sum GEN2_33_veux.dtb | awk '{print $1}')"
          } >> early-audit-diagnostics.txt

          trap - ERR

      - name: Audit full-build compiler errors and targeted warnings
        id: diagnostics
        shell: bash
        run: |
          set -euo pipefail

          # Full build already hard-fails on compiler/linker errors. This second
          # pass makes the artifact independently reviewable and hard-fails
          # warnings in ReSukiSU/SUSFS/adaptation-sensitive paths.
          grep -Ein \
            '(^|[[:space:]])(error:|fatal:|undefined reference|ld\.lld: error)' \
            workflow33-build.log \
            > workflow33-current-compiler-errors.txt || true

          grep -Ein \
            'warning:' \
            workflow33-build.log \
            > workflow33-all-warnings.txt || true

          grep -Ei \
            '(fs/susfs\.c|KernelSU/|drivers/kernelsu/|security/selinux/selinuxfs\.c|fs/exec\.c|fs/namei\.c|fs/readdir\.c|mm/memory\.c|kernel/sched/cpufreq_schedutil\.c|drivers/cpuidle/|drivers/soc/qcom/lpm).*warning:|warning:.*(fs/susfs\.c|KernelSU/|drivers/kernelsu/|security/selinux/selinuxfs\.c|fs/exec\.c|fs/namei\.c|fs/readdir\.c|mm/memory\.c|kernel/sched/cpufreq_schedutil\.c|drivers/cpuidle/|drivers/soc/qcom/lpm)' \
            workflow33-all-warnings.txt \
            > workflow33-targeted-warnings.txt || true

          ERROR_COUNT="$(wc -l < workflow33-current-compiler-errors.txt | tr -d ' ')"
          WARNING_COUNT="$(wc -l < workflow33-all-warnings.txt | tr -d ' ')"
          TARGETED_WARNING_COUNT="$(wc -l < workflow33-targeted-warnings.txt | tr -d ' ')"

          {
            echo "COMPILER_ERROR_COUNT=$ERROR_COUNT"
            echo "TOTAL_WARNING_COUNT=$WARNING_COUNT"
            echo "TARGETED_WARNING_COUNT=$TARGETED_WARNING_COUNT"
            echo "WARNING_COUNT_POLICY=DYNAMIC_REPORTED_NOT_HARDCODED"
            echo "QCOM_CPUFREQ_HW_BASELINE_WARNING_NOT_BLINDLY_COUNTED_AS_TARGETED"
          } | tee workflow33-compiler-diagnostics.txt

          test "$ERROR_COUNT" -eq 0

          if [ "$TARGETED_WARNING_COUNT" -ne 0 ]; then
            echo "ERROR: targeted ReSukiSU/SUSFS/adaptation/CPUFreq-core/idle warning(s) detected"
            cat workflow33-targeted-warnings.txt
            exit 1
          fi

          echo "WORKFLOW33_COMPILER_DIAGNOSTICS=PASS" \
            | tee workflow33-compiler-diagnostics-status.txt

      - name: Verify Workflow 33 build invariants
        shell: bash
        run: |
          set -euo pipefail

          grep -q '^FULL_TREE_STATIC_PORT_INTEGRITY=PASS$' \
            workflow28-static-integrity.txt
          grep -q '^FULL_TREE_PROVIDER_CONSUMER_INTEGRITY=PASS$' \
            workflow28-provider-consumer-integrity.txt
          grep -q '^WORKFLOW33_R416183B_CONFIG=PASS$' \
            workflow33-config-verification.txt
          grep -q '^WORKFLOW33_COMPILE_COMPAT_ADAPTATION=PASS$' \
            workflow33-compile-compat-status.txt
          grep -q '^WORKFLOW33_V3_COMPILE_COMPAT_CONTRACTS=PASS$' \
            workflow33-compile-compat-verification.txt
          grep -q '^W30V2_COMPILE_BLOCKER_CLOSURES=PASS$' \
            workflow33-w30v2-closure-status.txt
          grep -q '^W32_CURRENT_UID_HEADER_CLOSURE=PASS$' \
            workflow33-current-uid-header-closure-status.txt
          grep -q '^HOTSPOT_OBJECT_BUILD=PASS$' \
            workflow33-hotspot-build-status.txt
          grep -q '^W30V2_FSNOTIFY_R416183B_OBJECT_COMPILE=PASS$' \
            workflow33-hotspot-build-status.txt
          grep -q '^NON_KSU_CONFIG_DELTA_COUNT=0$' \
            workflow33-config-verification.txt
          grep -q '^WORKFLOW33_IMAGE_BUILD_RESULT=PASS$' \
            workflow33-image-build-status.txt
          grep -q '^WORKFLOW33_VEUX_DTB_BUILD_RESULT=PASS$' \
            workflow33-dtb-build-status.txt
          grep -q '^WORKFLOW33_COMPILER_DIAGNOSTICS=PASS$' \
            workflow33-compiler-diagnostics-status.txt
          grep -q '^FUNCTIONAL_REQUIRED_HOOK_CALLSITES=7$' \
            hook-callsite-state-after.txt
          grep -q '^MISSING_FUNCTIONAL_REQUIRED_HOOK_CALLSITES=0$' \
            hook-callsite-state-after.txt
          grep -q '^INCOMPATIBLE_LEGACY_HOOK_REFERENCES=0$' \
            incompatible-hook-state.txt

          test -s GEN2_33_Image
          test -s GEN2_33_final.config
          test -s GEN2_33_Image.sha256
          test -s GEN2_33_vmlinux
          test -s GEN2_33_vmlinux.sha256
          test -s GEN2_33_System.map
          test -s GEN2_33_System.map.sha256
          test -s GEN2_33_veux.dtb
          test -s GEN2_33_veux.dtb.sha256

          {
            echo "WORKFLOW33_BUILD_INVARIANTS=PASS"
            echo "SEMANTIC_SUSFS_PORT_COMPLETE=YES"
            echo "EFFECTIVE_REMAINING_SEMANTIC_REJECT_FILES=0"
            echo "R416183B_TARGET_CONFIG=PASS"
            echo "FUNCTIONAL_INLINE_HOOKS=7_OF_7"
            echo "CONTROLLED_IMAGE_BUILD_RETRY=PASS"
            echo "IMAGE_AND_VEUX_DTB_BUILD=PASS"
          } | tee workflow33-build-invariants.txt

      - name: Verify original pinned GEN2 source remained untouched
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C kernel-src rev-parse HEAD)" = \
            "f4b8a13a43a130a9aab83cc985ce4d4421291ae6"

          test -z "$(git -C kernel-src status --porcelain)"

          echo "ORIGINAL_PROJECT_SOURCE_UNTOUCHED=YES" \
            | tee original-source-status.txt

      - name: Write final Workflow 33 audit
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "AUDIT=GEN2_33_V2_FULL_IMAGE_DTB_BUILD_RETRY"
            echo "WORKFLOW_REVISION=GEN2_33_V2_INDEPENDENT_AUDIT_GUARD_W32_HEADER_CLOSURE_FULL_IMAGE_DTB_RETRY"
            echo "RESULT=PASS"
            echo "FINAL_RESULT=PASS_GEN2_5_4_302_IMAGE_DTB_BUILD_WITH_W32_HEADER_CLOSURE"
            echo "GEN2_33_V2_FULL_IMAGE_DTB_BUILD_RETRY_AUDIT=PASS"
            echo "KERNEL_COMMIT=$(git -C kernel-src rev-parse HEAD)"
            echo "RESUKISU_COMMIT=$(git -C resukisu rev-parse HEAD)"
            echo "SUSFS_BASE=4003ecf2d01c6d13fa8edf6c4f2607365738dc3d"
            echo "OPEN_REDIRECT_REFERENCE=V220_PLUS_FOUR_SELECTED_FIXES"
            echo "BUILD_TOOLCHAIN=Android_clang_r416183b"
            echo "BUILD_TOOLCHAIN_SOURCE_COMMIT=42276f8be3ab82a9a71957ca4943872498bdcdee"
            echo "BUILD_CLANG_VERSION=12.0.5"
            echo "BUILD_LLD_VERSION=12.0.5"
            echo "W30V2_COMPILE_BLOCKER_CLOSURES=APPLIED_AND_VERIFIED"
            echo "W32_CURRENT_UID_HEADER_CLOSURE=APPLIED_AND_FULL_BUILD_VALIDATED"
            echo "W32_DIRECT_OBJECT_COMPILE_H_ARTIFACT=NOT_A_KERNEL_SOURCE_BLOCKER"
            echo "IMAGE_CREATED=YES"
            echo "VEUX_DTB_CREATED=YES"
            echo "VMLINUX_CREATED=YES"
            echo "SYSTEM_MAP_CREATED=YES"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "TEMPORARY_WORKTREE_MODIFIED=YES"
            echo "ORIGINAL_PROJECT_SOURCE_UNTOUCHED=YES"
            echo
            cat workflow28-static-integrity.txt
            echo
            cat workflow28-provider-consumer-integrity.txt
            echo
            cat workflow33-compile-compat-status.txt
            echo
            cat workflow33-compile-compat-verification.txt
            echo
            cat workflow33-hotspot-build-status.txt
            echo
            cat workflow33-toolchain-status.txt
            echo
            cat workflow33-config-verification.txt
            echo
            cat workflow33-config-status.txt
            echo
            cat workflow33-w30v2-closure-status.txt
            echo
            cat workflow33-current-uid-header-closure-status.txt
            echo
            cat workflow33-image-build-status.txt
            echo
            cat workflow33-dtb-build-status.txt
            echo
            cat workflow33-compiler-diagnostics.txt
            echo
            cat workflow33-build-invariants.txt
            echo
            echo "NEXT_STEP=INSPECT_GEN2_33_IMAGE_DTB_VMLINUX_SYSTEM_MAP"
          } | tee GEN2_33_V2_FULL_IMAGE_DTB_BUILD_RETRY_AUDIT.txt

      - name: Build failure-safe Workflow 33 audit
        if: always()
        shell: bash
        run: |
          set +e

          FINAL='GEN2_33_V2_FULL_IMAGE_DTB_BUILD_RETRY_AUDIT.txt'

          if [ ! -s "$FINAL" ]; then
            {
              echo "AUDIT=GEN2_33_V2_FULL_IMAGE_DTB_BUILD_RETRY"
              echo "WORKFLOW_REVISION=GEN2_33_V2_INDEPENDENT_AUDIT_GUARD_W32_HEADER_CLOSURE_FULL_IMAGE_DTB_RETRY"
              echo "RESULT=INCOMPLETE_OR_FAILED_BEFORE_FINAL_AUDIT"
              echo "FAILURE_SAFE_AUDIT_GENERATED=YES"
              echo

              if [ -f early-audit-diagnostics.txt ]; then
                echo "=== EARLY DIAGNOSTICS ==="
                cat early-audit-diagnostics.txt
                echo
              fi

              if [ -f workflow33-compile-compat-status.txt ]; then
                echo "=== COMPILE COMPAT STATUS ==="
                cat workflow33-compile-compat-status.txt
                echo
              fi

              if [ -f workflow33-compile-compat-edit-log.txt ]; then
                echo "=== COMPILE COMPAT EDIT LOG ==="
                cat workflow33-compile-compat-edit-log.txt
                echo
              fi

              if [ -f workflow33-w30v2-closure-status.txt ]; then
                echo "=== W30 V2 BLOCKER CLOSURE STATUS ==="
                cat workflow33-w30v2-closure-status.txt
                echo
              fi

              if [ -f workflow33-current-uid-header-closure-status.txt ]; then
                echo "=== W32 CURRENT_UID HEADER CLOSURE STATUS ==="
                cat workflow33-current-uid-header-closure-status.txt
                echo
              fi

              if [ -f workflow33-toolchain-status.txt ]; then
                echo "=== TOOLCHAIN STATUS ==="
                cat workflow33-toolchain-status.txt
                echo
              fi

              if [ -f workflow33-hotspot-build-failure.txt ]; then
                echo "=== HOTSPOT OBJECT BUILD FAILURE ==="
                cat workflow33-hotspot-build-failure.txt
                echo
              fi

              if [ -f workflow33-config-failure.txt ]; then
                echo "=== CONFIG FAILURE ==="
                cat workflow33-config-failure.txt
                echo
              fi

              if [ -f workflow33-build-failure.txt ]; then
                echo "=== BUILD FAILURE ==="
                cat workflow33-build-failure.txt
                echo
              fi

              if [ -f workflow33-build-errors.txt ]; then
                echo "=== BUILD ERROR SCAN ==="
                cat workflow33-build-errors.txt
                echo
              fi

              if [ -f workflow33-dtb-build-failure.txt ]; then
                echo "=== VEUX DTB BUILD FAILURE ==="
                cat workflow33-dtb-build-failure.txt
                echo
              fi

              if [ -f workflow33-compiler-diagnostics.txt ]; then
                echo "=== COMPILER DIAGNOSTICS ==="
                cat workflow33-compiler-diagnostics.txt
                echo
              fi

              if [ -f workflow33-targeted-warnings.txt ]; then
                echo "=== TARGETED WARNINGS ==="
                cat workflow33-targeted-warnings.txt
                echo
              fi

              echo "KERNEL_IMAGE_CREATED=$(
                test -s GEN2_33_Image && echo YES || echo NO
              )"
              echo "VMLINUX_CREATED=$(
                test -s GEN2_33_vmlinux && echo YES || echo NO
              )"
              echo "SYSTEM_MAP_CREATED=$(
                test -s GEN2_33_System.map && echo YES || echo NO
              )"
              echo "VEUX_DTB_CREATED=$(
                test -s GEN2_33_veux.dtb && echo YES || echo NO
              )"
              echo "BOOT_IMAGE_CREATED=NO"
              echo "FLASHABLE_ZIP_CREATED=NO"
              echo "DEVICE_ACCESSED=NO"
              echo "FLASHING_PERFORMED=NO"
              echo "NEXT_ACTION=INSPECT_FIRST_FAILED_WORKFLOW33_STAGE_AND_W30V2_CLOSURE"
            } > "$FINAL"
          fi

          test -s "$FINAL"

      - name: Upload Workflow 33 audit and Image
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GEN2_33_V2_FULL_IMAGE_DTB_BUILD_RETRY_AUDIT-${{ github.run_number }}
          path: |
            GEN2_33_V2_FULL_IMAGE_DTB_BUILD_RETRY_AUDIT.txt
