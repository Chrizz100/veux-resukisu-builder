      - name: Resolve fs readdir SUS_PATH semantic rejects
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY' 2>&1 | tee readdir-sus-path-edit-log.txt
          import re
          from pathlib import Path

          sim = Path(Path("kernel-simulation.path").read_text().strip())
          p = sim / "fs/readdir.c"
          text = p.read_text(encoding="utf-8")

          def extract_function(source, start_regex):
              m = re.search(start_regex, source, re.M)
              if not m:
                  raise RuntimeError(f"function start not found: {start_regex}")

              brace_start = source.find("{", m.start())
              if brace_start < 0:
                  raise RuntimeError("function opening brace not found")

              depth = 0
              end = None
              for i in range(brace_start, len(source)):
                  ch = source[i]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise RuntimeError("function closing brace not found")

              return m.start(), end, source[m.start():end]

          def ensure_struct_sb(source, struct_name):
              pat = re.compile(
                  rf"(struct {re.escape(struct_name)} \{{)(.*?)(\n\}};)",
                  re.S,
              )
              m = pat.search(source)
              if not m:
                  raise RuntimeError(f"struct {struct_name} not found")

              body = m.group(2)
              if "struct super_block *sb;" in body:
                  print(f"{struct_name} sb field: already present")
                  return source

              anchor = "\n\tstruct dir_context ctx;"
              if anchor not in body:
                  raise RuntimeError(
                      f"struct {struct_name}: dir_context anchor missing"
                  )

              addition = (
                  anchor
                  + "\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH"
                  + "\n\tstruct super_block *sb;"
                  + "\n#endif"
              )
              body = body.replace(anchor, addition, 1)
              source = source[:m.start(2)] + body + source[m.end(2):]
              print(f"{struct_name} sb field: PASS")
              return source

          def ensure_inode_local(source, start_regex, anchor):
              s, e, region = extract_function(source, start_regex)

              if "struct inode *inode;" in region:
                  print(f"inode local for {start_regex}: already present")
                  return source

              count = region.count(anchor)
              if count != 1:
                  raise RuntimeError(
                      f"inode local anchor expected once, found {count}: {start_regex}"
                  )

              addition = (
                  anchor
                  + "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  + "\tstruct inode *inode;\n"
                  + "#endif\n"
              )
              region = region.replace(anchor, addition, 1)
              source = source[:s] + region + source[e:]
              print(f"inode local for {start_regex}: PASS")
              return source

          def ensure_hidden_filter(source, start_regex, anchor, label):
              s, e, region = extract_function(source, start_regex)

              marker = "inode = ilookup(buf->sb, ino);"
              if marker in region:
                  print(f"{label}: already present")
                  return source

              count = region.count(anchor)
              print(f"{label} anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected one insertion anchor, found {count}"
                  )

              block = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  "\tinode = ilookup(buf->sb, ino);\n"
                  "\tif (inode) {\n"
                  "\t\tif (susfs_is_inode_sus_path(inode)) {\n"
                  "\t\t\tiput(inode);\n"
                  "\t\t\treturn 0;\n"
                  "\t\t}\n"
                  "\t\tiput(inode);\n"
                  "\t}\n"
                  "#endif\n"
              )

              region = region.replace(anchor, block + anchor, 1)
              source = source[:s] + region + source[e:]
              print(f"{label}: PASS")
              return source

          def ensure_path_context(source, start_regex, label):
              s, e, region = extract_function(source, start_regex)

              # Declarations.
              decl_marker = "int path_err = -EINVAL;"
              if decl_marker not in region:
                  brace = region.find("{")
                  if brace < 0:
                      raise RuntimeError(f"{label}: opening brace missing")

                  decls = (
                      "\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                      "\tint path_err = -EINVAL;\n"
                      "\tstruct path path;\n"
                      "#endif\n"
                  )
                  region = region[:brace + 1] + decls + region[brace + 1:]
                  print(f"{label} path declarations: PASS")
              else:
                  print(f"{label} path declarations: already present")

              # FUSE -> /data superblock selection.
              setup_marker = "susfs_get_data_path(&path)"
              if setup_marker not in region:
                  anchor = "\terror = iterate_dir(f.file, &buf.ctx);\n"
                  count = region.count(anchor)
                  print(f"{label} iterate anchor count={count}")
                  if count != 1:
                      raise RuntimeError(
                          f"{label}: expected one iterate_dir anchor, found {count}"
                      )

                  setup = (
                      "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                      "\tif (f.file->f_inode->i_sb->s_magic == FUSE_SUPER_MAGIC) {\n"
                      "\t\tpath_err = susfs_get_data_path(&path);\n"
                      "\t\tif (!path_err)\n"
                      "\t\t\tbuf.sb = path.dentry->d_inode->i_sb;\n"
                      "\t}\n"
                      "\tif (path_err)\n"
                      "\t\tbuf.sb = f.file->f_inode->i_sb;\n"
                      "#endif\n"
                  )
                  region = region.replace(anchor, setup + anchor, 1)
                  print(f"{label} FUSE/data sb selection: PASS")
              else:
                  print(f"{label} FUSE/data sb selection: already present")

              # Release the path reference only when susfs_get_data_path()
              # succeeded.
              cleanup_marker = "path_put(&path);"
              if cleanup_marker not in region:
                  anchor = "\tfdput_pos(f);\n"
                  count = region.count(anchor)
                  print(f"{label} fdput cleanup anchor count={count}")
                  if count != 1:
                      raise RuntimeError(
                          f"{label}: expected one fdput_pos anchor, found {count}"
                      )

                  cleanup = (
                      anchor
                      + "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                      + "\tif (!path_err)\n"
                      + "\t\tpath_put(&path);\n"
                      + "#endif\n"
                  )
                  region = region.replace(anchor, cleanup, 1)
                  print(f"{label} data path cleanup: PASS")
              else:
                  print(f"{label} data path cleanup: already present")

              source = source[:s] + region + source[e:]
              return source

          # ------------------------------------------------------------
          # Provider wiring from Workflow 17 must already be present.
          # ------------------------------------------------------------
          required_provider_wiring = [
              "#include <linux/susfs_def.h>",
              "extern int susfs_get_data_path(struct path *path);",
              "extern bool susfs_is_inode_sus_path(struct inode *inode);",
          ]
          for marker in required_provider_wiring:
              if marker not in text:
                  raise RuntimeError(
                      f"fs/readdir.c missing Workflow-17 provider wiring: {marker}"
                  )

          # ------------------------------------------------------------
          # Callback superblock state. Four were already auto-applied;
          # compat_getdents_callback was one of the retained rejects.
          # ------------------------------------------------------------
          for struct_name in [
              "readdir_callback",
              "getdents_callback",
              "getdents_callback64",
              "compat_readdir_callback",
              "compat_getdents_callback",
          ]:
              text = ensure_struct_sb(text, struct_name)

          # ------------------------------------------------------------
          # Callback inode locals. Most are already auto-applied by W17;
          # compat_filldir() differs in this GEN2 5.4 tree.
          # ------------------------------------------------------------
          text = ensure_inode_local(
              text,
              r"^static int fillonedir\(struct dir_context \*ctx,",
              "\tunsigned long d_ino;\n",
          )
          text = ensure_inode_local(
              text,
              r"^static int filldir\(struct dir_context \*ctx,",
              "\tint prev_reclen;\n",
          )
          text = ensure_inode_local(
              text,
              r"^static int filldir64\(struct dir_context \*ctx,",
              "\tint prev_reclen;\n",
          )
          text = ensure_inode_local(
              text,
              r"^static int compat_fillonedir\(struct dir_context \*ctx,",
              "\tcompat_ulong_t d_ino;\n",
          )
          text = ensure_inode_local(
              text,
              r"^static int compat_filldir\(struct dir_context \*ctx,",
              "\tcompat_ulong_t d_ino;\n",
          )

          # ------------------------------------------------------------
          # Hide SUS_PATH entries before any user-visible dirent write.
          # ------------------------------------------------------------
          text = ensure_hidden_filter(
              text,
              r"^static int fillonedir\(struct dir_context \*ctx,",
              "\tbuf->result++;\n",
              "fillonedir SUS_PATH filter",
          )
          text = ensure_hidden_filter(
              text,
              r"^static int filldir\(struct dir_context \*ctx,",
              "\tdirent = buf->current_dir;\n",
              "filldir SUS_PATH filter",
          )
          text = ensure_hidden_filter(
              text,
              r"^static int filldir64\(struct dir_context \*ctx,",
              "\tdirent = buf->current_dir;\n",
              "filldir64 SUS_PATH filter",
          )
          text = ensure_hidden_filter(
              text,
              r"^static int compat_fillonedir\(struct dir_context \*ctx,",
              "\tbuf->result++;\n",
              "compat_fillonedir SUS_PATH filter",
          )
          text = ensure_hidden_filter(
              text,
              r"^static int compat_filldir\(struct dir_context \*ctx,",
              "\tdirent = buf->previous;\n",
              "compat_filldir SUS_PATH filter",
          )

          # ------------------------------------------------------------
          # Establish the superblock used by ilookup().
          #
          # For FUSE views, map to the real /data superblock through
          # susfs_get_data_path(); otherwise use the directory's own sb.
          # old_readdir + compat old_readdir were already partly applied
          # in W17; these helpers are idempotent.
          # ------------------------------------------------------------
          text = ensure_path_context(
              text,
              r"^SYSCALL_DEFINE3\(old_readdir, unsigned int, fd,",
              "old_readdir",
          )
          text = ensure_path_context(
              text,
              r"^SYSCALL_DEFINE3\(getdents, unsigned int, fd,",
              "getdents",
          )
          text = ensure_path_context(
              text,
              r"^int ksys_getdents64\(unsigned int fd,",
              "ksys_getdents64",
          )
          text = ensure_path_context(
              text,
              r"^COMPAT_SYSCALL_DEFINE3\(old_readdir, unsigned int, fd,",
              "compat_old_readdir",
          )
          text = ensure_path_context(
              text,
              r"^COMPAT_SYSCALL_DEFINE3\(getdents, unsigned int, fd,",
              "compat_getdents",
          )

          p.write_text(text, encoding="utf-8")

          # ------------------------------------------------------------
          # Final semantic verification.
          # ------------------------------------------------------------
          final = p.read_text(encoding="utf-8", errors="replace")

          callback_specs = [
              (
                  "fillonedir",
                  r"^static int fillonedir\(struct dir_context \*ctx,",
                  "buf->result++",
              ),
              (
                  "filldir",
                  r"^static int filldir\(struct dir_context \*ctx,",
                  "dirent = buf->current_dir",
              ),
              (
                  "filldir64",
                  r"^static int filldir64\(struct dir_context \*ctx,",
                  "dirent = buf->current_dir",
              ),
              (
                  "compat_fillonedir",
                  r"^static int compat_fillonedir\(struct dir_context \*ctx,",
                  "buf->result++",
              ),
              (
                  "compat_filldir",
                  r"^static int compat_filldir\(struct dir_context \*ctx,",
                  "dirent = buf->previous",
              ),
          ]

          for label, regex, first_write in callback_specs:
              _, _, region = extract_function(final, regex)

              required = [
                  "struct inode *inode;",
                  "inode = ilookup(buf->sb, ino);",
                  "susfs_is_inode_sus_path(inode)",
                  "iput(inode);",
              ]
              for marker in required:
                  if marker not in region:
                      raise RuntimeError(
                          f"{label}: required SUS_PATH marker missing: {marker}"
                      )

              filter_pos = region.index("inode = ilookup(buf->sb, ino);")
              write_pos = region.index(first_write)
              if not filter_pos < write_pos:
                  raise RuntimeError(
                      f"{label}: SUS_PATH filter is not before first visible dirent mutation"
                  )

              if region.count("inode = ilookup(buf->sb, ino);") != 1:
                  raise RuntimeError(
                      f"{label}: expected exactly one ilookup filter"
                  )

              print(f"{label.upper()}_SUS_PATH_FILTER=PASS")

          entry_specs = [
              (
                  "old_readdir",
                  r"^SYSCALL_DEFINE3\(old_readdir, unsigned int, fd,",
              ),
              (
                  "getdents",
                  r"^SYSCALL_DEFINE3\(getdents, unsigned int, fd,",
              ),
              (
                  "ksys_getdents64",
                  r"^int ksys_getdents64\(unsigned int fd,",
              ),
              (
                  "compat_old_readdir",
                  r"^COMPAT_SYSCALL_DEFINE3\(old_readdir, unsigned int, fd,",
              ),
              (
                  "compat_getdents",
                  r"^COMPAT_SYSCALL_DEFINE3\(getdents, unsigned int, fd,",
              ),
          ]

          for label, regex in entry_specs:
              _, _, region = extract_function(final, regex)

              checks = {
                  "PATH_ERR_DECL": "int path_err = -EINVAL;" in region,
                  "PATH_DECL": "struct path path;" in region,
                  "FUSE_MAGIC_CHECK":
                      "f.file->f_inode->i_sb->s_magic == FUSE_SUPER_MAGIC" in region,
                  "GET_DATA_PATH": "susfs_get_data_path(&path)" in region,
                  "REAL_DATA_SB": "buf.sb = path.dentry->d_inode->i_sb;" in region,
                  "ORIGINAL_SB_FALLBACK":
                      "buf.sb = f.file->f_inode->i_sb;" in region,
                  "ITERATE_DIR": "iterate_dir(f.file, &buf.ctx)" in region,
                  "PATH_PUT": "path_put(&path);" in region,
              }

              for key, value in checks.items():
                  print(
                      f"{label.upper()}_{key}="
                      + ("YES" if value else "NO")
                  )
                  if not value:
                      raise RuntimeError(f"{label}: {key}=NO")

              setup_pos = region.index("susfs_get_data_path(&path)")
              iterate_pos = region.index("iterate_dir(f.file, &buf.ctx)")
              cleanup_pos = region.index("path_put(&path);")

              if not setup_pos < iterate_pos < cleanup_pos:
                  raise RuntimeError(
                      f"{label}: data-path lifetime ordering invalid"
                  )

          # Five callback structs must all carry the sb used by ilookup().
          if final.count("struct super_block *sb;") < 5:
              raise RuntimeError(
                  "Expected SUS_PATH sb field in all five readdir callbacks"
              )

          print("READDIR_SUS_PATH_CALLBACK_FILTERS=5")
          print("READDIR_SUS_PATH_ENTRYPOINT_CONTEXTS=5")
          print("READDIR_SUS_PATH_COMPLETION=PASS")
          PY

          grep -q '^READDIR_SUS_PATH_COMPLETION=PASS$' \
            readdir-sus-path-edit-log.txt

          echo "READDIR_SUS_PATH_COMPLETION=PASS" \
            | tee readdir-sus-path-state.txt

      - name: Verify readdir SUS_PATH provider contracts
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          {
            echo "=== susfs_get_data_path provider ==="
            grep -RIn -C 5 \
              'susfs_get_data_path' \
              "$SIM/fs/susfs.c" \
              "$SIM/include/linux/susfs.h" \
              "$SIM/include/linux/susfs_def.h" \
              | sed -n '1,220p'

            echo
            echo "=== susfs_is_inode_sus_path provider ==="
            grep -RIn -C 5 \
              'susfs_is_inode_sus_path' \
              "$SIM/fs/susfs.c" \
              "$SIM/include/linux/susfs.h" \
              "$SIM/include/linux/susfs_def.h" \
              | sed -n '1,220p'
          } | tee readdir-sus-path-provider-context.txt

          grep -Rq 'susfs_get_data_path' \
