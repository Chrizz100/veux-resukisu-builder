      - name: First controlled GEN2 Image build
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"
          TC="$(cat workflow33-toolchain.path)"
          OUT="$(cat workflow33-build-out.path)"

          export PATH="$TC/bin:$PATH"

          : > workflow33-build.log
          : > workflow33-build-errors.txt

          BUILD_STAGE='PREBUILD'

          fail_diag() {
            rc=$?

            {
              echo "WORKFLOW33_IMAGE_BUILD_RESULT=FAIL"
              echo "WORKFLOW33_IMAGE_BUILD_EXIT_CODE=$rc"
              echo "WORKFLOW33_IMAGE_BUILD_STAGE=${BUILD_STAGE:-UNKNOWN}"
              echo
              echo "BUILD_ERROR_SCAN_BEGIN"
              grep -Ein \
                '(^|[[:space:]])(error:|fatal:|undefined reference|ld\.lld: error|make(\[[0-9]+\])?: \*\*\*)' \
                workflow33-build.log \
                | tail -n 220 || true
              echo "BUILD_ERROR_SCAN_END"
              echo
              echo "BUILD_LOG_TAIL_BEGIN"
              tail -n 300 workflow33-build.log 2>/dev/null || true
              echo "BUILD_LOG_TAIL_END"
            } | tee workflow33-build-failure.txt

            grep -Ein \
              '(^|[[:space:]])(error:|fatal:|undefined reference|ld\.lld: error|make(\[[0-9]+\])?: \*\*\*)' \
              workflow33-build.log \
              | tail -n 300 \
              > workflow33-build-errors.txt || true

            {
              echo "WORKFLOW33_IMAGE_BUILD_RESULT=FAIL"
              echo "WORKFLOW33_IMAGE_BUILD_EXIT_CODE=$rc"
              echo "WORKFLOW33_IMAGE_BUILD_STAGE=${BUILD_STAGE:-UNKNOWN}"
            } >> early-audit-diagnostics.txt

            exit "$rc"
          }
          trap fail_diag ERR

          BUILD_STAGE='TOOLCHAIN_IDENTITY_RECHECK'
          "$TC/bin/clang" --version \
            | tee workflow33-build-clang-version.txt
          "$TC/bin/ld.lld" --version \
            | tee workflow33-build-lld-version.txt

          grep -q 'Android (7284624, based on r416183b) clang version 12\.0\.5' \
