      - name: Apply and verify W30 v2 approved compile-blocker closures
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          SUSFS="$SIM/fs/susfs.c"
          SELINUXFS="$SIM/security/selinux/selinuxfs.c"

          test -f "$SUSFS"
          test -f "$SELINUXFS"

          cp "$SUSFS" workflow33-w30v2-susfs.before.c
          cp "$SELINUXFS" workflow33-w30v2-selinuxfs.before.c

          python3 - <<'PY'
          from pathlib import Path
          import difflib

          sim = Path(Path("kernel-simulation.path").read_text().strip())

          # ----------------------------------------------------------
          # W30-v2 closure 1:
          # Adapt SUSFS's newer handle_inode_event callback to the exact
          # legacy fsnotify_ops::handle_event contract in this GEN2 5.4.302
          # source. The inherited watcher body is intentionally preserved.
          # ----------------------------------------------------------
          susfs_path = sim / "fs/susfs.c"
          original = susfs_path.read_text(encoding="utf-8", errors="replace")
          text = original

          marker = "static int susfs_handle_sdcard_inode_event("
          start = text.index(marker)
          brace = text.index("{", start)
          old_signature = text[start:brace]

          required_old = [
              "struct fsnotify_mark *mark",
              "u32 mask",
              "struct inode *inode",
              "struct inode *dir",
              "const struct qstr *file_name",
              "u32 cookie",
          ]
          for fragment in required_old:
              if fragment not in old_signature:
                  raise RuntimeError(
                      "Inherited SUSFS fsnotify signature missing: " + fragment
                  )

          new_signature = """static int susfs_handle_sdcard_inode_event(struct fsnotify_group *group,
                                                          struct inode *inode,
                                                          u32 mask, const void *data,
                                                          int data_type,
                                                          const struct qstr *file_name,
                                                          u32 cookie,
                                                          struct fsnotify_iter_info *iter_info)
          """

          text = text[:start] + new_signature + text[brace:]

          old_ops = ".handle_inode_event = susfs_handle_sdcard_inode_event,"
          new_ops = ".handle_event = susfs_handle_sdcard_inode_event,"

          if text.count(old_ops) != 1:
              raise RuntimeError(
                  "Expected exactly one SUSFS handle_inode_event assignment; "
                  f"found {text.count(old_ops)}"
              )

          text = text.replace(old_ops, new_ops, 1)

          if text == original:
              raise RuntimeError("W30-v2 fsnotify adaptation made no change")

          for fragment in [
              "file_name->len != 7",
              'memcmp(file_name->name, "Android", 7)',
              "queue_delayed_work(system_unbound_wq",
          ]:
              if fragment not in text:
                  raise RuntimeError(
                      "Inherited SUSFS watcher body changed/missing: " + fragment
                  )

          susfs_path.write_text(text, encoding="utf-8")

          patch = "".join(
              difflib.unified_diff(
                  original.splitlines(keepends=True),
                  text.splitlines(keepends=True),
                  fromfile="a/fs/susfs.c",
                  tofile="b/fs/susfs.c",
              )
          )
          if not patch:
              raise RuntimeError("W30-v2 fsnotify patch is empty")

          Path("workflow33-w30v2-fsnotify.patch").write_text(
              patch, encoding="utf-8"
          )

          # ----------------------------------------------------------
          # W30-v2 closure 2:
          # ReSukiSU's pinned static_export_check.mk requires direct symbol
          # visibility for sel_handle_status_ops while KALLSYMS_ALL is off.
          # Remove only "static"; preserve const and the entire structure.
          # ----------------------------------------------------------
          selinux_path = sim / "security/selinux/selinuxfs.c"
          sel_original = selinux_path.read_text(
              encoding="utf-8", errors="replace"
          )
          sel_text = sel_original

          old = "static const struct file_operations sel_handle_status_ops = {"
          new = "const struct file_operations sel_handle_status_ops = {"

          if sel_text.count(old) != 1:
              raise RuntimeError(
                  "Expected exactly one static sel_handle_status_ops definition; "
                  f"found {sel_text.count(old)}"
              )

          sel_text = sel_text.replace(old, new, 1)
          selinux_path.write_text(sel_text, encoding="utf-8")

          sel_patch = "".join(
              difflib.unified_diff(
                  sel_original.splitlines(keepends=True),
                  sel_text.splitlines(keepends=True),
                  fromfile="a/security/selinux/selinuxfs.c",
                  tofile="b/security/selinux/selinuxfs.c",
              )
          )
          if not sel_patch:
              raise RuntimeError("W30-v2 ReSukiSU export patch is empty")

          Path("workflow33-w30v2-resukisu-static-export.patch").write_text(
              sel_patch, encoding="utf-8"
          )

          print("W30V2_FSNOTIFY_SOURCE_ADAPTATION=PASS")
          print("W30V2_RESUKISU_STATIC_EXPORT_ADAPTATION=PASS")
          PY

          test -s workflow33-w30v2-fsnotify.patch
          test -s workflow33-w30v2-resukisu-static-export.patch

          # Exact GEN2 fsnotify interface contract.
          grep -q \
            'int (\*handle_event)(struct fsnotify_group \*group,' \
            "$SIM/include/linux/fsnotify_backend.h"

          if grep -q \
            'handle_inode_event' \
            "$SIM/include/linux/fsnotify_backend.h"
          then
            echo "ERROR: unexpected handle_inode_event in GEN2 fsnotify backend"
            exit 1
          fi

          grep -q \
            '\.handle_event = susfs_handle_sdcard_inode_event,' \
            "$SUSFS"

          if grep -q \
            '\.handle_inode_event = susfs_handle_sdcard_inode_event,' \
            "$SUSFS"
          then
            echo "ERROR: old SUSFS handle_inode_event assignment remains"
            exit 1
          fi

          # Emulate the exact pinned ReSukiSU static-export condition.
          if grep -q -F \
            'static const struct file_operations sel_handle_status_ops' \
            "$SELINUXFS"
          then
            echo "ERROR: ReSukiSU static-export blocker remains"
            exit 1
          fi

          grep -q -F \
            'const struct file_operations sel_handle_status_ops = {' \
            "$SELINUXFS"

          grep -q -F \
            'extern struct file_operations sel_handle_status_ops;' \
            "$SIM/KernelSU/kernel/feature/selinux_hide.c"

          grep -q -F \
            'static const struct file_operations sel_handle_status_ops' \
            "$SIM/KernelSU/kernel/tools/static_export_check.mk"

          # Do not broaden config to solve the direct-symbol requirement.
          if grep -q '^CONFIG_KALLSYMS_ALL=y$' "$SIM/arch/arm64/configs/veux_defconfig"; then
            echo "ERROR: unexpected CONFIG_KALLSYMS_ALL=y in source defconfig"
            exit 1
          fi

          git -C "$SIM" diff --check \
            > workflow33-w30v2-diff-check.txt

          {
            echo "W30V2_COMPILE_BLOCKER_CLOSURES=PASS"
            echo "FSNOTIFY_HANDLE_EVENT_ADAPTER=PASS"
            echo "SEL_HANDLE_STATUS_OPS_DIRECT_VISIBILITY=PASS"
            echo "CONFIG_KALLSYMS_ALL_ENABLEMENT_USED=NO"
            echo "FSNOTIFY_PATCH_SHA256=$(sha256sum workflow33-w30v2-fsnotify.patch | awk '{print $1}')"
            echo "RESUKISU_EXPORT_PATCH_SHA256=$(sha256sum workflow33-w30v2-resukisu-static-export.patch | awk '{print $1}')"
            echo "ORIGINAL_PROJECT_SOURCE_MODIFIED=NO"
          } | tee workflow33-w30v2-closure-status.txt

      - name: Apply W32 current_uid header dependency closure
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"
          HDR="$SIM/include/linux/susfs_def.h"

          test -f "$HDR"

          cp "$HDR" workflow33-susfs_def.before.h

          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import hashlib

          sim = Path(Path("kernel-simulation.path").read_text().strip())
          path = sim / "include/linux/susfs_def.h"

          before = path.read_text(encoding="utf-8", errors="replace")

          if "#include <linux/cred.h>" in before:
              raise RuntimeError("linux/cred.h unexpectedly already present before W32 closure")

          anchor = "#include <linux/bits.h>\n"
          if before.count(anchor) != 1:
              raise RuntimeError(
                  f"Expected exactly one linux/bits.h include anchor, got {before.count(anchor)}"
              )

          before_current_uid = [
              line for line in before.splitlines() if "current_uid()" in line
          ]

          after = before.replace(
              anchor,
              anchor + "#include <linux/cred.h>\n",
              1,
          )

          after_current_uid = [
              line for line in after.splitlines() if "current_uid()" in line
          ]

          if before_current_uid != after_current_uid:
              raise RuntimeError("W32 closure unexpectedly changed current_uid semantics")

          if after.count("#include <linux/cred.h>") != 1:
              raise RuntimeError("linux/cred.h include count is not exactly one")

          path.write_text(after, encoding="utf-8")

          patch = "".join(
              difflib.unified_diff(
                  before.splitlines(keepends=True),
                  after.splitlines(keepends=True),
                  fromfile="a/include/linux/susfs_def.h",
                  tofile="b/include/linux/susfs_def.h",
              )
          )
          if not patch:
              raise RuntimeError("W32 current_uid header closure patch is empty")

          patch_path = Path("workflow33-current-uid-header-closure.patch")
          patch_path.write_text(patch, encoding="utf-8")

          patch_sha = hashlib.sha256(patch_path.read_bytes()).hexdigest()
          expected_sha = "3468ed50e9ada33652404b167c282c025d1291afe9a4fd9e10390cc74d7d6a2f"

          if patch_sha != expected_sha:
              raise RuntimeError(
                  f"W32 closure patch SHA mismatch: got {patch_sha}, expected {expected_sha}"
              )

          print("W32_CURRENT_UID_HEADER_CLOSURE_PATCH_SHA256=" + patch_sha)
          print("W32_CURRENT_UID_SEMANTIC_CHANGE=NO")
          PY

          cp "$HDR" workflow33-susfs_def.after.h

          grep -q '^#include <linux/cred.h>$' "$HDR"
          test "$(grep -c '^#include <linux/cred.h>$' "$HDR")" -eq 1
          grep -q 'current_uid()' "$HDR"

          # Exact provider contract in this pinned 5.4.302 source.
          grep -q '#define current_uid()' "$SIM/include/linux/cred.h"

          git -C "$SIM" diff --check \
            > workflow33-current-uid-diff-check.txt

          test -s workflow33-current-uid-header-closure.patch

          {
            echo "W32_CURRENT_UID_HEADER_CLOSURE=PASS"
            echo "ADDED_INCLUDE=linux/cred.h"
            echo "CURRENT_UID_PROVIDER=include/linux/cred.h"
            echo "CURRENT_UID_EXPRESSION_CHANGED=NO"
            echo "SUSFS_BEHAVIOR_CHANGED=NO"
            echo "CONFIG_CHANGED=NO"
            echo "PATCH_SHA256=$(sha256sum workflow33-current-uid-header-closure.patch | awk '{print $1}')"
            echo "W32_ARTIFACT_PATCH_SHA256_MATCH=YES"
            echo "W32_DIRECT_OBJECT_TEST_COMPILE_H_FAILURE_NOT_PORTED_AS_SOURCE_FIX=YES"
          } | tee workflow33-current-uid-header-closure-status.txt

