      - name: Resolve fs stat SUS_KSTAT and ReSukiSU fstat semantics
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY' 2>&1 | tee fs-stat-edit-log.txt
          import re
          from pathlib import Path

          sim = Path(Path("kernel-simulation.path").read_text().strip())
          p = sim / "fs/stat.c"
          text = p.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # Provider declarations
          # ------------------------------------------------------------
          decl_marker = "susfs_sus_kstat_spoof_generic_fillattr"
          if decl_marker not in text:
              anchor = "#include <asm/unistd.h>\n"
              count = text.count(anchor)
              print(f"fs/stat.c declaration anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"fs/stat.c: expected one asm/unistd include, found {count}"
                  )

              block = (
                  "\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
                  "extern void susfs_sus_kstat_spoof_generic_fillattr("
                  "struct inode *inode, struct kstat *stat);\n"
                  "#endif\n"
                  "#ifdef CONFIG_KSU_SUSFS\n"
                  "extern struct static_key_true ksu_is_init_rc_hook_enabled;\n"
                  "extern void ksu_handle_vfs_fstat(int fd, loff_t *kstat_size_ptr);\n"
                  "#endif\n"
              )
              text = text.replace(anchor, anchor + block, 1)
              print("fs/stat.c provider declarations: PASS")
          else:
              print("fs/stat.c provider declarations: already present")

          # ------------------------------------------------------------
          # 1) generic_fillattr()
          # ------------------------------------------------------------
          if "susfs_sus_kstat_spoof_generic_fillattr(inode, stat);" not in text:
              anchor = "\tstat->blocks = inode->i_blocks;\n"
              count = text.count(anchor)
              print(f"generic_fillattr anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"generic_fillattr: expected one blocks assignment, found {count}"
                  )

              addition = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
                  "\tsusfs_sus_kstat_spoof_generic_fillattr(inode, stat);\n"
                  "#endif\n"
              )
              text = text.replace(anchor, anchor + addition, 1)
              print("generic_fillattr SUS_KSTAT spoof: PASS")
          else:
              print("generic_fillattr SUS_KSTAT spoof: already present")

          # ------------------------------------------------------------
          # 2) vfs_getattr_nosec()
          # Filesystems with their own ->getattr bypass generic_fillattr(),
          # so apply SUS_KSTAT only after a successful custom getattr.
          # ------------------------------------------------------------
          old = (
              "\tif (inode->i_op->getattr)\n"
              "\t\treturn inode->i_op->getattr(path, stat, request_mask,\n"
              "\t\t\t\t\t    query_flags);\n"
          )

          if "int err = inode->i_op->getattr(path, stat, request_mask" not in text:
              count = text.count(old)
              print(f"vfs_getattr_nosec custom-getattr block count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"vfs_getattr_nosec: expected one custom getattr block, found {count}"
                  )

              new = (
                  "\tif (inode->i_op->getattr)\n"
                  "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
                  "\t{\n"
                  "\t\tint err = inode->i_op->getattr(path, stat, request_mask,\n"
                  "\t\t\t\t\t     query_flags);\n"
                  "\t\tif (!err)\n"
                  "\t\t\tsusfs_sus_kstat_spoof_generic_fillattr(inode, stat);\n"
                  "\t\treturn err;\n"
                  "\t}\n"
                  "#else\n"
                  "\t\treturn inode->i_op->getattr(path, stat, request_mask,\n"
                  "\t\t\t\t\t    query_flags);\n"
                  "#endif\n"
              )
              text = text.replace(old, new, 1)
              print("vfs_getattr_nosec SUS_KSTAT custom-getattr path: PASS")
          else:
              print("vfs_getattr_nosec SUS_KSTAT custom-getattr path: already present")

          # ------------------------------------------------------------
          # 3) ReSukiSU vfs_fstat semantic adaptation for GEN2 5.4.
          #
          # In this kernel vfs_fstat() is a static inline wrapper in fs.h:
          #   return vfs_statx_fd(fd, stat, STATX_BASIC_STATS, 0);
          #
          # Therefore hook the exact wrapper-equivalent argument combination
          # inside vfs_statx_fd(), instead of inventing a standalone function.
          # ------------------------------------------------------------
          fstat_marker = "ksu_handle_vfs_fstat(fd, &stat->size);"

          if fstat_marker not in text:
              func_re = re.compile(
                  r"^int vfs_statx_fd\(unsigned int fd, struct kstat \*stat,\n"
                  r"\s*u32 request_mask, unsigned int query_flags\)\n"
                  r"\{\n",
                  re.M,
              )
              fm = func_re.search(text)
              if not fm:
                  raise RuntimeError("vfs_statx_fd() not found")

              export = text.find("EXPORT_SYMBOL(vfs_statx_fd);", fm.start())
              if export < 0:
                  raise RuntimeError("vfs_statx_fd export boundary not found")

              region = text[fm.start():export]

              old_call = (
                  "\t\terror = vfs_getattr(&f.file->f_path, stat,\n"
                  "\t\t\t\t    request_mask, query_flags);\n"
              )
              count = region.count(old_call)
              print(f"vfs_statx_fd getattr anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"vfs_statx_fd: expected one getattr call, found {count}"
                  )

              new_call = (
                  old_call
                  + "#ifdef CONFIG_KSU_SUSFS\n"
                  + "\t\tif (!error && request_mask == STATX_BASIC_STATS &&\n"
                  + "\t\t    query_flags == 0 &&\n"
                  + "\t\t    static_branch_unlikely(&ksu_is_init_rc_hook_enabled))\n"
                  + "\t\t\tksu_handle_vfs_fstat(fd, &stat->size);\n"
                  + "#endif\n"
              )

              region = region.replace(old_call, new_call, 1)
              text = text[:fm.start()] + region + text[export:]
              print("GEN2 5.4 vfs_fstat wrapper-equivalent hook: PASS")
          else:
              print("GEN2 5.4 vfs_fstat wrapper-equivalent hook: already present")

          p.write_text(text, encoding="utf-8")

          # ------------------------------------------------------------
          # Final static invariants.
          # ------------------------------------------------------------
