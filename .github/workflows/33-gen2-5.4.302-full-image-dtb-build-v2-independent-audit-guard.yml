          TC="$(cat workflow33-toolchain.path)"
          BASE="$RUNNER_TEMP/gen2-w33-baseline"
          OUT="$RUNNER_TEMP/gen2-w33-build-out"

          rm -rf "$BASE" "$OUT"
          mkdir -p "$BASE" "$OUT"

          export PATH="$TC/bin:$PATH"

          : > workflow33-baseline-defconfig.log
          : > workflow33-target-defconfig.log
          : > workflow33-target-olddefconfig.log

          CONFIG_STAGE='PRECHECK'

          preserve_partial_configs() {
            if [ -f "$BASE/.config" ]; then
              cp "$BASE/.config" workflow33-baseline.partial.config || true
            fi
            if [ -f "$OUT/.config" ]; then
              cp "$OUT/.config" workflow33-target.partial.config || true
            fi
          }

          fail_diag() {
            rc=$?
            preserve_partial_configs
            {
              echo "WORKFLOW33_CONFIG_RESULT=FAIL"
              echo "WORKFLOW33_CONFIG_FAILURE_STAGE=${CONFIG_STAGE:-UNKNOWN}"
              echo "WORKFLOW33_CONFIG_FAILURE_EXIT_CODE=$rc"
              echo
              echo "BASELINE_DEFCONFIG_LOG_TAIL_BEGIN"
              tail -n 120 workflow33-baseline-defconfig.log 2>/dev/null || true
              echo "BASELINE_DEFCONFIG_LOG_TAIL_END"
              echo
              echo "TARGET_DEFCONFIG_LOG_TAIL_BEGIN"
              tail -n 120 workflow33-target-defconfig.log 2>/dev/null || true
              echo "TARGET_DEFCONFIG_LOG_TAIL_END"
              echo
              echo "TARGET_OLDDEFCONFIG_LOG_TAIL_BEGIN"
              tail -n 120 workflow33-target-olddefconfig.log 2>/dev/null || true
              echo "TARGET_OLDDEFCONFIG_LOG_TAIL_END"
            } | tee workflow33-config-failure.txt

            {
              echo "WORKFLOW33_CONFIG_RESULT=FAIL"
              echo "WORKFLOW33_CONFIG_FAILURE_STAGE=${CONFIG_STAGE:-UNKNOWN}"
              echo "WORKFLOW33_CONFIG_FAILURE_EXIT_CODE=$rc"
            } >> early-audit-diagnostics.txt

            exit "$rc"
          }
          trap fail_diag ERR

          CONFIG_STAGE='VERIFY_TOOLCHAIN'
          command -v clang
          command -v ld.lld
          test "$(command -v clang)" = "$TC/bin/clang"
          test "$(command -v ld.lld)" = "$TC/bin/ld.lld"

          CONFIG_STAGE='BASELINE_VEUX_DEFCONFIG_R416183B'
          make -C "$ORIG" \
            O="$BASE" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            veux_defconfig \
            > workflow33-baseline-defconfig.log 2>&1

          test -s "$BASE/.config"
          cp "$BASE/.config" workflow33-baseline.config

          CONFIG_STAGE='TARGET_VEUX_DEFCONFIG_R416183B'
          make -C "$SIM" \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            veux_defconfig \
            > workflow33-target-defconfig.log 2>&1

          test -s "$OUT/.config"

          CONFIG_STAGE='FORCE_RESUKISU_SUSFS_INLINE_HOOK'
          "$SIM/scripts/config" \
            --file "$OUT/.config" \
            -e KSU \
            -e KSU_SUSFS \
            -d KSU_TRACEPOINT_HOOK \
            -d KSU_MANUAL_HOOK

          CONFIG_STAGE='TARGET_OLDDEFCONFIG_R416183B'
          make -C "$SIM" \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig \
            > workflow33-target-olddefconfig.log 2>&1

          test -s "$OUT/.config"
          cp "$OUT/.config" workflow33-final.config

          printf '%s\n' "$OUT" > workflow33-build-out.path

          CONFIG_STAGE='VERIFY_FINAL_CONFIG'
          python3 - <<'PY' | tee workflow33-config-verification.txt
          from pathlib import Path

          def parse(path):
              result = {}
              for line in Path(path).read_text(
                  encoding="utf-8", errors="replace"
              ).splitlines():
                  if line.startswith("CONFIG_") and "=" in line:
                      k, v = line.split("=", 1)
                      result[k] = v
                  elif (
                      line.startswith("# CONFIG_")
                      and line.endswith(" is not set")
                  ):
                      k = line[len("# "):].split(" is not set", 1)[0]
                      result[k] = "n"
              return result

          base = parse("workflow33-baseline.config")
          target = parse("workflow33-final.config")

          required = {
              "CONFIG_LOCALVERSION": '"-qgki"',
              "CONFIG_NO_HZ": "y",
              "CONFIG_HIGH_RES_TIMERS": "y",
              "CONFIG_PREEMPT": "y",
              "CONFIG_CPUSETS": "y",
              "CONFIG_SCHED_CASS": "y",
              "CONFIG_ARCH_QCOM": "y",
              "CONFIG_ARCH_HOLI": "y",
              "CONFIG_NR_CPUS": "8",
              "CONFIG_HZ_100": "y",
              "CONFIG_HZ": "100",
              "CONFIG_WT_QGKI": "y",
              "CONFIG_QGKI": "y",
              "CONFIG_CPU_IDLE": "y",
              "CONFIG_CPU_FREQ": "y",
              "CONFIG_CPU_FREQ_GOV_SCHEDUTIL": "y",
              "CONFIG_ARM_QCOM_CPUFREQ_HW": "y",
              "CONFIG_LTO": "y",
              "CONFIG_LTO_CLANG": "y",
              "CONFIG_SRCU": "y",
              "CONFIG_MODULES": "n",
              "CONFIG_KSU": "y",
              "CONFIG_KSU_SUSFS": "y",
              "CONFIG_KSU_TRACEPOINT_HOOK": "n",
              "CONFIG_KSU_MANUAL_HOOK": "n",
              "CONFIG_KSU_SUSFS_SUS_PATH": "y",
              "CONFIG_KSU_SUSFS_SUS_MOUNT": "y",
              "CONFIG_KSU_SUSFS_SUS_KSTAT": "y",
              "CONFIG_KSU_SUSFS_SPOOF_UNAME": "y",
              "CONFIG_KSU_SUSFS_ENABLE_LOG": "y",
              "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS": "y",
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG": "y",
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT": "y",
              "CONFIG_KSU_SUSFS_SUS_MAP": "y",
              "CONFIG_CFI_CLANG": "n",
          }

          failures = []
          for key, expected in required.items():
              actual = target.get(key, "n")
              ok = actual == expected
              print(
                  f"TARGET_{key}={actual} "
                  f"EXPECTED={expected} "
                  f"STATUS={'PASS' if ok else 'FAIL'}"
              )
              if not ok:
                  failures.append(
                      f"{key}:{actual}!={expected}"
                  )

          deltas = []
          for key in sorted(set(base) | set(target)):
              old = base.get(key, "n")
              new = target.get(key, "n")
              if old != new:
                  deltas.append((key, old, new))

          non_ksu = [
              d for d in deltas
              if not d[0].startswith("CONFIG_KSU")
          ]

          print(
              f"TOTAL_BASELINE_TO_TARGET_CONFIG_DELTAS={len(deltas)}"
          )
          for key, old, new in deltas:
              print(f"CONFIG_DELTA {key}: {old} -> {new}")

          print(f"NON_KSU_CONFIG_DELTA_COUNT={len(non_ksu)}")
          for key, old, new in non_ksu:
              print(
                  f"UNEXPECTED_NON_KSU_DELTA {key}: "
                  f"{old} -> {new}"
              )

          if non_ksu:
              failures.append("non_ksu_config_delta")

          if failures:
              print(
                  "WORKFLOW33_CONFIG_FAILURES="
                  + ",".join(failures)
              )
              raise SystemExit(1)

          print("WORKFLOW33_R416183B_CONFIG=PASS")
          print("BASELINE_TO_TARGET_DELTA_SCOPE=KSU_ONLY")
          PY

          CONFIG_STAGE='KERNELRELEASE'
          make -s -C "$SIM" \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            kernelrelease \
            > workflow33-kernelrelease.txt

          test -s workflow33-kernelrelease.txt

          {
            echo "WORKFLOW33_CONFIG_RESULT=PASS"
            echo "WORKFLOW33_CONFIG_TOOLCHAIN=r416183b"
            echo "WORKFLOW33_BUILD_OUT=$OUT"
            echo "WORKFLOW33_KERNELRELEASE=$(cat workflow33-kernelrelease.txt)"
          } | tee workflow33-config-status.txt

          {
            echo "WORKFLOW33_CONFIG_RESULT=PASS"
            echo "WORKFLOW33_CONFIG_TOOLCHAIN=r416183b"
          } >> early-audit-diagnostics.txt

          trap - ERR

