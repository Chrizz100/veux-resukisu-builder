            "$SIM/fs/susfs.c" \
            "$SIM/include/linux/susfs.h" \
            "$SIM/include/linux/susfs_def.h"

          echo "READDIR_SUS_PATH_PROVIDER_CONTRACTS=PASS" \
            | tee readdir-sus-path-provider-status.txt

