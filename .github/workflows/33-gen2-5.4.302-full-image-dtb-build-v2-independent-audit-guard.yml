          fi

          strings GEN2_33_Image \
            | grep -m1 '^Linux version 5\.4\.302' \
            > workflow33-image-linux-version.txt || true

          {
            echo "WORKFLOW33_IMAGE_BUILD_RESULT=PASS"
            echo "IMAGE_PATH=GEN2_33_Image"
            echo "IMAGE_SIZE=$(stat -c '%s' GEN2_33_Image)"
            echo "IMAGE_SHA256=$(sha256sum GEN2_33_Image | awk '{print $1}')"
            echo "VMLINUX_SIZE=$(stat -c '%s' GEN2_33_vmlinux)"
            echo "VMLINUX_SHA256=$(sha256sum GEN2_33_vmlinux | awk '{print $1}')"
            echo "SYSTEM_MAP_SIZE=$(stat -c '%s' GEN2_33_System.map)"
            echo "SYSTEM_MAP_SHA256=$(sha256sum GEN2_33_System.map | awk '{print $1}')"
            echo "KERNELRELEASE=$(cat workflow33-kernelrelease.txt)"
            echo "BUILD_TOOLCHAIN=Android_clang_r416183b"
            echo "BUILD_CLANG_VERSION=12.0.5"
            echo "BUILD_LLD_VERSION=12.0.5"
            echo "BUILD_TARGET=Image"
            echo "DTB_BUILD_PERFORMED=SEPARATE_WORKFLOW33_STEP"
            echo "DTBO_BUILD_PERFORMED=NO"
