  independent_audit:
    name: GEN2 33 v2 independent audit guard
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Fetch build job metadata and logs from GitHub Actions service
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NEEDS_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          REPORT='GEN2_33_V2_INDEPENDENT_AUDIT_GUARD.txt'
          JOBS_JSON='workflow33-v2-run-jobs.json'
          BUILD_LOG='workflow33-v2-build-job-service.log'
          MATCHES='workflow33-v2-service-log-key-lines.txt'

          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          VERSION="X-GitHub-Api-Version: 2022-11-28"

          curl -fsSL \
            -H "$AUTH" \
            -H "$ACCEPT" \
            -H "$VERSION" \
            "$API/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            -o "$JOBS_JSON"

          BUILD_JOB_ID="$(
            jq -r '
              .jobs[]
              | select(.name == "GEN2 33 v2 build")
              | .id
            ' "$JOBS_JSON" | head -n 1
          )"

          BUILD_JOB_CONCLUSION="$(
            jq -r '
              .jobs[]
              | select(.name == "GEN2 33 v2 build")
              | .conclusion
            ' "$JOBS_JSON" | head -n 1
          )"

          BUILD_JOB_STARTED="$(
            jq -r '
              .jobs[]
              | select(.name == "GEN2 33 v2 build")
              | .started_at
            ' "$JOBS_JSON" | head -n 1
          )"

          BUILD_JOB_COMPLETED="$(
            jq -r '
              .jobs[]
              | select(.name == "GEN2 33 v2 build")
              | .completed_at
            ' "$JOBS_JSON" | head -n 1
          )"

          test -n "$BUILD_JOB_ID"
          test "$BUILD_JOB_ID" != "null"

          set +e
          curl -fLsS \
            -H "$AUTH" \
            -H "$ACCEPT" \
            -H "$VERSION" \
            "$API/actions/jobs/$BUILD_JOB_ID/logs" \
            -o "$BUILD_LOG"
          LOG_FETCH_RC=$?
          set -e

          if [ "$LOG_FETCH_RC" -eq 0 ] && [ -s "$BUILD_LOG" ]; then
            grep -Ein \
              'exit code 143|SIGTERM|signal|Terminated|error:|fatal:|undefined reference|ld\.lld: error|make(\[[0-9]+\])?: \*\*\*|No space left|out of memory|oom|Killed' \
              "$BUILD_LOG" \
              | tail -n 400 \
              > "$MATCHES" || true
          else
            {
              echo "BUILD_JOB_LOG_FETCH_FAILED_OR_EMPTY=YES"
              echo "LOG_FETCH_RC=$LOG_FETCH_RC"
            } > "$MATCHES"
          fi

          {
            echo "AUDIT=GEN2_33_V2_INDEPENDENT_AUDIT_GUARD"
            echo "AUDIT_SOURCE=GITHUB_ACTIONS_SERVICE_NOT_BUILD_RUNNER_WORKSPACE"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "REPOSITORY=$GITHUB_REPOSITORY"
            echo "COMMIT=$GITHUB_SHA"
            echo "BUILD_NEEDS_RESULT=$BUILD_NEEDS_RESULT"
            echo "BUILD_JOB_ID=$BUILD_JOB_ID"
            echo "BUILD_JOB_CONCLUSION=$BUILD_JOB_CONCLUSION"
            echo "BUILD_JOB_STARTED_AT=$BUILD_JOB_STARTED"
            echo "BUILD_JOB_COMPLETED_AT=$BUILD_JOB_COMPLETED"
            echo "BUILD_JOB_LOG_FETCH_RC=$LOG_FETCH_RC"
            echo "BUILD_JOB_LOG_PRESENT=$(
              test -s "$BUILD_LOG" && echo YES || echo NO
            )"
            echo
            echo "=== KEY SERVICE-LOG LINES ==="
            cat "$MATCHES" 2>/dev/null || true
            echo
            echo "=== SERVICE-LOG TAIL ==="
            tail -n 500 "$BUILD_LOG" 2>/dev/null || true
            echo
            echo "INDEPENDENT_AUDIT_GUARD_COMPLETED=YES"
            echo "PURPOSE=RETAIN_DIAGNOSTICS_EVEN_IF_PRIMARY_BUILD_RUNNER_TERMINATES"
          } > "$REPORT"

          test -s "$REPORT"

      - name: Upload independent audit guard artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GEN2_33_V2_INDEPENDENT_AUDIT_GUARD-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          path: |
            GEN2_33_V2_INDEPENDENT_AUDIT_GUARD.txt
            workflow33-v2-run-jobs.json
            workflow33-v2-build-job-service.log
            workflow33-v2-service-log-key-lines.txt
