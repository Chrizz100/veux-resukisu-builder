      - name: Resolve final fs namei SUS_PATH and OPEN_REDIRECT semantics
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY' 2>&1 | tee namei-final-edit-log.txt
          import re
          from pathlib import Path

          sim = Path(Path("kernel-simulation.path").read_text().strip())
          p = sim / "fs/namei.c"
          text = p.read_text(encoding="utf-8")

          def extract_function(source, start_regex):
              m = re.search(start_regex, source, re.M)
              if not m:
                  raise RuntimeError(f"function start not found: {start_regex}")

              brace_start = source.find("{", m.start())
              if brace_start < 0:
                  raise RuntimeError("function opening brace not found")

              depth = 0
              end = None
              for i in range(brace_start, len(source)):
                  ch = source[i]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise RuntimeError("function closing brace not found")

              return m.start(), end, source[m.start():end]

          # ------------------------------------------------------------
          # Provider / macro contract from the staged SUSFS v2.2 headers.
          # ------------------------------------------------------------
          header_candidates = [
              sim / "include/linux/susfs_def.h",
              sim / "include/linux/susfs.h",
          ]
          header_text = "\n".join(
              path.read_text(encoding="utf-8", errors="replace")
              for path in header_candidates if path.exists()
          )

          required_header_markers = [
              "ND_STATE_LOOKUP_LAST",
              "ND_STATE_OPEN_LAST",
              "ND_FLAGS_LOOKUP_LAST",
              "SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK",
          ]

          for marker in required_header_markers:
              if marker not in header_text:
                  raise RuntimeError(
                      f"required staged SUSFS namei macro missing: {marker}"
                  )

          required_source_markers = [
              "extern bool susfs_is_inode_sus_path(struct inode *inode);",
              "extern const struct qstr susfs_fake_qstr_name;",
              "extern struct filename *susfs_open_redirect_spoof_do_sys_openat(struct inode *inode);",
              "#include <linux/susfs_def.h>",
          ]

          for marker in required_source_markers:
              if marker not in text:
                  raise RuntimeError(
                      f"Workflow-17 namei provider wiring missing: {marker}"
                  )

          # ------------------------------------------------------------
          # 1) nameidata SUS_PATH state field.
          # set_nameidata() state reset was already automatically applied
          # in Workflow 17, but the field itself was one retained reject.
          # ------------------------------------------------------------
          struct_match = re.search(
              r"struct nameidata \{(?P<body>.*?)\n\} __randomize_layout;",
              text,
              re.S,
          )
          if not struct_match:
              raise RuntimeError("struct nameidata not found")

          body = struct_match.group("body")

          if "\tunsigned int\tstate;" not in body:
              anchor = "\tunsigned int\tflags;\n"
              count = body.count(anchor)
              print(f"nameidata flags anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"nameidata: expected one flags field, found {count}"
                  )

              addition = (
                  anchor
                  + "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  + "\tunsigned int\tstate;\n"
                  + "#endif\n"
              )
              body = body.replace(anchor, addition, 1)
              text = (
                  text[:struct_match.start("body")]
                  + body
                  + text[struct_match.end("body"):]
              )
              print("nameidata SUS_PATH state field: PASS")
          else:
              print("nameidata SUS_PATH state field: already present")

          # ------------------------------------------------------------
          # 1b) Repair an unsafe lifetime ordering in the automatically
          # staged W17 SUS_PATH __lookup_hash() block.
          #
          # W17 inherited the reference order:
          #   dput(dentry);
          #   ... dentry->d_inode->i_sb ...
          # which can dereference the dentry after dropping its lockref.
          # Snapshot the FUSE/create decision before dput(), then never
          # dereference the old dentry again.
          # ------------------------------------------------------------
          s, e, region = extract_function(
              text,
              r"^static struct dentry \*__lookup_hash\(const struct qstr \*name,",
          )

          unsafe_block = (
              "\tif (unlikely(dentry) && !IS_ERR(dentry) && dentry->d_inode && "
              "!found_sus_path && susfs_is_inode_sus_path(dentry->d_inode)) {\n"
              "\t\tif (d_in_lookup(dentry))\n"
              "\t\t\td_lookup_done(dentry);\n"
              "\t\tif (!(flags & LOOKUP_RCU))\n"
              "\t\t\tdput(dentry);\n"
              "\t\t// - Just in case if an user app has been granted full file access and\n"
              "\t\t//   it is trying to find the fuse sus path with the create flag, then\n"
              "\t\t//   at least we can prevent the fake qstr file from from being created,\n"
              "\t\t//   although it is futile to do this, it is better than doing nothing.\n"
              "\t\tif (dentry->d_inode->i_sb->s_magic == FUSE_SUPER_MAGIC &&\n"
              "\t\t\t(flags & (LOOKUP_CREATE | LOOKUP_EXCL)))\n"
              "\t\t\treturn ERR_PTR(-EACCES);\n"
              "\t\tdentry = d_alloc(base, &susfs_fake_qstr_name);\n"
              "\t\tfound_sus_path = true;\n"
              "\t\tgoto retry;\n"
              "\t}\n"
          )

          safe_block = (
              "\tif (unlikely(dentry) && !IS_ERR(dentry) && dentry->d_inode && "
              "!found_sus_path && susfs_is_inode_sus_path(dentry->d_inode)) {\n"
              "\t\tbool reject_fuse_create =\n"
              "\t\t\tdentry->d_inode->i_sb->s_magic == FUSE_SUPER_MAGIC &&\n"
              "\t\t\t(flags & (LOOKUP_CREATE | LOOKUP_EXCL));\n"
              "\n"
              "\t\tif (d_in_lookup(dentry))\n"
              "\t\t\td_lookup_done(dentry);\n"
              "\t\tif (!(flags & LOOKUP_RCU))\n"
              "\t\t\tdput(dentry);\n"
              "\n"
              "\t\t/* Do not touch the old dentry after dropping its lockref. */\n"
              "\t\tif (reject_fuse_create)\n"
              "\t\t\treturn ERR_PTR(-EACCES);\n"
              "\n"
              "\t\tdentry = d_alloc(base, &susfs_fake_qstr_name);\n"
              "\t\tfound_sus_path = true;\n"
              "\t\tgoto retry;\n"
              "\t}\n"
          )

          if unsafe_block in region:
              region = region.replace(unsafe_block, safe_block, 1)
              text = text[:s] + region + text[e:]
              print("__lookup_hash post-dput UAF ordering repair: PASS")
          elif "bool reject_fuse_create =" in region:
              print("__lookup_hash post-dput UAF ordering repair: already present")
          else:
              raise RuntimeError(
                  "__lookup_hash staged SUS_PATH block did not match expected safe/unsafe forms"
              )

          # ------------------------------------------------------------
          # 2) lookup_fast() GEN2 5.4 adaptation.
          #
          # Unlike the 5.10 reference, GEN2 lookup_fast() returns int and
          # fills path/inode output parameters. For hidden final components,
          # convert the cache hit into the function's native "fast miss" (0),
          # allowing the existing slow SUSFS fake-qstr path to take over.
          # ------------------------------------------------------------
          s, e, region = extract_function(
              text,
              r"^static int lookup_fast\(struct nameidata \*nd,",
          )

          state_local = (
              "bool is_nd_state_lookup_last_and_open_last"
          )

          if state_local not in region:
              anchor = "\tint err;\n"
              count = region.count(anchor)
              print(f"lookup_fast local anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"lookup_fast: expected one int err anchor, found {count}"
                  )

              addition = (
                  anchor
                  + "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  + "\tbool is_nd_state_lookup_last_and_open_last =\n"
                  + "\t\t(nd->state & (ND_STATE_LOOKUP_LAST | ND_STATE_OPEN_LAST));\n"
                  + "#endif\n"
              )
              region = region.replace(anchor, addition, 1)
              print("lookup_fast state local: PASS")

          rcu_lookup = (
              "\t\tdentry = __d_lookup_rcu(parent, &nd->last, &seq);\n"
          )
          rcu_marker = (
              "is_nd_state_lookup_last_and_open_last && dentry &&"
          )

          # Only inspect the RCU prefix before the non-RCU branch.
          else_pos = region.find("\n\t} else {\n")
          if else_pos < 0:
              raise RuntimeError("lookup_fast: RCU/non-RCU branch boundary missing")

          rcu_region = region[:else_pos]
          nonrcu_region = region[else_pos:]

          if rcu_marker not in rcu_region:
              count = rcu_region.count(rcu_lookup)
              print(f"lookup_fast RCU lookup anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"lookup_fast RCU: expected one __d_lookup_rcu, found {count}"
                  )

              rcu_filter = (
                  rcu_lookup
                  + "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  + "\t\tif (is_nd_state_lookup_last_and_open_last &&\n"
                  + "\t\t    dentry && !IS_ERR(dentry) && dentry->d_inode &&\n"
                  + "\t\t    susfs_is_inode_sus_path(dentry->d_inode)) {\n"
                  + "\t\t\tif (d_in_lookup(dentry))\n"
                  + "\t\t\t\td_lookup_done(dentry);\n"
                  + "\t\t\t/* __d_lookup_rcu() did not take a lockref. */\n"
                  + "\t\t\tdentry = NULL;\n"
                  + "\t\t}\n"
                  + "#endif\n"
              )
              rcu_region = rcu_region.replace(rcu_lookup, rcu_filter, 1)
              print("lookup_fast RCU SUS_PATH fast-miss adaptation: PASS")
          else:
              print("lookup_fast RCU SUS_PATH adaptation: already present")

          non_lookup = "\t\tdentry = __d_lookup(parent, &nd->last);\n"
          if rcu_marker not in nonrcu_region:
              count = nonrcu_region.count(non_lookup)
              print(f"lookup_fast non-RCU lookup anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"lookup_fast non-RCU: expected one __d_lookup, found {count}"
                  )

              non_filter = (
                  non_lookup
                  + "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  + "\t\tif (is_nd_state_lookup_last_and_open_last &&\n"
                  + "\t\t    dentry && !IS_ERR(dentry) && dentry->d_inode &&\n"
                  + "\t\t    susfs_is_inode_sus_path(dentry->d_inode)) {\n"
                  + "\t\t\tif (d_in_lookup(dentry))\n"
                  + "\t\t\t\td_lookup_done(dentry);\n"
                  + "\t\t\tdput(dentry);\n"
                  + "\t\t\tdentry = NULL;\n"
                  + "\t\t}\n"
                  + "#endif\n"
              )
              nonrcu_region = nonrcu_region.replace(non_lookup, non_filter, 1)
              print("lookup_fast non-RCU SUS_PATH fast-miss adaptation: PASS")
          else:
              print("lookup_fast non-RCU SUS_PATH adaptation: already present")

          region = rcu_region + nonrcu_region
          text = text[:s] + region + text[e:]

          # ------------------------------------------------------------
          # 3) __lookup_slow() invalidation retry for an already selected
          # fake qstr. W17 applied the found_sus_path state and retry label,
          # but this one retry hunk was rejected.
          # ------------------------------------------------------------
          s, e, region = extract_function(
              text,
              r"^static struct dentry \*__lookup_slow\(const struct qstr \*name,",
          )

          retry_marker = (
              "if (found_sus_path) {\n"
              "\t\t\t\t\tdentry = d_alloc_parallel"
          )

          if retry_marker not in region:
              anchor = (
                  "\t\t\t\tif (!error) {\n"
                  "\t\t\t\t\td_invalidate(dentry);\n"
                  "\t\t\t\t\tdput(dentry);\n"
                  "\t\t\t\t\tgoto again;\n"
                  "\t\t\t\t}\n"
              )
              count = region.count(anchor)
              print(f"__lookup_slow invalidation anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"__lookup_slow: expected one invalidation block, found {count}"
                  )

              replacement = (
                  "\t\t\t\tif (!error) {\n"
                  "\t\t\t\t\td_invalidate(dentry);\n"
                  "\t\t\t\t\tdput(dentry);\n"
                  "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  "\t\t\t\t\tif (found_sus_path) {\n"
                  "\t\t\t\t\t\tdentry = d_alloc_parallel(\n"
                  "\t\t\t\t\t\t\tdir, &susfs_fake_qstr_name, &wq);\n"
                  "\t\t\t\t\t\tgoto retry;\n"
                  "\t\t\t\t\t}\n"
                  "#endif\n"
                  "\t\t\t\t\tgoto again;\n"
                  "\t\t\t\t}\n"
              )

              region = region.replace(anchor, replacement, 1)
              text = text[:s] + region + text[e:]
              print("__lookup_slow fake-qstr invalidation retry: PASS")
          else:
              print("__lookup_slow fake-qstr invalidation retry: already present")

          # ------------------------------------------------------------
          # 4) walk_component(): propagate LOOKUP_LAST state into the
          # staged ND_FLAGS_LOOKUP_LAST slow-lookup contract.
          # ------------------------------------------------------------
          s, e, region = extract_function(
              text,
              r"^static int walk_component\(struct nameidata \*nd, int flags\)\n",
          )

          marker = "nd->flags |= ND_FLAGS_LOOKUP_LAST;"

          if marker not in region:
              anchor = (
                  "\t\tpath.dentry = lookup_slow(&nd->last, nd->path.dentry,\n"
                  "\t\t\t\t\t  nd->flags);\n"
              )
              count = region.count(anchor)
              print(f"walk_component lookup_slow anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"walk_component: expected one slow lookup anchor, found {count}"
                  )

              addition = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  "\t\tif (nd->state & ND_STATE_LOOKUP_LAST)\n"
                  "\t\t\tnd->flags |= ND_FLAGS_LOOKUP_LAST;\n"
                  "#endif\n"
                  + anchor
              )

              region = region.replace(anchor, addition, 1)
              text = text[:s] + region + text[e:]
              print("walk_component ND_FLAGS_LOOKUP_LAST propagation: PASS")
          else:
              print("walk_component ND_FLAGS_LOOKUP_LAST propagation: already present")

          # ------------------------------------------------------------
          # 5) link_path_walk(): fail closed when trying to walk beneath
          # an already hidden SUS_PATH dentry.
          # ------------------------------------------------------------
          s, e, region = extract_function(
              text,
              r"^static int link_path_walk\(const char \*name, struct nameidata \*nd\)\n",
          )

          marker = (
              "susfs_is_inode_sus_path(nd->path.dentry->d_inode)"
          )

          if marker not in region:
              anchor = "\t\terr = may_lookup(nd);\n"
              count = region.count(anchor)
              print(f"link_path_walk may_lookup anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"link_path_walk: expected one may_lookup anchor, found {count}"
                  )

              addition = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  "\t\tif (nd->path.dentry->d_inode &&\n"
                  "\t\t    susfs_is_inode_sus_path(nd->path.dentry->d_inode))\n"
                  "\t\t\treturn -ENOENT;\n"
                  "#endif\n"
                  + anchor
              )

              region = region.replace(anchor, addition, 1)
              text = text[:s] + region + text[e:]
              print("link_path_walk hidden-subpath guard: PASS")
          else:
              print("link_path_walk hidden-subpath guard: already present")

          # ------------------------------------------------------------
          # 6) lookup_last(): mark the ordinary pathname final component.
          # GEN2 returns int here (not const char * like newer 5.10).
          # ------------------------------------------------------------
          s, e, region = extract_function(
              text,
              r"^static inline int lookup_last\(struct nameidata \*nd\)\n",
          )

          if "nd->state |= ND_STATE_LOOKUP_LAST;" not in region:
              anchor = "\tnd->flags &= ~LOOKUP_PARENT;\n"
              count = region.count(anchor)
              print(f"lookup_last LOOKUP_PARENT anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"lookup_last: expected one LOOKUP_PARENT clear, found {count}"
                  )

              addition = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  "\tnd->state |= ND_STATE_LOOKUP_LAST;\n"
                  "#endif\n\n"
                  + anchor
              )

              region = region.replace(anchor, addition, 1)
              text = text[:s] + region + text[e:]
              print("lookup_last SUS_PATH state: PASS")
          else:
              print("lookup_last SUS_PATH state: already present")

          # ------------------------------------------------------------
          # 7) lookup_open(): use the staged fake qstr when the final open
          # target is hidden. This maps the newer open_last_lookups contract
          # onto GEN2's older do_last()/lookup_open() architecture.
          # ------------------------------------------------------------
          s, e, region = extract_function(
              text,
              r"^static int lookup_open\(struct nameidata \*nd, struct path \*path,",
          )

          if "bool found_sus_path = false;" not in region:
              anchor = "\tDECLARE_WAIT_QUEUE_HEAD_ONSTACK(wq);\n"
              count = region.count(anchor)
              print(f"lookup_open local anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"lookup_open: expected one waitqueue anchor, found {count}"
                  )

              addition = (
                  anchor
                  + "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  + "\tbool found_sus_path = false;\n"
                  + "\tbool is_nd_state_open_last = "
                  + "(nd->state & ND_STATE_OPEN_LAST);\n"
                  + "#endif\n"
              )
              region = region.replace(anchor, addition, 1)
              print("lookup_open SUS_PATH locals: PASS")

          dlookup = "\tdentry = d_lookup(dir, &nd->last);\n"

          if "is_nd_state_open_last && dentry" not in region:
              count = region.count(dlookup)
              print(f"lookup_open d_lookup anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"lookup_open: expected one d_lookup anchor, found {count}"
                  )

              addition = (
                  dlookup
                  + "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  + "\tif (is_nd_state_open_last && dentry && !IS_ERR(dentry) &&\n"
                  + "\t    dentry->d_inode &&\n"
                  + "\t    susfs_is_inode_sus_path(dentry->d_inode)) {\n"
                  + "\t\tif (d_in_lookup(dentry))\n"
                  + "\t\t\td_lookup_done(dentry);\n"
                  + "\t\tdput(dentry);\n"
                  + "\t\tdentry = NULL;\n"
                  + "\t\tfound_sus_path = true;\n"
                  + "\t}\n"
                  + "#endif\n"
              )

              region = region.replace(dlookup, addition, 1)
              print("lookup_open cached SUS_PATH conversion: PASS")

          alloc = "\t\t\tdentry = d_alloc_parallel(dir, &nd->last, &wq);\n"

          if "d_alloc_parallel(dir, &susfs_fake_qstr_name, &wq)" not in region:
              count = region.count(alloc)
              print(f"lookup_open alloc_parallel anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"lookup_open: expected one d_alloc_parallel anchor, found {count}"
                  )

              replacement = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  "\t\t\tif (found_sus_path)\n"
                  "\t\t\t\tdentry = d_alloc_parallel(\n"
                  "\t\t\t\t\tdir, &susfs_fake_qstr_name, &wq);\n"
                  "\t\t\telse\n"
                  "#endif\n"
                  + alloc
              )

              region = region.replace(alloc, replacement, 1)
              print("lookup_open fake-qstr allocation: PASS")

          text = text[:s] + region + text[e:]

          # ------------------------------------------------------------
          # 8) do_last(): mark GEN2's final open component.
          # This replaces the non-existent newer open_last_lookups() hook
          # point with the actual 5.4 combined open path.
          # ------------------------------------------------------------
          s, e, region = extract_function(
              text,
              r"^static int do_last\(struct nameidata \*nd,",
          )

          if "nd->state |= ND_STATE_OPEN_LAST;" not in region:
              anchor = "\tnd->flags &= ~LOOKUP_PARENT;\n"
              count = region.count(anchor)
              print(f"do_last LOOKUP_PARENT anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"do_last: expected one LOOKUP_PARENT clear, found {count}"
                  )

              addition = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  "\tnd->state |= ND_STATE_OPEN_LAST;\n"
                  "#endif\n"
                  + anchor
              )

              region = region.replace(anchor, addition, 1)
              text = text[:s] + region + text[e:]
              print("do_last OPEN_LAST state adaptation: PASS")
          else:
              print("do_last OPEN_LAST state adaptation: already present")

          # ------------------------------------------------------------
          # 9) Normal-open OPEN_REDIRECT for the actual 5.4 architecture.
          #
          # The post-v2.2 reference redirects after final lookup but before
          # do_open(). GEN2 5.4 combines those phases in do_last(), so probe
          # the original pathname with a nested nameidata before the real
          # do_last() open. If its existing target is OPEN_REDIRECT-marked,
          # swap nd->name to the fake filename BEFORE any open/truncate.
          #
          # __O_TMPFILE and O_PATH keep the dedicated automatically staged
          # c5723cc handlers and are explicitly excluded here.
          # ------------------------------------------------------------
          s, e, region = extract_function(
              text,
              r"^static struct file \*path_openat\(struct nameidata \*nd,",
          )

          # W17/c5723cc already staged old_dfd + fake_filename here.
          # Assert exactly one copy instead of adding a second declaration.
          fake_decl_count = region.count("struct filename *fake_filename = NULL;")
          dfd_decl_count = region.count("int old_dfd = nd->dfd;")
          print(f"path_openat preexisting fake_filename declarations={fake_decl_count}")
          print(f"path_openat preexisting old_dfd declarations={dfd_decl_count}")

          if fake_decl_count != 1 or dfd_decl_count != 1:
              raise RuntimeError(
                  "path_openat: expected exactly one preexisting W17 OPEN_REDIRECT local pair"
              )

          if "struct filename *original_name = nd->name;" not in region:
              anchor = "\tstruct filename *fake_filename = NULL;\n"
              region = region.replace(
                  anchor,
                  anchor + "\tstruct filename *original_name = nd->name;\n",
                  1,
              )
              print("path_openat original-name lifetime snapshot: PASS")
          else:
              print("path_openat original-name lifetime snapshot: already present")

          normal_else = "\t} else {\n\t\tconst char *s = path_init(nd, flags);\n"

          if "struct nameidata redirect_nd;" not in region:
              count = region.count(normal_else)
              print(f"path_openat normal-open branch anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"path_openat: expected one normal-open else anchor, found {count}"
                  )

              probe = (
                  "\t} else {\n"
                  "#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n"
                  "\t\t/* GEN2 5.4 semantic equivalent of the post-v2.2\n"
                  "\t\t * path_openat redirect point: resolve only for the\n"
                  "\t\t * redirect decision, then perform the real open using\n"
                  "\t\t * the selected pathname. No file is opened/truncated by\n"
                  "\t\t * this probe.\n"
                  "\t\t */\n"
                  "\t\tif (old_dfd != -1) {\n"
                  "\t\t\tstruct nameidata redirect_nd;\n"
                  "\t\t\tstruct path redirect_path;\n"
                  "\t\t\tint redirect_error;\n"
                  "\n"
                  "\t\t\tset_nameidata(&redirect_nd, old_dfd, nd->name);\n"
                  "\t\t\tredirect_error = path_lookupat(\n"
                  "\t\t\t\t&redirect_nd, flags, &redirect_path);\n"
                  "\t\t\trestore_nameidata();\n"
                  "\n"
                  "\t\t\tif (!redirect_error) {\n"
                  "\t\t\t\tstruct inode *redirect_inode =\n"
                  "\t\t\t\t\tredirect_path.dentry->d_inode;\n"
                  "\t\t\t\tif (redirect_inode &&\n"
                  "\t\t\t\t    SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK(\n"
                  "\t\t\t\t\t    redirect_inode))\n"
                  "\t\t\t\t\tfake_filename =\n"
                  "\t\t\t\t\t\tsusfs_open_redirect_spoof_do_sys_openat(\n"
                  "\t\t\t\t\t\t\tredirect_inode);\n"
                  "\t\t\t\tpath_put(&redirect_path);\n"
                  "\t\t\t}\n"
                  "\n"
                  "\t\t\tif (fake_filename && !IS_ERR(fake_filename))\n"
                  "\t\t\t\tnd->name = fake_filename;\n"
                  "\t\t}\n"
                  "#endif\n"
                  "\t\tconst char *s = path_init(nd, flags);\n"
              )

              region = region.replace(normal_else, probe, 1)
              print("path_openat pre-open redirect probe: PASS")

          # Cleanup before successful early return.
          success = (
              "\tif (likely(!error)) {\n"
              "\t\tif (likely(file->f_mode & FMODE_OPENED))\n"
              "\t\t\treturn file;\n"
          )

          if "OPEN_REDIRECT success cleanup" not in region:
              count = region.count(success)
              print(f"path_openat success return anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"path_openat: expected one success-return block, found {count}"
                  )

              replacement = (
                  "\tif (likely(!error)) {\n"
                  "\t\tif (likely(file->f_mode & FMODE_OPENED)) {\n"
                  "#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n"
                  "\t\t\t/* OPEN_REDIRECT success cleanup */\n"
                  "\t\t\tif (fake_filename && !IS_ERR(fake_filename)) {\n"
                  "\t\t\t\tnd->name = original_name;\n"
                  "\t\t\t\tputname(fake_filename);\n"
                  "\t\t\t}\n"
                  "#endif\n"
                  "\t\t\treturn file;\n"
                  "\t\t}\n"
              )

              region = region.replace(success, replacement, 1)
              print("path_openat redirect success cleanup: PASS")

          # Cleanup before error return.
          error_return = "\treturn ERR_PTR(error);\n"

          if "OPEN_REDIRECT error cleanup" not in region:
              count = region.count(error_return)
              print(f"path_openat error return anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"path_openat: expected one ERR_PTR return, found {count}"
                  )

              replacement = (
                  "#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n"
                  "\t/* OPEN_REDIRECT error cleanup */\n"
                  "\tif (fake_filename && !IS_ERR(fake_filename)) {\n"
                  "\t\tnd->name = original_name;\n"
                  "\t\tputname(fake_filename);\n"
                  "\t}\n"
                  "#endif\n"
                  + error_return
              )

              region = region.replace(error_return, replacement, 1)
              print("path_openat redirect error cleanup: PASS")

          # v3 lifetime repair: if v2 cleanup text is already present
          # in an inherited staging state, normalize it before leaving
          # path_openat(). Both normal-success and error returns must restore
          # nd->name before the fake struct filename is freed.
          region = region.replace(
              "\t\t\tif (fake_filename && !IS_ERR(fake_filename))\n"
              "\t\t\t\tputname(fake_filename);",
              "\t\t\tif (fake_filename && !IS_ERR(fake_filename)) {\n"
              "\t\t\t\tnd->name = original_name;\n"
              "\t\t\t\tputname(fake_filename);\n"
              "\t\t\t}",
          )
          region = region.replace(
              "\tif (fake_filename && !IS_ERR(fake_filename))\n"
              "\t\tputname(fake_filename);",
              "\tif (fake_filename && !IS_ERR(fake_filename)) {\n"
              "\t\tnd->name = original_name;\n"
              "\t\tputname(fake_filename);\n"
              "\t}",
          )

          text = text[:s] + region + text[e:]
          # ------------------------------------------------------------
          # 10) Retry-safe fake filename lifetimes for the c5723cc
          # do_tmpfile()/do_o_path() handlers already staged by W17.
          # do_filp_open() can retry path_openat() after -ECHILD/-ESTALE;
          # therefore nd->name must never be left pointing at a freed
          # fake_filename.
          # ------------------------------------------------------------
          for label, regex in [
              ("do_tmpfile", r"^static int do_tmpfile\(struct nameidata \*nd,"),
              ("do_o_path", r"^static int do_o_path\(struct nameidata \*nd,"),
          ]:
              s, e, region = extract_function(text, regex)

              if "struct filename *original_name = nd->name;" not in region:
                  anchor = "\tstruct filename *fake_filename = NULL;\n"
                  count = region.count(anchor)
                  print(f"{label} fake_filename declaration count={count}")
                  if count != 1:
                      raise RuntimeError(
                          f"{label}: expected one staged fake_filename declaration, found {count}"
                      )
                  region = region.replace(
                      anchor,
                      anchor + "\tstruct filename *original_name = nd->name;\n",
                      1,
                  )
                  print(f"{label} original-name lifetime snapshot: PASS")

              # Every putname(fake_filename) in these functions must be
              # immediately preceded by restoring nd->name.
              region = region.replace(
                  "\t\t\t\tputname(fake_filename);\n\t\t\t\treturn error;",
                  "\t\t\t\tnd->name = original_name;\n"
                  "\t\t\t\tputname(fake_filename);\n"
                  "\t\t\t\treturn error;",
              )
              region = region.replace(
                  "\tif (fake_filename && !IS_ERR(fake_filename))\n"
                  "\t\tputname(fake_filename);",
                  "\tif (fake_filename && !IS_ERR(fake_filename)) {\n"
                  "\t\tnd->name = original_name;\n"
                  "\t\tputname(fake_filename);\n"
                  "\t}",
              )

              # If a previous transformation has already made the cleanup
              # braced, insert the restore when missing.
              region = region.replace(
                  "if (fake_filename && !IS_ERR(fake_filename)) {\n\t\tputname(fake_filename);",
                  "if (fake_filename && !IS_ERR(fake_filename)) {\n"
                  "\t\tnd->name = original_name;\n"
                  "\t\tputname(fake_filename);",
              )

              # v4 robust lifetime normalizer:
              # Walk every putname(fake_filename) in this exact function.
              # If the immediately preceding non-empty statement is not
              # nd->name = original_name;, insert a restore with the exact
              # indentation of the putname statement. This avoids relying on
              # one specific c5723cc formatting/indentation variant.
              lines = region.splitlines(keepends=True)
              normalized = []
              inserted_restores = 0
              put_count = 0

              for line in lines:
                  if "putname(fake_filename);" in line:
                      put_count += 1

                      j = len(normalized) - 1
                      while j >= 0 and not normalized[j].strip():
                          j -= 1

                      prev_stmt = normalized[j].strip() if j >= 0 else ""
                      if prev_stmt != "nd->name = original_name;":
                          indent = line[:len(line) - len(line.lstrip())]
                          normalized.append(
                              indent + "nd->name = original_name;\n"
                          )
                          inserted_restores += 1

                  normalized.append(line)

              region = "".join(normalized)

              print(f"{label} fake_filename putname count={put_count}")
              print(
                  f"{label} v4 inserted missing name restores="
                  f"{inserted_restores}"
              )

              if put_count < 1:
                  raise RuntimeError(
                      f"{label}: expected at least one fake_filename cleanup"
                  )

              # Immediate adjacency proof after normalization.
              check_lines = region.splitlines()
              for idx, line in enumerate(check_lines):
                  if "putname(fake_filename);" not in line:
                      continue

                  j = idx - 1
                  while j >= 0 and not check_lines[j].strip():
                      j -= 1

                  if j < 0 or check_lines[j].strip() != "nd->name = original_name;":
                      raise RuntimeError(
                          f"{label}: v4 cleanup normalization failed"
                      )

              print(f"{label} V4_ALL_PUTNAME_ADJACENT_RESTORE=PASS")

              text = text[:s] + region + text[e:]

          p.write_text(text, encoding="utf-8")

          # ------------------------------------------------------------
          # Final semantic invariants.
          # ------------------------------------------------------------
          final = p.read_text(encoding="utf-8", errors="replace")

          # State / staged contracts.
          checks = {
              "NAMEIDATA_STATE_FIELD_PRESENT":
                  "\tunsigned int\tstate;" in final,
              "SET_NAMEIDATA_STATE_RESET_PRESENT":
                  "p->state = 0;" in final,
              "LOOKUP_FAST_STATE_PRESENT":
                  "is_nd_state_lookup_last_and_open_last" in final,
              "LOOKUP_FAST_RCU_HIDE_PRESENT":
                  "__d_lookup_rcu(parent, &nd->last, &seq)" in final
                  and "susfs_is_inode_sus_path(dentry->d_inode)" in final,
              "LOOKUP_SLOW_LAST_FLAG_PRESENT":
                  "nd->flags |= ND_FLAGS_LOOKUP_LAST;" in final,
              "LOOKUP_LAST_STATE_PRESENT":
                  "nd->state |= ND_STATE_LOOKUP_LAST;" in final,
              "DO_LAST_OPEN_STATE_PRESENT":
                  "nd->state |= ND_STATE_OPEN_LAST;" in final,
              "LOOKUP_OPEN_FAKE_QSTR_PRESENT":
                  "d_alloc_parallel(" in final
                  and "&susfs_fake_qstr_name" in final,
              "LINK_PATH_WALK_HIDE_PRESENT":
                  "susfs_is_inode_sus_path(nd->path.dentry->d_inode)" in final,
              "OPEN_REDIRECT_PROBE_PRESENT":
                  "struct nameidata redirect_nd;" in final,
              "OPEN_REDIRECT_3ARG_SET_NAMEIDATA_PRESENT":
                  "set_nameidata(&redirect_nd, old_dfd, nd->name);" in final,
              "OPEN_REDIRECT_PREOPEN_PROVIDER_PRESENT":
                  "susfs_open_redirect_spoof_do_sys_openat(" in final,
              "OPEN_REDIRECT_MARKER_PRESENT":
                  "SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK(" in final,
              "LOOKUP_HASH_PRE_DPUT_FUSE_SNAPSHOT_PRESENT":
                  "bool reject_fuse_create =" in final,
          }

          for key, value in checks.items():
              print(f"{key}={'YES' if value else 'NO'}")
              if not value:
                  raise RuntimeError(f"{key}=NO")

          # Compile-time declaration sanity for path_openat.
          _, _, path_openat_region = extract_function(
              final,
              r"^static struct file \*path_openat\(struct nameidata \*nd,",
          )
          fake_decl_count = path_openat_region.count(
              "struct filename *fake_filename = NULL;"
          )
          dfd_decl_count = path_openat_region.count("int old_dfd = nd->dfd;")
          original_decl_count = path_openat_region.count(
              "struct filename *original_name = nd->name;"
          )

          print(f"PATH_OPENAT_FAKE_FILENAME_DECL_COUNT={fake_decl_count}")
          print(f"PATH_OPENAT_OLD_DFD_DECL_COUNT={dfd_decl_count}")
          print(f"PATH_OPENAT_ORIGINAL_NAME_DECL_COUNT={original_decl_count}")

          if (fake_decl_count, dfd_decl_count, original_decl_count) != (1, 1, 1):
              raise RuntimeError("path_openat OPEN_REDIRECT local declarations are not unique")

          # Verify the repaired __lookup_hash block never dereferences the
          # old dentry after dput() and before assigning a new dentry.
          _, _, hash_region = extract_function(
              final,
              r"^static struct dentry \*__lookup_hash\(const struct qstr \*name,",
          )
          sus_start = hash_region.index("bool reject_fuse_create =")
          dput_pos = hash_region.index("dput(dentry);", sus_start)
          new_assign_pos = hash_region.index(
              "dentry = d_alloc(base, &susfs_fake_qstr_name);", dput_pos
          )
          between = hash_region[dput_pos:new_assign_pos]
          if "dentry->" in between:
              raise RuntimeError("POST_DPUT_DENTRY_DEREFERENCE_PRESENT=YES")
          print("POST_DPUT_DENTRY_DEREFERENCE_PRESENT=NO")

          # Verify all three redirect paths restore nd->name before freeing
          # fake_filename, so outer do_filp_open retries cannot see a dangling
          # name pointer.
          for label, regex in [
              ("NORMAL", r"^static struct file \*path_openat\(struct nameidata \*nd,"),
              ("TMPFILE", r"^static int do_tmpfile\(struct nameidata \*nd,"),
              ("O_PATH", r"^static int do_o_path\(struct nameidata \*nd,"),
          ]:
              _, _, lifetime_region = extract_function(final, regex)
              if "struct filename *original_name = nd->name;" not in lifetime_region:
                  raise RuntimeError(f"{label}_ORIGINAL_NAME_SNAPSHOT=NO")

              put_positions = [
                  m.start() for m in re.finditer(
                      re.escape("putname(fake_filename);"), lifetime_region
                  )
              ]
              if not put_positions:
                  raise RuntimeError(f"{label}_FAKE_FILENAME_CLEANUP=NO")

              lifetime_lines = lifetime_region.splitlines()
              seen_puts = 0

              for idx, line in enumerate(lifetime_lines):
                  if "putname(fake_filename);" not in line:
                      continue

                  seen_puts += 1
                  j = idx - 1
                  while j >= 0 and not lifetime_lines[j].strip():
                      j -= 1

                  if j < 0 or lifetime_lines[j].strip() != "nd->name = original_name;":
                      raise RuntimeError(
                          f"{label}_PUTNAME_WITHOUT_ADJACENT_NAME_RESTORE=YES"
                      )

              if seen_puts != len(put_positions):
                  raise RuntimeError(
                      f"{label}_PUTNAME_ACCOUNTING_MISMATCH=YES"
                  )

              print(f"{label}_ALL_PUTNAME_ADJACENT_RESTORE=PASS")
              print(f"{label}_REDIRECT_RETRY_LIFETIME=PASS")

          # Additional v3 path_openat-specific proof:
          # - fake_filename is selected before path_init()
          # - each fake cleanup restores nd->name first
          # - success and error cleanup both occur before their return sites.
          _, _, po_lifetime = extract_function(
              final,
              r"^static struct file \*path_openat\(struct nameidata \*nd,",
          )

          restore_positions = [
              m.start() for m in re.finditer(
                  re.escape("nd->name = original_name;"), po_lifetime
              )
          ]
          put_positions = [
              m.start() for m in re.finditer(
                  re.escape("putname(fake_filename);"), po_lifetime
              )
          ]

          if len(put_positions) != 2:
              raise RuntimeError(
                  f"PATH_OPENAT_EXPECTED_TWO_FAKE_CLEANUPS={len(put_positions)}"
              )
          if len(restore_positions) < 2:
              raise RuntimeError(
                  f"PATH_OPENAT_EXPECTED_TWO_NAME_RESTORES={len(restore_positions)}"
              )

          for pos in put_positions:
              preceding_restores = [r for r in restore_positions if r < pos]
              if not preceding_restores:
                  raise RuntimeError(
                      "PATH_OPENAT_PUTNAME_WITHOUT_PRIOR_NAME_RESTORE=YES"
                  )
              if pos - preceding_restores[-1] > 120:
                  raise RuntimeError(
                      "PATH_OPENAT_NAME_RESTORE_NOT_ADJACENT_TO_PUTNAME=YES"
                  )

          success_cleanup = po_lifetime.index("OPEN_REDIRECT success cleanup")
          success_return = po_lifetime.index("return file;", success_cleanup)
          error_cleanup = po_lifetime.index("OPEN_REDIRECT error cleanup")
          error_return = po_lifetime.index("return ERR_PTR(error);", error_cleanup)

          if not success_cleanup < success_return:
              raise RuntimeError("PATH_OPENAT_SUCCESS_CLEANUP_ORDERING=FAIL")
          if not error_cleanup < error_return:
              raise RuntimeError("PATH_OPENAT_ERROR_CLEANUP_ORDERING=FAIL")

          print("PATH_OPENAT_SUCCESS_NAME_RESTORE_BEFORE_PUTNAME=YES")
          print("PATH_OPENAT_ERROR_NAME_RESTORE_BEFORE_PUTNAME=YES")
          print("PATH_OPENAT_RETRY_SAFE_NAME_LIFETIME=PASS")

          # Verify the normal-open redirect ordering:
          # probe -> path_init -> do_last.
          _, _, po = extract_function(
              final,
              r"^static struct file \*path_openat\(struct nameidata \*nd,",
          )

          probe_pos = po.index("set_nameidata(&redirect_nd, old_dfd, nd->name);")
          select_pos = po.index("nd->name = fake_filename;")
          path_init_pos = po.index("const char *s = path_init(nd, flags);")
          do_last_pos = po.index("do_last(nd, file, op)")
          terminate_pos = po.index("terminate_walk(nd);")

          if not (
              probe_pos < select_pos < path_init_pos < do_last_pos < terminate_pos
          ):
              raise RuntimeError(
                  "GEN2 normal-open OPEN_REDIRECT ordering invalid"
              )

          # Dedicated O_PATH / TMPFILE post-fix handlers from W17 must remain.
          _, _, tmp_region = extract_function(
              final,
              r"^static int do_tmpfile\(struct nameidata \*nd,",
          )
          _, _, opath_region = extract_function(
              final,
              r"^static int do_o_path\(struct nameidata \*nd,",
          )

          for label, region in [
              ("TMPFILE", tmp_region),
              ("O_PATH", opath_region),
          ]:
              if (
                  "SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK" not in region
                  or "susfs_open_redirect_spoof_do_sys_openat" not in region
                  or "putname(fake_filename)" not in region
              ):
                  raise RuntimeError(
                      f"{label} post-v2.2 OPEN_REDIRECT handler missing"
                  )
              print(f"{label}_OPEN_REDIRECT_HANDLER=PRESERVED")

          # Existing readlink redirect behavior from W17 must remain.
          _, _, readlink_region = extract_function(
              final,
              r"^int vfs_readlink\(struct dentry \*dentry,",
          )
          if "SUSFS_IS_INODE_OPEN_REDIRECT(inode)" not in readlink_region:
              raise RuntimeError("vfs_readlink OPEN_REDIRECT behavior missing")
          print("VFS_READLINK_OPEN_REDIRECT=PRESERVED")

          # The real GEN2 architecture is do_last(), not newer
          # open_last_lookups(). Do not synthesize that newer function.
          if "static const char *open_last_lookups(" in final:
              raise RuntimeError(
                  "synthetic newer open_last_lookups() introduced into GEN2 5.4"
              )

          print("GEN2_OPEN_ARCHITECTURE=DO_LAST")
          print("SYNTHETIC_OPEN_LAST_LOOKUPS_ADDED=NO")
          print("OPEN_REDIRECT_BEFORE_REAL_OPEN_AND_TRUNCATE=YES")
          print("NAMEI_FINAL_SEMANTIC_COMPLETION=PASS")
          PY

          grep -q '^NAMEI_FINAL_SEMANTIC_COMPLETION=PASS$' \
            namei-final-edit-log.txt

          echo "NAMEI_FINAL_SEMANTIC_COMPLETION=PASS" \
            | tee namei-final-state.txt

      - name: Verify final namei provider contracts and exact API shape
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          {
            echo "=== SUS_PATH providers ==="
            grep -RIn -C 5 \
              'susfs_is_inode_sus_path' \
              "$SIM/fs/susfs.c" \
              "$SIM/include/linux/susfs.h" \
              "$SIM/include/linux/susfs_def.h" \
              | sed -n '1,220p'

            echo
            grep -RIn -C 5 \
              'susfs_fake_qstr_name' \
              "$SIM/fs/susfs.c" \
              "$SIM/include/linux/susfs.h" \
              "$SIM/include/linux/susfs_def.h" \
              | sed -n '1,220p'

            echo
            echo "=== OPEN_REDIRECT provider ==="
            grep -RIn -C 6 \
              'susfs_open_redirect_spoof_do_sys_openat' \
              "$SIM/fs/susfs.c" \
              "$SIM/include/linux/susfs.h" \
              "$SIM/include/linux/susfs_def.h" \
              | sed -n '1,240p'

            echo
            echo "=== GEN2 set_nameidata API ==="
            grep -n -A3 -B2 \
              'static void set_nameidata(struct nameidata \*p, int dfd, struct filename \*name)' \
              "$SIM/fs/namei.c"
          } | tee namei-final-provider-context.txt

          grep -Rq 'susfs_is_inode_sus_path' \
            "$SIM/fs/susfs.c" \
            "$SIM/include/linux/susfs.h" \
            "$SIM/include/linux/susfs_def.h"

          grep -Rq 'susfs_fake_qstr_name' \
            "$SIM/fs/susfs.c" \
            "$SIM/include/linux/susfs.h" \
            "$SIM/include/linux/susfs_def.h"

          grep -Rq 'susfs_open_redirect_spoof_do_sys_openat' \
            "$SIM/fs/susfs.c" \
            "$SIM/include/linux/susfs.h" \
            "$SIM/include/linux/susfs_def.h"

          grep -q \
            'static void set_nameidata(struct nameidata \*p, int dfd, struct filename \*name)' \
            "$SIM/fs/namei.c"

          echo "NAMEI_FINAL_PROVIDER_CONTRACTS=PASS" \
            | tee namei-final-provider-status.txt

      - name: Verify GEN2 namei original control flow remains reachable
        shell: bash
        run: |
