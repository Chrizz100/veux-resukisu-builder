          grep -q 'LLD 12\.0\.5' \
            workflow33-build-lld-version.txt

          BUILD_STAGE='SOURCE_AND_CONFIG_GATE'
          grep -q '^CONFIG_KSU=y$' "$OUT/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT/.config"
          grep -q '^# CONFIG_KSU_TRACEPOINT_HOOK is not set$' "$OUT/.config"
          grep -q '^# CONFIG_KSU_MANUAL_HOOK is not set$' "$OUT/.config"

          git -C "$SIM" diff --check \
            > workflow33-prebuild-diff-check.txt

          BUILD_STAGE='IMAGE'

          BUILD_JOBS=2
          echo "WORKFLOW33_BUILD_JOBS=$BUILD_JOBS" \
            | tee workflow33-build-runtime-status.txt

          on_term() {
            sig="$1"
            now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            {
              echo "WORKFLOW33_BUILD_SIGNAL_RECEIVED=$sig"
              echo "WORKFLOW33_BUILD_SIGNAL_TIME_UTC=$now"
              echo "WORKFLOW33_IMAGE_BUILD_STAGE=${BUILD_STAGE:-UNKNOWN}"
              echo "WORKFLOW33_BUILD_PID=${MAKE_PID:-UNKNOWN}"
              echo "WORKFLOW33_SIGNAL_DIAGNOSTIC=RUNNER_OR_PROCESS_TERMINATION_PATH"
            } | tee workflow33-build-signal.txt

            echo "===== SIGNAL-TIME BUILD LOG TAIL ====="
            tail -n 220 workflow33-build.log 2>/dev/null || true
            echo "===== SIGNAL-TIME MEMORY ====="
            free -h || true
            echo "===== SIGNAL-TIME DISK ====="
            df -h "$GITHUB_WORKSPACE" /tmp || true

            if [ -n "${MAKE_PID:-}" ]; then
              kill -TERM "$MAKE_PID" 2>/dev/null || true
            fi
          }

          trap 'on_term TERM' TERM
          trap 'on_term INT' INT

          make -C "$SIM" \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" \
            -j"$BUILD_JOBS" \
            Image \
            > workflow33-build.log 2>&1 &
          MAKE_PID=$!

          {
            echo "WORKFLOW33_IMAGE_BUILD_PID=$MAKE_PID"
            echo "WORKFLOW33_IMAGE_BUILD_START_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } | tee -a workflow33-build-runtime-status.txt

          HEARTBEAT=0
          while kill -0 "$MAKE_PID" 2>/dev/null; do
            sleep 60
            HEARTBEAT=$((HEARTBEAT + 1))
            {
              echo
              echo "===== W33 V2 BUILD HEARTBEAT $HEARTBEAT ====="
              echo "TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "MAKE_PID=$MAKE_PID"
              echo "BUILD_LOG_BYTES=$(stat -c '%s' workflow33-build.log 2>/dev/null || echo 0)"
              echo "--- build tail ---"
              tail -n 18 workflow33-build.log 2>/dev/null || true
              echo "--- memory ---"
              free -h || true
              echo "--- disk ---"
              df -h "$GITHUB_WORKSPACE" /tmp || true
            } | tee -a workflow33-build-heartbeat.txt
          done

          set +e
          wait "$MAKE_PID"
          MAKE_RC=$?
          set -e

          {
            echo "WORKFLOW33_IMAGE_BUILD_WAIT_EXIT_CODE=$MAKE_RC"
            echo "WORKFLOW33_IMAGE_BUILD_END_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "WORKFLOW33_BUILD_HEARTBEATS=$HEARTBEAT"
          } | tee -a workflow33-build-runtime-status.txt

          if [ "$MAKE_RC" -ne 0 ]; then
            false
          fi

          trap - TERM INT

          IMAGE="$OUT/arch/arm64/boot/Image"
          test -s "$IMAGE"

          BUILD_STAGE='POSTBUILD_VERIFICATION'

          cp "$IMAGE" GEN2_33_Image
          cp "$OUT/.config" GEN2_33_final.config

          test -s "$OUT/vmlinux"
          test -s "$OUT/System.map"

          cp "$OUT/vmlinux" GEN2_33_vmlinux
          cp "$OUT/System.map" GEN2_33_System.map

          sha256sum GEN2_33_Image \
            | tee GEN2_33_Image.sha256
          sha256sum GEN2_33_vmlinux \
            | tee GEN2_33_vmlinux.sha256
          sha256sum GEN2_33_System.map \
            | tee GEN2_33_System.map.sha256

          stat -c '%s' GEN2_33_Image \
            | tee workflow33-image-size.txt

          file GEN2_33_Image \
            | tee workflow33-image-file.txt

          if [ -f "$OUT/vmlinux" ]; then
            file "$OUT/vmlinux" \
              | tee workflow33-vmlinux-file.txt
          fi

          if [ -f "$OUT/include/generated/compile.h" ]; then
            cp "$OUT/include/generated/compile.h" \
              workflow33-generated-compile.h
          fi

          if [ -f "$OUT/include/generated/utsrelease.h" ]; then
            cp "$OUT/include/generated/utsrelease.h" \
