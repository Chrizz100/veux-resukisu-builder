      - name: Resolve kernel sys SPOOF_UNAME semantic reject
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY' 2>&1 | tee spoof-uname-edit-log.txt
          import re
          from pathlib import Path

          sim = Path(Path("kernel-simulation.path").read_text().strip())
          p = sim / "kernel/sys.c"
          text = p.read_text(encoding="utf-8")

          decl_marker = "extern struct static_key_false susfs_is_uname_spoof_buffer_set;"
          decl_block = (
              "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n"
              "extern struct static_key_false susfs_is_uname_spoof_buffer_set;\n"
              "extern void susfs_spoof_uname(struct new_utsname *tmp);\n"
              "#endif\n\n"
          )

          func_re = re.compile(
              r"^SYSCALL_DEFINE1\(newuname, struct new_utsname __user \*, name\)\n"
              r"\{\n",
              re.M,
          )
          fm = func_re.search(text)
          if not fm:
              raise RuntimeError("kernel/sys.c: newuname function not found")

          if decl_marker not in text:
              text = text[:fm.start()] + decl_block + text[fm.start():]
              print("SPOOF_UNAME declarations: PASS")
          else:
              print("SPOOF_UNAME declarations: already present")

          # Re-find after possible insertion.
          fm = func_re.search(text)
          start = fm.start()

          next_func = re.search(
              r"^#ifdef __ARCH_WANT_SYS_OLD_UNAME",
              text[start:],
              re.M,
          )
          if not next_func:
              raise RuntimeError("kernel/sys.c: newuname end boundary not found")

          end = start + next_func.start()
          region = text[start:end]

          vendor_marker = 'strcpy(tmp.release, "5.10.239");'
          if vendor_marker not in region:
              raise RuntimeError(
                  "kernel/sys.c: existing bpfloader/netd uname compatibility block missing"
              )

          spoof_call = "susfs_spoof_uname(&tmp);"

          if spoof_call not in region:
              # In GEN2 newuname, the closing brace of the vendor-specific
              # compatibility block is immediately followed by up_read().
              scoped_anchor = "\t}\n\tup_read(&uts_sem);\n"
              count = region.count(scoped_anchor)
              print(f"SPOOF_UNAME scoped insertion anchor count={count}")

              if count != 1:
                  raise RuntimeError(
                      f"kernel/sys.c newuname: expected one vendor->up_read anchor, found {count}"
                  )

              addition = (
                  "\t}\n"
                  "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n"
                  "\tif (static_branch_likely(&susfs_is_uname_spoof_buffer_set))\n"
                  "\t\tsusfs_spoof_uname(&tmp);\n"
                  "#endif\n"
                  "\tup_read(&uts_sem);\n"
              )

              region = region.replace(scoped_anchor, addition, 1)
              text = text[:start] + region + text[end:]
              print("SPOOF_UNAME callsite: PASS")
          else:
              print("SPOOF_UNAME callsite: already present")

          p.write_text(text, encoding="utf-8")

          # Validate ordering inside the final function.
          final = p.read_text(encoding="utf-8")
          fm = func_re.search(final)
          start = fm.start()
          next_func = re.search(
              r"^#ifdef __ARCH_WANT_SYS_OLD_UNAME",
              final[start:],
              re.M,
          )
          end = start + next_func.start()
          region = final[start:end]

          vendor_pos = region.find(vendor_marker)
          spoof_pos = region.find(spoof_call)
          unlock_pos = region.find("up_read(&uts_sem);")

          print(f"vendor_pos={vendor_pos}")
          print(f"susfs_spoof_pos={spoof_pos}")
          print(f"uts_unlock_pos={unlock_pos}")

          if not (0 <= vendor_pos < spoof_pos < unlock_pos):
              raise RuntimeError(
                  "SPOOF_UNAME ordering invalid: expected vendor compatibility -> SUSFS spoof -> uts unlock"
              )

          print("SPOOF_UNAME_ORDERING=PASS")
          print("KERNEL_SYS_SPOOF_UNAME_SEMANTIC_COMPLETION=PASS")
          PY

          grep -q '^KERNEL_SYS_SPOOF_UNAME_SEMANTIC_COMPLETION=PASS$' \
