      - name: Audit full tree SUSFS provider consumer contracts v4
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY' | tee workflow28-provider-consumer-integrity.txt
          from pathlib import Path
          import re

          sim = Path(Path("kernel-simulation.path").read_text().strip())

          def read(rel):
              p = sim / rel
              if not p.exists():
                  raise RuntimeError(f"MISSING_FILE={rel}")
              return p.read_text(encoding="utf-8", errors="replace")

          def extract_c_function(text, signature_fragment):
              start = text.find(signature_fragment)
              if start < 0:
                  raise RuntimeError(
                      f"FUNCTION_NOT_FOUND={signature_fragment}"
                  )

              brace = text.find("{", start)
              if brace < 0:
                  raise RuntimeError(
                      f"FUNCTION_BRACE_NOT_FOUND={signature_fragment}"
                  )

              depth = 0
              end = None
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise RuntimeError(
                      f"FUNCTION_END_NOT_FOUND={signature_fragment}"
                  )
              return text[start:end]

          failures = []

          # ----------------------------------------------------------
          # Ordinary provider/consumer symbols.
          # ----------------------------------------------------------
          required = {
              "susfs_is_inode_sus_path": [
                  "fs/susfs.c",
                  "fs/namei.c",
                  "fs/readdir.c",
              ],
              "susfs_get_data_path": [
                  "fs/susfs.c",
                  "fs/readdir.c",
              ],
              "susfs_sus_kstat_spoof_generic_fillattr": [
                  "fs/susfs.c",
                  "fs/stat.c",
              ],
              "susfs_sus_kstat_spoof_show_map_vma": [
                  "fs/susfs.c",
                  "fs/proc/task_mmu.c",
              ],
              "susfs_open_redirect_spoof_do_sys_openat": [
                  "fs/susfs.c",
                  "fs/namei.c",
              ],
              "susfs_open_redirect_spoof_show_map_vma_srcu": [
                  "fs/susfs.c",
                  "fs/proc/task_mmu.c",
              ],
              "susfs_is_avc_log_spoofing_enabled": [
                  "fs/susfs.c",
                  "security/selinux/avc.c",
              ],
              "susfs_spoof_uname": [
                  "fs/susfs.c",
                  "kernel/sys.c",
              ],
          }

          for symbol, rels in required.items():
              states = []
              for rel in rels:
                  data = read(rel)
                  present = symbol in data
                  states.append(
                      f"{rel}={'YES' if present else 'NO'}"
                  )
                  if not present:
                      failures.append(
                          f"{symbol}:{rel}:missing_symbol"
                      )

              print(
                  f"SYMBOL={symbol} " + " ".join(states)
              )

          # ----------------------------------------------------------
          # OPEN_REDIRECT SRCU has TWO different contracts.
          #
          # namei.c calls susfs_open_redirect_spoof_do_sys_openat().
          # That provider acquires/releases susfs_srcu_open_redirect
          # internally, so namei.c MUST NOT be required to reference the
          # global SRCU object directly.
          #
          # task_mmu.c calls the *_srcu() show-map helper. The provider
          # explicitly documents that callers hold/release the SRCU lock,
          # so task_mmu.c DOES require the direct SRCU object.
          # ----------------------------------------------------------
          susfs = read("fs/susfs.c")
          namei = read("fs/namei.c")
          task_mmu = read("fs/proc/task_mmu.c")

          do_open = extract_c_function(
              susfs,
              "struct filename *susfs_open_redirect_spoof_do_sys_openat("
          )

          do_open_lock = (
              "srcu_read_lock(&susfs_srcu_open_redirect)" in do_open
          )
          do_open_unlock = (
              "srcu_read_unlock(&susfs_srcu_open_redirect" in do_open
          )
          namei_uses_helper = (
              "susfs_open_redirect_spoof_do_sys_openat(" in namei
          )
          namei_direct_srcu = (
              "susfs_srcu_open_redirect" in namei
          )

          print(
              "OPEN_REDIRECT_NAMEI_HELPER_SELF_SRCU_LOCK="
              + ("YES" if do_open_lock else "NO")
          )
          print(
              "OPEN_REDIRECT_NAMEI_HELPER_SELF_SRCU_UNLOCK="
              + ("YES" if do_open_unlock else "NO")
          )
          print(
              "OPEN_REDIRECT_NAMEI_USES_SELF_LOCKING_HELPER="
              + ("YES" if namei_uses_helper else "NO")
          )
          print(
              "OPEN_REDIRECT_NAMEI_DIRECT_SRCU_REFERENCE="
              + ("YES" if namei_direct_srcu else "NO")
          )

          if not (
              do_open_lock
              and do_open_unlock
              and namei_uses_helper
          ):
              failures.append(
                  "open_redirect:namei:self_locking_helper_contract"
              )

          show_map_contract_comment = (
              'callers must hold and release the '
              '"susfs_srcu_open_redirect" lock themselves.'
              in susfs
          )
          task_direct_srcu = (
              "susfs_srcu_open_redirect" in task_mmu
          )
          task_lock = (
              "srcu_read_lock(&susfs_srcu_open_redirect)"
              in task_mmu
          )
          task_unlock = (
              "srcu_read_unlock(&susfs_srcu_open_redirect"
              in task_mmu
          )
          task_uses_srcu_helper = (
              "susfs_open_redirect_spoof_show_map_vma_srcu("
              in task_mmu
          )

          print(
              "OPEN_REDIRECT_SHOW_MAP_CALLER_LOCK_CONTRACT_COMMENT="
              + ("YES" if show_map_contract_comment else "NO")
          )
          print(
              "OPEN_REDIRECT_TASK_MMU_DIRECT_SRCU_REFERENCE="
              + ("YES" if task_direct_srcu else "NO")
          )
          print(
              "OPEN_REDIRECT_TASK_MMU_SRCU_LOCK="
              + ("YES" if task_lock else "NO")
          )
          print(
              "OPEN_REDIRECT_TASK_MMU_SRCU_UNLOCK="
              + ("YES" if task_unlock else "NO")
          )
          print(
              "OPEN_REDIRECT_TASK_MMU_USES_SRCU_HELPER="
              + ("YES" if task_uses_srcu_helper else "NO")
          )

          if not (
              show_map_contract_comment
              and task_direct_srcu
              and task_lock
              and task_unlock
              and task_uses_srcu_helper
          ):
              failures.append(
                  "open_redirect:task_mmu:caller_srcu_contract"
              )

          # Provider global itself and the post-v2.2 synchronization fix.
          provider_srcu = (
              "DEFINE_SRCU(susfs_srcu_open_redirect)" in susfs
          )
          provider_sync = (
              "synchronize_srcu(&susfs_srcu_open_redirect)" in susfs
          )

          print(
              "OPEN_REDIRECT_SRCU_PROVIDER_DEFINE="
              + ("YES" if provider_srcu else "NO")
          )
          print(
              "OPEN_REDIRECT_SYNCHRONIZE_SRCU="
              + ("YES" if provider_sync else "NO")
          )

          if not provider_srcu or not provider_sync:
              failures.append(
                  "open_redirect:srcu_provider_or_sync_missing"
              )

          # ----------------------------------------------------------
          # ReSukiSU-side real providers.
          # ----------------------------------------------------------
          ksu_root = sim / "KernelSU/kernel"
          ksu_text = "\n".join(
              p.read_text(encoding="utf-8", errors="replace")
              for p in ksu_root.rglob("*")
              if p.is_file() and p.suffix in {".c", ".h"}
          )

          for symbol in (
              "ksu_handle_vfs_fstat",
              "ksu_is_init_rc_hook_enabled",
              "susfs_ksu_sid",
              "susfs_priv_app_sid",
          ):
              ok = symbol in ksu_text
              print(
                  f"RESUKISU_PROVIDER_{symbol}="
                  + ("YES" if ok else "NO")
              )
              if not ok:
                  failures.append(
                      f"resukisu:{symbol}:missing"
                  )

          # Stale SID setter prototypes stay non-blocking. Count them only
          # as diagnostics; W16 already established zero functional calls.
          source_texts = []
          for p in sim.rglob("*"):
              if not p.is_file():
                  continue
              if ".git" in p.parts or "rejects" in p.parts:
                  continue
              if p.suffix not in {".c", ".h"}:
                  continue
              source_texts.append(
                  p.read_text(encoding="utf-8", errors="replace")
              )
          tree_text = "\n".join(source_texts)

          for stale in (
              "susfs_set_init_sid",
              "susfs_set_ksu_sid",
              "susfs_set_priv_app_sid",
          ):
              calls = len(
                  re.findall(
                      rf"\b{re.escape(stale)}\s*\(",
                      tree_text
                  )
              )
              print(
                  f"STALE_SID_SYMBOL_{stale}_PAREN_OCCURRENCES={calls}"
              )

          if failures:
              print(
                  "PROVIDER_CONSUMER_FAILURES="
                  + ",".join(failures)
              )
              raise SystemExit(1)

          print(
              "OPEN_REDIRECT_SRCU_CONTRACT_CLASSIFICATION=PASS"
          )
          print(
              "NAMEI_SRCU_CONTRACT=SELF_LOCKING_PROVIDER_HELPER"
          )
          print(
              "TASK_MMU_SRCU_CONTRACT=CALLER_HELD_LOCK"
          )
          print(
              "FULL_TREE_PROVIDER_CONSUMER_INTEGRITY=PASS"
          )
          PY

      - name: Apply Workflow 33 v3 compiler-visibility adaptations
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY' 2>&1 | tee workflow33-compile-compat-edit-log.txt
          from pathlib import Path
          import re

          sim = Path(Path("kernel-simulation.path").read_text().strip())

          # ==========================================================
          # A) SELinux: complete struct selinux_ss visibility.
          #
          # GEN2 security.h intentionally only forward-declares:
          #   struct selinux_ss;
          # while the concrete layout lives in ss/services.h.
          #
          # The SUSFS-adapted selinuxfs.c now dereferences
          # selinux_state.ss->status_lock, so it needs the complete
          # GEN2 type definition at compile time.
          # ==========================================================
          selinuxfs_path = sim / "security/selinux/selinuxfs.c"
          selinuxfs = selinuxfs_path.read_text(
              encoding="utf-8", errors="replace"
          )

          # First retain/repair the v2 field-layout adaptation.
          newer_lock = "&selinux_state.status_lock"
          gen2_lock = "&selinux_state.ss->status_lock"

          newer_count = selinuxfs.count(newer_lock)
          gen2_count = selinuxfs.count(gen2_lock)

          print(
              f"SELINUXFS_NEWER_STATUS_LOCK_REFERENCE_COUNT={newer_count}"
          )
          print(
              f"SELINUXFS_GEN2_STATUS_LOCK_REFERENCE_COUNT_BEFORE={gen2_count}"
          )

          if newer_count:
              selinuxfs = selinuxfs.replace(
                  newer_lock, gen2_lock
              )

          if selinuxfs.count(gen2_lock) < 2:
              raise RuntimeError(
                  "GEN2 selinux_state.ss->status_lock adaptation missing"
              )

          # Add the exact GEN2 internal header that defines struct selinux_ss.
          services_include = '#include "ss/services.h"\n'
          if services_include not in selinuxfs:
              anchor = '#include "conditional.h"\n'
              count = selinuxfs.count(anchor)
              print(
                  f"SELINUXFS_SERVICES_INCLUDE_ANCHOR_COUNT={count}"
              )
              if count != 1:
                  raise RuntimeError(
                      "Expected one conditional.h include anchor in "
                      f"selinuxfs.c, found {count}"
                  )

              selinuxfs = selinuxfs.replace(
                  anchor,
                  anchor
                  + "#ifdef CONFIG_KSU_SUSFS\n"
                  + services_include
                  + "#endif\n",
                  1,
              )
              print(
                  "SELINUXFS_SS_SERVICES_HEADER_INSERTED=YES"
              )
          else:
              print(
                  "SELINUXFS_SS_SERVICES_HEADER_ALREADY_PRESENT=YES"
              )

          selinuxfs_path.write_text(
              selinuxfs, encoding="utf-8"
          )

          # Exact source-of-truth checks against the pinned GEN2 layout.
          security_h = (
              sim / "security/selinux/include/security.h"
          ).read_text(encoding="utf-8", errors="replace")

          services_h = (
              sim / "security/selinux/ss/services.h"
          ).read_text(encoding="utf-8", errors="replace")

          state_match = re.search(
              r"struct selinux_state\s*\{(.*?)\}\s*__randomize_layout;",
              security_h,
              re.S,
          )
          if not state_match:
              raise RuntimeError(
                  "GEN2 struct selinux_state not found"
              )

          state_body = state_match.group(1)
          if "status_lock" in state_body:
              raise RuntimeError(
                  "GEN2 struct selinux_state unexpectedly has status_lock"
              )
          if "struct selinux_ss *ss;" not in state_body:
              raise RuntimeError(
                  "GEN2 struct selinux_state lacks ss pointer"
              )

          ss_match = re.search(
              r"struct selinux_ss\s*\{(.*?)\}\s*__randomize_layout;",
              services_h,
              re.S,
          )
          if not ss_match:
              raise RuntimeError(
                  "GEN2 struct selinux_ss not found in ss/services.h"
              )

          ss_body = ss_match.group(1)
          for member in (
              "struct page *status_page;",
              "struct mutex status_lock;",
          ):
              if member not in ss_body:
                  raise RuntimeError(
                      f"GEN2 selinux_ss member missing: {member}"
                  )

          final_selinuxfs = selinuxfs_path.read_text(
              encoding="utf-8", errors="replace"
          )

          if newer_lock in final_selinuxfs:
              raise RuntimeError(
                  "Newer selinux_state.status_lock reference remained"
              )
          if services_include not in final_selinuxfs:
              raise RuntimeError(
                  "ss/services.h include missing from selinuxfs.c"
              )

          print(
              "SELINUXFS_GEN2_COMPLETE_SELINUX_SS_VISIBILITY=PASS"
          )

          # ==========================================================
          # B) fs/exec.c: declaration VISIBILITY, not mere presence.
          #
          # The selected SUSFS patch placed its declaration block after
          # __do_execve_file(), while the functional hook call is inside
          # __do_execve_file().  That is textually present but not visible
          # to the C compiler at the callsite.
          # ==========================================================
          exec_path = sim / "fs/exec.c"
          exec_text = exec_path.read_text(
              encoding="utf-8", errors="replace"
          )

          call_marker = (
              "static_branch_likely(&ksu_su_compat_enabled)"
          )
          first_call_pos = exec_text.find(call_marker)
          if first_call_pos < 0:
              raise RuntimeError(
                  "Exec SUSFS hook callsite missing"
              )

          decl_start_marker = (
              "#ifdef CONFIG_KSU_SUSFS\n"
              "extern struct static_key_true ksu_su_compat_enabled;\n"
          )

          old_decl_pos = exec_text.find(decl_start_marker)
          print(
              f"EXEC_FIRST_HOOK_CALL_POSITION={first_call_pos}"
          )
          print(
              f"EXEC_EXISTING_DECLARATION_BLOCK_POSITION={old_decl_pos}"
          )

          # Remove all copies of the exact late declaration block first.
          decl_block = (
              "#ifdef CONFIG_KSU_SUSFS\n"
              "extern struct static_key_true ksu_su_compat_enabled;\n"
              "extern struct static_key_true "
              "susfs_is_sdcard_android_data_not_decrypted;\n"
              "extern bool __ksu_is_allow_uid_for_current(uid_t uid);\n"
              "extern int ksu_handle_execveat(int *fd, "
              "struct filename **filename_ptr, void *argv,\n"
              "\t\t\tvoid *envp, int *flags);\n"
              "extern int ksu_handle_execveat_sucompat(int *fd, "
              "struct filename **filename_ptr, void *argv,\n"
              "\t\t\t\tvoid *envp, int *flags);\n"
              "#endif\n"
          )

          # Formatting in the auto-applied upstream hunk may vary slightly.
          # Identify the complete CONFIG_KSU_SUSFS extern block immediately
          # preceding do_execveat_common() by function boundary instead.
          do_common = re.search(
              r"^static int do_execveat_common\(int fd, "
              r"struct filename \*filename,",
              exec_text,
              re.M,
          )
          if not do_common:
              raise RuntimeError(
                  "do_execveat_common() not found"
              )

          prefix = exec_text[:do_common.start()]
          block_re = re.compile(
              r"#ifdef CONFIG_KSU_SUSFS\n"
              r"extern struct static_key_true ksu_su_compat_enabled;\n"
              r"extern struct static_key_true "
              r"susfs_is_sdcard_android_data_not_decrypted;\n"
              r"extern bool __ksu_is_allow_uid_for_current\(uid_t uid\);\n"
              r"extern int ksu_handle_execveat\(.*?\n"
              r"extern int ksu_handle_execveat_sucompat\(.*?\n"
              r"#endif\n",
              re.S,
          )

          blocks = list(block_re.finditer(prefix))
          print(
              f"EXEC_LATE_DECLARATION_BLOCK_COUNT={len(blocks)}"
          )

          if len(blocks) != 1:
              raise RuntimeError(
                  "Expected exactly one late exec declaration block "
                  f"before do_execveat_common, found {len(blocks)}"
              )

          late_block = blocks[0].group(0)

          # Ensure this is really the block after the functional hook.
          if blocks[0].start() <= first_call_pos:
              raise RuntimeError(
                  "Exec declaration block unexpectedly already precedes "
                  "the hook callsite"
              )

          exec_text = (
              exec_text[:blocks[0].start()]
              + exec_text[blocks[0].end():]
          )

          # Insert the same provider declarations before __do_execve_file().
          target_func = re.search(
              r"^static int __do_execve_file\(int fd, "
              r"struct filename \*filename,",
              exec_text,
              re.M,
          )
          if not target_func:
              raise RuntimeError(
                  "__do_execve_file() definition not found"
              )

          exec_text = (
              exec_text[:target_func.start()]
              + late_block
              + "\n"
              + exec_text[target_func.start():]
          )

          exec_path.write_text(
              exec_text, encoding="utf-8"
          )

          final_exec = exec_path.read_text(
              encoding="utf-8", errors="replace"
          )

          final_call_pos = final_exec.find(call_marker)
          final_decl_pos = final_exec.find(
              "extern struct static_key_true "
              "ksu_su_compat_enabled;"
          )

          print(
              f"EXEC_FINAL_DECLARATION_POSITION={final_decl_pos}"
          )
          print(
              f"EXEC_FINAL_HOOK_CALL_POSITION={final_call_pos}"
          )

          if final_decl_pos < 0 or final_call_pos < 0:
              raise RuntimeError(
                  "Exec declaration/call position verification failed"
              )

          if not final_decl_pos < final_call_pos:
              raise RuntimeError(
                  "Exec declarations are still not compiler-visible "
                  "before the hook callsite"
              )

          # Exactly one declaration of each provider in fs/exec.c.
          required_decls = [
              "extern struct static_key_true "
              "ksu_su_compat_enabled;",
              "extern struct static_key_true "
              "susfs_is_sdcard_android_data_not_decrypted;",
              "extern int ksu_handle_execveat(",
              "extern int ksu_handle_execveat_sucompat(",
          ]

          for marker in required_decls:
              count = final_exec.count(marker)
              print(
                  f"EXEC_DECL_COUNT[{marker}]={count}"
              )
              if count != 1:
                  raise RuntimeError(
                      f"Expected exactly one exec declaration: {marker}"
                  )

          # Provider-side exact signatures still must exist.
          sucompat = (
              sim / "KernelSU/kernel/feature/sucompat.c"
          ).read_text(encoding="utf-8", errors="replace")

          for marker in (
              "DEFINE_STATIC_KEY_TRUE(ksu_su_compat_enabled);",
              "int ksu_handle_execveat(int *fd, "
              "struct filename **filename_ptr, void *argv, "
              "void *envp, int *flags)",
              "int ksu_handle_execveat_sucompat(int *fd, "
              "struct filename **filename_ptr, void *argv, "
              "void *envp, int *flags)",
          ):
              if marker not in sucompat:
                  raise RuntimeError(
                      "Pinned ReSukiSU provider missing: " + marker
                  )

          susfs_core = (
              sim / "fs/susfs.c"
          ).read_text(encoding="utf-8", errors="replace")

          if (
              "DEFINE_STATIC_KEY_TRUE("
              "susfs_is_sdcard_android_data_not_decrypted)"
              not in susfs_core
          ):
              raise RuntimeError(
                  "SUSFS Android/data static-key provider missing"
              )

          print(
              "EXEC_DECLARATIONS_BEFORE_HOOK_CALLSITE=PASS"
          )
          print(
              "WORKFLOW33_V3_COMPILER_VISIBILITY_ADAPTATION=PASS"
          )
          PY

          grep -q \
            '^WORKFLOW33_V3_COMPILER_VISIBILITY_ADAPTATION=PASS$' \
            workflow33-compile-compat-edit-log.txt

          git -C "$SIM" diff --check \
            > workflow33-compile-compat-diff-check.txt

          {
            echo "WORKFLOW33_COMPILE_COMPAT_ADAPTATION=PASS"
            echo "WORKFLOW33_V3_COMPILER_VISIBILITY_ADAPTATION=PASS"
            echo "SELINUX_SS_COMPLETE_TYPE_HEADER=ss/services.h"
            echo "SELINUX_STATUS_LOCK_LAYOUT=GEN2_5_4_STATE_SS"
            echo "EXEC_DECLARATIONS_BEFORE_HOOK_CALLSITE=PASS"
            echo "COMPILE_COMPAT_DIFF_CHECK=PASS"
            echo "ORIGINAL_PROJECT_SOURCE_MODIFIED=NO"
          } | tee workflow33-compile-compat-status.txt

