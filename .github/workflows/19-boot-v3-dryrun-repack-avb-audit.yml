name: 19 - VEUX Boot v3 Dry-Run Repack + AVB Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  W17_ARTIFACT_NAME: "veux-5.4.274-resukisu-susfs-2.2-final-release-candidate-1"
  W18_ARTIFACT_NAME: "veux-os1.0.12.0-workflow18-stock-rom-audit-3"

  W17_IMAGE_BYTES: "29839872"
  W17_IMAGE_SHA256: "e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96"
  W17_DTB_SHA256: "42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37"
  W17_CONFIG_SHA256: "c9831aeadf65064bf6632973b2bd6f4da905da9707718bc75ded0bd228150ca6"
  W17_CANDIDATE_TREE: "5d25b7e0124d7fb695f3f07b45928fcb5780d0e8"
  W17_RESUKISU_COMMIT: "faccf4c5edc7be37776216e7d43dd3dca0239331"

  STOCK_BOOT_SHA256: "ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5"
  STOCK_VENDOR_BOOT_SHA256: "583e1f4c0e09c2267cda88bd48a8b4f56cf5c5e034fbda7b25bd65aa86385425"
  STOCK_DTBO_SHA256: "e9f3bae2c5417ff297162f1e7d2652ee98b347488fdf091d61daa986fbfb7690"
  STOCK_VBMETA_SHA256: "62a5b1a94c2247c786e8148b9d9d0aea943b57b1034b3fd82d9cac9a85fcde97"
  STOCK_ROM_MD5: "cda1240a451dd4f75776878b52f0cea3"

  EXPECTED_DRYRUN_SHA256: "2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e"
  EXPECTED_DRYRUN_AVB_DIGEST: "8b6af8a52796027ece9afb816e2354e0a9548808226749400fe8de86e0fdf397"

jobs:
  audit:
    name: Reproduce kernel-only Boot v3 dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      WORK: ${{ github.workspace }}/workflow19
      INPUTS: ${{ github.workspace }}/workflow19/inputs
      W17: ${{ github.workspace }}/workflow19/inputs/w17
      W18: ${{ github.workspace }}/workflow19/inputs/w18
      OUTPUT: ${{ github.workspace }}/workflow19/output

    steps:
      - name: Prepare read-only audit workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORK"
          mkdir -p "$INPUTS" "$W17" "$W18" "$OUTPUT"

          {
            echo "VEUX Workflow 19"
            echo "================"
            echo
            echo "PURPOSE: reproduce the earlier Boot-v3 dry-run from exact"
            echo "Workflow-17 + Workflow-18 GitHub artifacts."
            echo
            echo "NO DEVICE OPERATION"
            echo "NO FLASH"
            echo "NO vendor_boot MODIFICATION"
            echo "NO dtbo MODIFICATION"
            echo "NO top-level vbmeta MODIFICATION"
          } > "$OUTPUT/SCOPE.txt"

      - name: Download exact Workflow 17 and Workflow 18 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ALL="$WORK/artifacts.ndjson"
          : > "$ALL"

          page=1
          while :; do
            PAGE_JSON="$WORK/artifacts-page-${page}.json"

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}" \
              -o "$PAGE_JSON"

            count="$(jq '.artifacts | length' "$PAGE_JSON")"
            jq -c '.artifacts[]' "$PAGE_JSON" >> "$ALL"

            if [ "$count" -lt 100 ]; then
              break
            fi

            page=$((page + 1))
            [ "$page" -le 20 ] || {
              echo "ERROR: artifact pagination safety limit reached"
              exit 1
            }
          done

          download_exact_artifact() {
            local name="$1"
            local dest="$2"
            local meta="$3"

            matches="$({
              jq -s \
                --arg NAME "$name" \
                '[.[] | select(.name == $NAME and .expired == false)] | sort_by(.created_at)' \
                "$ALL"
            })"

            count="$(jq 'length' <<< "$matches")"

            [ "$count" -ge 1 ] || {
              echo "ERROR: artifact not found: $name"
              exit 1
            }

            selected="$(jq '.[-1]' <<< "$matches")"
            id="$(jq -r '.id' <<< "$selected")"
            url="$(jq -r '.archive_download_url' <<< "$selected")"

            jq . <<< "$selected" > "$meta"

            echo "Downloading artifact: $name"
            echo "Artifact ID: $id"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" \
              -o "$dest"

            unzip -t "$dest" > "${dest}.ziptest.txt"
          }

          download_exact_artifact \
            "$W17_ARTIFACT_NAME" \
            "$INPUTS/w17-artifact.zip" \
            "$OUTPUT/W17-ARTIFACT-METADATA.json"

          download_exact_artifact \
            "$W18_ARTIFACT_NAME" \
            "$INPUTS/w18-artifact.zip" \
            "$OUTPUT/W18-ARTIFACT-METADATA.json"

          {
            echo "W17_ARTIFACT=$W17_ARTIFACT_NAME"
            echo "W17_OUTER_ZIP_SHA256=$(sha256sum "$INPUTS/w17-artifact.zip" | awk '{print $1}')"
            echo "W18_ARTIFACT=$W18_ARTIFACT_NAME"
            echo "W18_OUTER_ZIP_SHA256=$(sha256sum "$INPUTS/w18-artifact.zip" | awk '{print $1}')"
          } | tee "$OUTPUT/INPUT-ARTIFACTS.txt"

      - name: Verify exact Workflow 17 final kernel artifact
        shell: bash
        run: |
          set -euo pipefail

          unzip -q "$INPUTS/w17-artifact.zip" -d "$W17"

          (
            cd "$W17"
            sha256sum -c SHA256SUMS \
              | tee "$OUTPUT/W17-SHA256SUMS.verify.txt"
          )

          test "$(stat -c '%s' "$W17/Image")" = "$W17_IMAGE_BYTES"
          test "$(sha256sum "$W17/Image" | awk '{print $1}')" = "$W17_IMAGE_SHA256"
          test "$(sha256sum "$W17/veux.dtb" | awk '{print $1}')" = "$W17_DTB_SHA256"
          test "$(sha256sum "$W17/final.config" | awk '{print $1}')" = "$W17_CONFIG_SHA256"

          grep -Fxq "RESULT: PASS" "$W17/RELEASE-MANIFEST.txt"
          grep -Fq "Kernel release: 5.4.274~positron/5ec160dc" "$W17/RELEASE-MANIFEST.txt"
          grep -Fq "Candidate tree: $W17_CANDIDATE_TREE" "$W17/RELEASE-MANIFEST.txt"
          grep -Fq "ReSukiSU commit: $W17_RESUKISU_COMMIT" "$W17/RELEASE-MANIFEST.txt"
          grep -Fq "CANDIDATE_TREE=$W17_CANDIDATE_TREE" "$W17/candidate2.txt"
          grep -Fq "CASS_COMMIT_DO_NOT_REVERT=b9b5ddba28bf9f23ac1a2af27f574291451244fd" "$W17/candidate2.txt"
          grep -Fxq "$W17_RESUKISU_COMMIT" "$W17/resukisu-commit.txt"

          cp "$W17/RELEASE-MANIFEST.txt" "$OUTPUT/W17-RELEASE-MANIFEST.txt"

          {
            echo "WORKFLOW 17 INPUT GATE"
            echo "======================"
            echo "RESULT: PASS"
            echo "Image bytes: $W17_IMAGE_BYTES"
            echo "Image SHA-256: $W17_IMAGE_SHA256"
            echo "Config SHA-256: $W17_CONFIG_SHA256"
            echo "DTB SHA-256: $W17_DTB_SHA256"
            echo "Candidate tree: $W17_CANDIDATE_TREE"
            echo "ReSukiSU commit: $W17_RESUKISU_COMMIT"
          } > "$OUTPUT/W17-INPUT-GATE.txt"

      - name: Verify exact Workflow 18 stock-ROM artifact
        shell: bash
        run: |
          set -euo pipefail

          unzip -q "$INPUTS/w18-artifact.zip" -d "$W18"

          (
            cd "$W18"
            sha256sum -c SHA256SUMS \
              | tee "$OUTPUT/W18-SHA256SUMS.verify.txt"
          )

          grep -Fxq \
            'RESULT: PASS_READ_ONLY_REPRODUCED_FROM_FASTBOOT_ROM' \
            "$W18/audit/WORKFLOW18-SUMMARY.txt"

          test "$(sha256sum "$W18/stock_images/stock_boot.img" | awk '{print $1}')" = "$STOCK_BOOT_SHA256"
          test "$(sha256sum "$W18/stock_images/stock_vendor_boot.img" | awk '{print $1}')" = "$STOCK_VENDOR_BOOT_SHA256"
          test "$(sha256sum "$W18/stock_images/stock_dtbo.img" | awk '{print $1}')" = "$STOCK_DTBO_SHA256"
          test "$(sha256sum "$W18/stock_images/stock_vbmeta.img" | awk '{print $1}')" = "$STOCK_VBMETA_SHA256"

          jq -e \
            --arg MD5 "$STOCK_ROM_MD5" \
            --arg BOOT "$STOCK_BOOT_SHA256" \
            --arg VENDOR "$STOCK_VENDOR_BOOT_SHA256" \
            --arg DTBO "$STOCK_DTBO_SHA256" \
            --arg VBMETA "$STOCK_VBMETA_SHA256" \
            '
              .result == "PASS_READ_ONLY_REPRODUCED_FROM_FASTBOOT_ROM"
              and .source.md5 == $MD5
              and .boot.sha256 == $BOOT
              and .vendor_boot.sha256 == $VENDOR
              and .dtbo.sha256 == $DTBO
              and .vbmeta.sha256 == $VBMETA
              and .vbmeta.signature_verifies == true
              and .vbmeta.direct_hashes_verify == true
              and .vendor_boot.dtb_fdt_count == 3
              and .dtbo.entry_count == 16
            ' \
            "$W18/audit/STOCK-ROM-AUDIT.json" \
            > /dev/null

          cp "$W18/audit/WORKFLOW18-SUMMARY.txt" "$OUTPUT/W18-WORKFLOW-SUMMARY.txt"
          cp "$W18/audit/STOCK-ROM-AUDIT.json" "$OUTPUT/W18-STOCK-ROM-AUDIT.json"
          cp "$W18/audit/FASTBOOT-ROM-SOURCE.txt" "$OUTPUT/W18-FASTBOOT-ROM-SOURCE.txt"

          {
            echo "WORKFLOW 18 INPUT GATE"
            echo "======================"
            echo "RESULT: PASS"
            echo "Fastboot ROM MD5: $STOCK_ROM_MD5"
            echo "boot SHA-256: $STOCK_BOOT_SHA256"
            echo "vendor_boot SHA-256: $STOCK_VENDOR_BOOT_SHA256"
            echo "dtbo SHA-256: $STOCK_DTBO_SHA256"
            echo "vbmeta SHA-256: $STOCK_VBMETA_SHA256"
            echo "Signed top-level vbmeta: PASS from Workflow 18"
          } > "$OUTPUT/W18-INPUT-GATE.txt"

      - name: Reproduce Boot v3 dry-run and audit AVB relationship
        shell: bash
        run: |
          set -euo pipefail

          cat > "$WORK/repack_audit.py" <<'PY'
          import hashlib
          import json
          import struct
          import sys
          from pathlib import Path

          stock_path = Path(sys.argv[1])
          image_path = Path(sys.argv[2])
          vbmeta_path = Path(sys.argv[3])
          vendor_path = Path(sys.argv[4])
          dtbo_path = Path(sys.argv[5])
          out_path = Path(sys.argv[6])
          report_dir = Path(sys.argv[7])
          report_dir.mkdir(parents=True, exist_ok=True)

          stock = stock_path.read_bytes()
          image = image_path.read_bytes()
          top_vbmeta = vbmeta_path.read_bytes()
          vendor = vendor_path.read_bytes()
          dtbo = dtbo_path.read_bytes()

          EXPECTED = {
              "stock_boot_sha": "ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5",
              "stock_kernel_sha": "6e513b3652aa1de599c26b6aaeefef12dac569daf8648bbb67de99932782c50b",
              "ramdisk_sha": "0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a",
              "w17_image_sha": "e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96",
              "stock_vbmeta_sha": "62a5b1a94c2247c786e8148b9d9d0aea943b57b1034b3fd82d9cac9a85fcde97",
              "stock_vendor_sha": "583e1f4c0e09c2267cda88bd48a8b4f56cf5c5e034fbda7b25bd65aa86385425",
              "stock_dtbo_sha": "e9f3bae2c5417ff297162f1e7d2652ee98b347488fdf091d61daa986fbfb7690",
              "stock_boot_digest": "fc6d91cd4ce2e89703c59e6a35c60e3efd984cfb54a29760e4a3105c42399d8a",
              "vendor_boot_digest": "370f9c242bd161bd36effc3e7b56f208e21700a9a4e848b004f68595df2190c6",
              "dtbo_digest": "a49a514a35a1ee60c19716407eb70f8bf5f9a8fec7aa8394c00c370f7ca0c6d9",
              "new_boot_digest": "8b6af8a52796027ece9afb816e2354e0a9548808226749400fe8de86e0fdf397",
              "dryrun_sha": "2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e",
          }

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def align(value, size=4096):
              return (value + size - 1) // size * size

          def need(condition, message):
              if not condition:
                  raise SystemExit("ERROR: " + message)

          def parse_footer(data):
              raw = data[-64:]
              need(raw[:4] == b"AVBf", "AVB footer magic")
              major, minor = struct.unpack_from(">II", raw, 4)
              original, offset, size = struct.unpack_from(">QQQ", raw, 12)
              need(offset + size <= len(data) - 64, "AVB footer geometry")
              return {
                  "major": major,
                  "minor": minor,
                  "original": original,
                  "offset": offset,
                  "size": size,
                  "raw": raw,
                  "vbmeta": data[offset:offset + size],
              }

          def parse_vbmeta(vb):
              need(vb[:4] == b"AVB0", "AVB0 magic")
              req_major, req_minor = struct.unpack_from(">II", vb, 4)
              auth_size, aux_size = struct.unpack_from(">QQ", vb, 12)
              algorithm_type = struct.unpack_from(">I", vb, 28)[0]
              values = struct.unpack_from(">QQQQQQQQQQQ", vb, 32)
              (
                  hash_offset,
                  hash_size,
                  signature_offset,
                  signature_size,
                  public_key_offset,
                  public_key_size,
                  public_key_metadata_offset,
                  public_key_metadata_size,
                  descriptors_offset,
                  descriptors_size,
                  rollback_index,
              ) = values

              flags, rollback_location = struct.unpack_from(">II", vb, 120)
              release = vb[128:176].split(b"\0", 1)[0].decode("ascii", "replace")

              aux_start = 256 + auth_size
              pos = aux_start + descriptors_offset
              end = pos + descriptors_size

              need(
                  end <= aux_start + aux_size,
                  "AVB descriptors outside auxiliary block",
              )

              descriptors = []

              while pos < end:
                  tag, following = struct.unpack_from(">QQ", vb, pos)
                  raw = vb[pos:pos + 16 + following]

                  need(
                      len(raw) == 16 + following,
                      "truncated AVB descriptor",
                  )

                  item = {
                      "tag": tag,
                      "offset": pos,
                      "following": following,
                      "raw": raw,
                  }

                  if tag == 2:
                      image_size = struct.unpack_from(">Q", raw, 16)[0]

                      algorithm = (
                          raw[24:56]
                          .split(b"\0", 1)[0]
                          .decode("ascii", "replace")
                      )

                      (
                          name_len,
                          salt_len,
                          digest_len,
                          dflags,
                      ) = struct.unpack_from(">IIII", raw, 56)

                      q = 132

                      partition = raw[
                          q:q + name_len
                      ].decode("ascii", "replace")

                      q += name_len

                      salt = raw[
                          q:q + salt_len
                      ]

                      q += salt_len

                      digest = raw[
                          q:q + digest_len
                      ]

                      item.update({
                          "type": "hash",
                          "image_size": image_size,
                          "hash_algorithm": algorithm,
                          "partition": partition,
                          "salt": salt,
                          "digest": digest,
                          "digest_offset": pos + q,
                          "digest_len": digest_len,
                          "image_size_offset": pos + 16,
                          "flags": dflags,
                      })

                  elif tag == 0:
                      key_len, value_len = struct.unpack_from(
                          ">QQ",
                          raw,
                          16,
                      )

                      q = 32

                      key = raw[
                          q:q + key_len
                      ]

                      q += key_len

                      if q < len(raw) and raw[q] == 0:
                          q += 1

                      value = raw[
                          q:q + value_len
                      ]

                      item.update({
                          "type": "property",
                          "key": key.decode(
                              "utf-8",
                              "replace",
                          ),
                          "value": value.decode(
                              "utf-8",
                              "replace",
                          ),
                      })

                  else:
                      item["type"] = "other"

                  descriptors.append(item)

                  pos += 16 + following

              need(
                  pos == end,
                  "AVB descriptor parse end",
              )

              return {
                  "required_libavb":
                      f"{req_major}.{req_minor}",
                  "algorithm_type":
                      algorithm_type,
                  "auth_size":
                      auth_size,
                  "aux_size":
                      aux_size,
                  "hash_offset":
                      hash_offset,
                  "hash_size":
                      hash_size,
                  "signature_offset":
                      signature_offset,
                  "signature_size":
                      signature_size,
                  "public_key_offset":
                      public_key_offset,
                  "public_key_size":
                      public_key_size,
                  "public_key_metadata_offset":
                      public_key_metadata_offset,
                  "public_key_metadata_size":
                      public_key_metadata_size,
                  "rollback_index":
                      rollback_index,
                  "flags":
                      flags,
                  "rollback_index_location":
                      rollback_location,
                  "release":
                      release,
                  "descriptors":
                      descriptors,
              }

          def hash_descriptor(info, partition):
              found = [
                  descriptor
                  for descriptor
                  in info["descriptors"]
                  if (
                      descriptor.get("type")
                      == "hash"
                      and descriptor.get("partition")
                      == partition
                  )
              ]

              need(
                  len(found) == 1,
                  f"expected exactly one hash descriptor for {partition}",
              )

              return found[0]

          def verify_descriptor(data, descriptor):
              need(
                  descriptor["hash_algorithm"]
                  == "sha256",
                  "unexpected hash algorithm",
              )

              need(
                  descriptor["image_size"]
                  <= len(data),
                  "descriptor image_size exceeds image",
              )

              calculated = hashlib.sha256(
                  descriptor["salt"]
                  + data[
                      :descriptor["image_size"]
                  ]
              ).digest()

              return (
                  calculated
                  == descriptor["digest"],
                  calculated,
              )

          need(
              len(stock) == 134217728,
              "stock boot size",
          )

          need(
              sha(stock)
              == EXPECTED["stock_boot_sha"],
              "stock boot SHA-256",
          )

          need(
              len(image) == 29839872,
              "Workflow-17 Image size",
          )

          need(
              sha(image)
              == EXPECTED["w17_image_sha"],
              "Workflow-17 Image SHA-256",
          )

          need(
              len(top_vbmeta) == 8192,
              "stock vbmeta size",
          )

          need(
              sha(top_vbmeta)
              == EXPECTED["stock_vbmeta_sha"],
              "stock vbmeta SHA-256",
          )

          need(
              len(vendor) == 100663296,
              "stock vendor_boot size",
          )

          need(
              sha(vendor)
              == EXPECTED["stock_vendor_sha"],
              "stock vendor_boot SHA-256",
          )

          need(
              len(dtbo) == 8388608,
              "stock dtbo size",
          )

          need(
              sha(dtbo)
              == EXPECTED["stock_dtbo_sha"],
              "stock dtbo SHA-256",
          )

          need(
              stock[:8] == b"ANDROID!",
              "stock boot magic",
          )

          (
              kernel_size,
              ramdisk_size,
              os_raw,
              header_size,
          ) = struct.unpack_from(
              "<4I",
              stock,
              8,
          )

          reserved = struct.unpack_from(
              "<4I",
              stock,
              24,
          )

          header_version = struct.unpack_from(
              "<I",
              stock,
              40,
          )[0]

          need(
              kernel_size == 45480448,
              "stock kernel size",
          )

          need(
              ramdisk_size == 22061278,
              "stock ramdisk size",
          )

          need(
              header_size == 1580,
              "stock boot header size",
          )

          need(
              header_version == 3,
              "stock boot header version",
          )

          need(
              reserved == (0, 0, 0, 0),
              "stock boot reserved fields",
          )

          need(
              all(
                  value == 0
                  for value
                  in stock[
                      header_size:4096
                  ]
              ),
              "stock boot header padding is not zero",
          )

          stock_ramdisk_offset = (
              4096
              + align(kernel_size)
          )

          stock_payload_end = (
              stock_ramdisk_offset
              + align(ramdisk_size)
          )

          need(
              stock_ramdisk_offset
              == 45486080,
              "stock ramdisk offset",
          )

          need(
              stock_payload_end
              == 67551232,
              "stock aligned payload end",
          )

          stock_kernel = stock[
              4096:
              4096 + kernel_size
          ]

          ramdisk = stock[
              stock_ramdisk_offset:
              stock_ramdisk_offset
              + ramdisk_size
          ]

          need(
              sha(stock_kernel)
              == EXPECTED["stock_kernel_sha"],
              "stock kernel SHA-256",
          )

          need(
              sha(ramdisk)
              == EXPECTED["ramdisk_sha"],
              "stock ramdisk SHA-256",
          )

          need(
              ramdisk[:4]
              == bytes.fromhex(
                  "02214c18"
              ),
              "stock ramdisk is not LZ4 legacy",
          )

          (
              stock_text_offset,
              stock_arm_image_size,
              stock_arm_flags,
          ) = struct.unpack_from(
              "<QQQ",
              stock_kernel,
              8,
          )

          (
              stock_arm_magic,
              stock_arm_res5,
          ) = struct.unpack_from(
              "<II",
              stock_kernel,
              56,
          )

          need(
              stock_text_offset
              == 0x80000,
              "stock ARM64 text_offset",
          )

          need(
              stock_arm_image_size
              == 50966528,
              "stock ARM64 image_size",
          )

          need(
              stock_arm_flags == 0xA,
              "stock ARM64 flags",
          )

          need(
              stock_arm_magic
              == 0x644D5241,
              "stock ARM64 magic",
          )

          need(
              stock_arm_res5 == 0x40,
              "stock ARM64 res5",
          )

          (
              new_text_offset,
              new_arm_image_size,
              new_arm_flags,
          ) = struct.unpack_from(
              "<QQQ",
              image,
              8,
          )

          (
              new_arm_magic,
              new_arm_res5,
          ) = struct.unpack_from(
              "<II",
              image,
              56,
          )

          need(
              new_text_offset
              == 0x80000,
              "Workflow-17 ARM64 text_offset",
          )

