              encoding="utf-8",
          )

          print(cleaned)
          PY

          python3 \
            "$WORK/repack_audit.py" \
            "$W18/stock_images/stock_boot.img" \
            "$W17/Image" \
            "$W18/stock_images/stock_vbmeta.img" \
            "$W18/stock_images/stock_vendor_boot.img" \
            "$W18/stock_images/stock_dtbo.img" \
            "$OUTPUT/DO_NOT_FLASH_workflow19_dryrun_boot.img" \
            "$OUTPUT"

      - name: Require exact GitHub reproduction of prior Workflow 19 bytes
        shell: bash
        run: |
          set -euo pipefail

          DRY="$OUTPUT/DO_NOT_FLASH_workflow19_dryrun_boot.img"

          test "$(stat -c '%s' "$DRY")" = "134217728"
          test "$(sha256sum "$DRY" | awk '{print $1}')" = "$EXPECTED_DRYRUN_SHA256"

          jq -e \
            --arg SHA "$EXPECTED_DRYRUN_SHA256" \
            --arg DIGEST "$EXPECTED_DRYRUN_AVB_DIGEST" \
            '
              .result == "PASS_DRYRUN_REPRODUCED_FROM_W17_W18"
              and .dryrun_boot.sha256 == $SHA
              and .embedded_boot_avb.dryrun_digest_hex == $DIGEST
              and .embedded_boot_avb.dryrun_digest_verifies == true
              and .reproduction.matches_previous_local_workflow19_sha256 == true
              and .reproduction.matches_previous_local_workflow19_avb_digest == true
              and .top_level_stock_vbmeta.stock_boot_descriptor_verifies_stock_boot == true
              and .top_level_stock_vbmeta.stock_boot_descriptor_verifies_dryrun_boot == false
              and .top_level_stock_vbmeta.expected_mismatch_for_modified_boot == true
              and .top_level_stock_vbmeta.vendor_boot_descriptor_verifies_stock_vendor_boot == true
              and .top_level_stock_vbmeta.dtbo_descriptor_verifies_stock_dtbo == true
              and .safety.flashed == false
              and .safety.dtb_appended == false
              and .safety.vendor_boot_modified == false
              and .safety.dtbo_modified == false
              and .safety.top_level_vbmeta_modified == false
            ' \
            "$OUTPUT/WORKFLOW19-STRUCTURE.json" \
            > /dev/null

          {
            echo "WORKFLOW 19 REPRODUCTION GATE"
            echo "============================="
            echo "RESULT: PASS"
            echo "Dry-run bytes: 134217728"
            echo "Dry-run SHA-256: $EXPECTED_DRYRUN_SHA256"
            echo "Regenerated embedded AVB digest: $EXPECTED_DRYRUN_AVB_DIGEST"
            echo "Matches earlier independent local Workflow 19: BYTE-IDENTICAL"
          } > "$OUTPUT/REPRODUCTION-GATE.txt"

      - name: Create final manifest and verify every output file
        shell: bash
        run: |
          set -euo pipefail

          cat > "$OUTPUT/MANIFEST.txt" <<EOF
          VEUX Workflow 19 - Canonical GitHub Reproduction
          =================================================

          RESULT: PASS_DRYRUN_REPRODUCED_FROM_W17_W18

          Exact Workflow-17 artifact:
          $W17_ARTIFACT_NAME

          Exact Workflow-18 artifact:
          $W18_ARTIFACT_NAME

          Exact W17 Image SHA-256:
          $W17_IMAGE_SHA256

          Exact stock boot SHA-256:
          $STOCK_BOOT_SHA256

          Dry-run image:
          DO_NOT_FLASH_workflow19_dryrun_boot.img

          Dry-run SHA-256:
          $EXPECTED_DRYRUN_SHA256

          Regenerated embedded boot AVB digest:
          $EXPECTED_DRYRUN_AVB_DIGEST

          The dry-run image is byte-identical to the earlier independent local
          Workflow-19 reconstruction.

          vendor_boot modified: NO
          dtbo modified: NO
          top-level vbmeta modified: NO
          DTB appended to boot: NO
          device operation: NO
          flashed: NO

          PASS here means structural/reproducibility PASS only.
          It does not establish device boot success.
          EOF

          (
            cd "$OUTPUT"

            find . \
              -maxdepth 1 \
              -type f \
              ! -name SHA256SUMS \
              ! -name SHA256SUMS.verify.txt \
              -printf '%f\n' \
              | LC_ALL=C sort \
              | while IFS= read -r FILE; do
                  sha256sum "$FILE"
                done \
              > SHA256SUMS

            sha256sum -c SHA256SUMS \
              | tee SHA256SUMS.verify.txt
          )

          grep -Fxq \
            'RESULT: PASS_DRYRUN_REPRODUCED_FROM_W17_W18' \
            "$OUTPUT/WORKFLOW19-DRYRUN-REPACK-AUDIT.txt"

          grep -Fq \
            'BYTE-IDENTICAL RESULT: YES' \
            "$OUTPUT/WORKFLOW19-DRYRUN-REPACK-AUDIT.txt"

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p "$OUTPUT"

          {
            echo "VEUX Workflow 19: FAILURE"
            echo "Finished: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "No device operation was performed."
            echo "Nothing was flashed."
          } > "$OUTPUT/FAILURE-SUMMARY.txt"

          find "$WORK" \
            -maxdepth 6 \
            -type f \
            -printf '%s %p\n' \
            > "$OUTPUT/FAILURE-FILE-TREE.txt" \
            2>/dev/null || true

      - name: Upload Workflow 19 audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veux-5.4.274-workflow19-boot-v3-dryrun-repack-avb-audit-${{ github.run_number }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6
