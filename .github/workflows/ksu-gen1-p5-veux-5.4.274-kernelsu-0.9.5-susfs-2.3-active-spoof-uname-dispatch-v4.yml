          mkdir -p evidence; echo "STAGE=FINAL_STATUS" > evidence/STAGE.txt
          if [ "${{ job.status }}" = "success" ] && grep -Fxq 'P5_RESTORE_KIT=PASS' evidence/12-P5-PROVENANCE.txt 2>/dev/null && grep -Fxq 'P5_LINKED_BOUNDARY=PASS' evidence/11-P5-LINKED-BOUNDARY.txt 2>/dev/null; then pass=YES; checkpoint=KSU-GEN1-P5-ACTIVE-SPOOF-UNAME-DISPATCH-PASS; built=YES; else pass=NO; checkpoint=KSU-GEN1-P5-FAILED; if grep -Fxq 'P5_IMAGE_DTBS_BUILD=PASS' evidence/10-P5-BUILD-IDENTITY.txt 2>/dev/null; then built=YES; else built=NO; fi; fi
          { echo "JOB_STATUS_AT_TECHNICAL_CLOSE=${{ job.status }}"; echo "RUN_ID=$GITHUB_RUN_ID"; echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"; echo "TECHNICAL_PASS=$pass"; echo "CHECKPOINT=$checkpoint"; echo "PARENT_P4_RUN_ID=$P4_PASS_RUN_ID"; echo "P5_V1_FAILED_RUN_ID=$P5_V1_FAILED_RUN_ID"; echo "P5_V1_FAILURE_CLASS=RESTORE_GATE_REGENERATED_DIFF_BYTE_MISMATCH"; echo "P5_V2_FIX=$P5_V2_FIX"; echo "P5_V2_SOURCE_INTEGRATION_CHANGED_FROM_V1=NO"; echo "P5_V2_FAILED_RUN_ID=$P5_V2_FAILED_RUN_ID"; echo "P5_V2_FAILURE_CLASS=CHANGESET_GATE_OMITTED_UNTRACKED_NEW_PATCH_PATHS"; echo "P5_V3_FIX=$P5_V3_FIX"; echo "P5_V3_SOURCE_INTEGRATION_CHANGED_FROM_V2=NO"; echo "P5_V3_FAILED_RUN_ID=$P5_V3_FAILED_RUN_ID"; echo "P5_V3_FAILURE_CLASS=NEWUNAME_THREE_LINE_ANCHOR_TOO_STRICT_FOR_VENDOR_LOGIC"; echo "P5_V4_FIX=$P5_V4_FIX"; echo "P5_V4_SOURCE_INTEGRATION_CHANGED_FROM_V3=NO"; echo "CONFIG_KSU_SUSFS_TARGET=YES"; echo "CONFIG_KSU_SUSFS_SPOOF_UNAME_TARGET=YES"; echo "SUSFS_FEATURE_SUBOPTIONS_ENABLED=1"; echo "SUSFS_ONLY_ENABLED_SUBOPTION=KSU_SUSFS_SPOOF_UNAME"; echo "USER_COMMAND_DISPATCH=ROOT_ONLY"; echo "USER_COMMAND_DISPATCH_COMMAND_COUNT=4"; echo "NEWUNAME_HOOK=YES"; echo "UNSET_UNAME_SPOOF_BUFFER_GUARD=YES"; echo "P4_STAT_FACCESSAT_BRIDGE_PRESERVED=YES"; echo "RAW_USER_POINTER_REINTERPRET_CAST=NO"; echo "SUS_PATH_ACTIVE=NO"; echo "SUS_MOUNT_ACTIVE=NO"; echo "SUS_KSTAT_ACTIVE=NO"; echo "OPEN_REDIRECT_ACTIVE=NO"; echo "SUS_MAP_ACTIVE=NO"; echo "SPOOF_CMDLINE_OR_BOOTCONFIG_ACTIVE=NO"; echo "NAMEI_CHANGED=NO"; echo "PROC_CHANGED=NO"; echo "NAMESPACE_CHANGED=NO"; echo "KERNEL_BUILD_PERFORMED=$built"; echo "BOOT_IMAGE_CREATED=NO"; echo "DEVICE_ACCESSED=NO"; echo "FLASHING_PERFORMED=NO"; } > evidence/98-FINAL-STATUS.txt

      - name: 17 - Build SHA256 manifests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for dir in evidence restore-kit build-artifacts; do
            [ -d "$dir" ] || continue; rm -f "$dir/SHA256SUMS" "$dir/EMPTY-DIRECTORY.txt"
            (cd "$dir"; n="$(find . -type f ! -name SHA256SUMS ! -name EMPTY-DIRECTORY.txt | wc -l | tr -d ' ')"; if [ "$n" -eq 0 ]; then echo "EMPTY_DIRECTORY_AT_MANIFEST_TIME=YES" > EMPTY-DIRECTORY.txt; fi; find . -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 -r sha256sum > SHA256SUMS; test -s SHA256SUMS; ! grep -Eq '[[:space:]]SHA256SUMS$' SHA256SUMS; sha256sum -c SHA256SUMS)
          done

      - name: 18 - Upload P5 evidence restore kit and build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-active-spoof-uname-dispatch-v4-${{ github.run_id }}
          path: |
            evidence/
            restore-kit/
            build-artifacts/
          retention-days: 14
          if-no-files-found: error

      - name: 19 - Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# KSU GEN1 P5 v4 - root-only dispatch + SPOOF_UNAME"
            echo
            if [ "${{ job.status }}" = "success" ] && grep -Fxq 'TECHNICAL_PASS=YES' evidence/98-FINAL-STATUS.txt 2>/dev/null; then
              echo "**PASS**"; echo "Only SPOOF_UNAME is active; P4 filename bridge is preserved byte-for-byte."; echo '```text'; cat evidence/10-P5-BUILD-IDENTITY.txt; cat evidence/11-P5-LINKED-BOUNDARY.txt; cat evidence/12-P5-PROVENANCE.txt; echo '```'
            else
              echo "**FAIL — repair only this P5 activation/build boundary before the next SUSFS block.**"; echo '```text'; cat evidence/STAGE.txt 2>/dev/null || true; cat evidence/09-P5-OBJECT-COMPILE.txt 2>/dev/null || true; cat evidence/10-P5-IMAGE-DTBS-COMPILE.txt 2>/dev/null || true; cat evidence/98-FINAL-STATUS.txt 2>/dev/null || true; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
