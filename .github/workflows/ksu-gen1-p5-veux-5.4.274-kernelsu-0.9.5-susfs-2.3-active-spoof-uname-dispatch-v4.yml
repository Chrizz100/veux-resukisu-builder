name: KSU GEN1 P5 VEUX 5.4.274 KSU 0.9.5 SUSFS 2.3 Active SPOOF_UNAME Dispatch v4

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ksu-gen1-p5-spoof-uname-dispatch-v4-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_REPOSITORY: dereference23/kernel_xiaomi_sm6375
  BASE_COMMIT: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
  BASE_TREE: 1783b5008fc971b795ccaa374efe97aa996eef49
  BASE_VERSION: 5.4.268
  ANDROID_COMMON_REPO: https://android.googlesource.com/kernel/common
  ANDROID_TAG: android11-5.4.274_r00
  ANDROID_TAG_OBJECT: b5141f9d31a3d1875523c9e1ae0d4587c144d149
  ANDROID_COMMIT: 181edea14ae07024cc87699f3cd49116e6f8fbb3
  ANDROID_TREE: 0485f492b920bf72f7f623a0df2aa3c5d7661a9c
  TARGET_VERSION: 5.4.274
  EXPECTED_P0_MERGE_COMMIT: 763f39fff62ff914200a9ac6e7e2336fdf29a6f2
  EXPECTED_P0_MERGE_TREE: a50206971cf1d1eddc259f3aba3d63f87e7ec706
  KSU_COMMIT: b766b98513b5a7eb33bc1c4a76b5702bf1288f07
  KSU_EXPECTED_VERSION: "11872"
  SUSFS_SOURCE_COMMIT: ec785f47d49f7b3871ca9356f450411020af7017
  SUSFS_EXPECTED_VERSION: v2.3.0
  P4_PASS_RUN_ID: "33939213280"
  P5_V1_FAILED_RUN_ID: "33941339851"
  P5_V2_FIX: AUTHENTICATED_PATCH_APPLY_AND_CHANGESET_GATE_INSTEAD_OF_REGENERATED_DIFF_BYTE_CMP
  P5_V2_SOURCE_INTEGRATION_CHANGED_FROM_V1: "NO"
  P5_V2_FAILED_RUN_ID: "33941964340"
  P5_V3_FIX: CHANGESET_GATE_INCLUDES_TRACKED_AND_UNTRACKED_PATCH_PATHS
  P5_V3_SOURCE_INTEGRATION_CHANGED_FROM_V2: "NO"
  P5_V3_FAILED_RUN_ID: "33942375404"
  P5_V4_FIX: NEWUNAME_HOOK_AFTER_UNIQUE_MEMCPY_ANCHOR_WITH_VENDOR_LOGIC_TOLERANCE
  P5_V4_SOURCE_INTEGRATION_CHANGED_FROM_V3: "NO"
  P4_ARTIFACT_NAME: ksu-gen1-p4-veux-5.4.274-ksu-0.9.5-susfs-2.3-safe-filename-bridge-v7-33939213280
  EXPECTED_P4_IMAGE_SHA256: b28113d51b58aa48683a64c06612bfd6d70f0e09d9b5c1866581a9a1a4971885
  EXPECTED_P4_CONFIG_SHA256: 4416cdb68d8a445afb2ce64891174cfb55b9746406ec40962fc819cd591b8316
  EXPECTED_P4_DTB_SHA256: 42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37
  TOOLCHAIN_REPO: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
  TOOLCHAIN_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
  TOOLCHAIN_DIR: clang-r416183b
  EXPECTED_TOOLCHAIN_TREE_SHA256: ed560f80e2009206b25cb963c8810faecdad06b18b75cc563ef2c9b900355a1f
  EXPECTED_CLANG_SHA256: b2ce016755bddbab76549895bca07b1dc8d14a3e315b8b3567097fef04eadae1
  EXPECTED_LLD_SHA256: 51dc9705420c136f583478ac08a3258cd970710296928b3bf24dc3ee2e6208e3
  KBUILD_BUILD_USER: clean-gen1
  KBUILD_BUILD_HOST: github-actions
  KBUILD_BUILD_TIMESTAMP: Thu Apr 18 11:05:25 UTC 2024

jobs:
  p5-active-spoof-uname:
    name: P5 - Root-only SUSFS dispatch + SPOOF_UNAME + compile v4
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: 01 - Checkout exact fresh VEUX base
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
          path: kernel
          fetch-depth: 0
          filter: blob:none

      - name: 02 - Initialize P5 evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence restore-kit build-artifacts p4-artifact
          mkdir -p evidence restore-kit build-artifacts p4-artifact
          {
            echo "WORKFLOW=KSU-GEN1-P5-ACTIVE-SPOOF-UNAME-DISPATCH-v4"
            echo "P5_V1_FAILED_RUN_ID=$P5_V1_FAILED_RUN_ID"
            echo "P5_V1_FAILURE_CLASS=RESTORE_GATE_REGENERATED_DIFF_BYTE_MISMATCH"
            echo "P5_V2_FIX=$P5_V2_FIX"
            echo "P5_V2_SOURCE_INTEGRATION_CHANGED_FROM_V1=NO"
            echo "P5_V2_FAILED_RUN_ID=$P5_V2_FAILED_RUN_ID"
            echo "P5_V2_FAILURE_CLASS=CHANGESET_GATE_OMITTED_UNTRACKED_NEW_PATCH_PATHS"
            echo "P5_V3_FIX=$P5_V3_FIX"
            echo "P5_V3_SOURCE_INTEGRATION_CHANGED_FROM_V2=NO"
            echo "P5_V3_FAILED_RUN_ID=$P5_V3_FAILED_RUN_ID"
            echo "P5_V3_FAILURE_CLASS=NEWUNAME_THREE_LINE_ANCHOR_TOO_STRICT_FOR_VENDOR_LOGIC"
            echo "P5_V4_FIX=$P5_V4_FIX"
            echo "P5_V4_SOURCE_INTEGRATION_CHANGED_FROM_V3=NO"
            echo "DEVICE=VEUX"
            echo "TARGET_KERNEL=$TARGET_VERSION"
            echo "PARENT_P4_PASS_RUN_ID=$P4_PASS_RUN_ID"
            echo "ACTIVE_SUBOPTION=CONFIG_KSU_SUSFS_SPOOF_UNAME"
            echo "USER_COMMAND_DISPATCH=ROOT_ONLY"
            echo "DISPATCH_COMMANDS=SET_UNAME,SHOW_VERSION,SHOW_ENABLED_FEATURES,SHOW_VARIANT"
            echo "P4_FILENAME_BRIDGE_MUST_REMAIN_BYTE_IDENTICAL=YES"
            echo "SUS_PATH=SUS_MOUNT=SUS_KSTAT=OPEN_REDIRECT=SUS_MAP=DISABLED"
            echo "NAMEI_PROC_NAMESPACE_CHANGES=NO"
            echo "RESUKISU_INTEGRATION=NO"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } > evidence/00-CONTRACT.txt
          echo "STAGE=INITIALIZED" > evidence/STAGE.txt

      - name: 03 - Install build and audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=DEPENDENCIES" > evidence/STAGE.txt
          sudo apt-get update
          sudo apt-get install -y bc bison ca-certificates cpio curl flex git jq \
            libelf-dev libssl-dev python3 rsync xz-utils zstd

      - name: 04 - Reconstruct exact deterministic P0
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P0_RECONSTRUCTION" > evidence/STAGE.txt
          cd kernel
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(make -s kernelversion)" = "$BASE_VERSION"
          test -z "$(git status --porcelain)"
          git remote remove android >/dev/null 2>&1 || true
          git remote add android "$ANDROID_COMMON_REPO"
          git fetch --no-tags android "refs/tags/${ANDROID_TAG}:refs/tags/${ANDROID_TAG}"
          test "$(git cat-file -t "refs/tags/${ANDROID_TAG}")" = "tag"
          test "$(git rev-parse "refs/tags/${ANDROID_TAG}")" = "$ANDROID_TAG_OBJECT"
          test "$(git rev-parse "refs/tags/${ANDROID_TAG}^{}")" = "$ANDROID_COMMIT"
          test "$(git rev-parse "${ANDROID_COMMIT}^{tree}")" = "$ANDROID_TREE"
          git config user.name "VEUX Clean Baseline"
          git config user.email "veux-clean-baseline@users.noreply.github.com"
          git merge --no-commit --no-ff "$ANDROID_COMMIT"
          test "$(make -s kernelversion)" = "$TARGET_VERSION"
          export GIT_AUTHOR_DATE="2024-04-18T11:05:25Z"
          export GIT_COMMITTER_DATE="2024-04-18T11:05:25Z"
          git commit -m "CLEAN BASELINE: merge android11-5.4.274_r00 into VEUX 5.4.268"
          test "$(git rev-parse HEAD)" = "$EXPECTED_P0_MERGE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P0_MERGE_TREE"
          {
            echo "P0_RECONSTRUCTION=PASS"
            echo "P0_COMMIT=$(git rev-parse HEAD)"
            echo "P0_TREE=$(git rev-parse HEAD^{tree})"
          } > "$GITHUB_WORKSPACE/evidence/01-P0.txt"

      - name: 05 - Download exact accepted P4-v7 PASS artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.P4_ARTIFACT_NAME }}
          path: p4-artifact
          github-token: ${{ github.token }}
          run-id: ${{ env.P4_PASS_RUN_ID }}
          repository: Chrizz100/veux-resukisu-builder

      - name: 06 - Authenticate exact P4-v7 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P4_AUTH" > evidence/STAGE.txt
          for dir in evidence restore-kit build-artifacts; do
            test -s "p4-artifact/$dir/SHA256SUMS"
            (cd "p4-artifact/$dir" && sha256sum -c SHA256SUMS) > "evidence/02-P4-${dir}-SHA256.txt"
          done
          grep -Fxq 'TECHNICAL_PASS=YES' p4-artifact/evidence/98-FINAL-STATUS.txt
          grep -Fxq 'CHECKPOINT=KSU-GEN1-P4-SAFE-STAT-FACCESSAT-FILENAME-BRIDGE-PASS' p4-artifact/evidence/98-FINAL-STATUS.txt
          grep -Fxq 'KERNEL_BUILD_PERFORMED=YES' p4-artifact/evidence/98-FINAL-STATUS.txt
          test "$(sha256sum p4-artifact/build-artifacts/Image | awk '{print $1}')" = "$EXPECTED_P4_IMAGE_SHA256"
          test "$(sha256sum p4-artifact/build-artifacts/config | awk '{print $1}')" = "$EXPECTED_P4_CONFIG_SHA256"
          test "$(sha256sum p4-artifact/build-artifacts/veux.dtb | awk '{print $1}')" = "$EXPECTED_P4_DTB_SHA256"
          jq -e --arg ksu "$KSU_COMMIT" --arg sus "$SUSFS_SOURCE_COMMIT" \
            --arg img "$EXPECTED_P4_IMAGE_SHA256" --arg cfg "$EXPECTED_P4_CONFIG_SHA256" --arg dtb "$EXPECTED_P4_DTB_SHA256" \
            '.stage == "KSU-GEN1-P4-v7" and .kernelsu_head == $ksu and .susfs_source_head == $sus and
             .image_sha256 == $img and .config_sha256 == $cfg and .veux_dtb_sha256 == $dtb and
             .config_ksu_susfs == true and .susfs_feature_suboptions_enabled == 0 and
             .stat_faccessat_struct_filename_bridge == true and .raw_user_pointer_reinterpret_cast == false and
             .filename_owner_ref_across_retry == true and .filename_lookup_extra_ref_per_attempt == true and
             .namei_changed == false and .proc_changed == false and .namespace_changed == false and
             .open_redirect_active == false and .user_command_dispatch_integrated == false and
             .kernel_build_performed == true and .device_accessed == false and .flashing_performed == false' \
            p4-artifact/restore-kit/manifest.json > evidence/02-P4-MANIFEST-AUTH.json
          test -s p4-artifact/restore-kit/p0-to-p4-outer-full.patch
          test -s p4-artifact/restore-kit/p4-kernelsu-0.9.5-full-bridge.patch
          echo "P4_ACCEPTED_ARTIFACT_AUTH=PASS" > evidence/02-P4-AUTH.txt

      - name: 07 - Restore exact P4-v7 source with authenticated patch changeset gate
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P4_SOURCE_RESTORE" > evidence/STAGE.txt
          cd kernel
          outer="$GITHUB_WORKSPACE/p4-artifact/restore-kit/p0-to-p4-outer-full.patch"
          ksup="$GITHUB_WORKSPACE/p4-artifact/restore-kit/p4-kernelsu-0.9.5-full-bridge.patch"

          # v1 already authenticated both P4 restore patches through the P4
          # SHA256SUMS.  The v1 failure came only from regenerating a fresh
          # textual git diff and requiring byte-for-byte identity with the
          # archived patch.  That is not a source-identity requirement.
          #
          # v2 instead proves:
          #   exact P0 parent + authenticated patch + clean applicability
          #   + successful application + exact changed-path set.
          git apply --check --binary "$outer"
          git apply --binary "$outer"

          git clone --filter=blob:none https://github.com/tiann/KernelSU.git KernelSU
          git -C KernelSU checkout --detach "$KSU_COMMIT"
          test "$(git -C KernelSU rev-parse HEAD)" = "$KSU_COMMIT"
          ksu_count="$(git -C KernelSU rev-list --count HEAD)"
          test "$((10000 + ksu_count + 200))" = "$KSU_EXPECTED_VERSION"

          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
          test "$(realpath drivers/kernelsu)" = "$(realpath KernelSU/kernel)"

          mkdir -p .git/info
          touch .git/info/exclude
          grep -Fxq '/KernelSU/' .git/info/exclude || echo '/KernelSU/' >> .git/info/exclude

          git -C KernelSU apply --check --binary "$ksup"
          git -C KernelSU apply --binary "$ksup"

          # Compare the exact path sets represented by each authenticated
          # patch with the source tree changes after application.  Sorting
          # intentionally removes irrelevant textual diff ordering.
          awk '/^diff --git a\// {p=$3; sub(/^a\//,"",p); print p}' "$outer"             | LC_ALL=C sort -u > "$RUNNER_TEMP/p4-outer-expected-paths.txt"
          {
            git diff --name-only "$EXPECTED_P0_MERGE_COMMIT" --
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | LC_ALL=C sort -u > "$RUNNER_TEMP/p4-outer-actual-paths.txt"
          diff -u "$RUNNER_TEMP/p4-outer-expected-paths.txt"                   "$RUNNER_TEMP/p4-outer-actual-paths.txt"

          awk '/^diff --git a\// {p=$3; sub(/^a\//,"",p); print p}' "$ksup"             | LC_ALL=C sort -u > "$RUNNER_TEMP/p4-ksu-expected-paths.txt"
          {
            git -C KernelSU diff --name-only "$KSU_COMMIT" --
            git -C KernelSU ls-files --others --exclude-standard
          } | sed '/^$/d' | LC_ALL=C sort -u > "$RUNNER_TEMP/p4-ksu-actual-paths.txt"
          diff -u "$RUNNER_TEMP/p4-ksu-expected-paths.txt"                   "$RUNNER_TEMP/p4-ksu-actual-paths.txt"

          cp "$RUNNER_TEMP/p4-outer-expected-paths.txt"              "$GITHUB_WORKSPACE/evidence/03-P4-OUTER-EXPECTED-PATHS.txt"
          cp "$RUNNER_TEMP/p4-outer-actual-paths.txt"              "$GITHUB_WORKSPACE/evidence/03-P4-OUTER-ACTUAL-PATHS.txt"
          cp "$RUNNER_TEMP/p4-ksu-expected-paths.txt"              "$GITHUB_WORKSPACE/evidence/03-P4-KSU-EXPECTED-PATHS.txt"
          cp "$RUNNER_TEMP/p4-ksu-actual-paths.txt"              "$GITHUB_WORKSPACE/evidence/03-P4-KSU-ACTUAL-PATHS.txt"

          mkdir -p "$RUNNER_TEMP/p4-parent/outer" "$RUNNER_TEMP/p4-parent/ksu"
          cp fs/susfs.c "$RUNNER_TEMP/p4-parent/outer/susfs.c"
          cp kernel/sys.c "$RUNNER_TEMP/p4-parent/outer/sys.c"
          cp KernelSU/kernel/Kconfig "$RUNNER_TEMP/p4-parent/ksu/Kconfig"
          cp KernelSU/kernel/core_hook.c "$RUNNER_TEMP/p4-parent/ksu/core_hook.c"

          sha256sum fs/stat.c fs/open.c KernelSU/kernel/sucompat.c             > "$RUNNER_TEMP/p4-filename-bridge.sha256"
          cp "$RUNNER_TEMP/p4-filename-bridge.sha256"              "$GITHUB_WORKSPACE/evidence/03-P4-FILENAME-BRIDGE-BEFORE.txt"

          {
            echo "P4_SOURCE_RESTORE=PASS"
            echo "P4_OUTER_AUTHENTICATED_PATCH_APPLY=PASS"
            echo "P4_KSU_AUTHENTICATED_PATCH_APPLY=PASS"
            echo "P4_OUTER_CHANGESET_GATE=PASS"
            echo "P4_KSU_CHANGESET_GATE=PASS"
            echo "P4_CHANGESET_GATE_TRACKED_PLUS_UNTRACKED=YES"
            echo "P5_V1_REGENERATED_DIFF_BYTE_CMP=REMOVED"
            echo "P5_V2_FAILURE_UNTRACKED_PATH_OMISSION=FIXED"
            echo "P5_V3_SOURCE_INTEGRATION_CHANGED_FROM_V2=NO"
          } > "$GITHUB_WORKSPACE/evidence/03-P4-SOURCE-RESTORE.txt"

      - name: 08 - Audit and activate root-only SPOOF_UNAME userspace path
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P5_SOURCE_ACTIVATION" > evidence/STAGE.txt
          cd kernel
          python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/04-P5-PRE-AUDIT.txt"
          from pathlib import Path
          sus=Path("fs/susfs.c").read_text(); hdr=Path("include/linux/susfs.h").read_text(); defs=Path("include/linux/susfs_def.h").read_text()
          sysc=Path("kernel/sys.c").read_text(); core=Path("KernelSU/kernel/core_hook.c").read_text(); cfg=Path("KernelSU/kernel/Kconfig").read_text()
          checks={
            "P4_KSU_SUSFS_CONFIG":"config KSU_SUSFS" in cfg,
            "SET_UNAME_SOURCE":"void susfs_set_uname(void __user **user_info)" in sus,
            "SPOOF_UNAME_SOURCE":"void susfs_spoof_uname(struct new_utsname* tmp)" in sus,
            "SPOOF_UNAME_HEADER":"void susfs_spoof_uname(struct new_utsname* tmp);" in hdr,
            "SET_UNAME_CMD":"#define CMD_SUSFS_SET_UNAME 0x55590" in defs,
            "SHOW_VERSION_CMD":"#define CMD_SUSFS_SHOW_VERSION 0x555e1" in defs,
            "SHOW_FEATURES_CMD":"#define CMD_SUSFS_SHOW_ENABLED_FEATURES 0x555e2" in defs,
            "SHOW_VARIANT_CMD":"#define CMD_SUSFS_SHOW_VARIANT 0x555e3" in defs,
            "STATIC_KEY":"DEFINE_STATIC_KEY_FALSE(susfs_is_uname_spoof_buffer_set);" in sus,
            "NEWUNAME_ANCHOR":"SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)" in sysc,
            "NEWUNAME_MEMCPY_ANCHOR":"memcpy(&tmp, utsname(), sizeof(tmp));" in sysc,
            "OLD_KSU_PRCTL":"int ksu_handle_prctl(int option, unsigned long arg2" in core,
            "ROOT_MANAGER_GATE":"if (!from_root && !from_manager)" in core,
            "NO_EXISTING_DISPATCH":"ksu_handle_susfs_command" not in core,
          }
          for k,v in checks.items(): print(f"{k}={'PASS' if v else 'FAIL'}")
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit("P5 prereq failure: "+",".join(bad))
          print("P5_PRE_ACTIVATION_AUDIT=PASS")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("KernelSU/kernel/Kconfig"); t=p.read_text()
          if "config KSU_SUSFS_SPOOF_UNAME" in t: raise SystemExit("config already present")
          if t.count("\nendmenu\n") != 1: raise SystemExit("Kconfig endmenu mismatch")
          block='''
          config KSU_SUSFS_SPOOF_UNAME
          \tbool "SUSFS: spoof uname release/version"
          \tdepends on KSU_SUSFS
          \tdefault n
          \thelp
          \t  Enable only the SUSFS uname release/version spoofing path.
          \t  P5-v1 keeps all other SUSFS feature sub-options disabled.

          '''
          t=t.replace("\nendmenu\n", "\n"+block+"endmenu\n", 1); p.write_text(t)

          p=Path("KernelSU/kernel/core_hook.c"); t=p.read_text()
          inc='#include <linux/mount.h>\n'
          if t.count(inc)!=1: raise SystemExit("core_hook include mismatch")
          t=t.replace(inc, inc+'\n#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif\n',1)
          fn="int ksu_handle_prctl(int option, unsigned long arg2, unsigned long arg3,\n"
          if t.count(fn)!=1: raise SystemExit("prctl anchor mismatch")
          helper='''#ifdef CONFIG_KSU_SUSFS
          static bool ksu_handle_susfs_command(unsigned long cmd, unsigned long user_arg)
          {
          \tvoid __user *user_info = (void __user *)user_arg;

          \tswitch (cmd) {
          #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME
          \tcase CMD_SUSFS_SET_UNAME:
          \t\tsusfs_set_uname(&user_info);
          \t\treturn true;
          #endif
          \tcase CMD_SUSFS_SHOW_VERSION:
          \t\tsusfs_show_version(&user_info);
          \t\treturn true;
          \tcase CMD_SUSFS_SHOW_ENABLED_FEATURES:
          \t\tsusfs_get_enabled_features(&user_info);
          \t\treturn true;
          \tcase CMD_SUSFS_SHOW_VARIANT:
          \t\tsusfs_show_variant(&user_info);
          \t\treturn true;
          \tdefault:
          \t\treturn false;
          \t}
          }
          #endif

          '''
          t=t.replace(fn,helper+fn,1)
          gate='''\tif (!from_root && !from_manager) {
          \t\t// only root or manager can access this interface
          \t\treturn 0;
          \t}

          '''
          if t.count(gate)!=1: raise SystemExit("root gate mismatch")
          t=t.replace(gate,gate+'''#ifdef CONFIG_KSU_SUSFS
          \t/* SUSFS control is root-only in P5-v1. */
          \tif (from_root && ksu_handle_susfs_command(arg2, arg3))
          \t\treturn 0;
          #endif

          ''',1); p.write_text(t)

          p=Path("kernel/sys.c"); t=p.read_text(); inc='#include <linux/uaccess.h>\n'
          if t.count(inc)!=1: raise SystemExit("sys.c include mismatch")
          t=t.replace(inc,inc+'#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif\n',1)

          fn_sig="SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)"
          if t.count(fn_sig)!=1: raise SystemExit("newuname function count mismatch")
          fn_start=t.index(fn_sig)
          fn_end=t.index("\n}\n",fn_start)+3
          fn=t[fn_start:fn_end]

          memcpy_anchor="\tmemcpy(&tmp, utsname(), sizeof(tmp));\n"
          if fn.count(memcpy_anchor)!=1: raise SystemExit("newuname memcpy anchor mismatch")
          if "susfs_spoof_uname(&tmp);" in fn: raise SystemExit("newuname SUSFS hook unexpectedly already present")
          hook=(memcpy_anchor+"#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tsusfs_spoof_uname(&tmp);\n#endif\n")
          fn=fn.replace(memcpy_anchor,hook,1)

          if fn.count("susfs_spoof_uname(&tmp);")!=1: raise SystemExit("newuname hook insertion count mismatch")
          if fn.index("susfs_spoof_uname(&tmp);") < fn.index("memcpy(&tmp, utsname(), sizeof(tmp));"):
              raise SystemExit("newuname hook before memcpy")
          if "\tup_read(&uts_sem);" in fn and fn.index("susfs_spoof_uname(&tmp);") > fn.index("\tup_read(&uts_sem);"):
              raise SystemExit("newuname hook after uts_sem unlock")

          t=t[:fn_start]+fn+t[fn_end:]
          p.write_text(t)

          p=Path("fs/susfs.c"); t=p.read_text()
          old='''void susfs_spoof_uname(struct new_utsname* tmp) {
          \tunsigned seq;

          \tdo {
          '''
          if t.count(old)!=1: raise SystemExit("spoof_uname anchor mismatch")
          new='''void susfs_spoof_uname(struct new_utsname* tmp) {
          \tunsigned seq;

          \tif (!tmp || !static_key_enabled(&susfs_is_uname_spoof_buffer_set))
          \t\treturn;

          \tdo {
          '''
          t=t.replace(old,new,1); p.write_text(t)
          PY
          # Do not run git diff --check over the full imported fs/susfs.c:
          # the exact pinned SUSFS source intentionally retains upstream whitespace
          # already authenticated in P2. Validate only newly clean outer sys.c here;
          # the inserted susfs.c guard is checked structurally below.
          git diff --check -- kernel/sys.c
          git -C KernelSU diff --check -- kernel/Kconfig kernel/core_hook.c
          python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/05-P5-SOURCE-AUDIT.txt"
          from pathlib import Path
          import re
          sysc=Path("kernel/sys.c").read_text(); sus=Path("fs/susfs.c").read_text(); core=Path("KernelSU/kernel/core_hook.c").read_text(); cfg=Path("KernelSU/kernel/Kconfig").read_text()
          assert cfg.count("config KSU_SUSFS_SPOOF_UNAME")==1
          assert "if (from_root && ksu_handle_susfs_command(arg2, arg3))" in core
          start=core.index("static bool ksu_handle_susfs_command"); end=core.index("int ksu_handle_prctl",start); block=core[start:end]
          seen=set(re.findall(r"case (CMD_SUSFS_[A-Z0-9_]+):",block))
          expected={"CMD_SUSFS_SET_UNAME","CMD_SUSFS_SHOW_VERSION","CMD_SUSFS_SHOW_ENABLED_FEATURES","CMD_SUSFS_SHOW_VARIANT"}
          if seen != expected: raise SystemExit(f"dispatch set mismatch: {seen}")
          assert sysc.count("susfs_spoof_uname(&tmp);")==1
          fn_start=sysc.index("SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)")
          fn_end=sysc.index("\n}\n",fn_start)+3
          newuname=sysc[fn_start:fn_end]
          assert newuname.index("memcpy(&tmp, utsname(), sizeof(tmp));") < newuname.index("susfs_spoof_uname(&tmp);")
          if "\tup_read(&uts_sem);" in newuname:
              assert newuname.index("susfs_spoof_uname(&tmp);") < newuname.index("\tup_read(&uts_sem);")
          guard="if (!tmp || !static_key_enabled(&susfs_is_uname_spoof_buffer_set))"
          assert sus.count(guard)==1
          fn=sus[sus.index("void susfs_spoof_uname("):]
          assert fn.index(guard) < fn.index("read_seqbegin")
          print("P5_DISPATCH_PERMISSION=ROOT_ONLY")
          print("P5_DISPATCH_COMMAND_COUNT=4")
          print("P5_UNSET_UNAME_BUFFER_GUARD=PASS")
          print("P5_NEWUNAME_HOOK_AFTER_MEMCPY=PASS")
          print("P5_NEWUNAME_VENDOR_LOGIC_TOLERANCE=PASS")
          print("P5_SOURCE_ACTIVATION=PASS")
          PY

