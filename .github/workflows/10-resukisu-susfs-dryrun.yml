name: 10 - VEUX ReSukiSU SUSFS 5.4 Integration Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  susfs-dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ARCH: arm64
      COMMON_REF: "android11-5.4.274_r00"
      STABILITY_REVERT: "f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80"
      CASS_COMMIT_DO_NOT_REVERT: "b9b5ddba28bf9f23ac1a2af27f574291451244fd"
      RESUKISU_COMMIT: "faccf4c5edc7be37776216e7d43dd3dca0239331"
      SUSFS_COMMIT: "001e69919c6271f690fd00b17e4c721c9e599152"
      OUT_DIR: out
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      SUSFS_DIR: ${{ github.workspace }}/susfs4ksu

    steps:
      - name: Prepare audit directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"

          {
            echo "VEUX 5.4.274 ReSukiSU + SUSFS integration dry run"
            echo "Started: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Stability Candidate: Candidate 2"
            echo "ReSukiSU: $RESUKISU_COMMIT"
            echo "SUSFS kernel-5.4 source: $SUSFS_COMMIT"
            echo "Target hook mode: SUSFS Inline Hook"
            echo "CASS intentionally NOT reverted: $CASS_COMMIT_DO_NOT_REVERT"
            echo "No kernel Image will be compiled"
            echo "No boot.img will be created"
            echo "Nothing will be flashed"
          } > "$ARTIFACT_DIR/DRYRUN-INFO.txt"

      - name: Install dry-run dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            patch \
            python3

      - name: Checkout VEUX source
        uses: actions/checkout@v6
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: "20240619"
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Prepare Candidate 2 and pinned ReSukiSU
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BASE_SHA="$(git rev-parse HEAD)"

          git remote remove android-common 2>/dev/null || true

          git remote add \
            android-common \
            https://android.googlesource.com/kernel/common

          git fetch \
            --no-tags \
            android-common \
            "$COMMON_REF"

          git merge \
            --no-edit \
            FETCH_HEAD

          if ! git cat-file -e "${STABILITY_REVERT}^{commit}" 2>/dev/null; then
            echo "ERROR: Candidate 2 revert commit unavailable"
            exit 1
          fi

          git revert \
            --no-edit \
            "$STABILITY_REVERT"

          KERNEL_VERSION="$(make -s kernelversion)"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE_SHA="$(git rev-parse HEAD^{tree})"

          if [ "$KERNEL_VERSION" != "5.4.274" ]; then
            echo "ERROR: expected Linux 5.4.274, got $KERNEL_VERSION"
            exit 1
          fi

          {
            echo "BASE_SHA=$BASE_SHA"
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "CANDIDATE_TREE_SHA=$CANDIDATE_TREE_SHA"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "STABILITY_REVERT=$STABILITY_REVERT"
            echo "CASS_COMMIT_DO_NOT_REVERT=$CASS_COMMIT_DO_NOT_REVERT"
          } | tee "$ARTIFACT_DIR/candidate2.txt"

          MATCHES="$(
            grep -RInE \
              --exclude-dir=.git \
              --exclude-dir=out \
              --exclude-dir=kernelsu \
              --include='*.c' \
              --include='*.h' \
              --include='Kconfig*' \
              --include='Makefile*' \
              --include='*.mk' \
              '(^|[^A-Za-z0-9_])(CONFIG_KSU_SUSFS|CONFIG_SUSFS|susfs_[A-Za-z0-9_]+|SUSFS_VERSION|susfs\.h)([^A-Za-z0-9_]|$)' \
              fs \
              include \
              kernel \
              security \
              mm \
              drivers \
              2>/dev/null || true
          )"

          if [ -n "$MATCHES" ]; then
            printf '%s\n' "$MATCHES" \
              | tee "$ARTIFACT_DIR/PRE-SUSFS-GUARD.txt"

            echo "ERROR: pre-existing kernel-side SUSFS detected"
            exit 1
          fi

          echo "No existing SUSFS kernel-side backport detected." \
            | tee "$ARTIFACT_DIR/PRE-SUSFS-GUARD.txt"

          if [ ! -d drivers/kernelsu ]; then
            echo "ERROR: legacy drivers/kernelsu not found"
            exit 1
          fi

          find drivers/kernelsu -type f \
            | sort \
            > "$ARTIFACT_DIR/legacy-kernelsu-files.txt"

          rm -rf \
            drivers/kernelsu \
            KernelSU

          git clone \
            https://github.com/ReSukiSU/ReSukiSU.git \
            KernelSU

          git -C KernelSU checkout \
            --detach \
            "$RESUKISU_COMMIT"

          ACTUAL_KSU="$(git -C KernelSU rev-parse HEAD)"

          if [ "$ACTUAL_KSU" != "$RESUKISU_COMMIT" ]; then
            echo "ERROR: ReSukiSU commit mismatch"
            echo "Expected: $RESUKISU_COMMIT"
            echo "Actual:   $ACTUAL_KSU"
            exit 1
          fi

          ln -s \
            ../KernelSU/kernel \
            drivers/kernelsu

          if [ "$(readlink -f drivers/kernelsu)" != "$(readlink -f KernelSU/kernel)" ]; then
            echo "ERROR: drivers/kernelsu does not resolve to pinned ReSukiSU/kernel"
            exit 1
          fi

          grep -q \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          grep -qF \
            'config KSU_SUSFS' \
            KernelSU/kernel/Kconfig

          grep -qF \
            'config KSU_MANUAL_HOOK' \
            KernelSU/kernel/Kconfig

          grep -qF \
            'include $(KSU_SRC)/tools/inline_hook_check.mk' \
            KernelSU/kernel/Kbuild

          echo "$ACTUAL_KSU" \
            > "$ARTIFACT_DIR/resukisu-commit.txt"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("security/selinux/selinuxfs.c")
          s = p.read_text()

          replacements = [
              (
                  "static const struct file_operations sel_handle_status_ops = {",
                  "const struct file_operations sel_handle_status_ops = {",
              ),
              (
                  "static ssize_t (*const write_op[])(struct file *, char *, size_t) = {",
                  "ssize_t (*const write_op[])(struct file *, char *, size_t) = {",
              ),
          ]

          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(
                      f"expected exactly one occurrence: {old!r}"
                  )

              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          grep -qE \
            '^[[:space:]]*const[[:space:]]+struct[[:space:]]+file_operations[[:space:]]+sel_handle_status_ops' \
            security/selinux/selinuxfs.c

          grep -qE \
            '^[[:space:]]*ssize_t[[:space:]]+\(\*const[[:space:]]+write_op\[\]\)' \
            security/selinux/selinuxfs.c

          {
            echo "write_op: link-visible"
            echo "sel_handle_status_ops: link-visible"
            echo "CONFIG_DEBUG_KERNEL remains disabled"
            echo "CONFIG_KALLSYMS_ALL remains disabled"
          } > "$ARTIFACT_DIR/STATIC-SYMBOL-POLICY.txt"

      - name: Fetch and strict-test official SUSFS 5.4 patch
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$SUSFS_DIR"

          git init "$SUSFS_DIR"

          git -C "$SUSFS_DIR" remote add \
            origin \
            https://gitlab.com/simonpunk/susfs4ksu.git

          git -C "$SUSFS_DIR" fetch \
            --depth=1 \
            origin \
            kernel-5.4

          git -C "$SUSFS_DIR" checkout \
            --detach \
            FETCH_HEAD

          ACTUAL_SUSFS="$(
            git -C "$SUSFS_DIR" rev-parse HEAD
          )"

          if [ "$ACTUAL_SUSFS" != "$SUSFS_COMMIT" ]; then
            echo "ERROR: SUSFS branch moved from pinned commit"
            echo "Expected: $SUSFS_COMMIT"
            echo "Actual:   $ACTUAL_SUSFS"
            exit 1
          fi

          KERNEL_PATCH="$SUSFS_DIR/kernel_patches/50_add_susfs_in_kernel-5.4.patch"

          KSU_PATCH="$SUSFS_DIR/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          if [ ! -s "$KERNEL_PATCH" ]; then
            echo "ERROR: missing SUSFS 5.4 kernel patch"
            exit 1
          fi

          if [ ! -s "$KSU_PATCH" ]; then
            echo "ERROR: missing upstream KernelSU SUSFS patch"
            exit 1
          fi

          if [ ! -d "$SUSFS_DIR/kernel_patches/fs" ]; then
            echo "ERROR: missing SUSFS fs source directory"
            exit 1
          fi

          if [ ! -d "$SUSFS_DIR/kernel_patches/include/linux" ]; then
            echo "ERROR: missing SUSFS include/linux source directory"
            exit 1
          fi

          {
            echo "SUSFS_COMMIT=$ACTUAL_SUSFS"
            echo "KERNEL_PATCH_SHA256=$(sha256sum "$KERNEL_PATCH" | awk '{print $1}')"
            echo "UPSTREAM_KSU_PATCH_SHA256=$(sha256sum "$KSU_PATCH" | awk '{print $1}')"
            echo "UPSTREAM_KSU_PATCH_APPLIED=NO"
            echo "Pinned ReSukiSU already provides KSU_SUSFS mode and inline-hook checks."
          } | tee "$ARTIFACT_DIR/SUSFS-SOURCE.txt"

          cp \
            "$KERNEL_PATCH" \
            "$ARTIFACT_DIR/50_add_susfs_in_kernel-5.4.patch"

          cp \
            "$KSU_PATCH" \
            "$ARTIFACT_DIR/10_enable_susfs_for_ksu-UPSTREAM-REFERENCE.patch"

          find \
            "$SUSFS_DIR/kernel_patches/fs" \
            "$SUSFS_DIR/kernel_patches/include/linux" \
            -type f \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$ARTIFACT_DIR/SUSFS-UPSTREAM-FILES-SHA256.txt"

          cp -av \
            "$SUSFS_DIR/kernel_patches/fs/." \
            fs/ \
            | tee "$ARTIFACT_DIR/SUSFS-COPY-FS.log"

          cp -av \
            "$SUSFS_DIR/kernel_patches/include/linux/." \
            include/linux/ \
            | tee "$ARTIFACT_DIR/SUSFS-COPY-INCLUDE.log"

          if [ ! -s fs/susfs.c ]; then
            echo "ERROR: fs/susfs.c was not copied"
            exit 1
          fi

          if [ ! -s include/linux/susfs.h ]; then
            echo "ERROR: include/linux/susfs.h was not copied"
            exit 1
          fi

          grep -E \
            '^#define[[:space:]]+SUSFS_VERSION' \
            include/linux/susfs.h \
            | tee "$ARTIFACT_DIR/SUSFS-VERSION.txt" \
            || true

          find \
            fs \
            include/linux \
            -maxdepth 1 \
            -type f \
            \( -name 'susfs*' -o -name '*susfs*' \) \
            -print \
            | sort \
            > "$ARTIFACT_DIR/SUSFS-INSTALLED-FILES.txt"

          set +e

          patch \
            --dry-run \
            --forward \
            --fuzz=0 \
            -p1 \
            < "$KERNEL_PATCH" \
            > "$ARTIFACT_DIR/SUSFS-PATCH-DRYRUN.log" \
            2>&1

          PATCH_RC=$?

          set -e

          echo "$PATCH_RC" \
            > "$ARTIFACT_DIR/SUSFS-PATCH-DRYRUN.exit-code"

          cat "$ARTIFACT_DIR/SUSFS-PATCH-DRYRUN.log"

          if [ "$PATCH_RC" -ne 0 ]; then
            {
              echo "RESULT: NEEDS_ADAPTATION"
              echo "Official kernel-5.4 SUSFS patch did not apply cleanly with fuzz=0."
              echo "No kernel build was attempted."
              echo "No boot.img was created."
              echo "Nothing was flashed."
            } > "$ARTIFACT_DIR/SUSFS-DRYRUN-SUMMARY.txt"

            exit 42
          fi

          echo "Official kernel-5.4 SUSFS patch applies cleanly with fuzz=0." \
            | tee "$ARTIFACT_DIR/SUSFS-PATCH-COMPATIBILITY.txt"

          patch \
            --forward \
            --fuzz=0 \
            -p1 \
            < "$KERNEL_PATCH" \
            2>&1 \
            | tee "$ARTIFACT_DIR/SUSFS-PATCH-APPLY.log"

          git status --short \
            | tee "$ARTIFACT_DIR/git-status-after-susfs.txt"

          git diff \
            --no-ext-diff \
            --no-color \
            > "$ARTIFACT_DIR/SUSFS-TRACKED.diff"

          git diff \
            --stat \
            > "$ARTIFACT_DIR/SUSFS-TRACKED.diffstat"

      - name: Resolve SUSFS Inline Hook config and audit callsites
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="arch/arm64/configs/veux_defconfig"

          if grep -Eq \
            '^CONFIG_KSU=|^CONFIG_KSU_(TRACEPOINT_HOOK|MANUAL_HOOK|SUSFS)=' \
            "$DEFCONFIG"
          then
            echo "ERROR: unexpected pre-existing KSU hook selection in Candidate 2 defconfig"

            grep -E \
              '^CONFIG_KSU=|^CONFIG_KSU_' \
              "$DEFCONFIG" \
              || true

            exit 1
          fi

          cat >> "$DEFCONFIG" <<'EOF'

          # ReSukiSU 5.4 SUSFS Inline Hook dry-run
          # CONFIG_DEBUG_KERNEL is not set
          CONFIG_KSU=y
          # CONFIG_KSU_TRACEPOINT_HOOK is not set
          # CONFIG_KSU_MANUAL_HOOK is not set
          CONFIG_KSU_SUSFS=y
          EOF

          tail -n 12 \
            "$DEFCONFIG" \
            | tee "$ARTIFACT_DIR/veux-defconfig-susfs-tail.txt"

          rm -rf "$OUT_DIR"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            veux_defconfig \
            2>&1 \
            | tee "$ARTIFACT_DIR/defconfig.log"

          CONFIG="$OUT_DIR/.config"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: resolved config not generated"
            exit 1
          fi

          require_y() {
            local symbol="$1"

            if ! grep -qx "$symbol=y" "$CONFIG"; then
              echo "ERROR: $symbol did not resolve to y"

              grep -E \
                "^$symbol=|^# $symbol is not set$" \
                "$CONFIG" \
                || true

              exit 1
            fi

            echo "OK: $symbol=y"
          }

          reject_y() {
            local symbol="$1"

            if grep -qx "$symbol=y" "$CONFIG"; then
              echo "ERROR: $symbol=y must not be active"
              exit 1
            fi

            echo "OK: $symbol is not active as y"
          }

          require_y CONFIG_64BIT
          require_y CONFIG_THREAD_INFO_IN_TASK
          require_y CONFIG_KALLSYMS
          require_y CONFIG_KSU
          require_y CONFIG_KSU_SUSFS

          reject_y CONFIG_KSU_TRACEPOINT_HOOK
          reject_y CONFIG_KSU_MANUAL_HOOK
          reject_y CONFIG_DEBUG_KERNEL
          reject_y CONFIG_KALLSYMS_ALL

          for symbol in \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_ENABLE_LOG \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_MAP
          do
            require_y "$symbol"
          done

          cp \
            "$CONFIG" \
            "$ARTIFACT_DIR/resolved-veux-susfs.config"

          grep -E \
            '^(CONFIG_64BIT=|CONFIG_THREAD_INFO_IN_TASK=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=|# CONFIG_KALLSYMS_ALL|CONFIG_DEBUG_KERNEL=|# CONFIG_DEBUG_KERNEL|CONFIG_KSU=|CONFIG_KSU_TRACEPOINT_HOOK=|# CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_KSU_MANUAL_HOOK=|# CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS=|CONFIG_KSU_SUSFS_)' \
            "$CONFIG" \
            > "$ARTIFACT_DIR/resolved-susfs-config-important.txt"

          REPORT="$ARTIFACT_DIR/SUSFS-INLINE-HOOK-AUDIT.txt"

          : > "$REPORT"

          REQUIRED=(
            "ksu_handle_setresuid:kernel/sys.c"
            "ksu_handle_execveat:fs/exec.c"
            "ksu_handle_faccessat:fs/open.c"
            "ksu_handle_sys_read:fs/read_write.c"
            "ksu_handle_stat:fs/stat.c"
            "ksu_handle_sys_reboot:kernel/reboot.c"
            "ksu_handle_input_handle_event:drivers/input/input.c"
          )

          for entry in "${REQUIRED[@]}"; do
            hook="${entry%%:*}"
            file="${entry#*:}"

            if ! grep -wq "$hook" "$file"; then
              echo "MISSING $hook $file" \
                | tee -a "$REPORT"

              exit 1
            fi

            echo "FOUND   $hook   $file" \
              | tee -a "$REPORT"
          done

          INCOMPATIBLE=(
            "ksu_vfs_read_hook:fs/read_write.c"
            "ksu_input_hook:drivers/input/input.c"
            "ksu_execveat_hook:fs/exec.c"
            "ksu_init_rc_hook:fs/read_write.c"
            "ksu_init_rc_hook:fs/stat.c"
          )

          for entry in "${INCOMPATIBLE[@]}"; do
            hook="${entry%%:*}"
            file="${entry#*:}"

            if grep -wq "$hook" "$file"; then
              echo "INCOMPATIBLE $hook $file" \
                | tee -a "$REPORT"

              exit 1
            fi

            echo "ABSENT  $hook   $file" \
              | tee -a "$REPORT"
          done

          MANUAL_GUARD_COUNT=0

          for file in \
            kernel/sys.c \
            fs/exec.c \
            fs/open.c \
            fs/read_write.c \
            fs/stat.c \
            kernel/reboot.c \
            drivers/input/input.c
          do
            if grep -wq \
              'CONFIG_KSU_MANUAL_HOOK' \
              "$file"
            then
              echo "WARNING manual-hook guard remains in $file" \
                | tee -a "$REPORT"

              MANUAL_GUARD_COUNT=$((MANUAL_GUARD_COUNT + 1))
            fi
          done

          echo "MANUAL_GUARD_COUNT=$MANUAL_GUARD_COUNT" \
            | tee -a "$REPORT"

          grep -RhoE \
            'CONFIG_KSU_SUSFS_[A-Z0-9_]+' \
            fs \
            include \
            security \
            kernel \
            drivers/input \
            2>/dev/null \
            | sort -u \
            > "$ARTIFACT_DIR/SUSFS-KERNEL-REFERENCED-CONFIGS.txt" \
            || true

          awk \
            '/^config KSU_SUSFS_/ {print "CONFIG_" $2}' \
            KernelSU/kernel/Kconfig \
            | sort -u \
            > "$ARTIFACT_DIR/RESUKISU-DEFINED-SUSFS-CONFIGS.txt"

          comm \
            -23 \
            "$ARTIFACT_DIR/SUSFS-KERNEL-REFERENCED-CONFIGS.txt" \
            "$ARTIFACT_DIR/RESUKISU-DEFINED-SUSFS-CONFIGS.txt" \
            > "$ARTIFACT_DIR/SUSFS-CONFIGS-NOT-DEFINED-BY-RESUKISU.txt" \
            || true

          {
            echo "Kernel-side SUSFS config references:"
            cat "$ARTIFACT_DIR/SUSFS-KERNEL-REFERENCED-CONFIGS.txt"

            echo
            echo "Pinned ReSukiSU SUSFS config definitions:"
            cat "$ARTIFACT_DIR/RESUKISU-DEFINED-SUSFS-CONFIGS.txt"

            echo
            echo "Kernel-side symbols not defined by pinned ReSukiSU Kconfig:"

            if [ -s "$ARTIFACT_DIR/SUSFS-CONFIGS-NOT-DEFINED-BY-RESUKISU.txt" ]; then
              cat "$ARTIFACT_DIR/SUSFS-CONFIGS-NOT-DEFINED-BY-RESUKISU.txt"
            else
              echo "NONE"
            fi
          } > "$ARTIFACT_DIR/SUSFS-CONFIG-COMPATIBILITY.txt"

          SUSFS_VERSION="$(
            grep -E \
              '^#define[[:space:]]+SUSFS_VERSION' \
              include/linux/susfs.h \
              | head -n1 \
              | sed -E \
                's/.*SUSFS_VERSION[[:space:]]+"?([^"[:space:]]+)"?.*/\1/' \
              || true
          )"

          CONFIG_SHA="$(
            sha256sum "$CONFIG" \
              | awk '{print $1}'
          )"

          PATCH_SHA="$(
            sha256sum \
              "$SUSFS_DIR/kernel_patches/50_add_susfs_in_kernel-5.4.patch" \
              | awk '{print $1}'
          )"

          {
            echo "VEUX 5.4.274 ReSukiSU SUSFS Integration Dry Run"
            echo "================================================"
            echo
            echo "RESULT: PASS"
            echo "Kernel: 5.4.274"
            echo "Stability Candidate: Candidate 2"
            echo "ReSukiSU: $RESUKISU_COMMIT"
            echo "SUSFS source: $SUSFS_COMMIT"
            echo "SUSFS version: ${SUSFS_VERSION:-unknown}"
            echo "SUSFS kernel patch SHA-256: $PATCH_SHA"
            echo "Resolved config SHA-256: $CONFIG_SHA"
            echo "Hook mode: SUSFS Inline Hook"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_MANUAL_HOOK is not active"
            echo "CONFIG_KSU_TRACEPOINT_HOOK is not active"
            echo "CONFIG_DEBUG_KERNEL is not active"
            echo "CONFIG_KALLSYMS_ALL is not active"
            echo "Official 5.4 kernel patch: clean with fuzz=0"
            echo "ReSukiSU inline hook audit: passed"
            echo "Upstream SUSFS KernelSU patch: intentionally NOT applied"
            echo "Kernel Image compiled: NO"
            echo "boot.img created: NO"
            echo "Flashed: NO"
          } | tee "$ARTIFACT_DIR/SUSFS-DRYRUN-SUMMARY.txt"

      - name: Collect failure diagnostics
        if: failure()
        working-directory: kernel
        shell: bash
        run: |
          set +e

          mkdir -p "$ARTIFACT_DIR"

          {
            echo "SUSFS DRY RUN RESULT: FAILURE / NEEDS REVIEW"
            echo "Finished: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "No kernel Image was compiled."
            echo "No boot.img was created."
            echo "Nothing was flashed."
          } > "$ARTIFACT_DIR/FAILURE-SUMMARY.txt"

          git status --short \
            > "$ARTIFACT_DIR/FAILURE-git-status.txt" \
            2>&1 \
            || true

          git diff \
            --no-ext-diff \
            --no-color \
            > "$ARTIFACT_DIR/FAILURE-kernel.diff" \
            2>&1 \
            || true

          if [ -f "$OUT_DIR/.config" ]; then
            cp \
              "$OUT_DIR/.config" \
              "$ARTIFACT_DIR/failure-resolved.config"
          fi

      - name: Upload successful SUSFS dry-run
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: veux-5.4.274-resukisu-susfs-dryrun-${{ github.run_number }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Upload SUSFS dry-run failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: veux-5.4.274-resukisu-susfs-dryrun-failure-${{ github.run_number }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
