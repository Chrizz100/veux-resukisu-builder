      - name: Upload GitHub-built boot.img and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GEN1_53_V1_GITHUB_BUILT_BOOT_IMG-${{ github.run_number }}
          path: gen1-53-v1/output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
      - name: Fail only after preserving W53 diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -Fxq \
            'FINAL_RESULT=PASS_GEN1_53_V1_GITHUB_BUILT_BOOT_IMG' \
            "$OUTPUT/W53-FINAL-VERDICT.txt" \
            2>/dev/null
          then
            echo "ERROR: W53 final PASS verdict was not produced."
            exit 1
          fi

          echo "GEN1 W53 v1 GitHub-built boot.img PASS."
