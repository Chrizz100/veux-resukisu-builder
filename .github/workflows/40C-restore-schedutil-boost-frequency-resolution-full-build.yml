          {
            echo "HZ_KCONFIG_SHA256=$CANDIDATE_SHA"
            echo "HZ_KCONFIG_DEFAULT=250"
          } | tee "$ARTIFACT_DIR/HZ-KCONFIG-STATE.txt"

      - name: Verify cumulative source state
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="arch/arm64/configs/veux_defconfig"
          SUGOV="kernel/sched/cpufreq_schedutil.c"

          if grep -qE \
            '^CONFIG_HZ_(100|250|300|1000)=y$' \
            "$DEFCONFIG"
          then
            echo "ERROR: explicit HZ selection remains"
            exit 1
          fi

          if ! grep -qx \
            'CONFIG_CPUSETS=y' \
            "$DEFCONFIG"
          then
            echo "ERROR: CPUSETS not enabled"
            exit 1
          fi

          if ! grep -qx \
            '# CONFIG_SPRD_ROTATION_TASK is not set' \
            "$DEFCONFIG"
          then
            echo "ERROR: SPRD rotation not disabled"
            exit 1
          fi

          if ! grep -qF \
            'time_after_eq(jiffies, sg->sgc->next_update)' \
            kernel/sched/fair.c
          then
            echo "ERROR: LB capacity time gate missing"
            exit 1
          fi

          if ! grep -qF \
            'arch_scale_max_freq_capacity(NULL, cpu)' \
            kernel/sched/cass.c
          then
            echo "ERROR: CASS max-frequency adaptation missing"
            exit 1
          fi

          if ! grep -qF \
            'curr->cap_no_therm' \
            kernel/sched/cass.c
          then
            echo "ERROR: CASS cap_no_therm missing"
            exit 1
          fi

          if ! grep -qx \
            '#define LOAD_AVG_PERIOD 8' \
            kernel/sched/sched-pelt.h
          then
            echo "ERROR: Xiaomi PELT8 missing"
            exit 1
          fi

          if grep -qF \
            'mult_frac(100, freq - h_freq, l_freq - h_freq) < 20' \
            "$SUGOV"
          then
            echo "ERROR: lower-step schedutil heuristic remains"
            exit 1
          fi

          if grep -qF \
            'uclamp_rq_util_with(rq, util, p) < util' \
            "$SUGOV"
          then
            echo "ERROR: cap-only UClamp remains"
            exit 1
          fi

          if ! grep -qF \
            'return cpufreq_driver_resolve_freq(policy, freq);' \
            "$SUGOV"
          then
            echo "ERROR: standard schedutil frequency resolution missing"
            exit 1
          fi

          if ! grep -qF \
            'if (type == FREQUENCY_UTIL)' \
            "$SUGOV"
          then
            echo "ERROR: normal schedutil UClamp condition missing"
            exit 1
          fi

          if grep -qF \
            'update_cpumask(cs, trialcs, "0-7")' \
            kernel/cgroup/cpuset.c
          then
            echo "ERROR: hardcoded CPUSET mask present"
            exit 1
          fi

          if ! grep -qF \
            'update_cpumask(cs, trialcs, buf)' \
            kernel/cgroup/cpuset.c
          then
            echo "ERROR: normal CPUSET userspace mask path missing"
            exit 1
          fi

          git diff --check \
            > "$ARTIFACT_DIR/GIT-DIFF-CHECK.txt" \
            2>&1

          {
            echo "CUMULATIVE_SOURCE_CHECK=PASS"
            echo "SCHEDUTIL_LOWER_STEP_REMOVED=YES"
            echo "SCHEDUTIL_STANDARD_DRIVER_RESOLVE=YES"
            echo "SCHEDUTIL_NORMAL_UCLAMP=YES"
            echo "SCHEDUTIL_CAP_ONLY_UCLAMP=NO"
            echo "CASS_MAXFREQ=YES"
            echo "CASS_CAP_NO_THERM=YES"
            echo "SPRD_ROTATION_DISABLED=YES"
            echo "LB_CAPACITY_RATE_LIMIT=YES"
            echo "CPUSETS_ENABLED=YES"
            echo "PELT8_XIAOMI=YES"
            echo "VEUX_DEFCONFIG_EXPLICIT_HZ=NO"
          } | tee "$ARTIFACT_DIR/CUMULATIVE-SOURCE-STATE.txt"

      - name: Resolve VEUX configuration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"

          rm -rf "$OUT_DIR"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            veux_defconfig \
            2>&1 \
            | tee "$ARTIFACT_DIR/config.log"

          CONFIG="$OUT_DIR/.config"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: resolved .config missing"
            exit 1
          fi

          REQUIRED_CONFIGS=(
            CONFIG_ARCH_QCOM=y
            CONFIG_ARCH_HOLI=y
            CONFIG_ARCH_BLAIR=y
            CONFIG_WT_QGKI=y
            CONFIG_LTO_CLANG=y
            CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y
            CONFIG_SCHED_CASS=y
            CONFIG_CPUSETS=y
            CONFIG_HZ_250=y
            CONFIG_HZ=250
            CONFIG_CPU_FREQ=y
            CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
            CONFIG_ARM_QCOM_CPUFREQ_HW=y
          )

          for item in "${REQUIRED_CONFIGS[@]}"; do
            if ! grep -qx \
              "$item" \
              "$CONFIG"
            then
              echo "ERROR: required config missing: $item"
              exit 1
            fi
          done

          if grep -qx \
            'CONFIG_HZ_100=y' \
            "$CONFIG"
          then
            echo "ERROR: HZ100 remains enabled"
            exit 1
          fi

          if grep -qx \
            'CONFIG_SPRD_ROTATION_TASK=y' \
            "$CONFIG"
          then
            echo "ERROR: SPRD rotation unexpectedly enabled"
            exit 1
          fi

          if ! grep -qx \
            '# CONFIG_SPRD_ROTATION_TASK is not set' \
            "$CONFIG"
          then
            echo "ERROR: SPRD rotation disable marker missing"
            exit 1
          fi

          cp \
            "$CONFIG" \
            "$ARTIFACT_DIR/resolved.config"

          {
            echo "===== Important resolved configuration ====="

            grep -E \
              '^(CONFIG_HZ_|# CONFIG_HZ_|CONFIG_HZ=|CONFIG_NO_HZ=|CONFIG_HIGH_RES_TIMERS=|CONFIG_PREEMPT=|CONFIG_SCHED_CASS=|CONFIG_CPUSETS=|CONFIG_SPRD_ROTATION_TASK=|# CONFIG_SPRD_ROTATION_TASK|CONFIG_CPU_FREQ=|CONFIG_CPU_FREQ_GOV_SCHEDUTIL=|CONFIG_ARM_QCOM_CPUFREQ_HW=)' \
              "$CONFIG" \
              || true
          } | tee "$ARTIFACT_DIR/CONFIG-IMPORTANT.txt"

          make \
            -s \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            kernelrelease \
            | tee "$ARTIFACT_DIR/kernelrelease.txt"

      - name: Build complete kernel Image and DTBs
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"

          set +e

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            Image \
            dtbs \
            2>&1 \
            | tee "$ARTIFACT_DIR/full-build.log"

          BUILD_RC=${PIPESTATUS[0]}

          set -e

          printf '%s\n' \
            "$BUILD_RC" \
            > "$ARTIFACT_DIR/full-build.exit-code"

          if [ "$BUILD_RC" -ne 0 ]; then
            echo "ERROR: full kernel build failed"
            exit "$BUILD_RC"
          fi

