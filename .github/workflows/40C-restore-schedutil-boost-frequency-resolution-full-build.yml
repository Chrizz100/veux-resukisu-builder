name: 40C - VEUX Restore Schedutil Boost and Frequency Resolution Full Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      ARCH: arm64

      COMMON_REF: "android11-5.4.274_r00"
      STOCK_REF: "veux-r-oss"

      STABILITY_REVERT: "f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80"
      LB_CAPACITY_COMMIT: "2c1495be9eabac845acc8da45f070622d6455091"
      HZ100_COMMIT: "a904f66b6a6f9c061e51439b081b82e4bf48af68"

      SUGOV_LOWER_STEP_COMMIT: "51e62843d6d11f5fa61a590f5d381a1739ad4dde"
      SUGOV_DISABLE_BOOST_COMMIT: "074143c7d36d6abfca64be0872a5045d33db5f9e"

      EXPECTED_CANDIDATE_TREE: "5d25b7e0124d7fb695f3f07b45928fcb5780d0e8"

      EXPECTED_SCHEDUTIL_BEFORE_SHA256: "9d56491a427ee12f1156ae907c5aa647bf1a1b35bf13c725a08e73ef295274b7"
      EXPECTED_SCHEDUTIL_AFTER_SHA256: "987c9598f16b22a1e7b343475691687d309122de447494cd1a2b5ea8cbbafffc"

      EXPECTED_CASS_DIFF_SHA256: "67abb81be8c2d7727c3e4c8a92419c9e9a3d97ee3d3e5355d3acabce34adf659"

      EXPECTED_XIAOMI_PELT_SHA256: "bad23ba491cc5d4669936507b392888765aa65fd8063b2a95a492d6b0dca0cb0"

      EXPECTED_HZ_KCONFIG_SHA256: "685e9a79f3dbf17e9bd5b402dfd25ad014886fbe1b6975a0913b3621519cd7fe"

      CLANG_PREBUILT_COMMIT: "aa2e4a514a6c85eebcc4a27149eaf9244e951a1e"

      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      OUT_DIR: out
      ARTIFACT_DIR: ${{ github.workspace }}/schedutil-restore-full-build

    steps:
      - name: Prepare probe directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$ARTIFACT_DIR" \
            "$TOOLCHAIN_DIR"

          cat > "$ARTIFACT_DIR/PLAN.txt" <<'EOF'
          VEUX Restore Schedutil Boost and Frequency Resolution Full Build
          ================================================================

          39P established:

          Candidate 2:
          - contains the custom 20% lower-frequency-step heuristic
          - does not return directly through the standard
            cpufreq_driver_resolve_freq() path
          - changes UClamp handling to cap-only behaviour
          - therefore frequency boosting through positive UClamp is disabled

          Xiaomi VEUX:
          - no 20% lower-step heuristic
          - normal cpufreq_driver_resolve_freq() frequency resolution
          - normal boost-and-cap UClamp behaviour

          Android Common 5.4.274:
          - no 20% lower-step heuristic
          - normal frequency resolution
          - normal boost-and-cap UClamp behaviour

          Exact Candidate schedutil source SHA from 39P:
          9d56491a427ee12f1156ae907c5aa647bf1a1b35bf13c725a08e73ef295274b7

          Exact expected source after ONLY these two reversals:
          987c9598f16b22a1e7b343475691687d309122de447494cd1a2b5ea8cbbafffc

          40C removes only:
          1. custom 20% lower-frequency-step selection
          2. custom cap-only UClamp condition

          It restores:
          1. standard:
               return cpufreq_driver_resolve_freq(policy, freq);

          2. standard:
               if (type == FREQUENCY_UTIL)
                   util = uclamp_rq_util_with(rq, util, p);

          Cumulative previously validated corrections retained:
          - CASS MaxFreq/Thermal adaptation
          - SPRD task rotation disabled
          - standard LB CPU-capacity rate limit restored
          - CONFIG_CPUSETS restored
          - exact Xiaomi VEUX PELT8 restored
          - custom CONFIG_HZ_100 removed
          - Kconfig default HZ250 restored

          No ReSukiSU change.
          No SUSFS change.
          No boot.img.
          No flashable ZIP.
          No device access.
          No flashing.
          EOF

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python-is-python3 \
            rsync \
            xz-utils \
            zstd

      - name: Install exact Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz" \
            -o "${RUNNER_TEMP}/clang-r416183b.tar.gz"

          tar \
            -xzf "${RUNNER_TEMP}/clang-r416183b.tar.gz" \
            -C "$TOOLCHAIN_DIR"

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

          "$TOOLCHAIN_DIR/bin/clang" --version \
            | tee "$ARTIFACT_DIR/clang-version.txt"

          "$TOOLCHAIN_DIR/bin/ld.lld" --version \
            | tee -a "$ARTIFACT_DIR/clang-version.txt"

          if ! "$TOOLCHAIN_DIR/bin/clang" --version \
            | grep -q 'r416183b'
          then
            echo "ERROR: expected clang-r416183b"
            exit 1
          fi

          for tool in \
            clang \
            ld.lld \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-size \
            llvm-strip
          do
            if [ ! -x "$TOOLCHAIN_DIR/bin/$tool" ]; then
              echo "ERROR: missing toolchain binary: $tool"
              exit 1
            fi
          done

      - name: Checkout exact VEUX source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: "20240619"
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Recreate exact Candidate 2
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          BASE_SHA="$(git rev-parse HEAD)"
          BASE_TREE="$(git rev-parse HEAD^{tree})"

          git remote remove android-common 2>/dev/null || true

          git remote add \
            android-common \
            https://android.googlesource.com/kernel/common

          git fetch \
            --no-tags \
            android-common \
            "$COMMON_REF"

          COMMON_SHA="$(git rev-parse FETCH_HEAD)"

          git update-ref \
            refs/remotes/android-common/audit-base \
            "$COMMON_SHA"

          git merge \
            --no-edit \
            "$COMMON_SHA"

          MERGED_SHA="$(git rev-parse HEAD)"
          MERGED_TREE="$(git rev-parse HEAD^{tree})"

          git cat-file -e \
            "${STABILITY_REVERT}^{commit}"

          git revert \
            --no-edit \
            "$STABILITY_REVERT"

          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"

          KERNEL_VERSION="$(
            make -s kernelversion
          )"

          if [ "$KERNEL_VERSION" != "5.4.274" ]; then
            echo "ERROR: expected Linux 5.4.274"
            echo "Actual: $KERNEL_VERSION"
            exit 1
          fi

          if [ "$CANDIDATE_TREE" != "$EXPECTED_CANDIDATE_TREE" ]; then
            echo "ERROR: Candidate 2 tree mismatch"
            echo "Expected: $EXPECTED_CANDIDATE_TREE"
            echo "Actual:   $CANDIDATE_TREE"
            exit 1
          fi

          {
            echo "BASE_SHA=$BASE_SHA"
            echo "BASE_TREE=$BASE_TREE"
            echo "COMMON_SHA=$COMMON_SHA"
            echo "MERGED_SHA=$MERGED_SHA"
            echo "MERGED_TREE=$MERGED_TREE"
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "CANDIDATE_TREE=$CANDIDATE_TREE"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "COMMON_REF=$COMMON_REF"
            echo "STABILITY_REVERT=$STABILITY_REVERT"
            echo "LB_CAPACITY_COMMIT=$LB_CAPACITY_COMMIT"
            echo "HZ100_COMMIT=$HZ100_COMMIT"
            echo "SUGOV_LOWER_STEP_COMMIT=$SUGOV_LOWER_STEP_COMMIT"
            echo "SUGOV_DISABLE_BOOST_COMMIT=$SUGOV_DISABLE_BOOST_COMMIT"
          } | tee "$ARTIFACT_DIR/IDENTITY.txt"

      - name: Fetch official Xiaomi VEUX reference
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git remote remove xiaomi 2>/dev/null || true

          git remote add \
            xiaomi \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git

          git fetch \
            --no-tags \
            xiaomi \
            "+refs/heads/${STOCK_REF}:refs/remotes/xiaomi/${STOCK_REF}"

          STOCK_SHA="$(
            git rev-parse "xiaomi/${STOCK_REF}"
          )"

          {
            echo "STOCK_REF=$STOCK_REF"
            echo "STOCK_SHA=$STOCK_SHA"
          } | tee "$ARTIFACT_DIR/XIAOMI-REFERENCE.txt"

      - name: Verify exact 39P schedutil Candidate baseline
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="kernel/sched/cpufreq_schedutil.c"

          SOURCE_SHA="$(
            sha256sum "$SOURCE" \
              | awk '{print $1}'
          )"

          echo "EXPECTED_SCHEDUTIL_SHA256=$EXPECTED_SCHEDUTIL_BEFORE_SHA256"
          echo "ACTUAL_SCHEDUTIL_SHA256=$SOURCE_SHA"

          if [ "$SOURCE_SHA" != "$EXPECTED_SCHEDUTIL_BEFORE_SHA256" ]; then
            echo "ERROR: Candidate schedutil source differs from 39P"
            exit 1
          fi

          if ! grep -qF \
            'unsigned int idx, l_freq, h_freq;' \
            "$SOURCE"
          then
            echo "ERROR: lower-step temporary frequency fields missing"
            exit 1
          fi

          if ! grep -qF \
            'idx = cpufreq_frequency_table_target(policy, freq, CPUFREQ_RELATION_H);' \
            "$SOURCE"
          then
            echo "ERROR: lower-step frequency table lookup missing"
            exit 1
          fi

          if ! grep -qF \
            'mult_frac(100, freq - h_freq, l_freq - h_freq) < 20' \
            "$SOURCE"
          then
            echo "ERROR: 20% lower-step heuristic missing"
            exit 1
          fi

          if ! grep -qF \
            'if (type == FREQUENCY_UTIL && uclamp_rq_util_with(rq, util, p) < util)' \
            "$SOURCE"
          then
            echo "ERROR: cap-only UClamp logic missing"
            exit 1
          fi

          {
            echo "SCHEDUTIL_BASELINE_SHA256=$SOURCE_SHA"
            echo "LOWER_STEP_20_PERCENT=YES"
            echo "CAP_ONLY_UCLAMP=YES"
          } | tee "$ARTIFACT_DIR/SCHEDUTIL-BASELINE-STATE.txt"

          cp \
            "$SOURCE" \
            "$ARTIFACT_DIR/cpufreq_schedutil-before.c"

      - name: Verify both historical schedutil commits
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          for COMMIT in \
            "$SUGOV_LOWER_STEP_COMMIT" \
            "$SUGOV_DISABLE_BOOST_COMMIT"
          do
            git cat-file -e \
              "${COMMIT}^{commit}"

            mapfile -t FILES < <(
              git diff-tree \
                --no-commit-id \
                --name-only \
                -r \
                "$COMMIT"
            )

            if [ "${#FILES[@]}" -ne 1 ]; then
              echo "ERROR: schedutil commit $COMMIT modifies unexpected file count"
              printf '%s\n' "${FILES[@]}"
              exit 1
            fi

            if [ "${FILES[0]}" != "kernel/sched/cpufreq_schedutil.c" ]; then
              echo "ERROR: schedutil commit $COMMIT modifies unexpected file"
              printf '%s\n' "${FILES[@]}"
              exit 1
            fi
          done

          git show \
            --format= \
            --no-ext-diff \
            --no-color \
            "$SUGOV_LOWER_STEP_COMMIT" \
            > "$ARTIFACT_DIR/LOWER-STEP-COMMIT.diff"

          git show \
            --format= \
            --no-ext-diff \
            --no-color \
            "$SUGOV_DISABLE_BOOST_COMMIT" \
            > "$ARTIFACT_DIR/DISABLE-BOOST-COMMIT.diff"

          if ! grep -qF \
            'mult_frac(100, freq - h_freq, l_freq - h_freq) < 20' \
            "$ARTIFACT_DIR/LOWER-STEP-COMMIT.diff"
          then
            echo "ERROR: expected lower-step commit semantics missing"
            exit 1
          fi

          if ! grep -qF \
            'uclamp_rq_util_with(rq, util, p) < util' \
            "$ARTIFACT_DIR/DISABLE-BOOST-COMMIT.diff"
          then
            echo "ERROR: expected boost-disable commit semantics missing"
            exit 1
          fi

          {
            echo "LOWER_STEP_COMMIT_VERIFIED=YES"
            echo "DISABLE_BOOST_COMMIT_VERIFIED=YES"
          } | tee "$ARTIFACT_DIR/SCHEDUTIL-COMMIT-STATE.txt"

      - name: Capture Xiaomi and Android Common schedutil baselines
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git show \
            "xiaomi/${STOCK_REF}:kernel/sched/cpufreq_schedutil.c" \
            > "$ARTIFACT_DIR/xiaomi-cpufreq_schedutil.c"

          git show \
            "android-common/audit-base:kernel/sched/cpufreq_schedutil.c" \
            > "$ARTIFACT_DIR/common-cpufreq_schedutil.c"

          for SOURCE in \
            "$ARTIFACT_DIR/xiaomi-cpufreq_schedutil.c" \
            "$ARTIFACT_DIR/common-cpufreq_schedutil.c"
          do
            if grep -qF \
              'mult_frac(100, freq - h_freq, l_freq - h_freq) < 20' \
              "$SOURCE"
            then
              echo "ERROR: baseline unexpectedly contains lower-step heuristic"
              echo "SOURCE=$SOURCE"
              exit 1
            fi

            if grep -qF \
              'if (type == FREQUENCY_UTIL && uclamp_rq_util_with(rq, util, p) < util)' \
              "$SOURCE"
            then
              echo "ERROR: baseline unexpectedly contains cap-only UClamp"
              echo "SOURCE=$SOURCE"
              exit 1
            fi

            if ! grep -qF \
              'return cpufreq_driver_resolve_freq(policy, freq);' \
              "$SOURCE"
            then
              echo "ERROR: standard frequency resolution missing"
              echo "SOURCE=$SOURCE"
              exit 1
            fi

            if ! grep -qF \
              'if (type == FREQUENCY_UTIL)' \
              "$SOURCE"
            then
              echo "ERROR: normal FREQUENCY_UTIL UClamp condition missing"
              echo "SOURCE=$SOURCE"
              exit 1
            fi

            if ! grep -qF \
              'util = uclamp_rq_util_with(rq, util, p);' \
              "$SOURCE"
            then
              echo "ERROR: normal UClamp application missing"
              echo "SOURCE=$SOURCE"
              exit 1
            fi
          done

          {
            echo "XIAOMI_LOWER_STEP_20_PERCENT=NO"
            echo "ANDROID_COMMON_LOWER_STEP_20_PERCENT=NO"
            echo "XIAOMI_CAP_ONLY_UCLAMP=NO"
            echo "ANDROID_COMMON_CAP_ONLY_UCLAMP=NO"
            echo "XIAOMI_NORMAL_DRIVER_RESOLVE=YES"
            echo "ANDROID_COMMON_NORMAL_DRIVER_RESOLVE=YES"
            echo "XIAOMI_NORMAL_BOOST_CAP_UCLAMP=YES"
            echo "ANDROID_COMMON_NORMAL_BOOST_CAP_UCLAMP=YES"
          } | tee "$ARTIFACT_DIR/SCHEDUTIL-BASELINE-MATRIX.txt"

      - name: Restore standard schedutil boost and frequency resolution
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/sched/cpufreq_schedutil.c"
          )

          text = path.read_text()

          declaration = (
              "\tunsigned int idx, l_freq, h_freq;\n"
          )

          declaration_count = text.count(
              declaration
          )

          if declaration_count != 1:
              raise SystemExit(
                  "ERROR: expected exactly one lower-step "
                  f"declaration, got {declaration_count}"
              )

          text = text.replace(
              declaration,
              "",
              1,
          )

          old_frequency_block = """\
          \tl_freq = cpufreq_driver_resolve_freq(policy, freq);
          \tidx = cpufreq_frequency_table_target(policy, freq, CPUFREQ_RELATION_H);
          \th_freq = policy->freq_table[idx].frequency;
          \th_freq = clamp(h_freq, policy->min, policy->max);
          \tif (l_freq <= h_freq || l_freq == policy->min)
          \t\treturn l_freq;

          \t/*
          \t * Use the frequency step below if the calculated frequency is <20%
          \t * higher than it.
          \t */
          \tif (mult_frac(100, freq - h_freq, l_freq - h_freq) < 20)
          \t\treturn h_freq;

          \treturn l_freq;
          """

          standard_frequency_block = """\
          \treturn cpufreq_driver_resolve_freq(policy, freq);
          """

          block_count = text.count(
              old_frequency_block
          )

          if block_count != 1:
              raise SystemExit(
                  "ERROR: expected exactly one lower-step block, "
                  f"got {block_count}"
              )

          text = text.replace(
              old_frequency_block,
              standard_frequency_block,
              1,
          )

          cap_only = (
              "\tif (type == FREQUENCY_UTIL && "
              "uclamp_rq_util_with(rq, util, p) < util)\n"
          )

          normal_uclamp = (
              "\tif (type == FREQUENCY_UTIL)\n"
          )

          cap_only_count = text.count(
              cap_only
          )

          if cap_only_count != 1:
              raise SystemExit(
                  "ERROR: expected exactly one cap-only UClamp "
                  f"condition, got {cap_only_count}"
              )

          text = text.replace(
              cap_only,
              normal_uclamp,
              1,
          )

          path.write_text(text)
          PY

          SOURCE="kernel/sched/cpufreq_schedutil.c"

          RESTORED_SHA="$(
            sha256sum "$SOURCE" \
              | awk '{print $1}'
          )"

          echo "EXPECTED_RESTORED_SHA256=$EXPECTED_SCHEDUTIL_AFTER_SHA256"
          echo "ACTUAL_RESTORED_SHA256=$RESTORED_SHA"

          if [ "$RESTORED_SHA" != "$EXPECTED_SCHEDUTIL_AFTER_SHA256" ]; then
            echo "ERROR: restored schedutil source differs from exact expected 39P-derived result"
            exit 1
          fi

          if grep -qF \
            'unsigned int idx, l_freq, h_freq;' \
            "$SOURCE"
          then
            echo "ERROR: lower-step helper fields remain"
            exit 1
          fi

          if grep -qF \
            'cpufreq_frequency_table_target(policy, freq, CPUFREQ_RELATION_H)' \
            "$SOURCE"
          then
            echo "ERROR: lower-step table lookup remains"
            exit 1
          fi

          if grep -qF \
            'mult_frac(100, freq - h_freq, l_freq - h_freq) < 20' \
            "$SOURCE"
          then
            echo "ERROR: 20% lower-step heuristic remains"
            exit 1
          fi

          if ! grep -qF \
            'return cpufreq_driver_resolve_freq(policy, freq);' \
            "$SOURCE"
          then
            echo "ERROR: standard driver frequency resolution was not restored"
            exit 1
          fi

          if grep -qF \
            'if (type == FREQUENCY_UTIL && uclamp_rq_util_with(rq, util, p) < util)' \
            "$SOURCE"
          then
            echo "ERROR: cap-only UClamp remains"
            exit 1
          fi

          if ! grep -qF \
            'if (type == FREQUENCY_UTIL)' \
            "$SOURCE"
          then
            echo "ERROR: normal UClamp FREQUENCY_UTIL condition missing"
            exit 1
          fi

          if ! grep -qF \
            'util = uclamp_rq_util_with(rq, util, p);' \
            "$SOURCE"
          then
            echo "ERROR: normal UClamp application missing"
            exit 1
          fi

          cp \
            "$SOURCE" \
            "$ARTIFACT_DIR/cpufreq_schedutil-after.c"

          git diff \
            --no-ext-diff \
            --no-color \
            -- "$SOURCE" \
            > "$ARTIFACT_DIR/SCHEDUTIL-RESTORE.diff"

          SCHEDUTIL_DIFF_SHA="$(
            sha256sum \
              "$ARTIFACT_DIR/SCHEDUTIL-RESTORE.diff" \
              | awk '{print $1}'
          )"

          {
            echo "SCHEDUTIL_BEFORE_SHA256=$EXPECTED_SCHEDUTIL_BEFORE_SHA256"
            echo "SCHEDUTIL_AFTER_SHA256=$RESTORED_SHA"
            echo "LOWER_STEP_20_PERCENT_REMOVED=YES"
            echo "STANDARD_DRIVER_RESOLVE_RESTORED=YES"
            echo "CAP_ONLY_UCLAMP_REMOVED=YES"
            echo "NORMAL_BOOST_CAP_UCLAMP_RESTORED=YES"
            echo "SCHEDUTIL_RESTORE_DIFF_SHA256=$SCHEDUTIL_DIFF_SHA"
          } | tee "$ARTIFACT_DIR/SCHEDUTIL-RESTORE-STATE.txt"

          cat "$ARTIFACT_DIR/SCHEDUTIL-RESTORE.diff"

      - name: Remove custom CONFIG_HZ_100
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="arch/arm64/configs/veux_defconfig"

          HZ100_COUNT="$(
            grep -xc \
              'CONFIG_HZ_100=y' \
              "$DEFCONFIG" \
              || true
          )"

          if [ "$HZ100_COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly one CONFIG_HZ_100=y"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "arch/arm64/configs/veux_defconfig"
          )

          text = path.read_text()

          target = "CONFIG_HZ_100=y\n"

          if text.count(target) != 1:
              raise SystemExit(
                  "ERROR: HZ100 line count mismatch"
              )

          path.write_text(
              text.replace(
                  target,
                  "",
                  1,
              )
          )
          PY

          if grep -qE \
            '^CONFIG_HZ_(100|250|300|1000)=y$' \
            "$DEFCONFIG"
          then
            echo "ERROR: explicit HZ selection remains"
            grep -nE '^CONFIG_HZ_' "$DEFCONFIG"
            exit 1
          fi

          {
            echo "CONFIG_HZ_100_REMOVED=YES"
            echo "VEUX_DEFCONFIG_EXPLICIT_HZ=NO"
          } | tee "$ARTIFACT_DIR/HZ-RESTORE-STATE.txt"

      - name: Restore standard load balance capacity rate limit
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git cat-file -e \
            "${LB_CAPACITY_COMMIT}^{commit}"

          git show \
            --format= \
            --binary \
            "$LB_CAPACITY_COMMIT" \
            > "$ARTIFACT_DIR/LB-CAPACITY-ORIGINAL-COMMIT.patch"

          PATCH="$ARTIFACT_DIR/LB-CAPACITY-ORIGINAL-COMMIT.patch"

          test -s "$PATCH"

          git apply \
            --reverse \
            --check \
            "$PATCH"

          git apply \
            --reverse \
            "$PATCH"

          python3 - <<'PY'
          from pathlib import Path

          fair = Path(
              "kernel/sched/fair.c"
          ).read_text()

          sched = Path(
              "kernel/sched/sched.h"
          ).read_text()

          required = (
              "unsigned long interval;",
              "interval = msecs_to_jiffies(sd->balance_interval);",
              "interval = clamp(interval, 1UL, max_load_balance_interval);",
              "sdg->sgc->next_update = jiffies + interval;",
              "env->idle != CPU_NEWLY_IDLE",
              "time_after_eq(jiffies, sg->sgc->next_update)",
          )

          for token in required:
              if token not in fair:
                  raise SystemExit(
                      f"ERROR: LB capacity restore token missing: {token}"
                  )

          if "next_update;" not in sched:
              raise SystemExit(
                  "ERROR: sched_group_capacity next_update missing"
              )
          PY

          git diff \
            --no-ext-diff \
            --no-color \
            -- \
            kernel/sched/fair.c \
            kernel/sched/sched.h \
            > "$ARTIFACT_DIR/LB-CAPACITY-RATELIMIT-RESTORE.diff"

          LB_DIFF_SHA="$(
            sha256sum \
              "$ARTIFACT_DIR/LB-CAPACITY-RATELIMIT-RESTORE.diff" \
              | awk '{print $1}'
          )"

          {
            echo "LB_CAPACITY_COMMIT_REVERSED=YES"
            echo "LB_CAPACITY_TIME_GATE=RESTORED"
            echo "LB_CAPACITY_RESTORE_DIFF_SHA256=$LB_DIFF_SHA"
          } | tee "$ARTIFACT_DIR/LB-CAPACITY-STATE.txt"

      - name: Apply proven CASS MaxFreq Thermal patch
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/sched/cass.c"
          )

          text = path.read_text()

          old = """\
          \tunsigned long cap;
          \tunsigned long cap_max;
          \tunsigned long eff_util;
          """

          new = """\
          \tunsigned long cap;
          \tunsigned long cap_max;
          \tunsigned long cap_no_therm;
          \tunsigned long cap_orig;
          \tunsigned long eff_util;
          """

          if text.count(old) != 1:
              raise SystemExit(
                  "ERROR: CASS struct anchor mismatch"
              )

          text = text.replace(
              old,
              new,
              1,
          )

          old = """\
          \tc->cap = c->cap_max - min(c->hard_util, c->cap_max - 1);
          """

          new = """\
          \tc->cap = c->cap_max - min(c->hard_util, c->cap_max - 1);

          \t/*
          \t * Keep a non-throttled capacity denominator for relative load
          \t * balancing, matching the original CASS capacity separation.
          \t */
          \tc->cap_no_therm =
          \t\tc->cap_orig - min(c->hard_util, c->cap_orig - 1);
          """

          if text.count(old) != 1:
              raise SystemExit(
                  "ERROR: CASS capacity anchor mismatch"
              )

          text = text.replace(
              old,
              new,
              1,
          )

          old = """\
          \t\t/* Get the original, maximum _possible_ capacity of this CPU */
          \t\tcurr->cap_max = arch_scale_cpu_capacity(cpu);
          """

          new = """\
          \t\t/* Get the original, maximum possible capacity of this CPU. */
          \t\tcurr->cap_orig = arch_scale_cpu_capacity(cpu);

          \t\t/* Account for the current maximum allowed CPU frequency. */
          \t\tcurr->cap_max =
          \t\t\tcurr->cap_orig *
          \t\t\tarch_scale_max_freq_capacity(NULL, cpu) >>
          \t\t\tSCHED_CAPACITY_SHIFT;

          \t\t/* Keep all later capacity divisions well-defined. */
          \t\tcurr->cap_max = max(curr->cap_max, 1UL);
          """

          if text.count(old) != 1:
              raise SystemExit(
                  "ERROR: CASS cap_max anchor mismatch"
              )

          text = text.replace(
              old,
              new,
              1,
          )

          old = """\
          \t\tcurr->util =
          \t\t\tcurr->util * SCHED_CAPACITY_SCALE / curr->cap;
          """

          new = """\
          \t\tcurr->util =
          \t\t\tcurr->util * SCHED_CAPACITY_SCALE /
          \t\t\tcurr->cap_no_therm;
          """

          if text.count(old) != 1:
              raise SystemExit(
                  "ERROR: CASS relative-util anchor mismatch"
              )

          text = text.replace(
              old,
              new,
              1,
          )

          path.write_text(text)
          PY

          git diff \
            --no-ext-diff \
            --no-color \
            -- kernel/sched/cass.c \
            > "$ARTIFACT_DIR/CASS-PATCH.diff"

          CASS_DIFF_SHA="$(
            sha256sum \
              "$ARTIFACT_DIR/CASS-PATCH.diff" \
              | awk '{print $1}'
          )"

          if [ "$CASS_DIFF_SHA" != "$EXPECTED_CASS_DIFF_SHA256" ]; then
            echo "ERROR: CASS patch differs from proven version"
            echo "Expected: $EXPECTED_CASS_DIFF_SHA256"
            echo "Actual:   $CASS_DIFF_SHA"
            exit 1
          fi

          {
            echo "CASS_PATCH=PASS"
            echo "CASS_DIFF_SHA256=$CASS_DIFF_SHA"
            echo "CAP_ORIG_RESTORED=YES"
            echo "CAP_NO_THERM_RESTORED=YES"
            echo "CAP_MAX_USES_MAX_FREQ_SCALE=YES"
          } | tee "$ARTIFACT_DIR/CASS-PATCH-STATE.txt"

      - name: Restore VEUX defconfig cumulative state
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "arch/arm64/configs/veux_defconfig"
          )

          text = path.read_text()

          rotation_old = (
              "CONFIG_SPRD_ROTATION_TASK=y"
          )

          rotation_new = (
              "# CONFIG_SPRD_ROTATION_TASK is not set"
          )

          if text.count(rotation_old) != 1:
              raise SystemExit(
                  "ERROR: SPRD rotation anchor mismatch"
              )

          text = text.replace(
              rotation_old,
              rotation_new,
              1,
          )

          if "CONFIG_CPUSETS=y" in text:
              raise SystemExit(
                  "ERROR: CONFIG_CPUSETS=y unexpectedly already present"
              )

          cpuset_old = """\
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_CPUACCT=y
          """

          cpuset_new = """\
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CPUSETS=y
          CONFIG_CGROUP_CPUACCT=y
          """

          if text.count(cpuset_old) != 1:
              raise SystemExit(
                  "ERROR: CPUSETS insertion anchor mismatch"
              )

          text = text.replace(
              cpuset_old,
              cpuset_new,
              1,
          )

          path.write_text(text)
          PY

          DEFCONFIG="arch/arm64/configs/veux_defconfig"

          if ! grep -qx \
            '# CONFIG_SPRD_ROTATION_TASK is not set' \
            "$DEFCONFIG"
          then
            echo "ERROR: SPRD rotation disable marker missing"
            exit 1
          fi

          if ! grep -qx \
            'CONFIG_CPUSETS=y' \
            "$DEFCONFIG"
          then
            echo "ERROR: CONFIG_CPUSETS=y missing"
            exit 1
          fi

          {
            echo "SPRD_ROTATION_DISABLED=YES"
            echo "CPUSETS_ENABLED=YES"
          } | tee "$ARTIFACT_DIR/DEFCONFIG-CUMULATIVE-STATE.txt"

      - name: Restore exact Xiaomi VEUX PELT8
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          HEADER="kernel/sched/sched-pelt.h"

          git show \
            "xiaomi/${STOCK_REF}:kernel/sched/sched-pelt.h" \
            > "$HEADER"

          HEADER_SHA="$(
            sha256sum "$HEADER" \
              | awk '{print $1}'
          )"

          if [ "$HEADER_SHA" != "$EXPECTED_XIAOMI_PELT_SHA256" ]; then
            echo "ERROR: Xiaomi PELT header hash mismatch"
            echo "Expected: $EXPECTED_XIAOMI_PELT_SHA256"
            echo "Actual:   $HEADER_SHA"
            exit 1
          fi

          if ! grep -qx \
            '#define LOAD_AVG_PERIOD 8' \
            "$HEADER"
          then
            echo "ERROR: PELT period is not 8"
            exit 1
          fi

          if ! grep -qx \
            '#define LOAD_AVG_MAX 12336' \
            "$HEADER"
          then
            echo "ERROR: LOAD_AVG_MAX is not 12336"
            exit 1
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path(
              "kernel/sched/sched-pelt.h"
          ).read_text()

          match = re.search(
              r"runnable_avg_yN_inv\[\].*?=\s*\{(.*?)\};",
              text,
              re.S,
          )

          if not match:
              raise SystemExit(
                  "ERROR: PELT table missing"
              )

          entries = re.findall(
              r"0x[0-9a-fA-F]+",
              match.group(1),
          )

          if len(entries) != 8:
              raise SystemExit(
                  f"ERROR: expected 8 PELT entries, got {len(entries)}"
              )
          PY

          git diff \
            --no-ext-diff \
            --no-color \
            -- kernel/sched/sched-pelt.h \
            > "$ARTIFACT_DIR/PELT8-RESTORE.diff"

          PELT_DIFF_SHA="$(
            sha256sum \
              "$ARTIFACT_DIR/PELT8-RESTORE.diff" \
              | awk '{print $1}'
          )"

          {
            echo "PELT_PERIOD=8"
            echo "LOAD_AVG_MAX=12336"
            echo "PELT_TABLE_ENTRIES=8"
            echo "PELT_HEADER_SHA256=$HEADER_SHA"
            echo "PELT_RESTORE_DIFF_SHA256=$PELT_DIFF_SHA"
            echo "EXACT_XIAOMI_HEADER=YES"
          } | tee "$ARTIFACT_DIR/PELT8-STATE.txt"

      - name: Verify common HZ Kconfig baseline
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATE_SHA="$(
            sha256sum kernel/Kconfig.hz \
              | awk '{print $1}'
          )"

          if [ "$CANDIDATE_SHA" != "$EXPECTED_HZ_KCONFIG_SHA256" ]; then
            echo "ERROR: Candidate kernel/Kconfig.hz hash mismatch"
