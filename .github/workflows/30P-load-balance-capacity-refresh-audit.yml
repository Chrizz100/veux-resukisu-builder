name: 30P - VEUX Load Balance CPU Capacity Refresh Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ARCH: arm64
      COMMON_REF: "android11-5.4.274_r00"
      STABILITY_REVERT: "f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80"
      EXPECTED_CANDIDATE_TREE: "5d25b7e0124d7fb695f3f07b45928fcb5780d0e8"
      STOCK_REF: "veux-r-oss"
      ARTIFACT_DIR: ${{ github.workspace }}/lb-capacity-audit

    steps:
      - name: Prepare audit directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ARTIFACT_DIR"

          cat > "$ARTIFACT_DIR/PLAN.txt" <<'EOF'
          VEUX Load Balance CPU Capacity Refresh Audit
          =============================================

          Previous completed items:
          - CASS MaxFreq/Thermal adaptation compile-tested and full-built
          - SPRD task rotation audited
          - SPRD task rotation disabled successfully in 29C

          Current checklist item:
          "CPU capacity bei jedem LB aktualisieren"

          Purpose:
          - reconstruct exact Candidate 2
          - inspect update_cpu_capacity()
          - inspect update_group_capacity()
          - inspect update_sd_lb_stats()
          - determine when update_group_capacity() is called
          - determine whether the call is time/frequency gated
          - compare Candidate 2 with official Xiaomi VEUX
          - compare Candidate 2 with Android Common 5.4.274
          - identify the responsible history/commit
          - make no source modification

          Audit only.

          This workflow does NOT:
          - apply the CASS fix
          - disable SPRD rotation
          - modify any source
          - build a kernel
          - create boot.img
          - create a flashable ZIP
          - access a phone
          - flash anything
          EOF

      - name: Checkout exact VEUX source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: "20240619"
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Recreate exact Candidate 2
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          BASE_SHA="$(git rev-parse HEAD)"
          BASE_TREE="$(git rev-parse HEAD^{tree})"

          git remote remove android-common 2>/dev/null || true

          git remote add \
            android-common \
            https://android.googlesource.com/kernel/common

          git fetch \
            --no-tags \
            android-common \
            "$COMMON_REF"

          COMMON_SHA="$(git rev-parse FETCH_HEAD)"

          git update-ref \
            refs/remotes/android-common/audit-base \
            "$COMMON_SHA"

          git merge \
            --no-edit \
            "$COMMON_SHA"

          MERGED_SHA="$(git rev-parse HEAD)"
          MERGED_TREE="$(git rev-parse HEAD^{tree})"

          git cat-file -e \
            "${STABILITY_REVERT}^{commit}"

          git revert \
            --no-edit \
            "$STABILITY_REVERT"

          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"
          KERNEL_VERSION="$(make -s kernelversion)"

          if [ "$KERNEL_VERSION" != "5.4.274" ]; then
            echo "ERROR: expected Linux 5.4.274"
            echo "Actual: $KERNEL_VERSION"
            exit 1
          fi

          if [ "$CANDIDATE_TREE" != "$EXPECTED_CANDIDATE_TREE" ]; then
            echo "ERROR: Candidate 2 tree mismatch"
            echo "Expected: $EXPECTED_CANDIDATE_TREE"
            echo "Actual:   $CANDIDATE_TREE"
            exit 1
          fi

          {
            echo "BASE_SHA=$BASE_SHA"
            echo "BASE_TREE=$BASE_TREE"
            echo "COMMON_SHA=$COMMON_SHA"
            echo "MERGED_SHA=$MERGED_SHA"
            echo "MERGED_TREE=$MERGED_TREE"
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "CANDIDATE_TREE=$CANDIDATE_TREE"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "COMMON_REF=$COMMON_REF"
            echo "STABILITY_REVERT=$STABILITY_REVERT"
          } | tee "$ARTIFACT_DIR/IDENTITY.txt"

      - name: Fetch official Xiaomi VEUX reference
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git remote remove xiaomi 2>/dev/null || true

          git remote add \
            xiaomi \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git

          git fetch \
            --no-tags \
            xiaomi \
            "+refs/heads/${STOCK_REF}:refs/remotes/xiaomi/${STOCK_REF}"

          STOCK_SHA="$(git rev-parse "xiaomi/${STOCK_REF}")"

          BASE_SHA="$(
            awk -F= \
              '$1=="BASE_SHA" {print $2}' \
              "$ARTIFACT_DIR/IDENTITY.txt"
          )"

          MERGE_BASE="$(
            git merge-base \
              "$BASE_SHA" \
              "xiaomi/${STOCK_REF}" \
              || true
          )"

          {
            echo "STOCK_REF=$STOCK_REF"
            echo "STOCK_SHA=$STOCK_SHA"
            echo "MERGE_BASE=${MERGE_BASE:-NONE}"
          } | tee "$ARTIFACT_DIR/XIAOMI-REFERENCE.txt"

          if [ -z "$MERGE_BASE" ]; then
            echo "ERROR: no merge-base with Xiaomi VEUX source"
            exit 1
          fi

      - name: Capture Candidate 2 capacity code
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "============================================================"
            echo "update_cpu_capacity()"
            echo "============================================================"

            grep \
              -n \
              -A90 \
              -B10 \
              '^static void update_cpu_capacity' \
              kernel/sched/fair.c \
              || true

            echo
            echo "============================================================"
            echo "update_group_capacity()"
            echo "============================================================"

            grep \
              -n \
              -A120 \
              -B10 \
              '^void update_group_capacity' \
              kernel/sched/fair.c \
              || true

            echo
            echo "============================================================"
            echo "update_sd_lb_stats()"
            echo "============================================================"

            grep \
              -n \
              -A180 \
              -B20 \
              '^static inline void update_sd_lb_stats' \
              kernel/sched/fair.c \
              || true

          } > "$ARTIFACT_DIR/CANDIDATE-CAPACITY-CONTEXT.txt"

          cat "$ARTIFACT_DIR/CANDIDATE-CAPACITY-CONTEXT.txt"

      - name: Audit Candidate 2 load balance call sites
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "===== update_group_capacity call sites ====="

            grep \
              -nF \
              'update_group_capacity(' \
              kernel/sched/fair.c \
              || true

            echo
            echo "===== next_update references in scheduler fair.c ====="

            grep \
              -nE \
              'next_update|time_after.*next_update|time_after_eq.*next_update' \
              kernel/sched/fair.c \
              || true

            echo
            echo "===== capacity refresh related references ====="

            grep \
              -nE \
              'update_cpu_capacity|update_group_capacity|cpu_capacity_orig|cpu_capacity =|arch_scale_max_freq_capacity' \
              kernel/sched/fair.c \
              || true

          } > "$ARTIFACT_DIR/CANDIDATE-CALL-SITES.txt"

          cat "$ARTIFACT_DIR/CANDIDATE-CALL-SITES.txt"

      - name: Extract Candidate Xiaomi and Android Common functions
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git show \
            HEAD:kernel/sched/fair.c \
            > "$ARTIFACT_DIR/candidate-fair.c"

          git show \
            "xiaomi/${STOCK_REF}:kernel/sched/fair.c" \
            > "$ARTIFACT_DIR/xiaomi-fair.c"

          git show \
            "android-common/audit-base:kernel/sched/fair.c" \
            > "$ARTIFACT_DIR/common-fair.c"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          out = Path(os.environ["ARTIFACT_DIR"])

          sources = {
              "CANDIDATE": out / "candidate-fair.c",
              "XIAOMI": out / "xiaomi-fair.c",
              "ANDROID_COMMON": out / "common-fair.c",
          }

          wanted = (
              "update_cpu_capacity",
              "update_group_capacity",
              "update_sd_lb_stats",
          )

          def extract_function(text, name):
              patterns = [
                  rf"\b{name}\s*\([^;]*?\)\s*\{{",
                  rf"\b{name}\s*\([^;]*?\)\s*\n\s*\{{",
              ]

              match = None

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      text,
                      re.S,
                  )
                  if match:
                      break

              if not match:
                  return None

              start = match.start()

              brace = text.find(
                  "{",
                  match.start(),
                  match.end(),
              )

              if brace < 0:
                  return None

              depth = 0
              pos = brace

              while pos < len(text):
                  ch = text[pos]

                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1

                      if depth == 0:
                          return text[start:pos + 1]

                  pos += 1

              return None

          rows = []

          for label, path in sources.items():
              text = path.read_text(
                  errors="replace"
              )

              combined = []

              for name in wanted:
                  function = extract_function(
                      text,
                      name,
                  )

                  combined.append(
                      "=" * 78
                  )
                  combined.append(
                      f"{label}: {name}"
                  )
                  combined.append(
                      "=" * 78
                  )

                  if function is None:
                      combined.append(
                          "FUNCTION_NOT_FOUND"
                      )
                      function = ""
                  else:
                      combined.append(
                          function
                      )

                  if name == "update_sd_lb_stats":
                      calls = len(
                          re.findall(
                              r"\bupdate_group_capacity\s*\(",
                              function,
                          )
                      )

                      gated = bool(
                          re.search(
                              r"next_update|"
                              r"time_after(?:_eq)?\s*\(",
                              function,
                          )
                      )

                      local_group = bool(
                          re.search(
                              r"if\s*\(\s*local_group\s*\)",
                              function,
                          )
                      )

                      rows.append(
                          (
                              label,
                              calls,
                              int(gated),
                              int(local_group),
                          )
                      )

              (
                  out /
                  f"{label.lower()}-functions.txt"
              ).write_text(
                  "\n".join(combined) + "\n"
              )

          with (
              out / "LB-CAPACITY-MATRIX.tsv"
          ).open("w") as f:
              f.write(
                  "source\t"
                  "update_group_capacity_calls_in_update_sd_lb_stats\t"
                  "time_or_next_update_gate_in_function\t"
                  "local_group_condition_present\n"
              )

              for row in rows:
                  f.write(
                      f"{row[0]}\t"
                      f"{row[1]}\t"
                      f"{row[2]}\t"
                      f"{row[3]}\n"
                  )
          PY

          echo
          echo "===== LOAD BALANCE CAPACITY MATRIX ====="
          cat "$ARTIFACT_DIR/LB-CAPACITY-MATRIX.tsv"

      - name: Capture exact update_group_capacity call context for all sources
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          out = Path(os.environ["ARTIFACT_DIR"])

          sources = {
              "CANDIDATE": out / "candidate-fair.c",
              "XIAOMI": out / "xiaomi-fair.c",
              "ANDROID_COMMON": out / "common-fair.c",
          }

          target = "update_group_capacity("

          result = []

          for label, path in sources.items():
              lines = path.read_text(
                  errors="replace"
              ).splitlines()

              result.append(
                  "=" * 78
              )
              result.append(label)
              result.append(
                  "=" * 78
              )

              hits = [
                  i
                  for i, line in enumerate(lines)
                  if target in line
                  and not line.lstrip().startswith(
                      "void update_group_capacity"
                  )
              ]

              if not hits:
                  result.append(
                      "NO_CALL_SITE_FOUND"
                  )
                  continue

              for hit in hits:
                  start = max(
                      0,
                      hit - 30,
                  )
                  end = min(
                      len(lines),
                      hit + 31,
                  )

                  result.append(
                      f"CALL_LINE={hit + 1}"
                  )

                  for pos in range(start, end):
                      marker = (
                          ">>>"
                          if pos == hit
                          else "   "
                      )

                      result.append(
                          f"{marker} "
                          f"{pos + 1:6d}: "
                          f"{lines[pos]}"
                      )

                  result.append("")

          (
              out /
              "ALL-SOURCE-CALL-CONTEXT.txt"
          ).write_text(
              "\n".join(result) + "\n"
          )
          PY

          cat "$ARTIFACT_DIR/ALL-SOURCE-CALL-CONTEXT.txt"

      - name: Compare Candidate 2 scheduler capacity logic with Xiaomi
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git diff \
            --no-ext-diff \
            --no-color \
            "xiaomi/${STOCK_REF}" \
            HEAD \
            -- kernel/sched/fair.c \
            > "$ARTIFACT_DIR/CANDIDATE2-VS-XIAOMI-FAIR.diff" \
            || true

          git diff \
            --stat \
            "xiaomi/${STOCK_REF}" \
            HEAD \
            -- kernel/sched/fair.c \
            > "$ARTIFACT_DIR/CANDIDATE2-VS-XIAOMI-FAIR.stat" \
            || true

          cat "$ARTIFACT_DIR/CANDIDATE2-VS-XIAOMI-FAIR.stat"

          python3 - <<'PY'
          import os
          from pathlib import Path

          out = Path(os.environ["ARTIFACT_DIR"])

          diff = (
              out /
              "CANDIDATE2-VS-XIAOMI-FAIR.diff"
          ).read_text(
              errors="replace"
          ).splitlines()

          keywords = (
              "update_cpu_capacity",
              "update_group_capacity",
              "update_sd_lb_stats",
              "next_update",
              "cpu_capacity",
              "arch_scale_max_freq_capacity",
          )

          selected = []

          for index, line in enumerate(diff):
              if any(
                  word in line
                  for word in keywords
              ):
                  start = max(
                      0,
                      index - 12,
                  )
                  end = min(
                      len(diff),
                      index + 13,
                  )

                  selected.extend(
                      diff[start:end]
                  )

                  selected.append(
                      "=" * 78
                  )

          (
              out /
              "CAPACITY-ONLY-DIFF-CONTEXT.txt"
          ).write_text(
              "\n".join(selected) + "\n"
          )
          PY

          cat "$ARTIFACT_DIR/CAPACITY-ONLY-DIFF-CONTEXT.txt"

      - name: Trace scheduler capacity refresh history
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "============================================================"
            echo "HISTORY: update_group_capacity call"
            echo "============================================================"
            echo

            git log \
              --all \
              --date=iso-strict \
              --pretty=format:'%H%x09%ad%x09%an%x09%s' \
              -S'update_group_capacity(env->sd, env->dst_cpu)' \
              -- kernel/sched/fair.c \
              || true

            echo
            echo
            echo "============================================================"
            echo "HISTORY: next_update"
            echo "============================================================"
            echo

            git log \
              --all \
              --date=iso-strict \
              --pretty=format:'%H%x09%ad%x09%an%x09%s' \
              -S'next_update' \
              -- kernel/sched/fair.c \
              || true

            echo
            echo
            echo "============================================================"
            echo "HISTORY: update_cpu_capacity"
            echo "============================================================"
            echo

            git log \
              --all \
              --date=iso-strict \
              --pretty=format:'%H%x09%ad%x09%an%x09%s' \
              -S'update_cpu_capacity' \
              -- kernel/sched/fair.c \
              || true

          } > "$ARTIFACT_DIR/CAPACITY-HISTORY.txt"

          cat "$ARTIFACT_DIR/CAPACITY-HISTORY.txt"

      - name: Blame Candidate 2 load balance capacity call
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t LINES < <(
            grep \
              -nF \
              'update_group_capacity(env->sd, env->dst_cpu);' \
              kernel/sched/fair.c \
              | cut -d: -f1
          )

          if [ "${#LINES[@]}" -eq 0 ]; then
            echo "ERROR: expected load-balance update_group_capacity call not found"
            exit 1
          fi

          : > "$ARTIFACT_DIR/CAPACITY-CALL-BLAME.txt"

          for LINE in "${LINES[@]}"; do
            {
              echo "============================================================"
              echo "LINE=$LINE"
              echo "============================================================"

              git blame \
                -L "${LINE},${LINE}" \
                HEAD \
                -- kernel/sched/fair.c

              echo
            } >> "$ARTIFACT_DIR/CAPACITY-CALL-BLAME.txt"
          done

          cat "$ARTIFACT_DIR/CAPACITY-CALL-BLAME.txt"

      - name: Build machine-readable audit conclusion
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import csv
          import os
          from pathlib import Path

          out = Path(os.environ["ARTIFACT_DIR"])

          rows = {}

          with (
              out /
              "LB-CAPACITY-MATRIX.tsv"
          ).open() as f:
              reader = csv.DictReader(
                  f,
                  delimiter="\t",
              )

              for row in reader:
                  rows[row["source"]] = row

          required = (
              "CANDIDATE",
              "XIAOMI",
              "ANDROID_COMMON",
          )

          for label in required:
              if label not in rows:
                  raise SystemExit(
                      f"ERROR: matrix missing {label}"
                  )

          def integer(label, field):
              return int(
                  rows[label][field]
              )

          call_field = (
              "update_group_capacity_calls_in_update_sd_lb_stats"
          )

          gate_field = (
              "time_or_next_update_gate_in_function"
          )

          candidate_calls = integer(
              "CANDIDATE",
              call_field,
          )

          xiaomi_calls = integer(
              "XIAOMI",
              call_field,
          )

          common_calls = integer(
              "ANDROID_COMMON",
              call_field,
          )

          candidate_gate = integer(
              "CANDIDATE",
              gate_field,
          )

          xiaomi_gate = integer(
              "XIAOMI",
              gate_field,
          )

          common_gate = integer(
              "ANDROID_COMMON",
              gate_field,
          )

          if (
              candidate_calls > 0
              and candidate_gate == 0
              and (
                  xiaomi_gate > 0
                  or common_gate > 0
              )
          ):
              review = (
                  "CANDIDATE_UNGATED_REFRESH_REVIEW"
              )
          elif (
              candidate_calls == xiaomi_calls
              and candidate_gate == xiaomi_gate
          ):
              review = (
                  "MATCHES_XIAOMI_CALL_PATTERN"
              )
          elif (
              candidate_calls == common_calls
              and candidate_gate == common_gate
          ):
              review = (
                  "MATCHES_ANDROID_COMMON_CALL_PATTERN"
              )
          else:
              review = (
                  "CAPACITY_REFRESH_DIFFERENCE_REVIEW"
              )

          with (
              out /
              "RESULT.txt"
          ).open("w") as f:
              f.write(
                  "RESULT=PASS_AUDIT\n"
              )

              f.write(
                  "BASE_CANDIDATE_TREE="
                  "5d25b7e0124d7fb695f3f07b45928fcb5780d0e8\n"
              )

              f.write(
                  "CANDIDATE_LB_CAPACITY_CALLS="
                  f"{candidate_calls}\n"
              )

              f.write(
                  "CANDIDATE_TIME_GATE="
                  f"{candidate_gate}\n"
              )

              f.write(
                  "XIAOMI_LB_CAPACITY_CALLS="
                  f"{xiaomi_calls}\n"
              )

              f.write(
                  "XIAOMI_TIME_GATE="
                  f"{xiaomi_gate}\n"
              )

              f.write(
                  "ANDROID_COMMON_LB_CAPACITY_CALLS="
                  f"{common_calls}\n"
              )

              f.write(
                  "ANDROID_COMMON_TIME_GATE="
                  f"{common_gate}\n"
              )

              f.write(
                  f"REVIEW_CLASS={review}\n"
              )

              f.write(
                  "SOURCE_MODIFIED=NO\n"
              )
              f.write(
                  "KERNEL_BUILT=NO\n"
              )
              f.write(
                  "IMAGE_CREATED=NO\n"
              )
              f.write(
                  "BOOT_IMAGE_CREATED=NO\n"
              )
              f.write(
                  "DEVICE_FLASHED=NO\n"
              )
          PY

          cat "$ARTIFACT_DIR/RESULT.txt"

      - name: Upload load balance capacity audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-Load-Balance-CPU-Capacity-Refresh-Audit
          path: lb-capacity-audit/
          if-no-files-found: error
          retention-days: 30
