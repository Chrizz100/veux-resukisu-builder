      - name: Discover exact Candidate blame for custom idle tokens
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LPM="drivers/cpuidle/lpm-levels.c"
          CORE="drivers/cpuidle/cpuidle.c"
          HEADER="include/linux/cpuidle.h"

          : > "$ARTIFACT_DIR/CANDIDATE-IDLE-BLAME.txt"

          blame_token()
          {
            local file="$1"
            local token="$2"
            local label="$3"

            local line

            line="$(
              grep \
                -nF \
                "$token" \
                "$file" \
                | head -n 1 \
                | cut -d: -f1 \
                || true
            )"

            {
              echo "============================================================"
              echo "LABEL=$label"
              echo "FILE=$file"
              echo "TOKEN=$token"
              echo "LINE=${line:-NOT_FOUND}"
              echo "============================================================"

              if [ -n "${line:-}" ]; then
                git blame \
                  -L "${line},${line}" \
                  HEAD \
                  -- "$file" \
                  || true
              else
                echo "TOKEN_NOT_FOUND"
              fi

              echo
            } >> "$ARTIFACT_DIR/CANDIDATE-IDLE-BLAME.txt"
          }

          blame_token \
            "$LPM" \
            'static bool sleep_disabled = true;' \
            'sleep default true'

          blame_token \
            "$LPM" \
            'static int lpm_drm_panel_notify' \
            'DRM panel notifier'

          blame_token \
            "$LPM" \
            'extern struct drm_panel *goodix_get_panel(void);' \
            'Goodix active panel binding'

          blame_token \
            "$LPM" \
            'if (!cpu || sleep_disabled)' \
            'idle selection guard'

          blame_token \
            "$LPM" \
            'bool lpm_sleep_disabled(void)' \
            'LPM exported state'

          blame_token \
            "$CORE" \
            'if (!lpm_sleep_disabled())' \
            'generic cpuidle integration'

          blame_token \
            "$HEADER" \
            'extern bool lpm_sleep_disabled(void);' \
            'header integration'

          cat "$ARTIFACT_DIR/CANDIDATE-IDLE-BLAME.txt"

