      - name: Model screen state idle behaviour
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          out = Path(os.environ["ARTIFACT_DIR"])

          lpm = Path(
              "drivers/cpuidle/lpm-levels.c"
          ).read_text(errors="replace")

          core = Path(
              "drivers/cpuidle/cpuidle.c"
          ).read_text(errors="replace")

          config = (
              out / "IDLE-CONFIG-STATE.txt"
          ).read_text(errors="replace")

          def has(token, text=lpm):
              return token in text

          drm_state = "UNKNOWN"

          for line in config.splitlines():
              if line.startswith(
                  "CONFIG_DRM_PANEL_STATE="
              ):
                  drm_state = line.split(
                      "=",
                      1,
                  )[1]

          default_true = has(
              "static bool sleep_disabled = true;"
          )

          unblank_true = (
              has("case DRM_PANEL_BLANK_UNBLANK:")
              and has("sleep_disabled = true;")
          )

          screen_off_false = (
              has("case DRM_PANEL_BLANK_POWERDOWN:")
              and has("case DRM_PANEL_BLANK_LP:")
              and has("sleep_disabled = false;")
          )

          panel_binding = (
              has("goodix_get_panel")
              and has("drm_panel_notifier_register")
          )

          selection_guard = has(
              "if (!cpu || sleep_disabled)"
          )

          entry_guard = (
              has("if (sleep_disabled) {")
              and has("cpu_do_idle();")
          )

          generic_guard = (
              "if (!lpm_sleep_disabled())"
              in core
          )

          display_policy_compiled = (
              drm_state in ("Y", "M")
          )

          screen_on_deep_idle_block = all(
              (
                  display_policy_compiled,
                  default_true,
                  unblank_true,
                  panel_binding,
                  selection_guard,
                  entry_guard,
              )
          )

          screen_off_reenable = all(
              (
                  display_policy_compiled,
                  screen_off_false,
                  selection_guard,
                  entry_guard,
              )
          )

          with (
              out /
              "DISPLAY-IDLE-CONTROL-FLOW.txt"
          ).open("w") as f:
              f.write(
                  f"CONFIG_DRM_PANEL_STATE={drm_state}\n"
              )
              f.write(
                  "SLEEP_DISABLED_DEFAULT_TRUE="
                  f"{'YES' if default_true else 'NO'}\n"
              )
              f.write(
                  "DISPLAY_UNBLANK_SETS_TRUE="
                  f"{'YES' if unblank_true else 'NO'}\n"
              )
              f.write(
                  "DISPLAY_POWERDOWN_OR_LP_SETS_FALSE="
                  f"{'YES' if screen_off_false else 'NO'}\n"
              )
              f.write(
                  "ACTIVE_PANEL_NOTIFIER_BOUND="
                  f"{'YES' if panel_binding else 'NO'}\n"
              )
              f.write(
                  "IDLE_SELECTION_GUARD="
                  f"{'YES' if selection_guard else 'NO'}\n"
              )
              f.write(
                  "IDLE_ENTRY_FALLBACK_CPU_DO_IDLE="
                  f"{'YES' if entry_guard else 'NO'}\n"
              )
              f.write(
                  "GENERIC_CPUIDLE_SLEEP_GUARD="
                  f"{'YES' if generic_guard else 'NO'}\n"
              )
              f.write(
                  "STATIC_SCREEN_ON_DEEP_IDLE_BLOCK="
                  f"{'YES' if screen_on_deep_idle_block else 'NO'}\n"
              )
              f.write(
                  "STATIC_SCREEN_OFF_DEEP_IDLE_REENABLE="
                  f"{'YES' if screen_off_reenable else 'NO'}\n"
              )

          print(
              (
                  out /
                  "DISPLAY-IDLE-CONTROL-FLOW.txt"
              ).read_text()
          )
          PY

      - name: Build machine readable audit conclusion
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import csv
          import os
          from pathlib import Path

          out = Path(os.environ["ARTIFACT_DIR"])

          matrix = {}

          with (
              out /
              "SLEEP-POLICY-MATRIX.tsv"
          ).open() as f:
              reader = csv.DictReader(
                  f,
                  delimiter="\t",
              )

              for row in reader:
                  matrix[row["source"]] = row

          candidate = matrix["CANDIDATE"]
          xiaomi = matrix["XIAOMI"]
          common = matrix["ANDROID_COMMON"]

          flow = {}

          for line in (
              out /
              "DISPLAY-IDLE-CONTROL-FLOW.txt"
          ).read_text().splitlines():
              if "=" in line:
                  key, value = line.split(
                      "=",
                      1,
                  )
                  flow[key] = value

          candidate_display_policy = all(
              int(candidate[key]) == 1
              for key in (
                  "default_true",
                  "readonly_param",
                  "drm_notifier",
                  "goodix_panel",
                  "panel_registration",
                  "selection_guard",
                  "entry_guard_cpu_do_idle",
                  "lpm_export",
                  "core_integration",
                  "header_integration",
              )
          )

          xiaomi_display_policy = any(
              int(xiaomi[key]) == 1
              for key in (
                  "default_true",
                  "readonly_param",
                  "drm_notifier",
                  "goodix_panel",
                  "panel_registration",
                  "selection_guard",
                  "entry_guard_cpu_do_idle",
                  "lpm_export",
                  "core_integration",
                  "header_integration",
              )
          )

          common_display_policy = any(
              int(common[key]) == 1
              for key in (
                  "default_true",
                  "readonly_param",
                  "drm_notifier",
                  "goodix_panel",
                  "panel_registration",
                  "selection_guard",
                  "entry_guard_cpu_do_idle",
                  "lpm_export",
                  "core_integration",
                  "header_integration",
              )
          )

          screen_block = (
              flow.get(
                  "STATIC_SCREEN_ON_DEEP_IDLE_BLOCK"
              )
              == "YES"
          )

          if (
              candidate_display_policy
              and screen_block
              and not xiaomi_display_policy
              and not common_display_policy
          ):
              review = (
                  "CUSTOM_DISPLAY_COUPLED_DEEP_IDLE_DISABLE_REVIEW"
              )
          elif candidate_display_policy and screen_block:
              review = (
                  "DISPLAY_COUPLED_DEEP_IDLE_POLICY_REVIEW"
              )
          else:
              review = (
                  "NO_COMPLETE_DISPLAY_COUPLED_DEEP_IDLE_BLOCK_CONFIRMED"
              )

          commits = []

          commit_file = (
              out /
              "IDLE-POLICY-COMMIT-CANDIDATES.txt"
          )

          if commit_file.exists():
              commits = [
                  line.strip()
                  for line in commit_file.read_text().splitlines()
                  if line.strip()
              ]

          with (
              out /
              "RESULT.txt"
          ).open("w") as f:
              f.write(
                  "RESULT=PASS_AUDIT\n"
              )

              f.write(
                  "BASE_CANDIDATE_TREE="
                  "5d25b7e0124d7fb695f3f07b45928fcb5780d0e8\n"
              )

              f.write(
                  "CANDIDATE_DISPLAY_COUPLED_SLEEP_POLICY="
                  f"{'YES' if candidate_display_policy else 'NO'}\n"
              )

              f.write(
                  "STATIC_SCREEN_ON_DEEP_IDLE_BLOCK="
                  f"{'YES' if screen_block else 'NO'}\n"
              )

              f.write(
                  "STATIC_SCREEN_OFF_DEEP_IDLE_REENABLE="
                  f"{flow.get('STATIC_SCREEN_OFF_DEEP_IDLE_REENABLE', 'UNKNOWN')}\n"
              )

              f.write(
                  "CANDIDATE_SLEEP_DEFAULT_TRUE="
                  f"{candidate['default_true']}\n"
              )

              f.write(
                  "CANDIDATE_DRM_NOTIFIER="
                  f"{candidate['drm_notifier']}\n"
              )

              f.write(
                  "CANDIDATE_GOODIX_PANEL="
                  f"{candidate['goodix_panel']}\n"
              )

              f.write(
                  "CANDIDATE_SELECTION_GUARD="
                  f"{candidate['selection_guard']}\n"
              )

              f.write(
                  "CANDIDATE_ENTRY_GUARD_CPU_DO_IDLE="
                  f"{candidate['entry_guard_cpu_do_idle']}\n"
              )

              f.write(
                  "CANDIDATE_LPM_SLEEP_EXPORT="
                  f"{candidate['lpm_export']}\n"
              )

              f.write(
                  "CANDIDATE_GENERIC_CPUIDLE_INTEGRATION="
                  f"{candidate['core_integration']}\n"
              )

              f.write(
                  "XIAOMI_DISPLAY_COUPLED_POLICY="
                  f"{'YES' if xiaomi_display_policy else 'NO'}\n"
              )

              f.write(
                  "XIAOMI_SLEEP_DEFAULT_TRUE="
                  f"{xiaomi['default_true']}\n"
              )

              f.write(
                  "XIAOMI_DRM_NOTIFIER="
                  f"{xiaomi['drm_notifier']}\n"
              )

              f.write(
                  "XIAOMI_GOODIX_PANEL="
                  f"{xiaomi['goodix_panel']}\n"
              )

              f.write(
                  "XIAOMI_SELECTION_GUARD="
                  f"{xiaomi['selection_guard']}\n"
              )

              f.write(
                  "XIAOMI_ENTRY_GUARD_CPU_DO_IDLE="
                  f"{xiaomi['entry_guard_cpu_do_idle']}\n"
              )

              f.write(
                  "XIAOMI_LPM_SLEEP_EXPORT="
                  f"{xiaomi['lpm_export']}\n"
              )

              f.write(
                  "XIAOMI_GENERIC_CPUIDLE_INTEGRATION="
                  f"{xiaomi['core_integration']}\n"
              )

              f.write(
                  "ANDROID_COMMON_DISPLAY_COUPLED_POLICY="
                  f"{'YES' if common_display_policy else 'NO'}\n"
              )

              f.write(
                  "DISCOVERED_IDLE_POLICY_COMMIT_COUNT="
