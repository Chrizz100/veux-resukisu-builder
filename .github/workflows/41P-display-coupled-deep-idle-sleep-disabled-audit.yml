          compare_file \
            "$ARTIFACT_DIR/candidate-drivers_cpuidle_lpm-levels.c" \
            "$ARTIFACT_DIR/xiaomi-drivers_cpuidle_lpm-levels.c" \
            "$ARTIFACT_DIR/CANDIDATE-VS-XIAOMI-LPM-LEVELS.diff"

          compare_file \
