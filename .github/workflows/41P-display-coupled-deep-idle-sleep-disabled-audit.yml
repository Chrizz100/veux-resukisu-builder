      - name: Extract unique introducing commit candidates
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          {
            git log \
              --all \
              --format='%H' \
              -S'static bool sleep_disabled = true;' \
              -- drivers/cpuidle/lpm-levels.c \
              || true

            git log \
              --all \
              --format='%H' \
              -S'lpm_drm_panel_notify' \
              -- drivers/cpuidle/lpm-levels.c \
              || true

            git log \
              --all \
              --format='%H' \
              -S'goodix_get_panel' \
              -- drivers/cpuidle/lpm-levels.c \
              || true

            git log \
              --all \
              --format='%H' \
              -S'if (!cpu || sleep_disabled)' \
              -- drivers/cpuidle/lpm-levels.c \
              || true

            git log \
              --all \
              --format='%H' \
              -S'lpm_sleep_disabled' \
              -- \
              drivers/cpuidle/lpm-levels.c \
              drivers/cpuidle/cpuidle.c \
              include/linux/cpuidle.h \
              || true
          } \
            | grep -E '^[0-9a-f]{40}$' \
            | sort -u \
            > "$ARTIFACT_DIR/IDLE-POLICY-COMMIT-CANDIDATES.txt" \
            || true

          : > "$ARTIFACT_DIR/IDLE-POLICY-COMMIT-SUMMARIES.txt"

          while IFS= read -r SHA; do
            [ -n "$SHA" ] || continue

            {
              echo "============================================================"
              git show \
                --no-patch \
                --format='SHA=%H%nAUTHOR_DATE=%aI%nAUTHOR=%an%nSUBJECT=%s' \
                "$SHA" \
                || true

              echo
              echo "FILES:"

              git diff-tree \
                --no-commit-id \
                --name-status \
                -r \
                "$SHA" \
                || true

              echo
            } >> "$ARTIFACT_DIR/IDLE-POLICY-COMMIT-SUMMARIES.txt"

          done < "$ARTIFACT_DIR/IDLE-POLICY-COMMIT-CANDIDATES.txt"

          cat "$ARTIFACT_DIR/IDLE-POLICY-COMMIT-CANDIDATES.txt"

          echo
          cat "$ARTIFACT_DIR/IDLE-POLICY-COMMIT-SUMMARIES.txt"

      - name: Compare Candidate with Xiaomi idle files
