name: 41P - VEUX Display Coupled Deep Idle Sleep Disabled Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ARCH: arm64

      COMMON_REF: "android11-5.4.274_r00"
      STOCK_REF: "veux-r-oss"

      STABILITY_REVERT: "f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80"

      EXPECTED_CANDIDATE_TREE: "5d25b7e0124d7fb695f3f07b45928fcb5780d0e8"

      OUT_DIR: out
      ARTIFACT_DIR: ${{ github.workspace }}/display-deep-idle-audit

    steps:
      - name: Prepare audit directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ARTIFACT_DIR"

          cat > "$ARTIFACT_DIR/PLAN.txt" <<'EOF'
          VEUX Display Coupled Deep Idle / sleep_disabled Audit
          =====================================================

          Previously closed items:
          - CASS MaxFreq/Thermal adaptation
          - SPRD task rotation disabled
          - standard LB CPU-capacity rate limit restored
          - CONFIG_CPUSETS restored
          - CASS reserved-CPU issue rendered inactive
          - exact Xiaomi VEUX PELT8 restored
          - custom HZ100 removed, HZ250 default restored
          - schedutil lower-step heuristic removed
          - normal schedutil UClamp boost+cap restored

          Current related checklist items:
          1. Deep Idle disabled while display is on
          2. related sleep_disabled modifications

          Known Candidate observations:
          - under CONFIG_DRM_PANEL:
              static bool sleep_disabled = true;
          - display UNBLANK sets sleep_disabled=true
          - display POWERDOWN/LP sets sleep_disabled=false
          - goodix_get_panel() supplies the active panel
          - a DRM panel notifier is registered
          - idle selection contains a sleep_disabled guard
          - idle entry contains a sleep_disabled guard
          - lpm_sleep_disabled() is exported
          - generic cpuidle code calls lpm_sleep_disabled()

          Known Xiaomi observation:
          - sleep_disabled exists as a normal module parameter
          - its baseline declaration is not display-coupled
          - Xiaomi does not have the Candidate lpm_sleep_disabled()
            integration in include/linux/cpuidle.h

          Purpose of 41P:
          - reconstruct exact Candidate 2
          - resolve relevant VEUX configuration
          - enumerate every sleep_disabled-related reference
          - prove exact screen-on/screen-off behaviour
          - prove exact idle-selection and idle-entry effects
          - inspect generic cpuidle integration
          - dynamically discover introducing commits using git blame/log
          - compare Candidate 2 with official Xiaomi VEUX
          - compare with Android Common where corresponding files exist
          - determine whether this is a custom display-coupled idle policy

          IMPORTANT:
          - no unverified historical commit SHA is hardcoded
          - commit attribution is discovered from the exact source tree

          This workflow is AUDIT ONLY.

          No source modification.
          No kernel Image build.
          No boot.img.
          No flashable ZIP.
          No device access.
          No flashing.
          EOF

      - name: Checkout exact VEUX source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: "20240619"
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Recreate exact Candidate 2
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          BASE_SHA="$(git rev-parse HEAD)"
          BASE_TREE="$(git rev-parse HEAD^{tree})"

          git remote remove android-common 2>/dev/null || true

          git remote add \
            android-common \
            https://android.googlesource.com/kernel/common

          git fetch \
            --no-tags \
            android-common \
            "$COMMON_REF"

          COMMON_SHA="$(git rev-parse FETCH_HEAD)"

          git update-ref \
            refs/remotes/android-common/audit-base \
            "$COMMON_SHA"

          git merge \
            --no-edit \
            "$COMMON_SHA"

          MERGED_SHA="$(git rev-parse HEAD)"
          MERGED_TREE="$(git rev-parse HEAD^{tree})"

          git cat-file -e \
            "${STABILITY_REVERT}^{commit}"

          git revert \
            --no-edit \
            "$STABILITY_REVERT"

          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"

          KERNEL_VERSION="$(
            make -s kernelversion
          )"

          if [ "$KERNEL_VERSION" != "5.4.274" ]; then
            echo "ERROR: expected Linux 5.4.274"
            echo "Actual: $KERNEL_VERSION"
            exit 1
          fi

          if [ "$CANDIDATE_TREE" != "$EXPECTED_CANDIDATE_TREE" ]; then
            echo "ERROR: Candidate 2 tree mismatch"
            echo "Expected: $EXPECTED_CANDIDATE_TREE"
            echo "Actual:   $CANDIDATE_TREE"
            exit 1
          fi

          {
            echo "BASE_SHA=$BASE_SHA"
            echo "BASE_TREE=$BASE_TREE"
            echo "COMMON_SHA=$COMMON_SHA"
            echo "MERGED_SHA=$MERGED_SHA"
            echo "MERGED_TREE=$MERGED_TREE"
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "CANDIDATE_TREE=$CANDIDATE_TREE"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "COMMON_REF=$COMMON_REF"
            echo "STABILITY_REVERT=$STABILITY_REVERT"
          } | tee "$ARTIFACT_DIR/IDENTITY.txt"

      - name: Fetch official Xiaomi VEUX reference
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git remote remove xiaomi 2>/dev/null || true

          git remote add \
            xiaomi \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git

          git fetch \
            --no-tags \
            xiaomi \
            "+refs/heads/${STOCK_REF}:refs/remotes/xiaomi/${STOCK_REF}"

          STOCK_SHA="$(
            git rev-parse "xiaomi/${STOCK_REF}"
          )"

          MERGE_BASE="$(
            git merge-base \
              HEAD \
              "xiaomi/${STOCK_REF}" \
              || true
          )"

          {
            echo "STOCK_REF=$STOCK_REF"
            echo "STOCK_SHA=$STOCK_SHA"
            echo "CANDIDATE_XIAOMI_MERGE_BASE=${MERGE_BASE:-NONE}"
          } | tee "$ARTIFACT_DIR/XIAOMI-REFERENCE.txt"

      - name: Resolve relevant VEUX idle configuration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$OUT_DIR"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            veux_defconfig \
            2>&1 \
            | tee "$ARTIFACT_DIR/config.log"

          CONFIG="$OUT_DIR/.config"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: resolved .config missing"
            exit 1
          fi

          cp \
            "$CONFIG" \
            "$ARTIFACT_DIR/resolved.config"

          {
            echo "===== Relevant resolved idle/display configuration ====="

            grep -E \
              '^(CONFIG_CPU_IDLE=|# CONFIG_CPU_IDLE|CONFIG_ARM_QCOM_LPM_CPUIDLE=|# CONFIG_ARM_QCOM_LPM_CPUIDLE|CONFIG_DRM=|# CONFIG_DRM|CONFIG_DRM_PANEL=|# CONFIG_DRM_PANEL|CONFIG_PM=|# CONFIG_PM|CONFIG_PM_SLEEP=|# CONFIG_PM_SLEEP|CONFIG_SUSPEND=|# CONFIG_SUSPEND|CONFIG_NO_HZ=|# CONFIG_NO_HZ)' \
              "$CONFIG" \
              || true
          } | tee "$ARTIFACT_DIR/IDLE-CONFIG.txt"

          get_state()
          {
            local symbol="$1"

            if grep -qx \
              "${symbol}=y" \
              "$CONFIG"
            then
              echo "Y"
            elif grep -qx \
              "${symbol}=m" \
              "$CONFIG"
            then
              echo "M"
            elif grep -qx \
              "# ${symbol} is not set" \
              "$CONFIG"
            then
              echo "N"
            else
              echo "UNKNOWN"
            fi
          }

          {
            echo "CONFIG_CPU_IDLE_STATE=$(get_state CONFIG_CPU_IDLE)"
            echo "CONFIG_ARM_QCOM_LPM_CPUIDLE_STATE=$(get_state CONFIG_ARM_QCOM_LPM_CPUIDLE)"
            echo "CONFIG_DRM_STATE=$(get_state CONFIG_DRM)"
            echo "CONFIG_DRM_PANEL_STATE=$(get_state CONFIG_DRM_PANEL)"
            echo "CONFIG_PM_STATE=$(get_state CONFIG_PM)"
          } | tee "$ARTIFACT_DIR/IDLE-CONFIG-STATE.txt"

      - name: Enumerate Candidate sleep disabled references
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "============================================================"
            echo "Candidate sleep_disabled / display integration references"
            echo "============================================================"

            git grep \
              -nE \
              'sleep_disabled|lpm_sleep_disabled|lpm_drm_panel_notify|goodix_get_panel|drm_panel_notifier_register' \
              HEAD \
              -- \
              drivers/cpuidle \
              include/linux \
              2>/dev/null \
              || true
          } > "$ARTIFACT_DIR/CANDIDATE-SLEEP-REFERENCES.txt"

          cat "$ARTIFACT_DIR/CANDIDATE-SLEEP-REFERENCES.txt"

          REF_COUNT="$(
            grep -Ec \
              'sleep_disabled|lpm_sleep_disabled|lpm_drm_panel_notify|goodix_get_panel|drm_panel_notifier_register' \
              "$ARTIFACT_DIR/CANDIDATE-SLEEP-REFERENCES.txt" \
              || true
          )"

          echo "CANDIDATE_SLEEP_REFERENCE_COUNT=$REF_COUNT" \
            | tee "$ARTIFACT_DIR/CANDIDATE-SLEEP-REFERENCE-COUNT.txt"

      - name: Enumerate Xiaomi sleep disabled references
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "============================================================"
            echo "Xiaomi sleep_disabled / display integration references"
            echo "============================================================"

            git grep \
              -nE \
              'sleep_disabled|lpm_sleep_disabled|lpm_drm_panel_notify|goodix_get_panel|drm_panel_notifier_register' \
              "xiaomi/${STOCK_REF}" \
              -- \
              drivers/cpuidle \
              include/linux \
              2>/dev/null \
              || true
          } > "$ARTIFACT_DIR/XIAOMI-SLEEP-REFERENCES.txt"

          cat "$ARTIFACT_DIR/XIAOMI-SLEEP-REFERENCES.txt"

      - name: Enumerate Android Common sleep disabled references
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "============================================================"
            echo "Android Common related references"
            echo "============================================================"

            git grep \
              -nE \
              'sleep_disabled|lpm_sleep_disabled|lpm_drm_panel_notify|goodix_get_panel|drm_panel_notifier_register' \
              "android-common/audit-base" \
              -- \
              drivers/cpuidle \
              include/linux \
              2>/dev/null \
              || true
          } > "$ARTIFACT_DIR/COMMON-SLEEP-REFERENCES.txt"

          cat "$ARTIFACT_DIR/COMMON-SLEEP-REFERENCES.txt"

      - name: Extract relevant source files from all baselines
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          FILES=(
            "drivers/cpuidle/lpm-levels.c"
            "drivers/cpuidle/cpuidle.c"
            "include/linux/cpuidle.h"
            "drivers/cpuidle/lpm-levels-legacy.c"
          )

          : > "$ARTIFACT_DIR/SOURCE-PRESENCE-MATRIX.tsv"

          printf '%s\n' \
            $'source\tfile\tpresent' \
            > "$ARTIFACT_DIR/SOURCE-PRESENCE-MATRIX.tsv"

          for FILE in "${FILES[@]}"; do
            SAFE="$(
              echo "$FILE" \
                | tr '/' '_'
            )"

            if git cat-file -e \
              "HEAD:${FILE}" \
              2>/dev/null
            then
              git show \
                "HEAD:${FILE}" \
                > "$ARTIFACT_DIR/candidate-${SAFE}"

              printf 'CANDIDATE\t%s\t1\n' \
                "$FILE" \
                >> "$ARTIFACT_DIR/SOURCE-PRESENCE-MATRIX.tsv"
            else
              printf 'CANDIDATE\t%s\t0\n' \
                "$FILE" \
                >> "$ARTIFACT_DIR/SOURCE-PRESENCE-MATRIX.tsv"
            fi

            if git cat-file -e \
              "xiaomi/${STOCK_REF}:${FILE}" \
              2>/dev/null
            then
              git show \
                "xiaomi/${STOCK_REF}:${FILE}" \
                > "$ARTIFACT_DIR/xiaomi-${SAFE}"

              printf 'XIAOMI\t%s\t1\n' \
                "$FILE" \
                >> "$ARTIFACT_DIR/SOURCE-PRESENCE-MATRIX.tsv"
            else
              printf 'XIAOMI\t%s\t0\n' \
                "$FILE" \
                >> "$ARTIFACT_DIR/SOURCE-PRESENCE-MATRIX.tsv"
            fi

            if git cat-file -e \
              "android-common/audit-base:${FILE}" \
              2>/dev/null
            then
              git show \
                "android-common/audit-base:${FILE}" \
                > "$ARTIFACT_DIR/common-${SAFE}"

              printf 'ANDROID_COMMON\t%s\t1\n' \
                "$FILE" \
                >> "$ARTIFACT_DIR/SOURCE-PRESENCE-MATRIX.tsv"
            else
              printf 'ANDROID_COMMON\t%s\t0\n' \
                "$FILE" \
                >> "$ARTIFACT_DIR/SOURCE-PRESENCE-MATRIX.tsv"
            fi
          done

          cat "$ARTIFACT_DIR/SOURCE-PRESENCE-MATRIX.tsv"

      - name: Verify Candidate display coupled sleep policy
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LPM="drivers/cpuidle/lpm-levels.c"
          CORE="drivers/cpuidle/cpuidle.c"
          HEADER="include/linux/cpuidle.h"

          REQUIRED_LPM=(
            'static bool sleep_disabled = true;'
            'module_param_named(sleep_disabled, sleep_disabled, bool, 0444);'
            'static int lpm_drm_panel_notify'
            'case DRM_PANEL_BLANK_UNBLANK:'
            'sleep_disabled = true;'
            'case DRM_PANEL_BLANK_POWERDOWN:'
            'case DRM_PANEL_BLANK_LP:'
            'sleep_disabled = false;'
            'extern struct drm_panel *goodix_get_panel(void);'
            'struct drm_panel *active_panel = goodix_get_panel();'
            'drm_panel_notifier_register(active_panel, &drm_notifier)'
            'if (!cpu || sleep_disabled)'
            'if (sleep_disabled) {'
            'cpu_do_idle();'
            'bool lpm_sleep_disabled(void)'
            'EXPORT_SYMBOL(lpm_sleep_disabled);'
          )

          for TOKEN in "${REQUIRED_LPM[@]}"; do
            if ! grep -qF \
              "$TOKEN" \
              "$LPM"
            then
              echo "ERROR: Candidate idle token missing: $TOKEN"
              exit 1
            fi
          done

          if ! grep -qF \
            'if (!lpm_sleep_disabled())' \
            "$CORE"
          then
            echo "ERROR: generic cpuidle lpm_sleep_disabled guard missing"
            exit 1
          fi

          if ! grep -qF \
            'extern bool lpm_sleep_disabled(void);' \
            "$HEADER"
          then
            echo "ERROR: cpuidle header lpm_sleep_disabled declaration missing"
            exit 1
          fi

          {
            echo "CANDIDATE_SLEEP_DEFAULT_TRUE=YES"
            echo "CANDIDATE_SLEEP_PARAM_READONLY=YES"
            echo "CANDIDATE_DRM_PANEL_NOTIFIER=YES"
            echo "CANDIDATE_DISPLAY_UNBLANK_SLEEP_DISABLED_TRUE=YES"
            echo "CANDIDATE_DISPLAY_POWERDOWN_SLEEP_DISABLED_FALSE=YES"
            echo "CANDIDATE_GOODIX_PANEL_BINDING=YES"
            echo "CANDIDATE_IDLE_SELECTION_SLEEP_GUARD=YES"
            echo "CANDIDATE_IDLE_ENTRY_SLEEP_GUARD=YES"
            echo "CANDIDATE_LPM_SLEEP_DISABLED_EXPORT=YES"
            echo "CANDIDATE_GENERIC_CPUIDLE_INTEGRATION=YES"
          } | tee "$ARTIFACT_DIR/CANDIDATE-IDLE-POLICY.txt"

      - name: Capture Candidate semantic contexts
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LPM="drivers/cpuidle/lpm-levels.c"
          CORE="drivers/cpuidle/cpuidle.c"
          HEADER="include/linux/cpuidle.h"

          {
            echo "============================================================"
            echo "sleep_disabled declaration / DRM notifier"
            echo "============================================================"

            grep \
              -n \
              -A70 \
              -B15 \
              'static bool sleep_disabled = true' \
              "$LPM" \
              || true

            echo
            echo "============================================================"
            echo "Idle selection guard"
            echo "============================================================"

            grep \
              -n \
              -A25 \
              -B25 \
              'if (!cpu || sleep_disabled)' \
              "$LPM" \
              || true

            echo
            echo "============================================================"
            echo "Idle entry guard"
            echo "============================================================"

            grep \
              -n \
              -A25 \
              -B25 \
              'if (sleep_disabled) {' \
              "$LPM" \
              || true

            echo
            echo "============================================================"
            echo "lpm_sleep_disabled export"
            echo "============================================================"

            grep \
              -n \
              -A12 \
              -B12 \
              'bool lpm_sleep_disabled' \
              "$LPM" \
              || true

            echo
            echo "============================================================"
            echo "DRM panel registration"
            echo "============================================================"

            grep \
              -n \
              -A25 \
              -B20 \
              'active_panel = goodix_get_panel' \
              "$LPM" \
              || true

            echo
            echo "============================================================"
            echo "Generic cpuidle integration"
            echo "============================================================"

            grep \
              -n \
              -A15 \
              -B15 \
              'lpm_sleep_disabled' \
              "$CORE" \
              || true

            echo
            echo "============================================================"
            echo "Header integration"
            echo "============================================================"

            grep \
              -n \
              -A10 \
              -B10 \
              'lpm_sleep_disabled' \
              "$HEADER" \
              || true

          } > "$ARTIFACT_DIR/CANDIDATE-IDLE-CONTEXTS.txt"

          cat "$ARTIFACT_DIR/CANDIDATE-IDLE-CONTEXTS.txt"

      - name: Analyse Xiaomi baseline policy
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LPM="$ARTIFACT_DIR/xiaomi-drivers_cpuidle_lpm-levels.c"
          CORE="$ARTIFACT_DIR/xiaomi-drivers_cpuidle_cpuidle.c"
          HEADER="$ARTIFACT_DIR/xiaomi-include_linux_cpuidle.h"

          if [ ! -s "$LPM" ]; then
            echo "ERROR: Xiaomi lpm-levels.c missing"
            exit 1
          fi

          if ! grep -qF \
            'static bool sleep_disabled;' \
            "$LPM"
          then
            echo "ERROR: Xiaomi normal sleep_disabled declaration missing"
            exit 1
          fi

          if ! grep -qF \
            'module_param_named(sleep_disabled, sleep_disabled, bool, 0664);' \
            "$LPM"
          then
            echo "ERROR: Xiaomi normal sleep_disabled module parameter missing"
            exit 1
          fi

          XIAOMI_DEFAULT_TRUE=0
          XIAOMI_DRM_NOTIFY=0
          XIAOMI_GOODIX_PANEL=0
          XIAOMI_LPM_EXPORT=0
          XIAOMI_CORE_INTEGRATION=0
          XIAOMI_HEADER_INTEGRATION=0
          XIAOMI_SELECT_GUARD=0
          XIAOMI_ENTRY_GUARD=0

          grep -qF \
            'static bool sleep_disabled = true;' \
            "$LPM" \
            && XIAOMI_DEFAULT_TRUE=1 \
            || true

          grep -qF \
            'lpm_drm_panel_notify' \
            "$LPM" \
            && XIAOMI_DRM_NOTIFY=1 \
            || true

          grep -qF \
            'goodix_get_panel' \
            "$LPM" \
            && XIAOMI_GOODIX_PANEL=1 \
            || true

          grep -qF \
            'bool lpm_sleep_disabled(void)' \
            "$LPM" \
            && XIAOMI_LPM_EXPORT=1 \
            || true

          if [ -s "$CORE" ]; then
            grep -qF \
              'lpm_sleep_disabled' \
              "$CORE" \
              && XIAOMI_CORE_INTEGRATION=1 \
              || true
          fi

          if [ -s "$HEADER" ]; then
            grep -qF \
              'lpm_sleep_disabled' \
              "$HEADER" \
              && XIAOMI_HEADER_INTEGRATION=1 \
              || true
          fi

          grep -qF \
            'if (!cpu || sleep_disabled)' \
            "$LPM" \
            && XIAOMI_SELECT_GUARD=1 \
            || true

          grep -qF \
            'if (sleep_disabled) {' \
            "$LPM" \
            && XIAOMI_ENTRY_GUARD=1 \
            || true

          {
            echo "XIAOMI_SLEEP_DEFAULT_TRUE=$XIAOMI_DEFAULT_TRUE"
            echo "XIAOMI_SLEEP_DEFAULT_FALSE=$((1 - XIAOMI_DEFAULT_TRUE))"
            echo "XIAOMI_SLEEP_PARAM_0664=1"
            echo "XIAOMI_DRM_PANEL_NOTIFIER=$XIAOMI_DRM_NOTIFY"
            echo "XIAOMI_GOODIX_PANEL_BINDING=$XIAOMI_GOODIX_PANEL"
            echo "XIAOMI_LPM_SLEEP_DISABLED_EXPORT=$XIAOMI_LPM_EXPORT"
            echo "XIAOMI_GENERIC_CPUIDLE_INTEGRATION=$XIAOMI_CORE_INTEGRATION"
            echo "XIAOMI_HEADER_INTEGRATION=$XIAOMI_HEADER_INTEGRATION"
            echo "XIAOMI_CANDIDATE_STYLE_SELECT_GUARD=$XIAOMI_SELECT_GUARD"
            echo "XIAOMI_CANDIDATE_STYLE_ENTRY_GUARD=$XIAOMI_ENTRY_GUARD"
          } | tee "$ARTIFACT_DIR/XIAOMI-IDLE-POLICY.txt"

      - name: Capture Xiaomi sleep disabled contexts
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LPM="$ARTIFACT_DIR/xiaomi-drivers_cpuidle_lpm-levels.c"

          {
            echo "============================================================"
            echo "Xiaomi sleep_disabled declaration"
            echo "============================================================"

            grep \
              -n \
              -A25 \
              -B15 \
              'static bool sleep_disabled' \
              "$LPM" \
              || true

            echo
            echo "============================================================"
            echo "Every Xiaomi sleep_disabled use"
            echo "============================================================"

            grep \
              -n \
              -A12 \
              -B12 \
              'sleep_disabled' \
              "$LPM" \
              || true
          } > "$ARTIFACT_DIR/XIAOMI-IDLE-CONTEXTS.txt"

          cat "$ARTIFACT_DIR/XIAOMI-IDLE-CONTEXTS.txt"

      - name: Build sleep policy matrix
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          out = Path(os.environ["ARTIFACT_DIR"])

          def read(path):
              p = out / path
              if not p.exists():
                  return ""
              return p.read_text(errors="replace")

          candidate_lpm = Path(
              "drivers/cpuidle/lpm-levels.c"
          ).read_text(errors="replace")

          candidate_core = Path(
              "drivers/cpuidle/cpuidle.c"
          ).read_text(errors="replace")

          candidate_header = Path(
              "include/linux/cpuidle.h"
          ).read_text(errors="replace")

          xiaomi_lpm = read(
              "xiaomi-drivers_cpuidle_lpm-levels.c"
          )

          xiaomi_core = read(
              "xiaomi-drivers_cpuidle_cpuidle.c"
          )

          xiaomi_header = read(
              "xiaomi-include_linux_cpuidle.h"
          )

          common_lpm = read(
              "common-drivers_cpuidle_lpm-levels.c"
          )

          common_core = read(
              "common-drivers_cpuidle_cpuidle.c"
          )

          common_header = read(
              "common-include_linux_cpuidle.h"
          )

          sources = {
              "CANDIDATE": (
                  candidate_lpm,
                  candidate_core,
                  candidate_header,
              ),
              "XIAOMI": (
                  xiaomi_lpm,
                  xiaomi_core,
                  xiaomi_header,
              ),
              "ANDROID_COMMON": (
                  common_lpm,
                  common_core,
                  common_header,
              ),
          }

          def yes(condition):
              return 1 if condition else 0

          rows = []

          for label, (lpm, core, header) in sources.items():
              rows.append(
                  (
                      label,
                      yes(
                          "static bool sleep_disabled = true;"
                          in lpm
                      ),
                      yes(
                          "module_param_named("
                          "sleep_disabled, sleep_disabled, bool, 0444)"
                          in lpm
                      ),
                      yes(
                          "lpm_drm_panel_notify"
                          in lpm
                      ),
                      yes(
                          "goodix_get_panel"
                          in lpm
                      ),
                      yes(
                          "drm_panel_notifier_register("
                          in lpm
                      ),
                      yes(
                          "if (!cpu || sleep_disabled)"
                          in lpm
                      ),
                      yes(
                          "if (sleep_disabled) {"
                          in lpm
                          and "cpu_do_idle();"
                          in lpm
                      ),
                      yes(
                          "bool lpm_sleep_disabled(void)"
                          in lpm
                      ),
                      yes(
                          "lpm_sleep_disabled()"
                          in core
                      ),
                      yes(
