name: CLEAN GEN1 P8 v1 - VEUX A13 stock ROM regional boot compatibility audit

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: clean-gen1-p8-veux-a13-stock-rom-audit
  cancel-in-progress: false

env:
  P6V10_V2_RUN_ID: '33603757875'
  P6V10_V2_ARTIFACT: clean-gen1-p6v10-stock-kernel-release-sucompat-p7-boot-v2-33603757875
  EXPECTED_P6_RESULT: CLEAN_GEN1_P6V10_STOCK_KERNEL_IDENTITY_DETERMINISTIC_BUILD=PASS
  EXPECTED_P6_KERNEL_VERSION: '5.4.274'
  EXPECTED_P6_STOCK_RELEASE: 5.4.274-qgki-g82179e362f33
  EXPECTED_P6_STOCK_BOOT_SHA256: ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5
  EXPECTED_P6_IMAGE_SHA256: ''
  TRACKER_REPO: https://github.com/XiaomiFirmwareUpdater/miui-updates-tracker.git
  TRACKER_COMMIT: c9d55af855fa504a199daf4e41da58c538d326b0

jobs:
  regional-stock-audit:
    name: Stock boot audit - ${{ matrix.region }} - ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: global
            codename: veux_global
            region: Global
            version: OS1.0.12.0.TKCMIXM
            android: '13.0'
            date: '2024-12-05'
            md5: cda1240a451dd4f75776878b52f0cea3
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.12.0.TKCMIXM/veux_global_images_OS1.0.12.0.TKCMIXM_20241205.0000.00_13.0_global_cda1240a45.tgz
          - id: eea
            codename: veux_eea_global
            region: EEA
            version: OS1.0.13.0.TKCEUXM
            android: '13.0'
            date: '2025-12-27'
            md5: e887aa14ef7d196145cb9097a2b3de16
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.13.0.TKCEUXM/veux_eea_global_images_OS1.0.13.0.TKCEUXM_20251227.0000.00_13.0_eea_e887aa14ef.tgz
          - id: china
            codename: veux
            region: China
            version: OS1.0.10.0.TKCCNXM
            android: '13.0'
            date: '2024-12-18'
            md5: f0dc219786e26bfad344aff414a29674
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.10.0.TKCCNXM/veux_images_OS1.0.10.0.TKCCNXM_20241218.0000.00_13.0_cn_f0dc219786.tgz
          - id: indonesia
            codename: veux_id_global
            region: Indonesia
            version: OS1.0.10.0.TKCIDXM
            android: '13.0'
            date: '2024-12-12'
            md5: 72a3d5e7d1d6e82002907292df0226eb
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.10.0.TKCIDXM/veux_id_global_images_OS1.0.10.0.TKCIDXM_20241212.0000.00_13.0_id_72a3d5e7d1.tgz
          - id: india
            codename: veux_in_global
            region: India
            version: OS1.0.9.0.TKCINXM
            android: '13.0'
            date: '2024-12-12'
            md5: fb2147aa4b6b6ee1d868049ea3843caa
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.9.0.TKCINXM/veux_in_global_images_OS1.0.9.0.TKCINXM_20241212.0000.00_13.0_in_fb2147aa4b.tgz
          - id: japan
            codename: veux_jp_global
            region: Japan
            version: OS1.0.8.0.TKCJPXM
            android: '13.0'
            date: '2024-12-18'
            md5: e352eb09898771b6695fb5e7cb4a6af3
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.8.0.TKCJPXM/veux_jp_global_images_OS1.0.8.0.TKCJPXM_20241218.0000.00_13.0_jp_e352eb0989.tgz
          - id: russia
            codename: veux_ru_global
            region: Russia
            version: OS1.0.9.0.TKCRUXM
            android: '13.0'
            date: '2024-12-18'
            md5: 7c9b278138d5389242d8778415861a2b
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.9.0.TKCRUXM/veux_ru_global_images_OS1.0.9.0.TKCRUXM_20241218.0000.00_13.0_ru_7c9b278138.tgz
          - id: turkey
            codename: veux_tr_global
            region: Turkey
            version: OS1.0.8.0.TKCTRXM
            android: '13.0'
            date: '2024-12-17'
            md5: 91b613045b4845f542692384714bd773
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.8.0.TKCTRXM/veux_tr_global_images_OS1.0.8.0.TKCTRXM_20241217.0000.00_13.0_tr_91b613045b.tgz
          - id: taiwan
            codename: veux_tw_global
            region: Taiwan
            version: OS1.0.8.0.TKCTWXM
            android: '13.0'
            date: '2024-12-17'
            md5: 26da66dc04d525e4302fdd7d8e6173f5
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.8.0.TKCTWXM/veux_tw_global_images_OS1.0.8.0.TKCTWXM_20241217.0000.00_13.0_tw_26da66dc04.tgz

    env:
      REGION_ID: ${{ matrix.id }}
      REGION_NAME: ${{ matrix.region }}
      ROM_CODENAME: ${{ matrix.codename }}
      ROM_VERSION: ${{ matrix.version }}
      ROM_ANDROID: ${{ matrix.android }}
      ROM_DATE: ${{ matrix.date }}
      ROM_MD5: ${{ matrix.md5 }}
      ROM_URL: ${{ matrix.url }}
      WORK_DIR: ${{ github.workspace }}/p8-${{ matrix.id }}
      P6_DIR: ${{ github.workspace }}/p8-${{ matrix.id }}/p6v10-v2
      ROM_DIR: ${{ github.workspace }}/p8-${{ matrix.id }}/rom
      AUDIT_DIR: ${{ github.workspace }}/p8-${{ matrix.id }}/audit

    steps:
      - name: Initialize fail-closed regional audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR"
          mkdir -p "$P6_DIR" "$ROM_DIR" "$AUDIT_DIR"

          cat > "$AUDIT_DIR/00-plan.txt" <<EOF
          CLEAN GEN1 P8 v1 - VEUX Android 13 stock-ROM regional boot compatibility audit

          Region: $REGION_NAME
          Tracker codename: $ROM_CODENAME
          Stock version: $ROM_VERSION
          Android: $ROM_ANDROID

          Scope:
          - authenticate the exact successful P6-v10-v2 build artifact;
          - stream the pinned official Xiaomi fastboot ROM once;
          - verify the complete ROM archive MD5 while streaming;
          - extract only boot, vendor_boot, dtbo and vbmeta;
          - inspect boot geometry, stock kernel identity and embedded config;
          - compare only static contracts with the P6-v10-v2 Image;
          - upload text/JSON evidence only.

          Explicit exclusions:
          - no kernel source mutation;
          - no kernel build;
          - no boot image creation or repack;
          - no AnyKernel3 or other flashable ZIP;
          - no device access or flashing;
          - no compatibility or release claim from static evidence alone;
          - GEN1 and GEN2 completed releases remain unchanged.
          EOF

      - name: Install audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates coreutils curl file gzip python3 tar

      - name: Authenticate pinned ROM catalog entry
        shell: bash
        run: |
          set -euo pipefail

          test "$ROM_ANDROID" = '13.0'
          printf '%s' "$REGION_ID" | grep -Eq '^[a-z]+$'
          printf '%s' "$ROM_CODENAME" | grep -Eq '^veux(_[a-z]+_global|_global)?$'
          printf '%s' "$ROM_VERSION" | grep -Eq '^OS1\.0\.[0-9]+\.0\.TKC[A-Z]+$'
          printf '%s' "$ROM_MD5" | grep -Eq '^[0-9a-f]{32}$'
          printf '%s' "$ROM_URL" | grep -Eq '^https://[^/]+/OS1\.0\.[^/]+/veux[^/]+\.tgz$'

          git init -q "$WORK_DIR/tracker"
          git -C "$WORK_DIR/tracker" remote add origin "$TRACKER_REPO"
          git -C "$WORK_DIR/tracker" fetch -q --depth=1 origin "$TRACKER_COMMIT"
          git -C "$WORK_DIR/tracker" checkout -q --detach FETCH_HEAD
          test "$(git -C "$WORK_DIR/tracker" rev-parse HEAD)" = "$TRACKER_COMMIT"

          python3 - \
            "$WORK_DIR/tracker/data/latest.yml" \
            "$TRACKER_COMMIT" \
            "$ROM_CODENAME" "$ROM_VERSION" "$ROM_URL" "$ROM_MD5" \
            "$AUDIT_DIR/01-catalog-auth.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          source, tracker_commit, codename, version, url, md5, output = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          blocks = re.split(r"(?m)^- ", text)
          matches = []
          for raw in blocks:
              block = "- " + raw
              if f"codename: {codename}\n" not in block:
                  continue
              if f"version: {version}\n" not in block:
                  continue
              if f"link: {url}\n" not in block:
                  continue
              if f"md5: {md5}\n" not in block:
                  continue
              if "method: Fastboot\n" not in block:
                  continue
              if "branch: Stable\n" not in block:
                  continue
              if "android: '13.0'\n" not in block:
                  continue
              matches.append(block)

          if len(matches) != 1:
              raise SystemExit(
                  f"Expected one exact pinned tracker entry, found {len(matches)}"
              )

          Path(output).write_text(
              "P8_PINNED_ROM_CATALOG_ENTRY=PASS\n"
              f"TRACKER_COMMIT={tracker_commit}\n"
              f"ROM_CODENAME={codename}\n"
              f"ROM_VERSION={version}\n"
              f"ROM_MD5={md5}\n",
              encoding="utf-8",
          )
          PY

          grep -Fxq 'P8_PINNED_ROM_CATALOG_ENTRY=PASS' \
            "$AUDIT_DIR/01-catalog-auth.txt"

      - name: Download exact P6-v10-v2 candidate artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.P6V10_V2_ARTIFACT }}
          path: ${{ env.P6_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ env.P6V10_V2_RUN_ID }}

      - name: Authenticate exact P6-v10-v2 candidate
        shell: bash
        run: |
          set -euo pipefail

          test -s "$P6_DIR/ARTIFACT-SHA256SUMS"
          (
            cd "$P6_DIR"
            sha256sum -c ARTIFACT-SHA256SUMS \
              > "$AUDIT_DIR/02-p6-artifact-sha256-reverify.txt"
          )

          test -s "$P6_DIR/build-a/Image"
          test -s "$P6_DIR/build-a/veux.dtb"
          test -s "$P6_DIR/build-a/veux-5.4.274.base.config"
          test -s "$P6_DIR/17-result.txt"

          grep -Fxq "$EXPECTED_P6_RESULT" "$P6_DIR/17-result.txt"
          grep -Fxq "KERNEL_VERSION=$EXPECTED_P6_KERNEL_VERSION" \
            "$P6_DIR/17-result.txt"
          grep -Fxq "P6V10_STOCK_KERNEL_RELEASE=$EXPECTED_P6_STOCK_RELEASE" \
            "$P6_DIR/17-result.txt"
          grep -Fxq 'P6_IMAGE_REPRODUCIBLE=YES' "$P6_DIR/17-result.txt"
          grep -Fxq 'P6_VEUX_DTB_REPRODUCIBLE=YES' "$P6_DIR/17-result.txt"
          grep -Fxq 'P6V9_SUCOMPAT_CALLER_GATE_REGRESSION=PASS' \
            "$P6_DIR/17-result.txt"
          grep -Fxq 'MODULE_LOAD_FILTER_INCLUDED=NO' "$P6_DIR/17-result.txt"
          grep -Fxq 'FLASHABLE_ZIP_CREATED=NO' "$P6_DIR/17-result.txt"

          candidate_sha="$(sha256sum "$P6_DIR/build-a/Image" | awk '{print $1}')"
          if [ -n "$EXPECTED_P6_IMAGE_SHA256" ]; then
            test "$candidate_sha" = "$EXPECTED_P6_IMAGE_SHA256"
          fi

          {
            echo 'P8_P6V10_V2_INPUT_AUTH=PASS'
            echo "P6V10_V2_RUN_ID=$P6V10_V2_RUN_ID"
            echo "P6V10_V2_ARTIFACT=$P6V10_V2_ARTIFACT"
            echo "P6V10_V2_IMAGE_SHA256=$candidate_sha"
          } | tee "$AUDIT_DIR/02-p6-auth.txt"

      - name: Stream and authenticate official Xiaomi fastboot ROM
        shell: bash
        run: |
          set -euo pipefail

          fifo="$RUNNER_TEMP/p8-${REGION_ID}-archive.fifo"
          rm -f "$fifo"
          mkfifo "$fifo"

          md5sum < "$fifo" > "$AUDIT_DIR/03-rom-archive-md5.txt" &
          md5_pid=$!

          set +e
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            "$ROM_URL" \
            | tee "$fifo" \
            | tar -xzf - -C "$ROM_DIR" \
                --wildcards --no-anchored \
                'images/boot.img' \
                'images/vendor_boot.img' \
                'images/dtbo.img' \
                'images/vbmeta.img'
          pipeline_status=("${PIPESTATUS[@]}")
          set -e

          wait "$md5_pid"
          md5_status=$?
          rm -f "$fifo"

          test "${pipeline_status[0]}" -eq 0
          test "${pipeline_status[1]}" -eq 0
          test "${pipeline_status[2]}" -eq 0
          test "$md5_status" -eq 0

          actual_md5="$(awk '{print $1}' "$AUDIT_DIR/03-rom-archive-md5.txt")"
          test "$actual_md5" = "$ROM_MD5"

          for image_name in boot.img vendor_boot.img dtbo.img vbmeta.img; do
            mapfile -t matches < <(find "$ROM_DIR" -type f -name "$image_name" -print)
            test "${#matches[@]}" -eq 1
            cp "${matches[0]}" "$ROM_DIR/$image_name"
          done

          {
            echo 'P8_OFFICIAL_FASTBOOT_ROM_MD5=PASS'
            echo "ROM_MD5=$actual_md5"
            echo "ROM_VERSION=$ROM_VERSION"
            echo "ROM_REGION=$REGION_NAME"
          } | tee "$AUDIT_DIR/03-rom-auth.txt"

      - name: Inspect stock boot chain and compare static kernel contracts
        shell: bash
        run: |
          set -euo pipefail

          python3 - \
            "$ROM_DIR/boot.img" \
            "$ROM_DIR/vendor_boot.img" \
            "$ROM_DIR/dtbo.img" \
            "$ROM_DIR/vbmeta.img" \
            "$P6_DIR/build-a/Image" \
            "$P6_DIR/build-a/veux.dtb" \
            "$P6_DIR/build-a/veux-5.4.274.base.config" \
            "$AUDIT_DIR/region.json" \
            "$AUDIT_DIR/04-region-summary.txt" <<'PY'
          import gzip
          import hashlib
          import io
          import json
          import os
          import re
          import struct
          import sys
          from pathlib import Path

          (
              boot_path,
              vendor_boot_path,
              dtbo_path,
              vbmeta_path,
              candidate_path,
              candidate_dtb_path,
              candidate_config_path,
              json_path,
              text_path,
          ) = map(Path, sys.argv[1:])

          def need(value, message):
              if not value:
                  raise SystemExit(message)

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def u32le(data, offset):
              return struct.unpack_from("<I", data, offset)[0]

          def printable_c_string(data, start, limit=1024):
              end = min(len(data), start + limit)
              out = data[start:end].split(b"\0", 1)[0].split(b"\n", 1)[0]
              return out.decode("ascii", "replace")

          def linux_release(data):
              marker = b"Linux version "
              start = data.find(marker)
              need(start >= 0, "Linux version banner missing")
              banner = printable_c_string(data, start, 768)
              match = re.match(r"Linux version ([^ ]+)", banner)
              need(match is not None, "Linux version release parse failed")
              return match.group(1), banner

          def release_base(release):
              return re.sub(r"-g[0-9a-f]+(?:-dirty)?$", "", release)

          def embedded_config(data):
              begin = data.find(b"IKCFG_ST")
              end = data.find(b"IKCFG_ED", begin + 8)
              need(begin >= 0 and end > begin, "embedded IKCONFIG markers missing")
              blob = data[begin + 8:end]
              gz = blob.find(b"\x1f\x8b\x08")
              need(gz >= 0, "embedded IKCONFIG gzip stream missing")
              try:
                  return gzip.GzipFile(fileobj=io.BytesIO(blob[gz:])).read()
              except OSError as exc:
                  raise SystemExit(f"embedded IKCONFIG extraction failed: {exc}")

          def config_value(text, key):
              match = re.search(
                  rf"(?m)^(?:{re.escape(key)}=(.*)|# {re.escape(key)} is not set)$",
                  text,
              )
              return match.group(1) if match and match.group(1) is not None else (
                  "n" if match else None
              )

          def plain_image(path, magic_length=8):
              data = path.read_bytes()
              return {
                  "bytes": len(data),
                  "sha256": sha(data),
                  "magic_hex": data[:magic_length].hex(),
              }, data

          boot = boot_path.read_bytes()
          need(boot[:8] == b"ANDROID!", "stock boot magic missing")
          page_size = 4096
          kernel_size = u32le(boot, 8)
          ramdisk_size = u32le(boot, 12)
          os_version_field = u32le(boot, 16)
          header_size = u32le(boot, 20)
          header_version = u32le(boot, 40)
          need(header_version == 3, f"unexpected boot header version: {header_version}")
          need(header_size == 1580, f"unexpected boot header size: {header_size}")
          need(kernel_size > 16 * 1024 * 1024, "stock kernel payload too small")
          need(page_size + kernel_size <= len(boot), "stock kernel payload geometry")

          kernel = boot[page_size:page_size + kernel_size]
          ramdisk_offset = page_size + ((kernel_size + page_size - 1) // page_size) * page_size
          need(ramdisk_offset + ramdisk_size <= len(boot), "stock ramdisk geometry")
          ramdisk = boot[ramdisk_offset:ramdisk_offset + ramdisk_size]
          stock_release, stock_banner = linux_release(kernel)
          stock_config = embedded_config(kernel)
          stock_config_text = stock_config.decode("utf-8", "replace")

          candidate = candidate_path.read_bytes()
          candidate_release, candidate_banner = linux_release(candidate)
          candidate_config = candidate_config_path.read_bytes()
          candidate_config_text = candidate_config.decode("utf-8", "replace")

          vendor_info, vendor_boot = plain_image(vendor_boot_path)
          need(vendor_boot[:8] == b"VNDRBOOT", "vendor_boot magic missing")
          vendor_info.update({
              "header_version": u32le(vendor_boot, 8),
              "page_size": u32le(vendor_boot, 12),
          })

          dtbo_info, dtbo = plain_image(dtbo_path, 4)
          dtbo_info.update({
              "magic_be": struct.unpack_from(">I", dtbo, 0)[0],
              "magic_le": struct.unpack_from("<I", dtbo, 0)[0],
          })
          need(
              0xD7B7AB1E in (dtbo_info["magic_be"], dtbo_info["magic_le"]),
              "DTBO table magic missing",
          )

          vbmeta_info, vbmeta = plain_image(vbmeta_path, 4)
          need(vbmeta[:4] == b"AVB0", "vbmeta magic missing")
          vbmeta_info.update({
              "required_libavb_major": struct.unpack_from(">I", vbmeta, 4)[0],
              "required_libavb_minor": struct.unpack_from(">I", vbmeta, 8)[0],
              "algorithm_type": struct.unpack_from(">I", vbmeta, 28)[0],
              "release_string": vbmeta[128:176].split(b"\0", 1)[0].decode(
                  "ascii", "replace"
              ),
          })

          critical_keys = [
              "CONFIG_ARM64",
              "CONFIG_MODULES",
              "CONFIG_MODVERSIONS",
              "CONFIG_MODULE_SIG",
              "CONFIG_MODULE_SIG_FORCE",
              "CONFIG_LOCALVERSION",
          ]
          stock_critical = {
              key: config_value(stock_config_text, key) for key in critical_keys
          }
          candidate_critical = {
              key: config_value(candidate_config_text, key) for key in critical_keys
          }

          kernel_base_match = (
              release_base(stock_release) == release_base(candidate_release)
          )
          boot_geometry_supported = header_version == 3 and header_size == 1580
          critical_config_match = all(
              stock_critical[key] == candidate_critical[key]
              for key in critical_keys
              if key != "CONFIG_LOCALVERSION"
          )

          result = {
              "schema": 1,
              "stage": "CLEAN_GEN1_P8_V1",
              "region": {
                  "id": os.environ["REGION_ID"],
                  "name": os.environ["REGION_NAME"],
                  "codename": os.environ["ROM_CODENAME"],
                  "version": os.environ["ROM_VERSION"],
                  "android": os.environ["ROM_ANDROID"],
                  "date": os.environ["ROM_DATE"],
                  "archive_md5": os.environ["ROM_MD5"],
              },
              "stock": {
                  "boot": {
                      "bytes": len(boot),
                      "sha256": sha(boot),
                      "header_version": header_version,
                      "header_size": header_size,
                      "page_size": page_size,
                      "kernel_bytes": kernel_size,
                      "kernel_sha256": sha(kernel),
                      "ramdisk_bytes": ramdisk_size,
                      "ramdisk_sha256": sha(ramdisk),
                      "os_version_field": os_version_field,
                  },
                  "kernel_release": stock_release,
                  "kernel_release_base": release_base(stock_release),
                  "kernel_banner": stock_banner,
                  "kernel_config_sha256": sha(stock_config),
                  "critical_config": stock_critical,
                  "vendor_boot": vendor_info,
                  "dtbo": dtbo_info,
                  "vbmeta": vbmeta_info,
              },
              "candidate": {
                  "image_bytes": len(candidate),
                  "image_sha256": sha(candidate),
                  "kernel_release": candidate_release,
                  "kernel_release_base": release_base(candidate_release),
                  "kernel_banner": candidate_banner,
                  "base_config_sha256": sha(candidate_config),
                  "critical_config": candidate_critical,
                  "veux_dtb_sha256": sha(candidate_dtb_path.read_bytes()),
              },
              "static_contract": {
                  "kernel_release_base_match": kernel_base_match,
                  "boot_geometry_supported": boot_geometry_supported,
                  "critical_config_match": critical_config_match,
                  "classification": (
                      "STATIC_COMPATIBILITY_CANDIDATE"
                      if kernel_base_match
                      and boot_geometry_supported
                      and critical_config_match
                      else "STATIC_CONTRACT_MISMATCH"
                  ),
              },
              "claims": {
                  "kernel_build_performed": False,
                  "boot_image_created": False,
                  "flashable_zip_created": False,
                  "device_accessed": False,
                  "flashing_performed": False,
                  "device_compatibility_proven": False,
                  "universal_release_authorized": False,
              },
          }

          json_path.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "P8_REGION_STATIC_AUDIT=PASS",
              f"REGION_ID={result['region']['id']}",
              f"ROM_VERSION={result['region']['version']}",
              f"STOCK_BOOT_SHA256={result['stock']['boot']['sha256']}",
              f"STOCK_KERNEL_SHA256={result['stock']['boot']['kernel_sha256']}",
              f"STOCK_KERNEL_RELEASE={stock_release}",
              f"STOCK_KERNEL_CONFIG_SHA256={result['stock']['kernel_config_sha256']}",
              f"STOCK_RAMDISK_SHA256={result['stock']['boot']['ramdisk_sha256']}",
              f"STOCK_VENDOR_BOOT_SHA256={vendor_info['sha256']}",
              f"STOCK_DTBO_SHA256={dtbo_info['sha256']}",
              f"STOCK_VBMETA_SHA256={vbmeta_info['sha256']}",
              f"P6V10_V2_IMAGE_SHA256={result['candidate']['image_sha256']}",
              f"KERNEL_RELEASE_BASE_MATCH={'YES' if kernel_base_match else 'NO'}",
              f"BOOT_GEOMETRY_SUPPORTED={'YES' if boot_geometry_supported else 'NO'}",
              f"CRITICAL_CONFIG_MATCH={'YES' if critical_config_match else 'NO'}",
              f"P8_REGION_CLASSIFICATION={result['static_contract']['classification']}",
              "DEVICE_COMPATIBILITY_PROVEN=NO",
              "UNIVERSAL_RELEASE_AUTHORIZED=NO",
          ]
          text_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          grep -Fxq 'P8_REGION_STATIC_AUDIT=PASS' \
            "$AUDIT_DIR/04-region-summary.txt"
          grep -Fxq 'DEVICE_COMPATIBILITY_PROVEN=NO' \
            "$AUDIT_DIR/04-region-summary.txt"
          grep -Fxq 'UNIVERSAL_RELEASE_AUTHORIZED=NO' \
            "$AUDIT_DIR/04-region-summary.txt"

      - name: Close regional evidence package
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$AUDIT_DIR"

          {
            echo "JOB_STATUS=${{ job.status }}"
            echo "REGION_ID=$REGION_ID"
            echo "REGION_NAME=$REGION_NAME"
            echo "ROM_CODENAME=$ROM_CODENAME"
            echo "ROM_VERSION=$ROM_VERSION"
            echo "ROM_ANDROID=$ROM_ANDROID"
            echo "ROM_MD5=$ROM_MD5"
            echo "P6V10_V2_RUN_ID=$P6V10_V2_RUN_ID"
            echo 'KERNEL_BUILD_PERFORMED=NO'
            echo 'BOOT_IMAGE_CREATED=NO'
            echo 'FLASHABLE_ZIP_CREATED=NO'
            echo 'DEVICE_ACCESSED=NO'
            echo 'FLASHING_PERFORMED=NO'
          } > "$AUDIT_DIR/99-job-end-state.txt"

          (
            cd "$AUDIT_DIR" || exit 1
            find . -type f \
              ! -name 'SHA256SUMS' \
              ! -name 'SHA256SUMS.verify.txt' \
              -printf '%P\n' | sort > FILES.txt
            while IFS= read -r file; do
              sha256sum "$file"
            done < FILES.txt > SHA256SUMS
            sha256sum -c SHA256SUMS > SHA256SUMS.verify.txt
          )
          exit 0

      - name: Upload regional audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p8-veux-a13-${{ matrix.id }}-${{ github.run_id }}
          path: ${{ env.AUDIT_DIR }}/
          if-no-files-found: error
          retention-days: 90

  aggregate-static-matrix:
    name: Aggregate VEUX Android 13 regional static matrix
    needs: regional-stock-audit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WORK_DIR: ${{ github.workspace }}/p8-aggregate
      INPUT_DIR: ${{ github.workspace }}/p8-aggregate/regions
      OUTPUT_DIR: ${{ github.workspace }}/p8-aggregate/output

    steps:
      - name: Initialize aggregate gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR"
          mkdir -p "$INPUT_DIR" "$OUTPUT_DIR"

      - name: Download all regional evidence
        uses: actions/download-artifact@v7
        with:
          pattern: clean-gen1-p8-veux-a13-*-${{ github.run_id }}
          path: ${{ env.INPUT_DIR }}
          merge-multiple: false

      - name: Build fail-closed compatibility matrix
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$INPUT_DIR" "$OUTPUT_DIR" <<'PY'
          import json
          import sys
          from collections import defaultdict
          from pathlib import Path

          input_dir = Path(sys.argv[1])
          output_dir = Path(sys.argv[2])
          expected = {
              "global", "eea", "china", "indonesia", "india",
              "japan", "russia", "turkey", "taiwan",
          }

          documents = []
          for path in sorted(input_dir.glob("**/region.json")):
              documents.append(json.loads(path.read_text(encoding="utf-8")))

          found = {doc["region"]["id"] for doc in documents}
          if found != expected:
              missing = sorted(expected - found)
              extra = sorted(found - expected)
              raise SystemExit(
                  f"Regional evidence incomplete: missing={missing}, extra={extra}"
              )
          if len(documents) != 9:
              raise SystemExit(f"Expected 9 region documents, found {len(documents)}")

          candidate_hashes = {doc["candidate"]["image_sha256"] for doc in documents}
          if len(candidate_hashes) != 1:
              raise SystemExit("P6-v10-v2 candidate Image differs across matrix jobs")

          fields = {
              "kernel_release": lambda d: d["stock"]["kernel_release"],
              "kernel_release_base": lambda d: d["stock"]["kernel_release_base"],
              "kernel_sha256": lambda d: d["stock"]["boot"]["kernel_sha256"],
              "kernel_config_sha256": lambda d: d["stock"]["kernel_config_sha256"],
              "boot_header_version": lambda d: str(d["stock"]["boot"]["header_version"]),
              "boot_header_size": lambda d: str(d["stock"]["boot"]["header_size"]),
              "boot_bytes": lambda d: str(d["stock"]["boot"]["bytes"]),
              "ramdisk_sha256": lambda d: d["stock"]["boot"]["ramdisk_sha256"],
              "vendor_boot_sha256": lambda d: d["stock"]["vendor_boot"]["sha256"],
              "dtbo_sha256": lambda d: d["stock"]["dtbo"]["sha256"],
              "vbmeta_sha256": lambda d: d["stock"]["vbmeta"]["sha256"],
          }

          groups = {}
          for name, getter in fields.items():
              values = defaultdict(list)
              for doc in documents:
                  values[getter(doc)].append(doc["region"]["id"])
              groups[name] = {
                  value: sorted(regions) for value, regions in sorted(values.items())
              }

          static_candidates = [
              doc["region"]["id"]
              for doc in documents
              if doc["static_contract"]["classification"]
              == "STATIC_COMPATIBILITY_CANDIDATE"
          ]
          mismatches = sorted(expected - set(static_candidates))

          matrix = {
              "schema": 1,
              "stage": "CLEAN_GEN1_P8_V1",
              "regions_expected": sorted(expected),
              "regions_audited": sorted(found),
              "p6v10_v2_candidate_image_sha256": next(iter(candidate_hashes)),
              "groups": groups,
              "static_compatibility_candidates": sorted(static_candidates),
              "static_contract_mismatches": mismatches,
              "conclusion": (
                  "STATIC_MATRIX_COMPLETE_DEVICE_TEST_REQUIRED"
                  if not mismatches
                  else "STATIC_MATRIX_HAS_CONTRACT_MISMATCHES"
              ),
              "claims": {
                  "all_historical_stock_versions_audited": False,
                  "current_stable_android13_regions_audited": True,
                  "kernel_build_performed": False,
                  "boot_image_created": False,
                  "flashable_zip_created": False,
                  "device_compatibility_proven": False,
                  "universal_fixed_boot_allowed": False,
                  "universal_release_authorized": False,
              },
          }
          (output_dir / "P8-COMPATIBILITY-MATRIX.json").write_text(
              json.dumps(matrix, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          headers = [
              "Region", "ROM", "Stock kernel", "Config SHA-256",
              "Boot", "Static result",
          ]
          lines = [
              "# CLEAN GEN1 P8 v1 - VEUX Android 13 regional stock matrix",
              "",
              "| " + " | ".join(headers) + " |",
              "| " + " | ".join(["---"] * len(headers)) + " |",
          ]
          for doc in sorted(documents, key=lambda d: d["region"]["id"]):
              lines.append(
                  "| "
                  + " | ".join([
                      doc["region"]["name"],
                      doc["region"]["version"],
                      doc["stock"]["kernel_release"],
                      doc["stock"]["kernel_config_sha256"],
                      doc["stock"]["boot"]["sha256"],
                      doc["static_contract"]["classification"],
                  ])
                  + " |"
              )

          lines.extend([
              "",
              "## Mandatory interpretation",
              "",
              "- This audit covers the nine current stable Android 13 regional fastboot ROMs pinned in the workflow.",
              "- It does not yet cover every historical Android 11/12/13 stock build.",
              "- A static candidate result is not a real-device compatibility proof.",
              "- The calibrated P7 fixed boot image embeds Global stock boot data and is not a universal boot image.",
              "- Any later regional package must preserve the installed ROM's ramdisk, vendor_boot, dtbo and vbmeta contracts.",
              "- No universal release is authorized by P8.",
          ])
          (output_dir / "P8-COMPATIBILITY-MATRIX.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )

          result_lines = [
              "CLEAN_GEN1_P8_V1_REGIONAL_STATIC_MATRIX=PASS",
              "REGION_COUNT=9",
              "CURRENT_STABLE_ANDROID13_REGIONS_AUDITED=YES",
              "ALL_HISTORICAL_STOCK_VERSIONS_AUDITED=NO",
              f"STATIC_COMPATIBILITY_CANDIDATE_COUNT={len(static_candidates)}",
              f"STATIC_CONTRACT_MISMATCH_COUNT={len(mismatches)}",
              f"P8_CONCLUSION={matrix['conclusion']}",
              "P7_FIXED_BOOT_UNIVERSAL=NO",
              "KERNEL_BUILD_PERFORMED=NO",
              "BOOT_IMAGE_CREATED=NO",
              "FLASHABLE_ZIP_CREATED=NO",
              "DEVICE_COMPATIBILITY_PROVEN=NO",
              "UNIVERSAL_FIXED_BOOT_ALLOWED=NO",
              "UNIVERSAL_RELEASE_AUTHORIZED=NO",
              "NEXT_STAGE=REVIEW_P8_MATRIX_AND_DEFINE_ANDROID13_AK3_PRESERVE_CURRENT_BOOT_CONTRACT",
          ]
          (output_dir / "P8-RESULT.txt").write_text(
              "\n".join(result_lines) + "\n", encoding="utf-8"
          )
          PY

          grep -Fxq 'CLEAN_GEN1_P8_V1_REGIONAL_STATIC_MATRIX=PASS' \
            "$OUTPUT_DIR/P8-RESULT.txt"
          grep -Fxq 'REGION_COUNT=9' "$OUTPUT_DIR/P8-RESULT.txt"
          grep -Fxq 'ALL_HISTORICAL_STOCK_VERSIONS_AUDITED=NO' \
            "$OUTPUT_DIR/P8-RESULT.txt"
          grep -Fxq 'P7_FIXED_BOOT_UNIVERSAL=NO' "$OUTPUT_DIR/P8-RESULT.txt"
          grep -Fxq 'UNIVERSAL_RELEASE_AUTHORIZED=NO' \
            "$OUTPUT_DIR/P8-RESULT.txt"

          (
            cd "$OUTPUT_DIR"
            find . -type f ! -name SHA256SUMS -printf '%P\n' \
              | sort > FILES.txt
            while IFS= read -r file; do
              sha256sum "$file"
            done < FILES.txt > SHA256SUMS
            sha256sum -c SHA256SUMS > SHA256SUMS.verify.txt
          )

      - name: Upload aggregate P8 matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p8-veux-a13-regional-static-matrix-v1-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 90
