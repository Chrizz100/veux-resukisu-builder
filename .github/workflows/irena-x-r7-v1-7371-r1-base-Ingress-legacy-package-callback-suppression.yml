name: Irena X 7371 R7 v1 Ingress legacy-package-callback suppression diagnostic on R1-v2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRAMEWORK_FAMILY: Irena-X
  FRAMEWORK_VERSION: v2.0.1
  FRAMEWORK_BUILD: "7371"
  XPOSED_API_LINE: "100+101"

  IRENA_REPO: silvzr/LSP-IrenaX
  IRENA_COMMIT: da439fbbed506dac6c66074af7fda8982aa4fc6a
  CURRENT_LSPLANT_SHA: c5b46bb4f6a99ffe0c77ce3ab006d3f67d5a2b1c
  CURRENT_DOBBY_SHA: dc7b4be06ad6c5dcfb0bb4ca2082b007d69eaed5

  OLD_WORKING_REPO: mywalkb/LSPosed_mod
  OLD_WORKING_COMMIT: 9770579f313de44397c295fd1cc44e3fcec4777c

  OFFICIAL_RELEASE_URL: https://github.com/silvzr/LSP-IrenaX/releases/download/v2.0.1/LSPosed-v2.0.1-7371-IrenaX-release.zip
  OFFICIAL_RELEASE_SHA256: 99e7aaf54dda0e6fa746c55613483a80620174f255dd05e102713778a9966d2f

  FINAL_ZIP: LSPosed-v2.0.1-7371-IrenaX-R7-v1-R1-base-Ingress-legacy-package-callback-suppression-diagnostic.zip

jobs:
  build:
    name: Build R7 v1 Ingress legacy-package-callback suppression diagnostic
    runs-on: ubuntu-latest

    steps:
      - name: Freeze R7 diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r7-output
          {
            echo "PARENT_RUNTIME=R1-v2"
            echo "PARENT_PACKAGE_SHA256=7ed948db19d92b0dd7776c424f93783e10210082ea807345228e901ab9ce4af7"
            echo "R6_RESULT=PairIP still crashes even when all Ingress legacy hook registrations are dry-run and native HookBridge/LSPlant is not called for them"
            echo "R6_CONCLUSION=actual module legacy ArtMethod hook installation is not necessary for the crash"
            echo "R7_BASE=official Irena X 7371 + exact R1-v2 mIncludeCode compatibility fix"
            echo "R7_ONLY_NEW_FUNCTIONAL_CHANGE=skip XC_LoadPackage.callAll for com.nianticproject.ingress only"
            echo "R7_BOOTSTRAP_API100_HOOKS=UNCHANGED"
            echo "R7_API100_PACKAGE_CALLBACKS=UNCHANGED"
            echo "R7_API101_PACKAGE_CALLBACKS=UNCHANGED"
            echo "R7_LEGACY_MODULE_HANDLELOADPACKAGE=INTENTIONALLY_NOT_EXECUTED_IN_INGRESS"
            echo "R7_NATIVE_HOOK_BRIDGE=UNCHANGED"
            echo "R7_LSPLANT=UNCHANGED"
            echo "R7_DOBBY=UNCHANGED"
            echo "P7_MOUNT_SUPPRESSION=NOT_APPLIED"
            echo "P10_CERT_REBUILD_PATCH=NOT_APPLIED"
            echo "R2_DEOPT_ROLLBACK=NOT_APPLIED"
            echo "PAIRIP_BYPASS=NOT_ATTEMPTED"
            echo "DEVICE_OBJECTIVE=separate legacy module callback side effects from framework/bootstrap hook state"
          } | tee r7-output/R7_DIAGNOSTIC_CONTRACT.txt

      - name: Checkout pinned Irena X 7371
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IRENA_REPO }}
          ref: ${{ env.IRENA_COMMIT }}
          submodules: recursive
          fetch-depth: 0
          path: LSP-IrenaX
          persist-credentials: false

      - name: Checkout old working 7244 reference
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OLD_WORKING_REPO }}
          ref: ${{ env.OLD_WORKING_COMMIT }}
          submodules: false
          fetch-depth: 1
          path: LSPosed-7244-reference
          persist-credentials: false

      - name: Verify exact source pins and regression preconditions
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C LSP-IrenaX rev-parse HEAD)" = "$IRENA_COMMIT"
          test -z "$(git -C LSP-IrenaX status --porcelain)"
          test "$(git -C LSP-IrenaX/external/lsplant rev-parse HEAD)" = "$CURRENT_LSPLANT_SHA"
          test "$(git -C LSP-IrenaX/external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
          test -z "$(git -C LSP-IrenaX/external/lsplant status --porcelain)"
          test -z "$(git -C LSP-IrenaX/external/dobby status --porcelain)"

          test "$(git -C LSPosed-7244-reference rev-parse HEAD)" = "$OLD_WORKING_COMMIT"

          current="LSP-IrenaX/core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"
          old="LSPosed-7244-reference/core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"

          test -f "$current"
          test -f "$old"

          grep -Fq 'boolean includeCode = XposedHelpers.getBooleanField(loadedApk, "mIncludeCode");' "$current"
          grep -Fq 'else if (!includeCode)' "$current"

          if grep -Fq 'mIncludeCode' "$old"; then
            echo "old working 7244 unexpectedly contains mIncludeCode access"
            exit 1
          fi

          {
            echo "IRENA=$(git -C LSP-IrenaX rev-parse HEAD)"
            echo "LSPLANT=$(git -C LSP-IrenaX/external/lsplant rev-parse HEAD)"
            echo "DOBBY=$(git -C LSP-IrenaX/external/dobby rev-parse HEAD)"
            echo "OLD_WORKING_7244=$(git -C LSPosed-7244-reference rev-parse HEAD)"
            echo "CURRENT_7371_M_INCLUDE_CODE=PRESENT"
            echo "OLD_7244_M_INCLUDE_CODE=ABSENT"
          } | tee r7-output/R7_SOURCE_PINS_AND_PRECONDITIONS.txt

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: irena-x-r1-clean-base-${{ runner.os }}
          restore-keys: |
            irena-x-${{ runner.os }}
          save: false

      - name: Setup Ninja 1.12.1
        uses: seanmiddleditch/gha-setup-ninja@master
        with:
          version: 1.12.1

      - name: Remove Android bundled CMake
        shell: bash
        run: rm -rf "$ANDROID_HOME/cmake"

      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.caching=true'
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC'
            echo 'android.native.buildOutput=verbose'
          } >> ~/.gradle/gradle.properties

      - name: Download and verify official Irena 7371 release
        id: official
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            -o OFFICIAL_RELEASE.zip \
            "$OFFICIAL_RELEASE_URL"

          echo "$OFFICIAL_RELEASE_SHA256  OFFICIAL_RELEASE.zip" | sha256sum -c -

          rm -rf officialcmp
          mkdir officialcmp
          unzip -q OFFICIAL_RELEASE.zip -d officialcmp
          unzip -t OFFICIAL_RELEASE.zip

          test -f officialcmp/manager.apk
          test -f officialcmp/daemon.apk
          test -f officialcmp/framework/lspd.dex

          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("OFFICIAL_RELEASE.zip") as z:
              names = z.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit("duplicate names in official release")
              if len([n for n in names if not n.endswith("/")]) != 56:
                  raise SystemExit("official release file count is not 56")
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"official release CRC failure: {bad}")
          PY

          sha256sum OFFICIAL_RELEASE.zip \
            > r7-output/R7_OFFICIAL_RELEASE_SHA256.txt

      - name: Apply exact R1 fix plus Ingress-only legacy package callback suppression
        id: patch
        if: steps.official.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -euo pipefail

          # A) Reproduce exact R1-v2 mIncludeCode compatibility fix.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java")
          s = p.read_text()

          line = '            boolean includeCode = XposedHelpers.getBooleanField(loadedApk, "mIncludeCode");\n'
          branch = (
              '            } else if (!includeCode) {\n'
              '                Hookers.logD("LoadedApk#<init> has no code, skip: " + mAppDir);\n'
              '                return;\n'
          )

          if s.count(line) != 1:
              raise SystemExit(f"R1 precondition failed: mIncludeCode read count={s.count(line)}")
          if s.count(branch) != 1:
              raise SystemExit(f"R1 precondition failed: no-code branch count={s.count(branch)}")

          s = s.replace(line, "", 1)
          s = s.replace(branch, "", 1)

          if 'mIncludeCode' in s:
              raise SystemExit("R1-v2 mIncludeCode regression")

          p.write_text(s)
          PY

          # B) R7 one-variable diagnostic:
          #    preserve framework/bootstrap hooks but skip classic XC_LoadPackage callbacks
          #    only for Ingress. Modern package callbacks remain untouched.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java")
          s = p.read_text()

          old = (
              '            Hookers.logD("Call handleLoadedPackage: packageName=" + lpparam.packageName + " processName=" + lpparam.processName + " isFirstPackage=" + isFirstPackage + " classLoader=" + lpparam.classLoader + " appInfo=" + lpparam.appInfo);\n'
              '            XC_LoadPackage.callAll(lpparam);\n'
              '\n'
              '            // fire every lifecycle callback and let each module ignore what it didn\'t\n'
          )
          new = (
              '            Hookers.logD("Call handleLoadedPackage: packageName=" + lpparam.packageName + " processName=" + lpparam.processName + " isFirstPackage=" + isFirstPackage + " classLoader=" + lpparam.classLoader + " appInfo=" + lpparam.appInfo);\n'
              '            if ("com.nianticproject.ingress".equals(lpparam.packageName)) {\n'
              '                android.util.Log.w("LSPosed-R7", "LEGACY_PACKAGE_CALLBACKS_SKIPPED package=" + lpparam.packageName);\n'
              '            } else {\n'
              '                XC_LoadPackage.callAll(lpparam);\n'
              '            }\n'
              '\n'
              '            // fire every lifecycle callback and let each module ignore what it didn\'t\n'
          )

          if s.count(old) != 1:
              raise SystemExit(f"XC_LoadPackage call anchor count={s.count(old)}")
          s = s.replace(old, new, 1)

          if s.count('"LSPosed-R7"') != 1:
              raise SystemExit("R7 marker count mismatch")
          if s.count('"com.nianticproject.ingress".equals(lpparam.packageName)') != 1:
              raise SystemExit("Ingress-only guard missing")

          p.write_text(s)
          PY

          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}" | tee ../r7-output/R7_SOURCE_DIFF_NAMES.txt

          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java"
          test "${changed[1]}" = "core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"

          if grep -Fq 'mIncludeCode' core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java; then
            echo "R1-v2 mIncludeCode fix was lost"
            exit 1
          fi

          grep -Fq 'LEGACY_PACKAGE_CALLBACKS_SKIPPED' \
            core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java
          grep -Fq '"com.nianticproject.ingress".equals(lpparam.packageName)' \
            core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java

          # Freeze all other current framework/native/hook-engine code.
          git diff --exit-code "$IRENA_COMMIT" -- \
            core/src/main/java/de/robv/android/xposed/XposedBridge.java \
            core/src/main/java/org/lsposed/lspd/deopt/InlinedMethodCallers.java \
            core/src/main/java/org/lsposed/lspd/impl/LSPosedBridge.java \
            core/src/main/java/org/lsposed/lspd/nativebridge/HookBridge.java \
            core/src/main/jni/src/jni/hook_bridge.cpp \
            core/src/main/jni/src/native_api.cpp \
            daemon/build.gradle.kts \
            daemon/src/main/java/org/lsposed/lspd/service/Dex2OatService.java \
            daemon/src/main/java/org/lsposed/lspd/util/InstallerVerifier.java \
            magisk-loader/src/main/jni/api/zygisk_main.cpp \
            magisk-loader/src/main/jni/src/magisk_loader.cpp

          test "$(git -C external/lsplant rev-parse HEAD)" = "$CURRENT_LSPLANT_SHA"
          test "$(git -C external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
          test -z "$(git -C external/lsplant status --porcelain)"
          test -z "$(git -C external/dobby status --porcelain)"

          git diff > ../r7-output/R7_SOURCE_FULL.patch

          {
            echo "PARENT=R1-v2 device framework PASS"
            echo "PARENT_PACKAGE_SHA256=7ed948db19d92b0dd7776c424f93783e10210082ea807345228e901ab9ce4af7"
            echo "SOURCE_DELTA_VS_OFFICIAL=LoadedApkCreateCLHooker.java + LoadedApkCtorHooker.java"
            echo "FUNCTIONAL_DELTA_VS_R1=Ingress-only XC_LoadPackage.callAll suppression"
            echo "M_INCLUDE_CODE_FIX=PRESERVED"
            echo "LEGACY_HANDLELOADPACKAGE_IN_INGRESS=SUPPRESSED"
            echo "BOOTSTRAP_API100_HOOKS=UNCHANGED"
            echo "API100_PACKAGE_CALLBACKS=UNCHANGED"
            echo "API101_PACKAGE_CALLBACKS=UNCHANGED"
            echo "NATIVE_HOOK_BRIDGE=UNCHANGED"
            echo "LSPLANT=$CURRENT_LSPLANT_SHA"
            echo "DOBBY=$CURRENT_DOBBY_SHA"
            echo "R2_DEOPT_ROLLBACK=ABSENT"
            echo "P7_MOUNT_SUPPRESSION=ABSENT"
            echo "P10_CERT_PATCH=ABSENT"
            echo "PAIRIP_BYPASS=ABSENT"
          } | tee ../r7-output/R7_PROVENANCE.txt

      - name: Build R7 v1 diagnostic framework
        id: r7build
        if: steps.patch.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ./gradlew clean zipAll --stacktrace --info 2>&1 | tee ../r7-build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > ../R7_BUILD_EXIT_CODE.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Freeze rebuilt framework payload
        id: framework
        if: steps.r7build.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t rel < <(find LSP-IrenaX/magisk-loader/release -maxdepth 1 -type f \
            -name 'LSPosed-v*-IrenaX-release.zip' -print | sort)

          test "${#rel[@]}" -eq 1
          cp "${rel[0]}" R7_BUILD_RELEASE.zip

          rm -rf r7buildcmp
          mkdir r7buildcmp
          unzip -q R7_BUILD_RELEASE.zip -d r7buildcmp

          test -f r7buildcmp/framework/lspd.dex
          sha256sum r7buildcmp/framework/lspd.dex \
            > r7-output/R7_REBUILT_FRAMEWORK_DEX_SHA256.txt

      - name: Create official-base R7 diagnostic package
        id: package
        if: steps.framework.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          official = Path("OFFICIAL_RELEASE.zip")
          out = Path("${{ env.FINAL_ZIP }}")
          rebuilt_dex = Path("r7buildcmp/framework/lspd.dex").read_bytes()
          rebuilt_dex_sha = hashlib.sha256(rebuilt_dex).hexdigest().encode()

          replacements = {
              "framework/lspd.dex": rebuilt_dex,
              "framework/lspd.dex.sha256": rebuilt_dex_sha,
          }

          with zipfile.ZipFile(official, "r") as zin, zipfile.ZipFile(out, "w") as zout:
              infos = zin.infolist()
              names = [i.filename for i in infos]

              if len(names) != len(set(names)):
                  raise SystemExit("duplicate names in official ZIP")

              for required in replacements:
                  if required not in names:
                      raise SystemExit(f"missing official payload: {required}")

              for info in infos:
                  data = replacements.get(info.filename)
                  if data is None:
                      data = zin.read(info.filename)
                  zout.writestr(info, data)

          def tree(path):
              with zipfile.ZipFile(path) as z:
                  names = z.namelist()
                  if len(names) != len(set(names)):
                      raise SystemExit(f"duplicate names: {path}")
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f"ZIP CRC failure {path}: {bad}")
                  return {
                      n: hashlib.sha256(z.read(n)).hexdigest()
                      for n in names
                      if not n.endswith("/")
                  }

          a = tree(official)
          b = tree(out)

          if set(a) != set(b):
              raise SystemExit("official/R7 file sets differ")
          if len(a) != 56:
              raise SystemExit(f"expected 56 files, got {len(a)}")

          diff = sorted(k for k in a if a[k] != b[k])
          expected = ["framework/lspd.dex", "framework/lspd.dex.sha256"]
          if diff != expected:
              raise SystemExit(f"unexpected official->R7 final delta: {diff}")

          # All manager/daemon/native payload must remain exact official 7371.
          for rel in (
              "manager.apk",
              "daemon.apk",
              "lib/arm64-v8a/liblspd.so",
              "lib/armeabi-v7a/liblspd.so",
              "lib/x86/liblspd.so",
              "lib/x86_64/liblspd.so",
          ):
              if a[rel] != b[rel]:
                  raise SystemExit(f"official payload changed unexpectedly: {rel}")

          with zipfile.ZipFile(out) as z:
              names = set(z.namelist())
              checked = 0
              for n in sorted(names):
                  if not n.endswith(".sha256"):
                      continue
                  payload = n[:-7]
                  if payload not in names:
                      continue
                  expected_hash = z.read(n).decode().strip().split()[0]
                  actual_hash = hashlib.sha256(z.read(payload)).hexdigest()
                  if expected_hash != actual_hash:
                      raise SystemExit(f"sidecar mismatch: {n}")
                  checked += 1

              if checked != 28:
                  raise SystemExit(f"expected 28 verified sidecars, got {checked}")

          sha = hashlib.sha256(out.read_bytes()).hexdigest()
          Path("r7-output/R7_FINAL_PACKAGE_SHA256.txt").write_text(
              f"{sha}  {out.name}\n"
          )
          Path("r7-output/R7_FINAL_PACKAGE_DIFF.txt").write_text(
              "framework/lspd.dex\nframework/lspd.dex.sha256\n"
          )
          Path("r7-output/R7_FINAL_SCOPE.txt").write_text(
              "BASE=official Irena X 7371 release + R1-v2 mIncludeCode fix\n"
              "ONLY_FINAL_PAYLOAD_CHANGE=framework/lspd.dex + sidecar\n"
              "MANAGER=official 7371 byte-identical\n"
              "DAEMON=official 7371 byte-identical\n"
              "DEX2OAT_BEHAVIOR=official 7371 unchanged\n"
              "ALL_LIBLSPD=official 7371 byte-identical\n"
              "M_INCLUDE_CODE_DIRECT_READ=removed (R1 preserved)\n"
              "R7_FUNCTIONAL_CHANGE=Ingress-only XC_LoadPackage.callAll suppression\n"
              "R7_BOOTSTRAP_API100_HOOKS=unchanged\n"
              "R7_LEGACY_HANDLELOADPACKAGE=not executed in Ingress\n"
              "R7_API100_PACKAGE_CALLBACKS=unchanged\n"
              "R7_API101_PACKAGE_CALLBACKS=unchanged\n"
              "R2_DEOPT_ROLLBACK=not present\n"
              "P7_MOUNT_SUPPRESSION=not present\n"
              "P10_CERT_REBUILD_PATCH=not present\n"
              "PAIRIP_BYPASS=not present\n"
          )
          PY

          unzip -t "$FINAL_ZIP"
          cp "$FINAL_ZIP" "r7-output/INSTALL_THIS_${FINAL_ZIP}"

      - name: Write R7 device diagnostic plan
        if: steps.package.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          cat > r7-output/R7_DEVICE_TEST_PLAN.txt <<'EOF'
          R7 INGRESS LEGACY PACKAGE-CALLBACK SUPPRESSION DIAGNOSTIC

          PURPOSE:
          R6 proved actual legacy HookBridge/LSPlant hook installation is not necessary for the crash.
          R7 now asks whether merely executing legacy module handleLoadPackage callbacks is necessary.

          Keep the same Ingress scopes as the prior crash setup; no need to change modules for this first capture.

          1. Install the inner INSTALL_THIS_*.zip and reboot.
          2. Confirm framework/manager still works.
          3. Run one controlled Ingress start:

             su -c 'logcat -c'
             su -c 'am force-stop com.nianticproject.ingress'
             su -c 'monkey -p com.nianticproject.ingress -c android.intent.category.LAUNCHER 1'
             sleep 4
             su -c 'logcat -b all -d -v threadtime | grep -E "LSPosed-R7|libpairipcore|SIGSEGV|SEGV_|Fatal signal" > /sdcard/Download/r7-legacy-callback-suppression.txt'

          4. The capture MUST contain:
             LSPosed-R7: LEGACY_PACKAGE_CALLBACKS_SKIPPED package=com.nianticproject.ingress

          INTERPRETATION
          - PairIP still crashes with the R7 marker:
            legacy module callback execution itself is not necessary.
            The remaining common state is framework/bootstrap hook/injection state.
          - Ingress starts with the R7 marker:
            something inside legacy handleLoadPackage execution is necessary even when actual legacy hook installation is absent.
          - Missing R7 marker:
            test invalid.
          EOF

      - name: Collect R7 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r7-output

          cp R7_BUILD_EXIT_CODE.txt r7-output/ 2>/dev/null || true
          cp r7-build.log r7-output/ 2>/dev/null || true
          cp R7_BUILD_RELEASE.zip r7-output/ 2>/dev/null || true
          cp OFFICIAL_RELEASE.zip r7-output/OFFICIAL_7371_RELEASE_REFERENCE.zip 2>/dev/null || true

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          out = Path("r7-output")
          manifest = out / "R7_EVIDENCE_SHA256SUMS.txt"

          files = sorted(
              p for p in out.rglob("*")
              if p.is_file() and p != manifest
          )

          with manifest.open("w") as f:
              for p in files:
                  rel = p.relative_to(out).as_posix()
                  f.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}\n")
          PY

          (
            cd r7-output
            sha256sum -c R7_EVIDENCE_SHA256SUMS.txt
          )

      - name: Final R7 fail-closed static gate
        id: finalgate
        shell: bash
        run: |
          set -euo pipefail

          test -f R7_BUILD_EXIT_CODE.txt
          test "$(cat R7_BUILD_EXIT_CODE.txt)" = "0"

          diff -u <(printf '%s\n' \
            core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java \
            core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java) \
            r7-output/R7_SOURCE_DIFF_NAMES.txt

          diff -u <(printf '%s\n' \
            framework/lspd.dex \
            framework/lspd.dex.sha256) \
            r7-output/R7_FINAL_PACKAGE_DIFF.txt

          grep -q '^P7_MOUNT_SUPPRESSION=ABSENT$' r7-output/R7_PROVENANCE.txt
          grep -q '^P10_CERT_PATCH=ABSENT$' r7-output/R7_PROVENANCE.txt
          grep -q '^R2_DEOPT_ROLLBACK=ABSENT$' r7-output/R7_PROVENANCE.txt
          grep -q '^LEGACY_HANDLELOADPACKAGE_IN_INGRESS=SUPPRESSED$' r7-output/R7_PROVENANCE.txt
