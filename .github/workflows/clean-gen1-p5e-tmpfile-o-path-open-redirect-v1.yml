name: CLEAN GEN1 P5E - tmpfile and O_PATH OPEN_REDIRECT v1
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  p5e-direct-open-redirect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARCH: arm64
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
      VENDOR_TAG: '20240619'
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      P5D_RUN_ID: '33492482203'
      P5D_ARTIFACT_NAME: clean-gen1-p5d-normal-path-open-redirect-v5-33492482203
      EXPECTED_P5D_COMMIT: a7395c4da6aca278463a234b5e86b8046181b070
      EXPECTED_P5D_TREE: e12832f2ee2cad12ac581ab91dcb6d75977f6de6
      EXPECTED_P5D_RESUKISU_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_P5D_RESUKISU_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      RESUKISU_SNAPSHOT_HEAD: 0b5efe9e0102c43ca5c41174d500f5a7080cd0c7
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_54_HEAD: 76affd70abf61d77feb0a132f61365d6848505df
      SUSFS_510_HEAD: ec785f47d49f7b3871ca9356f450411020af7017
      SUSFS_515_HEAD: bca0d2333c1a7d717e7278b019d7af7ba1d16005
      SUSFS_61_HEAD: 4fc9c1898ea66f51847cdbc0d1473ea4ef525a70
      ARTIFACT_DIR: ${{ github.workspace }}/clean-gen1-p5e
      P5D_ARTIFACT_DIR: ${{ github.workspace }}/p5d-artifact
      BASELINE_BUILD_DIR: ${{ github.workspace }}/out-p5e-baseline
      NORMAL_BUILD_DIR: ${{ github.workspace }}/out-p5e-normal
      REDIRECT_BUILD_DIR: ${{ github.workspace }}/out-p5e-redirect
    steps:
    - name: Initialize P5E
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf "$ARTIFACT_DIR" "$P5D_ARTIFACT_DIR" \
               "$BASELINE_BUILD_DIR" "$NORMAL_BUILD_DIR" "$REDIRECT_BUILD_DIR" \
               "$GITHUB_WORKSPACE/p5e-outer-replay" "$GITHUB_WORKSPACE/p5e-resukisu-replay"
        mkdir -p "$ARTIFACT_DIR"

        cat > "$ARTIFACT_DIR/00-plan.txt" <<'EOF'
        CLEAN GEN1 P5E - do_tmpfile + O_PATH OPEN_REDIRECT pre-open integration

        P5D normal path is protected and must remain unchanged.
        P5E changes only fs/namei.c:
        - do_tmpfile redirects after path_lookupat, before mnt_want_write/vfs_tmpfile.
        - do_o_path redirects after path_lookupat, before vfs_open.
        - direct redirects use separate nested nameidata.
        - outer nd->name remains unchanged.
        - LOOKUP_ROOT is preserved.
        - no recursive redirect decision occurs inside the nested direct lookup helper.
        - CONFIG_KSU_SUSFS remains disabled in the actual VEUX defconfig.

        No full kernel build, Image, dtb, boot image, flash ZIP or device work.
        EOF
    - name: Install P5E dependencies
      shell: bash
      run: |2

        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison binutils-aarch64-linux-gnu build-essential ca-certificates flex \
          gcc-aarch64-linux-gnu git jq libelf-dev libssl-dev patch python3 rsync zstd
    - name: Checkout exact VEUX vendor source
      uses: actions/checkout@v6
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: '20240619'
        path: kernel
        fetch-depth: 1
    - name: Download accepted P5D artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.P5D_ARTIFACT_NAME }}
        path: p5d-artifact
        github-token: ${{ github.token }}
        run-id: ${{ env.P5D_RUN_ID }}
    - name: Authenticate accepted P5D checkpoint
      shell: bash
      run: |2

        set -euo pipefail
        (
          cd "$P5D_ARTIFACT_DIR/restore-kit"
          sha256sum -c SHA256SUMS
        ) > "$ARTIFACT_DIR/01-p5d-restore-sha256.txt"

        jq -e \
          --arg commit "$EXPECTED_P5D_COMMIT" \
          --arg tree "$EXPECTED_P5D_TREE" \
          --arg rhead "$EXPECTED_P5D_RESUKISU_HEAD" \
          --arg rtree "$EXPECTED_P5D_RESUKISU_TREE" \
          '.stage=="CLEAN_GEN1_P5D" and
           .p5d_commit==$commit and
           .p5d_tree==$tree and
           .resukisu_head==$rhead and
           .resukisu_tree==$rtree and
           .normal_path_open_redirect_integrated==true and
           .tmpfile_open_redirect_integrated==false and
           .o_path_open_redirect_integrated==false and
           .outer_nameidata_name_replaced==false and
           .susfs_runtime_enabled==false and
           .full_kernel_build_performed==false' \
          "$P5D_ARTIFACT_DIR/restore-kit/manifest.json" \
          > "$ARTIFACT_DIR/01-p5d-manifest-auth.json"

        grep -Fxq 'CLEAN_GEN1_P5D_NORMAL_PATH_OPEN_REDIRECT=PASS' \
          "$P5D_ARTIFACT_DIR/18-result.txt"
        grep -Fxq 'P5D_REDIRECT_SYMBOL_CONTRACT=PASS' \
          "$P5D_ARTIFACT_DIR/18-result.txt"

        {
          echo "P5D_RESTORE_ARTIFACT=PASS"
          echo "P5D_CHECKPOINT_AUTH=PASS"
          echo "P5E_MUTATION_ALLOWED=YES"
        } | tee "$ARTIFACT_DIR/01-p5d-auth.txt"
    - name: Refuse stale reviewed upstream before P5E
      shell: bash
      run: |2

        set -euo pipefail
        test "$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main | awk '{print $1}')" = "$RESUKISU_SNAPSHOT_HEAD"
        test "$(git ls-remote "$SUSFS_REPO" refs/heads/kernel-5.4 | awk '{print $1}')" = "$SUSFS_54_HEAD"
        test "$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android12-5.10 | awk '{print $1}')" = "$SUSFS_510_HEAD"
        test "$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android13-5.15 | awk '{print $1}')" = "$SUSFS_515_HEAD"
        test "$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android14-6.1 | awk '{print $1}')" = "$SUSFS_61_HEAD"

        {
          echo "UPSTREAM_REVIEW_SNAPSHOT_CURRENT=YES"
          echo "P5E_ALLOWED=YES"
        } | tee "$ARTIFACT_DIR/02-upstream-state.txt"
    - name: Restore exact accepted P5D outer tree
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
        PATCH="$P5D_ARTIFACT_DIR/restore-kit/vendor-20240619-to-p5d-outer.patch"
        git apply --check --binary "$PATCH"
        git apply --index --binary "$PATCH"
        test "$(git write-tree)" = "$EXPECTED_P5D_TREE"

        GIT_AUTHOR_NAME="CLEAN-GEN1 Restore" \
        GIT_AUTHOR_EMAIL="clean-gen1@invalid.local" \
        GIT_AUTHOR_DATE="2026-09-01T00:00:00Z" \
        GIT_COMMITTER_NAME="CLEAN-GEN1 Restore" \
        GIT_COMMITTER_EMAIL="clean-gen1@invalid.local" \
        GIT_COMMITTER_DATE="2026-09-01T00:00:00Z" \
          git commit -m "CLEAN GEN1 restore accepted P5D outer tree"

        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P5D_TREE"
        echo "P5D_RESTORED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        echo "P5D_OUTER_RESTORE_REPLAY=PASS" | tee "$ARTIFACT_DIR/03-p5d-outer-restore.txt"
    - name: Restore exact accepted P5D ReSukiSU
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf KernelSU
        git init KernelSU >/dev/null
        git -C KernelSU fetch \
          "$P5D_ARTIFACT_DIR/restore-kit/resukisu-p5d-full.bundle" \
          refs/heads/clean-gen1-p5d-resukisu:refs/heads/clean-gen1-p5d-resukisu
        git -C KernelSU checkout --detach refs/heads/clean-gen1-p5d-resukisu >/dev/null

        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_P5D_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_P5D_RESUKISU_TREE"

        mkdir -p .git/info
        touch .git/info/exclude
        grep -Fxq '/KernelSU/' .git/info/exclude || echo '/KernelSU/' >> .git/info/exclude

        test -L drivers/kernelsu
        test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
        test -z "$(git status --porcelain)"
        echo "P5D_RESUKISU_RESTORE_REPLAY=PASS" | tee "$ARTIFACT_DIR/04-p5d-resukisu-restore.txt"
    - name: Gate direct-path pre-open boundaries and protected P5D normal path
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' > "$ARTIFACT_DIR/06-p5e-preflight.txt"
        from pathlib import Path
        import hashlib, json, os

        text = Path("fs/namei.c").read_text(encoding="utf-8")

        def extract(signature):
            start = text.find(signature)
            if start < 0:
                raise SystemExit("missing function: " + signature)
            brace = text.find("{", start)
            depth = 0
            for i in range(brace, len(text)):
                if text[i] == "{":
                    depth += 1
                elif text[i] == "}":
                    depth -= 1
                    if depth == 0:
                        return text[start:i+1]
            raise SystemExit("unterminated: " + signature)

        tmp = extract("static int do_tmpfile(struct nameidata *nd, unsigned flags,")
        opath = extract("static int do_o_path(struct nameidata *nd, unsigned flags, struct file *file)")
        normal_nested = extract("static int clean_gen1_open_redirect_nested(")
        path_openat = extract("static struct file *path_openat(struct nameidata *nd,")

        checks = {
            "TMPFILE_LOOKUP_BEFORE_WRITE":
                tmp.find("path_lookupat(nd, flags | LOOKUP_DIRECTORY, &path)") <
                tmp.find("mnt_want_write(path.mnt)"),
            "TMPFILE_LOOKUP_BEFORE_CREATE":
                tmp.find("path_lookupat(nd, flags | LOOKUP_DIRECTORY, &path)") <
                tmp.find("vfs_tmpfile(path.dentry"),
            "O_PATH_LOOKUP_BEFORE_OPEN":
                opath.find("path_lookupat(nd, flags, &path)") <
                opath.find("vfs_open(&path, file)"),
            "TMPFILE_REDIRECT_NOT_YET_INTEGRATED":
                "susfs_open_redirect_spoof_do_sys_openat" not in tmp,
            "O_PATH_REDIRECT_NOT_YET_INTEGRATED":
                "susfs_open_redirect_spoof_do_sys_openat" not in opath,
            "NORMAL_P5D_REDIRECT_PRESENT":
                "susfs_open_redirect_spoof_do_sys_openat(redirect_inode)" in path_openat,
        }
        for k,v in checks.items():
            print(f"{k}={'PASS' if v else 'FAIL'}")
        if not all(checks.values()):
            raise SystemExit("P5E preflight failed")

        state = {
            "normal_nested_sha256":
                hashlib.sha256(normal_nested.encode()).hexdigest(),
            "path_openat_sha256":
                hashlib.sha256(path_openat.encode()).hexdigest(),
        }
        Path(os.environ["ARTIFACT_DIR"], "06-protected-p5d-normal-path.json").write_text(
            json.dumps(state, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )

        print("P5E_PREOPEN_BOUNDARIES=PASS")
        print("P5D_NORMAL_PATH_PROTECTED_HASHES=RECORDED")
        PY
        grep -Fq 'P5E_PREOPEN_BOUNDARIES=PASS' "$ARTIFACT_DIR/06-p5e-preflight.txt"
        grep -Fxq '# CONFIG_KSU_SUSFS is not set' arch/arm64/configs/veux_defconfig
        sha256sum fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h fs/open.c fs/stat.c > "$ARTIFACT_DIR/06-protected-source-before.sha256"
    - name: Prove path_lookupat ownership contract
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' > "$ARTIFACT_DIR/07-path-lookupat-contract.txt"
        from pathlib import Path

        text = Path("fs/namei.c").read_text(encoding="utf-8")
        sig = "static int path_lookupat(struct nameidata *nd, unsigned flags, struct path *path)"
        start = text.find(sig)
        if start < 0:
            raise SystemExit("path_lookupat missing")
        brace = text.find("{", start)
        depth = 0
        end = None
        for i in range(brace, len(text)):
            if text[i] == "{":
                depth += 1
            elif text[i] == "}":
                depth -= 1
                if depth == 0:
                    end = i + 1
                    break
        if end is None:
            raise SystemExit("path_lookupat unterminated")
        body = text[start:end]

        checks = {
            "SUCCESS_TRANSFERS_PATH":
                "*path = nd->path;" in body,
            "SUCCESS_NULLS_ND_MNT":
                "nd->path.mnt = NULL;" in body,
            "SUCCESS_NULLS_ND_DENTRY":
                "nd->path.dentry = NULL;" in body,
            "ALWAYS_TERMINATES_WALK":
                "terminate_walk(nd);" in body,
        }
        for k,v in checks.items():
            print(f"{k}={'PASS' if v else 'FAIL'}")
        if not all(checks.values()):
            raise SystemExit("path_lookupat lifetime contract failed")
        print("P5E_PATH_LOOKUPAT_OWNERSHIP_CONTRACT=PASS")
        PY
        grep -Fq 'P5E_PATH_LOOKUPAT_OWNERSHIP_CONTRACT=PASS' "$ARTIFACT_DIR/07-path-lookupat-contract.txt"
    - name: Target-compile accepted P5D forced baseline
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf "$BASELINE_BUILD_DIR"
        make O="$BASELINE_BUILD_DIR" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- veux_defconfig
        make O="$BASELINE_BUILD_DIR" \
          ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          CONFIG_KSU_SUSFS=y CONFIG_KSU_SUSFS_OPEN_REDIRECT=y \
          KCFLAGS='-DCONFIG_KSU_SUSFS -DCONFIG_KSU_SUSFS_OPEN_REDIRECT' \
          -j2 fs/namei.o fs/susfs.o \
          2>&1 | tee "$ARTIFACT_DIR/08-p5d-forced-baseline-build.log"
        test -s "$BASELINE_BUILD_DIR/fs/namei.o"
        test -s "$BASELINE_BUILD_DIR/fs/susfs.o"
        echo "P5D_FORCED_OPEN_REDIRECT_BASELINE_COMPILE=PASS" \
          | tee "$ARTIFACT_DIR/08-p5d-forced-baseline-build.txt"
    - name: Integrate do_tmpfile and O_PATH OPEN_REDIRECT
      working-directory: kernel
      shell: bash
      run: "set -euo pipefail\ncp fs/namei.c \"$ARTIFACT_DIR/namei-p5d-before.c\"\npython3 - <<'PY'\nfrom pathlib import Path\n\np = Path(\"fs/namei.c\")\ntext = p.read_text(encoding=\"utf-8\")\n\ndef extract_function(src, signature):\n    start = src.find(signature)\n    if start < 0:\n        raise SystemExit(\"missing function: \" + signature)\n    brace = src.find(\"{\", start)\n    if brace < 0:\n        raise SystemExit(\"missing opening brace: \" + signature)\n    depth = 0\n    for i in range(brace, len(src)):\n        if src[i] == \"{\":\n            depth += 1\n        elif src[i] == \"}\":\n            depth -= 1\n            if depth == 0:\n                return start, i + 1, src[start:i + 1]\n    raise SystemExit(\"unterminated function: \" + signature)\n\ntmp_start, _, _ = extract_function(\n    text, \"static int do_tmpfile(struct nameidata *nd, unsigned flags,\"\n)\n\nnested_lookup_helper = r\"\"\"\n#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n/*\n * Resolve a redirected pathname\
        \ with a separate nested nameidata.\n *\n * path_lookupat() transfers the resulting path reference on success and\n * terminates redirect_nd internally. The outer nameidata and outer nd->name\n * remain untouched, so the caller's ECHILD/ESTALE retry pathname stays valid.\n */\nstatic int clean_gen1_open_redirect_path_lookup_nested(\n\t\t\t\t\tstruct nameidata *outer_nd,\n\t\t\t\t\tconst struct path *outer_root,\n\t\t\t\t\tunsigned flags,\n\t\t\t\t\tstruct filename *fake_filename,\n\t\t\t\t\tstruct path *path)\n{\n\tstruct nameidata redirect_nd;\n\tint error;\n\n\tif (flags & LOOKUP_ROOT)\n\t\tredirect_nd.root = *outer_root;\n\n\tset_nameidata(&redirect_nd, outer_nd->dfd, fake_filename);\n\terror = path_lookupat(&redirect_nd, flags, path);\n\trestore_nameidata();\n\treturn error;\n}\n#endif\n\n\"\"\"\n\nif \"static int clean_gen1_open_redirect_path_lookup_nested(\" in text:\n    raise SystemExit(\"P5E nested path-lookup helper already present\")\ntext = text[:tmp_start] + nested_lookup_helper\
        \ + text[tmp_start:]\n\ntmp_start, tmp_end, tmp = extract_function(\n    text, \"static int do_tmpfile(struct nameidata *nd, unsigned flags,\"\n)\n\ntmp_old_head = \"\"\"\\\n{\n\\tstruct dentry *child;\n\\tstruct path path;\n\\tint error = path_lookupat(nd, flags | LOOKUP_DIRECTORY, &path);\n\\tif (unlikely(error))\n\\t\\treturn error;\n\\terror = mnt_want_write(path.mnt);\n\"\"\"\n\ntmp_new_head = \"\"\"\\\n{\n\\tstruct dentry *child;\n\\tstruct path path;\n\\tint error;\n#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n\\tstruct path redirect_root = { .mnt = NULL, .dentry = NULL };\n\\tstruct filename *fake_filename;\n\n\\tif (flags & LOOKUP_ROOT)\n\\t\\tredirect_root = nd->root;\n#endif\n\n\\terror = path_lookupat(nd, flags | LOOKUP_DIRECTORY, &path);\n\\tif (unlikely(error))\n\\t\\treturn error;\n\n#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n\\tif (SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK(\n\\t\\t\\td_backing_inode(path.dentry))) {\n\\t\\tfake_filename = susfs_open_redirect_spoof_do_sys_openat(\n\
        \\t\\t\\t\\td_backing_inode(path.dentry));\n\\t\\tif (IS_ERR(fake_filename)) {\n\\t\\t\\terror = PTR_ERR(fake_filename);\n\\t\\t\\tgoto out;\n\\t\\t}\n\\t\\tif (fake_filename) {\n\\t\\t\\tpath_put(&path);\n\\t\\t\\terror = clean_gen1_open_redirect_path_lookup_nested(\n\\t\\t\\t\\t\\tnd, &redirect_root,\n\\t\\t\\t\\t\\tflags | LOOKUP_DIRECTORY,\n\\t\\t\\t\\t\\tfake_filename, &path);\n\\t\\t\\tputname(fake_filename);\n\\t\\t\\tif (unlikely(error))\n\\t\\t\\t\\treturn error;\n\\t\\t}\n\\t}\n#endif\n\n\\terror = mnt_want_write(path.mnt);\n\"\"\"\n\nif tmp.count(tmp_old_head) != 1:\n    raise SystemExit(f\"do_tmpfile pre-open anchor mismatch: {tmp.count(tmp_old_head)}\")\ntmp = tmp.replace(tmp_old_head, tmp_new_head, 1)\ntext = text[:tmp_start] + tmp + text[tmp_end:]\n\nopath_start, opath_end, opath = extract_function(\n    text, \"static int do_o_path(struct nameidata *nd, unsigned flags, struct file *file)\"\n)\n\nopath_old_body = \"\"\"\\\n{\n\\tstruct path path;\n\\tint error = path_lookupat(nd,\
        \ flags, &path);\n\\tif (!error) {\n\\t\\taudit_inode(nd->name, path.dentry, 0);\n\\t\\terror = vfs_open(&path, file);\n\\t\\tpath_put(&path);\n\\t}\n\\treturn error;\n}\n\"\"\"\n\nopath_new_body = \"\"\"\\\n{\n\\tstruct path path;\n\\tint error;\n#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n\\tstruct path redirect_root = { .mnt = NULL, .dentry = NULL };\n\\tstruct filename *fake_filename;\n\n\\tif (flags & LOOKUP_ROOT)\n\\t\\tredirect_root = nd->root;\n#endif\n\n\\terror = path_lookupat(nd, flags, &path);\n\\tif (!error) {\n#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n\\t\\tif (SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK(\n\\t\\t\\t\\td_backing_inode(path.dentry))) {\n\\t\\t\\tfake_filename = susfs_open_redirect_spoof_do_sys_openat(\n\\t\\t\\t\\t\\td_backing_inode(path.dentry));\n\\t\\t\\tif (IS_ERR(fake_filename)) {\n\\t\\t\\t\\terror = PTR_ERR(fake_filename);\n\\t\\t\\t\\tpath_put(&path);\n\\t\\t\\t\\treturn error;\n\\t\\t\\t}\n\\t\\t\\tif (fake_filename) {\n\\t\\t\\t\\tpath_put(&path);\n\
        \\t\\t\\t\\terror = clean_gen1_open_redirect_path_lookup_nested(\n\\t\\t\\t\\t\\t\\tnd, &redirect_root, flags,\n\\t\\t\\t\\t\\t\\tfake_filename, &path);\n\\t\\t\\t\\tputname(fake_filename);\n\\t\\t\\t\\tif (unlikely(error))\n\\t\\t\\t\\t\\treturn error;\n\\t\\t\\t}\n\\t\\t}\n#endif\n\\t\\taudit_inode(nd->name, path.dentry, 0);\n\\t\\terror = vfs_open(&path, file);\n\\t\\tpath_put(&path);\n\\t}\n\\treturn error;\n}\n\"\"\"\n\nopath_old_body = opath_old_body.rstrip(\"\\n\")\nopath_new_body = opath_new_body.rstrip(\"\\n\")\n\nif opath.count(opath_old_body) != 1:\n    raise SystemExit(f\"do_o_path body anchor mismatch: {opath.count(opath_old_body)}\")\nopath = opath.replace(opath_old_body, opath_new_body, 1)\ntext = text[:opath_start] + opath + text[opath_end:]\n\nrequired = [\n    \"static int clean_gen1_open_redirect_path_lookup_nested(\",\n    \"set_nameidata(&redirect_nd, outer_nd->dfd, fake_filename);\",\n    \"error = path_lookupat(&redirect_nd, flags, path);\",\n    \"restore_nameidata();\"\
        ,\n    \"flags | LOOKUP_DIRECTORY\",\n    \"susfs_open_redirect_spoof_do_sys_openat(\",\n]\nmissing = [x for x in required if x not in text]\nif missing:\n    raise SystemExit(\"P5E transform missing invariants: \" + repr(missing))\n\nfor forbidden in (\n    \"nd->name = fake_filename\",\n    \"outer_nd->name = fake_filename\",\n    \"redirect_nd.name = fake_filename\",\n):\n    if forbidden in text:\n        raise SystemExit(\"forbidden nameidata pathname rewrite: \" + forbidden)\n\np.write_text(text, encoding=\"utf-8\")\nPY\ngit diff --check -- fs/namei.c\ngit diff -- fs/namei.c > \"$ARTIFACT_DIR/09-p5e-namei.diff\"\ntest -s \"$ARTIFACT_DIR/09-p5e-namei.diff\"\n"
    - name: Audit P5E direct-path lifetimes and P5D preservation
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' > "$ARTIFACT_DIR/10-p5e-lifetime-audit.txt"
        from pathlib import Path
        import hashlib, json, os

        text = Path("fs/namei.c").read_text(encoding="utf-8")

        def extract(signature):
            start = text.find(signature)
            if start < 0:
                raise SystemExit("missing function: " + signature)
            brace = text.find("{", start)
            depth = 0
            for i in range(brace, len(text)):
                if text[i] == "{":
                    depth += 1
                elif text[i] == "}":
                    depth -= 1
                    if depth == 0:
                        return text[start:i+1]
            raise SystemExit("unterminated: " + signature)

        tmp = extract("static int do_tmpfile(struct nameidata *nd, unsigned flags,")
        opath = extract("static int do_o_path(struct nameidata *nd, unsigned flags, struct file *file)")
        nested = extract("static int clean_gen1_open_redirect_path_lookup_nested(")
        normal_nested = extract("static int clean_gen1_open_redirect_nested(")
        path_openat = extract("static struct file *path_openat(struct nameidata *nd,")

        protected = json.loads(
            Path(os.environ["ARTIFACT_DIR"], "06-protected-p5d-normal-path.json").read_text()
        )

        checks = {
            "NESTED_LOOKUP_SEPARATE_NAMEIDATA":
                "struct nameidata redirect_nd;" in nested and
                "set_nameidata(&redirect_nd, outer_nd->dfd, fake_filename);" in nested,
            "NESTED_LOOKUP_ROOT_PRESERVED":
                "redirect_nd.root = *outer_root;" in nested,
            "NESTED_PATH_LOOKUP":
                "error = path_lookupat(&redirect_nd, flags, path);" in nested,
            "NESTED_RESTORE_AFTER_LOOKUP":
                nested.find("path_lookupat(&redirect_nd, flags, path)") <
                nested.find("restore_nameidata();"),
            "NESTED_NO_RECURSIVE_REDIRECT_DECISION":
                "SUSFS_IS_INODE_OPEN_REDIRECT" not in nested and
                "susfs_open_redirect_spoof_do_sys_openat" not in nested,
            "TMPFILE_MARKER_BEFORE_WRITE":
                tmp.find("SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK") <
                tmp.find("mnt_want_write(path.mnt)"),
            "TMPFILE_REDIRECT_BEFORE_CREATE":
                tmp.find("clean_gen1_open_redirect_path_lookup_nested") <
                tmp.find("vfs_tmpfile(path.dentry"),
            "TMPFILE_ORIGINAL_PATH_PUT_BEFORE_REDIRECT_LOOKUP":
                tmp.find("path_put(&path);") <
                tmp.find("clean_gen1_open_redirect_path_lookup_nested"),
            "TMPFILE_FAKE_PUT_AFTER_NESTED_LOOKUP":
                tmp.find("clean_gen1_open_redirect_path_lookup_nested") <
                tmp.find("putname(fake_filename);"),
            "O_PATH_MARKER_BEFORE_OPEN":
                opath.find("SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK") <
                opath.find("vfs_open(&path, file)"),
            "O_PATH_ORIGINAL_PATH_PUT_BEFORE_REDIRECT_LOOKUP":
                opath.find("path_put(&path);") <
                opath.find("clean_gen1_open_redirect_path_lookup_nested"),
            "O_PATH_FAKE_PUT_AFTER_NESTED_LOOKUP":
                opath.find("clean_gen1_open_redirect_path_lookup_nested") <
                opath.find("putname(fake_filename);"),
            "O_PATH_OPEN_SELECTED_PATH":
                opath.find("clean_gen1_open_redirect_path_lookup_nested") <
                opath.find("vfs_open(&path, file)"),
            "OUTER_ND_NAME_UNCHANGED":
                "nd->name = fake_filename" not in text and
                "outer_nd->name = fake_filename" not in text,
            "NORMAL_P5D_NESTED_HELPER_UNCHANGED":
                hashlib.sha256(normal_nested.encode()).hexdigest() ==
                protected["normal_nested_sha256"],
            "NORMAL_P5D_PATH_OPENAT_UNCHANGED":
                hashlib.sha256(path_openat.encode()).hexdigest() ==
                protected["path_openat_sha256"],
            "THREE_OPEN_REDIRECT_DECISION_CALLS":
                text.count("susfs_open_redirect_spoof_do_sys_openat(") == 3,
        }
        for k,v in checks.items():
            print(f"{k}={'PASS' if v else 'FAIL'}")
        failed = [k for k,v in checks.items() if not v]
        if failed:
            raise SystemExit("P5E post-integration audit failed: " + ", ".join(failed))

        print("P5E_TMPFILE_OPEN_REDIRECT=PASS")
        print("P5E_O_PATH_OPEN_REDIRECT=PASS")
        print("P5E_DIRECT_PATH_NESTED_NAMEIDATA=PASS")
        print("P5D_NORMAL_PATH_BYTE_SEMANTICS_PRESERVED=PASS")
        PY
        grep -Fq 'P5E_TMPFILE_OPEN_REDIRECT=PASS' "$ARTIFACT_DIR/10-p5e-lifetime-audit.txt"
        grep -Fq 'P5E_O_PATH_OPEN_REDIRECT=PASS' "$ARTIFACT_DIR/10-p5e-lifetime-audit.txt"
        grep -Fq 'P5D_NORMAL_PATH_BYTE_SEMANTICS_PRESERVED=PASS' "$ARTIFACT_DIR/10-p5e-lifetime-audit.txt"
    - name: Prove P5E changed-file scope
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        mapfile -t changed < <(git status --porcelain | awk '{print $2}' | sort)
        printf '%s\n' "${changed[@]}" | tee "$ARTIFACT_DIR/11-changed-files.txt"
        test "${#changed[@]}" -eq 1
        test "${changed[0]}" = "fs/namei.c"

        for file in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h fs/open.c fs/stat.c
        do
          before="$(awk -v f="$file" '$2==f {print $1}' "$ARTIFACT_DIR/06-protected-source-before.sha256")"
          after="$(sha256sum "$file" | awk '{print $1}')"
          test "$before" = "$after"
        done

        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_P5D_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_P5D_RESUKISU_TREE"
        grep -Fxq '# CONFIG_KSU_SUSFS is not set' arch/arm64/configs/veux_defconfig
        test ! -e KernelSU/kernel/feature/module_load_filter.c

        {
          echo "P5E_CHANGED_FILES=fs/namei.c"
          echo "P5D_SUSFS_IMPLEMENTATION_BYTE_IDENTITY=PASS"
          echo "P5D_SUSFS_HEADER_BYTE_IDENTITY=PASS"
          echo "P5E_CHANGE_SCOPE=PASS"
          echo "SUSFS_RUNTIME_ENABLED=NO"
        } | tee "$ARTIFACT_DIR/11-scope.txt"
    - name: Target-compile normal and forced P5E objects
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail

        rm -rf "$NORMAL_BUILD_DIR"
        make O="$NORMAL_BUILD_DIR" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- veux_defconfig
        make O="$NORMAL_BUILD_DIR" \
          ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          -j2 fs/namei.o 2>&1 | tee "$ARTIFACT_DIR/12-normal-namei-build.log"
        test -s "$NORMAL_BUILD_DIR/fs/namei.o"
        ! aarch64-linux-gnu-nm "$NORMAL_BUILD_DIR/fs/namei.o" \
          | grep -q 'susfs_open_redirect_spoof_do_sys_openat'

        rm -rf "$REDIRECT_BUILD_DIR"
        make O="$REDIRECT_BUILD_DIR" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- veux_defconfig
        make O="$REDIRECT_BUILD_DIR" \
          ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          CONFIG_KSU_SUSFS=y CONFIG_KSU_SUSFS_OPEN_REDIRECT=y \
          KCFLAGS='-DCONFIG_KSU_SUSFS -DCONFIG_KSU_SUSFS_OPEN_REDIRECT' \
          -j2 fs/namei.o fs/susfs.o \
          2>&1 | tee "$ARTIFACT_DIR/12-forced-objects-build.log"

        test -s "$REDIRECT_BUILD_DIR/fs/namei.o"
        test -s "$REDIRECT_BUILD_DIR/fs/susfs.o"

        aarch64-linux-gnu-nm "$REDIRECT_BUILD_DIR/fs/namei.o" \
          | tee "$ARTIFACT_DIR/12-namei-nm.txt"
        aarch64-linux-gnu-nm "$REDIRECT_BUILD_DIR/fs/susfs.o" \
          | tee "$ARTIFACT_DIR/12-susfs-nm.txt"

        grep -Eq '[[:space:]]U[[:space:]]+susfs_open_redirect_spoof_do_sys_openat$' \
          "$ARTIFACT_DIR/12-namei-nm.txt"
        grep -Eq '[[:space:]][Tt][[:space:]]+susfs_open_redirect_spoof_do_sys_openat$' \
          "$ARTIFACT_DIR/12-susfs-nm.txt"

        {
          echo "P5E_NORMAL_NAMEI_OBJECT_COMPILE=PASS"
          echo "P5E_FORCED_NAMEI_OBJECT_COMPILE=PASS"
          echo "P5E_FORCED_SUSFS_OBJECT_COMPILE=PASS"
          echo "P5E_OPEN_REDIRECT_SYMBOL_CONTRACT=PASS"
          echo "FULL_KERNEL_BUILD_PERFORMED=NO"
        } | tee "$ARTIFACT_DIR/12-object-builds.txt"
    - name: Freeze deterministic P5E checkpoint
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        git diff --check
        git add fs/namei.c
        test "$(git diff --cached --name-only)" = "fs/namei.c"

        GIT_AUTHOR_NAME="CLEAN-GEN1 Builder" \
        GIT_AUTHOR_EMAIL="clean-gen1@invalid.local" \
        GIT_AUTHOR_DATE="2026-09-01T00:00:00Z" \
        GIT_COMMITTER_NAME="CLEAN-GEN1 Builder" \
        GIT_COMMITTER_EMAIL="clean-gen1@invalid.local" \
        GIT_COMMITTER_DATE="2026-09-01T00:00:00Z" \
          git commit -m "CLEAN GEN1 P5E integrate tmpfile and O_PATH OPEN_REDIRECT"

        P5E_COMMIT="$(git rev-parse HEAD)"
        P5E_TREE="$(git rev-parse HEAD^{tree})"
        test -z "$(git status --porcelain)"
        test -z "$(git -C KernelSU status --porcelain)"

        echo "P5E_COMMIT=$P5E_COMMIT" >> "$GITHUB_ENV"
        echo "P5E_TREE=$P5E_TREE" >> "$GITHUB_ENV"

        {
          echo "P5E_CHECKPOINT_COMMIT=$P5E_COMMIT"
          echo "P5E_OUTER_TREE=$P5E_TREE"
          echo "P5E_RESUKISU_HEAD=$(git -C KernelSU rev-parse HEAD)"
          echo "P5E_RESUKISU_TREE=$(git -C KernelSU rev-parse HEAD^{tree})"
          echo "P5E_SOURCE_CHECKPOINT=PASS"
        } | tee "$ARTIFACT_DIR/13-p5e-checkpoint.txt"
    - name: Create P5E restore kit
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail
        kit="$ARTIFACT_DIR/restore-kit"
        rm -rf "$kit"
        mkdir -p "$kit"

        git diff --binary "$P5D_RESTORED_COMMIT" "$P5E_COMMIT" \
          > "$kit/p5d-to-p5e-outer.patch"
        git diff --binary "$EXPECTED_VENDOR_SHA" "$P5E_COMMIT" \
          > "$kit/vendor-20240619-to-p5e-outer.patch"

        cp "$ARTIFACT_DIR/07-path-lookupat-contract.txt" "$kit/P5E-PATH-LOOKUPAT-CONTRACT.txt"
        cp "$ARTIFACT_DIR/09-p5e-namei.diff" "$kit/P5E-NAMEI-DIFF.patch"
        cp "$ARTIFACT_DIR/10-p5e-lifetime-audit.txt" "$kit/P5E-DIRECT-PATH-LIFETIME-AUDIT.txt"

        git -C KernelSU branch -f clean-gen1-p5e-resukisu "$EXPECTED_P5D_RESUKISU_HEAD"
        git -C KernelSU bundle create "$kit/resukisu-p5e-full.bundle" \
          refs/heads/clean-gen1-p5e-resukisu
        git -C KernelSU bundle verify "$kit/resukisu-p5e-full.bundle" \
          > "$kit/resukisu-p5e-bundle-verify.txt" 2>&1
        tar -C KernelSU --exclude=.git -cf - . \
          | zstd -19 -T0 -o "$kit/resukisu-p5e-source.tar.zst"

        python3 - <<'PY'
        from pathlib import Path
        import json, os

        kit = Path(os.environ["ARTIFACT_DIR"]) / "restore-kit"
        manifest = {
            "stage": "CLEAN_GEN1_P5E",
            "kernel_version": "5.4.274",
            "vendor_sha": os.environ["EXPECTED_VENDOR_SHA"],
            "p5d_tree": os.environ["EXPECTED_P5D_TREE"],
            "p5e_commit": os.environ["P5E_COMMIT"],
            "p5e_tree": os.environ["P5E_TREE"],
            "resukisu_head": os.environ["EXPECTED_P5D_RESUKISU_HEAD"],
            "resukisu_tree": os.environ["EXPECTED_P5D_RESUKISU_TREE"],
            "changed_files": ["fs/namei.c"],
            "normal_path_open_redirect_integrated": True,
            "tmpfile_open_redirect_integrated": True,
            "o_path_open_redirect_integrated": True,
            "separate_nested_nameidata": True,
            "outer_nameidata_name_replaced": False,
            "lookup_root_preserved": True,
            "normal_p5d_path_unchanged": True,
            "susfs_runtime_enabled": False,
            "open_redirect_runtime_enabled": False,
            "full_kernel_build_performed": False,
        }
        (kit / "manifest.json").write_text(
            json.dumps(manifest, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        PY

        cat > "$kit/RESTORE-INSTRUCTIONS.txt" <<EOF
        CLEAN GEN1 P5E deterministic restore

        Apply vendor-20240619-to-p5e-outer.patch on:
          $VENDOR_REPO @ $EXPECTED_VENDOR_SHA

        Expected outer tree:
          $P5E_TREE

        Expected ReSukiSU:
          head $EXPECTED_P5D_RESUKISU_HEAD
          tree $EXPECTED_P5D_RESUKISU_TREE

        P5E changes only fs/namei.c.
        Normal path, do_tmpfile and O_PATH OPEN_REDIRECT source paths are integrated.
        CONFIG_KSU_SUSFS remains disabled in the real VEUX defconfig.
        No full kernel build has been performed.
        EOF

        (
          cd "$kit"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
        ) | tee "$ARTIFACT_DIR/14-restore-kit-sha256.txt"
    - name: Replay P5E outer and ReSukiSU restore
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        outer="$GITHUB_WORKSPACE/p5e-outer-replay"
        rm -rf "$outer"
        git worktree add --detach "$outer" "$EXPECTED_VENDOR_SHA" >/dev/null
        (
          cd "$outer"
          git apply --check --binary \
            "$ARTIFACT_DIR/restore-kit/vendor-20240619-to-p5e-outer.patch"
          git apply --index --binary \
            "$ARTIFACT_DIR/restore-kit/vendor-20240619-to-p5e-outer.patch"
          test "$(git write-tree)" = "$P5E_TREE"
        )
        git worktree remove --force "$outer"

        resu="$GITHUB_WORKSPACE/p5e-resukisu-replay"
        rm -rf "$resu"
        git init "$resu" >/dev/null
        git -C "$resu" fetch \
          "$ARTIFACT_DIR/restore-kit/resukisu-p5e-full.bundle" \
          refs/heads/clean-gen1-p5e-resukisu:refs/heads/clean-gen1-p5e-resukisu
        git -C "$resu" checkout --detach refs/heads/clean-gen1-p5e-resukisu >/dev/null
        test "$(git -C "$resu" rev-parse HEAD)" = "$EXPECTED_P5D_RESUKISU_HEAD"
        test "$(git -C "$resu" rev-parse HEAD^{tree})" = "$EXPECTED_P5D_RESUKISU_TREE"
        rm -rf "$resu"

        {
          echo "P5E_OUTER_RESTORE_REPLAY=PASS"
          echo "P5E_RESUKISU_BUNDLE_REPLAY=PASS"
        } | tee "$ARTIFACT_DIR/15-restore-replays.txt"
    - name: Final P5E safety gate
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        test "$(make -s kernelversion)" = "5.4.274"
        test "$(git rev-parse HEAD)" = "$P5E_COMMIT"
        test "$(git rev-parse HEAD^{tree})" = "$P5E_TREE"
        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_P5D_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_P5D_RESUKISU_TREE"
        test -z "$(git status --porcelain)"
        test -z "$(git -C KernelSU status --porcelain)"

        grep -Fq 'P5E_PREOPEN_BOUNDARIES=PASS' "$ARTIFACT_DIR/06-p5e-preflight.txt"
        grep -Fq 'P5E_PATH_LOOKUPAT_OWNERSHIP_CONTRACT=PASS' "$ARTIFACT_DIR/07-path-lookupat-contract.txt"
        grep -Fq 'P5D_FORCED_OPEN_REDIRECT_BASELINE_COMPILE=PASS' "$ARTIFACT_DIR/08-p5d-forced-baseline-build.txt"
        grep -Fq 'P5E_TMPFILE_OPEN_REDIRECT=PASS' "$ARTIFACT_DIR/10-p5e-lifetime-audit.txt"
        grep -Fq 'P5E_O_PATH_OPEN_REDIRECT=PASS' "$ARTIFACT_DIR/10-p5e-lifetime-audit.txt"
        grep -Fq 'P5D_NORMAL_PATH_BYTE_SEMANTICS_PRESERVED=PASS' "$ARTIFACT_DIR/10-p5e-lifetime-audit.txt"
        grep -Fq 'P5E_CHANGE_SCOPE=PASS' "$ARTIFACT_DIR/11-scope.txt"
        grep -Fq 'P5E_OPEN_REDIRECT_SYMBOL_CONTRACT=PASS' "$ARTIFACT_DIR/12-object-builds.txt"
        grep -Fq 'P5E_OUTER_RESTORE_REPLAY=PASS' "$ARTIFACT_DIR/15-restore-replays.txt"
        grep -Fq 'P5E_RESUKISU_BUNDLE_REPLAY=PASS' "$ARTIFACT_DIR/15-restore-replays.txt"

        grep -Fxq '# CONFIG_KSU_SUSFS is not set' arch/arm64/configs/veux_defconfig
        test ! -e KernelSU/kernel/feature/module_load_filter.c

        (
          cd "$ARTIFACT_DIR/restore-kit"
          sha256sum -c SHA256SUMS
        ) > "$ARTIFACT_DIR/16-final-restore-sha256.txt"

        {
          echo "CLEAN_GEN1_P5E_TMPFILE_O_PATH_OPEN_REDIRECT=PASS"
          echo "KERNEL_VERSION=5.4.274"
          echo "P5D_RESTORE_REPLAY=PASS"
          echo "P5D_TREE=$EXPECTED_P5D_TREE"
          echo "P5E_CHECKPOINT_COMMIT=$P5E_COMMIT"
          echo "P5E_OUTER_TREE=$P5E_TREE"
          echo "P5E_RESUKISU_HEAD=$EXPECTED_P5D_RESUKISU_HEAD"
          echo "P5E_RESUKISU_TREE=$EXPECTED_P5D_RESUKISU_TREE"
          echo "NORMAL_PATH_OPEN_REDIRECT_INTEGRATED=YES"
          echo "DO_TMPFILE_OPEN_REDIRECT_INTEGRATED=YES"
          echo "DO_O_PATH_OPEN_REDIRECT_INTEGRATED=YES"
          echo "DIRECT_PATH_SEPARATE_REDIRECT_NAMEIDATA=YES"
          echo "ORIGINAL_ND_NAME_REPLACED=NO"
          echo "LOOKUP_ROOT_PRESERVED=YES"
          echo "REDIRECT_RECURSION_ALLOWED=NO"
          echo "P5D_NORMAL_PATH_BYTE_SEMANTICS_PRESERVED=PASS"
          echo "P5E_OPEN_REDIRECT_SYMBOL_CONTRACT=PASS"
          echo "P5E_CHANGED_FILES=fs/namei.c"
          echo "SUSFS_RUNTIME_ENABLED=NO"
          echo "MODULE_LOAD_FILTER_INCLUDED=NO"
          echo "P5E_OUTER_RESTORE_REPLAY=PASS"
          echo "P5E_RESUKISU_BUNDLE_REPLAY=PASS"
          echo "FULL_KERNEL_BUILD_PERFORMED=NO"
          echo "IMAGE_CREATED=NO"
          echo "DTB_BUILD_PERFORMED=NO"
          echo "BOOT_IMAGE_CREATED=NO"
          echo "FLASHABLE_ZIP_CREATED=NO"
          echo "DEVICE_ACCESSED=NO"
          echo "FLASHING_PERFORMED=NO"
          echo "NEXT_STAGE=CLEAN_GEN1_P5F_REMAINING_OPEN_REDIRECT_HOOKS_AUDIT"
        } | tee "$ARTIFACT_DIR/17-result.txt"
    - name: Preserve P5E failure evidence
      if: always()
      shell: bash
      run: |2

        set +e
        mkdir -p "$ARTIFACT_DIR"
        {
          echo "JOB_STATUS=${{ job.status }}"
          if [ -d "$GITHUB_WORKSPACE/kernel/.git" ]; then
            echo "OUTER_HEAD=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD 2>/dev/null || true)"
            echo "OUTER_TREE=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD^{tree} 2>/dev/null || true)"
            echo "OUTER_STATUS_BEGIN"
            git -C "$GITHUB_WORKSPACE/kernel" status --porcelain 2>/dev/null || true
            echo "OUTER_STATUS_END"
          fi
        } > "$ARTIFACT_DIR/99-job-end-state.txt"
        find "$ARTIFACT_DIR" -maxdepth 2 -type f -printf '%P\n' \
          | sort > "$ARTIFACT_DIR/99-artifact-file-list.txt"
        exit 0
    - name: Upload P5E checkpoint and evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: clean-gen1-p5e-tmpfile-o-path-open-redirect-v1-${{ github.run_id }}
        path: clean-gen1-p5e/
        if-no-files-found: error
        retention-days: 90
