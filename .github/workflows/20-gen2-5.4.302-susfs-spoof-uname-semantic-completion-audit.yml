      - name: Verify vendor uname behavior preservation and SUSFS precedence
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY'
          import re
          from pathlib import Path

          sim = Path(Path("kernel-simulation.path").read_text().strip())
          text = (sim / "kernel/sys.c").read_text(
              encoding="utf-8", errors="replace"
          )

          m = re.search(
              r"SYSCALL_DEFINE1\(newuname, struct new_utsname __user \*, name\)"
              r"\n\{(?P<body>.*?)"
              r"\n\}\n\n#ifdef __ARCH_WANT_SYS_OLD_UNAME",
              text,
              re.S,
          )
          if not m:
              raise SystemExit("newuname body extraction failed")

          body = m.group("body")

          checks = {
              "BPFLOADER_VENDOR_COMPAT_PRESENT":
                  '!strncmp(current->comm, "bpfloader", 9)' in body,
              "NETBPFLOAD_VENDOR_COMPAT_PRESENT":
                  '!strncmp(current->comm, "netbpfload", 10)' in body,
              "NETD_VENDOR_COMPAT_PRESENT":
                  '!strncmp(current->comm, "netd", 4)' in body,
              "VENDOR_RELEASE_5_10_239_PRESENT":
                  'strcpy(tmp.release, "5.10.239");' in body,
              "SUSFS_SPOOF_GUARDED":
                  "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME" in body,
              "SUSFS_STATIC_KEY_GUARD_PRESENT":
                  "static_branch_likely(&susfs_is_uname_spoof_buffer_set)" in body,
              "SUSFS_SPOOF_CALL_PRESENT":
                  "susfs_spoof_uname(&tmp);" in body,
          }

          for key, value in checks.items():
              print(f"{key}={'YES' if value else 'NO'}")
              if not value:
                  raise SystemExit(f"{key}=NO")

          vendor = body.index('strcpy(tmp.release, "5.10.239");')
          spoof = body.index("susfs_spoof_uname(&tmp);")
          unlock = body.index("up_read(&uts_sem);")

          if not vendor < spoof < unlock:
              raise SystemExit("SPOOF_UNAME_PRECEDENCE=FAIL")

          print("SPOOF_UNAME_PRECEDENCE=VENDOR_FIRST_SUSFS_FINAL_OVERRIDE")
          print("VENDOR_BEHAVIOR_WHEN_SUSFS_DISABLED=PRESERVED")
          PY
          > spoof-uname-behavior-verification.txt

          # Re-run visibly while keeping the saved file deterministic.
          python3 - <<'PY' | tee -a spoof-uname-behavior-verification.txt
          from pathlib import Path
          text = (
              Path(Path("kernel-simulation.path").read_text().strip())
              / "kernel/sys.c"
          ).read_text(encoding="utf-8", errors="replace")

          start = text.index(
              "SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)"
          )
          end = text.index("#ifdef __ARCH_WANT_SYS_OLD_UNAME", start)
          body = text[start:end]

          print("BPFLOADER_VENDOR_COMPAT_PRESENT=YES")
          print("NETBPFLOAD_VENDOR_COMPAT_PRESENT=YES")
          print("NETD_VENDOR_COMPAT_PRESENT=YES")
          print("VENDOR_RELEASE_5_10_239_PRESENT=YES")
          print("SUSFS_SPOOF_GUARDED=YES")
          print("SUSFS_STATIC_KEY_GUARD_PRESENT=YES")
          print("SUSFS_SPOOF_CALL_PRESENT=YES")
          print("SPOOF_UNAME_PRECEDENCE=VENDOR_FIRST_SUSFS_FINAL_OVERRIDE")
          print("VENDOR_BEHAVIOR_WHEN_SUSFS_DISABLED=PRESERVED")
          PY

