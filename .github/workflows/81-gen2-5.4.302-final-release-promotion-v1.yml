name: 81 - GEN2 5.4.302 Final Release Promotion v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GEN2_KERNEL_PIN: "f4b8a13a43a130a9aab83cc985ce4d4421291ae6"
  RESUKISU_PIN: "4a3785025a920e4f52584f14c663eea4850dc919"

  LOCKED_IMAGE_SHA256: "2448b0ee28ebb5c3781c22b29caa417a97e0662b093878477bbb4368a45f54f3"
  LOCKED_CONFIG_SHA256: "2931b6b74bf34a85f2a71cb4b76d1a3277a5538514411dd1047c841d46e92cbb"
  LOCKED_DTB_SHA256: "28a174d174cda7619bf674b29fa4e91625a6ad02f6ca4815ac7a943137b3df8c"
  LOCKED_DTBO_SHA256: "486ec73935e9805722df531cc3ddd5460f971c1edeec813fd25bef63500c0ca3"

  W79_ARTIFACT_PREFIX: "GEN2_W79_5.4.302_ReSukiSU_4A378502_AK3-"
  W80_ARTIFACT_PREFIX: "GEN2_W80_5.4.302_ReSukiSU_4A378502_VERIFIED_BOOT-"

  W79_AK3_FILENAME: "VEUX_5.4.302_ReSukiSU_4A378502_SUSFS_2.2_AK3_W79.zip"
  W79_AK3_SHA256: "30f79a74ecd6962eadc7a75357d62d220a6ce3330673e450bc171d9df9f5ddec"

  W80_BOOT_FILENAME: "VEUX_5.4.302_ReSukiSU_4A378502_SUSFS_2.2_W80_boot.img"
  W80_BOOT_SHA256: "d9a12c8075cf6e69ff530776aee59f46ee173a6ce1154f3220c439c9a23baef3"
  W80_BOOT_BYTES: "133300224"

  FINAL_AK3_FILENAME: "VEUX_5.4.302_ReSukiSU_4A378502_SUSFS_2.2_FINAL_AK3.zip"
  FINAL_BOOT_FILENAME: "VEUX_5.4.302_ReSukiSU_4A378502_SUSFS_2.2_FINAL_boot.img"

jobs:
  promote:
    name: Verify W79 + W80 and promote final GEN2 release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6

      - name: Initialize W81 workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p w81/evidence w81/downloads w81/w79 w81/w80 w81/release

          {
            echo "W81_STAGE=GEN2_FINAL_RELEASE_PROMOTION"
            echo "KERNEL_VERSION=5.4.302"
            echo "GEN2_KERNEL_PIN=$GEN2_KERNEL_PIN"
            echo "RESUKISU_PIN=$RESUKISU_PIN"
            echo "LOCKED_IMAGE_SHA256=$LOCKED_IMAGE_SHA256"
            echo "W79_EXPECTED_AK3_SHA256=$W79_AK3_SHA256"
            echo "W80_EXPECTED_BOOT_SHA256=$W80_BOOT_SHA256"
            echo "REBUILD_PERFORMED=NO"
            echo "FLASHING_PERFORMED=NO"
          } | tee w81/evidence/W81-HEADER.txt

      - name: Resolve and download latest exact W79 and W80 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          VERSION="X-GitHub-Api-Version: 2022-11-28"

          : > w81/evidence/artifacts.ndjson
          page=1
          while :; do
            out="w81/evidence/artifacts-page-${page}.json"
            curl -fsSL \
              -H "$AUTH" -H "$ACCEPT" -H "$VERSION" \
              "$API/actions/artifacts?per_page=100&page=${page}" \
              -o "$out"

            count="$(jq '.artifacts | length' "$out")"
            jq -c '.artifacts[]' "$out" >> w81/evidence/artifacts.ndjson

            if [ "$count" -lt 100 ]; then
              break
            fi

            page=$((page + 1))
            if [ "$page" -gt 100 ]; then
              echo "ERROR: artifact pagination safety limit reached"
              exit 1
            fi
          done

          jq -s '{artifacts:.}' w81/evidence/artifacts.ndjson > w81/evidence/artifacts.json

          fetch_latest_prefix() {
            prefix="$1"
            outzip="$2"
            outdir="$3"
            label="$4"

            id="$(
              jq -r --arg p "$prefix" '
                [
                  .artifacts[]
                  | select((.expired == false) and (.name | startswith($p)))
                ]
                | sort_by(.created_at)
                | reverse
                | .[0].id // empty
              ' w81/evidence/artifacts.json
            )"

            test -n "$id"

            name="$(
              jq -r --argjson id "$id" '
                .artifacts[]
                | select(.id == $id)
                | .name
              ' w81/evidence/artifacts.json
            )"

            digest="$(
              jq -r --argjson id "$id" '
                .artifacts[]
                | select(.id == $id)
                | .digest // empty
              ' w81/evidence/artifacts.json
            )"

            test -n "$name"

            curl -fLsS \
              -H "$AUTH" -H "$ACCEPT" -H "$VERSION" \
              "$API/actions/artifacts/$id/zip" \
              -o "$outzip"

            unzip -t "$outzip" >/dev/null
            unzip -q "$outzip" -d "$outdir"

            {
              echo "${label}_ARTIFACT_ID=$id"
              echo "${label}_ARTIFACT_NAME=$name"
              echo "${label}_ARTIFACT_API_DIGEST=$digest"
              echo "${label}_DOWNLOADED_ZIP_SHA256=$(sha256sum "$outzip" | awk '{print $1}')"
            } >> w81/evidence/source-artifacts.txt
          }

          fetch_latest_prefix \
            "$W79_ARTIFACT_PREFIX" \
            w81/downloads/W79.zip \
            w81/w79 \
            W79

          fetch_latest_prefix \
            "$W80_ARTIFACT_PREFIX" \
            w81/downloads/W80.zip \
            w81/w80 \
            W80

          {
            echo "ARTIFACT_DISCOVERY=PASS"
            echo "ARTIFACT_PAGES=$page"
            echo "ARTIFACT_TOTAL=$(wc -l < w81/evidence/artifacts.ndjson | tr -d ' ')"
          } >> w81/evidence/source-artifacts.txt

          cat w81/evidence/source-artifacts.txt

      - name: Verify W79 AnyKernel3 release
        shell: bash
        run: |
          set -euo pipefail

          verdict="w81/w79/W79-FINAL-VERDICT.txt"
          ak3="w81/w79/$W79_AK3_FILENAME"

          test -s "$verdict"
          test -s "$ak3"

          grep -Fxq 'W79_GEN2_AK3_PACKAGING=PASS' "$verdict"
          grep -Fxq 'AK3_EMBEDDED_IMAGE_HASH_VERIFIED=YES' "$verdict"
          grep -Fxq "LOCKED_IMAGE_SHA256=$LOCKED_IMAGE_SHA256" "$verdict"

          actual="$(sha256sum "$ak3" | awk '{print $1}')"
          test "$actual" = "$W79_AK3_SHA256"

          unzip -t "$ak3" | tee w81/evidence/W79-AK3-UNZIP-TEST.txt

          embedded="$(
            unzip -p "$ak3" Image \
              | sha256sum \
              | awk '{print $1}'
          )"
          test "$embedded" = "$LOCKED_IMAGE_SHA256"

          {
            echo "W81_W79_SOURCE=PASS"
            echo "W79_AK3_SHA256=$actual"
            echo "W79_EMBEDDED_IMAGE_SHA256=$embedded"
            echo "W79_EMBEDDED_IMAGE_HASH_VERIFIED=YES"
          } | tee w81/evidence/W79-VERIFICATION.txt

      - name: Verify W80 boot image release
        shell: bash
        run: |
          set -euo pipefail

          verdict="w81/w80/evidence/W80-FINAL-VERDICT.txt"
          boot="w81/w80/output/$W80_BOOT_FILENAME"

          test -s "$verdict"
          test -s "$boot"

          grep -Fxq 'W80_GEN2_VERIFIED_BOOT_REPACK=PASS' "$verdict"
          grep -Fxq 'RAMDISK_LOGICALLY_PRESERVED=YES' "$verdict"
          grep -Fxq 'EXTRA_DTB_PAYLOAD=NO' "$verdict"
          grep -Fxq "LOCKED_IMAGE_SHA256=$LOCKED_IMAGE_SHA256" "$verdict"

          actual="$(sha256sum "$boot" | awk '{print $1}')"
          bytes="$(stat -c '%s' "$boot")"

          test "$actual" = "$W80_BOOT_SHA256"
          test "$bytes" = "$W80_BOOT_BYTES"

          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path("w81/w80/output/VEUX_5.4.302_ReSukiSU_4A378502_SUSFS_2.2_W80_boot.img")
          d = p.read_bytes()
          assert d[:8] == b"ANDROID!", "ANDROID! magic missing"
          hv = struct.unpack_from("<I", d, 40)[0]
          assert hv == 3, f"expected boot header v3, got {hv}"
          assert len(d) <= 134217728, len(d)
          print("W80_BOOT_ANDROID_MAGIC=PASS")
          print("W80_BOOT_HEADER_VERSION=3")
          print("W80_BOOT_PARTITION_FIT=PASS")
          PY

          {
            echo "W81_W80_SOURCE=PASS"
            echo "W80_BOOT_SHA256=$actual"
            echo "W80_BOOT_BYTES=$bytes"
            echo "W80_BOOT_HEADER_VERSION=3"
            echo "W80_RAMDISK_LOGICALLY_PRESERVED=YES"
            echo "W80_EXTRA_DTB_PAYLOAD=NO"
          } | tee w81/evidence/W80-VERIFICATION.txt

      - name: Assemble final GEN2 release payload
        shell: bash
        run: |
          set -euo pipefail

          cp "w81/w79/$W79_AK3_FILENAME" \
             "w81/release/$FINAL_AK3_FILENAME"

          cp "w81/w80/output/$W80_BOOT_FILENAME" \
             "w81/release/$FINAL_BOOT_FILENAME"

          test "$(sha256sum "w81/release/$FINAL_AK3_FILENAME" | awk '{print $1}')" = "$W79_AK3_SHA256"
          test "$(sha256sum "w81/release/$FINAL_BOOT_FILENAME" | awk '{print $1}')" = "$W80_BOOT_SHA256"

          cp w81/w79/W79-FINAL-VERDICT.txt \
             w81/release/W79-SOURCE-VERDICT.txt
          cp w81/w80/evidence/W80-FINAL-VERDICT.txt \
             w81/release/W80-SOURCE-VERDICT.txt

          {
            echo "RELEASE=GEN2_VEUX_5.4.302_RESUKISU_4A378502_SUSFS_2.2"
            echo "DEVICE=veux"
            echo "KERNEL_VERSION=5.4.302"
            echo "GEN2_KERNEL_PIN=$GEN2_KERNEL_PIN"
            echo "RESUKISU_PIN=$RESUKISU_PIN"
            echo "LOCKED_IMAGE_SHA256=$LOCKED_IMAGE_SHA256"
            echo "LOCKED_CONFIG_SHA256=$LOCKED_CONFIG_SHA256"
            echo "LOCKED_DTB_SHA256=$LOCKED_DTB_SHA256"
            echo "LOCKED_DTBO_SHA256=$LOCKED_DTBO_SHA256"
            echo "AK3_FILENAME=$FINAL_AK3_FILENAME"
            echo "AK3_SHA256=$W79_AK3_SHA256"
            echo "BOOT_FILENAME=$FINAL_BOOT_FILENAME"
            echo "BOOT_SHA256=$W80_BOOT_SHA256"
            echo "BOOT_BYTES=$W80_BOOT_BYTES"
            echo "BOOT_HEADER_VERSION=3"
            echo "BASE_ANDROID_VERSION=16"
            echo "BASE_SECURITY_PATCH=2026-04"
            echo "AK3_EMBEDDED_IMAGE_HASH_VERIFIED=YES"
            echo "BOOT_RAMDISK_LOGICALLY_PRESERVED=YES"
            echo "FLASHING_PERFORMED=NO"
          } > w81/release/W81-RELEASE-MANIFEST.txt

          (
            cd w81/release
            sha256sum \
              "$FINAL_AK3_FILENAME" \
              "$FINAL_BOOT_FILENAME" \
              W79-SOURCE-VERDICT.txt \
              W80-SOURCE-VERDICT.txt \
              W81-RELEASE-MANIFEST.txt \
              > W81-SHA256SUMS.txt

            sha256sum -c W81-SHA256SUMS.txt
          ) | tee w81/evidence/W81-MANIFEST-CHECK.txt

      - name: Write final W81 release verdict
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "W81_GEN2_FINAL_RELEASE_PROMOTION=PASS"
            echo "KERNEL_VERSION=5.4.302"
            echo "GEN2_KERNEL_PIN=$GEN2_KERNEL_PIN"
            echo "RESUKISU_PIN=$RESUKISU_PIN"
            echo "LOCKED_IMAGE_SHA256=$LOCKED_IMAGE_SHA256"
            echo "AK3_FILENAME=$FINAL_AK3_FILENAME"
            echo "AK3_SHA256=$W79_AK3_SHA256"
            echo "BOOT_FILENAME=$FINAL_BOOT_FILENAME"
            echo "BOOT_SHA256=$W80_BOOT_SHA256"
            echo "BOOT_BYTES=$W80_BOOT_BYTES"
            echo "W79_SOURCE_VERDICT=PASS"
            echo "W80_SOURCE_VERDICT=PASS"
            echo "AK3_EMBEDDED_IMAGE_HASH_VERIFIED=YES"
            echo "BOOT_REPACK_VERIFIED=YES"
            echo "RAMDISK_LOGICALLY_PRESERVED=YES"
            echo "EXTRA_DTB_PAYLOAD=NO"
            echo "REBUILD_PERFORMED=NO"
            echo "REAL_DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
            echo "GEN2_RELEASE_READY=YES"
            echo "NEXT_STAGE=DEVICE_SIDE_TEST_WHEN_USER_CHOOSES"
          } | tee w81/release/W81-FINAL-RELEASE-VERDICT.txt

      - name: Final W81 integrity gate
        shell: bash
        run: |
          set -euo pipefail

          grep -Fxq 'W81_GEN2_FINAL_RELEASE_PROMOTION=PASS' \
            w81/release/W81-FINAL-RELEASE-VERDICT.txt
          grep -Fxq 'W79_SOURCE_VERDICT=PASS' \
            w81/release/W81-FINAL-RELEASE-VERDICT.txt
          grep -Fxq 'W80_SOURCE_VERDICT=PASS' \
            w81/release/W81-FINAL-RELEASE-VERDICT.txt
          grep -Fxq 'AK3_EMBEDDED_IMAGE_HASH_VERIFIED=YES' \
            w81/release/W81-FINAL-RELEASE-VERDICT.txt
          grep -Fxq 'BOOT_REPACK_VERIFIED=YES' \
            w81/release/W81-FINAL-RELEASE-VERDICT.txt
          grep -Fxq 'GEN2_RELEASE_READY=YES' \
            w81/release/W81-FINAL-RELEASE-VERDICT.txt

          test "$(sha256sum "w81/release/$FINAL_AK3_FILENAME" | awk '{print $1}')" = "$W79_AK3_SHA256"
          test "$(sha256sum "w81/release/$FINAL_BOOT_FILENAME" | awk '{print $1}')" = "$W80_BOOT_SHA256"

          (
            cd w81/release
            sha256sum -c W81-SHA256SUMS.txt
          )

          echo "W81_FINAL_GATE=PASS"

      - name: Upload final compact GEN2 release
        uses: actions/upload-artifact@v4
        with:
          name: GEN2_W81_5.4.302_ReSukiSU_4A378502_FINAL_RELEASE-${{ github.run_number }}
          path: |
            w81/release/VEUX_5.4.302_ReSukiSU_4A378502_SUSFS_2.2_FINAL_AK3.zip
            w81/release/VEUX_5.4.302_ReSukiSU_4A378502_SUSFS_2.2_FINAL_boot.img
            w81/release/W81-FINAL-RELEASE-VERDICT.txt
            w81/release/W81-RELEASE-MANIFEST.txt
            w81/release/W81-SHA256SUMS.txt
            w81/release/W79-SOURCE-VERDICT.txt
            w81/release/W80-SOURCE-VERDICT.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
