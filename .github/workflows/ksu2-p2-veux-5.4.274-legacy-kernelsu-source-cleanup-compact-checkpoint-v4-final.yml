            exit 1
          fi

          git diff --check

          git diff --binary HEAD > "$ARTIFACT_DIR/P1-TO-P2-KSU-CLEANUP.diff"
          git diff --name-status HEAD > "$ARTIFACT_DIR/P1-TO-P2-NAME-STATUS.txt"
          git diff --name-only HEAD | sort > "$ARTIFACT_DIR/P1-TO-P2-CHANGED-PATHS.txt"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re

          artifact = Path(os.environ["ARTIFACT_DIR"])
          raw = (artifact / "P1-TO-P2-KSU-CLEANUP.diff").read_text(encoding="utf-8")
          normalized = re.sub(
              r"^index [0-9a-f]+\.\.[0-9a-f]+( [0-9]+)?$",
              r"index <OLD>..<NEW>\1",
              raw,
              flags=re.M,
          )
          out = artifact / "P1-TO-P2-KSU-CLEANUP.normalized.diff"
          out.write_text(normalized, encoding="utf-8")

          sha = hashlib.sha256(normalized.encode("utf-8")).hexdigest()
          size = len(normalized.encode("utf-8"))

          expected_sha = os.environ["EXPECTED_P1_TO_P2_NORMALIZED_DIFF_SHA256"]
          expected_size = int(os.environ["EXPECTED_P1_TO_P2_NORMALIZED_DIFF_BYTES"])

          if sha != expected_sha:
              raise SystemExit(
                  f"ERROR: normalized P1->P2 cleanup diff hash mismatch: {sha} != {expected_sha}"
              )
          if size != expected_size:
              raise SystemExit(
                  f"ERROR: normalized P1->P2 cleanup diff bytes mismatch: {size} != {expected_size}"
              )

          (artifact / "P1-TO-P2-NORMALIZED-DIFF-STATE.txt").write_text(
              f"NORMALIZED_DIFF_SHA256={sha}\nNORMALIZED_DIFF_BYTES={size}\n",
              encoding="utf-8",
          )
          PY

          CHANGED_PATHS="$(wc -l < "$ARTIFACT_DIR/P1-TO-P2-CHANGED-PATHS.txt" | tr -d ' ')"
          DELETED_KSU_FILES="$(awk '$1 == "D" && $2 ~ /^drivers\/kernelsu\// {n++} END {print n+0}' "$ARTIFACT_DIR/P1-TO-P2-NAME-STATUS.txt")"

          test "$CHANGED_PATHS" = "$EXPECTED_P1_TO_P2_CHANGED_PATHS"
          test "$DELETED_KSU_FILES" = "$EXPECTED_P1_TO_P2_DELETED_KSU_FILES"

          for PATHNAME in \
            drivers/Kconfig \
            drivers/Makefile \
            fs/devpts/inode.c \
            fs/exec.c \
            fs/namespace.c \
            fs/open.c \
            fs/read_write.c \
            fs/stat.c
          do
