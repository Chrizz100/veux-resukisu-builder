          start_token = "#ifdef CONFIG_KSU\nstatic inline int can_umount"
          end_token = "#endif\n\n/*\n * Now umount"
          start = text.find(start_token)
          end = text.find(end_token, start)
          if start < 0 or end < 0:
              raise SystemExit("ERROR: namespace KernelSU helper block anchor mismatch")
          end += len("#endif\n\n")
          namespace.write_text(text[:start] + text[end:], encoding="utf-8")

          replace_once(
              "fs/open.c",
              "#ifdef CONFIG_KSU\n"
              "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
              "\t\t\t\tint *mode, int *flags);\n"
              "#endif\n",
              "",
