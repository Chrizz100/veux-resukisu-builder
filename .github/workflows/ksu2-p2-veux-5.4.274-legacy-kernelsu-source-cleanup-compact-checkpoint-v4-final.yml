          done

          git add -A
          P2_TREE="$(git write-tree)"
          if [ "$P2_TREE" != "$EXPECTED_P2_TREE" ]; then
            echo "ERROR: P2 clean source tree mismatch"
            echo "Expected: $EXPECTED_P2_TREE"
            echo "Actual:   $P2_TREE"
            git diff --cached --stat HEAD
            exit 1
