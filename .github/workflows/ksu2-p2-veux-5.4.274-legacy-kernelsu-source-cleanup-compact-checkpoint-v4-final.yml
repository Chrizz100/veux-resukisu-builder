          git commit -m "ksu2-p2: remove inherited legacy KernelSU source and hooks"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P2_TREE"
          test -z "$(git status --porcelain)"

          {
            echo "P2_SOURCE_CLEANUP=PASS"
            echo "PARENT_TREE=$EXPECTED_CUMULATIVE_TREE"
            echo "P2_TREE=$EXPECTED_P2_TREE"
            echo "INHERITED_KSU_SUBTREE_REMOVED=$KSU_SUBTREE"
            echo "INHERITED_KSU_FILES_REMOVED=$KSU_FILE_COUNT"
            echo "CHANGED_PATHS=$CHANGED_PATHS"
            echo "KERNELSU_SOURCE=ABSENT"
            echo "KERNELSU_HOOK_RESIDUE=ABSENT"
            echo "SUSFS=ABSENT"
            echo "RESUKISU=ABSENT"
          } | tee "$ARTIFACT_DIR/P2-SOURCE-IDENTITY.txt"

          echo "P2_CLEAN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Resolve P2 source-clean VEUX configuration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P2_TREE"
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          rm -rf "$OUT_DIR"

          make O="$OUT_DIR" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 veux_defconfig \
            2>&1 | tee "$ARTIFACT_DIR/p2-defconfig.log"

          CONFIG="$OUT_DIR/.config"
          test -s "$CONFIG"

          cp "$ARTIFACT_DIR/P1-parent.config" "$ARTIFACT_DIR/P1.config"
          cp "$CONFIG" "$ARTIFACT_DIR/P2.config"

          REQUIRED_Y=(
            CONFIG_64BIT
            CONFIG_CC_IS_CLANG
            CONFIG_LD_IS_LLD
            CONFIG_IKCONFIG
            CONFIG_IKCONFIG_PROC
            CONFIG_CPUSETS
            CONFIG_SCHED_CASS
            CONFIG_HZ_250
            CONFIG_CPU_FREQ
            CONFIG_CPU_FREQ_GOV_SCHEDUTIL
            CONFIG_ARM_QCOM_CPUFREQ_HW
            CONFIG_CPU_IDLE
            CONFIG_ARM_QCOM_LPM_CPUIDLE
          )

          for SYMBOL in "${REQUIRED_Y[@]}"; do
            grep -qx "${SYMBOL}=y" "$CONFIG" || {
              echo "ERROR: required P2 config is not y: $SYMBOL"
              exit 1
            }
          done

          grep -qx 'CONFIG_HZ=250' "$CONFIG"
          grep -qx '# CONFIG_SPRD_ROTATION_TASK is not set' "$CONFIG"

          if grep -Eq '^(# )?CONFIG_(KSU|SUSFS|KSU_SUSFS)(=| |_)' "$CONFIG"; then
            echo "ERROR: KernelSU/SUSFS config token exists in P2 source-clean config"
            grep -E '^(# )?CONFIG_(KSU|SUSFS|KSU_SUSFS)(=| |_)' "$CONFIG" || true
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import hashlib
          import os
          import re
          import shutil

          artifact = Path(os.environ["ARTIFACT_DIR"])
          parent_path = artifact / "P1-parent.config"
          child_path = Path(os.environ["OUT_DIR"]) / ".config"

          # Preserve exact raw inputs as first-class diagnostic evidence.
          shutil.copy2(parent_path, artifact / "P1.config")
          shutil.copy2(child_path, artifact / "P2.config")

          set_re = re.compile(r"^(CONFIG_[A-Za-z0-9_]+)=(.*)$")
          unset_re = re.compile(r"^# (CONFIG_[A-Za-z0-9_]+) is not set$")

          def parse_config(path: Path):
              values = {}
              duplicates = []
              for lineno, raw in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  match = set_re.fullmatch(raw)
                  if match:
                      key, value = match.group(1), match.group(2)
                  else:
                      match = unset_re.fullmatch(raw)
                      if not match:
                          continue
                      key, value = match.group(1), "n"

                  if key in values:
                      duplicates.append((key, lineno, values[key], value))
                  values[key] = value

              return values, duplicates

          def is_ksu(key: str) -> bool:
              return key == "CONFIG_KSU" or key.startswith("CONFIG_KSU_")

          p1, p1_dupes = parse_config(parent_path)
          p2, p2_dupes = parse_config(child_path)

          duplicate_lines = []
          for label, duplicates in (("P1", p1_dupes), ("P2", p2_dupes)):
              for key, lineno, old, new in duplicates:
                  duplicate_lines.append(
                      f"{label}:{lineno}:{key}:previous={old}:new={new}"
                  )

          (artifact / "P1-P2-CONFIG-DUPLICATES.txt").write_text(
              "\n".join(duplicate_lines) + ("\n" if duplicate_lines else ""),
              encoding="utf-8",
          )

          p2_ksu = {key: value for key, value in p2.items() if is_ksu(key)}
          p1_non_ksu = {key: value for key, value in p1.items() if not is_ksu(key)}
          p2_non_ksu = {key: value for key, value in p2.items() if not is_ksu(key)}

          def canonical(values):
              return [f"{key}={values[key]}\n" for key in sorted(values)]

          p1_lines = canonical(p1_non_ksu)
          p2_lines = canonical(p2_non_ksu)

          (artifact / "P1-NON-KSU.semantic.config").write_text(
              "".join(p1_lines), encoding="utf-8"
          )
          (artifact / "P2-NON-KSU.semantic.config").write_text(
              "".join(p2_lines), encoding="utf-8"
          )

          semantic_diff = "".join(
              difflib.unified_diff(
                  p1_lines,
                  p2_lines,
                  fromfile="P1-NON-KSU.semantic.config",
                  tofile="P2-NON-KSU.semantic.config",
              )
          )
          (artifact / "P1-P2-CONFIG-SEMANTIC.diff").write_text(
              semantic_diff, encoding="utf-8"
          )

          p1_keys = set(p1_non_ksu)
          p2_keys = set(p2_non_ksu)
          added = sorted(p2_keys - p1_keys)
          removed = sorted(p1_keys - p2_keys)
          changed = sorted(
              key
              for key in (p1_keys & p2_keys)
              if p1_non_ksu[key] != p2_non_ksu[key]
          )

          detail_lines = []
          detail_lines += [f"ADDED {key}={p2_non_ksu[key]}" for key in added]
          detail_lines += [f"REMOVED {key}={p1_non_ksu[key]}" for key in removed]
          detail_lines += [
              f"CHANGED {key}: {p1_non_ksu[key]} -> {p2_non_ksu[key]}"
              for key in changed
          ]
          (artifact / "P1-P2-CONFIG-SEMANTIC-DETAILS.txt").write_text(
              "\n".join(detail_lines) + ("\n" if detail_lines else ""),
              encoding="utf-8",
          )

          p1_sha = hashlib.sha256(parent_path.read_bytes()).hexdigest()
          p2_sha = hashlib.sha256(child_path.read_bytes()).hexdigest()

          status = (
              "PASS"
              if not duplicate_lines and not p2_ksu and not added and not removed and not changed
              else "FAIL"
          )

          equivalence = [
              f"P1_TO_P2_CONFIG_EQUIVALENCE={status}",
              "COMPARISON=SEMANTIC_KCONFIG_MAP",
              "IGNORED_NAMESPACE=CONFIG_KSU*",
              f"P1_PARSED_SYMBOLS={len(p1)}",
              f"P2_PARSED_SYMBOLS={len(p2)}",
              f"P1_NON_KSU_SYMBOLS={len(p1_non_ksu)}",
              f"P2_NON_KSU_SYMBOLS={len(p2_non_ksu)}",
              f"P2_KSU_NAMESPACE_SYMBOLS={len(p2_ksu)}",
              f"NON_KSU_ADDED={len(added)}",
              f"NON_KSU_REMOVED={len(removed)}",
              f"NON_KSU_CHANGED={len(changed)}",
              f"DUPLICATE_SYMBOL_RECORDS={len(duplicate_lines)}",
              f"P1_CONFIG_SHA256={p1_sha}",
              f"P2_CONFIG_SHA256={p2_sha}",
          ]
          (artifact / "P1-P2-CONFIG-EQUIVALENCE.txt").write_text(
              "\n".join(equivalence) + "\n",
              encoding="utf-8",
          )

          if duplicate_lines:
              raise SystemExit(
                  "ERROR: duplicate Kconfig symbols detected; see P1-P2-CONFIG-DUPLICATES.txt"
              )

          if p2_ksu:
              listing = ", ".join(
                  f"{key}={value}" for key, value in sorted(p2_ksu.items())
              )
              raise SystemExit(f"ERROR: CONFIG_KSU namespace remains in P2: {listing}")

          if added or removed or changed:
              raise SystemExit(
                  "ERROR: P2 non-KSU semantic config differs from P1; "
                  f"added={len(added)} removed={len(removed)} changed={len(changed)}; "
                  "see P1-P2-CONFIG-SEMANTIC.diff"
              )
          PY

          CONFIG_SHA="$(sha256sum "$CONFIG" | awk '{print $1}')"
          cp "$CONFIG" "$ARTIFACT_DIR/config-before-build"

          make -s O="$OUT_DIR" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 kernelrelease \
            | tee "$ARTIFACT_DIR/kernelrelease.txt"

          {
            echo "P2_CONFIG=PASS"
            echo "P2_CONFIG_SHA256=$CONFIG_SHA"
            echo "P1_TO_P2_CONFIG_CHANGE=NON_KSU_SEMANTICALLY_IDENTICAL_KSU_NAMESPACE_REMOVED"
            echo "CONFIG_IKCONFIG=y"
            echo "CONFIG_HZ_250=y"
            echo "CONFIG_CPUSETS=y"
            echo "CONFIG_SCHED_CASS=y"
            echo "KSU_CONFIG=ABSENT"
            echo "SUSFS_CONFIG=ABSENT"
            echo "ACTIVE_ROOT_MANAGER=NONE"
          } | tee "$ARTIFACT_DIR/P2-CONFIG-STATE.txt"

      - name: Build complete P2 source-clean kernel Image and DTBs
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          set +e
          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            Image \
            dtbs \
            2>&1 | tee "$ARTIFACT_DIR/full-build.log"
          BUILD_RC=${PIPESTATUS[0]}
          set -e

          printf '%s\n' "$BUILD_RC" > "$ARTIFACT_DIR/full-build.exit-code"
          test "$BUILD_RC" -eq 0

      - name: Capture P2 build identity before diagnostic gates
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX="$OUT_DIR/vmlinux"
          SYSTEM_MAP="$OUT_DIR/System.map"
          CONFIG="$OUT_DIR/.config"

          for FILE in "$IMAGE" "$VMLINUX" "$SYSTEM_MAP" "$CONFIG"; do
            test -s "$FILE"
          done

          mapfile -t DTBS < <(find "$OUT_DIR/arch/arm64/boot/dts" -type f -name 'veux.dtb' -print | sort)
          if [ "${#DTBS[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one veux.dtb, found ${#DTBS[@]}"
            printf '%s\n' "${DTBS[@]}"
            exit 1
          fi
          DTB="${DTBS[0]}"

          IMAGE_SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
          VMLINUX_SHA="$(sha256sum "$VMLINUX" | awk '{print $1}')"
          SYSTEM_MAP_SHA="$(sha256sum "$SYSTEM_MAP" | awk '{print $1}')"
          CONFIG_SHA="$(sha256sum "$CONFIG" | awk '{print $1}')"
          DTB_SHA="$(sha256sum "$DTB" | awk '{print $1}')"
          IMAGE_BYTES="$(stat -c '%s' "$IMAGE")"
          DTB_BYTES="$(stat -c '%s' "$DTB")"

          test "$CONFIG_SHA" = "$EXPECTED_P2_V3_CONFIG_SHA256"
          test "$DTB_SHA" = "$EXPECTED_VEUX_DTB_SHA256"
          test "$DTB_BYTES" = "$EXPECTED_VEUX_DTB_BYTES"

          cat > "$ARTIFACT_DIR/P2-BUILD-IDENTITY.txt" <<EOF
          P2_BUILD_IDENTITY_CAPTURE=PASS
          P2_V3_REFERENCE_RUN_ID=$P2_V3_REFERENCE_RUN_ID
          P2_SOURCE_TREE=$EXPECTED_P2_TREE
          IMAGE_BYTES=$IMAGE_BYTES
          IMAGE_SHA256=$IMAGE_SHA
          VMLINUX_SHA256=$VMLINUX_SHA
          SYSTEM_MAP_SHA256=$SYSTEM_MAP_SHA
          CONFIG_SHA256=$CONFIG_SHA
          VEUX_DTB_SHA256=$DTB_SHA
          VEUX_DTB_BYTES=$DTB_BYTES
          FULL_BUILD_EXIT_CODE=0
          EOF

      - name: Audit P2 compiler diagnostics and immutable config
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LOG="$ARTIFACT_DIR/full-build.log"
          CONFIG="$OUT_DIR/.config"

          test -s "$CONFIG"
          cmp -s "$ARTIFACT_DIR/config-before-build" "$CONFIG"

          grep -Ei '(^|[[:space:]])error:' "$LOG" > "$ARTIFACT_DIR/FULL-BUILD-ERRORS.txt" || true
          grep -Ei '(^|[[:space:]])warning:' "$LOG" > "$ARTIFACT_DIR/FULL-BUILD-WARNINGS.txt" || true
          grep -E 'drivers/cpufreq/cpufreq\.c:.*warning:' "$LOG" > "$ARTIFACT_DIR/CPUFREQ-WARNINGS.txt" || true
          grep -Ei '(drivers/cpuidle/cpuidle\.c|drivers/cpuidle/lpm-levels\.c):.*warning:' "$LOG" > "$ARTIFACT_DIR/IDLE-WARNINGS.txt" || true
          python3 - "$LOG" "$ARTIFACT_DIR/ROOT-LAYER-WARNINGS.txt" "$ARTIFACT_DIR/ROOT-WARNING-CLASSIFIER-SELFTEST.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          log_path = Path(sys.argv[1])
          out_path = Path(sys.argv[2])
          selftest_path = Path(sys.argv[3])

          warning_re = re.compile(r"^(.*?):\d+(?::\d+)?:\s+warning:")

          def source_path(line: str):
              match = warning_re.match(line)
              if not match:
                  return None
              raw = match.group(1).replace("\\", "/")
              marker = "/kernel/"
              if marker in raw:
                  raw = raw.rsplit(marker, 1)[1]
              return raw.lstrip("./")

          def is_root_layer_warning(line: str) -> bool:
              rel = source_path(line)
              if rel is None:
                  return False
              lower = rel.lower()
              return (
                  lower.startswith("drivers/kernelsu/")
                  or lower.startswith("kernelsu/")
                  or lower.startswith("resukisu/")
                  or lower.startswith("fs/susfs")
                  or lower.startswith("include/linux/susfs")
                  or lower.startswith("kernel/susfs")
              )

          fake_base = "/home/runner/work/veux-resukisu-builder/veux-resukisu-builder/kernel/"
          negative = fake_base + "drivers/cpufreq/qcom-cpufreq-hw.c:551:23: warning: unused variable 'c' [-Wunused-variable]"
          positive_ksu = fake_base + "drivers/kernelsu/core.c:1:1: warning: synthetic"
          positive_susfs = fake_base + "fs/susfs.c:1:1: warning: synthetic"

          if is_root_layer_warning(negative):
              raise SystemExit("ERROR: path-safe classifier still matches repository-name resukisu")
          if not is_root_layer_warning(positive_ksu):
              raise SystemExit("ERROR: path-safe classifier missed drivers/kernelsu")
          if not is_root_layer_warning(positive_susfs):
              raise SystemExit("ERROR: path-safe classifier missed fs/susfs.c")

          matches = [
              line for line in log_path.read_text(encoding="utf-8", errors="replace").splitlines()
              if "warning:" in line and is_root_layer_warning(line)
          ]
          out_path.write_text("\n".join(matches) + ("\n" if matches else ""), encoding="utf-8")
          selftest_path.write_text(
              "ROOT_WARNING_CLASSIFIER=PASS\n"
              "REPOSITORY_NAME_RESUKISU_FALSE_POSITIVE=REJECTED\n"
              "DRIVERS_KERNELSU_POSITIVE=DETECTED\n"
              "FS_SUSFS_POSITIVE=DETECTED\n",
              encoding="utf-8",
          )
          PY

          ERROR_COUNT="$(wc -l < "$ARTIFACT_DIR/FULL-BUILD-ERRORS.txt" | tr -d ' ')"
          WARNING_COUNT="$(wc -l < "$ARTIFACT_DIR/FULL-BUILD-WARNINGS.txt" | tr -d ' ')"
          CPUFREQ_WARNING_COUNT="$(wc -l < "$ARTIFACT_DIR/CPUFREQ-WARNINGS.txt" | tr -d ' ')"
          IDLE_WARNING_COUNT="$(wc -l < "$ARTIFACT_DIR/IDLE-WARNINGS.txt" | tr -d ' ')"
          ROOT_WARNING_COUNT="$(wc -l < "$ARTIFACT_DIR/ROOT-LAYER-WARNINGS.txt" | tr -d ' ')"

          test "$ERROR_COUNT" -eq 0
          test "$CPUFREQ_WARNING_COUNT" -eq 0
          test "$IDLE_WARNING_COUNT" -eq 0
          test "$ROOT_WARNING_COUNT" -eq 0

          # P1 had exactly one unrelated baseline warning in qcom-cpufreq-hw.c.
          # P2 source cleanup must not add another warning.
          if [ "$WARNING_COUNT" -ne 1 ]; then
            echo "ERROR: P2 warning profile changed from the P1 baseline"
            cat "$ARTIFACT_DIR/FULL-BUILD-WARNINGS.txt"
            exit 1
          fi

          grep -Fq "drivers/cpufreq/qcom-cpufreq-hw.c:551:23: warning: unused variable 'c' [-Wunused-variable]" \
            "$ARTIFACT_DIR/FULL-BUILD-WARNINGS.txt"

          {
            echo "COMPILER_AUDIT=PASS"
            echo "ERROR_COUNT=$ERROR_COUNT"
            echo "WARNING_COUNT=$WARNING_COUNT"
            echo "WARNING_PROFILE_EQUALS_P1_BASELINE=YES"
            echo "CPUFREQ_WARNING_COUNT=$CPUFREQ_WARNING_COUNT"
            echo "IDLE_WARNING_COUNT=$IDLE_WARNING_COUNT"
            echo "ROOT_LAYER_WARNING_COUNT=$ROOT_WARNING_COUNT"
            echo "CONFIG_BYTE_IDENTICAL_PRE_POST=YES"
          } | tee "$ARTIFACT_DIR/DIAGNOSTICS.txt"

      - name: Verify P2 linked state Image identity and VEUX DTB
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX="$OUT_DIR/vmlinux"
          SYSTEM_MAP="$OUT_DIR/System.map"
          NM="$TOOLCHAIN_DIR/bin/llvm-nm"

          for FILE in "$IMAGE" "$VMLINUX" "$SYSTEM_MAP"; do
            test -s "$FILE"
          done

          mapfile -t DTBS < <(find "$OUT_DIR/arch/arm64/boot/dts" -type f -name 'veux.dtb' -print | sort)
          if [ "${#DTBS[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one veux.dtb, found ${#DTBS[@]}"
            printf '%s\n' "${DTBS[@]}"
            exit 1
          fi

          DTB="${DTBS[0]}"
          DTB_SHA="$(sha256sum "$DTB" | awk '{print $1}')"
          DTB_BYTES="$(stat -c '%s' "$DTB")"
          test "$DTB_SHA" = "$EXPECTED_VEUX_DTB_SHA256"
          test "$DTB_BYTES" = "$EXPECTED_VEUX_DTB_BYTES"

          NM_FILE="${RUNNER_TEMP}/ksu2-p2-vmlinux-symbols.txt"
          "$NM" -n "$VMLINUX" > "$NM_FILE"

          if grep -Eq '[[:space:]](ksu_|susfs_)' "$NM_FILE"; then
            echo "ERROR: KernelSU/SUSFS symbol found in P2 linked kernel"
            grep -E '[[:space:]](ksu_|susfs_)' "$NM_FILE" | head -n 100
            exit 1
          fi

          IMAGE_STRINGS="${RUNNER_TEMP}/ksu2-p2-image-strings.txt"
          strings "$IMAGE" > "$IMAGE_STRINGS"
          if grep -Ei 'KernelSU|ReSukiSU|SUSFS' "$IMAGE_STRINGS" \
            > "$ARTIFACT_DIR/ROOT-IDENTITY-STRINGS.txt"
          then
            echo "ERROR: root-manager/SUSFS identity string found in P2 Image"
            cat "$ARTIFACT_DIR/ROOT-IDENTITY-STRINGS.txt"
            exit 1
          fi
          : > "$ARTIFACT_DIR/ROOT-IDENTITY-STRINGS.txt"

          grep -E '[[:space:]]cass_[A-Za-z0-9_]+$' "$NM_FILE" > "$ARTIFACT_DIR/CASS-SYMBOLS.txt" || true
          test "$(wc -l < "$ARTIFACT_DIR/CASS-SYMBOLS.txt" | tr -d ' ')" -ge 1

          grep -Ei '[[:space:]][A-Za-z0-9_]*cpuset[A-Za-z0-9_]*$' "$NM_FILE" > "$ARTIFACT_DIR/CPUSET-SYMBOLS.txt" || true
          test "$(wc -l < "$ARTIFACT_DIR/CPUSET-SYMBOLS.txt" | tr -d ' ')" -ge 1

          if grep -Eq '[[:space:]]lpm_sleep_disabled$' "$NM_FILE"; then
            echo "ERROR: lpm_sleep_disabled linked"
            exit 1
          fi

          if grep -Eq '[[:space:]](check_for_task_rotation|try_rotation_task|do_rotation_task|rotation_task_init|set_rotation_enable)$' "$NM_FILE"; then
            echo "ERROR: SPRD rotation symbol linked"
            exit 1
          fi

          {
            echo "P2_LINKED_STATE=PASS"
            echo "KSU_SUSFS_LINKED_SYMBOLS=ABSENT"
            echo "ROOT_IDENTITY_STRINGS=ABSENT"
            echo "ACTIVE_ROOT_MANAGER=NONE"
            echo "VEUX_DTB_SHA256=$DTB_SHA"
            echo "VEUX_DTB_BYTES=$DTB_BYTES"
          } | tee "$ARTIFACT_DIR/P2-LINKED-STATE.txt"

          echo "P2_DTB=$DTB" >> "$GITHUB_ENV"

      - name: Create compact P2 checkpoint evidence
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX="$OUT_DIR/vmlinux"
          SYSTEM_MAP="$OUT_DIR/System.map"
          CONFIG="$OUT_DIR/.config"
          DTB="$P2_DTB"

          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P2_TREE"
          test -z "$(git status --porcelain)"

          # Small, reconstructable source evidence only. No source archive is uploaded.
          git diff --binary "$P1_CUMULATIVE_SHA" HEAD \
            > "$ARTIFACT_DIR/P1-TO-P2-KSU-CLEANUP.diff"
          git log --oneline --decorate --graph -n 80 \
            > "$ARTIFACT_DIR/SOURCE-LINEAGE.txt"

          cp "$CONFIG" "$ARTIFACT_DIR/final.config"
          cmp -s "$CONFIG" "$ARTIFACT_DIR/final.config"

          IMAGE_SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
          VMLINUX_SHA="$(sha256sum "$VMLINUX" | awk '{print $1}')"
          SYSTEM_MAP_SHA="$(sha256sum "$SYSTEM_MAP" | awk '{print $1}')"
          CONFIG_SHA="$(sha256sum "$CONFIG" | awk '{print $1}')"
          DTB_SHA="$(sha256sum "$DTB" | awk '{print $1}')"
          IMAGE_BYTES="$(stat -c '%s' "$IMAGE")"

          cat > "$ARTIFACT_DIR/P2-CHECKPOINT.txt" <<EOF
          CHECKPOINT=KSU2-P2-CANDIDATE
          CHECKPOINT_FORMAT=COMPACT_V4_PATHSAFE_DIAGNOSTICS
          PARENT_CHECKPOINT=KSU2-P1-PROVEN
          KERNEL=VEUX Linux 5.4.274
          SOURCE_REPOSITORY=$SOURCE_REPOSITORY
          SOURCE_BASE_SHA=$SOURCE_BASE_SHA
          P1_SOURCE_TREE=$EXPECTED_CUMULATIVE_TREE
          P2_SOURCE_SHA=$P2_CLEAN_SHA
          P2_SOURCE_TREE=$EXPECTED_P2_TREE
          P1_TO_P2_NORMALIZED_DIFF_SHA256=$EXPECTED_P1_TO_P2_NORMALIZED_DIFF_SHA256
          P1_TO_P2_CHANGED_PATHS=$EXPECTED_P1_TO_P2_CHANGED_PATHS
          INHERITED_KERNELSU_FILES_REMOVED=$EXPECTED_INHERITED_KSU_FILE_COUNT
          IMAGE_BYTES=$IMAGE_BYTES
          IMAGE_SHA256=$IMAGE_SHA
          VMLINUX_SHA256=$VMLINUX_SHA
          SYSTEM_MAP_SHA256=$SYSTEM_MAP_SHA
          CONFIG_SHA256=$CONFIG_SHA
          VEUX_DTB_SHA256=$DTB_SHA
          ACTIVE_ROOT_MANAGER=NONE
          KERNELSU_SOURCE=ABSENT
          RESUKISU=ABSENT
          SUSFS=ABSENT
          FULL_BUILD=PASS
          P1_TO_P2_CONFIG_EQUIVALENCE=PASS
          CROSS_RUN_REPRODUCIBILITY=PENDING_V5_INDEPENDENT_REBUILD
          SOURCE_TARBALL_UPLOADED=NO
          IMAGE_UPLOADED=NO
          VMLINUX_UPLOADED=NO
          SYSTEM_MAP_UPLOADED=NO
          BOOT_IMAGE_CREATED=NO
          FLASHING_PERFORMED=NO
          EOF

          cat > "$ARTIFACT_DIR/COMPACT-BACKUP-POLICY.txt" <<'EOF'
          KSU2 compact checkpoint policy
          ==============================
          The full kernel is compiled and audited inside the GitHub Actions runner.
          Large transient outputs are intentionally not uploaded at intermediate stages:
          - no complete kernel source tarball
          - no Image binary
          - no vmlinux binary
          - no System.map binary
          - no full build output tree
          Reconstructability is preserved by immutable source pins, exact Git tree IDs,
          the P1->P2 diff, final.config, build hashes and audit evidence.
          EOF

          # Do not retain the potentially large raw build log or transient symbol/string dumps.
          rm -f "$ARTIFACT_DIR/full-build.log"

          (
            cd "$ARTIFACT_DIR"
            sha256sum \
              P2-CHECKPOINT.txt \
              final.config \
              P1-TO-P2-KSU-CLEANUP.diff \
              P1-TO-P2-KSU-CLEANUP.normalized.diff \
              P1-SOURCE-IDENTITY.txt \
              P2-SOURCE-IDENTITY.txt \
              P1-PARENT-CONFIG-STATE.txt \
              P1-P2-CONFIG-EQUIVALENCE.txt \
              P1-NON-KSU.semantic.config \
              P2-NON-KSU.semantic.config \
              P1-P2-CONFIG-SEMANTIC.diff \
              P1-P2-CONFIG-SEMANTIC-DETAILS.txt \
              P1-P2-CONFIG-DUPLICATES.txt \
              P2-CONFIG-STATE.txt \
              P2-LINKED-STATE.txt \
              P2-BUILD-IDENTITY.txt \
              ROOT-WARNING-CLASSIFIER-SELFTEST.txt \
              DIAGNOSTICS.txt \
              COMPACT-BACKUP-POLICY.txt \
              > CHECKPOINT-SHA256SUMS
          )

          {
            echo "COMPACT_CHECKPOINT_CREATED=YES"
            echo "LARGE_BINARY_UPLOADS=NONE"
            echo "SOURCE_ARCHIVE_UPLOAD=NO"
            echo "BUILD_BINARY_UPLOAD=NO"
          } | tee "$ARTIFACT_DIR/COMPACT-CHECKPOINT-STATE.txt"

      - name: Create always-on P2 diagnostic context
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$ARTIFACT_DIR"

          {
            echo "WORKFLOW=$GITHUB_WORKFLOW"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "GITHUB_REF=$GITHUB_REF"
            echo "P1_EXPECTED_TREE=$EXPECTED_CUMULATIVE_TREE"
            echo "P2_EXPECTED_TREE=$EXPECTED_P2_TREE"

            if [ -d kernel/.git ]; then
              echo "CURRENT_KERNEL_COMMIT=$(git -C kernel rev-parse HEAD 2>/dev/null || true)"
              echo "CURRENT_KERNEL_TREE=$(git -C kernel rev-parse 'HEAD^{tree}' 2>/dev/null || true)"
              echo "CURRENT_KERNEL_STATUS_COUNT=$(git -C kernel status --porcelain 2>/dev/null | wc -l | tr -d ' ')"
            fi

            test -f "$ARTIFACT_DIR/P2-SOURCE-IDENTITY.txt" \
              && echo "P2_SOURCE_CLEANUP_EVIDENCE=PRESENT" \
              || echo "P2_SOURCE_CLEANUP_EVIDENCE=ABSENT"

            test -f "$ARTIFACT_DIR/P1-P2-CONFIG-EQUIVALENCE.txt" \
              && echo "CONFIG_EQUIVALENCE_EVIDENCE=PRESENT" \
              || echo "CONFIG_EQUIVALENCE_EVIDENCE=ABSENT"

            test -f "$ARTIFACT_DIR/full-build.exit-code" \
              && echo "FULL_BUILD_EXIT_CODE=$(cat "$ARTIFACT_DIR/full-build.exit-code")" \
              || echo "FULL_BUILD_EXIT_CODE=NOT_RUN"

            test -f "$ARTIFACT_DIR/P2-CHECKPOINT.txt" \
              && echo "FINAL_CHECKPOINT=PRESENT" \
              || echo "FINAL_CHECKPOINT=ABSENT"
            test -f "$ARTIFACT_DIR/P2-BUILD-IDENTITY.txt" \
              && echo "BUILD_IDENTITY_EVIDENCE=PRESENT" \
              || echo "BUILD_IDENTITY_EVIDENCE=ABSENT"
            test -f "$ARTIFACT_DIR/ROOT-WARNING-CLASSIFIER-SELFTEST.txt" \
              && echo "ROOT_WARNING_CLASSIFIER_EVIDENCE=PRESENT" \
              || echo "ROOT_WARNING_CLASSIFIER_EVIDENCE=ABSENT"
          } > "$ARTIFACT_DIR/FAILURE-CONTEXT.txt"

          find "$ARTIFACT_DIR" -maxdepth 1 -type f -printf '%f\n' 2>/dev/null \
            | sort > "$ARTIFACT_DIR/ARTIFACT-FILE-LIST.txt"

      - name: Upload compact KSU2-P2 checkpoint and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksu2-p2-veux-5.4.274-compact-checkpoint-v4-${{ github.run_id }}
          path: ksu2-p2-artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Publish KSU2-P2 summary
        shell: bash
        run: |
          set -euo pipefail

          cat "$ARTIFACT_DIR/P2-CHECKPOINT.txt" | tee -a "$GITHUB_STEP_SUMMARY"

          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          KSU2-P2 v4 removes the inherited legacy KernelSU source and its conditional hook footprint
          from the frozen P1-PROVEN VEUX Linux 5.4.274 source tree. The full kernel must still build,
          the VEUX DTB must remain exact, and every non-KSU Kconfig symbol must remain semantically
          identical to P1 while the complete CONFIG_KSU* namespace is absent. Text ordering/comments are
          not treated as semantic changes. No KernelSU, ReSukiSU or SUSFS is integrated.

          A green v4 creates one compact, reconstructable P2 candidate checkpoint. Large source/build
          binaries are intentionally not uploaded. Cross-run reproducibility remains PENDING until an
          independent follow-up rebuild pins and reproduces the new P2 hashes.
          No boot image was created and no device was accessed or flashed.
          EOF

      - name: Publish KSU2-P2 failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "KSU2-P2 v4 failed before the final checkpoint."
            echo
            echo "A compact diagnostic artifact was uploaded with the evidence available at the failure boundary."

            if [ -f "$ARTIFACT_DIR/P1-P2-CONFIG-EQUIVALENCE.txt" ]; then
              echo
              echo '```text'
              cat "$ARTIFACT_DIR/P1-P2-CONFIG-EQUIVALENCE.txt"
