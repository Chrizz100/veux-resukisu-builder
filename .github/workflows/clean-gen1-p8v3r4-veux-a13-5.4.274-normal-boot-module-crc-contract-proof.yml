name: CLEAN GEN1 P8 v3 r4 - VEUX A13 5.4.274 normal-boot module CRC contract proof

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: clean-gen1-p8v3r4-veux-a13-5-4-274-normal-boot-module-crc-proof
  cancel-in-progress: false

env:
  TARGET_KERNEL_RELEASE: 5.4.274-qgki-g82179e362f33
  TARGET_KERNEL_VERSION: '5.4.274'
  TARGET_REGION_COUNT: '8'
  TARGET_REGION_IDS: china,global,india,indonesia,japan,russia,taiwan,turkey
  EXPECTED_P8V2_SHARED_ABI_SHA256: ee6a6230c9e17cb1b32cf187a3e85b4f1cba8f478ff225f9d0e1144ac809f9e5

  P6V10_V2_RUN_ID: '33603757875'
  P6V10_V2_ARTIFACT: clean-gen1-p6v10-stock-kernel-release-sucompat-p7-boot-v2-33603757875
  P6V10_V2_ARTIFACT_DIGEST: 83de3f4ba5f58cf99c25ed2107b4ee3a2114c99ba6a03be973bcdfee6ab2b85b

  P8V2_R2_RUN_ID: '33676494739'
  P8V2_R2_MATRIX_ARTIFACT: clean-gen1-p8v2r2-veux-a13-module-abi-matrix-33676494739
  P8V3_R1_RUN_ID: '33681198464'
  P8V3_R1_CANDIDATE_ARTIFACT: clean-gen1-p8v3-veux-5.4.274-module-contract-candidate-33681198464
  P8V3_R1_FAILURE: MODPROBE_SHOW_EXPORTS_NO_DATA_TREATED_AS_FATAL
  P8V3_R2_RUN_ID: '33712444862'
  P8V3_R2_FAILURE: SYSTEM_PRONTO_INTERNAL_PATH_MAPPING_TOO_NARROW
  P8V3_R3_RUN_ID: '33713038957'
  P8V3_R3_FAILURE: DIRECT_INSMOD_TARGET_ABSENT_IN_SELECTED_ROOTS

  VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
  VENDOR_TAG: '20240619'
  EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
  CLANG_PREBUILT_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e

  KBUILD_BUILD_USER: builder
  KBUILD_BUILD_HOST: pangu-build-component-vendor-345942-54r9t-tw0tk-tq90c
  KBUILD_BUILD_TIMESTAMP: Thu Dec 5 14:47:59 UTC 2024
  KBUILD_BUILD_VERSION: '1'
  SOURCE_DATE_EPOCH: '1733410079'
  KBUILD_FIXED_SCM_SUFFIX: -g82179e362f33
  P8V3_EFFECTIVE_KCFLAGS: -D__ANDROID_COMMON_KERNEL__

  TRACKER_REPO: https://github.com/XiaomiFirmwareUpdater/miui-updates-tracker.git
  TRACKER_COMMIT: c9d55af855fa504a199daf4e41da58c538d326b0

  GLOBAL_ROM_CODENAME: veux_global
  GLOBAL_ROM_VERSION: OS1.0.12.0.TKCMIXM
  GLOBAL_ROM_ANDROID: '13.0'
  GLOBAL_ROM_MD5: cda1240a451dd4f75776878b52f0cea3
  GLOBAL_ROM_URL: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.12.0.TKCMIXM/veux_global_images_OS1.0.12.0.TKCMIXM_20241205.0000.00_13.0_global_cda1240a45.tgz

  LPUNPACK_REPO: unix3dgforce/lpunpack
  LPUNPACK_COMMIT: c59b8f3b069c5a8aa438a049fa4a091177172434
  LPUNPACK_PY_BLOB: 9671d1d731d28f04f0d65dad0dacb2110da87029

jobs:
  global-stock-crc-proof:
    name: Global representative normal-boot stock symbol CRC proof - r4
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      WORK_DIR: ${{ github.workspace }}/p8v3r4-crc
      CANDIDATE_DIR: ${{ github.workspace }}/p8v3r4-crc/candidate
      P8_DIR: ${{ github.workspace }}/p8v3r4-crc/p8v2
      ROM_DIR: ${{ github.workspace }}/p8v3r4-crc/rom
      LOGICAL_DIR: ${{ github.workspace }}/p8v3r4-crc/logical
      RAMDISK_DIR: ${{ github.workspace }}/p8v3r4-crc/vendor-ramdisks
      MOUNT_DIR: ${{ github.workspace }}/p8v3r4-crc/mounts
      ROOTS_TSV: ${{ github.workspace }}/p8v3r4-crc/roots.tsv
      OUTPUT_DIR: ${{ github.workspace }}/p8v3r4-crc/output

    steps:
      - name: Initialize CRC proof retry
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR"
          mkdir -p \
            "$CANDIDATE_DIR" "$P8_DIR" "$ROM_DIR" "$LOGICAL_DIR" \
            "$RAMDISK_DIR/fragments" "$RAMDISK_DIR/roots" \
            "$MOUNT_DIR" "$OUTPUT_DIR"
          : > "$ROOTS_TSV"

      - name: Download accepted P8-v3 r1 candidate
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.P8V3_R1_CANDIDATE_ARTIFACT }}
          path: ${{ env.CANDIDATE_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V3_R1_RUN_ID }}

      - name: Download P8-v2 r2 aggregate matrix
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.P8V2_R2_MATRIX_ARTIFACT }}
          path: ${{ env.P8_DIR }}/matrix
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 Global evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-global-33676494739
          path: ${{ env.P8_DIR }}/global
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 China evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-china-33676494739
          path: ${{ env.P8_DIR }}/china
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 India evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-india-33676494739
          path: ${{ env.P8_DIR }}/india
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 Indonesia evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-indonesia-33676494739
          path: ${{ env.P8_DIR }}/indonesia
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 Japan evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-japan-33676494739
          path: ${{ env.P8_DIR }}/japan
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 Russia evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-russia-33676494739
          path: ${{ env.P8_DIR }}/russia
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 Taiwan evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-taiwan-33676494739
          path: ${{ env.P8_DIR }}/taiwan
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Download P8-v2 r2 Turkey evidence
        uses: actions/download-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-turkey-33676494739
          path: ${{ env.P8_DIR }}/turkey
          github-token: ${{ github.token }}
          run-id: ${{ env.P8V2_R2_RUN_ID }}

      - name: Authenticate eight-region P8-v2 r2 family proof
        shell: bash
        run: |
          set -euo pipefail

          for region in china global india indonesia japan russia taiwan turkey; do
            dir="$P8_DIR/$region"
            test -s "$dir/SHA256SUMS"
            (
              cd "$dir"
              sha256sum -c SHA256SUMS
            ) > "$OUTPUT_DIR/01-${region}-p8v2-sha256.txt"
          done

          test -s "$P8_DIR/matrix/SHA256SUMS"
          (
            cd "$P8_DIR/matrix"
            sha256sum -c SHA256SUMS
          ) > "$OUTPUT_DIR/01-matrix-sha256.txt"

          python3 - "$P8_DIR" "$OUTPUT_DIR/01-eight-region-family.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          out = Path(sys.argv[2])
          target = {"china", "global", "india", "indonesia", "japan", "russia", "taiwan", "turkey"}
          release = "5.4.274-qgki-g82179e362f33"
          abi = "ee6a6230c9e17cb1b32cf187a3e85b4f1cba8f478ff225f9d0e1144ac809f9e5"

          matrix = json.loads(
              (root / "matrix" / "P8V2-MODULE-ABI-MATRIX.json").read_text(encoding="utf-8")
          )
          release_group = set(matrix["groups"]["stock_kernel_release"].get(release, []))
          abi_group = set(matrix["groups"]["module_abi_fingerprint"].get(abi, []))
          if release_group != target:
              raise SystemExit(f"P8-v2 5.4.274 region set mismatch: {sorted(release_group)}")
          if abi_group != target:
              raise SystemExit(f"P8-v2 shared ABI region set mismatch: {sorted(abi_group)}")

          docs = {}
          direct_commands = set()
          for region in sorted(target):
              doc = json.loads(
                  (root / region / "region-module-abi.json").read_text(encoding="utf-8")
              )
              if doc["region"]["id"] != region:
                  raise SystemExit(f"region evidence identity mismatch: {region}")
              if doc["stock"]["kernel_release"] != release:
                  raise SystemExit(f"stock release mismatch: {region}")
              if doc["module_inventory"]["module_abi_set_sha256"] != abi:
                  raise SystemExit(f"module ABI fingerprint mismatch: {region}")
              if doc["module_inventory"]["module_file_count"] != 284:
                  raise SystemExit(f"unexpected P8-v2 module count: {region}")
              if doc["module_inventory"]["modules_with___versions"] != 284:
                  raise SystemExit(f"missing __versions coverage: {region}")
              if doc["load_contract"]["modules_load_entry_count"] != 286:
                  raise SystemExit(f"unexpected modules.load entry count: {region}")
              if doc["load_contract"]["init_rc_module_command_count"] != 1:
                  raise SystemExit(f"unexpected direct module command count: {region}")
              if doc["assessment"]["classification"] != "DECLARED_MODULE_LOAD_CONTRACT_MISMATCH":
                  raise SystemExit(f"unexpected P8-v2 classification: {region}")

              commands = {
                  item["command"]
                  for item in doc["load_contract"]["rc_commands"]
              }
              direct_commands |= commands
              docs[region] = {
                  "rom_version": doc["region"]["version"],
                  "module_abi_set_sha256": doc["module_inventory"]["module_abi_set_sha256"],
                  "module_file_count": doc["module_inventory"]["module_file_count"],
                  "modules_load_entry_count": doc["load_contract"]["modules_load_entry_count"],
                  "direct_module_commands": sorted(commands),
              }

          expected_command = "insmod /system/lib/modules/pronto/pronto_wlan.ko con_mode=5"
          if direct_commands != {expected_command}:
              raise SystemExit(f"eight-region direct insmod contract differs: {sorted(direct_commands)}")

          result = {
              "stage": "P8V3_EIGHT_REGION_PARENT_PROOF",
              "target_regions": sorted(target),
              "target_region_count": len(target),
              "stock_kernel_release": release,
              "shared_p8v2_module_abi_sha256": abi,
              "p8v2_inventory_module_count_per_region": 284,
              "p8v2_modules_load_entries_per_region": 286,
              "shared_direct_insmod_command": expected_command,
              "regions": docs,
              "eea_included": False,
          }
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          {
            echo "P8V3_EIGHT_REGION_PARENT_PROOF=PASS"
            echo "TARGET_REGION_COUNT=8"
            echo "TARGET_REGION_IDS=$TARGET_REGION_IDS"
            echo "SHARED_STOCK_KERNEL_RELEASE=$TARGET_KERNEL_RELEASE"
            echo "SHARED_P8V2_ABI_SHA256=$EXPECTED_P8V2_SHARED_ABI_SHA256"
            echo "SHARED_DIRECT_INSMOD=/system/lib/modules/pronto/pronto_wlan.ko"
            echo "EEA_INCLUDED=NO"
          } > "$OUTPUT_DIR/01-eight-region-family.txt"

      - name: Authenticate P8-v3 candidate artifact
        shell: bash
        run: |
          set -euo pipefail

          test -s "$CANDIDATE_DIR/SHA256SUMS"
          (
            cd "$CANDIDATE_DIR"
            sha256sum -c SHA256SUMS
          ) > "$OUTPUT_DIR/02-candidate-sha256.txt"

          grep -Fxq 'CLEAN_GEN1_P8_V3_CANDIDATE_BUILD=PASS' \
            "$CANDIDATE_DIR/P8V3-CANDIDATE-RESULT.txt"
          grep -Fxq "TARGET_KERNEL_RELEASE=$TARGET_KERNEL_RELEASE" \
            "$CANDIDATE_DIR/P8V3-CANDIDATE-RESULT.txt"
          grep -Fxq 'SOURCE_DELTA_FILE_COUNT=1' \
            "$CANDIDATE_DIR/P8V3-CANDIDATE-RESULT.txt"
          grep -Fxq 'SOURCE_DELTA_FILE=arch/arm64/configs/veux_defconfig' \
            "$CANDIDATE_DIR/P8V3-CANDIDATE-RESULT.txt"
          grep -Fxq 'CONFIG_MODULES=Y' "$CANDIDATE_DIR/P8V3-CANDIDATE-RESULT.txt"
          grep -Fxq 'CONFIG_MODVERSIONS=Y' "$CANDIDATE_DIR/P8V3-CANDIDATE-RESULT.txt"
          grep -Fxq 'MODULE_SYMVERS_REPRODUCIBLE=YES' \
            "$CANDIDATE_DIR/P8V3-CANDIDATE-RESULT.txt"
          grep -Fxq 'P8V3_BUILD_A_MODULE_SYMVERS=PASS' \
            "$CANDIDATE_DIR/04-build-a-state.txt"
          grep -Fxq 'P8V3_MODULE_SYMVERS_REPRODUCIBLE=YES' \
            "$CANDIDATE_DIR/05-build-b-state.txt"
          test -s "$CANDIDATE_DIR/build-a/Module.symvers"

          {
            echo "P8V3_R4_ACCEPTED_CANDIDATE_RUN_ID=$P8V3_R1_RUN_ID"
            echo "P8V3_R4_ACCEPTED_CANDIDATE_ARTIFACT=$P8V3_R1_CANDIDATE_ARTIFACT"
            echo "P8V3_R1_CANDIDATE_BUILD=PASS"
            echo "P8V3_R1_CRC_FAILURE=$P8V3_R1_FAILURE"
            echo "P8V3_R2_RUN_ID=$P8V3_R2_RUN_ID"
            echo "P8V3_R2_FAILURE=$P8V3_R2_FAILURE"
            echo "P8V3_R3_RUN_ID=$P8V3_R3_RUN_ID"
            echo "P8V3_R3_FAILURE=$P8V3_R3_FAILURE"
            echo "P8V3_R4_KERNEL_REBUILD_PERFORMED=NO"
          } > "$OUTPUT_DIR/02-r4-candidate-provenance.txt"

      - name: Install stock-analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            android-sdk-libsparse-utils binutils ca-certificates cpio curl \
            e2fsprogs f2fs-tools file git gzip jq kmod lz4 python3 tar \
            util-linux xz-utils zstd

          command -v simg2img
          command -v modinfo
          command -v modprobe
          command -v readelf
          command -v blkid
          command -v cpio

      - name: Checkout pinned read-only lpunpack source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LPUNPACK_REPO }}
          ref: ${{ env.LPUNPACK_COMMIT }}
          path: lpunpack-tool
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate lpunpack and Global ROM catalog entry
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C "$GITHUB_WORKSPACE/lpunpack-tool" rev-parse HEAD)" = "$LPUNPACK_COMMIT"
          test "$(git hash-object "$GITHUB_WORKSPACE/lpunpack-tool/lpunpack.py")" = "$LPUNPACK_PY_BLOB"
          python3 -m py_compile "$GITHUB_WORKSPACE/lpunpack-tool/lpunpack.py"

          git init -q "$WORK_DIR/tracker"
          git -C "$WORK_DIR/tracker" remote add origin "$TRACKER_REPO"
          git -C "$WORK_DIR/tracker" fetch -q --depth=1 origin "$TRACKER_COMMIT"
          git -C "$WORK_DIR/tracker" checkout -q --detach FETCH_HEAD
          test "$(git -C "$WORK_DIR/tracker" rev-parse HEAD)" = "$TRACKER_COMMIT"

          python3 - \
            "$WORK_DIR/tracker/data/latest.yml" \
            "$GLOBAL_ROM_CODENAME" "$GLOBAL_ROM_VERSION" \
            "$GLOBAL_ROM_URL" "$GLOBAL_ROM_MD5" \
            "$OUTPUT_DIR/03-global-rom-input-auth.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          source, codename, version, url, md5, output = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          blocks = re.split(r"(?m)^- ", text)
          matches = []
          for raw in blocks:
              block = "- " + raw
              required = (
                  f"codename: {codename}\n",
                  f"version: {version}\n",
                  f"link: {url}\n",
                  f"md5: {md5}\n",
                  "method: Fastboot\n",
                  "branch: Stable\n",
                  "android: '13.0'\n",
              )
              if all(token in block for token in required):
                  matches.append(block)

          if len(matches) != 1:
              raise SystemExit(f"expected one pinned Global tracker entry, got {len(matches)}")

          Path(output).write_text(
              "P8V3_GLOBAL_ROM_INPUT_AUTH=PASS\n"
              f"ROM_CODENAME={codename}\n"
              f"ROM_VERSION={version}\n"
              f"ROM_MD5={md5}\n",
              encoding="utf-8",
          )
          PY

      - name: Stream Global ROM and extract vendor_boot plus super
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/p8v3-extract-global.py" <<'PY'
          import json
          import shutil
          import sys
          import tarfile
          from pathlib import Path

          out_dir = Path(sys.argv[1])
          manifest = Path(sys.argv[2])
          wanted = {"vendor_boot.img", "super.img"}
          found = {}

          with tarfile.open(fileobj=sys.stdin.buffer, mode="r|gz") as archive:
              for member in archive:
                  if not member.isfile():
                      continue
                  base = Path(member.name).name
                  if base not in wanted:
                      continue
                  if "/images/" not in "/" + member.name:
                      continue
                  if base in found:
                      raise SystemExit(f"duplicate ROM member {base}")
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"cannot read {member.name}")
                  target = out_dir / base
                  with target.open("wb") as handle:
                      shutil.copyfileobj(source, handle, length=8 * 1024 * 1024)
                  found[base] = {
                      "archive_member": member.name,
                      "bytes": target.stat().st_size,
                  }

          if set(found) != wanted:
              raise SystemExit(f"missing required ROM images: {sorted(wanted - set(found))}")

          manifest.write_text(
              json.dumps(found, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          fifo="$RUNNER_TEMP/p8v3-global-archive.fifo"
          rm -f "$fifo"
          mkfifo "$fifo"
          md5sum < "$fifo" > "$OUTPUT_DIR/04-global-rom-archive-md5.txt" &
          md5_pid=$!

          set +e
          curl \
            --fail --location --silent --show-error \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "$GLOBAL_ROM_URL" \
            | tee "$fifo" \
            | python3 "$RUNNER_TEMP/p8v3-extract-global.py" \
                "$ROM_DIR" "$OUTPUT_DIR/04-global-rom-members.json"
          status=("${PIPESTATUS[@]}")
          wait "$md5_pid"
          md5_rc=$?
          set -e

          rm -f "$fifo"
          test "${status[0]}" -eq 0
          test "${status[1]}" -eq 0
          test "${status[2]}" -eq 0
          test "$md5_rc" -eq 0
          test "$(awk '{print $1}' "$OUTPUT_DIR/04-global-rom-archive-md5.txt")" = "$GLOBAL_ROM_MD5"

      - name: Extract vendor ramdisks and module-bearing logical partitions
        shell: bash
        run: |
          set -euo pipefail

          cleanup_mounts() {
            set +e
            find "$MOUNT_DIR" -mindepth 1 -maxdepth 1 -type d -print0 2>/dev/null \
              | while IFS= read -r -d '' mnt; do
                  mountpoint -q "$mnt" && sudo umount "$mnt"
                done
          }
          trap cleanup_mounts EXIT

          python3 - "$ROM_DIR/vendor_boot.img" "$RAMDISK_DIR/fragments" "$OUTPUT_DIR/05-vendor-boot.json" <<'PY'
          import hashlib
          import json
          import struct
          import sys
          from pathlib import Path

          image_path = Path(sys.argv[1])
          out_dir = Path(sys.argv[2])
          output = Path(sys.argv[3])
          data = image_path.read_bytes()

          if data[:8] != b"VNDRBOOT":
              raise SystemExit("vendor_boot magic missing")

          u32 = lambda off: struct.unpack_from("<I", data, off)[0]
          version = u32(8)
          page_size = u32(12)
          total_ramdisk_size = u32(24)
          header_size = u32(2096)
          dtb_size = u32(2100)

          if version not in (3, 4):
              raise SystemExit(f"unsupported vendor_boot version {version}")
          align = lambda value: (value + page_size - 1) // page_size * page_size
          ramdisk_offset = align(header_size)
          if ramdisk_offset + total_ramdisk_size > len(data):
              raise SystemExit("vendor ramdisk outside image")
          aggregate = data[ramdisk_offset:ramdisk_offset + total_ramdisk_size]

          fragments = []
          if version == 4:
              table_size = u32(2112)
              entry_count = u32(2116)
              entry_size = u32(2120)
              table_offset = ramdisk_offset + align(total_ramdisk_size) + align(dtb_size)
              if entry_count and entry_size < 108:
                  raise SystemExit("unexpected vendor ramdisk entry size")
              for index in range(entry_count):
                  off = table_offset + index * entry_size
                  size, rel, rtype = struct.unpack_from("<III", data, off)
                  name = data[off + 12:off + 44].split(b"\0", 1)[0].decode("ascii", "replace")
                  if rel + size > len(aggregate):
                      raise SystemExit("vendor ramdisk fragment outside aggregate")
                  fragments.append((index, name or f"fragment-{index}", rtype, aggregate[rel:rel+size]))

          if not fragments:
              fragments = [(0, "vendor_ramdisk", None, aggregate)]

          manifest = []
          for index, name, rtype, blob in fragments:
              path = out_dir / f"ramdisk-{index:02d}.bin"
              path.write_bytes(blob)
              manifest.append({
                  "index": index,
                  "name": name,
                  "type": rtype,
                  "bytes": len(blob),
                  "sha256": hashlib.sha256(blob).hexdigest(),
              })

          output.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          unpack_fragment() {
            local src="$1"
            local root="$2"
            local cpio_file="$RUNNER_TEMP/$(basename "$src").cpio"
            local magic6 magic4

            rm -rf "$root"
            mkdir -p "$root"
            magic6="$(head -c 6 "$src" | xxd -p -c 32)"
            magic4="$(head -c 4 "$src" | xxd -p -c 32)"

            case "$magic6" in
              303730373031|303730373032)
                cp "$src" "$cpio_file"
                ;;
              *)
                case "$magic4" in
                  1f8b08*) gzip -dc "$src" > "$cpio_file" ;;
                  02214c18|04224d18) lz4 -dc "$src" > "$cpio_file" ;;
                  28b52ffd) zstd -dc "$src" > "$cpio_file" ;;
                  fd377a58) xz -dc "$src" > "$cpio_file" ;;
                  *)
                    echo "::error::unsupported vendor ramdisk compression: $(file -b "$src")"
                    return 1
                    ;;
                esac
                ;;
            esac

            test -s "$cpio_file"
            (
              cd "$root"
              cpio -idm --quiet --no-absolute-filenames < "$cpio_file"
            )
          }

          while IFS= read -r fragment; do
            root="$RAMDISK_DIR/roots/$(basename "$fragment" .bin)"
            unpack_fragment "$fragment" "$root"
            printf 'vendor_boot:%s\t%s\n' "$(basename "$fragment" .bin)" "$root" >> "$ROOTS_TSV"
          done < <(find "$RAMDISK_DIR/fragments" -type f -name 'ramdisk-*.bin' | sort)

          python_lpunpack="$GITHUB_WORKSPACE/lpunpack-tool/lpunpack.py"
          python3 "$python_lpunpack" --info -f json "$ROM_DIR/super.img" \
            > "$OUTPUT_DIR/05-super-info.raw.txt"

          python3 - "$OUTPUT_DIR/05-super-info.raw.txt" "$OUTPUT_DIR/05-selected-partitions.txt" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          start = raw.find("{")
          end = raw.rfind("}")
          if start < 0 or end <= start:
              raise SystemExit("lpunpack JSON metadata missing")
          data = json.loads(raw[start:end+1])
          partitions = data.get("partitions")
          if not isinstance(partitions, list):
              raise SystemExit("lpunpack partitions list missing")

          names = []
          for item in partitions:
              if not isinstance(item, dict):
                  continue
              name = item.get("name")
              if isinstance(name, str) and re.fullmatch(
                  r"(?:vendor|vendor_dlkm|system|system_dlkm|system_ext|product|odm|mi_ext)(?:_[ab])?", name
              ):
                  names.append(name)

          names = sorted(set(names))
          if not any(name in {"vendor", "vendor_a", "vendor_b"} for name in names):
              raise SystemExit("vendor partition missing")
          if not any(name in {"system", "system_a", "system_b"} for name in names):
              raise SystemExit("system partition missing")

          Path(sys.argv[2]).write_text("\n".join(names) + "\n", encoding="utf-8")
          PY

          selected="$(paste -sd, "$OUTPUT_DIR/05-selected-partitions.txt")"
          python3 "$python_lpunpack" -p "$selected" "$ROM_DIR/super.img" "$LOGICAL_DIR"

          normalize_and_mount() {
            local img="$1"
            local label="$2"
            local normalized="$img"
            local fstype desc mnt="$MOUNT_DIR/$label"

            if [ ! -s "$img" ]; then
              printf '%s\tEMPTY_INACTIVE_SLOT\n' "$label" >> "$OUTPUT_DIR/05-partition-state.tsv"
              return 2
            fi

            desc="$(file -b "$img")"
            if grep -qi 'Android sparse image' <<<"$desc"; then
              normalized="$WORK_DIR/normalized-${label}.img"
              simg2img "$img" "$normalized"
            fi
            if [ ! -s "$normalized" ]; then
              printf '%s\tEMPTY_AFTER_UNSPARSE\n' "$label" >> "$OUTPUT_DIR/05-partition-state.tsv"
              return 2
            fi

            fstype="$(blkid -p -s TYPE -o value "$normalized" 2>/dev/null || true)"
            mkdir -p "$mnt"
            case "$fstype" in
              ext4) sudo mount -t ext4 -o loop,ro,noload "$normalized" "$mnt" ;;
              erofs) sudo mount -t erofs -o loop,ro "$normalized" "$mnt" ;;
              f2fs) sudo mount -t f2fs -o loop,ro "$normalized" "$mnt" ;;
              *)
                echo "::error::unsupported non-empty filesystem '$fstype': $img ($desc)"
                return 1
                ;;
            esac
            mountpoint -q "$mnt"
            printf 'partition:%s\t%s\n' "$label" "$mnt" >> "$ROOTS_TSV"
            printf '%s\tMOUNTED\t%s\n' "$label" "$fstype" >> "$OUTPUT_DIR/05-partition-state.tsv"
            return 0
          }

          : > "$OUTPUT_DIR/05-partition-state.tsv"
          mounted=0
          system_mounted=0
          vendor_mounted=0

          mapfile -t images < <(find "$LOGICAL_DIR" -maxdepth 1 -type f -name '*.img' -print | sort)
          test "${#images[@]}" -ge 1
          for img in "${images[@]}"; do
            base="$(basename "$img" .img)"
            set +e
            normalize_and_mount "$img" "$base"
            rc=$?
            set -e
            case "$rc" in
              0)
                mounted=$((mounted + 1))
                case "$base" in system|system_a|system_b) system_mounted=$((system_mounted + 1));; esac
                case "$base" in vendor|vendor_a|vendor_b) vendor_mounted=$((vendor_mounted + 1));; esac
                ;;
              2) ;;
              *) exit "$rc" ;;
            esac
          done

          test "$mounted" -ge 2
          test "$system_mounted" -ge 1
          test "$vendor_mounted" -ge 1
          test -s "$ROOTS_TSV"

          # Collector and CRC comparator execute while read-only mounts are alive.
          sudo -E python3 - \
            "$ROOTS_TSV" \
            "$P8_DIR/global/region-module-abi.json" \
            "$CANDIDATE_DIR/build-a/Module.symvers" \
            "$OUTPUT_DIR" <<'PY'
          import gzip
          import hashlib
          import json
          import lzma
          import os
          import posixpath
          import re
          import subprocess
          import sys
          import tempfile
          from collections import defaultdict
          from pathlib import Path

          roots_path = Path(sys.argv[1])
          parent_path = Path(sys.argv[2])
          candidate_symvers_path = Path(sys.argv[3])
          output = Path(sys.argv[4])

          parent = json.loads(parent_path.read_text(encoding="utf-8"))
          roots = []
          for line in roots_path.read_text(encoding="utf-8").splitlines():
              if not line:
                  continue
              label, root = line.split("\t", 1)
              path = Path(root)
              if not path.is_dir():
                  raise SystemExit(f"missing declared root: {label}: {root}")
              roots.append((label, path))

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def normalize_crc(value):
              return f"0x{int(value, 16):08x}"

          candidate_vmlinux = {}
          candidate_other = {}
          for number, raw in enumerate(
              candidate_symvers_path.read_text(encoding="utf-8", errors="strict").splitlines(), 1
          ):
              if not raw.strip():
                  continue
              fields = raw.split()
              if len(fields) < 3:
                  raise SystemExit(f"bad candidate Module.symvers line {number}: {raw!r}")
              crc, symbol, provider = fields[:3]
              crc = normalize_crc(crc)
              target = candidate_vmlinux if provider == "vmlinux" else candidate_other
              if symbol in target and target[symbol] != crc:
                  raise SystemExit(f"conflicting candidate CRC for {symbol}")
              target[symbol] = crc

          if "module_layout" not in candidate_vmlinux:
              raise SystemExit("candidate vmlinux module_layout CRC missing")

          module_re = re.compile(r"\.ko(?:\.(?:xz|gz|zst))?$")
          modules = []
          module_lookup = {}

          def run(args):
              return subprocess.run(
                  args,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )

          def decompress(path, temp_dir):
              name = path.name
              if name.endswith(".xz"):
                  dst = temp_dir / name[:-3]
                  dst.write_bytes(lzma.decompress(path.read_bytes()))
                  return dst
              if name.endswith(".gz"):
                  dst = temp_dir / name[:-3]
                  dst.write_bytes(gzip.decompress(path.read_bytes()))
                  return dst
              if name.endswith(".zst"):
                  dst = temp_dir / name[:-4]
                  proc = subprocess.run(
                      ["zstd", "-dc", str(path)],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=False,
                  )
                  if proc.returncode:
                      raise SystemExit(
                          f"zstd failed for {path}: {proc.stderr.decode('utf-8', 'replace')}"
                      )
                  dst.write_bytes(proc.stdout)
                  return dst
              return path

          def parse_modprobe_lines(mode, elf, allow_empty_exports=False):
              proc = run(["modprobe", mode, str(elf)])
              if proc.returncode:
                  stderr = proc.stderr.strip()
                  if (
                      allow_empty_exports
                      and mode == "--show-exports"
                      and "No data available" in stderr
                  ):
                      return {}
                  raise SystemExit(
                      f"modprobe {mode} failed for {elf}: {stderr}"
                  )

              result = {}
              for line in proc.stdout.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  fields = line.split()
                  if len(fields) != 2:
                      raise SystemExit(f"unexpected {mode} line for {elf}: {line!r}")
                  crc, symbol = fields
                  crc = normalize_crc(crc)
                  if symbol in result and result[symbol] != crc:
                      raise SystemExit(f"conflicting {mode} CRC for {symbol} in {elf}")
                  result[symbol] = crc
              return result

          with tempfile.TemporaryDirectory(prefix="p8v3-stock-modules-") as td:
              temp_dir = Path(td)
              for label, root in roots:
                  for dirpath, _, filenames in os.walk(root):
                      current = Path(dirpath)
                      for filename in filenames:
                          if not module_re.search(filename):
                              continue
                          path = current / filename
                          rel = path.relative_to(root).as_posix()
                          raw = path.read_bytes()
                          elf = decompress(path, temp_dir)
                          elf_bytes = elf.read_bytes()
                          if not elf_bytes.startswith(b"\x7fELF"):
                              raise SystemExit(f"not ELF after decompression: {label}:{rel}")

                          info = run(["modinfo", "-F", "vermagic", str(elf)])
                          if info.returncode:
                              raise SystemExit(f"modinfo vermagic failed: {label}:{rel}")
                          vermagic = info.stdout.strip()

                          imports = parse_modprobe_lines("--show-modversions", elf)
                          exports = parse_modprobe_lines(
                              "--show-exports",
                              elf,
                              allow_empty_exports=True,
                          )
                          if not imports:
                              raise SystemExit(f"module lacks modversion imports: {label}:{rel}")

                          item = {
                              "source": label,
                              "path": rel,
                              "filename": filename,
                              "file_sha256": sha(raw),
                              "elf_sha256": sha(elf_bytes),
                              "vermagic": vermagic,
                              "imports": imports,
                              "exports": exports,
                          }
                          key = (label, rel)
                          if key in module_lookup:
                              raise SystemExit(f"duplicate module path: {key}")
                          module_lookup[key] = item
                          modules.append(item)

          modules.sort(key=lambda x: (x["source"], x["path"]))

          # Continuity gate: every one of the 284 modules audited by P8-v2 must
          # reappear byte-identically in the same source/path. System modules are
          # intentionally additional because P8-v2 did not mount system.
          parent_modules = {
              (item["source"], item["path"]): item
              for item in parent["module_inventory"]["modules"]
          }
          if len(parent_modules) != 284:
              raise SystemExit(f"unexpected parent module map size: {len(parent_modules)}")

          missing_parent = []
          changed_parent = []
          for key, previous in parent_modules.items():
              current = module_lookup.get(key)
              if current is None:
                  missing_parent.append(f"{key[0]}:{key[1]}")
              elif current["file_sha256"] != previous["file_sha256"]:
                  changed_parent.append(f"{key[0]}:{key[1]}")

          if missing_parent:
              raise SystemExit(f"P8-v2 modules missing in P8-v3: {missing_parent[:10]}")
          if changed_parent:
              raise SystemExit(f"P8-v2 modules changed in P8-v3: {changed_parent[:10]}")

          # Resolve all P8-v2 modules.load entries. P8-v2 established that the
          # 286 entries resolve to 284 unique module paths.
          loaded_keys = set()
          for manifest in parent["load_contract"]["manifests"]:
              directory = posixpath.dirname(manifest["path"])
              for entry in manifest["entries"]:
                  rel = posixpath.normpath(posixpath.join(directory, entry))
                  key = (manifest["source"], rel)
                  if key not in module_lookup:
                      candidates = [
                          k for k in module_lookup
                          if k[0] == manifest["source"]
                          and posixpath.basename(k[1]) == posixpath.basename(entry)
                      ]
                      if len(candidates) != 1:
                          raise SystemExit(
                              f"cannot uniquely resolve modules.load entry "
                              f"{manifest['source']}:{manifest['path']}:{entry}"
                          )
                      key = candidates[0]
                  loaded_keys.add(key)

          if len(loaded_keys) != 284:
              raise SystemExit(f"unexpected unique P8-v2 modules.load set: {len(loaded_keys)}")

          # P8-v2 found one direct insmod command in all eight target regions.
          # R3 proved that no pronto_wlan.ko exists in the previously selected
          # vendor_boot/system/vendor/odm roots. R4 now proves the exact init
          # trigger from this stock ROM and scans all plausible super partitions
          # before deciding whether that command belongs to the normal-boot
          # module contract at all.

          direct_command = "insmod /system/lib/modules/pronto/pronto_wlan.ko con_mode=5"
          direct_android_path = "/system/lib/modules/pronto/pronto_wlan.ko"
          expected_ftmd_trigger = "on property:vendor.wifi.ftmd.load=true"

          vendor_roots = [
              (label, root) for label, root in roots
              if re.fullmatch(r"partition:vendor(?:_[ab])?", label)
          ]
          if len(vendor_roots) != 1:
              raise SystemExit(f"expected one active vendor root, got {vendor_roots}")

          vendor_label, vendor_root = vendor_roots[0]
          init_qcom = vendor_root / "etc/init/hw/init.qcom.rc"
          if not init_qcom.is_file():
              raise SystemExit(f"stock init.qcom.rc missing: {init_qcom}")

          rc_lines = init_qcom.read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()

          command_indexes = [
              index for index, line in enumerate(rc_lines)
              if line.strip() == direct_command
          ]
          if len(command_indexes) != 1:
              raise SystemExit(
                  f"expected exactly one direct insmod command in stock init.qcom.rc, "
                  f"got {command_indexes}"
              )

          command_index = command_indexes[0]
          trigger = None
          trigger_index = None
          for index in range(command_index - 1, -1, -1):
              stripped = rc_lines[index].strip()
              if not stripped or stripped.startswith("#"):
                  continue
              # Android init sections begin at column zero. Commands within a
              # section are indented. The nearest preceding top-level 'on '
              # clause owns this insmod command.
              if rc_lines[index] == rc_lines[index].lstrip():
                  if stripped.startswith("on "):
                      trigger = stripped
                      trigger_index = index
                  break

          context_start = max(0, (trigger_index if trigger_index is not None else command_index) - 3)
          context_end = min(len(rc_lines), command_index + 4)
          output.joinpath("05-direct-insmod-init-context.txt").write_text(
              "\n".join(
                  f"{index + 1:04d}: {rc_lines[index]}"
                  for index in range(context_start, context_end)
              ) + "\n",
              encoding="utf-8",
          )

          if trigger is None:
              raise SystemExit("could not resolve owning init trigger for direct insmod")

          # Scan every mounted runtime partition for the basename. Do not pretend
          # that presence in product/system_ext/mi_ext equals /system reachability;
          # record all physical candidates separately.
          partition_mountpoint = {
              "system": "/system",
              "system_ext": "/system_ext",
              "product": "/product",
              "vendor": "/vendor",
              "vendor_dlkm": "/vendor_dlkm",
              "system_dlkm": "/system_dlkm",
              "odm": "/odm",
              "mi_ext": "/mi_ext",
          }

          def partition_base(source):
              if not source.startswith("partition:"):
                  return None
              name = source.split(":", 1)[1]
              name = re.sub(r"_[ab]$", "", name)
              return name

          def android_physical_path(source, rel):
              base = partition_base(source)
              mountpoint = partition_mountpoint.get(base)
              if mountpoint is None:
                  return None
              clean = posixpath.normpath("/" + rel).lstrip("/")
              # system.img may expose its own contents directly or via an
              # additional top-level system/ directory.
              if base == "system":
                  if clean == "system":
                      return "/system"
                  if clean.startswith("system/"):
                      return "/" + clean
              return posixpath.normpath(mountpoint + "/" + clean)

          all_pronto_candidates = []
          for key, item in sorted(module_lookup.items()):
              source, rel = key
              if posixpath.basename(rel) != "pronto_wlan.ko":
                  continue
              all_pronto_candidates.append(
                  {
                      "source": source,
                      "internal_path": rel,
                      "android_physical_path": android_physical_path(source, rel),
                      "file_sha256": item["file_sha256"],
                      "elf_sha256": item["elf_sha256"],
                      "vermagic": item["vermagic"],
                      "import_count": len(item["imports"]),
                      "export_count": len(item["exports"]),
                  }
              )

          exact_direct_candidates = [
              (item["source"], item["internal_path"])
              for item in all_pronto_candidates
              if item["android_physical_path"] == direct_android_path
          ]

          direct_target_present_anywhere = bool(all_pronto_candidates)
          direct_target_exactly_resolved = len(exact_direct_candidates) == 1
          direct_target_ambiguous = len(exact_direct_candidates) > 1

          if direct_target_ambiguous:
              raise SystemExit(
                  f"ambiguous direct insmod target resolution: {exact_direct_candidates}"
              )

          ftmd_property_gated = trigger == expected_ftmd_trigger

          # If a pronto_wlan.ko exists somewhere but cannot be mapped exactly to
          # the requested Android /system path, stop instead of silently excluding
          # it. If none exists anywhere and the command is exactly FTMD-gated, the
          # command is not part of the normal boot module load contract.
          if direct_target_present_anywhere and not direct_target_exactly_resolved:
              raise SystemExit(
                  "pronto_wlan.ko exists in ROM but not at the declared Android path; "
                  f"candidates={all_pronto_candidates}"
              )

          if not direct_target_present_anywhere and not ftmd_property_gated:
              raise SystemExit(
                  "direct insmod target is absent but trigger is not the expected "
                  f"factory-test property: trigger={trigger!r}"
              )

          direct_included_in_normal_boot_contract = direct_target_exactly_resolved and not ftmd_property_gated

          pronto_key = None
          if direct_included_in_normal_boot_contract:
              pronto_key = exact_direct_candidates[0]
              loaded_keys.add(pronto_key)

          expected_loaded_count = 285 if direct_included_in_normal_boot_contract else 284
          if len(loaded_keys) != expected_loaded_count:
              raise SystemExit(
                  f"unexpected normal-boot declared-loaded set: "
                  f"expected={expected_loaded_count} actual={len(loaded_keys)}"
              )

          direct_assessment = {
              "command": direct_command,
              "command_line": command_index + 1,
              "trigger": trigger,
              "expected_ftmd_trigger": expected_ftmd_trigger,
              "factory_test_property_gated": ftmd_property_gated,
              "target_android_path": direct_android_path,
              "target_present_anywhere_in_scanned_runtime_roots": direct_target_present_anywhere,
              "target_exactly_resolved_at_declared_android_path": direct_target_exactly_resolved,
              "all_pronto_candidates": all_pronto_candidates,
              "included_in_normal_boot_module_contract": direct_included_in_normal_boot_contract,
              "normal_boot_loaded_module_count": len(loaded_keys),
          }
          output.joinpath("05-direct-insmod-assessment.json").write_text(
              json.dumps(direct_assessment, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          output.joinpath("05-direct-insmod-assessment.txt").write_text(
              "\n".join(
                  [
                      "P8V3_R4_DIRECT_INSMOD_ASSESSMENT=PASS",
                      f"DIRECT_INSMOD_COMMAND_LINE={command_index + 1}",
                      f"DIRECT_INSMOD_TRIGGER={trigger}",
                      f"DIRECT_INSMOD_FTMD_PROPERTY_GATED={'YES' if ftmd_property_gated else 'NO'}",
                      f"DIRECT_INSMOD_TARGET_PRESENT_ANYWHERE={'YES' if direct_target_present_anywhere else 'NO'}",
                      f"DIRECT_INSMOD_TARGET_EXACTLY_RESOLVED={'YES' if direct_target_exactly_resolved else 'NO'}",
                      f"DIRECT_INSMOD_INCLUDED_IN_NORMAL_BOOT_CONTRACT={'YES' if direct_included_in_normal_boot_contract else 'NO'}",
                      f"NORMAL_BOOT_DECLARED_LOADED_UNIQUE_MODULE_COUNT={len(loaded_keys)}",
                  ]
              ) + "\n",
              encoding="utf-8",
          )

          # Build stock-module export map for module-to-module dependencies.
          stock_exports = defaultdict(list)
          loaded_modules_with_exports = 0
          loaded_modules_without_exports = 0
          for key in sorted(loaded_keys):
              item = module_lookup[key]
              if item["exports"]:
                  loaded_modules_with_exports += 1
              else:
                  loaded_modules_without_exports += 1
              for symbol, crc in item["exports"].items():
                  stock_exports[symbol].append(
                      {
                          "crc": crc,
                          "provider": f"{key[0]}:{key[1]}",
                      }
                  )

          kernel_matches = 0
          kernel_mismatches = []
          module_chain_matches = 0
          module_chain_mismatches = []
          unresolved = []
          import_count = 0

          per_module = []
          for key in sorted(loaded_keys):
              item = module_lookup[key]
              kmatch = 0
              mmatch = 0
              problems = 0

              for symbol, expected_crc in sorted(item["imports"].items()):
                  import_count += 1

                  if symbol in candidate_vmlinux:
                      actual_crc = candidate_vmlinux[symbol]
                      if actual_crc == expected_crc:
                          kernel_matches += 1
                          kmatch += 1
                      else:
                          kernel_mismatches.append({
                              "module": f"{key[0]}:{key[1]}",
                              "symbol": symbol,
                              "stock_required_crc": expected_crc,
                              "candidate_vmlinux_crc": actual_crc,
                          })
                          problems += 1
                      continue

                  providers = stock_exports.get(symbol, [])
                  matching = [p for p in providers if p["crc"] == expected_crc]
                  if matching:
                      module_chain_matches += 1
                      mmatch += 1
                  elif providers:
                      module_chain_mismatches.append({
                          "module": f"{key[0]}:{key[1]}",
                          "symbol": symbol,
                          "stock_required_crc": expected_crc,
                          "stock_provider_crcs": sorted({p["crc"] for p in providers}),
                          "providers": sorted(p["provider"] for p in providers),
                      })
                      problems += 1
                  else:
                      unresolved.append({
                          "module": f"{key[0]}:{key[1]}",
                          "symbol": symbol,
                          "stock_required_crc": expected_crc,
                      })
                      problems += 1

              per_module.append({
                  "module": f"{key[0]}:{key[1]}",
                  "vermagic": item["vermagic"],
                  "import_count": len(item["imports"]),
                  "kernel_crc_match_count": kmatch,
                  "stock_module_chain_match_count": mmatch,
                  "problem_count": problems,
                  "is_direct_insmod_target": pronto_key is not None and key == pronto_key,
              })

          # Fail closed on any actual required-CRC problem.
          passed = (
              not kernel_mismatches
              and not module_chain_mismatches
              and not unresolved
              and import_count > 0
          )

          result = {
              "stage": "CLEAN_GEN1_P8_V3_R4_GLOBAL_NORMAL_BOOT_STOCK_SYMBOL_CRC_PROOF",
              "retry": "R4",
              "r3_run_id": "33713038957",
              "r3_failure": "DIRECT_INSMOD_TARGET_ABSENT_IN_SELECTED_ROOTS",
              "r2_run_id": "33712444862",
              "r2_failure": "SYSTEM_PRONTO_INTERNAL_PATH_MAPPING_TOO_NARROW",
              "r1_run_id": "33681198464",
              "r1_failure": "MODPROBE_SHOW_EXPORTS_NO_DATA_TREATED_AS_FATAL",
