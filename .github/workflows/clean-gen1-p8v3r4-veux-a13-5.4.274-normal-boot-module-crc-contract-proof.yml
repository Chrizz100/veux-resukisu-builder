          grep -Fxq 'P9_RELEASE_AUTHORIZED=NO' \
            "$OUTPUT_DIR/P8V3R4-GLOBAL-NORMAL-BOOT-STOCK-CRC.txt"

          cleanup_mounts
          trap - EXIT

      - name: Close P8-v3 proof package
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$OUTPUT_DIR"

          {
            echo "JOB_STATUS=${{ job.status }}"
            echo "P8V3_TARGET_REGION_COUNT=8"
            echo "P8V3_TARGET_REGION_IDS=$TARGET_REGION_IDS"
            echo "P8V3_EEA_INCLUDED=NO"
            echo "P8V3_P6_PARENT_RUN_ID=$P6V10_V2_RUN_ID"
            echo "P8V3_P8V2_PARENT_RUN_ID=$P8V2_R2_RUN_ID"
            echo "P8V3_KERNEL_SOURCE_DELTA=DEFCONFIG_MODULE_CONTRACT_ONLY"
            echo "P8V3_BOOT_IMAGE_CREATED=NO"
            echo "P8V3_FLASHABLE_ZIP_CREATED=NO"
            echo "P8V3_DEVICE_ACCESSED=NO"
            echo "P8V3_FLASHING_PERFORMED=NO"
            echo "P8V3_DEVICE_BOOT_SUCCESS_PROVEN=NO"
            echo "P8V3_P9_RELEASE_AUTHORIZED=NO"
            echo "P8V3_R4_KERNEL_REBUILD_PERFORMED=NO"
            echo "P8V3_R1_CANDIDATE_REUSED=YES"
            echo "P8V3_R1_FAILURE=$P8V3_R1_FAILURE"
            echo "P8V3_R2_RUN_ID=$P8V3_R2_RUN_ID"
            echo "P8V3_R2_FAILURE=$P8V3_R2_FAILURE"
            echo "P8V3_R3_RUN_ID=$P8V3_R3_RUN_ID"
            echo "P8V3_R3_FAILURE=$P8V3_R3_FAILURE"
          } > "$OUTPUT_DIR/99-job-end-state.txt"

          (
            cd "$OUTPUT_DIR" || exit 1
            find . -type f \
              ! -name 'FILES.txt' \
              ! -name 'SHA256SUMS' \
              ! -name 'SHA256SUMS.verify.txt' \
              -printf '%P\n' | sort > FILES.txt
            while IFS= read -r file; do sha256sum "$file"; done < FILES.txt > SHA256SUMS
            sha256sum -c SHA256SUMS > SHA256SUMS.verify.txt
          )
          exit 0

      - name: Upload P8-v3 r4 normal-boot CRC proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p8v3r4-veux-5.4.274-normal-boot-module-crc-proof-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 90
