name: Irena X 7371 COMPAT2 global JIT Init compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IRENA_REPO: silvzr/LSP-IrenaX
  IRENA_COMMIT: da439fbbed506dac6c66074af7fda8982aa4fc6a
  CURRENT_LSPLANT_SHA: c5b46bb4f6a99ffe0c77ce3ab006d3f67d5a2b1c
  CURRENT_DOBBY_SHA: dc7b4be06ad6c5dcfb0bb4ca2082b007d69eaed5
  OFFICIAL_RELEASE_URL: https://github.com/silvzr/LSP-IrenaX/releases/download/v2.0.1/LSPosed-v2.0.1-7371-IrenaX-release.zip
  OFFICIAL_RELEASE_SHA256: 99e7aaf54dda0e6fa746c55613483a80620174f255dd05e102713778a9966d2f
  R1_DEVICE_PACKAGE_SHA256: 7ed948db19d92b0dd7776c424f93783e10210082ea807345228e901ab9ce4af7
  FINAL_ZIP: LSPosed-v2.0.1-7371-IrenaX-COMPAT2-R1-base-Global-JIT-Init-compatibility.zip

jobs:
  build:
    name: Build COMPAT2 global JIT Init compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Freeze COMPAT2 compatibility contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compat2-output
          {
            echo "PARENT=R1-v2 immutable Framework checkpoint"
            echo "PARENT_DEVICE_PACKAGE_SHA256=$R1_DEVICE_PACKAGE_SHA256"
            echo "BASE=official Irena X 7371 source + exact R1-v2 mIncludeCode compatibility fix"
            echo "COMPAT2_BASE_DELTA=retain the already-device-validated COMPAT1 ClassLinker policy for SDK33 AArch64 when FixupStaticTrampolines is unavailable"
            echo "COMPAT2_FUNCTIONAL_DELTA=one additional cross-device variable only: skip current LSPlant Jit::Init(handler) globally while preserving JitCodeCache and every later InitNative stage"
            echo "COMPAT2_PURPOSE=test the new current-LSPlant JIT hook layer that is absent from the historical working LSPlant_mod, without adding device/package-specific bypasses"
            echo "CL2F_DEVICE_RESULT=PAIRIP_DEVICE_PASS; FIXUP_0; REGISTER_NATIVE_FALLBACK_GROUP_0; NO_SIGSEGV; INGRESS_ONCREATE_ONSTART_ONRESUME"
            echo "CL2P_DEVICE_RESULT=DEVICE_FAIL; FIXUP_0; REGISTERNATIVECLASSLINKER_1; PASSTHROUGH_NO_MAYGETBACKUP; SEGV_ACCERR_AT_LIBPAIRIPCORE_PLUS_0x65768"
            echo "COMPAT1_DEVICE_RESULT=DEVICE_VALID_FAIL; CLASSLINKER_COMPAT_BRANCH_PASS; INIT_NATIVE_FULL_SUCCESS; PAIRIP_PLUS_0x65768_STILL_FAIL"
            echo "COMPAT2_GLOBAL_EXPECTED_MARKER_1=LSPLANT-COMPAT2: JIT_INIT_SKIPPED=1"
            echo "COMPAT2_GLOBAL_EXPECTED_MARKER_2=LSPLANT-COMPAT2: INIT_NATIVE_FULL_SUCCESS"
            echo "COMPAT2_SDK33_AARCH64_CONDITIONAL_MARKER_1=LSPLANT-COMPAT2: FIXUP_GROUP_RESULT=0"
            echo "COMPAT2_SDK33_AARCH64_CONDITIONAL_MARKER_2=LSPLANT-COMPAT2: ANDROID13_ARM64_NO_FIXUP_COMPAT=1"
            echo "COMPAT2_SDK33_AARCH64_CONDITIONAL_MARKER_3=LSPLANT-COMPAT2: REGISTER_NATIVE_FALLBACK_GROUP_RESULT=0"
            echo "COMPAT2_SDK33_AARCH64_CONDITIONAL_MARKER_4=LSPLANT-COMPAT2: REGISTER_NATIVE_PROPAGATION_OPTIONAL_CONTINUE=1"
            echo "COMPAT2_SDK33_AARCH64_CONDITIONAL_MARKER_5=LSPLANT-COMPAT2: CLASSLINKER_INIT_CONTINUED_TO_SUCCESS"
            echo "CURRENT_LSPLANT=$CURRENT_LSPLANT_SHA"
            echo "CURRENT_DOBBY=$CURRENT_DOBBY_SHA"
            echo "MAPP_COMPONENT_FACTORY_FIX=ABSENT"
            echo "R9_CHANGES=NONE"
            echo "DEX2OAT_MOUNT_CHANGES=NONE"
            echo "PAIRIP_BYPASS=NONE"
            echo "STATIC_PASS_IS_NOT_DEVICE_PASS=YES"
          } | tee compat2-output/COMPAT2_COMPATIBILITY_CONTRACT.txt

      - name: Checkout pinned Irena X 7371
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IRENA_REPO }}
          ref: ${{ env.IRENA_COMMIT }}
          submodules: recursive
          fetch-depth: 0
          path: LSP-IrenaX
          persist-credentials: false

      - name: Verify exact pristine pins and COMPAT2 source preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C LSP-IrenaX rev-parse HEAD)" = "$IRENA_COMMIT"
          test -z "$(git -C LSP-IrenaX status --porcelain)"
          test "$(git -C LSP-IrenaX/external/lsplant rev-parse HEAD)" = "$CURRENT_LSPLANT_SHA"
          test "$(git -C LSP-IrenaX/external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
          test -z "$(git -C LSP-IrenaX/external/lsplant status --porcelain)"
          test -z "$(git -C LSP-IrenaX/external/dobby status --porcelain)"

          java_file="LSP-IrenaX/core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"
          native_file="LSP-IrenaX/external/lsplant/lsplant/src/main/jni/lsplant.cc"
          cl_file="LSP-IrenaX/external/lsplant/lsplant/src/main/jni/art/runtime/class_linker.cxx"
          test -f "$java_file"
          test -f "$native_file"
          test -f "$cl_file"
          grep -Fq 'boolean includeCode = XposedHelpers.getBooleanField(loadedApk, "mIncludeCode");' "$java_file"
          grep -Fq 'if (!Runtime::Init(handler)) {' "$native_file"
          grep -Fq 'if (!ClassLinker::Init(env, handler)) {' "$native_file"
          grep -Fq 'if (!ScopedSuspendAll::Init(handler)) {' "$native_file"
          grep -Fq 'if (!Jit::Init(handler)) {' "$native_file"
          grep -Fq 'auto register_native_hooked = sdk_int >= kSdkOreo && sdk_int < kSdkPie' "$cl_file"
          grep -Fq 'handler(RegisterNativeClassLinker_, RegisterNative_,' "$cl_file"
          grep -Fq '!handler(UnregisterNativeClassLinker_, UnregisterNative_,' "$cl_file"
          if grep -Fq 'LSPLANT-COMPAT2:' "$native_file" "$cl_file"; then
            echo "COMPAT2 marker already exists in pristine source"
            exit 1
          fi

          {
            echo "IRENA=$(git -C LSP-IrenaX rev-parse HEAD)"
            echo "LSPLANT=$(git -C LSP-IrenaX/external/lsplant rev-parse HEAD)"
            echo "DOBBY=$(git -C LSP-IrenaX/external/dobby rev-parse HEAD)"
            echo "R1_M_INCLUDE_CODE_PRECONDITION=PRESENT"
            echo "COMPAT2_ORIGINAL_REGISTER_NATIVE_GROUP_THEN_UNREGISTER_NATIVE_PRECONDITION=PRESENT"
          } | tee compat2-output/COMPAT2_SOURCE_PINS_AND_PRECONDITIONS.txt

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: irena-x-compat2-${{ runner.os }}
          restore-keys: |
            irena-x-${{ runner.os }}
          save: false

      - name: Setup Ninja 1.12.1
        uses: seanmiddleditch/gha-setup-ninja@master
        with:
          version: 1.12.1

      - name: Remove Android bundled CMake
        shell: bash
        run: rm -rf "$ANDROID_HOME/cmake"

      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.caching=true'
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC'
            echo 'android.native.buildOutput=verbose'
          } >> ~/.gradle/gradle.properties

      - name: Download and verify official Irena 7371 release
        id: official
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o OFFICIAL_RELEASE.zip "$OFFICIAL_RELEASE_URL"
          echo "$OFFICIAL_RELEASE_SHA256  OFFICIAL_RELEASE.zip" | sha256sum -c -
          unzip -t OFFICIAL_RELEASE.zip
          rm -rf officialcmp
          mkdir officialcmp
          unzip -q OFFICIAL_RELEASE.zip -d officialcmp
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('OFFICIAL_RELEASE.zip') as z:
              names = z.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit('duplicate names in official release')
              files = [n for n in names if not n.endswith('/')]
              if len(files) != 56:
                  raise SystemExit(f'official release file count is {len(files)}, expected 56')
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'official CRC failure: {bad}')
          PY
          sha256sum OFFICIAL_RELEASE.zip > compat2-output/COMPAT2_OFFICIAL_RELEASE_SHA256.txt

      - name: Apply exact R1-v2 mIncludeCode compatibility fix
        id: r1patch
        if: steps.official.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java')
          s = p.read_text()
          line = '            boolean includeCode = XposedHelpers.getBooleanField(loadedApk, "mIncludeCode");\n'
          branch = (
              '            } else if (!includeCode) {\n'
              '                Hookers.logD("LoadedApk#<init> has no code, skip: " + mAppDir);\n'
              '                return;\n'
          )
          if s.count(line) != 1:
              raise SystemExit(f'expected one mIncludeCode read, got {s.count(line)}')
          if s.count(branch) != 1:
              raise SystemExit(f'expected one no-code branch, got {s.count(branch)}')
          s = s.replace(line, '', 1).replace(branch, '', 1)
          expected = (
              '            if (packageName.equals("android")) {\n'
              '                if (XposedInit.startsSystemServer) {\n'
              '                    Hookers.logD("LoadedApk#<init> is android, skip: " + mAppDir);\n'
              '                    return;\n'
              '                } else {\n'
              '                    packageName = "system";\n'
              '                }\n'
              '            }\n'
              '\n'
              '            if (!XposedInit.loadedPackagesInProcess.add(packageName)) {\n'
          )
          if expected not in s:
              raise SystemExit('R1-v2 post-patch control flow mismatch')
          if 'mIncludeCode' in s:
              raise SystemExit('mIncludeCode survived R1-v2 patch')
          p.write_text(s)
          PY
          git diff --check

      - name: Apply COMPAT2 Global JIT Init compatibility
        id: compat2patch
        if: steps.r1patch.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Base compatibility delta retained from COMPAT1: only ClassLinker::Init policy on
          # Android 13 / ARM64 when FixupStaticTrampolines is unavailable.
          # COMPAT2 adds exactly one new cross-device variable later in InitNative: skip Jit::Init.
          p = Path('external/lsplant/lsplant/src/main/jni/art/runtime/class_linker.cxx')
          s = p.read_text()

          init_anchor = (
              '        if (sdk_int >= kSdkNougat && sdk_int < kSdkTiramisu) {\n'
              '            handler(ShouldUseInterpreterEntrypoint_);\n'
              '        }\n'
              '\n'
              '        if constexpr (is_arch_v<Arch::kX86>) {\n'
          )
          if s.count(init_anchor) != 1:
              raise SystemExit(f'expected one ClassLinker Init pre-fixup boundary, got {s.count(init_anchor)}')
          init_repl = (
              '        if (sdk_int >= kSdkNougat && sdk_int < kSdkTiramisu) {\n'
              '            handler(ShouldUseInterpreterEntrypoint_);\n'
              '        }\n'
              '\n'
              '        bool compat2_fixup_group_hooked = false;\n'
              '        if constexpr (is_arch_v<Arch::kX86>) {\n'
          )
          s = s.replace(init_anchor, init_repl, 1)

          old_fixup = (
              '        } else {\n'
              '            handler(FixupStaticTrampolinesWithThread_, FixupStaticTrampolines_,\n'
              '                    FixupStaticTrampolinesRaw_);\n'
              '        }\n'
              '\n'
              '        auto register_native_hooked = sdk_int >= kSdkOreo && sdk_int < kSdkPie\n'
          )
          new_fixup = (
              '        } else {\n'
              '            compat2_fixup_group_hooked =\n'
              '                    handler(FixupStaticTrampolinesWithThread_, FixupStaticTrampolines_,\n'
              '                            FixupStaticTrampolinesRaw_);\n'
              '            LOGE("LSPLANT-COMPAT2: FIXUP_GROUP_RESULT=%d",\n'
              '                 compat2_fixup_group_hooked ? 1 : 0);\n'
              '        }\n'
              '\n'
              '        auto register_native_hooked = sdk_int >= kSdkOreo && sdk_int < kSdkPie\n'
          )
          if s.count(old_fixup) != 1:
              raise SystemExit(f'expected one non-x86 Fixup boundary, got {s.count(old_fixup)}')
          s = s.replace(old_fixup, new_fixup, 1)

          old_register = (
              '        auto register_native_hooked = sdk_int >= kSdkOreo && sdk_int < kSdkPie\n'
              '                                          ? handler(RegisterNativeFastWithReturn_)\n'
              '                                          : handler(RegisterNativeClassLinker_, RegisterNative_,\n'
              '                                                    RegisterNativeFast_, RegisterNativeThread_);\n'
              '        if (!register_native_hooked ||\n'
              '            !handler(UnregisterNativeClassLinker_, UnregisterNative_,\n'
              '                     UnregisterNativeThread_)) {\n'
              '            return false;\n'
              '        }\n'
          )
          new_register = (
              '        const bool compat2_android13_arm64_no_fixup =\n'
              '                sdk_int == kSdkTiramisu && is_arch_v<Arch::kAArch64> &&\n'
              '                !compat2_fixup_group_hooked;\n'
              '        if (compat2_android13_arm64_no_fixup) {\n'
              '            LOGE("LSPLANT-COMPAT2: ANDROID13_ARM64_NO_FIXUP_COMPAT=1");\n'
              '            auto compat2_register_native_fallback_hooked =\n'
              '                    handler(RegisterNative_, RegisterNativeFast_, RegisterNativeThread_);\n'
              '            LOGE("LSPLANT-COMPAT2: REGISTER_NATIVE_FALLBACK_GROUP_RESULT=%d",\n'
              '                 compat2_register_native_fallback_hooked ? 1 : 0);\n'
              '            LOGE("LSPLANT-COMPAT2: REGISTER_NATIVE_FALLBACK_SELECTED plain=%d fast=%d thread=%d",\n'
              '                 RegisterNative_ ? 1 : 0, RegisterNativeFast_ ? 1 : 0,\n'
              '                 RegisterNativeThread_ ? 1 : 0);\n'
              '            if (compat2_register_native_fallback_hooked) {\n'
              '                auto compat2_unregister_native_fallback_hooked =\n'
              '                        handler(UnregisterNative_, UnregisterNativeThread_);\n'
              '                LOGE("LSPLANT-COMPAT2: UNREGISTER_NATIVE_FALLBACK_GROUP_RESULT=%d",\n'
              '                     compat2_unregister_native_fallback_hooked ? 1 : 0);\n'
              '                if (!compat2_unregister_native_fallback_hooked) {\n'
              '                    return false;\n'
              '                }\n'
              '            } else {\n'
              '                LOGE("LSPLANT-COMPAT2: REGISTER_NATIVE_PROPAGATION_OPTIONAL_CONTINUE=1");\n'
              '            }\n'
              '        } else {\n'
              '            auto register_native_hooked = sdk_int >= kSdkOreo && sdk_int < kSdkPie\n'
              '                                              ? handler(RegisterNativeFastWithReturn_)\n'
              '                                              : handler(RegisterNativeClassLinker_, RegisterNative_,\n'
              '                                                        RegisterNativeFast_, RegisterNativeThread_);\n'
              '            if (!register_native_hooked ||\n'
              '                !handler(UnregisterNativeClassLinker_, UnregisterNative_,\n'
              '                         UnregisterNativeThread_)) {\n'
              '                return false;\n'
              '            }\n'
              '        }\n'
          )
          if s.count(old_register) != 1:
              raise SystemExit(f'expected one upstream RegisterNative block, got {s.count(old_register)}')
          s = s.replace(old_register, new_register, 1)

          # Add a marker at the normal successful end of ClassLinker::Init.
          end_anchor = (
              '            LOGD("art_quick_to_interpreter_bridge = %p", &art_quick_to_interpreter_bridge_);\n'
              '        }\n'
              '        return true;\n'
              '    }\n'
          )
          end_repl = (
              '            LOGD("art_quick_to_interpreter_bridge = %p", &art_quick_to_interpreter_bridge_);\n'
              '        }\n'
              '        LOGE("LSPLANT-COMPAT2: CLASSLINKER_INIT_CONTINUED_TO_SUCCESS");\n'
              '        return true;\n'
              '    }\n'
          )
          if s.count(end_anchor) != 1:
              raise SystemExit(f'expected one ClassLinker success boundary, got {s.count(end_anchor)}')
          s = s.replace(end_anchor, end_repl, 1)

          # Fail-closed source assertions.
          required = [
              'LSPLANT-COMPAT2: FIXUP_GROUP_RESULT=%d',
              'LSPLANT-COMPAT2: ANDROID13_ARM64_NO_FIXUP_COMPAT=1',
              'LSPLANT-COMPAT2: REGISTER_NATIVE_FALLBACK_GROUP_RESULT=%d',
              'LSPLANT-COMPAT2: REGISTER_NATIVE_PROPAGATION_OPTIONAL_CONTINUE=1',
              'LSPLANT-COMPAT2: CLASSLINKER_INIT_CONTINUED_TO_SUCCESS',
          ]
          for marker in required:
              if s.count(marker) != 1:
                  raise SystemExit(f'COMPAT2 marker count mismatch: {marker}')
          compat_start = s.index('if (compat2_android13_arm64_no_fixup) {')
          compat_end = s.index('        } else {\n            auto register_native_hooked =', compat_start)
          compat_block = s[compat_start:compat_end]
          if 'handler(RegisterNativeClassLinker_' in compat_block:
              raise SystemExit('RegisterNativeClassLinker must be absent from COMPAT2 compatibility branch')
          if 'handler(RegisterNative_, RegisterNativeFast_, RegisterNativeThread_)' not in compat_block:
              raise SystemExit('safe CL2F fallback group missing from COMPAT2 branch')
          p.write_text(s)

          # COMPAT2 single additional functional variable: skip the current Jit::Init hook layer
          # for every built ABI/SDK. JitCodeCache and all later InitNative stages remain unchanged.
          p = Path('external/lsplant/lsplant/src/main/jni/lsplant.cc')
          s = p.read_text()
          old_jit = (
              '    if (!Jit::Init(handler)) {\n'
              '        LOGE("Failed to init jit");\n'
              '        return false;\n'
              '    }\n'
          )
          new_jit = '    LOGE("LSPLANT-COMPAT2: JIT_INIT_SKIPPED=1");\n'
          if s.count(old_jit) != 1:
              raise SystemExit(f'expected one current Jit::Init block, got {s.count(old_jit)}')
          s = s.replace(old_jit, new_jit, 1)
          if 'Jit::Init(handler)' in s:
              raise SystemExit('Jit::Init(handler) survived COMPAT2 patch')
          if s.count('LSPLANT-COMPAT2: JIT_INIT_SKIPPED=1') != 1:
              raise SystemExit('COMPAT2 JIT skip marker mismatch')

          # Observer-only marker: prove the complete InitNative chain reached its normal success return.
          old = (
              '    if (IsJavaDebuggable(env)) {\n'
              '        // Make the runtime non-debuggable as a workaround\n'
              '        // when ShouldUseInterpreterEntrypoint inlined\n'
              '        Runtime::Current()->SetJavaDebuggable(Runtime::RuntimeDebugState::kNonJavaDebuggable);\n'
              '    }\n'
              '    return true;\n'
          )
          new = (
              '    if (IsJavaDebuggable(env)) {\n'
              '        // Make the runtime non-debuggable as a workaround\n'
              '        // when ShouldUseInterpreterEntrypoint inlined\n'
              '        Runtime::Current()->SetJavaDebuggable(Runtime::RuntimeDebugState::kNonJavaDebuggable);\n'
              '    }\n'
              '    LOGE("LSPLANT-COMPAT2: INIT_NATIVE_FULL_SUCCESS");\n'
              '    return true;\n'
          )
          if s.count(old) != 1:
              raise SystemExit(f'expected one InitNative success boundary, got {s.count(old)}')
          s = s.replace(old, new, 1)
          if s.count('LSPLANT-COMPAT2: INIT_NATIVE_FULL_SUCCESS') != 1:
              raise SystemExit('InitNative full-success marker mismatch')
          p.write_text(s)
          PY

          git -C external/lsplant diff --check
          mapfile -t ls_changed < <(git -C external/lsplant diff --name-only | sort)
          printf '%s\n' "${ls_changed[@]}" | tee ../compat2-output/COMPAT2_LSPLANT_DIFF_NAMES.txt
          test "${#ls_changed[@]}" -eq 2
          test "${ls_changed[0]}" = "lsplant/src/main/jni/art/runtime/class_linker.cxx"
          test "${ls_changed[1]}" = "lsplant/src/main/jni/lsplant.cc"

          mapfile -t top_changed < <(git diff --name-only | sort)
          printf '%s\n' "${top_changed[@]}" | tee ../compat2-output/COMPAT2_SOURCE_DIFF_NAMES.txt
          test "${#top_changed[@]}" -eq 2
          test "${top_changed[0]}" = "core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"
          test "${top_changed[1]}" = "external/lsplant"

          # Freeze all unrelated paths.
          git diff --exit-code "$IRENA_COMMIT" -- \
            core/src/main/java/org/lsposed/lspd/core/Startup.java \
            core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java \
            core/src/main/java/org/lsposed/lspd/hooker/AttachHooker.java \
            core/src/main/java/org/lsposed/lspd/impl/LSPosedBridge.java \
            core/src/main/java/org/lsposed/lspd/impl/LSPosedHelper.java \
            core/src/main/jni/src/jni/hook_bridge.cpp \
            core/src/main/jni/src/native_api.cpp \
            daemon/src/main/java/org/lsposed/lspd/service/Dex2OatService.java \
            magisk-loader/src/main/jni/api/zygisk_main.cpp \
            magisk-loader/src/main/jni/src/magisk_loader.cpp \
            magisk-loader/src/main/jni/src/atexit.cpp

          test "$(git -C external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
          test -z "$(git -C external/dobby status --porcelain)"

          git diff > ../compat2-output/COMPAT2_TOPLEVEL_SOURCE.patch
          git -C external/lsplant diff > ../compat2-output/COMPAT2_LSPLANT_SOURCE.patch
          {
            echo "SOURCE_DELTA_TOPLEVEL=LoadedApkCtorHooker.java + external/lsplant submodule"
            echo "SOURCE_DELTA_LSPLANT=class_linker.cxx retained COMPAT1 compatibility policy + lsplant.cc global Jit::Init skip plus observer-only success marker"
            echo "R1_V2_M_INCLUDE_CODE_FIX=PRESERVED"
            echo "COMPAT2_ANDROID13_ARM64_NO_FIXUP_POLICY=ACTIVE_ONLY_WHEN_SDK_33_ARM64_AND_FIXUP_GROUP_FALSE"
            echo "COMPAT2_REGISTER_NATIVE_CLASSLINKER=SKIPPED_IN_COMPAT_BRANCH"
            echo "COMPAT2_REGISTER_NATIVE_FALLBACKS=CL2F_SAFE_PLAIN_FAST_THREAD_ORDER"
            echo "COMPAT2_REGISTER_NATIVE_PROPAGATION=OPTIONAL_IF_NO_FALLBACK_EXISTS"
            echo "COMPAT2_UNREGISTER_NATIVE_FALLBACK=REQUIRED_ONLY_IF_REGISTER_FALLBACK_INSTALLED"
            echo "COMPAT2_LATER_CLASSLINKER_GROUPS=CONTINUE_NORMAL_CURRENT_UPSTREAM"
            echo "COMPAT2_SCOPED_SUSPEND_ALL_AND_LATER_INIT=CONTINUE_NORMAL_CURRENT_UPSTREAM"
            echo "COMPAT2_JIT_INIT=SKIPPED_GLOBALLY_SINGLE_ADDITIONAL_VARIABLE"
            echo "COMPAT2_JIT_CODE_CACHE=UNCHANGED_AND_STILL_REQUIRED"
            echo "COMPAT2_POST_JIT_STAGES=DEXFILE_INSTRUMENTATION_JNIID_UNCHANGED"
            echo "MAPP_COMPONENT_FACTORY_FIX=ABSENT"
            echo "R9=ABSENT"
            echo "DEX2OAT=UNCHANGED_OFFICIAL_7371"
            echo "PAIRIP_BYPASS=ABSENT"
          } | tee ../compat2-output/COMPAT2_PROVENANCE.txt

      - name: Build COMPAT2 global JIT Init compatibility candidate
        id: compat2build
        if: steps.compat2patch.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ./gradlew clean zipAll --stacktrace --info 2>&1 | tee ../compat2-build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > ../COMPAT2_BUILD_EXIT_CODE.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Extract COMPAT2 build and verify marker payload
        id: built
        if: steps.compat2build.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rel < <(find LSP-IrenaX/magisk-loader/release -maxdepth 1 -type f \
            -name 'LSPosed-v*-IrenaX-release.zip' -print | sort)
          test "${#rel[@]}" -eq 1
          cp "${rel[0]}" COMPAT2_BUILD_RELEASE.zip
          unzip -t COMPAT2_BUILD_RELEASE.zip
          rm -rf compat2buildcmp
          mkdir compat2buildcmp
          unzip -q COMPAT2_BUILD_RELEASE.zip -d compat2buildcmp

          test -f compat2buildcmp/framework/lspd.dex
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f "compat2buildcmp/lib/$abi/liblspd.so"
            readelf -h "compat2buildcmp/lib/$abi/liblspd.so" >/dev/null
            strings "compat2buildcmp/lib/$abi/liblspd.so" | grep -Fq 'LSPLANT-COMPAT2: CLASSLINKER_INIT_CONTINUED_TO_SUCCESS'
            strings "compat2buildcmp/lib/$abi/liblspd.so" | grep -Fq 'LSPLANT-COMPAT2: JIT_INIT_SKIPPED=1'
            strings "compat2buildcmp/lib/$abi/liblspd.so" | grep -Fq 'LSPLANT-COMPAT2: INIT_NATIVE_FULL_SUCCESS'
          done
          # Functional compatibility branch is ARM64-only; do not require its dead-code strings in other ABIs.
          strings compat2buildcmp/lib/arm64-v8a/liblspd.so | grep -Fq 'LSPLANT-COMPAT2: FIXUP_GROUP_RESULT=%d'
          strings compat2buildcmp/lib/arm64-v8a/liblspd.so | grep -Fq 'LSPLANT-COMPAT2: ANDROID13_ARM64_NO_FIXUP_COMPAT=1'
          strings compat2buildcmp/lib/arm64-v8a/liblspd.so | grep -Fq 'LSPLANT-COMPAT2: REGISTER_NATIVE_FALLBACK_GROUP_RESULT=%d'
          strings compat2buildcmp/lib/arm64-v8a/liblspd.so | grep -Fq 'LSPLANT-COMPAT2: REGISTER_NATIVE_PROPAGATION_OPTIONAL_CONTINUE=1'

          sha256sum compat2buildcmp/framework/lspd.dex > compat2-output/COMPAT2_REBUILT_FRAMEWORK_DEX_SHA256.txt
          sha256sum compat2buildcmp/lib/*/liblspd.so > compat2-output/COMPAT2_REBUILT_LIBLSPD_SHA256.txt

      - name: Create official-base COMPAT2 install package
        id: package
        if: steps.built.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          official = Path('OFFICIAL_RELEASE.zip')
          built = Path('compat2buildcmp')
          out = Path('${{ env.FINAL_ZIP }}')
          abis = ('arm64-v8a','armeabi-v7a','x86','x86_64')
          payload = {'framework/lspd.dex'} | {f'lib/{abi}/liblspd.so' for abi in abis}
          sidecars = {x + '.sha256' for x in payload}
          replacements = {}
          for name in payload:
              data = (built / name).read_bytes()
              replacements[name] = data
              replacements[name + '.sha256'] = hashlib.sha256(data).hexdigest().encode()

          with zipfile.ZipFile(official, 'r') as zin, zipfile.ZipFile(out, 'w') as zout:
              infos = zin.infolist()
              names = [i.filename for i in infos]
              if len(names) != len(set(names)):
                  raise SystemExit('duplicate names in official ZIP')
              if not (payload | sidecars).issubset(set(names)):
                  raise SystemExit('official ZIP misses one or more COMPAT2 replacement targets')
              for info in infos:
                  zout.writestr(info, replacements.get(info.filename, zin.read(info.filename)))

          def tree(path):
              with zipfile.ZipFile(path) as z:
                  names = z.namelist()
                  if len(names) != len(set(names)):
                      raise SystemExit(f'duplicate names: {path}')
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f'CRC failure {path}: {bad}')
                  return {n: hashlib.sha256(z.read(n)).hexdigest() for n in names if not n.endswith('/')}

          a, b = tree(official), tree(out)
          if set(a) != set(b):
              raise SystemExit('official/COMPAT2 file sets differ')
          if len(a) != 56:
              raise SystemExit(f'expected 56 files, got {len(a)}')
          diff = sorted(k for k in a if a[k] != b[k])
          expected = sorted(payload | sidecars)
          if diff != expected:
              raise SystemExit(f'unexpected official->COMPAT2 package delta: {diff}')

          # Keep manager/daemon/scripts exact official 7371; only target-process native libs + R1 dex change.
          for rel in ('manager.apk','daemon.apk'):
              if a[rel] != b[rel]:
                  raise SystemExit(f'official control payload changed: {rel}')

          with zipfile.ZipFile(out) as z:
              names = set(z.namelist())
              checked = 0
              for n in sorted(names):
                  if not n.endswith('.sha256'):
                      continue
                  p = n[:-7]
                  if p not in names:
                      continue
                  expected_hash = z.read(n).decode().strip().split()[0]
                  actual_hash = hashlib.sha256(z.read(p)).hexdigest()
                  if expected_hash != actual_hash:
                      raise SystemExit(f'sidecar mismatch: {n}')
                  checked += 1
              if checked != 28:
                  raise SystemExit(f'expected 28 verified sidecars, got {checked}')

          sha = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('compat2-output/COMPAT2_FINAL_PACKAGE_SHA256.txt').write_text(f'{sha}  {out.name}\n')
          Path('compat2-output/COMPAT2_FINAL_PACKAGE_DIFF.txt').write_text('\n'.join(expected) + '\n')
          Path('compat2-output/COMPAT2_FINAL_SCOPE.txt').write_text(
              'BASE=official Irena X 7371 release\n'
              'PARENT_SEMANTICS=R1-v2 mIncludeCode fix preserved in framework/lspd.dex\n'
              'COMPAT2_NATIVE_BEHAVIOR=retains the COMPAT1 SDK33 AArch64 no-Fixup ClassLinker compatibility branch; additionally skips Jit::Init(handler) globally for all built ABIs/SDKs while keeping JitCodeCache and all later InitNative stages unchanged\n'
              'FINAL_PACKAGE_DELTA=framework/lspd.dex+sidecar + 4 liblspd.so+sidecars\n'
              'MANAGER=official 7371 byte-identical\n'
              'DAEMON=official 7371 byte-identical\n'
              'DEX2OAT=official 7371 unchanged\n'
              'DOBBY=official/current 7371 unchanged\n'
              'R9_CHANGES=none\n'
              'PAIRIP_BYPASS=none\n'
              'DEVICE_RUNTIME_STATUS=not tested\n'
          )
          PY
          unzip -t "$FINAL_ZIP"
          cp "$FINAL_ZIP" "compat2-output/INSTALL_THIS_${FINAL_ZIP}"

      - name: Write COMPAT2 device test plan
        if: steps.package.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cat > compat2-output/COMPAT2_DEVICE_TEST_PLAN.txt <<'EOF'
          COMPAT2 GLOBAL JIT INIT COMPATIBILITY CANDIDATE

          PURPOSE
          - CL2F proved PairIP survives when RegisterNativeClassLinker_ is skipped and no fallback exists.
          - CL2P proved even a pass-through RegisterNativeClassLinker_ inline hook is sufficient to restore PairIP +0x65768.
          - COMPAT2 retains the COMPAT1 ClassLinker compatibility branch and adds one new variable only: Jit::Init is skipped globally.
          - JitCodeCache, DexFile, Instrumentation, JniIdManager and the full InitNative completion path remain active.
          - The retained ClassLinker guard is conditional on Android 13 / ARM64 / Fixup=0; the new Jit::Init skip applies globally to every built ABI/SDK.
          - RegisterNativeClassLinker_ is never attempted in that condition.
          - Plain/Fast/Thread RegisterNative fallbacks remain optional; the controlled SDK33/AArch64 test measured all three as unavailable.
          - All later current LSPlant initialization stages continue normally.
          - mAppComponentFactory remains untouched to preserve one functional repair variable.

          REQUIRED GLOBAL RUNTIME MARKERS IN THE SAME TARGET-APP PID
          LSPLANT-COMPAT2: JIT_INIT_SKIPPED=1
          LSPLANT-COMPAT2: INIT_NATIVE_FULL_SUCCESS

          ADDITIONAL MARKERS ONLY WHEN SDK33 + AARCH64 + FIXUP=0 TRIGGERS THE RETAINED CLASSLINKER GUARD
          LSPLANT-COMPAT2: FIXUP_GROUP_RESULT=0
          LSPLANT-COMPAT2: ANDROID13_ARM64_NO_FIXUP_COMPAT=1
          LSPLANT-COMPAT2: REGISTER_NATIVE_FALLBACK_GROUP_RESULT=0
          LSPLANT-COMPAT2: REGISTER_NATIVE_PROPAGATION_OPTIONAL_CONTINUE=1
          LSPLANT-COMPAT2: CLASSLINKER_INIT_CONTINUED_TO_SUCCESS

          DEVICE ORDER -- ONE TEST ONLY
          1. Install only the inner INSTALL_THIS_*.zip and reboot.
          2. Confirm LSPosed/Irena manager opens.
          3. Clear logcat, force-stop Ingress, cold-start once and use the app normally for at least several seconds.
          4. Capture broad log:
             su -c 'logcat -b all -d -v threadtime > /sdcard/Download/Log.txt'

          PASS TARGET
          - both global COMPAT2 markers in the same target-app PID;
          - on SDK33/AArch64/Fixup=0, the five additional ClassLinker compatibility markers also appear in that PID;
          - no "Failed to init lsplant";
          - no SIGSEGV / libpairipcore +0x65768;
          - Ingress reaches Activity onCreate/onStart/onResume and remains alive;
          - scoped modules visibly initialize/function enough to prove framework injection still works.

          FAILURE INTERPRETATION
          - PairIP crash returns before INIT_NATIVE_FULL_SUCCESS: later current LSPlant init stage is incompatible; stop this current-line repair strategy.
          - INIT_NATIVE_FULL_SUCCESS appears but modules do not function: native RegisterNative propagation is required for framework semantics on this setup; do not call release-ready.
          - Full markers + Ingress stable + modules work: first real compatibility DEVICE PASS candidate.

          STATIC PASS != DEVICE PASS.
          COMPAT2 is a compatibility candidate. One successful device test validates only that device/configuration; broader release status requires broader device coverage.
          EOF

      - name: Collect COMPAT2 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compat2-output/native
          cp COMPAT2_BUILD_EXIT_CODE.txt compat2-output/ 2>/dev/null || true
          cp compat2-build.log compat2-output/ 2>/dev/null || true
          cp COMPAT2_BUILD_RELEASE.zip compat2-output/ 2>/dev/null || true
          cp OFFICIAL_RELEASE.zip compat2-output/OFFICIAL_7371_RELEASE_REFERENCE.zip 2>/dev/null || true

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          out = Path('compat2-output')
          manifest = out / 'COMPAT2_EVIDENCE_SHA256SUMS.txt'
          files = sorted(p for p in out.rglob('*') if p.is_file() and p != manifest)
          with manifest.open('w') as f:
              for p in files:
                  f.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out).as_posix()}\n")
          PY
          (cd compat2-output && sha256sum -c COMPAT2_EVIDENCE_SHA256SUMS.txt)

      - name: Final COMPAT2 fail-closed static gate
        id: finalgate
        shell: bash
        run: |
          set -euo pipefail
          test -f COMPAT2_BUILD_EXIT_CODE.txt
          test "$(cat COMPAT2_BUILD_EXIT_CODE.txt)" = "0"
          grep -q '^R1_V2_M_INCLUDE_CODE_FIX=PRESERVED$' compat2-output/COMPAT2_PROVENANCE.txt
          grep -q '^COMPAT2_ANDROID13_ARM64_NO_FIXUP_POLICY=ACTIVE_ONLY_WHEN_SDK_33_ARM64_AND_FIXUP_GROUP_FALSE$' compat2-output/COMPAT2_PROVENANCE.txt
          grep -q '^COMPAT2_REGISTER_NATIVE_CLASSLINKER=SKIPPED_IN_COMPAT_BRANCH$' compat2-output/COMPAT2_PROVENANCE.txt
          grep -q '^COMPAT2_REGISTER_NATIVE_FALLBACKS=CL2F_SAFE_PLAIN_FAST_THREAD_ORDER$' compat2-output/COMPAT2_PROVENANCE.txt
          grep -q '^COMPAT2_REGISTER_NATIVE_PROPAGATION=OPTIONAL_IF_NO_FALLBACK_EXISTS$' compat2-output/COMPAT2_PROVENANCE.txt
          grep -q '^COMPAT2_LATER_CLASSLINKER_GROUPS=CONTINUE_NORMAL_CURRENT_UPSTREAM$' compat2-output/COMPAT2_PROVENANCE.txt
          grep -q '^COMPAT2_SCOPED_SUSPEND_ALL_AND_LATER_INIT=CONTINUE_NORMAL_CURRENT_UPSTREAM$' compat2-output/COMPAT2_PROVENANCE.txt
          grep -q '^COMPAT2_JIT_INIT=SKIPPED_GLOBALLY_SINGLE_ADDITIONAL_VARIABLE$' compat2-output/COMPAT2_PROVENANCE.txt
          grep -q '^COMPAT2_JIT_CODE_CACHE=UNCHANGED_AND_STILL_REQUIRED$' compat2-output/COMPAT2_PROVENANCE.txt
          grep -q '^COMPAT2_POST_JIT_STAGES=DEXFILE_INSTRUMENTATION_JNIID_UNCHANGED$' compat2-output/COMPAT2_PROVENANCE.txt
          grep -q '^MAPP_COMPONENT_FACTORY_FIX=ABSENT$' compat2-output/COMPAT2_PROVENANCE.txt
          grep -q '^R9=ABSENT$' compat2-output/COMPAT2_PROVENANCE.txt
          grep -q '^DEX2OAT=UNCHANGED_OFFICIAL_7371$' compat2-output/COMPAT2_PROVENANCE.txt
          grep -q '^PAIRIP_BYPASS=ABSENT$' compat2-output/COMPAT2_PROVENANCE.txt
          test -f "compat2-output/INSTALL_THIS_${FINAL_ZIP}"
          strings compat2buildcmp/lib/arm64-v8a/liblspd.so | grep -Fq 'LSPLANT-COMPAT2: FIXUP_GROUP_RESULT=%d'
          strings compat2buildcmp/lib/arm64-v8a/liblspd.so | grep -Fq 'LSPLANT-COMPAT2: ANDROID13_ARM64_NO_FIXUP_COMPAT=1'
          strings compat2buildcmp/lib/arm64-v8a/liblspd.so | grep -Fq 'LSPLANT-COMPAT2: REGISTER_NATIVE_FALLBACK_GROUP_RESULT=%d'
          strings compat2buildcmp/lib/arm64-v8a/liblspd.so | grep -Fq 'LSPLANT-COMPAT2: REGISTER_NATIVE_PROPAGATION_OPTIONAL_CONTINUE=1'
          strings compat2buildcmp/lib/arm64-v8a/liblspd.so | grep -Fq 'LSPLANT-COMPAT2: CLASSLINKER_INIT_CONTINUED_TO_SUCCESS'
          strings compat2buildcmp/lib/arm64-v8a/liblspd.so | grep -Fq 'LSPLANT-COMPAT2: JIT_INIT_SKIPPED=1'
          strings compat2buildcmp/lib/arm64-v8a/liblspd.so | grep -Fq 'LSPLANT-COMPAT2: INIT_NATIVE_FULL_SUCCESS'
          (cd compat2-output && sha256sum -c COMPAT2_EVIDENCE_SHA256SUMS.txt)
          {
            echo "RESULT=COMPAT2_STATIC_FULL_PASS_GLOBAL_JIT_INIT_COMPATIBILITY_CREATED"
            echo "PARENT=R1-v2 immutable Framework checkpoint"
            echo "FUNCTIONAL_DELTA=retain validated SDK33 AArch64 no-Fixup ClassLinker compatibility policy + one new global variable: Jit::Init skipped; JitCodeCache and later InitNative stages unchanged"
            echo "OBSERVER_DELTA=one InitNative full-success log marker only"
            echo "FINAL_PAYLOAD=official 7371 + R1 dex + rebuilt COMPAT2 liblspd.so for 4 ABIs; COMPAT1 ClassLinker guard retained; Jit::Init skipped globally"
            echo "MANAGER_DAEMON=official 7371 byte-identical"
            echo "DEVICE_RUNTIME_STATUS=NOT_TESTED_BY_WORKFLOW"
            echo "STATIC_PASS_IS_NOT_DEVICE_PASS=YES"
          } | tee compat2-output/COMPAT2_STATIC_PASS_MARKER.txt

      - name: Upload COMPAT2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irena-x-v2.0.1-7371-compat2-global-jit-init-${{ github.run_id }}
          path: compat2-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
