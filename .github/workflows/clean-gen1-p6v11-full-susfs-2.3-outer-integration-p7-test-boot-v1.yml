    - name: Preserve P6 failure evidence
      if: always()
      shell: bash
      run: |2

        set +e
        mkdir -p "$ARTIFACT_DIR"
        {
          echo "JOB_STATUS=${{ job.status }}"
          if [ -d "$GITHUB_WORKSPACE/kernel/.git" ]; then
            echo "OUTER_HEAD=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD 2>/dev/null || true)"
            echo "OUTER_TREE=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD^{tree} 2>/dev/null || true)"
            echo "OUTER_STATUS_BEGIN"
            git -C "$GITHUB_WORKSPACE/kernel" status --porcelain 2>/dev/null || true
            echo "OUTER_STATUS_END"
          fi
          if [ -d "$GITHUB_WORKSPACE/kernel/KernelSU/.git" ]; then
            echo "RESUKISU_HEAD=$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD 2>/dev/null || true)"
            echo "RESUKISU_TREE=$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD^{tree} 2>/dev/null || true)"
            echo "RESUKISU_STATUS_BEGIN"
            git -C "$GITHUB_WORKSPACE/kernel/KernelSU" status --porcelain 2>/dev/null || true
            echo "RESUKISU_STATUS_END"
          fi
          if [ -n "${OUT_DIR:-}" ] && [ -d "$OUT_DIR" ]; then
            echo "IMAGE_EXISTS=$(test -s "$OUT_DIR/arch/arm64/boot/Image" && echo YES || echo NO)"
            echo "VEUX_DTB_EXISTS=$(test -s "$OUT_DIR/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb" && echo YES || echo NO)"
            echo "VMLINUX_EXISTS=$(test -s "$OUT_DIR/vmlinux" && echo YES || echo NO)"
          fi
        } > "$ARTIFACT_DIR/99-job-end-state.txt"

        (
          set -euo pipefail
          cd "$ARTIFACT_DIR" || exit 1
          find . -type f \
            ! -name 'ARTIFACT-SHA256SUMS' \
            ! -name '99-artifact-sha256-closure.txt' \
            -printf '%P\n' \
            | sort > 99-artifact-file-list.txt
          find . -type f \
            ! -name 'ARTIFACT-SHA256SUMS' \
            ! -name '99-artifact-sha256-closure.txt' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum > ARTIFACT-SHA256SUMS
          sha256sum -c ARTIFACT-SHA256SUMS \
            > 99-artifact-sha256-closure.txt
          echo 'P6V10_ARTIFACT_SHA256_CLOSURE=PASS' \
            >> 99-artifact-sha256-closure.txt
          echo 'P6V10_SHA256_SELF_REFERENTIAL_FILES_EXCLUDED=ARTIFACT-SHA256SUMS,99-artifact-sha256-closure.txt' \
            >> 99-artifact-sha256-closure.txt
        )
        exit 0
