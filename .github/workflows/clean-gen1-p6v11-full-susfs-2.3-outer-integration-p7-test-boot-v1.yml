        if old in s: s=s.replace(old,new,1)
        # show_map_vma early hide before KSTAT/OpenRedirect pointer work
        a,b=fn_span(s,'show_map_vma(struct seq_file *m, struct vm_area_struct *vma)')
        fn=s[a:b]
        if 'P6-v11 SUS_MAP maps' not in fn:
            anchor='\t\tstruct inode *inode = file_inode(vma->vm_file);\n'
            block=(anchor+"#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                   "\t\t/* P6-v11 SUS_MAP maps: suppress the complete file-backed VMA row. */\n"
                   "\t\tif (SUSFS_IS_INODE_SUS_MAP(inode))\n"
                   "\t\t\treturn;\n"
                   "#endif\n")
            fn=once(fn,anchor,block,'show_map_vma inode')
        s=s[:a]+fn+s[b:]
        # show_smap_vma
        a,b=fn_span(s,'static void show_smap_vma(struct seq_file *m, void *v)')
        fn=s[a:b]
        if 'SUSFS_IS_INODE_SUS_MAP' not in fn:
            anchor='\tmemset(&mss, 0, sizeof(mss));\n'
            block=("#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                   "\tif (vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n"
                   "\t\treturn;\n"
                   "#endif\n\n"+anchor)
            fn=once(fn,anchor,block,'show_smap_vma')
        s=s[:a]+fn+s[b:]
        # rollup
        a,b=fn_span(s,'static int show_smaps_rollup(struct seq_file *m, void *v)')
        fn=s[a:b]
        if 'P6-v11 SUS_MAP smaps_rollup' not in fn:
            anchor='\tfor (vma = priv->mm->mmap; vma; vma = vma->vm_next) {\n\t\tsmap_gather_stats(vma, &mss);\n'
            block=("\tfor (vma = priv->mm->mmap; vma; vma = vma->vm_next) {\n"
                   "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                   "\t\t/* P6-v11 SUS_MAP smaps_rollup: keep range accounting, skip stats. */\n"
                   "\t\tif (vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))) {\n"
                   "\t\t\tlast_vma_end = vma->vm_end;\n"
                   "\t\t\tcontinue;\n"
                   "\t\t}\n"
                   "#endif\n"
                   "\t\tsmap_gather_stats(vma, &mss);\n")
            fn=once(fn,anchor,block,'smaps_rollup loop')
        s=s[:a]+fn+s[b:]
        # pagemap
        a,b=fn_span(s,'static ssize_t pagemap_read(struct file *file, char __user *buf,')
        fn=s[a:b]
        if 'P6-v11 SUS_MAP pagemap' not in fn:
            fn=once(fn,'\tint ret = 0, copied = 0;\n',
                    '\tint ret = 0, copied = 0;\n#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n\tstruct vm_area_struct *susfs_vma;\n#endif\n',
                    'pagemap local')
            anchor='\t\tret = walk_page_range(mm, start_vaddr, end, &pagemap_ops, &pm);\n'
            block=("#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                   "\t\t/* P6-v11 SUS_MAP pagemap: do not expose pages of hidden file VMAs. */\n"
                   "\t\tsusfs_vma = find_vma(mm, start_vaddr);\n"
                   "\t\tif (susfs_vma && susfs_vma->vm_file &&\n"
                   "\t\t    SUSFS_IS_INODE_SUS_MAP(file_inode(susfs_vma->vm_file))) {\n"
                   "\t\t\tup_read(&mm->mmap_sem);\n"
                   "\t\t\tstart_vaddr = end;\n"
                   "\t\t\tcontinue;\n"
                   "\t\t}\n"
                   "#endif\n"+anchor)
            fn=once(fn,anchor,block,'pagemap walk')
        s=s[:a]+fn+s[b:]; write(p,s)

        # ---- SUS_MAP process_vm/read/write access surface ----
        p='mm/memory.c'; s=read(p)
        if '#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n#include <linux/susfs_def.h>' not in s:
            anchor='#include <asm/tlbflush.h>\n'
            block=(anchor+"#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n#include <linux/susfs_def.h>\n#endif\n")
            s=once(s,anchor,block,'memory include')
        anchor='\t\tret = get_user_pages_remote(tsk, mm, addr, 1,\n'
        if 'SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))' not in s:
            block=("#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                   "\t\tif (vma && vma->vm_file &&\n"
                   "\t\t    SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n"
                   "\t\t\tbreak;\n"
                   "#endif\n\n"+anchor)
            s=once(s,anchor,block,'memory get_user_pages')
        write(p,s)
        PY_P6V11_OUTER

        # Full source gate before committing the P6-v11 checkpoint.
        git add \
          fs/namei.c fs/readdir.c fs/namespace.c fs/proc_namespace.c \
          fs/notify/fdinfo.c fs/proc/fd.c fs/statfs.c fs/stat.c \
          fs/proc/base.c fs/proc/task_mmu.c fs/proc/cmdline.c \
          kernel/sys.c kernel/kallsyms.c mm/memory.c security/selinux/avc.c

        git diff --cached --check

        # All currently enabled SUSFS suboptions must have at least one real outer caller.
        grep -Fq 'susfs_spoof_uname(&tmp);' kernel/sys.c
        grep -Fq 'susfs_spoof_cmdline_or_bootconfig(m);' fs/proc/cmdline.c

        grep -Fq 'susfs_is_inode_sus_path' fs/namei.c
        grep -Fq 'susfs_should_hide_readdir_entry' fs/readdir.c
        grep -Fq 'P5-v17: hide a cached/revalidated positive SUS_PATH final component.' fs/namei.c

        grep -Fq 'DEFAULT_KSU_MNT_ID' fs/namespace.c
        grep -Fq 'susfs_is_current_proc_umounted_for_zygote_next()' fs/namespace.c
        grep -Fq 'show_vfsmnt' fs/proc_namespace.c
        grep -Fq 'show_mountinfo' fs/proc_namespace.c
        grep -Fq 'show_vfsstat' fs/proc_namespace.c
        grep -Fq 'susfs_get_non_sus_mnt_id_from_mnt' fs/proc/fd.c
        grep -Fq 'susfs_get_non_sus_vfsmnt_from_vfsmnt' fs/statfs.c

        grep -Fq 'susfs_sus_kstat_spoof_generic_fillattr(inode, stat);' fs/stat.c
        grep -Fq 'susfs_sus_kstat_spoof_show_map_vma(inode, &dev, &ino);' fs/proc/task_mmu.c

        grep -Fq 'SUSFS_IS_INODE_SUS_MAP' fs/proc/base.c
        grep -Fq 'P6-v11 SUS_MAP maps' fs/proc/task_mmu.c
        grep -Fq 'P6-v11 SUS_MAP smaps_rollup' fs/proc/task_mmu.c
        grep -Fq 'P6-v11 SUS_MAP pagemap' fs/proc/task_mmu.c
        grep -Fq 'SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))' mm/memory.c

        grep -Fq 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS' kernel/kallsyms.c
        grep -Fq 'susfs_is_avc_log_spoofing_enabled' security/selinux/avc.c

        # Preserve the already-proven OPEN_REDIRECT/SRCU and safe P4 struct-filename bridge.
        grep -Fq 'susfs_srcu_open_redirect' fs/proc/task_mmu.c
        grep -Fq 'susfs_open_redirect_spoof_do_sys_openat' fs/namei.c
        grep -Fq 'ksu_handle_faccessat(&dfd, &ksu_filename, &mode, NULL)' fs/open.c
        grep -Fq 'ksu_handle_stat(&dfd, &ksu_filename, &flags)' fs/stat.c
        ! grep -Rsn 'module_load_filter' KernelSU/kernel >/dev/null

        # Reject known old lifetime/error-handling regressions in newly integrated surfaces.
        ! grep -n 'if (!dpath)' fs/notify/fdinfo.c
        ! grep -n 'dput(dentry).*dentry->d_inode' fs/namei.c

        GIT_AUTHOR_NAME="CLEAN-GEN1 Builder" \
        GIT_AUTHOR_EMAIL="clean-gen1@invalid.local" \
        GIT_AUTHOR_DATE="2026-09-06T09:50:35Z" \
        GIT_COMMITTER_NAME="CLEAN-GEN1 Builder" \
        GIT_COMMITTER_EMAIL="clean-gen1@invalid.local" \
        GIT_COMMITTER_DATE="2026-09-06T09:50:35Z" \
          git commit -m "CLEAN GEN1 P6-v11 complete SUSFS 2.3 outer integration"

        P6_SOURCE_COMMIT="$(git rev-parse HEAD)"
        P6_SOURCE_TREE="$(git rev-parse HEAD^{tree})"
        test -n "$P6_SOURCE_COMMIT"
        test -n "$P6_SOURCE_TREE"
        test -z "$(git status --porcelain)"

        echo "P6_SOURCE_COMMIT=$P6_SOURCE_COMMIT" >> "$GITHUB_ENV"
        echo "P6_SOURCE_TREE=$P6_SOURCE_TREE" >> "$GITHUB_ENV"
        echo "P6V11_SOURCE_COMMIT=$P6_SOURCE_COMMIT" >> "$GITHUB_ENV"
        echo "P6V11_SOURCE_TREE=$P6_SOURCE_TREE" >> "$GITHUB_ENV"

        git diff --binary "$P6V10_SOURCE_COMMIT" "$P6_SOURCE_COMMIT" \
