    - name: Audit v7 split-brain failure and native SUSFS architecture
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        test "$(make -s kernelversion)" = "5.4.274"
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P5I_TREE"
        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_RESUKISU_TREE"

        python3 - <<'PY' > "$ARTIFACT_DIR/05-hook-choice-audit.txt"
        from pathlib import Path

        kconfig = Path("KernelSU/kernel/Kconfig").read_text(encoding="utf-8")
        kbuild = Path("KernelSU/kernel/Kbuild").read_text(encoding="utf-8")
        core = Path("KernelSU/kernel/core/init.c").read_text(encoding="utf-8")
        runtime = Path("KernelSU/kernel/runtime/ksud_integration.c").read_text(encoding="utf-8")
        inline = Path("KernelSU/kernel/tools/inline_hook_check.mk").read_text(encoding="utf-8")

        choice = kconfig.find("choice")
        choice_end = kconfig.find("endchoice", choice)
        if choice < 0 or choice_end < 0:
            raise SystemExit("ReSukiSU hook-method choice missing")
        choice_body = kconfig[choice:choice_end]

        for sym in ("config KSU_TRACEPOINT_HOOK", "config KSU_MANUAL_HOOK", "config KSU_SUSFS"):
            if sym not in choice_body:
                raise SystemExit("hook-method choice missing " + sym)

        manual_kbuild = kbuild.find("else ifdef CONFIG_KSU_MANUAL_HOOK")
        susfs_kbuild = kbuild.find("else ifdef CONFIG_KSU_SUSFS")
        if not (0 <= manual_kbuild < susfs_kbuild):
            raise SystemExit("expected ReSukiSU Kbuild Manual->SUSFS precedence not found")

        manual_core = core.find("#elif defined(CONFIG_KSU_MANUAL_HOOK)")
        susfs_core = core.find("#elif defined(CONFIG_KSU_SUSFS)")
        susfs_init = core.find("susfs_init();", susfs_core)
        if not (0 <= manual_core < susfs_core < susfs_init):
            raise SystemExit("expected core init Manual->SUSFS/susfs_init ordering not found")

        susfs_key = runtime.find("DEFINE_STATIC_KEY_TRUE(ksu_is_init_rc_hook_enabled)")
        manual_key = runtime.find("DEFINE_STATIC_KEY_TRUE(ksu_init_rc_hook)")
        if susfs_key < 0 or manual_key < 0:
            raise SystemExit("expected SUSFS/manual init-rc static-key variants missing")

        required_hooks = {
            "kernel/sys.c": "ksu_handle_setresuid",
            "fs/exec.c": "ksu_handle_execveat",
            "fs/open.c": "ksu_handle_faccessat",
            "fs/read_write.c": "ksu_handle_sys_read",
            "fs/stat.c": "ksu_handle_stat",
            "kernel/reboot.c": "ksu_handle_sys_reboot",
            "drivers/input/input.c": "ksu_handle_input_handle_event",
        }
        for path, hook in required_hooks.items():
            if hook not in inline:
                raise SystemExit(f"inline hook checker missing {hook} / {path}")

        print("P6_V7_SPLIT_BRAIN_MODEL=CONFIRMED")
        print("P6_V7_KBUILD_SELECTED_MANUAL=YES")
        print("P6_V7_CPP_FORCED_SUSFS=YES")
        print("P6_V7_SUSFS_INIT_WOULD_BE_SKIPPED=YES")
        print("P6_NATIVE_KCONFIG_SUSFS_REQUIRED=YES")
        print("P6_NATIVE_KCONFIG_MANUAL_HOOK_REQUIRED=NO")
        print("P6_REQUIRES_SEVEN_INLINE_HOOK_SITES=YES")
        print("P6_NATIVE_SUSFS_ARCHITECTURE=PASS")
        PY

        grep -Fq 'P6_NATIVE_SUSFS_ARCHITECTURE=PASS' "$ARTIFACT_DIR/05-hook-choice-audit.txt"
        grep -Fq 'CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := 35102' KernelSU/kernel/Kbuild
        test ! -e KernelSU/kernel/feature/module_load_filter.c
    - name: Integrate P6-v9 contract plus P6-v10 verified stock identity
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        test -s "$P6_REQUIRED_EXPORT_FILE"
        grep -Fq 'struct selinux_state {' security/selinux/include/security.h

        for f in \
          arch/arm64/configs/veux_defconfig \
          drivers/input/input.c \
          fs/exec.c \
          fs/open.c \
          fs/read_write.c \
          fs/stat.c \
          include/linux/ksu_hook_contract.h \
          include/linux/susfs_def.h \
          kernel/reboot.c \
          kernel/sys.c \
          localversion \
          scripts/setlocalversion \
          security/selinux/selinuxfs.c
        do
          cp "$f" "$ARTIFACT_DIR/05a-before-$(echo "$f" | tr '/' '_')"
        done

        python3 - <<'PY'
        from pathlib import Path

        def replace_once(path, old, new, label):
            p = Path(path)
            s = p.read_text(encoding="utf-8")
            count = s.count(old)
            if count != 1:
                raise SystemExit(f"{label}: expected one anchor in {path}, got {count}")
            s = s.replace(old, new, 1)
            p.write_text(s, encoding="utf-8")

        # ------------------------------------------------------------------
        # P6-v10: restore the kernel identity observed in the exact VEUX stock
        # boot reference.  The stock bytes prove all values used here:
        #   Linux release: 5.4.274-qgki-g82179e362f33
        #   .config:       CONFIG_LOCALVERSION="-qgki"
        #                  CONFIG_LOCALVERSION_AUTO=y
        # The fork-only localversion file (~positron) and its slash-style short
        # Git suffix are not part of the Xiaomi stock identity path.
        #
        # Actual CLEAN source commit/tree and clang pin remain recorded in the
        # provenance artifacts; the real compiler string remains generated by
        # the pinned clang-r416183b toolchain and is never replaced.
        # ------------------------------------------------------------------
        base_cfg_identity = Path(
            "arch/arm64/configs/veux_defconfig"
        ).read_text(encoding="utf-8")
        if base_cfg_identity.count('CONFIG_LOCALVERSION="-lineageos"') != 1:
            raise SystemExit("P6-v10-v2 real defconfig LOCALVERSION anchor mismatch")
        if "CONFIG_LOCALVERSION_AUTO" in base_cfg_identity:
            raise SystemExit(
                "P6-v10-v2 expected generated-only LOCALVERSION_AUTO but found source line"
            )

        replace_once(
            "arch/arm64/configs/veux_defconfig",
            'CONFIG_LOCALVERSION="-lineageos"\n',
            'CONFIG_LOCALVERSION="-qgki"\n',
            "verified VEUX stock CONFIG_LOCALVERSION",
        )
        replace_once(
            "localversion",
            "~positron\n",
            "",
            "remove fork-only positron localversion",
        )
        replace_once(
            "scripts/setlocalversion",
            '''# localversion* files in the build and source directory
        res="$(collect_files localversion*)"
        if test ! "$srctree" -ef .; then
        \tres="$res$(collect_files "$srctree"/localversion*)"
        fi

        # scm version string
        res="$res$(scm_version)"
        ''',
            '''# Stock-compatible local version contract.  CONFIG_LOCALVERSION
        # supplies the verified -qgki component.  A workflow-pinned suffix may
        # reproduce the exact device stock identity; otherwise retain the
        # source tree's normal SCM fallback.
        res="${CONFIG_LOCALVERSION}"
        if test -n "${KBUILD_FIXED_SCM_SUFFIX:-}"; then
        \tres="$res$KBUILD_FIXED_SCM_SUFFIX"
        else
        \tres="$res$(scm_version)"
        fi
        ''',
            "verified VEUX stock setlocalversion contract",
        )

        # ------------------------------------------------------------------
        # Required ReSukiSU 5.4 static exports.
        # ------------------------------------------------------------------
        replace_once(
            "security/selinux/selinuxfs.c",
            "static ssize_t (*const write_op[])(struct file *, char *, size_t) = {",
            "ssize_t (*const write_op[])(struct file *, char *, size_t) = {",
            "write_op export",
        )
        replace_once(
            "security/selinux/selinuxfs.c",
            "static const struct file_operations sel_handle_status_ops = {",
            "const struct file_operations sel_handle_status_ops = {",
            "sel_handle_status_ops export",
        )

        # ------------------------------------------------------------------
        # SUSFS header self-containment for current_uid().
        # ------------------------------------------------------------------
        replace_once(
            "include/linux/susfs_def.h",
            "#include <linux/bits.h>\n#include <linux/string.h>\n",
            "#include <linux/bits.h>\n#include <linux/cred.h>\n#include <linux/string.h>\n",
            "susfs_def cred include",
        )

        # ------------------------------------------------------------------
        # Authoritative hook contract:
        # - shared source-hook macro supports Manual and native SUSFS source hooks;
        # - manual-only fstat-return macro preserves the optional Manual behavior;
        # - add the three native-inline hook prototypes previously absent.
        # Target kernel files no longer contain CONFIG_KSU_MANUAL_HOOK text, so
        # ReSukiSU's inline checker sees native SUSFS call sites without warnings.
        # ------------------------------------------------------------------
        replace_once(
            "include/linux/ksu_hook_contract.h",
            """#ifdef CONFIG_KSU

        int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
        """,
            """#ifdef CONFIG_KSU

        #if defined(CONFIG_KSU_MANUAL_HOOK) || defined(CONFIG_KSU_SUSFS)
        #define KSU_SOURCE_INLINE_HOOK 1
        #endif

        #ifdef CONFIG_KSU_MANUAL_HOOK
        #define KSU_MANUAL_RET_HOOK 1
        #endif

        int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);
        int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr,
                                size_t *count_ptr);
        int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code,
                                          int *value);

        int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
        """,
            "authoritative inline hook contract",
        )

        # ------------------------------------------------------------------
        # exec: common source inline hook. Native SUSFS gets the same call while
        # still allowing Manual mode if a future non-SUSFS config intentionally uses it.
        # ------------------------------------------------------------------
        replace_once(
            "fs/exec.c",
            """#ifdef CONFIG_KSU_MANUAL_HOOK
        	ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
        #endif
        """,
            """#ifdef KSU_SOURCE_INLINE_HOOK
        	ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
        #endif
        """,
            "exec inline hook guard",
        )

        # faccessat: keep the proven struct-filename SUSFS bridge; only normalize
        # the non-SUSFS/manual fallback guard.
        replace_once(
            "fs/open.c",
            "#elif defined(CONFIG_KSU_MANUAL_HOOK)\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n",
            "#elif defined(KSU_SOURCE_INLINE_HOOK)\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n",
            "faccessat fallback guard",
        )

        # stat: same proven struct-filename bridge. fstat-return hooks are Manual-only
        # implementation details and remain Manual-only via the shared macro.
        replace_once(
            "fs/stat.c",
            "#elif defined(CONFIG_KSU_MANUAL_HOOK)\n\tksu_handle_stat(&dfd, &filename, &flags);\n",
            "#elif defined(KSU_SOURCE_INLINE_HOOK)\n\tksu_handle_stat(&dfd, &filename, &flags);\n",
            "stat fallback guard",
        )
        stat = Path("fs/stat.c")
        ss = stat.read_text(encoding="utf-8")
        if ss.count("#ifdef CONFIG_KSU_MANUAL_HOOK") != 2:
            raise SystemExit(
                "stat manual fstat-return guard count mismatch: "
                f"{ss.count('#ifdef CONFIG_KSU_MANUAL_HOOK')}"
            )
        ss = ss.replace("#ifdef CONFIG_KSU_MANUAL_HOOK", "#ifdef KSU_MANUAL_RET_HOOK")
        stat.write_text(ss, encoding="utf-8")

        # reboot: required source inline hook in native SUSFS.
        replace_once(
            "kernel/reboot.c",
            """#ifdef CONFIG_KSU_MANUAL_HOOK
        	ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
        #endif
        """,
            """#ifdef KSU_SOURCE_INLINE_HOOK
        	ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
        #endif
        """,
            "reboot inline hook guard",
        )

        # setresuid: required native SUSFS source hook.
        replace_once(
            "kernel/sys.c",
            "#include <linux/syscalls.h>\n#include <linux/kprobes.h>\n",
            "#include <linux/syscalls.h>\n#include <linux/ksu_hook_contract.h>\n#include <linux/kprobes.h>\n",
            "kernel sys contract include",
        )
        replace_once(
            "kernel/sys.c",
            """	kuid_t kruid, keuid, ksuid;

        	kruid = make_kuid(ns, ruid);
        """,
            """	kuid_t kruid, keuid, ksuid;

        #ifdef KSU_SOURCE_INLINE_HOOK
        	ksu_handle_setresuid(ruid, euid, suid);
        #endif

        	kruid = make_kuid(ns, ruid);
        """,
            "setresuid inline hook",
        )

        # read: required init-rc source hook. In native SUSFS, ReSukiSU's own
        # ksu_handle_sys_read() uses ksu_is_init_rc_hook_enabled.
        replace_once(
            "fs/read_write.c",
            "#include <linux/syscalls.h>\n#include <linux/pagemap.h>\n",
            "#include <linux/syscalls.h>\n#include <linux/ksu_hook_contract.h>\n#include <linux/pagemap.h>\n",
            "read_write contract include",
        )
        replace_once(
            "fs/read_write.c",
            """SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
        {
        	return ksys_read(fd, buf, count);
        }
        """,
            """SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
        {
        #ifdef KSU_SOURCE_INLINE_HOOK
        	ksu_handle_sys_read(fd, &buf, &count);
        #endif
        	return ksys_read(fd, buf, count);
        }
        """,
            "sys_read inline hook",
        )

        # input: required native SUSFS input hook; handler owns the static-key check.
        replace_once(
            "drivers/input/input.c",
            "#include <linux/rcupdate.h>\n#include \"input-compat.h\"\n",
            "#include <linux/rcupdate.h>\n#include <linux/ksu_hook_contract.h>\n#include \"input-compat.h\"\n",
            "input contract include",
        )
        replace_once(
            "drivers/input/input.c",
            """{
        	unsigned long flags;

        	if (is_event_supported(type, dev->evbit, EV_MAX)) {
        """,
            """{
        	unsigned long flags;

        #ifdef KSU_SOURCE_INLINE_HOOK
        	ksu_handle_input_handle_event(&type, &code, &value);
        #endif

        	if (is_event_supported(type, dev->evbit, EV_MAX)) {
        """,
            "input inline hook",
        )

        # ------------------------------------------------------------------
        # Real VEUX defconfig: select one and only one native ReSukiSU hook mode.
        # All SUSFS feature toggles become genuine Kconfig symbols.
        # ------------------------------------------------------------------
        replace_once(
            "arch/arm64/configs/veux_defconfig",
            """CONFIG_KSU=y
        # CONFIG_KSU_TRACEPOINT_HOOK is not set
        CONFIG_KSU_MANUAL_HOOK=y
        # CONFIG_KSU_SUSFS is not set
        CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y
        CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y
        CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y
        CONFIG_KSU_MULTI_MANAGER_SUPPORT=y
        """,
            """CONFIG_KSU=y
        # CONFIG_KSU_TRACEPOINT_HOOK is not set
        # CONFIG_KSU_MANUAL_HOOK is not set
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_MULTI_MANAGER_SUPPORT=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_SUS_MAP=y
        """,
            "VEUX native SUSFS defconfig",
        )


        # ------------------------------------------------------------------
        # P6-v9: restore the caller-side authorization gate required by the
        # ReSukiSU CONFIG_KSU_SUSFS sucompat contract.
        #
        # Current ReSukiSU's SUSFS faccessat handler intentionally assumes that
        # the hook caller already filtered ordinary/unprivileged processes.
        # P6-v8 preserved the safe P4 struct-filename ownership bridge but called
        # ksu_handle_faccessat() unconditionally, so an ordinary app probing
        # /system/bin/su could have its lookup redirected to /system/bin/sh and
        # receive a false "exists" result.
        #
        # Do NOT change ReSukiSU's handler. Restore the proven caller contract:
        #   - process is not in the SUSFS-unmounted state,
        #   - sucompat feature is enabled,
        #   - current UID is explicitly allowed.
        #
        # getname_flags()/putname() ownership remains exactly P4/P6-v8.
        # ------------------------------------------------------------------
        replace_once(
            "include/linux/ksu_hook_contract.h",
            """int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code,
                                          int *value);

        int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
        """,
            """int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code,
                                          int *value);

        #ifdef CONFIG_KSU_SUSFS
        struct static_key_true;
        extern struct static_key_true ksu_su_compat_enabled;
        bool __ksu_is_allow_uid_for_current(uid_t uid);
        #endif

        int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
        """,
            "P6-v9 shared sucompat caller declarations",
        )

        replace_once(
            "fs/open.c",
            "#include <linux/ksu_hook_contract.h>\n#include <linux/rcupdate.h>\n",
            """#include <linux/ksu_hook_contract.h>
        #ifdef CONFIG_KSU_SUSFS
        #include <linux/cred.h>
        #include <linux/jump_label.h>
        #include <linux/susfs_def.h>
        #endif
        #include <linux/rcupdate.h>
        """,
            "P6-v9 faccessat gate includes",
        )

        replace_once(
            "fs/stat.c",
            "#include <linux/ksu_hook_contract.h>\n#include <linux/pagemap.h>\n",
            """#include <linux/ksu_hook_contract.h>
        #ifdef CONFIG_KSU_SUSFS
        #include <linux/jump_label.h>
        #include <linux/susfs_def.h>
        #endif
        #include <linux/pagemap.h>
        """,
            "P6-v9 stat gate includes",
        )

        replace_once(
            "fs/open.c",
            """	ksu_handle_faccessat(&dfd, &ksu_filename, &mode, NULL);
        #elif defined(KSU_SOURCE_INLINE_HOOK)
        """,
            """	if (!likely(susfs_is_current_proc_umounted()) &&
        	    static_branch_likely(&ksu_su_compat_enabled) &&
        	    unlikely(__ksu_is_allow_uid_for_current(current_uid().val)))
        		ksu_handle_faccessat(&dfd, &ksu_filename, &mode, NULL);
        #elif defined(KSU_SOURCE_INLINE_HOOK)
        """,
            "P6-v9 faccessat caller authorization gate",
        )

        replace_once(
            "fs/stat.c",
            """	ksu_handle_stat(&dfd, &ksu_filename, &flags);
        #elif defined(KSU_SOURCE_INLINE_HOOK)
        """,
            """	if (!likely(susfs_is_current_proc_umounted()) &&
        	    static_branch_likely(&ksu_su_compat_enabled) &&
        	    unlikely(__ksu_is_allow_uid_for_current(current_uid().val)))
        		ksu_handle_stat(&dfd, &ksu_filename, &flags);
        #elif defined(KSU_SOURCE_INLINE_HOOK)
        """,
            "P6-v9 stat caller authorization gate",
        )

        # Exact source-shape proof.  The unprivileged path must keep the real
        # filesystem lookup semantics; only an explicitly allowed UID may enter
        # the sucompat redirection handler.
        open_text = Path("fs/open.c").read_text(encoding="utf-8")
        stat_text = Path("fs/stat.c").read_text(encoding="utf-8")
        contract_text = Path("include/linux/ksu_hook_contract.h").read_text(encoding="utf-8")

        gate_terms = (
            "susfs_is_current_proc_umounted()",
            "static_branch_likely(&ksu_su_compat_enabled)",
            "__ksu_is_allow_uid_for_current(current_uid().val)",
        )
        for term in gate_terms:
            if open_text.count(term) < 1:
                raise SystemExit("P6-v9 faccessat gate term missing: " + term)
            if stat_text.count(term) < 1:
                raise SystemExit("P6-v9 stat gate term missing: " + term)

        if contract_text.count("extern struct static_key_true ksu_su_compat_enabled;") != 1:
            raise SystemExit("P6-v9 shared sucompat static-key declaration mismatch")
        if contract_text.count("bool __ksu_is_allow_uid_for_current(uid_t uid);") != 1:
            raise SystemExit("P6-v9 shared allow-UID declaration mismatch")

        # Behavioral dispatch model for the caller condition itself.
        def dispatch_to_sucompat(proc_umounted, sucompat_enabled, uid_allowed):
            return (
                (not proc_umounted)
                and sucompat_enabled
                and uid_allowed
            )

        if dispatch_to_sucompat(False, True, False):
            raise SystemExit("ordinary UID must not enter sucompat path")
        if dispatch_to_sucompat(True, True, True):
            raise SystemExit("SUSFS-unmounted process must not enter sucompat path")
        if dispatch_to_sucompat(False, False, True):
            raise SystemExit("disabled sucompat must not enter sucompat path")
        if not dispatch_to_sucompat(False, True, True):
            raise SystemExit("allowed UID lost sucompat functionality")

        # ------------------------------------------------------------------
        # Cross-file invariants.
        # ------------------------------------------------------------------
        targets = {
            "kernel/sys.c": "ksu_handle_setresuid",
            "fs/exec.c": "ksu_handle_execveat",
            "fs/open.c": "ksu_handle_faccessat",
            "fs/read_write.c": "ksu_handle_sys_read",
            "fs/stat.c": "ksu_handle_stat",
            "kernel/reboot.c": "ksu_handle_sys_reboot",
            "drivers/input/input.c": "ksu_handle_input_handle_event",
        }
        for path, hook in targets.items():
            text = Path(path).read_text(encoding="utf-8")
            if hook not in text:
                raise SystemExit(f"{hook} missing from {path}")
            if "CONFIG_KSU_MANUAL_HOOK" in text:
                raise SystemExit(
                    f"literal CONFIG_KSU_MANUAL_HOOK remains in inline target {path}"
                )

        cfg = Path("arch/arm64/configs/veux_defconfig").read_text(encoding="utf-8")
        if "CONFIG_KSU_MANUAL_HOOK=y" in cfg:
            raise SystemExit("native defconfig still selects Manual Hook")
