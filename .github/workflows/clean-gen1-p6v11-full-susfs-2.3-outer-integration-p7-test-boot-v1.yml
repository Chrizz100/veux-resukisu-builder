name: CLEAN GEN1 P6-v11 - full SUSFS 2.3 outer integration + deterministic P7 test boot
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  p6-deterministic-image-dtb:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      ARCH: arm64
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
      VENDOR_TAG: '20240619'
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      P5I_RUN_ID: '33513399363'
      P5I_ARTIFACT_NAME: 
        clean-gen1-p5i-proc-maps-open-redirect-srcu-v1-33513399363
      EXPECTED_P5I_COMMIT: f353a9475e40ca866d570c1d0ef55e24cf6556e4
      EXPECTED_P5I_TREE: a947c1f2891c796a08373fc755e29b23139dc761
      EXPECTED_RESUKISU_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_RESUKISU_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      EXPECTED_KSU_VERSION: '35102'
      RESUKISU_SNAPSHOT_HEAD: 0b5efe9e0102c43ca5c41174d500f5a7080cd0c7
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_54_HEAD: 76affd70abf61d77feb0a132f61365d6848505df
      SUSFS_510_HEAD: ec785f47d49f7b3871ca9356f450411020af7017
      SUSFS_515_HEAD: bca0d2333c1a7d717e7278b019d7af7ba1d16005
      SUSFS_61_HEAD: 4fc9c1898ea66f51847cdbc0d1473ea4ef525a70
      CLANG_PREBUILT_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      OUT_DIR: ${{ github.workspace }}/kernel/out-p6
      ARTIFACT_DIR: ${{ github.workspace }}/clean-gen1-p6
      P5I_ARTIFACT_DIR: ${{ github.workspace }}/p5i-artifact
      KBUILD_BUILD_USER: builder
      KBUILD_BUILD_HOST: pangu-build-component-vendor-345942-54r9t-tw0tk-tq90c
      KBUILD_BUILD_TIMESTAMP: Thu Dec 5 14:47:59 UTC 2024
      KBUILD_BUILD_VERSION: '1'
      SOURCE_DATE_EPOCH: '1733410079'
      STOCK_KERNEL_RELEASE: 5.4.274-qgki-g82179e362f33
      STOCK_KERNEL_LOCALVERSION: -qgki
      STOCK_KERNEL_SCM_SUFFIX: -g82179e362f33
      KBUILD_FIXED_SCM_SUFFIX: -g82179e362f33
      STOCK_KERNEL_PAYLOAD_BYTES: '45480448'
      STOCK_KERNEL_PAYLOAD_SHA256: 6e513b3652aa1de599c26b6aaeefef12dac569daf8648bbb67de99932782c50b
      STOCK_KERNEL_BUILD_USER: builder
      STOCK_KERNEL_BUILD_HOST: pangu-build-component-vendor-345942-54r9t-tw0tk-tq90c
      STOCK_KERNEL_BUILD_TIMESTAMP: Thu Dec 5 14:47:59 UTC 2024
      P6_EFFECTIVE_KCFLAGS: -D__ANDROID_COMMON_KERNEL__
      P6_PARENT_RUN_ID: '33527695472'
      P6_PARENT_FAILURE: REAL_LINK_SPLIT_BRAIN_MANUAL_KBUILD_FORCED_SUSFS_CPP
      P6V10_V1_RUN_ID: '33598708652'
      P6V10_V1_ARTIFACT_SHA256: dc58f889f3fb2f2c16c829a76e364606c8d5d0bcd0508fb63d9018796e147aba
      P6V10_V1_FAILURE: DEFCONFIG_LOCALVERSION_AUTO_FALSE_SOURCE_ANCHOR
      P6V10_PASS_RUN_ID: '33603757875'
      P6V10_PASS_ARTIFACT_NAME: clean-gen1-p6v10-stock-kernel-release-sucompat-p7-boot-v2-33603757875
      P6V10_PASS_ARTIFACT_DIR: ${{ github.workspace }}/p6v10-pass-artifact
      EXPECTED_P6V10_SOURCE_TREE: c0c19cfa385453b0c5352629afa988ab2657a780
      EXPECTED_P6V10_IMAGE_SHA256: 522e1de77357ca8ac2c303da48325c46fcff53c815007091d91e5c6f0d7b4f8d
      EXPECTED_P6V10_DTB_SHA256: 42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37
      SUSFS54_DONOR_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
      SUSFS54_DONOR_COMMIT: 90d9f91d43ecaaee044e79c75a01d6a512508eb3
      SUSFS54_DONOR_PATH: Patches/Patch/susfs_patch_to_5.4.patch
      P6_REQUIRED_EXPORT_FILE: security/selinux/selinuxfs.c
      FINAL_BOOT_RELEASE_TAG: Final_Boot
      FINAL_BOOT_RELEASE_ASSET: Boot.img.zip
      FINAL_BOOT_RELEASE_ZIP_SHA256: 
        920f2aa04d495771506c9e34ef81776de50273bde82835553cadbb73a864b4b8
      FINAL_BOOT_REFERENCE_BOOT_SHA256: 
        2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e
      FINAL_BOOT_REFERENCE_KERNEL_SHA256: 
        e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96
      ROLLBACK_GZIP_SHA256: 
        9a1532ccfc57b465256bba97863f927b80823fa8812a4d13e4f4c8bf9af0c78b
      STOCK_BOOT_SHA256: 
        ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5
      STOCK_BOOT_BYTES: '134217728'
      STOCK_RAMDISK_SHA256: 
        0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a
      P6V10_TEST_BOOT_NAME: CLEAN_GEN1_P7_FULL_SUSFS_P6V11_TEST_boot.img
    steps:
    - name: Initialize P6-v11 full SUSFS outer integration
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf "$ARTIFACT_DIR" "$P5I_ARTIFACT_DIR" "$TOOLCHAIN_DIR" \
               "$GITHUB_WORKSPACE/toolchains" \
               "$GITHUB_WORKSPACE/p6-outer-replay" \
               "$GITHUB_WORKSPACE/p6-resukisu-replay" \
               "$P6V10_PASS_ARTIFACT_DIR"
        mkdir -p "$ARTIFACT_DIR" "$TOOLCHAIN_DIR"

        cat > "$ARTIFACT_DIR/00-plan.txt" <<'EOF'
        CLEAN GEN1 P6-v11 - complete SUSFS 2.3 outer integration on accepted P6-v10-v2

        P6-v7 reached the canonical full build and failed only at final vmlinux link:
          undefined symbol ksu_init_rc_hook.

        Root cause:
        - the generated Kconfig selected CONFIG_KSU_MANUAL_HOOK=y;
        - GNU make/KCFLAGS simultaneously forced CONFIG_KSU_SUSFS;
        - ReSukiSU Kbuild therefore selected Manual Hook while C preprocessing selected
          SUSFS branches in other translation units;
        - core/init.c would also take the Manual-Hook branch first and skip susfs_init().

        P6-v8 rejects this split-brain model completely.
        It uses native CONFIG_KSU_SUSFS=y in the real VEUX defconfig, MANUAL_HOOK=n,
        and the seven source inline hooks required by ReSukiSU's own
        inline_hook_check.mk.

        P6 validation policy:
        - native Kconfig hook mode only; no Make/KCFLAGS CONFIG_KSU_SUSFS forcing;
        - no artificial subdir compile or standalone make preflight;
        - source invariants before build, canonical full build for compile truth;
        - post-build symbol/output/reproducibility validation after compiler success;

        P6-v10 source policy:
        - restore exact P5I tree and selected ReSukiSU bundle;
        - fresh upstream-drift gate BEFORE the first full kernel compile;
        - preserve the accepted P6-v9 native-SUSFS and sucompat caller-gate changes;
        - remove the fork-only ~positron identity from localversion;
        - restore the verified stock CONFIG_LOCALVERSION=-qgki contract;
        - emit the verified stock SCM suffix -g82179e362f33 without inventing a value;
        - keep actual source commit/tree and toolchain hashes in provenance artifacts;
        - module_load_filter remains excluded.

        Toolchain:
        - Android clang-r416183b pinned to prebuilts commit aa2e4a...

        Native configuration model:
        - real VEUX defconfig selects CONFIG_KSU_SUSFS=y;
        - CONFIG_KSU_MANUAL_HOOK is disabled by the ReSukiSU hook-method choice;
        - all integrated SUSFS features are real .config symbols;
        - KCFLAGS contains only the Android-common compatibility define;
        - no CONFIG_KSU_* symbol is injected through compiler command-line defines;
        - ReSukiSU Kbuild and C preprocessing therefore see one identical hook mode.

        Determinism:
        - Build A from clean out-p6
        - archive hashes/output
        - delete out-p6 completely
        - Build B again at the same absolute out-p6 path
        - compare Image, VEUX DTB, vmlinux, System.map, .config and complete DTB hash list

        Outputs:
        - Image
        - VEUX DTB
        - base .config
        - effective-build-config manifest
        - complete provenance/build/reproducibility evidence

        A calibrated boot.img is created for P7 testing. No AnyKernel3 ZIP,
        device access or flashing is performed by this workflow.
        EOF


        {
          echo "P6V9_TRIGGER=P7_REAL_DEVICE_SU_PATH_VISIBILITY_REGRESSION"
          echo "P6V9_OBSERVED_PATH=/system/bin/su"
          echo "P6V9_FIX_SCOPE=RESTORE_RESUKISU_SUSFS_CALLER_AUTHORIZATION_GATE"
          echo "P6V9_HANDLER_SOURCE_MODIFIED=NO"
          echo "P6V9_P4_STRUCT_FILENAME_LIFETIME_MODEL_CHANGED=NO"
          echo "P6V9_MANAGER_PIN=NO"
        } >> "$ARTIFACT_DIR/00-plan.txt"

        {
          echo "P6V10_TRIGGER=VERIFIED_VEUX_STOCK_KERNEL_IDENTITY"
          echo "P6V10_STOCK_BOOT_SHA256=$STOCK_BOOT_SHA256"
          echo "P6V10_STOCK_KERNEL_RELEASE=$STOCK_KERNEL_RELEASE"
          echo "P6V10_STOCK_KERNEL_LOCALVERSION=$STOCK_KERNEL_LOCALVERSION"
          echo "P6V10_STOCK_KERNEL_SCM_SUFFIX=$STOCK_KERNEL_SCM_SUFFIX"
          echo "P6V10_STOCK_BUILD_USER=$STOCK_KERNEL_BUILD_USER"
          echo "P6V10_STOCK_BUILD_HOST=$STOCK_KERNEL_BUILD_HOST"
          echo "P6V10_STOCK_BUILD_TIMESTAMP=$STOCK_KERNEL_BUILD_TIMESTAMP"
          echo "P6V10_POSITRON_IDENTITY_REMOVED=YES"
          echo "P6V10_ACTUAL_SOURCE_PROVENANCE_RETAINED=YES"
          echo "P6V10_ACTUAL_TOOLCHAIN_PROVENANCE_RETAINED=YES"
          echo "P6V10_COMPILER_STRING_POLICY=TRUTHFUL_ACTUAL_TOOLCHAIN"
          echo "P6V10_DYNAMIC_SCM_SUFFIX_ALLOWED=NO"
          echo "P6V10_FUNCTIONAL_DELTA_FROM_V9=NO_EXCEPT_ALREADY_PLANNED_SUCOMPAT_GATE"
          echo "P6V10_METADATA_DELTA=VERIFIED_STOCK_RELEASE_BUILDER_HOST_TIMESTAMP"
          echo "P6V10_V1_RUN_ID=$P6V10_V1_RUN_ID"
          echo "P6V10_V1_ARTIFACT_SHA256=$P6V10_V1_ARTIFACT_SHA256"
          echo "P6V10_V1_FAILURE=$P6V10_V1_FAILURE"
          echo "P6V10_V2_FIX=REPLACE_ONLY_REAL_DEFCONFIG_LOCALVERSION_LINE_AND_VERIFY_GENERATED_AUTO_CONFIG"
        } >> "$ARTIFACT_DIR/00-plan.txt"
    - name: Install P6 dependencies
      shell: bash
      run: |2

        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates cpio curl flex git jq \
          libelf-dev libncurses-dev libssl-dev patch python3 rsync unzip xz-utils zstd
    - name: Checkout exact VEUX vendor source
      uses: actions/checkout@v6
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: '20240619'
        path: kernel
        fetch-depth: 1
        persist-credentials: false
    - name: Authenticate exact VEUX stock kernel identity before build
      shell: bash
      run: |
        set -euo pipefail

        identity_work="$RUNNER_TEMP/p6v10-stock-identity"
        rm -rf "$identity_work"
        mkdir -p "$identity_work/reference"

        curl --fail --location --silent --show-error \
          --retry 5 --retry-delay 2 \
          "https://github.com/${GITHUB_REPOSITORY}/releases/download/${FINAL_BOOT_RELEASE_TAG}/${FINAL_BOOT_RELEASE_ASSET}" \
          -o "$identity_work/$FINAL_BOOT_RELEASE_ASSET"

        test "$(sha256sum "$identity_work/$FINAL_BOOT_RELEASE_ASSET" | awk '{print $1}')" = \
          "$FINAL_BOOT_RELEASE_ZIP_SHA256"

        unzip -q "$identity_work/$FINAL_BOOT_RELEASE_ASSET" -d "$identity_work/reference"
        test "$(sha256sum "$identity_work/reference/boot.img" | awk '{print $1}')" = \
          "$FINAL_BOOT_REFERENCE_BOOT_SHA256"
        test "$(sha256sum "$identity_work/reference/rollback_stock_boot.img.gz" | awk '{print $1}')" = \
          "$ROLLBACK_GZIP_SHA256"
        gzip -t "$identity_work/reference/rollback_stock_boot.img.gz"
        gzip -dc "$identity_work/reference/rollback_stock_boot.img.gz" \
          > "$identity_work/stock_boot.img"
        test "$(stat -c '%s' "$identity_work/stock_boot.img")" = "$STOCK_BOOT_BYTES"
        test "$(sha256sum "$identity_work/stock_boot.img" | awk '{print $1}')" = \
          "$STOCK_BOOT_SHA256"

        python3 - "$identity_work/stock_boot.img" "$identity_work/stock-kernel.bin" <<'PY'
        import hashlib
        import struct
        import sys
        from pathlib import Path

        boot = Path(sys.argv[1]).read_bytes()
        out = Path(sys.argv[2])
        if boot[:8] != b"ANDROID!":
            raise SystemExit("stock Android boot magic missing")
        kernel_size = struct.unpack_from("<I", boot, 8)[0]
        if kernel_size != 45480448:
            raise SystemExit(f"unexpected stock kernel bytes: {kernel_size}")
        kernel = boot[4096:4096 + kernel_size]
        if hashlib.sha256(kernel).hexdigest() != "6e513b3652aa1de599c26b6aaeefef12dac569daf8648bbb67de99932782c50b":
            raise SystemExit("stock kernel payload hash mismatch")
        expected = (
            b"Linux version 5.4.274-qgki-g82179e362f33 "
            b"(builder@pangu-build-component-vendor-345942-54r9t-tw0tk-tq90c)"
        )
        if expected not in kernel:
            raise SystemExit("verified stock Linux version banner missing")
        if b"#1 SMP PREEMPT Thu Dec 5 14:47:59 UTC 2024" not in kernel:
            raise SystemExit("verified stock build timestamp missing")
        out.write_bytes(kernel)
        PY

        test "$(stat -c '%s' "$identity_work/stock-kernel.bin")" = \
          "$STOCK_KERNEL_PAYLOAD_BYTES"
        test "$(sha256sum "$identity_work/stock-kernel.bin" | awk '{print $1}')" = \
          "$STOCK_KERNEL_PAYLOAD_SHA256"

        kernel/scripts/extract-ikconfig "$identity_work/stock-kernel.bin" \
          > "$ARTIFACT_DIR/02a-stock-kernel.config"
        grep -Fxq 'CONFIG_LOCALVERSION="-qgki"' \
          "$ARTIFACT_DIR/02a-stock-kernel.config"
        grep -Fxq 'CONFIG_LOCALVERSION_AUTO=y' \
          "$ARTIFACT_DIR/02a-stock-kernel.config"

        {
          echo "P6V10_STOCK_IDENTITY_INPUT=PASS"
          echo "P6V10_STOCK_BOOT_SHA256=$STOCK_BOOT_SHA256"
          echo "P6V10_STOCK_KERNEL_PAYLOAD_BYTES=$STOCK_KERNEL_PAYLOAD_BYTES"
          echo "P6V10_STOCK_KERNEL_PAYLOAD_SHA256=$STOCK_KERNEL_PAYLOAD_SHA256"
          echo "P6V10_STOCK_KERNEL_RELEASE=$STOCK_KERNEL_RELEASE"
          echo "P6V10_STOCK_CONFIG_LOCALVERSION=$STOCK_KERNEL_LOCALVERSION"
          echo "P6V10_STOCK_CONFIG_LOCALVERSION_AUTO=YES"
          echo "P6V10_STOCK_BUILD_USER=$STOCK_KERNEL_BUILD_USER"
          echo "P6V10_STOCK_BUILD_HOST=$STOCK_KERNEL_BUILD_HOST"
          echo "P6V10_STOCK_BUILD_TIMESTAMP=$STOCK_KERNEL_BUILD_TIMESTAMP"
        } | tee "$ARTIFACT_DIR/02a-stock-identity-auth.txt"

        rm -rf "$identity_work"
    - name: Download accepted P6-v10-v2 full PASS backup
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.P6V10_PASS_ARTIFACT_NAME }}
        path: ${{ env.P6V10_PASS_ARTIFACT_DIR }}
        github-token: ${{ github.token }}
        run-id: ${{ env.P6V10_PASS_RUN_ID }}
        repository: Chrizz100/veux-resukisu-builder
    - name: Authenticate exact P6-v10-v2 parent backup
      shell: bash
      run: |
        set -euo pipefail
        test -s "$P6V10_PASS_ARTIFACT_DIR/ARTIFACT-SHA256SUMS"
        (
          cd "$P6V10_PASS_ARTIFACT_DIR"
          sha256sum -c ARTIFACT-SHA256SUMS
        ) > "$ARTIFACT_DIR/02b-p6v10-parent-sha256.txt"
        grep -Fxq 'CLEAN_GEN1_P6V10_STOCK_KERNEL_IDENTITY_DETERMINISTIC_BUILD=PASS' \
          "$P6V10_PASS_ARTIFACT_DIR/17-result.txt"
        grep -Fxq "P6_SOURCE_TREE=$EXPECTED_P6V10_SOURCE_TREE" \
          "$P6V10_PASS_ARTIFACT_DIR/17-result.txt"
        grep -Fxq "$EXPECTED_P6V10_IMAGE_SHA256  Image" \
          "$P6V10_PASS_ARTIFACT_DIR/build-a/SHA256SUMS"
        grep -Fxq "$EXPECTED_P6V10_DTB_SHA256  veux.dtb" \
          "$P6V10_PASS_ARTIFACT_DIR/build-a/SHA256SUMS"
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        p=Path(os.environ['P6V10_PASS_ARTIFACT_DIR'])/'source-restore-kit/manifest.json'
        m=json.loads(p.read_text())
        assert m['p6_source_tree']==os.environ['EXPECTED_P6V10_SOURCE_TREE']
        assert m['hook_mode']=='native_kconfig_susfs'
        assert m['manual_hook_enabled'] is False
        assert m['susfs_enabled'] is True
        assert m['module_load_filter_included'] is False
        PY
        {
          echo "P6V10_PARENT_BACKUP_AUTH=PASS"
          echo "P6V10_PARENT_RUN_ID=$P6V10_PASS_RUN_ID"
          echo "P6V10_PARENT_SOURCE_TREE=$EXPECTED_P6V10_SOURCE_TREE"
          echo "P6V10_PARENT_IMAGE_SHA256=$EXPECTED_P6V10_IMAGE_SHA256"
        } | tee "$ARTIFACT_DIR/02b-p6v10-parent-auth.txt"
    - name: Download accepted P5I artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.P5I_ARTIFACT_NAME }}
        path: p5i-artifact
        github-token: ${{ github.token }}
        run-id: ${{ env.P5I_RUN_ID }}
    - name: Authenticate P5I Last Good
      shell: bash
      run: |2

        set -euo pipefail
        (
          cd "$P5I_ARTIFACT_DIR/restore-kit"
          sha256sum -c SHA256SUMS
        ) > "$ARTIFACT_DIR/01-p5i-restore-sha256.txt"

        jq -e \
          --arg commit "$EXPECTED_P5I_COMMIT" \
          --arg tree "$EXPECTED_P5I_TREE" \
          --arg rhead "$EXPECTED_RESUKISU_HEAD" \
          --arg rtree "$EXPECTED_RESUKISU_TREE" \
          '.stage=="CLEAN_GEN1_P5I" and
           .p5i_commit==$commit and
           .p5i_tree==$tree and
           .resukisu_head==$rhead and
           .resukisu_tree==$rtree and
           .normal_path_open_redirect_integrated==true and
           .tmpfile_open_redirect_integrated==true and
           .o_path_open_redirect_integrated==true and
           .vfs_readlink_open_redirect_integrated==true and
           .proc_readlink_open_redirect_integrated==true and
           .vfs_statfs_open_redirect_integrated==true and
           .fdinfo_mnt_id_open_redirect_integrated==true and
           .proc_maps_open_redirect_integrated==true and
           .proc_maps_caller_held_srcu==true and
           .proc_maps_redirect_pointer_used_only_under_srcu==true and
           .susfs_runtime_enabled==false and
           .full_kernel_build_performed==false' \
          "$P5I_ARTIFACT_DIR/restore-kit/manifest.json" \
          > "$ARTIFACT_DIR/01-p5i-manifest-auth.json"

        grep -Fxq 'CLEAN_GEN1_P5I_PROC_MAPS_OPEN_REDIRECT_SRCU=PASS' \
          "$P5I_ARTIFACT_DIR/16-result.txt"
        grep -Fxq 'P5I_MAPS_SYMBOL_CONTRACT=PASS' \
          "$P5I_ARTIFACT_DIR/11-object-builds.txt"

        {
          echo "P5I_RESTORE_ARTIFACT=PASS"
          echo "P5I_CHECKPOINT_AUTH=PASS"
          echo "P5I_INPUT_TREE=$EXPECTED_P5I_TREE"
          echo "P6_FULL_BUILD_ALLOWED=YES"
        } | tee "$ARTIFACT_DIR/01-p5i-auth.txt"
    - name: Fresh upstream audit immediately before full build
      shell: bash
      run: |2

        set -euo pipefail
        current_resu="$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main | awk '{print $1}')"
        current_54="$(git ls-remote "$SUSFS_REPO" refs/heads/kernel-5.4 | awk '{print $1}')"
        current_510="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android12-5.10 | awk '{print $1}')"
        current_515="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android13-5.15 | awk '{print $1}')"
        current_61="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android14-6.1 | awk '{print $1}')"

        {
          echo "RESUKISU_CURRENT=$current_resu"
          echo "RESUKISU_REVIEWED=$RESUKISU_SNAPSHOT_HEAD"
          echo "SUSFS_54_CURRENT=$current_54"
          echo "SUSFS_54_REVIEWED=$SUSFS_54_HEAD"
          echo "SUSFS_510_CURRENT=$current_510"
          echo "SUSFS_510_REVIEWED=$SUSFS_510_HEAD"
          echo "SUSFS_515_CURRENT=$current_515"
          echo "SUSFS_515_REVIEWED=$SUSFS_515_HEAD"
          echo "SUSFS_61_CURRENT=$current_61"
          echo "SUSFS_61_REVIEWED=$SUSFS_61_HEAD"
        } > "$ARTIFACT_DIR/02-upstream-current.txt"

        test "$current_resu" = "$RESUKISU_SNAPSHOT_HEAD"
        test "$current_54" = "$SUSFS_54_HEAD"
        test "$current_510" = "$SUSFS_510_HEAD"
        test "$current_515" = "$SUSFS_515_HEAD"
        test "$current_61" = "$SUSFS_61_HEAD"

        echo "P6_FRESH_UPSTREAM_AUDIT=PASS" | tee -a "$ARTIFACT_DIR/02-upstream-current.txt"
    - name: Restore exact accepted P5I outer tree
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
        test -z "$(git status --porcelain)"

        PATCH="$P5I_ARTIFACT_DIR/restore-kit/vendor-20240619-to-p5i-outer.patch"
        git apply --check --binary "$PATCH"
        git apply --index --binary "$PATCH"
        test "$(git write-tree)" = "$EXPECTED_P5I_TREE"

        GIT_AUTHOR_NAME="CLEAN-GEN1 Restore" \
        GIT_AUTHOR_EMAIL="clean-gen1@invalid.local" \
        GIT_AUTHOR_DATE="2026-09-01T00:00:00Z" \
        GIT_COMMITTER_NAME="CLEAN-GEN1 Restore" \
        GIT_COMMITTER_EMAIL="clean-gen1@invalid.local" \
        GIT_COMMITTER_DATE="2026-09-01T00:00:00Z" \
          git commit -m "CLEAN GEN1 restore accepted P5I outer tree"

        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P5I_TREE"
        echo "P5I_RESTORED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

