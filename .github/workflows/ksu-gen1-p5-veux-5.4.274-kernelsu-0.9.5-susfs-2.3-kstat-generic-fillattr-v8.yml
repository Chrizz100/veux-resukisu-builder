    - name: 20 - Audit and activate only generic_fillattr KSTAT hook
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V8_GENERIC_FILLATTR_ACTIVATION" > evidence/STAGE.txt
        cd kernel

        python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/11-P5V8-PRE-AUDIT.txt"
        from pathlib import Path

        statc = Path("fs/stat.c").read_text(encoding="utf-8")
        hdr = Path("include/linux/susfs.h").read_text(encoding="utf-8")
        sus = Path("fs/susfs.c").read_text(encoding="utf-8")
        core = Path("KernelSU/kernel/core_hook.c").read_text(encoding="utf-8")

        checks = {
            "GENERIC_FILLATTR_SIGNATURE":
                "void generic_fillattr(struct inode *inode, struct kstat *stat)" in statc,
            "GENERIC_FILLATTR_FINAL_BLOCKS_ANCHOR":
                "\tstat->blocks = inode->i_blocks;\n}" in statc,
            "SUSFS_HEADER_API":
                "susfs_sus_kstat_spoof_generic_fillattr" in hdr,
            "SUSFS_SOURCE_API":
                "void susfs_sus_kstat_spoof_generic_fillattr(struct inode *inode, struct kstat *stat)" in sus,
            "HOOK_NOT_ALREADY_PRESENT":
                "susfs_sus_kstat_spoof_generic_fillattr" not in statc,
            "KSTAT_DISPATCH_PRESENT":
                "case CMD_SUSFS_ADD_SUS_KSTAT:" in core,
            "TIF_PROC_UMOUNTED_BRIDGE_PRESENT":
                "susfs_set_current_proc_umounted();" in core,
            "CUSTOM_GETATTR_BRANCH_PRESENT":
                "if (inode->i_op->getattr)" in statc,
        }

        for key, ok in checks.items():
            print(f"{key}={'PASS' if ok else 'FAIL'}")

        failed = [key for key, ok in checks.items() if not ok]
        if failed:
            raise SystemExit("P5-v8 prerequisite failure: " + ", ".join(failed))

        print("P5_V8_PRE_ACTIVATION_AUDIT=PASS")
        PY

        python3 - <<'PY'
        from pathlib import Path

        p = Path("fs/stat.c")
        t = p.read_text(encoding="utf-8")

        # Add SUSFS declaration through its canonical header, only for KSTAT builds.
        inc_anchor = "#include <linux/compat.h>\n"
        if t.count(inc_anchor) != 1:
            raise SystemExit("fs/stat.c include anchor mismatch")
        if "#include <linux/susfs.h>" in t:
            raise SystemExit("SUSFS header unexpectedly already present")

        t = t.replace(
            inc_anchor,
            inc_anchor
            + "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
            + "#include <linux/susfs.h>\n"
            + "#endif\n",
            1,
        )

        sig = "void generic_fillattr(struct inode *inode, struct kstat *stat)"
        if t.count(sig) != 1:
            raise SystemExit("generic_fillattr function count mismatch")

        start = t.index(sig)
        end = t.index("\n}\nEXPORT_SYMBOL(generic_fillattr);", start) + 2
        fn = t[start:end]

        anchor = "\tstat->blocks = inode->i_blocks;\n"
        if fn.count(anchor) != 1:
            raise SystemExit("generic_fillattr final anchor mismatch")
        if "susfs_sus_kstat_spoof_generic_fillattr" in fn:
            raise SystemExit("generic_fillattr SUSFS hook unexpectedly already present")

        hook = (
            anchor
            + "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
            + "\tsusfs_sus_kstat_spoof_generic_fillattr(inode, stat);\n"
            + "#endif\n"
        )
        fn = fn.replace(anchor, hook, 1)
        t = t[:start] + fn + t[end:]

        p.write_text(t, encoding="utf-8")
        PY

        git diff --check -- fs/stat.c

        python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/11-P5V8-SOURCE-AUDIT.txt"
        from pathlib import Path

        statc = Path("fs/stat.c").read_text(encoding="utf-8")

        assert statc.count("#include <linux/susfs.h>") == 1
        assert statc.count("susfs_sus_kstat_spoof_generic_fillattr(inode, stat);") == 1

        start = statc.index("void generic_fillattr(struct inode *inode, struct kstat *stat)")
        end = statc.index("\n}\nEXPORT_SYMBOL(generic_fillattr);", start) + 2
        fn = statc[start:end]

        assert fn.index("stat->blocks = inode->i_blocks;") < fn.index(
            "susfs_sus_kstat_spoof_generic_fillattr(inode, stat);"
        )

        vstart = statc.index("int vfs_getattr_nosec(")
        vend = statc.index("\n}\nEXPORT_SYMBOL(vfs_getattr_nosec);", vstart) + 2
        vfn = statc[vstart:vend]

        assert "susfs_sus_kstat_spoof_generic_fillattr" not in vfn
        assert "if (inode->i_op->getattr)" in vfn
        assert "generic_fillattr(inode, stat);" in vfn

        print("P5_V8_GENERIC_FILLATTR_HOOK=PASS")
        print("P5_V8_GENERIC_FILLATTR_HOOK_AFTER_BASE_ATTRIBUTES=PASS")
        print("P5_V8_CUSTOM_GETATTR_HOOK=DEFERRED")
        print("P5_V8_PROC_MAPS_HOOK=DEFERRED")
        print("P5_V8_SOURCE_ACTIVATION=PASS")
        PY
