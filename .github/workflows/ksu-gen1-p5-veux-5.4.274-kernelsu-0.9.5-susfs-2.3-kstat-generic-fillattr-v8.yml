    - name: 26 - Audit linked P5-v8 generic_fillattr boundary
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V8_LINK_AUDIT" > evidence/STAGE.txt
        cd kernel

        map=out-p5/System.map

        for sym in \
          kernelsu_init \
          ksu_handle_prctl \
          ksu_handle_setuid \
          ksu_handle_faccessat \
          ksu_handle_stat \
          susfs_init \
          susfs_add_sus_kstat \
          susfs_update_sus_kstat \
          susfs_sus_kstat_spoof_generic_fillattr \
          susfs_set_uname \
          susfs_spoof_uname \
          susfs_set_cmdline_or_bootconfig \
          susfs_spoof_cmdline_or_bootconfig
        do
          grep -Eq "[[:space:]]${sym}$" "$map"
        done

        nm out-p5/fs/stat.o \
          | grep -Eq '[[:space:]]U[[:space:]]+susfs_sus_kstat_spoof_generic_fillattr$'

        grep -Fq 'susfs_sus_kstat_spoof_generic_fillattr(inode, stat);' fs/stat.c

        python3 - <<'PY'
        from pathlib import Path
        statc = Path("fs/stat.c").read_text(encoding="utf-8")
        vstart = statc.index("int vfs_getattr_nosec(")
        vend = statc.index("\n}\nEXPORT_SYMBOL(vfs_getattr_nosec);", vstart) + 2
        vfn = statc[vstart:vend]
        assert "susfs_sus_kstat_spoof_generic_fillattr" not in vfn
        PY

        sha256sum \
          fs/open.c \
          fs/susfs.c \
          kernel/sys.c \
          fs/proc/cmdline.c \
          KernelSU/kernel/sucompat.c \
          KernelSU/kernel/Kconfig \
          KernelSU/kernel/core_hook.c \
          > "$RUNNER_TEMP/p5v8-protected-linked.sha256"

        cmp "$RUNNER_TEMP/p5v7-protected-source.sha256" \
            "$RUNNER_TEMP/p5v8-protected-linked.sha256"

        {
          echo "P5_V7_KSTAT_FOUNDATION_PRESERVED=YES"
          echo "P5_V6_TIF_PROC_UMOUNTED_BRIDGE_PRESERVED=YES"
          echo "P5_V8_KSTAT_GENERIC_FILLATTR_HOOK=YES"
          echo "P5_V8_KSTAT_CUSTOM_GETATTR_HOOK=NO"
          echo "P5_V8_KSTAT_PROC_MAPS_HOOK=NO"
          echo "P5_V8_ACTIVE_SUBOPTION_COUNT=3"
          echo "P5_V8_TOTAL_ROOT_ONLY_DISPATCH_COMMAND_COUNT=8"
          echo "P4_STAT_FACCESSAT_SAFE_FILENAME_BRIDGE_PRESERVED=YES"
          echo "SUS_PATH_ACTIVE=NO"
          echo "SUS_MOUNT_ACTIVE=NO"
          echo "OPEN_REDIRECT_ACTIVE=NO"
          echo "SUS_MAP_ACTIVE=NO"
          echo "PROC_MAPS_ACTIVE=NO"
          echo "P5_V8_LINKED_BOUNDARY=PASS"
        } > "$GITHUB_WORKSPACE/evidence/16-P5V8-LINKED-BOUNDARY.txt"
