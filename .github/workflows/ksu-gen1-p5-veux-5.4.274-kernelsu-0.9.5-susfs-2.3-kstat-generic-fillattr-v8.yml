      uses: actions/upload-artifact@v7
      with:
        name: ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-kstat-generic-fillattr-v8-${{ github.run_id }}
        path: 'evidence/

          restore-kit/

          build-artifacts/

          '
        retention-days: 14
        if-no-files-found: error
