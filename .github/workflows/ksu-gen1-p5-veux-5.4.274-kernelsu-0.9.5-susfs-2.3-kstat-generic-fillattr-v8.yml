            encoding="utf-8",
        )
        PY

        cat > "$GITHUB_WORKSPACE/restore-kit/RESTORE-INSTRUCTIONS.txt" <<EOF
        KSU GEN1 P5-v8 KSTAT generic_fillattr recovery

        Permanent parent backup:
          $P5_V7_PARENT_BACKUP_TAG

