name: 45P - VEUX Final ReSukiSU SUSFS Cumulative Integration Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    env:
      ARCH: arm64

      COMMON_REF: "android11-5.4.274_r00"
      STOCK_REF: "veux-r-oss"

      STABILITY_REVERT: "f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80"

      EXPECTED_CANDIDATE_TREE: "5d25b7e0124d7fb695f3f07b45928fcb5780d0e8"

      LB_CAPACITY_COMMIT: "2c1495be9eabac845acc8da45f070622d6455091"

      IDLE_SCREEN_COMMIT: "64e34240600a0c90072972a6c3d86f1d6ec85c53"
      IDLE_EXPOSE_COMMIT: "4ac606c780ae02a075d75a2703be68880761531a"
      IDLE_NOTIFIER_COMMIT: "8bc9cc6e197c0d1cf166ed94bb53ce41add1c828"
      IDLE_OPTIMIZE_COMMIT: "1d49e9b3308a7eacd75ed67f4112914e74ee60db"

      CPUFREQ_MIN_COMMIT: "44242207c9afe2b3e7fb5bdc18da42e918043c63"
      CPUFREQ_MAX_COMMIT: "3a25ef84be1d26cf0ddd526534358febd04529c5"

      EXPECTED_CPUFREQ_BEFORE_SHA256: "e1fa642651d4cf66fe59bf0eb615974bb403057dad5daeb3b7a8b1e9c06de646"
      EXPECTED_CPUFREQ_AFTER_SHA256: "9ac85ecaafbdddfb43d2b361183b455448ce400fad1296ae290510ad33039ceb"

      EXPECTED_STORE_ONE_BEFORE_SHA256: "5b85f632ef77eeee55d4b404a08e9d96ec87af0201ba1d634150c3ef418f37e3"
      EXPECTED_STORE_ONE_AFTER_SHA256: "0bbe18c9eee2059f4d2ec636b604f50bda90b131261e857b0dbc717c512ef28e"
      EXPECTED_CPUFREQ_TARGETED_DIFF_SHA256: "b431c73a2bfee36e093dc87846c628dd598a84499db66fc12a9930ff948e0b43"

      EXPECTED_IDLE_RESTORE_DIFF_SHA256: "33b144f63893d7a45d6c8e301aacf6ca1faa7a87088c19ab8bfdc1ecb29a0fd5"

      EXPECTED_LPM_AFTER_SHA256: "6805651af0a60905ce04356df3a538be15e94b6c8599a1d35e414d0a50b67094"
      EXPECTED_CPUIDLE_CORE_AFTER_SHA256: "e7f7fba62ce2bbe82f23c6bfbf5a103161d1c8013b85f7f48e4c036758f6a603"
      EXPECTED_CPUIDLE_HEADER_AFTER_SHA256: "9149734aa0eef1bba2e7ae16902dfd3aa203f23fe41657ce7df50ab947620506"

      EXPECTED_SCHEDUTIL_BEFORE_SHA256: "9d56491a427ee12f1156ae907c5aa647bf1a1b35bf13c725a08e73ef295274b7"
      EXPECTED_SCHEDUTIL_AFTER_SHA256: "987c9598f16b22a1e7b343475691687d309122de447494cd1a2b5ea8cbbafffc"

      EXPECTED_CASS_DIFF_SHA256: "67abb81be8c2d7727c3e4c8a92419c9e9a3d97ee3d3e5355d3acabce34adf659"

      EXPECTED_XIAOMI_PELT_SHA256: "bad23ba491cc5d4669936507b392888765aa65fd8063b2a95a492d6b0dca0cb0"

      EXPECTED_HZ_KCONFIG_SHA256: "685e9a79f3dbf17e9bd5b402dfd25ad014886fbe1b6975a0913b3621519cd7fe"

      RESUKISU_COMMIT: "faccf4c5edc7be37776216e7d43dd3dca0239331"
      EXPECTED_RESUKISU_VERSION: "v4.2.0-rc1-faccf4c5@ReSukiSU"

      BACKPORT_REPO: "JackA1ltman/NonGKI_Kernel_Build_2nd"
      BACKPORT_COMMIT: "90d9f91d43ecaaee044e79c75a01d6a512508eb3"
      BACKPORT_PATCH_PATH: "Patches/Patch/susfs_patch_to_5.4.patch"
      BACKPORT_PATCH_BLOB: "7533876188b65d78940b705d8e4462dbdc31c0a2"
      BACKPORT_PATCH_SHA256: "21233ce9a0a02590d977cd193aa493b23df7008e73fed402901e033a303b9631"
      EXPECTED_TASK_MMU_REJECT_SHA256: "f8daf0861fd9608e6ceb11557c34ec09368fff8e4123992d3453c740f61c4996"

      EXPECTED_WARNING_CLEAN_DIFF_SHA256: "afdbab86f738aead94a12f896eeb5b74008dcf1c4fe5dfec4682651491a3de1e"

      WORKFLOW17_BLOB: "a87d1c8ec8dab938101337dd9786c1773d2c5f19"
      WORKFLOW44C_BLOB: "95fc204bd6d5355c2f6a1c0e75eefa68a053f576"

      CLANG_PREBUILT_COMMIT: "aa2e4a514a6c85eebcc4a27149eaf9244e951a1e"

      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      REFERENCE_DIR: ${{ github.workspace }}/workflow-reference
      PATCH_DIR: ${{ github.workspace }}/reference-patches
      OUT_DIR: out
      ARTIFACT_DIR: ${{ github.workspace }}/final-integration-preflight

    steps:
      - name: Prepare preflight
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$TOOLCHAIN_DIR" \
            "$PATCH_DIR" \
            "$ARTIFACT_DIR"

          cat > "$ARTIFACT_DIR/PLAN.txt" <<'EOF'
          VEUX Final ReSukiSU + SUSFS Cumulative Integration Preflight
          ============================================================

          Input baseline:
          - exact Candidate 2 Linux 5.4.274

          Cumulative corrections proven through 44C:
          - CASS max-frequency / thermal capacity adaptation
          - SPRD rotation disabled
          - standard LB capacity rate limit restored
          - CONFIG_CPUSETS restored
          - exact Xiaomi VEUX PELT8 restored
          - custom HZ100 removed, default HZ250 restored
          - schedutil 20% lower-step heuristic removed
          - normal schedutil UClamp boost+cap restored
          - display-coupled deep-idle restriction removed
          - normal Xiaomi sleep_disabled policy restored
          - scaling_min_freq no-op removed
          - scaling_max_freq below-min clamp removed
          - standard CPUFreq QoS sysfs writes restored

          ReSukiSU / SUSFS integration:
          - reuse exact approved Workflow 17 integration logic
          - exact ReSukiSU commit
          - exact SUSFS 5.4 backport
          - exact task_mmu reject identity
          - exact warning-clean VEUX adaptation

          Safety:
          - Workflow 44C source is pinned by Git blob
          - Workflow 17 source is pinned by Git blob
          - their approved run blocks are extracted directly
          - cumulative baseline is committed before SUSFS integration
          - this isolates the SUSFS/ReSukiSU integration diff
          - the old approved adaptation diff must remain byte-identical

          Purpose:
          - prove old ReSukiSU/SUSFS integration applies unchanged
            on top of the cumulative corrected kernel
          - resolve the NEW exact cumulative ReSukiSU/SUSFS .config
          - produce hashes for the subsequent full build

          No kernel Image build.
          No boot.img.
          No flashable ZIP.
          No device access.
          No flashing.
          EOF

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            patch \
            python3 \
            python-is-python3 \
            rsync \
            xz-utils \
            zstd

      - name: Install exact Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz" \
            -o "${RUNNER_TEMP}/clang-r416183b.tar.gz"

          tar \
            -xzf "${RUNNER_TEMP}/clang-r416183b.tar.gz" \
            -C "$TOOLCHAIN_DIR"

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

          "$TOOLCHAIN_DIR/bin/clang" --version \
            | tee "$ARTIFACT_DIR/clang-version.txt"

          "$TOOLCHAIN_DIR/bin/ld.lld" --version \
            | tee -a "$ARTIFACT_DIR/clang-version.txt"

          if ! "$TOOLCHAIN_DIR/bin/clang" --version \
            | grep -q 'r416183b'
          then
            echo "ERROR: expected clang-r416183b"
            exit 1
          fi

      - name: Checkout exact workflow references
        uses: actions/checkout@v7
        with:
          repository: Chrizz100/veux-resukisu-builder
          ref: main
          fetch-depth: 1
          path: workflow-reference
          persist-credentials: false

      - name: Verify Workflow 17 and 44C blobs
        shell: bash
        run: |
          set -euo pipefail

          W17=".github/workflows/17-susfs-final-release-candidate.yml"
          W44=".github/workflows/44C-restore-cpufreq-min-max-sysfs-full-build.yml"

          ACTUAL17="$(
            git -C "$REFERENCE_DIR" \
              hash-object \
              "$W17"
          )"

          ACTUAL44="$(
            git -C "$REFERENCE_DIR" \
              hash-object \
              "$W44"
          )"

          if [ "$ACTUAL17" != "$WORKFLOW17_BLOB" ]; then
            echo "ERROR: Workflow 17 changed"
            echo "Expected blob: $WORKFLOW17_BLOB"
            echo "Actual blob:   $ACTUAL17"
            exit 1
          fi

          if [ "$ACTUAL44" != "$WORKFLOW44C_BLOB" ]; then
            echo "ERROR: Workflow 44C changed"
            echo "Expected blob: $WORKFLOW44C_BLOB"
            echo "Actual blob:   $ACTUAL44"
            exit 1
          fi

          {
            echo "WORKFLOW17_BLOB=$ACTUAL17"
            echo "WORKFLOW17_REFERENCE=PASS"
            echo "WORKFLOW44C_BLOB=$ACTUAL44"
            echo "WORKFLOW44C_REFERENCE=PASS"
          } | tee "$ARTIFACT_DIR/WORKFLOW-REFERENCE-STATE.txt"

      - name: Create exact run block extractor
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/extract-run-block.py" <<'PY'
          import sys
          from pathlib import Path

          if len(sys.argv) != 4:
              raise SystemExit(
                  "usage: extract-run-block.py WORKFLOW STEP_NAME OUTPUT"
              )

          workflow = Path(sys.argv[1])
          step_name = sys.argv[2]
          output = Path(sys.argv[3])

          lines = workflow.read_text(
              encoding="utf-8"
          ).splitlines(
              keepends=True
          )

          marker = f"      - name: {step_name}"

          starts = [
              i
              for i, line in enumerate(lines)
              if line.rstrip("\n") == marker
          ]

          if len(starts) != 1:
              raise SystemExit(
                  f"{step_name!r}: expected one step, got {len(starts)}"
              )

          start = starts[0]

          run_index = None

          for i in range(start + 1, len(lines)):
              if (
                  i > start + 1
                  and lines[i].startswith("      - name: ")
              ):
                  break

              if lines[i].strip() == "run: |":
                  run_index = i
                  break

          if run_index is None:
              raise SystemExit(
                  f"{step_name!r}: run block not found"
              )

          end = len(lines)

          for i in range(run_index + 1, len(lines)):
              if lines[i].startswith("      - name: "):
                  end = i
                  break

          block = lines[
              run_index + 1:
              end
          ]

          nonblank = [
              line
              for line in block
              if line.strip()
          ]

          if not nonblank:
              raise SystemExit(
                  f"{step_name!r}: empty run block"
              )

          def leading_spaces(line):
              return len(line) - len(line.lstrip(" "))

          indent = min(
              leading_spaces(line)
              for line in nonblank
          )

          if indent < 10:
              raise SystemExit(
                  f"{step_name!r}: unexpected indentation {indent}"
              )

          extracted = "".join(
              line[indent:]
              if line.strip()
              else "\n"
              for line in block
          )

          output.write_text(
              extracted,
              encoding="utf-8"
          )
          PY

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/44C-restore-cpufreq-min-max-sysfs-full-build.yml" \
            "Restore standard CPUFreq min max sysfs behavior" \
            "${RUNNER_TEMP}/extractor-selftest.sh"

          grep -qF \
            'SCALING_MIN_WRITE_NOOP_REMOVED=YES' \
            "${RUNNER_TEMP}/extractor-selftest.sh"

          echo "RUN_BLOCK_EXTRACTOR=PASS" \
            | tee "$ARTIFACT_DIR/RUN-BLOCK-EXTRACTOR.txt"

      - name: Checkout exact VEUX source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: "20240619"
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Recreate exact Candidate 2
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          BASE_SHA="$(git rev-parse HEAD)"
          BASE_TREE="$(git rev-parse HEAD^{tree})"

          git remote remove android-common 2>/dev/null || true

          git remote add \
            android-common \
            https://android.googlesource.com/kernel/common

          git fetch \
            --no-tags \
            android-common \
            "$COMMON_REF"

          COMMON_SHA="$(git rev-parse FETCH_HEAD)"

          git update-ref \
            refs/remotes/android-common/audit-base \
            "$COMMON_SHA"

          git merge \
            --no-edit \
            "$COMMON_SHA"

          MERGED_SHA="$(git rev-parse HEAD)"
          MERGED_TREE="$(git rev-parse HEAD^{tree})"

          git cat-file -e \
            "${STABILITY_REVERT}^{commit}"

          git revert \
            --no-edit \
            "$STABILITY_REVERT"

          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"

          KERNEL_VERSION="$(make -s kernelversion)"

          if [ "$KERNEL_VERSION" != "5.4.274" ]; then
            echo "ERROR: expected Linux 5.4.274"
            exit 1
          fi

          if [ "$CANDIDATE_TREE" != "$EXPECTED_CANDIDATE_TREE" ]; then
            echo "ERROR: Candidate 2 tree mismatch"
            echo "Expected: $EXPECTED_CANDIDATE_TREE"
            echo "Actual:   $CANDIDATE_TREE"
            exit 1
          fi

          {
            echo "CANDIDATE_TIP=$CANDIDATE_SHA"
            echo "COMMON_SHA=$COMMON_SHA"
          } >> "$GITHUB_ENV"

          {
            echo "BASE_SHA=$BASE_SHA"
            echo "BASE_TREE=$BASE_TREE"
            echo "COMMON_SHA=$COMMON_SHA"
            echo "MERGED_SHA=$MERGED_SHA"
            echo "MERGED_TREE=$MERGED_TREE"
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "CANDIDATE_TREE=$CANDIDATE_TREE"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
          } | tee "$ARTIFACT_DIR/IDENTITY.txt"

      - name: Fetch official Xiaomi VEUX reference
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git remote remove xiaomi 2>/dev/null || true

          git remote add \
            xiaomi \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git

          git fetch \
            --no-tags \
            xiaomi \
            "+refs/heads/${STOCK_REF}:refs/remotes/xiaomi/${STOCK_REF}"

          STOCK_SHA="$(
            git rev-parse \
              "xiaomi/${STOCK_REF}"
          )"

          {
            echo "STOCK_REF=$STOCK_REF"
            echo "STOCK_SHA=$STOCK_SHA"
          } | tee "$ARTIFACT_DIR/XIAOMI-REFERENCE.txt"

      - name: Reapply exact approved 44C cumulative corrections
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          W44="$REFERENCE_DIR/.github/workflows/44C-restore-cpufreq-min-max-sysfs-full-build.yml"
          EXTRACTOR="${RUNNER_TEMP}/extract-run-block.py"

          STEPS=(
            "Restore Xiaomi idle sleep policy"
            "Verify exact active CPUFreq lineage"
            "Restore standard CPUFreq min max sysfs behavior"
            "Verify corrected store one matches Xiaomi and Common"
            "Restore standard schedutil behavior"
            "Remove custom HZ100"
            "Restore standard load balance capacity rate limit"
            "Apply proven CASS MaxFreq Thermal patch"
            "Restore cumulative VEUX defconfig"
            "Restore exact Xiaomi VEUX PELT8"
            "Verify complete cumulative source state"
          )

          : > "$ARTIFACT_DIR/44C-REUSED-STEPS.txt"

          INDEX=0

          for STEP in "${STEPS[@]}"; do
            INDEX=$((INDEX + 1))

            SCRIPT="$RUNNER_TEMP/44c-step-${INDEX}.sh"

            python3 \
              "$EXTRACTOR" \
              "$W44" \
              "$STEP" \
              "$SCRIPT"

            chmod +x "$SCRIPT"

            echo "RUNNING=$STEP" \
              | tee -a "$ARTIFACT_DIR/44C-REUSED-STEPS.txt"

            bash "$SCRIPT"

            echo "PASS=$STEP" \
              | tee -a "$ARTIFACT_DIR/44C-REUSED-STEPS.txt"
          done

          CPUFREQ_SHA="$(
            sha256sum drivers/cpufreq/cpufreq.c \
              | awk '{print $1}'
          )"

          LPM_SHA="$(
            sha256sum drivers/cpuidle/lpm-levels.c \
              | awk '{print $1}'
          )"

          CORE_SHA="$(
            sha256sum drivers/cpuidle/cpuidle.c \
              | awk '{print $1}'
          )"

          HEADER_SHA="$(
            sha256sum include/linux/cpuidle.h \
              | awk '{print $1}'
          )"

          SUGOV_SHA="$(
            sha256sum kernel/sched/cpufreq_schedutil.c \
              | awk '{print $1}'
          )"

          if [ "$CPUFREQ_SHA" != "$EXPECTED_CPUFREQ_AFTER_SHA256" ]; then
            echo "ERROR: 44C CPUFreq bytes not reproduced"
            exit 1
          fi

          if [ "$LPM_SHA" != "$EXPECTED_LPM_AFTER_SHA256" ]; then
            echo "ERROR: 44C lpm-levels bytes not reproduced"
            exit 1
          fi

          if [ "$CORE_SHA" != "$EXPECTED_CPUIDLE_CORE_AFTER_SHA256" ]; then
            echo "ERROR: 44C cpuidle core bytes not reproduced"
            exit 1
          fi

          if [ "$HEADER_SHA" != "$EXPECTED_CPUIDLE_HEADER_AFTER_SHA256" ]; then
            echo "ERROR: 44C cpuidle header bytes not reproduced"
            exit 1
          fi

          if [ "$SUGOV_SHA" != "$EXPECTED_SCHEDUTIL_AFTER_SHA256" ]; then
            echo "ERROR: 44C schedutil bytes not reproduced"
            exit 1
          fi

          {
            echo "CUMULATIVE_44C_REPLAY=PASS"
            echo "CPUFREQ_SHA256=$CPUFREQ_SHA"
            echo "LPM_SHA256=$LPM_SHA"
            echo "CPUIDLE_CORE_SHA256=$CORE_SHA"
            echo "CPUIDLE_HEADER_SHA256=$HEADER_SHA"
            echo "SCHEDUTIL_SHA256=$SUGOV_SHA"
          } | tee "$ARTIFACT_DIR/CUMULATIVE-44C-BYTE-STATE.txt"

      - name: Commit isolated cumulative baseline
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          git status --short \
            > "$ARTIFACT_DIR/CUMULATIVE-PRECOMMIT-STATUS.txt"

          git add -A

          git commit \
            -m "audit: exact cumulative 44C corrected baseline"

          CUMULATIVE_SHA="$(git rev-parse HEAD)"
          CUMULATIVE_TREE="$(git rev-parse HEAD^{tree})"

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: cumulative baseline not clean after commit"
            git status --short
            exit 1
          fi

          {
            echo "CUMULATIVE_SHA=$CUMULATIVE_SHA"
            echo "CUMULATIVE_TREE=$CUMULATIVE_TREE"
            echo "CUMULATIVE_BASELINE_CLEAN=YES"
          } | tee "$ARTIFACT_DIR/CUMULATIVE-BASELINE-IDENTITY.txt"

          {
            echo "CUMULATIVE_SHA=$CUMULATIVE_SHA"
            echo "CUMULATIVE_TREE=$CUMULATIVE_TREE"
          } >> "$GITHUB_ENV"

      - name: Verify clean pre SUSFS cumulative state
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          W17="$REFERENCE_DIR/.github/workflows/17-susfs-final-release-candidate.yml"

          SCRIPT="$RUNNER_TEMP/w17-pre-susfs.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$W17" \
            "Verify clean pre-SUSFS state" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Fetch exact approved SUSFS 2.2 backport
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$PATCH_DIR/susfs_patch_to_5.4-v2.2.00.patch"

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://raw.githubusercontent.com/${BACKPORT_REPO}/${BACKPORT_COMMIT}/${BACKPORT_PATCH_PATH}" \
            -o "$PATCH"

          ACTUAL_BLOB="$(
            git hash-object "$PATCH"
          )"

          ACTUAL_SHA="$(
            sha256sum "$PATCH" \
              | awk '{print $1}'
          )"

          if [ "$ACTUAL_BLOB" != "$BACKPORT_PATCH_BLOB" ]; then
            echo "ERROR: SUSFS patch Git blob mismatch"
            echo "Expected: $BACKPORT_PATCH_BLOB"
            echo "Actual:   $ACTUAL_BLOB"
            exit 1
          fi

          if [ "$ACTUAL_SHA" != "$BACKPORT_PATCH_SHA256" ]; then
            echo "ERROR: SUSFS patch SHA-256 mismatch"
            echo "Expected: $BACKPORT_PATCH_SHA256"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

          cp \
            "$PATCH" \
            "$ARTIFACT_DIR/susfs_patch_to_5.4-v2.2.00.patch"

          {
            echo "BACKPORT_REPO=$BACKPORT_REPO"
            echo "BACKPORT_COMMIT=$BACKPORT_COMMIT"
            echo "BACKPORT_PATCH_GIT_BLOB=$ACTUAL_BLOB"
            echo "BACKPORT_PATCH_SHA256=$ACTUAL_SHA"
          } | tee "$ARTIFACT_DIR/PATCH-SOURCE.txt"

      - name: Apply exact Workflow 17 SUSFS base
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          W17="$REFERENCE_DIR/.github/workflows/17-susfs-final-release-candidate.yml"

          SCRIPT="$RUNNER_TEMP/w17-susfs-base.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$W17" \
            "Apply SUSFS base and verify known VEUX reject" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Replace legacy KernelSU with exact Workflow 17 ReSukiSU
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          W17="$REFERENCE_DIR/.github/workflows/17-susfs-final-release-candidate.yml"

          SCRIPT="$RUNNER_TEMP/w17-resukisu.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$W17" \
            "Replace legacy KernelSU with pinned ReSukiSU" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

          ACTUAL_KSU="$(
            git -C KernelSU rev-parse HEAD
          )"

          if [ "$ACTUAL_KSU" != "$RESUKISU_COMMIT" ]; then
            echo "ERROR: ReSukiSU identity mismatch"
            exit 1
          fi

          {
            echo "RESUKISU_COMMIT=$ACTUAL_KSU"
            echo "RESUKISU_IDENTITY=PASS"
          } | tee "$ARTIFACT_DIR/RESUKISU-IDENTITY.txt"

      - name: Apply exact Workflow 17 warning clean adaptation
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          W17="$REFERENCE_DIR/.github/workflows/17-susfs-final-release-candidate.yml"

          SCRIPT="$RUNNER_TEMP/w17-warning-clean.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$W17" \
            "Apply exact warning-clean VEUX SUSFS and ReSukiSU adaptation" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

          DIFF="$ARTIFACT_DIR/VEUX-SUSFS-2.2-WARNING-CLEAN.diff"

          if [ ! -s "$DIFF" ]; then
            echo "ERROR: Workflow 17 adaptation diff missing"
            exit 1
          fi

          DIFF_SHA="$(
            sha256sum "$DIFF" \
              | awk '{print $1}'
          )"

          if [ "$DIFF_SHA" != "$EXPECTED_WARNING_CLEAN_DIFF_SHA256" ]; then
            echo "ERROR: approved Workflow 17 integration changed"
            echo "Expected: $EXPECTED_WARNING_CLEAN_DIFF_SHA256"
            echo "Actual:   $DIFF_SHA"
            exit 1
          fi

          {
            echo "WORKFLOW17_WARNING_CLEAN_ADAPTATION=PASS"
            echo "ADAPTATION_DIFF_SHA256=$DIFF_SHA"
            echo "ADAPTATION_BYTE_IDENTICAL_TO_WORKFLOW17=YES"
          } | tee "$ARTIFACT_DIR/INTEGRATION-ADAPTATION-STATE.txt"

      - name: Verify cumulative corrections survived integration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CPUFREQ_SHA="$(
            sha256sum drivers/cpufreq/cpufreq.c \
              | awk '{print $1}'
          )"

          LPM_SHA="$(
            sha256sum drivers/cpuidle/lpm-levels.c \
              | awk '{print $1}'
          )"

          CORE_SHA="$(
            sha256sum drivers/cpuidle/cpuidle.c \
              | awk '{print $1}'
          )"

          HEADER_SHA="$(
            sha256sum include/linux/cpuidle.h \
              | awk '{print $1}'
          )"

          SUGOV_SHA="$(
            sha256sum kernel/sched/cpufreq_schedutil.c \
              | awk '{print $1}'
          )"

          if [ "$CPUFREQ_SHA" != "$EXPECTED_CPUFREQ_AFTER_SHA256" ]; then
            echo "ERROR: ReSukiSU/SUSFS changed corrected cpufreq.c"
            exit 1
          fi

          if [ "$LPM_SHA" != "$EXPECTED_LPM_AFTER_SHA256" ]; then
            echo "ERROR: ReSukiSU/SUSFS changed corrected lpm-levels.c"
            exit 1
          fi

          if [ "$CORE_SHA" != "$EXPECTED_CPUIDLE_CORE_AFTER_SHA256" ]; then
            echo "ERROR: ReSukiSU/SUSFS changed corrected cpuidle.c"
            exit 1
          fi

          if [ "$HEADER_SHA" != "$EXPECTED_CPUIDLE_HEADER_AFTER_SHA256" ]; then
            echo "ERROR: ReSukiSU/SUSFS changed corrected cpuidle.h"
            exit 1
          fi

          if [ "$SUGOV_SHA" != "$EXPECTED_SCHEDUTIL_AFTER_SHA256" ]; then
            echo "ERROR: ReSukiSU/SUSFS changed corrected schedutil"
            exit 1
          fi

          grep -qx \
            '#define LOAD_AVG_PERIOD 8' \
            kernel/sched/sched-pelt.h

          grep -qx \
            'CONFIG_CPUSETS=y' \
            arch/arm64/configs/veux_defconfig

          grep -qx \
            '# CONFIG_SPRD_ROTATION_TASK is not set' \
            arch/arm64/configs/veux_defconfig

          if grep -qE \
            '^CONFIG_HZ_(100|250|300|1000)=y$' \
            arch/arm64/configs/veux_defconfig
          then
            echo "ERROR: explicit HZ selection returned"
            exit 1
          fi

          grep -qF \
            'time_after_eq(jiffies, sg->sgc->next_update)' \
            kernel/sched/fair.c

          grep -qF \
            'arch_scale_max_freq_capacity(NULL, cpu)' \
            kernel/sched/cass.c

          grep -qF \
            'curr->cap_no_therm' \
            kernel/sched/cass.c

          {
            echo "CUMULATIVE_CORRECTIONS_SURVIVED_INTEGRATION=YES"
            echo "CPUFREQ_SHA256=$CPUFREQ_SHA"
            echo "LPM_SHA256=$LPM_SHA"
            echo "CPUIDLE_CORE_SHA256=$CORE_SHA"
            echo "CPUIDLE_HEADER_SHA256=$HEADER_SHA"
            echo "SCHEDUTIL_SHA256=$SUGOV_SHA"
            echo "PELT_PERIOD=8"
            echo "CPUSETS_ENABLED=YES"
            echo "SPRD_ROTATION_DISABLED=YES"
            echo "EXPLICIT_HZ_SELECTION=NO"
            echo "LB_CAPACITY_RATE_LIMIT=RESTORED"
            echo "CASS_MAXFREQ=YES"
          } | tee "$ARTIFACT_DIR/CUMULATIVE-POST-INTEGRATION-STATE.txt"

      - name: Resolve new cumulative ReSukiSU SUSFS config
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          rm -rf "$OUT_DIR"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            veux_defconfig \
            2>&1 \
            | tee "$ARTIFACT_DIR/defconfig.log"

          CONFIG="$OUT_DIR/.config"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: resolved config missing"
            exit 1
          fi

          REQUIRED_Y=(
            CONFIG_64BIT
            CONFIG_THREAD_INFO_IN_TASK
            CONFIG_KALLSYMS
            CONFIG_CC_IS_CLANG
            CONFIG_LD_IS_LLD
            CONFIG_CPUSETS
            CONFIG_SCHED_CASS
            CONFIG_HZ_250
            CONFIG_CPU_FREQ
            CONFIG_CPU_FREQ_GOV_SCHEDUTIL
            CONFIG_ARM_QCOM_CPUFREQ_HW
            CONFIG_CPU_IDLE
            CONFIG_ARM_QCOM_LPM_CPUIDLE
            CONFIG_KSU
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          for SYMBOL in "${REQUIRED_Y[@]}"; do
            if ! grep -qx \
              "${SYMBOL}=y" \
              "$CONFIG"
            then
              echo "ERROR: required config not y: $SYMBOL"
              exit 1
            fi
          done

          grep -qx \
            'CONFIG_HZ=250' \
            "$CONFIG"

          if grep -qx \
            'CONFIG_HZ_100=y' \
            "$CONFIG"
          then
            echo "ERROR: HZ100 returned"
            exit 1
          fi

          if ! grep -qx \
            '# CONFIG_SPRD_ROTATION_TASK is not set' \
            "$CONFIG"
          then
            echo "ERROR: SPRD rotation returned"
            exit 1
          fi

          FORBIDDEN_Y=(
            CONFIG_KSU_TRACEPOINT_HOOK
            CONFIG_KSU_MANUAL_HOOK
            CONFIG_DEBUG_KERNEL
            CONFIG_KALLSYMS_ALL
          )

          for SYMBOL in "${FORBIDDEN_Y[@]}"; do
            if grep -qx \
              "${SYMBOL}=y" \
              "$CONFIG"
            then
              echo "ERROR: forbidden config active: $SYMBOL"
              exit 1
            fi
          done

          CONFIG_SHA="$(
            sha256sum "$CONFIG" \
              | awk '{print $1}'
          )"

          cp \
            "$CONFIG" \
            "$ARTIFACT_DIR/final-cumulative.config"

          {
            echo "NEW_CUMULATIVE_CONFIG_SHA256=$CONFIG_SHA"
            echo "CONFIG_CPUSETS=y"
            echo "CONFIG_SCHED_CASS=y"
            echo "CONFIG_HZ_250=y"
            echo "CONFIG_HZ=250"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
            echo "SPRD_ROTATION_DISABLED=YES"
          } | tee "$ARTIFACT_DIR/NEW-CONFIG-IDENTITY.txt"

          echo "NEW_CUMULATIVE_CONFIG_SHA256=$CONFIG_SHA" \
            >> "$GITHUB_ENV"

      - name: Final integration source audit
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -type f \
            \( -name '*.rej' -o -name '*.orig' \) \
            -print \
            | sort \
            > "$ARTIFACT_DIR/REMAINING-REJECT-ORIG.txt"

          if [ -s "$ARTIFACT_DIR/REMAINING-REJECT-ORIG.txt" ]; then
            echo "ERROR: reject/orig files remain"
            cat "$ARTIFACT_DIR/REMAINING-REJECT-ORIG.txt"
            exit 1
          fi

          git diff --check \
            > "$ARTIFACT_DIR/FINAL-GIT-DIFF-CHECK.txt" \
            2>&1

          git status --short \
            > "$ARTIFACT_DIR/FINAL-GIT-STATUS.txt"

          ACTUAL_KSU="$(
            git -C KernelSU rev-parse HEAD
          )"

          if [ "$ACTUAL_KSU" != "$RESUKISU_COMMIT" ]; then
            echo "ERROR: ReSukiSU commit changed"
            exit 1
          fi

          if [ \
            "$(readlink -f drivers/kernelsu)" != \
            "$(readlink -f KernelSU/kernel)" \
          ]; then
            echo "ERROR: drivers/kernelsu symlink changed"
            exit 1
          fi

          ADAPT_SHA="$(
            sha256sum \
              "$ARTIFACT_DIR/VEUX-SUSFS-2.2-WARNING-CLEAN.diff" \
              | awk '{print $1}'
          )"

          if [ "$ADAPT_SHA" != "$EXPECTED_WARNING_CLEAN_DIFF_SHA256" ]; then
            echo "ERROR: final adaptation hash mismatch"
            exit 1
          fi

          {
            echo "FINAL_INTEGRATION_SOURCE_AUDIT=PASS"
            echo "REJECT_FILES=0"
            echo "ORIG_FILES=0"
            echo "GIT_DIFF_CHECK=PASS"
            echo "RESUKISU_COMMIT=$ACTUAL_KSU"
            echo "SUSFS_BACKPORT_SHA256=$BACKPORT_PATCH_SHA256"
            echo "WARNING_CLEAN_ADAPTATION_SHA256=$ADAPT_SHA"
            echo "NEW_CUMULATIVE_CONFIG_SHA256=$NEW_CUMULATIVE_CONFIG_SHA256"
          } | tee "$ARTIFACT_DIR/FINAL-INTEGRATION-SOURCE-AUDIT.txt"

      - name: Prepare final preflight result
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "RESULT=PASS_PREFLIGHT"
            echo "BASE_CANDIDATE_TREE=$EXPECTED_CANDIDATE_TREE"

            echo "CUMULATIVE_44C_REPLAY=PASS"
            echo "CUMULATIVE_BASELINE_SHA=$CUMULATIVE_SHA"
            echo "CUMULATIVE_BASELINE_TREE=$CUMULATIVE_TREE"

            echo "CPUFREQ_AFTER_SHA256=$EXPECTED_CPUFREQ_AFTER_SHA256"
            echo "SCALING_MIN_WRITE_NOOP_REMOVED=YES"
            echo "SCALING_MAX_BELOW_MIN_CLAMP_REMOVED=YES"

            echo "IDLE_FEATURE_CHAIN_REVERSED=YES"
            echo "DISPLAY_COUPLED_SLEEP_POLICY_REMOVED=YES"

            echo "SCHEDUTIL_AFTER_SHA256=$EXPECTED_SCHEDUTIL_AFTER_SHA256"
            echo "SCHEDUTIL_STANDARD=YES"

            echo "CASS_PATCH_SHA256=$EXPECTED_CASS_DIFF_SHA256"
            echo "CASS_MAXFREQ=YES"

            echo "SPRD_ROTATION_DISABLED=YES"
            echo "LB_CAPACITY_RATE_LIMIT=RESTORED"
            echo "CPUSETS_ENABLED=YES"
            echo "PELT_RESTORED_PERIOD=8"
            echo "HZ_RESOLVED_CHOICE=250"

            echo "RESUKISU_COMMIT=$RESUKISU_COMMIT"
            echo "SUSFS_BACKPORT_COMMIT=$BACKPORT_COMMIT"
            echo "SUSFS_BACKPORT_SHA256=$BACKPORT_PATCH_SHA256"

            echo "WORKFLOW17_WARNING_CLEAN_ADAPTATION=PASS"
            echo "WARNING_CLEAN_ADAPTATION_SHA256=$EXPECTED_WARNING_CLEAN_DIFF_SHA256"
            echo "ADAPTATION_BYTE_IDENTICAL_TO_WORKFLOW17=YES"

            echo "NEW_CUMULATIVE_CONFIG_SHA256=$NEW_CUMULATIVE_CONFIG_SHA256"

            echo "REJECT_FILES=0"
            echo "ORIG_FILES=0"
            echo "GIT_DIFF_CHECK=PASS"

            echo "KERNEL_IMAGE_BUILT=NO"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "DEVICE_FLASHED=NO"
          } | tee "$ARTIFACT_DIR/RESULT.txt"

      - name: Upload final cumulative integration preflight
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-Final-ReSukiSU-SUSFS-Cumulative-Integration-Preflight
          path: final-integration-preflight/
          if-no-files-found: error
          retention-days: 30
