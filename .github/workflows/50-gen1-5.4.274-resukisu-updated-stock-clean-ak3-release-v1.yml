            'do_devicecheck;' \
            "$PACKAGE/META-INF/com/google/android/update-binary"

          grep -Fq \
            'do_versioncheck;' \
            "$PACKAGE/META-INF/com/google/android/update-binary"

          grep -Fq \
            'do_levelcheck;' \
            "$PACKAGE/META-INF/com/google/android/update-binary"

          grep -Fq \
            'do_vendorlevelcheck;' \
            "$PACKAGE/META-INF/com/google/android/update-binary"

          python3 - "$PACKAGE" <<'PY'
