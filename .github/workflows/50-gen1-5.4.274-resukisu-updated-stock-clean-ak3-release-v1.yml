name: 50 - GEN1 5.4.274 Updated Stock CLEAN AK3 Release v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gen1-50-v1-stock-clean-ak3-${{ github.ref }}
  cancel-in-progress: false

env:
  W49_RUN_ID: "32629397945"
  W49_ARTIFACT_NAME: "GEN1_49_V3_5.4.274_ReSukiSU_B2AC_SUSFS_2.2_FULL_BUILD-1"
  W49_IMAGE_SHA256: "0a00b12dc8d4f114b4343f473054b03d6e32767961077e43d345f0dc7271b4d3"
  W49_IMAGE_BYTES: "29843968"
  W49_DTB_SHA256: "42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37"
  W49_CONFIG_SHA256: "d7cd955abd59da45804acc9c5e450cf8fc953da3e66bbc274212b40ee9a0b372"
  W49_KERNEL_RELEASE: "5.4.274~positron/4b671233"
  UPDATED_RESUKISU_COMMIT: "b2ac2fc8703ce9f5226e2a38a59f8b72f8a3005c"

  W21_ARTIFACT_NAME: "veux-5.4.274-resukisu-susfs-2.2-workflow21-exact-w19-final-flashable-1"
  W21_FINAL_ZIP_NAME: "VEUX_5.4.274_ReSukiSU_SUSFS_2.2_EXACT_W19_BOOT_FLASHABLE.zip"
  W21_FINAL_ZIP_SHA256: "b6f9c22582cf90aca3bd40d946f44f465f3b4324d377cabdd9a23668113fe4f2"
  W21_FINAL_ZIP_BYTES: "75516120"

  STOCK_ROM_VERSION: "OS1.0.12.0.TKCMIXM"
  STOCK_ANDROID_VERSION: "13"
  STOCK_SECURITY_PATCH: "2024-12"
  STOCK_BOOT_SHA256: "ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5"
  STOCK_BOOT_BYTES: "134217728"
  OLD_CUSTOM_BOOT_SHA256: "2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e"
  OLD_KERNEL_SHA256: "e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96"
  OLD_KERNEL_BYTES: "29839872"
  STOCK_RAMDISK_SHA256: "0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a"
  ROLLBACK_GZIP_SHA256: "9a1532ccfc57b465256bba97863f927b80823fa8812a4d13e4f4c8bf9af0c78b"

  AK3_CORE_SHA256: "f7a51cfe2e093016a34a76e16de6c9885c2d1992c3482fcabc668680e1f0f6bb"
  BUSYBOX_SHA256: "66436dc1e97d22886ed2d35bd69a9cb82bb0fdba4e4267c5184cee1d39a2f5f4"
  MAGISKBOOT_SHA256: "0b19472b291ce9033c29a83155ff4c1b18be9d1d17d901d63e50f57436378762"

  RELEASE_ZIP_NAME: "VEUX_5.4.274_ReSukiSU_B2AC_SUSFS_2.2_HyperOS_OS1.0.12.0_TKCMIXM_AK3_CLEAN.zip"
  SOURCE_DATE_EPOCH: "1787184000"

jobs:
  release:
    name: Build and runtime-audit updated GEN1 Stock CLEAN AK3 package
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      WORK: ${{ github.workspace }}/gen1-50-v1
      INPUTS: ${{ github.workspace }}/gen1-50-v1/inputs
      W49: ${{ github.workspace }}/gen1-50-v1/w49
      W21: ${{ github.workspace }}/gen1-50-v1/w21
      OLD_PACKAGE: ${{ github.workspace }}/gen1-50-v1/old-package
      PACKAGE: ${{ github.workspace }}/gen1-50-v1/package
      BUILD: ${{ github.workspace }}/gen1-50-v1/build
      HARNESS: ${{ github.workspace }}/gen1-50-v1/harness
      OUTPUT: ${{ github.workspace }}/gen1-50-v1/output

    steps:
      - name: Prepare GEN1 W50 workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORK"
          mkdir -p \
            "$INPUTS" \
            "$W49" \
            "$W21" \
            "$OLD_PACKAGE" \
            "$PACKAGE" \
            "$BUILD" \
            "$HARNESS" \
            "$OUTPUT"

          {
            echo "AUDIT=GEN1_50_V1_UPDATED_STOCK_CLEAN_AK3_RELEASE"
            echo "KERNEL_VERSION=5.4.274"
            echo "DEVICE=veux"
            echo "ROM_FAMILY=Xiaomi_HyperOS_Stock"
            echo "ROM_VERSION=$STOCK_ROM_VERSION"
            echo "ANDROID_VERSION=$STOCK_ANDROID_VERSION"
            echo "SECURITY_PATCH=$STOCK_SECURITY_PATCH"
            echo "RESUKISU_COMMIT=$UPDATED_RESUKISU_COMMIT"
            echo "SUSFS_VERSION=v2.2.0"
            echo "PACKAGING_MODEL=ANYKERNEL3_FRAMEWORK_DIRECT_FULL_BOOT_PAYLOAD"
            echo "RUNTIME_REPACK=NO"
            echo "DEVICE_ACCESS=NO"
            echo "ADB_USED=NO"
            echo "FASTBOOT_USED=NO"
            echo "FLASHING_PERFORMED=NO"
          } | tee "$OUTPUT/W50-SCOPE.txt"

      - name: Download exact W49 v3 build and historical W21 installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$W49_RUN_ID/artifacts?per_page=100&page=1" \
            -o "$WORK/w49-artifacts.json"

          W49_MATCHES="$(
            jq \
              --arg NAME "$W49_ARTIFACT_NAME" \
              '[.artifacts[] | select(.name == $NAME and .expired == false)]' \
              "$WORK/w49-artifacts.json"
          )"

          test "$(jq 'length' <<< "$W49_MATCHES")" = "1"

          W49_SELECTED="$(jq '.[0]' <<< "$W49_MATCHES")"
          W49_URL="$(jq -r '.archive_download_url' <<< "$W49_SELECTED")"

          jq . <<< "$W49_SELECTED" \
            > "$OUTPUT/W49-ARTIFACT-METADATA.json"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$W49_URL" \
            -o "$INPUTS/w49.zip"

          unzip -t "$INPUTS/w49.zip" \
            > "$OUTPUT/W49-OUTER-ZIP-CRC.txt"

          ALL="$WORK/repository-artifacts.ndjson"
          : > "$ALL"

          page=1
          while :; do
            PAGE="$WORK/repository-artifacts-${page}.json"

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=${page}" \
              -o "$PAGE"

            COUNT="$(jq '.artifacts | length' "$PAGE")"
            jq -c '.artifacts[]' "$PAGE" >> "$ALL"

            if [ "$COUNT" -lt 100 ]; then
              break
            fi

            page=$((page + 1))

            [ "$page" -le 30 ] || {
              echo "ERROR: artifact pagination safety limit"
              exit 1
            }
          done

          W21_MATCHES="$(
            jq -s \
              --arg NAME "$W21_ARTIFACT_NAME" \
              '[.[] | select(.name == $NAME and .expired == false)] | sort_by(.created_at)' \
              "$ALL"
          )"

          test "$(jq 'length' <<< "$W21_MATCHES")" -ge 1

          W21_SELECTED="$(jq '.[-1]' <<< "$W21_MATCHES")"
          W21_URL="$(jq -r '.archive_download_url' <<< "$W21_SELECTED")"

          jq . <<< "$W21_SELECTED" \
            > "$OUTPUT/W21-ARTIFACT-METADATA.json"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$W21_URL" \
            -o "$INPUTS/w21.zip"

          unzip -t "$INPUTS/w21.zip" \
            > "$OUTPUT/W21-OUTER-ZIP-CRC.txt"

          unzip -q "$INPUTS/w49.zip" -d "$W49"
          unzip -q "$INPUTS/w21.zip" -d "$W21"

      - name: Verify exact successful W49 v3 updated kernel
        shell: bash
        run: |
          set -euo pipefail

          for F in \
            Image \
            veux.dtb \
            final.config \
            W49-FINAL-VERDICT.txt \
            RESUKISU-UPSTREAM-UPDATE.txt \
            SOURCE-ADAPTATION-CHECK.txt \
            REPRODUCIBILITY.txt \
            BUILD-IDENTITY-AUDIT.txt \
            kernelrelease.txt \
            resukisu-commit.txt
          do
            test -s "$W49/$F"
          done

          grep -Fxq \
            'FINAL_RESULT=PASS_GEN1_49_V3_LINUX_5_4_274_RESUKISU_B2AC_SUSFS_2_2_FULL_REPRODUCIBLE_BUILD' \
            "$W49/W49-FINAL-VERDICT.txt"

          grep -Fxq \
            "RESUKISU_UPDATE_TO=$UPDATED_RESUKISU_COMMIT" \
            "$W49/W49-FINAL-VERDICT.txt"

          grep -Fxq \
            'RESUKISU_UPSTREAM_COMMITS=18' \
            "$W49/W49-FINAL-VERDICT.txt"

          grep -Fxq \
            'SUSFS_VERSION=v2.2.0' \
            "$W49/W49-FINAL-VERDICT.txt"

          grep -Fxq \
            'SUSFS_FIXSET_CHANGED=NO' \
            "$W49/W49-FINAL-VERDICT.txt"

          grep -Fxq \
            'FULL_KERNEL_BUILD=PASS' \
            "$W49/W49-FINAL-VERDICT.txt"

          grep -Fxq \
            'BUILD_A_B_REPRODUCIBILITY=PASS' \
            "$W49/W49-FINAL-VERDICT.txt"

          grep -Fxq \
            'REPRODUCIBILITY=PASS' \
            "$W49/REPRODUCIBILITY.txt"

          grep -Fxq \
            'IMAGE_BYTE_IDENTICAL=YES' \
            "$W49/REPRODUCIBILITY.txt"

          grep -Fxq \
            'VEUX_DTB_BYTE_IDENTICAL=YES' \
            "$W49/REPRODUCIBILITY.txt"

          grep -Fxq \
            'SOURCE_ADAPTATION=PASS' \
            "$W49/SOURCE-ADAPTATION-CHECK.txt"

          grep -Fxq \
            'OPEN_REDIRECT_SRCU_UAF_FIX_PRESENT=YES' \
            "$W49/SOURCE-ADAPTATION-CHECK.txt"

          grep -Fxq \
            'OPEN_REDIRECT_MAPS_POINTER_SRCU_FIX_PRESENT=YES' \
            "$W49/SOURCE-ADAPTATION-CHECK.txt"

          grep -Fxq \
            'RESUKISU_VERSION=v4.2.0-rc1-b2ac2fc8@ReSukiSU' \
            "$W49/BUILD-IDENTITY-AUDIT.txt"

          test "$(stat -c '%s' "$W49/Image")" = \
            "$W49_IMAGE_BYTES"

          test "$(sha256sum "$W49/Image" | awk '{print $1}')" = \
            "$W49_IMAGE_SHA256"

          test "$(sha256sum "$W49/veux.dtb" | awk '{print $1}')" = \
            "$W49_DTB_SHA256"

          test "$(sha256sum "$W49/final.config" | awk '{print $1}')" = \
            "$W49_CONFIG_SHA256"

          test "$(tr -d '\r\n' < "$W49/kernelrelease.txt")" = \
            "$W49_KERNEL_RELEASE"

          test "$(tr -d '\r\n' < "$W49/resukisu-commit.txt")" = \
            "$UPDATED_RESUKISU_COMMIT"

          {
            echo "W49_UPDATED_KERNEL_GATE=PASS"
            echo "IMAGE_SHA256=$W49_IMAGE_SHA256"
            echo "IMAGE_BYTES=$W49_IMAGE_BYTES"
            echo "DTB_SHA256=$W49_DTB_SHA256"
            echo "CONFIG_SHA256=$W49_CONFIG_SHA256"
            echo "KERNEL_RELEASE=$W49_KERNEL_RELEASE"
            echo "RESUKISU_COMMIT=$UPDATED_RESUKISU_COMMIT"
            echo "SUSFS_VERSION=v2.2.0"
          } | tee "$OUTPUT/W49-UPDATED-KERNEL-GATE.txt"

      - name: Verify historical W21 direct payload installer template
        shell: bash
        run: |
          set -euo pipefail

          FINAL_OLD="$W21/$W21_FINAL_ZIP_NAME"

          test -s "$FINAL_OLD"

          test "$(stat -c '%s' "$FINAL_OLD")" = \
            "$W21_FINAL_ZIP_BYTES"

          test "$(sha256sum "$FINAL_OLD" | awk '{print $1}')" = \
            "$W21_FINAL_ZIP_SHA256"

          unzip -t "$FINAL_OLD" \
            > "$OUTPUT/W21-FINAL-ZIP-CRC.txt"

          unzip -q "$FINAL_OLD" -d "$OLD_PACKAGE"

          (
            cd "$OLD_PACKAGE"
            sha256sum -c PACKAGE-SHA256SUMS
          ) > "$OUTPUT/W21-PACKAGE-SHA256SUMS.verify.txt"

          test "$(sha256sum "$OLD_PACKAGE/boot.img" | awk '{print $1}')" = \
            "$OLD_CUSTOM_BOOT_SHA256"

          test "$(sha256sum "$OLD_PACKAGE/rollback_stock_boot.img.gz" | awk '{print $1}')" = \
            "$ROLLBACK_GZIP_SHA256"

          gzip -t "$OLD_PACKAGE/rollback_stock_boot.img.gz"

          gzip -dc \
            "$OLD_PACKAGE/rollback_stock_boot.img.gz" \
            > "$BUILD/stock_boot.img"

          test "$(stat -c '%s' "$BUILD/stock_boot.img")" = \
            "$STOCK_BOOT_BYTES"

          test "$(sha256sum "$BUILD/stock_boot.img" | awk '{print $1}')" = \
            "$STOCK_BOOT_SHA256"

          test "$(sha256sum "$OLD_PACKAGE/tools/ak3-core.sh" | awk '{print $1}')" = \
            "$AK3_CORE_SHA256"

          test "$(sha256sum "$OLD_PACKAGE/tools/busybox" | awk '{print $1}')" = \
            "$BUSYBOX_SHA256"

          test "$(sha256sum "$OLD_PACKAGE/tools/magiskboot" | awk '{print $1}')" = \
            "$MAGISKBOOT_SHA256"

          grep -Fq \
            'device.name1=veux' \
            "$OLD_PACKAGE/anykernel.sh"

          grep -Fq \
            'supported.versions=13' \
            "$OLD_PACKAGE/anykernel.sh"

          grep -Fq \
            'supported.patchlevels=2024-12 - 2024-12' \
            "$OLD_PACKAGE/anykernel.sh"

          grep -Fq \
            'supported.vendorpatchlevels=2024-12 - 2024-12' \
            "$OLD_PACKAGE/anykernel.sh"

          grep -Fq \
            'restore_stock()' \
            "$OLD_PACKAGE/anykernel.sh"

          grep -Fq \
            'dd if="$PAYLOAD" of="$TARGET" bs=1048576' \
            "$OLD_PACKAGE/anykernel.sh"

          {
            echo "W21_DIRECT_INSTALLER_TEMPLATE_GATE=PASS"
            echo "FINAL_ZIP_SHA256=$W21_FINAL_ZIP_SHA256"
            echo "STOCK_BOOT_SHA256=$STOCK_BOOT_SHA256"
            echo "OLD_CUSTOM_BOOT_SHA256=$OLD_CUSTOM_BOOT_SHA256"
            echo "ROLLBACK_GZIP_SHA256=$ROLLBACK_GZIP_SHA256"
          } | tee "$OUTPUT/W21-TEMPLATE-GATE.txt"

      - name: Reconstruct updated Boot v3 payload twice with historical calibration
        shell: bash
        run: |
          set -euo pipefail

          python3 - \
            "$BUILD/stock_boot.img" \
            "$OLD_PACKAGE/boot.img" \
            "$W49/Image" \
            "$BUILD/updated-A.img" \
            "$BUILD/updated-B.img" \
            "$OUTPUT/W50-BOOT-BRIDGE.json" \
            "$OUTPUT/W50-BOOT-BRIDGE.txt" <<'PY'
          import hashlib
          import json
          import struct
          import sys
          from pathlib import Path

          stock_path = Path(sys.argv[1])
          old_boot_path = Path(sys.argv[2])
          new_image_path = Path(sys.argv[3])
          out_a = Path(sys.argv[4])
          out_b = Path(sys.argv[5])
          json_out = Path(sys.argv[6])
          text_out = Path(sys.argv[7])

          STOCK_SHA = "ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5"
          OLD_BOOT_SHA = "2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e"
          OLD_KERNEL_SHA = "e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96"
          NEW_IMAGE_SHA = "0a00b12dc8d4f114b4343f473054b03d6e32767961077e43d345f0dc7271b4d3"
          RAMDISK_SHA = "0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a"
          OLD_KERNEL_BYTES = 29839872

          stock = stock_path.read_bytes()
          old_boot = old_boot_path.read_bytes()
          new_image = new_image_path.read_bytes()

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def align(value, size=4096):
              return (value + size - 1) // size * size

          def need(condition, message):
              if not condition:
                  raise SystemExit("ERROR: " + message)

          def arm64_header(image):
              need(len(image) >= 64, "ARM64 Image too small")
              text_offset, image_size, flags = struct.unpack_from(
                  "<QQQ",
                  image,
                  8,
              )
              magic, res5 = struct.unpack_from("<II", image, 56)

              return {
                  "text_offset": text_offset,
                  "image_size": image_size,
                  "flags": flags,
                  "magic": magic,
                  "res5": res5,
              }

          def parse_footer(data):
              raw = data[-64:]
              need(raw[:4] == b"AVBf", "AVB footer magic")

              major, minor = struct.unpack_from(">II", raw, 4)
              original, offset, size = struct.unpack_from(
                  ">QQQ",
                  raw,
                  12,
              )

              need(
                  offset + size <= len(data) - 64,
                  "AVB footer geometry",
              )

              return {
                  "major": major,
                  "minor": minor,
                  "original": original,
                  "offset": offset,
                  "size": size,
                  "raw": raw,
                  "vbmeta": data[offset:offset + size],
              }

          def parse_vbmeta(vb):
              need(vb[:4] == b"AVB0", "AVB0 magic")

              auth_size, aux_size = struct.unpack_from(
                  ">QQ",
                  vb,
                  12,
              )
              algorithm_type = struct.unpack_from(
                  ">I",
                  vb,
                  28,
              )[0]
              values = struct.unpack_from(
                  ">QQQQQQQQQQQ",
                  vb,
                  32,
              )

              descriptors_offset = values[8]
              descriptors_size = values[9]

              aux_start = 256 + auth_size
              pos = aux_start + descriptors_offset
              end = pos + descriptors_size

              need(
                  end <= aux_start + aux_size,
                  "AVB descriptor geometry",
              )

              descriptors = []

              while pos < end:
                  tag, following = struct.unpack_from(
                      ">QQ",
                      vb,
                      pos,
                  )
                  raw = vb[pos:pos + 16 + following]

                  need(
                      len(raw) == 16 + following,
                      "truncated AVB descriptor",
                  )

                  item = {
                      "tag": tag,
                      "offset": pos,
                      "raw": raw,
                      "following": following,
                  }

                  if tag == 2:
                      image_size = struct.unpack_from(
                          ">Q",
                          raw,
                          16,
                      )[0]

                      algorithm = (
                          raw[24:56]
                          .split(b"\0", 1)[0]
                          .decode("ascii", "replace")
                      )

                      (
                          name_len,
                          salt_len,
                          digest_len,
                          dflags,
                      ) = struct.unpack_from(
                          ">IIII",
                          raw,
                          56,
                      )

                      q = 132

                      partition = raw[q:q + name_len].decode(
                          "ascii",
                          "replace",
                      )
                      q += name_len

                      salt = raw[q:q + salt_len]
                      q += salt_len

                      digest = raw[q:q + digest_len]

                      item.update({
                          "type": "hash",
                          "image_size": image_size,
                          "hash_algorithm": algorithm,
                          "partition": partition,
                          "salt": salt,
                          "digest": digest,
                          "digest_offset": pos + q,
                          "digest_len": digest_len,
                          "image_size_offset": pos + 16,
                          "flags": dflags,
                      })
                  else:
                      item["type"] = "other"

                  descriptors.append(item)
                  pos += 16 + following

              need(
                  pos == end,
                  "AVB descriptor parse end",
              )

              return {
                  "algorithm_type": algorithm_type,
                  "descriptors": descriptors,
              }

          def hash_descriptor(info, partition):
              found = [
                  d
                  for d in info["descriptors"]
                  if d.get("type") == "hash"
                  and d.get("partition") == partition
              ]

              need(
                  len(found) == 1,
                  f"one hash descriptor for {partition}",
              )

              return found[0]

          def verify_descriptor(data, descriptor):
              need(
                  descriptor["hash_algorithm"] == "sha256",
                  "AVB hash algorithm",
              )

              calculated = hashlib.sha256(
                  descriptor["salt"]
                  + data[:descriptor["image_size"]]
              ).digest()

              return (
                  calculated == descriptor["digest"],
                  calculated,
              )

          need(
              len(stock) == 134217728,
              "stock boot size",
          )
          need(
              sha(stock) == STOCK_SHA,
              "stock boot hash",
          )
          need(
              len(old_boot) == 134217728,
              "old custom boot size",
          )
          need(
              sha(old_boot) == OLD_BOOT_SHA,
              "old custom boot hash",
          )
          need(
              sha(new_image) == NEW_IMAGE_SHA,
              "new Image hash",
          )
          need(
              stock[:8] == b"ANDROID!",
              "stock Android boot magic",
          )
          need(
              old_boot[:8] == b"ANDROID!",
              "old Android boot magic",
          )

          (
              stock_kernel_size,
              ramdisk_size,
              _,
              header_size,
          ) = struct.unpack_from(
              "<4I",
              stock,
              8,
          )

          header_version = struct.unpack_from(
              "<I",
              stock,
              40,
          )[0]

          need(
              stock_kernel_size == 45480448,
              "stock kernel size",
          )
          need(
              ramdisk_size == 22061278,
              "stock ramdisk size",
          )
          need(
              header_size == 1580,
              "Boot v3 header size",
          )
          need(
              header_version == 3,
              "Boot v3 header version",
          )

          stock_ramdisk_offset = (
              4096 + align(stock_kernel_size)
          )

          ramdisk = stock[
              stock_ramdisk_offset:
              stock_ramdisk_offset + ramdisk_size
          ]

          need(
              sha(ramdisk) == RAMDISK_SHA,
              "stock ramdisk hash",
          )

          stock_footer = parse_footer(stock)

          need(
              stock_footer["major"] == 1
              and stock_footer["minor"] == 0,
              "stock AVB footer version",
          )
          need(
              stock_footer["size"] == 896,
              "embedded vbmeta size",
          )

          stock_embedded = parse_vbmeta(
              stock_footer["vbmeta"]
          )

          need(
              stock_embedded["algorithm_type"] == 0,
              "embedded vbmeta algorithm NONE",
          )

          stock_boot_desc = hash_descriptor(
              stock_embedded,
              "boot",
          )

          stock_ok, _ = verify_descriptor(
              stock,
              stock_boot_desc,
          )

          need(
              stock_ok,
              "stock embedded boot descriptor",
          )

          old_kernel_size = struct.unpack_from(
              "<I",
              old_boot,
              8,
          )[0]

          old_kernel = old_boot[
              4096:
              4096 + old_kernel_size
          ]

          need(
              old_kernel_size == OLD_KERNEL_BYTES,
              "historical custom kernel size",
          )
          need(
              sha(old_kernel) == OLD_KERNEL_SHA,
              "historical custom kernel hash",
          )

          def build_custom(image):
              new_ramdisk_offset = (
                  4096 + align(len(image))
              )
              new_payload_end = (
                  new_ramdisk_offset
                  + align(len(ramdisk))
              )

              output = bytearray(len(stock))
              header = bytearray(stock[:4096])

              struct.pack_into(
                  "<I",
                  header,
                  8,
                  len(image),
              )

              output[:4096] = header
              output[
                  4096:
                  4096 + len(image)
              ] = image
              output[
                  new_ramdisk_offset:
                  new_ramdisk_offset + len(ramdisk)
              ] = ramdisk

              new_vbmeta = bytearray(
                  stock_footer["vbmeta"]
              )

              struct.pack_into(
                  ">Q",
                  new_vbmeta,
                  stock_boot_desc[
                      "image_size_offset"
                  ],
                  new_payload_end,
              )

              digest = hashlib.sha256(
                  stock_boot_desc["salt"]
                  + bytes(output[:new_payload_end])
              ).digest()

              start = stock_boot_desc[
                  "digest_offset"
              ]
              end = (
                  start
                  + stock_boot_desc["digest_len"]
              )

              new_vbmeta[start:end] = digest

              output[
                  new_payload_end:
                  new_payload_end + len(new_vbmeta)
              ] = new_vbmeta

              new_footer = bytearray(
                  stock_footer["raw"]
              )

              struct.pack_into(
                  ">Q",
                  new_footer,
                  12,
                  new_payload_end,
              )
              struct.pack_into(
                  ">Q",
                  new_footer,
                  20,
                  new_payload_end,
              )

              output[-64:] = new_footer

              result = bytes(output)
              footer = parse_footer(result)
              embedded = parse_vbmeta(
                  footer["vbmeta"]
              )
              desc = hash_descriptor(
                  embedded,
                  "boot",
              )

              ok, calculated = verify_descriptor(
                  result,
                  desc,
              )

              need(
                  ok,
                  "custom embedded boot descriptor",
              )
              need(
                  calculated == digest,
                  "custom embedded AVB digest",
              )

              return {
                  "bytes": result,
                  "ramdisk_offset": new_ramdisk_offset,
                  "payload_end": new_payload_end,
                  "digest": digest.hex(),
              }

          calibrated = build_custom(old_kernel)

          need(
              sha(calibrated["bytes"])
              == OLD_BOOT_SHA,
              "historical W19 calibration hash",
          )
          need(
              calibrated["bytes"] == old_boot,
              "historical W19 calibration byte identity",
          )

          new_a = build_custom(new_image)
          new_b = build_custom(new_image)

          need(
              new_a["bytes"] == new_b["bytes"],
              "updated A/B build byte identity",
          )

          out_a.write_bytes(
              new_a["bytes"]
          )
          out_b.write_bytes(
              new_b["bytes"]
          )

          new_sha = sha(new_a["bytes"])

          new_kernel_size = struct.unpack_from(
              "<I",
              new_a["bytes"],
              8,
          )[0]

          new_kernel = new_a["bytes"][
              4096:
              4096 + new_kernel_size
          ]

          new_ramdisk = new_a["bytes"][
              new_a["ramdisk_offset"]:
              new_a["ramdisk_offset"]
              + ramdisk_size
          ]

          need(
              new_kernel_size == len(new_image),
              "updated boot kernel size",
          )
          need(
              sha(new_kernel) == NEW_IMAGE_SHA,
              "updated boot exact W49 kernel",
          )
          need(
              new_ramdisk == ramdisk,
              "updated boot stock ramdisk preserved",
          )
          need(
              new_a["ramdisk_offset"] == 29851648,
              "updated ramdisk offset",
          )
          need(
              new_a["payload_end"] == 51916800,
              "updated payload end",
          )

          arm = arm64_header(new_image)

          need(
              arm["text_offset"] == 0x80000,
              "W49 ARM64 text_offset",
          )
          need(
              arm["image_size"] == 38825984,
              "W49 ARM64 image_size",
          )
          need(
              arm["flags"] == 0xA,
              "W49 ARM64 flags",
          )
          need(
              arm["magic"] == 0x644D5241,
              "W49 ARM64 magic",
          )
          need(
              arm["res5"] == 0x40,
              "W49 ARM64 res5",
          )

          report = {
              "result":
                  "PASS_GEN1_W50_UPDATED_BOOT_V3_RECONSTRUCTION",
              "historical_calibration": {
                  "old_boot_sha256":
                      OLD_BOOT_SHA,
                  "byte_identical":
                      True,
              },
              "updated": {
                  "boot_sha256":
                      new_sha,
                  "boot_bytes":
                      len(new_a["bytes"]),
                  "kernel_sha256":
                      NEW_IMAGE_SHA,
                  "kernel_bytes":
                      len(new_image),
                  "ramdisk_sha256":
                      sha(new_ramdisk),
                  "ramdisk_offset":
                      new_a["ramdisk_offset"],
                  "payload_end":
                      new_a["payload_end"],
                  "embedded_avb_digest":
                      new_a["digest"],
                  "build_a_b_byte_identical":
                      True,
                  "arm64":
                      arm,
              },
          }

          json_out.write_text(
              json.dumps(
                  report,
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )

          text_out.write_text(
              "\n".join([
                  "GEN1_W50_UPDATED_BOOT_RECONSTRUCTION=PASS",
                  "HISTORICAL_W19_CALIBRATION=PASS",
                  "HISTORICAL_W19_BYTE_IDENTICAL=YES",
                  f"UPDATED_BOOT_SHA256={new_sha}",
                  (
                      "UPDATED_BOOT_BYTES="
                      f"{len(new_a['bytes'])}"
                  ),
                  (
                      "UPDATED_KERNEL_SHA256="
                      f"{NEW_IMAGE_SHA}"
                  ),
                  (
                      "UPDATED_KERNEL_BYTES="
                      f"{len(new_image)}"
                  ),
                  (
                      "UPDATED_RAMDISK_SHA256="
                      f"{sha(new_ramdisk)}"
                  ),
                  (
                      "UPDATED_RAMDISK_OFFSET="
                      f"{new_a['ramdisk_offset']}"
                  ),
                  (
                      "UPDATED_PAYLOAD_END="
                      f"{new_a['payload_end']}"
                  ),
                  (
                      "UPDATED_EMBEDDED_AVB_DIGEST="
                      f"{new_a['digest']}"
                  ),
                  "UPDATED_BUILD_A_B_BYTE_IDENTICAL=YES",
              ]) + "\n",
              encoding="utf-8",
          )
          PY

          cmp -s \
            "$BUILD/updated-A.img" \
            "$BUILD/updated-B.img"

          NEW_BOOT_SHA256="$(
            sed -n \
              's/^UPDATED_BOOT_SHA256=//p' \
              "$OUTPUT/W50-BOOT-BRIDGE.txt"
          )"

          NEW_AVB_DIGEST="$(
            sed -n \
              's/^UPDATED_EMBEDDED_AVB_DIGEST=//p' \
              "$OUTPUT/W50-BOOT-BRIDGE.txt"
          )"

          test -n "$NEW_BOOT_SHA256"
          test -n "$NEW_AVB_DIGEST"

          echo "NEW_BOOT_SHA256=$NEW_BOOT_SHA256" \
            >> "$GITHUB_ENV"

          echo "NEW_AVB_DIGEST=$NEW_AVB_DIGEST" \
            >> "$GITHUB_ENV"

      - name: Assemble deterministic CLEAN direct AK3 package
        shell: bash
        run: |
          set -euo pipefail

