            dd)
              target=""
              payload_write=0

              for arg in "$@"; do
                case "$arg" in
                  of=*)
                    target="${arg#of=}"
                    ;;
                  if=*boot.img)
                    payload_write=1
                    ;;
                esac
              done

              /usr/bin/dd "$@"
              rc=$?

              if [ "$rc" -eq 0 ] \
                 && [ "${INJECT_CORRUPT:-0}" = "1" ] \
                 && [ "$payload_write" = "1" ] \
                 && [ -n "$target" ]
              then
                printf '\000' \
                  | /usr/bin/dd \
                      of="$target" \
                      bs=1 \
                      seek=0 \
                      count=1 \
                      conv=notrunc \
                      status=none
              fi

              exit "$rc"
              ;;
            gzip)
              exec /usr/bin/gzip "$@"
              ;;
            sha256sum)
              exec /usr/bin/sha256sum "$@"
              ;;
            wc)
              exec /usr/bin/wc "$@"
              ;;
            tr)
              exec /usr/bin/tr "$@"
              ;;
            sync)
              exec /usr/bin/sync "$@"
              ;;
            *)
              exec "$cmd" "$@"
              ;;
          esac
          EOF

          cat > "$HARNESS/bin/getprop" <<'EOF'
          #!/bin/sh

          case "${1:-}" in
            ro.boot.slot_suffix)
              printf '%s\n' "${FAKE_SLOT:-}"
              ;;
            ro.boot.flash.locked)
              printf '%s\n' "${FAKE_FLASH_LOCKED:-}"
              ;;
            ro.boot.vbmeta.device_state)
              printf '%s\n' "${FAKE_VBMETA_STATE:-}"
              ;;
            *)
              exit 0
              ;;
          esac
          EOF

          chmod 755 \
            "$HARNESS/package/tools/ak3-core.sh" \
            "$HARNESS/package/tools/busybox" \
            "$HARNESS/bin/getprop"

          sudo mkdir -p \
            /dev/block/by-name

          sudo rm -f \
            /dev/block/by-name/boot_a \
            /dev/block/by-name/boot_b

          trap \
            'sudo rm -f /dev/block/by-name/boot_a /dev/block/by-name/boot_b' \
            EXIT

          reset_slots() {
            sudo cp \
              "$BUILD/stock_boot.img" \
              /dev/block/by-name/boot_a

            sudo cp \
              "$BUILD/stock_boot.img" \
              /dev/block/by-name/boot_b

            sudo chmod 666 \
              /dev/block/by-name/boot_a \
              /dev/block/by-name/boot_b
          }

          run_installer() {
            local SLOT="$1"
            local LOCKED="$2"
            local STATE="$3"
            local INJECT="${4:-0}"

            (
              cd "$HARNESS/package"

              env \
                PATH="$HARNESS/bin:$PATH" \
                AKHOME="$HARNESS/package" \
                FAKE_SLOT="$SLOT" \
                FAKE_FLASH_LOCKED="$LOCKED" \
                FAKE_VBMETA_STATE="$STATE" \
                INJECT_CORRUPT="$INJECT" \
                bash ./anykernel.sh
            )
          }

          hash_slot() {
            sha256sum "$1" \
              | awk '{print $1}'
          }

          reset_slots

          run_installer \
            "_a" \
            "0" \
            "unlocked" \
            "0" \
            > "$OUTPUT/RUNTIME-SLOT-A.log" \
            2>&1

          test "$(hash_slot /dev/block/by-name/boot_a)" = \
            "$NEW_BOOT_SHA256"

          test "$(hash_slot /dev/block/by-name/boot_b)" = \
            "$STOCK_BOOT_SHA256"

          reset_slots

          run_installer \
            "_b" \
            "0" \
            "unlocked" \
            "0" \
            > "$OUTPUT/RUNTIME-SLOT-B.log" \
            2>&1

          test "$(hash_slot /dev/block/by-name/boot_b)" = \
            "$NEW_BOOT_SHA256"

          test "$(hash_slot /dev/block/by-name/boot_a)" = \
            "$STOCK_BOOT_SHA256"

          reset_slots

          set +e

          run_installer \
            "_c" \
            "0" \
            "unlocked" \
            "0" \
            > "$OUTPUT/RUNTIME-INVALID-SLOT.log" \
            2>&1

          INVALID_RC=$?

          set -e

          test "$INVALID_RC" -ne 0

          test "$(hash_slot /dev/block/by-name/boot_a)" = \
            "$STOCK_BOOT_SHA256"

          test "$(hash_slot /dev/block/by-name/boot_b)" = \
            "$STOCK_BOOT_SHA256"

          reset_slots

          set +e

          run_installer \
            "_a" \
            "1" \
            "locked" \
            "0" \
            > "$OUTPUT/RUNTIME-LOCKED.log" \
            2>&1

          LOCKED_RC=$?

          set -e

          test "$LOCKED_RC" -ne 0

          test "$(hash_slot /dev/block/by-name/boot_a)" = \
            "$STOCK_BOOT_SHA256"

          test "$(hash_slot /dev/block/by-name/boot_b)" = \
            "$STOCK_BOOT_SHA256"

          reset_slots

          printf '\001' \
            | dd \
                of=/dev/block/by-name/boot_a \
                bs=1 \
                seek=0 \
                count=1 \
                conv=notrunc \
                status=none

          NONSTOCK_BEFORE="$(
            hash_slot \
              /dev/block/by-name/boot_a
          )"

          test "$NONSTOCK_BEFORE" != \
            "$STOCK_BOOT_SHA256"

          set +e

          run_installer \
            "_a" \
            "0" \
            "unlocked" \
            "0" \
            > "$OUTPUT/RUNTIME-NONSTOCK.log" \
            2>&1

          NONSTOCK_RC=$?

          set -e

          test "$NONSTOCK_RC" -ne 0

          test "$(hash_slot /dev/block/by-name/boot_a)" = \
            "$NONSTOCK_BEFORE"

          test "$(hash_slot /dev/block/by-name/boot_b)" = \
            "$STOCK_BOOT_SHA256"

          reset_slots

          set +e

          run_installer \
            "_a" \
            "0" \
            "unlocked" \
            "1" \
            > "$OUTPUT/RUNTIME-ROLLBACK.log" \
            2>&1

          ROLLBACK_RC=$?

          set -e

          test "$ROLLBACK_RC" -ne 0

          test "$(hash_slot /dev/block/by-name/boot_a)" = \
            "$STOCK_BOOT_SHA256"

          test "$(hash_slot /dev/block/by-name/boot_b)" = \
            "$STOCK_BOOT_SHA256"

          grep -Fq \
            'Exact stock boot was restored and verified.' \
            "$OUTPUT/RUNTIME-ROLLBACK.log"

          {
            echo "DIRECT_INSTALLER_RUNTIME=PASS"
            echo "ACTIVE_SLOT_A=PASS"
            echo "ACTIVE_SLOT_B=PASS"
            echo "INVALID_SLOT_FAIL_CLOSED=PASS"
            echo "LOCKED_BOOTLOADER_FAIL_CLOSED=PASS"
            echo "NONSTOCK_BOOT_FAIL_CLOSED=PASS"
            echo "INJECTED_POSTWRITE_CORRUPTION_ROLLBACK=PASS"
            echo "ROLLBACK_STOCK_HASH_VERIFIED=YES"
            echo "OTHER_SLOT_PRESERVED=YES"
            echo "VENDOR_BOOT_TOUCHED=NO"
            echo "DTBO_TOUCHED=NO"
            echo "TOP_LEVEL_VBMETA_TOUCHED=NO"
            echo "REAL_DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } | tee "$OUTPUT/W50-RUNTIME-VERDICT.txt"

      - name: Derive GEN1 W50 final release verdict
        shell: bash
        run: |
          set -euo pipefail

          grep -Fxq \
            'W49_UPDATED_KERNEL_GATE=PASS' \
            "$OUTPUT/W49-UPDATED-KERNEL-GATE.txt"

          grep -Fxq \
            'W21_DIRECT_INSTALLER_TEMPLATE_GATE=PASS' \
            "$OUTPUT/W21-TEMPLATE-GATE.txt"

          grep -Fxq \
            'GEN1_W50_UPDATED_BOOT_RECONSTRUCTION=PASS' \
            "$OUTPUT/W50-BOOT-BRIDGE.txt"

          grep -Fxq \
            'HISTORICAL_W19_CALIBRATION=PASS' \
            "$OUTPUT/W50-BOOT-BRIDGE.txt"

          grep -Fxq \
            'UPDATED_BUILD_A_B_BYTE_IDENTICAL=YES' \
            "$OUTPUT/W50-BOOT-BRIDGE.txt"

          grep -Fxq \
            'CLEAN_PACKAGE_ASSEMBLY=PASS' \
            "$OUTPUT/CLEAN-PACKAGE-ASSEMBLY.txt"

          grep -Fxq \
            'DIRECT_INSTALLER_RUNTIME=PASS' \
            "$OUTPUT/W50-RUNTIME-VERDICT.txt"

          grep -Fxq \
            'INJECTED_POSTWRITE_CORRUPTION_ROLLBACK=PASS' \
            "$OUTPUT/W50-RUNTIME-VERDICT.txt"

          test -s \
            "$OUTPUT/$RELEASE_ZIP_NAME"

          test "$(sha256sum "$OUTPUT/$RELEASE_ZIP_NAME" | awk '{print $1}')" = \
            "$RELEASE_SHA256"

          {
            echo "FINAL_RESULT=PASS_GEN1_50_V1_5_4_274_RESUKISU_B2AC_SUSFS_2_2_STOCK_HYPEROS_CLEAN_AK3_RELEASE"
            echo "DEVICE=veux"
            echo "ROM_FAMILY=Xiaomi_HyperOS_Stock"
            echo "ROM_VERSION=$STOCK_ROM_VERSION"
            echo "ANDROID_VERSION=$STOCK_ANDROID_VERSION"
            echo "SECURITY_PATCH=$STOCK_SECURITY_PATCH"
            echo "KERNEL_RELEASE=$W49_KERNEL_RELEASE"
            echo "W49_IMAGE_SHA256=$W49_IMAGE_SHA256"
            echo "RESUKISU_COMMIT=$UPDATED_RESUKISU_COMMIT"
            echo "RESUKISU_VERSION=v4.2.0-rc1-b2ac2fc8@ReSukiSU"
            echo "SUSFS_VERSION=v2.2.0"
            echo "SUSFS_FIXSET_CHANGED=NO"
            echo "BOOT_V3_RECONSTRUCTION=PASS"
            echo "HISTORICAL_W19_CALIBRATION=PASS"
            echo "UPDATED_BOOT_SHA256=$NEW_BOOT_SHA256"
            echo "UPDATED_EMBEDDED_AVB_DIGEST=$NEW_AVB_DIGEST"
            echo "CLEAN_RUNTIME_FILE_COUNT=14"
            echo "AI_KI_CHATGPT_OPENAI_ASSISTANT_TEXT_HITS=0"
            echo "WORKFLOW_AUDIT_PROVENANCE_TESTPLAN_TEXT_HITS=0"
            echo "RELEASE_ZIP_NAME=$RELEASE_ZIP_NAME"
            echo "RELEASE_ZIP_SHA256=$RELEASE_SHA256"
            echo "RELEASE_ZIP_BYTES=$RELEASE_BYTES"
            echo "DETERMINISTIC_RELEASE_BYTES=YES"
            echo "ACTIVE_SLOT_A_RUNTIME=PASS"
            echo "ACTIVE_SLOT_B_RUNTIME=PASS"
            echo "INVALID_SLOT_FAIL_CLOSED=PASS"
            echo "LOCKED_BOOTLOADER_FAIL_CLOSED=PASS"
            echo "NONSTOCK_BOOT_FAIL_CLOSED=PASS"
            echo "ROLLBACK_FAULT_INJECTION=PASS"
            echo "OTHER_SLOT_PRESERVED=YES"
            echo "VENDOR_BOOT_TOUCHED=NO"
            echo "DTBO_TOUCHED=NO"
            echo "TOP_LEVEL_VBMETA_TOUCHED=NO"
            echo "REAL_DEVICE_ACCESSED=NO"
            echo "ADB_USED=NO"
            echo "FASTBOOT_USED=NO"
            echo "FLASHING_PERFORMED=NO"
            echo "PHYSICAL_DEVICE_BOOT_TESTED=NO"
          } | tee "$OUTPUT/W50-FINAL-VERDICT.txt"

      - name: Write failure summary
        if: failure()
        shell: bash
        run: |
          set +e

          {
            echo "GEN1 W50 v1: FAILURE"
            echo "DATE_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "W49_RUN_ID=$W49_RUN_ID"
            echo "W49_IMAGE_SHA256=$W49_IMAGE_SHA256"
            echo "RESUKISU_COMMIT=$UPDATED_RESUKISU_COMMIT"
            echo "SUSFS_VERSION=v2.2.0"
            echo "ROM_VERSION=$STOCK_ROM_VERSION"
            echo "DEVICE_ACCESS=NO"
            echo "FLASHING_PERFORMED=NO"
          } > "$OUTPUT/W50-FAILURE-SUMMARY.txt"

      - name: Upload GEN1 W50 updated CLEAN package and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GEN1_50_V1_5.4.274_ReSukiSU_B2AC_SUSFS_2.2_STOCK_HYPEROS_CLEAN_AK3-${{ github.run_number }}
          path: gen1-50-v1/output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 0

      - name: Fail only after preserving W50 diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -Fxq \
            'FINAL_RESULT=PASS_GEN1_50_V1_5_4_274_RESUKISU_B2AC_SUSFS_2_2_STOCK_HYPEROS_CLEAN_AK3_RELEASE' \
            "$OUTPUT/W50-FINAL-VERDICT.txt" \
            2>/dev/null
          then
            echo "ERROR: GEN1 W50 final PASS verdict was not produced."
            exit 1
          fi

          echo "GEN1 W50 v1 PASS confirmed after artifact upload."
