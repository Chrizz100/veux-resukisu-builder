          set -- $PAYLOAD_LINE;
          PAYLOAD_SHA="$1";

          [ "$PAYLOAD_SHA" = "$EXPECT_CUSTOM_SHA" ] || abort \
            "Custom boot payload SHA-256 mismatch.";

          ROLLBACK_LINE="$($BB gzip -dc "$ROLLBACK_GZ" | $BB sha256sum)" || abort \
            "Cannot verify compressed stock rollback payload.";

          set -- $ROLLBACK_LINE;
          ROLLBACK_SHA="$1";

          [ "$ROLLBACK_SHA" = "$EXPECT_STOCK_SHA" ] || abort \
            "Stock rollback payload SHA-256 mismatch.";

          SLOT="$(getprop ro.boot.slot_suffix 2>/dev/null || true)";

          case "$SLOT" in
            _a|_b) ;;
            *) abort "Could not determine a valid active A/B slot. Aborting." ;;
          esac;

          TARGET="/dev/block/by-name/boot${SLOT}";

          if [ ! -e "$TARGET" ]; then
            TARGET="/dev/block/bootdevice/by-name/boot${SLOT}";
          fi;

          [ -e "$TARGET" ] || abort \
            "Active-slot boot block device not found. Aborting.";

          FLASH_LOCKED="$(getprop ro.boot.flash.locked 2>/dev/null || true)";
          VBMETA_STATE="$(getprop ro.boot.vbmeta.device_state 2>/dev/null || true)";

          if [ "$FLASH_LOCKED" != "0" ] && [ "$VBMETA_STATE" != "unlocked" ]; then
