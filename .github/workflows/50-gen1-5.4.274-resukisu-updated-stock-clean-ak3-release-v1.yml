          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])

          patterns = {
              "ai_ki": re.compile(
                  r"(?i)(?:\bAI\b|\bKI\b|ChatGPT|OpenAI|"
                  r"artificial intelligence|künstliche intelligenz|"
