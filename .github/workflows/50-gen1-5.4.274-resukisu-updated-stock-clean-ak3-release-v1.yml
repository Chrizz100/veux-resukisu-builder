          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=veux
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=13
          supported.patchlevels=2024-12 - 2024-12
          supported.vendorpatchlevels=2024-12 - 2024-12
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          SLOT_SELECT=active;
          PATCH_VBMETA_FLAG=0;
          NO_VBMETA_PARTITION_PATCH=1;
          NO_MAGISK_CHECK=1;

          . tools/ak3-core.sh;

          BB="$AKHOME/tools/busybox";
          PAYLOAD="$AKHOME/boot.img";
          ROLLBACK_GZ="$AKHOME/rollback_stock_boot.img.gz";

          EXPECT_STOCK_SHA="@@STOCK_SHA@@";
          EXPECT_CUSTOM_SHA="@@CUSTOM_SHA@@";
          EXPECT_BYTES="134217728";

          [ -x "$BB" ] || abort "Missing packaged busybox. Aborting.";
          [ -f "$PAYLOAD" ] || abort "Missing updated boot payload. Aborting.";
          [ -f "$ROLLBACK_GZ" ] || abort "Missing compressed stock rollback image. Aborting.";

          PAYLOAD_BYTES="$($BB wc -c < "$PAYLOAD" | $BB tr -d ' ')";
          [ "$PAYLOAD_BYTES" = "$EXPECT_BYTES" ] || abort \
            "Unexpected custom boot payload size: $PAYLOAD_BYTES" \
            "Expected: $EXPECT_BYTES";

          PAYLOAD_LINE="$($BB sha256sum "$PAYLOAD")" || abort \
