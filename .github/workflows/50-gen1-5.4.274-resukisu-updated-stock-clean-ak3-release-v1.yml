            "Expected SHA-256: $EXPECT_STOCK_SHA";

          restore_stock() {
            ui_print "Attempting exact stock boot rollback...";

            $BB gzip -dc "$ROLLBACK_GZ" \
              | $BB dd of="$TARGET" bs=1048576 \
              || return 1;

            $BB sync;

            RESTORE_LINE="$($BB sha256sum "$TARGET" 2>/dev/null)" \
              || return 1;

            set -- $RESTORE_LINE;
            RESTORE_SHA="$1";

            [ "$RESTORE_SHA" = "$EXPECT_STOCK_SHA" ];
          }

          ui_print \
            " " \
            "VEUX 5.4.274 updated direct boot payload" \
            "Target: boot${SLOT}" \
            "Stock pre-write SHA-256 verified.";

          if ! $BB dd if="$PAYLOAD" of="$TARGET" bs=1048576; then
            $BB sync;

            if restore_stock; then
              abort \
                "Custom boot write failed." \
                "Exact stock boot was restored and verified.";
            else
              abort \
                "Custom boot write failed and stock rollback could not be verified.";
            fi;
          fi;

          $BB sync;

          WRITTEN_LINE="$($BB sha256sum "$TARGET" 2>/dev/null)" || {
            if restore_stock; then
              abort \
                "Could not hash written custom boot." \
                "Exact stock boot was restored and verified.";
            else
              abort \
                "Could not hash written custom boot and rollback could not be verified.";
            fi;
          };

          set -- $WRITTEN_LINE;
          WRITTEN_SHA="$1";

          if [ "$WRITTEN_SHA" != "$EXPECT_CUSTOM_SHA" ]; then
            if restore_stock; then
              abort \
                "Custom boot readback SHA-256 mismatch." \
                "Exact stock boot was restored and verified.";
            else
              abort \
                "Custom boot readback SHA-256 mismatch and rollback could not be verified.";
            fi;
          fi;

          ui_print "Updated boot payload written and readback verified.";
          EOF

          sed -i \
            "s|@@STOCK_SHA@@|$STOCK_BOOT_SHA256|g" \
            "$PACKAGE/anykernel.sh"

          sed -i \
            "s|@@CUSTOM_SHA@@|$NEW_BOOT_SHA256|g" \
