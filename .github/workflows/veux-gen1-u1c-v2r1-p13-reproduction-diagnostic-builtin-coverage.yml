          export BUILT_IMAGE="$image"
          export BUILT_DTB="$dtb"
          export REF_IMAGE="$P13_REFERENCE_DIR/Image"
          export REF_DTB="$P13_REFERENCE_DIR/veux.dtb"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          audit = Path(os.environ["AUDIT_DIR"])
          pairs = [
              ("IMAGE", Path(os.environ["REF_IMAGE"]), Path(os.environ["BUILT_IMAGE"])),
              ("DTB", Path(os.environ["REF_DTB"]), Path(os.environ["BUILT_DTB"])),
          ]

          def sha256_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def compare(label, ref_path, built_path):
              ref = ref_path.read_bytes()
              built = built_path.read_bytes()
              overlap = min(len(ref), len(built))
              differing = [i for i in range(overlap) if ref[i] != built[i]]
              trailing = abs(len(ref) - len(built))
              total_diff = len(differing) + trailing
              first = differing[0] if differing else (overlap if trailing else -1)
              if differing:
                  last = differing[-1]
              elif trailing:
                  last = max(len(ref), len(built)) - 1
              else:
                  last = -1

              chunk_size = 1024 * 1024
              max_len = max(len(ref), len(built))
              chunks = []
              for off in range(0, max_len, chunk_size):
                  r = ref[off:off + chunk_size]
                  b = built[off:off + chunk_size]
                  rsha = sha256_bytes(r)
                  bsha = sha256_bytes(b)
                  if rsha != bsha:
                      chunks.append((off // chunk_size, off, len(r), len(b), rsha, bsha))

              out = audit / f"09-{label.lower()}-binary-diff.txt"
              lines = [
                  f"LABEL={label}",
                  f"REFERENCE_PATH={ref_path}",
                  f"BUILT_PATH={built_path}",
                  f"REFERENCE_BYTES={len(ref)}",
                  f"BUILT_BYTES={len(built)}",
                  f"REFERENCE_SHA256={sha256_bytes(ref)}",
                  f"BUILT_SHA256={sha256_bytes(built)}",
                  f"BYTE_IDENTICAL={'YES' if total_diff == 0 else 'NO'}",
                  f"FIRST_DIFFERING_OFFSET={first}",
                  f"LAST_DIFFERING_OFFSET={last}",
                  f"TOTAL_DIFFERING_BYTES={total_diff}",
                  f"CHANGED_1MIB_CHUNKS={len(chunks)}",
                  "",
                  "chunk_index\toffset\tref_bytes\tbuilt_bytes\tref_sha256\tbuilt_sha256",
              ]
              lines.extend("\t".join(map(str, row)) for row in chunks)
              out.write_text("\n".join(lines) + "\n", encoding="utf-8")
              return total_diff == 0

          results = {}
          for label, ref, built in pairs:
              results[label] = compare(label, ref, built)

          (audit / "09-byte-identity-result.txt").write_text(
              "\n".join(
                  [
                      f"IMAGE_BYTE_IDENTICAL={'PASS' if results['IMAGE'] else 'FAIL'}",
                      f"DTB_BYTE_IDENTICAL={'PASS' if results['DTB'] else 'FAIL'}",
                  ]
              ) + "\n",
              encoding="utf-8",
          )
          PY

          image_binary_status="$(
            awk -F= '$1=="IMAGE_BYTE_IDENTICAL"{print $2}' "$AUDIT_DIR/09-byte-identity-result.txt"
          )"
          dtb_binary_status="$(
            awk -F= '$1=="DTB_BYTE_IDENTICAL"{print $2}' "$AUDIT_DIR/09-byte-identity-result.txt"
          )"

          gate_fail=0
          for s in \
            "$image_bytes_status" \
            "$image_sha_status" \
            "$dtb_sha_status" \
            "$kernelrelease_status" \
            "$image_binary_status" \
            "$dtb_binary_status"; do
            if test "$s" != "PASS"; then
              gate_fail=1
            fi
          done

          if test "$gate_fail" -ne 0; then
            cp "$image" "$AUDIT_DIR/U1C-v2R1-built-Image.bin"
            cp "$dtb" "$AUDIT_DIR/U1C-v2R1-built-veux.dtb"
            {
              echo "P13_IMAGE_REPRODUCTION=FAIL"
              echo "P13_CONFIG_MODULES_N=PASS"
              echo "DETAILS=09-reproduction-values.tsv,09-image-binary-diff.txt,09-dtb-binary-diff.txt"
            } | tee "$AUDIT_DIR/09-reproduction-result.txt"
            exit 1
          fi

          "$TOOLCHAIN_DIR/bin/llvm-nm" -g --defined-only -P "$OUT_DIR/vmlinux" \
            | LC_ALL=C sort -u \
            > "$AUDIT_DIR/P13-vmlinux-global-symbols.txt"
          test -s "$AUDIT_DIR/P13-vmlinux-global-symbols.txt"

          {
            echo "P13_IMAGE_REPRODUCTION=PASS"
            echo "P13_CONFIG_MODULES_N=PASS"
            echo "IMAGE_BYTES=$image_bytes"
            echo "IMAGE_SHA256=$image_sha"
            echo "VEUX_DTB_SHA256=$dtb_sha"
            echo "KERNEL_RELEASE=$kernelrelease"
            echo "VMLINUX_BYTES=$vmlinux_bytes"
            echo "VMLINUX_SHA256=$vmlinux_sha"
            echo "SYSTEM_MAP_SHA256=$system_map_sha"
            echo "VMLINUX_GLOBAL_SYMBOLS=$(wc -l < "$AUDIT_DIR/P13-vmlinux-global-symbols.txt")"
            echo "REFERENCE_IMAGE_BYTE_IDENTICAL=PASS"
            echo "REFERENCE_DTB_BYTE_IDENTICAL=PASS"
          } | tee "$AUDIT_DIR/09-reproduction-result.txt"

      - name: Clone representative public VEUX module snapshots
        shell: bash
        run: |
          set -euo pipefail
          meta="$AUDIT_DIR/10-public-snapshots.tsv"
          printf 'label\trepository\tref\tcommit\tko_count\n' > "$meta"

          clone_sparse() {
            label="$1"
            repo="$2"
            ref="$3"
            dest="$SNAPSHOT_DIR/$label"

            git clone -q --depth 1 --filter=blob:none --sparse \
              --single-branch --branch "$ref" \
              "https://github.com/$repo.git" "$dest"
            git -C "$dest" sparse-checkout set ramdisk-modules vendor-modules
            git -C "$dest" lfs pull --include='ramdisk-modules/**,vendor-modules/**'

            commit="$(git -C "$dest" rev-parse HEAD)"
            ko_count="$(find "$dest/ramdisk-modules" "$dest/vendor-modules" \
              -type f -name '*.ko' 2>/dev/null | wc -l)"

            test "$ko_count" -gt 0

            # Reject unresolved Git-LFS pointer files; they would invalidate symbol evidence.
            while IFS= read -r -d '' f; do
              if head -c 64 "$f" | grep -Fq 'version https://git-lfs.github.com/spec/v1'; then
                echo "Unresolved Git-LFS pointer: $f" >&2
                exit 1
              fi
            done < <(
              find "$dest/ramdisk-modules" "$dest/vendor-modules" \
                -type f -name '*.ko' -print0 2>/dev/null
            )

            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$label" "$repo" "$ref" "$commit" "$ko_count" >> "$meta"
          }

          clone_sparse a12 \
            sunil98025/android_device_xiaomi_veux-kernel twelve

          clone_sparse a13_arrow \
            ArrowOS-Devices/android_device_xiaomi_veux-kernel arrow-13.0

          clone_sparse a13_alt \
            nnippon99/android_device_xiaomi_veux-kernel thirteen

          clone_sparse lineage20 \
            xiaomi-sm6375-devs/android_device_xiaomi_veux-kernel lineage-20

          clone_sparse a14_crdroid \
            crdroidandroid/android_device_xiaomi_veux-kernel 14.0

          cat "$meta"

      - name: Inventory public modules and correlate them to P13 built-in evidence
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export LLVM_NM="$TOOLCHAIN_DIR/bin/llvm-nm"
          export P13_CONFIG="$AUDIT_DIR/P13-config.txt"
          export P13_SYMBOLS="$AUDIT_DIR/P13-vmlinux-global-symbols.txt"
          export KERNEL_SOURCE="$GITHUB_WORKSPACE/kernel"

          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import csv
          import hashlib
          import os
          import re
          import subprocess

          snapshot_root = Path(os.environ["SNAPSHOT_DIR"])
          audit = Path(os.environ["AUDIT_DIR"])
          source = Path(os.environ["KERNEL_SOURCE"])
          llvm_nm = os.environ["LLVM_NM"]

          def read_config(path):
              cfg = {}
              for raw in Path(path).read_text(errors="replace").splitlines():
                  line = raw.strip()
                  m = re.match(r'^(CONFIG_[A-Za-z0-9_]+)=(.*)$', line)
                  if m:
                      cfg[m.group(1)] = m.group(2)
                      continue
                  m = re.match(r'^# (CONFIG_[A-Za-z0-9_]+) is not set$', line)
                  if m:
                      cfg[m.group(1)] = "n"
              return cfg

          p13_cfg = read_config(os.environ["P13_CONFIG"])
          if p13_cfg.get("CONFIG_MODULES") != "n":
              raise SystemExit(f"P13 CONFIG_MODULES is not n: {p13_cfg.get('CONFIG_MODULES')!r}")

          p13_symbols = set()
          for line in Path(os.environ["P13_SYMBOLS"]).read_text(errors="replace").splitlines():
              parts = line.split()
              if parts:
                  p13_symbols.add(parts[0])

          if len(p13_symbols) < 10000:
              raise SystemExit(f"Unexpectedly small P13 vmlinux symbol set: {len(p13_symbols)}")

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for block in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          def run_text(args):
              cp = subprocess.run(args, text=True, stdout=subprocess.PIPE,
                                  stderr=subprocess.PIPE)
              return cp.returncode, cp.stdout.strip(), cp.stderr.strip()

          def modinfo(path, field):
              rc, out, _ = run_text(["modinfo", "-F", field, str(path)])
              return out.replace("\n", ",") if rc == 0 else ""

          def elf64_le(path):
              b = path.read_bytes()[:6]
              return len(b) >= 6 and b[:4] == b"\x7fELF" and b[4] == 2 and b[5] == 1

          def normalize_name(s):
              s = s.lower()
              s = s[:-3] if s.endswith(".ko") else s
              return re.sub(r"[^a-z0-9]+", "", s)

          def external_defined_symbols(path):
              rc, out, err = run_text([
                  llvm_nm, "-g", "--defined-only", "-P", str(path)
              ])
              if rc != 0:
                  return None, err or "llvm-nm failed"
              ignore_exact = {
                  "init_module", "cleanup_module", "__this_module",
                  "_GLOBAL_OFFSET_TABLE_",
              }
              symbols = set()
              for line in out.splitlines():
                  parts = line.split()
                  if not parts:
                      continue
                  sym = parts[0]
                  if sym in ignore_exact:
                      continue
                  if sym.startswith((
                      "__UNIQUE_ID_", "__UNIQUE_ID", "__ksymtab_", "__kstrtab_",
                      "__kstrtabns_", "__crc_", "__param_", "__mod_", "__modver_",
                      "__jump_table", "__tracepoint_", "__traceiter_", "__tracepoint_str_",
                  )):
                      continue
                  if sym.startswith("$"):
                      continue
                  symbols.add(sym)
              return symbols, ""

          def subsystem(text):
              s = text.lower()
              groups = [
                  ("camera", ("camera", "cam_", "cam-", "spectra")),
                  ("display", ("display", "drm", "dsi", "panel", "sde", "rotator")),
                  ("touch", ("touch", "goodix", "focal", "novatek", "synaptics", "fts")),
                  ("wlan", ("wlan", "wifi", "qca_cld", "qcacld", "cnss")),
                  ("bluetooth", ("bluetooth", "btpower", "btfm", "hci_")),
                  ("modem_ipa", ("modem", "ipa", "rmnet", "qrtr", "glink", "mhi")),
                  ("audio", ("audio", "snd", "q6", "apr", "codec", "wcd")),
                  ("power_thermal", ("charger", "battery", "power", "smb", "pmic",
                                     "thermal", "cpufreq", "pd_", "pd-")),
                  ("fingerprint", ("fingerprint", "goodix_fp", "fpc")),
                  ("sensors", ("sensor", "ssc", "adsp")),
              ]
              for label, keys in groups:
                  if any(k in s for k in keys):
                      return label
              return "misc_platform"

          # Pre-index Kbuild/Makefile lines once.
          build_lines = []
          for bp in source.rglob("*"):
              if not bp.is_file() or bp.name not in ("Makefile", "Kbuild"):
                  continue
              try:
                  lines = bp.read_text(errors="replace").splitlines()
              except OSError:
                  continue
              rel = str(bp.relative_to(source))
              for lineno, raw in enumerate(lines, 1):
                  code = raw.split("#", 1)[0].strip()
                  if not code:
                      continue
                  configs = sorted(set(re.findall(r"CONFIG_[A-Za-z0-9_]+", code)))
                  # Do not let a module basename match only because it happens
                  # to occur inside CONFIG_FOO.  Built-in mapping evidence must
                  # also be present in the actual Kbuild target/rule text.
                  rule_target_text = re.sub(
                      r"\$\(CONFIG_[A-Za-z0-9_]+\)|CONFIG_[A-Za-z0-9_]+",
                      "",
                      code,
                  )
                  build_lines.append(
                      (rel, lineno, code, configs, normalize_name(rule_target_text))
                  )

          module_fields = [
              "snapshot","area","path","module_name","sha256","vermagic","depends",
              "subsystem","elf_state","defined_symbols","defined_in_p13",
              "defined_overlap_ratio","kbuild_hits","config_candidates",
              "config_y","config_disabled","coverage_status","critical"
          ]
          rule_fields = [
              "snapshot","module_path","module_name","kbuild_file","line",
              "rule","config","p13_value"
          ]

          modules = []
          rules = []
          unresolved = []

          for snap in sorted(p for p in snapshot_root.iterdir() if p.is_dir()):
              kos = []
              for area in ("ramdisk-modules", "vendor-modules"):
                  base = snap / area
                  if base.exists():
                      kos.extend((area, p) for p in base.rglob("*.ko") if p.is_file())

              for area, ko in sorted(kos, key=lambda x: str(x[1])):
                  rel = str(ko.relative_to(snap))
                  name = modinfo(ko, "name") or ko.stem
                  vermagic = modinfo(ko, "vermagic")
                  depends = modinfo(ko, "depends")
                  sub = subsystem(" ".join([rel, name, depends]))
                  # Default to critical.  Only obviously non-production
                  # test/debug/dummy payloads may avoid blocking an A result.
                  critical_text = " ".join([rel, name]).lower()
                  noncritical_markers = ("test", "debug", "dummy", "benchmark")
                  critical = (
                      "NO"
                      if any(marker in critical_text for marker in noncritical_markers)
                      else "YES"
                  )

                  if not elf64_le(ko):
                      defs = None
                      overlap = set()
                      sym_err = "not-elf64-le"
                  else:
                      defs, sym_err = external_defined_symbols(ko)
                      overlap = set() if defs is None else defs & p13_symbols

                  if defs is None:
                      defined_count = 0
                      overlap_count = 0
                      ratio = 0.0
                      elf_state = sym_err
                  else:
                      defined_count = len(defs)
                      overlap_count = len(overlap)
                      ratio = (overlap_count / defined_count) if defined_count else 0.0
                      elf_state = "ELF64_LE"

                  targets = {
                      normalize_name(ko.stem),
                      normalize_name(name),
                  }
                  targets.discard("")

                  hit_rows = []
                  cfg_candidates = set()
                  for bf, lineno, code, cfgs, norm_line in build_lines:
                      if not any(t and t in norm_line for t in targets):
                          continue
                      hit_rows.append((bf, lineno, code, cfgs))
                      cfg_candidates.update(cfgs)

                  cfg_y = sorted(c for c in cfg_candidates if p13_cfg.get(c) == "y")
                  cfg_disabled = sorted(
                      c for c in cfg_candidates
                      if p13_cfg.get(c, "n") in ("n", None)
                  )

                  for bf, lineno, code, cfgs in hit_rows:
                      if cfgs:
                          for cfg in cfgs:
                              rules.append({
                                  "snapshot": snap.name,
                                  "module_path": rel,
                                  "module_name": name,
                                  "kbuild_file": bf,
                                  "line": lineno,
                                  "rule": code,
                                  "config": cfg,
                                  "p13_value": p13_cfg.get(cfg, "n"),
                              })
                      else:
                          rules.append({
                              "snapshot": snap.name,
                              "module_path": rel,
                              "module_name": name,
                              "kbuild_file": bf,
                              "line": lineno,
                              "rule": code,
                              "config": "",
                              "p13_value": "",
                          })

                  # Symbols-only evidence is deliberately conservative:
                  # one or two coincidentally named globals are not enough.
                  symbol_strong = defined_count >= 3 and ratio >= 0.80

                  if cfg_y and symbol_strong:
                      status = "BUILTIN_STRONG_CONFIG_AND_SYMBOLS"
                  elif cfg_y:
                      status = "BUILTIN_BY_CONFIG"
                  elif symbol_strong:
                      status = "BUILTIN_BY_SYMBOLS"
                  elif cfg_candidates and not cfg_y:
                      status = "DISABLED_OR_EXTERNAL_CONFIG"
                  else:
                      status = "OUT_OF_TREE_OR_UNRESOLVED"

                  row = {
                      "snapshot": snap.name,
                      "area": area,
                      "path": rel,
                      "module_name": name,
                      "sha256": sha256(ko),
                      "vermagic": vermagic,
                      "depends": depends,
                      "subsystem": sub,
                      "elf_state": elf_state,
                      "defined_symbols": defined_count,
                      "defined_in_p13": overlap_count,
                      "defined_overlap_ratio": f"{ratio:.6f}",
                      "kbuild_hits": len(hit_rows),
                      "config_candidates": ",".join(sorted(cfg_candidates)),
                      "config_y": ",".join(cfg_y),
                      "config_disabled": ",".join(cfg_disabled),
                      "coverage_status": status,
                      "critical": critical,
                  }
                  modules.append(row)

                  if status not in (
                      "BUILTIN_STRONG_CONFIG_AND_SYMBOLS",
                      "BUILTIN_BY_CONFIG",
                      "BUILTIN_BY_SYMBOLS",
                  ):
                      unresolved.append(row)

          def write_tsv(path, rows, fields):
              with open(path, "w", newline="", encoding="utf-8") as fh:
                  w = csv.DictWriter(fh, fieldnames=fields, delimiter="\t")
                  w.writeheader()
                  w.writerows(rows)

          write_tsv(audit / "11-MODULE-INDEPENDENCE.tsv", modules, module_fields)
          write_tsv(audit / "11-P13-BUILTIN-CONFIG-MAP.tsv", rules, rule_fields)
          write_tsv(audit / "11-UNRESOLVED-EXTERNAL-MODULES.tsv", unresolved, module_fields)

          # Collapse duplicate prebuilt payloads to avoid counting the same .ko
          # five times merely because several ROM repositories carry it.
          unique = {}
          for row in modules:
              unique.setdefault(row["sha256"], row)

          summary_fields = [
              "subsystem","unique_modules","builtin_evidence",
              "unresolved_or_disabled","critical_unresolved"
          ]
          by_sub = defaultdict(lambda: defaultdict(int))
          for row in unique.values():
              sub = row["subsystem"]
              by_sub[sub]["unique_modules"] += 1
              if row["coverage_status"].startswith("BUILTIN_"):
                  by_sub[sub]["builtin_evidence"] += 1
              else:
                  by_sub[sub]["unresolved_or_disabled"] += 1
                  if row["critical"] == "YES":
                      by_sub[sub]["critical_unresolved"] += 1

          summary = []
          for sub in sorted(by_sub):
              d = by_sub[sub]
              summary.append({
                  "subsystem": sub,
                  "unique_modules": d["unique_modules"],
                  "builtin_evidence": d["builtin_evidence"],
                  "unresolved_or_disabled": d["unresolved_or_disabled"],
                  "critical_unresolved": d["critical_unresolved"],
              })
          write_tsv(audit / "11-SUBSYSTEM-SUMMARY.tsv", summary, summary_fields)

          print(f"Module rows: {len(modules)}")
          print(f"Unique module payloads: {len(unique)}")
          print(f"Unresolved rows: {len(unresolved)}")
          for row in summary:
              print(row)
          PY

      - name: Classify U1C-v2 static compatibility result
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import csv
          import os

          audit = Path(os.environ["AUDIT_DIR"])

          modules = list(csv.DictReader(
              (audit / "11-MODULE-INDEPENDENCE.tsv").open(), delimiter="\t"
          ))
          summary = list(csv.DictReader(
              (audit / "11-SUBSYSTEM-SUMMARY.tsv").open(), delimiter="\t"
          ))

          # Use SHA to count identical payloads only once.
          unique = {}
          for row in modules:
              unique.setdefault(row["sha256"], row)

          builtin = [
              r for r in unique.values()
              if r["coverage_status"].startswith("BUILTIN_")
          ]
          unresolved = [
              r for r in unique.values()
              if not r["coverage_status"].startswith("BUILTIN_")
          ]
          critical = [r for r in unresolved if r["critical"] == "YES"]

          if critical:
              classification = (
                  "STATIC_REQUIRES_COMPATIBILITY_REVIEW_EXTERNAL_DRIVER_DEPENDENCIES"
              )
          elif unresolved:
              classification = "STATIC_SUPPORTS_A_WITH_BUILTIN_GUARD_REVIEW"
          else:
              classification = "STATIC_SUPPORTS_A_P13_MODULE_INDEPENDENT"

          lines = [
              "# VEUX GEN1 U1C-v2R1 — P13 Built-in Driver Coverage Audit",
              "",
              "## Corrected premise",
              "",
              "- Frozen P13/CLEAN-GEN1 has **`CONFIG_MODULES=n`**.",
              "- Therefore P13 cannot depend on runtime loading of the public ROM `.ko` payloads.",
              "- U1C-v1's external-module CRC gate was intentionally abandoned.",
              "",
              "## P13 reproduction authority",
              "",
              "- P13 Image SHA-256 reproduced exactly: **PASS**",
              "- P13 VEUX DTB SHA-256 reproduced exactly: **PASS**",
              "- P13 kernel release reproduced exactly: **PASS**",
              "- `CONFIG_MODULES=n`: **PASS**",
              "",
              "## Built-in coverage evidence",
              "",
              f"- Unique public `.ko` payloads audited: **{len(unique)}**",
              f"- Unique payloads with P13 built-in evidence: **{len(builtin)}**",
              f"- Unique payloads unresolved/disabled: **{len(unresolved)}**",
              f"- Critical-subsystem unresolved payloads: **{len(critical)}**",
              "",
              "| Subsystem | Unique | Built-in evidence | Unresolved | Critical unresolved |",
              "|---|---:|---:|---:|---:|",
          ]

          for row in summary:
              lines.append(
                  f"| {row['subsystem']} | {row['unique_modules']} | "
                  f"{row['builtin_evidence']} | {row['unresolved_or_disabled']} | "
                  f"{row['critical_unresolved']} |"
              )

          lines += [
              "",
              "## Classification",
              "",
              f"**{classification}**",
              "",
              "Evidence rules:",
              "- `BUILTIN_BY_CONFIG`: a matching source Kbuild/Makefile selector is `=y` in P13.",
              "- `BUILTIN_BY_SYMBOLS`: a conservative share of the module's externally visible definitions exists in reproduced P13 `vmlinux`.",
              "- `BUILTIN_STRONG_CONFIG_AND_SYMBOLS`: both lines of evidence agree.",
              "- `DISABLED_OR_EXTERNAL_CONFIG` and `OUT_OF_TREE_OR_UNRESOLVED` are not treated as compatible by assumption.",
              "",
              "This is a STATIC audit only. It does **not** create a new DEVICE-PASS claim.",
              "P13 remains the only immutable DEVICE-PASS reference.",
              "",
              "No new kernel patch was introduced by U1C-v2R1.",
          ]

          (audit / "12-U1C-V2-REPORT.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          (audit / "12-U1C-V2-RESULT.txt").write_text(
              classification + "\n", encoding="utf-8"
          )

          # Short triage of unresolved critical rows for the chat-side review.
          with (audit / "12-CRITICAL-UNRESOLVED.tsv").open(
              "w", newline="", encoding="utf-8"
          ) as fh:
              fields = [
                  "snapshot","path","module_name","subsystem","vermagic",
                  "defined_symbols","defined_in_p13","defined_overlap_ratio",
                  "config_candidates","config_y","coverage_status"
              ]
              w = csv.DictWriter(fh, fieldnames=fields, delimiter="\t",
                                 extrasaction="ignore")
              w.writeheader()
              w.writerows(critical)

          print(classification)
          PY

          cat "$AUDIT_DIR/12-U1C-V2-RESULT.txt"
          sed -n '1,240p' "$AUDIT_DIR/12-U1C-V2-REPORT.md"

      - name: Build self-verifying U1C-v2R1 evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d "$AUDIT_DIR"
          cd "$AUDIT_DIR"
          find . -type f ! -name 'U1C-V2R1-EVIDENCE-SHA256SUMS.txt' -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            > U1C-V2R1-EVIDENCE-SHA256SUMS.txt
          sha256sum -c U1C-V2R1-EVIDENCE-SHA256SUMS.txt

      - name: Upload U1C-v2R1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-GEN1-U1C-V2R1-P13-reproduction-diagnostic-builtin-coverage
          path: u1c-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
