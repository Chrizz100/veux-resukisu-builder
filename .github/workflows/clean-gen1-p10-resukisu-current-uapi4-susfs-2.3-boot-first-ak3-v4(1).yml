name: CLEAN GEN1 P10 - Current ReSukiSU kernel/UAPI4 + SUSFS 2.3 boot-first AK3 v4

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: clean-gen1-p10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-boot-ak3:
    runs-on: ubuntu-24.04
    timeout-minutes: 210

    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

      VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
      VENDOR_TAG: '20240619'
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632

      # Exact accepted P6-v11 FULL-SUSFS-2.3 backup lineage.
      P6V11_ARTIFACT_PREFIX: clean-gen1-p6v11-v6-full-susfs-outer-integration-p7-test-boot-
      EXPECTED_P5I_COMMIT: f353a9475e40ca866d570c1d0ef55e24cf6556e4
      EXPECTED_P5I_TREE: a947c1f2891c796a08373fc755e29b23139dc761
      EXPECTED_RESUKISU_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_RESUKISU_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      EXPECTED_KSU_BASELINE_VERSION: '35102'
      EXPECTED_KSU_TARGET_VERSION: '35126'
      EXPECTED_KSU_BASELINE_UAPI: '2'
      EXPECTED_KSU_TARGET_UAPI: '4'

      # Full current ReSukiSU kernel/UAPI import boundary.
      RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
      RESUKISU_COMMON_BASE: faccf4c5edc7be37776216e7d43dd3dca0239331
      RESUKISU_OLD_ANCHOR: 419e270b50ad61725185dec74f438b8cb59c6889
      RESUKISU_TARGET: 830a5aedc742cb7399cccb61df60d55fd7cbcb90
      RESUKISU_EXCLUDED_MODULE_FILTER: b2ac2fc8703ce9f5226e2a38a59f8b72f8a3005c
      RESUKISU_VERSION_MATCH: ff765f8507541ed2c959f331ad23e4650cdfbd83
      RESUKISU_FD_APP_PROFILE: f1ae2cebb3503236cfde52fb3caf8e69f1c083a1
      RESUKISU_LEGACY_LOCK_FIX: 88695111d70a6c4dc490a8f46be7694f9eea36e0
      RESUKISU_POLICYDB_FIX: f5992bfce3b292c69989ae8f41e49769563d2db9
      RESUKISU_WEBVIEW_ALLOWLIST: 5fe98409dc52506f7a5cc1bb8f94d6f5c849b7f0
      RESUKISU_APK_SIGN_HARDENING: 830a5aedc742cb7399cccb61df60d55fd7cbcb90

      # Proven build identity/toolchain; unchanged from the successful P9 build.
      CLANG_PREBUILT_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      KBUILD_BUILD_USER: builder
      KBUILD_BUILD_HOST: pangu-build-component-vendor-345942-54r9t-tw0tk-tq90c
      KBUILD_BUILD_TIMESTAMP: Thu Dec 5 14:47:59 UTC 2024
      KBUILD_BUILD_VERSION: '1'
      SOURCE_DATE_EPOCH: '1733410079'
      KBUILD_FIXED_SCM_SUFFIX: -g82179e362f33
      STOCK_KERNEL_RELEASE: 5.4.274-qgki-g82179e362f33
      P10_EFFECTIVE_KCFLAGS: -D__ANDROID_COMMON_KERNEL__

      # P7 calibrated boot-container identity.
      FINAL_BOOT_RELEASE_TAG: Final_Boot
      FINAL_BOOT_RELEASE_ASSET: Boot.img.zip
      FINAL_BOOT_RELEASE_ZIP_SHA256: 920f2aa04d495771506c9e34ef81776de50273bde82835553cadbb73a864b4b8
      FINAL_BOOT_REFERENCE_BOOT_SHA256: 2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e
      FINAL_BOOT_REFERENCE_KERNEL_SHA256: e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96
      ROLLBACK_GZIP_SHA256: 9a1532ccfc57b465256bba97863f927b80823fa8812a4d13e4f4c8bf9af0c78b
      STOCK_BOOT_SHA256: ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5
      STOCK_BOOT_BYTES: '134217728'
      STOCK_RAMDISK_SHA256: 0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a
      P10_BOOT_NAME: VEUX-GEN1-P10-5.4.274-ReSukiSU-Current-UAPI4-SUSFS-2.3-boot.img

      # Proven successful AK3 checkpoint from the repository's W89 packaging line.
      # The previous P9 pin e3849cc81950620f8043e69c06e330935ade2eec does not exist upstream.
      AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
      AK3_COMMIT: af770f7b16cf8f8eb7c68614b2a693b3b361c90c

      BACKUP_DIR: ${{ github.workspace }}/p6v11-backup
      AUDIT_DIR: ${{ github.workspace }}/clean-gen1-p10-audit
      OUT_A: ${{ github.workspace }}/kernel/out-p10-a
      OUT_B: ${{ github.workspace }}/kernel/out-p10-b
      DIST_DIR: ${{ github.workspace }}/clean-gen1-p10-dist
      BOOT_WORK: ${{ github.workspace }}/p10-boot-calibration

    steps:
      - name: Initialize audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BACKUP_DIR" "$AUDIT_DIR" "$DIST_DIR" "$BOOT_WORK"
          mkdir -p "$BACKUP_DIR" "$AUDIT_DIR" "$DIST_DIR" "$BOOT_WORK"

          cat > "$AUDIT_DIR/00-plan.txt" <<'EOF'
          CLEAN GEN1 P10 current ReSukiSU kernel/UAPI4 boot-first release
          Base: exact last accepted P6-v11 FULL SUSFS 2.3 restore kit.
          Device: VEUX / Linux 5.4.274.
          Release order: Image -> calibrated boot.img -> boot audit -> AnyKernel3 ZIP -> AK3 audit.

          ReSukiSU update policy:
            1) restore the exact accepted P6-v11 / CLEAN-GEN1 source
            2) use real upstream common ancestor faccf4c5 as the import base
            3) import the complete current upstream kernel/ + uapi/ state through 830a5aed
            4) exclude the b2ac2fc8 module-load-filter runtime integration without reverting unrelated later upstream changes
            5) reapply only CLEAN-GEN1 outer hook-contract integration and explicit target identity
            6) upgrade manager-visible compatibility from KSU 35102/UAPI2 to KSU 35126/UAPI4

          No manager/UI/userspace files are copied into the kernel tree.
          Outer SUSFS 2.3 implementation is byte-preserved.
          Current upstream main must be kernel/uapi-identical to the pinned 830a5aed target.
          No real-device boot PASS is claimed by this workflow.
          EOF

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git jq \
            libelf-dev libssl-dev python3 unzip zip zstd

      - name: Checkout exact VEUX vendor source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: '20240619'
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Authenticate vendor source
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
          test "$(make -s kernelversion)" = "5.4.268"
          {
            echo "VENDOR_SHA=$(git rev-parse HEAD)"
            echo "VENDOR_KERNEL_VERSION=$(make -s kernelversion)"
          } | tee "$AUDIT_DIR/01-vendor.txt"

      - name: Locate newest non-expired P6-v11 FULL-SUSFS backup artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidates="$RUNNER_TEMP/p6v11-candidates.tsv"
          : > "$candidates"

          for page in $(seq 1 20); do
            json="$RUNNER_TEMP/artifacts-${page}.json"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}" \
              -o "$json"

            count="$(jq '.artifacts | length' "$json")"
            jq -r --arg prefix "$P6V11_ARTIFACT_PREFIX" '
              .artifacts[]
              | select(.expired == false)
              | select(.name | startswith($prefix))
              | [.created_at, (.id|tostring), .name, .archive_download_url]
              | @tsv
            ' "$json" >> "$candidates"

            test "$count" -eq 100 || break
          done

          test -s "$candidates"
          IFS=$'\t' read -r created artifact_id artifact_name archive_url \
            < <(LC_ALL=C sort -r "$candidates" | head -n1)

          test -n "$artifact_id"
          test -n "$artifact_name"
          test -n "$archive_url"

          {
            echo "P6V11_BACKUP_CREATED=$created"
            echo "P6V11_BACKUP_ARTIFACT_ID=$artifact_id"
            echo "P6V11_BACKUP_ARTIFACT_NAME=$artifact_name"
          } | tee "$AUDIT_DIR/02-backup-selection.txt"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$archive_url" -o "$RUNNER_TEMP/p6v11-backup.zip"

          unzip -q "$RUNNER_TEMP/p6v11-backup.zip" -d "$BACKUP_DIR"

          restore_dir="$(find "$BACKUP_DIR" -type d -name source-restore-kit -print -quit)"
          test -n "$restore_dir"
          test -f "$restore_dir/manifest.json"
          test -f "$restore_dir/SHA256SUMS"
          test -f "$restore_dir/p5i/resukisu-p5i-full.bundle"

          result_file="$(find "$BACKUP_DIR" -type f -name 17-result.txt -print -quit)"
          test -n "$result_file"
          grep -Fxq 'CLEAN_GEN1_P6V11_FULL_SUSFS_OUTER_INTEGRATION_DETERMINISTIC_BUILD=PASS' \
            "$result_file"

          echo "RESTORE_DIR=$restore_dir" >> "$GITHUB_ENV"
          echo "P6V11_RESULT_FILE=$result_file" >> "$GITHUB_ENV"

      - name: Verify backup checksums and manifest
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RESTORE_DIR"
            sha256sum -c SHA256SUMS
          ) | tee "$AUDIT_DIR/03-restore-kit-sha256.txt"

          if test -f "$RESTORE_DIR/p5i/SHA256SUMS"; then
            (
              cd "$RESTORE_DIR/p5i"
              sha256sum -c SHA256SUMS
            ) | tee "$AUDIT_DIR/03b-p5i-sha256.txt"
          fi

          jq -e \
            --arg p5commit "$EXPECTED_P5I_COMMIT" \
            --arg p5tree "$EXPECTED_P5I_TREE" \
            --arg rhead "$EXPECTED_RESUKISU_HEAD" \
            --arg rtree "$EXPECTED_RESUKISU_TREE" \
            '.stage == "CLEAN_GEN1_P6V11_SOURCE"
             and .p5i_commit == $p5commit
             and .p5i_tree == $p5tree
             and .resukisu_head == $rhead
             and .resukisu_tree == $rtree' \
            "$RESTORE_DIR/manifest.json" >/dev/null

          cp "$RESTORE_DIR/manifest.json" "$AUDIT_DIR/03-source-manifest.json"

      - name: Restore exact accepted P6-v11 source tree
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git reset --hard "$EXPECTED_VENDOR_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"

          p5_patch="$RESTORE_DIR/p5i/vendor-20240619-to-p5i-outer.patch"
          p6_patch="$RESTORE_DIR/p5i-to-p6-source-compat.patch"
          p6v11_patch="$RESTORE_DIR/p6v10-to-p6v11-full-susfs-outer.patch"

          for patch in "$p5_patch" "$p6_patch" "$p6v11_patch"; do
            test -s "$patch"
          done

          git apply --check --whitespace=error --binary "$p5_patch"
          git apply --index --whitespace=error --binary "$p5_patch"
          test "$(git write-tree)" = "$EXPECTED_P5I_TREE"

          git apply --check --whitespace=error --binary "$p6_patch"
          git apply --index --whitespace=error --binary "$p6_patch"

          git apply --check --whitespace=error --binary "$p6v11_patch"
          git apply --index --whitespace=error --binary "$p6v11_patch"

          final_expected_tree="$(jq -r '.p6_source_tree' "$RESTORE_DIR/manifest.json")"
          test "$final_expected_tree" != "null"
          test "${#final_expected_tree}" -eq 40
          test "$(git write-tree)" = "$final_expected_tree"
          test "$(make -s kernelversion)" = "5.4.274"

          rm -rf KernelSU
          git init -q KernelSU
          git -C KernelSU fetch -q \
            "$RESTORE_DIR/p5i/resukisu-p5i-full.bundle" \
            refs/heads/clean-gen1-p5i-resukisu:refs/heads/clean-gen1-p5i-resukisu
          git -C KernelSU checkout -q --detach refs/heads/clean-gen1-p5i-resukisu

          test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_RESUKISU_HEAD"
          test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_RESUKISU_TREE"

          {
            echo "P6V11_OUTER_TREE=$final_expected_tree"
            echo "P6V11_RESUKISU_HEAD=$(git -C KernelSU rev-parse HEAD)"
            echo "P6V11_RESUKISU_TREE=$(git -C KernelSU rev-parse HEAD^{tree})"
          } | tee "$AUDIT_DIR/04-restored-source.txt"

      - name: Freeze SUSFS 2.3 outer baseline before ReSukiSU update
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          grep -Fxq 'CONFIG_KSU=y' arch/arm64/configs/veux_defconfig
          grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' arch/arm64/configs/veux_defconfig
          grep -Fxq 'CONFIG_KSU_SUSFS=y' arch/arm64/configs/veux_defconfig
          grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' arch/arm64/configs/veux_defconfig
          grep -Fxq 'CONFIG_LOCALVERSION="-qgki"' arch/arm64/configs/veux_defconfig

          grep -Fq 'DEFINE_SRCU(susfs_srcu_open_redirect)' fs/susfs.c
          grep -Fq 'srcu_read_lock(&susfs_srcu_open_redirect)' fs/susfs.c
          grep -Fq 'hash_for_each_possible_rcu(OPEN_REDIRECT_HLIST' fs/susfs.c
          grep -Fq 'srcu_read_unlock(&susfs_srcu_open_redirect' fs/susfs.c
          grep -Fq 'synchronize_srcu(&susfs_srcu_open_redirect)' fs/susfs.c
          grep -Fq 'susfs_set_current_proc_no_su' include/linux/susfs_def.h
          grep -Fq 'susfs_set_current_proc_umounted' include/linux/susfs_def.h
          grep -Fq 'susfs_set_current_proc_umounted_for_zygote_next' include/linux/susfs_def.h
          test -s include/linux/ksu_hook_contract.h
          test -s KernelSU/kernel/tools/susfs_compat.mk

          grep -Eq 'CLEAN_GEN1_UPSTREAM_COMPAT_VERSION.*35102' KernelSU/kernel/Kbuild
          grep -Eq 'KERNEL_SU_UAPI_VERSION = 2;' KernelSU/uapi/supercall.h

          sha256sum \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h \
            include/linux/ksu_hook_contract.h \
            > "$AUDIT_DIR/05-susfs-outer-before.sha256"

          {
            echo "BASELINE_KSU_VERSION=$EXPECTED_KSU_BASELINE_VERSION"
            echo "BASELINE_KSU_UAPI=$EXPECTED_KSU_BASELINE_UAPI"
            echo "OUTER_SUSFS_BASELINE_FROZEN=PASS"
          } | tee "$AUDIT_DIR/05-baseline.txt"

      - name: Fetch and authenticate current ReSukiSU kernel/UAPI target
        shell: bash
        run: |
          set -euo pipefail
          up="$GITHUB_WORKSPACE/resukisu-upstream"
          rm -rf "$up"
          git clone -q "$RESUKISU_REPO" "$up"

          for sha in \
            "$RESUKISU_COMMON_BASE" \
            "$RESUKISU_OLD_ANCHOR" \
            "$RESUKISU_TARGET" \
            "$RESUKISU_EXCLUDED_MODULE_FILTER" \
            "$RESUKISU_VERSION_MATCH" \
            "$RESUKISU_FD_APP_PROFILE" \
            "$RESUKISU_LEGACY_LOCK_FIX" \
            "$RESUKISU_POLICYDB_FIX" \
            "$RESUKISU_WEBVIEW_ALLOWLIST" \
            "$RESUKISU_APK_SIGN_HARDENING"; do
            git -C "$up" cat-file -e "${sha}^{commit}"
          done

          git -C "$up" merge-base --is-ancestor "$RESUKISU_COMMON_BASE" "$RESUKISU_OLD_ANCHOR"
          git -C "$up" merge-base --is-ancestor "$RESUKISU_OLD_ANCHOR" "$RESUKISU_TARGET"
          git -C "$up" merge-base --is-ancestor "$RESUKISU_EXCLUDED_MODULE_FILTER" "$RESUKISU_TARGET"

          old_to_target_count="$(git -C "$up" rev-list --count "$RESUKISU_OLD_ANCHOR..$RESUKISU_TARGET")"
          test "$old_to_target_count" = '24'

          target_commit_count="$(git -C "$up" rev-list --count "$RESUKISU_TARGET")"
          target_version="$((30700 + target_commit_count))"
          test "$target_version" = "$EXPECTED_KSU_TARGET_VERSION"

          target_tag="$(git -C "$up" describe --abbrev=0 --tags "$RESUKISU_TARGET")"
          test -n "$target_tag"

          main_head="$(git -C "$up" rev-parse HEAD)"
          git -C "$up" diff --quiet "$RESUKISU_TARGET" "$main_head" -- kernel uapi

          grep -Eq "KERNEL_SU_UAPI_VERSION = ${EXPECTED_KSU_TARGET_UAPI};" \
            "$up/uapi/supercall.h"
          grep -Fq 'KSU_GET_INFO_FLAG_BUNDLED' "$up/uapi/supercall.h"

          git -C "$up" log --reverse --format='%H %s' \
            "$RESUKISU_COMMON_BASE..$RESUKISU_TARGET" -- kernel uapi \
            > "$AUDIT_DIR/06-upstream-kernel-uapi-history.txt"

          for sha in \
            "$RESUKISU_VERSION_MATCH" \
            "$RESUKISU_FD_APP_PROFILE" \
            "$RESUKISU_LEGACY_LOCK_FIX" \
            "$RESUKISU_POLICYDB_FIX" \
            "$RESUKISU_WEBVIEW_ALLOWLIST" \
            "$RESUKISU_APK_SIGN_HARDENING"; do
            grep -Fq "$sha" "$AUDIT_DIR/06-upstream-kernel-uapi-history.txt"
          done

          {
            echo "RESUKISU_COMMON_BASE=$RESUKISU_COMMON_BASE"
            echo "RESUKISU_OLD_ANCHOR=$RESUKISU_OLD_ANCHOR"
            echo "RESUKISU_TARGET=$RESUKISU_TARGET"
            echo "RESUKISU_CURRENT_MAIN=$main_head"
            echo "OLD_ANCHOR_TO_TARGET_COMMITS=$old_to_target_count"
            echo "TARGET_TAG=$target_tag"
            echo "TARGET_KSU_VERSION=$target_version"
            echo "TARGET_KSU_UAPI=$EXPECTED_KSU_TARGET_UAPI"
            echo "CURRENT_MAIN_KERNEL_UAPI_AT_TARGET=PASS"
          } | tee "$AUDIT_DIR/06-upstream-target.txt"

          echo "P10_TARGET_TAG=$target_tag" >> "$GITHUB_ENV"
          echo "P10_EXPECTED_VERSION_FRAGMENT=${target_tag}-830a5aed-p10@ReSukiSU" >> "$GITHUB_ENV"

      - name: Construct exact upstream kernel/UAPI target minus excluded module-load filter
        shell: bash
        run: |
          set -euo pipefail
          up="$GITHUB_WORKSPACE/resukisu-upstream"

          git -C "$up" checkout -q --detach "$RESUKISU_TARGET"
          git -C "$up" reset --hard -q "$RESUKISU_TARGET"
          git -C "$up" clean -fdx -q

          # b2ac2fc8 touched userspace and generic compatibility helpers as well as the
          # actual module-load-filter feature. Reverting the whole historical commit
          # against today's target conflicts with later upstream work. P10 excludes the
          # feature itself fail-closed while preserving every unrelated later update.
          python3 - <<'PY'
          from pathlib import Path

          import os
          root = Path(os.environ["GITHUB_WORKSPACE"]) / "resukisu-upstream"

          def remove_exact(path, block, expected=1):
              p = root / path
              text = p.read_text()
              count = text.count(block)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {block!r}")
              p.write_text(text.replace(block, "", expected))

          for rel in (
              "kernel/feature/module_load_filter.c",
              "kernel/feature/module_load_filter.h",
          ):
              p = root / rel
              if not p.is_file():
                  raise SystemExit(f"expected upstream module-load-filter file missing: {rel}")
              p.unlink()

          remove_exact("kernel/Kbuild", "kernelsu-objs += feature/module_load_filter.o\n")
          remove_exact("kernel/core/init.c", '#include "feature/module_load_filter.h"\n')
          remove_exact(
              "kernel/core/init.c",
              'char ksu_block_modules[256];\n'
              'module_param_string(block_modules, ksu_block_modules, sizeof(ksu_block_modules), 0);\n'
              'MODULE_PARM_DESC(block_modules, "Comma-separated preset module names to acknowledge without loading");\n\n'
          )
          remove_exact("kernel/core/init.c", "        ksu_module_load_filter_hook_init();\n\n")
          remove_exact("kernel/core/init.c", "    ksu_module_load_filter_hook_exit();\n")
          PY

          test ! -e "$up/kernel/feature/module_load_filter.c"
          test ! -e "$up/kernel/feature/module_load_filter.h"
          ! grep -RFn 'module_load_filter' "$up/kernel" "$up/uapi"
          ! grep -RFn 'ksu_block_modules' "$up/kernel" "$up/uapi"
          ! grep -RFn 'block_modules' "$up/kernel" "$up/uapi"
          test -z "$(git -C "$up" ls-files -u)"
          git -C "$up" diff --check

          patch="$AUDIT_DIR/07-upstream-current-kernel-uapi-minus-module-filter.patch"
          git -C "$up" diff --binary "$RESUKISU_COMMON_BASE" -- kernel uapi > "$patch"
          test -s "$patch"
          git -C "$up" diff --name-only "$RESUKISU_COMMON_BASE" -- kernel uapi \
            | LC_ALL=C sort > "$AUDIT_DIR/07-upstream-current-paths.txt"

          grep -Fxq 'kernel/feature/sucompat.c' "$AUDIT_DIR/07-upstream-current-paths.txt"
          grep -Fxq 'kernel/feature/selinux_hide.c' "$AUDIT_DIR/07-upstream-current-paths.txt"
          grep -Fxq 'kernel/selinux/sepolicy.c' "$AUDIT_DIR/07-upstream-current-paths.txt"
          grep -Fxq 'kernel/manager/apk_sign.c' "$AUDIT_DIR/07-upstream-current-paths.txt"
          grep -Fxq 'uapi/supercall.h' "$AUDIT_DIR/07-upstream-current-paths.txt"
          ! grep -Fxq 'kernel/feature/module_load_filter.c' "$AUDIT_DIR/07-upstream-current-paths.txt"
          ! grep -Fxq 'kernel/feature/module_load_filter.h' "$AUDIT_DIR/07-upstream-current-paths.txt"

          {
            echo "FULL_CURRENT_KERNEL_UAPI_PATCH=PASS"
            echo "MODULE_LOAD_FILTER_FUNCTIONALITY_EXCLUDED_FROM_TARGET=PASS"
            echo "LATER_UPSTREAM_CHANGES_PRESERVED=PASS"
            echo "PATCH_SHA256=$(sha256sum "$patch" | awk '{print $1}')"
            echo "PATCH_PATH_COUNT=$(wc -l < "$AUDIT_DIR/07-upstream-current-paths.txt")"
          } | tee "$AUDIT_DIR/07-upstream-current-result.txt"

      - name: Replace selected-import KernelSU subtree with full current kernel/UAPI target
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          up="$GITHUB_WORKSPACE/resukisu-upstream"
          patch="$AUDIT_DIR/07-upstream-current-kernel-uapi-minus-module-filter.patch"

          test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_RESUKISU_HEAD"
          test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_RESUKISU_TREE"
          git -C KernelSU cat-file -e "${RESUKISU_COMMON_BASE}^{commit}"
          git -C KernelSU merge-base --is-ancestor "$RESUKISU_COMMON_BASE" HEAD

          git -C KernelSU diff --binary "$RESUKISU_COMMON_BASE" HEAD -- kernel uapi \
            > "$AUDIT_DIR/08-old-selected-import-kernel-uapi.patch"

          git -C KernelSU reset --hard "$RESUKISU_COMMON_BASE"
          git -C KernelSU clean -fdx
          test "$(git -C KernelSU rev-parse HEAD)" = "$RESUKISU_COMMON_BASE"

          # Preserve the authenticated upstream target byte-for-byte. The upstream
          # patch itself contains two pre-existing trailing-whitespace lines in
          # kernel/build-all-x64.sh, so --whitespace=error would reject authentic
          # upstream content. Byte parity below is the authoritative import gate.
          git -C KernelSU apply --check --whitespace=nowarn "$patch"
          git -C KernelSU apply --index --whitespace=nowarn "$patch"
          test -z "$(git -C KernelSU ls-files -u)"

          parity="$AUDIT_DIR/08-upstream-byte-parity.txt"
          : > "$parity"
          if ! diff -qr "$up/kernel" KernelSU/kernel >> "$parity" 2>&1; then
            cat "$parity"
            exit 1
          fi
          if ! diff -qr "$up/uapi" KernelSU/uapi >> "$parity" 2>&1; then
            cat "$parity"
            exit 1
          fi

          echo 'UPSTREAM_TARGET_MINUS_EXCLUSION_BYTE_MATCH=PASS' | tee -a "$parity"

      - name: Reapply CLEAN-GEN1 integration contract and current target identity
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def ensure_include(path, anchor):
              p = Path(path)
              text = p.read_text()
              inc = '#include <linux/ksu_hook_contract.h>'
              if inc not in text:
                  if anchor not in text:
                      raise SystemExit(f'anchor missing in {path}: {anchor!r}')
                  text = text.replace(anchor, anchor + '\n' + inc, 1)
                  p.write_text(text)

          ensure_include('KernelSU/kernel/feature/sucompat.h', '#include "compat/kernel_compat.h"')
          ensure_include('KernelSU/kernel/runtime/ksud_integration.c', '#include <linux/version.h>')
          ensure_include('KernelSU/kernel/supercall/supercall.c', '#include <linux/anon_inodes.h>')

          p = Path('KernelSU/kernel/Kbuild')
          text = p.read_text()
          old = dedent('''\
          KSU_LOCAL_VERSION := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-list --count HEAD)
          KSU_VERSION := $(shell expr 30000 + $(KSU_LOCAL_VERSION) + 700)

          KSU_TAG_NAME    := $(shell cd $(KSU_SRC); $(GIT_BIN) describe --abbrev=0 --tags 2>/dev/null || echo "v4.1.0")
          KSU_COMMIT_SHA  := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-parse --short=8 HEAD 2>/dev/null || echo "unknown")
          ifneq ($(shell cd $(KSU_SRC); $(GIT_BIN) diff-index --quiet HEAD; echo $$?),0)
          KSU_COMMIT_SHA  := $(KSU_COMMIT_SHA)-dirty
          endif
          KSU_BRANCH_NAME := $(shell cd $(KSU_SRC); $(GIT_BIN) branch --show-current 2>/dev/null || echo "unknown")''')
          new = dedent('''\
          KSU_LOCAL_VERSION := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-list --count HEAD)
          # CLEAN-GEN1 P10: the source tree is an audited import of the pinned upstream
          # kernel/UAPI target, not a claim that this local git HEAD equals that upstream SHA.
          CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := 35126
          CLEAN_GEN1_UPSTREAM_TARGET := 830a5aedc742cb7399cccb61df60d55fd7cbcb90
          KSU_VERSION := $(CLEAN_GEN1_UPSTREAM_COMPAT_VERSION)

          KSU_TAG_NAME    := $(P10_TARGET_TAG)
          KSU_COMMIT_SHA  := 830a5aed-p10
          KSU_BRANCH_NAME := clean-gen1-p10''')
          if old not in text:
              raise SystemExit('expected upstream Kbuild version block not found')
          p.write_text(text.replace(old, new, 1))
          PY

          git -C KernelSU add kernel uapi
          # The complete authenticated upstream import intentionally preserves two
          # pre-existing trailing-whitespace lines in kernel/build-all-x64.sh.
          # Check only the four CLEAN-GEN1 integration files modified in this step.
          git -C KernelSU diff --cached --check -- \
            kernel/Kbuild \
            kernel/feature/sucompat.h \
            kernel/runtime/ksud_integration.c \
            kernel/supercall/supercall.c
          test -z "$(git -C KernelSU ls-files -u)"

          grep -Fq '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/feature/sucompat.h
          grep -Fq '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/runtime/ksud_integration.c
          grep -Fq '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/supercall/supercall.c
          grep -Fq 'CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := 35126' KernelSU/kernel/Kbuild
          grep -Fq 'CLEAN_GEN1_UPSTREAM_TARGET := 830a5aedc742cb7399cccb61df60d55fd7cbcb90' KernelSU/kernel/Kbuild
          grep -Fq 'KSU_COMMIT_SHA  := 830a5aed-p10' KernelSU/kernel/Kbuild
          grep -Fq 'KSU_BRANCH_NAME := clean-gen1-p10' KernelSU/kernel/Kbuild

      - name: Verify UAPI4 current ReSukiSU semantics and preserved SUSFS boundary
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          grep -Eq "KERNEL_SU_UAPI_VERSION = ${EXPECTED_KSU_TARGET_UAPI};" KernelSU/uapi/supercall.h
          grep -Fq 'KSU_GET_INFO_FLAG_BUNDLED' KernelSU/uapi/supercall.h
          grep -Fq 'ksu_handle_post_execve' KernelSU/kernel/feature/sucompat.c
          grep -Fq 'rwlock_init(&fake_state.ss->policy_rwlock)' KernelSU/kernel/feature/selinux_hide.c

          # Previously reviewed fixes must all be present in the full target.
          grep -Fq 'old_db->p_types.nprim * (sizeof(u32) + sizeof(u64))' KernelSU/kernel/selinux/sepolicy.c
          grep -Fq 'new_db->len = len;' KernelSU/kernel/selinux/sepolicy.c
          ! grep -RFn 'ksu_webview_zygote_umount_enabled' \
