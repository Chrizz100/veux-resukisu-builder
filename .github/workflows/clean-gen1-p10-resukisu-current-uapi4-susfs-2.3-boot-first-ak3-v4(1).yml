          rm -rf "$OUT_B"
          make O="$OUT_B" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 veux_defconfig \
            2>&1 | tee "$AUDIT_DIR/12-build-b-config.log"

