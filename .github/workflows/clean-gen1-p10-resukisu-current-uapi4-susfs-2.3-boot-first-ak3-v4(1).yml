            echo "RESUKISU_CURRENT_KERNEL_UAPI_TARGET=PASS"
            echo "RESUKISU_TARGET_COMMIT=$RESUKISU_TARGET"
            echo "KSU_VERSION_BASELINE=$EXPECTED_KSU_BASELINE_VERSION"
            echo "KSU_VERSION_TARGET=$EXPECTED_KSU_TARGET_VERSION"
            echo "KSU_UAPI_BASELINE=$EXPECTED_KSU_BASELINE_UAPI"
            echo "KSU_UAPI_TARGET=$EXPECTED_KSU_TARGET_UAPI"
            echo "MODULE_LOAD_FILTER_EXCLUDED=PASS"
            echo "LOCAL_OUTER_HOOK_CONTRACT_REAPPLIED=PASS"
            echo "UPSTREAM_TARGET_MINUS_EXCLUSION_BYTE_MATCH=PASS"
            echo "CURRENT_MAIN_KERNEL_UAPI_AT_TARGET=PASS"
          } | tee "$AUDIT_DIR/08-boundaries.txt"

      - name: Save exact P10 ReSukiSU kernel/UAPI delta and hashes
        working-directory: kernel
