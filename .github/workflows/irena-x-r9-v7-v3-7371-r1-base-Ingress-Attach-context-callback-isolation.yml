name: Irena X 7371 R9 v7-v3 Ingress Attach context callback isolation diagnostic on R1-v2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRAMEWORK_FAMILY: Irena-X
  FRAMEWORK_VERSION: v2.0.1
  FRAMEWORK_BUILD: "7371"
  XPOSED_API_LINE: "100+101"

  IRENA_REPO: silvzr/LSP-IrenaX
  IRENA_COMMIT: da439fbbed506dac6c66074af7fda8982aa4fc6a
  CURRENT_LSPLANT_SHA: c5b46bb4f6a99ffe0c77ce3ab006d3f67d5a2b1c
  CURRENT_DOBBY_SHA: dc7b4be06ad6c5dcfb0bb4ca2082b007d69eaed5

  OLD_WORKING_REPO: mywalkb/LSPosed_mod
  OLD_WORKING_COMMIT: 9770579f313de44397c295fd1cc44e3fcec4777c

  OFFICIAL_RELEASE_URL: https://github.com/silvzr/LSP-IrenaX/releases/download/v2.0.1/LSPosed-v2.0.1-7371-IrenaX-release.zip
  OFFICIAL_RELEASE_SHA256: 99e7aaf54dda0e6fa746c55613483a80620174f255dd05e102713778a9966d2f

  FINAL_ZIP: LSPosed-v2.0.1-7371-IrenaX-R9-v7-v3-R1-base-Ingress-Attach-context-callback-isolation-diagnostic.zip

jobs:
  build:
    name: Build R9 v7-v3 Ingress Attach context callback isolation diagnostic
    runs-on: ubuntu-latest

    steps:
    - name: Freeze R9 diagnostic contract
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p r9-output
        {
          echo "PARENT_RUNTIME=R1-v2"
          echo "PARENT_PACKAGE_SHA256=7ed948db19d92b0dd7776c424f93783e10210082ea807345228e901ab9ce4af7"
          echo "R8_V4_RUNTIME_TEST=VALID_MARKER_PRESENT"
          echo "R8_V4_RESULT=PairIP still crashes after XposedInit.loadLegacyModules was globally skipped"
          echo "R8_V4_CONCLUSION=classic legacy-module loading/static initialization is not necessary for the crash"
          echo "R9_V2_RESULT=OpenDex subgroup suppressed; same PairIP plus_0x65768 crash"
          echo "R9_V3_RESULT=CrashDump registration suppressed with valid marker; same PairIP plus_0x65768 crash"
          echo "R9_V4_RESULT=Ingress LoadedApkCtor callback skipped with valid marker; same PairIP plus_0x65768 crash"
          echo "R9_V5_RESULT=LoadedApkCtor registration suppressed with valid internal marker; same PairIP plus_0x65768 crash"
          echo "R9_V6_RESULT=LoadedApkCreateCL registration suppressed with valid internal marker; same PairIP plus_0x65768 crash"
          echo "R9_V6_CONCLUSION=LoadedApkCreateCLHooker registration/ART state is not necessary"
          echo "R9_V7_RESULT=INVALID_GUARD_SOURCE; ActivityThread.currentProcessName was null in Ingress attach callback, so intended skip did not execute"
          echo "R9_V7_V2_RESULT=VALID_OBSERVER; AttachHooker entered before PairIP load/crash"
          echo "R9_V7_V2_OBSERVED_IDENTITY=currentProcess=null; currentPackage=null; LSPosedContext.processName=com.nianticproject.ingress"
          echo "R9_BASE=official Irena X 7371 + exact R1-v2 mIncludeCode compatibility fix"
          echo "R9_V7_V3_ONLY_NEW_FUNCTIONAL_CHANGE=for LSPosedContext.processName com.nianticproject.ingress only, return from AttachHooker before XposedInit.loadModules"
          echo "R9_V7_V3_ALL_BOOTSTRAP_REGISTRATIONS=UNCHANGED_R1_V2"
          echo "R9_V7_V3_ATTACH_REGISTRATION=UNCHANGED_R1_V2"
          echo "R9_V7_V3_ATTACH_CALLBACK_NON_INGRESS=UNCHANGED"
          echo "R9_V7_V3_ATTACH_CALLBACK_INGRESS=SUPPRESSED_BY_CONTEXT_PROCESS"
          echo "R9_START_BOOTSTRAP_HOOK_INVOCATION=UNCHANGED"
          echo "R9_LEGACY_MODULE_LOADING=UNCHANGED"
          echo "R9_NATIVE_HOOK_BRIDGE=UNCHANGED"
          echo "R9_LSPLANT=UNCHANGED"
          echo "R9_DOBBY=UNCHANGED"
          echo "P7_MOUNT_SUPPRESSION=NOT_APPLIED"
          echo "P10_CERT_REBUILD_PATCH=NOT_APPLIED"
          echo "R2_DEOPT_ROLLBACK=NOT_APPLIED"
          echo "PAIRIP_BYPASS=NOT_ATTEMPTED"
          echo "DEVICE_OBJECTIVE=determine whether XposedInit.loadModules in the Ingress AttachHooker callback is necessary, using the now-proven LSPosedContext.processName identity"
        } | tee r9-output/R9_DIAGNOSTIC_CONTRACT.txt

    - name: Checkout pinned Irena X 7371
      uses: actions/checkout@v4
      with:
        repository: ${{ env.IRENA_REPO }}
        ref: ${{ env.IRENA_COMMIT }}
        submodules: recursive
        fetch-depth: 0
        path: LSP-IrenaX
        persist-credentials: false

    - name: Checkout old working 7244 reference
      uses: actions/checkout@v4
      with:
        repository: ${{ env.OLD_WORKING_REPO }}
        ref: ${{ env.OLD_WORKING_COMMIT }}
        submodules: false
        fetch-depth: 1
        path: LSPosed-7244-reference
        persist-credentials: false

    - name: Verify exact source pins and regression preconditions
      shell: bash
      run: |
        set -euo pipefail

        test "$(git -C LSP-IrenaX rev-parse HEAD)" = "$IRENA_COMMIT"
        test -z "$(git -C LSP-IrenaX status --porcelain)"
        test "$(git -C LSP-IrenaX/external/lsplant rev-parse HEAD)" = "$CURRENT_LSPLANT_SHA"
        test "$(git -C LSP-IrenaX/external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
        test -z "$(git -C LSP-IrenaX/external/lsplant status --porcelain)"
        test -z "$(git -C LSP-IrenaX/external/dobby status --porcelain)"

        test "$(git -C LSPosed-7244-reference rev-parse HEAD)" = "$OLD_WORKING_COMMIT"

        current="LSP-IrenaX/core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"
        old="LSPosed-7244-reference/core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"

        test -f "$current"
        test -f "$old"

        grep -Fq 'boolean includeCode = XposedHelpers.getBooleanField(loadedApk, "mIncludeCode");' "$current"
        grep -Fq 'else if (!includeCode)' "$current"

        if grep -Fq 'mIncludeCode' "$old"; then
          echo "old working 7244 unexpectedly contains mIncludeCode access"
          exit 1
        fi

        {
          echo "IRENA=$(git -C LSP-IrenaX rev-parse HEAD)"
          echo "LSPLANT=$(git -C LSP-IrenaX/external/lsplant rev-parse HEAD)"
          echo "DOBBY=$(git -C LSP-IrenaX/external/dobby rev-parse HEAD)"
          echo "OLD_WORKING_7244=$(git -C LSPosed-7244-reference rev-parse HEAD)"
          echo "CURRENT_7371_M_INCLUDE_CODE=PRESENT"
          echo "OLD_7244_M_INCLUDE_CODE=ABSENT"
        } | tee r9-output/R9_SOURCE_PINS_AND_PRECONDITIONS.txt

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: 'false'
        packages: ''

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        max-size: 2G
        key: irena-x-r1-clean-base-${{ runner.os }}
        restore-keys: |
          irena-x-${{ runner.os }}
        save: false

    - name: Setup Ninja 1.12.1
      uses: seanmiddleditch/gha-setup-ninja@master
      with:
        version: 1.12.1

    - name: Remove Android bundled CMake
      shell: bash
      run: rm -rf "$ANDROID_HOME/cmake"

    - name: Configure Gradle
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.gradle
        {
          echo 'org.gradle.caching=true'
          echo 'org.gradle.parallel=true'
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC'
          echo 'android.native.buildOutput=verbose'
        } >> ~/.gradle/gradle.properties

    - name: Download and verify official Irena 7371 release
      id: official
      shell: bash
      run: |
        set -euo pipefail

        curl --fail --location --retry 3 \
          -o OFFICIAL_RELEASE.zip \
          "$OFFICIAL_RELEASE_URL"

        echo "$OFFICIAL_RELEASE_SHA256  OFFICIAL_RELEASE.zip" | sha256sum -c -

        rm -rf officialcmp
        mkdir officialcmp
        unzip -q OFFICIAL_RELEASE.zip -d officialcmp
        unzip -t OFFICIAL_RELEASE.zip

        test -f officialcmp/manager.apk
        test -f officialcmp/daemon.apk
        test -f officialcmp/framework/lspd.dex

        python3 - <<'PY'
        import zipfile
        with zipfile.ZipFile("OFFICIAL_RELEASE.zip") as z:
            names = z.namelist()
            if len(names) != len(set(names)):
                raise SystemExit("duplicate names in official release")
            if len([n for n in names if not n.endswith("/")]) != 56:
                raise SystemExit("official release file count is not 56")
            bad = z.testzip()
            if bad:
                raise SystemExit(f"official release CRC failure: {bad}")
        PY

        sha256sum OFFICIAL_RELEASE.zip \
          > r9-output/R9_OFFICIAL_RELEASE_SHA256.txt

    - name: Apply exact R1 fix plus Ingress Attach context callback isolation
      id: patch
      if: steps.official.outcome == 'success'
      working-directory: LSP-IrenaX
      shell: bash
      run: |
        set -euo pipefail

        # A) Reproduce exact confirmed R1-v2 mIncludeCode compatibility fix.
        python3 - <<'PY'
        from pathlib import Path

        p = Path("core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java")
        s = p.read_text()

        line = '            boolean includeCode = XposedHelpers.getBooleanField(loadedApk, "mIncludeCode");\n'
        branch = (
            '            } else if (!includeCode) {\n'
            '                Hookers.logD("LoadedApk#<init> has no code, skip: " + mAppDir);\n'
            '                return;\n'
        )

        if s.count(line) != 1:
            raise SystemExit(f"R1 precondition failed: mIncludeCode read count={s.count(line)}")
        if s.count(branch) != 1:
            raise SystemExit(f"R1 precondition failed: no-code branch count={s.count(branch)}")

        s = s.replace(line, "", 1)
        s = s.replace(branch, "", 1)

        if 'mIncludeCode' in s:
            raise SystemExit("R1-v2 mIncludeCode regression")

        p.write_text(s)
        PY

        # B) R9-v7-v3 one-variable diagnostic:
        #    Keep every bootstrap registration identical to R1-v2. The R9-v7-v2 device observer proved
        #    ActivityThread currentProcess/currentPackage are null here while LSPosedContext.processName
        #    is already com.nianticproject.ingress. Only for that exact context process, return before
        #    XposedInit.loadModules(); all other processes keep the normal R1-v2 callback behavior.
        python3 - <<'PY'
        from pathlib import Path

        p = Path("core/src/main/java/org/lsposed/lspd/hooker/AttachHooker.java")
        s = p.read_text()

        old = (
            '    public static void after(XposedInterface.AfterHookCallback callback) {\n'
            '        XposedInit.loadModules((ActivityThread) callback.getThisObject());\n'
            '    }\n'
        )
        new = (
            '    public static void after(XposedInterface.AfterHookCallback callback) {\n'
            '        String r9v7ContextProcess = org.lsposed.lspd.impl.LSPosedContext.processName;\n'
            '        if ("com.nianticproject.ingress".equals(r9v7ContextProcess)) {\n'
            '            android.util.Log.w("LSPosed-R9", "ATTACH_CALLBACK_SKIPPED_CONTEXT process=" + r9v7ContextProcess);\n'
            '            return;\n'
            '        }\n'
            '        XposedInit.loadModules((ActivityThread) callback.getThisObject());\n'
            '    }\n'
        )

        if s.count(old) != 1:
            raise SystemExit(f"AttachHooker callback anchor count={s.count(old)}")
        s = s.replace(old, new, 1)

        if s.count('ATTACH_CALLBACK_SKIPPED_CONTEXT') != 1:
            raise SystemExit("R9-v7-v3 skip marker count mismatch")
        if s.count('org.lsposed.lspd.impl.LSPosedContext.processName') != 1:
            raise SystemExit("R9-v7-v3 context process source mismatch")
        if s.count('"com.nianticproject.ingress".equals(r9v7ContextProcess)') != 1:
            raise SystemExit("R9-v7-v3 Ingress context guard mismatch")
        if 'ActivityThread.currentProcessName()' in s or 'ActivityThread.currentPackageName()' in s:
            raise SystemExit("R9-v7-v3 must not reuse the invalid ActivityThread identity sources")
        if s.count('XposedInit.loadModules((ActivityThread) callback.getThisObject());') != 1:
            raise SystemExit("normal non-Ingress loadModules call must remain exactly once")

        p.write_text(s)
        PY

        # Startup.java must be fully unchanged from official 7371.
        git diff --exit-code "$IRENA_COMMIT" -- core/src/main/java/org/lsposed/lspd/core/Startup.java

        # Normalize only the context guard block and prove AttachHooker otherwise equals pinned 7371.
        python3 - <<'PY'
        from pathlib import Path
        import os, subprocess

        path = "core/src/main/java/org/lsposed/lspd/hooker/AttachHooker.java"
        commit = os.environ["IRENA_COMMIT"]
        original = subprocess.check_output(["git", "show", f"{commit}:{path}"], text=True)
        current = Path(path).read_text()
        diagnostic = (
            '    public static void after(XposedInterface.AfterHookCallback callback) {\n'
            '        String r9v7ContextProcess = org.lsposed.lspd.impl.LSPosedContext.processName;\n'
            '        if ("com.nianticproject.ingress".equals(r9v7ContextProcess)) {\n'
            '            android.util.Log.w("LSPosed-R9", "ATTACH_CALLBACK_SKIPPED_CONTEXT process=" + r9v7ContextProcess);\n'
            '            return;\n'
            '        }\n'
            '        XposedInit.loadModules((ActivityThread) callback.getThisObject());\n'
            '    }\n'
        )
        original_method = (
            '    public static void after(XposedInterface.AfterHookCallback callback) {\n'
            '        XposedInit.loadModules((ActivityThread) callback.getThisObject());\n'
            '    }\n'
        )
        if current.count(diagnostic) != 1:
            raise SystemExit("R9-v7-v3 diagnostic block not unique")
        normalized = current.replace(diagnostic, original_method, 1)
        if normalized != original:
            raise SystemExit("R9-v7-v3 changed more than the intended AttachHooker context guard")
        PY

        git diff --check

        mapfile -t changed < <(git diff --name-only | sort)
        printf '%s\n' "${changed[@]}" | tee ../r9-output/R9_SOURCE_DIFF_NAMES.txt

        test "${#changed[@]}" -eq 2
        test "${changed[0]}" = "core/src/main/java/org/lsposed/lspd/hooker/AttachHooker.java"
        test "${changed[1]}" = "core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"

        if grep -Fq 'mIncludeCode' core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java; then
          echo "R1-v2 mIncludeCode fix was lost"
          exit 1
        fi
        if grep -Fq 'LOADEDAPK_CTOR_CALLBACK_SKIPPED' core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java; then
          echo "R9-v4 callback suppression leaked"
          exit 1
        fi

        grep -Fq 'ATTACH_CALLBACK_SKIPPED_CONTEXT' core/src/main/java/org/lsposed/lspd/hooker/AttachHooker.java
        grep -Fq 'org.lsposed.lspd.impl.LSPosedContext.processName' core/src/main/java/org/lsposed/lspd/hooker/AttachHooker.java
        grep -Fq '"com.nianticproject.ingress".equals(r9v7ContextProcess)' core/src/main/java/org/lsposed/lspd/hooker/AttachHooker.java
        grep -Fq 'XposedInit.loadModules((ActivityThread) callback.getThisObject());' core/src/main/java/org/lsposed/lspd/hooker/AttachHooker.java
        if grep -Fq 'ActivityThread.currentProcessName()' core/src/main/java/org/lsposed/lspd/hooker/AttachHooker.java || grep -Fq 'ActivityThread.currentPackageName()' core/src/main/java/org/lsposed/lspd/hooker/AttachHooker.java; then
          echo "invalid R9-v7 ActivityThread identity source leaked into R9-v7-v3"
          exit 1
        fi

        # Every Bootstrap registration remains exactly official/R1-v2.
        grep -Fq 'LSPosedHelper.hookMethod(CrashDumpHooker.class, Thread.class, "dispatchUncaughtException", Throwable.class);' core/src/main/java/org/lsposed/lspd/core/Startup.java
        grep -Fq 'LSPosedHelper.hookAllMethods(OpenDexFileHooker.class, DexFile.class, "openDexFile");' core/src/main/java/org/lsposed/lspd/core/Startup.java
        grep -Fq 'LSPosedHelper.hookAllMethods(OpenDexFileHooker.class, DexFile.class, "openInMemoryDexFile");' core/src/main/java/org/lsposed/lspd/core/Startup.java
        grep -Fq 'LSPosedHelper.hookAllMethods(OpenDexFileHooker.class, DexFile.class, "openInMemoryDexFiles");' core/src/main/java/org/lsposed/lspd/core/Startup.java
        grep -Fq 'LSPosedHelper.hookConstructor(LoadedApkCtorHooker.class, LoadedApk.class,' core/src/main/java/org/lsposed/lspd/core/Startup.java
        grep -Fq 'LSPosedHelper.hookMethod(LoadedApkCreateCLHooker.class, LoadedApk.class, "createOrUpdateClassLoaderLocked", List.class);' core/src/main/java/org/lsposed/lspd/core/Startup.java
        grep -Fq 'LSPosedHelper.hookAllMethods(AttachHooker.class, ActivityThread.class, "attach");' core/src/main/java/org/lsposed/lspd/core/Startup.java
        grep -Fq 'startBootstrapHook(XposedInit.startsSystemServer);' core/src/main/java/org/lsposed/lspd/core/Startup.java
        grep -Fq 'XposedInit.loadLegacyModules();' core/src/main/java/org/lsposed/lspd/core/Startup.java

        # Freeze package dispatch, loader, hook-engine/native paths and all other hookers.
        git diff --exit-code "$IRENA_COMMIT" -- \
          core/src/main/java/de/robv/android/xposed/XposedBridge.java \
          core/src/main/java/de/robv/android/xposed/XposedInit.java \
          core/src/main/java/org/lsposed/lspd/core/Startup.java \
          core/src/main/java/org/lsposed/lspd/deopt/InlinedMethodCallers.java \
          core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java \
          core/src/main/java/org/lsposed/lspd/hooker/OpenDexFileHooker.java \
          core/src/main/java/org/lsposed/lspd/impl/LSPosedBridge.java \
          core/src/main/java/org/lsposed/lspd/nativebridge/HookBridge.java \
          core/src/main/jni/src/jni/hook_bridge.cpp \
          core/src/main/jni/src/native_api.cpp \
          daemon/build.gradle.kts \
          daemon/src/main/java/org/lsposed/lspd/service/Dex2OatService.java \
          daemon/src/main/java/org/lsposed/lspd/util/InstallerVerifier.java \
          magisk-loader/src/main/jni/api/zygisk_main.cpp \
          magisk-loader/src/main/jni/src/magisk_loader.cpp

        test "$(git -C external/lsplant rev-parse HEAD)" = "$CURRENT_LSPLANT_SHA"
        test "$(git -C external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
        test -z "$(git -C external/lsplant status --porcelain)"
        test -z "$(git -C external/dobby status --porcelain)"

        git diff > ../r9-output/R9_SOURCE_FULL.patch

        {
          echo "PARENT=R1-v2 device framework PASS"
          echo "PARENT_PACKAGE_SHA256=7ed948db19d92b0dd7776c424f93783e10210082ea807345228e901ab9ce4af7"
          echo "SOURCE_DELTA_VS_OFFICIAL=AttachHooker.java + LoadedApkCtorHooker.java"
          echo "FUNCTIONAL_DELTA_VS_R1=Ingress-only AttachHooker callback suppression before XposedInit.loadModules using LSPosedContext.processName"
          echo "M_INCLUDE_CODE_FIX=PRESERVED"
          echo "R9_V6_RUNTIME_STATUS=VALID_INTERNAL_MARKER_PLUS_SAME_PAIRIP_0x65768_CRASH"
          echo "R9_V7_RUNTIME_STATUS=INVALID_GUARD_SOURCE_CURRENT_PROCESS_NULL"
          echo "ALL_BOOTSTRAP_REGISTRATIONS=UNCHANGED_R1_V2"
          echo "ATTACH_REGISTRATION=UNCHANGED_R1_V2"
          echo "R9_V7_V2_RUNTIME_STATUS=VALID_ATTACH_ENTER_BEFORE_PAIRIP_CONTEXT_PROCESS_VALID"
          echo "ATTACH_CALLBACK_INGRESS=SUPPRESSED_BY_CONTEXT_PROCESS"
          echo "ATTACH_CALLBACK_NON_INGRESS=UNCHANGED"
          echo "ATTACH_IDENTITY_SOURCE=LSPosedContext.processName"
          echo "START_BOOTSTRAP_HOOK_INVOCATION=UNCHANGED"
          echo "LEGACY_MODULE_LOADING=UNCHANGED"
          echo "NATIVE_HOOK_BRIDGE=UNCHANGED"
          echo "LSPLANT=$CURRENT_LSPLANT_SHA"
          echo "DOBBY=$CURRENT_DOBBY_SHA"
          echo "R2_DEOPT_ROLLBACK=ABSENT"
          echo "P7_MOUNT_SUPPRESSION=ABSENT"
          echo "P10_CERT_PATCH=ABSENT"
          echo "PAIRIP_BYPASS=ABSENT"
        } | tee ../r9-output/R9_PROVENANCE.txt

    - name: Build R9 v7-v3 context-isolation framework
      id: r9build
      if: steps.patch.outcome == 'success'
      working-directory: LSP-IrenaX
      shell: bash
      run: |
        set -uo pipefail
        set +e
        ./gradlew clean zipAll --stacktrace --info 2>&1 | tee ../r9-build.log
        rc=${PIPESTATUS[0]}
        set -e
        echo "$rc" > ../R9_BUILD_EXIT_CODE.txt
        echo "rc=$rc" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Freeze rebuilt R9 v7-v3 framework payload
      id: framework
      if: steps.r9build.outputs.rc == '0'
      shell: bash
      run: |
        set -euo pipefail

        mapfile -t rel < <(find LSP-IrenaX/magisk-loader/release -maxdepth 1 -type f \
          -name 'LSPosed-v*-IrenaX-release.zip' -print | sort)

        test "${#rel[@]}" -eq 1
        cp "${rel[0]}" R9_BUILD_RELEASE.zip

        rm -rf r9buildcmp
        mkdir r9buildcmp
        unzip -q R9_BUILD_RELEASE.zip -d r9buildcmp

        test -f r9buildcmp/framework/lspd.dex
        sha256sum r9buildcmp/framework/lspd.dex \
          > r9-output/R9_REBUILT_FRAMEWORK_DEX_SHA256.txt

    - name: Create official-base R9 diagnostic package
      id: package
      if: steps.framework.outcome == 'success'
      shell: bash
      run: |
        set -euo pipefail

        python3 - <<'PY'
        from pathlib import Path
        import hashlib
        import zipfile

        official = Path("OFFICIAL_RELEASE.zip")
        out = Path("${{ env.FINAL_ZIP }}")
        rebuilt_dex = Path("r9buildcmp/framework/lspd.dex").read_bytes()
        rebuilt_dex_sha = hashlib.sha256(rebuilt_dex).hexdigest().encode()

        replacements = {
            "framework/lspd.dex": rebuilt_dex,
            "framework/lspd.dex.sha256": rebuilt_dex_sha,
        }

        with zipfile.ZipFile(official, "r") as zin, zipfile.ZipFile(out, "w") as zout:
            infos = zin.infolist()
            names = [i.filename for i in infos]

            if len(names) != len(set(names)):
                raise SystemExit("duplicate names in official ZIP")

            for required in replacements:
                if required not in names:
                    raise SystemExit(f"missing official payload: {required}")

            for info in infos:
                data = replacements.get(info.filename)
                if data is None:
                    data = zin.read(info.filename)
                zout.writestr(info, data)

        def tree(path):
            with zipfile.ZipFile(path) as z:
                names = z.namelist()
                if len(names) != len(set(names)):
                    raise SystemExit(f"duplicate names: {path}")
                bad = z.testzip()
                if bad:
                    raise SystemExit(f"ZIP CRC failure {path}: {bad}")
                return {
                    n: hashlib.sha256(z.read(n)).hexdigest()
                    for n in names
                    if not n.endswith("/")
                }

        a = tree(official)
        b = tree(out)

        if set(a) != set(b):
            raise SystemExit("official/R9 file sets differ")
        if len(a) != 56:
            raise SystemExit(f"expected 56 files, got {len(a)}")

        diff = sorted(k for k in a if a[k] != b[k])
        expected = ["framework/lspd.dex", "framework/lspd.dex.sha256"]
        if diff != expected:
            raise SystemExit(f"unexpected official->R9 final delta: {diff}")

        # All manager/daemon/native payload must remain exact official 7371.
        for rel in (
            "manager.apk",
            "daemon.apk",
            "lib/arm64-v8a/liblspd.so",
            "lib/armeabi-v7a/liblspd.so",
            "lib/x86/liblspd.so",
            "lib/x86_64/liblspd.so",
        ):
            if a[rel] != b[rel]:
                raise SystemExit(f"official payload changed unexpectedly: {rel}")

        with zipfile.ZipFile(out) as z:
            names = set(z.namelist())
            checked = 0
            for n in sorted(names):
                if not n.endswith(".sha256"):
                    continue
                payload = n[:-7]
                if payload not in names:
                    continue
                expected_hash = z.read(n).decode().strip().split()[0]
                actual_hash = hashlib.sha256(z.read(payload)).hexdigest()
                if expected_hash != actual_hash:
                    raise SystemExit(f"sidecar mismatch: {n}")
                checked += 1

            if checked != 28:
                raise SystemExit(f"expected 28 verified sidecars, got {checked}")

        sha = hashlib.sha256(out.read_bytes()).hexdigest()
        Path("r9-output/R9_FINAL_PACKAGE_SHA256.txt").write_text(
            f"{sha}  {out.name}\n"
        )
        Path("r9-output/R9_FINAL_PACKAGE_DIFF.txt").write_text(
            "framework/lspd.dex\nframework/lspd.dex.sha256\n"
        )
        Path("r9-output/R9_FINAL_SCOPE.txt").write_text(
            "BASE=official Irena X 7371 release + R1-v2 mIncludeCode fix\n"
            "ONLY_FINAL_PAYLOAD_CHANGE=framework/lspd.dex + sidecar\n"
            "MANAGER=official 7371 byte-identical\n"
            "DAEMON=official 7371 byte-identical\n"
            "DEX2OAT_BEHAVIOR=official 7371 unchanged\n"
            "ALL_LIBLSPD=official 7371 byte-identical\n"
            "M_INCLUDE_CODE_DIRECT_READ=removed (R1 preserved)\n"
            "R8_V4_DEVICE_RESULT=valid marker + same PairIP +0x65768 crash\n"
            "R8_V4_CONCLUSION=legacy-module loading/static initialization not necessary\n"
            "R9_V1_DEVICE_RESULT=Ingress starts; global bootstrap suppression breaks parasitic Manager host\n"
            "R9_V2_DEVICE_RESULT=Manager starts; Ingress still crashes at PairIP +0x65768\n"
            "R9_V2_CONCLUSION=OpenDex subgroup not necessary\n"
            "R9_V3_DEVICE_RESULT=valid marker + same PairIP +0x65768 crash; CrashDump registration not necessary\n"
            "R9_V4_DEVICE_RESULT=valid Ingress callback marker + same PairIP +0x65768 crash\n"
            "R9_V4_CONCLUSION=LoadedApkCtor callback effects/downstream CreateCL dispatch not necessary\n"
            "R9_V5_DEVICE_RESULT=valid LSPosed internal marker + same PairIP +0x65768 crash; LoadedApkCtor registration not necessary\n"
            "R9_V5_CONCLUSION=LoadedApkCtorHooker registration/ART state not necessary\n"
            "R9_V6_RUNTIME_STATUS=valid internal marker + same PairIP +0x65768 crash; CreateCL registration not necessary\n"
            "R9_V7_RUNTIME_STATUS=invalid guard source; ActivityThread.currentProcessName was null at Ingress attach callback\n"
            "R9_V7_V2_DEVICE_RESULT=Attach callback entered before PairIP; currentProcess=null; currentPackage=null; contextProcess=com.nianticproject.ingress; same +0x65768 crash\n"
            "R9_V7_V3_FUNCTIONAL_CHANGE=Ingress-only AttachHooker callback suppression before XposedInit.loadModules using LSPosedContext.processName\n"
            "R9_START_BOOTSTRAP_HOOK_INVOCATION=unchanged\n"
            "R9_CRASHDUMP_BOOTSTRAP_HOOK=restored/unchanged\n"
            "R9_OPENDEX_BOOTSTRAP_HOOKS=restored/unchanged\n"
            "R9_LOADEDAPK_CTOR=restored/unchanged\n"
            "R9_LOADEDAPK_CREATECL_REGISTRATION=restored/unchanged\n"
            "R9_ATTACH_REGISTRATION=unchanged\n"
            "R9_ATTACH_CALLBACK_INGRESS=suppressed by LSPosedContext.processName\n"
            "R9_ATTACH_CALLBACK_NON_INGRESS=unchanged\n"
            "R9_LEGACY_MODULE_LOADING=unchanged\n"
            "R9_PACKAGE_DISPATCH=unchanged\n"
            "R2_DEOPT_ROLLBACK=not present\n"
            "P7_MOUNT_SUPPRESSION=not present\n"
            "P10_CERT_REBUILD_PATCH=not present\n"
            "PAIRIP_BYPASS=not present\n"
        )
        PY

        unzip -t "$FINAL_ZIP"
        cp "$FINAL_ZIP" "r9-output/INSTALL_THIS_${FINAL_ZIP}"

    - name: Write R9 device diagnostic plan
      if: steps.package.outcome == 'success'
      shell: bash
      run: |
        set -euo pipefail

        cat > r9-output/R9_DEVICE_TEST_PLAN.txt <<'EOF'
        R9-v7-v3 INGRESS ATTACH CONTEXT CALLBACK ISOLATION DIAGNOSTIC

        PURPOSE:
        R9-v7-v2 proved that AttachHooker executes before PairIP and that at this callback time
        ActivityThread.currentProcessName/currentPackageName are null while LSPosedContext.processName
        is exactly com.nianticproject.ingress. R9-v7-v3 therefore changes one functional variable:
        only for that exact LSPosedContext process, return before XposedInit.loadModules().

        1. Install the inner INSTALL_THIS_*.zip and reboot.
        2. Confirm LSPosed Manager remains usable.
        3. Run one controlled Ingress start:

           su -c 'logcat -c'
           su -c 'am force-stop com.nianticproject.ingress'
           su -c 'monkey -p com.nianticproject.ingress -c android.intent.category.LAUNCHER 1'
           sleep 4
           su -c 'logcat -b all -d -v threadtime | grep -E "LSPosed-R9|libpairipcore|SIGSEGV|SEGV_|Fatal signal" > /sdcard/Download/r9-v7-v3-attach-context-isolation.txt'

        REQUIRED MARKER:
        LSPosed-R9: ATTACH_CALLBACK_SKIPPED_CONTEXT process=com.nianticproject.ingress

        INTERPRETATION:
        - Required marker + same PairIP +0x65768 crash:
          XposedInit.loadModules from the Ingress AttachHooker callback is not necessary for the crash.
          Next diagnostic should isolate the ActivityThread.attach hook registration itself.
        - Required marker + Ingress starts:
          This is the first clean positive transition with Manager preserved. Do not overclaim: the causal
          region is AttachHooker -> XposedInit.loadModules or state created by that call. Repeat three
          controlled starts before treating it as reproducible, then sub-isolate one variable at a time.
        - Required marker absent:
          Invalid causal test. Do not carry an exclusion forward.
        EOF

    - name: Collect R9 evidence
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p r9-output

        cp R9_BUILD_EXIT_CODE.txt r9-output/ 2>/dev/null || true
        cp r9-build.log r9-output/ 2>/dev/null || true
        cp R9_BUILD_RELEASE.zip r9-output/ 2>/dev/null || true
        cp OFFICIAL_RELEASE.zip r9-output/OFFICIAL_7371_RELEASE_REFERENCE.zip 2>/dev/null || true

        python3 - <<'PY'
        from pathlib import Path
        import hashlib

        out = Path("r9-output")
        manifest = out / "R9_EVIDENCE_SHA256SUMS.txt"

        files = sorted(
            p for p in out.rglob("*")
            if p.is_file() and p != manifest
        )

        with manifest.open("w") as f:
            for p in files:
                rel = p.relative_to(out).as_posix()
                f.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}\n")
        PY

        (
          cd r9-output
          sha256sum -c R9_EVIDENCE_SHA256SUMS.txt
        )

    - name: Final R9 fail-closed static gate
      id: finalgate
      shell: bash
      run: |
        set -euo pipefail

        test -f R9_BUILD_EXIT_CODE.txt
        test "$(cat R9_BUILD_EXIT_CODE.txt)" = "0"

        diff -u <(printf '%s\n'   core/src/main/java/org/lsposed/lspd/hooker/AttachHooker.java   core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java)   r9-output/R9_SOURCE_DIFF_NAMES.txt

        diff -u <(printf '%s\n'   framework/lspd.dex   framework/lspd.dex.sha256)   r9-output/R9_FINAL_PACKAGE_DIFF.txt

        grep -q '^R9_V6_RUNTIME_STATUS=VALID_INTERNAL_MARKER_PLUS_SAME_PAIRIP_0x65768_CRASH$' r9-output/R9_PROVENANCE.txt
        grep -q '^R9_V7_RUNTIME_STATUS=INVALID_GUARD_SOURCE_CURRENT_PROCESS_NULL$' r9-output/R9_PROVENANCE.txt
