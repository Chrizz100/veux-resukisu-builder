        python3 - <<'PY'
        from pathlib import Path

        src = Path("fs/readdir.c").read_text(encoding="utf-8")

        def extract(text, sig):
            start = text.index(sig)
            brace = text.index("{", start)
            depth = 0
            for i in range(brace, len(text)):
                if text[i] == "{":
                    depth += 1
                elif text[i] == "}":
                    depth -= 1
                    if depth == 0:
                        return text[start:i + 1]
            raise RuntimeError(sig)

        helper = extract(src, "static bool susfs_should_hide_readdir_entry(struct super_block *sb, u64 ino)")
        assert helper.count("ilookup(sb, ino)") == 1
        assert helper.count("iput(inode)") == 1
