          echo "P5_V14_READDIR_CALLBACK_COVERAGE=5"
          echo "P5_V14_ACTIVE_SUBOPTION_COUNT=4"
          echo "P5_V14_ROOT_ONLY_DISPATCH_COMMAND_COUNT=10"
          echo "P5_V10_KSTAT_CHAIN_PRESERVED=YES"
          echo "P5_V6_TIF_PROC_UMOUNTED_BRIDGE_PRESERVED=YES"
          echo "P4_STAT_FACCESSAT_BRIDGE_PRESERVED=YES"
          echo "SUS_MOUNT_ACTIVE=NO"
          echo "OPEN_REDIRECT_ACTIVE=NO"
          echo "SUS_MAP_ACTIVE=NO"
          echo "P5_V14_LINKED_BOUNDARY=PASS"
        } > "$GITHUB_WORKSPACE/evidence/25-P5V14-LINKED-BOUNDARY.txt"
