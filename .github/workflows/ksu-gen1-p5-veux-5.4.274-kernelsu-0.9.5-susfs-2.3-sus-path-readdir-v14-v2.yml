jobs:
  backup-pass:
    name: P5-v14 - automatic permanent GitHub recovery backup
    needs:
    - p5-sus-path-readdir-v14
    if: ${{ needs.p5-sus-path-readdir-v14.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: B01 - Initialize automatic P5-v14 backup
      shell: bash
      run: |
        set -euo pipefail
        rm -rf backup-work backup-evidence
        mkdir -p backup-work backup-evidence

        tag="ksu-gen1-p5-v14-pass-backup-${GITHUB_RUN_ID}"

        {
          echo "BACKUP_WORKFLOW=KSU-GEN1-P5-V14-AUTO-GITHUB-RECOVERY"
          echo "TECHNICAL_RUN_ID=$GITHUB_RUN_ID"
          echo "PARENT_BACKUP_TAG=$P5_V13_V2_BACKUP_TAG"
          echo "RELEASE_TAG=$tag"
          echo "RELEASE_TARGET_SHA=$GITHUB_SHA"
          echo "RELEASE_REDOWNLOAD_REVERIFY=YES"
        } > backup-evidence/00-CONTRACT.txt
    - name: B02 - Resolve and download exact current P5-v14 Actions artifact
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-readdir-v14-v2-${GITHUB_RUN_ID}"

        json="$(
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
        )"

        count="$(
          jq --arg n "$artifact_name" \
            '[.artifacts[] | select(.name == $n and .expired == false)] | length' \
            <<<"$json"
        )"
        test "$count" -eq 1

        artifact_id="$(
          jq -r --arg n "$artifact_name" \
            '.artifacts[] | select(.name == $n and .expired == false) | .id' \
            <<<"$json"
        )"
        expected_digest="$(
          jq -r --arg n "$artifact_name" \
            '.artifacts[] | select(.name == $n and .expired == false) | .digest' \
            <<<"$json"
        )"
        expected_sha="${expected_digest#sha256:}"

        gh api \
          -H "Accept: application/vnd.github+json" \
          "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
          > "${artifact_name}.zip"

        actual_sha="$(sha256sum "${artifact_name}.zip" | awk '{print $1}')"
        test "$actual_sha" = "$expected_sha"

        {
          echo "CURRENT_ARTIFACT_NAME=$artifact_name"
          echo "CURRENT_ARTIFACT_ID=$artifact_id"
          echo "CURRENT_ARTIFACT_SHA256=$actual_sha"
          echo "CURRENT_ACTIONS_ARTIFACT_AUTH=PASS"
        } > "$GITHUB_WORKSPACE/backup-evidence/01-CURRENT-ARTIFACT-AUTH.txt"
    - name: B03 - Verify exact P5-v14 technical PASS manifest
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-readdir-v14-v2-${GITHUB_RUN_ID}"
        rm -rf verify-current
        mkdir verify-current
        unzip -q "${artifact_name}.zip" -d verify-current

        for dir in evidence restore-kit build-artifacts; do
          (
            cd "verify-current/$dir"
            sha256sum -c SHA256SUMS
          )
        done

        grep -Fxq 'TECHNICAL_PASS=YES' verify-current/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'CHECKPOINT=KSU-GEN1-P5-SUS-PATH-READDIR-V14-PASS' \
          verify-current/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'P5_V14_LINKED_BOUNDARY=PASS' \
          verify-current/evidence/25-P5V14-LINKED-BOUNDARY.txt
        grep -Fxq 'P5_V14_RESTORE_KIT=PASS' \
          verify-current/evidence/26-P5V14-PROVENANCE.txt

        jq -e \
          '.stage == "KSU-GEN1-P5-v14" and
           .config_ksu_susfs_sus_path == true and
           .susfs_feature_suboptions_enabled == 4 and
           .dispatch_command_count == 10 and
           .sus_path_namei_parent_p5_v13_v2_byte_identical == true and
           .sus_path_namei_lookup_hash_hook_preserved == true and
           .sus_path_lookup_fast_hook_preserved == true and
           .sus_path_walk_component_hook_preserved == true and
           .sus_path_readdir_hook_integrated == true and
           .sus_path_readdir_process_gate == "susfs_is_current_proc_umounted_app" and
           .sus_path_readdir_inode_resolution == "ilookup_superblock_ino" and
           .sus_path_readdir_inode_ref_release == "iput" and
           .sus_path_readdir_cache_miss_policy == "fail_open_preserve_stock_dirent" and
           .sus_path_readdir_actor_path_lookup == false and
           .sus_path_readdir_direct_state_bit_test == false and
           .sus_path_readdir_actor_count == 5 and
           .sus_path_readdir_sb_binding_count == 5 and
           .namei_changed_from_parent == false and
           .readdir_changed_from_parent == true and
           .sus_mount_active == false and
           .open_redirect_active == false and
           .sus_map_active == false and
           .kernel_build_performed == true and
           .real_device_readdir_hiding_proven == false and
           .device_accessed == false and
           .flashing_performed == false' \
          verify-current/restore-kit/manifest.json >/dev/null

        echo "CURRENT_PASS_CHAIN_AUTH=PASS" > "$GITHUB_WORKSPACE/backup-evidence/02-PASS-AUTH.txt"
    - name: B04 - Prepare P5-v14 recovery release payload
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-readdir-v14-v2-${GITHUB_RUN_ID}"
        artifact_sha="$(sha256sum "${artifact_name}.zip" | awk '{print $1}')"
        image_sha="$(sha256sum verify-current/build-artifacts/Image | awk '{print $1}')"
        config_sha="$(sha256sum verify-current/build-artifacts/config | awk '{print $1}')"
        dtb_sha="$(sha256sum verify-current/build-artifacts/veux.dtb | awk '{print $1}')"

        cp verify-current/restore-kit/manifest.json P5V14-MANIFEST.json

        cat > RECOVERY.txt <<EOF
        KSU GEN1 VEUX P5-v14 PASS Recovery Backup
        =========================================

        Technical run: $GITHUB_RUN_ID
        Parent permanent backup:
        $P5_V13_V2_BACKUP_TAG

        P5-v14 scope:
        - exact permanent P5-v13-v2 parent restored and authenticated
        - fs/namei.c remains byte-identical to P5-v13-v2
        - only fs/readdir.c changes in the new block
        - five directory callback families receive the open directory superblock
        - target-app gate runs before ilookup(sb, ino)
        - every successful ilookup reference is released with iput()
        - inode-cache miss preserves the stock dirent
        - no kern_path / lookup_one_len / filename_lookup in directory actors
        - SUS_MOUNT / OPEN_REDIRECT / SUS_MAP disabled

        Image SHA256:
        $image_sha
        Config SHA256:
        $config_sha
        VEUX DTB SHA256:
        $dtb_sha
        Complete Actions artifact SHA256:
        $artifact_sha

        This is a build/recovery checkpoint, not a real-device runtime claim.
        EOF

        {
          sha256sum "${artifact_name}.zip"
          sha256sum P5V14-MANIFEST.json
          sha256sum RECOVERY.txt
        } > RELEASE-SHA256SUMS.txt
        sha256sum -c RELEASE-SHA256SUMS.txt

        cat > release-notes.md <<EOF
        Permanent recovery checkpoint after successful P5-v14.

        P5-v14 adds only the VEUX-5.4 SUS_PATH directory-enumeration filter in
        fs/readdir.c while preserving the complete P5-v13-v2 namei chain byte-identically.
        The readdir helper uses target-app gating plus ilookup/iput and deliberately
        does not perform a path lookup from a directory actor.

        Parent backup: \`$P5_V13_V2_BACKUP_TAG\`
        Technical run: \`$GITHUB_RUN_ID\`
        EOF
    - name: B05 - Create permanent P5-v14 GitHub Release
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        tag="ksu-gen1-p5-v14-pass-backup-${GITHUB_RUN_ID}"
        title="KSU GEN1 VEUX P5-v14 PASS Recovery Backup"

        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          exit 1
        fi

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-readdir-v14-v2-${GITHUB_RUN_ID}"

        gh release create "$tag" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "$title" \
          --notes-file release-notes.md \
          "${artifact_name}.zip#P5-v14 complete PASS artifact" \
          "P5V14-MANIFEST.json#P5-v14 recovery manifest" \
          "RELEASE-SHA256SUMS.txt#Release checksums" \
          "RECOVERY.txt#Recovery metadata"

        gh release view "$tag" \
          --repo "$GITHUB_REPOSITORY" \
          --json tagName,name,isDraft,isPrerelease,url,assets \
          > "$GITHUB_WORKSPACE/backup-evidence/04-RELEASE.json"

        jq -e \
          --arg tag "$tag" \
          --arg title "$title" \
          '.tagName == $tag and
           .name == $title and
           .isDraft == false and
           .isPrerelease == false and
           (.assets | length) == 4' \
          "$GITHUB_WORKSPACE/backup-evidence/04-RELEASE.json" >/dev/null

        {
          echo "GITHUB_RELEASE_CREATED=PASS"
          echo "RELEASE_TAG=$tag"
        } > "$GITHUB_WORKSPACE/backup-evidence/04-RELEASE-CREATE.txt"
    - name: B06 - Redownload P5-v14 release assets and reverify
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        tag="ksu-gen1-p5-v14-pass-backup-${GITHUB_RUN_ID}"
        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-readdir-v14-v2-${GITHUB_RUN_ID}"

        rm -rf release-download
        mkdir release-download

        gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release-download

        cmp "${artifact_name}.zip" "release-download/${artifact_name}.zip"
        cmp P5V14-MANIFEST.json release-download/P5V14-MANIFEST.json
        cmp RELEASE-SHA256SUMS.txt release-download/RELEASE-SHA256SUMS.txt
        cmp RECOVERY.txt release-download/RECOVERY.txt

        (
          cd release-download
          sha256sum -c RELEASE-SHA256SUMS.txt
        )

        {
          echo "CURRENT_ARTIFACT_RELEASE_BYTE_IDENTITY=PASS"
          echo "MANIFEST_RELEASE_BYTE_IDENTITY=PASS"
          echo "CHECKSUM_RELEASE_BYTE_IDENTITY=PASS"
          echo "RECOVERY_METADATA_RELEASE_BYTE_IDENTITY=PASS"
          echo "RELEASE_DOWNLOAD_REVERIFY=PASS"
        } > "$GITHUB_WORKSPACE/backup-evidence/05-RELEASE-REVERIFY.txt"
    - name: B07 - Close automatic P5-v14 backup status
      shell: bash
      run: |
        set -euo pipefail

        if grep -Fxq 'CURRENT_PASS_CHAIN_AUTH=PASS' backup-evidence/02-PASS-AUTH.txt \
          && grep -Fxq 'GITHUB_RELEASE_CREATED=PASS' backup-evidence/04-RELEASE-CREATE.txt \
          && grep -Fxq 'RELEASE_DOWNLOAD_REVERIFY=PASS' backup-evidence/05-RELEASE-REVERIFY.txt; then
          pass=YES
          checkpoint=KSU-GEN1-P5-V14-GITHUB-RECOVERY-BACKUP-PASS
        else
          pass=NO
          checkpoint=KSU-GEN1-P5-V14-GITHUB-RECOVERY-BACKUP-FAILED
        fi

        {
          echo "BACKUP_PASS=$pass"
          echo "CHECKPOINT=$checkpoint"
          echo "RELEASE_TAG=ksu-gen1-p5-v14-pass-backup-$GITHUB_RUN_ID"
          echo "RELEASE_ASSETS_REDOWNLOADED_AND_REVERIFIED=$pass"
        } > backup-evidence/98-BACKUP-STATUS.txt

        test "$pass" = YES
    - name: B08 - Build automatic P5-v14 backup evidence manifest
      shell: bash
      run: |
        set -euo pipefail
        cd backup-evidence
        rm -f SHA256SUMS
        find . -type f ! -name SHA256SUMS -printf '%P\0' \
          | sort -z \
          | xargs -0 -r sha256sum \
          > SHA256SUMS
        sha256sum -c SHA256SUMS
    - name: B09 - Upload automatic P5-v14 backup evidence
      uses: actions/upload-artifact@v7
      with:
        name: ksu-gen1-p5-v14-github-recovery-backup-evidence-${{ github.run_id }}
        path: backup-evidence/
        retention-days: 30
        if-no-files-found: error
      if: ${{ always() }}
    - name: B10 - Automatic P5-v14 backup summary
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "# P5-v14 automatic GitHub recovery backup"
          echo
          if grep -Fxq 'BACKUP_PASS=YES' backup-evidence/98-BACKUP-STATUS.txt 2>/dev/null; then
            echo "**BACKUP PASS**"
            echo "\`ksu-gen1-p5-v14-pass-backup-$GITHUB_RUN_ID\`"
          else
            echo "**BACKUP FAIL — do not continue beyond P5-v14.**"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
  p5-sus-path-readdir-v14:
    name: P5-v14 - SUS_PATH VEUX-5.4 readdir directory-enumeration filter
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: 01 - Checkout exact fresh VEUX base
      uses: actions/checkout@v7
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
        path: kernel
        fetch-depth: 0
        filter: blob:none
    - name: 02 - Initialize P5-v13-v2 evidence
      shell: bash
      run: |
        set -euo pipefail

        : "${P5_V13_FAILED_RUN_ID:?}"
        : "${P5_V13_FAILURE_CLASS:?}"
        : "${P5_V13_V2_WORKFLOW_FIX:?}"
        : "${P5_V13_V2_SOURCE_INTENT_CHANGED_FROM_V13:?}"
        : "${P5_V12_V7_PASS_RUN_ID:?}"
        : "${P5_V12_V7_PARENT_BACKUP_TAG:?}"
        : "${EXPECTED_P5_V12_V7_ARTIFACT_SHA256:?}"
        : "${P5_V13_V2_SOURCE_INTENT:?}"
        : "${P5_V13_V2_LAST_COMPONENT_GATE:?}"
        : "${P5_V13_V2_RCU_STRATEGY:?}"
        : "${P5_V13_V2_SLOW_STRATEGY:?}"

        rm -rf evidence restore-kit build-artifacts p5v12-parent-artifact
        mkdir -p evidence restore-kit build-artifacts

        {
          echo "WORKFLOW=KSU-GEN1-P5-SUS-PATH-NAMEI-LAST-COMPONENT-v13-v2"
          echo "FAILED_P5_V13_RUN_ID=$P5_V13_FAILED_RUN_ID"
          echo "FAILED_P5_V13_CLASS=$P5_V13_FAILURE_CLASS"
          echo "P5_V13_V2_WORKFLOW_FIX=$P5_V13_V2_WORKFLOW_FIX"
          echo "SOURCE_INTENT_CHANGED_FROM_V13=$P5_V13_V2_SOURCE_INTENT_CHANGED_FROM_V13"
          echo "DEVICE=VEUX"
          echo "TARGET_KERNEL=$TARGET_VERSION"
          echo "PARENT_P5_V12_V7_RUN_ID=$P5_V12_V7_PASS_RUN_ID"
          echo "PARENT_P5_V12_V7_BACKUP_TAG=$P5_V12_V7_PARENT_BACKUP_TAG"
          echo "PARENT_P5_V12_V7_ARTIFACT_SHA256=$EXPECTED_P5_V12_V7_ARTIFACT_SHA256"
          echo "P5_V13_V2_SOURCE_INTENT=$P5_V13_V2_SOURCE_INTENT"
          echo "P5_V13_V2_LAST_COMPONENT_GATE=$P5_V13_V2_LAST_COMPONENT_GATE"
          echo "P5_V13_V2_RCU_STRATEGY=$P5_V13_V2_RCU_STRATEGY"
          echo "P5_V13_V2_SLOW_STRATEGY=$P5_V13_V2_SLOW_STRATEGY"
          echo "ACTIVE_SUBOPTIONS=KSU_SUSFS_SPOOF_UNAME,KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG,KSU_SUSFS_SUS_KSTAT,KSU_SUSFS_SUS_PATH"
          echo "SUSFS_FEATURE_SUBOPTION_COUNT=4"
          echo "NEW_SUBOPTION=NONE"
          echo "PARENT_LOOKUP_HASH_PRESERVED=YES"
          echo "NEW_NAMEI_SCOPE=lookup_fast+walk_component"
          echo "LOOKUP_SLOW_FUNCTION_BODY_CHANGED=NO"
          echo "LOOKUP_LAST_CHANGED=NO"
          echo "PATH_INIT_CHANGED=NO"
          echo "READDIR_CHANGED=NO"
          echo "NEWER_NAMEIDATA_STATE_TRANSPLANT=NO"
          echo "RCU_DPUT_BY_NEW_HOOK=NO"
          echo "ROOT_ONLY_SUSFS_DISPATCH_COMMAND_COUNT=10"
          echo "KSTAT_CHAIN_PRESERVED=YES"
          echo "TIF_PROC_UMOUNTED_BRIDGE_PRESERVED=YES"
          echo "P4_STAT_FACCESSAT_BRIDGE_PRESERVED=YES"
          echo "SUS_MOUNT=OPEN_REDIRECT=SUS_MAP=DISABLED"
          echo "RESUKISU_INTEGRATION=NO"
          echo "AUTO_GITHUB_BACKUP_ON_PASS=YES"
          echo "BOOT_IMAGE_CREATED=NO"
          echo "DEVICE_ACCESSED=NO"
          echo "FLASHING_PERFORMED=NO"
          echo "P5_V13_V2_REQUIRED_ENV_GATE=PASS"
        } > evidence/00-CONTRACT.txt

        echo "STAGE=INITIALIZED" > evidence/STAGE.txt
    - name: 03 - Install build and audit dependencies
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=DEPENDENCIES" > evidence/STAGE.txt
        sudo apt-get update
        sudo apt-get install -y \
          bc bison ca-certificates cpio curl flex git jq \
          libelf-dev libssl-dev patch python3 rsync unzip xz-utils zip zstd
    - name: 04 - Reconstruct exact deterministic P0
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P0_RECONSTRUCTION" > evidence/STAGE.txt
        cd kernel

        test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
        test "$(git rev-parse HEAD^{tree})" = "$BASE_TREE"
        test "$(make -s kernelversion)" = "$BASE_VERSION"
        test -z "$(git status --porcelain)"

        git remote remove android >/dev/null 2>&1 || true
        git remote add android "$ANDROID_COMMON_REPO"
        git fetch --no-tags android "refs/tags/${ANDROID_TAG}:refs/tags/${ANDROID_TAG}"

        test "$(git cat-file -t "refs/tags/${ANDROID_TAG}")" = "tag"
        test "$(git rev-parse "refs/tags/${ANDROID_TAG}")" = "$ANDROID_TAG_OBJECT"
        test "$(git rev-parse "refs/tags/${ANDROID_TAG}^{}")" = "$ANDROID_COMMIT"
        test "$(git rev-parse "${ANDROID_COMMIT}^{tree}")" = "$ANDROID_TREE"

        git config user.name "VEUX Clean Baseline"
        git config user.email "veux-clean-baseline@users.noreply.github.com"
        git merge --no-commit --no-ff "$ANDROID_COMMIT"
        test "$(make -s kernelversion)" = "$TARGET_VERSION"

        export GIT_AUTHOR_DATE="2024-04-18T11:05:25Z"
        export GIT_COMMITTER_DATE="2024-04-18T11:05:25Z"
        git commit -m "CLEAN BASELINE: merge android11-5.4.274_r00 into VEUX 5.4.268"

        test "$(git rev-parse HEAD)" = "$EXPECTED_P0_MERGE_COMMIT"
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P0_MERGE_TREE"

        {
          echo "P0_RECONSTRUCTION=PASS"
          echo "P0_COMMIT=$(git rev-parse HEAD)"
          echo "P0_TREE=$(git rev-parse HEAD^{tree})"
        } > "$GITHUB_WORKSPACE/evidence/01-P0.txt"
    - name: 05 - Download exact accepted P4-v7 artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.P4_ARTIFACT_NAME }}
        path: p4-artifact
        github-token: ${{ github.token }}
        run-id: ${{ env.P4_PASS_RUN_ID }}
        repository: Chrizz100/veux-resukisu-builder
    - name: 06 - Authenticate P4-v7 checkpoint
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P4_AUTH" > evidence/STAGE.txt

        for dir in evidence restore-kit build-artifacts; do
          test -s "p4-artifact/$dir/SHA256SUMS"
          (
            cd "p4-artifact/$dir"
            sha256sum -c SHA256SUMS
          ) > "evidence/02-P4-${dir}-SHA256.txt"
        done

        grep -Fxq 'TECHNICAL_PASS=YES' p4-artifact/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'CHECKPOINT=KSU-GEN1-P4-SAFE-STAT-FACCESSAT-FILENAME-BRIDGE-PASS' \
          p4-artifact/evidence/98-FINAL-STATUS.txt

        test "$(sha256sum p4-artifact/build-artifacts/Image | awk '{print $1}')" \
          = "$EXPECTED_P4_IMAGE_SHA256"
        test "$(sha256sum p4-artifact/build-artifacts/config | awk '{print $1}')" \
          = "$EXPECTED_P4_CONFIG_SHA256"
        test "$(sha256sum p4-artifact/build-artifacts/veux.dtb | awk '{print $1}')" \
          = "$EXPECTED_P4_DTB_SHA256"

        test -s p4-artifact/restore-kit/p0-to-p4-outer-full.patch
        test -s p4-artifact/restore-kit/p4-kernelsu-0.9.5-full-bridge.patch
        echo "P4_ACCEPTED_ARTIFACT_AUTH=PASS" > evidence/02-P4-AUTH.txt
    - name: 07 - Restore exact P4-v7 source
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P4_SOURCE_RESTORE" > evidence/STAGE.txt
        cd kernel

        outer="$GITHUB_WORKSPACE/p4-artifact/restore-kit/p0-to-p4-outer-full.patch"
        ksup="$GITHUB_WORKSPACE/p4-artifact/restore-kit/p4-kernelsu-0.9.5-full-bridge.patch"

        git apply --check --binary "$outer"
        git apply --binary "$outer"

        git clone --filter=blob:none https://github.com/tiann/KernelSU.git KernelSU
        git -C KernelSU checkout --detach "$KSU_COMMIT"
        test "$(git -C KernelSU rev-parse HEAD)" = "$KSU_COMMIT"

        ksu_count="$(git -C KernelSU rev-list --count HEAD)"
        test "$((10000 + ksu_count + 200))" = "$KSU_EXPECTED_VERSION"

        test -L drivers/kernelsu
        test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
        test "$(realpath drivers/kernelsu)" = "$(realpath KernelSU/kernel)"

        mkdir -p .git/info
        touch .git/info/exclude
        grep -Fxq '/KernelSU/' .git/info/exclude || echo '/KernelSU/' >> .git/info/exclude

        git -C KernelSU apply --check --binary "$ksup"
        git -C KernelSU apply --binary "$ksup"

        {
          git diff --name-only "$EXPECTED_P0_MERGE_COMMIT" --
          git ls-files --others --exclude-standard
        } | sed '/^$/d' | LC_ALL=C sort -u > "$RUNNER_TEMP/p4-outer-actual-paths.txt"

        awk '/^diff --git a\// {p=$3; sub(/^a\//,"",p); print p}' "$outer" \
          | LC_ALL=C sort -u > "$RUNNER_TEMP/p4-outer-expected-paths.txt"

        diff -u "$RUNNER_TEMP/p4-outer-expected-paths.txt" \
                "$RUNNER_TEMP/p4-outer-actual-paths.txt"

        {
          git -C KernelSU diff --name-only "$KSU_COMMIT" --
          git -C KernelSU ls-files --others --exclude-standard
        } | sed '/^$/d' | LC_ALL=C sort -u > "$RUNNER_TEMP/p4-ksu-actual-paths.txt"

        awk '/^diff --git a\// {p=$3; sub(/^a\//,"",p); print p}' "$ksup" \
          | LC_ALL=C sort -u > "$RUNNER_TEMP/p4-ksu-expected-paths.txt"

        diff -u "$RUNNER_TEMP/p4-ksu-expected-paths.txt" \
                "$RUNNER_TEMP/p4-ksu-actual-paths.txt"

        {
          echo "P4_SOURCE_RESTORE=PASS"
          echo "P4_OUTER_AUTHENTICATED_PATCH_APPLY=PASS"
          echo "P4_KSU_AUTHENTICATED_PATCH_APPLY=PASS"
          echo "P4_TRACKED_PLUS_UNTRACKED_CHANGESET_GATE=PASS"
        } > "$GITHUB_WORKSPACE/evidence/03-P4-SOURCE-RESTORE.txt"
    - name: 08 - Download accepted P5-v4 PASS artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.P5_V4_ARTIFACT_NAME }}
        path: p5v4-artifact
        github-token: ${{ github.token }}
        run-id: ${{ env.P5_V4_PASS_RUN_ID }}
        repository: Chrizz100/veux-resukisu-builder
    - name: 09 - Authenticate P5-v4 PASS checkpoint
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V4_AUTH" > evidence/STAGE.txt

        for dir in evidence restore-kit build-artifacts; do
          test -s "p5v4-artifact/$dir/SHA256SUMS"
          (
            cd "p5v4-artifact/$dir"
            sha256sum -c SHA256SUMS
          ) > "evidence/04-P5V4-${dir}-SHA256.txt"
        done

        grep -Fxq 'TECHNICAL_PASS=YES' p5v4-artifact/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'CHECKPOINT=KSU-GEN1-P5-ACTIVE-SPOOF-UNAME-DISPATCH-PASS' \
          p5v4-artifact/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'P5_LINKED_BOUNDARY=PASS' \
          p5v4-artifact/evidence/11-P5-LINKED-BOUNDARY.txt
        grep -Fxq 'P5_RESTORE_KIT=PASS' \
          p5v4-artifact/evidence/12-P5-PROVENANCE.txt

        test "$(sha256sum p5v4-artifact/build-artifacts/Image | awk '{print $1}')" \
          = "$EXPECTED_P5_V4_IMAGE_SHA256"
        test "$(sha256sum p5v4-artifact/build-artifacts/config | awk '{print $1}')" \
          = "$EXPECTED_P5_V4_CONFIG_SHA256"
        test "$(sha256sum p5v4-artifact/build-artifacts/veux.dtb | awk '{print $1}')" \
          = "$EXPECTED_P5_V4_DTB_SHA256"

        jq -e \
          --arg image "$EXPECTED_P5_V4_IMAGE_SHA256" \
          --arg cfg "$EXPECTED_P5_V4_CONFIG_SHA256" \
          --arg dtb "$EXPECTED_P5_V4_DTB_SHA256" \
          '.image_sha256 == $image and
           .config_sha256 == $cfg and
           .veux_dtb_sha256 == $dtb and
           .root_only_user_command_dispatch == true and
           .config_ksu_susfs == true and
           .config_ksu_susfs_spoof_uname == true and
           .susfs_feature_suboptions_enabled == 1 and
           .only_enabled_susfs_suboption == "KSU_SUSFS_SPOOF_UNAME" and
           .kernel_build_performed == true and
           .device_accessed == false and
           .flashing_performed == false' \
          p5v4-artifact/restore-kit/manifest.json \
          > evidence/04-P5V4-MANIFEST-AUTH.json

        test -s p5v4-artifact/restore-kit/p4-to-p5-outer-spoof-uname.patch
        test -s p5v4-artifact/restore-kit/p4-to-p5-kernelsu-dispatch-kconfig.patch

        echo "P5_V4_ACCEPTED_ARTIFACT_AUTH=PASS" > evidence/04-P5V4-AUTH.txt
    - name: 10 - Restore exact P5-v4 source on P4-v7
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V4_SOURCE_RESTORE" > evidence/STAGE.txt
        cd kernel

        outer_inc="$GITHUB_WORKSPACE/p5v4-artifact/restore-kit/p4-to-p5-outer-spoof-uname.patch"
        ksu_inc="$GITHUB_WORKSPACE/p5v4-artifact/restore-kit/p4-to-p5-kernelsu-dispatch-kconfig.patch"

        patch -p1 --dry-run < "$outer_inc"
        patch -p1 < "$outer_inc"

        (
          cd KernelSU
          patch -p1 --dry-run < "$ksu_inc"
          patch -p1 < "$ksu_inc"
        )

        grep -Fq 'config KSU_SUSFS_SPOOF_UNAME' KernelSU/kernel/Kconfig
        grep -Fq 'static bool ksu_handle_susfs_command' KernelSU/kernel/core_hook.c
        grep -Fq 'case CMD_SUSFS_SET_UNAME:' KernelSU/kernel/core_hook.c
        grep -Fq 'susfs_spoof_uname(&tmp);' kernel/sys.c
        grep -Fq 'static_key_enabled(&susfs_is_uname_spoof_buffer_set)' fs/susfs.c

        test -f fs/proc/cmdline.c
        test ! -e fs/proc/bootconfig.c

        mkdir -p "$RUNNER_TEMP/p5v4-parent/outer" "$RUNNER_TEMP/p5v4-parent/ksu"
        cp fs/proc/cmdline.c "$RUNNER_TEMP/p5v4-parent/outer/cmdline.c"
        cp KernelSU/kernel/Kconfig "$RUNNER_TEMP/p5v4-parent/ksu/Kconfig"
        cp KernelSU/kernel/core_hook.c "$RUNNER_TEMP/p5v4-parent/ksu/core_hook.c"

        sha256sum \
          fs/stat.c \
          fs/open.c \
          fs/susfs.c \
          kernel/sys.c \
          KernelSU/kernel/sucompat.c \
          > "$RUNNER_TEMP/p5v4-protected-source.sha256"

        cp "$RUNNER_TEMP/p5v4-protected-source.sha256" \
          "$GITHUB_WORKSPACE/evidence/05-P5V4-PROTECTED-SOURCE-BEFORE.txt"

        {
          echo "P5_V4_SOURCE_RESTORE=PASS"
          echo "P5_V4_PARENT_RUN_ID=$P5_V4_PASS_RUN_ID"
