      - name: Restore exact Xiaomi VEUX PELT8
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          HEADER="kernel/sched/sched-pelt.h"

          git show \
            "xiaomi/${STOCK_REF}:kernel/sched/sched-pelt.h" \
            > "$HEADER"

          HEADER_SHA="$(
            sha256sum "$HEADER" \
              | awk '{print $1}'
          )"

          if [ "$HEADER_SHA" != "$EXPECTED_XIAOMI_PELT_SHA256" ]; then
            echo "ERROR: Xiaomi PELT header hash mismatch"
            echo "Expected: $EXPECTED_XIAOMI_PELT_SHA256"
            echo "Actual:   $HEADER_SHA"
            exit 1
          fi

          grep -qx \
            '#define LOAD_AVG_PERIOD 8' \
            "$HEADER"

          grep -qx \
            '#define LOAD_AVG_MAX 12336' \
            "$HEADER"

          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path(
              "kernel/sched/sched-pelt.h"
          ).read_text()

          match = re.search(
              r"runnable_avg_yN_inv\[\].*?=\s*\{(.*?)\};",
              text,
              re.S,
          )

          if not match:
              raise SystemExit(
                  "ERROR: PELT table missing"
              )

          entries = re.findall(
              r"0x[0-9a-fA-F]+",
              match.group(1),
          )

          if len(entries) != 8:
              raise SystemExit(
                  f"ERROR: expected 8 PELT entries, got {len(entries)}"
              )
          PY

          {
            echo "PELT_PERIOD=8"
            echo "LOAD_AVG_MAX=12336"
            echo "PELT_TABLE_ENTRIES=8"
            echo "PELT_HEADER_SHA256=$HEADER_SHA"
            echo "EXACT_XIAOMI_HEADER=YES"
          } | tee "$ARTIFACT_DIR/PELT8-STATE.txt"

      - name: Verify cumulative source state
