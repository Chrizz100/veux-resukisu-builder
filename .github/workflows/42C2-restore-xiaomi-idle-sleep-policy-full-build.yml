          WARNING_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/WARNINGS.txt" \
              | tr -d ' '
          )"

          IDLE_WARNING_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/IDLE-WARNINGS.txt" \
              | tr -d ' '
          )"

          if [ "$ERROR_COUNT" -ne 0 ]; then
            echo "ERROR: compiler errors detected"
            cat "$ARTIFACT_DIR/ERRORS.txt"
            exit 1
          fi

          if [ "$IDLE_WARNING_COUNT" -ne 0 ]; then
            echo "ERROR: idle/cpuidle warnings introduced"
            cat "$ARTIFACT_DIR/IDLE-WARNINGS.txt"
            exit 1
          fi

          {
            echo "ERROR_COUNT=$ERROR_COUNT"
            echo "WARNING_COUNT=$WARNING_COUNT"
            echo "IDLE_WARNING_COUNT=$IDLE_WARNING_COUNT"
          } | tee "$ARTIFACT_DIR/DIAGNOSTICS.txt"

      - name: Prepare final 42C2 report
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VEUX_DTB="$OUT_DIR/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"
          VMLINUX="$OUT_DIR/vmlinux"

          cp \
            "$IMAGE" \
            "$ARTIFACT_DIR/Image"

          cp \
            "$VEUX_DTB" \
            "$ARTIFACT_DIR/veux.dtb"

          IMAGE_SHA="$(
            sha256sum "$IMAGE" \
              | awk '{print $1}'
          )"

          DTB_SHA="$(
            sha256sum "$VEUX_DTB" \
              | awk '{print $1}'
          )"

          VMLINUX_SHA="$(
            sha256sum "$VMLINUX" \
              | awk '{print $1}'
          )"

          WARNING_COUNT="$(
            awk -F= \
              '$1=="WARNING_COUNT" {print $2}' \
              "$ARTIFACT_DIR/DIAGNOSTICS.txt"
          )"

          CASS_SYMBOL_COUNT="$(
            awk -F= \
              '$1=="CASS_SYMBOL_COUNT" {print $2}' \
              "$ARTIFACT_DIR/LINKED-KERNEL-STATE.txt"
          )"

          ROTATION_SYMBOL_COUNT="$(
            awk -F= \
              '$1=="ROTATION_SYMBOL_COUNT" {print $2}' \
              "$ARTIFACT_DIR/LINKED-KERNEL-STATE.txt"
          )"

          CPUSET_SYMBOL_COUNT="$(
            awk -F= \
              '$1=="CPUSET_SYMBOL_COUNT" {print $2}' \
              "$ARTIFACT_DIR/LINKED-KERNEL-STATE.txt"
          )"

          LPM_SLEEP_SYMBOL_COUNT="$(
            awk -F= \
              '$1=="LPM_SLEEP_DISABLED_SYMBOL_COUNT" {print $2}' \
              "$ARTIFACT_DIR/LINKED-KERNEL-STATE.txt"
          )"

          LB_DIFF_SHA="$(
            awk -F= \
              '$1=="LB_CAPACITY_RESTORE_DIFF_SHA256" {print $2}' \
              "$ARTIFACT_DIR/LB-CAPACITY-STATE.txt"
          )"

          {
            echo "RESULT=PASS"
            echo "BASE_CANDIDATE_TREE=$EXPECTED_CANDIDATE_TREE"

            echo "IDLE_SCREEN_COMMIT=$IDLE_SCREEN_COMMIT"
            echo "IDLE_EXPOSE_COMMIT=$IDLE_EXPOSE_COMMIT"
            echo "IDLE_NOTIFIER_COMMIT=$IDLE_NOTIFIER_COMMIT"
            echo "IDLE_OPTIMIZE_COMMIT=$IDLE_OPTIMIZE_COMMIT"

            echo "IDLE_FEATURE_CHAIN_REVERSED=YES"
            echo "IDLE_RESTORE_DIFF_SHA256=$EXPECTED_IDLE_RESTORE_DIFF_SHA256"

            echo "LPM_AFTER_SHA256=$EXPECTED_LPM_AFTER_SHA256"
            echo "CPUIDLE_CORE_AFTER_SHA256=$EXPECTED_CPUIDLE_CORE_AFTER_SHA256"
            echo "CPUIDLE_HEADER_AFTER_SHA256=$EXPECTED_CPUIDLE_HEADER_AFTER_SHA256"

            echo "DISPLAY_COUPLED_SLEEP_POLICY_REMOVED=YES"
            echo "SLEEP_DISABLED_DEFAULT_FALSE=YES"
            echo "SLEEP_DISABLED_PARAM_0664=YES"
            echo "DRM_IDLE_NOTIFIER_REMOVED=YES"
            echo "GOODIX_IDLE_PANEL_BINDING_REMOVED=YES"
            echo "SCREEN_ON_FORCED_WFI_REMOVED=YES"
            echo "LPM_SLEEP_DISABLED_EXPORT_REMOVED=YES"
            echo "GENERIC_CPUIDLE_SLEEP_GUARD_REMOVED=YES"
            echo "CPUIDLE_LATENCY_WAKE_RESTORED=YES"
            echo "LPM_SLEEP_DISABLED_SYMBOL_COUNT=$LPM_SLEEP_SYMBOL_COUNT"

            echo "SCHEDUTIL_BEFORE_SHA256=$EXPECTED_SCHEDUTIL_BEFORE_SHA256"
            echo "SCHEDUTIL_AFTER_SHA256=$EXPECTED_SCHEDUTIL_AFTER_SHA256"
            echo "LOWER_STEP_20_PERCENT_REMOVED=YES"
            echo "STANDARD_DRIVER_RESOLVE_RESTORED=YES"
            echo "CAP_ONLY_UCLAMP_REMOVED=YES"
            echo "NORMAL_BOOST_CAP_UCLAMP_RESTORED=YES"

            echo "CASS_PATCH_SHA256=$EXPECTED_CASS_DIFF_SHA256"
            echo "CASS_PATCH_MATCHES_PROVEN_VERSION=YES"
            echo "CASS_SYMBOL_COUNT=$CASS_SYMBOL_COUNT"

            echo "SPRD_ROTATION_DISABLED=YES"
            echo "ROTATION_SYMBOL_COUNT=$ROTATION_SYMBOL_COUNT"

            echo "LB_CAPACITY_UNGATED_COMMIT=$LB_CAPACITY_COMMIT"
            echo "LB_CAPACITY_UNGATED_COMMIT_REVERSED=YES"
            echo "LB_CAPACITY_RESTORE_DIFF_SHA256=$LB_DIFF_SHA"
            echo "LB_CAPACITY_TIME_GATE=RESTORED"

            echo "CPUSETS_ENABLED=YES"
            echo "CPUSET_HARDCODED_0_7=NO"
            echo "CPUSET_SYMBOL_COUNT=$CPUSET_SYMBOL_COUNT"

            echo "PELT_RESTORED_PERIOD=8"
            echo "PELT_RESTORE_SOURCE=XIAOMI_VEUX"
            echo "PELT_HEADER_SHA256=$EXPECTED_XIAOMI_PELT_SHA256"

            echo "CONFIG_HZ_100_REMOVED=YES"
            echo "VEUX_DEFCONFIG_EXPLICIT_HZ=NO"
            echo "HZ_KCONFIG_DEFAULT=250"
            echo "HZ_RESOLVED_CHOICE=250"
            echo "CONFIG_HZ=250"

            echo "FULL_KERNEL_BUILD=PASS"
            echo "COMPILER_ERRORS=0"
            echo "COMPILER_WARNINGS=$WARNING_COUNT"
            echo "IDLE_COMPILER_WARNINGS=0"

            echo "IMAGE_CREATED=YES"
            echo "DTBS_BUILT=YES"
            echo "VEUX_DTB_PARSE=PASS"
            echo "IMAGE_SHA256=$IMAGE_SHA"
            echo "VMLINUX_SHA256=$VMLINUX_SHA"
            echo "VEUX_DTB_SHA256=$DTB_SHA"

            echo "RESUKISU_CHANGED=NO"
            echo "SUSFS_CHANGED=NO"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "DEVICE_FLASHED=NO"
          } | tee "$ARTIFACT_DIR/RESULT.txt"

      - name: Upload corrected idle restore full build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-Xiaomi-Idle-Sleep-Policy-Restore-Full-Build-C2
          path: idle-sleep-restore-full-build-c2/
          if-no-files-found: error
          retention-days: 30
