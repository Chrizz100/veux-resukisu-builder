name: 42C2 - VEUX Restore Xiaomi Idle Sleep Policy Full Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      ARCH: arm64

      COMMON_REF: "android11-5.4.274_r00"
      STOCK_REF: "veux-r-oss"

      STABILITY_REVERT: "f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80"
      LB_CAPACITY_COMMIT: "2c1495be9eabac845acc8da45f070622d6455091"

      IDLE_SCREEN_COMMIT: "64e34240600a0c90072972a6c3d86f1d6ec85c53"
      IDLE_EXPOSE_COMMIT: "4ac606c780ae02a075d75a2703be68880761531a"
      IDLE_NOTIFIER_COMMIT: "8bc9cc6e197c0d1cf166ed94bb53ce41add1c828"
      IDLE_OPTIMIZE_COMMIT: "1d49e9b3308a7eacd75ed67f4112914e74ee60db"

      EXPECTED_CANDIDATE_TREE: "5d25b7e0124d7fb695f3f07b45928fcb5780d0e8"

      EXPECTED_IDLE_RESTORE_DIFF_SHA256: "33b144f63893d7a45d6c8e301aacf6ca1faa7a87088c19ab8bfdc1ecb29a0fd5"

      EXPECTED_LPM_AFTER_SHA256: "6805651af0a60905ce04356df3a538be15e94b6c8599a1d35e414d0a50b67094"
      EXPECTED_CPUIDLE_CORE_AFTER_SHA256: "e7f7fba62ce2bbe82f23c6bfbf5a103161d1c8013b85f7f48e4c036758f6a603"
      EXPECTED_CPUIDLE_HEADER_AFTER_SHA256: "9149734aa0eef1bba2e7ae16902dfd3aa203f23fe41657ce7df50ab947620506"

      EXPECTED_SCHEDUTIL_BEFORE_SHA256: "9d56491a427ee12f1156ae907c5aa647bf1a1b35bf13c725a08e73ef295274b7"
      EXPECTED_SCHEDUTIL_AFTER_SHA256: "987c9598f16b22a1e7b343475691687d309122de447494cd1a2b5ea8cbbafffc"

      EXPECTED_CASS_DIFF_SHA256: "67abb81be8c2d7727c3e4c8a92419c9e9a3d97ee3d3e5355d3acabce34adf659"

      EXPECTED_XIAOMI_PELT_SHA256: "bad23ba491cc5d4669936507b392888765aa65fd8063b2a95a492d6b0dca0cb0"

      EXPECTED_HZ_KCONFIG_SHA256: "685e9a79f3dbf17e9bd5b402dfd25ad014886fbe1b6975a0913b3621519cd7fe"

      EXPECTED_VEUX_DTB_SHA256: "42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37"

      CLANG_PREBUILT_COMMIT: "aa2e4a514a6c85eebcc4a27149eaf9244e951a1e"

      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      OUT_DIR: out
      ARTIFACT_DIR: ${{ github.workspace }}/idle-sleep-restore-full-build-c2

    steps:
      - name: Prepare corrected probe
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$ARTIFACT_DIR" \
            "$TOOLCHAIN_DIR"

          cat > "$ARTIFACT_DIR/PLAN.txt" <<'EOF'
          VEUX Restore Xiaomi Idle Sleep Policy Full Build - C2
          ======================================================

          42C forensic result:
          - exact Candidate 2 reconstruction passed
          - all four idle commits were verified
          - all four commits were Candidate ancestors
          - all four reverts succeeded
          - exactly three expected files changed
          - exact idle restore diff was generated successfully

          Exact 42C restore diff:
          33b144f63893d7a45d6c8e301aacf6ca1faa7a87088c19ab8bfdc1ecb29a0fd5

          42C did NOT fail because of:
          - an idle revert
          - a source conflict
          - compilation
          - linking
          - the kernel itself

          42C failed in its semantic verifier because
          cpuidle_latency_notify() was searched with an exact whitespace
          string while the real source uses tabs.

          42C2:
          - repeats the exact proven four-revert chain
          - pins the exact resulting three source hashes
          - uses whitespace-independent function parsing
          - retains all cumulative corrections proven through 40C
          - performs the complete Image + DTBs build

          Idle feature chain removed:
          64e34240600a0c90072972a6c3d86f1d6ec85c53
          4ac606c780ae02a075d75a2703be68880761531a
          8bc9cc6e197c0d1cf166ed94bb53ce41add1c828
          1d49e9b3308a7eacd75ed67f4112914e74ee60db

          Cumulative retained corrections:
          - CASS MaxFreq/Thermal adaptation
          - SPRD rotation disabled
          - standard LB capacity rate limit restored
          - CONFIG_CPUSETS restored
          - exact Xiaomi VEUX PELT8 restored
          - custom HZ100 removed
          - default HZ250 restored
          - schedutil 20% lower-step heuristic removed
          - normal schedutil boost-and-cap UClamp restored

          No ReSukiSU change.
          No SUSFS change.
          No boot.img.
          No flashable ZIP.
          No device access.
          No flashing.
          EOF

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python-is-python3 \
            rsync \
            xz-utils \
            zstd

      - name: Install exact Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz" \
            -o "${RUNNER_TEMP}/clang-r416183b.tar.gz"

          tar \
            -xzf "${RUNNER_TEMP}/clang-r416183b.tar.gz" \
            -C "$TOOLCHAIN_DIR"

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

          "$TOOLCHAIN_DIR/bin/clang" --version \
            | tee "$ARTIFACT_DIR/clang-version.txt"

          "$TOOLCHAIN_DIR/bin/ld.lld" --version \
            | tee -a "$ARTIFACT_DIR/clang-version.txt"

          if ! "$TOOLCHAIN_DIR/bin/clang" --version \
            | grep -q 'r416183b'
          then
            echo "ERROR: expected clang-r416183b"
            exit 1
          fi

          for TOOL in \
            clang \
            ld.lld \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-size \
            llvm-strip
          do
            if [ ! -x "$TOOLCHAIN_DIR/bin/$TOOL" ]; then
              echo "ERROR: missing toolchain binary: $TOOL"
              exit 1
            fi
          done

      - name: Checkout exact VEUX source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: "20240619"
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Recreate exact Candidate 2
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          BASE_SHA="$(git rev-parse HEAD)"
          BASE_TREE="$(git rev-parse HEAD^{tree})"

          git remote remove android-common 2>/dev/null || true

          git remote add \
            android-common \
            https://android.googlesource.com/kernel/common

          git fetch \
            --no-tags \
            android-common \
            "$COMMON_REF"

          COMMON_SHA="$(git rev-parse FETCH_HEAD)"

          git update-ref \
            refs/remotes/android-common/audit-base \
            "$COMMON_SHA"

          git merge \
            --no-edit \
            "$COMMON_SHA"

          MERGED_SHA="$(git rev-parse HEAD)"
          MERGED_TREE="$(git rev-parse HEAD^{tree})"

          git cat-file -e \
            "${STABILITY_REVERT}^{commit}"

          git revert \
            --no-edit \
            "$STABILITY_REVERT"

          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"

          KERNEL_VERSION="$(
            make -s kernelversion
          )"

          if [ "$KERNEL_VERSION" != "5.4.274" ]; then
            echo "ERROR: expected Linux 5.4.274"
            echo "Actual: $KERNEL_VERSION"
            exit 1
          fi

          if [ "$CANDIDATE_TREE" != "$EXPECTED_CANDIDATE_TREE" ]; then
            echo "ERROR: Candidate 2 tree mismatch"
            echo "Expected: $EXPECTED_CANDIDATE_TREE"
            echo "Actual:   $CANDIDATE_TREE"
            exit 1
          fi

          echo "CANDIDATE_TIP=$CANDIDATE_SHA" \
            >> "$GITHUB_ENV"

          {
            echo "BASE_SHA=$BASE_SHA"
            echo "BASE_TREE=$BASE_TREE"
            echo "COMMON_SHA=$COMMON_SHA"
            echo "MERGED_SHA=$MERGED_SHA"
            echo "MERGED_TREE=$MERGED_TREE"
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "CANDIDATE_TREE=$CANDIDATE_TREE"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
          } | tee "$ARTIFACT_DIR/IDENTITY.txt"

      - name: Fetch official Xiaomi VEUX reference
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git remote remove xiaomi 2>/dev/null || true

          git remote add \
            xiaomi \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git

          git fetch \
            --no-tags \
            xiaomi \
            "+refs/heads/${STOCK_REF}:refs/remotes/xiaomi/${STOCK_REF}"

          STOCK_SHA="$(
            git rev-parse "xiaomi/${STOCK_REF}"
          )"

          {
            echo "STOCK_REF=$STOCK_REF"
            echo "STOCK_SHA=$STOCK_SHA"
          } | tee "$ARTIFACT_DIR/XIAOMI-REFERENCE.txt"

      - name: Verify exact four idle commits
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          for COMMIT in \
            "$IDLE_SCREEN_COMMIT" \
            "$IDLE_EXPOSE_COMMIT" \
            "$IDLE_NOTIFIER_COMMIT" \
            "$IDLE_OPTIMIZE_COMMIT"
          do
            git cat-file -e \
              "${COMMIT}^{commit}"

            if ! git merge-base \
              --is-ancestor \
              "$COMMIT" \
              "$CANDIDATE_TIP"
            then
              echo "ERROR: idle commit is not a Candidate ancestor"
              echo "COMMIT=$COMMIT"
              exit 1
            fi
          done

          mapfile -t SCREEN_FILES < <(
            git diff-tree \
              --no-commit-id \
              --name-only \
              -r \
              "$IDLE_SCREEN_COMMIT" \
              | sort
          )

          mapfile -t EXPOSE_FILES < <(
            git diff-tree \
              --no-commit-id \
              --name-only \
              -r \
              "$IDLE_EXPOSE_COMMIT" \
              | sort
          )

          mapfile -t NOTIFIER_FILES < <(
            git diff-tree \
              --no-commit-id \
              --name-only \
              -r \
              "$IDLE_NOTIFIER_COMMIT" \
              | sort
          )

          mapfile -t OPTIMIZE_FILES < <(
            git diff-tree \
              --no-commit-id \
              --name-only \
              -r \
              "$IDLE_OPTIMIZE_COMMIT" \
              | sort
          )

          [ "${SCREEN_FILES[*]}" = \
            "drivers/cpuidle/lpm-levels.c" ]

          [ "${EXPOSE_FILES[*]}" = \
            "drivers/cpuidle/lpm-levels.c include/linux/cpuidle.h" ]

          [ "${NOTIFIER_FILES[*]}" = \
            "drivers/cpuidle/cpuidle.c" ]

          [ "${OPTIMIZE_FILES[*]}" = \
            "drivers/cpuidle/lpm-levels.c" ]

          {
            echo "IDLE_SCREEN_COMMIT_VERIFIED=YES"
            echo "IDLE_EXPOSE_COMMIT_VERIFIED=YES"
            echo "IDLE_NOTIFIER_COMMIT_VERIFIED=YES"
            echo "IDLE_OPTIMIZE_COMMIT_VERIFIED=YES"
            echo "ALL_IDLE_COMMITS_ARE_CANDIDATE_ANCESTORS=YES"
          } | tee "$ARTIFACT_DIR/IDLE-COMMIT-STATE.txt"

      - name: Verify Candidate idle baseline
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LPM="drivers/cpuidle/lpm-levels.c"
          CORE="drivers/cpuidle/cpuidle.c"
          HEADER="include/linux/cpuidle.h"

          grep -qF \
            'static bool sleep_disabled = true;' \
            "$LPM"

          grep -qF \
            'module_param_named(sleep_disabled, sleep_disabled, bool, 0444);' \
            "$LPM"

          grep -qF \
            'lpm_drm_panel_notify' \
            "$LPM"

          grep -qF \
            'goodix_get_panel' \
            "$LPM"

          grep -qF \
            'drm_panel_notifier_register' \
            "$LPM"

          grep -qF \
            'if (!cpu || sleep_disabled)' \
            "$LPM"

          grep -qF \
            'bool lpm_sleep_disabled(void)' \
            "$LPM"

          grep -qF \
            'if (!lpm_sleep_disabled())' \
            "$CORE"

          grep -qF \
            'extern bool lpm_sleep_disabled(void);' \
            "$HEADER"

          {
            echo "CANDIDATE_DISPLAY_COUPLED_SLEEP_POLICY=YES"
            echo "CANDIDATE_SCREEN_ON_FORCED_WFI=YES"
            echo "CANDIDATE_LPM_SLEEP_EXPORT=YES"
          } | tee "$ARTIFACT_DIR/IDLE-BEFORE-STATE.txt"

      - name: Reverse exact display idle feature chain
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git revert \
            --no-edit \
            "$IDLE_OPTIMIZE_COMMIT"

          git revert \
            --no-edit \
            "$IDLE_NOTIFIER_COMMIT"

          git revert \
            --no-edit \
            "$IDLE_EXPOSE_COMMIT"

          git revert \
            --no-edit \
            "$IDLE_SCREEN_COMMIT"

          RESTORED_TIP="$(git rev-parse HEAD)"

          git diff \
            --no-ext-diff \
            --no-color \
            "$CANDIDATE_TIP" \
            "$RESTORED_TIP" \
            -- \
            drivers/cpuidle/cpuidle.c \
            drivers/cpuidle/lpm-levels.c \
            include/linux/cpuidle.h \
            > "$ARTIFACT_DIR/IDLE-SLEEP-RESTORE.diff"

          IDLE_DIFF_SHA="$(
            sha256sum \
              "$ARTIFACT_DIR/IDLE-SLEEP-RESTORE.diff" \
              | awk '{print $1}'
          )"

          if [ "$IDLE_DIFF_SHA" != "$EXPECTED_IDLE_RESTORE_DIFF_SHA256" ]; then
            echo "ERROR: idle restore diff differs from successful 42C revert result"
            echo "Expected: $EXPECTED_IDLE_RESTORE_DIFF_SHA256"
            echo "Actual:   $IDLE_DIFF_SHA"
            exit 1
          fi

          mapfile -t CHANGED_FILES < <(
            git diff \
              --name-only \
              "$CANDIDATE_TIP" \
              "$RESTORED_TIP" \
              | sort
          )

          EXPECTED_FILES=(
            "drivers/cpuidle/cpuidle.c"
            "drivers/cpuidle/lpm-levels.c"
            "include/linux/cpuidle.h"
          )

          if [ "${CHANGED_FILES[*]}" != "${EXPECTED_FILES[*]}" ]; then
            echo "ERROR: idle reversal changed unexpected files"
            printf '%s\n' "${CHANGED_FILES[@]}"
            exit 1
          fi

          {
            echo "IDLE_FEATURE_CHAIN_REVERSED=YES"
            echo "IDLE_RESTORE_CHANGED_FILE_COUNT=3"
            echo "IDLE_RESTORE_DIFF_SHA256=$IDLE_DIFF_SHA"
            echo "IDLE_RESTORED_TIP=$RESTORED_TIP"
          } | tee "$ARTIFACT_DIR/IDLE-RESTORE-STATE.txt"

      - name: Verify exact restored idle source hashes
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LPM="drivers/cpuidle/lpm-levels.c"
          CORE="drivers/cpuidle/cpuidle.c"
          HEADER="include/linux/cpuidle.h"

          LPM_SHA="$(
            sha256sum "$LPM" \
              | awk '{print $1}'
          )"

          CORE_SHA="$(
            sha256sum "$CORE" \
              | awk '{print $1}'
          )"

          HEADER_SHA="$(
            sha256sum "$HEADER" \
              | awk '{print $1}'
          )"

          if [ "$LPM_SHA" != "$EXPECTED_LPM_AFTER_SHA256" ]; then
            echo "ERROR: restored lpm-levels.c hash mismatch"
            exit 1
          fi

          if [ "$CORE_SHA" != "$EXPECTED_CPUIDLE_CORE_AFTER_SHA256" ]; then
            echo "ERROR: restored cpuidle.c hash mismatch"
            exit 1
          fi

          if [ "$HEADER_SHA" != "$EXPECTED_CPUIDLE_HEADER_AFTER_SHA256" ]; then
            echo "ERROR: restored cpuidle.h hash mismatch"
            exit 1
          fi

          {
            echo "LPM_AFTER_SHA256=$LPM_SHA"
            echo "CPUIDLE_CORE_AFTER_SHA256=$CORE_SHA"
            echo "CPUIDLE_HEADER_AFTER_SHA256=$HEADER_SHA"
            echo "EXACT_42C_RESTORED_BYTES=YES"
          } | tee "$ARTIFACT_DIR/IDLE-AFTER-HASHES.txt"

      - name: Verify restored Xiaomi style idle semantics
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LPM="drivers/cpuidle/lpm-levels.c"
          CORE="drivers/cpuidle/cpuidle.c"
          HEADER="include/linux/cpuidle.h"

          if grep -qF \
            'static bool sleep_disabled = true;' \
            "$LPM"
          then
            echo "ERROR: sleep_disabled still defaults true"
            exit 1
          fi

          grep -qF \
            'static bool sleep_disabled;' \
            "$LPM"

          grep -qF \
            'module_param_named(sleep_disabled, sleep_disabled, bool, 0664);' \
            "$LPM"

          FORBIDDEN_LPM=(
            '#include <drm/drm_panel.h>'
            'lpm_drm_panel_notify'
            'goodix_get_panel'
            'drm_panel_notifier_register'
            'if (!cpu || sleep_disabled)'
            'bool lpm_sleep_disabled(void)'
            'EXPORT_SYMBOL(lpm_sleep_disabled);'
          )

          for TOKEN in "${FORBIDDEN_LPM[@]}"; do
            if grep -qF "$TOKEN" "$LPM"; then
              echo "ERROR: custom display idle token remains: $TOKEN"
              exit 1
            fi
          done

          if grep -qF \
            'lpm_sleep_disabled' \
            "$CORE"
          then
            echo "ERROR: generic cpuidle sleep integration remains"
            exit 1
          fi

          if grep -qF \
            'lpm_sleep_disabled' \
            "$HEADER"
          then
            echo "ERROR: cpuidle header sleep integration remains"
            exit 1
          fi

          grep -qF \
            'if (!cpu)' \
            "$LPM"

          grep -qF \
            'if (sleep_disabled)' \
            "$LPM"

          python3 - <<'PY'
          from pathlib import Path

          core = Path(
              "drivers/cpuidle/cpuidle.c"
          ).read_text()

          marker = (
              "static int cpuidle_latency_notify("
          )

          start = core.find(marker)

          if start < 0:
              raise SystemExit(
                  "ERROR: cpuidle_latency_notify not found"
              )

          brace = core.find(
              "{",
              start,
          )

          if brace < 0:
              raise SystemExit(
                  "ERROR: cpuidle_latency_notify opening brace not found"
              )

          depth = 0
          end = None

          for pos in range(
              brace,
              len(core),
          ):
              char = core[pos]

              if char == "{":
                  depth += 1
              elif char == "}":
                  depth -= 1

                  if depth == 0:
                      end = pos + 1
                      break

          if end is None:
              raise SystemExit(
                  "ERROR: cpuidle_latency_notify closing brace not found"
              )

          body = core[
              brace:end
          ]

          if "wake_up_all_idle_cpus();" not in body:
              raise SystemExit(
                  "ERROR: unconditional idle wake call missing"
              )

          if "lpm_sleep_disabled" in body:
              raise SystemExit(
                  "ERROR: custom sleep-disabled notifier guard remains"
              )
          PY

          cp \
            "$LPM" \
            "$ARTIFACT_DIR/lpm-levels-after.c"

          cp \
            "$CORE" \
            "$ARTIFACT_DIR/cpuidle-core-after.c"

          cp \
            "$HEADER" \
            "$ARTIFACT_DIR/cpuidle-header-after.h"

          {
            echo "DISPLAY_COUPLED_SLEEP_POLICY_REMOVED=YES"
            echo "SLEEP_DISABLED_DEFAULT_FALSE=YES"
            echo "SLEEP_DISABLED_PARAM_0664=YES"
            echo "DRM_IDLE_NOTIFIER_REMOVED=YES"
            echo "GOODIX_IDLE_PANEL_BINDING_REMOVED=YES"
            echo "SCREEN_ON_FORCED_WFI_REMOVED=YES"
            echo "LPM_SLEEP_DISABLED_EXPORT_REMOVED=YES"
            echo "GENERIC_CPUIDLE_SLEEP_GUARD_REMOVED=YES"
            echo "CPUIDLE_LATENCY_WAKE_RESTORED=YES"
          } | tee "$ARTIFACT_DIR/IDLE-SEMANTIC-STATE.txt"

      - name: Restore standard schedutil behaviour
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="kernel/sched/cpufreq_schedutil.c"

          BEFORE_SHA="$(
            sha256sum "$SOURCE" \
              | awk '{print $1}'
          )"

          if [ "$BEFORE_SHA" != "$EXPECTED_SCHEDUTIL_BEFORE_SHA256" ]; then
            echo "ERROR: schedutil Candidate baseline mismatch"
            echo "Expected: $EXPECTED_SCHEDUTIL_BEFORE_SHA256"
            echo "Actual:   $BEFORE_SHA"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/sched/cpufreq_schedutil.c"
          )

          text = path.read_text()

          declaration = (
              "\tunsigned int idx, l_freq, h_freq;\n"
          )

          if text.count(declaration) != 1:
              raise SystemExit(
                  "ERROR: schedutil declaration anchor mismatch"
              )

          text = text.replace(
              declaration,
              "",
              1,
          )

          old_frequency_block = """\
          \tl_freq = cpufreq_driver_resolve_freq(policy, freq);
          \tidx = cpufreq_frequency_table_target(policy, freq, CPUFREQ_RELATION_H);
          \th_freq = policy->freq_table[idx].frequency;
          \th_freq = clamp(h_freq, policy->min, policy->max);
          \tif (l_freq <= h_freq || l_freq == policy->min)
          \t\treturn l_freq;

          \t/*
          \t * Use the frequency step below if the calculated frequency is <20%
          \t * higher than it.
          \t */
          \tif (mult_frac(100, freq - h_freq, l_freq - h_freq) < 20)
          \t\treturn h_freq;

          \treturn l_freq;
          """

          standard_frequency_block = """\
          \treturn cpufreq_driver_resolve_freq(policy, freq);
          """

          if text.count(old_frequency_block) != 1:
              raise SystemExit(
                  "ERROR: schedutil lower-step anchor mismatch"
              )

          text = text.replace(
              old_frequency_block,
              standard_frequency_block,
              1,
          )

          cap_only = (
              "\tif (type == FREQUENCY_UTIL && "
              "uclamp_rq_util_with(rq, util, p) < util)\n"
          )

          normal = (
              "\tif (type == FREQUENCY_UTIL)\n"
          )

          if text.count(cap_only) != 1:
              raise SystemExit(
                  "ERROR: schedutil UClamp anchor mismatch"
              )

          text = text.replace(
              cap_only,
              normal,
              1,
          )

          path.write_text(text)
          PY

          AFTER_SHA="$(
            sha256sum "$SOURCE" \
              | awk '{print $1}'
          )"

          if [ "$AFTER_SHA" != "$EXPECTED_SCHEDUTIL_AFTER_SHA256" ]; then
