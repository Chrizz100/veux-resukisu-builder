          fi

          grep -E \
            '[[:space:]]lpm_sleep_disabled$' \
            "$ARTIFACT_DIR/vmlinux-symbols.txt" \
            > "$ARTIFACT_DIR/LPM-SLEEP-SYMBOLS.txt" \
            || true

          LPM_SLEEP_SYMBOL_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/LPM-SLEEP-SYMBOLS.txt" \
              | tr -d ' '
          )"

          if [ "$LPM_SLEEP_SYMBOL_COUNT" -ne 0 ]; then
