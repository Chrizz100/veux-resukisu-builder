name: Irena X 7371 P4R1 old LSPlant + R1 + AppComponentFactory compat

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRAMEWORK_FAMILY: Irena-X
  FRAMEWORK_VERSION: v2.0.1
  FRAMEWORK_BUILD: "7371"

  IRENA_REPO: silvzr/LSP-IrenaX
  IRENA_COMMIT: da439fbbed506dac6c66074af7fda8982aa4fc6a
  CURRENT_LSPLANT_SHA: c5b46bb4f6a99ffe0c77ce3ab006d3f67d5a2b1c
  OLD_LSPLANT_REPO: https://github.com/mywalkb/LSPlant_mod.git
  OLD_LSPLANT_SHA: f492475a76777c0b40e419fe1908871cde88f627
  CURRENT_DOBBY_SHA: dc7b4be06ad6c5dcfb0bb4ca2082b007d69eaed5

  OFFICIAL_RELEASE_URL: https://github.com/silvzr/LSP-IrenaX/releases/download/v2.0.1/LSPosed-v2.0.1-7371-IrenaX-release.zip
  OFFICIAL_RELEASE_SHA256: 99e7aaf54dda0e6fa746c55613483a80620174f255dd05e102713778a9966d2f

  FINAL_ZIP: INSTALL_THIS_LSPosed-v2.0.1-7371-IrenaX-P4R1-Old-LSPlant-R1-AppComponentFactory-compatibility.zip

jobs:
  build:
    name: Build P4R1 old-LSPlant compatibility candidate
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_BASEDIR: "${{ github.workspace }}/LSP-IrenaX"

    steps:
      - name: Freeze P4R1 development contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p4r1-output
          {
            echo "PARENT=P4-v3 design: Irena 7371 + old LSPlant f492475a + current Dobby"
            echo "P4_API_ADAPTERS=ONLY native_api.cpp + resource_types.h syntax/API bridge"
            echo "R1_V2_M_INCLUDE_CODE_FIX=APPLIED"
            echo "APP_COMPONENT_FACTORY=OPTIONAL_FAIL_OPEN"
            echo "APP_COMPONENT_FACTORY_POLICY=field absence/read failure must not abort package dispatch"
            echo "PAIRIP_FIX=comes from old LSPlant mandatory FixupStaticTrampolines gate; no COMPAT1/2/3 native patch"
            echo "P6_VISIBILITY_FALLBACK=ABSENT"
            echo "JIT_SPECIAL_PATCH=ABSENT"
            echo "INGRESS_SPECIFIC_GUARD=ABSENT"
            echo "VEUX_SPECIFIC_GUARD=ABSENT"
            echo "DOBBY=current pinned unchanged"
            echo "MODULE_SCOPES=unchanged runtime configuration"
            echo "FINAL_PACKAGE_BASE=official Irena 7371"
            echo "FINAL_TRANSPLANT=framework/lspd.dex + 4 liblspd.so and their sidecars only"
            echo "STATIC_PASS_IS_NOT_DEVICE_PASS=YES"
          } | tee p4r1-output/P4R1_DEVELOPMENT_CONTRACT.txt

      - name: Checkout pinned Irena X 7371
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IRENA_REPO }}
          ref: ${{ env.IRENA_COMMIT }}
          submodules: recursive
          fetch-depth: 0
          path: LSP-IrenaX
          persist-credentials: false

      - name: Verify pristine source pins
        id: pins
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$IRENA_COMMIT"
          test -z "$(git status --porcelain)"
          test "$(git -C external/lsplant rev-parse HEAD)" = "$CURRENT_LSPLANT_SHA"
          test "$(git -C external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
          test -z "$(git -C external/lsplant status --porcelain)"
          test -z "$(git -C external/dobby status --porcelain)"

          ctor="core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"
          createcl="core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java"
          test -f "$ctor"
          test -f "$createcl"

          grep -Fq 'boolean includeCode = XposedHelpers.getBooleanField(loadedApk, "mIncludeCode");' "$ctor"
          grep -Fq '} else if (!includeCode) {' "$ctor"

          grep -Fq 'private final static Field defaultClassLoaderField;' "$createcl"
          grep -Fq 'param.setAppComponentFactory((AppComponentFactory) XposedHelpers.getObjectField(loadedApk, "mAppComponentFactory"));' "$createcl"
          grep -Fq 'return (AppComponentFactory) XposedHelpers.getObjectField(loadedApk, "mAppComponentFactory");' "$createcl"
          grep -Fq 'XC_LoadPackage.callAll(lpparam);' "$createcl"
          grep -Fq 'LSPosedContext.callOnPackageReady(param);' "$createcl"
          grep -Fq 'public static Field findFieldIfExists(Class<?> clazz, String fieldName)'             core/src/main/java/de/robv/android/xposed/XposedHelpers.java

          {
            echo "IRENA=$(git rev-parse HEAD)"
            echo "CURRENT_LSPLANT=$(git -C external/lsplant rev-parse HEAD)"
            echo "DOBBY=$(git -C external/dobby rev-parse HEAD)"
            echo "R1_PRECONDITION_M_INCLUDE_CODE=PRESENT"
            echo "APP_COMPONENT_FACTORY_DIRECT_READ=PRESENT"
          } | tee ../p4r1-output/P4R1_SOURCE_PINS_AND_PRECONDITIONS.txt

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: irena-x-p4r1-old-lsplant-${{ runner.os }}
          restore-keys: |
            irena-x-p4-lsplant-${{ runner.os }}
            irena-x-${{ runner.os }}
          save: false

      - name: Setup Ninja 1.12.1
        uses: seanmiddleditch/gha-setup-ninja@master
        with:
          version: 1.12.1

      - name: Remove Android bundled CMake
        shell: bash
        run: rm -rf "$ANDROID_HOME/cmake"

      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.caching=true'
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC'
            echo 'android.native.buildOutput=verbose'
          } >> ~/.gradle/gradle.properties

      - name: Download and verify official Irena 7371 release
        id: official
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -o OFFICIAL_RELEASE.zip \
            "$OFFICIAL_RELEASE_URL"

          echo "$OFFICIAL_RELEASE_SHA256  OFFICIAL_RELEASE.zip" | sha256sum -c -
          unzip -t OFFICIAL_RELEASE.zip

          rm -rf officialcmp
          mkdir officialcmp
          unzip -q OFFICIAL_RELEASE.zip -d officialcmp

          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile("OFFICIAL_RELEASE.zip") as z:
              names = z.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit("duplicate names in official release")
              files = [n for n in names if not n.endswith("/")]
              if len(files) != 56:
                  raise SystemExit(f"official release file count is {len(files)}, expected 56")
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"official release CRC failure: {bad}")

          for required in (
              "manager.apk",
              "daemon.apk",
              "framework/lspd.dex",
              "lib/arm64-v8a/liblspd.so",
              "lib/armeabi-v7a/liblspd.so",
              "lib/x86/liblspd.so",
              "lib/x86_64/liblspd.so",
          ):
              if not (Path("officialcmp") / required).is_file():
                  raise SystemExit(f"official release missing {required}")
          PY

          sha256sum OFFICIAL_RELEASE.zip \
            | tee p4r1-output/P4R1_OFFICIAL_RELEASE_SHA256.txt

      - name: Build pristine 7371 baseline
        id: baseline
        if: steps.official.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ./gradlew clean zipAll --stacktrace --info 2>&1 | tee ../baseline-build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > ../BASELINE_BUILD_EXIT_CODE.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

          if [ "$rc" -eq 0 ]; then
            mapfile -t rel < <(find magisk-loader/release -maxdepth 1 -type f \
              -name 'LSPosed-v*-IrenaX-release.zip' -print | sort)
            test "${#rel[@]}" -eq 1
            cp "${rel[0]}" ../BASELINE_RELEASE.zip
          fi
          exit 0

      - name: Replace only LSPlant with old working backend
        id: replace
        if: steps.baseline.outputs.rc == '0'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -euo pipefail

          git -C external/lsplant remote set-url origin "$OLD_LSPLANT_REPO"
          git -C external/lsplant fetch --no-tags --depth=1 origin "$OLD_LSPLANT_SHA"
          git -C external/lsplant checkout --detach "$OLD_LSPLANT_SHA"
          git -C external/lsplant submodule sync --recursive
          git -C external/lsplant submodule update --init --recursive

          test "$(git -C external/lsplant rev-parse HEAD)" = "$OLD_LSPLANT_SHA"
          test -z "$(git -C external/lsplant status --porcelain)"
          test "$(git -C external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
          test -z "$(git -C external/dobby status --porcelain)"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("external/lsplant/lsplant/src/main/jni/art/runtime/class_linker.hpp")
          s = p.read_text()
          mandatory = (
              '        if (!HookSyms(handler, FixupStaticTrampolinesWithThread, FixupStaticTrampolines,\n'
              '                      FixupStaticTrampolinesRaw)) {\n'
              '            return false;\n'
              '        }\n'
          )
          if s.count(mandatory) != 1:
              raise SystemExit(
                  f"old LSPlant mandatory FixupStaticTrampolines gate count={s.count(mandatory)}"
              )
          PY

          test ! -f external/lsplant/lsplant/src/main/jni/art/runtime/jit/jit.cxx

          mapfile -t top < <(git diff --name-only | sort)
          test "${#top[@]}" -eq 1
          test "${top[0]}" = "external/lsplant"

          {
            echo "OLD_LSPLANT_REPO=$OLD_LSPLANT_REPO"
            echo "OLD_LSPLANT_SHA=$(git -C external/lsplant rev-parse HEAD)"
            echo "DOBBY_STILL=$(git -C external/dobby rev-parse HEAD)"
            echo
            git diff --submodule=short -- external/lsplant
            echo
            git -C external/lsplant submodule status --recursive
          } | tee ../p4r1-output/P4R1_OLD_LSPLANT_STATE.txt

      - name: Apply exact P4 v3 LSPlant API adapters
        id: adapter
        if: steps.replace.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("core/src/main/jni/src/native_api.cpp")
          s = p.read_text()

          old_using = 'using lsplant::operator""_sym;\n'
          if s.count(old_using) != 1:
              raise SystemExit(f"unexpected _sym using count: {s.count(old_using)}")
          s = s.replace(old_using, 'using lsplant::operator""_tstr;\n', 1)

          old_hooker = '    using lsplant::Hooker;\n'
          if s.count(old_hooker) != 1:
              raise SystemExit(f"unexpected Hooker using count: {s.count(old_hooker)}")
          s = s.replace(old_hooker, '', 1)

          old_prefix = (
              '    inline static auto do_dlopen_ = "__dl__Z9do_dlopenPKciPK17android_dlextinfoPKv"_sym.hook->*[]\n'
              '            <lsplant::Backup auto backup>\n'
              '            (const char* name, int flags, const void* extinfo, const void* caller_addr) static -> void* {\n'
          )
          new_prefix = (
              '    CREATE_HOOK_STUB_ENTRY(\n'
              '            "__dl__Z9do_dlopenPKciPK17android_dlextinfoPKv",\n'
              '            void*, do_dlopen, (const char* name, int flags, const void* extinfo,\n'
              '                    const void* caller_addr), {\n'
          )
          if s.count(old_prefix) != 1:
              raise SystemExit(f"unexpected new-hook prefix count: {s.count(old_prefix)}")
          s = s.replace(old_prefix, new_prefix, 1)

          old_suffix = (
              '                return handle;\n'
              '            };\n\n'
              '    bool InstallNativeAPI'
          )
          new_suffix = (
              '                return handle;\n'
              '            });\n\n'
              '    bool InstallNativeAPI'
          )
          if s.count(old_suffix) != 1:
              raise SystemExit(f"unexpected new-hook suffix count: {s.count(old_suffix)}")
          s = s.replace(old_suffix, new_suffix, 1)

          old_invoke = '            handler(do_dlopen_);\n'
          new_invoke = '            HookSymNoHandle(handler, do_dlopen_sym, do_dlopen);\n'
          if s.count(old_invoke) != 1:
              raise SystemExit(f"unexpected handler invocation count: {s.count(old_invoke)}")
          s = s.replace(old_invoke, new_invoke, 1)

          for token in ('operator""_sym', 'lsplant::Backup', 'do_dlopen_ ='):
              if token in s:
                  raise SystemExit(f"new LSPlant helper token survived: {token}")

          for required in (
              'moduleLoadedCallbacks',
              'moduleNativeLibs',
              '.art_symbol_resolver =',
              '.art_symbol_prefix_resolver =',
              'Loading module native library',
              'moduleLoadedCallbacks.push_back(callback)',
          ):
              if required not in s:
                  raise SystemExit(f"current Irena behavior marker missing: {required}")

          p.write_text(s)

          r = Path("core/src/main/jni/include/framework/androidfw/resource_types.h")
          t = r.read_text()

          old_using2 = 'using lsplant::operator""_sym;\n\n'
          if t.count(old_using2) != 1:
              raise SystemExit(f"unexpected resource _sym using count: {t.count(old_using2)}")
          t = t.replace(old_using2, "", 1)

          old_string_at_s = (
              '        inline static auto stringAtSSym = ("_ZNK7android13ResStringPool8stringAtEjPj"_sym |\n'
              '                                         "_ZNK7android13ResStringPool8stringAtEmPm"_sym).as<stringAtRet (ResStringPool::*)(size_t)>;\n\n'
              '        inline static stringAtRet stringAtS(ResStringPool* thiz, size_t idx) {\n'
          )
          new_string_at_s = (
              '        CREATE_MEM_FUNC_SYMBOL_ENTRY(\n'
              '                stringAtRet, stringAtS, ResStringPool *thiz, size_t idx) {\n'
          )
          if t.count(old_string_at_s) != 1:
              raise SystemExit(f"unexpected stringAtS frontend count: {t.count(old_string_at_s)}")
          t = t.replace(old_string_at_s, new_string_at_s, 1)

          old_string_at = (
              '        inline static auto stringAtSym = ("_ZNK7android13ResStringPool8stringAtEj"_sym |\n'
              '                                        "_ZNK7android13ResStringPool8stringAtEm"_sym).as<const char16_t* (ResStringPool::*)(size_t, size_t *)>;\n\n'
              '    inline static const char16_t* stringAt(ResStringPool* thiz, size_t idx, size_t *u16len) {\n'
          )
          new_string_at = (
              '        CREATE_MEM_FUNC_SYMBOL_ENTRY(\n'
              '                const char16_t*, stringAt, ResStringPool *thiz, size_t idx, size_t *u16len) {\n'
          )
          if t.count(old_string_at) != 1:
              raise SystemExit(f"unexpected stringAt frontend count: {t.count(old_string_at)}")
          t = t.replace(old_string_at, new_string_at, 1)

          old_setup = (
              '        static bool setup(const lsplant::HookHandler &handler) {\n'
              '            return !stringAtSym || !stringAtSSym;\n'
          )
          new_setup = (
              '        static bool setup(const lsplant::HookHandler &handler) {\n'
              '            // Preserve Irena 7371 exact symbol-to-wrapper mapping.\n'
              '            RETRIEVE_MEM_FUNC_SYMBOL(\n'
              '                    stringAtS,\n'
              '                    LP_SELECT("_ZNK7android13ResStringPool8stringAtEjPj",\n'
              '                              "_ZNK7android13ResStringPool8stringAtEmPm"));\n'
              '            RETRIEVE_MEM_FUNC_SYMBOL(\n'
              '                    stringAt,\n'
              '                    LP_SELECT("_ZNK7android13ResStringPool8stringAtEj",\n'
              '                              "_ZNK7android13ResStringPool8stringAtEm"));\n'
              '            return !stringAtSym || !stringAtSSym;\n'
          )
          if t.count(old_setup) != 1:
              raise SystemExit(f"unexpected resource setup count: {t.count(old_setup)}")
          t = t.replace(old_setup, new_setup, 1)

          for token in ('operator""_sym', '_sym |', ').as<'):
              if token in t:
                  raise SystemExit(f"new LSPlant resource helper token survived: {token}")

          r.write_text(t)
          PY

          git diff --check

          mapfile -t top < <(git diff --name-only | sort)
          printf '%s\n' "${top[@]}"
          test "${#top[@]}" -eq 3
          test "${top[0]}" = "core/src/main/jni/include/framework/androidfw/resource_types.h"
          test "${top[1]}" = "core/src/main/jni/src/native_api.cpp"
          test "${top[2]}" = "external/lsplant"

          test "$(git -C external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
          test -z "$(git -C external/dobby status --porcelain)"

          git diff -- \
            core/src/main/jni/src/native_api.cpp \
            core/src/main/jni/include/framework/androidfw/resource_types.h \
            > ../p4r1-output/P4R1_NATIVE_API_ADAPTER.patch

      - name: Apply confirmed R1 v2 mIncludeCode fix
        id: r1patch
        if: steps.adapter.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java")
          s = p.read_text()

          line = '            boolean includeCode = XposedHelpers.getBooleanField(loadedApk, "mIncludeCode");\n'
          branch = (
              '            } else if (!includeCode) {\n'
              '                Hookers.logD("LoadedApk#<init> has no code, skip: " + mAppDir);\n'
              '                return;\n'
          )

          if s.count(line) != 1:
              raise SystemExit(f"expected one mIncludeCode read, got {s.count(line)}")
          if s.count(branch) != 1:
              raise SystemExit(f"expected one no-code branch, got {s.count(branch)}")

          s = s.replace(line, "", 1)
          s = s.replace(branch, "", 1)

          expected = (
              '            if (packageName.equals("android")) {\n'
              '                if (XposedInit.startsSystemServer) {\n'
              '                    Hookers.logD("LoadedApk#<init> is android, skip: " + mAppDir);\n'
              '                    return;\n'
              '                } else {\n'
              '                    packageName = "system";\n'
              '                }\n'
              '            }\n'
              '\n'
              '            if (!XposedInit.loadedPackagesInProcess.add(packageName)) {\n'
          )
          if expected not in s:
              raise SystemExit("R1-v2 post-patch control flow does not match expected source")

          if 'mIncludeCode' in s:
              raise SystemExit("mIncludeCode remains in LoadedApkCtorHooker after R1-v2 patch")

          p.write_text(s)
          PY

          git diff --check

      - name: Apply optional AppComponentFactory compatibility
        id: appfactory
        if: steps.r1patch.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java")
          s = p.read_text()

          field_anchor = '    private final static Field defaultClassLoaderField;\n'
          field_repl = (
              '    private final static Field defaultClassLoaderField;\n'
              '    private final static Field appComponentFactoryField;\n'
          )
          if s.count(field_anchor) != 1:
              raise SystemExit(f"expected one field anchor, got {s.count(field_anchor)}")
          s = s.replace(field_anchor, field_repl, 1)

          static_anchor = (
              '        defaultClassLoaderField = field;\n'
              '    }\n'
          )
          static_repl = (
              '        defaultClassLoaderField = field;\n'
              '\n'
              '        field = null;\n'
              '        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {\n'
              '            try {\n'
              '                field = XposedHelpers.findFieldIfExists(LoadedApk.class, "mAppComponentFactory");\n'
              '            } catch (Throwable ignored) {\n'
              '            }\n'
              '        }\n'
              '        appComponentFactoryField = field;\n'
              '    }\n'
          )
          if s.count(static_anchor) != 1:
              raise SystemExit(f"expected one static-init anchor, got {s.count(static_anchor)}")
          s = s.replace(static_anchor, static_repl, 1)

          direct_anchor = (
              '            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {\n'
              '                param.setAppComponentFactory((AppComponentFactory) XposedHelpers.getObjectField(loadedApk, "mAppComponentFactory"));\n'
              '            }\n'
          )
          direct_repl = (
              '            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {\n'
              '                if (appComponentFactoryField != null) {\n'
              '                    try {\n'
              '                        param.setAppComponentFactory(\n'
              '                                (AppComponentFactory) appComponentFactoryField.get(loadedApk));\n'
              '                    } catch (Throwable t) {\n'
              '                        Hookers.logD("LSPOSED-P4R1: APP_COMPONENT_FACTORY_READ_FAILED_CONTINUE=1");\n'
              '                    }\n'
              '                } else {\n'
              '                    Hookers.logD("LSPOSED-P4R1: APP_COMPONENT_FACTORY_UNAVAILABLE_CONTINUE=1");\n'
              '                }\n'
              '            }\n'
          )
          if s.count(direct_anchor) != 1:
              raise SystemExit(f"expected one direct AppComponentFactory read, got {s.count(direct_anchor)}")
          s = s.replace(direct_anchor, direct_repl, 1)

          legacy_anchor = '            XC_LoadPackage.callAll(lpparam);\n'
          legacy_repl = (
              '            XC_LoadPackage.callAll(lpparam);\n'
              '            Hookers.logD("LSPOSED-P4R1: LEGACY_DISPATCH_REACHED=1 package=" + lpparam.packageName);\n'
          )
          if s.count(legacy_anchor) != 1:
              raise SystemExit(f"expected one legacy dispatch call, got {s.count(legacy_anchor)}")
          s = s.replace(legacy_anchor, legacy_repl, 1)

          callback_anchor = (
              '            LSPosedContext.callOnPackageLoaded(param);\n'
              '            LSPosedContext.callOnPackageReady(param);\n'
          )
          callback_repl = (
              '            LSPosedContext.callOnPackageLoaded(param);\n'
              '            LSPosedContext.callOnPackageReady(param);\n'
              '            Hookers.logD("LSPOSED-P4R1: PACKAGE_CALLBACKS_COMPLETE=1 package=" + lpparam.packageName);\n'
          )
          if s.count(callback_anchor) != 1:
              raise SystemExit(f"expected one package callback block, got {s.count(callback_anchor)}")
          s = s.replace(callback_anchor, callback_repl, 1)

          getter_anchor = (
              '            return (AppComponentFactory) XposedHelpers.getObjectField(loadedApk, "mAppComponentFactory");\n'
          )
          getter_repl = (
              '            if (appComponentFactoryField == null) {\n'
              '                throw new UnsupportedOperationException(\n'
              '                        "AppComponentFactory is unavailable on this platform");\n'
              '            }\n'
              '            try {\n'
              '                AppComponentFactory value =\n'
              '                        (AppComponentFactory) appComponentFactoryField.get(loadedApk);\n'
              '                if (value == null) {\n'
              '                    throw new IllegalStateException("AppComponentFactory is not ready");\n'
              '                }\n'
              '                return value;\n'
              '            } catch (IllegalStateException e) {\n'
              '                throw e;\n'
              '            } catch (Throwable t) {\n'
              '                throw new IllegalStateException(t);\n'
              '            }\n'
          )
          if s.count(getter_anchor) != 1:
              raise SystemExit(f"expected one getter direct AppComponentFactory read, got {s.count(getter_anchor)}")
          s = s.replace(getter_anchor, getter_repl, 1)

          forbidden = (
              'param.setAppComponentFactory((AppComponentFactory) XposedHelpers.getObjectField(loadedApk, "mAppComponentFactory"))',
              'return (AppComponentFactory) XposedHelpers.getObjectField(loadedApk, "mAppComponentFactory");',
          )
          for token in forbidden:
              if token in s:
                  raise SystemExit(f"hard AppComponentFactory access survived: {token}")

          required = (
              'appComponentFactoryField',
              'APP_COMPONENT_FACTORY_UNAVAILABLE_CONTINUE=1',
              'APP_COMPONENT_FACTORY_READ_FAILED_CONTINUE=1',
              'LEGACY_DISPATCH_REACHED=1',
              'PACKAGE_CALLBACKS_COMPLETE=1',
              'findFieldIfExists(LoadedApk.class, "mAppComponentFactory")',
          )
          for token in required:
              if token not in s:
                  raise SystemExit(f"required compatibility marker missing: {token}")

          p.write_text(s)
          PY

          git diff --check

      - name: Freeze exact P4R1 source scope
        id: scope
        if: steps.appfactory.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t top < <(git diff --name-only | sort)
          printf '%s\n' "${top[@]}" | tee ../p4r1-output/P4R1_SOURCE_DIFF_NAMES.txt

          expected=(
            "core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java"
            "core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"
            "core/src/main/jni/include/framework/androidfw/resource_types.h"
            "core/src/main/jni/src/native_api.cpp"
            "external/lsplant"
          )

          test "${#top[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${top[$i]}" = "${expected[$i]}"
          done

          test "$(git -C external/lsplant rev-parse HEAD)" = "$OLD_LSPLANT_SHA"
          test "$(git -C external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
          test -z "$(git -C external/dobby status --porcelain)"

          # Explicitly freeze paths from discarded branches.
          git diff --exit-code "$IRENA_COMMIT" -- \
            magisk-loader/src/main/jni/api/zygisk_main.cpp \
            magisk-loader/src/main/jni/src/magisk_loader.cpp \
            magisk-loader/src/main/jni/CMakeLists.txt \
            daemon/src/main/java/org/lsposed/lspd/service/Dex2OatService.java \
            daemon/src/main/java/org/lsposed/lspd/util/InstallerVerifier.java \
            core/src/main/java/org/lsposed/lspd/deopt/InlinedMethodCallers.java \
            core/src/main/java/org/lsposed/lspd/core/Startup.java \
            core/src/main/java/org/lsposed/lspd/impl/LSPosedBridge.java \
            core/src/main/java/org/lsposed/lspd/impl/LSPosedHelper.java \
            core/src/main/jni/src/jni/hook_bridge.cpp

          git diff > ../p4r1-output/P4R1_TOPLEVEL_SOURCE.patch
          git -C external/lsplant diff "$OLD_LSPLANT_SHA" --exit-code

          {
            echo "IRENA=$IRENA_COMMIT"
            echo "OLD_LSPLANT=$OLD_LSPLANT_SHA"
            echo "DOBBY=$CURRENT_DOBBY_SHA"
            echo "SOURCE_DELTA_COUNT=${#top[@]}"
            echo "SOURCE_DELTA=${top[*]}"
            echo "COMPAT1_COMPAT2_COMPAT3_NATIVE_PATCHES=ABSENT"
            echo "P6_VISIBILITY_FALLBACK=ABSENT"
            echo "INGRESS_SPECIFIC_CODE=ABSENT"
            echo "VEUX_SPECIFIC_CODE=ABSENT"
          } | tee ../p4r1-output/P4R1_PROVENANCE.txt

      - name: Build P4R1 candidate
        id: p4r1build
        if: steps.scope.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ./gradlew clean zipAll --stacktrace --info 2>&1 | tee ../p4r1-build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > ../P4R1_BUILD_EXIT_CODE.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Extract build diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p4r1-output/native

          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("p4r1-build.log")
          if not log.exists():
              Path("p4r1-output/P4R1_FAILURE_EXCERPT.txt").write_text("p4r1-build.log not created\n")
              Path("p4r1-output/P4R1_FAILURE_MATCHES.txt").write_text("p4r1-build.log not created\n")
              raise SystemExit(0)

          lines = log.read_text(errors="replace").splitlines()
          pat = re.compile(
              r"(FAILED:|error:|fatal error:|undefined reference|CMake Error|ninja:.*failed|"
              r"Execution failed for task|BUILD FAILED|No such file|not declared|no member named|"
              r"unknown type name|does not name a type)",
              re.I,
          )
          hits = [i for i, line in enumerate(lines) if pat.search(line)]
          Path("p4r1-output/P4R1_FAILURE_MATCHES.txt").write_text(
              "".join(f"{i+1}: {lines[i]}\n" for i in hits[:300])
          )

          if hits:
              first = hits[0]
              lo, hi = max(0, first - 60), min(len(lines), first + 180)
          else:
              lo, hi = max(0, len(lines) - 300), len(lines)

          Path("p4r1-output/P4R1_FAILURE_EXCERPT.txt").write_text(
              "\n".join(f"{i+1}: {lines[i]}" for i in range(lo, hi)) + "\n"
          )
          PY

          find LSP-IrenaX -type f \( \
            -name 'CMakeCache.txt' -o \
            -name 'CMakeError.log' -o \
            -name 'CMakeOutput.log' -o \
            -name 'build.ninja' -o \
            -name 'rules.ninja' -o \
            -name 'compile_commands.json' \
          \) -print0 | while IFS= read -r -d '' f; do
            dst="p4r1-output/native/${f#LSP-IrenaX/}"
            mkdir -p "$(dirname "$dst")"
            cp "$f" "$dst"
          done

      - name: Validate rebuilt package delta
        id: package
        if: steps.p4r1build.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf baselinecmp buildcmp
          mkdir baselinecmp buildcmp
          unzip -q BASELINE_RELEASE.zip -d baselinecmp

          mapfile -t rel < <(find LSP-IrenaX/magisk-loader/release -maxdepth 1 -type f \
            -name 'LSPosed-v*-IrenaX-release.zip' -print | sort)
          mapfile -t dbg < <(find LSP-IrenaX/magisk-loader/release -maxdepth 1 -type f \
            -name 'LSPosed-v*-IrenaX-debug.zip' -print | sort)
          test "${#rel[@]}" -eq 1
          test "${#dbg[@]}" -eq 1

          cp "${rel[0]}" P4R1_BUILD_RELEASE.zip
          unzip -q P4R1_BUILD_RELEASE.zip -d buildcmp
          unzip -t P4R1_BUILD_RELEASE.zip

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          def tree(root):
              root = Path(root)
              return {
                  p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob("*") if p.is_file()
              }

          a, b = tree("baselinecmp"), tree("buildcmp")
          if set(a) != set(b):
              raise SystemExit("baseline/P4R1 file sets differ")

          diff = sorted(k for k in a if a[k] != b[k])
          Path("p4r1-output/P4R1_BASELINE_PACKAGE_DIFF.txt").write_text(
              "\n".join(diff) + "\n"
          )

          expected = sorted(
              ["daemon.apk", "daemon.apk.sha256", "framework/lspd.dex", "framework/lspd.dex.sha256"] +
              [f"lib/{abi}/liblspd.so"
               for abi in ("arm64-v8a", "armeabi-v7a", "x86", "x86_64")] +
              [f"lib/{abi}/liblspd.so.sha256"
               for abi in ("arm64-v8a", "armeabi-v7a", "x86", "x86_64")]
          )

          if diff != expected:
              raise SystemExit(f"unexpected rebuilt-package delta: {diff}")

          Path("p4r1-output/P4R1_BUILD_PACKAGE_SCOPE.txt").write_text(
              "EXPECTED_BUILD_DELTA=daemon.apk + daemon sidecar + framework/lspd.dex + dex sidecar + 4 liblspd.so + 4 sidecars\n"
              "FINAL_HYBRID_EXCLUDES_REBUILT_DAEMON=YES\n"
          )
          PY

      - name: Create official-base P4R1 install ZIP
        id: hybrid
        if: steps.package.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import zipfile

          official = Path("OFFICIAL_RELEASE.zip")
          built = Path("buildcmp")
          out = Path(os.environ["FINAL_ZIP"])

          payload = {"framework/lspd.dex"} | {
              f"lib/{abi}/liblspd.so"
              for abi in ("arm64-v8a", "armeabi-v7a", "x86", "x86_64")
          }
          sidecars = {x + ".sha256" for x in payload}

          with zipfile.ZipFile(official, "r") as zin, zipfile.ZipFile(out, "w") as zout:
              infos = zin.infolist()
              names = [x.filename for x in infos]
              if len(names) != len(set(names)):
                  raise SystemExit("duplicate names in official ZIP")
              if not (payload | sidecars).issubset(set(names)):
                  raise SystemExit("official ZIP misses replacement targets")

              for info in infos:
                  name = info.filename
                  if name in payload:
                      data = (built / name).read_bytes()
                  elif name in sidecars:
                      target = built / name[:-7]
                      data = hashlib.sha256(target.read_bytes()).hexdigest().encode()
                  else:
                      data = zin.read(name)
                  zout.writestr(info, data)
          PY

          unzip -t "$FINAL_ZIP"
          sha256sum "$FINAL_ZIP" | tee p4r1-output/P4R1_FINAL_PACKAGE_SHA256.txt

      - name: Audit final P4R1 install package
        id: audit
        if: steps.hybrid.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf finalcmp
          mkdir finalcmp
          unzip -q "$FINAL_ZIP" -d finalcmp

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import zipfile

          official_zip = Path("OFFICIAL_RELEASE.zip")
          final_zip = Path(os.environ["FINAL_ZIP"])
          official = Path("officialcmp")
          final = Path("finalcmp")

          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          def tree(root):
              return {
                  p.relative_to(root).as_posix(): sha(p)
                  for p in root.rglob("*") if p.is_file()
              }

          with zipfile.ZipFile(final_zip) as z:
              names = z.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit("duplicate names in final ZIP")
              files = [n for n in names if not n.endswith("/")]
              if len(files) != 56:
                  raise SystemExit(f"final file count is {len(files)}, expected 56")
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"final ZIP CRC failure: {bad}")

          a, b = tree(official), tree(final)
          if set(a) != set(b):
              raise SystemExit("official/final file sets differ")

          diff = sorted(k for k in a if a[k] != b[k])
          expected = sorted(
              ["framework/lspd.dex", "framework/lspd.dex.sha256"] +
              [f"lib/{abi}/liblspd.so"
               for abi in ("arm64-v8a", "armeabi-v7a", "x86", "x86_64")] +
              [f"lib/{abi}/liblspd.so.sha256"
               for abi in ("arm64-v8a", "armeabi-v7a", "x86", "x86_64")]
          )
          if diff != expected:
              raise SystemExit(f"unexpected official/final delta: {diff}")

          Path("p4r1-output/P4R1_FINAL_PACKAGE_DIFF.txt").write_text(
              "\n".join(diff) + "\n"
          )

          for path in (
              "manager.apk",
              "daemon.apk",
              "bin/arm64-v8a/dex2oat",
              "bin/arm64-v8a/libpreload.so",
          ):
              if sha(official / path) != sha(final / path):
                  raise SystemExit(f"{path} unexpectedly changed")

          checked = 0
          for side in final.rglob("*.sha256"):
              rel = side.relative_to(final).as_posix()
              target = final / rel[:-7]
              if not target.exists():
                  raise SystemExit(f"missing payload for {rel}")
              recorded = side.read_text().strip().split()[0].lower()
              if recorded != sha(target):
                  raise SystemExit(f"bad sidecar {rel}")
              checked += 1

          if checked != 28:
              raise SystemExit(f"checked {checked} sidecars, expected 28")

          Path("p4r1-output/P4R1_FINAL_SCOPE.txt").write_text(
              "FINAL_FILE_COUNT=56\n"
              "FINAL_CHANGED_FILES=10\n"
              "SIDECARS_VALID=28/28\n"
              "MANAGER=official byte-identical\n"
              "DAEMON=official byte-identical\n"
              "DEX2OAT=official byte-identical\n"
              "LIBPRELOAD=official byte-identical\n"
              "OLD_LSPLANT_PAYLOAD=4 rebuilt liblspd.so\n"
              "JAVA_PAYLOAD=rebuilt framework/lspd.dex\n"
          )
          PY

          for so in finalcmp/lib/*/liblspd.so; do
            readelf -h "$so" >/dev/null
            readelf -Ws "$so" | grep -q 'zygisk_module_entry'
            readelf -Ws "$so" | grep -q 'zygisk_companion_entry'
          done

          # The old-LSPlant payload must not accidentally contain any prior diagnostic branch markers.
          if strings finalcmp/lib/arm64-v8a/liblspd.so \
              | grep -E 'LSPLANT-(CL2|COMPAT1|COMPAT2|COMPAT3|COMPAT4)|PAIRIP|Niantic|Ingress'; then
            echo "unexpected diagnostic/app-specific strings in ARM64 liblspd.so" >&2
            exit 1
          fi

          # The rebuilt framework dex must contain our generic compatibility evidence markers.
          strings finalcmp/framework/lspd.dex \
            | grep -Fq 'LSPOSED-P4R1: APP_COMPONENT_FACTORY_UNAVAILABLE_CONTINUE=1'
          strings finalcmp/framework/lspd.dex \
            | grep -Fq 'LSPOSED-P4R1: LEGACY_DISPATCH_REACHED=1'
          strings finalcmp/framework/lspd.dex \
            | grep -Fq 'LSPOSED-P4R1: PACKAGE_CALLBACKS_COMPLETE=1'

      - name: Collect provenance and evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p4r1-output

          for f in \
            BASELINE_BUILD_EXIT_CODE.txt \
            P4R1_BUILD_EXIT_CODE.txt \
            baseline-build.log \
            p4r1-build.log \
            P4R1_BUILD_RELEASE.zip
          do
            [ ! -f "$f" ] || cp "$f" p4r1-output/
          done

          if [ -f "$FINAL_ZIP" ]; then
            cp "$FINAL_ZIP" p4r1-output/
          fi

          if [ -d LSP-IrenaX ]; then
            {
              echo "repo=$IRENA_REPO"
              echo "irena=$(git -C LSP-IrenaX rev-parse HEAD 2>/dev/null || true)"
              echo "expected_irena=$IRENA_COMMIT"
              echo "old_lsplant=$(git -C LSP-IrenaX/external/lsplant rev-parse HEAD 2>/dev/null || true)"
              echo "expected_old_lsplant=$OLD_LSPLANT_SHA"
              echo "dobby=$(git -C LSP-IrenaX/external/dobby rev-parse HEAD 2>/dev/null || true)"
              echo "expected_dobby=$CURRENT_DOBBY_SHA"
            } > p4r1-output/P4R1_FINAL_PROVENANCE.txt
          fi

          (
            cd p4r1-output
            find . -type f ! -name 'P4R1_EVIDENCE_SHA256SUMS.txt' -print0 \
              | sort -z | xargs -0 sha256sum > P4R1_EVIDENCE_SHA256SUMS.txt
          )

      - name: Upload P4R1 evidence and install package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irena-x-v2.0.1-7371-p4r1-old-lsplant-r1-appcomponentfactory
          path: p4r1-output/**
          if-no-files-found: error
          retention-days: 30

      - name: Final P4R1 gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          base="$(cat BASELINE_BUILD_EXIT_CODE.txt 2>/dev/null || echo 999)"
          final="$(cat P4R1_BUILD_EXIT_CODE.txt 2>/dev/null || echo 999)"

          echo "BASELINE_BUILD_EXIT_CODE=$base"
          echo "P4R1_BUILD_EXIT_CODE=$final"

          test "$base" = "0"
          test "$final" = "0"

          test -f "$FINAL_ZIP"
          test -f p4r1-output/P4R1_FINAL_PACKAGE_DIFF.txt
          test -f p4r1-output/P4R1_FINAL_PACKAGE_SHA256.txt
          test -f p4r1-output/P4R1_FINAL_SCOPE.txt

          grep -Fxq 'FINAL_FILE_COUNT=56' p4r1-output/P4R1_FINAL_SCOPE.txt
          grep -Fxq 'FINAL_CHANGED_FILES=10' p4r1-output/P4R1_FINAL_SCOPE.txt
          grep -Fxq 'SIDECARS_VALID=28/28' p4r1-output/P4R1_FINAL_SCOPE.txt

          expected=(
            "framework/lspd.dex"
            "framework/lspd.dex.sha256"
            "lib/arm64-v8a/liblspd.so"
            "lib/arm64-v8a/liblspd.so.sha256"
            "lib/armeabi-v7a/liblspd.so"
            "lib/armeabi-v7a/liblspd.so.sha256"
            "lib/x86/liblspd.so"
            "lib/x86/liblspd.so.sha256"
            "lib/x86_64/liblspd.so"
            "lib/x86_64/liblspd.so.sha256"
          )
          mapfile -t actual < p4r1-output/P4R1_FINAL_PACKAGE_DIFF.txt
          test "${#actual[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${actual[$i]}" = "${expected[$i]}"
          done

          echo "RESULT=P4R1_STATIC_FULL_PASS_OLD_LSPLANT_R1_APPCOMPONENTFACTORY_CREATED"
