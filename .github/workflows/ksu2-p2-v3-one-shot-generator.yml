name: KSU2-P2 v3 one-shot generator

on:
  push:
    paths:
      - .github/workflows/ksu2-p2-v3-one-shot-generator.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ksu2-p2-v3-one-shot-generator
  cancel-in-progress: false

jobs:
  generate:
    name: Generate exact P2-v3 from verified P2-v2
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact failed P2-v2 workflow
        shell: bash
        run: |
          set -euo pipefail
          SRC=.github/workflows/ksu2-p2-veux-5.4.274-legacy-kernelsu-source-cleanup-compact-checkpoint-v2.yml
          test -s "$SRC"
          ACTUAL_BLOB="$(git hash-object "$SRC")"
          EXPECTED_BLOB=6c5ded9a14a1ce8f5e81d3f070ec08151ea2dd75
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          echo "P2_V2_WORKFLOW_BLOB_VERIFIED=$ACTUAL_BLOB"

