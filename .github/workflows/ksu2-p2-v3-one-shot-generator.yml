          test "$(sha256sum "$RUNNER_TEMP/ksu2-p2-v3-patcher.py" | awk '{print $1}')" = "e6244fed6738c31043b6564d3919d4a5d473f7c1b5f1a214d9b42250d1d1ede5"

      - name: Generate P2-v3
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/ksu2-p2-v3-patcher.py"

      - name: Validate generated P2-v3 workflow
        shell: bash
        run: |
          set -euo pipefail
          DST=.github/workflows/ksu2-p2-veux-5.4.274-legacy-kernelsu-source-cleanup-compact-checkpoint-v3.yml
          test -s "$DST"

          ruby -e 'require "yaml"; YAML.load_file(ARGV[0]); puts "YAML_PARSE=PASS"' "$DST"

          grep -Fq 'COMPARISON=SEMANTIC_KCONFIG_MAP' "$DST"
          grep -Fq 'if: always()' "$DST"
          grep -Fq 'ksu2-p2-veux-5.4.274-compact-checkpoint-v3' "$DST"
          grep -Fq 'NON_KSU_SEMANTICALLY_IDENTICAL_KSU_NAMESPACE_REMOVED' "$DST"
          grep -Fq 'P1-P2-CONFIG-SEMANTIC.diff' "$DST"

          if grep -Fq 'P2 config differs from P1 by more than the removed disabled KSU line' "$DST"; then
            echo "ERROR: obsolete byte-oriented config gate survived in P2-v3"
            exit 1
          fi

          git diff --check -- "$DST"
          echo "P2_V3_SHA256=$(sha256sum "$DST" | awk '{print $1}')"

      - name: Upload generated P2-v3 workflow safety copy
        uses: actions/upload-artifact@v4
        with:
          name: ksu2-p2-v3-generated-workflow
          path: .github/workflows/ksu2-p2-veux-5.4.274-legacy-kernelsu-source-cleanup-compact-checkpoint-v3.yml
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Commit P2-v3 and remove one-shot generator
        shell: bash
        run: |
          set -euo pipefail
          DST=.github/workflows/ksu2-p2-veux-5.4.274-legacy-kernelsu-source-cleanup-compact-checkpoint-v3.yml
          SELF=.github/workflows/ksu2-p2-v3-one-shot-generator.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$DST"
          git rm "$SELF"
          git diff --cached --check

          STATUS="$(git status --short)"
          printf '%s\n' "$STATUS"
          test "$(printf '%s\n' "$STATUS" | wc -l | tr -d ' ')" -eq 2

          git commit -m "ksu2-p2: add v3 semantic config gate and always-on diagnostics"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Dispatch generated P2-v3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW=ksu2-p2-veux-5.4.274-legacy-kernelsu-source-cleanup-compact-checkpoint-v3.yml

          for attempt in $(seq 1 12); do
            if gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/dispatches" \
              -f ref="$GITHUB_REF_NAME"
            then
              echo "P2_V3_DISPATCH=PASS"
              exit 0
            fi
            echo "P2-v3 not dispatchable yet; retry $attempt/12"
            sleep 5
          done

          echo "ERROR: P2-v3 was committed but automatic dispatch failed"
          echo "Start P2-v3 manually from the Actions tab."
          exit 1
