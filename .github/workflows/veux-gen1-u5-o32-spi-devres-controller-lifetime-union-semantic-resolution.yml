name: VEUX GEN1 U5-O32 SPI Devres Controller Lifetime Union Semantic Resolution

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: veux-gen1-u5-o32-spi-devres-controller-lifetime-union-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

      # Immutable U5-O29 Runtime-PASS parent.
      O29_ARTIFACT_ID: '10468051467'
      O29_ARTIFACT_NAME: VEUX-GEN1-U5-O29-pinctrl-dirconn-irq-valid-mask-union-official-stable-5.4.300-5.4.302-port-audit
      O29_ARTIFACT_SHA256: 5b3d75489ecc51d57b6ea31a02b4e060a9b93ecde2e053eb8ad5ccf0eff04a91

      # Exact U5-O31 deep-audit evidence that derived the SPI union.
      O31_ARTIFACT_ID: '10484832245'
      O31_ARTIFACT_NAME: VEUX-GEN1-U5-O31-spi-devres-controller-lifetime-deep-audit
      O31_ARTIFACT_SHA256: 0747e3abe925134c39dc7dba26380af8452cc8c3f428dfbad9f8093d9cdcad44
      O31_CANDIDATE_SHA300: 134f015af7101fe2748a1aaea6447c63c5f9160914318ab0c2ebbd55b35f83bf
      O31_CANDIDATE_SHA302: ef78834f8f72b9e3e14d8b920b7131b495b85e3f510c534d52b8bf5cda71f653

      # Frozen P13 reconstruction pins.
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      EXPECTED_VENDOR_KERNEL_VERSION: 5.4.268
      EXPECTED_OUTER_TREE: 19b68131d7a3955085f60c4fb8cf64442427af0c
      RESTORE_ARTIFACT_ID: '9989363798'
      RESTORE_ARTIFACT_NAME: clean-gen1-p6v11-v6-full-susfs-outer-integration-p7-test-boot-34031837372
      EXPECTED_P5I_COMMIT: f353a9475e40ca866d570c1d0ef55e24cf6556e4
      EXPECTED_P5I_TREE: a947c1f2891c796a08373fc755e29b23139dc761
      EXPECTED_RESUKISU_BASE_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_RESUKISU_BASE_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      EXPECTED_IMPORT_PATCH_SHA256: 902e427888714266d9771908cd593191a478cd32ae7a895c77b76c976939c76f
      EXPECTED_P13_PATCH_SHA256: d56725a9d6a6dc7bf1e73a5763b894bdabb544119f4c75df5f437ccd4ff29a52
      EXPECTED_P12_EXEC_SHA256: fa3b73421f35d6220fb9e03e112a9509b76c04933af2353c9a8c65d6fb6bd6a9
      EXPECTED_P12_CONTRACT_SHA256: b6d1875f6a79231465bc78df6484f2856a427259998eb93ba9fd2597cb45ca53
      EXPECTED_P12_SUSFS_C_SHA256: e430d573ba5875a55d1ca70ba1b304e4b6727bbc42b8c3ac16f2c175b29a59c1
      EXPECTED_P12_SUSFS_H_SHA256: 3c5fb1bcc28a70c82ee5cfe0a7375bb8e7babd26618ce9b451e598fa31aa3b6e
      EXPECTED_P12_SUSFS_DEF_SHA256: b16108a5fcd4cdd7203d9f084c2154da708ab3ae6bed17109e4ec63f04ff0f68
      EXPECTED_P13_TREE: 27f712099ca93c93f7b6db8884cc1f3b6e61ae0f
      EXPECTED_P13_KERNEL_VERSION: 5.4.274

      # Stable target identities inherited unchanged from O29.
      STABLE_COMMIT_300: 86b57fd7c54e976bdcee78ead678932821a68e2d
      STABLE_COMMIT_302: 9e3157c56ec7917e6a80ea53a8bd752e0037f2cb

      # SPI provenance already proven by O31.
      SPI_DEVM_UPSTREAM_COMMIT: 5e844cc37a5cbaa460e68f9a989d321d63088a89
      SPI_ADD_LOCK_UPSTREAM_COMMIT: 6098475d4cb48d821bdf453c61118c56e26294f0
      SPI_ADD_LOCK_UAF_FIX_COMMIT: 6c53b45c71b4920b5e62f0ea8079a1da382b9434

    steps:
      - name: Initialize U5-O32 comprehensive evidence workspace
        shell: bash
        run: |
          set -euo pipefail

          O29_DIR="$RUNNER_TEMP/u5-o32-o29-parent"
          O31_DIR="$RUNNER_TEMP/u5-o32-o31-audit"
          RESTORE_DIR_ROOT="$RUNNER_TEMP/u5-o32-restore"
          P13_DIR="$GITHUB_WORKSPACE/u5-o32-p13"
          CAND300_DIR="$GITHUB_WORKSPACE/u5-o32-candidate-300"
          CAND302_DIR="$GITHUB_WORKSPACE/u5-o32-candidate-302"
          AUDIT_DIR="$GITHUB_WORKSPACE/u5-o32-evidence"

          rm -rf "$O29_DIR" "$O31_DIR" "$RESTORE_DIR_ROOT" "$P13_DIR" \
                 "$CAND300_DIR" "$CAND302_DIR" "$AUDIT_DIR"
          mkdir -p "$O29_DIR" "$O31_DIR" "$RESTORE_DIR_ROOT" "$AUDIT_DIR"

          {
            echo "O29_DIR=$O29_DIR"
            echo "O31_DIR=$O31_DIR"
            echo "RESTORE_DIR_ROOT=$RESTORE_DIR_ROOT"
            echo "P13_DIR=$P13_DIR"
            echo "CAND300_DIR=$CAND300_DIR"
            echo "CAND302_DIR=$CAND302_DIR"
            echo "AUDIT_DIR=$AUDIT_DIR"
          } >> "$GITHUB_ENV"

          cat > "$AUDIT_DIR/32-O32-PLAN.txt" <<EOF
          U5-O32 SPI DEVRES / CONTROLLER-LIFETIME UNION SEMANTIC RESOLUTION

          Runtime source parent:
            U5-O29 artifact ID: $O29_ARTIFACT_ID
            U5-O29 SHA-256: $O29_ARTIFACT_SHA256

          Semantic evidence parent:
            U5-O31 artifact ID: $O31_ARTIFACT_ID
            U5-O31 SHA-256: $O31_ARTIFACT_SHA256

          Exactly one new logical source resolution:
            drivers/spi/spi.c

          Required union:
          - keep P13 devres_find() managed-controller detection;
          - keep official Stable per-controller ctlr->add_lock conversion;
          - keep official Stable final put_device() ordering after IDR cleanup;
          - keep official Stable final put_device() ordering after add_lock unlock;
          - do not reintroduce the incompatible devm_allocated predicate into P13's devres model.

          Incremental Runtime-PASS rule:
          - reproduce exact frozen P13;
          - preserve the exact O29 partial port patch byte-for-byte except for one appended SPI path patch;
          - apply the resulting complete partial port patch to exact P13 for both targets;
          - prove drivers/spi/spi.c equals the independently derived O31 candidate;
          - reduce only the SPI conflict: 10->9 / 16->15 and 30->29 / 41->40;
          - all other O29 conflicts remain unresolved and unchanged.

          Artifact policy:
          - restore full O29 evidence instead of a thin report-only artifact;
          - carry the complete O31 deep-audit evidence as lineage;
          - require comprehensive evidence size/file-count gates;
          - one final artifact only.

          No kernel build. No AK3. No flash. No Device PASS claim.
          EOF

      - name: Download verify and restore full O29 plus O31 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          safe_extract() {
            local archive="$1"
            local destination="$2"
            python3 - "$archive" "$destination" <<'PY'
          from pathlib import Path
          import sys, zipfile
          archive, destination = sys.argv[1:]
          root = Path(destination).resolve()
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  out = (root / info.filename).resolve()
                  if out != root and root not in out.parents:
                      raise SystemExit(f'unsafe archive member: {info.filename}')
              zf.extractall(root)
          PY
          }

          fetch_artifact() {
            local id="$1"
            local expected_name="$2"
            local expected_sha="$3"
            local prefix="$4"
            local destination="$5"
            local meta="$RUNNER_TEMP/${prefix}-meta.json"
            local zip="$RUNNER_TEMP/${prefix}.zip"

            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" \
              -o "$meta"

            python3 - "$meta" "$id" "$expected_name" "$expected_sha" <<'PY'
          import json, sys
          path, expected_id, expected_name, expected_sha = sys.argv[1:]
          with open(path, encoding='utf-8') as fh:
              meta = json.load(fh)
          assert str(meta.get('id')) == expected_id, (meta.get('id'), expected_id)
          assert meta.get('name') == expected_name, (meta.get('name'), expected_name)
          assert meta.get('expired') is False, 'artifact expired'
          digest = meta.get('digest')
          if digest not in (None, '', 'sha256:' + expected_sha):
              raise AssertionError((digest, expected_sha))
          print(f"ARTIFACT_METADATA_PASS={expected_id}")
          PY

            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "$zip"

            echo "$expected_sha  $zip" | sha256sum -c -
            safe_extract "$zip" "$destination"
            cp "$meta" "$RUNNER_TEMP/${prefix}-verified-meta.json"
            sha256sum "$zip" > "$RUNNER_TEMP/${prefix}-verified-zip-sha256.txt"
          }

          fetch_artifact "$O29_ARTIFACT_ID" "$O29_ARTIFACT_NAME" "$O29_ARTIFACT_SHA256" o29 "$O29_DIR"
          fetch_artifact "$O31_ARTIFACT_ID" "$O31_ARTIFACT_NAME" "$O31_ARTIFACT_SHA256" o31 "$O31_DIR"

          test -f "$O29_DIR/SHA256SUMS.txt"
          test -f "$O31_DIR/SHA256SUMS.txt"

          (
            cd "$O29_DIR"
            sha256sum -c SHA256SUMS.txt
          ) | tee "$RUNNER_TEMP/o29-internal-sha-check.txt"
          test "$(grep -c 'OK$' "$RUNNER_TEMP/o29-internal-sha-check.txt")" -eq 219

          (
            cd "$O31_DIR"
            sha256sum -c SHA256SUMS.txt
          ) | tee "$RUNNER_TEMP/o31-internal-sha-check.txt"
          test "$(grep -c 'OK$' "$RUNNER_TEMP/o31-internal-sha-check.txt")" -eq 20

          grep -Fxq 'O31_DEEP_AUDIT_GATE=PASS' "$O31_DIR/31-O31-SUMMARY.txt"
          grep -Fxq 'O31_FINAL=AUDIT_GREEN_PASS' "$O31_DIR/99-O31-FINAL-GATE.txt"
          grep -Fxq 'CURRENT_RUNTIME_PARENT=U5-O29' "$O31_DIR/31-O31-SUMMARY.txt"
          grep -Fxq 'DERIVED_NEXT_RESOLUTION=DELAYED_DEVRES_FIND_UNION' "$O31_DIR/31-O31-SUMMARY.txt"

          # Restore the complete O29 evidence tree as the O32 evidence base.
          # This deliberately returns to the comprehensive multi-megabyte artifact model.
          cp -a "$O29_DIR/." "$AUDIT_DIR/"
          mkdir -p "$AUDIT_DIR/lineage"
          mv "$AUDIT_DIR/SHA256SUMS.txt" "$AUDIT_DIR/lineage/O29-SHA256SUMS.original.txt"
          cp "$RUNNER_TEMP/o29-internal-sha-check.txt" "$AUDIT_DIR/lineage/O29-INTERNAL-SHA256-CHECK.txt"
          cp "$RUNNER_TEMP/o31-internal-sha-check.txt" "$AUDIT_DIR/lineage/O31-INTERNAL-SHA256-CHECK.txt"
          cp "$RUNNER_TEMP/o29-verified-meta.json" "$AUDIT_DIR/lineage/O29-ARTIFACT-METADATA.json"
          cp "$RUNNER_TEMP/o31-verified-meta.json" "$AUDIT_DIR/lineage/O31-ARTIFACT-METADATA.json"
          cp "$RUNNER_TEMP/o29-verified-zip-sha256.txt" "$AUDIT_DIR/lineage/O29-ZIP-SHA256.txt"
          cp "$RUNNER_TEMP/o31-verified-zip-sha256.txt" "$AUDIT_DIR/lineage/O31-ZIP-SHA256.txt"
          mkdir -p "$AUDIT_DIR/lineage/O31-deep-audit"
          cp -a "$O31_DIR/." "$AUDIT_DIR/lineage/O31-deep-audit/"

          cat > "$AUDIT_DIR/lineage/LINEAGE-GATE.txt" <<EOF
          O29_ARTIFACT_ID=$O29_ARTIFACT_ID
          O29_ARTIFACT_SHA256=$O29_ARTIFACT_SHA256
          O29_INTERNAL_SHA256SUMS=219/219 PASS
          O31_ARTIFACT_ID=$O31_ARTIFACT_ID
          O31_ARTIFACT_SHA256=$O31_ARTIFACT_SHA256
          O31_INTERNAL_SHA256SUMS=20/20 PASS
          O31_DEEP_AUDIT_GATE=PASS
          RUNTIME_SOURCE_PARENT=U5-O29
          EOF

      - name: Reconstruct exact frozen P13 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git clone -q https://github.com/dereference23/kernel_xiaomi_sm6375.git "$P13_DIR"
          git -C "$P13_DIR" checkout -q --detach "$EXPECTED_VENDOR_SHA"
          test "$(git -C "$P13_DIR" rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
          test "$(make -s -C "$P13_DIR" kernelversion)" = "$EXPECTED_VENDOR_KERNEL_VERSION"

          restore_meta="$RUNNER_TEMP/restore-artifact-meta.json"
          restore_zip="$RUNNER_TEMP/restore-artifact.zip"

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RESTORE_ARTIFACT_ID}" \
            -o "$restore_meta"

          python3 - "$restore_meta" "$RESTORE_ARTIFACT_ID" "$RESTORE_ARTIFACT_NAME" <<'PY'
          import json, sys
          path, expected_id, expected_name = sys.argv[1:]
          with open(path, encoding='utf-8') as fh:
              meta = json.load(fh)
          assert str(meta.get('id')) == expected_id, (meta.get('id'), expected_id)
          assert meta.get('name') == expected_name, (meta.get('name'), expected_name)
          assert meta.get('expired') is False, 'restore artifact expired'
          print('RESTORE_ARTIFACT_METADATA=PASS')
          PY

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RESTORE_ARTIFACT_ID}/zip" \
            -o "$restore_zip"

          python3 - "$restore_zip" "$RESTORE_DIR_ROOT" <<'PY'
          from pathlib import Path
          import sys, zipfile
          archive, destination = sys.argv[1:]
          root = Path(destination).resolve()
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  out = (root / info.filename).resolve()
                  if out != root and root not in out.parents:
                      raise SystemExit(f'unsafe restore archive member: {info.filename}')
              zf.extractall(root)
          PY

          restore_dir="$(find "$RESTORE_DIR_ROOT" -type d -name source-restore-kit -print -quit)"
          test -n "$restore_dir"
          test -f "$restore_dir/manifest.json"
          test -f "$restore_dir/SHA256SUMS"
          echo "RESTORE_DIR=$restore_dir" >> "$GITHUB_ENV"

          (
            cd "$restore_dir"
            sha256sum -c SHA256SUMS
          ) > "$AUDIT_DIR/lineage/P13-RESTORE-SHA256-CHECK.txt"

          python3 - "$restore_dir/manifest.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              manifest = json.load(fh)
          expected = {
              'stage': 'CLEAN_GEN1_P6V11_SOURCE',
              'p5i_commit': os.environ['EXPECTED_P5I_COMMIT'],
              'p5i_tree': os.environ['EXPECTED_P5I_TREE'],
              'resukisu_head': os.environ['EXPECTED_RESUKISU_BASE_HEAD'],
              'resukisu_tree': os.environ['EXPECTED_RESUKISU_BASE_TREE'],
          }
          for key, value in expected.items():
              assert manifest.get(key) == value, (key, manifest.get(key), value)
          assert manifest.get('p6_source_tree') == os.environ['EXPECTED_OUTER_TREE'], (
              manifest.get('p6_source_tree'), os.environ['EXPECTED_OUTER_TREE'])
          print('RESTORE_MANIFEST=PASS')
          PY

          git -C "$P13_DIR" reset --hard "$EXPECTED_VENDOR_SHA"
          git -C "$P13_DIR" clean -fdx

          for p in \
            "$restore_dir/p5i/vendor-20240619-to-p5i-outer.patch" \
            "$restore_dir/p5i-to-p6-source-compat.patch" \
            "$restore_dir/p6v10-to-p6v11-full-susfs-outer.patch"; do
            test -s "$p"
            git -C "$P13_DIR" apply --check --whitespace=error --binary "$p"
            git -C "$P13_DIR" apply --index --whitespace=error --binary "$p"
          done

          test "$(git -C "$P13_DIR" write-tree)" = "$EXPECTED_OUTER_TREE"

          # O29's 05 patch is a nested ReSukiSU/KernelSU kernel+uapi delta.
          # It must never be applied to Linux's top-level kernel/ directory.
          # O29 already proved that nested contract; O32 carries that complete evidence
          # forward and only reconstructs the exact outer P13 tree needed for the port patch.
          import_patch="$O29_DIR/05-current-kernel-uapi-minus-module-filter.patch"
          p13_patch="$O29_DIR/07-P13-post-exec.patch"
          test -s "$import_patch"
          test -s "$p13_patch"
          echo "$EXPECTED_IMPORT_PATCH_SHA256  $import_patch" | sha256sum -c -
          echo "$EXPECTED_P13_PATCH_SHA256  $p13_patch" | sha256sum -c -

          # Exact P12 outer-source preconditions before the two-file P13 delta.
          test "$(sha256sum "$P13_DIR/fs/exec.c" | awk '{print $1}')" = "$EXPECTED_P12_EXEC_SHA256"
          test "$(sha256sum "$P13_DIR/include/linux/ksu_hook_contract.h" | awk '{print $1}')" = "$EXPECTED_P12_CONTRACT_SHA256"
          test "$(sha256sum "$P13_DIR/fs/susfs.c" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_C_SHA256"
          test "$(sha256sum "$P13_DIR/include/linux/susfs.h" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_H_SHA256"
          test "$(sha256sum "$P13_DIR/include/linux/susfs_def.h" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_DEF_SHA256"

          git -C "$P13_DIR" apply --check --whitespace=error --binary "$p13_patch"
          git -C "$P13_DIR" apply --index --whitespace=error --binary "$p13_patch"

          test "$(git -C "$P13_DIR" write-tree)" = "$EXPECTED_P13_TREE"
          test "$(make -s -C "$P13_DIR" kernelversion)" = "$EXPECTED_P13_KERNEL_VERSION"

          {
            echo "VENDOR_SHA=$EXPECTED_VENDOR_SHA"
            echo "P12_OUTER_TREE=$EXPECTED_OUTER_TREE"
            echo "O29_NESTED_RESUKISU_IMPORT_PATCH_SHA256=$EXPECTED_IMPORT_PATCH_SHA256"
            echo "O29_NESTED_RESUKISU_CONTRACT=INHERITED_AND_HASH_VERIFIED"
            echo "P13_OUTER_PATCH_SHA256=$EXPECTED_P13_PATCH_SHA256"
            echo "P13_TREE=$(git -C "$P13_DIR" write-tree)"
            echo "P13_KERNELVERSION=$(make -s -C "$P13_DIR" kernelversion)"
            echo "P13_OUTER_SOURCE_RECONSTRUCTION=PASS"
          } | tee "$AUDIT_DIR/lineage/P13-RECONSTRUCTION-GATE.txt"

          git -C "$P13_DIR" config user.name 'VEUX U5-O32 Audit'
          git -C "$P13_DIR" config user.email 'veux-u5-o32-audit@invalid.local'
          p13_commit="$(printf '%s\n' 'U5-O32 exact frozen P13 audit snapshot' | \
            git -C "$P13_DIR" commit-tree "$EXPECTED_P13_TREE" -p "$EXPECTED_VENDOR_SHA")"
          echo "P13_AUDIT_COMMIT=$p13_commit" >> "$GITHUB_ENV"
          echo "P13_AUDIT_COMMIT=$p13_commit" >> "$AUDIT_DIR/lineage/P13-RECONSTRUCTION-GATE.txt"

      - name: Resolve SPI conflict and update complete O29 evidence state
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import difflib
          import hashlib
          import os
          import re
          import shutil

          audit = Path(os.environ['AUDIT_DIR'])
          o31 = Path(os.environ['O31_DIR'])
          expected_candidates = {
              '5.4.300': os.environ['O31_CANDIDATE_SHA300'],
              '5.4.302': os.environ['O31_CANDIDATE_SHA302'],
          }
          old_conflicts = {'5.4.300': 10, '5.4.302': 16}
          old_hunks = {'5.4.300': 30, '5.4.302': 41}
          new_conflicts = {'5.4.300': 9, '5.4.302': 15}
          new_hunks = {'5.4.300': 29, '5.4.302': 40}
          rel = Path('drivers/spi/spi.c')
          checks: list[str] = []

          def gate(condition: bool, label: str) -> None:
              if not condition:
                  raise AssertionError(label)
              checks.append(label)

          def region(text: str, begin: str, end: str) -> str:
              start = text.index(begin)
              stop = text.index(end, start)
              return text[start:stop]

          def derive_candidate(preview: str, target: str) -> str:
              pattern = re.compile(
                  r'<<<<<<<[^\n]*\n(.*?)'
                  r'\|\|\|\|\|\|\|[^\n]*\n(.*?)'
                  r'=======\n(.*?)'
                  r'>>>>>>>[^\n]*\n',
                  re.S,
              )
              matches = list(pattern.finditer(preview))
              gate(len(matches) == 1, f'{target}: exactly one SPI diff3 conflict')
              match = matches[0]
              gate(match.group(3) == '', f'{target}: Stable removes the early release block')
              merged = preview[:match.start()] + match.group(3) + preview[match.end():]

              stable_tail = (
                  '\t/* Release the last reference on the controller if its driver\n'
                  '\t * has not yet been converted to devm_spi_alloc_master/slave().\n'
                  '\t */\n'
                  '\tif (!ctlr->devm_allocated)\n'
                  '\t\tput_device(&ctlr->dev);\n'
              )
              p13_tail = (
                  '\t/* Release the last reference on the controller if its driver\n'
                  '\t * has not yet been converted to devm_spi_alloc_master/slave().\n'
                  '\t */\n'
                  '\tif (!devres_find(ctlr->dev.parent, devm_spi_release_controller,\n'
                  '\t\t\t devm_spi_match_controller, ctlr))\n'
                  '\t\tput_device(&ctlr->dev);\n'
              )
              gate(merged.count(stable_tail) == 1, f'{target}: one delayed Stable release block')
              candidate = merged.replace(stable_tail, p13_tail, 1)
              return candidate

          def update_result(path: Path, target: str) -> None:
              text = path.read_text(encoding='utf-8')
              replacements = {
                  f'TEXT_CONFLICT={old_conflicts[target]}\n': f'TEXT_CONFLICT={new_conflicts[target]}\n',
                  f'RUNTIME_CONFLICTS={old_conflicts[target]}\n': f'RUNTIME_CONFLICTS={new_conflicts[target]}\n',
                  f'TEXT_CONFLICT_HUNKS={old_hunks[target]}\n': f'TEXT_CONFLICT_HUNKS={new_hunks[target]}\n',
                  'SEMANTIC_RESOLUTIONS=28\n': 'SEMANTIC_RESOLUTIONS=29\n',
              }
              for old, new in replacements.items():
                  gate(text.count(old) == 1, f'{target}: RESULT contains exactly one {old.strip()}')
                  text = text.replace(old, new, 1)

              marker_count = 'PLATFORM_REGISTRATION_SEMANTIC_RESOLUTION=2\n'
              gate(text.count(marker_count) == 1, f'{target}: count insertion marker unique')
              text = text.replace(
                  marker_count,
                  marker_count + 'SPI_DEVRES_CONTROLLER_LIFETIME_UNION_SEMANTIC_RESOLUTION=1\n',
                  1,
              )
              marker_yes = 'SOCK_OWNER_RVH_FREE_UNION_SEMANTIC_RESOLUTION=YES\n'
              gate(text.count(marker_yes) == 1, f'{target}: YES insertion marker unique')
              text = text.replace(
                  marker_yes,
                  marker_yes + 'SPI_DEVRES_CONTROLLER_LIFETIME_UNION_SEMANTIC_RESOLUTION=YES\n',
                  1,
              )
              path.write_text(text, encoding='utf-8', newline='\n')

          for target in ('5.4.300', '5.4.302'):
              target_dir = audit / f'target-{target}'
              conflict_dir = target_dir / 'conflicts' / rel
              gate(conflict_dir.is_dir(), f'{target}: O29 SPI conflict directory exists')

              ours_path = conflict_dir / 'OURS'
              base_path = conflict_dir / 'BASE-v5.4.274'
              theirs_path = conflict_dir / 'THEIRS-target'
              preview_path = conflict_dir / 'MERGE-PREVIEW'
              meta_path = conflict_dir / 'META.txt'
              for p in (ours_path, base_path, theirs_path, preview_path, meta_path):
                  gate(p.is_file(), f'{target}: {p.name} exists')

              ours = ours_path.read_text(encoding='utf-8')
              preview = preview_path.read_text(encoding='utf-8')
              candidate = derive_candidate(preview, target)
              candidate_sha = hashlib.sha256(candidate.encode()).hexdigest()
              gate(candidate_sha == expected_candidates[target], f'{target}: derived candidate matches O31 SHA-256')

              o31_candidate = o31 / 'candidate-union' / f'target-{target}' / rel
              gate(o31_candidate.is_file(), f'{target}: O31 candidate exists')
              gate(o31_candidate.read_text(encoding='utf-8') == candidate,
                   f'{target}: O31 candidate byte-for-byte equals independently derived O32 candidate')

              unreg = region(candidate, 'void spi_unregister_controller(struct spi_controller *ctlr)',
                             'EXPORT_SYMBOL_GPL(spi_unregister_controller);')
              gate('mutex_lock(&ctlr->add_lock);' in unreg, f'{target}: per-controller add_lock retained')
              gate('mutex_unlock(&ctlr->add_lock);' in unreg, f'{target}: per-controller add_lock unlock retained')
              gate('devres_find(ctlr->dev.parent, devm_spi_release_controller,' in unreg,
                   f'{target}: P13 devres model retained')
              gate('if (!ctlr->devm_allocated)' not in candidate,
                   f'{target}: incompatible Stable devm_allocated predicate absent')
              devres_pos = unreg.index('devres_find(ctlr->dev.parent, devm_spi_release_controller,')
              gate(unreg.index('idr_remove(&spi_master_idr, id);') < devres_pos,
                   f'{target}: final release occurs after IDR cleanup')
              gate(unreg.index('mutex_unlock(&ctlr->add_lock);') < devres_pos,
                   f'{target}: final release occurs after add_lock unlock')
              gate(unreg.count('put_device(&ctlr->dev);') == 1,
                   f'{target}: exactly one final controller put remains')

              resolved_dir = target_dir / 'resolved-evidence' / rel
              resolved_dir.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(conflict_dir), str(resolved_dir))
              (resolved_dir / 'RESOLVED-O32').write_text(candidate, encoding='utf-8', newline='\n')

              # Build exactly one incremental path patch: P13 OURS -> O32 resolved SPI.
              diff_body = ''.join(difflib.unified_diff(
                  ours.splitlines(keepends=True),
                  candidate.splitlines(keepends=True),
                  fromfile='a/drivers/spi/spi.c',
                  tofile='b/drivers/spi/spi.c',
                  n=3,
              ))
              gate(diff_body.startswith('--- a/drivers/spi/spi.c\n+++ b/drivers/spi/spi.c\n'),
                   f'{target}: SPI incremental diff headers valid')
              spi_patch = 'diff --git a/drivers/spi/spi.c b/drivers/spi/spi.c\n' + diff_body
              spi_patch_path = target_dir / 'spi-devres-controller-lifetime-union-semantic-resolution.patch'
              spi_patch_path.write_text(spi_patch, encoding='utf-8', newline='\n')

              partial_patch = target_dir / f'P13-to-{target}-AUTO-MERGED-PARTIAL.patch'
              gate(partial_patch.is_file(), f'{target}: O29 partial patch exists')
              old_patch = partial_patch.read_text(encoding='utf-8')
              gate('diff --git a/drivers/spi/spi.c b/drivers/spi/spi.c\n' not in old_patch,
                   f'{target}: O29 partial patch did not already resolve SPI')
              old_patch_sha = hashlib.sha256(old_patch.encode()).hexdigest()
              separator = '' if old_patch.endswith('\n') else '\n'
              new_patch = old_patch + separator + spi_patch
              gate(new_patch.count('diff --git a/drivers/spi/spi.c b/drivers/spi/spi.c\n') == 1,
                   f'{target}: updated partial patch contains exactly one SPI diff')
              partial_patch.write_text(new_patch, encoding='utf-8', newline='\n')
              new_patch_sha = hashlib.sha256(new_patch.encode()).hexdigest()

              runtime_path = target_dir / 'runtime-conflicts.txt'
              conflicts = runtime_path.read_text(encoding='utf-8').splitlines()
              gate(len(conflicts) == old_conflicts[target], f'{target}: O29 runtime conflict count exact')
              gate(conflicts.count(str(rel)) == 1, f'{target}: SPI appears once in O29 conflict list')
              conflicts = [x for x in conflicts if x != str(rel)]
              gate(len(conflicts) == new_conflicts[target], f'{target}: only SPI conflict removed')
              runtime_path.write_text('\n'.join(conflicts) + '\n', encoding='utf-8', newline='\n')

              class_path = target_dir / 'path-classification.tsv'
              rows = class_path.read_text(encoding='utf-8').splitlines()
              hits = 0
              for i, row in enumerate(rows):
                  cols = row.split('\t')
                  if len(cols) >= 3 and cols[1] == str(rel):
                      gate(cols[2] == 'TEXT_CONFLICT', f'{target}: SPI was TEXT_CONFLICT in O29')
                      cols[2] = 'SPI_DEVRES_CONTROLLER_LIFETIME_UNION_SEMANTIC_RESOLUTION'
                      rows[i] = '\t'.join(cols)
                      hits += 1
              gate(hits == 1, f'{target}: exactly one SPI classification row updated')
              class_path.write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')
              gate(sum(1 for row in rows[1:] if row.split('\t')[2] == 'TEXT_CONFLICT') == new_conflicts[target],
                   f'{target}: remaining TEXT_CONFLICT classifications exact')

              update_result(target_dir / 'RESULT.txt', target)

              report = target_dir / 'spi-devres-controller-lifetime-union-semantic-resolution.txt'
              report.write_text(
                  '\n'.join([
                      f'TARGET={target}',
                      'SOURCE_PATH=drivers/spi/spi.c',
                      'LOGICAL_RESOLUTION=SPI_DEVRES_CONTROLLER_LIFETIME_UNION',
                      f'O31_CANDIDATE_SHA256={candidate_sha}',
                      f'O29_PARTIAL_PATCH_SHA256_BEFORE={old_patch_sha}',
                      f'O32_PARTIAL_PATCH_SHA256_AFTER={new_patch_sha}',
                      'P13_DEVRES_FIND_MODEL=PRESERVED',
                      'STABLE_PER_CONTROLLER_ADD_LOCK=PRESERVED',
                      'STABLE_FINAL_RELEASE_AFTER_IDR=PRESERVED',
                      'STABLE_FINAL_RELEASE_AFTER_ADD_LOCK_UNLOCK=PRESERVED',
                      'DEVM_ALLOCATED_PREDICATE=NOT_REINTRODUCED',
                      f'RUNTIME_CONFLICTS_BEFORE={old_conflicts[target]}',
                      f'RUNTIME_CONFLICTS_AFTER={new_conflicts[target]}',
                      f'TEXT_CONFLICT_HUNKS_BEFORE={old_hunks[target]}',
                      f'TEXT_CONFLICT_HUNKS_AFTER={new_hunks[target]}',
                      'SOURCE_RESOLUTION=PASS',
                      '',
                  ]),
                  encoding='utf-8', newline='\n'
              )

          (audit / '32-O32-RESOLUTION-DERIVATION-GATE.txt').write_text(
              '\n'.join([
                  f'ASSERTIONS={len(checks)}',
                  'SPI_RESOLUTION_5.4.300=PASS',
                  'SPI_RESOLUTION_5.4.302=PASS',
                  'ONLY_NEW_SOURCE_RESOLVER=drivers/spi/spi.c',
                  'RESOLUTION_DERIVATION=PASS',
                  '',
              ]), encoding='utf-8', newline='\n'
          )
          print(f'O32_RESOLUTION_ASSERTIONS={len(checks)}')
          PY

      - name: Apply updated partial port patches to exact P13
        shell: bash
        run: |
          set -euo pipefail

          git -C "$P13_DIR" worktree add --detach "$CAND300_DIR" "$P13_AUDIT_COMMIT"
          git -C "$P13_DIR" worktree add --detach "$CAND302_DIR" "$P13_AUDIT_COMMIT"

          validate_target() {
            local target="$1"
            local tree="$2"
            local expected_sha="$3"
            local expected_conflicts="$4"
            local expected_hunks="$5"
            local expected_stable_commit="$6"
            local patch="$AUDIT_DIR/target-${target}/P13-to-${target}-AUTO-MERGED-PARTIAL.patch"
            local result="$AUDIT_DIR/target-${target}/RESULT.txt"
            local gate="$AUDIT_DIR/target-${target}/o32-source-application-gate.txt"

            test -s "$patch"
            test "$(grep -c '^diff --git a/drivers/spi/spi.c b/drivers/spi/spi.c$' "$patch")" -eq 1

            git -C "$tree" apply --check --whitespace=error "$patch"
            git -C "$tree" apply --index --whitespace=error "$patch"
            git -C "$tree" diff --cached --check

            test "$(make -s -C "$tree" kernelversion)" = "$target"
            test "$(sha256sum "$tree/drivers/spi/spi.c" | awk '{print $1}')" = "$expected_sha"
            test "$(wc -l < "$AUDIT_DIR/target-${target}/runtime-conflicts.txt")" -eq "$expected_conflicts"
            test "$(grep -c $'\tTEXT_CONFLICT\t' "$AUDIT_DIR/target-${target}/path-classification.tsv")" -eq "$expected_conflicts"
            test "$(find "$AUDIT_DIR/target-${target}/conflicts" -type f -name META.txt | wc -l)" -eq "$expected_conflicts"
            test ! -d "$AUDIT_DIR/target-${target}/conflicts/drivers/spi/spi.c"
            test -f "$AUDIT_DIR/target-${target}/resolved-evidence/drivers/spi/spi.c/RESOLVED-O32"
            ! grep -R -n -E '^(<<<<<<<|\|\|\|\|\|\|\||=======|>>>>>>>)' \
                "$tree/drivers/spi/spi.c"

            grep -Fxq "RUNTIME_CONFLICTS=$expected_conflicts" "$result"
            grep -Fxq "TEXT_CONFLICT_HUNKS=$expected_hunks" "$result"
            grep -Fxq 'SEMANTIC_RESOLUTIONS=29' "$result"
            grep -Fxq 'SPI_DEVRES_CONTROLLER_LIFETIME_UNION_SEMANTIC_RESOLUTION=YES' "$result"
            grep -Fxq 'KERNEL_BUILD_PERFORMED=NO' "$result"
            grep -Fxq 'DEVICE_PASS=NO' "$result"

            {
              echo "TARGET=$target"
              echo "OFFICIAL_STABLE_TARGET_COMMIT=$expected_stable_commit"
              echo "P13_AUDIT_COMMIT=$P13_AUDIT_COMMIT"
              echo "UPDATED_PARTIAL_PATCH_SHA256=$(sha256sum "$patch" | awk '{print $1}')"
              echo "APPLIED_SPI_SHA256=$(sha256sum "$tree/drivers/spi/spi.c" | awk '{print $1}')"
              echo "CANDIDATE_KERNELVERSION=$(make -s -C "$tree" kernelversion)"
              echo "CANDIDATE_INDEX_TREE=$(git -C "$tree" write-tree)"
              echo "RUNTIME_CONFLICTS=$expected_conflicts"
              echo "TEXT_CONFLICT_HUNKS=$expected_hunks"
              echo "SEMANTIC_RESOLUTIONS=29"
              echo "GIT_APPLY_CHECK=PASS"
              echo "GIT_DIFF_CHECK=PASS"
              echo "SPI_SOURCE_HASH=PASS"
              echo "SOURCE_APPLICATION_GATE=PASS"
            } > "$gate"
          }

          validate_target 5.4.300 "$CAND300_DIR" "$O31_CANDIDATE_SHA300" 9 29 "$STABLE_COMMIT_300"
          validate_target 5.4.302 "$CAND302_DIR" "$O31_CANDIDATE_SHA302" 15 40 "$STABLE_COMMIT_302"

      - name: Finalize comprehensive O32 artifact and completeness gate
        shell: bash
        run: |
          set -euo pipefail

          grep -Fxq 'SOURCE_APPLICATION_GATE=PASS' "$AUDIT_DIR/target-5.4.300/o32-source-application-gate.txt"
          grep -Fxq 'SOURCE_APPLICATION_GATE=PASS' "$AUDIT_DIR/target-5.4.302/o32-source-application-gate.txt"

          cat > "$AUDIT_DIR/32-O32-SUMMARY.txt" <<EOF
          O32_MODE=INCREMENTAL_RUNTIME_SOURCE_RESOLUTION
          SOURCE_PARENT=U5-O29
          SEMANTIC_EVIDENCE_PARENT=U5-O31
          O32_BECOMES_RUNTIME_PARENT=YES
          ONLY_NEW_SOURCE_RESOLVER=drivers/spi/spi.c
          SPI_RESOLUTION=DELAYED_DEVRES_FIND_UNION
          RUNTIME_CONFLICTS_5.4.300=9
          TEXT_CONFLICT_HUNKS_5.4.300=29
          RUNTIME_CONFLICTS_5.4.302=15
          TEXT_CONFLICT_HUNKS_5.4.302=40
          SEMANTIC_RESOLUTIONS=29
          FULL_O29_EVIDENCE_CARRIED_FORWARD=YES
          FULL_O31_DEEP_AUDIT_CARRIED_AS_LINEAGE=YES
          KERNEL_BUILD_PERFORMED=NO
          AK3_CREATED=NO
          FLASH_PERFORMED=NO
          DEVICE_PASS=NO
          O32_RUNTIME_GATE=PASS
          EOF

          # Regenerate current file list after the full parent evidence was restored and updated.
          rm -f "$AUDIT_DIR/99-FILE-LIST.txt" "$AUDIT_DIR/SHA256SUMS.txt"
          (
            cd "$AUDIT_DIR"
            find . -type f -print | LC_ALL=C sort
          ) > "$AUDIT_DIR/99-FILE-LIST.txt"

          file_count="$(find "$AUDIT_DIR" -type f | wc -l)"
          byte_count="$(du -sb "$AUDIT_DIR" | awk '{print $1}')"
          patch300_bytes="$(stat -c '%s' "$AUDIT_DIR/target-5.4.300/P13-to-5.4.300-AUTO-MERGED-PARTIAL.patch")"
          patch302_bytes="$(stat -c '%s' "$AUDIT_DIR/target-5.4.302/P13-to-5.4.302-AUTO-MERGED-PARTIAL.patch")"

          # These are completeness gates, not cosmetic padding. O29 itself had 220 files
          # and ~17.17 MiB of extracted evidence. O32 must not regress to a report-only artifact.
          test "$file_count" -ge 240
          test "$byte_count" -ge 17000000
          test "$patch300_bytes" -ge 4000000
          test "$patch302_bytes" -ge 4400000
          test "$(wc -l < "$AUDIT_DIR/lineage/O29-SHA256SUMS.original.txt")" -eq 219
          test "$(wc -l < "$AUDIT_DIR/lineage/O31-deep-audit/SHA256SUMS.txt")" -eq 20

          cat > "$AUDIT_DIR/99-O32-FINAL-GATE.txt" <<EOF
          O29_EXACT_ARTIFACT=PASS
          O29_INTERNAL_SHA256SUMS=219/219 PASS
          O31_EXACT_ARTIFACT=PASS
          O31_INTERNAL_SHA256SUMS=20/20 PASS
          O31_DEEP_AUDIT_GATE=PASS
          P13_EXACT_OUTER_SOURCE_RECONSTRUCTION=PASS
          SPI_DELAYED_DEVRES_FIND_UNION_5.4.300=PASS
          SPI_DELAYED_DEVRES_FIND_UNION_5.4.302=PASS
          UPDATED_PARTIAL_PATCH_APPLY_5.4.300=PASS
          UPDATED_PARTIAL_PATCH_APPLY_5.4.302=PASS
          RUNTIME_CONFLICTS_5.4.300=9
          TEXT_CONFLICT_HUNKS_5.4.300=29
          RUNTIME_CONFLICTS_5.4.302=15
          TEXT_CONFLICT_HUNKS_5.4.302=40
          SEMANTIC_RESOLUTIONS=29
          ONLY_NEW_SOURCE_RESOLVER=drivers/spi/spi.c
          ARTIFACT_FILE_COUNT=$file_count
          ARTIFACT_UNCOMPRESSED_BYTES=$byte_count
          PARTIAL_PATCH_5.4.300_BYTES=$patch300_bytes
          PARTIAL_PATCH_5.4.302_BYTES=$patch302_bytes
          COMPREHENSIVE_ARTIFACT_COMPLETENESS=PASS
          CURRENT_RUNTIME_PARENT=U5-O32
          KERNEL_BUILD_PERFORMED=NO
          AK3_CREATED=NO
          FLASH_PERFORMED=NO
          DEVICE_PASS=NO
          O32_FINAL=RUNTIME_GREEN_PASS
          EOF

          # Refresh file list one final time so it also lists the final gate.
          (
            cd "$AUDIT_DIR"
            find . -type f ! -name SHA256SUMS.txt -print | LC_ALL=C sort
          ) > "$AUDIT_DIR/99-FILE-LIST.txt"

          (
            cd "$AUDIT_DIR"
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          ) | tee "$RUNNER_TEMP/o32-final-sha256-check.txt"

          test "$(grep -c 'OK$' "$RUNNER_TEMP/o32-final-sha256-check.txt")" -eq \
               "$(wc -l < "$AUDIT_DIR/SHA256SUMS.txt")"

          echo "O32 comprehensive artifact files: $file_count"
          echo "O32 comprehensive artifact bytes: $byte_count"
          echo "O32_FINAL=RUNTIME_GREEN_PASS"

      - name: Upload one comprehensive U5-O32 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-GEN1-U5-O32-spi-devres-controller-lifetime-union-semantic-resolution-official-stable-5.4.300-5.4.302-port-audit
          path: ${{ env.AUDIT_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
