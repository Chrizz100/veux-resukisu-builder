    - name: 29 - Repair ksu_cred compatibility and activate SUS_PATH foundation
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V11_V2_SUS_PATH_FOUNDATION" > evidence/STAGE.txt
        cd kernel

        python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/17-P5V11V2-PRE-AUDIT.txt"
        from pathlib import Path
        import re

        hdr = Path("include/linux/susfs.h").read_text(encoding="utf-8")
        defs = Path("include/linux/susfs_def.h").read_text(encoding="utf-8")
        sus = Path("fs/susfs.c").read_text(encoding="utf-8")
        cfg = Path("KernelSU/kernel/Kconfig").read_text(encoding="utf-8")
        core = Path("KernelSU/kernel/core_hook.c").read_text(encoding="utf-8")
        ksu_h = Path("KernelSU/kernel/ksu.h").read_text(encoding="utf-8")
        namei = Path("fs/namei.c").read_text(encoding="utf-8")
        readdir = Path("fs/readdir.c").read_text(encoding="utf-8")

        extra_sig = "static void susfs_run_extra_works(struct work_struct *work)"
        assert sus.count(extra_sig) == 1
        start = sus.index(extra_sig)
        end = sus.index("\n}\n\n/* susfs_init */", start) + 2
        extra = sus[start:end]

        checks = {
            "SUS_PATH_HEADER_ADD_API":
                "void susfs_add_sus_path(void __user **user_info);" in hdr,
            "SUS_PATH_HEADER_LOOP_API":
                "void susfs_add_sus_path_loop(void __user **user_info);" in hdr,
            "SUS_PATH_SOURCE_ADD_API":
                "void susfs_add_sus_path(void __user **user_info)" in sus,
            "SUS_PATH_SOURCE_LOOP_API":
                "void susfs_add_sus_path_loop(void __user **user_info)" in sus,
            "CMD_ADD_SUS_PATH_55550":
                re.search(
                    r"^#define\s+CMD_SUSFS_ADD_SUS_PATH\s+0x55550\s*$",
                    defs, re.M
                ) is not None,
            "CMD_ADD_SUS_PATH_LOOP_55553":
                re.search(
                    r"^#define\s+CMD_SUSFS_ADD_SUS_PATH_LOOP\s+0x55553\s*$",
                    defs, re.M
                ) is not None,
            "KCONFIG_NOT_YET_PRESENT":
                "config KSU_SUSFS_SUS_PATH" not in cfg,
            "DISPATCH_NOT_YET_PRESENT":
                "case CMD_SUSFS_ADD_SUS_PATH:" not in core and
                "case CMD_SUSFS_ADD_SUS_PATH_LOOP:" not in core,
            "KSU_0_9_5_HEADER_HAS_NO_KSU_CRED":
                "ksu_cred" not in ksu_h,
            "EXTRA_WORK_HAS_SINGLE_KSU_CRED_GATE":
                extra.count("ksu_cred") == 1 and
                "\tif (!ksu_cred)\n\t\treturn;\n" in extra,
            "SUSFS_GLOBAL_KSU_CRED_REFERENCE_COUNT_ONE":
                sus.count("ksu_cred") == 1,
            "KSU_TREE_DOES_NOT_QUEUE_SUSFS_EXTRA_WORK":
                all(
                    "susfs_extra_works" not in p.read_text(encoding="utf-8", errors="ignore")
                    for p in Path("KernelSU/kernel").rglob("*")
                    if p.is_file() and p.suffix in {".c", ".h"}
                ),
            "NAMEI_LOOKUP_HOOK_ABSENT":
                "CONFIG_KSU_SUSFS_SUS_PATH" not in namei and "susfs_is_sus" not in namei,
            "READDIR_HOOK_ABSENT":
                "CONFIG_KSU_SUSFS_SUS_PATH" not in readdir and "susfs_is_sus" not in readdir,
            "ROOT_ONLY_DISPATCH_PRESENT":
                "if (from_root && ksu_handle_susfs_command(arg2, arg3))" in core,
        }

        for key, ok in checks.items():
            print(f"{key}={'PASS' if ok else 'FAIL'}")

        failed = [key for key, ok in checks.items() if not ok]
        if failed:
            raise SystemExit(
                "P5-v11-v2 prerequisite failure: " + ", ".join(failed)
            )

        print("FAILED_PREDECESSOR_RUN_ID=33955241991")
        print("FAILED_PREDECESSOR_CLASS=UNDEFINED_KSU_CRED_IN_SUSFS_EXTRA_WORKS")
        print("P5_V11_V2_PRE_ACTIVATION_AUDIT=PASS")
        PY

        python3 - <<'PY'
        from pathlib import Path

        # Official KernelSU 0.9.5 does not define/export global ksu_cred.
        # P5-v11-v2 is registration-only, and KernelSU 0.9.5 has no caller
        # queueing susfs_extra_works. Remove only the incompatible readiness
        # gate so the dormant work item can link without inventing a fake cred.
        p = Path("fs/susfs.c")
        t = p.read_text(encoding="utf-8")

        sig = "static void susfs_run_extra_works(struct work_struct *work)"
        if t.count(sig) != 1:
            raise SystemExit("susfs_run_extra_works count mismatch")

        start = t.index(sig)
        end = t.index("\n}\n\n/* susfs_init */", start) + 2
        fn = t[start:end]

        bad = "\tif (!ksu_cred)\n\t\treturn;\n"
        replacement = (
            "\t/* KernelSU 0.9.5 has no global ksu_cred; this work is not queued\n"
            "\t * by the registration-only P5-v11-v2 integration. */\n"
        )
        if fn.count(bad) != 1:
            raise SystemExit("ksu_cred gate anchor mismatch")

        fn = fn.replace(bad, replacement, 1)
        t = t[:start] + fn + t[end:]
        p.write_text(t, encoding="utf-8")

        # Kconfig: same SUS_PATH suboption intended by failed v11.
        p = Path("KernelSU/kernel/Kconfig")
        t = p.read_text(encoding="utf-8")

        if "config KSU_SUSFS_SUS_PATH" in t:
            raise SystemExit("SUS_PATH config unexpectedly already present")

        anchor = "config KSU_SUSFS_SUS_KSTAT\n"
        if t.count(anchor) != 1:
            raise SystemExit("Kconfig KSTAT anchor mismatch")

        block = (
            "config KSU_SUSFS_SUS_PATH\n"
            "\tbool \"SUSFS: suspicious path registration foundation\"\n"
            "\tdepends on KSU_SUSFS\n"
            "\tdefault n\n"
            "\thelp\n"
            "\t  Compile SUS_PATH registration/list management and expose its\n"
            "\t  root-only commands. P5-v11-v2 intentionally does not hook namei,\n"
            "\t  readdir, mount or namespace lookup behavior yet.\n"
            "\n"
        )
        t = t.replace(anchor, block + anchor, 1)
        p.write_text(t, encoding="utf-8")

        # Same two root-only SUS_PATH commands as v11.
        p = Path("KernelSU/kernel/core_hook.c")
        t = p.read_text(encoding="utf-8")

        anchor = (
            "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
            "\tcase CMD_SUSFS_ADD_SUS_KSTAT:\n"
        )
        if t.count(anchor) != 1:
            raise SystemExit("core_hook KSTAT dispatcher anchor mismatch")

        addition = (
            "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
            "\tcase CMD_SUSFS_ADD_SUS_PATH:\n"
            "\t\tsusfs_add_sus_path(&user_info);\n"
            "\t\treturn true;\n"
            "\tcase CMD_SUSFS_ADD_SUS_PATH_LOOP:\n"
            "\t\tsusfs_add_sus_path_loop(&user_info);\n"
            "\t\treturn true;\n"
            "#endif\n"
        )
        t = t.replace(anchor, addition + anchor, 1)
        p.write_text(t, encoding="utf-8")
        PY

        git diff --check -- fs/susfs.c
        git -C KernelSU diff --check -- kernel/Kconfig kernel/core_hook.c

        python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/17-P5V11V2-SOURCE-AUDIT.txt"
        from pathlib import Path
        import re

        sus = Path("fs/susfs.c").read_text(encoding="utf-8")
        cfg = Path("KernelSU/kernel/Kconfig").read_text(encoding="utf-8")
        core = Path("KernelSU/kernel/core_hook.c").read_text(encoding="utf-8")
        namei = Path("fs/namei.c").read_text(encoding="utf-8")
        readdir = Path("fs/readdir.c").read_text(encoding="utf-8")

        assert "ksu_cred" not in sus
        assert cfg.count("config KSU_SUSFS_SUS_PATH") == 1
        assert len(re.findall(
            r"^config KSU_SUSFS_[A-Z0-9_]+$", cfg, re.M
        )) == 4

        dstart = core.index("static bool ksu_handle_susfs_command")
        dend = core.index("int ksu_handle_prctl", dstart)
        dispatch = core[dstart:dend]
        cases = set(re.findall(r"case (CMD_SUSFS_[A-Z0-9_]+):", dispatch))

        expected = {
