              '#ifdef CONFIG_KSU_SUSFS\n'
              '\tputname(ksu_filename);\n'
              '#endif\n'
              '\treturn error;\n'
              '}\n'
              'EXPORT_SYMBOL(vfs_statx);\n'
          )
          if t.count(old_out) != 1:
              raise SystemExit("fs/stat.c out anchor mismatch")
          t = t.replace(old_out, new_out, 1)

          p.write_text(t, encoding="utf-8")
          PY

