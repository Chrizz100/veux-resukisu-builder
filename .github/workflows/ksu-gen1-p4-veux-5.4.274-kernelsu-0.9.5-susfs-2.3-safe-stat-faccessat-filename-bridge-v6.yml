      - name: 13 - Prove P4 lifetime, type and scope invariants
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P4_SCOPE_GATE" > evidence/STAGE.txt
          cd kernel

          python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/09-P4-INVARIANTS.txt"
          from pathlib import Path

          stat = Path("fs/stat.c").read_text(encoding="utf-8")
          openc = Path("fs/open.c").read_text(encoding="utf-8")
          su = Path("KernelSU/kernel/sucompat.c").read_text(encoding="utf-8")

          def extract(text, signature):
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f"missing: {signature}")
              brace = text.find("{", start)
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1]
              raise SystemExit(f"unterminated: {signature}")

          s = extract(stat, "int vfs_statx(int dfd")
          f = extract(openc, "long do_faccessat(int dfd")

          checks = {
              "STAT_STRUCT_FILENAME_PROTO": "struct filename **filename" in stat,
              "FACCESS_STRUCT_FILENAME_PROTO": "struct filename **filename" in openc,
              "STAT_GETNAME_FLAGS": "ksu_filename = getname_flags(filename," in s,
              "FACCESS_GETNAME_FLAGS": "ksu_filename = getname_flags(filename, 0, NULL);" in f,
              "STAT_HANDLER_DOUBLE_PTR": "ksu_handle_stat(&dfd, &ksu_filename, &flags);" in s,
              "FACCESS_HANDLER_DOUBLE_PTR": "ksu_handle_faccessat(&dfd, &ksu_filename, &mode, NULL);" in f,
              "STAT_LOOKUP_REF": "ksu_filename->refcnt++;" in s,
              "FACCESS_LOOKUP_REF": "ksu_filename->refcnt++;" in f,
              "STAT_FILENAME_LOOKUP": "filename_lookup(dfd, ksu_filename, lookup_flags, &path, NULL);" in s,
              "FACCESS_FILENAME_LOOKUP": "filename_lookup(dfd, ksu_filename, lookup_flags, &path, NULL);" in f,
              "STAT_OWNER_PUTS": s.count("putname(ksu_filename);") == 2,
              "FACCESS_OWNER_PUTS": f.count("putname(ksu_filename);") == 3,
              "STAT_RAW_CAST_ABSENT": "(struct filename **)&filename" not in s,
              "FACCESS_RAW_CAST_ABSENT": "(struct filename **)&filename" not in f,
              "KSU_RAW_CAST_ABSENT": "(struct filename **)&filename" not in su,
          }

          for k, ok in checks.items():
              print(f"{k}={'PASS' if ok else 'FAIL'}")
          failed = [k for k, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("P4 invariant failure: " + ", ".join(failed))

          print("OWNER_REF_HELD_ACROSS_RETRY=YES")
          print("ONE_LOOKUP_REF_ADDED_PER_ATTEMPT=YES")
          print("RAW_USER_POINTER_REINTERPRET_CAST=NO")
          print("P4_FILENAME_BRIDGE_INVARIANTS=PASS")
          PY

          mapfile -t outer_changed < <(
            git diff --name-only "$EXPECTED_P2_OUTER_COMMIT" -- \
              | sed '/^$/d' | LC_ALL=C sort -u
          )
          printf '%s\n' "${outer_changed[@]}" > "$GITHUB_WORKSPACE/evidence/09-P4-OUTER-CHANGED.txt"
          cat > "$RUNNER_TEMP/p4-outer-expected.txt" <<'EOF'
          fs/open.c
          fs/stat.c
          fs/susfs.c
          EOF
          printf '%s\n' "${outer_changed[@]}" | diff -u "$RUNNER_TEMP/p4-outer-expected.txt" -

          mapfile -t ksu_changed < <(
            git -C KernelSU diff --name-only "$KSU_COMMIT" -- \
              | sed '/^$/d' | LC_ALL=C sort -u
          )
          printf '%s\n' "${ksu_changed[@]}" > "$GITHUB_WORKSPACE/evidence/09-P4-KSU-CHANGED.txt"
          cat > "$RUNNER_TEMP/p4-ksu-expected.txt" <<'EOF'
          kernel/Kconfig
          kernel/ksu.c
          kernel/selinux/selinux.c
          kernel/selinux/selinux.h
          kernel/sucompat.c
          EOF
          printf '%s\n' "${ksu_changed[@]}" | diff -u "$RUNNER_TEMP/p4-ksu-expected.txt" -

          for forbidden in \
            fs/namei.c \
            fs/namespace.c \
            fs/proc/task_mmu.c \
            fs/proc/base.c \
            fs/proc/fd.c \
            fs/proc_namespace.c \
            kernel/reboot.c
          do
            ! git diff --name-only "$EXPECTED_P2_OUTER_COMMIT" -- | grep -Fxq "$forbidden"
          done

          test "$(grep -Ec '^config KSU_SUSFS$' KernelSU/kernel/Kconfig)" -eq 1
          test "$(grep -Ec '^config KSU_SUSFS_' KernelSU/kernel/Kconfig)" -eq 0

          {
            echo "P4_OUTER_SCOPE=EXACT"
            echo "P4_KERNELSU_SCOPE=EXACT"
            echo "P4_NAMEI_CHANGED=NO"
            echo "P4_PROC_CHANGED=NO"
            echo "P4_NAMESPACE_CHANGED=NO"
            echo "P4_OPEN_REDIRECT_HOOKS_CHANGED=NO"
            echo "P4_SUSFS_FEATURE_SUBOPTIONS_INTRODUCED=0"
            echo "P4_SCOPE_GATE=PASS"
          } > "$GITHUB_WORKSPACE/evidence/09-P4-SCOPE.txt"

