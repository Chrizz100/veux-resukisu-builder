          if t.count(old_lookup) != 1:
              raise SystemExit("fs/stat.c lookup anchor mismatch")
          t = t.replace(old_lookup, new_lookup, 1)

          old_out = 'out:\n\treturn error;\n}\nEXPORT_SYMBOL(vfs_statx);\n'
          new_out = (
