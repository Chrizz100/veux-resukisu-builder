          new_proto = (
              '#ifdef CONFIG_KSU\n'
              '#ifdef CONFIG_KSU_SUSFS\n'
              'extern int ksu_handle_stat(int *dfd, struct filename **filename, int *flags);\n'
              '#else\n'
              'extern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n'
              '\t\t\t   int *flags);\n'
              '#endif\n'
              '#endif\n'
          )
          t = old_proto.sub(new_proto, t, count=1)

          old_decl = (
              '\tstruct path path;\n'
              '\tint error = -EINVAL;\n'
              '\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;\n\n'
              '#ifdef CONFIG_KSU\n'
              '\tksu_handle_stat(&dfd, &filename, &flags);\n'
              '#endif\n\n'
              '\tif ((flags & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |\n'
              '\t\t       AT_EMPTY_PATH | KSTAT_QUERY_FLAGS)) != 0)\n'
              '\t\treturn -EINVAL;\n'
          )
          new_decl = (
              '\tstruct path path;\n'
              '\tint error = -EINVAL;\n'
              '\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;\n'
              '#ifdef CONFIG_KSU_SUSFS\n'
              '\tstruct filename *ksu_filename;\n'
              '#endif\n\n'
              '#ifdef CONFIG_KSU_SUSFS\n'
              '\tksu_filename = getname_flags(filename,\n'
              '\t\t\t\t     (flags & AT_EMPTY_PATH) ? LOOKUP_EMPTY : 0,\n'
              '\t\t\t\t     NULL);\n'
              '\tif (IS_ERR(ksu_filename))\n'
              '\t\treturn PTR_ERR(ksu_filename);\n'
              '\tksu_handle_stat(&dfd, &ksu_filename, &flags);\n'
              '#elif defined(CONFIG_KSU)\n'
              '\tksu_handle_stat(&dfd, &filename, &flags);\n'
              '#endif\n\n'
              '\tif ((flags & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |\n'
              '\t\t       AT_EMPTY_PATH | KSTAT_QUERY_FLAGS)) != 0) {\n'
              '#ifdef CONFIG_KSU_SUSFS\n'
              '\t\tputname(ksu_filename);\n'
              '#endif\n'
              '\t\treturn -EINVAL;\n'
              '\t}\n'
          )
          if t.count(old_decl) != 1:
