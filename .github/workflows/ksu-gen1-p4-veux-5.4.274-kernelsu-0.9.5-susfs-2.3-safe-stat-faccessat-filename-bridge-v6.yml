        run: |
          set -euo pipefail
          echo "STAGE=P4_IMAGE_DTBS" > evidence/STAGE.txt
          cd kernel

          set +e
          make -j"$(nproc)" O=out-p4 ARCH=arm64 LLVM=1 KCFLAGS="$KCFLAGS" Image dtbs \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/13-P4-IMAGE-DTBS-COMPILE.log"
          rc=${PIPESTATUS[0]}
          set -e

          {
            echo "P4_IMAGE_DTBS_COMPILE_EXIT_CODE=$rc"
            if [ "$rc" -eq 0 ]; then
              echo "P4_IMAGE_DTBS_COMPILE=PASS"
            else
              echo "P4_IMAGE_DTBS_COMPILE=FAIL"
            fi
          } > "$GITHUB_WORKSPACE/evidence/13-P4-IMAGE-DTBS-COMPILE.txt"

          test "$rc" -eq 0

          image=out-p4/arch/arm64/boot/Image
          dtb=out-p4/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb
          test -s "$image"
          test -s "$dtb"
          test -s out-p4/System.map
          test -s out-p4/vmlinux

          cp "$image" "$GITHUB_WORKSPACE/build-artifacts/Image"
          cp "$dtb" "$GITHUB_WORKSPACE/build-artifacts/veux.dtb"
          cp out-p4/.config "$GITHUB_WORKSPACE/build-artifacts/config"
          cp out-p4/System.map "$GITHUB_WORKSPACE/build-artifacts/System.map"

          {
            echo "KERNEL_VERSION=$(make -s kernelversion)"
            echo "IMAGE_BYTES=$(stat -c '%s' "$image")"
            echo "IMAGE_SHA256=$(sha256sum "$image" | awk '{print $1}')"
            echo "VEUX_DTB_BYTES=$(stat -c '%s' "$dtb")"
            echo "VEUX_DTB_SHA256=$(sha256sum "$dtb" | awk '{print $1}')"
            echo "VMLINUX_SHA256=$(sha256sum out-p4/vmlinux | awk '{print $1}')"
            echo "SYSTEM_MAP_SHA256=$(sha256sum out-p4/System.map | awk '{print $1}')"
            echo "CONFIG_SHA256=$(sha256sum out-p4/.config | awk '{print $1}')"
            echo "P4_IMAGE_DTBS_BUILD=PASS"
          } > "$GITHUB_WORKSPACE/evidence/13-P4-BUILD-IDENTITY.txt"

      - name: 18 - Audit linked P4 boundary and keep invasive SUSFS features absent
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P4_LINK_AUDIT" > evidence/STAGE.txt
          cd kernel

          map=out-p4/System.map

          for sym in \
            kernelsu_init \
            ksu_handle_execveat \
            ksu_handle_faccessat \
            ksu_handle_stat \
            susfs_init \
            susfs_show_version \
            susfs_get_enabled_features \
            susfs_is_current_ksu_domain
          do
            grep -Eq "[[:space:]]${sym}$" "$map"
          done

          : > "$GITHUB_WORKSPACE/evidence/14-UNEXPECTED-FEATURE-SYMBOLS.txt"
          for sym in \
            susfs_add_sus_path \
            susfs_add_sus_path_loop \
            susfs_add_sus_kstat \
            susfs_update_sus_kstat \
            susfs_set_uname \
            susfs_add_open_redirect \
            susfs_open_redirect_spoof_do_sys_openat \
            susfs_add_sus_map
          do
            if grep -Eq "[[:space:]]${sym}$" "$map"; then
              echo "$sym" >> "$GITHUB_WORKSPACE/evidence/14-UNEXPECTED-FEATURE-SYMBOLS.txt"
            fi
          done
          test ! -s "$GITHUB_WORKSPACE/evidence/14-UNEXPECTED-FEATURE-SYMBOLS.txt"

          {
            echo "OFFICIAL_KSU_0_9_5_LINKED=YES"
            echo "SUSFS_CORE_LINKED=YES"
            echo "P4_STAT_FACCESSAT_FILENAME_BRIDGE_COMPILED=YES"
            echo "SUSFS_FEATURE_SUBOPTION_SYMBOLS_LINKED=0"
            echo "OPEN_REDIRECT_ACTIVE=NO"
            echo "PROC_MAPS_ACTIVE=NO"
            echo "P4_LINKED_BOUNDARY=PASS"
          } > "$GITHUB_WORKSPACE/evidence/14-P4-LINKED-BOUNDARY.txt"

      - name: 19 - Create P4 restore kit and provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P4_RESTORE_KIT" > evidence/STAGE.txt
          cd kernel

          git diff --binary "$EXPECTED_P2_OUTER_COMMIT" -- fs/open.c fs/stat.c \
            > "$GITHUB_WORKSPACE/restore-kit/p3-to-p4-outer-safe-filename-bridge.patch"

          git -C KernelSU diff --binary "$KSU_COMMIT" -- kernel/sucompat.c \
            > "$GITHUB_WORKSPACE/restore-kit/p3-to-p4-kernelsu-sucompat-filename-bridge.patch"

          git diff --binary "$EXPECTED_P0_MERGE_COMMIT" -- \
            > "$GITHUB_WORKSPACE/restore-kit/p0-to-p4-outer-full.patch"
          git -C KernelSU diff --binary "$KSU_COMMIT" -- \
            > "$GITHUB_WORKSPACE/restore-kit/p4-kernelsu-0.9.5-full-bridge.patch"

          for f in \
            p3-to-p4-outer-safe-filename-bridge.patch \
            p3-to-p4-kernelsu-sucompat-filename-bridge.patch \
            p0-to-p4-outer-full.patch \
            p4-kernelsu-0.9.5-full-bridge.patch
          do
            test -s "$GITHUB_WORKSPACE/restore-kit/$f"
          done

          cp "$GITHUB_WORKSPACE/evidence/05-FILENAME-LIFETIME-AUDIT.txt" \
            "$GITHUB_WORKSPACE/restore-kit/FILENAME-LIFETIME-CONTRACT.txt"
          cp "$GITHUB_WORKSPACE/evidence/09-P4-INVARIANTS.txt" \
            "$GITHUB_WORKSPACE/restore-kit/P4-FILENAME-BRIDGE-INVARIANTS.txt"

          image_sha="$(sha256sum out-p4/arch/arm64/boot/Image | awk '{print $1}')"
          dtb_sha="$(sha256sum out-p4/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb | awk '{print $1}')"
          config_sha="$(sha256sum out-p4/.config | awk '{print $1}')"

          python3 - <<PY
          import json
          from pathlib import Path

          m = {
            "stage": "KSU-GEN1-P4-v6",
            "device": "VEUX",
            "kernel_version": "$TARGET_VERSION",
            "parent_p3_pass_run_id": "$P3_PASS_RUN_ID",
            "p2_outer_commit": "$EXPECTED_P2_OUTER_COMMIT",
            "p2_outer_tree": "$EXPECTED_P2_OUTER_TREE",
            "kernelsu_head": "$KSU_COMMIT",
            "kernelsu_version": "$KSU_EXPECTED_VERSION",
            "susfs_source_head": "$SUSFS_SOURCE_COMMIT",
            "susfs_version": "$SUSFS_EXPECTED_VERSION",
            "config_ksu_susfs": True,
            "susfs_feature_suboptions_enabled": 0,
            "stat_faccessat_struct_filename_bridge": True,
            "raw_user_pointer_reinterpret_cast": False,
            "filename_owner_ref_across_retry": True,
            "filename_lookup_extra_ref_per_attempt": True,
            "namei_changed": False,
            "proc_changed": False,
            "namespace_changed": False,
            "open_redirect_active": False,
            "user_command_dispatch_integrated": False,
            "resukisu_integrated": False,
            "kernel_build_performed": True,
            "image_sha256": "$image_sha",
            "veux_dtb_sha256": "$dtb_sha",
            "config_sha256": "$config_sha",
            "boot_image_created": False,
            "device_accessed": False,
            "flashing_performed": False,
            "next_if_pass": "P5 controlled remaining SUSFS hooks/API integration"
          }
          Path("$GITHUB_WORKSPACE/restore-kit/manifest.json").write_text(
              json.dumps(m, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          cat > "$GITHUB_WORKSPACE/restore-kit/RESTORE-INSTRUCTIONS.txt" <<EOF
          KSU GEN1 P4 v6 deterministic recovery

          Parent checkpoint:
          - P3 PASS run: $P3_PASS_RUN_ID
          - P2 commit: $EXPECTED_P2_OUTER_COMMIT
          - P2 tree: $EXPECTED_P2_OUTER_TREE
          - KernelSU: $KSU_COMMIT

          Incremental P3 -> P4:
          1. Restore exact P3 using its accepted restore kit.
          2. Apply p3-to-p4-outer-safe-filename-bridge.patch to the outer kernel tree.
          3. Apply p3-to-p4-kernelsu-sucompat-filename-bridge.patch inside KernelSU.
          4. Resolve config with CONFIG_KSU=y and CONFIG_KSU_SUSFS=y.
          5. Keep all CONFIG_KSU_SUSFS_* feature sub-options disabled.

          P4 is a compile checkpoint only. No boot/device/flash validation exists here.
          EOF

          {
            echo "PARENT_P3_RUN=$P3_PASS_RUN_ID"
            echo "P4_IMAGE_SHA256=$image_sha"
            echo "P4_DTB_SHA256=$dtb_sha"
            echo "P4_CONFIG_SHA256=$config_sha"
            echo "P4_SAFE_FILENAME_BRIDGE=PASS"
            echo "NEXT_IF_PASS=P5_CONTROLLED_REMAINING_SUSFS_HOOKS_API_INTEGRATION"
          } > "$GITHUB_WORKSPACE/evidence/15-P4-PROVENANCE.txt"

      - name: 20 - Close P4 technical status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo "STAGE=FINAL_STATUS" > evidence/STAGE.txt

          if [ "${{ job.status }}" = "success" ] \
            && grep -Fxq 'P4_SAFE_FILENAME_BRIDGE=PASS' evidence/15-P4-PROVENANCE.txt 2>/dev/null; then
            technical_pass=YES
            checkpoint=KSU-GEN1-P4-SAFE-STAT-FACCESSAT-FILENAME-BRIDGE-PASS
            build_performed=YES
          else
            technical_pass=NO
            checkpoint=KSU-GEN1-P4-FAILED
            if grep -Fxq 'P4_IMAGE_DTBS_BUILD=PASS' evidence/13-P4-BUILD-IDENTITY.txt 2>/dev/null; then
              build_performed=YES
            else
              build_performed=NO
            fi
          fi

          {
            echo "JOB_STATUS_AT_TECHNICAL_CLOSE=${{ job.status }}"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "TECHNICAL_PASS=$technical_pass"
            echo "CHECKPOINT=$checkpoint"
            echo "PARENT_P3_RUN_ID=$P3_PASS_RUN_ID"
            echo "P4_V1_FAILED_RUN_ID=$P4_V1_FAILED_RUN_ID"
            echo "P4_V2_FAILED_RUN_ID=$P4_V2_FAILED_RUN_ID"
            echo "P4_V3_FAILED_RUN_ID=$P4_V3_FAILED_RUN_ID"
            echo "P4_V4_FAILED_RUN_ID=$P4_V4_FAILED_RUN_ID"
            echo "P4_V5_FAILED_RUN_ID=$P4_V5_FAILED_RUN_ID"
            echo "P4_V6_FIX=BUILD_GENHEADERS_SUBDIRECTORY_TARGET_THEN_RUN_GENERATOR"
            echo "P4_V6_SOURCE_INTEGRATION_CHANGED_FROM_V5=NO"
            echo "CONFIG_KSU_SUSFS_TARGET=YES"
            echo "SUSFS_FEATURE_SUBOPTIONS_ENABLED=0"
            echo "STAT_FACCESSAT_STRUCT_FILENAME_BRIDGE=YES"
            echo "RAW_USER_POINTER_REINTERPRET_CAST=NO"
            echo "OPEN_REDIRECT_ACTIVE=NO"
            echo "NAMEI_CHANGED=NO"
            echo "PROC_CHANGED=NO"
            echo "USER_COMMAND_DISPATCH=NO"
            echo "KERNEL_BUILD_PERFORMED=$build_performed"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } > evidence/98-FINAL-STATUS.txt

      - name: 21 - Build SHA256 manifests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for dir in evidence restore-kit build-artifacts; do
            [ -d "$dir" ] || continue
            rm -f "$dir/SHA256SUMS" "$dir/EMPTY-DIRECTORY.txt"
            (
              cd "$dir"
              count="$(find . -type f ! -name SHA256SUMS ! -name EMPTY-DIRECTORY.txt | wc -l | tr -d ' ')"
              if [ "$count" -eq 0 ]; then
                {
                  echo "EMPTY_DIRECTORY_AT_MANIFEST_TIME=YES"
                  echo "RUN_ID=$GITHUB_RUN_ID"
                } > EMPTY-DIRECTORY.txt
              fi
              find . -type f ! -name SHA256SUMS -printf '%P\0' \
                | sort -z \
                | xargs -0 -r sha256sum > SHA256SUMS
              test -s SHA256SUMS
              if grep -Eq '[[:space:]]SHA256SUMS$' SHA256SUMS; then
                echo "ERROR: manifest contains itself" >&2
                exit 1
              fi
              sha256sum -c SHA256SUMS
            )
          done

      - name: 22 - Upload P4 evidence, restore kit and build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ksu-gen1-p4-veux-5.4.274-ksu-0.9.5-susfs-2.3-safe-filename-bridge-v6-${{ github.run_id }}
          path: |
            evidence/
            restore-kit/
            build-artifacts/
          retention-days: 14
          if-no-files-found: error
          compression-level: 6

      - name: 23 - Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# KSU GEN1 P4 v6 - safe stat/faccessat filename bridge"
            echo
            if [ "${{ job.status }}" = "success" ] \
              && grep -Fxq 'TECHNICAL_PASS=YES' evidence/98-FINAL-STATUS.txt 2>/dev/null; then
              echo "**PASS**"
              echo
              echo "Official KernelSU 0.9.5 stat/faccessat is now bridged through struct filename **."
              echo "One owner reference is retained across ESTALE retries and each filename_lookup gets one extra reference."
              echo "The isolated KernelSU object preflight builds scripts/selinux/genheaders/ through the supported Kbuild subdirectory target, then runs the official two-output generator into the objtree."
              echo "All SUSFS feature sub-options, OPEN_REDIRECT, namei/proc hooks and userspace dispatch remain deferred."
              echo
              echo '```text'
              cat evidence/13-P4-BUILD-IDENTITY.txt
              cat evidence/14-P4-LINKED-BOUNDARY.txt
              cat evidence/15-P4-PROVENANCE.txt
              echo '```'
            else
              echo "**FAIL — repair only the concrete P4 bridge/build failure before P5.**"
              echo
              echo '```text'
              cat evidence/STAGE.txt 2>/dev/null || true
              cat evidence/12-P4-OBJECT-COMPILE.txt 2>/dev/null || true
              cat evidence/13-P4-IMAGE-DTBS-COMPILE.txt 2>/dev/null || true
              cat evidence/98-FINAL-STATUS.txt 2>/dev/null || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
