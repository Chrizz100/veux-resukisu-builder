name: KSU GEN1 P4 - VEUX 5.4.274 KSU 0.9.5 SUSFS 2.3 Safe stat faccessat Filename Bridge v6

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ksu-gen1-p4-veux-5-4-274-ksu-0-9-5-susfs-2-3-safe-filename-bridge-v6-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_REPOSITORY: dereference23/kernel_xiaomi_sm6375
  BASE_COMMIT: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
  BASE_TREE: 1783b5008fc971b795ccaa374efe97aa996eef49
  BASE_VERSION: 5.4.268

  ANDROID_COMMON_REPO: https://android.googlesource.com/kernel/common
  ANDROID_TAG: android11-5.4.274_r00
  ANDROID_TAG_OBJECT: b5141f9d31a3d1875523c9e1ae0d4587c144d149
  ANDROID_COMMIT: 181edea14ae07024cc87699f3cd49116e6f8fbb3
  ANDROID_TREE: 0485f492b920bf72f7f623a0df2aa3c5d7661a9c
  TARGET_VERSION: 5.4.274
  EXPECTED_P0_MERGE_COMMIT: 763f39fff62ff914200a9ac6e7e2336fdf29a6f2
  EXPECTED_P0_MERGE_TREE: a50206971cf1d1eddc259f3aba3d63f87e7ec706

  KSU_COMMIT: b766b98513b5a7eb33bc1c4a76b5702bf1288f07
  KSU_EXPECTED_VERSION: "11872"
  SUSFS_SOURCE_COMMIT: ec785f47d49f7b3871ca9356f450411020af7017
  SUSFS_EXPECTED_VERSION: v2.3.0

  EXPECTED_P2_OUTER_COMMIT: 4f22e642f73ec6c13f901d7ba39705e1454a8cf6
  EXPECTED_P2_OUTER_TREE: 82ed6bcf7ce0cfd3c406f0a9c979397cdd285b5c

  P3_PASS_RUN_ID: "33931389793"
  P4_V1_FAILED_RUN_ID: "33934344166"
  P4_V2_FAILED_RUN_ID: "33934690173"
  P4_V3_FAILED_RUN_ID: "33935412510"
  P4_V4_FAILED_RUN_ID: "33936518118"
  P4_V5_FAILED_RUN_ID: "33937537473"
  P3_ARTIFACT_NAME: ksu-gen1-p3-veux-5.4.274-ksu-0.9.5-susfs-2.3-bridge-compile-v1-33931389793
  EXPECTED_P3_IMAGE_SHA256: b5f8e869ee0360c6af52faaa1c86c7161e35bd84dc9655d8e97165ac612a621d
  EXPECTED_P3_CONFIG_SHA256: 4416cdb68d8a445afb2ce64891174cfb55b9746406ec40962fc819cd591b8316
  EXPECTED_P3_DTB_SHA256: 42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37

  TOOLCHAIN_REPO: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
  TOOLCHAIN_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
  TOOLCHAIN_DIR: clang-r416183b
  EXPECTED_TOOLCHAIN_TREE_SHA256: ed560f80e2009206b25cb963c8810faecdad06b18b75cc563ef2c9b900355a1f
  EXPECTED_CLANG_SHA256: b2ce016755bddbab76549895bca07b1dc8d14a3e315b8b3567097fef04eadae1
  EXPECTED_LLD_SHA256: 51dc9705420c136f583478ac08a3258cd970710296928b3bf24dc3ee2e6208e3

  KBUILD_BUILD_USER: clean-gen1
  KBUILD_BUILD_HOST: github-actions
  KBUILD_BUILD_TIMESTAMP: Thu Apr 18 11:05:25 UTC 2024

jobs:
  p4-safe-filename-bridge:
    name: P4 - Safe stat/faccessat struct filename bridge + compile v6
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: 01 - Checkout exact fresh VEUX base
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BASE_REPOSITORY }}
          ref: ${{ env.BASE_COMMIT }}
          path: kernel
          fetch-depth: 0
          filter: blob:none

      - name: 02 - Initialize P4 evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence restore-kit build-artifacts p3-artifact
          mkdir -p evidence restore-kit build-artifacts p3-artifact

          {
            echo "WORKFLOW=KSU-GEN1-P4-SAFE-STAT-FACCESSAT-FILENAME-BRIDGE-v6"
            echo "DEVICE=VEUX"
            echo "TARGET_KERNEL=$TARGET_VERSION"
            echo "PARENT_P3_PASS_RUN_ID=$P3_PASS_RUN_ID"
            echo "P4_SCOPE=fs/stat.c,fs/open.c,KernelSU/kernel/sucompat.c"
            echo "P4_V1_FAILED_RUN_ID=33934344166"
            echo "P4_V1_FAILURE_CLASS=EVIDENCE_PATH_AFTER_CD_KERNEL"
            echo "P4_V2_SOURCE_INTEGRATION_CHANGED_FROM_V1=NO"
            echo "P4_V2_FAILED_RUN_ID=$P4_V2_FAILED_RUN_ID"
            echo "P4_V2_FAILURE_CLASS=ISOLATED_KSU_OBJECT_MISSING_GENERATED_SELINUX_FLASK_HEADER"
            echo "P4_V3_FIX=PREGENERATE_SELINUX_FLASK_AND_AV_PERMISSIONS_HEADERS"
            echo "P4_V3_SOURCE_INTEGRATION_CHANGED_FROM_V2=NO"
            echo "P4_V3_FAILED_RUN_ID=$P4_V3_FAILED_RUN_ID"
            echo "P4_V3_FAILURE_CLASS=DIRECT_TOP_LEVEL_FLASK_HEADER_TARGET_NOT_EXPORTED_BY_KBUILD"
            echo "P4_V4_FIX=BUILD_SECURITY_SELINUX_SELINUX_OBJECT_TO_GENERATE_HEADERS"
            echo "P4_V4_SOURCE_INTEGRATION_CHANGED_FROM_V3=NO"
            echo "P4_V4_FAILED_RUN_ID=$P4_V4_FAILED_RUN_ID"
            echo "P4_V4_FAILURE_CLASS=SELINUX_COMPOSITE_OBJECT_NOT_EXPORTED_AS_DIRECT_TOP_LEVEL_TARGET"
            echo "P4_V5_FIX=BUILD_GENHEADERS_HOST_TOOL_AND_RUN_EXACT_FLASK_GENERATOR_COMMAND"
            echo "P4_V5_SOURCE_INTEGRATION_CHANGED_FROM_V4=NO"
            echo "P4_V5_FAILED_RUN_ID=$P4_V5_FAILED_RUN_ID"
            echo "P4_V5_FAILURE_CLASS=GENHEADERS_BINARY_NOT_EXPORTED_AS_DIRECT_TOP_LEVEL_TARGET"
            echo "P4_V6_FIX=BUILD_GENHEADERS_SUBDIRECTORY_TARGET_THEN_RUN_GENERATOR"
            echo "P4_V6_SOURCE_INTEGRATION_CHANGED_FROM_V5=NO"
            echo "P4_STRUCT_FILENAME_DOUBLE_POINTER=YES"
            echo "P4_RAW_USER_POINTER_REINTERPRET_CAST=FORBIDDEN"
            echo "P4_SUSFS_FEATURE_SUBOPTIONS=ALL_DISABLED"
            echo "P4_NAMEI_CHANGES=NO"
            echo "P4_PROC_CHANGES=NO"
            echo "P4_NAMESPACE_CHANGES=NO"
            echo "P4_OPEN_REDIRECT_ACTIVE_HOOKS=NO"
            echo "P4_USER_COMMAND_DISPATCH=NO"
            echo "RESUKISU_INTEGRATION=NO"
            echo "BOOT_IMAGE=NOT_CREATED"
            echo "DEVICE_ACCESS=NOT_PERFORMED"
            echo "FLASHING=NOT_PERFORMED"
          } > evidence/00-CONTRACT.txt

          echo "STAGE=INITIALIZED" > evidence/STAGE.txt

      - name: 03 - Install build and audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=DEPENDENCIES" > evidence/STAGE.txt
          sudo apt-get update
          sudo apt-get install -y \
            bc bison ca-certificates cpio curl flex git jq \
            libelf-dev libssl-dev python3 rsync xz-utils zstd

      - name: 04 - Authenticate base and reconstruct exact P0
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P0_RECONSTRUCTION" > evidence/STAGE.txt
          cd kernel

          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(make -s kernelversion)" = "$BASE_VERSION"
          test -z "$(git status --porcelain)"

          git remote remove android >/dev/null 2>&1 || true
          git remote add android "$ANDROID_COMMON_REPO"
          git fetch --no-tags android "refs/tags/${ANDROID_TAG}:refs/tags/${ANDROID_TAG}"

          test "$(git cat-file -t "refs/tags/${ANDROID_TAG}")" = "tag"
          test "$(git rev-parse "refs/tags/${ANDROID_TAG}")" = "$ANDROID_TAG_OBJECT"
          test "$(git rev-parse "refs/tags/${ANDROID_TAG}^{}")" = "$ANDROID_COMMIT"
          test "$(git rev-parse "${ANDROID_COMMIT}^{tree}")" = "$ANDROID_TREE"

          git config user.name "VEUX Clean Baseline"
          git config user.email "veux-clean-baseline@users.noreply.github.com"

          git merge --no-commit --no-ff "$ANDROID_COMMIT"
          test "$(make -s kernelversion)" = "$TARGET_VERSION"

          export GIT_AUTHOR_DATE="2024-04-18T11:05:25Z"
          export GIT_COMMITTER_DATE="2024-04-18T11:05:25Z"
          git commit -m "CLEAN BASELINE: merge android11-5.4.274_r00 into VEUX 5.4.268"

          test "$(git rev-parse HEAD)" = "$EXPECTED_P0_MERGE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P0_MERGE_TREE"
          test -z "$(git status --porcelain)"

          {
            echo "P0_RECONSTRUCTION=PASS"
            echo "P0_COMMIT=$(git rev-parse HEAD)"
            echo "P0_TREE=$(git rev-parse HEAD^{tree})"
            echo "KERNEL_VERSION=$(make -s kernelversion)"
          } > "$GITHUB_WORKSPACE/evidence/01-P0.txt"

      - name: 05 - Download exact accepted P3 PASS artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.P3_ARTIFACT_NAME }}
          path: p3-artifact
          github-token: ${{ github.token }}
          run-id: ${{ env.P3_PASS_RUN_ID }}

      - name: 06 - Authenticate P3 evidence, restore kit and build outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P3_ARTIFACT_AUTH" > evidence/STAGE.txt

          for dir in evidence restore-kit build-artifacts; do
            test -s "p3-artifact/$dir/SHA256SUMS"
            (
              cd "p3-artifact/$dir"
              sha256sum -c SHA256SUMS
            ) > "evidence/02-P3-${dir}-SHA256.txt"
          done

          grep -Fxq 'TECHNICAL_PASS=YES' p3-artifact/evidence/98-FINAL-STATUS.txt
          grep -Fxq 'CHECKPOINT=KSU-GEN1-P3-SUSFS-2.3-BRIDGE-COMPILE-PASS' \
            p3-artifact/evidence/98-FINAL-STATUS.txt

          test "$(sha256sum p3-artifact/build-artifacts/Image | awk '{print $1}')" \
            = "$EXPECTED_P3_IMAGE_SHA256"
          test "$(sha256sum p3-artifact/build-artifacts/config | awk '{print $1}')" \
            = "$EXPECTED_P3_CONFIG_SHA256"
          test "$(sha256sum p3-artifact/build-artifacts/veux.dtb | awk '{print $1}')" \
            = "$EXPECTED_P3_DTB_SHA256"

          jq -e \
            --arg p2c "$EXPECTED_P2_OUTER_COMMIT" \
            --arg p2t "$EXPECTED_P2_OUTER_TREE" \
            --arg ksu "$KSU_COMMIT" \
            --arg sus "$SUSFS_SOURCE_COMMIT" \
            --arg image "$EXPECTED_P3_IMAGE_SHA256" \
            '.stage == "KSU-GEN1-P3-v1" and
             .p2_outer_commit == $p2c and
             .p2_outer_tree == $p2t and
             .kernelsu_head == $ksu and
             .susfs_source_head == $sus and
             .image_sha256 == $image and
             .config_ksu_susfs == true and
             .susfs_feature_suboptions_enabled == 0 and
             .active_fs_proc_hooks_integrated == false and
             .user_command_dispatch_integrated == false and
             .kernel_build_performed == true and
             .device_accessed == false and
             .flashing_performed == false' \
            p3-artifact/restore-kit/manifest.json \
            > evidence/02-P3-MANIFEST-AUTH.json

          for f in \
            p0-to-p2-outer.patch \
            p2-to-p3-outer-susfs-core.patch \
            p3-kernelsu-0.9.5-core-bridge.patch
          do
            test -s "p3-artifact/restore-kit/$f"
          done

          echo "P3_ACCEPTED_ARTIFACT_AUTH=PASS" > evidence/02-P3-AUTH.txt

      - name: 07 - Restore exact proven P2 outer checkpoint from P3 restore kit
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P2_RESTORE" > evidence/STAGE.txt
          cd kernel

          test "$(git rev-parse HEAD)" = "$EXPECTED_P0_MERGE_COMMIT"
          patch="$GITHUB_WORKSPACE/p3-artifact/restore-kit/p0-to-p2-outer.patch"

          git apply --check --binary "$patch"
          git apply --index --binary "$patch"

          p2_tree="$(git write-tree)"
          test "$p2_tree" = "$EXPECTED_P2_OUTER_TREE"

          export GIT_AUTHOR_NAME="KSU GEN1 P2"
          export GIT_AUTHOR_EMAIL="ksu-gen1-p2@users.noreply.github.com"
          export GIT_AUTHOR_DATE="2026-09-04T17:00:00Z"
          export GIT_COMMITTER_NAME="KSU GEN1 P2"
          export GIT_COMMITTER_EMAIL="ksu-gen1-p2@users.noreply.github.com"
          export GIT_COMMITTER_DATE="2026-09-04T17:00:00Z"
          git commit -m "KSU GEN1 P2: dormant SUSFS 2.3 foundation"

          test "$(git rev-parse HEAD)" = "$EXPECTED_P2_OUTER_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P2_OUTER_TREE"
          test -z "$(git status --porcelain)"

          {
            echo "P2_RESTORE=PASS"
            echo "P2_COMMIT=$(git rev-parse HEAD)"
            echo "P2_TREE=$(git rev-parse HEAD^{tree})"
          } > "$GITHUB_WORKSPACE/evidence/03-P2-RESTORE.txt"

      - name: 08 - Checkout exact official KernelSU 0.9.5 and restore exact P3 source bridge
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P3_SOURCE_RESTORE" > evidence/STAGE.txt
          cd kernel

          git clone --filter=blob:none https://github.com/tiann/KernelSU.git KernelSU
          git -C KernelSU checkout --detach "$KSU_COMMIT"
          test "$(git -C KernelSU rev-parse HEAD)" = "$KSU_COMMIT"

          ksu_count="$(git -C KernelSU rev-list --count HEAD)"
          test "$((10000 + ksu_count + 200))" = "$KSU_EXPECTED_VERSION"

          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
          test "$(realpath drivers/kernelsu)" = "$(realpath KernelSU/kernel)"

          mkdir -p .git/info
          touch .git/info/exclude
          grep -Fxq '/KernelSU/' .git/info/exclude || echo '/KernelSU/' >> .git/info/exclude

          outer_patch="$GITHUB_WORKSPACE/p3-artifact/restore-kit/p2-to-p3-outer-susfs-core.patch"
          ksu_patch="$GITHUB_WORKSPACE/p3-artifact/restore-kit/p3-kernelsu-0.9.5-core-bridge.patch"

          git apply --check --binary "$outer_patch"
          git apply --binary "$outer_patch"

          git -C KernelSU apply --check --binary "$ksu_patch"
          git -C KernelSU apply --binary "$ksu_patch"

          git diff --binary "$EXPECTED_P2_OUTER_COMMIT" -- fs/susfs.c \
            > "$RUNNER_TEMP/p3-outer-rebuilt.patch"
          git -C KernelSU diff --binary "$KSU_COMMIT" -- \
            kernel/Kconfig kernel/ksu.c kernel/selinux/selinux.c kernel/selinux/selinux.h \
            > "$RUNNER_TEMP/p3-ksu-rebuilt.patch"

          cmp "$RUNNER_TEMP/p3-outer-rebuilt.patch" "$outer_patch"
          cmp "$RUNNER_TEMP/p3-ksu-rebuilt.patch" "$ksu_patch"

          {
            echo "P3_SOURCE_RESTORE=PASS"
            echo "P3_OUTER_PATCH_BYTE_REPLAY=PASS"
            echo "P3_KSU_PATCH_BYTE_REPLAY=PASS"
            echo "P3_SOURCE_PARENT=P2"
          } > "$GITHUB_WORKSPACE/evidence/04-P3-SOURCE-RESTORE.txt"

      - name: 09 - Audit Linux 5.4 filename ownership and KernelSU 0.9.5 pre-bridge contract
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P4_PRE_BRIDGE_AUDIT" > evidence/STAGE.txt
          cd kernel

          python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/05-FILENAME-LIFETIME-AUDIT.txt"
          from pathlib import Path
          import re

          namei = Path("fs/namei.c").read_text(encoding="utf-8")
          fsh = Path("include/linux/fs.h").read_text(encoding="utf-8")
          parser = Path("fs/fs_parser.c").read_text(encoding="utf-8") if Path("fs/fs_parser.c").exists() else ""

          def extract_function(text, signature):
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f"missing function: {signature}")
              brace = text.find("{", start)
              if brace < 0:
                  raise SystemExit(f"missing brace: {signature}")
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1]
              raise SystemExit(f"unterminated: {signature}")

          getname = extract_function(namei, "getname_flags(const char __user *filename")
          lookup = extract_function(namei, "int filename_lookup(int dfd, struct filename *name")

          checks = {
              "GETNAME_OWNER_REFCNT_1": "result->refcnt = 1;" in getname,
              "GETNAME_ALLOC_FAILURE_ERR_PTR": "return ERR_PTR(-ENOMEM);" in getname,
              "FILENAME_LOOKUP_ERR_PTR_NOT_PUT": "if (IS_ERR(name))" in lookup and "return PTR_ERR(name);" in lookup,
              "FILENAME_LOOKUP_PUTS_NON_ERR_NAME": "putname(name);" in lookup,
              "STRUCT_FILENAME_REFCNT_PRESENT": re.search(r"\bint\s+refcnt\s*;", fsh) is not None,
              "RETAINED_REF_PATTERN_EXISTS": (
                  "refcnt++" in parser and
                  "filename_lookup() drops our ref" in parser and
                  "filename_lookup(" in parser
              ),
          }

          for k, ok in checks.items():
              print(f"{k}={'PASS' if ok else 'FAIL'}")
          failed = [k for k, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("filename lifetime audit failed: " + ", ".join(failed))

          su = Path("KernelSU/kernel/sucompat.c").read_text(encoding="utf-8")
          if "int ksu_handle_faccessat(int *dfd, const char __user **filename_user" not in su:
              raise SystemExit("KSU 0.9.5 faccessat pre-bridge signature changed")
          if "int ksu_handle_stat(int *dfd, const char __user **filename_user" not in su:
              raise SystemExit("KSU 0.9.5 stat pre-bridge signature changed")

          stat = Path("fs/stat.c").read_text(encoding="utf-8")
          openc = Path("fs/open.c").read_text(encoding="utf-8")
          if "ksu_handle_stat(&dfd, &filename, &flags);" not in stat:
              raise SystemExit("VEUX stat manual hook anchor missing")
          if "ksu_handle_faccessat(&dfd, &filename, &mode, NULL);" not in openc:
              raise SystemExit("VEUX faccessat manual hook anchor missing")

          print("SAFE_RETRY_MODEL=OWNER_REF_PLUS_ONE_LOOKUP_REF_PER_ATTEMPT")
          print("P4_PRE_BRIDGE_AUDIT=PASS")
          PY

          grep -Fxq 'P4_PRE_BRIDGE_AUDIT=PASS' "$GITHUB_WORKSPACE/evidence/05-FILENAME-LIFETIME-AUDIT.txt"

      - name: 10 - Adapt official KernelSU 0.9.5 stat/faccessat handlers to struct filename
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P4_KSU_HANDLER_BRIDGE" > evidence/STAGE.txt
          cd kernel

          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU/kernel/sucompat.c")
          text = p.read_text(encoding="utf-8")

          def extract_function(text, signature):
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f"missing function: {signature}")
              brace = text.find("{", start)
              if brace < 0:
                  raise SystemExit(f"missing brace: {signature}")
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1]
              raise SystemExit(f"unterminated function: {signature}")

          old_faccess = extract_function(text, "int ksu_handle_faccessat(")
          old_stat = extract_function(text, "int ksu_handle_stat(")

          if "const char __user **filename_user" not in old_faccess:
              raise SystemExit("unexpected faccessat source signature")
          if "const char __user **filename_user" not in old_stat:
              raise SystemExit("unexpected stat source signature")

          new_faccess = r'''#ifdef CONFIG_KSU_SUSFS
          int ksu_handle_faccessat(int *dfd, struct filename **filename, int *mode,
          			 int *__unused_flags)
          {
          	const char su[] = SU_PATH;
          	const char sh[] = SH_PATH;

          	if (!ksu_is_allow_uid(current_uid().val))
          		return 0;

          	if (unlikely(!filename || !*filename || IS_ERR(*filename)))
          		return 0;

          	if (likely(memcmp((*filename)->name, su, sizeof(su))))
          		return 0;

          	pr_info("faccessat su->sh via struct filename\n");
          	memcpy((void *)(*filename)->name, sh, sizeof(sh));
          	return 0;
          }
          #else
          ''' + old_faccess + r'''
          #endif'''

          new_stat = r'''#ifdef CONFIG_KSU_SUSFS
          int ksu_handle_stat(int *dfd, struct filename **filename, int *flags)
          {
          	const char su[] = SU_PATH;
          	const char sh[] = SH_PATH;

          	if (!ksu_is_allow_uid(current_uid().val))
          		return 0;

          	if (unlikely(!filename || !*filename || IS_ERR(*filename)))
          		return 0;

          	if (likely(memcmp((*filename)->name, su, sizeof(su))))
          		return 0;

          	pr_info("stat su->sh via struct filename\n");
          	memcpy((void *)(*filename)->name, sh, sizeof(sh));
          	return 0;
          }
          #else
          ''' + old_stat + r'''
          #endif'''

          text = text.replace(old_faccess, new_faccess, 1)
          text = text.replace(old_stat, new_stat, 1)
          p.write_text(text, encoding="utf-8")
          PY

          git -C KernelSU diff --check -- kernel/sucompat.c

          python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/06-KSU-HANDLER-BRIDGE.txt"
          from pathlib import Path
          import re

          t = Path("KernelSU/kernel/sucompat.c").read_text(encoding="utf-8")

          for fn in ("ksu_handle_faccessat", "ksu_handle_stat"):
              marker = f"int {fn}(int *dfd, struct filename **filename"
              if marker not in t:
                  raise SystemExit(f"missing struct filename signature: {fn}")

          required = [
              "IS_ERR(*filename)",
              "(*filename)->name",
              "memcpy((void *)(*filename)->name",
          ]
          for token in required:
              if t.count(token) < 2:
                  raise SystemExit(f"missing KSU bridge behavior: {token}")

          susfs_regions = re.findall(
              r"#ifdef CONFIG_KSU_SUSFS\n(.*?)#else",
              t,
              flags=re.S,
          )
          if len(susfs_regions) < 2:
              raise SystemExit("KSU SUSFS handler regions not found")
          joined = "\n".join(susfs_regions[:2])
          forbidden = {
              "POINTER_REPLACEMENT": r"(?<!\()\*filename\s*=",
              "PUTNAME": r"\bputname\s*\(",
              "REFCNT_MUTATION": r"\brefcnt\s*(?:\+\+|--|[+\-]?=)",
              "RAW_USER_POINTER_CAST": r"\(struct filename \*\*\)\s*&",
          }
          for label, pattern in forbidden.items():
              if re.search(pattern, joined):
                  raise SystemExit(f"forbidden KSU bridge behavior: {label}")

          print("KSU_0_9_5_STAT_STRUCT_FILENAME_DOUBLE_PTR=PASS")
          print("KSU_0_9_5_FACCESSAT_STRUCT_FILENAME_DOUBLE_PTR=PASS")
