          from pathlib import Path
          import re

          p = Path("fs/stat.c")
          t = p.read_text(encoding="utf-8")

          if '#include "internal.h"\n' not in t:
              anchor = '#include <asm/unistd.h>\n'
              if t.count(anchor) != 1:
                  raise SystemExit("fs/stat.c internal.h include anchor mismatch")
              t = t.replace(anchor, anchor + '\n#include "internal.h"\n', 1)

          old_proto = re.compile(
              r'#ifdef CONFIG_KSU\n'
              r'extern int ksu_handle_stat\(int \*dfd, const char __user \*\*filename_user,\n'
              r'\s*int \*flags\);\n'
              r'#endif\n'
