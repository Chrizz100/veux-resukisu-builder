          cd kernel

          # KernelSU 0.9.5 includes generated SELinux headers from
          # $(objtree)/security/selinux. This 5.4 Kbuild does not export either
          # flask.h or the composite selinux.o as a direct top-level target.
          #
          # security/selinux/Makefile defines the exact generator contract as:
          #   $< $(obj)/flask.h $(obj)/av_permissions.h
          # where $< is scripts/selinux/genheaders/genheaders.
          #
          # Build only that host tool through Kbuild, then invoke the exact
          # generator interface into the configured objtree before the isolated
          # KernelSU object preflight. No kernel source file is modified here.
          # Linux 5.4 top-level Kbuild supports explicit subdirectory builds
          # using a trailing slash (for example make foo/bar/baz/). The
          # scripts/selinux/genheaders Makefile declares genheaders as
          # hostprogs-y and always, so descending into this directory is the
          # correct Kbuild-supported way to produce the host generator.
          make -j"$(nproc)" O=out-p4 ARCH=arm64 LLVM=1 KCFLAGS="$KCFLAGS" \
            scripts/selinux/genheaders/ \
