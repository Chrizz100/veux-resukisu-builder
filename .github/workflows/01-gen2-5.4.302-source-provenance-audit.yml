name: 01 - GEN2 5.4.302 Source Provenance Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout pinned GEN2 kernel source
        uses: actions/checkout@v6
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: f4b8a13a43a130a9aab83cc985ce4d4421291ae6
          path: kernel-src
          fetch-depth: 1

      - name: Verify exact source pin
        shell: bash
        run: |
          set -euo pipefail
          cd kernel-src

          EXPECTED="f4b8a13a43a130a9aab83cc985ce4d4421291ae6"
          ACTUAL="$(git rev-parse HEAD)"

          echo "EXPECTED_COMMIT=$EXPECTED"
          echo "ACTUAL_COMMIT=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          echo
          git show -s --format='HEAD=%H%nDATE=%cI%nSUBJECT=%s%nPARENTS=%P' HEAD

      - name: Verify Linux 5.4.302 identity
        shell: bash
        run: |
          set -euo pipefail
          cd kernel-src

          VERSION="$(sed -n 's/^VERSION = //p' Makefile | head -1)"
          PATCHLEVEL="$(sed -n 's/^PATCHLEVEL = //p' Makefile | head -1)"
          SUBLEVEL="$(sed -n 's/^SUBLEVEL = //p' Makefile | head -1)"
          EXTRAVERSION="$(sed -n 's/^EXTRAVERSION = //p' Makefile | head -1)"

          printf 'VERSION=%s\nPATCHLEVEL=%s\nSUBLEVEL=%s\nEXTRAVERSION=%s\n' \
            "$VERSION" "$PATCHLEVEL" "$SUBLEVEL" "$EXTRAVERSION"

          test "$VERSION" = "5"
          test "$PATCHLEVEL" = "4"
          test "$SUBLEVEL" = "302"

      - name: Verify VEUX and build metadata
        shell: bash
        run: |
          set -euo pipefail
          cd kernel-src

          test -f arch/arm64/configs/veux_defconfig
          test -f build.config.common
          test -f build.config.msm.common
          test -f localversion
          test -f scripts/setlocalversion

          echo "=== localversion ==="
          cat localversion

          echo
          echo "=== build.config.common ==="
          cat build.config.common

          echo
          echo "=== key veux_defconfig entries ==="
          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_ARCH_(QCOM|HOLI|BLAIR)=|CONFIG_QGKI=|CONFIG_WT_QGKI=|CONFIG_CPUSETS=|CONFIG_SCHED_CASS=|CONFIG_SPRD_ROTATION_TASK=|CONFIG_HZ_[0-9]+=|CONFIG_CPU_FREQ=|CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=|CONFIG_ARM_QCOM_CPUFREQ_HW=|CONFIG_CPU_IDLE=|CONFIG_ARM_QCOM_LPM_CPUIDLE=|CONFIG_LTO_CLANG=|CONFIG_THINLTO' \
            arch/arm64/configs/veux_defconfig || true

      - name: Audit 5.4.302 merge provenance
        shell: bash
        run: |
          set -euo pipefail
          cd kernel-src

          MERGE_SHA="d4844f38c044910d59d7bba053b16f1d0770345d"

          git fetch --no-tags --depth=1 origin "$MERGE_SHA"
          git cat-file -e "${MERGE_SHA}^{commit}"

          echo "=== Qualcomm/MSM 5.4.302 merge commit ==="
          git show -s --format='%H%n%cI%n%s%n%b' "$MERGE_SHA"

          echo
          echo "=== Required provenance markers ==="
          git show -s --format='%B' "$MERGE_SHA" | grep -F 'android11-5.4.302'
          git show -s --format='%B' "$MERGE_SHA" | grep -F '91d385eb'
          git show -s --format='%B' "$MERGE_SHA" | grep -i 'USB'

      - name: Write final source provenance audit
        shell: bash
        run: |
          set -euo pipefail
          cd kernel-src

          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"

          VERSION="$(sed -n 's/^VERSION = //p' Makefile | head -1)"
          PATCHLEVEL="$(sed -n 's/^PATCHLEVEL = //p' Makefile | head -1)"
          SUBLEVEL="$(sed -n 's/^SUBLEVEL = //p' Makefile | head -1)"

          {
            echo "AUDIT=GEN2_01_SOURCE_PROVENANCE"
            echo "RESULT=PASS"
            echo "GEN2_SOURCE_PROVENANCE_AUDIT=PASS"
            echo "REPOSITORY=dereference23/kernel_xiaomi_sm6375"
            echo "COMMIT=$(git rev-parse HEAD)"
            echo "KERNEL_VERSION=${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"
            echo "DEFCONFIG=arch/arm64/configs/veux_defconfig"
            echo "LOCALVERSION_FILE=$(cat localversion)"
            echo "SOURCE_TREE_UNTOUCHED=YES"
            echo "NO_KERNEL_BUILD_PERFORMED=YES"
          } | tee "$GITHUB_WORKSPACE/GEN2_01_SOURCE_PROVENANCE_AUDIT.txt"

      - name: Upload final audit file
        uses: actions/upload-artifact@v4
        with:
          name: GEN2_01_SOURCE_PROVENANCE_AUDIT
          path: GEN2_01_SOURCE_PROVENANCE_AUDIT.txt
          if-no-files-found: error
          retention-days: 30
