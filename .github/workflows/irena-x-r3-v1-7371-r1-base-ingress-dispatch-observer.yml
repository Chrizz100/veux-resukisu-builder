name: Irena X 7371 R3 v1 observer on R1-v2 - Ingress dispatch trace

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRAMEWORK_FAMILY: Irena-X
  FRAMEWORK_VERSION: v2.0.1
  FRAMEWORK_BUILD: "7371"
  XPOSED_API_LINE: "100+101"

  IRENA_REPO: silvzr/LSP-IrenaX
  IRENA_COMMIT: da439fbbed506dac6c66074af7fda8982aa4fc6a
  CURRENT_LSPLANT_SHA: c5b46bb4f6a99ffe0c77ce3ab006d3f67d5a2b1c
  CURRENT_DOBBY_SHA: dc7b4be06ad6c5dcfb0bb4ca2082b007d69eaed5

  OLD_WORKING_REPO: mywalkb/LSPosed_mod
  OLD_WORKING_COMMIT: 9770579f313de44397c295fd1cc44e3fcec4777c

  OFFICIAL_RELEASE_URL: https://github.com/silvzr/LSP-IrenaX/releases/download/v2.0.1/LSPosed-v2.0.1-7371-IrenaX-release.zip
  OFFICIAL_RELEASE_SHA256: 99e7aaf54dda0e6fa746c55613483a80620174f255dd05e102713778a9966d2f

  FINAL_ZIP: LSPosed-v2.0.1-7371-IrenaX-R3-v1-R1-base-ingress-dispatch-observer-release.zip

jobs:
  build:
    name: Build R3 v1 observer from confirmed R1-v2 runtime base
    runs-on: ubuntu-latest

    steps:
      - name: Freeze R3 observer contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r3-output
          {
            echo "PARENT_RUNTIME=R1-v2"
            echo "PARENT_PACKAGE_SHA256=7ed948db19d92b0dd7776c424f93783e10210082ea807345228e901ab9ce4af7"
            echo "PARENT_DEVICE_FRAMEWORK=PASS (user-confirmed)"
            echo "PARENT_INGRESS=REPEATED_PAIRIP_CRASH_AT_0x65768"
            echo "R2_DEOPT_HYPOTHESIS=FAIL"
            echo "R3_BASE=official Irena X 7371 + exact R1-v2 mIncludeCode compatibility fix"
            echo "R3_ONLY_NEW_CHANGE=observer-only android.util.Log.w markers around LoadedApk and callback dispatch"
            echo "R3_FUNCTIONAL_PATCH=NONE"
            echo "R3_TARGET_PACKAGE=com.nianticproject.ingress"
            echo "P7_MOUNT_SUPPRESSION=NOT_APPLIED"
            echo "P10_CERT_REBUILD_PATCH=NOT_APPLIED"
            echo "R2_DEOPT_ROLLBACK=NOT_APPLIED"
            echo "PAIRIP_BYPASS=NOT_ATTEMPTED"
            echo "LSPLANT=official current Irena pin"
            echo "DOBBY=official current Irena pin"
            echo "MANAGER=official Irena 7371"
            echo "DAEMON=official Irena 7371"
            echo "NATIVE_LIBLSPD=official Irena 7371"
            echo "DEVICE_OBJECTIVE=locate the last LSPosed lifecycle marker reached before PairIP crash"
          } | tee r3-output/R3_OBSERVER_CONTRACT.txt

      - name: Checkout pinned Irena X 7371
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IRENA_REPO }}
          ref: ${{ env.IRENA_COMMIT }}
          submodules: recursive
          fetch-depth: 0
          path: LSP-IrenaX
          persist-credentials: false

      - name: Checkout old working 7244 reference
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OLD_WORKING_REPO }}
          ref: ${{ env.OLD_WORKING_COMMIT }}
          submodules: false
          fetch-depth: 1
          path: LSPosed-7244-reference
          persist-credentials: false

      - name: Verify exact source pins and regression preconditions
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C LSP-IrenaX rev-parse HEAD)" = "$IRENA_COMMIT"
          test -z "$(git -C LSP-IrenaX status --porcelain)"
          test "$(git -C LSP-IrenaX/external/lsplant rev-parse HEAD)" = "$CURRENT_LSPLANT_SHA"
          test "$(git -C LSP-IrenaX/external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
          test -z "$(git -C LSP-IrenaX/external/lsplant status --porcelain)"
          test -z "$(git -C LSP-IrenaX/external/dobby status --porcelain)"

          test "$(git -C LSPosed-7244-reference rev-parse HEAD)" = "$OLD_WORKING_COMMIT"

          current="LSP-IrenaX/core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"
          old="LSPosed-7244-reference/core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"

          test -f "$current"
          test -f "$old"

          grep -Fq 'boolean includeCode = XposedHelpers.getBooleanField(loadedApk, "mIncludeCode");' "$current"
          grep -Fq 'else if (!includeCode)' "$current"

          if grep -Fq 'mIncludeCode' "$old"; then
            echo "old working 7244 unexpectedly contains mIncludeCode access"
            exit 1
          fi

          {
            echo "IRENA=$(git -C LSP-IrenaX rev-parse HEAD)"
            echo "LSPLANT=$(git -C LSP-IrenaX/external/lsplant rev-parse HEAD)"
            echo "DOBBY=$(git -C LSP-IrenaX/external/dobby rev-parse HEAD)"
            echo "OLD_WORKING_7244=$(git -C LSPosed-7244-reference rev-parse HEAD)"
            echo "CURRENT_7371_M_INCLUDE_CODE=PRESENT"
            echo "OLD_7244_M_INCLUDE_CODE=ABSENT"
          } | tee r3-output/R3_SOURCE_PINS_AND_PRECONDITIONS.txt

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: irena-x-r1-clean-base-${{ runner.os }}
          restore-keys: |
            irena-x-${{ runner.os }}
          save: false

      - name: Setup Ninja 1.12.1
        uses: seanmiddleditch/gha-setup-ninja@master
        with:
          version: 1.12.1

      - name: Remove Android bundled CMake
        shell: bash
        run: rm -rf "$ANDROID_HOME/cmake"

      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.caching=true'
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC'
            echo 'android.native.buildOutput=verbose'
          } >> ~/.gradle/gradle.properties

      - name: Download and verify official Irena 7371 release
        id: official
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            -o OFFICIAL_RELEASE.zip \
            "$OFFICIAL_RELEASE_URL"

          echo "$OFFICIAL_RELEASE_SHA256  OFFICIAL_RELEASE.zip" | sha256sum -c -

          rm -rf officialcmp
          mkdir officialcmp
          unzip -q OFFICIAL_RELEASE.zip -d officialcmp
          unzip -t OFFICIAL_RELEASE.zip

          test -f officialcmp/manager.apk
          test -f officialcmp/daemon.apk
          test -f officialcmp/framework/lspd.dex

          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("OFFICIAL_RELEASE.zip") as z:
              names = z.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit("duplicate names in official release")
              if len([n for n in names if not n.endswith("/")]) != 56:
                  raise SystemExit("official release file count is not 56")
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"official release CRC failure: {bad}")
          PY

          sha256sum OFFICIAL_RELEASE.zip \
            > r3-output/R3_OFFICIAL_RELEASE_SHA256.txt

      - name: Apply exact R1 fix plus observer-only Ingress markers
        id: patch
        if: steps.official.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -euo pipefail

          # A) Reproduce the confirmed R1-v2 mIncludeCode compatibility fix exactly.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java")
          s = p.read_text()

          line = '            boolean includeCode = XposedHelpers.getBooleanField(loadedApk, "mIncludeCode");\n'
          branch = (
              '            } else if (!includeCode) {\n'
              '                Hookers.logD("LoadedApk#<init> has no code, skip: " + mAppDir);\n'
              '                return;\n'
          )

          if s.count(line) != 1:
              raise SystemExit(f"R1 precondition failed: mIncludeCode read count={s.count(line)}")
          if s.count(branch) != 1:
              raise SystemExit(f"R1 precondition failed: no-code branch count={s.count(branch)}")

          s = s.replace(line, "", 1)
          s = s.replace(branch, "", 1)

          good = (
              '                    packageName = "system";\n'
              '                }\n'
              '            }\n'
              '\n'
              '            if (!XposedInit.loadedPackagesInProcess.add(packageName)) {\n'
          )
          if s.count(good) != 1:
              raise SystemExit("R1-v2 control-flow reproduction failed")
          if 'mIncludeCode' in s:
              raise SystemExit("R1-v2 mIncludeCode regression")

          p.write_text(s)
          PY

          # B) R3 observer-only instrumentation. No branch/return/hook behavior is changed.
          python3 - <<'PY'
          from pathlib import Path

          ingress = "com.nianticproject.ingress"

          ctor = Path("core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java")
          s = ctor.read_text()

          old = '            String packageName = loadedApk.getPackageName();\n'
          new = (
              '            String packageName = loadedApk.getPackageName();\n'
              f'            if ("{ingress}".equals(packageName)) {{\n'
              '                android.util.Log.w("LSPosed-R3", "01_CTOR_ENTER");\n'
              '            }\n'
          )
          if s.count(old) != 1:
              raise SystemExit("ctor packageName anchor count mismatch")
          s = s.replace(old, new, 1)

          old = '            LoadedApkCreateCLHooker.addLoadedApk(loadedApk);\n'
          new = (
              f'            if ("{ingress}".equals(packageName)) {{\n'
              '                android.util.Log.w("LSPosed-R3", "02_CTOR_BEFORE_ADD");\n'
              '            }\n'
              '            LoadedApkCreateCLHooker.addLoadedApk(loadedApk);\n'
              f'            if ("{ingress}".equals(packageName)) {{\n'
              '                android.util.Log.w("LSPosed-R3", "03_CTOR_AFTER_ADD");\n'
              '            }\n'
          )
          if s.count(old) != 1:
              raise SystemExit("ctor addLoadedApk anchor count mismatch")
          s = s.replace(old, new, 1)
          ctor.write_text(s)

          cl = Path("core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java")
          s = cl.read_text()

          old = (
              '        LoadedApk loadedApk = (LoadedApk) callback.getThisObject();\n'
              '\n'
              '        if (callback.getArgs()[0] != null || !loadedApks.contains(loadedApk)) {\n'
              '            return;\n'
              '        }\n'
          )
          new = (
              '        LoadedApk loadedApk = (LoadedApk) callback.getThisObject();\n'
              f'        boolean r3Ingress = "{ingress}".equals(loadedApk.getPackageName());\n'
              '        if (r3Ingress) android.util.Log.w("LSPosed-R3", "04_CREATECL_ENTER");\n'
              '\n'
              '        if (callback.getArgs()[0] != null || !loadedApks.contains(loadedApk)) {\n'
              '            if (r3Ingress) android.util.Log.w("LSPosed-R3", "05_CREATECL_FILTERED");\n'
              '            return;\n'
              '        }\n'
              '        if (r3Ingress) android.util.Log.w("LSPosed-R3", "06_CREATECL_MATCH");\n'
          )
          if s.count(old) != 1:
              raise SystemExit("createCL entry anchor count mismatch")
          s = s.replace(old, new, 1)

          old = (
              '            if (isFirstPackage && XposedInit.getLoadedModules().getOrDefault(packageName, Optional.empty()).isPresent()) {\n'
              '                hookNewXSP(lpparam);\n'
              '            }\n'
          )
          new = (
              '            if (isFirstPackage && XposedInit.getLoadedModules().getOrDefault(packageName, Optional.empty()).isPresent()) {\n'
              '                if (r3Ingress) android.util.Log.w("LSPosed-R3", "07_NEWXSP_BEFORE");\n'
              '                hookNewXSP(lpparam);\n'
              '                if (r3Ingress) android.util.Log.w("LSPosed-R3", "08_NEWXSP_AFTER");\n'
              '            }\n'
          )
          if s.count(old) != 1:
              raise SystemExit("hookNewXSP anchor count mismatch")
          s = s.replace(old, new, 1)

          old = (
              '            Hookers.logD("Call handleLoadedPackage: packageName=" + lpparam.packageName + " processName=" + lpparam.processName + " isFirstPackage=" + isFirstPackage + " classLoader=" + lpparam.classLoader + " appInfo=" + lpparam.appInfo);\n'
              '            XC_LoadPackage.callAll(lpparam);\n'
          )
          new = (
              '            Hookers.logD("Call handleLoadedPackage: packageName=" + lpparam.packageName + " processName=" + lpparam.processName + " isFirstPackage=" + isFirstPackage + " classLoader=" + lpparam.classLoader + " appInfo=" + lpparam.appInfo);\n'
              '            if (r3Ingress) android.util.Log.w("LSPosed-R3", "09_LEGACY_BEFORE");\n'
              '            XC_LoadPackage.callAll(lpparam);\n'
              '            if (r3Ingress) android.util.Log.w("LSPosed-R3", "10_LEGACY_AFTER");\n'
          )
          if s.count(old) != 1:
              raise SystemExit("legacy callback anchor count mismatch")
          s = s.replace(old, new, 1)

          old = (
              '            LSPosedContext.callOnPackageLoaded(param);\n'
              '            LSPosedContext.callOnPackageReady(param);\n'
          )
          new = (
              '            if (r3Ingress) android.util.Log.w("LSPosed-R3", "11_API_LOADED_BEFORE");\n'
              '            LSPosedContext.callOnPackageLoaded(param);\n'
              '            if (r3Ingress) android.util.Log.w("LSPosed-R3", "12_API_LOADED_AFTER");\n'
              '            if (r3Ingress) android.util.Log.w("LSPosed-R3", "13_API_READY_BEFORE");\n'
              '            LSPosedContext.callOnPackageReady(param);\n'
              '            if (r3Ingress) android.util.Log.w("LSPosed-R3", "14_API_READY_AFTER");\n'
          )
          if s.count(old) != 1:
              raise SystemExit("modern callback anchor count mismatch")
          s = s.replace(old, new, 1)

          old = (
              '        } finally {\n'
              '            loadedApks.remove(loadedApk);\n'
              '        }\n'
          )
          new = (
              '        } finally {\n'
              '            if (r3Ingress) android.util.Log.w("LSPosed-R3", "15_CREATECL_FINALLY");\n'
              '            loadedApks.remove(loadedApk);\n'
              '        }\n'
          )
          if s.count(old) != 1:
              raise SystemExit("finally anchor count mismatch")
          s = s.replace(old, new, 1)

          cl.write_text(s)

          # Hard marker audit.
          combined = ctor.read_text() + "\n" + cl.read_text()
          expected = [f"{i:02d}_" for i in range(1, 16)]
          for prefix in expected:
              if combined.count(f'"{prefix}') != 1:
                  raise SystemExit(f"marker {prefix} count mismatch")
          if combined.count('"LSPosed-R3"') != 15:
              raise SystemExit("expected exactly 15 LSPosed-R3 marker calls")
          PY

          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}" | tee ../r3-output/R3_SOURCE_DIFF_NAMES.txt

          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java"
          test "${changed[1]}" = "core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"

          # R1-v2 fix remains mandatory.
          if grep -Fq 'mIncludeCode' core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java; then
            echo "R1-v2 mIncludeCode fix was lost"
            exit 1
          fi

          # No R2 deopt experiment in R3.
          git diff --exit-code "$IRENA_COMMIT" -- \
            core/src/main/java/org/lsposed/lspd/deopt/InlinedMethodCallers.java

          # Freeze every unrelated path investigated previously.
          git diff --exit-code "$IRENA_COMMIT" -- \
            daemon/build.gradle.kts \
            daemon/src/main/java/org/lsposed/lspd/service/Dex2OatService.java \
            daemon/src/main/java/org/lsposed/lspd/util/InstallerVerifier.java \
            core/src/main/java/org/lsposed/lspd/core/Startup.java \
            core/src/main/java/org/lsposed/lspd/impl/LSPosedBridge.java \
            core/src/main/java/org/lsposed/lspd/impl/LSPosedHelper.java \
            core/src/main/jni/src/jni/hook_bridge.cpp \
            core/src/main/jni/src/native_api.cpp \
            magisk-loader/src/main/jni/api/zygisk_main.cpp \
            magisk-loader/src/main/jni/src/magisk_loader.cpp

          test "$(git -C external/lsplant rev-parse HEAD)" = "$CURRENT_LSPLANT_SHA"
          test "$(git -C external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
          test -z "$(git -C external/lsplant status --porcelain)"
          test -z "$(git -C external/dobby status --porcelain)"

          grep -Rho 'android.util.Log.w("LSPosed-R3", "[0-9][0-9]_[A-Z_]*")' \
            core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java \
            core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java \
            | sort | tee ../r3-output/R3_MARKER_LIST.txt
          test "$(wc -l < ../r3-output/R3_MARKER_LIST.txt)" -eq 15

          git diff > ../r3-output/R3_SOURCE_FULL.patch

          {
            echo "PARENT=R1-v2 device framework PASS"
            echo "PARENT_PACKAGE_SHA256=7ed948db19d92b0dd7776c424f93783e10210082ea807345228e901ab9ce4af7"
            echo "SOURCE_DELTA_VS_OFFICIAL=LoadedApkCtorHooker.java + LoadedApkCreateCLHooker.java"
            echo "FUNCTIONAL_DELTA_VS_R1=NONE"
            echo "OBSERVER_DELTA_VS_R1=15 Ingress-only android.util.Log.w markers"
            echo "M_INCLUDE_CODE_FIX=PRESERVED"
            echo "R2_DEOPT_ROLLBACK=ABSENT"
            echo "P7_MOUNT_SUPPRESSION=ABSENT"
            echo "P10_CERT_PATCH=ABSENT"
            echo "PAIRIP_BYPASS=ABSENT"
            echo "LSPLANT=$CURRENT_LSPLANT_SHA"
            echo "DOBBY=$CURRENT_DOBBY_SHA"
          } | tee ../r3-output/R3_PROVENANCE.txt

      - name: Build R3 v1 observer framework
        id: r3build
        if: steps.patch.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ./gradlew clean zipAll --stacktrace --info 2>&1 | tee ../r3-build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > ../R3_BUILD_EXIT_CODE.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Freeze rebuilt framework payload
        id: framework
        if: steps.r3build.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t rel < <(find LSP-IrenaX/magisk-loader/release -maxdepth 1 -type f \
            -name 'LSPosed-v*-IrenaX-release.zip' -print | sort)

          test "${#rel[@]}" -eq 1
          cp "${rel[0]}" R3_BUILD_RELEASE.zip

          rm -rf r3buildcmp
          mkdir r3buildcmp
          unzip -q R3_BUILD_RELEASE.zip -d r3buildcmp

          test -f r3buildcmp/framework/lspd.dex
          sha256sum r3buildcmp/framework/lspd.dex \
            > r3-output/R3_REBUILT_FRAMEWORK_DEX_SHA256.txt

      - name: Create official-base R3 observer package
        id: package
        if: steps.framework.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          official = Path("OFFICIAL_RELEASE.zip")
          out = Path("${{ env.FINAL_ZIP }}")
          rebuilt_dex = Path("r3buildcmp/framework/lspd.dex").read_bytes()
          rebuilt_dex_sha = hashlib.sha256(rebuilt_dex).hexdigest().encode()

          replacements = {
              "framework/lspd.dex": rebuilt_dex,
              "framework/lspd.dex.sha256": rebuilt_dex_sha,
          }

          with zipfile.ZipFile(official, "r") as zin, zipfile.ZipFile(out, "w") as zout:
              infos = zin.infolist()
              names = [i.filename for i in infos]

              if len(names) != len(set(names)):
                  raise SystemExit("duplicate names in official ZIP")

              for required in replacements:
                  if required not in names:
                      raise SystemExit(f"missing official payload: {required}")

              for info in infos:
                  data = replacements.get(info.filename)
                  if data is None:
                      data = zin.read(info.filename)
                  zout.writestr(info, data)

          def tree(path):
              with zipfile.ZipFile(path) as z:
                  names = z.namelist()
                  if len(names) != len(set(names)):
                      raise SystemExit(f"duplicate names: {path}")
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f"ZIP CRC failure {path}: {bad}")
                  return {
                      n: hashlib.sha256(z.read(n)).hexdigest()
                      for n in names
                      if not n.endswith("/")
                  }

          a = tree(official)
          b = tree(out)

          if set(a) != set(b):
              raise SystemExit("official/R3 file sets differ")
          if len(a) != 56:
              raise SystemExit(f"expected 56 files, got {len(a)}")

          diff = sorted(k for k in a if a[k] != b[k])
          expected = ["framework/lspd.dex", "framework/lspd.dex.sha256"]
          if diff != expected:
              raise SystemExit(f"unexpected official->R3 final delta: {diff}")

          # All manager/daemon/native payload must remain exact official 7371.
          for rel in (
              "manager.apk",
              "daemon.apk",
              "lib/arm64-v8a/liblspd.so",
              "lib/armeabi-v7a/liblspd.so",
              "lib/x86/liblspd.so",
              "lib/x86_64/liblspd.so",
          ):
              if a[rel] != b[rel]:
                  raise SystemExit(f"official payload changed unexpectedly: {rel}")

          with zipfile.ZipFile(out) as z:
              names = set(z.namelist())
              checked = 0
              for n in sorted(names):
                  if not n.endswith(".sha256"):
                      continue
                  payload = n[:-7]
                  if payload not in names:
                      continue
                  expected_hash = z.read(n).decode().strip().split()[0]
                  actual_hash = hashlib.sha256(z.read(payload)).hexdigest()
                  if expected_hash != actual_hash:
                      raise SystemExit(f"sidecar mismatch: {n}")
                  checked += 1

              if checked != 28:
                  raise SystemExit(f"expected 28 verified sidecars, got {checked}")

          sha = hashlib.sha256(out.read_bytes()).hexdigest()
          Path("r3-output/R3_FINAL_PACKAGE_SHA256.txt").write_text(
              f"{sha}  {out.name}\n"
          )
          Path("r3-output/R3_FINAL_PACKAGE_DIFF.txt").write_text(
              "framework/lspd.dex\nframework/lspd.dex.sha256\n"
          )
          Path("r3-output/R3_FINAL_SCOPE.txt").write_text(
              "BASE=official Irena X 7371 release + R1-v2 mIncludeCode fix\n"
              "ONLY_FINAL_PAYLOAD_CHANGE=framework/lspd.dex + sidecar\n"
              "MANAGER=official 7371 byte-identical\n"
              "DAEMON=official 7371 byte-identical\n"
              "DEX2OAT_BEHAVIOR=official 7371 unchanged\n"
              "ALL_LIBLSPD=official 7371 byte-identical\n"
              "M_INCLUDE_CODE_DIRECT_READ=removed (R1 preserved)\n"
              "R3_OBSERVER=15 Ingress-only lifecycle markers\n"
              "R3_FUNCTIONAL_PATCH=none\n"
              "R2_DEOPT_ROLLBACK=not present\n"
              "P7_MOUNT_SUPPRESSION=not present\n"
              "P10_CERT_REBUILD_PATCH=not present\n"
              "PAIRIP_BYPASS=not present\n"
          )
          PY

          unzip -t "$FINAL_ZIP"
          cp "$FINAL_ZIP" "r3-output/INSTALL_THIS_${FINAL_ZIP}"

      - name: Write R3 observer device plan
        if: steps.package.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          cat > r3-output/R3_DEVICE_TEST_PLAN.txt <<'EOF'
          R3 OBSERVER DEVICE TEST

          Keep the SAME module enablement and Ingress scopes that reproduce the R1/R2 crash.

          PHASE A — REGRESSION CHECK
          1. Install the inner INSTALL_THIS_*.zip and reboot fully.
          2. Confirm the manager/framework still behaves like R1-v2.
          3. If framework behavior regresses, stop: R3 observer is invalid.

          PHASE B — ONE CONTROLLED INGRESS START
          4. Run:
             su -c 'logcat -c'
             su -c 'am force-stop com.nianticproject.ingress'
             su -c 'monkey -p com.nianticproject.ingress -c android.intent.category.LAUNCHER 1'
             sleep 4
             su -c 'logcat -b all -d -v threadtime | grep -E "LSPosed-R3|libpairipcore|SIGSEGV|SEGV_|Fatal signal" > /sdcard/Download/r3-ingress-observer.txt'

          5. Upload r3-ingress-observer.txt.

          MARKER ORDER
          01 CTOR_ENTER
          02 CTOR_BEFORE_ADD
          03 CTOR_AFTER_ADD
          04 CREATECL_ENTER
          05 CREATECL_FILTERED (only if createClassLoader path is rejected)
          06 CREATECL_MATCH
          07 NEWXSP_BEFORE
          08 NEWXSP_AFTER
          09 LEGACY_BEFORE
          10 LEGACY_AFTER
          11 API_LOADED_BEFORE
          12 API_LOADED_AFTER
          13 API_READY_BEFORE
          14 API_READY_AFTER
          15 CREATECL_FINALLY

          INTERPRETATION
          - Last marker <= 08: crash is before classic module callback dispatch.
          - 09 without 10: crash occurs inside XC_LoadPackage.callAll / a classic module callback.
          - 10 present, 11 without 12: crash in API loaded callback path.
          - 12 present, 13 without 14: crash in API ready callback path.
          - 15 before PairIP crash: LSPosed package dispatch completed; investigate post-dispatch hook/ART state.
          - No markers at all: LoadedApk observer path was not reached before crash, or logging itself is unavailable; do not infer callback state from absence alone.
          EOF

      - name: Collect R3 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r3-output

          cp R3_BUILD_EXIT_CODE.txt r3-output/ 2>/dev/null || true
          cp r3-build.log r3-output/ 2>/dev/null || true
          cp R3_BUILD_RELEASE.zip r3-output/ 2>/dev/null || true
          cp OFFICIAL_RELEASE.zip r3-output/OFFICIAL_7371_RELEASE_REFERENCE.zip 2>/dev/null || true

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          out = Path("r3-output")
          manifest = out / "R3_EVIDENCE_SHA256SUMS.txt"

          files = sorted(
              p for p in out.rglob("*")
              if p.is_file() and p != manifest
          )

          with manifest.open("w") as f:
              for p in files:
                  rel = p.relative_to(out).as_posix()
                  f.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}\n")
          PY

          (
            cd r3-output
            sha256sum -c R3_EVIDENCE_SHA256SUMS.txt
          )

      - name: Final R3 fail-closed static gate
        id: finalgate
        shell: bash
        run: |
          set -euo pipefail

          test -f R3_BUILD_EXIT_CODE.txt
          test "$(cat R3_BUILD_EXIT_CODE.txt)" = "0"

          diff -u <(printf '%s\n' \
            core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java \
            core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java) \
            r3-output/R3_SOURCE_DIFF_NAMES.txt

          diff -u <(printf '%s\n' \
            framework/lspd.dex \
            framework/lspd.dex.sha256) \
            r3-output/R3_FINAL_PACKAGE_DIFF.txt

          grep -q '^P7_MOUNT_SUPPRESSION=ABSENT$' r3-output/R3_PROVENANCE.txt
          grep -q '^P10_CERT_PATCH=ABSENT$' r3-output/R3_PROVENANCE.txt
          grep -q '^R2_DEOPT_ROLLBACK=ABSENT$' r3-output/R3_PROVENANCE.txt
          grep -q '^FUNCTIONAL_DELTA_VS_R1=NONE$' r3-output/R3_PROVENANCE.txt
          grep -q '^PAIRIP_BYPASS=ABSENT$' r3-output/R3_PROVENANCE.txt

          test -f "r3-output/INSTALL_THIS_${FINAL_ZIP}"

          (
            cd r3-output
            sha256sum -c R3_EVIDENCE_SHA256SUMS.txt
          )

          {
            echo "RESULT=R3_V1_STATIC_FULL_PASS_OBSERVER_CANDIDATE_CREATED"
            echo "PARENT=R1-v2 device framework PASS"
            echo "PARENT_PACKAGE_SHA256=7ed948db19d92b0dd7776c424f93783e10210082ea807345228e901ab9ce4af7"
            echo "BASE=official Irena X 7371"
            echo "SOURCE_CHANGE_VS_OFFICIAL=LoadedApkCtorHooker.java + LoadedApkCreateCLHooker.java"
            echo "FUNCTIONAL_CHANGE_VS_R1=NONE"
            echo "OBSERVER_CHANGE_VS_R1=15 Ingress-only lifecycle markers"
            echo "FINAL_PACKAGE_DELTA=framework/lspd.dex + framework/lspd.dex.sha256 only"
            echo "MANAGER=official 7371"
            echo "DAEMON=official 7371"
            echo "DEX2OAT=official 7371"
            echo "LIBLSPD=official 7371"
            echo "DEVICE_RUNTIME_STATUS=NOT_TESTED_BY_WORKFLOW"
            echo "RUNTIME_TARGET=last LSPosed-R3 marker before PairIP crash"
            echo "STATIC_PASS_IS_NOT_DEVICE_PASS=YES"
          } | tee r3-output/R3_STATIC_PASS_MARKER.txt

      - name: Upload R3 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irena-x-v2.0.1-7371-r3-v1-ingress-dispatch-observer-${{ github.run_id }}
          path: r3-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
