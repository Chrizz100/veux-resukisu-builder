name: 90 - GEN1 5.4.274 ReSukiSU 419e270b Final boot.img v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  boot-image:
    name: Build verified GEN1 HyperOS boot.img from W88-v3
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      W88_RUN_ID: "33252124378"
      W88_RUN_HEAD_SHA: "13ca2de251f8a64ca0658ebf9f38f174d26fa307"
      W88_WORKFLOW_PATH: ".github/workflows/88-gen1-5.4.274-resukisu-419e270b-update-repro-build-v3.yml"
      W88_ARTIFACT_ID: "9715115041"
      W88_ARTIFACT_NAME: "GEN1_W88_5.4.274_ReSukiSU_419E270B_COMPACT-1"
      W88_ARTIFACT_SHA256: "25ec48457888386430604cab9fb20c91f778ae30672d90d2955bb38ca3fa080c"

      IMAGE_SHA256: "d0f7abcc526ec63413236fd440cef2d9fb6cc3819ce656b1b49efde7d65cda04"
      IMAGE_BYTES: "29843968"
      CONFIG_SHA256: "d7cd955abd59da45804acc9c5e450cf8fc953da3e66bbc274212b40ee9a0b372"
      RESUKISU_COMMIT: "419e270b50ad61725185dec74f438b8cb59c6889"

      W21_ARTIFACT_NAME: "veux-5.4.274-resukisu-susfs-2.2-workflow21-exact-w19-final-flashable-1"
      W21_FINAL_ZIP_NAME: "VEUX_5.4.274_ReSukiSU_SUSFS_2.2_EXACT_W19_BOOT_FLASHABLE.zip"
      W21_FINAL_ZIP_SHA256: "b6f9c22582cf90aca3bd40d946f44f465f3b4324d377cabdd9a23668113fe4f2"
      W21_FINAL_ZIP_BYTES: "75516120"

      STOCK_BOOT_SHA256: "ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5"
      STOCK_BOOT_BYTES: "134217728"
      STOCK_RAMDISK_SHA256: "0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a"
      ROLLBACK_GZIP_SHA256: "9a1532ccfc57b465256bba97863f927b80823fa8812a4d13e4f4c8bf9af0c78b"
      OLD_CUSTOM_BOOT_SHA256: "2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e"
      OLD_KERNEL_SHA256: "e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96"
      OLD_KERNEL_BYTES: "29839872"

      WORK: "${{ github.workspace }}/gen1-w90-v1"

    steps:
      - name: Verify runner tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in gh jq unzip gzip sha256sum stat find python3 cmp; do
            command -v "$tool" >/dev/null
          done

      - name: Prepare isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK"
          mkdir -p "$WORK/input" "$WORK/w88" "$WORK/w21" "$WORK/oldpkg" "$WORK/build" "$WORK/release"

      - name: Authenticate exact successful W88-v3 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_JSON="$WORK/input/w88-run.json"
          ART_JSON="$WORK/input/w88-artifact.json"

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${W88_RUN_ID}" \
            > "$RUN_JSON"

          test "$(jq -r '.id' "$RUN_JSON")" = "$W88_RUN_ID"
          test "$(jq -r '.status' "$RUN_JSON")" = "completed"
          test "$(jq -r '.conclusion' "$RUN_JSON")" = "success"
          test "$(jq -r '.path' "$RUN_JSON")" = "$W88_WORKFLOW_PATH"
          test "$(jq -r '.head_sha' "$RUN_JSON")" = "$W88_RUN_HEAD_SHA"

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${W88_ARTIFACT_ID}" \
            > "$ART_JSON"

          test "$(jq -r '.id' "$ART_JSON")" = "$W88_ARTIFACT_ID"
          test "$(jq -r '.name' "$ART_JSON")" = "$W88_ARTIFACT_NAME"
          test "$(jq -r '.expired' "$ART_JSON")" = "false"
          test "$(jq -r '.workflow_run.id' "$ART_JSON")" = "$W88_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' "$ART_JSON")" = "$W88_RUN_HEAD_SHA"
          test "$(jq -r '.digest' "$ART_JSON")" = "sha256:${W88_ARTIFACT_SHA256}"

          echo "W88_V3_SOURCE_AUTH=PASS"

      - name: Download and verify exact W88-v3 Image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${W88_ARTIFACT_ID}/zip" \
            > "$WORK/input/w88.zip"

          echo "$W88_ARTIFACT_SHA256  $WORK/input/w88.zip" | sha256sum -c -
          unzip -t "$WORK/input/w88.zip" >/dev/null
          unzip -q "$WORK/input/w88.zip" -d "$WORK/w88"

          test "$(find "$WORK/w88" -maxdepth 1 -type f | wc -l)" -eq 4
          test -s "$WORK/w88/GEN1_W88_Image"
          test -s "$WORK/w88/GEN1_W88_config"
          test -s "$WORK/w88/SHA256SUMS.txt"
          test -s "$WORK/w88/W88-FINAL-VERDICT.txt"

          (
            cd "$WORK/w88"
            sha256sum -c SHA256SUMS.txt
          )

          test "$(stat -c '%s' "$WORK/w88/GEN1_W88_Image")" = "$IMAGE_BYTES"
          echo "$IMAGE_SHA256  $WORK/w88/GEN1_W88_Image" | sha256sum -c -
          echo "$CONFIG_SHA256  $WORK/w88/GEN1_W88_config" | sha256sum -c -

          V="$WORK/w88/W88-FINAL-VERDICT.txt"
          for required in \
            'W88_GEN1_5.4.274_UPDATE=PASS' \
            'DEVICE_SCOPE=VEUX' \
            'KERNEL_VERSION=5.4.274' \
            "RESUKISU_PIN=$RESUKISU_COMMIT" \
            'SUSFS_VERSION=2.2' \
            'WEBVIEW_ZYGOTE_UMOUNT=PASS' \
            'SELINUX_HIDE_5_4=PASS' \
            'AVD_SEQNO_1=PASS' \
            'SUSFS_ZYGOTE_NEXT_TIF_PROC_UMOUNTED=PASS' \
            'SUSFS_PROCESS_STATE_BACKPORT=PASS' \
            'OPEN_REDIRECT_SRCU=PASS' \
            'PROC_MAPS_SUSFS=PASS' \
            'MODULE_LOAD_FILTER_INCLUDED=NO' \
            'REPRODUCIBILITY=PASS' \
            "IMAGE_SHA256=$IMAGE_SHA256" \
            "IMAGE_BYTES=$IMAGE_BYTES"
          do
            grep -Fxq "$required" "$V"
          done

          cp "$WORK/w88/GEN1_W88_Image" "$WORK/input/new-Image"
          echo "W88_V3_IMAGE_GATE=PASS"

      - name: Recover exact historical calibrated HyperOS boot inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ALL="$WORK/input/all-artifacts.ndjson"
          : > "$ALL"

          page=1
          while :; do
            PAGE="$WORK/input/artifacts-${page}.json"

            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}" \
              > "$PAGE"

            COUNT="$(jq '.artifacts | length' "$PAGE")"
            jq -c '.artifacts[]' "$PAGE" >> "$ALL"

            [ "$COUNT" -lt 100 ] && break
            page=$((page + 1))
            [ "$page" -le 30 ] || {
              echo "ERROR: artifact pagination safety limit reached" >&2
              exit 1
            }
          done

          SELECTED="$(
            jq -s --arg NAME "$W21_ARTIFACT_NAME" '
              [.[] | select(.name == $NAME and .expired == false)]
              | sort_by(.created_at)
              | .[-1]
            ' "$ALL"
          )"

          test "$(jq -r 'type' <<< "$SELECTED")" = "object" || {
            echo "ERROR: calibrated W21 artifact not found or expired" >&2
            exit 1
          }

          W21_ID="$(jq -r '.id' <<< "$SELECTED")"
          test -n "$W21_ID"
          test "$W21_ID" != "null"

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${W21_ID}/zip" \
            > "$WORK/input/w21-outer.zip"

          unzip -t "$WORK/input/w21-outer.zip" >/dev/null
          unzip -q "$WORK/input/w21-outer.zip" -d "$WORK/w21"

          mapfile -t matches < <(
            find "$WORK/w21" -type f -name "$W21_FINAL_ZIP_NAME" -print
          )
          test "${#matches[@]}" -eq 1
          FINAL_OLD="${matches[0]}"

          test "$(stat -c '%s' "$FINAL_OLD")" = "$W21_FINAL_ZIP_BYTES"
          echo "$W21_FINAL_ZIP_SHA256  $FINAL_OLD" | sha256sum -c -

          unzip -t "$FINAL_OLD" >/dev/null
          unzip -q "$FINAL_OLD" -d "$WORK/oldpkg"

          test -s "$WORK/oldpkg/boot.img"
          test -s "$WORK/oldpkg/rollback_stock_boot.img.gz"

          echo "$OLD_CUSTOM_BOOT_SHA256  $WORK/oldpkg/boot.img" | sha256sum -c -
          echo "$ROLLBACK_GZIP_SHA256  $WORK/oldpkg/rollback_stock_boot.img.gz" | sha256sum -c -
          gzip -t "$WORK/oldpkg/rollback_stock_boot.img.gz"

          gzip -dc "$WORK/oldpkg/rollback_stock_boot.img.gz" > "$WORK/input/stock_boot.img"

          test "$(stat -c '%s' "$WORK/input/stock_boot.img")" = "$STOCK_BOOT_BYTES"
          echo "$STOCK_BOOT_SHA256  $WORK/input/stock_boot.img" | sha256sum -c -

          if [ -s "$WORK/oldpkg/PACKAGE-SHA256SUMS" ]; then
            (
              cd "$WORK/oldpkg"
              sha256sum -c PACKAGE-SHA256SUMS
            )
          fi

          echo "W21_HISTORICAL_BOOT_INPUT_GATE=PASS"
          echo "W21_ARTIFACT_ID=$W21_ID"

      - name: Reconstruct calibrated Boot v3 twice with W88-v3 kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - \
            "$WORK/input/stock_boot.img" \
            "$WORK/oldpkg/boot.img" \
            "$WORK/input/new-Image" \
            "$WORK/build/boot-A.img" \
            "$WORK/build/boot-B.img" <<'PY'
          import hashlib
          import struct
          import sys
          from pathlib import Path

          stock_path, old_path, image_path, out_a, out_b = map(Path, sys.argv[1:6])

          STOCK_SHA = "ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5"
          OLD_BOOT_SHA = "2baffafce260348c247674c5e8176408d45dc75b35ccbf7ca5834cbb4679398e"
          OLD_KERNEL_SHA = "e036175ada602df3bcb443da7c390e8cd4b0e900c26fbfa313725db02855ec96"
          NEW_IMAGE_SHA = "d0f7abcc526ec63413236fd440cef2d9fb6cc3819ce656b1b49efde7d65cda04"
          RAMDISK_SHA = "0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a"
          OLD_KERNEL_BYTES = 29839872
          FINAL_BYTES = 134217728

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def align(value, size=4096):
              return (value + size - 1) // size * size

          def need(condition, message):
              if not condition:
                  raise SystemExit("ERROR: " + message)

          def parse_footer(data):
              raw = data[-64:]
              need(raw[:4] == b"AVBf", "AVB footer magic")
              major, minor = struct.unpack_from(">II", raw, 4)
              original, offset, size = struct.unpack_from(">QQQ", raw, 12)
              need(offset + size <= len(data) - 64, "AVB footer geometry")
              return {
                  "major": major,
                  "minor": minor,
                  "original": original,
                  "offset": offset,
                  "size": size,
                  "raw": raw,
                  "vbmeta": data[offset:offset + size],
              }

          def parse_vbmeta(vb):
              need(vb[:4] == b"AVB0", "AVB0 magic")
              auth_size, aux_size = struct.unpack_from(">QQ", vb, 12)
              algorithm_type = struct.unpack_from(">I", vb, 28)[0]
              values = struct.unpack_from(">QQQQQQQQQQQ", vb, 32)
              descriptors_offset = values[8]
              descriptors_size = values[9]
              aux_start = 256 + auth_size
              pos = aux_start + descriptors_offset
              end = pos + descriptors_size
              need(end <= aux_start + aux_size, "AVB descriptor geometry")

              descriptors = []
              while pos < end:
                  tag, following = struct.unpack_from(">QQ", vb, pos)
                  raw = vb[pos:pos + 16 + following]
                  need(len(raw) == 16 + following, "truncated AVB descriptor")

                  item = {"tag": tag, "offset": pos, "raw": raw}
                  if tag == 2:
                      image_size = struct.unpack_from(">Q", raw, 16)[0]
                      algorithm = raw[24:56].split(b"\0", 1)[0].decode("ascii", "replace")
                      name_len, salt_len, digest_len, flags = struct.unpack_from(">IIII", raw, 56)
                      q = 132
                      partition = raw[q:q + name_len].decode("ascii", "replace")
                      q += name_len
                      salt = raw[q:q + salt_len]
                      q += salt_len
                      digest = raw[q:q + digest_len]
                      item.update({
                          "type": "hash",
                          "image_size": image_size,
                          "hash_algorithm": algorithm,
                          "partition": partition,
                          "salt": salt,
                          "digest": digest,
                          "digest_offset": pos + q,
                          "digest_len": digest_len,
                          "image_size_offset": pos + 16,
                          "flags": flags,
                      })
                  else:
                      item["type"] = "other"

                  descriptors.append(item)
                  pos += 16 + following

              need(pos == end, "AVB descriptor parse end")
              return {"algorithm_type": algorithm_type, "descriptors": descriptors}

          def boot_hash_descriptor(info):
              found = [
                  d for d in info["descriptors"]
                  if d.get("type") == "hash" and d.get("partition") == "boot"
              ]
              need(len(found) == 1, "one boot hash descriptor")
              return found[0]

          def verify_descriptor(data, descriptor):
              need(descriptor["hash_algorithm"] == "sha256", "AVB hash algorithm")
              calculated = hashlib.sha256(
                  descriptor["salt"] + data[:descriptor["image_size"]]
              ).digest()
              return calculated == descriptor["digest"], calculated

          stock = stock_path.read_bytes()
          old_boot = old_path.read_bytes()
          new_image = image_path.read_bytes()

          need(len(stock) == FINAL_BYTES, "stock boot size")
          need(sha(stock) == STOCK_SHA, "stock boot hash")
          need(len(old_boot) == FINAL_BYTES, "historical boot size")
          need(sha(old_boot) == OLD_BOOT_SHA, "historical boot hash")
          need(len(new_image) == 29843968, "W88 Image size")
          need(sha(new_image) == NEW_IMAGE_SHA, "W88 Image hash")

          need(stock[:8] == b"ANDROID!", "stock Android boot magic")
          need(old_boot[:8] == b"ANDROID!", "historical Android boot magic")

          stock_kernel_size, ramdisk_size, _, header_size = struct.unpack_from("<4I", stock, 8)
          header_version = struct.unpack_from("<I", stock, 40)[0]

          need(stock_kernel_size == 45480448, "stock kernel size")
          need(ramdisk_size == 22061278, "stock ramdisk size")
          need(header_size == 1580, "Boot v3 header size")
          need(header_version == 3, "Boot v3 header version")

          stock_ramdisk_offset = 4096 + align(stock_kernel_size)
          ramdisk = stock[stock_ramdisk_offset:stock_ramdisk_offset + ramdisk_size]
          need(sha(ramdisk) == RAMDISK_SHA, "stock ramdisk hash")

          stock_footer = parse_footer(stock)
          need((stock_footer["major"], stock_footer["minor"]) == (1, 0), "stock AVB footer version")
          need(stock_footer["size"] == 896, "stock embedded vbmeta size")

          stock_vbmeta = parse_vbmeta(stock_footer["vbmeta"])
          need(stock_vbmeta["algorithm_type"] == 0, "embedded vbmeta algorithm NONE")
          stock_desc = boot_hash_descriptor(stock_vbmeta)
          ok, _ = verify_descriptor(stock, stock_desc)
          need(ok, "stock embedded boot hash descriptor")

          old_kernel_size = struct.unpack_from("<I", old_boot, 8)[0]
          old_kernel = old_boot[4096:4096 + old_kernel_size]
          need(old_kernel_size == OLD_KERNEL_BYTES, "historical kernel size")
          need(sha(old_kernel) == OLD_KERNEL_SHA, "historical kernel hash")

          def build_custom(image):
              ramdisk_offset = 4096 + align(len(image))
              payload_end = ramdisk_offset + align(len(ramdisk))

              output = bytearray(len(stock))
              header = bytearray(stock[:4096])
              struct.pack_into("<I", header, 8, len(image))

              output[:4096] = header
              output[4096:4096 + len(image)] = image
              output[ramdisk_offset:ramdisk_offset + len(ramdisk)] = ramdisk

              vbmeta = bytearray(stock_footer["vbmeta"])
              struct.pack_into(">Q", vbmeta, stock_desc["image_size_offset"], payload_end)

              digest = hashlib.sha256(stock_desc["salt"] + bytes(output[:payload_end])).digest()
              d0 = stock_desc["digest_offset"]
              d1 = d0 + stock_desc["digest_len"]
              vbmeta[d0:d1] = digest

              output[payload_end:payload_end + len(vbmeta)] = vbmeta

              footer = bytearray(stock_footer["raw"])
              struct.pack_into(">Q", footer, 12, payload_end)
              struct.pack_into(">Q", footer, 20, payload_end)
              output[-64:] = footer

              result = bytes(output)
              parsed_footer = parse_footer(result)
              parsed_vbmeta = parse_vbmeta(parsed_footer["vbmeta"])
              parsed_desc = boot_hash_descriptor(parsed_vbmeta)
              valid, calculated = verify_descriptor(result, parsed_desc)
              need(valid, "rebuilt embedded boot descriptor")
              need(calculated == digest, "rebuilt AVB digest")

              return result, ramdisk_offset, payload_end, digest.hex()

          calibrated, _, _, _ = build_custom(old_kernel)
          need(calibrated == old_boot, "historical W19/W21 byte calibration")
          need(sha(calibrated) == OLD_BOOT_SHA, "historical calibration hash")

          a, ramdisk_offset, payload_end, digest = build_custom(new_image)
          b, ramdisk_offset_b, payload_end_b, digest_b = build_custom(new_image)

          need(a == b, "A/B boot reconstruction identity")
          need(ramdisk_offset == ramdisk_offset_b == 29851648, "new ramdisk offset")
          need(payload_end == payload_end_b == 51916800, "new payload end")
          need(digest == digest_b, "A/B AVB digest identity")
          need(len(a) == FINAL_BYTES, "final boot size")

          kernel_size = struct.unpack_from("<I", a, 8)[0]
          embedded_kernel = a[4096:4096 + kernel_size]
          embedded_ramdisk = a[ramdisk_offset:ramdisk_offset + ramdisk_size]

          need(kernel_size == len(new_image), "embedded W88 kernel size")
          need(sha(embedded_kernel) == NEW_IMAGE_SHA, "embedded W88 kernel hash")
          need(embedded_ramdisk == ramdisk, "stock ramdisk byte preservation")

          text_offset, image_size, flags = struct.unpack_from("<QQQ", new_image, 8)
          arm_magic, arm_res5 = struct.unpack_from("<II", new_image, 56)
          need(text_offset == 0x80000, "ARM64 text_offset")
          need(image_size == 38825984, "ARM64 image_size")
          need(flags == 0xA, "ARM64 flags")
          need(arm_magic == 0x644D5241, "ARM64 magic")
          need(arm_res5 == 0x40, "ARM64 res5")

          final_footer = parse_footer(a)
          need(final_footer["original"] == payload_end, "final AVB original image size")
          need(final_footer["offset"] == payload_end, "final AVB vbmeta offset")
          need(final_footer["size"] == 896, "final AVB vbmeta size")

          out_a.write_bytes(a)
          out_b.write_bytes(b)

          print("BOOT_RECONSTRUCTION=PASS")
          print("HISTORICAL_W19_W21_CALIBRATION=PASS")
          print("BUILD_A_B_IDENTICAL=YES")
          print("BOOT_SHA256=" + sha(a))
          print("BOOT_BYTES=" + str(len(a)))
          print("EMBEDDED_IMAGE_SHA256=" + sha(embedded_kernel))
          print("RAMDISK_SHA256=" + sha(embedded_ramdisk))
          print("RAMDISK_OFFSET=" + str(ramdisk_offset))
          print("PAYLOAD_END=" + str(payload_end))
          print("EMBEDDED_AVB_DIGEST=" + digest)
          PY

          cmp -s "$WORK/build/boot-A.img" "$WORK/build/boot-B.img"
          cp "$WORK/build/boot-A.img" "$WORK/release/boot.img"

      - name: Independently audit final boot.img
        shell: bash
        run: |
          set -euo pipefail

          BOOT="$WORK/release/boot.img"
          test -s "$BOOT"
          test "$(stat -c '%s' "$BOOT")" = "$STOCK_BOOT_BYTES"

          python3 - "$BOOT" "$WORK/input/new-Image" <<'PY'
          import hashlib
          import struct
          import sys
          from pathlib import Path

          boot = Path(sys.argv[1]).read_bytes()
          image = Path(sys.argv[2]).read_bytes()

          EXPECT_IMAGE = "d0f7abcc526ec63413236fd440cef2d9fb6cc3819ce656b1b49efde7d65cda04"
          EXPECT_RAMDISK = "0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a"

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def need(cond, msg):
              if not cond:
                  raise SystemExit("ERROR: " + msg)

          need(len(boot) == 134217728, "boot.img size")
          need(boot[:8] == b"ANDROID!", "Android boot magic")

          kernel_size = struct.unpack_from("<I", boot, 8)[0]
          ramdisk_size = struct.unpack_from("<I", boot, 12)[0]
          header_size = struct.unpack_from("<I", boot, 20)[0]
          header_version = struct.unpack_from("<I", boot, 40)[0]

          need(kernel_size == 29843968, "kernel size")
          need(ramdisk_size == 22061278, "ramdisk size")
          need(header_size == 1580, "header size")
          need(header_version == 3, "header version")

          ramdisk_offset = 29851648
          kernel = boot[4096:4096 + kernel_size]
          ramdisk = boot[ramdisk_offset:ramdisk_offset + ramdisk_size]

          need(kernel == image, "embedded kernel byte identity")
          need(sha(kernel) == EXPECT_IMAGE, "embedded kernel SHA-256")
          need(sha(ramdisk) == EXPECT_RAMDISK, "stock ramdisk SHA-256")

          footer = boot[-64:]
          need(footer[:4] == b"AVBf", "AVB footer")
          major, minor = struct.unpack_from(">II", footer, 4)
          original, vbmeta_offset, vbmeta_size = struct.unpack_from(">QQQ", footer, 12)

          need((major, minor) == (1, 0), "AVB footer version")
          need(original == 51916800, "AVB original size")
          need(vbmeta_offset == 51916800, "AVB vbmeta offset")
          need(vbmeta_size == 896, "AVB vbmeta size")

          vbmeta = boot[vbmeta_offset:vbmeta_offset + vbmeta_size]
          need(vbmeta[:4] == b"AVB0", "embedded AVB0")
          need(struct.unpack_from(">I", vbmeta, 28)[0] == 0, "vbmeta algorithm NONE")

          auth_size, aux_size = struct.unpack_from(">QQ", vbmeta, 12)
          vals = struct.unpack_from(">QQQQQQQQQQQ", vbmeta, 32)
          desc_off, desc_size = vals[8], vals[9]
          pos = 256 + auth_size + desc_off
          end = pos + desc_size
          found = None

          while pos < end:
              tag, following = struct.unpack_from(">QQ", vbmeta, pos)
              raw = vbmeta[pos:pos + 16 + following]
              need(len(raw) == 16 + following, "descriptor length")
              if tag == 2:
                  image_size = struct.unpack_from(">Q", raw, 16)[0]
                  algo = raw[24:56].split(b"\0", 1)[0].decode()
                  name_len, salt_len, digest_len, _ = struct.unpack_from(">IIII", raw, 56)
                  q = 132
                  name = raw[q:q + name_len].decode()
                  q += name_len
                  salt = raw[q:q + salt_len]
                  q += salt_len
                  digest = raw[q:q + digest_len]
                  if name == "boot":
                      need(found is None, "duplicate boot descriptor")
                      found = (image_size, algo, salt, digest)
              pos += 16 + following

          need(found is not None, "boot hash descriptor")
          image_size, algo, salt, digest = found
          need(algo == "sha256", "boot hash algorithm")
          need(image_size == 51916800, "boot descriptor image size")
          calculated = hashlib.sha256(salt + boot[:image_size]).digest()
          need(calculated == digest, "embedded AVB boot digest")

          print("FINAL_BOOT_AUDIT=PASS")
          print("BOOT_SHA256=" + sha(boot))
          print("BOOT_BYTES=" + str(len(boot)))
          print("EMBEDDED_IMAGE_SHA256=" + sha(kernel))
          print("STOCK_RAMDISK_PRESERVED=YES")
          print("BOOT_HEADER_VERSION=3")
          print("EMBEDDED_AVB_HASH_VALID=YES")
          PY

          (
            cd "$WORK/release"
            sha256sum boot.img > boot.img.sha256
          )

          test "$(find "$WORK/release" -maxdepth 1 -type f | wc -l)" -eq 2

          echo "FINAL_RESULT=PASS_GEN1_W90_BOOT_IMG"
          echo "DEVICE_SCOPE=VEUX"
          echo "KERNEL_VERSION=5.4.274"
          echo "ANDROID_VERSION=13"
          echo "ROM_TARGET=HyperOS_OS1.0.12.0.TKCMIXM"
          echo "RESUKISU_PIN=$RESUKISU_COMMIT"
          echo "SUSFS_VERSION=2.2"
          echo "IMAGE_SHA256=$IMAGE_SHA256"
          echo "BOOT_SHA256=$(sha256sum "$BOOT" | awk '{print $1}')"
          echo "BOOT_BYTES=$(stat -c '%s' "$BOOT")"
          echo "REAL_DEVICE_BOOT_TEST=NO"
          echo "FLASHING_PERFORMED=NO"

      - name: Upload final boot.img only
        uses: actions/upload-artifact@v6
        with:
          name: GEN1_W90_5.4.274_ReSukiSU_419E270B_BOOT_IMG-${{ github.run_number }}
          path: |
            gen1-w90-v1/release/boot.img
            gen1-w90-v1/release/boot.img.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
