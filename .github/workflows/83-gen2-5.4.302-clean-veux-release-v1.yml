name: 83 - GEN2 5.4.302 Clean VEUX Release v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gen2-83-clean-veux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: W83 pinned AnyKernel3 clean release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      GEN2_KERNEL_PIN: f4b8a13a43a130a9aab83cc985ce4d4421291ae6
      RESUKISU_PIN: 4a3785025a920e4f52584f14c663eea4850dc919
      LOCKED_IMAGE_SHA256: 2448b0ee28ebb5c3781c22b29caa417a97e0662b093878477bbb4368a45f54f3
      W80_BOOT_SHA256: d9a12c8075cf6e69ff530776aee59f46ee173a6ce1154f3220c439c9a23baef3
      W80_BOOT_BYTES: "133300224"
      BOOT_PARTITION_BYTES: "134217728"
      RAMDISK_LOGICAL_SHA256: 3cd0bac38ce9288982337bcb04cded7398bb2f20dc7636551446137f5fcae4d1
      AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
      AK3_PIN: af770f7b16cf8f8eb7c68614b2a693b3b361c90c
      W80_ARTIFACT_PREFIX: GEN2_W80_5.4.302_ReSukiSU_4A378502_VERIFIED_BOOT-
      FINAL_AK3: VEUX_5.4.302_ReSukiSU_4A378502_SUSFS_2.2_CLEAN_AK3_W83.zip
      FINAL_BOOT: VEUX_5.4.302_ReSukiSU_4A378502_SUSFS_2.2_CLEAN_boot_W83.img

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lz4 cpio
          mkdir -p w83/{input,ak3,release,evidence,bootcheck}

      - name: Acquire exact W80 verified boot artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          VERSION="X-GitHub-Api-Version: 2022-11-28"

          : > w83/evidence/artifacts.ndjson
          page=1
          while :; do
            json="w83/evidence/artifacts-page-${page}.json"
            curl -fsSL -H "$AUTH" -H "$ACCEPT" -H "$VERSION" \
              "$API/actions/artifacts?per_page=100&page=${page}" -o "$json"

            count="$(jq '.artifacts | length' "$json")"
            jq -c '.artifacts[]' "$json" >> w83/evidence/artifacts.ndjson
            [ "$count" -lt 100 ] && break

            page=$((page + 1))
            [ "$page" -le 100 ] || {
              echo "ERROR: artifact pagination safety limit reached"
              exit 1
            }
          done

          jq -s '{artifacts:.}' w83/evidence/artifacts.ndjson \
            > w83/evidence/artifacts.json

          artifact_id="$(
            jq -r --arg p "$W80_ARTIFACT_PREFIX" '
              [.artifacts[]
               | select((.expired == false) and (.name | startswith($p)))]
              | sort_by(.created_at) | reverse | .[0].id // empty
            ' w83/evidence/artifacts.json
          )"
          test -n "$artifact_id"

          artifact_name="$(
            jq -r --argjson id "$artifact_id" '
              .artifacts[] | select(.id == $id) | .name
            ' w83/evidence/artifacts.json
          )"
          test -n "$artifact_name"

          curl -fLsS -H "$AUTH" -H "$ACCEPT" -H "$VERSION" \
            "$API/actions/artifacts/$artifact_id/zip" \
            -o w83/input/W80.zip

          unzip -t w83/input/W80.zip >/dev/null
          unzip -q w83/input/W80.zip -d w83/input/W80

          boot="$(
            find w83/input/W80 -type f \
              -name 'VEUX_5.4.302_ReSukiSU_4A378502_SUSFS_2.2_W80_boot.img' \
              -print -quit
          )"
          test -n "$boot"
          test "$(stat -c '%s' "$boot")" = "$W80_BOOT_BYTES"
          test "$(sha256sum "$boot" | awk '{print $1}')" = "$W80_BOOT_SHA256"

          cp "$boot" "w83/release/$FINAL_BOOT"

          {
            echo "W80_SOURCE_ARTIFACT=$artifact_name"
            echo "W80_SOURCE_ARTIFACT_ID=$artifact_id"
            echo "W80_SOURCE_BOOT_SHA256=$W80_BOOT_SHA256"
            echo "W80_SOURCE_BOOT_BYTES=$W80_BOOT_BYTES"
          } > w83/evidence/W83-SOURCE.txt

      - name: Extract and verify locked kernel from boot
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct

          p = Path("w83/release/VEUX_5.4.302_ReSukiSU_4A378502_SUSFS_2.2_CLEAN_boot_W83.img")
          b = p.read_bytes()
          assert b[:8] == b"ANDROID!"
          kernel_size = struct.unpack_from("<I", b, 8)[0]
          header_size = struct.unpack_from("<I", b, 20)[0]
          header_version = struct.unpack_from("<I", b, 40)[0]
          assert header_version == 3
          page = 4096
          off = ((header_size + page - 1) // page) * page
          kernel = b[off:off + kernel_size]
          assert kernel[56:60] == b"ARMd"
          Path("w83/input/Image").write_bytes(kernel)
          print("HEADER_VERSION=3")
          print("KERNEL_BYTES=" + str(len(kernel)))
          print("KERNEL_SHA256=" + hashlib.sha256(kernel).hexdigest())
          PY

          test "$(sha256sum w83/input/Image | awk '{print $1}')" = "$LOCKED_IMAGE_SHA256"
          file w83/input/Image | tee w83/evidence/W83-IMAGE-FILE.txt
          grep -q 'ARM64 boot executable Image' w83/evidence/W83-IMAGE-FILE.txt

      - name: Build pinned VEUX-only AnyKernel3 package
        shell: bash
        run: |
          set -euo pipefail

          git clone -q "$AK3_REPO" w83/ak3/repo
          git -C w83/ak3/repo checkout -q --detach "$AK3_PIN"
          test "$(git -C w83/ak3/repo rev-parse HEAD)" = "$AK3_PIN"

          rm -rf \
            w83/ak3/repo/.git \
            w83/ak3/repo/.github \
            w83/ak3/repo/ramdisk \
            w83/ak3/repo/patch \
            w83/ak3/repo/modules \
            w83/ak3/repo/system

          # Documentation is not required for the flash payload; retain LICENSE only.
          rm -f w83/ak3/repo/README.md

          cat > w83/ak3/repo/anykernel.sh <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ## VEUX kernel-only package

          properties() { '
          kernel.string=VEUX Linux 5.4.302 ReSukiSU 4a378502 SUSFS 2.2
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=veux
          supported.versions=16
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
            set_perm_recursive 0 0 755 644 $RAMDISK/*;
            set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          SLOT_SELECT=active;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=0;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          AK3

          cp w83/input/Image w83/ak3/repo/Image

          # No generic example-device residue may remain in the installer script.
          ! grep -Eiq 'tuna|maguro|toro|toroplus|omap|peux' w83/ak3/repo/anykernel.sh
          grep -q '^device.name1=veux$' w83/ak3/repo/anykernel.sh
          test "$(grep -c '^device\.name[0-9]=' w83/ak3/repo/anykernel.sh)" -eq 1
          grep -q '^BLOCK=boot;$' w83/ak3/repo/anykernel.sh
          grep -q '^IS_SLOT_DEVICE=1;$' w83/ak3/repo/anykernel.sh
          grep -q '^SLOT_SELECT=active;$' w83/ak3/repo/anykernel.sh

          # Package must contain no development/control files.
          test ! -e w83/ak3/repo/.git
          test ! -e w83/ak3/repo/.github
          test ! -e w83/ak3/repo/README.md
          test -e w83/ak3/repo/LICENSE

          # Scan text payload for explicit AI-service/model references.
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path("w83/ak3/repo")
          banned = re.compile(
              r"chatgpt|openai|gpt-[0-9]|large language model|"
              r"\bllm\b|copilot|claude|gemini",
              re.I,
          )
          hits = []
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              try:
                  s = p.read_text("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for n, line in enumerate(s.splitlines(), 1):
                  if banned.search(line):
                      hits.append(f"{p}:{n}:{line}")
          if hits:
              print("\n".join(hits))
              sys.exit("explicit AI reference found")
          print("EXPLICIT_AI_REFERENCE_SCAN=PASS")
          PY

          (
            cd w83/ak3/repo
            find . -type f -exec touch -h -d '@315532800' {} +
            find . -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 zip -X -9 "../../release/$FINAL_AK3" >/dev/null
          )

          unzip -t "w83/release/$FINAL_AK3" \
            | tee w83/evidence/W83-AK3-UNZIP-TEST.txt
          grep -q 'No errors detected' w83/evidence/W83-AK3-UNZIP-TEST.txt

          unzip -p "w83/release/$FINAL_AK3" Image \
            > w83/evidence/W83-AK3-EMBEDDED-IMAGE
          test "$(
            sha256sum w83/evidence/W83-AK3-EMBEDDED-IMAGE | awk '{print $1}'
          )" = "$LOCKED_IMAGE_SHA256"

          unzip -Z1 "w83/release/$FINAL_AK3" \
            | tee w83/evidence/W83-AK3-CONTENTS.txt

          ! grep -Eiq \
            '(^|/)(\.git|\.github)(/|$)|workflow|evidence|report|verdict|build[-_]?log|scratch|tmp/' \
            w83/evidence/W83-AK3-CONTENTS.txt

      - name: Controlled simulated boot validation
        shell: bash
        run: |
          set -euo pipefail

          boot="w83/release/$FINAL_BOOT"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct

          p = Path("w83/release/VEUX_5.4.302_ReSukiSU_4A378502_SUSFS_2.2_CLEAN_boot_W83.img")
          b = p.read_bytes()

          assert hashlib.sha256(b).hexdigest() == "d9a12c8075cf6e69ff530776aee59f46ee173a6ce1154f3220c439c9a23baef3"
          assert len(b) == 133300224
          assert len(b) <= 134217728
          assert b[:8] == b"ANDROID!"

          kernel_size, ramdisk_size, os_version, header_size = struct.unpack_from("<4I", b, 8)
          header_version = struct.unpack_from("<I", b, 40)[0]
          assert header_version == 3

          android_major = (os_version >> 25) & 0x7f
          patch_year = ((os_version >> 4) & 0x7f) + 2000
          patch_month = os_version & 0xf
          assert android_major == 16
          assert (patch_year, patch_month) == (2026, 4)

          page = 4096
          align = lambda x: ((x + page - 1) // page) * page
          kernel_off = align(header_size)
          ramdisk_off = kernel_off + align(kernel_size)

          kernel = b[kernel_off:kernel_off + kernel_size]
          ramdisk = b[ramdisk_off:ramdisk_off + ramdisk_size]

          assert kernel[56:60] == b"ARMd"
          assert hashlib.sha256(kernel).hexdigest() == "2448b0ee28ebb5c3781c22b29caa417a97e0662b093878477bbb4368a45f54f3"
          assert ramdisk[:4] == b"\x02\x21\x4c\x18"

          Path("w83/bootcheck/ramdisk.lz4").write_bytes(ramdisk)
          Path("w83/bootcheck/layout.txt").write_text(
              f"BOOT_MAGIC=PASS\n"
              f"HEADER_VERSION={header_version}\n"
              f"ANDROID_MAJOR={android_major}\n"
              f"SECURITY_PATCH={patch_year:04d}-{patch_month:02d}\n"
              f"KERNEL_OFFSET={kernel_off}\n"
              f"KERNEL_BYTES={kernel_size}\n"
              f"RAMDISK_OFFSET={ramdisk_off}\n"
              f"RAMDISK_COMPRESSED_BYTES={ramdisk_size}\n"
              f"PARTITION_FIT=PASS\n",
              encoding="utf-8",
          )
          PY

          lz4 -d -f w83/bootcheck/ramdisk.lz4 \
            w83/bootcheck/ramdisk.cpio >/dev/null 2>&1

          test "$(
            sha256sum w83/bootcheck/ramdisk.cpio | awk '{print $1}'
          )" = "$RAMDISK_LOGICAL_SHA256"

          (
            cd w83/bootcheck
            cpio -it < ramdisk.cpio
          ) > w83/evidence/W83-RAMDISK-CONTENTS.txt 2>&1

          grep -qx 'init' w83/evidence/W83-RAMDISK-CONTENTS.txt
          grep -qx 'first_stage_ramdisk' w83/evidence/W83-RAMDISK-CONTENTS.txt

          strings -a -n 8 "$boot" \
            | grep -m1 '^Linux version 5\.4\.302~positron/f4b8a13a ' \
            > w83/evidence/W83-KERNEL-VERSION.txt

          {
            echo "W83_SIMULATED_BOOT_TEST=PASS"
            echo "BOOT_CONTAINER_PARSE=PASS"
            echo "ANDROID_BOOT_MAGIC=PASS"
            echo "BOOT_HEADER_VERSION=3"
            echo "ANDROID_VERSION=16"
            echo "SECURITY_PATCH=2026-04"
            echo "BOOT_PARTITION_FIT=PASS"
            echo "ARM64_KERNEL_HEADER=PASS"
            echo "LOCKED_KERNEL_HASH=PASS"
            echo "RAMDISK_LZ4_DECOMPRESSION=PASS"
            echo "RAMDISK_CPIO_INTEGRITY=PASS"
            echo "RAMDISK_INIT_PRESENT=YES"
            echo "FIRST_STAGE_RAMDISK_PRESENT=YES"
            echo "DEVICE_BOOT_CONFIRMED=NO"
            echo "REAL_DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } > w83/evidence/W83-SIMULATED-BOOT-TEST.txt

      - name: Final clean-release audit
        shell: bash
        run: |
          set -euo pipefail

          ak3="w83/release/$FINAL_AK3"
          boot="w83/release/$FINAL_BOOT"

          ak3_sha="$(sha256sum "$ak3" | awk '{print $1}')"
          boot_sha="$(sha256sum "$boot" | awk '{print $1}')"
          ak3_bytes="$(stat -c '%s' "$ak3")"
          boot_bytes="$(stat -c '%s' "$boot")"

          test "$boot_sha" = "$W80_BOOT_SHA256"
          test "$boot_bytes" = "$W80_BOOT_BYTES"

          {
            sha256sum "$ak3"
            sha256sum "$boot"
          } > w83/release/W83-SHA256SUMS.txt

          cat > w83/release/W83-CLEAN-RELEASE-VERDICT.txt <<EOF
          W83_GEN2_CLEAN_RELEASE=PASS
          DEVICE=veux
          KERNEL_VERSION=5.4.302
          GEN2_KERNEL_PIN=$GEN2_KERNEL_PIN
          RESUKISU_PIN=$RESUKISU_PIN
          LOCKED_IMAGE_SHA256=$LOCKED_IMAGE_SHA256
          AK3_PIN=$AK3_PIN
          AK3_PIN_VERIFIED=YES
          AK3_DEVICE_SCOPE=VEUX_ONLY
          GENERIC_TUNA_OMAP_PATCHES=REMOVED
          PEUX_ALIAS=REMOVED
          DEVELOPMENT_CONTROL_FILES_IN_AK3=NO
          EXPLICIT_AI_REFERENCES_IN_AK3=NO
          AK3_EMBEDDED_IMAGE_HASH_VERIFIED=YES
          AK3_FILENAME=$FINAL_AK3
          AK3_SHA256=$ak3_sha
          AK3_BYTES=$ak3_bytes
          BOOT_FILENAME=$FINAL_BOOT
          BOOT_SHA256=$boot_sha
          BOOT_BYTES=$boot_bytes
          BOOT_REPACK_CHANGED_FROM_W80=NO
          RAMDISK_LOGICALLY_PRESERVED=YES
          SIMULATED_BOOT_TEST=PASS
          REAL_DEVICE_BOOT_TEST=NOT_PERFORMED
          DEVICE_BOOT_CONFIRMED=NO
          REAL_DEVICE_ACCESSED=NO
          FLASHING_PERFORMED=NO
          RELEASE_DISTRIBUTION_STATUS=READY_WITHOUT_REAL_DEVICE_VALIDATION
          EOF

          # Reports are kept beside the distributable files, never embedded
          # inside the AnyKernel3 ZIP.
          grep -q '^W83_GEN2_CLEAN_RELEASE=PASS$' \
            w83/release/W83-CLEAN-RELEASE-VERDICT.txt

          cp w83/evidence/W83-SIMULATED-BOOT-TEST.txt w83/release/
          cp w83/evidence/W83-AK3-CONTENTS.txt w83/release/

          echo "===== W83 FINAL VERDICT ====="
          cat w83/release/W83-CLEAN-RELEASE-VERDICT.txt

      - name: Upload W83 clean release
        uses: actions/upload-artifact@v4
        with:
          name: GEN2_W83_5.4.302_ReSukiSU_4A378502_CLEAN_RELEASE-${{ github.run_number }}
          path: w83/release/
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
