name: 15 - GEN2 SUSFS v2.2 OPEN_REDIRECT Fixset Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout pinned ReSukiSU reference
        uses: actions/checkout@v6
        with:
          repository: ReSukiSU/ReSukiSU
          ref: faccf4c5edc7be37776216e7d43dd3dca0239331
          path: resukisu
          fetch-depth: 1

      - name: Fetch full SUSFS history
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          git -C susfs fetch origin gki-android12-5.10

          for sha in \
            4003ecf2d01c6d13fa8edf6c4f2607365738dc3d \
            be08face56c347e7ba9c4fb420c2463598a14f5d \
            86bb893e9a103b97d17045306f35eb239a623f2a \
            c5723cc09c19786fcb701d25a8097e2edbee412a \
            3c14ad549f826b1f53878ec8c12253efebeed75a
          do
            git -C susfs cat-file -e "${sha}^{commit}"
          done

      - name: Audit exact ancestry closure from v2.2 to final selected fix
        shell: bash
        run: |
          set -euo pipefail

          V220='4003ecf2d01c6d13fa8edf6c4f2607365738dc3d'
          LAST='3c14ad549f826b1f53878ec8c12253efebeed75a'

          {
            echo "V220=$V220"
            echo "LAST_SELECTED_FIX=$LAST"
            echo

            echo "=== All ancestry-path commits ==="
            git -C susfs log \
              --reverse \
              --ancestry-path \
              --format='%H|%cI|%s' \
              "$V220..$LAST"

            echo
            echo "=== Ancestry-path commits touching kernel_patches ==="
            git -C susfs log \
              --reverse \
              --ancestry-path \
              --format='%H|%cI|%s' \
              "$V220..$LAST" \
              -- kernel_patches

            echo
            echo "=== Selected four commits ==="
            for sha in \
              be08face56c347e7ba9c4fb420c2463598a14f5d \
              86bb893e9a103b97d17045306f35eb239a623f2a \
              c5723cc09c19786fcb701d25a8097e2edbee412a \
              3c14ad549f826b1f53878ec8c12253efebeed75a
            do
              git -C susfs show -s \
                --format='%H|%cI|%s|PARENTS=%P' \
                "$sha"
            done
          } | tee fixset-ancestry-closure.txt

      - name: Classify every kernel-patch commit in ancestry closure
        shell: bash
        run: |
          set -euo pipefail

          V220='4003ecf2d01c6d13fa8edf6c4f2607365738dc3d'
          LAST='3c14ad549f826b1f53878ec8c12253efebeed75a'

          selected='
          be08face56c347e7ba9c4fb420c2463598a14f5d
          86bb893e9a103b97d17045306f35eb239a623f2a
          c5723cc09c19786fcb701d25a8097e2edbee412a
          3c14ad549f826b1f53878ec8c12253efebeed75a
          '

          {
            while IFS= read -r sha; do
              subject="$(git -C susfs show -s --format='%s' "$sha")"

              if printf '%s\n' "$selected" | grep -q "$sha"; then
                selected_state='YES'
              else
                selected_state='NO'
              fi

              if git -C susfs show \
                --format= \
                "$sha" \
                -- kernel_patches \
                | grep -qiE \
                  'OPEN_REDIRECT|open_redirect|susfs_srcu_open_redirect|synchronize_srcu|synchronize_rcu'; then
                open_redirect_state='YES'
              else
                open_redirect_state='NO'
              fi

              echo "COMMIT=$sha SELECTED=$selected_state OPEN_REDIRECT_RELATED=$open_redirect_state SUBJECT=$subject"
            done < <(
              git -C susfs rev-list \
                --reverse \
                --ancestry-path \
                "$V220..$LAST" \
                -- kernel_patches
            )
          } | tee fixset-closure-classification.txt

      - name: Export exact selected commit diffs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p selected-diffs

          for sha in \
            be08face56c347e7ba9c4fb420c2463598a14f5d \
            86bb893e9a103b97d17045306f35eb239a623f2a \
            c5723cc09c19786fcb701d25a8097e2edbee412a \
            3c14ad549f826b1f53878ec8c12253efebeed75a
          do
            git -C susfs show \
              --binary \
              --format='COMMIT=%H%nDATE=%cI%nSUBJECT=%s%n' \
              "$sha" \
              -- kernel_patches \
              > "selected-diffs/${sha}.diff"
          done

          {
            for f in selected-diffs/*.diff; do
              echo "================================================================"
              echo "FILE=$f"
              grep -E \
                '^COMMIT=|^DATE=|^SUBJECT=|^diff --git |^@@' \
                "$f" || true
              echo
            done
          } | tee selected-fix-hunk-map.txt

      - name: Materialize synthetic v2.2 plus selected fixset
        shell: bash
        run: |
          set -euo pipefail

          V220='4003ecf2d01c6d13fa8edf6c4f2607365738dc3d'

          git clone \
            --no-local \
            susfs \
            susfs-fixset

          git -C susfs-fixset checkout \
            --detach \
            "$V220"

          success=YES

          : > fixset-apply-status.txt

          for sha in \
            be08face56c347e7ba9c4fb420c2463598a14f5d \
            86bb893e9a103b97d17045306f35eb239a623f2a \
            c5723cc09c19786fcb701d25a8097e2edbee412a \
            3c14ad549f826b1f53878ec8c12253efebeed75a
          do
            echo "APPLYING=$sha" \
              | tee -a fixset-apply-status.txt

            if git -C susfs-fixset cherry-pick \
              --no-commit \
              "$sha"; then
              echo "STATUS=CLEAN" \
                | tee -a fixset-apply-status.txt
            else
              echo "STATUS=CONFLICT" \
                | tee -a fixset-apply-status.txt

              git -C susfs-fixset status --short \
                | tee -a fixset-apply-status.txt

              success=NO
              git -C susfs-fixset reset --hard "$V220"
              break
            fi
          done

          echo "FIXSET_MATERIALIZATION=$success" \
            | tee -a fixset-apply-status.txt

          if [ "$success" = YES ]; then
            git -C susfs-fixset diff \
              --binary \
              "$V220" \
              -- kernel_patches \
              > GEN2_15_SUSFS_V220_OPENREDIRECT_FIXSET.patch

            test -s GEN2_15_SUSFS_V220_OPENREDIRECT_FIXSET.patch
          else
            printf '%s\n' \
              'Synthetic fixset could not be materialized cleanly.' \
              > GEN2_15_SUSFS_V220_OPENREDIRECT_FIXSET.patch
          fi

      - name: Audit synthetic fixset scope
        shell: bash
        run: |
          set -euo pipefail

          V220='4003ecf2d01c6d13fa8edf6c4f2607365738dc3d'

          {
            echo "=== Synthetic fixset changed paths ==="
            git -C susfs-fixset diff \
              --name-status \
              "$V220" \
              -- kernel_patches || true

            echo
            echo "=== Synthetic fixset stat ==="
            git -C susfs-fixset diff \
              --stat \
              "$V220" \
              -- kernel_patches || true

            echo
            echo "=== Synthetic fixset OPEN_REDIRECT/SRCU markers ==="
            git -C susfs-fixset diff \
              "$V220" \
              -- kernel_patches \
              | grep -E \
                'OPEN_REDIRECT|open_redirect|synchronize_srcu|synchronize_rcu|susfs_srcu_open_redirect|do_tmpfile|do_o_path|path_openat|show_map_vma|O_TRUNC' \
              || true
          } | tee synthetic-fixset-scope.txt

      - name: Compare synthetic fixset with final selected commit
        shell: bash
        run: |
          set -euo pipefail

          LAST='3c14ad549f826b1f53878ec8c12253efebeed75a'

          if ! grep -q '^FIXSET_MATERIALIZATION=YES$' \
            fixset-apply-status.txt; then
            echo "FINAL_COMPARISON=SKIPPED_FIXSET_NOT_MATERIALIZED" \
              | tee synthetic-vs-selected-final.txt
            exit 0
          fi

          {
            echo "=== File-level comparison against selected final commit ==="

            for path in \
              kernel_patches/fs/susfs.c \
              kernel_patches/include/linux/susfs.h \
              kernel_patches/include/linux/susfs_def.h \
              kernel_patches/50_add_susfs_in_gki-android12-5.10.patch
            do
              echo "----------------------------------------------------------------"
              echo "PATH=$path"

              tmp="$(mktemp)"
              if git -C susfs show "$LAST:$path" \
                > "$tmp" 2>/dev/null; then

                if cmp -s \
                  "susfs-fixset/$path" \
                  "$tmp"; then
                  echo "MATCH_FINAL_SELECTED_COMMIT=YES"
                else
                  echo "MATCH_FINAL_SELECTED_COMMIT=NO"
                  diff -u \
                    "$tmp" \
                    "susfs-fixset/$path" \
                    | sed -n '1,260p' \
                    || true
                fi
              else
                echo "FINAL_SELECTED_PATH_ABSENT=YES"
              fi

              rm -f "$tmp"
            done
          } | tee synthetic-vs-selected-final.txt

      - name: Audit ReSukiSU to SUSFS API contract
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=== ReSukiSU SUSFS symbol references ==="
            grep -RhoE \
              '\b(susfs_[A-Za-z0-9_]+|SUSFS_[A-Za-z0-9_]+|CMD_SUSFS_[A-Za-z0-9_]+)\b' \
              resukisu/kernel \
              | sort -u

            echo
            echo "=== Synthetic SUSFS exported/declared symbol universe ==="
            grep -RhoE \
              '\b(susfs_[A-Za-z0-9_]+|SUSFS_[A-Za-z0-9_]+|CMD_SUSFS_[A-Za-z0-9_]+)\b' \
              susfs-fixset/kernel_patches/fs/susfs.c \
              susfs-fixset/kernel_patches/include/linux/susfs.h \
              susfs-fixset/kernel_patches/include/linux/susfs_def.h \
              2>/dev/null \
              | sort -u
          } | tee resukisu-susfs-api-universe.txt

          comm -23 \
            <(
              grep -RhoE \
                '\b(susfs_[A-Za-z0-9_]+|SUSFS_[A-Za-z0-9_]+|CMD_SUSFS_[A-Za-z0-9_]+)\b' \
                resukisu/kernel \
                | sort -u
            ) \
            <(
              grep -RhoE \
                '\b(susfs_[A-Za-z0-9_]+|SUSFS_[A-Za-z0-9_]+|CMD_SUSFS_[A-Za-z0-9_]+)\b' \
                susfs-fixset/kernel_patches/fs/susfs.c \
                susfs-fixset/kernel_patches/include/linux/susfs.h \
                susfs-fixset/kernel_patches/include/linux/susfs_def.h \
                2>/dev/null \
                | sort -u
            ) \
            > resukisu-symbols-not-found-in-susfs-universe.txt

          {
            echo "=== ReSukiSU symbols not found in synthetic SUSFS universe ==="
            cat resukisu-symbols-not-found-in-susfs-universe.txt
          } | tee resukisu-susfs-api-gap-summary.txt

      - name: Audit ReSukiSU and synthetic SUSFS feature-config alignment
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=== ReSukiSU SUSFS config symbols ==="
            grep -RhoE \
              'CONFIG_KSU_SUSFS(_[A-Z0-9_]+)?' \
              resukisu/kernel \
              | sort -u

            echo
            echo "=== Synthetic SUSFS kernel-patch config symbols ==="
            grep -RhoE \
              'CONFIG_KSU_SUSFS(_[A-Z0-9_]+)?' \
              susfs-fixset/kernel_patches \
              | sort -u
          } | tee feature-config-alignment.txt

      - name: Write final audit file
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "AUDIT=GEN2_15_SUSFS_V220_OPENREDIRECT_FIXSET"
            echo "RESULT=PASS"
            echo "GEN2_15_SUSFS_V220_OPENREDIRECT_FIXSET_AUDIT=PASS"
            echo "RESUKISU_COMMIT=$(git -C resukisu rev-parse HEAD)"
            echo "SUSFS_V220_COMMIT=4003ecf2d01c6d13fa8edf6c4f2607365738dc3d"
            echo "SELECTED_FIX_1=be08face56c347e7ba9c4fb420c2463598a14f5d"
            echo "SELECTED_FIX_2=86bb893e9a103b97d17045306f35eb239a623f2a"
            echo "SELECTED_FIX_3=c5723cc09c19786fcb701d25a8097e2edbee412a"
            echo "SELECTED_FIX_4=3c14ad549f826b1f53878ec8c12253efebeed75a"
            echo "NO_KERNEL_SOURCE_MODIFIED=YES"
            echo "NO_KERNEL_BUILD_PERFORMED=YES"
            echo
            cat fixset-apply-status.txt
            echo
            cat resukisu-susfs-api-gap-summary.txt
          } | tee GEN2_15_SUSFS_V220_OPENREDIRECT_FIXSET_AUDIT.txt

      - name: Upload final audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GEN2_15_SUSFS_V220_OPENREDIRECT_FIXSET_AUDIT
          path: |
            GEN2_15_SUSFS_V220_OPENREDIRECT_FIXSET_AUDIT.txt
            fixset-ancestry-closure.txt
            fixset-closure-classification.txt
            selected-diffs/
            selected-fix-hunk-map.txt
            fixset-apply-status.txt
            GEN2_15_SUSFS_V220_OPENREDIRECT_FIXSET.patch
            synthetic-fixset-scope.txt
            synthetic-vs-selected-final.txt
            resukisu-susfs-api-universe.txt
            resukisu-symbols-not-found-in-susfs-universe.txt
            resukisu-susfs-api-gap-summary.txt
            feature-config-alignment.txt
          if-no-files-found: warn
          retention-days: 30
