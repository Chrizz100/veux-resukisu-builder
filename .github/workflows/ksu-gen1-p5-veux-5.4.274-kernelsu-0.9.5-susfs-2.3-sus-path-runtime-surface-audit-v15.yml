        gh release download "$P5_V12_V7_PARENT_BACKUP_TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --pattern "$release_asset_name" \
          --dir "$authdir"

        test -s "$authdir/$release_asset_name"
        actual_parent_sha="$(
          sha256sum "$authdir/$release_asset_name" | awk '{print $1}'
        )"
        test "$actual_parent_sha" = "$EXPECTED_P5_V12_V7_ARTIFACT_SHA256"

        rm -rf p5v12-parent-artifact
        mkdir p5v12-parent-artifact
        unzip -q "$authdir/$release_asset_name" -d p5v12-parent-artifact

        for dir in evidence restore-kit build-artifacts; do
          test -s "p5v12-parent-artifact/$dir/SHA256SUMS"
          (
            cd "p5v12-parent-artifact/$dir"
            sha256sum -c SHA256SUMS
          ) > "evidence/19-P5V12V7-PARENT-${dir}-SHA256.txt"
        done

        grep -Fxq 'TECHNICAL_PASS=YES' \
          p5v12-parent-artifact/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'CHECKPOINT=KSU-GEN1-P5-SUS-PATH-NAMEI-LOOKUP-HASH-V12-V7-PASS' \
          p5v12-parent-artifact/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'P5_V12_V7_LINKED_BOUNDARY=PASS' \
          p5v12-parent-artifact/evidence/24-P5V12V7-LINKED-BOUNDARY.txt
        grep -Fxq 'P5_V12_V7_RESTORE_KIT=PASS' \
          p5v12-parent-artifact/evidence/25-P5V12V7-PROVENANCE.txt

        test "$(
          sha256sum p5v12-parent-artifact/build-artifacts/Image | awk '{print $1}'
        )" = "$EXPECTED_P5_V12_V7_IMAGE_SHA256"
        test "$(
          sha256sum p5v12-parent-artifact/build-artifacts/config | awk '{print $1}'
        )" = "$EXPECTED_P5_V12_V7_CONFIG_SHA256"
        test "$(
          sha256sum p5v12-parent-artifact/build-artifacts/veux.dtb | awk '{print $1}'
        )" = "$EXPECTED_P5_V12_V7_DTB_SHA256"

        jq -e \
          '.stage == "KSU-GEN1-P5-v12-v7" and
           .config_ksu_susfs_sus_path == true and
           .susfs_feature_suboptions_enabled == 4 and
           .dispatch_command_count == 10 and
           .sus_path_namei_lookup_hash_hook_integrated == true and
           .sus_path_namei_lookup_hash_fake_qstr_relookup == true and
           .sus_path_namei_redirect_covers_dcache_hit == true and
           .sus_path_namei_redirect_covers_fresh_lookup == true and
           .sus_path_namei_redirect_once_guard == true and
           .sus_path_namei_post_dput_old_dentry_dereference == false and
           .known_namei_dput_uaf_pattern_present == false and
           .sus_path_lookup_fast_hook_integrated == false and
           .sus_path_lookup_slow_hook_integrated == false and
           .sus_path_readdir_hook_integrated == false and
           .kernel_build_performed == true and
           .device_accessed == false and
           .flashing_performed == false' \
          p5v12-parent-artifact/restore-kit/manifest.json \
          > evidence/19-P5V12V7-PARENT-MANIFEST-AUTH.json

        cd kernel
        parent_patch="$GITHUB_WORKSPACE/p5v12-parent-artifact/restore-kit/p5v11v4-to-p5v12v6-outer-namei-safe-lookup-hash.patch"
        test -s "$parent_patch"

        patch -p1 --dry-run < "$parent_patch"
        patch -p1 < "$parent_patch"

        grep -Fq 'susfs_is_inode_sus_path' fs/namei.c
        grep -Fq 'susfs_fake_qstr_name' fs/namei.c
        grep -Fq 'retry_lookup:' fs/namei.c
        grep -Fq 'lookup_name = &susfs_fake_qstr_name;' fs/namei.c
        ! grep -Fq 'LOOKUP_FAST_SUS_PATH_REDIRECT' fs/namei.c
        ! grep -Fq 'susfs_is_current_proc_umounted_app' fs/namei.c

        mkdir -p "$RUNNER_TEMP/p5v12v7-parent"
        cp fs/namei.c "$RUNNER_TEMP/p5v12v7-parent/namei.c"

        sha256sum \
          fs/stat.c \
          fs/open.c \
          fs/susfs.c \
          fs/readdir.c \
          fs/proc/task_mmu.c \
          kernel/sys.c \
          fs/proc/cmdline.c \
          KernelSU/kernel/sucompat.c \
          KernelSU/kernel/Kconfig \
          KernelSU/kernel/core_hook.c \
          > "$RUNNER_TEMP/p5v12v7-protected-source.sha256"

        cp "$RUNNER_TEMP/p5v12v7-protected-source.sha256" \
          "$GITHUB_WORKSPACE/evidence/19-P5V12V7-PROTECTED-SOURCE-BEFORE.txt"

        python3 - <<'PY'
        from pathlib import Path
        import hashlib
        import os

        text = Path("fs/namei.c").read_text(encoding="utf-8")

        def extract(sig):
            start = text.index(sig)
            brace = text.index("{", start)
            depth = 0
            for i in range(brace, len(text)):
                if text[i] == "{":
                    depth += 1
                elif text[i] == "}":
                    depth -= 1
                    if depth == 0:
                        return text[start:i + 1]
            raise RuntimeError(sig)

        targets = {
            "lookup_hash": "static struct dentry *__lookup_hash(const struct qstr *name,",
            "lookup_fast": "static int lookup_fast(struct nameidata *nd,",
            "lookup_slow_inner": "static struct dentry *__lookup_slow(const struct qstr *name,",
            "lookup_slow": "static struct dentry *lookup_slow(const struct qstr *name,",
            "walk_component": "static int walk_component(struct nameidata *nd, int flags)",
            "lookup_last": "static inline int lookup_last(struct nameidata *nd)",
            "path_init": "static const char *path_init(struct nameidata *nd, unsigned flags)",
        }

        root = Path(os.environ["RUNNER_TEMP"]) / "p5v12v7-parent-functions"
        root.mkdir(parents=True, exist_ok=True)
        rows = []
        for name, sig in targets.items():
            body = extract(sig)
            p = root / f"{name}.c"
            p.write_text(body + "\n", encoding="utf-8")
            rows.append(f"{name}={hashlib.sha256(body.encode()).hexdigest()}")

        (Path(os.environ["GITHUB_WORKSPACE"]) / "evidence/19-P5V12V7-PARENT-FUNCTION-SHA256.txt").write_text(
            "\n".join(rows) + "\n",
            encoding="utf-8",
        )
        PY

        {
          echo "P5_V12_V7_PARENT_RELEASE_AUTH=PASS"
          echo "P5_V12_V7_PARENT_SOURCE_RESTORE=PASS"
          echo "P5_V12_V7_PARENT_RUN_ID=$P5_V12_V7_PASS_RUN_ID"
          echo "P5_V12_V7_PARENT_BACKUP_TAG=$P5_V12_V7_PARENT_BACKUP_TAG"
          echo "P5_V12_V7_PARENT_ARTIFACT_SHA256=$actual_parent_sha"
          echo "P5_V12_V7_ACTIVE_SUBOPTIONS=4"
          echo "P5_V12_V7_ROOT_ONLY_DISPATCH_COMMANDS=10"
        } > "$GITHUB_WORKSPACE/evidence/19-P5V12V7-PARENT-AUTH-RESTORE.txt"
