        test "$(
          jq --arg n "$release_asset_name" \
            '[.assets[] | select(.name == $n)] | length' \
            <<<"$release_json"
        )" -eq 1

        reported_digest="$(
          jq -r --arg n "$release_asset_name" \
            '.assets[] | select(.name == $n) | .digest // empty' \
            <<<"$release_json"
        )"
        if [ -n "$reported_digest" ]; then
