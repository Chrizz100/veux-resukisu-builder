        ksu_patch="$GITHUB_WORKSPACE/p5v11-artifact/restore-kit/p5v10-to-p5v11v4-kernelsu-sus-path-foundation.patch"

        patch -p1 --dry-run < "$outer_patch"
        patch -p1 < "$outer_patch"

        (
          cd KernelSU
          patch -p1 --dry-run < "$ksu_patch"
          patch -p1 < "$ksu_patch"
        )

        grep -Fq 'override_creds(&init_cred);' fs/susfs.c
        grep -Fq 'revert_creds(saved);' fs/susfs.c
        ! grep -Eq '\bksu_cred\b' fs/susfs.c
        grep -Fq 'config KSU_SUSFS_SUS_PATH' KernelSU/kernel/Kconfig
        grep -Fq 'case CMD_SUSFS_ADD_SUS_PATH:' KernelSU/kernel/core_hook.c
        grep -Fq 'case CMD_SUSFS_ADD_SUS_PATH_LOOP:' KernelSU/kernel/core_hook.c

        # P5-v11-v4 deliberately left namei/readdir untouched.
        ! grep -Fq 'susfs_is_inode_sus_path' fs/namei.c
        ! grep -Fq 'susfs_fake_qstr_name' fs/namei.c
        ! grep -Fq 'CONFIG_KSU_SUSFS_SUS_PATH' fs/readdir.c

        mkdir -p "$RUNNER_TEMP/p5v11v4-parent"
