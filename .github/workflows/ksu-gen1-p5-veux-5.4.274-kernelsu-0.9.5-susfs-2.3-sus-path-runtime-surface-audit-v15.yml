        sha256sum \
          fs/stat.c \
          fs/open.c \
          fs/susfs.c \
          fs/readdir.c \
          fs/proc/task_mmu.c \
          kernel/sys.c \
          fs/proc/cmdline.c \
          KernelSU/kernel/sucompat.c \
          KernelSU/kernel/Kconfig \
          KernelSU/kernel/core_hook.c \
          > "$RUNNER_TEMP/p5v11v4-protected-source.sha256"

        cp "$RUNNER_TEMP/p5v11v4-protected-source.sha256" \
