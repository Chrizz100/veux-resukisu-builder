    - name: 36 - Inventory every explicit SUS_PATH reference in current kernel tree
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V15_SUS_PATH_REFERENCE_INVENTORY" > evidence/STAGE.txt
        cd kernel

        python3 - <<'PY'
        from pathlib import Path
        from collections import Counter

        roots = [Path("fs"), Path("include"), Path("KernelSU")]
        suffixes = {".c", ".h", ".S", ".s", ".cc", ".cpp"}
        tokens = [
            "CONFIG_KSU_SUSFS_SUS_PATH",
            "AS_FLAGS_SUS_PATH",
            "susfs_is_inode_sus_path",
            "susfs_is_current_proc_umounted_app",
            "susfs_fake_qstr_name",
            "ADD_SUS_PATH",
            "ADD_SUS_PATH_LOOP",
            "susfs_add_sus_path",
            "susfs_run_sus_path_loop",
        ]

        rows = []
        for root in roots:
            if not root.exists():
                raise SystemExit(f"missing audit root: {root}")
            for path in sorted(p for p in root.rglob("*") if p.is_file()):
                if path.suffix not in suffixes and path.name not in {"Kconfig", "Makefile"}:
                    continue
                try:
                    text = path.read_text(encoding="utf-8")
                except UnicodeDecodeError:
                    continue
                for lineno, line in enumerate(text.splitlines(), 1):
                    hits = [token for token in tokens if token in line]
                    if hits:
                        rows.append((str(path), lineno, ",".join(hits), line.strip()))

        if not rows:
            raise SystemExit("SUS_PATH reference inventory is empty")

        out = Path("../evidence/30-P5V15-SUS-PATH-REFERENCES.tsv")
        with out.open("w", encoding="utf-8") as f:
            f.write("path\tline\ttokens\ttext\n")
            for path, lineno, hits, line in rows:
                clean = line.replace("\t", " ")
                f.write(f"{path}\t{lineno}\t{hits}\t{clean}\n")

        files = sorted({r[0] for r in rows})
        required = {"fs/namei.c", "fs/readdir.c", "fs/susfs.c"}
        if not required.issubset(files):
            raise SystemExit(f"missing expected SUS_PATH files: {sorted(required - set(files))}")

        token_counts = Counter()
        for _, _, hits, _ in rows:
            for token in hits.split(","):
                token_counts[token] += 1

        summary = Path("../evidence/30-P5V15-SUS-PATH-REFERENCE-SUMMARY.txt")
        with summary.open("w", encoding="utf-8") as f:
            f.write(f"SUS_PATH_REFERENCE_ROWS={len(rows)}\n")
            f.write(f"SUS_PATH_REFERENCE_FILES={len(files)}\n")
            for token in tokens:
                f.write(f"TOKEN_{token}={token_counts[token]}\n")
            f.write("EXPECTED_CORE_FILES_PRESENT=YES\n")
            f.write("P5_V15_SUS_PATH_REFERENCE_INVENTORY=PASS\n")
        PY

