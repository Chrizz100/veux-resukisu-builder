    - name: 32 - Authenticate permanent P5-v12-v7 parent and restore exact source
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V12_V7_PARENT_AUTH_RESTORE" > evidence/STAGE.txt

        release_json="$(
          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${P5_V12_V7_PARENT_BACKUP_TAG}"
        )"

        test "$(jq -r '.tag_name' <<<"$release_json")" \
