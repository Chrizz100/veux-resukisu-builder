jobs:
  p5-sus-path-runtime-audit-v15:
    name: P5-v15 - static audit of remaining SUS_PATH runtime surfaces
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: 01 - Checkout exact fresh VEUX base
      uses: actions/checkout@v7
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
        path: kernel
        fetch-depth: 0
        filter: blob:none
    - name: 02 - Initialize P5-v15 static audit evidence
      shell: bash
      run: |
        set -euo pipefail

        : "${P5_V13_FAILED_RUN_ID:?}"
        : "${P5_V13_FAILURE_CLASS:?}"
        : "${P5_V13_V2_WORKFLOW_FIX:?}"
        : "${P5_V12_V7_PASS_RUN_ID:?}"
        : "${P5_V12_V7_PARENT_BACKUP_TAG:?}"
        : "${EXPECTED_P5_V12_V7_ARTIFACT_SHA256:?}"
        : "${P5_V13_V2_PASS_RUN_ID:?}"
        : "${P5_V13_V2_BACKUP_TAG:?}"
        : "${EXPECTED_P5_V13_V2_ARTIFACT_SHA256:?}"
        : "${P5_V14_PASS_RUN_ID:?}"
        : "${P5_V14_ARTIFACT_NAME:?}"
        : "${P5_V14_BACKUP_TAG:?}"
        : "${EXPECTED_P5_V14_ARTIFACT_SHA256:?}"
        : "${P5_V14_RELEASE_TARGET_SHA:?}"
        : "${EXPECTED_P5_V14_IMAGE_SHA256:?}"
        : "${EXPECTED_P5_V14_CONFIG_SHA256:?}"
        : "${EXPECTED_P5_V14_DTB_SHA256:?}"
        : "${EXPECTED_P5_V14_READDIR_SHA256:?}"
        : "${EXPECTED_P5_V14_NAMEI_SHA256:?}"

        rm -rf evidence restore-kit build-artifacts \
          p5v12-parent-artifact p5v13-parent-artifact p5v14-parent-artifact
        mkdir -p evidence restore-kit build-artifacts

        {
          echo "WORKFLOW=KSU-GEN1-P5-SUS-PATH-RUNTIME-SURFACE-AUDIT-v15"
          echo "DEVICE=VEUX"
          echo "TARGET_KERNEL=$TARGET_VERSION"
          echo "PARENT_STAGE=P5_V14"
          echo "PARENT_RUN_ID=$P5_V14_PASS_RUN_ID"
          echo "PARENT_BACKUP_TAG=$P5_V14_BACKUP_TAG"
          echo "PARENT_ARTIFACT_SHA256=$EXPECTED_P5_V14_ARTIFACT_SHA256"
          echo "AUDIT_SCOPE=$P5_V15_AUDIT_SCOPE"
          echo "SOURCE_CHANGE=$P5_V15_SOURCE_CHANGE"
          echo "KERNEL_REBUILD=$P5_V15_KERNEL_REBUILD"
          echo "NEXT_BLOCK_PRESELECTED=$P5_V15_NEXT_BLOCK_PRESELECTED"
          echo "ACTIVE_SUBOPTIONS=KSU_SUSFS_SPOOF_UNAME,KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG,KSU_SUSFS_SUS_KSTAT,KSU_SUSFS_SUS_PATH"
          echo "SUSFS_FEATURE_SUBOPTION_COUNT=4"
          echo "SUS_MOUNT=DISABLED"
          echo "OPEN_REDIRECT=DISABLED"
          echo "SUS_MAP=DISABLED"
          echo "AUTO_GITHUB_BACKUP_ON_PASS=YES"
          echo "BOOT_IMAGE_CREATED=NO"
          echo "DEVICE_ACCESSED=NO"
          echo "FLASHING_PERFORMED=NO"
          echo "REAL_DEVICE_RUNTIME_CLAIM=NO"
          echo "P5_V15_REQUIRED_ENV_GATE=PASS"
        } > evidence/00-CONTRACT.txt

        echo "STAGE=INITIALIZED" > evidence/STAGE.txt

    - name: 03 - Install build and audit dependencies
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=DEPENDENCIES" > evidence/STAGE.txt
        sudo apt-get update
        sudo apt-get install -y \
          bc bison ca-certificates cpio curl flex git jq \
          libelf-dev libssl-dev patch python3 rsync unzip xz-utils zip zstd
    - name: 04 - Reconstruct exact deterministic P0
      shell: bash
      run: |
