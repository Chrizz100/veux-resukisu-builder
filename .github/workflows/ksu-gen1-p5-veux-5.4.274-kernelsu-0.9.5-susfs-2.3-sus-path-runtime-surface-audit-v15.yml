            "parent_veux_dtb_sha256": "42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37",
            "parent_readdir_sha256": "3560a9a59c6c592dace03515fcb04f41d14c665e69f6666deabae03f611718db",
            "parent_namei_sha256": "901931a59082e1baf07bf7d926146a885e87821f733ac62e699d6bf01ce0b2d4",
            "source_changed_from_parent": False,
            "kernel_rebuild_performed": False,
            "config_ksu_susfs": True,
            "config_ksu_susfs_spoof_uname": True,
            "config_ksu_susfs_spoof_cmdline_or_bootconfig": True,
            "config_ksu_susfs_sus_kstat": True,
            "config_ksu_susfs_sus_path": True,
            "susfs_feature_suboptions_enabled": 4,
            "sus_mount_active": False,
            "open_redirect_active": False,
            "sus_map_active": False,
            "root_only_user_command_dispatch": True,
            "dispatch_command_count": 10,
            "sus_path_reference_rows": audit["sus_path_reference_rows"],
            "sus_path_reference_files": audit["sus_path_reference_files"],
            "lookup_surface_rows": audit["lookup_surface_rows"],
            "non_namei_candidate_rows": audit["non_namei_candidate_rows"],
            "directory_iteration_rows": audit["directory_iteration_rows"],
            "non_readdir_candidate_rows": audit["non_readdir_candidate_rows"],
            "state_dispatch_reference_rows": audit["state_dispatch_reference_rows"],
            "parent_identity_preserved": audit["parent_identity_preserved"],
            "next_functional_block_selected": False,
            "next_decision_requires_audit_evidence": True,
            "device_accessed": False,
            "flashing_performed": False,
            "boot_image_created": False,
            "real_device_runtime_claim": False,
            "auto_github_backup_required_after_pass": True,
        }

        Path("restore-kit/manifest.json").write_text(
            json.dumps(manifest, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        PY

        cat > restore-kit/RESTORE-INSTRUCTIONS.txt <<EOF
        KSU GEN1 P5-v15 audit-only recovery

        Restore the exact permanent P5-v14 parent:
          $P5_V14_BACKUP_TAG

        P5-v15 has no source patch.
        Reconstructing P5-v15 therefore means restoring P5-v14 byte-identically
        and retaining this audit evidence. No additional kernel source change
        is part of P5-v15.
        EOF

        {
          echo "P5_V15_RESTORE_MODE=EXACT_P5_V14_PARENT_PLUS_AUDIT_EVIDENCE"
          echo "P5_V15_SOURCE_DELTA=NONE"
          echo "P5_V15_RESTORE_KIT=PASS"
        } > evidence/36-P5V15-PROVENANCE.txt

    - name: 43 - Close P5-v15 technical audit status
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p evidence
        echo "STAGE=FINAL_STATUS" > evidence/STAGE.txt

        if grep -Fxq 'P5_V14_PARENT_AUTH_RESTORE=PASS' evidence/20-P5V14-PARENT-AUTH-RESTORE.txt 2>/dev/null \
          && grep -Fxq 'P5_V15_BASELINE_GATE=PASS' evidence/21-P5V15-BASELINE.txt 2>/dev/null \
          && grep -Fxq 'P5_V15_SUS_PATH_REFERENCE_INVENTORY=PASS' evidence/30-P5V15-SUS-PATH-REFERENCE-SUMMARY.txt 2>/dev/null \
          && grep -Fxq 'P5_V15_LOOKUP_PATH_INVENTORY=PASS' evidence/31-P5V15-LOOKUP-PATH-SUMMARY.txt 2>/dev/null \
          && grep -Fxq 'P5_V15_DIRECTORY_ITERATION_INVENTORY=PASS' evidence/32-P5V15-DIRECTORY-ITERATION-SUMMARY.txt 2>/dev/null \
          && grep -Fxq 'P5_V15_STATE_DISPATCH_INVENTORY=PASS' evidence/33-P5V15-STATE-DISPATCH-SUMMARY.txt 2>/dev/null \
          && grep -Fxq 'P5_V15_PARENT_IDENTITY_FREEZE=PASS' evidence/34-P5V15-PARENT-IDENTITY.txt 2>/dev/null \
          && grep -Fxq 'P5_V15_STATIC_RUNTIME_SURFACE_AUDIT=PASS' evidence/35-P5V15-AUDIT-CLOSE.txt 2>/dev/null \
          && grep -Fxq 'P5_V15_RESTORE_KIT=PASS' evidence/36-P5V15-PROVENANCE.txt 2>/dev/null; then
          technical_pass=YES
          checkpoint=KSU-GEN1-P5-SUS-PATH-RUNTIME-SURFACE-AUDIT-V15-PASS
        else
          technical_pass=NO
          checkpoint=KSU-GEN1-P5-SUS-PATH-RUNTIME-SURFACE-AUDIT-V15-FAILED
        fi

        {
          echo "JOB_STATUS_BEFORE_TECHNICAL_CLOSE=${{ job.status }}"
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          echo "TECHNICAL_PASS=$technical_pass"
          echo "CHECKPOINT=$checkpoint"
          echo "PARENT_P5_V14_RUN_ID=$P5_V14_PASS_RUN_ID"
          echo "PARENT_P5_V14_BACKUP_TAG=$P5_V14_BACKUP_TAG"
          echo "PARENT_P5_V14_ARTIFACT_SHA256=$EXPECTED_P5_V14_ARTIFACT_SHA256"
          echo "AUDIT_ONLY=YES"
          echo "SOURCE_CHANGED_FROM_PARENT=NO"
          echo "KERNEL_REBUILD_PERFORMED=NO"
          echo "SUSFS_FEATURE_SUBOPTIONS_ENABLED=4"
          echo "SUS_MOUNT_ACTIVE=NO"
          echo "OPEN_REDIRECT_ACTIVE=NO"
          echo "SUS_MAP_ACTIVE=NO"
          echo "NEXT_FUNCTIONAL_BLOCK_SELECTED=NO"
          echo "NEXT_DECISION_REQUIRES_AUDIT_EVIDENCE=YES"
          echo "AUTO_GITHUB_BACKUP_REQUIRED=YES"
          echo "BOOT_IMAGE_CREATED=NO"
          echo "DEVICE_ACCESSED=NO"
          echo "FLASHING_PERFORMED=NO"
          echo "REAL_DEVICE_RUNTIME_CLAIM=NO"
        } > evidence/98-FINAL-STATUS.txt

        test "$technical_pass" = YES
      if: ${{ always() }}

    - name: 44 - Build P5-v15 SHA256 manifests
      shell: bash
      run: |
        set -euo pipefail

        for dir in evidence restore-kit build-artifacts; do
          [ -d "$dir" ] || continue
          rm -f "$dir/SHA256SUMS" "$dir/EMPTY-DIRECTORY.txt"
          (
            cd "$dir"
            count="$(
              find . -type f ! -name SHA256SUMS ! -name EMPTY-DIRECTORY.txt \
                | wc -l | tr -d ' '
            )"
            if [ "$count" -eq 0 ]; then
              echo "EMPTY_DIRECTORY_AT_MANIFEST_TIME=YES" > EMPTY-DIRECTORY.txt
            fi
            find . -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 -r sha256sum \
              > SHA256SUMS
            test -s SHA256SUMS
            sha256sum -c SHA256SUMS
          )
        done
      if: ${{ always() }}

    - name: 45 - Upload P5-v15 audit evidence and exact parent build identity
      uses: actions/upload-artifact@v7
      with:
        name: ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-runtime-surface-audit-v15-${{ github.run_id }}
        path: |
          evidence/
          restore-kit/
          build-artifacts/
        retention-days: 14
        if-no-files-found: error
      if: ${{ always() }}

    - name: 46 - P5-v15 technical audit summary
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "# KSU GEN1 P5-v15 - SUS_PATH runtime-surface audit"
          echo
          if grep -Fxq 'TECHNICAL_PASS=YES' evidence/98-FINAL-STATUS.txt 2>/dev/null; then
            echo "**TECHNICAL AUDIT PASS**"
            echo
            echo "P5-v14 was restored from its permanent GitHub recovery release and authenticated."
            echo "No kernel source was changed and no kernel rebuild was performed."
            echo "The artifact inventories explicit SUS_PATH references, path/lookup bypass candidates,"
            echo "directory-iteration surfaces and inode-state/dispatch surfaces."
            echo "No next functional block is preselected; the evidence must be reviewed first."
            echo
            echo '```text'
            cat evidence/20-P5V14-PARENT-AUTH-RESTORE.txt
            cat evidence/34-P5V15-PARENT-IDENTITY.txt
            cat evidence/35-P5V15-AUDIT-CLOSE.txt
            echo '```'
          else
            echo "**FAIL — repair only the P5-v15 static audit boundary.**"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
      if: ${{ always() }}
  backup-pass:
    name: P5-v15 - automatic permanent GitHub audit recovery backup
    needs:
    - p5-sus-path-runtime-audit-v15
    if: ${{ needs.p5-sus-path-runtime-audit-v15.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: B01 - Initialize automatic P5-v15 audit backup
      shell: bash
      run: |
        set -euo pipefail
        rm -rf backup-work backup-evidence
        mkdir -p backup-work backup-evidence

        tag="ksu-gen1-p5-v15-audit-pass-backup-${GITHUB_RUN_ID}"

        {
          echo "BACKUP_WORKFLOW=KSU-GEN1-P5-V15-AUDIT-AUTO-GITHUB-RECOVERY"
          echo "TECHNICAL_RUN_ID=$GITHUB_RUN_ID"
          echo "PARENT_BACKUP_TAG=$P5_V14_BACKUP_TAG"
          echo "RELEASE_TAG=$tag"
          echo "RELEASE_TARGET_SHA=$GITHUB_SHA"
          echo "RELEASE_REDOWNLOAD_REVERIFY=YES"
        } > backup-evidence/00-CONTRACT.txt

    - name: B02 - Resolve and download exact current P5-v15 Actions artifact
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-runtime-surface-audit-v15-${GITHUB_RUN_ID}"

        json="$(
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
        )"

        count="$(
          jq --arg n "$artifact_name" \
            '[.artifacts[] | select(.name == $n and .expired == false)] | length' \
            <<<"$json"
        )"
        test "$count" -eq 1

        artifact_id="$(
          jq -r --arg n "$artifact_name" \
            '.artifacts[] | select(.name == $n and .expired == false) | .id' \
            <<<"$json"
        )"
        expected_digest="$(
          jq -r --arg n "$artifact_name" \
            '.artifacts[] | select(.name == $n and .expired == false) | .digest' \
            <<<"$json"
        )"
        expected_sha="${expected_digest#sha256:}"

        gh api \
          -H "Accept: application/vnd.github+json" \
          "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
          > "${artifact_name}.zip"

        actual_sha="$(sha256sum "${artifact_name}.zip" | awk '{print $1}')"
        test "$actual_sha" = "$expected_sha"

        {
          echo "CURRENT_ARTIFACT_NAME=$artifact_name"
          echo "CURRENT_ARTIFACT_ID=$artifact_id"
          echo "CURRENT_ARTIFACT_SHA256=$actual_sha"
          echo "CURRENT_ACTIONS_ARTIFACT_AUTH=PASS"
        } > "$GITHUB_WORKSPACE/backup-evidence/01-CURRENT-ARTIFACT-AUTH.txt"

    - name: B03 - Verify exact P5-v15 technical audit PASS
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-runtime-surface-audit-v15-${GITHUB_RUN_ID}"
        rm -rf verify-current
        mkdir verify-current
        unzip -q "${artifact_name}.zip" -d verify-current

        for dir in evidence restore-kit build-artifacts; do
          (
            cd "verify-current/$dir"
            sha256sum -c SHA256SUMS
          )
        done

        grep -Fxq 'TECHNICAL_PASS=YES' verify-current/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'CHECKPOINT=KSU-GEN1-P5-SUS-PATH-RUNTIME-SURFACE-AUDIT-V15-PASS' \
          verify-current/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'AUDIT_ONLY=YES' verify-current/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'SOURCE_CHANGED_FROM_PARENT=NO' verify-current/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'KERNEL_REBUILD_PERFORMED=NO' verify-current/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'P5_V15_RESTORE_KIT=PASS' \
          verify-current/evidence/36-P5V15-PROVENANCE.txt

        jq -e \
          '.stage == "KSU-GEN1-P5-v15" and
           .audit_only == true and
           .source_changed_from_parent == false and
           .kernel_rebuild_performed == false and
           .parent_identity_preserved == true and
           .susfs_feature_suboptions_enabled == 4 and
           .sus_mount_active == false and
           .open_redirect_active == false and
           .sus_map_active == false and
           .next_functional_block_selected == false and
           .next_decision_requires_audit_evidence == true and
           .device_accessed == false and
           .flashing_performed == false' \
          verify-current/restore-kit/manifest.json >/dev/null

        test "$(sha256sum verify-current/build-artifacts/Image | awk '{print $1}')" \
          = "$EXPECTED_P5_V14_IMAGE_SHA256"
        test "$(sha256sum verify-current/build-artifacts/config | awk '{print $1}')" \
          = "$EXPECTED_P5_V14_CONFIG_SHA256"
        test "$(sha256sum verify-current/build-artifacts/veux.dtb | awk '{print $1}')" \
          = "$EXPECTED_P5_V14_DTB_SHA256"

        echo "CURRENT_PASS_CHAIN_AUTH=PASS" > "$GITHUB_WORKSPACE/backup-evidence/02-PASS-AUTH.txt"

    - name: B04 - Prepare P5-v15 audit recovery release payload
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-runtime-surface-audit-v15-${GITHUB_RUN_ID}"
        artifact_sha="$(sha256sum "${artifact_name}.zip" | awk '{print $1}')"

        cp verify-current/restore-kit/manifest.json P5V15-AUDIT-MANIFEST.json

        cat > RECOVERY.txt <<EOF
        KSU GEN1 VEUX P5-v15 static audit PASS recovery
        =================================================

        Technical audit run:
          $GITHUB_RUN_ID

        Exact functional parent:
          $P5_V14_BACKUP_TAG

        P5-v15 is audit-only:
        - no functional kernel source change
        - no kernel rebuild
        - exact P5-v14 source/build identity preserved
        - remaining SUS_PATH runtime surfaces inventoried
        - no next functional block preselected

        Complete Actions artifact SHA256:
          $artifact_sha

        This checkpoint makes no real-device runtime claim.
        EOF

        {
          sha256sum "${artifact_name}.zip"
          sha256sum P5V15-AUDIT-MANIFEST.json
          sha256sum RECOVERY.txt
        } > RELEASE-SHA256SUMS.txt
        sha256sum -c RELEASE-SHA256SUMS.txt

        cat > release-notes.md <<EOF
        Permanent recovery checkpoint for the successful P5-v15 static SUS_PATH
        runtime-surface audit.

        P5-v15 changes no kernel source and performs no kernel rebuild. It restores
        and authenticates the permanent P5-v14 parent, then inventories the remaining
        lookup/path, directory-iteration and inode-state/dispatch surfaces before any
        next functional block is selected.

        Parent backup: \`$P5_V14_BACKUP_TAG\`
        Technical run: \`$GITHUB_RUN_ID\`
        EOF

    - name: B05 - Create permanent P5-v15 audit GitHub Release
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        tag="ksu-gen1-p5-v15-audit-pass-backup-${GITHUB_RUN_ID}"
        title="KSU GEN1 VEUX P5-v15 Audit PASS Recovery Backup"

        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          exit 1
        fi

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-runtime-surface-audit-v15-${GITHUB_RUN_ID}"

        gh release create "$tag" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "$title" \
          --notes-file release-notes.md \
          "${artifact_name}.zip#P5-v15 complete audit PASS artifact" \
          "P5V15-AUDIT-MANIFEST.json#P5-v15 audit manifest" \
          "RELEASE-SHA256SUMS.txt#Release checksums" \
          "RECOVERY.txt#Recovery metadata"

        gh release view "$tag" \
          --repo "$GITHUB_REPOSITORY" \
          --json tagName,name,isDraft,isPrerelease,url,assets \
          > "$GITHUB_WORKSPACE/backup-evidence/04-RELEASE.json"

        jq -e \
          --arg tag "$tag" \
          --arg title "$title" \
          '.tagName == $tag and
           .name == $title and
           .isDraft == false and
           .isPrerelease == false and
           (.assets | length) == 4' \
          "$GITHUB_WORKSPACE/backup-evidence/04-RELEASE.json" >/dev/null

        {
          echo "GITHUB_RELEASE_CREATED=PASS"
          echo "RELEASE_TAG=$tag"
        } > "$GITHUB_WORKSPACE/backup-evidence/04-RELEASE-CREATE.txt"

    - name: B06 - Redownload P5-v15 audit release assets and reverify
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        tag="ksu-gen1-p5-v15-audit-pass-backup-${GITHUB_RUN_ID}"
        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-runtime-surface-audit-v15-${GITHUB_RUN_ID}"

        rm -rf release-download
        mkdir release-download

        gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release-download

        cmp "${artifact_name}.zip" "release-download/${artifact_name}.zip"
        cmp P5V15-AUDIT-MANIFEST.json release-download/P5V15-AUDIT-MANIFEST.json
        cmp RELEASE-SHA256SUMS.txt release-download/RELEASE-SHA256SUMS.txt
        cmp RECOVERY.txt release-download/RECOVERY.txt

        (
          cd release-download
          sha256sum -c RELEASE-SHA256SUMS.txt
        )

        {
          echo "CURRENT_ARTIFACT_RELEASE_BYTE_IDENTITY=PASS"
          echo "MANIFEST_RELEASE_BYTE_IDENTITY=PASS"
          echo "CHECKSUM_RELEASE_BYTE_IDENTITY=PASS"
          echo "RECOVERY_METADATA_RELEASE_BYTE_IDENTITY=PASS"
          echo "RELEASE_DOWNLOAD_REVERIFY=PASS"
        } > "$GITHUB_WORKSPACE/backup-evidence/05-RELEASE-REVERIFY.txt"

    - name: B07 - Close automatic P5-v15 audit backup status
      shell: bash
      run: |
        set -euo pipefail

        if grep -Fxq 'CURRENT_PASS_CHAIN_AUTH=PASS' backup-evidence/02-PASS-AUTH.txt \
          && grep -Fxq 'GITHUB_RELEASE_CREATED=PASS' backup-evidence/04-RELEASE-CREATE.txt \
          && grep -Fxq 'RELEASE_DOWNLOAD_REVERIFY=PASS' backup-evidence/05-RELEASE-REVERIFY.txt; then
          pass=YES
          checkpoint=KSU-GEN1-P5-V15-AUDIT-GITHUB-RECOVERY-BACKUP-PASS
        else
          pass=NO
          checkpoint=KSU-GEN1-P5-V15-AUDIT-GITHUB-RECOVERY-BACKUP-FAILED
        fi

        {
          echo "BACKUP_PASS=$pass"
          echo "CHECKPOINT=$checkpoint"
          echo "RELEASE_TAG=ksu-gen1-p5-v15-audit-pass-backup-$GITHUB_RUN_ID"
          echo "RELEASE_ASSETS_REDOWNLOADED_AND_REVERIFIED=$pass"
        } > backup-evidence/98-BACKUP-STATUS.txt

        test "$pass" = YES

    - name: B08 - Build automatic P5-v15 audit backup evidence manifest
      shell: bash
      run: |
        set -euo pipefail
        cd backup-evidence
        rm -f SHA256SUMS
        find . -type f ! -name SHA256SUMS -printf '%P\0' \
          | sort -z \
          | xargs -0 -r sha256sum \
          > SHA256SUMS
        sha256sum -c SHA256SUMS

    - name: B09 - Upload automatic P5-v15 audit backup evidence
      uses: actions/upload-artifact@v7
      with:
        name: ksu-gen1-p5-v15-audit-github-recovery-backup-evidence-${{ github.run_id }}
        path: backup-evidence/
        retention-days: 30
        if-no-files-found: error
      if: ${{ always() }}

    - name: B10 - Automatic P5-v15 audit backup summary
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "# P5-v15 automatic GitHub audit recovery backup"
          echo
          if grep -Fxq 'BACKUP_PASS=YES' backup-evidence/98-BACKUP-STATUS.txt 2>/dev/null; then
            echo "**BACKUP PASS**"
            echo "\`ksu-gen1-p5-v15-audit-pass-backup-$GITHUB_RUN_ID\`"
          else
            echo "**BACKUP FAIL — do not select or activate a next functional block.**"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
