name: 97 - GEN1 5.4.274 SUSFS 2.3 NO TRY_UMOUNT Final boot.img v1

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

env:
  W96_RUN_ID: "33323019583"
  W96_RUN_HEAD_SHA: "fc1964e5752d52fa4cbb1918b9c6ff0c3f366ef8"
  W96_WORKFLOW_PATH: ".github/workflows/96-gen1-5.4.274-susfs-2.3-no-try-umount-isolated-build-v4.yml"
  W96_WORKFLOW_BLOB_SHA1: "c3fe10a4298dea69e178bc00a8a79d74a6628586"
  W96_WORKFLOW_SHA256: "dada1bec92a884f026d00433bc55e79017a7dab47c11320d7765c90251544f36"
  W96_ARTIFACT_ID: "9735745377"
  W96_ARTIFACT_NAME: "GEN1_W96_5.4.274_SUSFS_2.3_NO_TRY_UMOUNT_v4-1"
  W96_ARTIFACT_SHA256: "200ad4537d2e2ba0a1aaff47d0a429fe60ed6e39d9725b8163cf77a4dbf75ad6"

  IMAGE_NAME: "GEN1_W96_Image"
  IMAGE_SHA256: "579f012d0772d26340c69969c5a932adb8b049e3977efee02e0af809df8a2d83"
  IMAGE_BYTES: "29843968"
  CONFIG_NAME: "GEN1_W96_config"
  CONFIG_SHA256: "d7cd955abd59da45804acc9c5e450cf8fc953da3e66bbc274212b40ee9a0b372"
  RESUKISU_COMMIT: "419e270b50ad61725185dec74f438b8cb59c6889"
  SUSFS_2_3_COMMIT: "fb16b41a65180979f05eac837681c4dd0addffd1"

  W90_WORKFLOW_PATH: ".github/workflows/90-gen1-5.4.274-resukisu-419e270b-final-boot-img-v1.yml"
  W90_WORKFLOW_BLOB_SHA1: "e1f14a1a163bb0fe8e67e2ed3e07b74e3046630b"
  W90_IMAGE_SHA256: "d0f7abcc526ec63413236fd440cef2d9fb6cc3819ce656b1b49efde7d65cda04"
  W90_BOOT_SHA256: "98e12c49bd20dcb5f780ac0358b6fadc06c27843999052a2bf0ad1b362c55eee"
  W94_TRY_UMOUNT_BOOT_SHA256: "b953661aab27165cb1717c467c87563ee660b882337a2376992c919a2ff115cd"
  EXPECTED_BOOT_SHA256: "15fa3497b60d0826170b061fe2fa2b66b1b738c542bb27983b2cc40933291c08"

  STOCK_RAMDISK_SHA256: "0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a"
  FINAL_BOOT_NAME: "VEUX_5.4.274_ReSukiSU_419E270B_SUSFS_2.3_NO_TRY_UMOUNT_HyperOS_OS1.0.12.0_TKCMIXM_Android13_FINAL_BOOT.img"
  WORK: ${{ github.workspace }}/gen1-w97-v1

jobs:
  final-boot:
    name: Repack verified GEN1 W97-v1 boot.img from W96 and proven W90 method
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Verify runner tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in gh jq git unzip zip gzip sha256sum stat find grep awk cmp python3; do
            command -v "$tool" >/dev/null
          done
          python3 -m pip --version >/dev/null

      - name: Checkout repository for provenance
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare isolated W97 workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK"
          mkdir -p \
            "$WORK/input" \
            "$WORK/w96" \
            "$WORK/w21" \
            "$WORK/oldpkg" \
            "$WORK/build" \
            "$WORK/release" \
            "$WORK/audit"

      - name: Authenticate exact successful W96-v4 workflow source
        shell: bash
        run: |
          set -euo pipefail

          git cat-file -e "$W96_RUN_HEAD_SHA:$W96_WORKFLOW_PATH"
          git show "$W96_RUN_HEAD_SHA:$W96_WORKFLOW_PATH" > "$WORK/input/w96-workflow.yml"

          test "$(git hash-object "$WORK/input/w96-workflow.yml")" = "$W96_WORKFLOW_BLOB_SHA1"
          echo "$W96_WORKFLOW_SHA256  $WORK/input/w96-workflow.yml" | sha256sum -c -

          grep -Fxq \
            'name: 96 - GEN1 5.4.274 SUSFS 2.3 NO TRY_UMOUNT Isolated Build v4' \
            "$WORK/input/w96-workflow.yml"
          grep -Fq "$IMAGE_SHA256" "$WORK/input/w96-workflow.yml"
          grep -Fq "$CONFIG_SHA256" "$WORK/input/w96-workflow.yml"
          grep -Fq "$RESUKISU_COMMIT" "$WORK/input/w96-workflow.yml"
          grep -Fq "$SUSFS_2_3_COMMIT" "$WORK/input/w96-workflow.yml"

          echo "W96_WORKFLOW_SOURCE_AUTH=PASS"

      - name: Authenticate exact successful W96-v4 run and artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_JSON="$WORK/input/w96-run.json"
          ART_JSON="$WORK/input/w96-artifact.json"

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${W96_RUN_ID}" \
            > "$RUN_JSON"

          test "$(jq -r '.id' "$RUN_JSON")" = "$W96_RUN_ID"
          test "$(jq -r '.status' "$RUN_JSON")" = "completed"
          test "$(jq -r '.conclusion' "$RUN_JSON")" = "success"
          test "$(jq -r '.path' "$RUN_JSON")" = "$W96_WORKFLOW_PATH"
          test "$(jq -r '.head_sha' "$RUN_JSON")" = "$W96_RUN_HEAD_SHA"

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${W96_ARTIFACT_ID}" \
            > "$ART_JSON"

          test "$(jq -r '.id' "$ART_JSON")" = "$W96_ARTIFACT_ID"
          test "$(jq -r '.name' "$ART_JSON")" = "$W96_ARTIFACT_NAME"
          test "$(jq -r '.expired' "$ART_JSON")" = "false"
          test "$(jq -r '.workflow_run.id' "$ART_JSON")" = "$W96_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' "$ART_JSON")" = "$W96_RUN_HEAD_SHA"
          test "$(jq -r '.digest' "$ART_JSON")" = "sha256:${W96_ARTIFACT_SHA256}"

          echo "W96_V4_RUN_ARTIFACT_AUTH=PASS"

      - name: Download and verify exact W96 Image and config
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${W96_ARTIFACT_ID}/zip" \
            > "$WORK/input/w96-outer.zip"

          echo "$W96_ARTIFACT_SHA256  $WORK/input/w96-outer.zip" | sha256sum -c -
          unzip -t "$WORK/input/w96-outer.zip" >/dev/null
          unzip -q "$WORK/input/w96-outer.zip" -d "$WORK/w96"

          test "$(find "$WORK/w96" -maxdepth 1 -type f | wc -l)" -eq 16
          test -s "$WORK/w96/$IMAGE_NAME"
          test -s "$WORK/w96/$CONFIG_NAME"
          test -s "$WORK/w96/SHA256SUMS.txt"
          test -s "$WORK/w96/W96-FINAL-VERDICT.txt"

          (
            cd "$WORK/w96"
            sha256sum -c SHA256SUMS.txt
          )

          test "$(stat -c '%s' "$WORK/w96/$IMAGE_NAME")" = "$IMAGE_BYTES"
          echo "$IMAGE_SHA256  $WORK/w96/$IMAGE_NAME" | sha256sum -c -
          echo "$CONFIG_SHA256  $WORK/w96/$CONFIG_NAME" | sha256sum -c -

          V="$WORK/w96/W96-FINAL-VERDICT.txt"
          for required in \
            'W96_GEN1_5.4.274_SUSFS_2.3_NO_TRY_UMOUNT=PASS' \
            "RESUKISU_PIN=$RESUKISU_COMMIT" \
            'SUSFS_VERSION=2.3.0' \
            "SUSFS_2_3_COMMIT=$SUSFS_2_3_COMMIT" \
            'SUSFS_2_3_5_4_SEMANTIC_BACKPORT=PASS' \
            'ZYGOTE_NEXT_LOOKUP_MNT_FIX=PASS' \
            'ROOT_REVOKE_RECHECK=PASS' \
            'UID_EUID_CAPTURE_ORDER_FIX=PASS' \
            'OPEN_REDIRECT_SRCU=PASS' \
            'TRY_UMOUNT=REMOVED' \
            'TRY_UMOUNT_KCONFIG=ABSENT' \
            'TRY_UMOUNT_DISPATCH=ABSENT' \
            'TRY_UMOUNT_KERNEL_CALL=ABSENT' \
            'TRY_UMOUNT_BUILD_SYMBOLS=ABSENT' \
            'MODULE_LOAD_FILTER_INCLUDED=NO' \
            'CONFIG_IDENTICAL_TO_W88=YES' \
            "W96_IMAGE_SHA256=$IMAGE_SHA256" \
            "W96_CONFIG_SHA256=$CONFIG_SHA256" \
            'REPRODUCIBILITY=PASS'
          do
            grep -Fxq "$required" "$V"
          done

          cp "$WORK/w96/$IMAGE_NAME" "$WORK/input/new-Image"
          cmp -s "$WORK/w96/$IMAGE_NAME" "$WORK/input/new-Image"

          echo "W96_IMAGE_CONFIG_GATE=PASS"
          echo "W96_NO_TRY_UMOUNT_GATE=PASS"

      - name: Authenticate exact proven W90 repack workflow blob
        shell: bash
        run: |
          set -euo pipefail

          git cat-file -e "${W90_WORKFLOW_BLOB_SHA1}^{blob}"
          git cat-file blob "$W90_WORKFLOW_BLOB_SHA1" > "$WORK/input/w90-workflow.yml"

          test "$(git hash-object "$WORK/input/w90-workflow.yml")" = "$W90_WORKFLOW_BLOB_SHA1"
          grep -Fxq \
            'name: 90 - GEN1 5.4.274 ReSukiSU 419e270b Final boot.img v1' \
            "$WORK/input/w90-workflow.yml"
          grep -Fq "$W90_IMAGE_SHA256" "$WORK/input/w90-workflow.yml"
          grep -Fq "$STOCK_RAMDISK_SHA256" "$WORK/input/w90-workflow.yml"

          python3 -m pip install \
            --disable-pip-version-check \
            --no-input \
            'PyYAML==6.0.2'

          cat > "$WORK/input/run-w90-step.py" <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          import yaml

          if len(sys.argv) != 2:
              raise SystemExit("usage: run-w90-step.py <exact-step-name>")

          workflow = Path(os.environ["WORK"]) / "input" / "w90-workflow.yml"
          doc = yaml.load(workflow.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          steps = doc["jobs"]["boot-image"]["steps"]

          name = sys.argv[1]
          matches = [s for s in steps if s.get("name") == name]
          if len(matches) != 1:
              raise SystemExit(f"expected one W90 step {name!r}, got {len(matches)}")

          script = matches[0].get("run")
          if not script:
              raise SystemExit(f"W90 step {name!r} has no run block")

          if os.environ.get("W97_ADAPT_IMAGE") == "1":
              old = os.environ["W90_IMAGE_SHA256"]
              new = os.environ["IMAGE_SHA256"]
              count = script.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one W90 Image hash in {name!r}, got {count}"
                  )
              script = script.replace(old, new)
              if old in script:
                  raise SystemExit("old W90 Image hash survived adaptation")

          if os.environ.get("W97_ADAPT_REPORT") == "1":
              script = script.replace(
                  "FINAL_RESULT=PASS_GEN1_W90_BOOT_IMG",
                  "FINAL_RESULT=PASS_GEN1_W97_BOOT_IMG",
              )
              script = script.replace(
                  "SUSFS_VERSION=2.2",
                  "SUSFS_VERSION=2.3",
              )

          print(f"=== REPLAY_W90_STEP: {name} ===", flush=True)
          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", script],
              check=True,
              env=os.environ.copy(),
          )
          PY

          python3 -m py_compile "$WORK/input/run-w90-step.py"

          echo "W90_REPACK_WORKFLOW_BLOB_AUTH=PASS"

      - name: Import exact W90 historical boot-input contracts
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$WORK/input/w90-workflow.yml" "$GITHUB_ENV" <<'PY'
          import sys
          from pathlib import Path
          import yaml

          workflow = Path(sys.argv[1])
          out = Path(sys.argv[2])

          doc = yaml.load(workflow.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          env = doc["jobs"]["boot-image"]["env"]

          keys = [
              "W21_ARTIFACT_NAME",
              "W21_FINAL_ZIP_NAME",
              "W21_FINAL_ZIP_SHA256",
              "W21_FINAL_ZIP_BYTES",
              "STOCK_BOOT_SHA256",
              "STOCK_BOOT_BYTES",
              "STOCK_RAMDISK_SHA256",
              "ROLLBACK_GZIP_SHA256",
              "OLD_CUSTOM_BOOT_SHA256",
              "OLD_KERNEL_SHA256",
              "OLD_KERNEL_BYTES",
          ]

          missing = [k for k in keys if k not in env]
          if missing:
              raise SystemExit("missing W90 env keys: " + ", ".join(missing))

          with out.open("a", encoding="utf-8") as f:
              for key in keys:
                  value = str(env[key])
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"unsafe multiline W90 env value: {key}")
                  f.write(f"{key}={value}\n")

          print("W90_HISTORICAL_ENV_IMPORT=PASS")
          PY

      - name: Replay exact W90 historical calibrated HyperOS boot recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$WORK/input/run-w90-step.py" \
            "Recover exact historical calibrated HyperOS boot inputs"

      - name: Reconstruct W97 Boot v3 twice with exact W96 Image
        shell: bash
        env:
          W97_ADAPT_IMAGE: "1"
        run: |
          set -euo pipefail

          python3 "$WORK/input/run-w90-step.py" \
            "Reconstruct calibrated Boot v3 twice with W88-v3 kernel"

          cmp -s "$WORK/build/boot-A.img" "$WORK/build/boot-B.img"

          echo "W97_BOOT_A_B_IDENTICAL=YES"
          echo "W90_REPACK_METHOD_REUSED=YES"
          echo "W90_FUNCTIONAL_ADAPTATION=IMAGE_HASH_ONLY"

      - name: Replay W90 independent boot audit with W96 Image contract
        shell: bash
        env:
          W97_ADAPT_IMAGE: "1"
          W97_ADAPT_REPORT: "1"
        run: |
          set -euo pipefail

          python3 "$WORK/input/run-w90-step.py" \
            "Independently audit final boot.img"

          echo "$IMAGE_SHA256  $WORK/input/new-Image" | sha256sum -c -
          echo "W97_W90_AUDIT_ADAPTED=PASS"

      - name: Promote descriptive W97 boot image and final independent contract
        shell: bash
        run: |
          set -euo pipefail

          SRC="$WORK/release/boot.img"
          DST="$WORK/release/$FINAL_BOOT_NAME"

          test -s "$SRC"
          mv "$SRC" "$DST"
          rm -f "$WORK/release/boot.img.sha256"

          (
            cd "$WORK/release"
            sha256sum "$FINAL_BOOT_NAME" > "$FINAL_BOOT_NAME.sha256"
            sha256sum -c "$FINAL_BOOT_NAME.sha256"
          )

          test "$(find "$WORK/release" -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(stat -c '%s' "$DST")" = "134217728"

          python3 - "$DST" "$WORK/input/new-Image" "$W94_TRY_UMOUNT_BOOT_SHA256" <<'PY'
          import hashlib
          import struct
          import sys
          from pathlib import Path

          boot = Path(sys.argv[1]).read_bytes()
          image = Path(sys.argv[2]).read_bytes()
          old_w94_try_boot = sys.argv[3]

          EXPECT_IMAGE = "579f012d0772d26340c69969c5a932adb8b049e3977efee02e0af809df8a2d83"
          EXPECT_RAMDISK = "0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a"
          OLD_W90_BOOT = "98e12c49bd20dcb5f780ac0358b6fadc06c27843999052a2bf0ad1b362c55eee"
          
          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def need(cond, msg):
              if not cond:
                  raise SystemExit("ERROR: " + msg)

          need(len(boot) == 134217728, "W97 boot size")
          need(boot[:8] == b"ANDROID!", "Android boot magic")

          kernel_size = struct.unpack_from("<I", boot, 8)[0]
          ramdisk_size = struct.unpack_from("<I", boot, 12)[0]
          header_size = struct.unpack_from("<I", boot, 20)[0]
          header_version = struct.unpack_from("<I", boot, 40)[0]

          need(kernel_size == 29843968, "kernel size")
          need(ramdisk_size == 22061278, "ramdisk size")
          need(header_size == 1580, "header size")
          need(header_version == 3, "header version")

          ramdisk_offset = 29851648
          kernel = boot[4096:4096 + kernel_size]
          ramdisk = boot[ramdisk_offset:ramdisk_offset + ramdisk_size]

          need(kernel == image, "embedded W96 Image byte identity")
          need(sha(kernel) == EXPECT_IMAGE, "embedded W96 Image hash")
          need(sha(ramdisk) == EXPECT_RAMDISK, "stock ramdisk hash")
          need(sha(boot) != OLD_W90_BOOT, "W97 boot must differ from W90")
          need(sha(boot) != old_w94_try_boot, "W97 boot must differ from W94 TRY_UMOUNT boot")

          footer = boot[-64:]
          need(footer[:4] == b"AVBf", "AVB footer magic")
          major, minor = struct.unpack_from(">II", footer, 4)
          original, vbmeta_offset, vbmeta_size = struct.unpack_from(">QQQ", footer, 12)

          need((major, minor) == (1, 0), "AVB footer version")
          need(original == 51916800, "AVB original size")
          need(vbmeta_offset == 51916800, "AVB vbmeta offset")
          need(vbmeta_size == 896, "AVB vbmeta size")

          vbmeta = boot[vbmeta_offset:vbmeta_offset + vbmeta_size]
          need(vbmeta[:4] == b"AVB0", "embedded AVB0")
          need(struct.unpack_from(">I", vbmeta, 28)[0] == 0, "vbmeta algorithm NONE")

          auth_size, aux_size = struct.unpack_from(">QQ", vbmeta, 12)
          vals = struct.unpack_from(">QQQQQQQQQQQ", vbmeta, 32)
          desc_off, desc_size = vals[8], vals[9]
          pos = 256 + auth_size + desc_off
          end = pos + desc_size
          found = None

          while pos < end:
              tag, following = struct.unpack_from(">QQ", vbmeta, pos)
              raw = vbmeta[pos:pos + 16 + following]
              need(len(raw) == 16 + following, "descriptor length")
              if tag == 2:
                  image_size = struct.unpack_from(">Q", raw, 16)[0]
                  algo = raw[24:56].split(b"\0", 1)[0].decode()
                  name_len, salt_len, digest_len, _ = struct.unpack_from(">IIII", raw, 56)
                  q = 132
                  name = raw[q:q + name_len].decode()
                  q += name_len
                  salt = raw[q:q + salt_len]
                  q += salt_len
                  digest = raw[q:q + digest_len]
                  if name == "boot":
                      need(found is None, "duplicate boot descriptor")
                      found = (image_size, algo, salt, digest)
              pos += 16 + following

          need(found is not None, "boot hash descriptor")
          image_size, algo, salt, digest = found
          need(algo == "sha256", "boot hash algorithm")
          need(image_size == 51916800, "boot descriptor image size")
          need(hashlib.sha256(salt + boot[:image_size]).digest() == digest,
               "embedded AVB boot digest")

          print("W97_FINAL_BOOT_CONTRACT=PASS")
          print("BOOT_SHA256=" + sha(boot))
          print("BOOT_BYTES=" + str(len(boot)))
          print("EMBEDDED_W96_IMAGE_SHA256=" + sha(kernel))
          print("STOCK_RAMDISK_SHA256=" + sha(ramdisk))
          print("BOOT_HEADER_VERSION=3")
          print("EMBEDDED_AVB_HASH_VALID=YES")
          print("W97_DIFFERS_FROM_W90=YES")
          print("W97_DIFFERS_FROM_W94_TRY_UMOUNT=YES")
          PY

          echo "$EXPECTED_BOOT_SHA256  $DST" | sha256sum -c -
          BOOT_SHA="$(sha256sum "$DST" | awk '{print $1}')"
          test "$BOOT_SHA" = "$EXPECTED_BOOT_SHA256"
          echo "W97_EXPECTED_BOOT_SHA256_MATCH=PASS"

          echo "FINAL_RESULT=PASS_GEN1_W97_SUSFS_2.3_NO_TRY_UMOUNT_BOOT_IMG"
          echo "DEVICE_SCOPE=VEUX"
          echo "KERNEL_VERSION=5.4.274"
          echo "ANDROID_VERSION=13"
          echo "ROM_TARGET=HyperOS_OS1.0.12.0.TKCMIXM"
          echo "RESUKISU_PIN=$RESUKISU_COMMIT"
          echo "SUSFS_VERSION=2.3"
          echo "SUSFS_2_3_PIN=$SUSFS_2_3_COMMIT"
          echo "TRY_UMOUNT=REMOVED"
          echo "TRY_UMOUNT_KCONFIG=ABSENT_FROM_VERIFIED_W96"
          echo "TRY_UMOUNT_KERNEL_CALL=ABSENT_FROM_VERIFIED_W96"
          echo "MODULE_LOAD_FILTER_INCLUDED=NO_FROM_VERIFIED_W96"
          echo "W96_RUN_ID=$W96_RUN_ID"
          echo "W96_ARTIFACT_ID=$W96_ARTIFACT_ID"
          echo "W96_ARTIFACT_SHA256=$W96_ARTIFACT_SHA256"
          echo "IMAGE_SHA256=$IMAGE_SHA256"
          echo "STOCK_RAMDISK_SHA256=$STOCK_RAMDISK_SHA256"
          echo "BOOT_SHA256=$BOOT_SHA"
          echo "EXPECTED_BOOT_SHA256=$EXPECTED_BOOT_SHA256"
          echo "BOOT_BYTES=$(stat -c '%s' "$DST")"
          echo "BOOT_A_B_IDENTICAL=YES"
          echo "W90_REPACK_METHOD_REUSED=YES"
          echo "KERNEL_BUILD_PERFORMED=NO"
          echo "FLASHING_PERFORMED=NO"
          echo "DEVICE_ACCESSED=NO"
          echo "REAL_DEVICE_BOOT_TEST=NO"

      - name: Upload final W97 boot image only
        uses: actions/upload-artifact@v6
        with:
          name: GEN1_W97_5.4.274_SUSFS_2.3_NO_TRY_UMOUNT_FINAL_BOOT_v1-${{ github.run_number }}
          path: |
            gen1-w97-v1/release/VEUX_5.4.274_ReSukiSU_419E270B_SUSFS_2.3_NO_TRY_UMOUNT_HyperOS_OS1.0.12.0_TKCMIXM_Android13_FINAL_BOOT.img
            gen1-w97-v1/release/VEUX_5.4.274_ReSukiSU_419E270B_SUSFS_2.3_NO_TRY_UMOUNT_HyperOS_OS1.0.12.0_TKCMIXM_Android13_FINAL_BOOT.img.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
