name: 09 - ReSukiSU Reproducibility Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Repro Build ${{ matrix.build_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        build_id: ["A", "B"]

    env:
      ARCH: arm64
      KERNEL_REF: "20240619"
      COMMON_REF: "android11-5.4.274_r00"
      RESUKISU_COMMIT: "faccf4c5edc7be37776216e7d43dd3dca0239331"
      STABILITY_REVERT: "f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80"
      CASS_COMMIT_DO_NOT_REVERT: "b9b5ddba28bf9f23ac1a2af27f574291451244fd"
      DRYRUN_TRACKED_DIFF_SHA256: "b5e4a6bcfbc0c36a04423e514a06e7ad1ffbe8eb36dbe03b43ee7367d856c1e5"
      WORKFLOW08_CONFIG_SHA256: "87a6802a8f5d784cf4135b665f978d442a58f5651bf6cbe88fe2aa7dfb957f98"
      WORKFLOW08_DTB_SHA256: "42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37"
      WORKFLOW08_WARNING: "../drivers/cpufreq/qcom-cpufreq-hw.c:551:23: warning: unused variable 'c' [-Wunused-variable]"
      CLANG_PREBUILT_COMMIT: "aa2e4a514a6c85eebcc4a27149eaf9244e951a1e"
      OUT_DIR: out
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b

    steps:
      - name: Prepare artifact directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"

          {
            echo "VEUX 5.4.274 ReSukiSU reproducibility audit - build ${{ matrix.build_id }}"
            echo "Started: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "ReSukiSU: $RESUKISU_COMMIT"
            echo "Stability revert: $STABILITY_REVERT"
            echo "CASS commit intentionally NOT reverted: $CASS_COMMIT_DO_NOT_REVERT"
            echo "SUSFS intentionally not integrated in Workflow 09"
            echo "No boot.img will be created"
            echo "Nothing will be flashed"
          } > "${GITHUB_WORKSPACE}/artifacts/BUILD-INFO.txt"

          echo "${{ matrix.build_id }}" > "${ARTIFACT_DIR}/BUILD-ID.txt"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python-is-python3 \
            xz-utils

      - name: Install Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$TOOLCHAIN_DIR"

          curl --fail --location --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz" \
            -o "${RUNNER_TEMP}/clang-r416183b.tar.gz"

          tar -xzf "${RUNNER_TEMP}/clang-r416183b.tar.gz" -C "$TOOLCHAIN_DIR"

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

          "$TOOLCHAIN_DIR/bin/clang" --version | tee "${GITHUB_WORKSPACE}/artifacts/clang-version.txt"
          "$TOOLCHAIN_DIR/bin/ld.lld" --version | tee -a "${GITHUB_WORKSPACE}/artifacts/clang-version.txt"

          if ! "$TOOLCHAIN_DIR/bin/clang" --version | grep -q 'r416183b'; then
            echo "ERROR: downloaded compiler is not clang-r416183b"
            exit 1
          fi

          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-size llvm-strip; do
            if [ ! -x "$TOOLCHAIN_DIR/bin/$tool" ]; then
              echo "ERROR: missing toolchain binary: $tool"
              exit 1
            fi
          done

      - name: Checkout VEUX source
        uses: actions/checkout@v6
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: "20240619"
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Prepare Stability Candidate 2
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BASE_SHA="$(git rev-parse HEAD)"
          echo "BASE_SHA=$BASE_SHA" | tee "${ARTIFACT_DIR}/candidate2.txt"

          git remote remove android-common 2>/dev/null || true
          git remote add android-common https://android.googlesource.com/kernel/common
          git fetch --no-tags android-common "$COMMON_REF"
          git merge --no-edit FETCH_HEAD

          if ! git cat-file -e "${STABILITY_REVERT}^{commit}" 2>/dev/null; then
            echo "ERROR: Stability Candidate 2 revert commit is unavailable"
            exit 1
          fi

          git revert --no-edit "$STABILITY_REVERT"

          KERNEL_VERSION="$(make -s kernelversion)"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE_SHA="$(git rev-parse HEAD^{tree})"

          {
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "CANDIDATE_TREE_SHA=$CANDIDATE_TREE_SHA"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "COMMON_REF=$COMMON_REF"
            echo "STABILITY_REVERT=$STABILITY_REVERT"
            echo "CASS_COMMIT_DO_NOT_REVERT=$CASS_COMMIT_DO_NOT_REVERT"
          } | tee -a "${ARTIFACT_DIR}/candidate2.txt"

          echo "$CANDIDATE_TREE_SHA" > "${ARTIFACT_DIR}/candidate-tree-sha.txt"

          if [ "$KERNEL_VERSION" != "5.4.274" ]; then
            echo "ERROR: expected kernel 5.4.274, got $KERNEL_VERSION"
            exit 1
          fi

          echo "CASS is intentionally left exactly as in the successful Candidate 2 path."

      - name: SUSFS preservation guard
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          MATCHES="$(
            grep -RInE \
              --exclude-dir=.git \
              --exclude-dir=out \
              --include='*.c' \
              --include='*.h' \
              --include='Kconfig*' \
              --include='Makefile*' \
              --include='*.mk' \
              '(^|[^A-Za-z0-9_])(CONFIG_KSU_SUSFS|CONFIG_SUSFS|susfs_[A-Za-z0-9_]+|SUSFS_VERSION|susfs\.h)([^A-Za-z0-9_]|$)' \
              fs include kernel security mm 2>/dev/null || true
          )"

          if [ -n "$MATCHES" ]; then
            echo "ERROR: existing kernel-side SUSFS material detected"
            printf '%s\n' "$MATCHES" | tee "${ARTIFACT_DIR}/SUSFS-GUARD.txt"
            exit 1
          fi

          {
            echo "SUSFS PRESERVATION GUARD"
            echo "========================"
            echo
            echo "No existing SUSFS kernel-side backport detected."
          } | tee "${ARTIFACT_DIR}/SUSFS-GUARD.txt"

      - name: Replace old KernelSU with pinned ReSukiSU
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d drivers/kernelsu ]; then
            echo "ERROR: legacy drivers/kernelsu was not found"
            exit 1
          fi

          find drivers/kernelsu -type f | sort > "${ARTIFACT_DIR}/legacy-kernelsu-files.txt"
          rm -rf drivers/kernelsu

          rm -rf KernelSU
          git clone https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          git -C KernelSU checkout --detach "$RESUKISU_COMMIT"

          RESOLVED_KSU_SHA="$(git -C KernelSU rev-parse HEAD)"
          if [ "$RESOLVED_KSU_SHA" != "$RESUKISU_COMMIT" ]; then
            echo "ERROR: ReSukiSU pin mismatch"
            exit 1
          fi

          ln -s ../KernelSU/kernel drivers/kernelsu

          if [ ! -L drivers/kernelsu ]; then
            echo "ERROR: drivers/kernelsu is not a symlink"
            exit 1
          fi

          if [ "$(readlink -f drivers/kernelsu)" != "$(readlink -f KernelSU/kernel)" ]; then
            echo "ERROR: drivers/kernelsu does not resolve to pinned ReSukiSU/kernel"
            exit 1
          fi

          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            echo "ERROR: drivers/Kconfig no longer sources drivers/kernelsu/Kconfig"
            exit 1
          fi

          if ! grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile; then
            echo "ERROR: drivers/Makefile no longer builds kernelsu/"
            exit 1
          fi

          if ! grep -qF 'obj-$(CONFIG_KSU) += kernelsu.o' drivers/kernelsu/Kbuild; then
            echo "ERROR: pinned ReSukiSU Kbuild does not define kernelsu.o"
            exit 1
          fi

          echo "$RESOLVED_KSU_SHA" > "${ARTIFACT_DIR}/resukisu-commit.txt"

      - name: Apply exact Workflow 07 tracked integration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/workflow07-tracked.diff" <<'PATCH'
          diff --git a/arch/arm64/configs/veux_defconfig b/arch/arm64/configs/veux_defconfig
          index a841afe0a397..8df555593d00 100644
          --- a/arch/arm64/configs/veux_defconfig
          +++ b/arch/arm64/configs/veux_defconfig
          @@ -693,3 +693,13 @@ CONFIG_UBSAN_TRAP=y
           # CONFIG_UBSAN_SHIFT is not set
           # CONFIG_UBSAN_BOOL is not set
           # CONFIG_UBSAN_ENUM is not set
          +
          +# ReSukiSU 5.4 Manual Hook
          +# CONFIG_DEBUG_KERNEL is not set
          +CONFIG_KSU=y
          +# CONFIG_KSU_TRACEPOINT_HOOK is not set
          +CONFIG_KSU_MANUAL_HOOK=y
          +# CONFIG_KSU_SUSFS is not set
          +CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y
          +CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y
          +CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y
          diff --git a/fs/exec.c b/fs/exec.c
          index d6baa9360004..9da39d064a66 100644
          --- a/fs/exec.c
          +++ b/fs/exec.c
          @@ -1892,24 +1892,26 @@ static int __do_execve_file(int fd, struct filename *filename,
           	return retval;
           }
           
          -#ifdef CONFIG_KSU
          -extern bool ksu_execveat_hook __read_mostly;
          -extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
          -			       void *argv, void *envp, int *flags);
          -extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
          -					void *argv, void *envp, int *flags);
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +extern int ksu_handle_execveat(
          +        int *fd,
          +        struct filename **filename_ptr,
          +        void *argv,
          +        void *envp,
          +        int *flags);
           #endif
           static int do_execveat_common(int fd, struct filename *filename,
           			      struct user_arg_ptr argv,
           			      struct user_arg_ptr envp,
           			      int flags)
           {
          -#ifdef CONFIG_KSU
          -	if (unlikely(ksu_execveat_hook))
          -		ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          -	else
          -		ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp,
          -					     &flags);
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +    ksu_handle_execveat(
          +            &fd,
          +            &filename,
          +            &argv,
          +            &envp,
          +            &flags);
           #endif
           	return __do_execve_file(fd, filename, argv, envp, flags, NULL);
           }
          diff --git a/fs/open.c b/fs/open.c
          index 8928ca363b19..7d21a9635c68 100644
          --- a/fs/open.c
          +++ b/fs/open.c
          @@ -340,7 +340,7 @@ SYSCALL_DEFINE4(fallocate, int, fd, int, mode, loff_t, offset, loff_t, len)
           	return ksys_fallocate(fd, mode, offset, len);
           }
           
          -#ifdef CONFIG_KSU
          +#ifdef CONFIG_KSU_MANUAL_HOOK
           extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
           				int *mode, int *flags);
           #endif
          @@ -358,7 +358,7 @@ long do_faccessat(int dfd, const char __user *filename, int mode)
           	int res;
           	unsigned int lookup_flags = LOOKUP_FOLLOW;
           
          -#ifdef CONFIG_KSU
          +#ifdef CONFIG_KSU_MANUAL_HOOK
           	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
           #endif
           
          diff --git a/fs/read_write.c b/fs/read_write.c
          index a81ab535810b..c39db8ca9658 100644
          --- a/fs/read_write.c
          +++ b/fs/read_write.c
          @@ -443,19 +443,10 @@ ssize_t kernel_read(struct file *file, void *buf, size_t count, loff_t *pos)
           }
           EXPORT_SYMBOL_NS(kernel_read, ANDROID_GKI_VFS_EXPORT_ONLY);
           
          -#ifdef CONFIG_KSU
          -extern bool ksu_vfs_read_hook __read_mostly;
          -extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,
          -			       size_t *count_ptr, loff_t **pos);
          -#endif
           ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)
           {
           	ssize_t ret;
           
          -#ifdef CONFIG_KSU
          -	if (unlikely(ksu_vfs_read_hook))
          -		ksu_handle_vfs_read(&file, &buf, &count, &pos);
          -#endif
           
           	if (!(file->f_mode & FMODE_READ))
           		return -EBADF;
          diff --git a/fs/stat.c b/fs/stat.c
          index e3a616b8743f..d3c2a8a6cb6a 100644
          --- a/fs/stat.c
          +++ b/fs/stat.c
          @@ -150,9 +150,21 @@ int vfs_statx_fd(unsigned int fd, struct kstat *stat,
           }
           EXPORT_SYMBOL(vfs_statx_fd);
           
          -#ifdef CONFIG_KSU
          -extern int ksu_handle_stat(int *dfd, const char __user **filename_user,
          -			   int *flags);
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +extern int ksu_handle_stat(
          +        int *dfd,
          +        const char __user **filename_user,
          +        int *flags);
          +
          +extern void ksu_handle_newfstat_ret(
          +        unsigned int *fd,
          +        struct stat __user **statbuf_ptr);
          +
          +#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          +extern void ksu_handle_fstat64_ret(
          +        unsigned long *fd,
          +        struct stat64 __user **statbuf_ptr);
          +#endif
           #endif
           /**
            * vfs_statx - Get basic and extra attributes by filename
          @@ -176,7 +188,7 @@ int vfs_statx(int dfd, const char __user *filename, int flags,
           	int error = -EINVAL;
           	unsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;
           
          -#ifdef CONFIG_KSU
          +#ifdef CONFIG_KSU_MANUAL_HOOK
           	ksu_handle_stat(&dfd, &filename, &flags);
           #endif
           
          @@ -387,6 +399,10 @@ SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)
           	if (!error)
           		error = cp_new_stat(&stat, statbuf);
           
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +    ksu_handle_newfstat_ret(&fd, &statbuf);
          +#endif
          +
           	return error;
           }
           #endif
          @@ -514,6 +530,10 @@ SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)
           	if (!error)
           		error = cp_new_stat64(&stat, statbuf);
           
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +    ksu_handle_fstat64_ret(&fd, &statbuf);
          +#endif
          +
           	return error;
           }
           
          diff --git a/kernel/reboot.c b/kernel/reboot.c
          index 8f08af3a7d04..b1c9716b8b5e 100644
          --- a/kernel/reboot.c
          +++ b/kernel/reboot.c
          @@ -310,6 +310,14 @@ DEFINE_MUTEX(system_transition_mutex);
            *
            * reboot doesn't sync: do that yourself before calling this.
            */
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +extern int ksu_handle_sys_reboot(
          +        int magic1,
          +        int magic2,
          +        unsigned int cmd,
          +        void __user **arg);
          +#endif
          +
           SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
           		void __user *, arg)
           {
          @@ -317,6 +325,14 @@ SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
           	char buffer[256];
           	int ret = 0;
           
          +#ifdef CONFIG_KSU_MANUAL_HOOK
          +    ksu_handle_sys_reboot(
          +            magic1,
          +            magic2,
          +            cmd,
          +            &arg);
          +#endif
          +
           	/* We only trust the superuser with rebooting the system. */
           	if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))
           		return -EPERM;
          diff --git a/security/selinux/selinuxfs.c b/security/selinux/selinuxfs.c
          index b5e8f527442a..93f75b83ae53 100644
          --- a/security/selinux/selinuxfs.c
          +++ b/security/selinux/selinuxfs.c
          @@ -264,7 +264,7 @@ static int sel_mmap_handle_status(struct file *filp,
           			       size, vma->vm_page_prot);
           }
           
          -static const struct file_operations sel_handle_status_ops = {
          +const struct file_operations sel_handle_status_ops = {
           	.open		= sel_open_handle_status,
           	.read		= sel_read_handle_status,
           	.mmap		= sel_mmap_handle_status,
          @@ -766,7 +766,7 @@ static ssize_t sel_write_relabel(struct file *file, char *buf, size_t size);
           static ssize_t sel_write_user(struct file *file, char *buf, size_t size);
           static ssize_t sel_write_member(struct file *file, char *buf, size_t size);
           
          -static ssize_t (*const write_op[])(struct file *, char *, size_t) = {
          +ssize_t (*const write_op[])(struct file *, char *, size_t) = {
           	[SEL_ACCESS] = sel_write_access,
           	[SEL_CREATE] = sel_write_create,
           	[SEL_RELABEL] = sel_write_relabel,
          PATCH

          git apply --check "${RUNNER_TEMP}/workflow07-tracked.diff"
          git apply "${RUNNER_TEMP}/workflow07-tracked.diff"

          TRACKED_PATHS=(
            arch/arm64/configs/veux_defconfig
            fs/exec.c
            fs/open.c
            fs/read_write.c
            fs/stat.c
            kernel/reboot.c
            security/selinux/selinuxfs.c
          )

          git diff --no-ext-diff --no-color -- "${TRACKED_PATHS[@]}" \
            > "${ARTIFACT_DIR}/RESUKISU-INTEGRATION.diff"

          ACTUAL_SHA="$(sha256sum "${ARTIFACT_DIR}/RESUKISU-INTEGRATION.diff" | awk '{print $1}')"
          echo "Workflow 07 expected diff SHA-256: $DRYRUN_TRACKED_DIFF_SHA256"
          echo "Workflow 08 actual   diff SHA-256: $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$DRYRUN_TRACKED_DIFF_SHA256" ]; then
            echo "ERROR: Workflow 08 tracked integration does not exactly reproduce Workflow 07"
            exit 1
          fi

          echo "$ACTUAL_SHA" > "${ARTIFACT_DIR}/RESUKISU-INTEGRATION.diff.sha256"
          echo "OK: Workflow 07 tracked integration reproduced byte-for-byte."

      - name: Verify ReSukiSU integration invariants
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_HOOKS=(
            "ksu_handle_execveat:fs/exec.c"
            "ksu_handle_faccessat:fs/open.c"
            "ksu_handle_stat:fs/stat.c"
            "ksu_handle_newfstat_ret:fs/stat.c"
            "ksu_handle_fstat64_ret:fs/stat.c"
            "ksu_handle_sys_reboot:kernel/reboot.c"
          )

          {
            echo "RESUKISU HOOK AUDIT"
            echo "==================="
            echo
          } > "${ARTIFACT_DIR}/HOOK-AUDIT.txt"

          for entry in "${REQUIRED_HOOKS[@]}"; do
            hook="${entry%%:*}"
            file="${entry#*:}"
            if ! grep -q "$hook" "$file"; then
              echo "ERROR: required hook missing: $hook in $file"
              exit 1
            fi
            echo "FOUND   $hook   $file" | tee -a "${ARTIFACT_DIR}/HOOK-AUDIT.txt"
          done

          INCOMPATIBLE=(
            ksu_vfs_read_hook
            ksu_handle_vfs_read
            ksu_execveat_hook
            ksu_handle_execveat_sucompat
            is_ksu_transition
          )

          for hook in "${INCOMPATIBLE[@]}"; do
            if grep -RIn \
              --exclude-dir=.git \
              --exclude-dir=out \
              --exclude-dir=kernelsu \
              --include='*.c' \
              --include='*.h' \
              "$hook" fs kernel security include mm >/dev/null 2>&1; then
              echo "ERROR: incompatible old KernelSU hook remains: $hook"
              exit 1
            fi
            echo "ABSENT  $hook" | tee -a "${ARTIFACT_DIR}/HOOK-AUDIT.txt"
          done

          if grep -qE '^[[:space:]]*static[[:space:]]+ssize_t[[:space:]]+\(\*const[[:space:]]+write_op\[\]\)' security/selinux/selinuxfs.c; then
            echo "ERROR: write_op is still static"
            exit 1
          fi

          if grep -qE '^[[:space:]]*static[[:space:]]+const[[:space:]]+struct[[:space:]]+file_operations[[:space:]]+sel_handle_status_ops' security/selinux/selinuxfs.c; then
            echo "ERROR: sel_handle_status_ops is still static"
            exit 1
          fi

          grep -qE '^[[:space:]]*ssize_t[[:space:]]+\(\*const[[:space:]]+write_op\[\]\)' security/selinux/selinuxfs.c
          grep -qE '^[[:space:]]*const[[:space:]]+struct[[:space:]]+file_operations[[:space:]]+sel_handle_status_ops' security/selinux/selinuxfs.c

          echo "EXPORT  write_op" | tee -a "${ARTIFACT_DIR}/HOOK-AUDIT.txt"
          echo "EXPORT  sel_handle_status_ops" | tee -a "${ARTIFACT_DIR}/HOOK-AUDIT.txt"

      - name: Resolve VEUX config with clang-r416183b
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            veux_defconfig 2>&1 | tee "${ARTIFACT_DIR}/defconfig.log"

          CONFIG="$OUT_DIR/.config"
          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: resolved .config was not generated"
            exit 1
          fi

          require_y() {
            local symbol="$1"
            if ! grep -qx "$symbol=y" "$CONFIG"; then
              echo "ERROR: $symbol did not resolve to y"
              grep -E "^$symbol=|^# $symbol is not set$" "$CONFIG" || true
              exit 1
            fi
            echo "OK: $symbol=y"
          }

          reject_y() {
            local symbol="$1"
            if grep -qx "$symbol=y" "$CONFIG"; then
              echo "ERROR: $symbol=y must not be active"
              exit 1
            fi
            echo "OK: $symbol is not active as y"
          }

          require_y CONFIG_KSU
          require_y CONFIG_KSU_MANUAL_HOOK
          require_y CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK
          require_y CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK
          require_y CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK
          require_y CONFIG_KALLSYMS
          require_y CONFIG_CC_IS_CLANG
          require_y CONFIG_LD_IS_LLD

          reject_y CONFIG_KSU_TRACEPOINT_HOOK
          reject_y CONFIG_KSU_SUSFS
          reject_y CONFIG_DEBUG_KERNEL
          reject_y CONFIG_KALLSYMS_ALL

          cp "$CONFIG" "${ARTIFACT_DIR}/resolved-veux.config"

          grep -E \
            '^(CONFIG_CC_VERSION_TEXT=|CONFIG_CC_IS_CLANG=|CONFIG_LD_IS_LLD=|CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_MANUAL_HOOK_AUTO_|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=|# CONFIG_KALLSYMS_ALL|CONFIG_DEBUG_KERNEL=|# CONFIG_DEBUG_KERNEL|CONFIG_KSU_TRACEPOINT_HOOK=|# CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_KSU_SUSFS=|# CONFIG_KSU_SUSFS)' \
            "$CONFIG" | tee "${ARTIFACT_DIR}/resolved-config-important.txt" || true

      - name: Build Image and DTBs with clang-r416183b
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          set +e
          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            Image dtbs 2>&1 | tee "${ARTIFACT_DIR}/build.log"
          BUILD_RC=${PIPESTATUS[0]}
          set -e

          echo "$BUILD_RC" > "${ARTIFACT_DIR}/build-exit-code.txt"

          if [ "$BUILD_RC" -ne 0 ]; then
            echo "ERROR: kernel build failed with exit code $BUILD_RC"
            exit "$BUILD_RC"
          fi

      - name: Verify real build outputs against Workflow 08 baseline
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          DTB="$OUT_DIR/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"
          VMLINUX="$OUT_DIR/vmlinux"

          for file in "$IMAGE" "$DTB" "$VMLINUX" "$OUT_DIR/.config"; do
            if [ ! -s "$file" ]; then
              echo "ERROR: expected build output missing or empty: $file"
              exit 1
            fi
          done

          NM_FILE="${RUNNER_TEMP}/vmlinux.nm"
          "$TOOLCHAIN_DIR/bin/llvm-nm" "$VMLINUX" > "$NM_FILE"

          if ! grep -Eq '[[:space:]][Tt][[:space:]]+ksu_handle_execveat$' "$NM_FILE"; then
            echo "ERROR: ksu_handle_execveat is not linked into vmlinux"
            exit 1
          fi

          if ! grep -Eq '[[:space:]][Tt][[:space:]]+ksu_handle_sys_reboot$' "$NM_FILE"; then
            echo "ERROR: ksu_handle_sys_reboot is not linked into vmlinux"
            exit 1
          fi

          if ! grep -Eq '[[:space:]][A-Za-z][[:space:]]+write_op$' "$NM_FILE"; then
            echo "ERROR: link-visible SELinux write_op symbol is absent from vmlinux"
            exit 1
          fi

          if ! grep -Eq '[[:space:]][A-Za-z][[:space:]]+sel_handle_status_ops$' "$NM_FILE"; then
            echo "ERROR: link-visible SELinux sel_handle_status_ops symbol is absent from vmlinux"
            exit 1
          fi

          cp "$IMAGE" "${ARTIFACT_DIR}/Image"
          cp "$DTB" "${ARTIFACT_DIR}/veux.dtb"
          cp "$OUT_DIR/.config" "${ARTIFACT_DIR}/build-veux.config"

          grep -E 'ksu_handle_execveat$|ksu_handle_sys_reboot$|write_op$|sel_handle_status_ops$' \
            "$NM_FILE" > "${ARTIFACT_DIR}/linked-symbols.txt"

          awk '{print $3}' "${ARTIFACT_DIR}/linked-symbols.txt" | sort -u \
            > "${ARTIFACT_DIR}/linked-symbol-names.txt"

          cat > "${RUNNER_TEMP}/expected-linked-symbol-names.txt" <<'EOF'
          ksu_handle_execveat
          ksu_handle_sys_reboot
          sel_handle_status_ops
          write_op
          EOF

          diff -u "${RUNNER_TEMP}/expected-linked-symbol-names.txt" \
            "${ARTIFACT_DIR}/linked-symbol-names.txt"

          IMAGE_SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
          DTB_SHA="$(sha256sum "$DTB" | awk '{print $1}')"
          CONFIG_SHA="$(sha256sum "$OUT_DIR/.config" | awk '{print $1}')"

          echo "$IMAGE_SHA" > "${ARTIFACT_DIR}/Image.sha256"
          echo "$DTB_SHA" > "${ARTIFACT_DIR}/veux.dtb.sha256"
          echo "$CONFIG_SHA" > "${ARTIFACT_DIR}/build-veux.config.sha256"
          stat -c '%s' "$IMAGE" > "${ARTIFACT_DIR}/Image.size"
          stat -c '%s' "$DTB" > "${ARTIFACT_DIR}/veux.dtb.size"

          if [ "$DTB_SHA" != "$WORKFLOW08_DTB_SHA256" ]; then
            echo "ERROR: veux.dtb differs from successful Workflow 08 baseline"
            echo "Expected: $WORKFLOW08_DTB_SHA256"
            echo "Actual:   $DTB_SHA"
            exit 1
          fi

          if [ "$CONFIG_SHA" != "$WORKFLOW08_CONFIG_SHA256" ]; then
            echo "ERROR: resolved config differs from successful Workflow 08 baseline"
            echo "Expected: $WORKFLOW08_CONFIG_SHA256"
            echo "Actual:   $CONFIG_SHA"
            exit 1
          fi

          KERNEL_RELEASE="$(make -s O="$OUT_DIR" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 kernelrelease)"
          echo "$KERNEL_RELEASE" > "${ARTIFACT_DIR}/kernelrelease.txt"

          grep -Ei '(^|[[:space:]])warning:' "${ARTIFACT_DIR}/build.log" \
            > "${ARTIFACT_DIR}/WARNINGS.txt" || true

          grep -Ei '(^|[[:space:]])error:' "${ARTIFACT_DIR}/build.log" \
            > "${ARTIFACT_DIR}/ERROR-LINES.txt" || true

          WARNING_COUNT="$(wc -l < "${ARTIFACT_DIR}/WARNINGS.txt" | tr -d ' ')"
          ERROR_COUNT="$(wc -l < "${ARTIFACT_DIR}/ERROR-LINES.txt" | tr -d ' ')"

          if [ "$ERROR_COUNT" -ne 0 ]; then
            echo "ERROR: successful make returned error diagnostics in build.log"
            cat "${ARTIFACT_DIR}/ERROR-LINES.txt"
            exit 1
          fi

          if [ "$WARNING_COUNT" -ne 1 ]; then
            echo "ERROR: Workflow 08 had exactly one compiler warning; this build has $WARNING_COUNT"
            cat "${ARTIFACT_DIR}/WARNINGS.txt"
            exit 1
          fi

          if ! grep -Fqx "$WORKFLOW08_WARNING" "${ARTIFACT_DIR}/WARNINGS.txt"; then
            echo "ERROR: compiler warning does not exactly match Workflow 08 baseline"
            cat "${ARTIFACT_DIR}/WARNINGS.txt"
            exit 1
          fi

          sha256sum \
            "${ARTIFACT_DIR}/Image" \
            "${ARTIFACT_DIR}/veux.dtb" \
            "${ARTIFACT_DIR}/build-veux.config" \
            > "${ARTIFACT_DIR}/SHA256SUMS.txt"

          {
            echo "BUILD RESULT: SUCCESS"
            echo "Audit build: ${{ matrix.build_id }}"
            echo "Kernel release: $KERNEL_RELEASE"
            echo "Image bytes: $(stat -c '%s' "$IMAGE")"
            echo "Image SHA-256: $IMAGE_SHA"
            echo "veux.dtb bytes: $(stat -c '%s' "$DTB")"
            echo "veux.dtb SHA-256: $DTB_SHA"
            echo "Config SHA-256: $CONFIG_SHA"
            echo "Compiler warning lines: $WARNING_COUNT"
            echo "Compiler error lines: $ERROR_COUNT"
            echo "ReSukiSU commit: $RESUKISU_COMMIT"
            echo "Manual Hook: enabled"
            echo "Tracepoint Hook: disabled"
            echo "SUSFS: not enabled yet"
            echo "CASS: not reverted"
            echo "boot.img: not created"
            echo "Flashing: not performed"
          } | tee "${ARTIFACT_DIR}/BUILD-SUMMARY.txt"

      - name: Collect failure diagnostics
        if: failure()
        working-directory: kernel
        shell: bash
        run: |
          set +e

          mkdir -p "$ARTIFACT_DIR"

          {
            echo "BUILD RESULT: FAILURE"
            echo "Finished: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "No boot.img was created by this workflow."
            echo "Nothing was flashed."
          } > "$ARTIFACT_DIR/FAILURE-SUMMARY.txt"

          git status --short > "$ARTIFACT_DIR/FAILURE-git-status.txt" 2>&1 || true
          git diff --no-ext-diff --no-color > "$ARTIFACT_DIR/FAILURE-kernel.diff" 2>&1 || true

          if [ -f "$OUT_DIR/.config" ]; then
            cp "$OUT_DIR/.config" "$ARTIFACT_DIR/.config"
            cp "$OUT_DIR/.config" "$ARTIFACT_DIR/failure-resolved-veux.config"
          fi

          if [ -f "$ARTIFACT_DIR/build.log" ]; then
            tail -n 400 "$ARTIFACT_DIR/build.log" > "$ARTIFACT_DIR/FAILURE-build-tail.txt"
          fi

          if [ -d KernelSU/.git ]; then
            git -C KernelSU rev-parse HEAD > "$ARTIFACT_DIR/FAILURE-resukisu-commit.txt" 2>&1 || true
          fi

      - name: Upload successful repro build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: veux-5.4.274-resukisu-repro-${{ matrix.build_id }}-${{ github.run_number }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: veux-5.4.274-resukisu-repro-${{ matrix.build_id }}-failure-${{ github.run_number }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  compare:
    name: Compare Repro Builds A and B
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      WORKFLOW07_DIFF_SHA256: "b5e4a6bcfbc0c36a04423e514a06e7ad1ffbe8eb36dbe03b43ee7367d856c1e5"
      WORKFLOW08_CONFIG_SHA256: "87a6802a8f5d784cf4135b665f978d442a58f5651bf6cbe88fe2aa7dfb957f98"
      WORKFLOW08_DTB_SHA256: "42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37"
      RESUKISU_COMMIT: "faccf4c5edc7be37776216e7d43dd3dca0239331"

    steps:
      - name: Download Build A
        uses: actions/download-artifact@v8
        with:
          name: veux-5.4.274-resukisu-repro-A-${{ github.run_number }}
          path: compare/A

      - name: Download Build B
        uses: actions/download-artifact@v8
        with:
          name: veux-5.4.274-resukisu-repro-B-${{ github.run_number }}
          path: compare/B

      - name: Run strict reproducibility comparison
        shell: bash
        run: |
          set -euo pipefail

          A="compare/A"
          B="compare/B"
          FINAL="repro-audit"
          mkdir -p "$FINAL/A" "$FINAL/B"

          require_nonempty() {
            local file="$1"
            if [ ! -s "$file" ]; then
              echo "ERROR: missing or empty audit file: $file"
              exit 1
            fi
          }

          require_exists() {
            local file="$1"
            if [ ! -e "$file" ]; then
              echo "ERROR: missing audit file: $file"
              exit 1
            fi
          }

          for side in "$A" "$B"; do
            for file in \
              BUILD-SUMMARY.txt \
              BUILD-ID.txt \
              Image \
              Image.sha256 \
              Image.size \
              veux.dtb \
              veux.dtb.sha256 \
              build-veux.config \
              build-veux.config.sha256 \
              candidate-tree-sha.txt \
              RESUKISU-INTEGRATION.diff.sha256 \
              resukisu-commit.txt \
              linked-symbol-names.txt \
              WARNINGS.txt \
              SUSFS-GUARD.txt \
              kernelrelease.txt \
              SHA256SUMS.txt \
              candidate2.txt \
              linked-symbols.txt \
              build.log \
              clang-version.txt; do
              require_nonempty "$side/$file"
            done
            require_exists "$side/ERROR-LINES.txt"
          done

          if [ -s "$A/ERROR-LINES.txt" ] || [ -s "$B/ERROR-LINES.txt" ]; then
            echo "ERROR: unexpected compiler error lines present"
            exit 1
          fi

          cmp "$A/candidate-tree-sha.txt" "$B/candidate-tree-sha.txt"
          cmp "$A/build-veux.config" "$B/build-veux.config"
          cmp "$A/veux.dtb" "$B/veux.dtb"
          cmp "$A/linked-symbol-names.txt" "$B/linked-symbol-names.txt"
          cmp "$A/WARNINGS.txt" "$B/WARNINGS.txt"
          cmp "$A/SUSFS-GUARD.txt" "$B/SUSFS-GUARD.txt"
          cmp "$A/RESUKISU-INTEGRATION.diff.sha256" "$B/RESUKISU-INTEGRATION.diff.sha256"
          cmp "$A/resukisu-commit.txt" "$B/resukisu-commit.txt"

          A_TREE="$(tr -d '\r\n' < "$A/candidate-tree-sha.txt")"
          B_TREE="$(tr -d '\r\n' < "$B/candidate-tree-sha.txt")"
          A_CONFIG="$(sha256sum "$A/build-veux.config" | awk '{print $1}')"
          B_CONFIG="$(sha256sum "$B/build-veux.config" | awk '{print $1}')"
          A_DTB="$(sha256sum "$A/veux.dtb" | awk '{print $1}')"
          B_DTB="$(sha256sum "$B/veux.dtb" | awk '{print $1}')"
          A_IMAGE="$(sha256sum "$A/Image" | awk '{print $1}')"
          B_IMAGE="$(sha256sum "$B/Image" | awk '{print $1}')"
          A_IMAGE_SIZE="$(stat -c '%s' "$A/Image")"
          B_IMAGE_SIZE="$(stat -c '%s' "$B/Image")"
          A_DIFF="$(tr -d '\r\n' < "$A/RESUKISU-INTEGRATION.diff.sha256")"
          B_DIFF="$(tr -d '\r\n' < "$B/RESUKISU-INTEGRATION.diff.sha256")"
          A_KSU="$(tr -d '\r\n' < "$A/resukisu-commit.txt")"
          B_KSU="$(tr -d '\r\n' < "$B/resukisu-commit.txt")"
          A_RELEASE="$(tr -d '\r\n' < "$A/kernelrelease.txt")"
          B_RELEASE="$(tr -d '\r\n' < "$B/kernelrelease.txt")"

          [ "$A_CONFIG" = "$WORKFLOW08_CONFIG_SHA256" ]
          [ "$B_CONFIG" = "$WORKFLOW08_CONFIG_SHA256" ]
          [ "$A_DTB" = "$WORKFLOW08_DTB_SHA256" ]
          [ "$B_DTB" = "$WORKFLOW08_DTB_SHA256" ]
          [ "$A_DIFF" = "$WORKFLOW07_DIFF_SHA256" ]
          [ "$B_DIFF" = "$WORKFLOW07_DIFF_SHA256" ]
          [ "$A_KSU" = "$RESUKISU_COMMIT" ]
          [ "$B_KSU" = "$RESUKISU_COMMIT" ]
          [ "$A_IMAGE_SIZE" = "$B_IMAGE_SIZE" ]

          if cmp -s "$A/Image" "$B/Image"; then
            IMAGE_COMPARISON="byte-identical"
          else
            IMAGE_COMPARISON="different bytes; recorded only (kernel build/commit metadata may differ)"
          fi

          {
            echo "VEUX 5.4.274 ReSukiSU Reproducibility Audit"
            echo "============================================"
            echo
            echo "RESULT: PASS"
            echo
            echo "Candidate 2 tree A: $A_TREE"
            echo "Candidate 2 tree B: $B_TREE"
            echo "Candidate trees: byte-equivalent by Git tree SHA"
            echo
            echo "Config A SHA-256: $A_CONFIG"
            echo "Config B SHA-256: $B_CONFIG"
            echo "Workflow 08 config SHA-256: $WORKFLOW08_CONFIG_SHA256"
            echo "Config: byte-identical A/B and identical to Workflow 08"
            echo
            echo "veux.dtb A SHA-256: $A_DTB"
            echo "veux.dtb B SHA-256: $B_DTB"
            echo "Workflow 08 veux.dtb SHA-256: $WORKFLOW08_DTB_SHA256"
            echo "veux.dtb: byte-identical A/B and identical to Workflow 08"
            echo
            echo "Workflow 07 integration diff A: $A_DIFF"
            echo "Workflow 07 integration diff B: $B_DIFF"
            echo "ReSukiSU A: $A_KSU"
            echo "ReSukiSU B: $B_KSU"
            echo "Linked symbol-name sets: identical"
            echo "Compiler warnings: identical and pinned to Workflow 08 baseline"
            echo "Compiler errors: 0 / 0"
            echo "SUSFS guard: identical"
            echo
            echo "Image A bytes: $A_IMAGE_SIZE"
            echo "Image B bytes: $B_IMAGE_SIZE"
            echo "Image A SHA-256: $A_IMAGE"
            echo "Image B SHA-256: $B_IMAGE"
            echo "Image comparison: $IMAGE_COMPARISON"
            echo "Kernel release A: $A_RELEASE"
            echo "Kernel release B: $B_RELEASE"
            echo
            echo "boot.img: not created"
            echo "Flashing: not performed"
            echo "SUSFS: not integrated in Workflow 09"
          } | tee "$FINAL/REPRODUCIBILITY-AUDIT.txt"

          for side in A B; do
            SRC="compare/$side"
            DST="$FINAL/$side"
            cp "$SRC/BUILD-SUMMARY.txt" "$DST/"
            cp "$SRC/SHA256SUMS.txt" "$DST/"
            cp "$SRC/candidate2.txt" "$DST/"
            cp "$SRC/candidate-tree-sha.txt" "$DST/"
            cp "$SRC/RESUKISU-INTEGRATION.diff.sha256" "$DST/"
            cp "$SRC/resukisu-commit.txt" "$DST/"
            cp "$SRC/linked-symbols.txt" "$DST/"
            cp "$SRC/linked-symbol-names.txt" "$DST/"
            cp "$SRC/WARNINGS.txt" "$DST/"
            cp "$SRC/ERROR-LINES.txt" "$DST/"
            cp "$SRC/SUSFS-GUARD.txt" "$DST/"
            cp "$SRC/kernelrelease.txt" "$DST/"
            cp "$SRC/build-veux.config" "$DST/"
            cp "$SRC/veux.dtb" "$DST/"
            cp "$SRC/build.log" "$DST/"
            cp "$SRC/clang-version.txt" "$DST/"
          done

          sha256sum "$FINAL/A/veux.dtb" "$FINAL/B/veux.dtb" \
            "$FINAL/A/build-veux.config" "$FINAL/B/build-veux.config" \
            > "$FINAL/REPRODUCIBILITY-SHA256SUMS.txt"

      - name: Upload final reproducibility audit
        uses: actions/upload-artifact@v7
        with:
          name: veux-5.4.274-resukisu-repro-audit-${{ github.run_number }}
          path: repro-audit
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
