        cat "$AUDIT_DIR/20-U5-O2-RESULT.txt"

        '
    - name: Finalize one complete U5-O25 evidence bundle
      if: always()
      shell: bash
      run: "set +e\nmkdir -p \"$AUDIT_DIR\"\n\nif [ ! -f \"$AUDIT_DIR/20-U5-O2-RESULT.txt\" ]; then\n  cat > \"$AUDIT_DIR/99-INCOMPLETE.txt\" <<EOF\nU5_O2_INFRASTRUCTURE=FAIL_OR_INCOMPLETE\nKERNEL_BUILD_PERFORMED=NO\nFLASH_PACKAGE_CREATED=NO\nDEVICE_PASS=NO\nARTIFACT_POLICY=ONE_SINGLE_FINAL_ARTIFACT\nEOF\nfi\n\n{\n  echo \"WORKFLOW=U5-O25\"\n  echo \"RUN_ID=$GITHUB_RUN_ID\"\n  echo \"RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT\"\n  echo \"FILE_COUNT=$(find \"$AUDIT_DIR\" -type f | wc -l)\"\n  echo \"FINAL_RESULT_PRESENT=$([ -f \"$AUDIT_DIR/20-U5-O2-RESULT.txt\" ] && echo YES || echo NO)\"\n  echo \"TARGET300_RESULT_PRESENT=$([ -f \"$AUDIT_DIR/target-5.4.300/RESULT.txt\" ] && echo YES || echo NO)\"\n  echo \"TARGET302_RESULT_PRESENT=$([ -f \"$AUDIT_DIR/target-5.4.302/RESULT.txt\" ] && echo YES || echo NO)\"\n} > \"$AUDIT_DIR/99-DIAGNOSTIC.txt\"\n\nfind \"$AUDIT_DIR\" -type f -printf '%P\\n' | LC_ALL=C sort \\\n  > \"$AUDIT_DIR/99-FILE-LIST.txt\"\n\n(\n  cd \"$AUDIT_DIR\"\n  find . -type f ! -name SHA256SUMS.txt -print0 \\\n    | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt\n  sha256sum -c SHA256SUMS.txt\n)\n"
