(\n            f\"HID_IDS_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'drivers/hid/hid-ids.h' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"PIDFD_DECLARATION_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'include/linux/pid.h' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"CAIF_HSI_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'drivers/net/caif/Kconfig' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"USBNET_CARRIER_KABI_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'include/linux/usb/usbnet.h' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"USB_CORE_SILICON_MOTION_QUIRK_UNION_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'drivers/usb/core/quirks.c' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"FUNCTIONFS_BIND_LOG_NO_WARN_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'drivers/usb/gadget/function/f_fs.c' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"POSIX_TIMER_ID_LOOP_COND_RESCHED_UNION_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'kernel/time/posix-timers.c' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"KHEADERS_TAR_REPRO_XZ_UNION_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'kernel/gen_kheaders.sh' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"QRTR_BROADCAST_PSKB_COPY_UNION_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'net/qrtr/qrtr.c' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"MACSEC_RX_ERROR_NO_UNRELATED_SA_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'drivers/net/macsec.c' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"CPUCAPS_KABI_SLOT51_SPECULATIVE_SSBS_UNION_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'arch/arm64/include/asm/cpucaps.h' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"CPUTYPE_KRYO4G_A76AE_UNION_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'arch/arm64/include/asm/cputype.h' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"CLK_RPMH_BCM_VOTE_CLAMP_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'drivers/clk/qcom/clk-rpmh.c' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"CLK_CORE_KREF_RELOCATION_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'drivers/clk/clk.c' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"ZSMALLOC_ZSPAGE_ALLOC_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'mm/zsmalloc.c' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"BRIDGE_MDB_COPY_STATS_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'net/bridge/br_forward.c' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"OOM_INCLUDE_UNION_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'mm/oom_kill.c' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"F2FS_INODE_SANITY_UNION_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'fs/f2fs/inode.c' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"SLUB_INVALID_POINTER_PANIC_UNION_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'mm/slub.c' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"SOCK_OWNER_ANDROID_KABI_RESERVE2_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'include/net/sock.h' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"SOCK_OWNER_RVH_FREE_UNION_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'net/core/sock.c' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(f\"NON_RUNTIME_DOCUMENTATION_SKIPPED={len(skipped_nonruntime)}\\n\")\n        f.write(f\"CANDIDATE_KERNELVERSION={kernelversion}\\n\")\n        f.write(f\"READY_FOR_BUILD_AUDIT={'YES' if ready else 'NO'}\\n\")\n        f.write(\"KERNEL_BUILD_PERFORMED=NO\\n\")\n        f.write(\"DEVICE_PASS=NO\\n\")\n\n    return {\n        \"target\": version,\n        \"changed\": len(entries),\n        \"conflicts\": len(runtime_conflicts),\n        \"docs_skipped\": len(skipped_nonruntime),\n        \"kernelversion\": kernelversion,\n        \"ready\": ready,\n        \"counts\": counts,\n        \"error\": False,\n        \"text_conflict_hunks\": merge_conflict_hunks,\n    }\n\ndef safe_merge_one(version, target_tag, root):\n    try:\n        return merge_one(version, target_tag, root)\n    except Exception:\n        out = audit / f\"target-{version}\"\n        out.mkdir(parents=True, exist_ok=True)\n        err = traceback.format_exc()\n        (out / \"ENGINE-ERROR.txt\").write_text(err)\n        shutil.rmtree(out / \".merge-tmp\", ignore_errors=True)\n        with (out / \"RESULT.txt\").open(\"w\") as f:\n            f.write(f\"TARGET={version}\\n\")\n            f.write(f\"OFFICIAL_TARGET_TAG={target_tag}\\n\")\n            f.write(\"ENGINE_ERROR=YES\\n\")\n            f.write(\"RUNTIME_CONFLICTS=UNKNOWN\\n\")\n            f.write(\"CANDIDATE_KERNELVERSION=UNKNOWN\\n\")\n            f.write(\"READY_FOR_BUILD_AUDIT=NO\\n\")\n            f.write(\"KERNEL_BUILD_PERFORMED=NO\\n\")\n            f.write(\"DEVICE_PASS=NO\\n\")\n        return {\n            \"target\": version,\n            \"changed\": \"UNKNOWN\",\n            \"conflicts\": \"UNKNOWN\",\n            \"docs_skipped\": \"UNKNOWN\",\n            \"kernelversion\": \"UNKNOWN\",\n            \"ready\": False,\n            \"counts\": collections.Counter(),\n            \"error\": True,\n            \"text_conflict_hunks\": \"UNKNOWN\",\n        }\n\nresults = [safe_merge_one(*t) for t in targets]\n\nwith (audit / \"20-U5-O2-SUMMARY.tsv\").open(\"w\", newline=\"\") as f:\n    w = csv.writer(f, delimiter=\"\\t\")\n    w.writerow([\n        \"target\",\"changed_paths\",\"runtime_conflicts\",\"text_conflict_hunks\",\n        \"documentation_skipped\",\"candidate_kernelversion\",\"ready_for_build_audit\",\"engine_error\"\n    ])\n    for r in results:\n        w.writerow([\n            r[\"target\"],r[\"changed\"],r[\"conflicts\"],r[\"text_conflict_hunks\"],\n            r[\"docs_skipped\"],r[\"kernelversion\"],\"YES\" if r[\"ready\"] else \"NO\",\n            \"YES\" if r[\"error\"] else \"NO\"\n        ])\n\ninfra_pass = all(not r[\"error\"] for r in results)\nwith (audit / \"20-U5-O2-RESULT.txt\").open(\"w\") as f:\n    f.write(f\"U5_O2_INFRASTRUCTURE={'PASS' if infra_pass else 'FAIL'}\\n\")\n    f.write(\"MERGE_MODEL=OFFICIAL_274__P13_VEUX__OFFICIAL_TARGET\\n\")\n    f.write(\"POSITRON_TARGET=EXCLUDED\\n\")\n    f.write(\"NEBULA_TARGET=EXCLUDED\\n\")\n    f.write(\"ROM_CUSTOM_TARGETS=EXCLUDED\\n\")\n    for r in results:\n        key=r[\"target\"].replace(\".\",\"_\")\n        f.write(f\"TARGET_{key}_RUNTIME_CONFLICTS={r['conflicts']}\\n\")\n        f.write(f\"TARGET_{key}_CANDIDATE_KERNELVERSION={r['kernelversion']}\\n\")\n        f.write(f\"TARGET_{key}_READY_FOR_BUILD_AUDIT={'YES' if r['ready'] else 'NO'}\\n\")\n    f.write(\"KERNEL_BUILD_PERFORMED=NO\\n\")\n    f.write(\"FLASH_PACKAGE_CREATED=NO\\n\")\n    f.write(\"DEVICE_PASS=NO\\n\")\n    f.write(\"ARTIFACT_POLICY=ONE_SINGLE_FINAL_ARTIFACT\\n\")\n\nPY\npython3 -m py_compile \"$RUNNER_TEMP/u5o2_merge.py\"\n"
    - name: Run P13 versus official stable three-way ports
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/u5o2_merge.py"

