name: 96 - GEN1 5.4.274 SUSFS 2.3 NO TRY_UMOUNT Isolated Build v3

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  susfs-23-no-try-umount:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    env:
      ARCH: arm64

      W88_PATH: .github/workflows/88-gen1-5.4.274-resukisu-419e270b-update-repro-build-v3.yml
      W88_WORKFLOW_SHA256: 2863ba87b06cf0865a2398bf1416c8b0d89685834a85f59b91807e355c6d7de3

      W92_PATH: .github/workflows/92-gen1-5.4.274-susfs-2.3-try-umount-isolated-compat-build-v1.yml
      W92_SOURCE_RUN_HEAD: 39777c741c74f2af61d508d6aee8bf5e6c343f5b
      W92_SOURCE_BLOB_SHA1: b827757966b00384ac207be894207c002bd32e84
      W92_WORKFLOW_SHA256: 51d19d95bcd46fc35318eb498e5f8ae10fd0a399e4972c02da27bf2da416327a

      RECIPE_PATH: .github/workflows/46C7-final-cumulative-resukisu-susfs-deterministic-cross-run-reference.yml
      W65_PATH: .github/workflows/65-kernelsu-v0.9.5-susfs-2.2.0-cross-run-reproducibility-v1.yml
      RECIPE_JOB: full-build
      RECIPE_STOP_STEP: "27"

      BASE_REF: faccf4c5edc7be37776216e7d43dd3dca0239331
      PREVIOUS_REF: 4a3785025a920e4f52584f14c663eea4850dc919
      TARGET_REF: 419e270b50ad61725185dec74f438b8cb59c6889
      SUCOMPAT_REFACTOR: 75b99e3e2f312377fc9e5d3720324c0caaf1e610
      EXECVEAT_SUPPORT: 9671b9d11e459467d41884c98e1366b13aaae2cc
      OLD_HOOK_COMPAT: cc44ff62d9dc8b84dbd7c3e4d2703f6a6fb844c3
      SUSFS_SYNC: 03b60f260cce36f23efbd26c9c334edfdc9ce7eb
      INPUT_HOOK_STABILITY: 4a3785025a920e4f52584f14c663eea4850dc919
      SELINUX_HIDE_UPDATE: 6f50cba2a3919cfcec9f9061580a04588fb465b7
      WEBVIEW_ZYGOTE_UPDATE: 419e270b50ad61725185dec74f438b8cb59c6889

      BUILDER_DIR: ${{ github.workspace }}/builder-repo
      DRIVER_DIR: ${{ github.workspace }}/w96-driver
      ARTIFACT_DIR: ${{ github.workspace }}/w96-artifact
      PATCH_DIR: ${{ github.workspace }}/w96-patches
      COMPACT_DIR: ${{ github.workspace }}/w96-compact
      OUT_DIR_NAME: out-w96

      KBUILD_BUILD_USER: w68
      KBUILD_BUILD_HOST: veux-w68
      KBUILD_BUILD_TIMESTAMP: "Tue Aug 25 00:00:00 UTC 2026"
      KBUILD_BUILD_VERSION: "1"
      SOURCE_DATE_EPOCH: "1787616000"
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

      W88_RUN_ID: "33252124378"
      W88_ARTIFACT_ID: "9715115041"
      W88_ARTIFACT_NAME: GEN1_W88_5.4.274_ReSukiSU_419E270B_COMPACT-1
      W88_ARTIFACT_SHA256: 25ec48457888386430604cab9fb20c91f778ae30672d90d2955bb38ca3fa080c
      W88_IMAGE_SHA256: d0f7abcc526ec63413236fd440cef2d9fb6cc3819ce656b1b49efde7d65cda04
      W88_IMAGE_BYTES: "29843968"
      W88_CONFIG_SHA256: d7cd955abd59da45804acc9c5e450cf8fc953da3e66bbc274212b40ee9a0b372

      SUSFS23_DIR: ${{ github.workspace }}/susfs23-official
      SUSFS23_BRANCH: gki-android12-5.10
      SUSFS22_COMMIT: d4c3914bc2e4b538d562193a65e5a11a0289d6ea
      SUSFS23_COMMIT: fb16b41a65180979f05eac837681c4dd0addffd1
      SUSFS23_EXPECTED_COMMITS: "21"

    steps:
      - name: Install W96 dependencies
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl flex git jq \
            libelf-dev libncurses-dev libssl-dev patch python3 python3-pip \
            rsync xz-utils zstd

          python3 -m pip install \
            --disable-pip-version-check \
            --no-input \
            'PyYAML==6.0.2'

      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          path: builder-repo
          fetch-depth: 0

      - name: Checkout ReSukiSU 419e270b target
        uses: actions/checkout@v6
        with:
          repository: ReSukiSU/ReSukiSU
          ref: ${{ env.TARGET_REF }}
          path: ReSukiSU-target
          fetch-depth: 0

      - name: Authenticate W88 and exact successful W92 semantic recipe
        shell: bash
        run: |
          set -euo pipefail

          W88="$BUILDER_DIR/$W88_PATH"
          test -s "$W88"
          echo "$W88_WORKFLOW_SHA256  $W88" | sha256sum -c -

          git -C "$BUILDER_DIR" cat-file -e "${W92_SOURCE_BLOB_SHA1}^{blob}"
          git -C "$BUILDER_DIR" cat-file blob "$W92_SOURCE_BLOB_SHA1" > "$RUNNER_TEMP/w92-pinned.yml"

          test "$(git -C "$BUILDER_DIR" hash-object "$RUNNER_TEMP/w92-pinned.yml")" = "$W92_SOURCE_BLOB_SHA1"
          echo "$W92_WORKFLOW_SHA256  $RUNNER_TEMP/w92-pinned.yml" | sha256sum -c -

          git -C "$BUILDER_DIR" cat-file -e "$W92_SOURCE_RUN_HEAD:$W92_PATH"
          git -C "$BUILDER_DIR" show "$W92_SOURCE_RUN_HEAD:$W92_PATH" > "$RUNNER_TEMP/w92-from-run.yml"
          cmp -s "$RUNNER_TEMP/w92-pinned.yml" "$RUNNER_TEMP/w92-from-run.yml"

          grep -Fxq \
            'name: 92 - GEN1 5.4.274 SUSFS 2.3 + TRY_UMOUNT Isolated Compatibility Build v1' \
            "$RUNNER_TEMP/w92-pinned.yml"
          grep -Fq "$SUSFS23_COMMIT" "$GITHUB_WORKSPACE/w92-pinned.yml"

          echo "W88_SOURCE_AUTH=PASS"
          echo "W92_SEMANTIC_RECIPE_AUTH=PASS"

      - name: Initialize isolated W96 and replay helpers
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$DRIVER_DIR" \
            "$ARTIFACT_DIR" \
            "$PATCH_DIR" \
            "$COMPACT_DIR" \
            "$GITHUB_WORKSPACE/w72-build-a" \
            "$GITHUB_WORKSPACE/$OUT_DIR_NAME"

          mkdir -p \
            "$DRIVER_DIR" \
            "$ARTIFACT_DIR" \
            "$PATCH_DIR" \
            "$COMPACT_DIR"

          cat > "$BUILDER_DIR/.w96-run-w88-step.py" <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          import yaml

          if len(sys.argv) != 2:
              raise SystemExit("usage: w96-run-w88-step.py <exact-step-name>")

          workflow = Path(os.environ["BUILDER_DIR"]) / os.environ["W88_PATH"]
          doc = yaml.load(workflow.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          steps = doc["jobs"]["integrate-compile"]["steps"]

          name = sys.argv[1]
          matches = [s for s in steps if s.get("name") == name]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one W88 step {name!r}, got {len(matches)}")

          script = matches[0].get("run")
          if not script:
              raise SystemExit(f"W88 step {name!r} has no run block")

          print(f"=== REPLAY_W88_STEP: {name} ===", flush=True)
          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", script],
              check=True,
              env=os.environ.copy(),
          )
          PY

          cat > "$BUILDER_DIR/.w96-run-w92-step.py" <<'PY'
          import hashlib
          import os
          import subprocess
          import sys
          import yaml

          if len(sys.argv) != 2:
              raise SystemExit("usage: w96-run-w92-step.py <exact-step-name>")

          builder = os.environ["BUILDER_DIR"]
          blob_sha = os.environ["W92_SOURCE_BLOB_SHA1"]
          expected_sha256 = os.environ["W92_WORKFLOW_SHA256"]

          raw = subprocess.check_output(
              ["git", "-C", builder, "cat-file", "blob", blob_sha]
          )
          got_sha256 = hashlib.sha256(raw).hexdigest()
          if got_sha256 != expected_sha256:
              raise SystemExit(
                  f"W92 workflow SHA256 mismatch: {got_sha256} != {expected_sha256}"
              )

          doc = yaml.load(raw.decode("utf-8"), Loader=yaml.BaseLoader)
          steps = doc["jobs"]["susfs-23-compat"]["steps"]

          name = sys.argv[1]
          matches = [s for s in steps if s.get("name") == name]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one W92 step {name!r}, got {len(matches)}")

          script = matches[0].get("run")
          if not script:
              raise SystemExit(f"W92 step {name!r} has no run block")

          print(f"W92_REPLAY_BLOB_AUTH=PASS sha1={blob_sha} sha256={got_sha256}", flush=True)
          print(f"=== REPLAY_W92_SEMANTIC_STEP: {name} ===", flush=True)
          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", script],
              check=True,
              env=os.environ.copy(),
          )
          PY

          python3 -m py_compile \
            "$BUILDER_DIR/.w96-run-w88-step.py" \
            "$BUILDER_DIR/.w96-run-w92-step.py"

          cat > "$ARTIFACT_DIR/00-plan.txt" <<EOF
          W96_GEN1_5.4.274_SUSFS_2.3_NO_TRY_UMOUNT
          BASELINE=W88_V3
          RESUKISU_PIN=$TARGET_REF
          BASE_SUSFS_VERSION=2.2.0
          TARGET_SUSFS_VERSION=2.3.0
          OFFICIAL_SUSFS_2_3_COMMIT=$SUSFS23_COMMIT
          TRY_UMOUNT=REMOVED_FROM_ACTIVE_KERNEL_PATH
          W91_TRY_UMOUNT_PATCH_APPLIED=NO
          TRY_UMOUNT_KCONFIG=ABSENT
          TRY_UMOUNT_DISPATCH=ABSENT
          TRY_UMOUNT_KERNEL_CALL=ABSENT
          MODULE_LOAD_FILTER=EXCLUDED
          BOOT_IMAGE_CREATED=NO
          FLASHING_PERFORMED=NO
          DEVICE_ACCESSED=NO
          EOF

      - name: Replay W88 input authentication
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Authenticate W88 inputs"

      - name: Replay proven W65 staging driver
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Reuse proven W65 staging driver"

      - name: Replay exact 46C7 source through step 27
        shell: bash
        timeout-minutes: 100
        env:
          W64_RECIPE_PATH: .github/workflows/46C7-final-cumulative-resukisu-susfs-deterministic-cross-run-reference.yml
          W64_RECIPE_JOB: full-build
          W64_RECIPE_STOP_STEP: "27"
          W64_LANE: linux-5_4_274
          W64_SOURCE_PROVEN_NOFAULT_FIX: "no"
        run: |
          set -euo pipefail
          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Stage exact 46C7 source through step 27"

      - name: Replay W88 staged tree location
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Locate staged VEUX kernel and ReSukiSU tree"

          test -n "${KERNEL_ROOT:-}" || true
          echo "W88_TREE_LOCATION_STEP=PASS"

      - name: Replay W88 pre-update snapshot
        shell: bash
        run: |
          set -euo pipefail

          # KERNEL_ROOT/KSU_ROOT were written to $GITHUB_ENV by the previous
          # GitHub Actions step and must now be present.
          test -n "${KERNEL_ROOT:-}"
          test -n "${KSU_ROOT:-}"
          test -d "$KERNEL_ROOT"
          test -d "$KSU_ROOT"

          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Snapshot pre-update ReSukiSU and SUSFS API"

      - name: Replay W88 selected patch extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Extract selected ReSukiSU kernel patches"

      - name: Replay W88 selected ReSukiSU chain
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Apply selected ReSukiSU kernel chain"

      - name: Replay W88 cumulative 419e270b kernel uapi delta
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Apply cumulative 419e270b kernel uapi delta"

      - name: Replay W88 input-hook stability validation
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Validate new input-hook atomic-context stability fix"

      - name: Replay W88 SUSFS process-state backport
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Backport latest SUSFS 5.4 process-state API only"

      - name: Confirm exact W88-v3 source reconstruction
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KERNEL_ROOT:-}"
          test -n "${KSU_ROOT:-}"
          test -d "$KERNEL_ROOT"
          test -d "$KSU_ROOT"
          echo "W88_V3_SOURCE_RECONSTRUCTION=PASS"

      - name: Prove TRY_UMOUNT active integration is absent before SUSFS 2.3
        shell: bash
        run: |
          set -euo pipefail

          SUSFS_C="$KERNEL_ROOT/fs/susfs.c"
          KCONFIG="$KSU_ROOT/kernel/Kconfig"
          DISPATCH="$KSU_ROOT/kernel/supercall/dispatch.c"
          UMOUNT="$KSU_ROOT/kernel/feature/kernel_umount.c"
          SETUID="$KSU_ROOT/kernel/hook/setuid_hook.c"

          for f in "$SUSFS_C" "$KCONFIG" "$DISPATCH" "$UMOUNT" "$SETUID"; do
            test -s "$f"
          done

          if grep -Fq 'config KSU_SUSFS_TRY_UMOUNT' "$KCONFIG"; then
            echo "ERROR: W91 TRY_UMOUNT Kconfig unexpectedly present" >&2
            exit 1
          fi

          if grep -Fq 'case CMD_SUSFS_ADD_TRY_UMOUNT' "$DISPATCH"; then
            echo "ERROR: W91 TRY_UMOUNT dispatch unexpectedly present" >&2
            exit 1
          fi

          if grep -Fq 'susfs_try_umount(new_uid);' "$UMOUNT"; then
            echo "ERROR: W91 TRY_UMOUNT normal-zygote call unexpectedly present" >&2
            exit 1
          fi

          if grep -Fq 'susfs_try_umount' "$SETUID"; then
            echo "ERROR: TRY_UMOUNT leaked into zygote_next path" >&2
            exit 1
          fi

          if grep -Eq '^[[:space:]]*void[[:space:]]+susfs_(add_)?try_umount[[:space:]]*\(' "$SUSFS_C"; then
            echo "ERROR: W91 TRY_UMOUNT implementation unexpectedly present" >&2
            exit 1
          fi

          {
            echo "W91_TRY_UMOUNT_PATCH_APPLIED=NO"
            echo "TRY_UMOUNT_KCONFIG=ABSENT"
            echo "TRY_UMOUNT_DISPATCH=ABSENT"
            echo "TRY_UMOUNT_NORMAL_ZYGOTE_CALL=ABSENT"
            echo "TRY_UMOUNT_ZYGOTE_NEXT_CALL=ABSENT"
            echo "TRY_UMOUNT_IMPLEMENTATION=ABSENT"
          } | tee "$ARTIFACT_DIR/17-no-try-umount-baseline.txt"

      - name: Re-authenticate immutable W92 semantic recipe after staging
        shell: bash
        run: |
          set -euo pipefail

          test -n "$W92_SOURCE_BLOB_SHA1"
          git -C "$BUILDER_DIR" cat-file -e "${W92_SOURCE_BLOB_SHA1}^{blob}"
          git -C "$BUILDER_DIR" cat-file blob "$W92_SOURCE_BLOB_SHA1" > "$RUNNER_TEMP/w92-after-staging.yml"
          echo "$W92_WORKFLOW_SHA256  $RUNNER_TEMP/w92-after-staging.yml" | sha256sum -c -

          grep -Fxq \
            'name: 92 - GEN1 5.4.274 SUSFS 2.3 + TRY_UMOUNT Isolated Compatibility Build v1' \
            "$RUNNER_TEMP/w92-after-staging.yml"
          grep -Fq "$SUSFS23_COMMIT" "$RUNNER_TEMP/w92-after-staging.yml"

          echo "W92_POST_STAGING_IMMUTABLE_BLOB_AUTH=PASS"

      - name: Authenticate official SUSFS 2.3 delta source
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 "$BUILDER_DIR/.w96-run-w92-step.py" \
            "Authenticate official SUSFS 2.3 source and 21-commit delta"

      - name: Classify official SUSFS 2.2 to 2.3 delta
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BUILDER_DIR/.w96-run-w92-step.py" \
            "Classify all SUSFS 2.2 to 2.3 commits against W91 baseline"

          echo "W96_SUSFS_2_3_SOURCE_AND_CLASSIFICATION=PASS"

      - name: Apply exact missing SUSFS 2.3 semantics without TRY_UMOUNT
        shell: bash
        run: |
          set -euo pipefail

          python3 "$BUILDER_DIR/.w96-run-w92-step.py" \
            "Apply missing SUSFS 2.3 semantics to 5.4.274 and ReSukiSU 419e270b"

          echo "W96_SUSFS_2_3_SEMANTIC_APPLY=PASS"

      - name: Validate SUSFS 2.3 semantics and prove TRY_UMOUNT remains absent
        shell: bash
        run: |
          set -euo pipefail

          SUSFS_C="$KERNEL_ROOT/fs/susfs.c"
          SUSFS_H="$KERNEL_ROOT/include/linux/susfs.h"
          SUSFS_DEF="$KERNEL_ROOT/include/linux/susfs_def.h"
          NS="$KERNEL_ROOT/fs/namespace.c"
          PROC_NS="$KERNEL_ROOT/fs/proc_namespace.c"
          NAMEI="$KERNEL_ROOT/fs/namei.c"
          TASK_MMU="$KERNEL_ROOT/fs/proc/task_mmu.c"
          SUCOMPAT="$KSU_ROOT/kernel/feature/sucompat.c"
          KCONFIG="$KSU_ROOT/kernel/Kconfig"
          DISPATCH="$KSU_ROOT/kernel/supercall/dispatch.c"
          UMOUNT="$KSU_ROOT/kernel/feature/kernel_umount.c"
          SETUID="$KSU_ROOT/kernel/hook/setuid_hook.c"

          grep -Fxq '#define SUSFS_VERSION "v2.3.0"' "$SUSFS_H"

          grep -Fq 'susfs_is_current_proc_umounted_for_zygote_next()' "$NS"
          grep -Fq 'p->mnt_id < DEFAULT_KSU_MNT_ID' "$NS"
          grep -Fq '&p->mnt_parent->mnt == mnt' "$NS"
          grep -Fq 'p->mnt_mountpoint == dentry' "$NS"

          grep -Fq 'memcpy(buf_ptr, config_string, tmp_size);' "$SUSFS_C"
          ! grep -Fq 'strncpy(' "$SUSFS_C"
          grep -Fq 'DEFINE_STATIC_KEY_FALSE(susfs_is_hide_sus_mnts_for_non_su_procs_enabled);' "$SUSFS_C"

          grep -Fq 'susfs_show_mountinfo' "$PROC_NS"
          grep -Fq 'susfs_open_redirect_spoof_do_sys_openat' "$NAMEI"
          grep -Fq 'susfs_open_redirect_spoof_show_map_vma_srcu' "$TASK_MMU"
          grep -Fq 'synchronize_srcu' "$SUSFS_C"

          grep -Fq 'TIF_PROC_NO_SU' "$SUSFS_DEF"
          grep -Fq 'TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT' "$SUSFS_DEF"

          export W96_SUCOMPAT="$SUCOMPAT"
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          s = Path(os.environ["W96_SUCOMPAT"]).read_text(encoding="utf-8")

          def body(pattern):
              m = re.search(pattern, s)
              if not m:
                  raise SystemExit("function missing: " + pattern)
              i = m.end()
              depth = 1
              while i < len(s) and depth:
                  depth += (s[i] == "{") - (s[i] == "}")
                  i += 1
              if depth:
                  raise SystemExit("unbalanced function")
              return s[m.end():i-1]

          b = body(r"static inline int do_ksu_handle_execveat_sucompat\s*\([^)]*\)\s*\{")
          cap = "pending_sucompat = ksu_sulog_capture_sucompat_manual(filename, *argv, GFP_KERNEL);"
          esc = "escape_with_root_profile();"
          if cap not in b or esc not in b or b.index(cap) >= b.index(esc):
              raise SystemExit("uid/euid capture order incorrect")

          b = body(r"int ksu_handle_execve\s*\([^)]*\)\s*\{")
          init = "ksu_handle_execveat_init(filename, envp);"
          marker = "SUSFS 2.3: fresh root-access recheck"
          if init not in b or marker not in b or b.index(marker) < b.index(init):
              raise SystemExit("fresh root-access recheck missing")

          print("SUSFS_2_3_RESUKISU_SEMANTICS=PASS")
          PY

          if grep -Fq 'config KSU_SUSFS_TRY_UMOUNT' "$KCONFIG"; then
            echo "ERROR: TRY_UMOUNT Kconfig reappeared" >&2
            exit 1
          fi
          if grep -Fq 'case CMD_SUSFS_ADD_TRY_UMOUNT' "$DISPATCH"; then
            echo "ERROR: TRY_UMOUNT dispatch reappeared" >&2
            exit 1
          fi
          if grep -Fq 'susfs_try_umount(new_uid);' "$UMOUNT"; then
            echo "ERROR: TRY_UMOUNT normal-zygote call reappeared" >&2
            exit 1
          fi
          if grep -Fq 'susfs_try_umount' "$SETUID"; then
            echo "ERROR: TRY_UMOUNT zygote_next call present" >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*void[[:space:]]+susfs_(add_)?try_umount[[:space:]]*\(' "$SUSFS_C"; then
            echo "ERROR: TRY_UMOUNT implementation reappeared" >&2
            exit 1
          fi

          if find "$KSU_ROOT/kernel" -type f -name '*module_load_filter*' | grep -q .; then
            echo "ERROR: excluded module_load_filter present" >&2
            exit 1
          fi

          {
            echo "SUSFS_2_3_FINAL_SEMANTIC_AUDIT=PASS"
            echo "SUSFS_VERSION=v2.3.0"
            echo "OFFICIAL_DELTA_COMMITS=21"
            echo "ZYGOTE_NEXT_LOOKUP_MNT_FIX=PASS"
            echo "ROOT_REVOKE_RECHECK=PASS"
            echo "UID_EUID_CAPTURE_ORDER=PASS"
            echo "OPEN_REDIRECT_SRCU=PASS"
            echo "TIF_PROC_NO_SU=PASS"
            echo "TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT=PASS"
            echo "TRY_UMOUNT=ABSENT"
            echo "MODULE_LOAD_FILTER_INCLUDED=NO"
          } | tee "$ARTIFACT_DIR/24-w96-susfs23-no-try-final-audit.txt"

      - name: Replay SUSFS 5.4 caller and protected compatibility audits
        shell: bash
        run: |
          set -euo pipefail

          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Audit SUSFS 2.2 5.4 caller compatibility"

          grep -Fq 'SUSFS_5_4_CALLER_API_READY=YES' \
            "$ARTIFACT_DIR/08-susfs-5.4-api.txt"

          echo "W96_CALLER_COMPATIBILITY=PASS"

      - name: Locate proven config and toolchain
        shell: bash
        run: |
          set -euo pipefail

          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Locate proven 46C7 config and toolchain"

      - name: Resolve W96 config with TRY_UMOUNT disabled
        shell: bash
        run: |
          set -euo pipefail

          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Resolve W72 config"

          if grep -Eq '^CONFIG_KSU_SUSFS_TRY_UMOUNT=(y|m)$' "$OUT_DIR/.config"; then
            echo "ERROR: TRY_UMOUNT unexpectedly enabled" >&2
            exit 1
          fi

          CONFIG_SHA="$(sha256sum "$OUT_DIR/.config" | awk '{print $1}')"
          test "$CONFIG_SHA" = "$W88_CONFIG_SHA256"

          {
            echo "TRY_UMOUNT_CONFIG=DISABLED_OR_ABSENT"
            echo "CONFIG_IDENTICAL_TO_W88=YES"
            echo "RESOLVED_CONFIG_SHA256=$CONFIG_SHA"
          } | tee "$ARTIFACT_DIR/25-w96-config.txt"

      - name: Build A W96 VEUX 5.4.274 SUSFS 2.3 no TRY_UMOUNT
        shell: bash
        timeout-minutes: 90
        run: |
          set -euo pipefail

          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Build A VEUX 5.4.274 updated kernel"

          MAP="$GITHUB_WORKSPACE/w72-build-a/System.map"
          test -s "$MAP"

          if grep -Fq 'susfs_try_umount' "$MAP"; then
            echo "ERROR: susfs_try_umount symbol present in Build A" >&2
            exit 1
          fi
          if grep -Fq 'susfs_add_try_umount' "$MAP"; then
            echo "ERROR: susfs_add_try_umount symbol present in Build A" >&2
            exit 1
          fi

          echo "BUILD_A_TRY_UMOUNT_SYMBOLS=ABSENT" \
            | tee "$ARTIFACT_DIR/26-build-a-no-try-umount.txt"

      - name: Clean output tree for independent Build B
        shell: bash
        run: |
          set -euo pipefail

          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Clean output tree for independent Build B"

      - name: Build B W96 VEUX 5.4.274 SUSFS 2.3 no TRY_UMOUNT
        shell: bash
        timeout-minutes: 90
        run: |
          set -euo pipefail

          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Build B VEUX 5.4.274 updated kernel"

          test -s "$OUT_DIR/System.map"

          if grep -Fq 'susfs_try_umount' "$OUT_DIR/System.map"; then
            echo "ERROR: susfs_try_umount symbol present in Build B" >&2
            exit 1
          fi
          if grep -Fq 'susfs_add_try_umount' "$OUT_DIR/System.map"; then
            echo "ERROR: susfs_add_try_umount symbol present in Build B" >&2
            exit 1
          fi

          echo "BUILD_B_TRY_UMOUNT_SYMBOLS=ABSENT" \
            | tee "$ARTIFACT_DIR/27-build-b-no-try-umount.txt"

      - name: Prove deterministic W96 A B reproducibility
        shell: bash
        run: |
          set -euo pipefail

          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Prove deterministic A B reproducibility"

          A="$GITHUB_WORKSPACE/w72-build-a"
          B="$OUT_DIR"

          A_IMAGE_SHA="$(sha256sum "$A/Image" | awk '{print $1}')"
          B_IMAGE_SHA="$(sha256sum "$B/arch/arm64/boot/Image" | awk '{print $1}')"
          A_CONFIG_SHA="$(sha256sum "$A/config" | awk '{print $1}')"
          B_CONFIG_SHA="$(sha256sum "$B/.config" | awk '{print $1}')"

          test "$A_IMAGE_SHA" = "$B_IMAGE_SHA"
          test "$A_CONFIG_SHA" = "$B_CONFIG_SHA"
          test "$A_CONFIG_SHA" = "$W88_CONFIG_SHA256"
          test "$A_IMAGE_SHA" != "$W88_IMAGE_SHA256"

          for map in "$A/System.map" "$B/System.map"; do
            ! grep -Fq 'susfs_try_umount' "$map"
            ! grep -Fq 'susfs_add_try_umount' "$map"
          done

          {
            echo "W96_BUILD_REPRODUCIBILITY=PASS"
            echo "W96_IMAGE_SHA256=$A_IMAGE_SHA"
            echo "W96_IMAGE_BYTES=$(stat -c '%s' "$A/Image")"
            echo "W96_CONFIG_SHA256=$A_CONFIG_SHA"
            echo "W88_IMAGE_SHA256=$W88_IMAGE_SHA256"
            echo "W88_CONFIG_SHA256=$W88_CONFIG_SHA256"
            echo "W96_IMAGE_DIFFERS_FROM_W88=YES"
            echo "W96_CONFIG_IDENTICAL_TO_W88=YES"
            echo "IMAGE_AB_IDENTICAL=YES"
            echo "CONFIG_AB_IDENTICAL=YES"
            echo "TRY_UMOUNT_BUILD_A_SYMBOLS=ABSENT"
            echo "TRY_UMOUNT_BUILD_B_SYMBOLS=ABSENT"
          } | tee "$ARTIFACT_DIR/28-w88-vs-w96.txt"

      - name: Revalidate ReSukiSU and protected SUSFS contracts
        shell: bash
        run: |
          set -euo pipefail

          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Validate ReSukiSU manual hook contracts"

          python3 "$BUILDER_DIR/.w96-run-w88-step.py" \
            "Revalidate protected SUSFS stability contracts"

          echo "W96_PROTECTED_CONTRACTS=PASS"

      - name: Promote compact W96 outputs
        shell: bash
        run: |
          set -Eeuo pipefail

          A="$GITHUB_WORKSPACE/w72-build-a"
          STAGE_DIR="$RUNNER_TEMP/w96-v1-stage"

          test -s "$A/Image"
          test -s "$A/config"

          IMAGE_SHA="$(sha256sum "$A/Image" | awk '{print $1}')"
          CONFIG_SHA="$(sha256sum "$A/config" | awk '{print $1}')"

          test "$CONFIG_SHA" = "$W88_CONFIG_SHA256"
          test "$IMAGE_SHA" != "$W88_IMAGE_SHA256"

          grep -Fxq 'OFFICIAL_SUSFS_2_3_SOURCE_AUTH=PASS' \
            "$ARTIFACT_DIR/21-susfs23-source-auth.txt"
          grep -Fxq 'UNCLASSIFIED_COUNT=0' \
            "$ARTIFACT_DIR/22-susfs23-classification.txt"
          grep -Fxq 'SUSFS_2_3_FINAL_SEMANTIC_AUDIT=PASS' \
            "$ARTIFACT_DIR/24-w96-susfs23-no-try-final-audit.txt"
          grep -Fxq 'W96_BUILD_REPRODUCIBILITY=PASS' \
            "$ARTIFACT_DIR/28-w88-vs-w96.txt"

          rm -rf "$STAGE_DIR" "$COMPACT_DIR"
          mkdir -p "$STAGE_DIR" "$COMPACT_DIR"

          cp "$A/Image" "$STAGE_DIR/GEN1_W96_Image"
          cp "$A/config" "$STAGE_DIR/GEN1_W96_config"

          for f in \
            00-plan.txt \
            17-no-try-umount-baseline.txt \
            21-susfs23-source-auth.txt \
            21-susfs23-commits.txt \
            22-susfs23-classification.txt \
            23-susfs23-applied-delta.txt \
            23-susfs23-5.4-adaptation.diff \
            24-w96-susfs23-no-try-final-audit.txt \
            25-w96-config.txt \
            26-build-a-no-try-umount.txt \
            27-build-b-no-try-umount.txt \
            28-w88-vs-w96.txt
          do
            test -s "$ARTIFACT_DIR/$f"
            cp "$ARTIFACT_DIR/$f" "$STAGE_DIR/$f"
          done

          cat > "$STAGE_DIR/W96-FINAL-VERDICT.txt" <<EOF
          W96_GEN1_5.4.274_SUSFS_2.3_NO_TRY_UMOUNT=PASS
          RESUKISU_PIN=$TARGET_REF
          SUSFS_VERSION=2.3.0
          SUSFS_2_3_COMMIT=$SUSFS23_COMMIT
          OFFICIAL_SUSFS_2_3_SOURCE_AUTH=PASS
          SUSFS_2_2_TO_2_3_COMMIT_COUNT=21
          SUSFS_2_3_COMMIT_CLASSIFICATION=PASS
          SUSFS_2_3_5_4_SEMANTIC_BACKPORT=PASS
          ZYGOTE_NEXT_LOOKUP_MNT_FIX=PASS
          ROOT_REVOKE_RECHECK=PASS
          UID_EUID_CAPTURE_ORDER_FIX=PASS
          OPEN_REDIRECT_SRCU=PASS
          TRY_UMOUNT=REMOVED
          TRY_UMOUNT_KCONFIG=ABSENT
          TRY_UMOUNT_DISPATCH=ABSENT
          TRY_UMOUNT_KERNEL_CALL=ABSENT
          TRY_UMOUNT_BUILD_SYMBOLS=ABSENT
          MODULE_LOAD_FILTER_INCLUDED=NO
          CONFIG_IDENTICAL_TO_W88=YES
          W96_IMAGE_SHA256=$IMAGE_SHA
          W96_CONFIG_SHA256=$CONFIG_SHA
          REPRODUCIBILITY=PASS
          BOOT_IMAGE_CREATED=NO
          FLASHING_PERFORMED=NO
          DEVICE_ACCESSED=NO
          REAL_DEVICE_BOOT_TEST=NO
          NEXT_STAGE=BUILD_DIAGNOSTIC_BOOT_ONLY_AFTER_W96_PASS
          EOF

          (
            cd "$STAGE_DIR"
            sha256sum \
              GEN1_W96_Image \
              GEN1_W96_config \
              W96-FINAL-VERDICT.txt \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          cp -a "$STAGE_DIR/." "$COMPACT_DIR/"

          echo "W96_V3_PROMOTION=PASS"

      - name: Final W96 v3 gate
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            GEN1_W96_Image \
            GEN1_W96_config \
            W96-FINAL-VERDICT.txt \
            SHA256SUMS.txt
          do
            test -s "$COMPACT_DIR/$f"
          done

          (
            cd "$COMPACT_DIR"
            sha256sum -c SHA256SUMS.txt
          )

          echo "$W88_CONFIG_SHA256  $COMPACT_DIR/GEN1_W96_config" | sha256sum -c -

          grep -Fxq 'W96_GEN1_5.4.274_SUSFS_2.3_NO_TRY_UMOUNT=PASS' \
            "$COMPACT_DIR/W96-FINAL-VERDICT.txt"
          grep -Fxq 'TRY_UMOUNT=REMOVED' \
            "$COMPACT_DIR/W96-FINAL-VERDICT.txt"
          grep -Fxq 'TRY_UMOUNT_BUILD_SYMBOLS=ABSENT' \
            "$COMPACT_DIR/W96-FINAL-VERDICT.txt"
          grep -Fxq 'MODULE_LOAD_FILTER_INCLUDED=NO' \
            "$COMPACT_DIR/W96-FINAL-VERDICT.txt"
          grep -Fxq 'REPRODUCIBILITY=PASS' \
            "$COMPACT_DIR/W96-FINAL-VERDICT.txt"

          echo "FINAL_RESULT=PASS_GEN1_W96_SUSFS_2.3_NO_TRY_UMOUNT"

      - name: Upload compact W96 v3 artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: GEN1_W96_5.4.274_SUSFS_2.3_NO_TRY_UMOUNT_v3-${{ github.run_number }}
          path: w96-compact/
          if-no-files-found: error
          compression-level: 9
          retention-days: 90
