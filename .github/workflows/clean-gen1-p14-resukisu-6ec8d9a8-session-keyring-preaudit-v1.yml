name: CLEAN GEN1 P14 PRE-AUDIT - ReSukiSU 6ec8d9a8 session-keyring VEUX 5.4.274 compile v1
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: clean-gen1-p14-preaudit-6ec8d9a8-${{ github.ref }}
  cancel-in-progress: false
jobs:
  clean-rebuild-ak3:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      ARCH: arm64
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
      VENDOR_TAG: '20240619'
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      P6V11_ARTIFACT_PREFIX: clean-gen1-p6v11-v6-full-susfs-outer-integration-p7-test-boot-
      EXPECTED_P5I_COMMIT: f353a9475e40ca866d570c1d0ef55e24cf6556e4
      EXPECTED_P5I_TREE: a947c1f2891c796a08373fc755e29b23139dc761
      EXPECTED_RESUKISU_BASE_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_RESUKISU_BASE_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
      RESUKISU_COMMON_BASE: faccf4c5edc7be37776216e7d43dd3dca0239331
      RESUKISU_DEVICE_PASS_BASE: 052ca27775cc9c8570e3b1ba3db7c29486d6020e
      RESUKISU_P13_DEVICE_PASS: 7741f87849f7ad7cebf82bbb4c5b89880e61e37e
      RESUKISU_TARGET: 6ec8d9a8a8be30878c388504cacf8ae7849c757b
      EXPECTED_KSU_VERSION: '35154'
      RESUKISU_EXCLUDED_MODULE_FILTER: b2ac2fc8703ce9f5226e2a38a59f8b72f8a3005c
      EXPECTED_KSU_UAPI: '4'
      CLANG_PREBUILT_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      OUT_DIR: ${{ github.workspace }}/kernel/out-p14-preaudit
      AUDIT_DIR: ${{ github.workspace }}/clean-gen1-p14-preaudit
      DIST_DIR: ${{ github.workspace }}/clean-gen1-p14-preaudit-dist
      BACKUP_DIR: ${{ github.workspace }}/p6v11-backup
      KBUILD_BUILD_USER: builder
      KBUILD_BUILD_HOST: pangu-build-component-vendor-345942-54r9t-tw0tk-tq90c
      KBUILD_BUILD_TIMESTAMP: Thu Dec 5 14:47:59 UTC 2024
      KBUILD_BUILD_VERSION: '1'
      SOURCE_DATE_EPOCH: '1733410079'
      KBUILD_FIXED_SCM_SUFFIX: -g82179e362f33
      STOCK_KERNEL_RELEASE: 5.4.274-qgki-g82179e362f33
      EFFECTIVE_KCFLAGS: -D__ANDROID_COMMON_KERNEL__
      SUSFS_UPDATE_COMMIT: 153f88df3be2501d2d33364f8fe05247aecb3cef
      P13_SOURCE_AUDIT_RUN: '34810633404'
      EXPECTED_P13_PATCH_SHA256: d56725a9d6a6dc7bf1e73a5763b894bdabb544119f4c75df5f437ccd4ff29a52
      EXPECTED_P12_EXEC_SHA256: fa3b73421f35d6220fb9e03e112a9509b76c04933af2353c9a8c65d6fb6bd6a9
      EXPECTED_P12_CONTRACT_SHA256: b6d1875f6a79231465bc78df6484f2856a427259998eb93ba9fd2597cb45ca53
      EXPECTED_P12_SUSFS_C_SHA256: e430d573ba5875a55d1ca70ba1b304e4b6727bbc42b8c3ac16f2c175b29a59c1
      EXPECTED_P12_SUSFS_H_SHA256: 3c5fb1bcc28a70c82ee5cfe0a7375bb8e7babd26618ce9b451e598fa31aa3b6e
      EXPECTED_P12_SUSFS_DEF_SHA256: b16108a5fcd4cdd7203d9f084c2154da708ab3ae6bed17109e4ec63f04ff0f68
    steps:
    - name: Initialize P14 pre-audit from immutable P13
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$BACKUP_DIR" "$AUDIT_DIR" "$DIST_DIR" "$OUT_DIR" \
               "$GITHUB_WORKSPACE/resukisu-upstream" \
               "$GITHUB_WORKSPACE/toolchains"
        mkdir -p "$BACKUP_DIR" "$AUDIT_DIR" "$DIST_DIR" "$TOOLCHAIN_DIR"

        cat > "$AUDIT_DIR/00-plan.txt" <<'EOF'
        CLEAN GEN1 P14 PRE-AUDIT
        Device: VEUX / SM6375
        Kernel: Linux 5.4.274
        Purpose: isolate and validate ReSukiSU session-keyring activation at 6ec8d9a8.

        Immutable parent:
        - P13 FUNCTIONAL DEVICE PASS
        - ReSukiSU 7741f87849f7ad7cebf82bbb4c5b89880e61e37e
        - KSU 35141 / UAPI4
        - SUSFS v2.3.0
        - P13 outer delta remains exactly:
          fs/exec.c
          include/linux/ksu_hook_contract.h

        Candidate:
        - ReSukiSU 6ec8d9a8a8be30878c388504cacf8ae7849c757b
        - expected KSU compatibility version 35154
        - SUSFS stays frozen at v2.3.0
        - module-load-filter stays deliberately excluded

        Audit goals:
        - prove P13..candidate kernel/uapi delta is limited to the session-keyring activation
        - prove VEUX uses CONFIG_KEYS=y
        - prove VEUX key_permission uses unsigned perm, not enum key_need_perm
        - prove struct cred contains session_keyring
        - prove install_session_keyring_to_cred() exists and takes a key reference
        - prove ReSukiSU selects the correct 5.4 key_permission signature
        - prove P13 post-exec delta remains byte-identical
        - run a complete Image + dtbs compile with the pinned P13 toolchain
        - create audit evidence only; do not package AK3 and do not claim DEVICE PASS
        EOF
    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates curl flex git jq \
          libelf-dev libncurses-dev libssl-dev patch python3 rsync unzip zip xz-utils zstd
    - name: Checkout exact VEUX vendor source
      uses: actions/checkout@v7
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: '20240619'
        fetch-depth: 0
        path: kernel
        persist-credentials: false
    - name: Authenticate clean vendor source
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
        test "$(make -s kernelversion)" = "5.4.268"
        test ! -e out-p12
        {
          echo "VENDOR_SHA=$(git rev-parse HEAD)"
          echo "VENDOR_KERNEL_VERSION=$(make -s kernelversion)"
          echo "FRESH_VENDOR_CHECKOUT=PASS"
        } | tee "$AUDIT_DIR/01-vendor.txt"
    - name: Locate proven P6-v11 FULL-SUSFS restore kit
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        candidates="$RUNNER_TEMP/p6v11-candidates.tsv"
        : > "$candidates"

        for page in $(seq 1 20); do
          json="$RUNNER_TEMP/artifacts-${page}.json"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}" \
            -o "$json"

          count="$(jq '.artifacts | length' "$json")"
          jq -r --arg prefix "$P6V11_ARTIFACT_PREFIX" '
            .artifacts[]
            | select(.expired == false)
            | select(.name | startswith($prefix))
            | [.created_at, (.id|tostring), .name, .archive_download_url]
            | @tsv
          ' "$json" >> "$candidates"

          test "$count" -eq 100 || break
        done

        test -s "$candidates"
        IFS=$'\t' read -r created artifact_id artifact_name archive_url \
          < <(LC_ALL=C sort -r "$candidates" | head -n1)

        test -n "$artifact_id"
        test -n "$archive_url"

        curl --fail --silent --show-error --location \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "$archive_url" -o "$RUNNER_TEMP/p6v11-backup.zip"

        unzip -q "$RUNNER_TEMP/p6v11-backup.zip" -d "$BACKUP_DIR"
        restore_dir="$(find "$BACKUP_DIR" -type d -name source-restore-kit -print -quit)"
        test -n "$restore_dir"
        test -f "$restore_dir/manifest.json"
        test -f "$restore_dir/SHA256SUMS"

        result_file="$(find "$BACKUP_DIR" -type f -name 17-result.txt -print -quit)"
        test -n "$result_file"
        grep -Fxq 'CLEAN_GEN1_P6V11_FULL_SUSFS_OUTER_INTEGRATION_DETERMINISTIC_BUILD=PASS' \
          "$result_file"

        echo "RESTORE_DIR=$restore_dir" >> "$GITHUB_ENV"
        {
          echo "RESTORE_ARTIFACT_CREATED=$created"
          echo "RESTORE_ARTIFACT_ID=$artifact_id"
          echo "RESTORE_ARTIFACT_NAME=$artifact_name"
        } | tee "$AUDIT_DIR/02-restore-selection.txt"
    - name: Verify restore kit and rebuild source tree from clean vendor
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        (
          cd "$RESTORE_DIR"
          sha256sum -c SHA256SUMS
        ) | tee "$AUDIT_DIR/03-restore-sha256.txt"

        jq -e \
          --arg p5commit "$EXPECTED_P5I_COMMIT" \
          --arg p5tree "$EXPECTED_P5I_TREE" \
          --arg rhead "$EXPECTED_RESUKISU_BASE_HEAD" \
          --arg rtree "$EXPECTED_RESUKISU_BASE_TREE" \
          '.stage == "CLEAN_GEN1_P6V11_SOURCE"
           and .p5i_commit == $p5commit
           and .p5i_tree == $p5tree
           and .resukisu_head == $rhead
           and .resukisu_tree == $rtree' \
          "$RESTORE_DIR/manifest.json" >/dev/null

        git reset --hard "$EXPECTED_VENDOR_SHA"
        git clean -fdx
        rm -rf "$OUT_DIR"

        p5_patch="$RESTORE_DIR/p5i/vendor-20240619-to-p5i-outer.patch"
        p6_patch="$RESTORE_DIR/p5i-to-p6-source-compat.patch"
        p6v11_patch="$RESTORE_DIR/p6v10-to-p6v11-full-susfs-outer.patch"

        for p in "$p5_patch" "$p6_patch" "$p6v11_patch"; do
          test -s "$p"
          git apply --check --whitespace=error --binary "$p"
          git apply --index --whitespace=error --binary "$p"
        done

        final_expected_tree="$(jq -r '.p6_source_tree' "$RESTORE_DIR/manifest.json")"
        test "$final_expected_tree" != "null"
        test "${#final_expected_tree}" -eq 40
        test "$(git write-tree)" = "$final_expected_tree"
        test "$(make -s kernelversion)" = "5.4.274"

        grep -Fxq 'CONFIG_KSU=y' arch/arm64/configs/veux_defconfig
        grep -Fxq 'CONFIG_KSU_SUSFS=y' arch/arm64/configs/veux_defconfig
        grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' arch/arm64/configs/veux_defconfig
        grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' arch/arm64/configs/veux_defconfig
        grep -Fxq 'CONFIG_LOCALVERSION="-qgki"' arch/arm64/configs/veux_defconfig

        grep -Fq 'DEFINE_SRCU(susfs_srcu_open_redirect)' fs/susfs.c
        grep -Fq 'susfs_set_current_proc_no_su' include/linux/susfs_def.h
        test -s include/linux/ksu_hook_contract.h

        sha256sum fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h \
          include/linux/ksu_hook_contract.h > "$AUDIT_DIR/04-susfs-before.sha256"

        {
          echo "CLEAN_SOURCE_RECONSTRUCTION=PASS"
          echo "OUTER_SOURCE_TREE=$final_expected_tree"
          echo "KERNEL_VERSION=$(make -s kernelversion)"
        } | tee "$AUDIT_DIR/04-source.txt"
    - name: Authenticate P13-to-6ec8d9a8 ReSukiSU delta
      shell: bash
      run: |
        set -euo pipefail
        up="$GITHUB_WORKSPACE/resukisu-upstream"
        rm -rf "$up"
        git clone -q "$RESUKISU_REPO" "$up"

        for c in "$RESUKISU_COMMON_BASE" "$RESUKISU_DEVICE_PASS_BASE" \
                 "$RESUKISU_P13_DEVICE_PASS" "$RESUKISU_TARGET" \
                 "$RESUKISU_EXCLUDED_MODULE_FILTER"; do
          git -C "$up" cat-file -e "${c}^{commit}"
        done

        git -C "$up" merge-base --is-ancestor "$RESUKISU_COMMON_BASE" "$RESUKISU_TARGET"
        git -C "$up" merge-base --is-ancestor "$RESUKISU_DEVICE_PASS_BASE" "$RESUKISU_TARGET"
        git -C "$up" merge-base --is-ancestor "$RESUKISU_P13_DEVICE_PASS" "$RESUKISU_TARGET"

        delta_count="$(git -C "$up" rev-list --count "${RESUKISU_P13_DEVICE_PASS}..${RESUKISU_TARGET}")"
        test "$delta_count" -eq 13

        mapfile -t kernel_uapi_delta < <(
          git -C "$up" diff --name-only "$RESUKISU_P13_DEVICE_PASS" "$RESUKISU_TARGET" -- kernel uapi | LC_ALL=C sort
        )
        expected=(
          kernel/compat/kernel_compat.c
          kernel/compat/kernel_compat.h
          kernel/core/init.c
          kernel/hook/lsm_hooks.c
          kernel/tools/kernel_compat.mk
        )
        test "${#kernel_uapi_delta[@]}" -eq "${#expected[@]}"
        for i in "${!expected[@]}"; do
          test "${kernel_uapi_delta[$i]}" = "${expected[$i]}"
        done

        # No UAPI delta at all.
        git -C "$up" diff --quiet "$RESUKISU_P13_DEVICE_PASS" "$RESUKISU_TARGET" -- uapi

        # Only the final candidate commit may touch kernel/uapi in this P13..target range.
        mapfile -t kernel_commits < <(
          git -C "$up" log --format='%H' "${RESUKISU_P13_DEVICE_PASS}..${RESUKISU_TARGET}" -- kernel uapi
        )
        test "${#kernel_commits[@]}" -eq 1
        test "${kernel_commits[0]}" = "$RESUKISU_TARGET"

        git -C "$up" log --reverse --format='%H %s' \
          "${RESUKISU_P13_DEVICE_PASS}..${RESUKISU_TARGET}" \
          | tee "$AUDIT_DIR/05-resukisu-delta-commits.txt"

        git -C "$up" show --stat --oneline "$RESUKISU_TARGET" \
          | tee "$AUDIT_DIR/05-target-stat.txt"

        target_count="$(git -C "$up" rev-list --count "$RESUKISU_TARGET")"
        target_version="$((30700 + target_count))"
        test "$target_version" = "$EXPECTED_KSU_VERSION"
        target_tag="$(git -C "$up" describe --abbrev=0 --tags "$RESUKISU_TARGET")"
        target_short="$(git -C "$up" rev-parse --short=8 "$RESUKISU_TARGET")"
        main_head="$(git -C "$up" rev-parse origin/main)"

        git -C "$up" show "$RESUKISU_TARGET:uapi/supercall.h" \
          | grep -Eq "KERNEL_SU_UAPI_VERSION = ${EXPECTED_KSU_UAPI};"

        {
          echo "RESUKISU_P13_DEVICE_PASS=$RESUKISU_P13_DEVICE_PASS"
          echo "RESUKISU_TARGET=$RESUKISU_TARGET"
          echo "RESUKISU_CURRENT_MAIN=$main_head"
          echo "P13_TO_TARGET_COMMITS=$delta_count"
          echo "P13_TO_TARGET_KERNEL_UAPI_COMMITS=1"
          printf 'KERNEL_UAPI_DELTA_FILES=%s\n' "${kernel_uapi_delta[*]}"
          echo "UAPI_DELTA=NONE"
          echo "TARGET_TAG=$target_tag"
          echo "TARGET_SHORT=$target_short"
          echo "TARGET_KSU_VERSION=$target_version"
          echo "TARGET_KSU_UAPI=$EXPECTED_KSU_UAPI"
          echo "P13_TO_6EC8_KERNEL_SCOPE=PASS"
        } | tee "$AUDIT_DIR/05-resukisu-target.txt"

        echo "P14_KSU_VERSION=$target_version" >> "$GITHUB_ENV"
        echo "P14_TARGET_TAG=$target_tag" >> "$GITHUB_ENV"
        echo "P14_TARGET_SHORT=$target_short" >> "$GITHUB_ENV"
    - name: Construct candidate ReSukiSU kernel/UAPI without excluded module-load filter
      shell: bash
      run: |
        set -euo pipefail
        up="$GITHUB_WORKSPACE/resukisu-upstream"
        git -C "$up" checkout -q --detach "$RESUKISU_TARGET"
        git -C "$up" reset --hard -q "$RESUKISU_TARGET"
        git -C "$up" clean -fdx -q

        python3 - <<'PY'
        from pathlib import Path
        import os

        root = Path(os.environ["GITHUB_WORKSPACE"]) / "resukisu-upstream"

        def remove_exact(path, block, expected=1):
            p = root / path
            text = p.read_text(encoding="utf-8")
            count = text.count(block)
            if count != expected:
                raise SystemExit(f"{path}: expected {expected}, found {count}: {block!r}")
            p.write_text(text.replace(block, "", expected), encoding="utf-8")

        for rel in (
            "kernel/feature/module_load_filter.c",
            "kernel/feature/module_load_filter.h",
        ):
            p = root / rel
            if not p.is_file():
                raise SystemExit(f"missing expected file: {rel}")
            p.unlink()

        remove_exact("kernel/Kbuild", "kernelsu-objs += feature/module_load_filter.o\n")
        remove_exact("kernel/core/init.c", '#include "feature/module_load_filter.h"\n')
        remove_exact(
            "kernel/core/init.c",
            'char ksu_block_modules[256];\n'
            'module_param_string(block_modules, ksu_block_modules, sizeof(ksu_block_modules), 0);\n'
            'MODULE_PARM_DESC(block_modules, "Comma-separated preset module names to acknowledge without loading");\n\n'
        )
        remove_exact("kernel/core/init.c", "        ksu_module_load_filter_hook_init();\n\n")
        remove_exact("kernel/core/init.c", "    ksu_module_load_filter_hook_exit();\n")
        PY

        test ! -e "$up/kernel/feature/module_load_filter.c"
        test ! -e "$up/kernel/feature/module_load_filter.h"
        ! grep -RFn 'module_load_filter' "$up/kernel" "$up/uapi"
        ! grep -RFn 'ksu_block_modules' "$up/kernel" "$up/uapi"
        ! grep -RFn 'block_modules' "$up/kernel" "$up/uapi"

        patch="$AUDIT_DIR/06-current-kernel-uapi-minus-module-filter.patch"
        git -C "$up" diff --binary "$RESUKISU_COMMON_BASE" -- kernel uapi > "$patch"
        test -s "$patch"

        {
          echo "CURRENT_KERNEL_UAPI_PATCH=PASS"
          echo "MODULE_LOAD_FILTER_EXCLUDED=PASS"
          echo "PATCH_SHA256=$(sha256sum "$patch" | awk '{print $1}')"
        } | tee "$AUDIT_DIR/06-current-import.txt"
    - name: Replace ReSukiSU subtree with authenticated candidate kernel/UAPI
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail
        up="$GITHUB_WORKSPACE/resukisu-upstream"
        patch="$AUDIT_DIR/06-current-kernel-uapi-minus-module-filter.patch"

        rm -rf KernelSU
        git clone -q "$RESUKISU_REPO" KernelSU
        git -C KernelSU checkout -q --detach "$RESUKISU_COMMON_BASE"
        git -C KernelSU reset --hard -q "$RESUKISU_COMMON_BASE"
        git -C KernelSU clean -fdx -q

        git -C KernelSU apply --check --whitespace=nowarn "$patch"
        git -C KernelSU apply --index --whitespace=nowarn "$patch"
        test -z "$(git -C KernelSU ls-files -u)"

        if ! diff -qr "$up/kernel" KernelSU/kernel > "$AUDIT_DIR/07-kernel-parity.txt" 2>&1; then
          cat "$AUDIT_DIR/07-kernel-parity.txt"
          exit 1
        fi
        if ! diff -qr "$up/uapi" KernelSU/uapi > "$AUDIT_DIR/07-uapi-parity.txt" 2>&1; then
          cat "$AUDIT_DIR/07-uapi-parity.txt"
          exit 1
        fi

        echo 'UPSTREAM_CURRENT_MINUS_EXCLUSION_BYTE_MATCH=PASS' \
          | tee "$AUDIT_DIR/07-import-parity.txt"
    - name: Reapply only required CLEAN-GEN1 5.4 integration contract
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        python3 - <<'PY'
        from pathlib import Path
        from textwrap import dedent
        import os

        def ensure_include(path, anchor):
            p = Path(path)
            text = p.read_text(encoding="utf-8")
            inc = '#include <linux/ksu_hook_contract.h>'
            if inc not in text:
                if anchor not in text:
                    raise SystemExit(f"anchor missing in {path}: {anchor!r}")
                text = text.replace(anchor, anchor + "\n" + inc, 1)
                p.write_text(text, encoding="utf-8")

        ensure_include("KernelSU/kernel/feature/sucompat.h", '#include "compat/kernel_compat.h"')
        ensure_include("KernelSU/kernel/runtime/ksud_integration.c", "#include <linux/version.h>")
        ensure_include("KernelSU/kernel/supercall/supercall.c", "#include <linux/anon_inodes.h>")

        p = Path("KernelSU/kernel/Kbuild")
        text = p.read_text(encoding="utf-8")
        old = dedent("""\
        KSU_LOCAL_VERSION := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-list --count HEAD)
        KSU_VERSION := $(shell expr 30000 + $(KSU_LOCAL_VERSION) + 700)

        KSU_TAG_NAME    := $(shell cd $(KSU_SRC); $(GIT_BIN) describe --abbrev=0 --tags 2>/dev/null || echo "v4.1.0")
        KSU_COMMIT_SHA  := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-parse --short=8 HEAD 2>/dev/null || echo "unknown")
        ifneq ($(shell cd $(KSU_SRC); $(GIT_BIN) diff-index --quiet HEAD; echo $$?),0)
        KSU_COMMIT_SHA  := $(KSU_COMMIT_SHA)-dirty
        endif
        KSU_BRANCH_NAME := $(shell cd $(KSU_SRC); $(GIT_BIN) branch --show-current 2>/dev/null || echo "unknown")""")
        version = os.environ["P14_KSU_VERSION"]
        tag = os.environ["P14_TARGET_TAG"]
        short = os.environ["P14_TARGET_SHORT"]
        target = os.environ["RESUKISU_TARGET"]
        new = dedent(f"""\
        KSU_LOCAL_VERSION := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-list --count HEAD)
        CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := {version}
        CLEAN_GEN1_UPSTREAM_TARGET := {target}
        KSU_VERSION := $(CLEAN_GEN1_UPSTREAM_COMPAT_VERSION)

        KSU_TAG_NAME    := {tag}
        KSU_COMMIT_SHA  := {short}-p14audit
        KSU_BRANCH_NAME := clean-gen1-p14-preaudit""")
        if old not in text:
            raise SystemExit("expected current ReSukiSU Kbuild version block not found")
        p.write_text(text.replace(old, new, 1), encoding="utf-8")
        PY

        git -C KernelSU add kernel uapi
        test -z "$(git -C KernelSU ls-files -u)"

        grep -Fq '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/feature/sucompat.h
        grep -Fq '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/runtime/ksud_integration.c
        grep -Fq '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/supercall/supercall.c
        grep -Fq "CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := $P14_KSU_VERSION" KernelSU/kernel/Kbuild
        grep -Fq "CLEAN_GEN1_UPSTREAM_TARGET := $RESUKISU_TARGET" KernelSU/kernel/Kbuild
    - name: Verify frozen P12 outer boundaries before reapplying immutable P13 delta
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        grep -Eq "KERNEL_SU_UAPI_VERSION = ${EXPECTED_KSU_UAPI};" KernelSU/uapi/supercall.h
        grep -Fq 'KSU_GET_INFO_FLAG_BUNDLED' KernelSU/uapi/supercall.h

        # 052ca277: P11 old-SUSFS / old-kernel compatibility fix must remain present.
        grep -Fq 'always flag that, to avoid old version of susfs hang in boot' \
          KernelSU/kernel/feature/sucompat.c
        grep -Fq '#define TIF_PROC_IN_KSU_EXECVE 61' KernelSU/kernel/feature/sucompat.h
        grep -Fq '#include <linux/sched/task_stack.h>' KernelSU/kernel/feature/adb_root.c

        # 7741f878: retain configured capabilities across execve for non-root profiles.
        grep -Fq 'if (profile->uid != 0)' KernelSU/kernel/policy/app_profile.c
        grep -Fq 'memcpy(&cred->cap_inheritable, &profile->capabilities.effective, sizeof(cred->cap_inheritable));' \
          KernelSU/kernel/policy/app_profile.c
        grep -Fq 'memcpy(&cred->cap_ambient, &profile->capabilities.effective, sizeof(cred->cap_ambient));' \
          KernelSU/kernel/policy/app_profile.c

        test ! -e KernelSU/kernel/feature/module_load_filter.c
        test ! -e KernelSU/kernel/feature/module_load_filter.h
        ! grep -RFn 'module_load_filter' KernelSU/kernel KernelSU/uapi
        ! grep -RFn 'block_modules' KernelSU/kernel KernelSU/uapi

        sha256sum fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h \
          include/linux/ksu_hook_contract.h > "$AUDIT_DIR/08-susfs-after.sha256"
        cmp -s "$AUDIT_DIR/04-susfs-before.sha256" "$AUDIT_DIR/08-susfs-after.sha256"

        {
          echo "RESUKISU_TARGET=$RESUKISU_TARGET"
          echo "KSU_VERSION=$P14_KSU_VERSION"
          echo "KSU_UAPI=$EXPECTED_KSU_UAPI"
          echo "OLD_SUSFS_COMPAT_FIX_052CA277=PASS"
          echo "NONROOT_EXECVE_CAPABILITY_FIX_7741F878=PASS"
          echo "SUSFS_2_3_OUTER_BYTE_PRESERVED=PASS"
          echo "MODULE_LOAD_FILTER_EXCLUDED=PASS"
          echo "CLEAN_GEN1_5_4_INTEGRATION_REAPPLIED=PASS"
        } | tee "$AUDIT_DIR/08-boundaries.txt"


        # Exact source-audit baseline identity for the two candidate files and frozen SUSFS core.
        test "$(sha256sum fs/exec.c | awk '{print $1}')" = "$EXPECTED_P12_EXEC_SHA256"
        test "$(sha256sum include/linux/ksu_hook_contract.h | awk '{print $1}')" = "$EXPECTED_P12_CONTRACT_SHA256"
        test "$(sha256sum fs/susfs.c | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_C_SHA256"
        test "$(sha256sum include/linux/susfs.h | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_H_SHA256"
        test "$(sha256sum include/linux/susfs_def.h | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_DEF_SHA256"

        echo "P12_SOURCE_AUDIT_BASELINE_HASHES=PASS" | tee -a "$AUDIT_DIR/08-boundaries.txt"
    - name: Reapply exact immutable P13 post-exec candidate
      shell: bash
      working-directory: kernel
      run: |
        set -euo pipefail

        # Re-assert the frozen parent before changing anything.
        test "$(sha256sum fs/exec.c | awk '{print $1}')" = "$EXPECTED_P12_EXEC_SHA256"
        test "$(sha256sum include/linux/ksu_hook_contract.h | awk '{print $1}')" = "$EXPECTED_P12_CONTRACT_SHA256"

        python3 - <<'PY'
        from pathlib import Path

        hdr = Path("include/linux/ksu_hook_contract.h")
        text = hdr.read_text(encoding="utf-8")
        anchor = """int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
                                void *argv, void *envp, int *flags);
        """
        addition = anchor + """
        #ifdef CONFIG_KSU_SUSFS
        int ksu_handle_post_execve(int *fd, const char *filename,
                                   void *argv, void *envp,
                                   int *flags, int *retval);
        #endif
        """
        if text.count(anchor) != 1:
            raise SystemExit(f"header execveat anchor count={text.count(anchor)}")
        if "int ksu_handle_post_execve(" in text:
            raise SystemExit("post-exec prototype already exists unexpectedly")
        hdr.write_text(text.replace(anchor, addition, 1), encoding="utf-8")

        execp = Path("fs/exec.c")
        text = execp.read_text(encoding="utf-8")
        anchor = """\tsecurity_bprm_committed_creds(bprm);
        \tmutex_unlock(&current->signal->cred_guard_mutex);
        """
        replacement = """\tsecurity_bprm_committed_creds(bprm);
        #ifdef CONFIG_KSU_SUSFS
        \tksu_handle_post_execve(NULL, NULL, NULL, NULL, NULL, NULL);
        #endif
        \tmutex_unlock(&current->signal->cred_guard_mutex);
        """
        if text.count(anchor) != 1:
            raise SystemExit(f"fs/exec.c committed-creds anchor count={text.count(anchor)}")
        if "ksu_handle_post_execve(" in text:
            raise SystemExit("post-exec call already exists unexpectedly")
        execp.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
        PY

        git diff --check

        mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
        test "${#changed[@]}" -eq 2
        test "${changed[0]}" = "fs/exec.c"
        test "${changed[1]}" = "include/linux/ksu_hook_contract.h"

        test "$(grep -Fc 'ksu_handle_post_execve(NULL, NULL, NULL, NULL, NULL, NULL);' fs/exec.c)" -eq 1
        ! grep -Fq 'ksu_install_su_fd' fs/exec.c
        test "$(grep -Fc 'int ksu_handle_post_execve(' include/linux/ksu_hook_contract.h)" -eq 1

        # Same-path ordering check proven by source-audit v2.
        python3 - <<'PY'
        from pathlib import Path
        s = Path("fs/exec.c").read_text(encoding="utf-8")
        commit = s.index("commit_creds(bprm->cred);")
        security = s.index("security_bprm_committed_creds(bprm);", commit)
        post = s.index("ksu_handle_post_execve(NULL, NULL, NULL, NULL, NULL, NULL);", security)
        unlock = s.index("mutex_unlock(&current->signal->cred_guard_mutex);", post)
        if not (commit < security < post < unlock):
            raise SystemExit(f"invalid local post-exec ordering: {[commit, security, post, unlock]}")
        print(f"LOCAL_POST_EXEC_ORDER=PASS commit={commit} security={security} post={post} unlock={unlock}")
        PY

        patch="$AUDIT_DIR/09-P13-CANDIDATE-post-exec-hook.patch"
        git diff --binary -- fs/exec.c include/linux/ksu_hook_contract.h > "$patch"
        test -s "$patch"
        test "$(sha256sum "$patch" | awk '{print $1}')" = "$EXPECTED_P13_PATCH_SHA256"

        # ReSukiSU compatibility selection must now choose the direct outer hook:
        # kernel_compat.mk defines KSU_COMPAT_NO_POST_EXECVE_HOOK only when this symbol
        # is absent from fs/exec.c.
        grep -Fq 'grep -q "ksu_handle_post_execve" $(srctree)/fs/exec.c' \
          KernelSU/kernel/tools/kernel_compat.mk
        grep -Fq '#ifdef KSU_COMPAT_NO_POST_EXECVE_HOOK' KernelSU/kernel/hook/lsm_hooks.c
        grep -Fq 'LSM_HOOK_INIT(bprm_committed_creds, ksu_handle_bprm_committed_creds)' \
          KernelSU/kernel/hook/lsm_hooks.c

        # No direct outer install means ReSukiSU must not define the old direct-call guard.
        grep -Fq 'grep -q "ksu_install_su_fd" $(srctree)/fs/exec.c' \
          KernelSU/kernel/tools/susfs_compat.mk
        ! grep -Fq 'ksu_install_su_fd' fs/exec.c

        # Frozen SUSFS implementation remains byte-identical.
        test "$(sha256sum fs/susfs.c | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_C_SHA256"
        test "$(sha256sum include/linux/susfs.h | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_H_SHA256"
        test "$(sha256sum include/linux/susfs_def.h | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_DEF_SHA256"

        {
          echo "P13_SOURCE_AUDIT_RUN=$P13_SOURCE_AUDIT_RUN"
          echo "P13_PATCH_SHA256=$EXPECTED_P13_PATCH_SHA256"
          echo "P13_CHANGED_FILES=fs/exec.c include/linux/ksu_hook_contract.h"
          echo "P13_DIRECT_OUTER_KSU_INSTALL_SU_FD=NO"
          echo "P13_LSM_POST_EXEC_FALLBACK_EXPECTED=SUPPRESSED_BY_COMPAT_MACRO_SELECTION"
          echo "P13_FROZEN_SUSFS_CORE=PASS"
          echo "P13_AUDITED_SOURCE_DELTA=PASS"
        } | tee "$AUDIT_DIR/09-p13-candidate.txt"
    - name: Audit VEUX 5.4 keyring and LSM compatibility for 6ec8d9a8
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        # Exact outer VEUX API shape expected by the candidate.
        ! grep -Fq 'key_need_perm' include/linux/key.h
        grep -Fq 'struct key' include/linux/key.h
        grep -Fq 'session_keyring;' include/linux/cred.h
        grep -Fq 'install_session_keyring_to_cred(struct cred *cred, struct key *keyring)' \
          security/keys/process_keys.c
        grep -Fq '__key_get(keyring);' security/keys/process_keys.c

        python3 - <<'PY'
        from pathlib import Path
        import re

        lsm = Path("include/linux/lsm_hooks.h").read_text(encoding="utf-8")
        sec = Path("security/security.c").read_text(encoding="utf-8")
        cred = Path("include/linux/cred.h").read_text(encoding="utf-8")
        keys = Path("security/keys/process_keys.c").read_text(encoding="utf-8")
        kh = Path("include/linux/key.h").read_text(encoding="utf-8")

        checks = {
            "LSM_KEY_PERMISSION_UNSIGNED": re.search(
                r'int\s*\(\*key_permission\)\s*\(\s*key_ref_t\s+key_ref\s*,\s*'
                r'const\s+struct\s+cred\s*\*\s*cred\s*,\s*unsigned\s+perm\s*\)',
                lsm, re.S
            ),
            "SECURITY_KEY_PERMISSION_UNSIGNED": re.search(
                r'int\s+security_key_permission\s*\(\s*key_ref_t\s+key_ref\s*,\s*'
                r'const\s+struct\s+cred\s*\*\s*cred\s*,\s*unsigned\s+perm\s*\)',
                sec, re.S
            ),
            "CRED_SESSION_KEYRING_PRESENT": re.search(
                r'struct\s+key\s*\*\s*session_keyring\s*;', cred
            ),
            "INSTALL_SESSION_KEYRING_PRESENT": re.search(
                r'int\s+install_session_keyring_to_cred\s*\(\s*struct\s+cred\s*\*\s*cred\s*,\s*'
                r'struct\s+key\s*\*\s*keyring\s*\)', keys, re.S
            ),
            "KEY_NEED_PERM_ABSENT": "key_need_perm" not in kh,
        }
        failed = [k for k, v in checks.items() if not v]
        for k, v in checks.items():
            print(f"{k}={'PASS' if v else 'FAIL'}")
        if failed:
            raise SystemExit("VEUX keyring/LSM matrix failed: " + ", ".join(failed))
        PY

        # Candidate must remove the old 4.x/Hisi-only gate and register key_permission unconditionally.
        ! grep -RFn 'KSU_COMPAT_REQUIRE_SESSION_KEYRING' KernelSU/kernel
        grep -Fq 'LSM_HOOK_INIT(key_permission, ksu_handle_key_permission)' \
          KernelSU/kernel/hook/lsm_hooks.c
        grep -Fq 'static int ksu_handle_key_permission(key_ref_t key_ref, const struct cred *cred, unsigned perm)' \
          KernelSU/kernel/hook/lsm_hooks.c
        grep -Fq 'init_session_keyring = ksu_get_session_keyring(cred);' \
          KernelSU/kernel/hook/lsm_hooks.c
        grep -Fq 'install_session_keyring_to_cred(ksu_cred, init_session_keyring);' \
          KernelSU/kernel/compat/kernel_compat.c
        grep -Fq 'init_session_keyring = ksu_get_session_keyring(current_cred());' \
          KernelSU/kernel/core/init.c

        # Compatibility detector exists, but on this VEUX source it must select unsigned perm.
        grep -Fq 'grep -q -F "key_need_perm" $(srctree)/include/linux/key.h' \
          KernelSU/kernel/tools/kernel_compat.mk
        ! grep -Fq 'key_need_perm' include/linux/key.h

        # P13 remains exactly two outer changed files and its frozen patch stays identical.
        mapfile -t outer_changed < <(git diff --name-only | LC_ALL=C sort)
        test "${#outer_changed[@]}" -eq 2
        test "${outer_changed[0]}" = "fs/exec.c"
        test "${outer_changed[1]}" = "include/linux/ksu_hook_contract.h"
        test "$(sha256sum "$AUDIT_DIR/09-P13-CANDIDATE-post-exec-hook.patch" | awk '{print $1}')" \
          = "$EXPECTED_P13_PATCH_SHA256"

        {
          echo "VEUX_CONFIG_KEYS_EXPECTED=YES"
          echo "VEUX_KEY_NEED_PERM=ABSENT"
          echo "VEUX_KEY_PERMISSION_SIGNATURE=unsigned_perm"
          echo "VEUX_CRED_SESSION_KEYRING=PASS"
          echo "VEUX_INSTALL_SESSION_KEYRING_TO_CRED=PASS"
          echo "RESUKISU_SESSION_KEYRING_GATE_REMOVED=PASS"
          echo "RESUKISU_KEY_PERMISSION_HOOK_REGISTERED=PASS"
          echo "EXPECTED_COMPAT_SELECTION=unsigned_perm"
          echo "P13_OUTER_DELTA_PRESERVED=PASS"
          echo "P14_PREAUDIT_SOURCE_MATRIX=PASS"
        } | tee "$AUDIT_DIR/10-keyring-lsm-matrix.txt"
    - name: Install pinned Android clang-r416183b
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$TOOLCHAIN_DIR"
        mkdir -p "$TOOLCHAIN_DIR"
        url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz"
        curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/clang-r416183b.tar.gz"
        tar -xzf "$RUNNER_TEMP/clang-r416183b.tar.gz" -C "$TOOLCHAIN_DIR"

        for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
          test -x "$TOOLCHAIN_DIR/bin/$tool"
        done

        "$TOOLCHAIN_DIR/bin/clang" --version | tee "$AUDIT_DIR/09-clang.txt"
    - name: Configure and compile P14 pre-audit candidate
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$TOOLCHAIN_DIR/bin:$PATH"
        export KBUILD_BUILD_USER KBUILD_BUILD_HOST KBUILD_BUILD_TIMESTAMP
        export KBUILD_BUILD_VERSION SOURCE_DATE_EPOCH KBUILD_FIXED_SCM_SUFFIX

        rm -rf "$OUT_DIR"
        make O="$OUT_DIR" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
          veux_defconfig 2>&1 | tee "$AUDIT_DIR/11-config.log"

        cp "$OUT_DIR/.config" "$AUDIT_DIR/11-dotconfig.txt"

        grep -Fxq 'CONFIG_KEYS=y' "$OUT_DIR/.config"
        grep -Fxq 'CONFIG_SECURITY=y' "$OUT_DIR/.config"
        grep -Fxq 'CONFIG_KSU=y' "$OUT_DIR/.config"
        grep -Fxq 'CONFIG_KSU_SUSFS=y' "$OUT_DIR/.config"
        grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' "$OUT_DIR/.config"
        grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' "$OUT_DIR/.config"

        make -j"$(nproc)" \
          O="$OUT_DIR" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
          KCFLAGS="$EFFECTIVE_KCFLAGS" Image dtbs \
          2>&1 | tee "$AUDIT_DIR/11-build.log"

        image="$OUT_DIR/arch/arm64/boot/Image"
        dtb="$OUT_DIR/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"
        test -s "$image"
        test -s "$dtb"
        test "$(stat -c '%s' "$image")" -gt 20000000

        strings -a "$image" > "$AUDIT_DIR/11-image-strings.txt"
        grep -Fq "Linux version $STOCK_KERNEL_RELEASE ($KBUILD_BUILD_USER@$KBUILD_BUILD_HOST)" \
          "$AUDIT_DIR/11-image-strings.txt"
        grep -Fq "$P14_TARGET_TAG-$P14_TARGET_SHORT-p14audit@ReSukiSU" \
          "$AUDIT_DIR/11-image-strings.txt"

        # Runtime-relevant candidate strings must actually be present in the compiled image.
        grep -Fq 'got init_session_keyring, trying install..' "$AUDIT_DIR/11-image-strings.txt"
        grep -Fq 'install init_session_keyring to ksu_cred' "$AUDIT_DIR/11-image-strings.txt"

        # VEUX source has no enum key_need_perm, so the enum compatibility detector must stay inactive.
        ! grep -Fq 'key need perm as enum found' "$AUDIT_DIR/11-build.log"

        # P13 post-exec ownership selection must remain unchanged.
        ! grep -Fq 'ksu_handle_post_execve hook not found' "$AUDIT_DIR/11-build.log"
        ! grep -Fq 'ksu_install_su_fd direct call found' "$AUDIT_DIR/11-build.log"

        # Record warnings/errors without treating known non-fatal warnings as a false failure.
        grep -n 'warning:' "$AUDIT_DIR/11-build.log" > "$AUDIT_DIR/11-warnings.txt" || true
        grep -n 'error:' "$AUDIT_DIR/11-build.log" > "$AUDIT_DIR/11-errors.txt" || true
        test ! -s "$AUDIT_DIR/11-errors.txt"

        {
          echo "FULL_COMPILE_IMAGE_DTBS=PASS"
          echo "CONFIG_KEYS=YES"
          echo "CONFIG_SECURITY=YES"
          echo "KEY_PERMISSION_COMPAT=unsigned_perm"
          echo "KEY_NEED_PERM_COMPAT_MACRO_EXPECTED=NOT_DEFINED"
          echo "P13_POST_EXEC_COMPAT_SELECTION=PASS"
          echo "IMAGE_BYTES=$(stat -c '%s' "$image")"
          echo "IMAGE_SHA256=$(sha256sum "$image" | awk '{print $1}')"
          echo "VEUX_DTB_SHA256=$(sha256sum "$dtb" | awk '{print $1}')"
          echo "KSU_VERSION=$P14_KSU_VERSION"
          echo "KSU_UAPI=$EXPECTED_KSU_UAPI"
        } | tee "$AUDIT_DIR/11-compile-result.txt"
    - name: Finalize P14 pre-audit verdict
      shell: bash
      run: |
        set -euo pipefail

        grep -Fxq 'P14_PREAUDIT_SOURCE_MATRIX=PASS' "$AUDIT_DIR/10-keyring-lsm-matrix.txt"
        grep -Fxq 'FULL_COMPILE_IMAGE_DTBS=PASS' "$AUDIT_DIR/11-compile-result.txt"
        grep -Fxq 'P13_AUDITED_SOURCE_DELTA=PASS' "$AUDIT_DIR/09-p13-candidate.txt"
        grep -Fxq 'MODULE_LOAD_FILTER_EXCLUDED=PASS' "$AUDIT_DIR/08-boundaries.txt"
        grep -Fxq 'SUSFS_2_3_OUTER_BYTE_PRESERVED=PASS' "$AUDIT_DIR/08-boundaries.txt"

        cat > "$AUDIT_DIR/FINAL-AUDIT-RESULT.txt" <<EOF
        CLEAN_GEN1_P14_PREAUDIT_6EC8D9A8=PASS
        DEVICE=veux
        LINUX=5.4.274
        IMMUTABLE_DEVICE_PASS_PARENT=P13
        P13_RESUKISU=7741f87849f7ad7cebf82bbb4c5b89880e61e37e
        CANDIDATE_RESUKISU=$RESUKISU_TARGET
        CANDIDATE_KSU_VERSION=$P14_KSU_VERSION
        UAPI=$EXPECTED_KSU_UAPI
        SUSFS=2.3.0_FROZEN
        MODULE_LOAD_FILTER=EXCLUDED
        VEUX_CONFIG_KEYS=YES
        VEUX_KEY_PERMISSION_SIGNATURE=unsigned_perm
        VEUX_KEY_NEED_PERM=ABSENT
        RESUKISU_SESSION_KEYRING_ACTIVATION=SOURCE_PASS
        P13_POST_EXEC_DELTA=PRESERVED
        FULL_COMPILE=PASS
        AK3_CREATED=NO
        FLASHING_PERFORMED=NO
        DEVICE_PASS_CLAIMED=NO
        NEXT_GATE=isolated_P14_AK3_build_then_real_device_test
        EOF

        sha256sum "$AUDIT_DIR"/* | LC_ALL=C sort > "$AUDIT_DIR/SHA256SUMS"
    - name: Upload P14 pre-audit evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: clean-gen1-p14-resukisu-6ec8d9a8-session-keyring-preaudit-${{ github.run_id }}
        path: clean-gen1-p14-preaudit/
        if-no-files-found: error
        retention-days: 30
