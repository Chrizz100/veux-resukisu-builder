    - name: 34 - Download and authenticate pinned clang-r416183b
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=TOOLCHAIN" > evidence/STAGE.txt

        root="$RUNNER_TEMP/p5-toolchain"
        archive="$RUNNER_TEMP/${TOOLCHAIN_DIR}.tar.gz"
        rm -rf "$root" "$archive"
        mkdir -p "$root"

        url="${TOOLCHAIN_REPO}/+archive/${TOOLCHAIN_COMMIT}/${TOOLCHAIN_DIR}.tar.gz"
        curl --fail --location --retry 4 --retry-delay 2 --retry-all-errors \
          -H 'Cache-Control: no-cache' "$url" -o "$archive"
        tar -xzf "$archive" -C "$root"

        python3 - "$root" "$GITHUB_WORKSPACE/evidence/08-TOOLCHAIN-TREE.tsv" <<'PY'
        import hashlib
        import os
        import stat
        import sys
        from pathlib import Path

        root = Path(sys.argv[1]).resolve()
        out = Path(sys.argv[2])
        rows = []

        for p in sorted(root.rglob("*"), key=lambda x: x.relative_to(root).as_posix()):
            rel = p.relative_to(root).as_posix()
            st = p.lstat()
            mode = stat.S_IMODE(st.st_mode)
            if p.is_symlink():
                rows.append(f"L\t{mode:04o}\t{rel}\t{os.readlink(p)}")
            elif p.is_dir():
                rows.append(f"D\t{mode:04o}\t{rel}")
            elif p.is_file():
                h = hashlib.sha256()
                with p.open("rb") as f:
                    for chunk in iter(lambda: f.read(1024 * 1024), b""):
                        h.update(chunk)
                rows.append(
                    f"F\t{mode:04o}\t{rel}\t{st.st_size}\t{h.hexdigest()}"
                )

        out.write_text("\n".join(rows) + "\n", encoding="utf-8")
        PY

        tree_sha="$(sha256sum evidence/08-TOOLCHAIN-TREE.tsv | awk '{print $1}')"
        clang_sha="$(sha256sum "$root/bin/clang" | awk '{print $1}')"
        lld_sha="$(sha256sum "$root/bin/ld.lld" | awk '{print $1}')"

        test "$tree_sha" = "$EXPECTED_TOOLCHAIN_TREE_SHA256"
        test "$clang_sha" = "$EXPECTED_CLANG_SHA256"
        test "$lld_sha" = "$EXPECTED_LLD_SHA256"

        "$root/bin/clang" --version > evidence/08-CLANG-VERSION.txt
