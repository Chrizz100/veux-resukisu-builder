        from pathlib import Path

        namei = Path("fs/namei.c").read_text(encoding="utf-8")
        sus = Path("fs/susfs.c").read_text(encoding="utf-8")

        sig = "static struct dentry *__lookup_hash(const struct qstr *name,"
        if namei.count(sig) != 1:
            print("LOOKUP_HASH_SIGNATURE=FAIL")
            raise SystemExit("P5-v12-v5 prerequisite failure: LOOKUP_HASH_SIGNATURE")

        start = namei.index(sig)
        brace = namei.index("{", start)
        depth = 0
        end = None
        for i in range(brace, len(namei)):
            if namei[i] == "{":
                depth += 1
            elif namei[i] == "}":
                depth -= 1
                if depth == 0:
                    end = i + 1
                    break
        if end is None:
            raise SystemExit("P5-v12-v5 prerequisite failure: LOOKUP_HASH_BODY")
        fn = namei[start:end]

        checks = {
            "LOOKUP_HASH_SIGNATURE":
                namei.count(sig) == 1,
            "LOOKUP_DCACHE_BASELINE":
                "struct dentry *dentry = lookup_dcache(name, base, flags);" in fn,
            "D_ALLOC_BASELINE":
                "dentry = d_alloc(base, name);" in fn,
            "DIRECT_IOP_LOOKUP_BASELINE":
                "old = dir->i_op->lookup(dir, dentry, flags);" in fn,
            "OLD_REPLACEMENT_BASELINE":
