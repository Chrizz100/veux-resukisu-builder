        test -s p5v4-artifact/restore-kit/p4-to-p5-outer-spoof-uname.patch
        test -s p5v4-artifact/restore-kit/p4-to-p5-kernelsu-dispatch-kconfig.patch

        echo "P5_V4_ACCEPTED_ARTIFACT_AUTH=PASS" > evidence/04-P5V4-AUTH.txt
    - name: 10 - Restore exact P5-v4 source on P4-v7
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V4_SOURCE_RESTORE" > evidence/STAGE.txt
