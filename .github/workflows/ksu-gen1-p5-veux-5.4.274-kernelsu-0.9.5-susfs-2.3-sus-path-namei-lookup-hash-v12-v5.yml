        drop = fn.index("dput(dentry);", fake)
        null = fn.index("dentry = NULL;", drop)
        retry = fn.index("goto retry_lookup;", null)
        assert helper < fake < drop < null < retry
        assert "dentry->" not in fn[drop:retry]

