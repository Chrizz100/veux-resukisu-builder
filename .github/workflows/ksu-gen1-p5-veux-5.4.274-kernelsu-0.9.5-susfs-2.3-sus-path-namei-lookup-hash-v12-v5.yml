jobs:
  backup-pass:
    name: P5-v12-v5 - automatic permanent GitHub recovery backup
    needs:
    - p5-sus-path-namei-lookup-hash-v12-v5
    if: ${{ needs.p5-sus-path-namei-lookup-hash-v12-v5.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: B01 - Initialize automatic P5-v12-v5 backup
      shell: bash
      run: |
        set -euo pipefail
        rm -rf backup-work backup-evidence
        mkdir -p backup-work backup-evidence

        tag="ksu-gen1-p5-v12-v5-pass-backup-${GITHUB_RUN_ID}"

        {
          echo "BACKUP_WORKFLOW=KSU-GEN1-P5-V12-AUTO-GITHUB-RECOVERY"
          echo "TECHNICAL_RUN_ID=$GITHUB_RUN_ID"
          echo "PARENT_BACKUP_TAG=$P5_V11_V4_PARENT_BACKUP_TAG"
          echo "RELEASE_TAG=$tag"
          echo "RELEASE_TARGET_SHA=$GITHUB_SHA"
          echo "RELEASE_REDOWNLOAD_REVERIFY=YES"
        } > backup-evidence/00-CONTRACT.txt

        gh release view "$P5_V11_V4_PARENT_BACKUP_TAG" \
          --repo "$GITHUB_REPOSITORY" >/dev/null
    - name: B02 - Resolve and download exact current P5-v12-v5 Actions artifact
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-namei-lookup-hash-v12-v5-${GITHUB_RUN_ID}"

        json="$(
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
        )"

        count="$(
          jq --arg n "$artifact_name" \
            '[.artifacts[] | select(.name == $n and .expired == false)] | length' \
            <<<"$json"
        )"
        test "$count" -eq 1

        artifact_id="$(
          jq -r --arg n "$artifact_name" \
            '.artifacts[] | select(.name == $n and .expired == false) | .id' \
            <<<"$json"
        )"
        expected_digest="$(
          jq -r --arg n "$artifact_name" \
            '.artifacts[] | select(.name == $n and .expired == false) | .digest' \
            <<<"$json"
        )"

        expected_sha="${expected_digest#sha256:}"

        gh api \
          -H "Accept: application/vnd.github+json" \
          "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
          > "${artifact_name}.zip"

        actual_sha="$(sha256sum "${artifact_name}.zip" | awk '{print $1}')"
        test "$actual_sha" = "$expected_sha"

        {
          echo "CURRENT_ARTIFACT_NAME=$artifact_name"
          echo "CURRENT_ARTIFACT_ID=$artifact_id"
          echo "CURRENT_ARTIFACT_SHA256=$actual_sha"
          echo "CURRENT_ACTIONS_ARTIFACT_AUTH=PASS"
        } > "$GITHUB_WORKSPACE/backup-evidence/01-CURRENT-ARTIFACT-AUTH.txt"
    - name: B03 - Verify exact P5-v12-v5 technical PASS manifest
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-namei-lookup-hash-v12-v5-${GITHUB_RUN_ID}"
        rm -rf verify-current
        mkdir verify-current
        unzip -q "${artifact_name}.zip" -d verify-current

        for dir in evidence restore-kit build-artifacts; do
          (
            cd "verify-current/$dir"
            sha256sum -c SHA256SUMS
          )
        done

        grep -Fxq 'TECHNICAL_PASS=YES' \
          verify-current/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'CHECKPOINT=KSU-GEN1-P5-SUS-PATH-NAMEI-LOOKUP-HASH-V12-V5-PASS' \
          verify-current/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'P5_V12_V5_LINKED_BOUNDARY=PASS' \
          verify-current/evidence/24-P5V12V5-LINKED-BOUNDARY.txt
        grep -Fxq 'P5_V12_V5_RESTORE_KIT=PASS' \
          verify-current/evidence/25-P5V12V5-PROVENANCE.txt

        jq -e \
          '.stage == "KSU-GEN1-P5-v12-v5" and
           .config_ksu_susfs_sus_path == true and
           .susfs_feature_suboptions_enabled == 4 and
           .dispatch_command_count == 10 and
           .sus_path_namei_lookup_hash_hook_integrated == true and
           .sus_path_namei_lookup_hash_fake_qstr_relookup == true and
                   .sus_path_namei_redirect_covers_dcache_hit == true and
                   .sus_path_namei_redirect_covers_fresh_lookup == true and
                   .sus_path_namei_redirect_once_guard == true and
                   .sus_path_namei_direct_iop_lookup_preserved == true and
                   .sus_path_namei_deaddir_semantics_preserved == true and
           .sus_path_namei_post_dput_old_dentry_dereference == false and
           .known_namei_dput_uaf_pattern_present == false and
           .sus_path_lookup_fast_hook_integrated == false and
           .sus_path_lookup_slow_hook_integrated == false and
           .sus_path_readdir_hook_integrated == false and
           .namei_changed == true and
           .namei_incremental_scope == "__lookup_hash only" and
           .readdir_changed == false and
           .sus_mount_active == false and
           .open_redirect_active == false and
           .sus_map_active == false and
           .kernel_build_performed == true and
           .device_accessed == false and
           .flashing_performed == false' \
          verify-current/restore-kit/manifest.json >/dev/null

        echo "CURRENT_PASS_CHAIN_AUTH=PASS" \
          > "$GITHUB_WORKSPACE/backup-evidence/02-PASS-AUTH.txt"
    - name: B04 - Prepare P5-v12-v5 recovery release payload
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-namei-lookup-hash-v12-v5-${GITHUB_RUN_ID}"
        artifact_sha="$(sha256sum "${artifact_name}.zip" | awk '{print $1}')"
        image_sha="$(sha256sum verify-current/build-artifacts/Image | awk '{print $1}')"
        config_sha="$(sha256sum verify-current/build-artifacts/config | awk '{print $1}')"
        dtb_sha="$(sha256sum verify-current/build-artifacts/veux.dtb | awk '{print $1}')"

        cp verify-current/restore-kit/manifest.json P5V12V5-MANIFEST.json

        cat > RECOVERY.txt <<EOF
        KSU GEN1 VEUX P5-v12-v5 PASS Recovery Backup
        =========================================

        Technical run: $GITHUB_RUN_ID
        Parent permanent backup:
        $P5_V11_V4_PARENT_BACKUP_TAG

        P5-v12-v5 scope:
        - fs/namei.c::__lookup_hash only
        - SUS_PATH helper checks positive dentry before dput
        - fake-qstr relookup after dropping the old dentry reference
        - no post-dput dereference of the old dentry
        - lookup_fast/lookup_slow deferred
        - readdir deferred
        - SUS_MOUNT / OPEN_REDIRECT / SUS_MAP disabled

        Image SHA256:
        $image_sha
        Config SHA256:
        $config_sha
        VEUX DTB SHA256:
        $dtb_sha
        Complete Actions artifact SHA256:
        $artifact_sha

        This is a build/recovery checkpoint, not a real-device runtime claim.
        EOF

        {
          sha256sum "${artifact_name}.zip"
          sha256sum P5V12V5-MANIFEST.json
          sha256sum RECOVERY.txt
        } > RELEASE-SHA256SUMS.txt
        sha256sum -c RELEASE-SHA256SUMS.txt

        cat > release-notes.md <<EOF
        Permanent recovery checkpoint after successful P5-v12-v5.

        P5-v12-v5 adds only the lifetime-safe SUS_PATH \`__lookup_hash()\`
        integration. The later nameidata lookup_fast/lookup_slow and readdir
        hooks remain deliberately deferred.

        Parent backup: \`$P5_V11_V4_PARENT_BACKUP_TAG\`
        Technical run: \`$GITHUB_RUN_ID\`
        EOF
    - name: B05 - Create permanent P5-v12-v5 GitHub Release
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        tag="ksu-gen1-p5-v12-v5-pass-backup-${GITHUB_RUN_ID}"
        title="KSU GEN1 VEUX P5-v12-v5 PASS Recovery Backup"

        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          exit 1
        fi

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-namei-lookup-hash-v12-v5-${GITHUB_RUN_ID}"

        gh release create "$tag" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "$title" \
          --notes-file release-notes.md \
          "${artifact_name}.zip#P5-v12-v5 complete PASS artifact" \
          "P5V12V5-MANIFEST.json#P5-v12-v5 recovery manifest" \
          "RELEASE-SHA256SUMS.txt#Release checksums" \
          "RECOVERY.txt#Recovery metadata"

        gh release view "$tag" \
          --repo "$GITHUB_REPOSITORY" \
          --json tagName,name,isDraft,isPrerelease,url,assets \
          > "$GITHUB_WORKSPACE/backup-evidence/04-RELEASE.json"

        jq -e \
          --arg tag "$tag" \
          --arg title "$title" \
          '.tagName == $tag and
           .name == $title and
           .isDraft == false and
           .isPrerelease == false and
           (.assets | length) == 4' \
          "$GITHUB_WORKSPACE/backup-evidence/04-RELEASE.json" >/dev/null

        {
          echo "GITHUB_RELEASE_CREATED=PASS"
          echo "RELEASE_TAG=$tag"
        } > "$GITHUB_WORKSPACE/backup-evidence/04-RELEASE-CREATE.txt"
    - name: B06 - Redownload P5-v12-v5 release assets and reverify
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        tag="ksu-gen1-p5-v12-v5-pass-backup-${GITHUB_RUN_ID}"
        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-sus-path-namei-lookup-hash-v12-v5-${GITHUB_RUN_ID}"

        rm -rf release-download
        mkdir release-download

        gh release download "$tag" \
          --repo "$GITHUB_REPOSITORY" \
          --dir release-download

        cmp "${artifact_name}.zip" "release-download/${artifact_name}.zip"
        cmp P5V12V5-MANIFEST.json release-download/P5V12V5-MANIFEST.json
        cmp RELEASE-SHA256SUMS.txt release-download/RELEASE-SHA256SUMS.txt
        cmp RECOVERY.txt release-download/RECOVERY.txt

        {
          echo "CURRENT_ARTIFACT_RELEASE_BYTE_IDENTITY=PASS"
          echo "MANIFEST_RELEASE_BYTE_IDENTITY=PASS"
          echo "CHECKSUM_RELEASE_BYTE_IDENTITY=PASS"
          echo "RECOVERY_METADATA_RELEASE_BYTE_IDENTITY=PASS"
          echo "RELEASE_DOWNLOAD_REVERIFY=PASS"
        } > "$GITHUB_WORKSPACE/backup-evidence/05-RELEASE-REVERIFY.txt"
    - name: B07 - Close automatic P5-v12-v5 backup status
      shell: bash
      run: |
        set -euo pipefail

        if grep -Fxq 'CURRENT_PASS_CHAIN_AUTH=PASS' backup-evidence/02-PASS-AUTH.txt \
          && grep -Fxq 'GITHUB_RELEASE_CREATED=PASS' backup-evidence/04-RELEASE-CREATE.txt \
          && grep -Fxq 'RELEASE_DOWNLOAD_REVERIFY=PASS' backup-evidence/05-RELEASE-REVERIFY.txt; then
          pass=YES
          checkpoint=KSU-GEN1-P5-V12-V5-GITHUB-RECOVERY-BACKUP-PASS
        else
          pass=NO
          checkpoint=KSU-GEN1-P5-V12-V5-GITHUB-RECOVERY-BACKUP-FAILED
        fi

        {
          echo "BACKUP_PASS=$pass"
          echo "CHECKPOINT=$checkpoint"
          echo "RELEASE_TAG=ksu-gen1-p5-v12-v5-pass-backup-$GITHUB_RUN_ID"
          echo "RELEASE_ASSETS_REDOWNLOADED_AND_REVERIFIED=$pass"
        } > backup-evidence/98-BACKUP-STATUS.txt

        test "$pass" = YES
    - name: B08 - Build automatic P5-v12-v5 backup evidence manifest
      shell: bash
      run: |
        set -euo pipefail
        cd backup-evidence
        rm -f SHA256SUMS
        find . -type f ! -name SHA256SUMS -printf '%P\0' \
          | sort -z \
          | xargs -0 -r sha256sum \
          > SHA256SUMS
        sha256sum -c SHA256SUMS
      if: ${{ always() }}
    - name: B09 - Upload automatic P5-v12-v5 backup evidence
      uses: actions/upload-artifact@v7
      with:
        name: ksu-gen1-p5-v12-v5-github-recovery-backup-evidence-${{ github.run_id }}
        path: backup-evidence/
        retention-days: 90
        if-no-files-found: error
      if: ${{ always() }}
    - name: B10 - Automatic P5-v12-v5 backup summary
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "# P5-v12-v5 automatic GitHub recovery backup"
          echo
          if grep -Fxq 'BACKUP_PASS=YES' backup-evidence/98-BACKUP-STATUS.txt 2>/dev/null; then
            echo "**BACKUP PASS**"
            echo "\`ksu-gen1-p5-v12-v5-pass-backup-$GITHUB_RUN_ID\`"
          else
            echo "**BACKUP FAIL — do not continue to lookup_fast/lookup_slow.**"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
      if: ${{ always() }}
  p5-sus-path-namei-lookup-hash-v12-v5:
    name: P5-v12-v5 - VEUX-5.4 lifetime-safe SUS_PATH __lookup_hash only
    runs-on: ubuntu-24.04
