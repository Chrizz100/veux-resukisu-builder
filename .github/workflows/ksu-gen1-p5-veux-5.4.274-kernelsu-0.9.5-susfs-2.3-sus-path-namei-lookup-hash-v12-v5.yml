            "SUSFS_HELPER_PRESENT":
                "bool susfs_is_inode_sus_path(struct inode *inode)" in sus,
            "SUSFS_FAKE_QSTR_PRESENT":
                'const struct qstr susfs_fake_qstr_name = QSTR_INIT("..5.u.S", 7);' in sus,
            "PARENT_INIT_CRED_BRIDGE_PRESENT":
                "override_creds(&init_cred);" in sus and
                "revert_creds(saved);" in sus,
            "PARENT_KSU_CRED_ABSENT":
                "ksu_cred" not in sus,
        }

        for key, ok in checks.items():
            print(f"{key}={'PASS' if ok else 'FAIL'}")

        failed = [k for k, ok in checks.items() if not ok]
        if failed:
            raise SystemExit(
                "P5-v12-v5 prerequisite failure: " + ", ".join(failed)
            )

        print("P5_V12_V5_PRE_ACTIVATION_AUDIT=PASS")
        print("P5_V12_V5_LOOKUP_BASELINE=DIRECT_DIR_IOP_LOOKUP")
        print("P5_V12_V5_LOOKUP_REAL_EXPECTED=NO")
        print("P5_V12_V5_DEADDIR_SEMANTICS_REQUIRED=YES")
        print("P5_V12_V5_KNOWN_OLD_DPUT_UAF_PATTERN_NOT_IMPORTED=YES")
        PY

        python3 - <<'PY'
        from pathlib import Path

        p = Path("fs/namei.c")
        t = p.read_text(encoding="utf-8")

        include_anchor = "#include <trace/events/namei.h>\n"
        if t.count(include_anchor) != 1:
            raise SystemExit("namei trace include anchor mismatch")

        decl = (
            "\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
            "extern bool susfs_is_inode_sus_path(struct inode *inode);\n"
            "extern const struct qstr susfs_fake_qstr_name;\n"
            "#endif\n"
        )

        if "extern bool susfs_is_inode_sus_path" in t:
            raise SystemExit("SUS_PATH extern unexpectedly already present")

        t = t.replace(include_anchor, include_anchor + decl, 1)

        sig = "static struct dentry *__lookup_hash(const struct qstr *name,"
        if t.count(sig) != 1:
            raise SystemExit("__lookup_hash signature count mismatch")

        start = t.index(sig)
        brace = t.index("{", start)
        depth = 0
        end = None
        for i in range(brace, len(t)):
            if t[i] == "{":
                depth += 1
            elif t[i] == "}":
                depth -= 1
                if depth == 0:
                    end = i + 1
                    break
        if end is None:
            raise SystemExit("__lookup_hash closing brace not found")

        old_fn = t[start:end]
        required = (
            "struct dentry *dentry = lookup_dcache(name, base, flags);",
            "struct dentry *old;",
            "struct inode *dir = base->d_inode;",
            "if (dentry)",
            "if (unlikely(IS_DEADDIR(dir)))",
            "return ERR_PTR(-ENOENT);",
            "dentry = d_alloc(base, name);",
            "if (unlikely(!dentry))",
            "return ERR_PTR(-ENOMEM);",
