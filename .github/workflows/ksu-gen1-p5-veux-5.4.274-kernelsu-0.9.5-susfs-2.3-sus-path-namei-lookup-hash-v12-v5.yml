        test "$(grep -c '^+++ b/fs/namei.c$' "$patch_file")" -eq 1
        test "$(grep -Ec '^--- ' "$patch_file")" -eq 1
        test "$(grep -Ec '^\+\+\+ ' "$patch_file")" -eq 1

