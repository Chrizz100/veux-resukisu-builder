            raise SystemExit("__lookup_hash already contains SUSFS code")

        new_fn = """static struct dentry *__lookup_hash(const struct qstr *name,
        \t\tstruct dentry *base, unsigned int flags)
        {
        \tconst struct qstr *lookup_name = name;
        \tstruct dentry *dentry;
        \tstruct dentry *old;
        \tstruct inode *dir = base->d_inode;
        \tbool sus_redirected = false;

        retry_lookup:
        \tdentry = lookup_dcache(lookup_name, base, flags);
        \tif (dentry)
        \t\tgoto sus_path_check;

        \t/* Don't create child dentry for a dead directory. */
        \tif (unlikely(IS_DEADDIR(dir)))
        \t\treturn ERR_PTR(-ENOENT);

        \tdentry = d_alloc(base, lookup_name);
        \tif (unlikely(!dentry))
        \t\treturn ERR_PTR(-ENOMEM);

        \told = dir->i_op->lookup(dir, dentry, flags);
        \tif (unlikely(old)) {
        \t\tdput(dentry);
        \t\tdentry = old;
        \t}

        sus_path_check:
        #ifdef CONFIG_KSU_SUSFS_SUS_PATH
        \t/*
        \t * Check only while this lookup still owns the dentry reference.
        \t * Redirect at most once. After dput(), the old dentry is never
        \t * dereferenced again; the next operation is a fresh lookup by qstr.
        \t */
        \tif (!sus_redirected && !IS_ERR(dentry) && dentry->d_inode &&
        \t    unlikely(susfs_is_inode_sus_path(dentry->d_inode))) {
        \t\tsus_redirected = true;
        \t\tlookup_name = &susfs_fake_qstr_name;
        \t\tdput(dentry);
        \t\tdentry = NULL;
        \t\tgoto retry_lookup;
        \t}
        #endif

        \treturn dentry;
        }"""

        t = t[:start] + new_fn + t[end:]
        p.write_text(t, encoding="utf-8")
        PY

        git diff --check -- fs/namei.c

        python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/19-P5V12V5-SOURCE-AUDIT.txt"
        from pathlib import Path

        namei = Path("fs/namei.c").read_text(encoding="utf-8")

        assert namei.count(
            "extern bool susfs_is_inode_sus_path(struct inode *inode);"
        ) == 1
        assert namei.count(
            "extern const struct qstr susfs_fake_qstr_name;"
        ) == 1

        sig = "static struct dentry *__lookup_hash(const struct qstr *name,"
        start = namei.index(sig)
        brace = namei.index("{", start)
        depth = 0
        end = None
        for i in range(brace, len(namei)):
            if namei[i] == "{":
                depth += 1
            elif namei[i] == "}":
                depth -= 1
                if depth == 0:
                    end = i + 1
                    break
        assert end is not None
        fn = namei[start:end]

        assert "struct inode *dir = base->d_inode;" in fn
        assert "if (unlikely(IS_DEADDIR(dir)))" in fn
        assert "old = dir->i_op->lookup(dir, dentry, flags);" in fn
        assert "if (unlikely(old))" in fn
        assert "dentry = old;" in fn
        assert "lookup_real(" not in fn

        assert fn.count("goto sus_path_check;") == 1
