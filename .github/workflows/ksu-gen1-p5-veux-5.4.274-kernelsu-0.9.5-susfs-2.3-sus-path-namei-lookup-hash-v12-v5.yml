          p4-artifact p5v4-artifact p5v5-artifact p5v6-artifact \
          p5v7-artifact p5v8-artifact p5v9-artifact p5v10-artifact \
          p5v11-artifact
        mkdir -p evidence restore-kit build-artifacts \
          p4-artifact p5v4-artifact p5v5-artifact p5v6-artifact \
          p5v7-artifact p5v8-artifact p5v9-artifact p5v10-artifact \
          p5v11-artifact

        {
          echo "WORKFLOW=KSU-GEN1-P5-SUS-PATH-NAMEI-LOOKUP-HASH-v12-v5"
          echo "FAILED_P5_V12_RUN_ID=$P5_V12_FAILED_RUN_ID"
