          echo "FAILED_P5_V12_V2_RUN_ID=$P5_V12_V2_FAILED_RUN_ID"
          echo "FAILED_P5_V12_V2_CLASS=$P5_V12_V2_FAILURE_CLASS"
          echo "FAILED_P5_V12_V3_RUN_ID=$P5_V12_V3_FAILED_RUN_ID"
          echo "FAILED_P5_V12_V3_CLASS=$P5_V12_V3_FAILURE_CLASS"
          echo "FAILED_P5_V12_V4_RUN_ID=$P5_V12_V4_FAILED_RUN_ID"
          echo "FAILED_P5_V12_V4_CLASS=$P5_V12_V4_FAILURE_CLASS"
          echo "P5_V12_V5_WORKFLOW_FIX=$P5_V12_V5_WORKFLOW_FIX"
          echo "P5_V12_V5_FUNCTIONAL_BASE=$P5_V12_V5_FUNCTIONAL_BASE"
          echo "SOURCE_INTENT_CHANGED_FROM_V12_V4=$P5_V12_V5_SOURCE_INTENT_CHANGED_FROM_V12_V4"
          echo "LOOKUP_BASELINE=$P5_V12_V5_LOOKUP_BASELINE"
          echo "REDIRECT_COVERAGE=$P5_V12_V5_REDIRECT_COVERAGE"
          echo "DEVICE=VEUX"
          echo "TARGET_KERNEL=$TARGET_VERSION"
          echo "PARENT_P5_V11_V4_PASS_RUN_ID=$P5_V11_V4_PASS_RUN_ID"
          echo "PARENT_P5_V11_V4_BACKUP_TAG=$P5_V11_V4_PARENT_BACKUP_TAG"
          echo "PARENT_P5_V11_V4_ARTIFACT_SHA256=$EXPECTED_P5_V11_V4_ARTIFACT_SHA256"
          echo "ACTIVE_SUBOPTIONS=KSU_SUSFS_SPOOF_UNAME,KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG,KSU_SUSFS_SUS_KSTAT,KSU_SUSFS_SUS_PATH"
          echo "SUSFS_FEATURE_SUBOPTION_COUNT=4"
          echo "NEW_SUBOPTION=NONE"
          echo "NEW_ACTIVE_HOOK=fs/namei.c::__lookup_hash"
          echo "SUS_PATH_LOOKUP_HASH_HOOK=YES"
          echo "SUS_PATH_LOOKUP_FAST_HOOK=NO"
          echo "SUS_PATH_LOOKUP_SLOW_HOOK=NO"
          echo "SUS_PATH_READDIR_HOOK=NO"
