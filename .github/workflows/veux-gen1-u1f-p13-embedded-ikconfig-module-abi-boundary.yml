          image_bytes_status="$(status "$image_bytes" "$EXPECTED_IMAGE_BYTES")"
          image_sha_status="$(status "$image_sha" "$EXPECTED_IMAGE_SHA256")"
          dtb_sha_status="$(status "$dtb_sha" "$EXPECTED_VEUX_DTB_SHA256")"
          kernelrelease_status="$(status "$kernelrelease" "$EXPECTED_KERNEL_RELEASE")"

          {
            printf 'gate\tactual\texpected\tstatus\n'
            printf 'IMAGE_BYTES\t%s\t%s\t%s\n' \
              "$image_bytes" "$EXPECTED_IMAGE_BYTES" "$image_bytes_status"
            printf 'IMAGE_SHA256\t%s\t%s\t%s\n' \
              "$image_sha" "$EXPECTED_IMAGE_SHA256" "$image_sha_status"
            printf 'VEUX_DTB_SHA256\t%s\t%s\t%s\n' \
              "$dtb_sha" "$EXPECTED_VEUX_DTB_SHA256" "$dtb_sha_status"
            printf 'KERNEL_RELEASE\t%s\t%s\t%s\n' \
              "$kernelrelease" "$EXPECTED_KERNEL_RELEASE" "$kernelrelease_status"
            printf 'CONFIG_SHA256\t%s\t-\tINFO\n' "$config_sha"
            printf 'VMLINUX_BYTES\t%s\t-\tINFO\n' "$vmlinux_bytes"
            printf 'VMLINUX_SHA256\t%s\t-\tINFO\n' "$vmlinux_sha"
            printf 'SYSTEM_MAP_SHA256\t%s\t-\tINFO\n' "$system_map_sha"
            printf 'DTB_BYTES\t%s\t-\tINFO\n' "$dtb_bytes"
          } | tee "$AUDIT_DIR/09-reproduction-values.tsv"

          strings -a "$image" \
            | grep -E 'Linux version 5\.4\.274-qgki-g82179e362f33|v4\.2\.0-rc1-7741f878-p13@ReSukiSU' \
            | head -n 20 \
            > "$AUDIT_DIR/09-built-image-identity-strings.txt" || true

          export BUILT_IMAGE="$image"
          export BUILT_DTB="$dtb"
          export REF_IMAGE="$P13_REFERENCE_DIR/Image"
          export REF_DTB="$P13_REFERENCE_DIR/veux.dtb"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          audit = Path(os.environ["AUDIT_DIR"])
          pairs = [
              ("IMAGE", Path(os.environ["REF_IMAGE"]), Path(os.environ["BUILT_IMAGE"])),
              ("DTB", Path(os.environ["REF_DTB"]), Path(os.environ["BUILT_DTB"])),
          ]

          def sha256_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def compare(label, ref_path, built_path):
              ref = ref_path.read_bytes()
              built = built_path.read_bytes()
              overlap = min(len(ref), len(built))
              differing = [i for i in range(overlap) if ref[i] != built[i]]
              trailing = abs(len(ref) - len(built))
              total_diff = len(differing) + trailing
              first = differing[0] if differing else (overlap if trailing else -1)
              if differing:
                  last = differing[-1]
              elif trailing:
                  last = max(len(ref), len(built)) - 1
              else:
                  last = -1

              chunk_size = 1024 * 1024
              max_len = max(len(ref), len(built))
              chunks = []
              for off in range(0, max_len, chunk_size):
                  r = ref[off:off + chunk_size]
                  b = built[off:off + chunk_size]
                  rsha = sha256_bytes(r)
                  bsha = sha256_bytes(b)
                  if rsha != bsha:
                      chunks.append((off // chunk_size, off, len(r), len(b), rsha, bsha))

              out = audit / f"09-{label.lower()}-binary-diff.txt"
              lines = [
                  f"LABEL={label}",
                  f"REFERENCE_PATH={ref_path}",
                  f"BUILT_PATH={built_path}",
                  f"REFERENCE_BYTES={len(ref)}",
                  f"BUILT_BYTES={len(built)}",
                  f"REFERENCE_SHA256={sha256_bytes(ref)}",
                  f"BUILT_SHA256={sha256_bytes(built)}",
                  f"BYTE_IDENTICAL={'YES' if total_diff == 0 else 'NO'}",
                  f"FIRST_DIFFERING_OFFSET={first}",
                  f"LAST_DIFFERING_OFFSET={last}",
                  f"TOTAL_DIFFERING_BYTES={total_diff}",
                  f"CHANGED_1MIB_CHUNKS={len(chunks)}",
                  "",
                  "chunk_index\toffset\tref_bytes\tbuilt_bytes\tref_sha256\tbuilt_sha256",
              ]
              lines.extend("\t".join(map(str, row)) for row in chunks)
              out.write_text("\n".join(lines) + "\n", encoding="utf-8")
              return total_diff == 0

          results = {}
          for label, ref, built in pairs:
              results[label] = compare(label, ref, built)

          (audit / "09-byte-identity-result.txt").write_text(
              "\n".join(
                  [
                      f"IMAGE_BYTE_IDENTICAL={'PASS' if results['IMAGE'] else 'FAIL'}",
                      f"DTB_BYTE_IDENTICAL={'PASS' if results['DTB'] else 'FAIL'}",
                  ]
              ) + "\n",
              encoding="utf-8",
          )
          PY

          image_binary_status="$(
            awk -F= '$1=="IMAGE_BYTE_IDENTICAL"{print $2}' "$AUDIT_DIR/09-byte-identity-result.txt"
          )"
          dtb_binary_status="$(
            awk -F= '$1=="DTB_BYTE_IDENTICAL"{print $2}' "$AUDIT_DIR/09-byte-identity-result.txt"
          )"

          gate_fail=0
          for s in \
            "$image_bytes_status" \
            "$image_sha_status" \
            "$dtb_sha_status" \
            "$kernelrelease_status" \
            "$image_binary_status" \
            "$dtb_binary_status"; do
            if test "$s" != "PASS"; then
              gate_fail=1
            fi
          done

          if test "$gate_fail" -ne 0; then
            cp "$image" "$AUDIT_DIR/U1F-built-Image.bin"
            cp "$dtb" "$AUDIT_DIR/U1F-built-veux.dtb"
            {
              echo "P13_IMAGE_REPRODUCTION=FAIL"
              echo "DETAILS=09-reproduction-values.tsv,09-image-binary-diff.txt,09-dtb-binary-diff.txt"
            } | tee "$AUDIT_DIR/09-reproduction-result.txt"
            exit 1
          fi

          "$TOOLCHAIN_DIR/bin/llvm-nm" -g --defined-only -P "$OUT_DIR/vmlinux" \
            | LC_ALL=C sort -u \
            > "$AUDIT_DIR/P13-vmlinux-global-symbols.txt"
          test -s "$AUDIT_DIR/P13-vmlinux-global-symbols.txt"

          {
            echo "P13_IMAGE_REPRODUCTION=PASS"
            echo "IMAGE_BYTES=$image_bytes"
            echo "IMAGE_SHA256=$image_sha"
            echo "VEUX_DTB_SHA256=$dtb_sha"
            echo "KERNEL_RELEASE=$kernelrelease"
            echo "VMLINUX_BYTES=$vmlinux_bytes"
            echo "VMLINUX_SHA256=$vmlinux_sha"
            echo "SYSTEM_MAP_SHA256=$system_map_sha"
            echo "VMLINUX_GLOBAL_SYMBOLS=$(wc -l < "$AUDIT_DIR/P13-vmlinux-global-symbols.txt")"
            echo "REFERENCE_IMAGE_BYTE_IDENTICAL=PASS"
            echo "REFERENCE_DTB_BYTE_IDENTICAL=PASS"
          } | tee "$AUDIT_DIR/09-reproduction-result.txt"

      - name: Extract authoritative P13 IKCONFIG and prove config provenance
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export REF_IMAGE="$P13_REFERENCE_DIR/Image"
          export BUILT_IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          export BUILT_VMLINUX="$OUT_DIR/vmlinux"

          python3 - <<'PY'
          from pathlib import Path
          import gzip
          import hashlib
          import os
          import re

          audit = Path(os.environ["AUDIT_DIR"])
          items = {
              "reference_image": Path(os.environ["REF_IMAGE"]),
              "built_image": Path(os.environ["BUILT_IMAGE"]),
              "built_vmlinux": Path(os.environ["BUILT_VMLINUX"]),
          }

          def extract_ikconfig(path):
              data = path.read_bytes()
              start = data.find(b"IKCFG_ST")
              if start < 0:
                  raise SystemExit(f"{path}: IKCFG_ST not found")
              end = data.find(b"IKCFG_ED", start + 8)
              if end < 0:
                  raise SystemExit(f"{path}: IKCFG_ED not found")
              raw = gzip.decompress(data[start + 8:end])
              return raw, start, end

          rows = []
          configs = {}
          for label, path in items.items():
              raw, start, end = extract_ikconfig(path)
              configs[label] = raw
              out = audit / f"10-{label}-IKCONFIG.txt"
              out.write_bytes(raw)
              rows.append((
                  label,
                  len(raw),
                  hashlib.sha256(raw).hexdigest(),
                  start,
                  end,
              ))

          out_cfg = Path(os.environ["OUT_DIR"]) / ".config"
          out_raw = out_cfg.read_bytes()
          (audit / "10-out-p13-dot-config.txt").write_bytes(out_raw)

          with (audit / "10-IKCONFIG-HASHES.tsv").open("w", encoding="utf-8") as fh:
              fh.write("source\tbytes\tsha256\tikcfg_start\tikcfg_end\n")
              for row in rows:
                  fh.write("\t".join(map(str, row)) + "\n")
              fh.write(
                  "out_p13_dot_config\t%s\t%s\t-\t-\n"
                  % (len(out_raw), hashlib.sha256(out_raw).hexdigest())
              )

          def parse(raw):
              txt = raw.decode(errors="replace")
              d = {}
              for line in txt.splitlines():
                  m = re.match(r'^(CONFIG_[A-Za-z0-9_]+)=(.*)$', line)
                  if m:
                      d[m.group(1)] = m.group(2)
                      continue
                  m = re.match(r'^# (CONFIG_[A-Za-z0-9_]+) is not set$', line)
                  if m:
                      d[m.group(1)] = "n"
              return d

          ref = configs["reference_image"]
          built = configs["built_image"]
          vm = configs["built_vmlinux"]

          if ref != built:
              raise SystemExit("Built Image IKCONFIG != reference P13 IKCONFIG")
          if built != vm:
              raise SystemExit("Built vmlinux IKCONFIG != built Image IKCONFIG")

          expected_plain_sha = "722bcc5a40b5998f147b7e40712fb230be3f8549a593b9c538763324987469de"
          actual_plain_sha = hashlib.sha256(ref).hexdigest()
          if actual_plain_sha != expected_plain_sha:
              raise SystemExit(
                  f"Reference P13 IKCONFIG hash drift: {actual_plain_sha} != {expected_plain_sha}"
              )

          cfg = parse(ref)
          required = {
              "CONFIG_MODULES": "y",
              "CONFIG_MODULE_UNLOAD": "y",
              "CONFIG_MODVERSIONS": "y",
          }
          for key, value in required.items():
              if cfg.get(key) != value:
                  raise SystemExit(f"{key}: expected {value}, got {cfg.get(key)}")

          out_parsed = parse(out_raw)
          all_keys = sorted(set(cfg) | set(out_parsed))
          diff = [(k, out_parsed.get(k), cfg.get(k)) for k in all_keys
                  if out_parsed.get(k) != cfg.get(k)]

          with (audit / "10-DOTCONFIG-VS-IMAGE-IKCONFIG.tsv").open(
              "w", encoding="utf-8"
          ) as fh:
              fh.write("config\tout_p13_dot_config\timage_ikconfig\n")
              for k, a, b in diff:
                  fh.write(f"{k}\t{a if a is not None else '<absent>'}\t"
                           f"{b if b is not None else '<absent>'}\n")

          with (audit / "10-AUTHORITATIVE-CONFIG.txt").open("w", encoding="utf-8") as fh:
              fh.write("P13_CONFIG_AUTHORITY=IMAGE_IKCONFIG\n")
              fh.write(f"P13_IKCONFIG_SHA256={actual_plain_sha}\n")
              fh.write("CONFIG_MODULES=y\n")
              fh.write("CONFIG_MODULE_UNLOAD=y\n")
              fh.write("CONFIG_MODVERSIONS=y\n")
              fh.write(f"OUT_DOTCONFIG_DIFF_KEYS={len(diff)}\n")
              fh.write("REFERENCE_IMAGE_IKCONFIG_EQUALS_BUILT_IMAGE=PASS\n")
              fh.write("BUILT_IMAGE_IKCONFIG_EQUALS_VMLINUX=PASS\n")

          print(f"P13 IKCONFIG SHA256={actual_plain_sha}")
          print(f"out-p13/.config differing keys={len(diff)}")
          PY

          cat "$AUDIT_DIR/10-AUTHORITATIVE-CONFIG.txt"

      - name: Capture P13 Module.symvers and MODVERSIONS CRC baseline
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          symvers="$OUT_DIR/Module.symvers"

          if test -s "$symvers"; then
            cp "$symvers" "$AUDIT_DIR/11-P13-Module.symvers"
          else
            : > "$AUDIT_DIR/11-P13-Module.symvers"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          audit = Path(os.environ["AUDIT_DIR"])
          symvers = audit / "11-P13-Module.symvers"

          rows = []
          nonzero = 0
          for raw in symvers.read_text(errors="replace").splitlines():
              parts = raw.split()
              if len(parts) < 2:
                  continue
              crc, symbol = parts[0], parts[1]
              if re.fullmatch(r'0x[0-9a-fA-F]{8}', crc):
                  rows.append((crc.lower(), symbol))
                  if crc.lower() != "0x00000000":
                      nonzero += 1

          with (audit / "11-P13-MODVERSION-CRC.tsv").open("w", encoding="utf-8") as fh:
              fh.write("crc\tsymbol\n")
              for crc, symbol in rows:
                  fh.write(f"{crc}\t{symbol}\n")

          with (audit / "11-P13-MODULE-ABI-SUMMARY.txt").open("w", encoding="utf-8") as fh:
              fh.write(f"MODULE_SYMVERS_PRESENT={'YES' if symvers.stat().st_size else 'NO'}\n")
              fh.write(f"MODULE_SYMVERS_ROWS={len(rows)}\n")
              fh.write(f"MODULE_SYMVERS_NONZERO_CRC={nonzero}\n")
              fh.write("EXPECTED_UTS_RELEASE=5.4.274-qgki-g82179e362f33\n")

          print(f"Module.symvers rows={len(rows)} nonzero_crc={nonzero}")
          PY

          cat "$AUDIT_DIR/11-P13-MODULE-ABI-SUMMARY.txt"

      - name: Clone representative public VEUX module snapshots
        shell: bash
        run: |
          set -euo pipefail
          meta="$AUDIT_DIR/12-public-snapshots.tsv"
          printf 'label\trepository\tref\tcommit\tko_count\tload_file_count\n' > "$meta"

          clone_sparse() {
            label="$1"
            repo="$2"
            ref="$3"
            dest="$SNAPSHOT_DIR/$label"

            git clone -q --depth 1 --filter=blob:none --sparse \
              --single-branch --branch "$ref" \
              "https://github.com/$repo.git" "$dest"
            git -C "$dest" sparse-checkout set ramdisk-modules vendor-modules
            git -C "$dest" lfs pull --include='ramdisk-modules/**,vendor-modules/**'

            commit="$(git -C "$dest" rev-parse HEAD)"
            ko_count="$(find "$dest/ramdisk-modules" "$dest/vendor-modules" \
              -type f -name '*.ko' 2>/dev/null | wc -l)"
            load_count="$(find "$dest/ramdisk-modules" "$dest/vendor-modules" \
              -type f -name 'modules.load*' 2>/dev/null | wc -l)"

            test "$ko_count" -gt 0
            test "$load_count" -gt 0

            while IFS= read -r -d '' f; do
              if head -c 64 "$f" | grep -Fq \
                'version https://git-lfs.github.com/spec/v1'; then
                echo "Unresolved Git-LFS pointer: $f" >&2
                exit 1
              fi
            done < <(
              find "$dest/ramdisk-modules" "$dest/vendor-modules" \
                -type f -name '*.ko' -print0 2>/dev/null
            )

            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$label" "$repo" "$ref" "$commit" "$ko_count" "$load_count" \
              >> "$meta"
          }

          clone_sparse a12 \
            sunil98025/android_device_xiaomi_veux-kernel twelve
          clone_sparse a13_arrow \
            ArrowOS-Devices/android_device_xiaomi_veux-kernel arrow-13.0
          clone_sparse a13_alt \
            nnippon99/android_device_xiaomi_veux-kernel thirteen
          clone_sparse lineage20 \
            xiaomi-sm6375-devs/android_device_xiaomi_veux-kernel lineage-20
          clone_sparse a14_crdroid \
            crdroidandroid/android_device_xiaomi_veux-kernel 14.0

          cat "$meta"

      - name: Audit runtime load-set vermagic and MODVERSIONS compatibility
        shell: bash
        run: |
          set -euo pipefail
          export P13_SYMVERS="$AUDIT_DIR/11-P13-MODVERSION-CRC.tsv"
          export P13_RELEASE="$EXPECTED_KERNEL_RELEASE"

          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict, deque
          import csv
          import os
          import re
          import subprocess

          audit = Path(os.environ["AUDIT_DIR"])
          snaps = Path(os.environ["SNAPSHOT_DIR"])
          p13_release = os.environ["P13_RELEASE"]

          p13_crc = {}
          symvers = Path(os.environ["P13_SYMVERS"])
          if symvers.exists():
              with symvers.open(encoding="utf-8") as fh:
                  for row in csv.DictReader(fh, delimiter="\t"):
                      p13_crc[row["symbol"]] = row["crc"].lower()

          def norm(name):
              s = Path(name.strip()).name
              if s.endswith(".ko"):
                  s = s[:-3]
              return re.sub(r"[^a-z0-9]+", "", s.lower())

          def run(args):
              cp = subprocess.run(
                  args, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE
              )
              return cp.returncode, cp.stdout, cp.stderr

          def modinfo(path, field):
              rc, out, _ = run(["modinfo", "-F", field, str(path)])
              return out.strip() if rc == 0 else ""

          def dump_modversions(path):
              rc, out, err = run(["modprobe", "--dump-modversions", str(path)])
              if rc != 0:
                  return [], err.strip()
              rows = []
              for line in out.splitlines():
                  parts = line.split()
                  if len(parts) >= 2 and parts[0].startswith("0x"):
                      rows.append((parts[0].lower(), parts[1]))
              return rows, ""

          rows = []
          set_rows = []

          for snap in sorted(p for p in snaps.iterdir() if p.is_dir()):
              # Index every .ko by normalized filename.
              all_modules = defaultdict(list)
              for ko in snap.rglob("*.ko"):
                  all_modules[norm(ko.name)].append(ko)

              # Each modules.load* is kept separate.  Its sibling modules.dep is the
              # preferred dependency graph.  We do not union load sets from different dirs.
              for loadfile in sorted(snap.rglob("modules.load*")):
                  if not loadfile.is_file():
                      continue

                  base = loadfile.parent
                  dep_graph = defaultdict(set)
                  depfile = base / "modules.dep"
                  if depfile.exists():
                      for raw in depfile.read_text(errors="replace").splitlines():
                          if ":" not in raw:
                              continue
                          lhs, rhs = raw.split(":", 1)
                          src = norm(lhs)
                          for dep in rhs.split():
                              dep_graph[src].add(norm(dep))

                  direct = []
                  for raw in loadfile.read_text(errors="replace").splitlines():
                      line = raw.split("#", 1)[0].strip()
                      if line and ".ko" in line:
                          direct.append(norm(line))

                  closure = set(direct)
                  q = deque(direct)
                  while q:
                      cur = q.popleft()
                      for dep in dep_graph.get(cur, ()):
                          if dep and dep not in closure:
                              closure.add(dep)
                              q.append(dep)

                  set_id = f"{snap.name}:{loadfile.relative_to(snap)}"
                  set_total = 0
                  set_located = 0
                  set_release_exact = 0
                  set_crc_clean = 0
                  set_usable = 0
                  set_missing = 0
                  set_crc_mismatch = 0
                  set_release_mismatch = 0

                  for role in sorted(closure):
                      set_total += 1

                      # Prefer a file in the same directory as the load list.
                      candidates = []
                      for ko in base.glob("*.ko"):
                          if norm(ko.name) == role:
                              candidates.append(ko)
                      if not candidates:
                          candidates = all_modules.get(role, [])

                      if not candidates:
                          set_missing += 1
                          rows.append({
                              "snapshot": snap.name,
                              "load_set": str(loadfile.relative_to(snap)),
                              "role": role,
                              "module_path": "",
                              "module_name": "",
                              "vermagic": "",
                              "release_token": "",
                              "release_exact": "NO",
                              "required_crc_count": 0,
                              "known_crc_count": 0,
                              "matching_crc_count": 0,
                              "mismatching_crc_count": 0,
                              "unknown_crc_count": 0,
                              "crc_status": "MODULE_FILE_MISSING",
                              "usable_with_p13": "NO",
                              "detail": "module file not located",
                          })
                          continue

                      # If duplicates exist, record each binary separately.  Set-level usable
                      # is satisfied when at least one candidate is fully compatible.
                      candidate_usable = False
                      candidate_release_exact = False
                      candidate_crc_clean = False
                      role_crc_mismatch = False

                      for ko in sorted(candidates):
                          set_located += 1
                          vermagic = modinfo(ko, "vermagic")
                          module_name = modinfo(ko, "name")
                          release_token = vermagic.split()[0] if vermagic else ""
                          release_exact = release_token == p13_release
                          if release_exact:
                              candidate_release_exact = True

                          req, err = dump_modversions(ko)
                          known = 0
                          match = 0
                          mismatch = 0
                          unknown = 0
                          for crc, sym in req:
                              expected = p13_crc.get(sym)
                              if expected is None:
                                  unknown += 1
                              else:
                                  known += 1
                                  if expected == crc:
                                      match += 1
                                  else:
                                      mismatch += 1

                          if err:
                              crc_status = "DUMP_ERROR"
                          elif not req:
                              crc_status = "NO_REQUIRED_CRC"
                          elif mismatch:
                              crc_status = "CRC_MISMATCH"
                          elif unknown:
                              crc_status = "CRC_UNKNOWN_SYMBOLS"
                          else:
                              crc_status = "CRC_ALL_MATCH"

                          crc_clean = (
                              crc_status in {"NO_REQUIRED_CRC", "CRC_ALL_MATCH"}
                              and mismatch == 0
                              and unknown == 0
                          )
                          if crc_clean:
                              candidate_crc_clean = True
                          if mismatch:
                              role_crc_mismatch = True

                          usable = release_exact and crc_clean
                          if usable:
                              candidate_usable = True

                          rows.append({
                              "snapshot": snap.name,
                              "load_set": str(loadfile.relative_to(snap)),
                              "role": role,
                              "module_path": str(ko.relative_to(snap)),
                              "module_name": module_name,
                              "vermagic": vermagic,
                              "release_token": release_token,
                              "release_exact": "YES" if release_exact else "NO",
                              "required_crc_count": len(req),
                              "known_crc_count": known,
                              "matching_crc_count": match,
                              "mismatching_crc_count": mismatch,
                              "unknown_crc_count": unknown,
                              "crc_status": crc_status,
                              "usable_with_p13": "YES" if usable else "NO",
                              "detail": err,
                          })

                      if candidate_release_exact:
                          set_release_exact += 1
                      else:
                          set_release_mismatch += 1
                      if candidate_crc_clean:
                          set_crc_clean += 1
                      if role_crc_mismatch:
                          set_crc_mismatch += 1
                      if candidate_usable:
                          set_usable += 1

                  set_rows.append({
                      "snapshot": snap.name,
                      "load_set": str(loadfile.relative_to(snap)),
                      "direct_roles": len(set(direct)),
                      "closure_roles": len(closure),
                      "located_roles": set_total - set_missing,
                      "missing_roles": set_missing,
                      "release_exact_roles": set_release_exact,
                      "release_mismatch_roles": set_release_mismatch,
                      "crc_clean_roles": set_crc_clean,
                      "crc_mismatch_roles": set_crc_mismatch,
                      "usable_roles": set_usable,
                      "all_roles_usable": "YES" if set_total and set_usable == set_total else "NO",
                  })

          row_fields = [
              "snapshot","load_set","role","module_path","module_name","vermagic",
              "release_token","release_exact","required_crc_count","known_crc_count",
              "matching_crc_count","mismatching_crc_count","unknown_crc_count",
              "crc_status","usable_with_p13","detail",
          ]
          with (audit / "13-MODULE-ABI-ROWS.tsv").open(
              "w", newline="", encoding="utf-8"
          ) as fh:
              w = csv.DictWriter(fh, fieldnames=row_fields, delimiter="\t")
              w.writeheader()
              w.writerows(rows)

          set_fields = [
              "snapshot","load_set","direct_roles","closure_roles","located_roles",
              "missing_roles","release_exact_roles","release_mismatch_roles",
              "crc_clean_roles","crc_mismatch_roles","usable_roles","all_roles_usable",
          ]
          with (audit / "13-LOADSET-ABI-SUMMARY.tsv").open(
              "w", newline="", encoding="utf-8"
          ) as fh:
              w = csv.DictWriter(fh, fieldnames=set_fields, delimiter="\t")
              w.writeheader()
              w.writerows(set_rows)

          # Snapshot-level summary: preserve separate load sets and report best candidate.
          snap_rows = []
          for snap in sorted({r["snapshot"] for r in set_rows}):
              candidates = [r for r in set_rows if r["snapshot"] == snap]
              best = max(
                  candidates,
                  key=lambda r: (
                      1 if r["all_roles_usable"] == "YES" else 0,
                      int(r["usable_roles"]),
                      -int(r["missing_roles"]),
                      -int(r["release_mismatch_roles"]),
                  ),
              )
              snap_rows.append({
                  "snapshot": snap,
                  "load_set_count": len(candidates),
                  "has_fully_usable_load_set": (
                      "YES" if any(r["all_roles_usable"] == "YES" for r in candidates)
                      else "NO"
                  ),
                  "best_load_set": best["load_set"],
                  "best_closure_roles": best["closure_roles"],
                  "best_usable_roles": best["usable_roles"],
                  "best_missing_roles": best["missing_roles"],
                  "best_release_mismatch_roles": best["release_mismatch_roles"],
                  "best_crc_mismatch_roles": best["crc_mismatch_roles"],
              })

          snap_fields = [
              "snapshot","load_set_count","has_fully_usable_load_set","best_load_set",
              "best_closure_roles","best_usable_roles","best_missing_roles",
              "best_release_mismatch_roles","best_crc_mismatch_roles",
          ]
          with (audit / "13-SNAPSHOT-ABI-SUMMARY.tsv").open(
              "w", newline="", encoding="utf-8"
          ) as fh:
              w = csv.DictWriter(fh, fieldnames=snap_fields, delimiter="\t")
              w.writeheader()
              w.writerows(snap_rows)

          print(f"module rows={len(rows)} load sets={len(set_rows)} snapshots={len(snap_rows)}")
          PY

      - name: Classify P13 module ABI compatibility boundary
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import csv
          import os

          audit = Path(os.environ["AUDIT_DIR"])

          auth = {}
          for line in (audit / "10-AUTHORITATIVE-CONFIG.txt").read_text().splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  auth[k] = v

          abi = {}
          for line in (audit / "11-P13-MODULE-ABI-SUMMARY.txt").read_text().splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  abi[k] = v

          snaps = list(csv.DictReader(
              (audit / "13-SNAPSHOT-ABI-SUMMARY.tsv").open(),
              delimiter="\t",
          ))
          sets = list(csv.DictReader(
              (audit / "13-LOADSET-ABI-SUMMARY.tsv").open(),
              delimiter="\t",
          ))

          fully_usable = sum(r["has_fully_usable_load_set"] == "YES" for r in snaps)
          has_crc = int(abi.get("MODULE_SYMVERS_NONZERO_CRC", "0")) > 0

          if auth.get("CONFIG_MODULES") != "y":
              result = "AUDIT_INVALID_P13_MODULE_CONFIG_NOT_CONFIRMED"
              next_gate = "STOP"
          elif not has_crc:
              result = "STATIC_MODULE_ABI_INCOMPLETE_NO_P13_CRC_BASELINE"
              next_gate = "CAPTURE_VALID_P13_MODVERSION_BASELINE"
          elif fully_usable == len(snaps) and snaps:
              result = "STATIC_MODULE_ABI_SUPPORTS_COMMON_P13_GROUP"
              next_gate = "U2_UNIVERSAL_AK3_PACKAGING_SAFETY_ALLOWED"
          elif fully_usable > 0:
              result = "STATIC_MODULE_ABI_REQUIRES_TECHNICAL_GROUPS"
              next_gate = "DEFINE_GROUPS_BY_LOADSET_ABI"
          else:
              result = "STATIC_MODULE_ABI_NOT_PROVEN_FOR_PUBLIC_SNAPSHOTS"
              next_gate = "NO_UNIVERSAL_AK3_YET"

          report = [
              "# VEUX GEN1 U1F — P13 Embedded IKCONFIG + Module ABI Boundary",
              "",
              "## Corrected P13 authority",
              "",
              f"- P13 IKCONFIG SHA-256: `{auth.get('P13_IKCONFIG_SHA256','?')}`",
              f"- CONFIG_MODULES: **{auth.get('CONFIG_MODULES','?')}**",
              f"- CONFIG_MODULE_UNLOAD: **{auth.get('CONFIG_MODULE_UNLOAD','?')}**",
              f"- CONFIG_MODVERSIONS: **{auth.get('CONFIG_MODVERSIONS','?')}**",
              f"- out-p13/.config differing keys: **{auth.get('OUT_DOTCONFIG_DIFF_KEYS','?')}**",
              "",
              "The embedded Image IKCONFIG is authoritative for the running P13 kernel.",
              "The orchestration `.config` is retained only as build-process evidence.",
              "",
              "## Module ABI evidence",
              "",
              f"- Module.symvers rows: **{abi.get('MODULE_SYMVERS_ROWS','0')}**",
              f"- Non-zero MODVERSIONS CRC rows: **{abi.get('MODULE_SYMVERS_NONZERO_CRC','0')}**",
              f"- Public snapshots audited: **{len(snaps)}**",
              f"- Snapshots with at least one fully P13-usable runtime load set: **{fully_usable}/{len(snaps)}**",
              "",
              "## Classification",
              "",
              f"**{result}**",
              "",
              f"Next gate: **{next_gate}**",
              "",
              "Compatibility rules:",
              "- `modules.load*` sets are evaluated separately; unrelated module directories are never unioned.",
              "- Exact P13 vermagic release is required for ordinary module loading.",
              "- With CONFIG_MODVERSIONS=y, every known required symbol CRC must match P13.",
              "- CRC compatibility does not waive a vermagic release mismatch.",
              "- A ROM/firmware group is created only from a technical load-set ABI difference.",
              "- Android version, ROM name and geographic region are not compatibility groups by themselves.",
              "",
              "This is still STATIC evidence. Untested firmware is not DEVICE PASS.",
              "P13 remains immutable and no kernel patch is introduced by U1F.",
          ]

          (audit / "14-U1F-REPORT.md").write_text(
              "\n".join(report) + "\n", encoding="utf-8"
          )
          (audit / "14-U1F-RESULT.txt").write_text(
              result + "\n" + next_gate + "\n", encoding="utf-8"
          )

          print(result)
          print(next_gate)
          PY

          cat "$AUDIT_DIR/14-U1F-RESULT.txt"
          sed -n '1,260p' "$AUDIT_DIR/14-U1F-REPORT.md"

      - name: Build self-verifying U1F evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d "$AUDIT_DIR"
          cd "$AUDIT_DIR"
          find . -type f ! -name 'U1F-EVIDENCE-SHA256SUMS.txt' -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            > U1F-EVIDENCE-SHA256SUMS.txt
          sha256sum -c U1F-EVIDENCE-SHA256SUMS.txt

      - name: Upload U1F evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-GEN1-U1F-P13-embedded-IKCONFIG-module-ABI-boundary
          path: u1f-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
