name: Irena X 7371 CL2I RegisterNativeClassLinker-only isolation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IRENA_REPO: silvzr/LSP-IrenaX
  IRENA_COMMIT: da439fbbed506dac6c66074af7fda8982aa4fc6a
  CURRENT_LSPLANT_SHA: c5b46bb4f6a99ffe0c77ce3ab006d3f67d5a2b1c
  CURRENT_DOBBY_SHA: dc7b4be06ad6c5dcfb0bb4ca2082b007d69eaed5
  OFFICIAL_RELEASE_URL: https://github.com/silvzr/LSP-IrenaX/releases/download/v2.0.1/LSPosed-v2.0.1-7371-IrenaX-release.zip
  OFFICIAL_RELEASE_SHA256: 99e7aaf54dda0e6fa746c55613483a80620174f255dd05e102713778a9966d2f
  R1_DEVICE_PACKAGE_SHA256: 7ed948db19d92b0dd7776c424f93783e10210082ea807345228e901ab9ce4af7
  FINAL_ZIP: LSPosed-v2.0.1-7371-IrenaX-CL2I-R1-base-RegisterNativeClassLinker-only-isolation-diagnostic.zip

jobs:
  build:
    name: Build CL2I RegisterNativeClassLinker-only isolation
    runs-on: ubuntu-latest

    steps:
      - name: Freeze CL2I diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cl2i-output
          {
            echo "PARENT=R1-v2 immutable Framework checkpoint"
            echo "PARENT_DEVICE_PACKAGE_SHA256=$R1_DEVICE_PACKAGE_SHA256"
            echo "BASE=official Irena X 7371 source + exact R1-v2 mIncludeCode compatibility fix"
            echo "CL2I_FUNCTIONAL_DELTA_VS_CL1=ONE_NATIVE_HOOK; exact CL1 Fixup behavior retained; then only RegisterNativeClassLinker_ is attempted; no plain/fast/thread fallback"
            echo "CL2I_PURPOSE=confirm causality by installing only RegisterNativeClassLinker_ and cutting off ClassLinker before UnregisterNative and every later group"
            echo "N0_DEVICE_RESULT=VALID_SAME_PID_MARKER_THEN_PAIRIP_LOAD_NO_FATAL_PROCESS_ALIVE_35S"
            echo "N1_DEVICE_RESULT=VALID_SAME_PID_MARKER_THEN_PAIRIP_LOAD_THEN_SEGV_ACCERR_AT_LIBPAIRIPCORE_PLUS_0x65768"
            echo "CL1_DEVICE_RESULT=VALID_FIXUP_GROUP_RESULT_0_THEN_PAIRIP_LOAD_NO_FATAL"
            echo "CL2_DEVICE_RESULT=VALID_FIXUP_0_REGISTER_NATIVE_1_THEN_PAIRIP_LOAD_THEN_SEGV_ACCERR_AT_LIBPAIRIPCORE_PLUS_0x65768"
            echo "CL1_JOYSTICK_RESULT=PAIRIP_STABLE_BUT_SCANNER_VISIBLE_DISABLED_WHEN_JOYSTICK_ACTIVE_SEPARATE_LOCATION_ISSUE"
            echo "CL2I_EXPECTED_MARKER=LSPLANT-CL2I: CLASSLINKER_CUTOFF_AFTER_REGISTER_NATIVE_CLASSLINKER"
            echo "CURRENT_LSPLANT=$CURRENT_LSPLANT_SHA"
            echo "CURRENT_DOBBY=$CURRENT_DOBBY_SHA"
            echo "R9_CHANGES=NONE"
            echo "DEX2OAT_MOUNT_CHANGES=NONE"
            echo "PAIRIP_BYPASS=NONE"
            echo "STATIC_PASS_IS_NOT_DEVICE_PASS=YES"
          } | tee cl2i-output/CL2I_DIAGNOSTIC_CONTRACT.txt

      - name: Checkout pinned Irena X 7371
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IRENA_REPO }}
          ref: ${{ env.IRENA_COMMIT }}
          submodules: recursive
          fetch-depth: 0
          path: LSP-IrenaX
          persist-credentials: false

      - name: Verify exact pristine pins and CL2I source preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C LSP-IrenaX rev-parse HEAD)" = "$IRENA_COMMIT"
          test -z "$(git -C LSP-IrenaX status --porcelain)"
          test "$(git -C LSP-IrenaX/external/lsplant rev-parse HEAD)" = "$CURRENT_LSPLANT_SHA"
          test "$(git -C LSP-IrenaX/external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
          test -z "$(git -C LSP-IrenaX/external/lsplant status --porcelain)"
          test -z "$(git -C LSP-IrenaX/external/dobby status --porcelain)"

          java_file="LSP-IrenaX/core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"
          native_file="LSP-IrenaX/external/lsplant/lsplant/src/main/jni/lsplant.cc"
          cl_file="LSP-IrenaX/external/lsplant/lsplant/src/main/jni/art/runtime/class_linker.cxx"
          test -f "$java_file"
          test -f "$native_file"
          test -f "$cl_file"
          grep -Fq 'boolean includeCode = XposedHelpers.getBooleanField(loadedApk, "mIncludeCode");' "$java_file"
          grep -Fq 'if (!Runtime::Init(handler)) {' "$native_file"
          grep -Fq 'if (!ClassLinker::Init(env, handler)) {' "$native_file"
          grep -Fq 'if (!ScopedSuspendAll::Init(handler)) {' "$native_file"
          grep -Fq 'auto register_native_hooked = sdk_int >= kSdkOreo && sdk_int < kSdkPie' "$cl_file"
          grep -Fq 'handler(RegisterNativeClassLinker_, RegisterNative_,' "$cl_file"
          grep -Fq '!handler(UnregisterNativeClassLinker_, UnregisterNative_,' "$cl_file"
          if grep -Fq 'LSPLANT-CL2I:' "$native_file" "$cl_file"; then
            echo "CL2I marker already exists in pristine source"
            exit 1
          fi

          {
            echo "IRENA=$(git -C LSP-IrenaX rev-parse HEAD)"
            echo "LSPLANT=$(git -C LSP-IrenaX/external/lsplant rev-parse HEAD)"
            echo "DOBBY=$(git -C LSP-IrenaX/external/dobby rev-parse HEAD)"
            echo "R1_M_INCLUDE_CODE_PRECONDITION=PRESENT"
            echo "CL2I_CLASSLINKER_REGISTER_NATIVE_GROUP_THEN_UNREGISTER_NATIVE_PRECONDITION=PRESENT"
          } | tee cl2i-output/CL2I_SOURCE_PINS_AND_PRECONDITIONS.txt

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: irena-x-cl2i-${{ runner.os }}
          restore-keys: |
            irena-x-${{ runner.os }}
          save: false

      - name: Setup Ninja 1.12.1
        uses: seanmiddleditch/gha-setup-ninja@master
        with:
          version: 1.12.1

      - name: Remove Android bundled CMake
        shell: bash
        run: rm -rf "$ANDROID_HOME/cmake"

      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.caching=true'
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC'
            echo 'android.native.buildOutput=verbose'
          } >> ~/.gradle/gradle.properties

      - name: Download and verify official Irena 7371 release
        id: official
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o OFFICIAL_RELEASE.zip "$OFFICIAL_RELEASE_URL"
          echo "$OFFICIAL_RELEASE_SHA256  OFFICIAL_RELEASE.zip" | sha256sum -c -
          unzip -t OFFICIAL_RELEASE.zip
          rm -rf officialcmp
          mkdir officialcmp
          unzip -q OFFICIAL_RELEASE.zip -d officialcmp
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('OFFICIAL_RELEASE.zip') as z:
              names = z.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit('duplicate names in official release')
              files = [n for n in names if not n.endswith('/')]
              if len(files) != 56:
                  raise SystemExit(f'official release file count is {len(files)}, expected 56')
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'official CRC failure: {bad}')
          PY
          sha256sum OFFICIAL_RELEASE.zip > cl2i-output/CL2I_OFFICIAL_RELEASE_SHA256.txt

      - name: Apply exact R1-v2 mIncludeCode compatibility fix
        id: r1patch
        if: steps.official.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java')
          s = p.read_text()
          line = '            boolean includeCode = XposedHelpers.getBooleanField(loadedApk, "mIncludeCode");\n'
          branch = (
              '            } else if (!includeCode) {\n'
              '                Hookers.logD("LoadedApk#<init> has no code, skip: " + mAppDir);\n'
              '                return;\n'
          )
          if s.count(line) != 1:
              raise SystemExit(f'expected one mIncludeCode read, got {s.count(line)}')
          if s.count(branch) != 1:
              raise SystemExit(f'expected one no-code branch, got {s.count(branch)}')
          s = s.replace(line, '', 1).replace(branch, '', 1)
          expected = (
              '            if (packageName.equals("android")) {\n'
              '                if (XposedInit.startsSystemServer) {\n'
              '                    Hookers.logD("LoadedApk#<init> is android, skip: " + mAppDir);\n'
              '                    return;\n'
              '                } else {\n'
              '                    packageName = "system";\n'
              '                }\n'
              '            }\n'
              '\n'
              '            if (!XposedInit.loadedPackagesInProcess.add(packageName)) {\n'
          )
          if expected not in s:
              raise SystemExit('R1-v2 post-patch control flow mismatch')
          if 'mIncludeCode' in s:
              raise SystemExit('mIncludeCode survived R1-v2 patch')
          p.write_text(s)
          PY
          git diff --check

      - name: Apply CL2I RegisterNativeClassLinker-only isolation
        id: cl2ipatch
        if: steps.r1patch.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Keep the N1 outer cutoff: ClassLinker may run, nothing after it may run.
          p = Path('external/lsplant/lsplant/src/main/jni/lsplant.cc')
          s = p.read_text()
          old = (
              '    if (!ClassLinker::Init(env, handler)) {\n'
              '        LOGE("Failed to init class linker");\n'
              '        return false;\n'
              '    }\n'
              '    if (!ScopedSuspendAll::Init(handler)) {\n'
              '        LOGE("Failed to init scoped suspend all");\n'
              '        return false;\n'
              '    }\n'
          )
          new = (
              '    if (!ClassLinker::Init(env, handler)) {\n'
              '        LOGE("Failed to init class linker");\n'
              '        return false;\n'
              '    }\n'
              '    LOGE("LSPLANT-CL2I: CLASSLINKER_CUTOFF_AFTER_REGISTER_NATIVE_CLASSLINKER");\n'
              '    return false;\n'
              '    if (!ScopedSuspendAll::Init(handler)) {\n'
              '        LOGE("Failed to init scoped suspend all");\n'
              '        return false;\n'
              '    }\n'
          )
          if s.count(old) != 1:
              raise SystemExit(f'expected one ClassLinker->ScopedSuspendAll boundary, got {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ARM64 CL2I = exact CL1 Fixup group + exactly one new native hook: RegisterNativeClassLinker_.
          # No RegisterNative plain/fast/thread fallbacks. Return before UnregisterNative and every later group.
          p = Path('external/lsplant/lsplant/src/main/jni/art/runtime/class_linker.cxx')
          s = p.read_text()
          old_fixup = (
              '        } else {\n'
              '            handler(FixupStaticTrampolinesWithThread_, FixupStaticTrampolines_,\n'
              '                    FixupStaticTrampolinesRaw_);\n'
              '        }\n'
              '\n'
              '        auto register_native_hooked = sdk_int >= kSdkOreo && sdk_int < kSdkPie\n'
          )
          new_fixup = (
              '        } else {\n'
              '            auto cl2i_fixup_group_hooked =\n'
              '                    handler(FixupStaticTrampolinesWithThread_, FixupStaticTrampolines_,\n'
              '                            FixupStaticTrampolinesRaw_);\n'
              '            LOGE("LSPLANT-CL2I: FIXUP_GROUP_RESULT=%d", cl2i_fixup_group_hooked ? 1 : 0);\n'
              '        }\n'
              '\n'
              '        auto register_native_hooked = sdk_int >= kSdkOreo && sdk_int < kSdkPie\n'
          )
          if s.count(old_fixup) != 1:
              raise SystemExit(f'expected exactly one non-x86 Fixup group boundary, got {s.count(old_fixup)}')
          s = s.replace(old_fixup, new_fixup, 1)

          old_register = (
              '        auto register_native_hooked = sdk_int >= kSdkOreo && sdk_int < kSdkPie\n'
              '                                          ? handler(RegisterNativeFastWithReturn_)\n'
              '                                          : handler(RegisterNativeClassLinker_, RegisterNative_,\n'
              '                                                    RegisterNativeFast_, RegisterNativeThread_);\n'
              '        if (!register_native_hooked ||\n'
              '            !handler(UnregisterNativeClassLinker_, UnregisterNative_,\n'
              '                     UnregisterNativeThread_)) {\n'
          )
          new_register = (
              '        auto cl2i_register_native_classlinker_hooked = handler(RegisterNativeClassLinker_);\n'
              '        LOGE("LSPLANT-CL2I: REGISTER_NATIVE_CLASSLINKER_RESULT=%d",\n'
              '             cl2i_register_native_classlinker_hooked ? 1 : 0);\n'
              '        LOGE("LSPLANT-CL2I: CLASSLINKER_CUTOFF_AFTER_REGISTER_NATIVE_CLASSLINKER");\n'
              '        return true;\n'
              '        if (!cl2i_register_native_classlinker_hooked ||\n'
              '            !handler(UnregisterNativeClassLinker_, UnregisterNative_,\n'
              '                     UnregisterNativeThread_)) {\n'
          )
          if s.count(old_register) != 1:
              raise SystemExit(f'expected exactly one RegisterNative->UnregisterNative boundary, got {s.count(old_register)}')
          s = s.replace(old_register, new_register, 1)

          if s.count('LSPLANT-CL2I: FIXUP_GROUP_RESULT=%d') != 1:
              raise SystemExit('CL2I fixup result marker count mismatch')
          if s.count('LSPLANT-CL2I: REGISTER_NATIVE_CLASSLINKER_RESULT=%d') != 1:
              raise SystemExit('CL2I RegisterNativeClassLinker result marker count mismatch')
          if s.count('handler(RegisterNativeClassLinker_)') != 1:
              raise SystemExit('CL2I must contain exactly one direct RegisterNativeClassLinker handler call')
          if 'handler(RegisterNativeClassLinker_, RegisterNative_,\n                                                    RegisterNativeFast_, RegisterNativeThread_)' in s:
              raise SystemExit('CL2I four-candidate RegisterNative handler survived isolation patch')
          if s.count('LSPLANT-CL2I: CLASSLINKER_CUTOFF_AFTER_REGISTER_NATIVE_CLASSLINKER') != 1:
              raise SystemExit('CL2I class-linker cutoff marker count mismatch')
          p.write_text(s)
          PY

          git -C external/lsplant diff --check
          mapfile -t ls_changed < <(git -C external/lsplant diff --name-only | sort)
          printf '%s\n' "${ls_changed[@]}" | tee ../cl2i-output/CL2I_LSPLANT_DIFF_NAMES.txt
          test "${#ls_changed[@]}" -eq 2
          test "${ls_changed[0]}" = "lsplant/src/main/jni/art/runtime/class_linker.cxx"
          test "${ls_changed[1]}" = "lsplant/src/main/jni/lsplant.cc"

          mapfile -t top_changed < <(git diff --name-only | sort)
          printf '%s\n' "${top_changed[@]}" | tee ../cl2i-output/CL2I_SOURCE_DIFF_NAMES.txt
          test "${#top_changed[@]}" -eq 2
          test "${top_changed[0]}" = "core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCtorHooker.java"
          test "${top_changed[1]}" = "external/lsplant"

          # Freeze all unrelated paths.
          git diff --exit-code "$IRENA_COMMIT" -- \
            core/src/main/java/org/lsposed/lspd/core/Startup.java \
            core/src/main/java/org/lsposed/lspd/hooker/LoadedApkCreateCLHooker.java \
            core/src/main/java/org/lsposed/lspd/hooker/AttachHooker.java \
            core/src/main/java/org/lsposed/lspd/impl/LSPosedBridge.java \
            core/src/main/java/org/lsposed/lspd/impl/LSPosedHelper.java \
            core/src/main/jni/src/jni/hook_bridge.cpp \
            core/src/main/jni/src/native_api.cpp \
            daemon/src/main/java/org/lsposed/lspd/service/Dex2OatService.java \
            magisk-loader/src/main/jni/api/zygisk_main.cpp \
            magisk-loader/src/main/jni/src/magisk_loader.cpp \
            magisk-loader/src/main/jni/src/atexit.cpp

          test "$(git -C external/dobby rev-parse HEAD)" = "$CURRENT_DOBBY_SHA"
          test -z "$(git -C external/dobby status --porcelain)"

          git diff > ../cl2i-output/CL2I_TOPLEVEL_SOURCE.patch
          git -C external/lsplant diff > ../cl2i-output/CL2I_LSPLANT_SOURCE.patch
          {
            echo "SOURCE_DELTA_TOPLEVEL=LoadedApkCtorHooker.java + external/lsplant submodule"
            echo "SOURCE_DELTA_LSPLANT=class_linker.cxx + lsplant.cc only"
            echo "R1_V2_M_INCLUDE_CODE_FIX=PRESERVED"
            echo "N0_DEVICE_RESULT=NO_PAIRIP_FATAL_WITHOUT_CLASSLINKER"
            echo "N1_DEVICE_RESULT=PAIRIP_SEGV_ACCERR_PLUS_0x65768_WITH_FULL_CLASSLINKER_INIT"
            echo "CL1_DEVICE_RESULT=FIXUP_GROUP_RESULT_0_PAIRIP_LOAD_NO_FATAL"
            echo "CL2I_FIXUP_GROUP=SAME_AS_CL1"
            echo "CL2I_REGISTER_NATIVE_CLASSLINKER=ONLY_DIRECT_HANDLER_ATTEMPT"
            echo "CL2I_REGISTER_NATIVE_FALLBACKS=NONE"
            echo "CL2I_UNREGISTER_NATIVE_GROUP=NOT_REACHED"
            echo "CL2I_VISIBILITY_GROUP=NOT_REACHED"
            echo "CL2I_ENTRYPOINT_GROUP=NOT_REACHED"
            echo "CL2I_OUTER_CUTOFF_BEFORE=ScopedSuspendAll::Init(handler)"
            echo "R9=ABSENT"
            echo "DEX2OAT=UNCHANGED_OFFICIAL_7371"
            echo "PAIRIP_BYPASS=ABSENT"
          } | tee ../cl2i-output/CL2I_PROVENANCE.txt

      - name: Build CL2I Fixup + RegisterNativeClassLinker-only diagnostic candidate
        id: cl2ibuild
        if: steps.cl2ipatch.outcome == 'success'
        working-directory: LSP-IrenaX
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ./gradlew clean zipAll --stacktrace --info 2>&1 | tee ../cl2i-build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > ../CL2I_BUILD_EXIT_CODE.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Extract CL2I build and verify marker payload
        id: built
        if: steps.cl2ibuild.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rel < <(find LSP-IrenaX/magisk-loader/release -maxdepth 1 -type f \
            -name 'LSPosed-v*-IrenaX-release.zip' -print | sort)
          test "${#rel[@]}" -eq 1
          cp "${rel[0]}" CL2I_BUILD_RELEASE.zip
          unzip -t CL2I_BUILD_RELEASE.zip
          rm -rf cl2ibuildcmp
          mkdir cl2ibuildcmp
          unzip -q CL2I_BUILD_RELEASE.zip -d cl2ibuildcmp

          test -f cl2ibuildcmp/framework/lspd.dex
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f "cl2ibuildcmp/lib/$abi/liblspd.so"
            strings "cl2ibuildcmp/lib/$abi/liblspd.so" | grep -Fq 'LSPLANT-CL2I: CLASSLINKER_CUTOFF_AFTER_REGISTER_NATIVE_CLASSLINKER'
            strings "cl2ibuildcmp/lib/$abi/liblspd.so" | grep -Fq 'LSPLANT-CL2I: REGISTER_NATIVE_CLASSLINKER_RESULT=%d'
            readelf -h "cl2ibuildcmp/lib/$abi/liblspd.so" >/dev/null
          done

          sha256sum cl2ibuildcmp/framework/lspd.dex > cl2i-output/CL2I_REBUILT_FRAMEWORK_DEX_SHA256.txt
          sha256sum cl2ibuildcmp/lib/*/liblspd.so > cl2i-output/CL2I_REBUILT_LIBLSPD_SHA256.txt

      - name: Create official-base CL2I install package
        id: package
        if: steps.built.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          official = Path('OFFICIAL_RELEASE.zip')
          built = Path('cl2ibuildcmp')
          out = Path('${{ env.FINAL_ZIP }}')
          abis = ('arm64-v8a','armeabi-v7a','x86','x86_64')
          payload = {'framework/lspd.dex'} | {f'lib/{abi}/liblspd.so' for abi in abis}
          sidecars = {x + '.sha256' for x in payload}
          replacements = {}
          for name in payload:
              data = (built / name).read_bytes()
              replacements[name] = data
              replacements[name + '.sha256'] = hashlib.sha256(data).hexdigest().encode()

          with zipfile.ZipFile(official, 'r') as zin, zipfile.ZipFile(out, 'w') as zout:
              infos = zin.infolist()
              names = [i.filename for i in infos]
              if len(names) != len(set(names)):
                  raise SystemExit('duplicate names in official ZIP')
              if not (payload | sidecars).issubset(set(names)):
                  raise SystemExit('official ZIP misses one or more CL2I replacement targets')
              for info in infos:
                  zout.writestr(info, replacements.get(info.filename, zin.read(info.filename)))

          def tree(path):
              with zipfile.ZipFile(path) as z:
                  names = z.namelist()
                  if len(names) != len(set(names)):
                      raise SystemExit(f'duplicate names: {path}')
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f'CRC failure {path}: {bad}')
                  return {n: hashlib.sha256(z.read(n)).hexdigest() for n in names if not n.endswith('/')}

          a, b = tree(official), tree(out)
          if set(a) != set(b):
              raise SystemExit('official/CL2I file sets differ')
          if len(a) != 56:
              raise SystemExit(f'expected 56 files, got {len(a)}')
          diff = sorted(k for k in a if a[k] != b[k])
          expected = sorted(payload | sidecars)
          if diff != expected:
              raise SystemExit(f'unexpected official->CL2I package delta: {diff}')

          # Keep manager/daemon/scripts exact official 7371; only target-process native libs + R1 dex change.
          for rel in ('manager.apk','daemon.apk'):
              if a[rel] != b[rel]:
                  raise SystemExit(f'official control payload changed: {rel}')

          with zipfile.ZipFile(out) as z:
              names = set(z.namelist())
              checked = 0
              for n in sorted(names):
                  if not n.endswith('.sha256'):
                      continue
                  p = n[:-7]
                  if p not in names:
                      continue
                  expected_hash = z.read(n).decode().strip().split()[0]
                  actual_hash = hashlib.sha256(z.read(p)).hexdigest()
                  if expected_hash != actual_hash:
                      raise SystemExit(f'sidecar mismatch: {n}')
                  checked += 1
              if checked != 28:
                  raise SystemExit(f'expected 28 verified sidecars, got {checked}')

          sha = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('cl2i-output/CL2I_FINAL_PACKAGE_SHA256.txt').write_text(f'{sha}  {out.name}\n')
          Path('cl2i-output/CL2I_FINAL_PACKAGE_DIFF.txt').write_text('\n'.join(expected) + '\n')
          Path('cl2i-output/CL2I_FINAL_SCOPE.txt').write_text(
              'BASE=official Irena X 7371 release\n'
              'PARENT_SEMANTICS=R1-v2 mIncludeCode fix preserved in framework/lspd.dex\n'
              'CL2I_NATIVE_BEHAVIOR=exact CL1 Fixup behavior; then only RegisterNativeClassLinker_ is attempted; no plain/fast/thread fallback; then returns before UnregisterNative; outer cutoff remains before ScopedSuspendAll::Init\n'
              'FINAL_PACKAGE_DELTA=framework/lspd.dex+sidecar + 4 liblspd.so+sidecars\n'
              'MANAGER=official 7371 byte-identical\n'
              'DAEMON=official 7371 byte-identical\n'
              'DEX2OAT=official 7371 unchanged\n'
              'DOBBY=official/current 7371 unchanged\n'
              'R9_CHANGES=none\n'
              'PAIRIP_BYPASS=none\n'
              'DEVICE_RUNTIME_STATUS=not tested\n'
          )
          PY
          unzip -t "$FINAL_ZIP"
          cp "$FINAL_ZIP" "cl2i-output/INSTALL_THIS_${FINAL_ZIP}"

      - name: Write CL2I device test plan
        if: steps.package.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cat > cl2i-output/CL2I_DEVICE_TEST_PLAN.txt <<'EOF'
          CL2I REGISTERNATIVECLASSLINKER-ONLY ISOLATION

          PURPOSE
          - N0: no ClassLinker -> PairIP loads without historical +0x65768 fatal.
          - N1: full ClassLinker -> historical PairIP +0x65768 fatal returns.
          - CL1: FixupStaticTrampolines group only, runtime result=0 -> PairIP loads and Ingress survives.
          - CL2/CL2O: Fixup=0 + RegisterNative=1 -> PairIP +0x65768 crash; CL2O selected classlinker=1, plain=0, fast=0, thread=0.
          - CL2I keeps the CL1 Fixup group and installs only RegisterNativeClassLinker_.
          - No RegisterNative_, RegisterNativeFast_, RegisterNativeThread_ or RegisterNativeFastWithReturn_ fallback is attempted.
          - CL2I returns before UnregisterNative and stops before ScopedSuspendAll.

          REQUIRED RUNTIME MARKERS IN THE SAME INGRESS PID
          LSPLANT-CL2I: FIXUP_GROUP_RESULT=0
          LSPLANT-CL2I: REGISTER_NATIVE_CLASSLINKER_RESULT=1
          LSPLANT-CL2I: CLASSLINKER_CUTOFF_AFTER_REGISTER_NATIVE_CLASSLINKER

          DEVICE ORDER
          1. Install only the inner INSTALL_THIS_*.zip and reboot.
          2. Confirm Android and the LSPosed/Irena manager are usable enough for the diagnostic.
          3. Clear logcat, force-stop Ingress and cold-start it once.
          4. Capture:
             su -c 'logcat -b all -d -v threadtime | grep -E "LSPLANT-CL2I|Failed to init lsplant|libpairipcore|SIGSEGV|SEGV_|Fatal signal" > /sdcard/Download/cl2i-registernative-classlinker-only.txt'

          VALIDITY
          - FIXUP_GROUP_RESULT should remain 0 as in CL1/CL2O on the same device/ART.
          - REGISTER_NATIVE_CLASSLINKER_RESULT must be 1.
          - The build itself contains only the direct handler(RegisterNativeClassLinker_) call in the RegisterNative isolation block.
          - If the direct ClassLinker hook result is 0, stop: no PairIP causal conclusion is allowed from that run.

          INTERPRETATION
          - Fixup=0 + RegisterNativeClassLinker=1 + same libpairipcore.so +0x65768 crash:
            RegisterNativeClassLinker_ alone is sufficient to recreate the known PairIP crash under the isolated ClassLinker path.
            Only after this result should a compatibility repair for this exact hook be designed.
          - Fixup=0 + RegisterNativeClassLinker=1 + PairIP survives:
            CL2O selection correlation is not sufficient; re-audit semantic differences before any repair.
          - Marker absent or RegisterNativeClassLinker=0:
            diagnostic is invalid; do not infer causality.

          mAppComponentFactory / JOYSTICK
          - Do not change mAppComponentFactory handling in this build.
          - Do not mix the separate joystick/scanner location issue into this PairIP/ClassLinker causal test.

          STATIC PASS != DEVICE PASS.
          CL2I never becomes a release parent.
          EOF

      - name: Collect CL2I evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cl2i-output/native
          cp CL2I_BUILD_EXIT_CODE.txt cl2i-output/ 2>/dev/null || true
          cp cl2i-build.log cl2i-output/ 2>/dev/null || true
          cp CL2I_BUILD_RELEASE.zip cl2i-output/ 2>/dev/null || true
          cp OFFICIAL_RELEASE.zip cl2i-output/OFFICIAL_7371_RELEASE_REFERENCE.zip 2>/dev/null || true

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          out = Path('cl2i-output')
          manifest = out / 'CL2I_EVIDENCE_SHA256SUMS.txt'
          files = sorted(p for p in out.rglob('*') if p.is_file() and p != manifest)
          with manifest.open('w') as f:
              for p in files:
                  f.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out).as_posix()}\n")
          PY
          (cd cl2i-output && sha256sum -c CL2I_EVIDENCE_SHA256SUMS.txt)

      - name: Final CL2I fail-closed static gate
        id: finalgate
        shell: bash
        run: |
          set -euo pipefail
          test -f CL2I_BUILD_EXIT_CODE.txt
          test "$(cat CL2I_BUILD_EXIT_CODE.txt)" = "0"
          grep -q '^R1_V2_M_INCLUDE_CODE_FIX=PRESERVED$' cl2i-output/CL2I_PROVENANCE.txt
          grep -q '^CL2I_FIXUP_GROUP=SAME_AS_CL1$' cl2i-output/CL2I_PROVENANCE.txt
          grep -q '^CL2I_REGISTER_NATIVE_CLASSLINKER=ONLY_DIRECT_HANDLER_ATTEMPT$' cl2i-output/CL2I_PROVENANCE.txt
          grep -q '^CL2I_REGISTER_NATIVE_FALLBACKS=NONE$' cl2i-output/CL2I_PROVENANCE.txt
          grep -q '^CL2I_UNREGISTER_NATIVE_GROUP=NOT_REACHED$' cl2i-output/CL2I_PROVENANCE.txt
          grep -q '^CL2I_OUTER_CUTOFF_BEFORE=ScopedSuspendAll::Init(handler)$' cl2i-output/CL2I_PROVENANCE.txt
          grep -q '^R9=ABSENT$' cl2i-output/CL2I_PROVENANCE.txt
          grep -q '^DEX2OAT=UNCHANGED_OFFICIAL_7371$' cl2i-output/CL2I_PROVENANCE.txt
          grep -q '^PAIRIP_BYPASS=ABSENT$' cl2i-output/CL2I_PROVENANCE.txt
          test -f "cl2i-output/INSTALL_THIS_${FINAL_ZIP}"
          strings cl2ibuildcmp/lib/arm64-v8a/liblspd.so | grep -Fq 'LSPLANT-CL2I: CLASSLINKER_CUTOFF_AFTER_REGISTER_NATIVE_CLASSLINKER'
          strings cl2ibuildcmp/lib/arm64-v8a/liblspd.so | grep -Fq 'LSPLANT-CL2I: REGISTER_NATIVE_CLASSLINKER_RESULT=%d'
          (cd cl2i-output && sha256sum -c CL2I_EVIDENCE_SHA256SUMS.txt)
          {
            echo "RESULT=CL2I_STATIC_FULL_PASS_REGISTERNATIVE_CLASSLINKER_ONLY_ISOLATION_CREATED"
            echo "PARENT=R1-v2 immutable Framework checkpoint"
            echo "FUNCTIONAL_DELTA_VS_CL1=ONE_NATIVE_HOOK; only RegisterNativeClassLinker_ is attempted after the unchanged Fixup group; no RegisterNative fallbacks"
            echo "FINAL_PAYLOAD=official 7371 + R1 dex + rebuilt CL2I liblspd.so for 4 ABIs"
            echo "MANAGER_DAEMON=official 7371 byte-identical"
            echo "DEVICE_RUNTIME_STATUS=NOT_TESTED_BY_WORKFLOW"
            echo "STATIC_PASS_IS_NOT_DEVICE_PASS=YES"
          } | tee cl2i-output/CL2I_STATIC_PASS_MARKER.txt

      - name: Upload CL2I diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irena-x-v2.0.1-7371-cl2i-registernative-classlinker-only-${{ github.run_id }}
          path: cl2i-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
