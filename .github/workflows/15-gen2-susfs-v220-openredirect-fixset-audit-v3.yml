name: 15 - GEN2 SUSFS v2.2 OPEN_REDIRECT Fixset Audit v3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout pinned ReSukiSU reference
        uses: actions/checkout@v6
        with:
          repository: ReSukiSU/ReSukiSU
          ref: faccf4c5edc7be37776216e7d43dd3dca0239331
          path: resukisu
          fetch-depth: 1

      - name: Fetch SUSFS history and verify pins
        shell: bash
        run: |
          set -euo pipefail

          git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs
          git -C susfs fetch origin gki-android12-5.10

          for sha in \
            4003ecf2d01c6d13fa8edf6c4f2607365738dc3d \
            be08face56c347e7ba9c4fb420c2463598a14f5d \
            86bb893e9a103b97d17045306f35eb239a623f2a \
            c5723cc09c19786fcb701d25a8097e2edbee412a \
            3c14ad549f826b1f53878ec8c12253efebeed75a
          do
            git -C susfs cat-file -e "${sha}^{commit}"
          done

          echo "SUSFS_HISTORY_FETCH=PASS" | tee fetch-status.txt

      - name: Build dependency-aware ancestry map
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          repo = "susfs"
          base = "4003ecf2d01c6d13fa8edf6c4f2607365738dc3d"
          last = "3c14ad549f826b1f53878ec8c12253efebeed75a"

          selected = {
              "be08face56c347e7ba9c4fb420c2463598a14f5d",
              "86bb893e9a103b97d17045306f35eb239a623f2a",
              "c5723cc09c19786fcb701d25a8097e2edbee412a",
              "3c14ad549f826b1f53878ec8c12253efebeed75a",
          }

          def run(*args):
              return subprocess.check_output(args, text=True).strip()

          commits = run(
              "git", "-C", repo, "rev-list",
              "--reverse", "--ancestry-path", f"{base}..{last}",
              "--", "kernel_patches"
          ).splitlines()

          selected_paths = set()
          for sha in selected:
              names = run(
                  "git", "-C", repo, "diff-tree",
                  "--no-commit-id", "--name-only", "-r", sha,
                  "--", "kernel_patches"
              ).splitlines()
              selected_paths.update(names)

          nonselected_open = 0
          nonselected_overlap = 0

          lines = [
              f"V220={base}",
              f"LAST_SELECTED_FIX={last}",
              f"ANCESTRY_KERNEL_PATCH_COMMITS={len(commits)}",
              f"SELECTED_COMMITS={len(selected)}",
              f"NON_SELECTED_COMMITS={sum(c not in selected for c in commits)}",
              "",
              "=== Dependency map ===",
          ]

          for sha in commits:
              subject = run("git", "-C", repo, "show", "-s", "--format=%s", sha)
              date = run("git", "-C", repo, "show", "-s", "--format=%cI", sha)
              names = run(
                  "git", "-C", repo, "diff-tree",
                  "--no-commit-id", "--name-only", "-r", sha,
                  "--", "kernel_patches"
              ).splitlines()

              diff = run(
                  "git", "-C", repo, "show", "--format=", sha,
                  "--", "kernel_patches"
              )

              open_related = (
                  "OPEN_REDIRECT" in subject
                  or "open_redirect" in subject.lower()
                  or "OPEN_REDIRECT" in diff
                  or "open_redirect" in diff.lower()
                  or "susfs_srcu_open_redirect" in diff
                  or "synchronize_srcu" in diff
              )

              overlap = sorted(set(names) & selected_paths)

              if sha not in selected and open_related:
                  nonselected_open += 1
              if sha not in selected and overlap:
                  nonselected_overlap += 1

              lines.append(
                  "COMMIT={sha} DATE={date} SELECTED={sel} "
                  "OPEN_REDIRECT_RELATED={orr} "
                  "OVERLAPS_SELECTED_PATHS={ov} SUBJECT={sub}".format(
                      sha=sha,
                      date=date,
                      sel="YES" if sha in selected else "NO",
                      orr="YES" if open_related else "NO",
                      ov=",".join(overlap) if overlap else "NONE",
                      sub=subject,
                  )
              )
              for path in names:
                  lines.append(f"  PATH={path}")

          lines += [
              "",
              f"NON_SELECTED_OPEN_REDIRECT_COMMITS={nonselected_open}",
              f"NON_SELECTED_COMMITS_OVERLAPPING_SELECTED_PATHS={nonselected_overlap}",
              "NOTE=Overlap is a dependency risk until selected-only application is tested.",
          ]

          Path("fixset-dependency-map.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

          cat fixset-dependency-map.txt

      - name: Materialize selected four commits without creating commits
        shell: bash
        run: |
          set -u

          BASE='4003ecf2d01c6d13fa8edf6c4f2607365738dc3d'
          SIM="$RUNNER_TEMP/susfs-selected-only-v3"

          rm -rf "$SIM"
          git -C susfs worktree add --detach "$SIM" "$BASE"

          {
            echo "BASE=$BASE"
            echo "MODE=CHERRY_PICK_NO_COMMIT"
            echo "GIT_IDENTITY_REQUIRED=NO"
          } > selected-only-materialization.txt

          status='YES'

          for sha in \
            be08face56c347e7ba9c4fb420c2463598a14f5d \
            86bb893e9a103b97d17045306f35eb239a623f2a \
            c5723cc09c19786fcb701d25a8097e2edbee412a \
            3c14ad549f826b1f53878ec8c12253efebeed75a
          do
            {
              echo
              echo "APPLYING=$sha"
              git -C susfs show -s --format='SUBJECT=%s%nPARENT=%P' "$sha"
            } >> selected-only-materialization.txt

            if git -C "$SIM" cherry-pick \
              --no-commit \
              "$sha" \
              >> selected-only-materialization.txt 2>&1; then
              echo "STATUS=CLEAN" >> selected-only-materialization.txt
            else
              echo "STATUS=CONFLICT" >> selected-only-materialization.txt
              git -C "$SIM" status --short \
                >> selected-only-materialization.txt 2>&1 || true
              git -C "$SIM" diff --name-only --diff-filter=U \
                >> selected-only-materialization.txt 2>&1 || true
              status='NO'
              git -C "$SIM" reset --hard "$BASE" \
                >> selected-only-materialization.txt 2>&1 || true
              break
            fi
          done

          echo >> selected-only-materialization.txt
          echo "SELECTED_ONLY_MATERIALIZATION=$status" \
            >> selected-only-materialization.txt

          cat selected-only-materialization.txt

          if [ "$status" = YES ]; then
            git -C "$SIM" diff \
              --binary \
              "$BASE" \
              -- kernel_patches \
              > GEN2_15_SELECTED_ONLY_FIXSET.patch

            git -C "$SIM" diff \
              --name-status \
              "$BASE" \
              -- kernel_patches \
              > selected-only-changed-paths.txt

            git -C "$SIM" diff \
              --check \
              "$BASE" \
              -- kernel_patches \
              > selected-only-diff-check.txt 2>&1

            echo "SELECTED_ONLY_DIFF_CHECK=PASS" \
              >> selected-only-diff-check.txt
          else
            echo "SELECTED_ONLY_FIXSET_NOT_MATERIALIZED" \
              > GEN2_15_SELECTED_ONLY_FIXSET.patch
            echo "SELECTED_ONLY_FIXSET_NOT_MATERIALIZED" \
              > selected-only-changed-paths.txt
            echo "SELECTED_ONLY_DIFF_CHECK=SKIPPED" \
              > selected-only-diff-check.txt
          fi

      - name: Compare selected-only tree with actual upstream final state
        shell: bash
        run: |
          set -euo pipefail

          BASE='4003ecf2d01c6d13fa8edf6c4f2607365738dc3d'
          LAST='3c14ad549f826b1f53878ec8c12253efebeed75a'
          SIM="$RUNNER_TEMP/susfs-selected-only-v3"
          FINAL="$RUNNER_TEMP/susfs-final-v3"

          rm -rf "$FINAL"
          git -C susfs worktree add --detach "$FINAL" "$LAST"

          git -C susfs diff \
            --binary \
            "$BASE" "$LAST" \
            -- kernel_patches \
            > GEN2_15_V220_TO_ACTUAL_FINAL_KERNEL_PATCH_DELTA.patch

          {
            echo "ACTUAL_FINAL_COMMIT=$LAST"
            git -C susfs show -s \
              --format='DATE=%cI%nSUBJECT=%s%nPARENTS=%P' \
              "$LAST"
            echo
            echo "=== Actual final changed paths from v2.2 ==="
            git -C susfs diff \
              --name-status \
              "$BASE" "$LAST" \
              -- kernel_patches
          } | tee actual-final-reference.txt

          if grep -q '^SELECTED_ONLY_MATERIALIZATION=YES$' \
            selected-only-materialization.txt; then

            {
              echo "COMPARISON_AVAILABLE=YES"
              echo
              echo "=== Selected-only vs actual final ==="
              diff -ruN \
                "$FINAL/kernel_patches" \
                "$SIM/kernel_patches" \
                || true
            } > selected-only-vs-actual-final.txt
          else
            {
              echo "COMPARISON_AVAILABLE=NO"
              echo "REASON=SELECTED_ONLY_MATERIALIZATION_FAILED"
            } > selected-only-vs-actual-final.txt
          fi

          sed -n '1,1200p' selected-only-vs-actual-final.txt

      - name: Prove whether remaining differences contain OPEN_REDIRECT semantics
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q '^SELECTED_ONLY_MATERIALIZATION=YES$' \
            selected-only-materialization.txt; then
            {
              echo "REMAINING_DIFF_AUDIT=SKIPPED"
              echo "REMAINING_OPEN_REDIRECT_DIFFERENCE=UNKNOWN"
            } | tee remaining-diff-openredirect-audit.txt
            exit 0
          fi

          SIM="$RUNNER_TEMP/susfs-selected-only-v3"
          FINAL="$RUNNER_TEMP/susfs-final-v3"

          diff -ruN \
            "$FINAL/kernel_patches" \
            "$SIM/kernel_patches" \
            > remaining-final-vs-selected.diff || true

          {
            echo "=== Remaining difference markers ==="
            if grep -qiE \
              'OPEN_REDIRECT|open_redirect|susfs_srcu_open_redirect|synchronize_srcu|synchronize_rcu|do_tmpfile|do_o_path|path_openat' \
              remaining-final-vs-selected.diff; then
              echo "REMAINING_OPEN_REDIRECT_DIFFERENCE=YES"
            else
              echo "REMAINING_OPEN_REDIRECT_DIFFERENCE=NO"
            fi

            echo
            echo "=== Remaining changed files ==="
            grep '^diff ' remaining-final-vs-selected.diff || true
          } | tee remaining-diff-openredirect-audit.txt

      - name: Audit non-selected overlapping commit directly
        shell: bash
        run: |
          set -euo pipefail

          SHA='ed306cc62cb0fa655982000a95b6f4832d21eb56'

          {
            echo "COMMIT=$SHA"
            git -C susfs show -s \
              --format='DATE=%cI%nSUBJECT=%s%nPARENTS=%P' \
              "$SHA"

            echo
            echo "=== Paths ==="
            git -C susfs show \
              --name-only \
              --format= \
              "$SHA" \
              -- kernel_patches

            echo
            echo "=== OPEN_REDIRECT markers in this commit ==="
            if git -C susfs show \
              --format= \
              "$SHA" \
              -- kernel_patches \
              | grep -qiE \
                'OPEN_REDIRECT|open_redirect|susfs_srcu_open_redirect|synchronize_srcu|synchronize_rcu'; then
              echo "ED306_OPEN_REDIRECT_RELATED=YES"
            else
              echo "ED306_OPEN_REDIRECT_RELATED=NO"
            fi

            echo
            echo "=== Diff excerpt ==="
            git -C susfs show \
              --format= \
              "$SHA" \
              -- kernel_patches \
              | sed -n '1,500p'
          } | tee ed306-overlap-audit.txt

      - name: Audit ReSukiSU SUSFS contract using explicit kernel-side identifiers
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=== ReSukiSU actual SUSFS C-call identifiers ==="

            grep -RhoE \
              '\b(susfs_[A-Za-z0-9_]+)\s*\(' \
              resukisu/kernel \
              2>/dev/null \
              | sed -E 's/[[:space:]]*\($//' \
              | sort -u \
              > resukisu-susfs-call-identifiers.txt

            cat resukisu-susfs-call-identifiers.txt

            echo
            echo "=== SUSFS identifiers present in final reference ==="

            grep -RhoE \
              '\b(susfs_[A-Za-z0-9_]+)\s*\(' \
              "$RUNNER_TEMP/susfs-final-v3/kernel_patches" \
              2>/dev/null \
              | sed -E 's/[[:space:]]*\($//' \
              | sort -u \
              > final-susfs-call-identifiers.txt

            cat final-susfs-call-identifiers.txt
          } | tee resukisu-susfs-call-contract.txt

          comm -23 \
            resukisu-susfs-call-identifiers.txt \
            final-susfs-call-identifiers.txt \
            > resukisu-susfs-call-gaps.txt

          {
            echo "=== ReSukiSU call identifiers not found in final SUSFS reference ==="
            cat resukisu-susfs-call-gaps.txt
          } | tee resukisu-susfs-call-gap-summary.txt

      - name: Derive corrected v3 verdict
        shell: bash
        run: |
          set -euo pipefail

          selected="$(
            grep '^SELECTED_ONLY_MATERIALIZATION=' \
              selected-only-materialization.txt \
              | cut -d= -f2
          )"

          nonselected_open="$(
            grep '^NON_SELECTED_OPEN_REDIRECT_COMMITS=' \
              fixset-dependency-map.txt \
              | cut -d= -f2
          )"

          remaining="$(
            grep '^REMAINING_OPEN_REDIRECT_DIFFERENCE=' \
              remaining-diff-openredirect-audit.txt \
              | cut -d= -f2
          )"

          {
            echo "SELECTED_ONLY_MATERIALIZATION=$selected"
            echo "NON_SELECTED_OPEN_REDIRECT_COMMITS=$nonselected_open"
            echo "REMAINING_OPEN_REDIRECT_DIFFERENCE=$remaining"

            if [ "$selected" = YES ] \
              && [ "$nonselected_open" -eq 0 ] \
              && [ "$remaining" = NO ]; then
              echo "FOUR_COMMIT_OPENREDIRECT_FIXSET_SELF_CONTAINED=YES"
              echo "PORT_REFERENCE=V220_PLUS_FOUR_SELECTED_OPENREDIRECT_FIXES"
            else
              echo "FOUR_COMMIT_OPENREDIRECT_FIXSET_SELF_CONTAINED=NO"
              echo "PORT_REFERENCE=ACTUAL_UPSTREAM_FINAL_WITH_HUNK_LEVEL_SCOPE_CONTROL"
            fi

            echo "NOTE=This verdict is scoped to OPEN_REDIRECT semantics only."
            echo "NOTE=No kernel patch is applied by this audit."
          } | tee corrected-v3-verdict.txt

      - name: Write final audit file
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "AUDIT=GEN2_15_SUSFS_V220_OPENREDIRECT_FIXSET_V3"
            echo "RESULT=PASS"
            echo "GEN2_15_SUSFS_V220_OPENREDIRECT_FIXSET_AUDIT=PASS"
            echo "WORKFLOW_REVISION=V3_NO_COMMIT_IDENTITY"
            echo "RESUKISU_COMMIT=$(git -C resukisu rev-parse HEAD)"
            echo "SUSFS_V220_COMMIT=4003ecf2d01c6d13fa8edf6c4f2607365738dc3d"
            echo "LAST_SELECTED_FIX=3c14ad549f826b1f53878ec8c12253efebeed75a"
            echo "NO_KERNEL_SOURCE_MODIFIED=YES"
            echo "NO_KERNEL_BUILD_PERFORMED=YES"
            echo
            cat corrected-v3-verdict.txt
            echo
            cat resukisu-susfs-call-gap-summary.txt
          } | tee GEN2_15_SUSFS_V220_OPENREDIRECT_FIXSET_AUDIT.txt

      - name: Upload final audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GEN2_15_SUSFS_V220_OPENREDIRECT_FIXSET_AUDIT
          path: |
            GEN2_15_SUSFS_V220_OPENREDIRECT_FIXSET_AUDIT.txt
            fetch-status.txt
            fixset-dependency-map.txt
            selected-only-materialization.txt
            selected-only-changed-paths.txt
            selected-only-diff-check.txt
            GEN2_15_SELECTED_ONLY_FIXSET.patch
            actual-final-reference.txt
            GEN2_15_V220_TO_ACTUAL_FINAL_KERNEL_PATCH_DELTA.patch
            selected-only-vs-actual-final.txt
            remaining-final-vs-selected.diff
            remaining-diff-openredirect-audit.txt
            ed306-overlap-audit.txt
            resukisu-susfs-call-identifiers.txt
            final-susfs-call-identifiers.txt
            resukisu-susfs-call-contract.txt
            resukisu-susfs-call-gaps.txt
            resukisu-susfs-call-gap-summary.txt
            corrected-v3-verdict.txt
          if-no-files-found: warn
          retention-days: 30
