name: 07 - ReSukiSU Integration Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout VEUX source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: 20240619
          fetch-depth: 0
          filter: blob:none
          path: kernel

      - name: Prepare Candidate 2 source
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          git config user.name "VEUX ReSukiSU Audit"
          git config user.email "veux-audit@users.noreply.github.com"

          git remote remove android 2>/dev/null || true

          git remote add android \
            https://android.googlesource.com/kernel/common

          git fetch android \
            refs/tags/android11-5.4.274_r00:refs/tags/android11-5.4.274_r00

          git merge \
            --no-edit \
            --no-ff \
            android11-5.4.274_r00

          git revert \
            --no-edit \
            f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80

          VERSION=$(awk '$1=="VERSION" && $2=="=" {print $3; exit}' Makefile)
          PATCHLEVEL=$(awk '$1=="PATCHLEVEL" && $2=="=" {print $3; exit}' Makefile)
          SUBLEVEL=$(awk '$1=="SUBLEVEL" && $2=="=" {print $3; exit}' Makefile)

          KVER="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          echo "Kernel: $KVER"

          test "$KVER" = "5.4.274"
          test -f arch/arm64/configs/veux_defconfig
          test -f arch/arm64/boot/dts/vendor/xiaomi/veux.dts

          echo "Candidate 2 prepared successfully."

      - name: Protect existing SUSFS
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          REPORT="$GITHUB_WORKSPACE/SUSFS-GUARD.txt"

          {
            echo "SUSFS PRESERVATION GUARD"
            echo "========================"
            echo
          } > "$REPORT"

          FOUND=0

          for FILE in \
            include/linux/susfs_def.h \
            fs/susfs.c
          do
            if [ -e "$FILE" ]; then
              echo "FOUND FILE: $FILE" | tee -a "$REPORT"
              FOUND=1
            fi
          done

          if git grep \
            -n \
            -E 'CONFIG_KSU_SUSFS|susfs_' \
            -- \
            . \
            ':(exclude)drivers/kernelsu/**' \
            >> "$REPORT" 2>/dev/null
          then
            FOUND=1
          fi

          if [ "$FOUND" -ne 0 ]; then
            echo
            echo "Existing SUSFS footprint detected."
            echo "Stopping instead of overwriting it."
            cat "$REPORT"
            exit 20
          fi

          echo "No existing SUSFS kernel-side backport detected." \
            | tee -a "$REPORT"

          echo "SUSFS preservation check passed."

      - name: Remove legacy KernelSU driver
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          test -d drivers/kernelsu

          LEGACY_COUNT=$(find drivers/kernelsu -type f | wc -l)

          echo "Legacy KernelSU files: $LEGACY_COUNT"

          rm -rf drivers/kernelsu

          test ! -e drivers/kernelsu

          echo "Legacy KernelSU driver removed."

      - name: Convert legacy hooks
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, pattern, replacement, name, flags=0):
              text = read(path)

              result, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=flags,
              )

              if count != 1:
                  print(
                      f"ERROR: {name}: expected 1 replacement, got {count}",
                      file=sys.stderr,
                  )
                  sys.exit(40)

              write(path, result)
              print(f"OK: {name}")

          replace_once(
              "fs/read_write.c",
              r"""
              \n\#ifdef\ CONFIG_KSU\n
              extern\ bool\ ksu_vfs_read_hook\ __read_mostly;\n
              extern\ int\ ksu_handle_vfs_read
              \(struct\ file\ \*\*file_ptr,\ char\ __user\ \*\*buf_ptr,\n
              \s*size_t\ \*count_ptr,\ loff_t\ \*\*pos\);\n
              \#endif\n
              """,
              "\n",
              "remove old vfs_read declaration",
              re.VERBOSE,
          )

          replace_once(
              "fs/read_write.c",
              r"""
              \n\#ifdef\ CONFIG_KSU\n
              \s*if\ \(unlikely\(ksu_vfs_read_hook\)\)\n
              \s*ksu_handle_vfs_read
              \(&file,\ &buf,\ &count,\ &pos\);\n
              \#endif\n
              """,
              "\n",
              "remove old vfs_read call",
              re.VERBOSE,
          )

          replace_once(
              "fs/exec.c",
              r"""
              \#ifdef\ CONFIG_KSU\n
              extern\ bool\ ksu_execveat_hook\ __read_mostly;\n
              extern\ int\ ksu_handle_execveat
              \(int\ \*fd,\ struct\ filename\ \*\*filename_ptr,\n
              \s*void\ \*argv,\ void\ \*envp,\ int\ \*flags\);\n
              extern\ int\ ksu_handle_execveat_sucompat
              \(int\ \*fd,\ struct\ filename\ \*\*filename_ptr,\n
              \s*void\ \*argv,\ void\ \*envp,\ int\ \*flags\);\n
              \#endif
              """,
              """#ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_execveat(
                  int *fd,
                  struct filename **filename_ptr,
                  void *argv,
                  void *envp,
                  int *flags);
          #endif""",
              "replace old exec declarations",
              re.VERBOSE,
          )

          replace_once(
              "fs/exec.c",
              r"""
              \#ifdef\ CONFIG_KSU\n
              \s*if\ \(unlikely\(ksu_execveat_hook\)\)\n
              \s*ksu_handle_execveat
              \(&fd,\ &filename,\ &argv,\ &envp,\ &flags\);\n
              \s*else\n
              \s*ksu_handle_execveat_sucompat
              \(&fd,\ &filename,\ &argv,\ &envp,\n
              \s*&flags\);\n
              \#endif
              """,
              """#ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_execveat(
                      &fd,
                      &filename,
                      &argv,
                      &envp,
                      &flags);
          #endif""",
              "replace old exec call",
              re.VERBOSE,
          )

          replace_once(
              "fs/open.c",
              r"""
              \#ifdef\ CONFIG_KSU\n
              (extern\ int\ ksu_handle_faccessat
              \(int\ \*dfd,\ const\ char\ __user\ \*\*filename_user,\n
              \s*int\ \*mode,\ int\ \*flags\);\n)
              \#endif
              """,
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n\\1#endif",
              "convert faccessat declaration guard",
              re.VERBOSE,
          )

          replace_once(
              "fs/open.c",
              r"""
              \#ifdef\ CONFIG_KSU\n
              (\s*ksu_handle_faccessat
              \(&dfd,\ &filename,\ &mode,\ NULL\);\n)
              \#endif
              """,
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n\\1#endif",
              "convert faccessat call guard",
              re.VERBOSE,
          )

          replace_once(
              "fs/stat.c",
              r"""
              \#ifdef\ CONFIG_KSU\n
              extern\ int\ ksu_handle_stat
              \(int\ \*dfd,\ const\ char\ __user\ \*\*filename_user,\n
              \s*int\ \*flags\);\n
              \#endif
              """,
              """#ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_stat(
                  int *dfd,
                  const char __user **filename_user,
                  int *flags);

          extern void ksu_handle_newfstat_ret(
                  unsigned int *fd,
                  struct stat __user **statbuf_ptr);

          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(
                  unsigned long *fd,
                  struct stat64 __user **statbuf_ptr);
          #endif
          #endif""",
              "replace stat declarations",
              re.VERBOSE,
          )

          replace_once(
              "fs/stat.c",
              r"""
              \#ifdef\ CONFIG_KSU\n
              (\s*ksu_handle_stat\(&dfd,\ &filename,\ &flags\);\n)
              \#endif
              """,
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n\\1#endif",
              "convert stat call guard",
              re.VERBOSE,
          )

          replace_once(
              "fs/stat.c",
              r"""
              (SYSCALL_DEFINE2\(newfstat,
              .*?
              if\ \(!error\)\n
              \s*error\ =\ cp_new_stat\(&stat,\ statbuf\);\n)
              (\n\s*return\ error;)
              """,
              """\\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_newfstat_ret(&fd, &statbuf);
          #endif
          \\2""",
              "add newfstat return hook",
              re.VERBOSE | re.DOTALL,
          )

          replace_once(
              "fs/stat.c",
              r"""
              (SYSCALL_DEFINE2\(fstat64,
              .*?
              if\ \(!error\)\n
              \s*error\ =\ cp_new_stat64\(&stat,\ statbuf\);\n)
              (\n\s*return\ error;)
              """,
              """\\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_fstat64_ret(&fd, &statbuf);
          #endif
          \\2""",
              "add fstat64 return hook",
              re.VERBOSE | re.DOTALL,
          )

          replace_once(
              "kernel/reboot.c",
              r"""
              (SYSCALL_DEFINE4\(reboot,\ int,\ magic1,\ int,\ magic2,
              \ unsigned\ int,\ cmd,\n
              \s*void\ __user\ \*,\ arg\))
              """,
              """#ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(
                  int magic1,
                  int magic2,
                  unsigned int cmd,
                  void __user **arg);
          #endif

          \\1""",
              "add reboot declaration",
              re.VERBOSE,
          )

          replace_once(
              "kernel/reboot.c",
              r"""
              (SYSCALL_DEFINE4\(reboot,
              .*?
              \n\s*int\ ret\ =\ 0;\n)
              """,
              """\\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_sys_reboot(
                      magic1,
                      magic2,
                      cmd,
                      &arg);
          #endif
          """,
              "add reboot hook",
              re.VERBOSE | re.DOTALL,
          )

          forbidden = {
              "fs/read_write.c": [
                  "ksu_vfs_read_hook",
                  "ksu_handle_vfs_read",
              ],
              "fs/exec.c": [
                  "ksu_execveat_hook",
                  "ksu_handle_execveat_sucompat",
              ],
          }

          for path, terms in forbidden.items():
              text = read(path)

              for term in terms:
                  if term in text:
                      print(
                          f"ERROR: old hook remains: {term} in {path}",
                          file=sys.stderr,
                      )
                      sys.exit(41)

          print("Legacy hooks converted successfully.")
          PY

      - name: Prepare ReSukiSU static symbol exports
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          python3 <<'PY'
          from pathlib import Path
          import sys

          path = Path("security/selinux/selinuxfs.c")
          text = path.read_text()

          old_write = \
              "static ssize_t (*const write_op[])(struct file *, char *, size_t)"

          new_write = \
              "ssize_t (*const write_op[])(struct file *, char *, size_t)"

          old_status = \
              "static const struct file_operations sel_handle_status_ops"

          new_status = \
              "const struct file_operations sel_handle_status_ops"

          if old_write not in text:
              print(
                  "ERROR: expected static write_op declaration not found",
                  file=sys.stderr,
              )
              sys.exit(45)

          if old_status not in text:
              print(
                  "ERROR: expected static sel_handle_status_ops not found",
                  file=sys.stderr,
              )
              sys.exit(46)

          text = text.replace(
              old_write,
              new_write,
              1,
          )

          text = text.replace(
              old_status,
              new_status,
              1,
          )

          path.write_text(text)

          print("write_op made link-visible.")
          print("sel_handle_status_ops made link-visible.")
          PY

          grep -n \
            'write_op\[\]' \
            security/selinux/selinuxfs.c

          grep -n \
            'sel_handle_status_ops' \
            security/selinux/selinuxfs.c

          if ! grep -q \
            'struct selinux_state ' \
            security/selinux/include/security.h
          then
            echo "ERROR: selinux_state layout differs."
            exit 47
          fi

          echo "SELinux symbol preparation passed."

      - name: Integrate pinned ReSukiSU
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          RESUKISU_COMMIT="faccf4c5edc7be37776216e7d43dd3dca0239331"

          curl \
            -fLSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/${RESUKISU_COMMIT}/kernel/setup.sh" \
            -o "$RUNNER_TEMP/resukisu-setup.sh"

          bash \
            "$RUNNER_TEMP/resukisu-setup.sh" \
            "$RESUKISU_COMMIT"

          test -d KernelSU
          test -L drivers/kernelsu

          ACTUAL=$(git -C KernelSU rev-parse HEAD)

          echo "Expected: $RESUKISU_COMMIT"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$RESUKISU_COMMIT"

          test "$(readlink -f drivers/kernelsu)" \
            = "$(realpath KernelSU/kernel)"

          echo "ReSukiSU pinned successfully."

      - name: Configure ReSukiSU Manual Hook
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          python3 <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/configs/veux_defconfig")
          lines = path.read_text().splitlines()

          symbols = [
              "KSU",
              "KSU_MANUAL_HOOK",
              "KSU_TRACEPOINT_HOOK",
              "KSU_SUSFS",
              "KSU_MANUAL_HOOK_AUTO_SETUID_HOOK",
              "KSU_MANUAL_HOOK_AUTO_INITRC_HOOK",
              "KSU_MANUAL_HOOK_AUTO_INPUT_HOOK",
              "DEBUG_KERNEL",
              "KALLSYMS_ALL",
          ]

          def belongs(line):
              for symbol in symbols:
                  if line.startswith(f"CONFIG_{symbol}="):
                      return True

                  if line == f"# CONFIG_{symbol} is not set":
                      return True

              return False

          lines = [
              line
              for line in lines
              if not belongs(line)
          ]

          lines += [
              "",
              "# ReSukiSU 5.4 Manual Hook",
              "# CONFIG_DEBUG_KERNEL is not set",
              "CONFIG_KSU=y",
              "# CONFIG_KSU_TRACEPOINT_HOOK is not set",
              "CONFIG_KSU_MANUAL_HOOK=y",
              "# CONFIG_KSU_SUSFS is not set",
              "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y",
              "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y",
              "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y",
          ]

          path.write_text(
              "\n".join(lines) + "\n"
          )
          PY

          echo
          echo "ReSukiSU additions:"
          echo

          tail -n 15 \
            arch/arm64/configs/veux_defconfig

      - name: Resolve VEUX defconfig
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          rm -rf out

          make \
            O=out \
            ARCH=arm64 \
            veux_defconfig \
            2>&1 | tee "$GITHUB_WORKSPACE/defconfig.log"

          test -f out/.config

          echo
          echo "Resolved configuration:"
          echo

          grep -E \
            'CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_DEBUG_KERNEL' \
            out/.config \
            || true

      - name: Verify resolved configuration
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          CONFIG="out/.config"

          grep -qx \
            'CONFIG_KSU=y' \
            "$CONFIG"

          grep -qx \
            'CONFIG_KALLSYMS=y' \
            "$CONFIG"

          grep -qx \
            'CONFIG_KSU_MANUAL_HOOK=y' \
            "$CONFIG"

          grep -qx \
            '# CONFIG_KSU_TRACEPOINT_HOOK is not set' \
            "$CONFIG"

          grep -qx \
            '# CONFIG_KSU_SUSFS is not set' \
            "$CONFIG"

          grep -qx \
            '# CONFIG_DEBUG_KERNEL is not set' \
            "$CONFIG"

          grep -qx \
            'CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y' \
            "$CONFIG"

          grep -qx \
            'CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y' \
            "$CONFIG"

          grep -qx \
            'CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y' \
            "$CONFIG"

          if grep -qx \
            'CONFIG_KALLSYMS_ALL=y' \
            "$CONFIG"
          then
            echo "ERROR: CONFIG_KALLSYMS_ALL unexpectedly enabled."
            exit 50
          fi

          echo
          echo "=========================================="
          echo "RESUKISU CONFIGURATION VERIFIED"
          echo "=========================================="
          echo
          echo "CONFIG_KSU=y"
          echo "CONFIG_KSU_MANUAL_HOOK=y"
          echo "CONFIG_KALLSYMS=y"
          echo "CONFIG_KALLSYMS_ALL is disabled/unavailable"
          echo "CONFIG_DEBUG_KERNEL is disabled"
          echo "Tracepoint Hook is disabled"
          echo "SUSFS is not enabled prematurely"
          echo "Manual auto hooks are enabled"

      - name: Run hook compatibility audit
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          REPORT="$GITHUB_WORKSPACE/HOOK-AUDIT.txt"

          {
            echo "RESUKISU HOOK AUDIT"
            echo "==================="
            echo

            for SPEC in \
              "fs/exec.c:ksu_handle_execveat" \
              "fs/open.c:ksu_handle_faccessat" \
              "fs/stat.c:ksu_handle_stat" \
              "fs/stat.c:ksu_handle_newfstat_ret" \
              "fs/stat.c:ksu_handle_fstat64_ret" \
              "kernel/reboot.c:ksu_handle_sys_reboot"
            do
              FILE="${SPEC%%:*}"
              TERM="${SPEC#*:}"

              if grep -q "$TERM" "$FILE"; then
                echo "FOUND   $TERM   $FILE"
              else
                echo "MISSING $TERM   $FILE"
                exit 60
              fi
            done

            echo

            for TERM in \
              ksu_vfs_read_hook \
              ksu_handle_vfs_read \
              ksu_execveat_hook \
              ksu_handle_execveat_sucompat \
              is_ksu_transition
            do
              if git grep \
                -n \
                "$TERM" \
                -- \
                ':!KernelSU/**' \
                ':!drivers/kernelsu/**'
              then
                echo "ERROR: incompatible old hook remains: $TERM"
                exit 61
              else
                echo "ABSENT  $TERM"
              fi
            done

            echo

            if grep -q \
              '^static ssize_t (\*const write_op\[\])' \
              security/selinux/selinuxfs.c
            then
              echo "ERROR: write_op is still static"
              exit 62
            fi

            if grep -q \
              '^static const struct file_operations sel_handle_status_ops' \
              security/selinux/selinuxfs.c
            then
              echo "ERROR: sel_handle_status_ops is still static"
              exit 63
            fi

            echo "EXPORT  write_op"
            echo "EXPORT  sel_handle_status_ops"
          } | tee "$REPORT"

      - name: Save integration audit
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          {
            echo "VEUX 5.4.274 RESUKISU INTEGRATION DRY RUN V3"
            echo "============================================="
            echo
            echo "Base:"
            echo "dereference23/kernel_xiaomi_sm6375"
            echo "Tag: 20240619"
            echo
            echo "Kernel:"
            echo "5.4.274"
            echo
            echo "Stability Candidate:"
            echo "Candidate 2"
            echo
            echo "ReSukiSU:"
            git -C KernelSU rev-parse HEAD
            echo
            echo "Hook method:"
            echo "Manual Hook"
            echo
            echo "CONFIG_KALLSYMS:"
            echo "Enabled"
            echo
            echo "CONFIG_KALLSYMS_ALL:"
            echo "Disabled/unavailable"
            echo
            echo "CONFIG_DEBUG_KERNEL:"
            echo "Disabled"
            echo
            echo "SELinux static symbols:"
            echo "write_op link-visible"
            echo "sel_handle_status_ops link-visible"
            echo
            echo "SUSFS:"
            echo "Not enabled yet"
            echo
            echo "No kernel Image compiled."
            echo "No boot image created."
            echo "Nothing flashed."
          } > "$GITHUB_WORKSPACE/INTEGRATION-SUMMARY.txt"

          git diff \
            -- \
            fs/read_write.c \
            fs/exec.c \
            fs/open.c \
            fs/stat.c \
            kernel/reboot.c \
            security/selinux/selinuxfs.c \
            arch/arm64/configs/veux_defconfig \
            > "$GITHUB_WORKSPACE/RESUKISU-INTEGRATION.diff"

          cp \
            out/.config \
            "$GITHUB_WORKSPACE/resolved-veux.config"

          cat "$GITHUB_WORKSPACE/INTEGRATION-SUMMARY.txt"

          echo
          echo "Diff lines:"

          wc -l \
            "$GITHUB_WORKSPACE/RESUKISU-INTEGRATION.diff"

      - name: Upload integration audit
        uses: actions/upload-artifact@v7
        with:
          name: veux-5.4.274-resukisu-integration-dryrun-v3
          path: |
            SUSFS-GUARD.txt
            HOOK-AUDIT.txt
            INTEGRATION-SUMMARY.txt
            RESUKISU-INTEGRATION.diff
            resolved-veux.config
            defconfig.log
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload diagnostics if workflow fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: veux-5.4.274-resukisu-integration-failure-v3
          path: |
            SUSFS-GUARD.txt
            HOOK-AUDIT.txt
            INTEGRATION-SUMMARY.txt
            RESUKISU-INTEGRATION.diff
            resolved-veux.config
            defconfig.log
            kernel/out/.config
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
