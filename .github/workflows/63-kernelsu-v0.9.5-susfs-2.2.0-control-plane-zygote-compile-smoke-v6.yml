            CONFIG_KSU_SUSFS_SUS_MOUNT=y \
            CONFIG_KSU_SUSFS_SUS_KSTAT=y \
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
            CONFIG_KSU_SUSFS_ENABLE_LOG=y \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=y \
            CONFIG_KSU_SUSFS_SUS_MAP=y
          do
            grep -Fxq "$cfg" out-w63/.config
          done

          grep -Fxq '# CONFIG_MODULES is not set' out-w63/.config

          if grep -q '^CONFIG_KPROBES=' out-w63/.config; then
            echo "CONFIG_KPROBES unexpectedly enabled" >&2
            exit 1
          fi

          if grep -q '^CONFIG_KPROBE_EVENTS=' out-w63/.config; then
            echo "CONFIG_KPROBE_EVENTS unexpectedly enabled" >&2
            exit 1
