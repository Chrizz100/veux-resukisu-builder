            echo "CONFIG_MODULES=n"
            echo "CONFIG_KPROBES=n_or_unavailable"
            echo "CONFIG_KPROBE_EVENTS=n_or_unavailable"
            echo "CONFIG_CONTRACT=PASS"
          } | tee "$ARTIFACT_DIR/CONFIG-CONTRACT.txt"

      - name: Compile KSU bridge SUSFS core and reboot hook objects
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          SANDBOX="$STAGE_DIR/kernel-smoke"
          cd "$SANDBOX"

          export PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_REVISION/bin:$PATH"
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"

          : > "$ARTIFACT_DIR/compile-smoke.log"

          set +e

          # The isolated drivers/kernelsu/ target includes SELinux internal
          # headers directly through KernelSU's kernel_compat.h. The top-level
          # Linux 5.4 Makefile does NOT expose security/selinux/flask.h as a
          # direct make target; that rule is local to security/selinux/Makefile.
          # Build the owning Kbuild directory instead. This is still a bounded
          # prerequisite build, not a full Image/vmlinux build.
          make \
            -j2 \
            O=out-w63 \
            ARCH=arm64 \
            LLVM=1 \
            security/selinux/ \
            2>&1 | tee -a "$ARTIFACT_DIR/compile-smoke.log"
          selinux_prereq_rc=${PIPESTATUS[0]}

          test -s out-w63/security/selinux/flask.h
          flask_present_rc=$?

          test -s out-w63/security/selinux/av_permissions.h
          av_permissions_present_rc=$?

          test -s out-w63/security/selinux/selinux.o
          selinux_composite_present_rc=$?

          make \
            -j2 \
            O=out-w63 \
            ARCH=arm64 \
            LLVM=1 \
            drivers/kernelsu/ \
            2>&1 | tee -a "$ARTIFACT_DIR/compile-smoke.log"
          ksu_rc=${PIPESTATUS[0]}

          make \
            -j2 \
            O=out-w63 \
            ARCH=arm64 \
            LLVM=1 \
            fs/susfs.o \
            2>&1 | tee -a "$ARTIFACT_DIR/compile-smoke.log"
          susfs_rc=${PIPESTATUS[0]}

          make \
            -j2 \
            O=out-w63 \
            ARCH=arm64 \
            LLVM=1 \
            kernel/reboot.o \
            2>&1 | tee -a "$ARTIFACT_DIR/compile-smoke.log"
          reboot_rc=${PIPESTATUS[0]}

          set -e

          {
            echo "SELINUX_DIRECTORY_PREREQ_RC=$selinux_prereq_rc"
            echo "SELINUX_FLASK_HEADER_PRESENT_RC=$flask_present_rc"
            echo "SELINUX_AV_PERMISSIONS_HEADER_PRESENT_RC=$av_permissions_present_rc"
            echo "SELINUX_COMPOSITE_OBJECT_PRESENT_RC=$selinux_composite_present_rc"
            echo "KSU_DIRECTORY_BUILD_RC=$ksu_rc"
            echo "SUSFS_CORE_OBJECT_RC=$susfs_rc"
            echo "REBOOT_HOOK_OBJECT_RC=$reboot_rc"
          } | tee "$ARTIFACT_DIR/compile-smoke-exit.txt"

          if [ "$selinux_prereq_rc" -ne 0 ] || \
             [ "$flask_present_rc" -ne 0 ] || \
             [ "$av_permissions_present_rc" -ne 0 ] || \
             [ "$selinux_composite_present_rc" -ne 0 ] || \
             [ "$ksu_rc" -ne 0 ] || \
             [ "$susfs_rc" -ne 0 ] || \
             [ "$reboot_rc" -ne 0 ]
          then
            exit 1
          fi

      - name: Record compile outcome
        if: always()
        shell: bash
        run: |
          set -u

          {
            echo "STEP_OUTCOME=${{ steps.compile.outcome }}"
            echo "STEP_CONCLUSION=${{ steps.compile.conclusion }}"
            echo "RUN_ID=${GITHUB_RUN_ID:-unknown}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT:-unknown}"
          } | tee "$ARTIFACT_DIR/compile-step-outcome.txt"

      - name: Verify W63 compile-smoke and source contracts
        if: ${{ steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          SANDBOX="$STAGE_DIR/kernel-smoke"
          KSU_STAGE="$SANDBOX/KernelSU/kernel"

          grep -Fxq 'SELINUX_DIRECTORY_PREREQ_RC=0' \
            "$ARTIFACT_DIR/compile-smoke-exit.txt"
          grep -Fxq 'SELINUX_FLASK_HEADER_PRESENT_RC=0' \
            "$ARTIFACT_DIR/compile-smoke-exit.txt"
          grep -Fxq 'SELINUX_AV_PERMISSIONS_HEADER_PRESENT_RC=0' \
            "$ARTIFACT_DIR/compile-smoke-exit.txt"
          grep -Fxq 'SELINUX_COMPOSITE_OBJECT_PRESENT_RC=0' \
            "$ARTIFACT_DIR/compile-smoke-exit.txt"

          grep -Fxq 'KSU_DIRECTORY_BUILD_RC=0' \
            "$ARTIFACT_DIR/compile-smoke-exit.txt"
          grep -Fxq 'SUSFS_CORE_OBJECT_RC=0' \
            "$ARTIFACT_DIR/compile-smoke-exit.txt"
          grep -Fxq 'REBOOT_HOOK_OBJECT_RC=0' \
            "$ARTIFACT_DIR/compile-smoke-exit.txt"

          test -s "$SANDBOX/out-w63/drivers/kernelsu/kernelsu.o"
          test -s "$SANDBOX/out-w63/fs/susfs.o"
          test -s "$SANDBOX/out-w63/kernel/reboot.o"

          grep -Fq \
            'int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,' \
            "$KSU_STAGE/susfs_bridge.c"

          grep -Fq \
            'CMD_SUSFS_SHOW_VERSION' \
            "$KSU_STAGE/susfs_bridge.c"

          grep -Fq \
            'ksu_schedule_susfs_extra_works();' \
            "$KSU_STAGE/core_hook.c"

          grep -Fq \
            'susfs_set_current_proc_umounted();' \
            "$KSU_STAGE/core_hook.c"

          grep -Fq \
            'susfs_start_sdcard_monitor_fn();' \
            "$KSU_STAGE/core_hook.c"

          grep -Fq \
            'ksu_setup_selinux_cred("u:r:su:s0", cred)' \
            "$SANDBOX/fs/susfs.c"

          grep -Fq \
            'synchronize_srcu(&susfs_srcu_open_redirect)' \
            "$SANDBOX/fs/susfs.c"

          grep -Fq \
            '.handle_event = susfs_handle_sdcard_event_5_4' \
            "$SANDBOX/fs/susfs.c"

          ! grep -Fq \
            '.handle_inode_event = susfs_handle_sdcard_inode_event' \
            "$SANDBOX/fs/susfs.c"

          grep -Fq \
            'ret = ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);' \
            "$SANDBOX/kernel/reboot.c"

          cd "$GITHUB_WORKSPACE/kernel-base"
          sha256sum -c "$ARTIFACT_DIR/baseline-manual-hook-files.sha256"

          {
            echo "W63_CONTROL_PLANE_ZYGOTE_COMPILE_SMOKE=PASS"
            echo "LANE=${{ matrix.id }}"
            echo "KSU_VERSION=11872"
            echo "SUSFS_VERSION=2.2.0"
            echo "W62_DIRECT_ABI_REPRODUCED_CLEANLY=YES"
            echo "V095_DOMAIN=u:r:su:s0"
            echo "MODERN_SUSFS_REBOOT_CONTROL_PLANE=PORTED"
            echo "LEGACY_PRCTL_SUSFS_DISPATCHER=NOT_TRANSPLANTED"
            echo "V095_EXISTING_TASK_FIX_SETUID_PATH=REUSED"
            echo "SECOND_COMPETING_SETRESUID_HOOK=NO"
            echo "ISOLATED_UID_FORCE_UMOUNT_RANGE=99000-99999"
            echo "SUSFS_EXTRA_WORK_AFTER_UNMOUNT=YES"
            echo "PROC_UMOUNTED_MARK_AFTER_UNMOUNT=YES"
            echo "SDCARD_MONITOR_BOOT_COMPLETED_CALL=YES"
            echo "OPEN_REDIRECT_SRCU_FIX_PRESERVED=YES"
            echo "FSNOTIFY_5_4_HANDLE_EVENT_ADAPTER=PASS"
            echo "W63_V1_KSU_TARGET_BUG_CORRECTED=YES"
            echo "W63_V2_FSNOTIFY_MATCHER_WHITESPACE_BUG_CORRECTED=YES"
            echo "W63_V3_MISSING_OS_IMPORT_BUG_CORRECTED=YES"
            echo "W63_V4_SELINUX_GENERATED_HEADER_PREREQ_CORRECTED=YES"
            echo "W63_V5_INVALID_DIRECT_FLASK_TARGET_CORRECTED=YES"
            echo "SELINUX_DIRECTORY_PREREQ_BUILD=PASS"
            echo "KSU_DIRECTORY_BUILD=PASS"
            echo "KSU_COMPOSITE_OBJECT_PRESENT=PASS"
            echo "SUSFS_CORE_OBJECT_COMPILE=PASS"
            echo "KERNEL_REBOOT_HOOK_OBJECT_COMPILE=PASS"
            echo "FULL_KERNEL_IMAGE_BUILD=NO"
            echo "VMLINUX_FINAL_LINK=NO"
            echo "BASE_FIVE_MANUAL_HOOK_FILES_CHANGED=NO"
            echo "NEXT_STAGE=INTEGRATE_PROVEN_5_4_SUSFS_KERNEL_HOOK_SET_AND_FULL_LINK"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } | tee "$ARTIFACT_DIR/FINAL-STATUS.txt"

      - name: Export exact staged source patches
        if: always()
        shell: bash
        run: |
          set +e

          SANDBOX="$STAGE_DIR/kernel-smoke"

          if [ -d "$SANDBOX/KernelSU/.git" ]; then
            git -C "$SANDBOX/KernelSU" diff --binary \
              > "$ARTIFACT_DIR/W63-KernelSU-v095-SUSFS220-bridge.patch"
          fi

          if [ -d "$SANDBOX/.git" ]; then
            git -C "$SANDBOX" diff --binary -- \
              kernel/reboot.c \
              fs/Makefile \
              fs/susfs.c \
              include/linux/susfs.h \
              include/linux/susfs_def.h \
              > "$ARTIFACT_DIR/W63-kernel-smoke-overlay.patch"
          fi

          mkdir -p "$ARTIFACT_DIR/source-snapshot"

          if [ -d "$SANDBOX/KernelSU/kernel" ]; then
            cp -a \
              "$SANDBOX/KernelSU/kernel" \
              "$ARTIFACT_DIR/source-snapshot/KernelSU-kernel"
          fi

          for rel in \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h \
            kernel/reboot.c
          do
            if [ -f "$SANDBOX/$rel" ]; then
              mkdir -p \
                "$ARTIFACT_DIR/source-snapshot/$(dirname "$rel")"
              cp "$SANDBOX/$rel" \
                "$ARTIFACT_DIR/source-snapshot/$rel"
            fi
          done

          exit 0

      - name: Finalize failure diagnostics before immutable manifest
        if: always()
        shell: bash
        env:
          PRE_MANIFEST_JOB_STATUS: ${{ job.status }}
        run: |
          set +e

          mkdir -p "$ARTIFACT_DIR"

          if [ ! -f "$ARTIFACT_DIR/FINAL-STATUS.txt" ]; then
            {
              echo "W63_CONTROL_PLANE_ZYGOTE_COMPILE_SMOKE=FAIL_OR_INCOMPLETE"
              echo "LANE=${{ matrix.id }}"
              echo "PRE_MANIFEST_JOB_STATUS=$PRE_MANIFEST_JOB_STATUS"
              echo "COMPILE_STEP_OUTCOME=${{ steps.compile.outcome }}"
              echo "FULL_KERNEL_IMAGE_BUILD=NO"
              echo "VMLINUX_FINAL_LINK=NO"
              echo "BOOT_IMAGE_CREATED=NO"
              echo "FLASHABLE_ZIP_CREATED=NO"
              echo "DEVICE_ACCESSED=NO"
              echo "FLASHING_PERFORMED=NO"
            } > "$ARTIFACT_DIR/FAILURE-STATUS.txt"
          fi

          {
            echo "PRE_MANIFEST_JOB_STATUS=$PRE_MANIFEST_JOB_STATUS"
            echo "UPLOAD_HIDDEN_FILES=YES"
            echo "SHA256SUMS_WILL_BE_FINAL_ARTIFACT_MUTATION=YES"
            echo "NO_ARTIFACT_FILE_MAY_CHANGE_AFTER_MANIFEST=YES"
          } > "$ARTIFACT_DIR/MANIFEST-CONTRACT.txt"

          exit 0

      - name: Create final artifact-relative SHA256 manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ARTIFACT_DIR"
          cd "$ARTIFACT_DIR"

          : > SHA256SUMS.txt

          while IFS= read -r -d '' file; do
            rel="${file#./}"
            [ "$rel" = "SHA256SUMS.txt" ] && continue
            sha256sum "$rel" >> SHA256SUMS.txt
          done < <(find . -type f -print0 | sort -z)

          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload W63 compile-smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W63-v6-v095-SUSFS220-control-plane-zygote-smoke-${{ matrix.id }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Mark compile-smoke failure after artifact preparation
        if: ${{ steps.compile.outcome != 'success' }}
        shell: bash
        run: |
          echo "W63-v6 compile-smoke did not complete successfully."
          exit 1
