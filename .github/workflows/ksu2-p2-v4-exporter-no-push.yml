name: KSU2-P2 v4 direct exporter (no push)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ksu2-p2-v4-direct-exporter-no-push
  cancel-in-progress: false

jobs:
  generate:
    name: Generate path-safe P2-v4 from exact P2-v3
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Authenticate exact P2-v3 workflow
        shell: bash
        run: |
          set -euo pipefail
          SRC=.github/workflows/ksu2-p2-veux-5.4.274-legacy-kernelsu-source-cleanup-compact-checkpoint-v3.yml
          test -s "$SRC"
          ACTUAL_BLOB="$(git hash-object "$SRC")"
          EXPECTED_BLOB=d762fd03bdac52598f0522ea363af3b554e5ca1b
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          echo "P2_V3_WORKFLOW_BLOB_VERIFIED=$ACTUAL_BLOB"

