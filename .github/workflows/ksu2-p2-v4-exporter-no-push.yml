      - name: Validate generated P2-v4
        shell: bash
        run: |
          set -euo pipefail
          DST=.github/workflows/ksu2-p2-veux-5.4.274-legacy-kernelsu-source-cleanup-compact-checkpoint-v4.yml
          test -s "$DST"

          ruby -e 'require "yaml"; YAML.load_file(ARGV[0]); puts "YAML_PARSE=PASS"' "$DST"

          grep -Fq 'Capture P2 build identity before diagnostic gates' "$DST"
          grep -Fq 'ROOT_WARNING_CLASSIFIER=PASS' "$DST"
          grep -Fq 'REPOSITORY_NAME_RESUKISU_FALSE_POSITIVE=REJECTED' "$DST"
          grep -Fq 'EXPECTED_P2_V3_CONFIG_SHA256: f6a4c78bf637bbf89b5e3a3059cf9d1651e43189a6ac459e806fa289d8628f9d' "$DST"
          test "$(grep -Fc 'if: always()' "$DST")" -ge 2
          if grep -Fq "grep -Ei '(kernelsu|KernelSU|ReSukiSU|susfs).*warning:'" "$DST"; then
            echo 'ERROR: unsafe repository-path warning classifier remains'
            exit 1
          fi
          sha256sum "$DST" | tee /tmp/p2v4.sha256

      - name: Prepare generated P2-v4 export
        shell: bash
        run: |
          set -euo pipefail
          DST=.github/workflows/ksu2-p2-veux-5.4.274-legacy-kernelsu-source-cleanup-compact-checkpoint-v4.yml
          test -s "$DST"
          mkdir -p p2v4-export
          cp "$DST" p2v4-export/
          sha256sum "$DST" > p2v4-export/ksu2-p2-v4.sha256
          echo 'P2_V4_GENERATED_AND_VALIDATED=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the artifact and upload the YAML to .github/workflows/.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated P2-v4
        uses: actions/upload-artifact@v4
        with:
          name: ksu2-p2-v4-direct-workflow
          path: p2v4-export/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
