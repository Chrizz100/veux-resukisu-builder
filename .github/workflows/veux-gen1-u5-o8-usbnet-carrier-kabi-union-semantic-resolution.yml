[^\\n]*\\n\",\n        text,\n    )\n    if not m:\n        raise RuntimeError(f\"{rel}: could not parse diff3 hunk\")\n\n    ours = m.group(\"ours\")\n    base = m.group(\"base\")\n    theirs = m.group(\"theirs\")\n\n    expected_ours = (\n        \"\\t/* rx_speed and tx_speed are in bps - NOT Mbps */\\n\"\n        \"\\tANDROID_KABI_USE2(1, u32 rx_speed, u32 tx_speed);\\n\"\n        \"\\n\"\n        \"\\tANDROID_KABI_RESERVE(2);\\n\"\n        \"\\tANDROID_KABI_RESERVE(3);\\n\"\n        \"\\tANDROID_KABI_RESERVE(4);\\n\"\n    )\n    expected_base = (\n        \"\\tu32\\t\\t\\trx_speed;\\t/* in bps - NOT Mbps */\\n\"\n        \"\\tu32\\t\\t\\ttx_speed;\\t/* in bps - NOT Mbps */\\n\"\n    )\n    expected_theirs = (\n        \"#\\t\\tdefine EVENT_LINK_CARRIER_ON\\t14\\n\"\n        \"\\tu32\\t\\t\\trx_speed;\\t/* in bps - NOT Mbps */\\n\"\n        \"\\tu32\\t\\t\\ttx_speed;\\t/* in bps - NOT Mbps */\\n\"\n    )\n\n    if ours != expected_ours:\n        raise RuntimeError(f\"{rel}: unexpected P13 Android-KABI side: {ours!r}\")\n    if base != expected_base:\n        raise RuntimeError(f\"{rel}: unexpected official-5.4.274 side: {base!r}\")\n    if theirs != expected_theirs:\n        raise RuntimeError(f\"{rel}: unexpected official-target carrier-event side: {theirs!r}\")\n\n    resolved_hunk = \"#\\t\\tdefine EVENT_LINK_CARRIER_ON\\t14\\n\" + expected_ours\n    resolved = text[:m.start()] + resolved_hunk + text[m.end():]\n\n    if re.search(r\"(?m)^(<<<<<<< |\\|\\|\\|\\|\\|\\|\\| |=======|>>>>>>> )\", resolved):\n        raise RuntimeError(f\"{rel}: conflict markers remain\")\n    if resolved.count(\"#\\t\\tdefine EVENT_LINK_CARRIER_ON\\t14\\n\") != 1:\n        raise RuntimeError(f\"{rel}: official EVENT_LINK_CARRIER_ON count != 1\")\n    if resolved.count(\"\\tANDROID_KABI_USE2(1, u32 rx_speed, u32 tx_speed);\\n\") != 1:\n        raise RuntimeError(f\"{rel}: P13 Android KABI rx/tx layout count != 1\")\n    for legacy in (\n        \"\\tu32\\t\\t\\trx_speed;\\t/* in bps - NOT Mbps */\\n\",\n        \"\\tu32\\t\\t\\ttx_speed;\\t/* in bps - NOT Mbps */\\n\",\n    ):\n        if legacy in resolved:\n            raise RuntimeError(f\"{rel}: raw legacy speed field survived: {legacy!r}\")\n    for required in (\n        \"#include <linux/android_kabi.h>\\n\",\n        \"#define FLAG_THROTTLE_RX\\t0x10000 /* Throttle RX traffic in USB SS */\\n\",\n    ):\n        if required not in resolved:\n            raise RuntimeError(f\"{rel}: P13 non-conflicting USBNET extension was lost: {required!r}\")\n\n    return resolved.encode()\n\n\ndef safe_write_regular(path, data, mode=None):\n    path.parent.mkdir(parents=True, exist_ok=True)\n    if path.is_symlink():\n        path.unlink()\n    elif path.exists() and path.is_dir():\n        shutil.rmtree(path)\n    path.write_bytes(data)\n    if mode is not None:\n        executable = (int(mode, 8) & 0o111) != 0\n        current = path.stat().st_mode\n        if executable:\n            path.chmod(current | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)\n        else:\n            path.chmod(current & ~(stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH))\n\ndef store_conflict(target_dir, rel, ours, base, theirs, preview=None, meta=None):\n    cdir = target_dir / \"conflicts\" / rel\n    cdir.mkdir(parents=True, exist_ok=True)\n    if ours is not None:\n        (cdir / \"OURS\").write_bytes(ours)\n    if base is not None:\n        (cdir / \"BASE-v5.4.274\").write_bytes(base)\n    if theirs is not None:\n        (cdir / \"THEIRS-target\").write_bytes(theirs)\n    if preview is not None:\n        (cdir / \"MERGE-PREVIEW\").write_bytes(preview)\n    if meta:\n        (cdir / \"META.txt\").write_text(meta)\n\ndef merge_one(version, target_tag, root):\n    out = audit / f\"target-{version}\"\n    out.mkdir(parents=True, exist_ok=True)\n\n    diff = run([\n        \"git\",\"-C\",str(stable),\"diff\",\"--no-renames\",\"--name-status\",\"-z\",\n        base_tag,target_tag\n    ]).stdout.split(b\"\\x00\")\n    diff = [x for x in diff if x]\n\n    if len(diff) % 2 != 0:\n        raise RuntimeError(f\"unexpected name-status token count for {target_tag}: {len(diff)}\")\n\n    entries = []\n    for i in range(0, len(diff), 2):\n        status_code = diff[i].decode(errors=\"replace\")\n        path = diff[i+1].decode(errors=\"surrogateescape\")\n        entries.append((status_code, path))\n\n    counts = collections.Counter()\n    runtime_conflicts = []\n    skipped_nonruntime = []\n    rows = []\n    merge_conflict_hunks = 0\n    semantic_resolutions = []\n\n    for status_code, rel in entries:\n        base_entry = tree_entry(base_tag, rel)\n        target_entry = tree_entry(target_tag, rel)\n        p = root / rel\n\n        # Documentation is not part of the runtime Image and vendor trees often\n        # contain symlink layouts that intentionally differ from upstream.\n        if rel.startswith(\"Documentation/\"):\n            cls = \"NON_RUNTIME_DOCUMENTATION_SKIPPED\"\n            counts[cls] += 1\n            skipped_nonruntime.append(rel)\n            rows.append([status_code, rel, cls, \"\", \"\", \"\"])\n            continue\n\n        if has_symlink_parent(root, rel):\n            cls = \"SYMLINK_PARENT_CONFLICT\"\n            counts[cls] += 1\n            runtime_conflicts.append(rel)\n            store_conflict(\n                out, rel, None,\n                git_show(base_tag, rel) if base_entry else None,\n                git_show(target_tag, rel) if target_entry else None,\n                meta=\"A parent component is a symlink in the P13 worktree.\\n\"\n            )\n            rows.append([status_code, rel, cls, \"\", \"\", \"\"])\n            continue\n\n        base_data = git_show(base_tag, rel) if base_entry else None\n        target_data = git_show(target_tag, rel) if target_entry else None\n        ours_exists = lexists(p)\n        ours_data = ours_bytes(root, rel) if ours_exists and not p.is_dir() else None\n\n        # Upstream addition.\n        if base_entry is None and target_entry is not None:\n            if not ours_exists:\n                if target_entry[0] == \"120000\":\n                    p.parent.mkdir(parents=True, exist_ok=True)\n                    os.symlink(target_data.decode(), p)\n                elif target_entry[1] == \"blob\":\n                    safe_write_regular(p, target_data, target_entry[0])\n                else:\n                    raise RuntimeError(f\"unsupported target type for add: {rel} {target_entry}\")\n                cls = \"UPSTREAM_ADD\"\n            elif ours_data == target_data:\n                cls = \"ALREADY_TARGET\"\n            else:\n                cls = \"ADD_COLLISION_CONFLICT\"\n                runtime_conflicts.append(rel)\n                store_conflict(\n                    out, rel, ours_data, None, target_data,\n                    meta=\"Official target adds a path that already exists differently in P13.\\n\"\n                )\n            counts[cls] += 1\n            rows.append([status_code, rel, cls,\n                         hashlib.sha256(ours_data).hexdigest() if ours_data is not None else \"\",\n                         \"\", target_entry[2]])\n            continue\n\n        # Upstream deletion.\n        if base_entry is not None and target_entry is None:\n            if not ours_exists:\n                cls = \"ALREADY_DELETED\"\n            elif ours_data == base_data:\n                if p.is_symlink() or p.is_file():\n                    p.unlink()\n                elif p.is_dir():\n                    shutil.rmtree(p)\n                cls = \"UPSTREAM_DELETE\"\n            else:\n                cls = \"DELETE_MODIFIED_CONFLICT\"\n                runtime_conflicts.append(rel)\n                store_conflict(\n                    out, rel, ours_data, base_data, None,\n                    meta=\"Official target deletes a path that P13 modified.\\n\"\n                )\n            counts[cls] += 1\n            rows.append([status_code, rel, cls,\n                         hashlib.sha256(ours_data).hexdigest() if ours_data is not None else \"\",\n                         base_entry[2], \"\"])\n            continue\n\n        # Modify/mode-change cases.\n        if base_entry is None or target_entry is None:\n            raise RuntimeError(f\"unhandled tree state for {rel}\")\n\n        if not ours_exists:\n            cls = \"OURS_MISSING_CONFLICT\"\n            counts[cls] += 1\n            runtime_conflicts.append(rel)\n            store_conflict(\n                out, rel, None, base_data, target_data,\n                meta=\"Path exists in official base/target but is absent from P13.\\n\"\n            )\n            rows.append([status_code, rel, cls, \"\", base_entry[2], target_entry[2]])\n            continue\n\n        if ours_data == base_data:\n            if target_entry[0] == \"120000\":\n                if p.exists() or p.is_symlink():\n                    p.unlink()\n                p.parent.mkdir(parents=True, exist_ok=True)\n                os.symlink(target_data.decode(), p)\n            else:\n                safe_write_regular(p, target_data, target_entry[0])\n            cls = \"TAKE_STABLE_EXACT\"\n        elif ours_data == target_data:\n            cls = \"ALREADY_TARGET\"\n        else:\n            # Symlink/binary conflicts are deliberately not guessed.\n            if p.is_symlink() or base_entry[0] == \"120000\" or target_entry[0] == \"120000\":\n                cls = \"SYMLINK_CONFLICT\"\n                runtime_conflicts.append(rel)\n                store_conflict(\n                    out, rel, ours_data, base_data, target_data,\n                    meta=\"Diverged symlink path requires manual semantic resolution.\\n\"\n                )\n            elif is_binary(ours_data) or is_binary(base_data) or is_binary(target_data):\n                cls = \"BINARY_CONFLICT\"\n                runtime_conflicts.append(rel)\n                store_conflict(\n                    out, rel, ours_data, base_data, target_data,\n                    meta=\"Diverged binary path requires manual semantic resolution.\\n\"\n                )\n            else:\n                tmp = out / \".merge-tmp\"\n                tmp.mkdir(exist_ok=True)\n                ours_f = tmp / \"ours\"\n                base_f = tmp / \"base\"\n                theirs_f = tmp / \"theirs\"\n                ours_f.write_bytes(ours_data)\n                base_f.write_bytes(base_data)\n                theirs_f.write_bytes(target_data)\n\n                mp = run(\n                    [\"git\",\"merge-file\",\"-p\",\"--diff3\",\n                     str(ours_f),str(base_f),str(theirs_f)],\n                    check=False\n                )\n                preview = mp.stdout\n                try:\n                    if mp.returncode == 0:\n                        safe_write_regular(p, preview, target_entry[0])\n                        cls = \"THREE_WAY_MERGE_CLEAN\"\n                    elif 1 <= mp.returncode <= 127:\n                        if rel == \"Makefile\":\n                            resolved = resolve_makefile_conflict(preview, version)\n                            safe_write_regular(p, resolved, target_entry[0])\n                            cls = \"MAKEFILE_SEMANTIC_RESOLUTION\"\n                            semantic_resolutions.append(rel)\n                            (out / \"Makefile-semantic-resolution.txt\").write_text(\n                                \"PATH=Makefile\\n\"\n                                f\"TARGET={version}\\n\"\n                                f\"MERGE_FILE_CONFLICT_HUNKS={mp.returncode}\\n\"\n                                \"RESOLUTION=OFFICIAL_TARGET_BLOCK_PLUS_P13_UNDEFINED_OPTIMIZED\\n\"\n                                \"PRESERVE=KERNEL_SUPPORTS_NESTED_COMPOSITES\\n\"\n                                \"PRESERVE=-mno-global-merge\\n\"\n                                \"PRESERVE=undefined-optimized\\n\"\n                                \"PRESERVE=default-const-init-unsafe\\n\"\n                            )\n                        elif rel in (\"drivers/platform/Kconfig\", \"drivers/platform/Makefile\"):\n                            resolved = resolve_platform_registration_conflict(preview, rel)\n                            safe_write_regular(p, resolved, target_entry[0])\n                            cls = \"PLATFORM_REGISTRATION_SEMANTIC_RESOLUTION\"\n                            semantic_resolutions.append(rel)\n                            evidence = out / \"platform-registration-semantic-resolution.txt\"\n                            with evidence.open(\"a\") as ef:\n                                ef.write(\n                                    f\"PATH={rel}\\n\"\n                                    f\"TARGET={version}\\n\"\n                                    f\"MERGE_FILE_CONFLICT_HUNKS={mp.returncode}\\n\"\n                                    \"RESOLUTION=UNION_P13_MSM_PLUS_OFFICIAL_SURFACE\\n\"\n                                )\n                        elif rel == \"drivers/hid/hid-ids.h\":\n                            resolved = resolve_hid_ids_conflict(preview, version)\n                            safe_write_regular(p, resolved, target_entry[0])\n                            cls = \"HID_IDS_SEMANTIC_RESOLUTION\"\n                            semantic_resolutions.append(rel)\n                            (out / \"hid-ids-semantic-resolution.txt\").write_text(\n                                \"PATH=drivers/hid/hid-ids.h\\n\"\n                                f\"TARGET={version}\\n\"\n                                f\"MERGE_FILE_CONFLICT_HUNKS={mp.returncode}\\n\"\n                                \"RESOLUTION=UNION_P13_DEVICE_IDS_PLUS_OFFICIAL_TARGET_IDS\\n\"\n                            )\n                        elif rel == \"include/linux/pid.h\":\n                            resolved = resolve_pidfd_declaration_conflict(preview)\n                            safe_write_regular(p, resolved, target_entry[0])\n                            cls = \"PIDFD_DECLARATION_SEMANTIC_RESOLUTION\"\n                            semantic_resolutions.append(rel)\n                            (out / \"pidfd-declaration-semantic-resolution.txt\").write_text(\n                                \"PATH=include/linux/pid.h\\n\"\n                                f\"TARGET={version}\\n\"\n                                f\"MERGE_FILE_CONFLICT_HUNKS={mp.returncode}\\n\"\n                                \"RESOLUTION=UNION_P13_PIDFD_GET_PID_PLUS_OFFICIAL_PIDFD_PREPARE\\n\"\n                            )\n                        elif rel == \"drivers/net/caif/Kconfig\":\n                            resolved = resolve_caif_hsi_conflict(preview)\n                            safe_write_regular(p, resolved, target_entry[0])\n                            cls = \"CAIF_HSI_SEMANTIC_RESOLUTION\"\n                            semantic_resolutions.append(rel)\n                            (out / \"caif-hsi-semantic-resolution.txt\").write_text(\n                                \"PATH=drivers/net/caif/Kconfig\\n\"\n                                f\"TARGET={version}\\n\"\n                                f\"MERGE_FILE_CONFLICT_HUNKS={mp.returncode}\\n\"\n                                \"RESOLUTION=OFFICIAL_TARGET_CAIF_HSI_BLOCK_WITH_P13_BOOL\\n\"\n                                \"PRESERVE=P13_CAIF_HSI_BOOL\\n\"\n                                \"PRESERVE=OFFICIAL_TARGET_HELP_AND_FORMATTING\\n\"\n                            )\n                        elif rel == \"include/linux/usb/usbnet.h\":\n                            resolved = resolve_usbnet_carrier_kabi_conflict(preview)\n                            safe_write_regular(p, resolved, target_entry[0])\n                            cls = \"USBNET_CARRIER_KABI_SEMANTIC_RESOLUTION\"\n                            semantic_resolutions.append(rel)\n                            (out / \"usbnet-carrier-kabi-semantic-resolution.txt\").write_text(\n                                \"PATH=include/linux/usb/usbnet.h\\n\"\n                                f\"TARGET={version}\\n\"\n                                f\"MERGE_FILE_CONFLICT_HUNKS={mp.returncode}\\n\"\n                                \"RESOLUTION=UNION_OFFICIAL_EVENT_LINK_CARRIER_ON_PLUS_P13_ANDROID_KABI_LAYOUT\\n\"\n                                \"PRESERVE=OFFICIAL_EVENT_LINK_CARRIER_ON\\n\"\n                                \"PRESERVE=P13_ANDROID_KABI_RX_TX_LAYOUT\\n\"\n                            )\n                        else:\n                            cls = \"TEXT_CONFLICT\"\n                            runtime_conflicts.append(rel)\n                            merge_conflict_hunks += mp.returncode\n                            store_conflict(\n                                out, rel, ours_data, base_data, target_data, preview,\n                                meta=(\n                                    \"git merge-file --diff3 reported overlapping text conflicts.\\n\"\n                                    f\"MERGE_CONFLICT_HUNKS={mp.returncode}\\n\"\n                                )\n                            )\n                    else:\n                        raise RuntimeError(\n                            f\"merge-file execution error for {rel}: rc={mp.returncode} \"\n                            + mp.stderr.decode(errors=\"replace\")\n                        )\n                finally:\n                    for x in (ours_f, base_f, theirs_f):\n                        x.unlink(missing_ok=True)\n\n        counts[cls] += 1\n        rows.append([\n            status_code, rel, cls,\n            hashlib.sha256(ours_data).hexdigest() if ours_data is not None else \"\",\n            base_entry[2], target_entry[2]\n        ])\n\n    # Stage the auto-merged candidate only to produce a complete binary diff.\n    run([\"git\",\"add\",\"-A\"], cwd=root)\n    patch = run(\n        [\"git\",\"diff\",\"--cached\",\"--binary\",\"--full-index\",snapshot],\n        cwd=root\n    ).stdout\n    (out / f\"P13-to-{version}-AUTO-MERGED-PARTIAL.patch\").write_bytes(patch)\n\n    names = run(\n        [\"git\",\"diff\",\"--cached\",\"--name-status\",snapshot],\n        cwd=root\n    ).stdout\n    (out / \"auto-merged-name-status.tsv\").write_bytes(names)\n\n    # Candidate identity is informative only; no build is performed here.\n    kv = run([\"make\",\"-s\",\"kernelversion\"], cwd=root, check=False)\n    kernelversion = kv.stdout.decode(errors=\"replace\").strip() if kv.returncode == 0 else \"MAKE_KERNELVERSION_FAILED\"\n\n    with (out / \"path-classification.tsv\").open(\"w\", newline=\"\") as f:\n        w = csv.writer(f, delimiter=\"\\t\")\n        w.writerow([\"status\",\"path\",\"classification\",\"p13_sha256\",\"base_blob\",\"target_blob\"])\n        w.writerows(rows)\n\n    (out / \"runtime-conflicts.txt\").write_text(\n        \"\".join(f\"{x}\\n\" for x in sorted(runtime_conflicts))\n    )\n    (out / \"nonruntime-documentation-skipped.txt\").write_text(\n        \"\".join(f\"{x}\\n\" for x in sorted(skipped_nonruntime))\n    )\n    shutil.rmtree(out / \".merge-tmp\", ignore_errors=True)\n\n    ready = (len(runtime_conflicts) == 0 and kernelversion == version)\n    with (out / \"RESULT.txt\").open(\"w\") as f:\n        f.write(f\"TARGET={version}\\n\")\n        f.write(f\"OFFICIAL_TARGET_TAG={target_tag}\\n\")\n        f.write(f\"CHANGED_PATHS_TOTAL={len(entries)}\\n\")\n        for key in sorted(counts):\n            f.write(f\"{key}={counts[key]}\\n\")\n        f.write(f\"RUNTIME_CONFLICTS={len(runtime_conflicts)}\\n\")\n        f.write(f\"TEXT_CONFLICT_HUNKS={merge_conflict_hunks}\\n\")\n        f.write(f\"SEMANTIC_RESOLUTIONS={len(semantic_resolutions)}\\n\")\n        f.write(f\"MAKEFILE_SEMANTIC_RESOLUTION={'YES' if 'Makefile' in semantic_resolutions else 'NO'}\\n\")\n        platform_pair = {'drivers/platform/Kconfig', 'drivers/platform/Makefile'}\n        f.write(\n            f\"PLATFORM_REGISTRATION_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if platform_pair.issubset(set(semantic_resolutions)) else 'NO'}\\n\"\n        )\n        f.write(\n            f\"HID_IDS_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'drivers/hid/hid-ids.h' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"PIDFD_DECLARATION_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'include/linux/pid.h' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"CAIF_HSI_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'drivers/net/caif/Kconfig' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(\n            f\"USBNET_CARRIER_KABI_SEMANTIC_RESOLUTION=\"\n            f\"{'YES' if 'include/linux/usb/usbnet.h' in semantic_resolutions else 'NO'}\\n\"\n        )\n        f.write(f\"NON_RUNTIME_DOCUMENTATION_SKIPPED={len(skipped_nonruntime)}\\n\")\n        f.write(f\"CANDIDATE_KERNELVERSION={kernelversion}\\n\")\n        f.write(f\"READY_FOR_BUILD_AUDIT={'YES' if ready else 'NO'}\\n\")\n        f.write(\"KERNEL_BUILD_PERFORMED=NO\\n\")\n        f.write(\"DEVICE_PASS=NO\\n\")\n\n    return {\n        \"target\": version,\n        \"changed\": len(entries),\n        \"conflicts\": len(runtime_conflicts),\n        \"docs_skipped\": len(skipped_nonruntime),\n        \"kernelversion\": kernelversion,\n        \"ready\": ready,\n        \"counts\": counts,\n        \"error\": False,\n        \"text_conflict_hunks\": merge_conflict_hunks,\n    }\n\ndef safe_merge_one(version, target_tag, root):\n    try:\n        return merge_one(version, target_tag, root)\n    except Exception:\n        out = audit / f\"target-{version}\"\n        out.mkdir(parents=True, exist_ok=True)\n        err = traceback.format_exc()\n        (out / \"ENGINE-ERROR.txt\").write_text(err)\n        shutil.rmtree(out / \".merge-tmp\", ignore_errors=True)\n        with (out / \"RESULT.txt\").open(\"w\") as f:\n            f.write(f\"TARGET={version}\\n\")\n            f.write(f\"OFFICIAL_TARGET_TAG={target_tag}\\n\")\n            f.write(\"ENGINE_ERROR=YES\\n\")\n            f.write(\"RUNTIME_CONFLICTS=UNKNOWN\\n\")\n            f.write(\"CANDIDATE_KERNELVERSION=UNKNOWN\\n\")\n            f.write(\"READY_FOR_BUILD_AUDIT=NO\\n\")\n            f.write(\"KERNEL_BUILD_PERFORMED=NO\\n\")\n            f.write(\"DEVICE_PASS=NO\\n\")\n        return {\n            \"target\": version,\n            \"changed\": \"UNKNOWN\",\n            \"conflicts\": \"UNKNOWN\",\n            \"docs_skipped\": \"UNKNOWN\",\n            \"kernelversion\": \"UNKNOWN\",\n            \"ready\": False,\n            \"counts\": collections.Counter(),\n            \"error\": True,\n            \"text_conflict_hunks\": \"UNKNOWN\",\n        }\n\nresults = [safe_merge_one(*t) for t in targets]\n\nwith (audit / \"20-U5-O2-SUMMARY.tsv\").open(\"w\", newline=\"\") as f:\n    w = csv.writer(f, delimiter=\"\\t\")\n    w.writerow([\n        \"target\",\"changed_paths\",\"runtime_conflicts\",\"text_conflict_hunks\",\n        \"documentation_skipped\",\"candidate_kernelversion\",\"ready_for_build_audit\",\"engine_error\"\n    ])\n    for r in results:\n        w.writerow([\n            r[\"target\"],r[\"changed\"],r[\"conflicts\"],r[\"text_conflict_hunks\"],\n            r[\"docs_skipped\"],r[\"kernelversion\"],\"YES\" if r[\"ready\"] else \"NO\",\n            \"YES\" if r[\"error\"] else \"NO\"\n        ])\n\ninfra_pass = all(not r[\"error\"] for r in results)\nwith (audit / \"20-U5-O2-RESULT.txt\").open(\"w\") as f:\n    f.write(f\"U5_O2_INFRASTRUCTURE={'PASS' if infra_pass else 'FAIL'}\\n\")\n    f.write(\"MERGE_MODEL=OFFICIAL_274__P13_VEUX__OFFICIAL_TARGET\\n\")\n    f.write(\"POSITRON_TARGET=EXCLUDED\\n\")\n    f.write(\"NEBULA_TARGET=EXCLUDED\\n\")\n    f.write(\"ROM_CUSTOM_TARGETS=EXCLUDED\\n\")\n    for r in results:\n        key=r[\"target\"].replace(\".\",\"_\")\n        f.write(f\"TARGET_{key}_RUNTIME_CONFLICTS={r['conflicts']}\\n\")\n        f.write(f\"TARGET_{key}_CANDIDATE_KERNELVERSION={r['kernelversion']}\\n\")\n        f.write(f\"TARGET_{key}_READY_FOR_BUILD_AUDIT={'YES' if r['ready'] else 'NO'}\\n\")\n    f.write(\"KERNEL_BUILD_PERFORMED=NO\\n\")\n    f.write(\"FLASH_PACKAGE_CREATED=NO\\n\")\n    f.write(\"DEVICE_PASS=NO\\n\")\n    f.write(\"ARTIFACT_POLICY=ONE_SINGLE_FINAL_ARTIFACT\\n\")\n\nPY\npython3 -m py_compile \"$RUNNER_TEMP/u5o2_merge.py\"\n"
    - name: Run P13 versus official stable three-way ports
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/u5o2_merge.py"

        cat "$AUDIT_DIR/20-U5-O2-SUMMARY.tsv"

        cat "$AUDIT_DIR/20-U5-O2-RESULT.txt"

        '
    - name: Finalize one complete U5-O8 evidence bundle
      if: always()
      shell: bash
      run: "set +e\nmkdir -p \"$AUDIT_DIR\"\n\nif [ ! -f \"$AUDIT_DIR/20-U5-O2-RESULT.txt\" ]; then\n  cat > \"$AUDIT_DIR/99-INCOMPLETE.txt\" <<EOF\nU5_O2_INFRASTRUCTURE=FAIL_OR_INCOMPLETE\nKERNEL_BUILD_PERFORMED=NO\nFLASH_PACKAGE_CREATED=NO\nDEVICE_PASS=NO\nARTIFACT_POLICY=ONE_SINGLE_FINAL_ARTIFACT\nEOF\nfi\n\n{\n  echo \"WORKFLOW=U5-O8\"\n  echo \"RUN_ID=$GITHUB_RUN_ID\"\n  echo \"RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT\"\n  echo \"FILE_COUNT=$(find \"$AUDIT_DIR\" -type f | wc -l)\"\n  echo \"FINAL_RESULT_PRESENT=$([ -f \"$AUDIT_DIR/20-U5-O2-RESULT.txt\" ] && echo YES || echo NO)\"\n  echo \"TARGET300_RESULT_PRESENT=$([ -f \"$AUDIT_DIR/target-5.4.300/RESULT.txt\" ] && echo YES || echo NO)\"\n  echo \"TARGET302_RESULT_PRESENT=$([ -f \"$AUDIT_DIR/target-5.4.302/RESULT.txt\" ] && echo YES || echo NO)\"\n} > \"$AUDIT_DIR/99-DIAGNOSTIC.txt\"\n\nfind \"$AUDIT_DIR\" -type f -printf '%P\\n' | LC_ALL=C sort \\\n  > \"$AUDIT_DIR/99-FILE-LIST.txt\"\n\n(\n  cd \"$AUDIT_DIR\"\n  find . -type f ! -name SHA256SUMS.txt -print0 \\\n    | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt\n  sha256sum -c SHA256SUMS.txt\n)\n"
    - name: Upload one complete U5-O8 artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: VEUX-GEN1-U5-O8-usbnet-carrier-kabi-union-official-stable-5.4.300-5.4.302-port-audit
        path: u5o2-evidence/
        if-no-files-found: error
        retention-days: 30
        compression-level: 6
    - name: Assert U5-O8 infrastructure gates
      shell: bash
      run: |
        set -euo pipefail

        test -f "$AUDIT_DIR/20-U5-O2-RESULT.txt"
        grep -Fxq 'U5_O2_INFRASTRUCTURE=PASS' "$AUDIT_DIR/20-U5-O2-RESULT.txt"
        grep -Fxq 'MERGE_MODEL=OFFICIAL_274__P13_VEUX__OFFICIAL_TARGET' "$AUDIT_DIR/20-U5-O2-RESULT.txt"
        grep -Fxq 'POSITRON_TARGET=EXCLUDED' "$AUDIT_DIR/20-U5-O2-RESULT.txt"
        grep -Fxq 'NEBULA_TARGET=EXCLUDED' "$AUDIT_DIR/20-U5-O2-RESULT.txt"
        grep -Fxq 'ROM_CUSTOM_TARGETS=EXCLUDED' "$AUDIT_DIR/20-U5-O2-RESULT.txt"
        grep -Fxq 'ARTIFACT_POLICY=ONE_SINGLE_FINAL_ARTIFACT' "$AUDIT_DIR/20-U5-O2-RESULT.txt"
        grep -Fxq 'KERNEL_BUILD_PERFORMED=NO' "$AUDIT_DIR/20-U5-O2-RESULT.txt"
        grep -Fxq 'FLASH_PACKAGE_CREATED=NO' "$AUDIT_DIR/20-U5-O2-RESULT.txt"
        grep -Fxq 'DEVICE_PASS=NO' "$AUDIT_DIR/20-U5-O2-RESULT.txt"

        test -f "$AUDIT_DIR/target-5.4.300/RESULT.txt"
        test -f "$AUDIT_DIR/target-5.4.302/RESULT.txt"
        test ! -f "$AUDIT_DIR/target-5.4.300/ENGINE-ERROR.txt"
        test ! -f "$AUDIT_DIR/target-5.4.302/ENGINE-ERROR.txt"

        # Retained O3/O4/O5/O6/O7 resolvers plus exactly one new O8 USBNET resolver.
        for ver in 5.4.300 5.4.302; do
          result="$AUDIT_DIR/target-$ver/RESULT.txt"
          grep -Fxq 'MAKEFILE_SEMANTIC_RESOLUTION=YES' "$result"
          grep -Fxq 'PLATFORM_REGISTRATION_SEMANTIC_RESOLUTION=YES' "$result"
          grep -Fxq 'HID_IDS_SEMANTIC_RESOLUTION=YES' "$result"
          grep -Fxq 'PIDFD_DECLARATION_SEMANTIC_RESOLUTION=YES' "$result"
          grep -Fxq 'CAIF_HSI_SEMANTIC_RESOLUTION=YES' "$result"
          grep -Fxq 'USBNET_CARRIER_KABI_SEMANTIC_RESOLUTION=YES' "$result"
          grep -Fxq 'SEMANTIC_RESOLUTIONS=7' "$result"
          grep -Fxq 'MAKEFILE_SEMANTIC_RESOLUTION=1' "$result"
          grep -Fxq 'PLATFORM_REGISTRATION_SEMANTIC_RESOLUTION=2' "$result"
          grep -Fxq 'HID_IDS_SEMANTIC_RESOLUTION=1' "$result"
          grep -Fxq 'PIDFD_DECLARATION_SEMANTIC_RESOLUTION=1' "$result"
          grep -Fxq 'CAIF_HSI_SEMANTIC_RESOLUTION=1' "$result"
          grep -Fxq 'USBNET_CARRIER_KABI_SEMANTIC_RESOLUTION=1' "$result"
          grep -Fxq 'READY_FOR_BUILD_AUDIT=NO' "$result"
          grep -Fxq 'KERNEL_BUILD_PERFORMED=NO' "$result"
          grep -Fxq 'DEVICE_PASS=NO' "$result"

          evidence="$AUDIT_DIR/target-$ver/usbnet-carrier-kabi-semantic-resolution.txt"
          test -f "$evidence"
          grep -Fxq 'PATH=include/linux/usb/usbnet.h' "$evidence"
          grep -Fxq "TARGET=$ver" "$evidence"
          grep -Fxq 'MERGE_FILE_CONFLICT_HUNKS=1' "$evidence"
          grep -Fxq 'RESOLUTION=UNION_OFFICIAL_EVENT_LINK_CARRIER_ON_PLUS_P13_ANDROID_KABI_LAYOUT' "$evidence"
          grep -Fxq 'PRESERVE=OFFICIAL_EVENT_LINK_CARRIER_ON' "$evidence"
          grep -Fxq 'PRESERVE=P13_ANDROID_KABI_RX_TX_LAYOUT' "$evidence"

          test ! -d "$AUDIT_DIR/target-$ver/conflicts/include/linux/usb/usbnet.h"
          awk -F '\t' '$2=="include/linux/usb/usbnet.h" && $3=="USBNET_CARRIER_KABI_SEMANTIC_RESOLUTION"{found=1} END{exit !found}' \
            "$AUDIT_DIR/target-$ver/path-classification.tsv"

        done

        # Current O8 end-state only.
        grep -Fxq 'CANDIDATE_KERNELVERSION=5.4.300' "$AUDIT_DIR/target-5.4.300/RESULT.txt"
        grep -Fxq 'CANDIDATE_KERNELVERSION=5.4.302' "$AUDIT_DIR/target-5.4.302/RESULT.txt"
        grep -Fxq 'RUNTIME_CONFLICTS=31' "$AUDIT_DIR/target-5.4.300/RESULT.txt"
        grep -Fxq 'RUNTIME_CONFLICTS=37' "$AUDIT_DIR/target-5.4.302/RESULT.txt"
        grep -Fxq 'TEXT_CONFLICT_HUNKS=55' "$AUDIT_DIR/target-5.4.300/RESULT.txt"
        grep -Fxq 'TEXT_CONFLICT_HUNKS=66' "$AUDIT_DIR/target-5.4.302/RESULT.txt"

        # Retained O7 CAIF evidence remains present and unchanged in meaning.
        for ver in 5.4.300 5.4.302; do
          evidence="$AUDIT_DIR/target-$ver/caif-hsi-semantic-resolution.txt"
          test -f "$evidence"
          grep -Fxq 'PATH=drivers/net/caif/Kconfig' "$evidence"
          grep -Fxq 'MERGE_FILE_CONFLICT_HUNKS=1' "$evidence"
          grep -Fxq 'RESOLUTION=OFFICIAL_TARGET_CAIF_HSI_BLOCK_WITH_P13_BOOL' "$evidence"
        done
