name: VEUX GEN1 U5-O8 USBNET Carrier/KABI Union Semantic Resolution for Official Stable 5.4.300/5.4.302
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: veux-gen1-u5-o8-usbnet-carrier-kabi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ARCH: arm64
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      EXPECTED_VENDOR_KERNEL_VERSION: 5.4.268
      EXPECTED_OUTER_TREE: 19b68131d7a3955085f60c4fb8cf64442427af0c
      RESTORE_ARTIFACT_ID: '9989363798'
      RESTORE_ARTIFACT_NAME: clean-gen1-p6v11-v6-full-susfs-outer-integration-p7-test-boot-34031837372
      EXPECTED_P5I_COMMIT: f353a9475e40ca866d570c1d0ef55e24cf6556e4
      EXPECTED_P5I_TREE: a947c1f2891c796a08373fc755e29b23139dc761
      EXPECTED_RESUKISU_BASE_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_RESUKISU_BASE_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
      RESUKISU_COMMON_BASE: faccf4c5edc7be37776216e7d43dd3dca0239331
      RESUKISU_TARGET: 7741f87849f7ad7cebf82bbb4c5b89880e61e37e
      RESUKISU_EXCLUDED_MODULE_FILTER: b2ac2fc8703ce9f5226e2a38a59f8b72f8a3005c
      P13_KSU_VERSION: '35141'
      P13_KSU_UAPI: '4'
      P13_TARGET_TAG: v4.2.0-rc1
      P13_TARGET_SHORT: 7741f878
      EXPECTED_IMPORT_PATCH_SHA256: 902e427888714266d9771908cd593191a478cd32ae7a895c77b76c976939c76f
      EXPECTED_P13_PATCH_SHA256: d56725a9d6a6dc7bf1e73a5763b894bdabb544119f4c75df5f437ccd4ff29a52
      EXPECTED_P12_EXEC_SHA256: fa3b73421f35d6220fb9e03e112a9509b76c04933af2353c9a8c65d6fb6bd6a9
      EXPECTED_P12_CONTRACT_SHA256: b6d1875f6a79231465bc78df6484f2856a427259998eb93ba9fd2597cb45ca53
      EXPECTED_P12_SUSFS_C_SHA256: e430d573ba5875a55d1ca70ba1b304e4b6727bbc42b8c3ac16f2c175b29a59c1
      EXPECTED_P12_SUSFS_H_SHA256: 3c5fb1bcc28a70c82ee5cfe0a7375bb8e7babd26618ce9b451e598fa31aa3b6e
      EXPECTED_P12_SUSFS_DEF_SHA256: b16108a5fcd4cdd7203d9f084c2154da708ab3ae6bed17109e4ec63f04ff0f68
      OUT_DIR: ${{ github.workspace }}/kernel/out-p13
      BACKUP_DIR: ${{ github.workspace }}/u5o2-restore
      AUDIT_DIR: ${{ github.workspace }}/u5o2-evidence
      STABLE_DIR: ${{ github.workspace }}/linux-stable-official
      GH_TOKEN: ${{ github.token }}
      LINUX_STABLE_REPO: https://github.com/gregkh/linux.git
      STABLE_TAGOBJ_274: 427e4044cacd901e4b6a2cfc088c6db812559b57
      STABLE_COMMIT_274: 0dbd436fb9908fbb442cb4c6e28044a891360229
      STABLE_TAGOBJ_300: a169431f26a8b4ae3e22cfb9aa396c71bdd3b37c
      STABLE_COMMIT_300: 86b57fd7c54e976bdcee78ead678932821a68e2d
      STABLE_TAGOBJ_302: 8ffcca9e0f269ee86a682eaae7e49c5efae79fe9
      STABLE_COMMIT_302: 9e3157c56ec7917e6a80ea53a8bd752e0037f2cb
      PORT300_DIR: ${{ github.workspace }}/u5o2-port-300
      PORT302_DIR: ${{ github.workspace }}/u5o2-port-302
      U5_AUDIT_GIT_NAME: VEUX U5 Audit
      U5_AUDIT_GIT_EMAIL: veux-u5-audit@invalid.local
    steps:
    - name: Initialize U5-O8 single-artifact USBNET carrier/KABI union semantic port audit
      shell: bash
      run: "set -euo pipefail\nrm -rf \"$AUDIT_DIR\" \"$BACKUP_DIR\" \"$STABLE_DIR\" \"$PORT300_DIR\" \"$PORT302_DIR\"\nmkdir -p \"$AUDIT_DIR\" \"$BACKUP_DIR\"\n\ncat > \"$AUDIT_DIR/00-PLAN.txt\" <<'EOF'\nU5-O8 USBNET-CARRIER-KABI-UNION VEUX STABLE PORT AUDIT\n\nBase:\n  official Linux-stable v5.4.274\nOurs:\n  frozen P13 VEUX 5.4.274 source\nTargets:\n  official Linux-stable v5.4.300\n  official Linux-stable v5.4.302\n\nRules:\n- Positron/Nebula/ROM-custom target sources are not used.\n- No giant patch is forced.\n- Each changed path is merged as BASE / OURS / THEIRS.\n- U5-O3 top-level Makefile resolution remains unchanged.\n- U5-O4 drivers/platform registration resolution remains unchanged.\n- U5-O5 drivers/hid/hid-ids.h resolution remains unchanged.\n- U5-O6 include/linux/pid.h declaration-union resolution remains unchanged.\n- U5-O7 drivers/net/caif/Kconfig CAIF_HSI resolution remains unchanged.\n- U5-O8 adds exactly one new source resolver: include/linux/usb/usbnet.h.\n- The official EVENT_LINK_CARRIER_ON bit is added while P13's Android KABI rx_speed/tx_speed layout is preserved.\n- P13==BASE paths take the official target exactly.\n- P13-diverged text paths use a real 3-way merge.\n- Real overlapping conflicts are preserved as OURS/BASE/THEIRS evidence.\n- Documentation-only changes may be skipped from the runtime candidate and are reported.\n- No kernel is built or flashed in U5-O8.\n- Exactly one final GitHub artifact contains all evidence for both targets.\nEOF\n\n{\n  echo \"WORKSPACE_INIT=PASS\"\n  echo \"RUN_ID=$GITHUB_RUN_ID\"\n  echo \"RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT\"\n  echo \"ARTIFACT_POLICY=ONE_SINGLE_FINAL_ARTIFACT\"\n} > \"$AUDIT_DIR/00-workspace.txt\"\n"
    - name: Install audit dependencies
      shell: bash
      run: "set -euo pipefail\nsudo apt-get update\nsudo apt-get install -y --no-install-recommends \\\n  bc bison build-essential ca-certificates curl flex git git-lfs jq \\\n  libelf-dev libncurses-dev libssl-dev patch python3 rsync \\\n  unzip zip xz-utils zstd\ngit lfs install --skip-repo\n"
    - name: Checkout exact VEUX vendor source
      shell: bash
      run: "set -euo pipefail\ngit clone -q https://github.com/dereference23/kernel_xiaomi_sm6375.git \\\n  \"$GITHUB_WORKSPACE/kernel\"\ngit -C \"$GITHUB_WORKSPACE/kernel\" checkout -q --detach \"$EXPECTED_VENDOR_SHA\"\ntest \"$(git -C \"$GITHUB_WORKSPACE/kernel\" rev-parse HEAD)\" = \"$EXPECTED_VENDOR_SHA\"\ntest \"$(make -s -C \"$GITHUB_WORKSPACE/kernel\" kernelversion)\" = \"$EXPECTED_VENDOR_KERNEL_VERSION\"\n{\n  echo \"VENDOR_SHA=$(git -C \"$GITHUB_WORKSPACE/kernel\" rev-parse HEAD)\"\n  echo \"VENDOR_KERNEL_VERSION=$(make -s -C \"$GITHUB_WORKSPACE/kernel\" kernelversion)\"\n  echo \"FRESH_VENDOR_CHECKOUT=PASS\"\n} | tee \"$AUDIT_DIR/01-vendor.txt\"\n"
    - name: Download exact frozen CLEAN-GEN1 restore artifact
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n\nmeta=\"$RUNNER_TEMP/restore-artifact.json\"\ncurl --fail --silent --show-error --location \\\n  -H \"Authorization: Bearer $GH_TOKEN\" \\\n  -H \"Accept: application/vnd.github+json\" \\\n  -H \"X-GitHub-Api-Version: 2022-11-28\" \\\n  \"https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RESTORE_ARTIFACT_ID}\" \\\n  -o \"$meta\"\n\ntest \"$(jq -r '.id|tostring' \"$meta\")\" = \"$RESTORE_ARTIFACT_ID\"\ntest \"$(jq -r '.name' \"$meta\")\" = \"$RESTORE_ARTIFACT_NAME\"\ntest \"$(jq -r '.expired' \"$meta\")\" = \"false\"\n\ncurl --fail --silent --show-error --location \\\n  -H \"Authorization: Bearer $GH_TOKEN\" \\\n  -H \"Accept: application/vnd.github+json\" \\\n  \"https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RESTORE_ARTIFACT_ID}/zip\" \\\n  -o \"$RUNNER_TEMP/u5o1-restore.zip\"\n\nunzip -q \"$RUNNER_TEMP/u5o1-restore.zip\" -d \"$BACKUP_DIR\"\nrestore_dir=\"$(find \"$BACKUP_DIR\" -type d -name source-restore-kit -print -quit)\"\ntest -n \"$restore_dir\"\ntest -f \"$restore_dir/manifest.json\"\ntest -f \"$restore_dir/SHA256SUMS\"\necho \"RESTORE_DIR=$restore_dir\" >> \"$GITHUB_ENV\"\n\n{\n  echo \"RESTORE_ARTIFACT_ID=$RESTORE_ARTIFACT_ID\"\n  echo \"RESTORE_ARTIFACT_NAME=$RESTORE_ARTIFACT_NAME\"\n  echo \"RESTORE_ARTIFACT_CREATED=$(jq -r '.created_at' \"$meta\")\"\n  echo \"RESTORE_ARTIFACT_EXACT_PIN=PASS\"\n} | tee \"$AUDIT_DIR/02-restore-selection.txt\"\n"
    - name: Reconstruct exact frozen VEUX 5.4.274 P12 source
      working-directory: kernel
      shell: bash
      run: "set -euo pipefail\n\n(\n  cd \"$RESTORE_DIR\"\n  sha256sum -c SHA256SUMS\n) | tee \"$AUDIT_DIR/03-restore-sha256.txt\"\n\njq -e \\\n  --arg p5commit \"$EXPECTED_P5I_COMMIT\" \\\n  --arg p5tree \"$EXPECTED_P5I_TREE\" \\\n  --arg rhead \"$EXPECTED_RESUKISU_BASE_HEAD\" \\\n  --arg rtree \"$EXPECTED_RESUKISU_BASE_TREE\" \\\n  '.stage == \"CLEAN_GEN1_P6V11_SOURCE\"\n   and .p5i_commit == $p5commit\n   and .p5i_tree == $p5tree\n   and .resukisu_head == $rhead\n   and .resukisu_tree == $rtree' \\\n  \"$RESTORE_DIR/manifest.json\" >/dev/null\n\ngit reset --hard \"$EXPECTED_VENDOR_SHA\"\ngit clean -fdx\nrm -rf \"$OUT_DIR\"\n\np5_patch=\"$RESTORE_DIR/p5i/vendor-20240619-to-p5i-outer.patch\"\np6_patch=\"$RESTORE_DIR/p5i-to-p6-source-compat.patch\"\np6v11_patch=\"$RESTORE_DIR/p6v10-to-p6v11-full-susfs-outer.patch\"\n\nfor p in \"$p5_patch\" \"$p6_patch\" \"$p6v11_patch\"; do\n  test -s \"$p\"\n  git apply --check --whitespace=error --binary \"$p\"\n  git apply --index --whitespace=error --binary \"$p\"\ndone\n\nfinal_expected_tree=\"$(jq -r '.p6_source_tree' \"$RESTORE_DIR/manifest.json\")\"\ntest \"$final_expected_tree\" = \"$EXPECTED_OUTER_TREE\"\ntest \"$(git write-tree)\" = \"$EXPECTED_OUTER_TREE\"\ntest \"$(make -s kernelversion)\" = \"5.4.274\"\n\ngrep -Fxq 'CONFIG_KSU=y' arch/arm64/configs/veux_defconfig\ngrep -Fxq 'CONFIG_KSU_SUSFS=y' arch/arm64/configs/veux_defconfig\ngrep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' arch/arm64/configs/veux_defconfig\ngrep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' arch/arm64/configs/veux_defconfig\ngrep -Fxq 'CONFIG_LOCALVERSION=\"-qgki\"' arch/arm64/configs/veux_defconfig\n\n{\n  echo \"CLEAN_SOURCE_RECONSTRUCTION=PASS\"\n  echo \"OUTER_SOURCE_TREE=$final_expected_tree\"\n  echo \"KERNEL_VERSION=$(make -s kernelversion)\"\n} | tee \"$AUDIT_DIR/04-source.txt\"\n"
    - name: Construct exact pinned ReSukiSU import without module filter
      shell: bash
      run: "set -euo pipefail\nup=\"$GITHUB_WORKSPACE/resukisu-upstream\"\nrm -rf \"$up\"\ngit clone -q \"$RESUKISU_REPO\" \"$up\"\n\nfor c in \"$RESUKISU_COMMON_BASE\" \"$RESUKISU_TARGET\" \"$RESUKISU_EXCLUDED_MODULE_FILTER\"; do\n  git -C \"$up\" cat-file -e \"${c}^{commit}\"\ndone\ngit -C \"$up\" checkout -q --detach \"$RESUKISU_TARGET\"\ngit -C \"$up\" reset --hard -q \"$RESUKISU_TARGET\"\ngit -C \"$up\" clean -fdx -q\n\ntest \"$(git -C \"$up\" rev-list --count \"$RESUKISU_TARGET\" | awk '{print 30700+$1}')\" = \"$P13_KSU_VERSION\"\ntest \"$(git -C \"$up\" describe --abbrev=0 --tags \"$RESUKISU_TARGET\")\" = \"$P13_TARGET_TAG\"\ntest \"$(git -C \"$up\" rev-parse --short=8 \"$RESUKISU_TARGET\")\" = \"$P13_TARGET_SHORT\"\ngit -C \"$up\" show \"$RESUKISU_TARGET:uapi/supercall.h\" \\\n  | grep -Eq \"KERNEL_SU_UAPI_VERSION = ${P13_KSU_UAPI};\"\n\npython3 - <<'PY'\nfrom pathlib import Path\nimport os\n\nroot = Path(os.environ[\"GITHUB_WORKSPACE\"]) / \"resukisu-upstream\"\n\ndef remove_exact(path, block, expected=1):\n    p = root / path\n    text = p.read_text(encoding=\"utf-8\")\n    count = text.count(block)\n    if count != expected:\n        raise SystemExit(f\"{path}: expected {expected}, found {count}: {block!r}\")\n    p.write_text(text.replace(block, \"\", expected), encoding=\"utf-8\")\n\nfor rel in (\n    \"kernel/feature/module_load_filter.c\",\n    \"kernel/feature/module_load_filter.h\",\n):\n    p = root / rel\n    if not p.is_file():\n        raise SystemExit(f\"missing expected file: {rel}\")\n    p.unlink()\n\nremove_exact(\"kernel/Kbuild\", \"kernelsu-objs += feature/module_load_filter.o\\n\")\nremove_exact(\"kernel/core/init.c\", '#include \"feature/module_load_filter.h\"\\n')\nremove_exact(\n    \"kernel/core/init.c\",\n    'char ksu_block_modules[256];\\n'\n    'module_param_string(block_modules, ksu_block_modules, sizeof(ksu_block_modules), 0);\\n'\n    'MODULE_PARM_DESC(block_modules, \"Comma-separated preset module names to acknowledge without loading\");\\n\\n'\n)\nremove_exact(\"kernel/core/init.c\", \"        ksu_module_load_filter_hook_init();\\n\\n\")\nremove_exact(\"kernel/core/init.c\", \"    ksu_module_load_filter_hook_exit();\\n\")\nPY\n\ntest ! -e \"$up/kernel/feature/module_load_filter.c\"\ntest ! -e \"$up/kernel/feature/module_load_filter.h\"\n! grep -RFn 'module_load_filter' \"$up/kernel\" \"$up/uapi\"\n! grep -RFn 'ksu_block_modules' \"$up/kernel\" \"$up/uapi\"\n! grep -RFn 'block_modules' \"$up/kernel\" \"$up/uapi\"\n\npatch=\"$AUDIT_DIR/05-current-kernel-uapi-minus-module-filter.patch\"\ngit -C \"$up\" diff --binary \"$RESUKISU_COMMON_BASE\" -- kernel uapi > \"$patch\"\ntest -s \"$patch\"\ntest \"$(sha256sum \"$patch\" | awk '{print $1}')\" = \"$EXPECTED_IMPORT_PATCH_SHA256\"\n\n{\n  echo \"CURRENT_KERNEL_UAPI_PATCH=PASS\"\n  echo \"MODULE_LOAD_FILTER_EXCLUDED=PASS\"\n  echo \"PATCH_SHA256=$(sha256sum \"$patch\" | awk '{print $1}')\"\n} | tee \"$AUDIT_DIR/05-resukisu-import.txt\"\n"
    - name: Restore exact ReSukiSU/SUSFS integration contract
      working-directory: kernel
      shell: bash
      run: "set -euo pipefail\nup=\"$GITHUB_WORKSPACE/resukisu-upstream\"\npatch=\"$AUDIT_DIR/05-current-kernel-uapi-minus-module-filter.patch\"\n\nrm -rf KernelSU\ngit clone -q \"$RESUKISU_REPO\" KernelSU\ngit -C KernelSU checkout -q --detach \"$RESUKISU_COMMON_BASE\"\ngit -C KernelSU reset --hard -q \"$RESUKISU_COMMON_BASE\"\ngit -C KernelSU clean -fdx -q\n\ngit -C KernelSU apply --check --whitespace=nowarn \"$patch\"\ngit -C KernelSU apply --index --whitespace=nowarn \"$patch\"\ntest -z \"$(git -C KernelSU ls-files -u)\"\n\nif ! diff -qr \"$up/kernel\" KernelSU/kernel > \"$AUDIT_DIR/06-kernel-parity.txt\" 2>&1; then\n  cat \"$AUDIT_DIR/06-kernel-parity.txt\"\n  exit 1\nfi\nif ! diff -qr \"$up/uapi\" KernelSU/uapi > \"$AUDIT_DIR/06-uapi-parity.txt\" 2>&1; then\n  cat \"$AUDIT_DIR/06-uapi-parity.txt\"\n  exit 1\nfi\n\npython3 - <<'PY'\nfrom pathlib import Path\nfrom textwrap import dedent\nimport os\n\ndef ensure_include(path, anchor):\n    p = Path(path)\n    text = p.read_text(encoding=\"utf-8\")\n    inc = '#include <linux/ksu_hook_contract.h>'\n    if inc not in text:\n        if anchor not in text:\n            raise SystemExit(f\"anchor missing in {path}: {anchor!r}\")\n        text = text.replace(anchor, anchor + \"\\n\" + inc, 1)\n        p.write_text(text, encoding=\"utf-8\")\n\nensure_include(\"KernelSU/kernel/feature/sucompat.h\", '#include \"compat/kernel_compat.h\"')\nensure_include(\"KernelSU/kernel/runtime/ksud_integration.c\", \"#include <linux/version.h>\")\nensure_include(\"KernelSU/kernel/supercall/supercall.c\", \"#include <linux/anon_inodes.h>\")\n\np = Path(\"KernelSU/kernel/Kbuild\")\ntext = p.read_text(encoding=\"utf-8\")\nold = dedent(\"\"\"\\\nKSU_LOCAL_VERSION := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-list --count HEAD)\nKSU_VERSION := $(shell expr 30000 + $(KSU_LOCAL_VERSION) + 700)\n\nKSU_TAG_NAME    := $(shell cd $(KSU_SRC); $(GIT_BIN) describe --abbrev=0 --tags 2>/dev/null || echo \"v4.1.0\")\nKSU_COMMIT_SHA  := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-parse --short=8 HEAD 2>/dev/null || echo \"unknown\")\nifneq ($(shell cd $(KSU_SRC); $(GIT_BIN) diff-index --quiet HEAD; echo $$?),0)\nKSU_COMMIT_SHA  := $(KSU_COMMIT_SHA)-dirty\nendif\nKSU_BRANCH_NAME := $(shell cd $(KSU_SRC); $(GIT_BIN) branch --show-current 2>/dev/null || echo \"unknown\")\"\"\")\nversion = os.environ[\"P13_KSU_VERSION\"]\ntag = os.environ[\"P13_TARGET_TAG\"]\nshort = os.environ[\"P13_TARGET_SHORT\"]\ntarget = os.environ[\"RESUKISU_TARGET\"]\nnew = dedent(f\"\"\"\\\nKSU_LOCAL_VERSION := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-list --count HEAD)\nCLEAN_GEN1_UPSTREAM_COMPAT_VERSION := {version}\nCLEAN_GEN1_UPSTREAM_TARGET := {target}\nKSU_VERSION := $(CLEAN_GEN1_UPSTREAM_COMPAT_VERSION)\n\nKSU_TAG_NAME    := {tag}\nKSU_COMMIT_SHA  := {short}-p13\nKSU_BRANCH_NAME := clean-gen1-p13\"\"\")\nif old not in text:\n    raise SystemExit(\"expected ReSukiSU Kbuild version block not found\")\np.write_text(text.replace(old, new, 1), encoding=\"utf-8\")\nPY\n\ngit -C KernelSU add kernel uapi\ntest -z \"$(git -C KernelSU ls-files -u)\"\n\ngrep -Fq '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/feature/sucompat.h\ngrep -Fq '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/runtime/ksud_integration.c\ngrep -Fq '#include <linux/ksu_hook_contract.h>' KernelSU/kernel/supercall/supercall.c\ngrep -Fq \"CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := $P13_KSU_VERSION\" KernelSU/kernel/Kbuild\ngrep -Fq \"CLEAN_GEN1_UPSTREAM_TARGET := $RESUKISU_TARGET\" KernelSU/kernel/Kbuild\n"
    - name: Apply and verify exact P13 post-exec delta
      working-directory: kernel
      shell: bash
      run: "set -euo pipefail\n\ngrep -Eq \"KERNEL_SU_UAPI_VERSION = ${P13_KSU_UAPI};\" KernelSU/uapi/supercall.h\ngrep -Fq 'always flag that, to avoid old version of susfs hang in boot' \\\n  KernelSU/kernel/feature/sucompat.c\ngrep -Fq '#define TIF_PROC_IN_KSU_EXECVE 61' KernelSU/kernel/feature/sucompat.h\ngrep -Fq 'if (profile->uid != 0)' KernelSU/kernel/policy/app_profile.c\n\ntest ! -e KernelSU/kernel/feature/module_load_filter.c\ntest ! -e KernelSU/kernel/feature/module_load_filter.h\n! grep -RFn 'module_load_filter' KernelSU/kernel KernelSU/uapi\n! grep -RFn 'block_modules' KernelSU/kernel KernelSU/uapi\n\ntest \"$(sha256sum fs/exec.c | awk '{print $1}')\" = \"$EXPECTED_P12_EXEC_SHA256\"\ntest \"$(sha256sum include/linux/ksu_hook_contract.h | awk '{print $1}')\" = \"$EXPECTED_P12_CONTRACT_SHA256\"\ntest \"$(sha256sum fs/susfs.c | awk '{print $1}')\" = \"$EXPECTED_P12_SUSFS_C_SHA256\"\ntest \"$(sha256sum include/linux/susfs.h | awk '{print $1}')\" = \"$EXPECTED_P12_SUSFS_H_SHA256\"\ntest \"$(sha256sum include/linux/susfs_def.h | awk '{print $1}')\" = \"$EXPECTED_P12_SUSFS_DEF_SHA256\"\n\npython3 - <<'PY'\nfrom pathlib import Path\n\nhdr = Path(\"include/linux/ksu_hook_contract.h\")\ntext = hdr.read_text(encoding=\"utf-8\")\nanchor = \"\"\"int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n                        void *argv, void *envp, int *flags);\n\"\"\"\naddition = anchor + \"\"\"\n#ifdef CONFIG_KSU_SUSFS\nint ksu_handle_post_execve(int *fd, const char *filename,\n                           void *argv, void *envp,\n                           int *flags, int *retval);\n#endif\n\"\"\"\nif text.count(anchor) != 1:\n    raise SystemExit(f\"header anchor count={text.count(anchor)}\")\nif \"int ksu_handle_post_execve(\" in text:\n    raise SystemExit(\"post-exec prototype unexpectedly present\")\nhdr.write_text(text.replace(anchor, addition, 1), encoding=\"utf-8\")\n\nexecp = Path(\"fs/exec.c\")\ntext = execp.read_text(encoding=\"utf-8\")\nanchor = \"\"\"\\tsecurity_bprm_committed_creds(bprm);\n\\tmutex_unlock(&current->signal->cred_guard_mutex);\n\"\"\"\nreplacement = \"\"\"\\tsecurity_bprm_committed_creds(bprm);\n#ifdef CONFIG_KSU_SUSFS\n\\tksu_handle_post_execve(NULL, NULL, NULL, NULL, NULL, NULL);\n#endif\n\\tmutex_unlock(&current->signal->cred_guard_mutex);\n\"\"\"\nif text.count(anchor) != 1:\n    raise SystemExit(f\"fs/exec.c anchor count={text.count(anchor)}\")\nif \"ksu_handle_post_execve(\" in text:\n    raise SystemExit(\"post-exec call unexpectedly present\")\nexecp.write_text(text.replace(anchor, replacement, 1), encoding=\"utf-8\")\nPY\n\ngit diff --check\nmapfile -t changed < <(git diff --name-only | LC_ALL=C sort)\ntest \"${#changed[@]}\" -eq 2\ntest \"${changed[0]}\" = \"fs/exec.c\"\ntest \"${changed[1]}\" = \"include/linux/ksu_hook_contract.h\"\n\np13_patch=\"$AUDIT_DIR/07-P13-post-exec.patch\"\ngit diff --binary -- fs/exec.c include/linux/ksu_hook_contract.h > \"$p13_patch\"\ntest \"$(sha256sum \"$p13_patch\" | awk '{print $1}')\" = \"$EXPECTED_P13_PATCH_SHA256\"\n\ntest \"$(sha256sum fs/susfs.c | awk '{print $1}')\" = \"$EXPECTED_P12_SUSFS_C_SHA256\"\ntest \"$(sha256sum include/linux/susfs.h | awk '{print $1}')\" = \"$EXPECTED_P12_SUSFS_H_SHA256\"\ntest \"$(sha256sum include/linux/susfs_def.h | awk '{print $1}')\" = \"$EXPECTED_P12_SUSFS_DEF_SHA256\"\n\n{\n  echo \"P13_DELTA=PASS\"\n  echo \"P13_PATCH_SHA256=$EXPECTED_P13_PATCH_SHA256\"\n  echo \"P13_CHANGED_FILES=fs/exec.c include/linux/ksu_hook_contract.h\"\n  echo \"P13_MODULE_LOAD_FILTER_EXCLUDED=PASS\"\n} | tee \"$AUDIT_DIR/07-p13-source-gate.txt\"\n"
    - name: Create complete frozen P13 snapshot
      shell: bash
      working-directory: kernel
      run: "set -euo pipefail\n\n# P13's final two-file delta is intentionally working-tree state after the\n# frozen reconstruction. Stage only those exact two files so the snapshot tree\n# represents the complete known P13 source without changing file contents.\nmapfile -t unstaged < <(git diff --name-only | LC_ALL=C sort)\nexpected=(\n  \"fs/exec.c\"\n  \"include/linux/ksu_hook_contract.h\"\n)\nmapfile -t expected_sorted < <(printf '%s\\n' \"${expected[@]}\" | LC_ALL=C sort)\n\ntest \"${#unstaged[@]}\" -eq \"${#expected_sorted[@]}\"\nfor i in \"${!unstaged[@]}\"; do\n  test \"${unstaged[$i]}\" = \"${expected_sorted[$i]}\"\ndone\n\ngit add -- fs/exec.c include/linux/ksu_hook_contract.h\ntest -z \"$(git diff --name-only)\"\n\ntree=\"$(git write-tree)\"\nparent=\"$(git rev-parse HEAD)\"\nsnapshot=\"$(\n  printf '%s\\n' 'U5-O2R1 frozen P13 source snapshot' |\n  GIT_AUTHOR_NAME=\"$U5_AUDIT_GIT_NAME\" \\\n  GIT_AUTHOR_EMAIL=\"$U5_AUDIT_GIT_EMAIL\" \\\n  GIT_COMMITTER_NAME=\"$U5_AUDIT_GIT_NAME\" \\\n  GIT_COMMITTER_EMAIL=\"$U5_AUDIT_GIT_EMAIL\" \\\n  git commit-tree \"$tree\" -p \"$parent\"\n)\"\n\necho \"P13_SNAPSHOT_COMMIT=$snapshot\" >> \"$GITHUB_ENV\"\n\n{\n  echo \"P13_SNAPSHOT_TREE=$tree\"\n  echo \"P13_SNAPSHOT_COMMIT=$snapshot\"\n  echo \"P13_SNAPSHOT_KERNELVERSION=$(make -s kernelversion)\"\n  echo \"P13_FINAL_UNSTAGED_FILES_STAGED_FOR_SNAPSHOT=2\"\n  echo \"P13_SNAPSHOT=PASS\"\n} > \"$AUDIT_DIR/09-p13-snapshot.txt\"\n\ngit diff-tree --no-commit-id --name-only -r \"$snapshot\" \\\n  > \"$AUDIT_DIR/09-p13-snapshot-vs-parent.txt\"\n"
    - name: Fetch and verify official Linux-stable 5.4 tags
      shell: bash
      run: "set -euo pipefail\nrm -rf \"$STABLE_DIR\"\ngit init -q \"$STABLE_DIR\"\ngit -C \"$STABLE_DIR\" remote add origin \"$LINUX_STABLE_REPO\"\n\nfor tag in v5.4.274 v5.4.300 v5.4.302; do\n  git -C \"$STABLE_DIR\" fetch -q --depth=1 origin \"refs/tags/${tag}:refs/tags/${tag}\"\ndone\n\nverify_tag() {\n  tag=\"$1\"\n  expected_tag_obj=\"$2\"\n  expected_commit=\"$3\"\n  expected_sublevel=\"$4\"\n\n  test \"$(git -C \"$STABLE_DIR\" rev-parse \"$tag\")\" = \"$expected_tag_obj\"\n  test \"$(git -C \"$STABLE_DIR\" cat-file -t \"$tag\")\" = \"tag\"\n  test \"$(git -C \"$STABLE_DIR\" rev-parse \"${tag}^{commit}\")\" = \"$expected_commit\"\n\n  git -C \"$STABLE_DIR\" show \"${tag}:Makefile\" > \"$RUNNER_TEMP/${tag}-Makefile\"\n  grep -Eq '^VERSION[[:space:]]*=[[:space:]]*5$' \"$RUNNER_TEMP/${tag}-Makefile\"\n  grep -Eq '^PATCHLEVEL[[:space:]]*=[[:space:]]*4$' \"$RUNNER_TEMP/${tag}-Makefile\"\n  grep -Eq \"^SUBLEVEL[[:space:]]*=[[:space:]]*${expected_sublevel}$\" \"$RUNNER_TEMP/${tag}-Makefile\"\n\n  if git -C \"$STABLE_DIR\" cat-file -e \"${tag}:localversion\" 2>/dev/null; then\n    echo \"Unexpected official localversion file in $tag\" >&2\n    exit 1\n  fi\n}\n\nverify_tag v5.4.274 \"$STABLE_TAGOBJ_274\" \"$STABLE_COMMIT_274\" 274\nverify_tag v5.4.300 \"$STABLE_TAGOBJ_300\" \"$STABLE_COMMIT_300\" 300\nverify_tag v5.4.302 \"$STABLE_TAGOBJ_302\" \"$STABLE_COMMIT_302\" 302\n\n# Verify GitHub's tag signature status for the exact pinned annotated tag objects.\nfor pair in \\\n  \"v5.4.274:$STABLE_TAGOBJ_274\" \\\n  \"v5.4.300:$STABLE_TAGOBJ_300\" \\\n  \"v5.4.302:$STABLE_TAGOBJ_302\"; do\n  tag=\"${pair%%:*}\"\n  obj=\"${pair#*:}\"\n  json=\"$RUNNER_TEMP/${tag}-tag.json\"\n\n  curl --fail --silent --show-error --location \\\n    -H \"Authorization: Bearer $GH_TOKEN\" \\\n    -H \"Accept: application/vnd.github+json\" \\\n    -H \"X-GitHub-Api-Version: 2022-11-28\" \\\n    \"https://api.github.com/repos/gregkh/linux/git/tags/${obj}\" \\\n    -o \"$json\"\n\n  test \"$(jq -r '.tag' \"$json\")\" = \"$tag\"\n  test \"$(jq -r '.sha' \"$json\")\" = \"$obj\"\n  test \"$(jq -r '.verification.verified' \"$json\")\" = \"true\"\n  jq -e '.verification.reason == \"valid\"' \"$json\" >/dev/null\ndone\n\n{\n  echo \"LINUX_STABLE_REPO=$LINUX_STABLE_REPO\"\n  echo \"V5_4_274_TAG_OBJECT=$STABLE_TAGOBJ_274\"\n  echo \"V5_4_274_COMMIT=$STABLE_COMMIT_274\"\n  echo \"V5_4_300_TAG_OBJECT=$STABLE_TAGOBJ_300\"\n  echo \"V5_4_300_COMMIT=$STABLE_COMMIT_300\"\n  echo \"V5_4_302_TAG_OBJECT=$STABLE_TAGOBJ_302\"\n  echo \"V5_4_302_COMMIT=$STABLE_COMMIT_302\"\n  echo \"V5_4_274_SIGNATURE=VERIFIED\"\n  echo \"V5_4_300_SIGNATURE=VERIFIED\"\n  echo \"V5_4_302_SIGNATURE=VERIFIED\"\n  echo \"OFFICIAL_LOCALVERSION_FILES=ABSENT\"\n  echo \"OFFICIAL_STABLE_AUTHORITY=PASS\"\n} | tee \"$AUDIT_DIR/10-official-stable-authority.txt\"\n\ngit -C \"$STABLE_DIR\" cat-file tag v5.4.274 > \"$AUDIT_DIR/10-tag-v5.4.274.txt\"\ngit -C \"$STABLE_DIR\" cat-file tag v5.4.300 > \"$AUDIT_DIR/10-tag-v5.4.300.txt\"\ngit -C \"$STABLE_DIR\" cat-file tag v5.4.302 > \"$AUDIT_DIR/10-tag-v5.4.302.txt\"\n"
    - name: Create isolated 5.4.300 and 5.4.302 P13 worktrees
      shell: bash
      working-directory: kernel
      run: "set -euo pipefail\nrm -rf \"$PORT300_DIR\" \"$PORT302_DIR\"\n\ngit worktree add --detach \"$PORT300_DIR\" \"$P13_SNAPSHOT_COMMIT\"\ngit worktree add --detach \"$PORT302_DIR\" \"$P13_SNAPSHOT_COMMIT\"\n\ntest \"$(git -C \"$PORT300_DIR\" rev-parse HEAD)\" = \"$P13_SNAPSHOT_COMMIT\"\ntest \"$(git -C \"$PORT302_DIR\" rev-parse HEAD)\" = \"$P13_SNAPSHOT_COMMIT\"\n\n{\n  echo \"PORT300_BASE=$P13_SNAPSHOT_COMMIT\"\n  echo \"PORT302_BASE=$P13_SNAPSHOT_COMMIT\"\n  echo \"WORKTREES=PASS\"\n} > \"$AUDIT_DIR/10-worktrees.txt\"\n"
    - name: Install deterministic three-way merge engine
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/u5o2_merge.py\" <<'PY'\nfrom pathlib import Path\nimport os, subprocess, csv, hashlib, shutil, stat, collections, traceback, re\n\nstable = Path(os.environ[\"STABLE_DIR\"])\naudit = Path(os.environ[\"AUDIT_DIR\"])\nsnapshot = os.environ[\"P13_SNAPSHOT_COMMIT\"]\n\ntargets = [\n    (\"5.4.300\", \"v5.4.300\", Path(os.environ[\"PORT300_DIR\"])),\n    (\"5.4.302\", \"v5.4.302\", Path(os.environ[\"PORT302_DIR\"])),\n]\nbase_tag = \"v5.4.274\"\n\ndef run(args, cwd=None, check=True, data=None):\n    p = subprocess.run(\n        args, cwd=cwd, input=data,\n        stdout=subprocess.PIPE, stderr=subprocess.PIPE\n    )\n    if check and p.returncode != 0:\n        raise RuntimeError(\n            f\"command failed rc={p.returncode}: {args}\\n\"\n            + p.stderr.decode(errors=\"replace\")\n        )\n    return p\n\ndef git_show(tag, path):\n    return run([\"git\",\"-C\",str(stable),\"show\",f\"{tag}:{path}\"]).stdout\n\ndef tree_entry(tag, path):\n    p = run(\n        [\"git\",\"-C\",str(stable),\"ls-tree\",tag,\"--\",path],\n        check=False\n    )\n    if p.returncode != 0 or not p.stdout.strip():\n        return None\n    line = p.stdout.decode(errors=\"replace\").rstrip(\"\\n\")\n    left, _ = line.split(\"\\t\", 1)\n    mode, typ, sha = left.split(\" \")\n    return mode, typ, sha\n\ndef lexists(path):\n    return path.exists() or path.is_symlink()\n\ndef has_symlink_parent(root, rel):\n    cur = root\n    parts = Path(rel).parts\n    for part in parts[:-1]:\n        cur = cur / part\n        if cur.is_symlink():\n            return True\n    return False\n\ndef ours_bytes(root, rel):\n    p = root / rel\n    if p.is_symlink():\n        return os.readlink(p).encode()\n    return p.read_bytes()\n\ndef is_binary(data):\n    return b\"\\x00\" in data\n\ndef resolve_makefile_conflict(preview, version):\n    text = preview.decode(errors=\"strict\")\n    marker_counts = {\n        \"start\": len(re.findall(r\"(?m)^<<<<<<< [^\\n]*$\", text)),\n        \"base\": len(re.findall(r\"(?m)^\\|\\|\\|\\|\\|\\|\\| [^\\n]*$\", text)),\n        \"sep\": len(re.findall(r\"(?m)^=======$\", text)),\n        \"end\": len(re.findall(r\"(?m)^>>>>>>> [^\\n]*$\", text)),\n    }\n    if any(count != 1 for count in marker_counts.values()):\n        raise RuntimeError(f\"Makefile resolver expected one diff3 hunk, got {marker_counts}\")\n\n    m = re.search(\n        r\"(?ms)^<<<<<<< [^\\n]*\\n\"\n        r\"(?P<ours>.*?)\"\n        r\"^\\|\\|\\|\\|\\|\\|\\| [^\\n]*\\n\"\n        r\"(?P<base>.*?)\"\n        r\"^=======\\n\"\n        r\"(?P<theirs>.*?)\"\n        r\"^>>>>>>> [^\\n]*\\n\",\n        text,\n    )\n    if not m:\n        raise RuntimeError(\"Makefile resolver could not parse the diff3 hunk\")\n\n    ours = m.group(\"ours\")\n    base = m.group(\"base\")\n    theirs = m.group(\"theirs\")\n\n    expected_ours = \"KBUILD_CFLAGS += $(call cc-disable-warning, undefined-optimized)\\n\"\n    stable_anchor = \"KBUILD_CFLAGS += -mno-global-merge\\n\"\n    stable_new = \"KBUILD_CFLAGS += $(call cc-disable-warning, default-const-init-unsafe)\\n\"\n\n    if ours != expected_ours:\n        raise RuntimeError(f\"unexpected P13 Makefile conflict side: {ours!r} != {expected_ours!r}\")\n    if stable_anchor not in base:\n        raise RuntimeError(\"official 5.4.274 Makefile conflict side lost -mno-global-merge\")\n    if stable_anchor not in theirs:\n        raise RuntimeError(\"official target Makefile conflict side lost -mno-global-merge\")\n    if stable_new not in theirs:\n        raise RuntimeError(\"official target Makefile conflict side lacks default-const-init-unsafe\")\n    if expected_ours in theirs:\n        raise RuntimeError(\"official target unexpectedly already contains P13 undefined-optimized flag\")\n\n    resolved_hunk = theirs.replace(stable_anchor, stable_anchor + expected_ours, 1)\n    resolved = text[:m.start()] + resolved_hunk + text[m.end():]\n\n    expected_sublevel = version.rsplit(\".\", 1)[1]\n    if f\"SUBLEVEL = {expected_sublevel}\\n\" not in resolved:\n        raise RuntimeError(f\"Makefile resolver did not preserve target SUBLEVEL {expected_sublevel}\")\n    if \"export KERNEL_SUPPORTS_NESTED_COMPOSITES := y\" not in resolved:\n        raise RuntimeError(\"Makefile resolver lost P13 nested-composites capability marker\")\n    for required in (\n        stable_anchor.strip(),\n        expected_ours.strip(),\n        stable_new.strip(),\n    ):\n        if required not in resolved:\n            raise RuntimeError(f\"Makefile resolver missing required line: {required}\")\n    if re.search(r\"(?m)^(<<<<<<< |\\|\\|\\|\\|\\|\\|\\| |=======|>>>>>>> )\", resolved):\n        raise RuntimeError(\"Makefile resolver left conflict markers\")\n\n\n    return resolved.encode()\n\ndef resolve_platform_registration_conflict(preview, rel):\n    text = preview.decode(errors=\"strict\")\n    marker_counts = {\n        \"start\": len(re.findall(r\"(?m)^<<<<<<< [^\\n]*$\", text)),\n        \"base\": len(re.findall(r\"(?m)^\\|\\|\\|\\|\\|\\|\\| [^\\n]*$\", text)),\n        \"sep\": len(re.findall(r\"(?m)^=======$\", text)),\n        \"end\": len(re.findall(r\"(?m)^>>>>>>> [^\\n]*$\", text)),\n    }\n    if any(count != 1 for count in marker_counts.values()):\n        raise RuntimeError(f\"{rel}: expected one diff3 hunk, got {marker_counts}\")\n\n    m = re.search(\n        r\"(?ms)^<<<<<<< [^\\n]*\\n\"\n        r\"(?P<ours>.*?)\"\n        r\"^\\|\\|\\|\\|\\|\\|\\| [^\\n]*\\n\"\n        r\"(?P<base>.*?)\"\n        r\"^=======\\n\"\n        r\"(?P<theirs>.*?)\"\n        r\"^>>>>>>> [^\\n]*\\n\",\n        text,\n    )\n    if not m:\n        raise RuntimeError(f\"{rel}: could not parse diff3 hunk\")\n\n    ours = m.group(\"ours\")\n    base = m.group(\"base\")\n    theirs = m.group(\"theirs\")\n\n    if base != \"\":\n        raise RuntimeError(f\"{rel}: official 5.4.274 conflict side is not empty: {base!r}\")\n\n    if rel == \"drivers/platform/Kconfig\":\n        expected_ours = '\\nsource \"drivers/platform/msm/Kconfig\"\\n'\n        expected_theirs = '\\nsource \"drivers/platform/surface/Kconfig\"\\n'\n        resolved_hunk = (\n            '\\nsource \"drivers/platform/msm/Kconfig\"\\n'\n            '\\nsource \"drivers/platform/surface/Kconfig\"\\n'\n        )\n        required = (\n            'source \"drivers/platform/msm/Kconfig\"',\n            'source \"drivers/platform/surface/Kconfig\"',\n        )\n    elif rel == \"drivers/platform/Makefile\":\n        expected_ours = \"obj-$(CONFIG_ARCH_QCOM)\\t\\t+= msm/\\n\"\n        expected_theirs = \"obj-$(CONFIG_SURFACE_PLATFORMS)\\t+= surface/\\n\"\n        resolved_hunk = expected_ours + expected_theirs\n        required = (\n            \"obj-$(CONFIG_ARCH_QCOM)\\t\\t+= msm/\",\n            \"obj-$(CONFIG_SURFACE_PLATFORMS)\\t+= surface/\",\n        )\n    else:\n        raise RuntimeError(f\"unsupported platform registration path: {rel}\")\n\n    if ours != expected_ours:\n        raise RuntimeError(f\"{rel}: unexpected P13 side: {ours!r} != {expected_ours!r}\")\n    if theirs != expected_theirs:\n        raise RuntimeError(f\"{rel}: unexpected official-target side: {theirs!r} != {expected_theirs!r}\")\n\n    resolved = text[:m.start()] + resolved_hunk + text[m.end():]\n    if re.search(r\"(?m)^(<<<<<<< |\\|\\|\\|\\|\\|\\|\\| |=======|>>>>>>> )\", resolved):\n        raise RuntimeError(f\"{rel}: conflict markers remain after resolution\")\n    for item in required:\n        if resolved.count(item) != 1:\n            raise RuntimeError(f\"{rel}: required registration count != 1 for {item!r}\")\n\n    return resolved.encode()\n\n\ndef resolve_hid_ids_conflict(preview, version):\n    rel = \"drivers/hid/hid-ids.h\"\n    text = preview.decode(errors=\"strict\")\n\n    marker_counts = {\n        \"start\": len(re.findall(r\"(?m)^<<<<<<< [^\\n]*$\", text)),\n        \"base\": len(re.findall(r\"(?m)^\\|\\|\\|\\|\\|\\|\\| [^\\n]*$\", text)),\n        \"sep\": len(re.findall(r\"(?m)^=======$\", text)),\n        \"end\": len(re.findall(r\"(?m)^>>>>>>> [^\\n]*$\", text)),\n    }\n    if any(count != 1 for count in marker_counts.values()):\n        raise RuntimeError(f\"{rel}: expected one diff3 hunk, got {marker_counts}\")\n\n    m = re.search(\n        r\"(?ms)^<<<<<<< [^\\n]*\\n\"\n        r\"(?P<ours>.*?)\"\n        r\"^\\|\\|\\|\\|\\|\\|\\| [^\\n]*\\n\"\n        r\"(?P<base>.*?)\"\n        r\"^=======\\n\"\n        r\"(?P<theirs>.*?)\"\n        r\"^>>>>>>> [^\\n]*\\n\",\n        text,\n    )\n    if not m:\n        raise RuntimeError(f\"{rel}: could not parse diff3 hunk\")\n\n    ours = m.group(\"ours\")\n    base = m.group(\"base\")\n    theirs = m.group(\"theirs\")\n\n    if base != \"\":\n        raise RuntimeError(f\"{rel}: expected empty official-5.4.274 side, got {base!r}\")\n\n    required_ours = (\n        \"#define USB_VENDOR_ID_QVR5\\t0x045e\",\n        \"#define USB_VENDOR_ID_QVR32A\\t0x04b4\",\n        \"#define USB_VENDOR_ID_NREAL\\t0x05a9\",\n        \"#define USB_DEVICE_ID_QVR5\\t0x0659\",\n        \"#define USB_DEVICE_ID_QVR32A\\t0x00c3\",\n        \"#define USB_DEVICE_ID_NREAL\\t0x0680\",\n        \"#define USB_VENDER_ID_QUALCOMM  0x0a12\",\n        \"#define USB_VENDER_ID_TEMP_HHG_AKSY 0x1234\",\n        \"#define USB_PRODUCT_ID_AKSYS_HHG  0x1000\",\n    )\n    for item in required_ours:\n        if item not in ours:\n            raise RuntimeError(f\"{rel}: P13 side missing {item!r}\")\n\n    if version == \"5.4.300\":\n        required_theirs = (\n            \"#define USB_VENDOR_ID_SMARTLINKTECHNOLOGY              0x4c4a\",\n            \"#define USB_DEVICE_ID_SMARTLINKTECHNOLOGY_4155         0x4155\",\n        )\n    elif version == \"5.4.302\":\n        required_theirs = (\n            \"#define USB_VENDOR_ID_JIELI_SDK_DEFAULT\\t\\t0x4c4a\",\n            \"#define USB_DEVICE_ID_JIELI_SDK_4155\\t\\t0x4155\",\n        )\n    else:\n        raise RuntimeError(f\"{rel}: unsupported target {version}\")\n\n    for item in required_theirs:\n        if item not in theirs:\n            raise RuntimeError(f\"{rel}: official target side missing {item!r}\")\n\n    # Both blocks define independent symbolic names. Preserve the P13 device IDs\n    # and append the exact official target block. No ID is replaced or renamed.\n    resolved_hunk = ours\n    if resolved_hunk and not resolved_hunk.endswith(\"\\n\"):\n        resolved_hunk += \"\\n\"\n    if resolved_hunk and not resolved_hunk.endswith(\"\\n\\n\"):\n        resolved_hunk += \"\\n\"\n    resolved_hunk += theirs.lstrip(\"\\n\")\n\n    resolved = text[:m.start()] + resolved_hunk + text[m.end():]\n\n    if re.search(r\"(?m)^(<<<<<<< |\\|\\|\\|\\|\\|\\|\\| |=======|>>>>>>> )\", resolved):\n        raise RuntimeError(f\"{rel}: conflict markers remain\")\n\n    for item in required_ours + required_theirs:\n        if resolved.count(item) != 1:\n            raise RuntimeError(f\"{rel}: required define count != 1 for {item!r}\")\n\n    # The official 0x4c4a/0x4155 symbolic pair is target-specific; P13's IDs\n    # remain independent and may legitimately use other numeric values.\n    return resolved.encode()\n\n\n\ndef resolve_pidfd_declaration_conflict(preview):\n    rel = \"include/linux/pid.h\"\n    text = preview.decode(errors=\"strict\")\n\n    marker_counts = {\n        \"start\": len(re.findall(r\"(?m)^<<<<<<< [^\\n]*$\", text)),\n        \"base\": len(re.findall(r\"(?m)^\\|\\|\\|\\|\\|\\|\\| [^\\n]*$\", text)),\n        \"sep\": len(re.findall(r\"(?m)^=======$\", text)),\n        \"end\": len(re.findall(r\"(?m)^>>>>>>> [^\\n]*$\", text)),\n    }\n    if any(count != 1 for count in marker_counts.values()):\n        raise RuntimeError(f\"{rel}: expected one diff3 hunk, got {marker_counts}\")\n\n    m = re.search(\n        r\"(?ms)^<<<<<<< [^\\n]*\\n\"\n        r\"(?P<ours>.*?)\"\n        r\"^\\|\\|\\|\\|\\|\\|\\| [^\\n]*\\n\"\n        r\"(?P<base>.*?)\"\n        r\"^=======\\n\"\n        r\"(?P<theirs>.*?)\"\n        r\"^>>>>>>> [^\\n]*\\n\",\n        text,\n    )\n    if not m:\n        raise RuntimeError(f\"{rel}: could not parse diff3 hunk\")\n\n    ours = m.group(\"ours\")\n    base = m.group(\"base\")\n    theirs = m.group(\"theirs\")\n\n    expected_ours = \"struct pid *pidfd_get_pid(unsigned int fd, unsigned int *flags);\\n\"\n    expected_theirs = \"int pidfd_prepare(struct pid *pid, unsigned int flags, struct file **ret);\\n\"\n\n    if base != \"\":\n        raise RuntimeError(f\"{rel}: expected empty official-5.4.274 conflict side, got {base!r}\")\n    if ours != expected_ours:\n        raise RuntimeError(f\"{rel}: unexpected P13 declaration: {ours!r}\")\n    if theirs != expected_theirs:\n        raise RuntimeError(f\"{rel}: unexpected official-target declaration: {theirs!r}\")\n\n    resolved_hunk = expected_ours + expected_theirs\n    resolved = text[:m.start()] + resolved_hunk + text[m.end():]\n\n    if re.search(r\"(?m)^(<<<<<<< |\\|\\|\\|\\|\\|\\|\\| |=======|>>>>>>> )\", resolved):\n        raise RuntimeError(f\"{rel}: conflict markers remain\")\n    if resolved.count(expected_ours.strip()) != 1:\n        raise RuntimeError(f\"{rel}: pidfd_get_pid declaration count != 1\")\n    if resolved.count(expected_theirs.strip()) != 1:\n        raise RuntimeError(f\"{rel}: pidfd_prepare declaration count != 1\")\n\n    return resolved.encode()\n\n\ndef resolve_caif_hsi_conflict(preview):\n    rel = \"drivers/net/caif/Kconfig\"\n    text = preview.decode(errors=\"strict\")\n\n    marker_counts = {\n        \"start\": len(re.findall(r\"(?m)^<<<<<<< [^\\n]*$\", text)),\n        \"base\": len(re.findall(r\"(?m)^\\|\\|\\|\\|\\|\\|\\| [^\\n]*$\", text)),\n        \"sep\": len(re.findall(r\"(?m)^=======$\", text)),\n        \"end\": len(re.findall(r\"(?m)^>>>>>>> [^\\n]*$\", text)),\n    }\n    if any(count != 1 for count in marker_counts.values()):\n        raise RuntimeError(f\"{rel}: expected one diff3 hunk, got {marker_counts}\")\n\n    m = re.search(\n        r\"(?ms)^<<<<<<<