name: CLEAN GEN1 P8 v2 r2 - VEUX A13 stock ROM module ABI investigation

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: clean-gen1-p8v2r2-veux-a13-module-abi-investigation
  cancel-in-progress: false

env:
  P6V10_V2_RUN_ID: '33603757875'
  P6V10_V2_ARTIFACT: clean-gen1-p6v10-stock-kernel-release-sucompat-p7-boot-v2-33603757875
  EXPECTED_P6_RESULT: CLEAN_GEN1_P6V10_STOCK_KERNEL_IDENTITY_DETERMINISTIC_BUILD=PASS
  EXPECTED_P6_KERNEL_VERSION: '5.4.274'
  EXPECTED_P6_STOCK_RELEASE: 5.4.274-qgki-g82179e362f33
  EXPECTED_P6_STOCK_BOOT_SHA256: ac6522e4eed55782dd2ae61362e9d345d01a1f229c87333818511d5537fa79c5
  TRACKER_REPO: https://github.com/XiaomiFirmwareUpdater/miui-updates-tracker.git
  TRACKER_COMMIT: c9d55af855fa504a199daf4e41da58c538d326b0
  LPUNPACK_REPO: unix3dgforce/lpunpack
  LPUNPACK_COMMIT: c59b8f3b069c5a8aa438a049fa4a091177172434
  LPUNPACK_PY_BLOB: 9671d1d731d28f04f0d65dad0dacb2110da87029
  P8V2_R1_RUN_ID: '33671122557'
  P8V2_R2_FIX: HEREDOC_INDENTATION_PLUS_LPUNPACK_JSON_KEY_PLUS_EMPTY_INACTIVE_SLOT_SKIP

jobs:
  regional-module-audit:
    name: Module ABI audit - ${{ matrix.region }} - ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: global
            codename: veux_global
            region: Global
            version: OS1.0.12.0.TKCMIXM
            android: '13.0'
            date: '2024-12-05'
            md5: cda1240a451dd4f75776878b52f0cea3
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.12.0.TKCMIXM/veux_global_images_OS1.0.12.0.TKCMIXM_20241205.0000.00_13.0_global_cda1240a45.tgz
          - id: eea
            codename: veux_eea_global
            region: EEA
            version: OS1.0.13.0.TKCEUXM
            android: '13.0'
            date: '2025-12-27'
            md5: e887aa14ef7d196145cb9097a2b3de16
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.13.0.TKCEUXM/veux_eea_global_images_OS1.0.13.0.TKCEUXM_20251227.0000.00_13.0_eea_e887aa14ef.tgz
          - id: china
            codename: veux
            region: China
            version: OS1.0.10.0.TKCCNXM
            android: '13.0'
            date: '2024-12-18'
            md5: f0dc219786e26bfad344aff414a29674
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.10.0.TKCCNXM/veux_images_OS1.0.10.0.TKCCNXM_20241218.0000.00_13.0_cn_f0dc219786.tgz
          - id: indonesia
            codename: veux_id_global
            region: Indonesia
            version: OS1.0.10.0.TKCIDXM
            android: '13.0'
            date: '2024-12-12'
            md5: 72a3d5e7d1d6e82002907292df0226eb
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.10.0.TKCIDXM/veux_id_global_images_OS1.0.10.0.TKCIDXM_20241212.0000.00_13.0_id_72a3d5e7d1.tgz
          - id: india
            codename: veux_in_global
            region: India
            version: OS1.0.9.0.TKCINXM
            android: '13.0'
            date: '2024-12-12'
            md5: fb2147aa4b6b6ee1d868049ea3843caa
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.9.0.TKCINXM/veux_in_global_images_OS1.0.9.0.TKCINXM_20241212.0000.00_13.0_in_fb2147aa4b.tgz
          - id: japan
            codename: veux_jp_global
            region: Japan
            version: OS1.0.8.0.TKCJPXM
            android: '13.0'
            date: '2024-12-18'
            md5: e352eb09898771b6695fb5e7cb4a6af3
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.8.0.TKCJPXM/veux_jp_global_images_OS1.0.8.0.TKCJPXM_20241218.0000.00_13.0_jp_e352eb0989.tgz
          - id: russia
            codename: veux_ru_global
            region: Russia
            version: OS1.0.9.0.TKCRUXM
            android: '13.0'
            date: '2024-12-18'
            md5: 7c9b278138d5389242d8778415861a2b
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.9.0.TKCRUXM/veux_ru_global_images_OS1.0.9.0.TKCRUXM_20241218.0000.00_13.0_ru_7c9b278138.tgz
          - id: turkey
            codename: veux_tr_global
            region: Turkey
            version: OS1.0.8.0.TKCTRXM
            android: '13.0'
            date: '2024-12-17'
            md5: 91b613045b4845f542692384714bd773
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.8.0.TKCTRXM/veux_tr_global_images_OS1.0.8.0.TKCTRXM_20241217.0000.00_13.0_tr_91b613045b.tgz
          - id: taiwan
            codename: veux_tw_global
            region: Taiwan
            version: OS1.0.8.0.TKCTWXM
            android: '13.0'
            date: '2024-12-17'
            md5: 26da66dc04d525e4302fdd7d8e6173f5
            url: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.8.0.TKCTWXM/veux_tw_global_images_OS1.0.8.0.TKCTWXM_20241217.0000.00_13.0_tw_26da66dc04.tgz

    env:
      REGION_ID: ${{ matrix.id }}
      REGION_NAME: ${{ matrix.region }}
      ROM_CODENAME: ${{ matrix.codename }}
      ROM_VERSION: ${{ matrix.version }}
      ROM_ANDROID: ${{ matrix.android }}
      ROM_DATE: ${{ matrix.date }}
      ROM_MD5: ${{ matrix.md5 }}
      ROM_URL: ${{ matrix.url }}
      WORK_DIR: ${{ github.workspace }}/p8v2r2-${{ matrix.id }}
      P6_DIR: ${{ github.workspace }}/p8v2r2-${{ matrix.id }}/p6v10-v2
      ROM_DIR: ${{ github.workspace }}/p8v2r2-${{ matrix.id }}/rom
      AUDIT_DIR: ${{ github.workspace }}/p8v2r2-${{ matrix.id }}/audit
      LOGICAL_DIR: ${{ github.workspace }}/p8v2r2-${{ matrix.id }}/logical
      RAMDISK_DIR: ${{ github.workspace }}/p8v2r2-${{ matrix.id }}/vendor-ramdisks
      MOUNT_DIR: ${{ github.workspace }}/p8v2r2-${{ matrix.id }}/mounts
      ROOTS_TSV: ${{ github.workspace }}/p8v2r2-${{ matrix.id }}/roots.tsv

    steps:
      - name: Initialize read-only module ABI investigation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR"
          mkdir -p "$P6_DIR" "$ROM_DIR" "$AUDIT_DIR" "$LOGICAL_DIR" "$RAMDISK_DIR" "$MOUNT_DIR"
          : > "$ROOTS_TSV"

          cat > "$AUDIT_DIR/00-plan.txt" <<EOF
          CLEAN GEN1 P8 v2 - VEUX Android 13 stock-ROM module/ABI investigation

          Region: $REGION_NAME
          Stock version: $ROM_VERSION
          Android: $ROM_ANDROID

          Purpose:
          - determine whether the stock ROM actually ships external kernel modules;
          - determine whether stock runtime metadata declares module loading;
          - inventory module vermagic and symbol-version requirements;
          - compare those static requirements with the unchanged P6-v10-v2 candidate;
          - distinguish the EEA 5.4.289 family from the 5.4.274 family.

          Read-only evidence sources:
          - stock boot.img embedded kernel config and concrete Linux release;
          - vendor_boot vendor ramdisk fragments;
          - super logical partitions vendor/vendor_dlkm/system_dlkm/odm when present;
          - standalone vendor/vendor_dlkm/system_dlkm/odm images when present;
          - modules.load* and init rc insmod/modprobe declarations;
          - ELF module vermagic, __versions and modprobe --show-modversions evidence;
          - accepted P6-v10-v2 Image/config/result artifacts.

          Explicit exclusions:
          - NO kernel source mutation;
          - NO kernel build;
          - NO defconfig change;
          - NO boot image creation or repack;
          - NO flashable ZIP;
          - NO device access or flashing;
          - NO automatic "repair" decision;
          - NO universal compatibility or P9 release authorization.

          Interpretation:
          A module/config difference is evidence to investigate. This workflow may prove that
          P6-v10-v2 cannot satisfy a declared module-load path as built, but it does not choose
          the remediation. Any kernel config/source change requires a separate reviewed stage.

          Retry provenance:
          - P8-v2 r1 run 33671122557 reached authenticated ROM/P6/stock-kernel/vendor_boot evidence
            for all nine regions but failed before module collection.
          - r1 failure class: WORKFLOW_PYTHON_HEREDOC_INDENTATION.
          - r1 also used the wrong rendered lpunpack JSON key partition_table instead of partitions.
          - r2 changes no kernel/ROM scientific contract; it only corrects extraction plumbing.
          EOF

      - name: Install investigation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            android-sdk-libsparse-utils \
            binutils \
            ca-certificates \
            coreutils \
            cpio \
            curl \
            e2fsprogs \
            file \
            f2fs-tools \
            git \
            gzip \
            jq \
            kmod \
            lz4 \
            python3 \
            tar \
            util-linux \
            xz-utils \
            xxd \
            zstd

          command -v simg2img
          command -v modinfo
          command -v modprobe
          command -v readelf
          command -v blkid
          command -v cpio

      - name: Checkout pinned read-only lpunpack source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LPUNPACK_REPO }}
          ref: ${{ env.LPUNPACK_COMMIT }}
          path: lpunpack-tool
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate lpunpack and pinned ROM catalog entry
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C "$GITHUB_WORKSPACE/lpunpack-tool" rev-parse HEAD)" = "$LPUNPACK_COMMIT"
          test "$(git hash-object "$GITHUB_WORKSPACE/lpunpack-tool/lpunpack.py")" = "$LPUNPACK_PY_BLOB"
          python3 -m py_compile "$GITHUB_WORKSPACE/lpunpack-tool/lpunpack.py"

          test "$ROM_ANDROID" = '13.0'
          printf '%s' "$REGION_ID" | grep -Eq '^[a-z]+$'
          printf '%s' "$ROM_CODENAME" | grep -Eq '^veux(_[a-z]+_global|_global)?$'
          printf '%s' "$ROM_VERSION" | grep -Eq '^OS1\.0\.[0-9]+\.0\.TKC[A-Z]+$'
          printf '%s' "$ROM_MD5" | grep -Eq '^[0-9a-f]{32}$'

          git init -q "$WORK_DIR/tracker"
          git -C "$WORK_DIR/tracker" remote add origin "$TRACKER_REPO"
          git -C "$WORK_DIR/tracker" fetch -q --depth=1 origin "$TRACKER_COMMIT"
          git -C "$WORK_DIR/tracker" checkout -q --detach FETCH_HEAD
          test "$(git -C "$WORK_DIR/tracker" rev-parse HEAD)" = "$TRACKER_COMMIT"

          python3 - \
            "$WORK_DIR/tracker/data/latest.yml" \
            "$ROM_CODENAME" "$ROM_VERSION" "$ROM_URL" "$ROM_MD5" \
            "$AUDIT_DIR/01-input-auth.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          source, codename, version, url, md5, output = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          blocks = re.split(r"(?m)^- ", text)
          matches = []
          for raw in blocks:
              block = "- " + raw
              required = (
                  f"codename: {codename}\n",
                  f"version: {version}\n",
                  f"link: {url}\n",
                  f"md5: {md5}\n",
                  "method: Fastboot\n",
                  "branch: Stable\n",
                  "android: '13.0'\n",
              )
              if all(token in block for token in required):
                  matches.append(block)

          if len(matches) != 1:
              raise SystemExit(f"Expected one pinned tracker entry, found {len(matches)}")

          Path(output).write_text(
              "P8V2_INPUT_AUTH=PASS\n"
              f"ROM_CODENAME={codename}\n"
              f"ROM_VERSION={version}\n"
              f"ROM_MD5={md5}\n",
              encoding="utf-8",
          )
          PY

          {
            echo "LPUNPACK_COMMIT=$LPUNPACK_COMMIT"
            echo "LPUNPACK_PY_BLOB=$LPUNPACK_PY_BLOB"
            echo "TRACKER_COMMIT=$TRACKER_COMMIT"
          } >> "$AUDIT_DIR/01-input-auth.txt"

      - name: Download accepted P6-v10-v2 candidate artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.P6V10_V2_ARTIFACT }}
          path: ${{ env.P6_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ env.P6V10_V2_RUN_ID }}

      - name: Authenticate unchanged P6-v10-v2 candidate
        shell: bash
        run: |
          set -euo pipefail

          test -s "$P6_DIR/ARTIFACT-SHA256SUMS"
          (
            cd "$P6_DIR"
            sha256sum -c ARTIFACT-SHA256SUMS \
              > "$AUDIT_DIR/02-p6-artifact-sha256-reverify.txt"
          )

          test -s "$P6_DIR/build-a/Image"
          test -s "$P6_DIR/build-a/veux-5.4.274.base.config"
          test -s "$P6_DIR/07-kernelrelease.txt"
          test -s "$P6_DIR/17-result.txt"

          grep -Fxq "$EXPECTED_P6_RESULT" "$P6_DIR/17-result.txt"
          grep -Fxq "KERNEL_VERSION=$EXPECTED_P6_KERNEL_VERSION" "$P6_DIR/17-result.txt"
          grep -Fxq "P6V10_STOCK_KERNEL_RELEASE=$EXPECTED_P6_STOCK_RELEASE" \
            "$P6_DIR/17-result.txt"

          p6_release="$(tr -d '\r\n' < "$P6_DIR/07-kernelrelease.txt")"
          test "$p6_release" = "$EXPECTED_P6_STOCK_RELEASE"
          [[ "$p6_release" != *%* ]]

          python3 - \
            "$P6_DIR/build-a/veux-5.4.274.base.config" \
            "$P6_DIR/build-a/Image" \
            "$p6_release" \
            "$AUDIT_DIR/02-p6-candidate.json" \
            "$AUDIT_DIR/02-p6-candidate.txt" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          config_path, image_path = map(Path, sys.argv[1:3])
          release = sys.argv[3]
          json_path, text_path = map(Path, sys.argv[4:6])

          config_text = config_path.read_text(encoding="utf-8", errors="strict")

          def config_value(key):
              m = re.search(
                  rf"(?m)^(?:{re.escape(key)}=(.*)|# {re.escape(key)} is not set)$",
                  config_text,
              )
              if not m:
                  return None
              return m.group(1) if m.group(1) is not None else "n"

          keys = [
              "CONFIG_MODULES",
              "CONFIG_MODVERSIONS",
              "CONFIG_MODULE_UNLOAD",
              "CONFIG_MODULE_FORCE_LOAD",
              "CONFIG_MODULE_FORCE_UNLOAD",
              "CONFIG_MODULE_SIG",
              "CONFIG_MODULE_SIG_FORCE",
          ]
          cfg = {key: config_value(key) for key in keys}

          result = {
              "release": release,
              "image_sha256": hashlib.sha256(image_path.read_bytes()).hexdigest(),
              "config_sha256": hashlib.sha256(config_path.read_bytes()).hexdigest(),
              "module_config": cfg,
          }

          json_path.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          text_path.write_text(
              "\n".join(
                  [
                      "P8V2_P6_INPUT_AUTH=PASS",
                      f"P6_KERNEL_RELEASE={release}",
                      f"P6_CONFIG_MODULES={cfg['CONFIG_MODULES']}",
                      f"P6_CONFIG_MODVERSIONS={cfg['CONFIG_MODVERSIONS']}",
                      f"P6_CONFIG_MODULE_UNLOAD={cfg['CONFIG_MODULE_UNLOAD']}",
                      "P6_KERNEL_MUTATED_BY_P8V2=NO",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Stream official ROM and extract module-relevant images
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/p8v2r2-extract-rom.py" <<'PY'
          import json
          import os
          import shutil
          import sys
          import tarfile
          from pathlib import Path

          out_dir = Path(sys.argv[1])
          manifest_path = Path(sys.argv[2])
          wanted = {
              "boot.img",
              "vendor_boot.img",
              "super.img",
              "vendor.img",
              "vendor_dlkm.img",
              "system_dlkm.img",
              "odm.img",
          }

          found = {}
          with tarfile.open(fileobj=sys.stdin.buffer, mode="r|gz") as tf:
              for member in tf:
                  if not member.isfile():
                      continue
                  base = Path(member.name).name
                  if base not in wanted:
                      continue
                  if "/images/" not in "/" + member.name:
                      continue
                  if base in found:
                      raise SystemExit(f"Duplicate selected ROM member: {base}")
                  src = tf.extractfile(member)
                  if src is None:
                      raise SystemExit(f"Could not read {member.name}")
                  dst = out_dir / base
                  with dst.open("wb") as handle:
                      shutil.copyfileobj(src, handle, length=8 * 1024 * 1024)
                  found[base] = {
                      "archive_member": member.name,
                      "bytes": dst.stat().st_size,
                  }

          if "boot.img" not in found:
              raise SystemExit("boot.img not found in official fastboot ROM")
          if "vendor_boot.img" not in found:
              raise SystemExit("vendor_boot.img not found in official fastboot ROM")

          logical_sources = {
              key for key in found
              if key in {"super.img", "vendor.img", "vendor_dlkm.img", "system_dlkm.img", "odm.img"}
          }
          if not logical_sources:
              raise SystemExit("No super or standalone module-bearing partition image found")

          manifest_path.write_text(
              json.dumps(found, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          fifo="$RUNNER_TEMP/p8v2r2-${REGION_ID}-archive.fifo"
          rm -f "$fifo"
          mkfifo "$fifo"

          md5sum < "$fifo" > "$AUDIT_DIR/03-rom-archive-md5.txt" &
          md5_pid=$!

          set +e
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            "$ROM_URL" \
            | tee "$fifo" \
            | python3 "$RUNNER_TEMP/p8v2r2-extract-rom.py" \
                "$ROM_DIR" "$AUDIT_DIR/03-rom-image-members.json"
          pipeline_status=("${PIPESTATUS[@]}")
          wait "$md5_pid"
          md5_status=$?
          set -e

          rm -f "$fifo"

          test "${pipeline_status[0]}" -eq 0
          test "${pipeline_status[1]}" -eq 0
          test "${pipeline_status[2]}" -eq 0
          test "$md5_status" -eq 0

          actual_md5="$(awk '{print $1}' "$AUDIT_DIR/03-rom-archive-md5.txt")"
          test "$actual_md5" = "$ROM_MD5"

          {
            echo "P8V2_OFFICIAL_ROM_AUTH=PASS"
            echo "ROM_REGION=$REGION_NAME"
            echo "ROM_VERSION=$ROM_VERSION"
            echo "ROM_MD5=$actual_md5"
          } > "$AUDIT_DIR/03-rom-auth.txt"

      - name: Extract concrete stock kernel release and module config
        shell: bash
        run: |
          set -euo pipefail

          python3 - \
            "$ROM_DIR/boot.img" \
            "$AUDIT_DIR/04-stock-kernel.json" \
            "$AUDIT_DIR/04-stock-kernel.txt" <<'PY'
          import gzip
          import hashlib
          import io
          import json
          import re
          import struct
          import sys
          from pathlib import Path

          boot_path, json_path, text_path = map(Path, sys.argv[1:])

          def need(value, message):
              if not value:
                  raise SystemExit(message)

          boot = boot_path.read_bytes()
          need(boot[:8] == b"ANDROID!", "Android boot magic missing")
          kernel_size = struct.unpack_from("<I", boot, 8)[0]
          header_version = struct.unpack_from("<I", boot, 40)[0]
          page_size = 4096
          need(header_version == 3, f"unexpected boot header version: {header_version}")
          need(page_size + kernel_size <= len(boot), "kernel payload geometry invalid")
          kernel = boot[page_size:page_size + kernel_size]

          # Avoid the P8-v1 bug: select a concrete numeric Linux release and
          # explicitly reject printf templates such as "Linux version %s (%s)".
          candidates = []
          for match in re.finditer(rb"Linux version ([0-9]+\.[0-9]+\.[0-9]+[^ \x00\n]*)", kernel):
              release = match.group(1).decode("ascii", "strict")
              start = match.start()
              end = kernel.find(b"\x00", start, min(len(kernel), start + 1024))
              if end < 0:
                  end = kernel.find(b"\n", start, min(len(kernel), start + 1024))
              if end < 0:
                  end = min(len(kernel), start + 768)
              banner = kernel[start:end].decode("ascii", "replace")
              if "%" in release or "%s" in banner:
                  continue
              candidates.append((release, banner))

          unique = []
          seen = set()
          for item in candidates:
              if item[0] not in seen:
                  seen.add(item[0])
                  unique.append(item)

          need(len(unique) == 1, f"expected one concrete stock Linux release, got {unique}")
          release, banner = unique[0]

          begin = kernel.find(b"IKCFG_ST")
          end = kernel.find(b"IKCFG_ED", begin + 8)
          need(begin >= 0 and end > begin, "embedded IKCONFIG markers missing")
          blob = kernel[begin + 8:end]
          gz = blob.find(b"\x1f\x8b\x08")
          need(gz >= 0, "IKCONFIG gzip stream missing")
          config = gzip.GzipFile(fileobj=io.BytesIO(blob[gz:])).read()
          config_text = config.decode("utf-8", "replace")

          def config_value(key):
              m = re.search(
                  rf"(?m)^(?:{re.escape(key)}=(.*)|# {re.escape(key)} is not set)$",
                  config_text,
              )
              if not m:
                  return None
              return m.group(1) if m.group(1) is not None else "n"

          keys = [
              "CONFIG_MODULES",
              "CONFIG_MODVERSIONS",
              "CONFIG_MODULE_UNLOAD",
              "CONFIG_MODULE_FORCE_LOAD",
              "CONFIG_MODULE_FORCE_UNLOAD",
              "CONFIG_MODULE_SIG",
              "CONFIG_MODULE_SIG_FORCE",
          ]
          cfg = {key: config_value(key) for key in keys}

          result = {
              "kernel_release": release,
              "kernel_banner": banner,
              "kernel_sha256": hashlib.sha256(kernel).hexdigest(),
              "kernel_bytes": len(kernel),
              "config_sha256": hashlib.sha256(config).hexdigest(),
              "module_config": cfg,
          }

          json_path.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          text_path.write_text(
              "\n".join(
                  [
                      "P8V2_STOCK_KERNEL_CONFIG=PASS",
                      f"STOCK_KERNEL_RELEASE={release}",
                      f"STOCK_CONFIG_MODULES={cfg['CONFIG_MODULES']}",
                      f"STOCK_CONFIG_MODVERSIONS={cfg['CONFIG_MODVERSIONS']}",
                      f"STOCK_CONFIG_MODULE_UNLOAD={cfg['CONFIG_MODULE_UNLOAD']}",
                      f"STOCK_KERNEL_CONFIG_SHA256={result['config_sha256']}",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          PY

          grep -Fxq 'P8V2_STOCK_KERNEL_CONFIG=PASS' "$AUDIT_DIR/04-stock-kernel.txt"
          ! grep -Fq '%s' "$AUDIT_DIR/04-stock-kernel.txt"

      - name: Extract vendor_boot ramdisk fragments read-only
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RAMDISK_DIR/fragments" "$RAMDISK_DIR/roots"

          python3 - \
            "$ROM_DIR/vendor_boot.img" \
            "$RAMDISK_DIR/fragments" \
            "$AUDIT_DIR/05-vendor-boot-layout.json" <<'PY'
          import hashlib
          import json
          import struct
          import sys
          from pathlib import Path

          image_path = Path(sys.argv[1])
          out_dir = Path(sys.argv[2])
          json_path = Path(sys.argv[3])

          data = image_path.read_bytes()
          if data[:8] != b"VNDRBOOT":
              raise SystemExit("vendor_boot magic missing")

          u32 = lambda off: struct.unpack_from("<I", data, off)[0]
          version = u32(8)
          page_size = u32(12)
          total_ramdisk_size = u32(24)
          header_size = u32(2096)
          dtb_size = u32(2100)

          if version not in (3, 4):
              raise SystemExit(f"unsupported vendor_boot header version: {version}")
          if page_size <= 0 or page_size & (page_size - 1):
              raise SystemExit(f"invalid vendor_boot page size: {page_size}")
          if header_size < 2112 or header_size > page_size:
              raise SystemExit(f"invalid vendor_boot header size: {header_size}")

          align = lambda value: (value + page_size - 1) // page_size * page_size
          ramdisk_offset = align(header_size)
          if ramdisk_offset + total_ramdisk_size > len(data):
              raise SystemExit("vendor ramdisk geometry outside image")
          ramdisk_blob = data[ramdisk_offset:ramdisk_offset + total_ramdisk_size]

          fragments = []
          if version == 4:
              table_size = u32(2112)
              entry_count = u32(2116)
              entry_size = u32(2120)
              bootconfig_size = u32(2124)

              table_offset = ramdisk_offset + align(total_ramdisk_size) + align(dtb_size)
              if table_offset + table_size > len(data):
                  raise SystemExit("vendor ramdisk table geometry outside image")
              if entry_count and entry_size < 108:
                  raise SystemExit(f"unexpected vendor ramdisk table entry size: {entry_size}")

              for index in range(entry_count):
                  off = table_offset + index * entry_size
                  if off + 108 > table_offset + table_size:
                      raise SystemExit("vendor ramdisk table entry outside table")
                  size, rel, rtype = struct.unpack_from("<III", data, off)
                  name = data[off + 12:off + 44].split(b"\0", 1)[0].decode("ascii", "replace")
                  if rel + size > len(ramdisk_blob):
                      raise SystemExit("vendor ramdisk fragment outside aggregate blob")
                  fragments.append(
                      {
                          "index": index,
                          "name": name or f"fragment-{index}",
                          "type": rtype,
                          "offset": rel,
                          "size": size,
                          "data": ramdisk_blob[rel:rel + size],
                      }
                  )
          else:
              table_size = entry_count = entry_size = bootconfig_size = 0

          if not fragments:
              fragments = [
                  {
                      "index": 0,
                      "name": "vendor_ramdisk",
                      "type": None,
                      "offset": 0,
                      "size": len(ramdisk_blob),
                      "data": ramdisk_blob,
                  }
              ]

          manifest = {
              "header_version": version,
              "page_size": page_size,
              "header_size": header_size,
              "vendor_ramdisk_size": total_ramdisk_size,
              "dtb_size": dtb_size,
              "vendor_ramdisk_table_size": table_size,
              "vendor_ramdisk_table_entry_num": entry_count,
              "vendor_ramdisk_table_entry_size": entry_size,
              "bootconfig_size": bootconfig_size,
              "fragments": [],
          }

          for item in fragments:
              path = out_dir / f"ramdisk-{item['index']:02d}.bin"
              path.write_bytes(item.pop("data"))
              item["sha256"] = hashlib.sha256(path.read_bytes()).hexdigest()
              item["path"] = path.name
              manifest["fragments"].append(item)

          json_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          unpack_fragment() {
            local src="$1"
            local root="$2"
            local cpio_file="$RUNNER_TEMP/$(basename "$src").cpio"
            local magic6
            local magic4

            rm -rf "$root"
            mkdir -p "$root"
            rm -f "$cpio_file"

            magic6="$(head -c 6 "$src" | xxd -p -c 32)"
            magic4="$(head -c 4 "$src" | xxd -p -c 32)"

            case "$magic6" in
              303730373031|303730373032)
                cp "$src" "$cpio_file"
                ;;
              *)
                case "$magic4" in
                  1f8b08*)
                    gzip -dc "$src" > "$cpio_file"
                    ;;
                  02214c18|04224d18)
                    lz4 -dc "$src" > "$cpio_file"
                    ;;
                  28b52ffd)
                    zstd -dc "$src" > "$cpio_file"
                    ;;
                  fd377a58)
                    xz -dc "$src" > "$cpio_file"
                    ;;
                  *)
                    echo "::error::Unsupported vendor ramdisk compression for $src: $(file -b "$src")"
                    return 1
                    ;;
                esac
                ;;
            esac

            test -s "$cpio_file"
            (
              cd "$root"
              cpio -idm --quiet --no-absolute-filenames < "$cpio_file"
            )
          }

          fragment_count=0
          while IFS= read -r fragment; do
            root="$RAMDISK_DIR/roots/$(basename "$fragment" .bin)"
            unpack_fragment "$fragment" "$root"
            printf 'vendor_boot:%s\t%s\n' "$(basename "$fragment" .bin)" "$root" >> "$ROOTS_TSV"
            fragment_count=$((fragment_count + 1))
          done < <(find "$RAMDISK_DIR/fragments" -type f -name 'ramdisk-*.bin' | sort)

          test "$fragment_count" -ge 1
          echo "VENDOR_RAMDISK_FRAGMENT_COUNT=$fragment_count" \
            > "$AUDIT_DIR/05-vendor-ramdisk-extract.txt"

      - name: Unpack super and mount module-bearing partitions read-only
        shell: bash
        run: |
          set -euo pipefail

          cleanup_mounts() {
            set +e
            if [ -d "$MOUNT_DIR" ]; then
              find "$MOUNT_DIR" -mindepth 1 -maxdepth 1 -type d -print0 \
                | while IFS= read -r -d '' mnt; do
                    mountpoint -q "$mnt" && sudo umount "$mnt"
                  done
            fi
          }
          trap cleanup_mounts EXIT

          python_lpunpack="$GITHUB_WORKSPACE/lpunpack-tool/lpunpack.py"
          test -s "$python_lpunpack"

          if [ -s "$ROM_DIR/super.img" ]; then
            python3 "$python_lpunpack" --info -f json "$ROM_DIR/super.img" \
              > "$AUDIT_DIR/06-super-info.raw.txt"

            python3 - \
              "$AUDIT_DIR/06-super-info.raw.txt" \
              "$AUDIT_DIR/06-super-selected-partitions.txt" \
              "$AUDIT_DIR/06-super-partition-schema.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          raw_path = Path(sys.argv[1])
          selected_path = Path(sys.argv[2])
          schema_path = Path(sys.argv[3])

          raw = raw_path.read_text(encoding="utf-8", errors="replace")
          start = raw.find("{")
          end = raw.rfind("}")
          if start < 0 or end <= start:
              raise SystemExit("lpunpack JSON metadata not found")

          data = json.loads(raw[start:end + 1])
          partitions = data.get("partitions")
          if not isinstance(partitions, list):
              raise SystemExit(
                  "rendered lpunpack JSON does not contain the expected 'partitions' list"
              )

          names = []
          for item in partitions:
              if not isinstance(item, dict):
                  continue
              name = item.get("name")
              if isinstance(name, str) and re.fullmatch(
                  r"(?:vendor|vendor_dlkm|system_dlkm|odm)(?:_[ab])?", name
              ):
                  names.append(name)

          names = sorted(set(names))
          if not any(
              name in {"vendor", "vendor_a", "vendor_b"} for name in names
          ):
              raise SystemExit(
                  f"no vendor logical partition found in lpunpack metadata: {names}"
              )

          selected_path.write_text(
              "\n".join(names) + "\n",
              encoding="utf-8",
          )
          schema_path.write_text(
              json.dumps(
                  {
                      "rendered_json_key": "partitions",
                      "selected_partitions": names,
                      "selected_count": len(names),
                      "vendor_partition_present": True,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

            if [ -s "$AUDIT_DIR/06-super-selected-partitions.txt" ]; then
              selected="$(paste -sd, "$AUDIT_DIR/06-super-selected-partitions.txt")"
              python3 "$python_lpunpack" \
                -p "$selected" \
                "$ROM_DIR/super.img" \
                "$LOGICAL_DIR"
            fi
          fi

          # Include standalone images if Xiaomi supplied any outside super.
          for name in vendor vendor_dlkm system_dlkm odm; do
            if [ -s "$ROM_DIR/${name}.img" ]; then
              cp "$ROM_DIR/${name}.img" "$LOGICAL_DIR/standalone-${name}.img"
            fi
          done

          normalize_and_mount() {
            local img="$1"
            local label="$2"
            local normalized="$img"
            local description
            local fstype
            local mountpoint_dir="$MOUNT_DIR/$label"

            if [ ! -s "$img" ]; then
              printf '%s\tEMPTY_INACTIVE_SLOT\t0\t-\n' "$label" \
                >> "$AUDIT_DIR/06-partition-scan-state.tsv"
              return 2
            fi

            description="$(file -b "$img")"
            if grep -qi 'Android sparse image' <<<"$description"; then
              normalized="$WORK_DIR/normalized-${label}.img"
              simg2img "$img" "$normalized"
              if [ ! -s "$normalized" ]; then
                printf '%s\tEMPTY_AFTER_UNSPARSE\t0\t-\n' "$label" \
                  >> "$AUDIT_DIR/06-partition-scan-state.tsv"
                return 2
              fi
            fi

            fstype="$(blkid -p -s TYPE -o value "$normalized" 2>/dev/null || true)"
            mkdir -p "$mountpoint_dir"

            case "$fstype" in
              ext4)
                sudo mount -t ext4 -o loop,ro,noload "$normalized" "$mountpoint_dir"
                ;;
              erofs)
                sudo mount -t erofs -o loop,ro "$normalized" "$mountpoint_dir"
                ;;
              f2fs)
                sudo mount -t f2fs -o loop,ro "$normalized" "$mountpoint_dir"
                ;;
              *)
                echo "::error::Non-empty selected logical partition has unsupported filesystem '$fstype': $img ($description)"
                return 1
                ;;
            esac

            mountpoint -q "$mountpoint_dir"
            printf 'partition:%s\t%s\n' "$label" "$mountpoint_dir" >> "$ROOTS_TSV"
            printf '%s\t%s\t%s\t%s\n' \
              "$label" "$fstype" "$(stat -c '%s' "$normalized")" "$(sha256sum "$normalized" | awk '{print $1}')" \
              >> "$AUDIT_DIR/06-mounted-partitions.tsv"
            printf '%s\tMOUNTED_READ_ONLY\t%s\t%s\n' \
              "$label" "$(stat -c '%s' "$normalized")" "$fstype" \
              >> "$AUDIT_DIR/06-partition-scan-state.tsv"
            return 0
          }

          : > "$AUDIT_DIR/06-mounted-partitions.tsv"
          : > "$AUDIT_DIR/06-partition-scan-state.tsv"

          mapfile -t logical_images < <(
            find "$LOGICAL_DIR" -maxdepth 1 -type f -name '*.img' -print | sort
          )
          test "${#logical_images[@]}" -ge 1

          mounted_count=0
          vendor_mounted_count=0
          empty_slot_count=0

          for img in "${logical_images[@]}"; do
            base="$(basename "$img" .img)"
            safe="$(printf '%s' "$base" | tr -c 'A-Za-z0-9._-' '_')"

            set +e
            normalize_and_mount "$img" "$safe"
            mount_rc=$?
            set -e

            case "$mount_rc" in
              0)
                mounted_count=$((mounted_count + 1))
                case "$base" in
                  vendor|vendor_a|vendor_b|standalone-vendor)
                    vendor_mounted_count=$((vendor_mounted_count + 1))
                    ;;
                esac
                ;;
              2)
                empty_slot_count=$((empty_slot_count + 1))
                ;;
              *)
                exit "$mount_rc"
                ;;
            esac
          done

          test "$mounted_count" -ge 1
          test "$vendor_mounted_count" -ge 1
          test -s "$ROOTS_TSV"

          {
            echo "P8V2_R2_LOGICAL_PARTITION_EXTRACTION=PASS"
            echo "LOGICAL_IMAGE_COUNT=${#logical_images[@]}"
            echo "MOUNTED_PARTITION_COUNT=$mounted_count"
            echo "VENDOR_MOUNTED_COUNT=$vendor_mounted_count"
            echo "EMPTY_INACTIVE_SLOT_COUNT=$empty_slot_count"
          } > "$AUDIT_DIR/06-logical-partition-gate.txt"

          # Keep mounts alive while the collector runs in this same shell step.
          cat > "$RUNNER_TEMP/p8v2r2-module-collector.py" <<'PY'
          import gzip
          import hashlib
          import json
          import lzma
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          roots_file = Path(sys.argv[1])
          stock_json = Path(sys.argv[2])
          candidate_json = Path(sys.argv[3])
          output_dir = Path(sys.argv[4])
          region_id = os.environ["REGION_ID"]
          region_name = os.environ["REGION_NAME"]
          rom_version = os.environ["ROM_VERSION"]

          stock = json.loads(stock_json.read_text(encoding="utf-8"))
          candidate = json.loads(candidate_json.read_text(encoding="utf-8"))

          roots = []
          for line in roots_file.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              label, path = line.split("\t", 1)
              root = Path(path)
              if not root.is_dir():
                  raise SystemExit(f"declared root missing: {label}: {path}")
              roots.append((label, root))

          if not roots:
              raise SystemExit("no module-bearing roots available")

          def sha_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def run(args, check=False, text=True):
              return subprocess.run(
                  args,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=text,
                  check=check,
              )

          def decompress_module(path, temp_dir):
              name = path.name
              dst = temp_dir / re.sub(r"\.(xz|gz|zst)$", "", name)
              if name.endswith(".xz"):
                  dst.write_bytes(lzma.decompress(path.read_bytes()))
                  return dst
              if name.endswith(".gz"):
                  dst.write_bytes(gzip.decompress(path.read_bytes()))
                  return dst
              if name.endswith(".zst"):
                  proc = subprocess.run(
                      ["zstd", "-dc", str(path)],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=False,
                  )
                  if proc.returncode != 0:
                      raise SystemExit(
                          f"zstd module decompression failed for {path}: "
                          + proc.stderr.decode("utf-8", "replace")
                      )
                  dst.write_bytes(proc.stdout)
                  return dst
              return path

          module_pattern = re.compile(r"\.ko(?:\.(?:xz|gz|zst))?$")
          modules = []
          load_manifests = []
          rc_commands = []
          small_text_limit = 4 * 1024 * 1024

          with tempfile.TemporaryDirectory(prefix="p8v2r2-modules-") as td:
              temp_dir = Path(td)

              for label, root in roots:
                  for dirpath, dirnames, filenames in os.walk(root):
                      # Avoid paths that cannot contain module policy and would
                      # explode scan time on product/system trees.
                      dirnames[:] = [
                          d for d in dirnames
                          if d not in {"lost+found"}
                      ]
                      current = Path(dirpath)

                      for filename in filenames:
                          path = current / filename
                          try:
                              rel = path.relative_to(root).as_posix()
                          except ValueError:
                              continue

                          if module_pattern.search(filename):
                              try:
                                  raw = path.read_bytes()
                              except OSError as exc:
                                  raise SystemExit(f"cannot read module {label}:{rel}: {exc}")

                              elf = decompress_module(path, temp_dir)
                              elf_data = elf.read_bytes()
                              if not elf_data.startswith(b"\x7fELF"):
                                  raise SystemExit(f"module is not ELF after decompression: {label}:{rel}")

                              def modinfo(field):
                                  proc = run(["modinfo", "-F", field, str(elf)])
                                  if proc.returncode != 0:
                                      return None
                                  value = proc.stdout.strip()
                                  return value or None

                              sec = run(["readelf", "-SW", str(elf)])
                              if sec.returncode != 0:
                                  raise SystemExit(f"readelf failed for {label}:{rel}: {sec.stderr}")
                              has_versions = re.search(r"\b__versions\b", sec.stdout) is not None

                              symbols = run(["readelf", "-Ws", str(elf)])
                              if symbols.returncode != 0:
                                  raise SystemExit(
                                      f"readelf -Ws failed for {label}:{rel}: {symbols.stderr}"
                                  )
                              undefined_symbols = set()
                              for line in symbols.stdout.splitlines():
                                  parts = line.split()
                                  if len(parts) >= 8 and parts[6] == "UND" and parts[7]:
                                      undefined_symbols.add(parts[7])
                              undefined_symbols = sorted(undefined_symbols)

                              mv = run(["modprobe", "--show-modversions", str(elf)])
                              modversion_lines = []
                              if mv.returncode == 0:
                                  modversion_lines = sorted(
                                      line.strip()
                                      for line in mv.stdout.splitlines()
                                      if line.strip()
                                  )
                              elif has_versions:
                                  raise SystemExit(
                                      f"__versions exists but modprobe could not extract CRCs "
                                      f"for {label}:{rel}: {mv.stderr.strip()}"
                                  )

                              vermagic = modinfo("vermagic")
                              vermagic_release = vermagic.split()[0] if vermagic else None
                              modules.append(
                                  {
                                      "source": label,
                                      "path": rel,
                                      "filename": filename,
                                      "name": modinfo("name"),
                                      "file_sha256": sha_bytes(raw),
                                      "elf_sha256": sha_bytes(elf_data),
                                      "bytes": len(raw),
                                      "vermagic": vermagic,
                                      "vermagic_release": vermagic_release,
                                      "depends": modinfo("depends"),
                                      "signer": modinfo("signer"),
                                      "sig_hashalgo": modinfo("sig_hashalgo"),
                                      "has___versions": has_versions,
                                      "modversion_entry_count": len(modversion_lines),
                                      "modversions_sha256": sha_bytes(
                                          ("\n".join(modversion_lines) + ("\n" if modversion_lines else "")).encode()
                                      ),
                                      "undefined_symbol_count": len(undefined_symbols),
                                      "undefined_symbols_sha256": sha_bytes(
                                          ("\n".join(undefined_symbols) + ("\n" if undefined_symbols else "")).encode()
                                      ),
                                  }
                              )

                          if filename.startswith("modules.load"):
                              try:
                                  text = path.read_text(encoding="utf-8", errors="replace")
                              except OSError as exc:
                                  raise SystemExit(f"cannot read load manifest {label}:{rel}: {exc}")
                              entries = []
                              for raw_line in text.splitlines():
                                  line = raw_line.split("#", 1)[0].strip()
                                  if line:
                                      entries.append(line)
                              load_manifests.append(
                                  {
                                      "source": label,
                                      "path": rel,
                                      "entries": entries,
                                      "sha256": sha_bytes(path.read_bytes()),
                                  }
                              )

                          if filename.endswith(".rc"):
                              try:
                                  if path.stat().st_size > small_text_limit:
                                      continue
                                  text = path.read_text(encoding="utf-8", errors="replace")
                              except OSError:
                                  continue
                              for number, raw_line in enumerate(text.splitlines(), 1):
                                  stripped = raw_line.strip()
                                  if re.search(r"(^|\s)(insmod|modprobe)(\s|$)", stripped):
                                      rc_commands.append(
                                          {
                                              "source": label,
                                              "path": rel,
                                              "line": number,
                                              "command": stripped,
                                          }
                                      )

          modules.sort(key=lambda item: (item["source"], item["path"]))
          load_manifests.sort(key=lambda item: (item["source"], item["path"]))
          rc_commands.sort(key=lambda item: (item["source"], item["path"], item["line"]))

          manifest_entries = []
          for manifest in load_manifests:
              manifest_entries.extend(
                  f"{manifest['source']}:{manifest['path']}:{entry}"
                  for entry in manifest["entries"]
              )

          declared_load_lines = sorted(
              manifest_entries
              + [
                  f"{item['source']}:{item['path']}:{item['line']}:{item['command']}"
                  for item in rc_commands
              ]
          )

          module_abi_lines = sorted(
              "|".join(
                  [
                      item.get("name") or item["filename"],
                      item.get("vermagic") or "",
                      str(item["has___versions"]),
                      item["modversions_sha256"],
                      item["undefined_symbols_sha256"],
                  ]
              )
              for item in modules
          )

          module_content_lines = sorted(
              f"{item['filename']}|{item['file_sha256']}" for item in modules
          )

          vermagic_releases = sorted(
              {item["vermagic_release"] for item in modules if item["vermagic_release"]}
          )
          modules_with_versions = sum(item["has___versions"] for item in modules)
          modules_with_crc_entries = sum(item["modversion_entry_count"] > 0 for item in modules)
          total_crc_entries = sum(item["modversion_entry_count"] for item in modules)
          declared_load_count = len(declared_load_lines)

          stock_cfg = stock["module_config"]
          cand_cfg = candidate["module_config"]
          stock_declares_module_loading = declared_load_count > 0
          stock_ships_modules = len(modules) > 0
          modversions_evidence = (
              stock_cfg.get("CONFIG_MODVERSIONS") == "y"
              or modules_with_versions > 0
              or modules_with_crc_entries > 0
              or any(
                  item.get("vermagic") and "modversions" in item["vermagic"].split()
                  for item in modules
              )
          )

          exact_vermagic_stock = all(
              release == stock["kernel_release"] for release in vermagic_releases
          ) if vermagic_releases else None

          candidate_release_matches_stock = (
              candidate["release"] == stock["kernel_release"]
          )
          candidate_modules_enabled = cand_cfg.get("CONFIG_MODULES") == "y"
          candidate_modversions_enabled = cand_cfg.get("CONFIG_MODVERSIONS") == "y"

          if stock_declares_module_loading and not candidate_modules_enabled:
              classification = "DECLARED_MODULE_LOAD_CONTRACT_MISMATCH"
          elif (
              stock_declares_module_loading
              and modversions_evidence
              and not candidate_modversions_enabled
          ):
              classification = "DECLARED_MODVERSION_CONTRACT_MISMATCH"
          elif not candidate_release_matches_stock:
              classification = "KERNEL_RELEASE_FAMILY_MISMATCH"
          elif stock_ships_modules:
              classification = "MODULE_ABI_EVIDENCE_REQUIRES_REVIEW"
          else:
              classification = "NO_EXTERNAL_MODULES_FOUND_IN_AUDITED_ROOTS"

          result = {
              "schema": 2,
              "stage": "CLEAN_GEN1_P8_V2",
              "retry": "R2",
              "r1_run_id": "33671122557",
              "region": {
                  "id": region_id,
                  "name": region_name,
                  "version": rom_version,
              },
              "stock": stock,
              "candidate": candidate,
              "roots": [{"source": label, "path": str(root)} for label, root in roots],
              "module_inventory": {
                  "module_file_count": len(modules),
                  "module_content_set_sha256": sha_bytes(
                      ("\n".join(module_content_lines) + ("\n" if module_content_lines else "")).encode()
                  ),
                  "module_abi_set_sha256": sha_bytes(
                      ("\n".join(module_abi_lines) + ("\n" if module_abi_lines else "")).encode()
                  ),
                  "vermagic_releases": vermagic_releases,
                  "all_vermagic_releases_equal_stock_release": exact_vermagic_stock,
                  "modules_with___versions": modules_with_versions,
                  "modules_with_modversion_crc_entries": modules_with_crc_entries,
                  "total_modversion_crc_entries": total_crc_entries,
                  "modules": modules,
              },
              "load_contract": {
                  "modules_load_manifest_count": len(load_manifests),
                  "modules_load_entry_count": sum(
                      len(item["entries"]) for item in load_manifests
                  ),
                  "init_rc_module_command_count": len(rc_commands),
                  "declared_load_line_count": declared_load_count,
                  "load_contract_sha256": sha_bytes(
                      ("\n".join(declared_load_lines) + ("\n" if declared_load_lines else "")).encode()
                  ),
                  "manifests": load_manifests,
                  "rc_commands": rc_commands,
              },
              "assessment": {
                  "stock_ships_external_modules": stock_ships_modules,
                  "stock_declares_runtime_module_loading": stock_declares_module_loading,
                  "stock_modversions_evidence": modversions_evidence,
                  "candidate_release_matches_stock": candidate_release_matches_stock,
                  "candidate_modules_enabled": candidate_modules_enabled,
                  "candidate_modversions_enabled": candidate_modversions_enabled,
                  "classification": classification,
                  "automatic_repair_authorized": False,
                  "kernel_change_authorized": False,
                  "device_boot_failure_proven": False,
                  "device_compatibility_proven": False,
                  "p9_release_authorized": False,
              },
          }

          output_dir.mkdir(parents=True, exist_ok=True)
          (output_dir / "region-module-abi.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          with (output_dir / "modules.tsv").open("w", encoding="utf-8") as handle:
              handle.write(
                  "source\tpath\tname\tsha256\tvermagic\thas___versions\t"
                  "modversion_entry_count\tundefined_symbol_count\n"
              )
              for item in modules:
                  fields = [
                      item["source"],
                      item["path"],
                      item.get("name") or "",
                      item["file_sha256"],
                      item.get("vermagic") or "",
                      "YES" if item["has___versions"] else "NO",
                      str(item["modversion_entry_count"]),
                      str(item["undefined_symbol_count"]),
                  ]
                  handle.write("\t".join(field.replace("\t", " ") for field in fields) + "\n")

          (output_dir / "module-load-evidence.txt").write_text(
              "\n".join(declared_load_lines) + ("\n" if declared_load_lines else ""),
              encoding="utf-8",
          )

          summary = [
              "P8V2_REGION_MODULE_ABI_AUDIT=PASS",
              f"REGION_ID={region_id}",
              f"ROM_VERSION={rom_version}",
              f"STOCK_KERNEL_RELEASE={stock['kernel_release']}",
              f"P6_KERNEL_RELEASE={candidate['release']}",
              f"STOCK_CONFIG_MODULES={stock_cfg.get('CONFIG_MODULES')}",
              f"STOCK_CONFIG_MODVERSIONS={stock_cfg.get('CONFIG_MODVERSIONS')}",
              f"P6_CONFIG_MODULES={cand_cfg.get('CONFIG_MODULES')}",
              f"P6_CONFIG_MODVERSIONS={cand_cfg.get('CONFIG_MODVERSIONS')}",
              f"MODULE_FILE_COUNT={len(modules)}",
              f"MODULES_LOAD_ENTRY_COUNT={result['load_contract']['modules_load_entry_count']}",
              f"INIT_RC_MODULE_COMMAND_COUNT={len(rc_commands)}",
              f"DECLARED_LOAD_LINE_COUNT={declared_load_count}",
              f"MODULES_WITH___VERSIONS={modules_with_versions}",
              f"MODULES_WITH_MODVERSION_CRC_ENTRIES={modules_with_crc_entries}",
              f"TOTAL_MODVERSION_CRC_ENTRIES={total_crc_entries}",
              "VERMAGIC_RELEASES=" + ",".join(vermagic_releases),
              f"STOCK_SHIPS_EXTERNAL_MODULES={'YES' if stock_ships_modules else 'NO'}",
              f"STOCK_DECLARES_RUNTIME_MODULE_LOADING={'YES' if stock_declares_module_loading else 'NO'}",
              f"STOCK_MODVERSIONS_EVIDENCE={'YES' if modversions_evidence else 'NO'}",
              f"CANDIDATE_RELEASE_MATCHES_STOCK={'YES' if candidate_release_matches_stock else 'NO'}",
              f"P8V2_REGION_CLASSIFICATION={classification}",
              "AUTOMATIC_REPAIR_AUTHORIZED=NO",
              "KERNEL_CHANGE_AUTHORIZED=NO",
              "DEVICE_BOOT_FAILURE_PROVEN=NO",
              "DEVICE_COMPATIBILITY_PROVEN=NO",
              "P9_RELEASE_AUTHORIZED=NO",
          ]
          (output_dir / "07-region-summary.txt").write_text(
              "\n".join(summary) + "\n",
              encoding="utf-8",
          )
          PY

          sudo -E python3 "$RUNNER_TEMP/p8v2r2-module-collector.py" \
            "$ROOTS_TSV" \
            "$AUDIT_DIR/04-stock-kernel.json" \
            "$AUDIT_DIR/02-p6-candidate.json" \
            "$AUDIT_DIR"

          grep -Fxq 'P8V2_REGION_MODULE_ABI_AUDIT=PASS' "$AUDIT_DIR/07-region-summary.txt"
          grep -Fxq 'AUTOMATIC_REPAIR_AUTHORIZED=NO' "$AUDIT_DIR/07-region-summary.txt"
          grep -Fxq 'KERNEL_CHANGE_AUTHORIZED=NO' "$AUDIT_DIR/07-region-summary.txt"
          grep -Fxq 'P9_RELEASE_AUTHORIZED=NO' "$AUDIT_DIR/07-region-summary.txt"

          cleanup_mounts
          trap - EXIT

      - name: Close regional evidence package
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$AUDIT_DIR"

          {
            echo "JOB_STATUS=${{ job.status }}"
            echo "REGION_ID=$REGION_ID"
            echo "REGION_NAME=$REGION_NAME"
            echo "ROM_VERSION=$ROM_VERSION"
            echo "ROM_MD5=$ROM_MD5"
            echo "P6V10_V2_RUN_ID=$P6V10_V2_RUN_ID"
            echo "P8V2_R1_RUN_ID=$P8V2_R1_RUN_ID"
            echo "P8V2_R2_FIX=$P8V2_R2_FIX"
            echo "KERNEL_SOURCE_MUTATED=NO"
            echo "KERNEL_BUILD_PERFORMED=NO"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
            echo "AUTOMATIC_REPAIR_AUTHORIZED=NO"
            echo "P9_RELEASE_AUTHORIZED=NO"
          } > "$AUDIT_DIR/99-job-end-state.txt"

          (
            cd "$AUDIT_DIR" || exit 1
            find . -type f \
              ! -name 'FILES.txt' \
              ! -name 'SHA256SUMS' \
              ! -name 'SHA256SUMS.verify.txt' \
              -printf '%P\n' | sort > FILES.txt
            while IFS= read -r file; do
              sha256sum "$file"
            done < FILES.txt > SHA256SUMS
            sha256sum -c SHA256SUMS > SHA256SUMS.verify.txt
          )
          exit 0

      - name: Upload regional module ABI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-${{ matrix.id }}-${{ github.run_id }}
          path: ${{ env.AUDIT_DIR }}/
          if-no-files-found: error
          retention-days: 90

  aggregate-module-abi-matrix:
    name: Aggregate VEUX Android 13 module ABI matrix
    needs: regional-module-audit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WORK_DIR: ${{ github.workspace }}/p8v2r2-aggregate
      INPUT_DIR: ${{ github.workspace }}/p8v2r2-aggregate/regions
      OUTPUT_DIR: ${{ github.workspace }}/p8v2r2-aggregate/output

    steps:
      - name: Initialize aggregate evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR"
          mkdir -p "$INPUT_DIR" "$OUTPUT_DIR"

      - name: Download all regional evidence
        uses: actions/download-artifact@v7
        with:
          pattern: clean-gen1-p8v2r2-veux-a13-module-abi-*-${{ github.run_id }}
          path: ${{ env.INPUT_DIR }}
          merge-multiple: false

      - name: Build fail-closed module ABI matrix
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$INPUT_DIR" "$OUTPUT_DIR" <<'PY'
          import json
          import sys
          from collections import defaultdict
          from pathlib import Path

          input_dir = Path(sys.argv[1])
          output_dir = Path(sys.argv[2])
          expected = {
              "global", "eea", "china", "indonesia", "india",
              "japan", "russia", "turkey", "taiwan",
          }

          documents = []
          for path in sorted(input_dir.glob("**/region-module-abi.json")):
              documents.append(json.loads(path.read_text(encoding="utf-8")))

          found = {doc["region"]["id"] for doc in documents}
          missing = sorted(expected - found)
          extra = sorted(found - expected)

          if missing or extra or len(documents) != 9:
              diagnostic = {
                  "stage": "CLEAN_GEN1_P8_V2",
              "retry": "R2",
              "r1_run_id": "33671122557",
                  "result": "INCOMPLETE_REGIONAL_EVIDENCE",
                  "regions_expected": sorted(expected),
                  "regions_found": sorted(found),
                  "missing": missing,
                  "extra": extra,
                  "document_count": len(documents),
                  "automatic_repair_authorized": False,
                  "kernel_change_authorized": False,
                  "p9_release_authorized": False,
              }
              (output_dir / "P8V2-INCOMPLETE.json").write_text(
                  json.dumps(diagnostic, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              raise SystemExit(
                  f"Incomplete regional evidence: missing={missing}, extra={extra}, "
                  f"documents={len(documents)}"
              )

          candidate_releases = {doc["candidate"]["release"] for doc in documents}
          candidate_hashes = {doc["candidate"]["image_sha256"] for doc in documents}
          if len(candidate_releases) != 1 or len(candidate_hashes) != 1:
              raise SystemExit("P6-v10-v2 candidate differs between region jobs")

          def group(field_getter):
              values = defaultdict(list)
              for doc in documents:
                  values[str(field_getter(doc))].append(doc["region"]["id"])
              return {
                  key: sorted(value)
                  for key, value in sorted(values.items())
              }

          classifications = group(lambda d: d["assessment"]["classification"])
          stock_release_groups = group(lambda d: d["stock"]["kernel_release"])
          module_abi_groups = group(
              lambda d: d["module_inventory"]["module_abi_set_sha256"]
          )
          module_content_groups = group(
              lambda d: d["module_inventory"]["module_content_set_sha256"]
          )
          load_contract_groups = group(
              lambda d: d["load_contract"]["load_contract_sha256"]
          )

          declared_load_regions = sorted(
              doc["region"]["id"]
              for doc in documents
              if doc["assessment"]["stock_declares_runtime_module_loading"]
          )
          external_module_regions = sorted(
              doc["region"]["id"]
              for doc in documents
              if doc["assessment"]["stock_ships_external_modules"]
          )
          modversion_regions = sorted(
              doc["region"]["id"]
              for doc in documents
              if doc["assessment"]["stock_modversions_evidence"]
          )
          candidate_module_mismatch_regions = sorted(
              doc["region"]["id"]
              for doc in documents
              if doc["assessment"]["classification"]
              == "DECLARED_MODULE_LOAD_CONTRACT_MISMATCH"
          )
          release_family_mismatch_regions = sorted(
              doc["region"]["id"]
              for doc in documents
              if not doc["assessment"]["candidate_release_matches_stock"]
          )

          if candidate_module_mismatch_regions:
              conclusion = "P6V10_V2_CANNOT_SATISFY_DECLARED_STOCK_MODULE_LOAD_PATHS_AS_BUILT"
          elif release_family_mismatch_regions:
              conclusion = "REGIONAL_KERNEL_RELEASE_FAMILIES_DIFFER"
          elif external_module_regions:
              conclusion = "MODULE_ABI_EVIDENCE_REQUIRES_REVIEW_BEFORE_ANY_KERNEL_CHANGE"
          else:
              conclusion = "NO_EXTERNAL_MODULE_RUNTIME_REQUIREMENT_FOUND_IN_AUDITED_ROOTS"

          matrix = {
              "schema": 2,
              "stage": "CLEAN_GEN1_P8_V2",
              "retry": "R2",
              "r1_run_id": "33671122557",
              "regions_expected": sorted(expected),
              "regions_audited": sorted(found),
              "candidate_release": next(iter(candidate_releases)),
              "candidate_image_sha256": next(iter(candidate_hashes)),
              "groups": {
                  "stock_kernel_release": stock_release_groups,
                  "module_abi_fingerprint": module_abi_groups,
                  "module_content_fingerprint": module_content_groups,
                  "load_contract_fingerprint": load_contract_groups,
                  "classification": classifications,
              },
              "regions_with_external_modules": external_module_regions,
              "regions_with_declared_module_loading": declared_load_regions,
              "regions_with_modversion_evidence": modversion_regions,
              "regions_with_candidate_module_load_mismatch": candidate_module_mismatch_regions,
              "regions_with_candidate_release_mismatch": release_family_mismatch_regions,
              "conclusion": conclusion,
              "claims": {
                  "kernel_source_mutated": False,
                  "kernel_build_performed": False,
                  "boot_image_created": False,
                  "flashable_zip_created": False,
                  "device_accessed": False,
                  "flashing_performed": False,
                  "automatic_repair_authorized": False,
                  "kernel_change_authorized": False,
                  "device_boot_failure_proven": False,
                  "device_compatibility_proven": False,
                  "p9_release_authorized": False,
              },
          }

          (output_dir / "P8V2-MODULE-ABI-MATRIX.json").write_text(
              json.dumps(matrix, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          headers = [
              "Region",
              "ROM",
              "Stock kernel",
              "Modules",
              "Load entries",
              "CRC modules",
              "P6 modules",
              "Classification",
          ]
          lines = [
              "# CLEAN GEN1 P8 v2 - VEUX Android 13 module/ABI investigation",
              "",
              "| " + " | ".join(headers) + " |",
              "| " + " | ".join(["---"] * len(headers)) + " |",
          ]
          for doc in sorted(documents, key=lambda d: d["region"]["id"]):
              lines.append(
                  "| "
                  + " | ".join(
                      [
                          doc["region"]["name"],
                          doc["region"]["version"],
                          doc["stock"]["kernel_release"],
                          str(doc["module_inventory"]["module_file_count"]),
                          str(doc["load_contract"]["declared_load_line_count"]),
                          str(doc["module_inventory"]["modules_with_modversion_crc_entries"]),
                          str(doc["candidate"]["module_config"].get("CONFIG_MODULES")),
                          doc["assessment"]["classification"],
                      ]
                  )
                  + " |"
              )

          lines.extend(
              [
                  "",
                  "## Mandatory interpretation",
                  "",
                  "- This is a read-only investigation. No kernel or boot image was modified.",
                  "- A modules.load/init declaration proves a stock load path exists; it does not by itself prove a device boot failure.",
                  "- CONFIG_MODULES=n cannot service a module load request if that path executes.",
                  "- Module vermagic/CRC evidence is recorded before any decision to alter the kernel configuration.",
                  "- EEA remains a separate stock kernel-release family when its concrete release differs.",
                  "- No automatic repair, kernel change, device compatibility, or P9 release is authorized here.",
              ]
          )
          (output_dir / "P8V2-MODULE-ABI-MATRIX.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          result_lines = [
              "CLEAN_GEN1_P8_V2_MODULE_ABI_INVESTIGATION=PASS",
              "P8V2_RETRY=R2",
              "P8V2_R1_FAILURE=WORKFLOW_PYTHON_HEREDOC_INDENTATION",
              "REGION_COUNT=9",
              f"REGIONS_WITH_EXTERNAL_MODULES={len(external_module_regions)}",
              f"REGIONS_WITH_DECLARED_MODULE_LOADING={len(declared_load_regions)}",
              f"REGIONS_WITH_MODVERSION_EVIDENCE={len(modversion_regions)}",
              f"REGIONS_WITH_P6_MODULE_LOAD_MISMATCH={len(candidate_module_mismatch_regions)}",
              f"REGIONS_WITH_P6_RELEASE_MISMATCH={len(release_family_mismatch_regions)}",
              f"P8V2_CONCLUSION={conclusion}",
              "KERNEL_SOURCE_MUTATED=NO",
              "KERNEL_BUILD_PERFORMED=NO",
              "BOOT_IMAGE_CREATED=NO",
              "FLASHABLE_ZIP_CREATED=NO",
              "DEVICE_ACCESSED=NO",
              "FLASHING_PERFORMED=NO",
              "AUTOMATIC_REPAIR_AUTHORIZED=NO",
              "KERNEL_CHANGE_AUTHORIZED=NO",
              "DEVICE_BOOT_FAILURE_PROVEN=NO",
              "DEVICE_COMPATIBILITY_PROVEN=NO",
              "P9_RELEASE_AUTHORIZED=NO",
              "NEXT_STAGE=REVIEW_P8V2_MODULE_ABI_EVIDENCE_BEFORE_ANY_KERNEL_CONFIG_CHANGE",
          ]
          (output_dir / "P8V2-RESULT.txt").write_text(
              "\n".join(result_lines) + "\n",
              encoding="utf-8",
          )
          PY

          grep -Fxq 'CLEAN_GEN1_P8_V2_MODULE_ABI_INVESTIGATION=PASS' \
            "$OUTPUT_DIR/P8V2-RESULT.txt"
          grep -Fxq 'KERNEL_SOURCE_MUTATED=NO' "$OUTPUT_DIR/P8V2-RESULT.txt"
          grep -Fxq 'KERNEL_BUILD_PERFORMED=NO' "$OUTPUT_DIR/P8V2-RESULT.txt"
          grep -Fxq 'AUTOMATIC_REPAIR_AUTHORIZED=NO' "$OUTPUT_DIR/P8V2-RESULT.txt"
          grep -Fxq 'KERNEL_CHANGE_AUTHORIZED=NO' "$OUTPUT_DIR/P8V2-RESULT.txt"
          grep -Fxq 'P9_RELEASE_AUTHORIZED=NO' "$OUTPUT_DIR/P8V2-RESULT.txt"

          (
            cd "$OUTPUT_DIR"
            find . -type f \
              ! -name 'FILES.txt' \
              ! -name 'SHA256SUMS' \
              ! -name 'SHA256SUMS.verify.txt' \
              -printf '%P\n' | sort > FILES.txt
            while IFS= read -r file; do
              sha256sum "$file"
            done < FILES.txt > SHA256SUMS
            sha256sum -c SHA256SUMS > SHA256SUMS.verify.txt
          )

      - name: Upload aggregate P8-v2 matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p8v2r2-veux-a13-module-abi-matrix-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 90
