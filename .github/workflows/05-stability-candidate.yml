name: 05 - VEUX 5.4.274 Stability Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout VEUX source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: 20240619
          fetch-depth: 0
          filter: blob:none
          path: kernel

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            cpio \
            rsync \
            python3 \
            xz-utils \
            zstd

      - name: Upstream to Android 5.4.274
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          git config user.name "VEUX Stability Builder"
          git config user.email "veux-stability@users.noreply.github.com"

          git remote remove android 2>/dev/null || true

          git remote add android \
            https://android.googlesource.com/kernel/common

          git fetch android \
            refs/tags/android11-5.4.274_r00:refs/tags/android11-5.4.274_r00

          git merge \
            --no-edit \
            --no-ff \
            android11-5.4.274_r00

          VERSION=$(awk '$1=="VERSION" && $2=="=" {print $3; exit}' Makefile)
          PATCHLEVEL=$(awk '$1=="PATCHLEVEL" && $2=="=" {print $3; exit}' Makefile)
          SUBLEVEL=$(awk '$1=="SUBLEVEL" && $2=="=" {print $3; exit}' Makefile)

          KVER="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          echo
          echo "Kernel version after upstream:"
          echo "$KVER"

          test "$KVER" = "5.4.274"

          test -f arch/arm64/boot/dts/vendor/xiaomi/veux.dts
          test -f arch/arm64/configs/veux_defconfig

          echo
          echo "✅ Linux 5.4.274"
          echo "✅ veux.dts"
          echo "✅ veux_defconfig"

      - name: Remove forced Blair minimum frequencies
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          echo "Reverting forced Blair minimum-frequency patch..."

          git revert \
            --no-edit \
            f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80

          echo
          echo "Revert completed."
          echo
          git log -1 --oneline

      - name: Verify stability change
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          echo "Checking forced Blair minimum-frequency modification..."

          if grep -q \
            "eff_table" \
            drivers/cpuidle/lpm-levels.c; then
            echo "ERROR: eff_table is still present"
            exit 20
          fi

          if grep -q \
            "freq_qos_update_request(policy.min_freq_req" \
            drivers/cpuidle/lpm-levels.c; then
            echo "ERROR: forced minimum-frequency request is still present"
            exit 21
          fi

          echo
          echo "Checking CASS baseline state..."

          if grep -q \
            "thermal_load_avg" \
            kernel/sched/cass.c; then
            echo "ERROR: incompatible thermal_load_avg call is present"
            exit 22
          fi

          echo
          echo "=========================================="
          echo "STABILITY CHANGE VERIFIED"
          echo "=========================================="
          echo
          echo "✅ Forced Blair minimum frequencies removed"
          echo "✅ CASS remains at compiling baseline state"
          echo
          echo "Intentionally untouched:"
          echo "- CASS scheduler implementation"
          echo "- Blair CPU frequency table"
          echo "- Blair energy model"
          echo "- schedutil tuning"
          echo "- VEUX thermal device fixes"
          echo "- VEUX USB device fixes"
          echo "- SUSFS / KernelSU / ReSukiSU"

      - name: Download official Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$GITHUB_WORKSPACE/toolchain/clang-r416183b"

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz" \
            -o "$RUNNER_TEMP/clang-r416183b.tar.gz"

          tar \
            -xzf "$RUNNER_TEMP/clang-r416183b.tar.gz" \
            -C "$GITHUB_WORKSPACE/toolchain/clang-r416183b"

          rm -f \
            "$RUNNER_TEMP/clang-r416183b.tar.gz"

          echo \
            "$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin" \
            >> "$GITHUB_PATH"

          "$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin/clang" \
            --version

          "$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin/ld.lld" \
            --version

      - name: Configure VEUX
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          export PATH="$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin:$PATH"
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"

          rm -rf out

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            veux_defconfig \
            2>&1 | tee "$GITHUB_WORKSPACE/config.log"

          echo
          echo "Important configuration values:"
          echo

          grep '^CONFIG_ARCH_QCOM=y' out/.config
          grep '^CONFIG_ARCH_HOLI=y' out/.config
          grep '^CONFIG_ARCH_BLAIR=y' out/.config
          grep '^CONFIG_WT_QGKI=y' out/.config
          grep '^CONFIG_LTO_CLANG=y' out/.config
          grep '^CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y' out/.config

          echo
          echo "Kernel release:"

          make \
            -s \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            kernelrelease

      - name: Build stability candidate
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          export PATH="$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin:$PATH"
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"

          echo "Compiler:"
          clang --version

          echo
          echo "CPU threads:"
          nproc

          echo
          echo "Starting VEUX 5.4.274 Stability Candidate 2..."
          echo

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            Image \
            dtbs \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          IMAGE="out/arch/arm64/boot/Image"
          VEUX_DTB="out/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"

          echo "Checking build outputs..."

          test -s "$IMAGE"
          test -s "$VEUX_DTB"
          test -s out/.config

          echo
          echo "✅ Kernel Image exists"
          echo "✅ VEUX DTB exists"
          echo "✅ Kernel config exists"

          echo
          echo "Files:"
          ls -lh "$IMAGE"
          ls -lh "$VEUX_DTB"
          ls -lh out/.config

          echo
          echo "SHA-256:"
          sha256sum "$IMAGE"
          sha256sum "$VEUX_DTB"

          echo
          echo "Parsing VEUX DTB..."

          out/scripts/dtc/dtc \
            -I dtb \
            -O dts \
            -o /dev/null \
            "$VEUX_DTB"

          echo
          echo "✅ VEUX DTB parses successfully"

      - name: Prepare stability artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$GITHUB_WORKSPACE/artifacts"

          cp \
            kernel/out/arch/arm64/boot/Image \
            "$GITHUB_WORKSPACE/artifacts/Image"

          cp \
            kernel/out/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb \
            "$GITHUB_WORKSPACE/artifacts/veux.dtb"

          cp \
            kernel/out/.config \
            "$GITHUB_WORKSPACE/artifacts/veux-5.4.274-stability.config"

          cp \
            "$GITHUB_WORKSPACE/config.log" \
            "$GITHUB_WORKSPACE/artifacts/config.log"

          cp \
            "$GITHUB_WORKSPACE/build.log" \
            "$GITHUB_WORKSPACE/artifacts/build.log"

          cd kernel

          {
            echo "VEUX 5.4.274 STABILITY CANDIDATE 2"
            echo
            echo "Base:"
            echo "dereference23/kernel_xiaomi_sm6375"
            echo "Tag: 20240619"
            echo
            echo "Upstream:"
            echo "android11-5.4.274_r00"
            echo
            echo "Compiler:"
            echo "clang-r416183b"
            echo
            echo "Stability change:"
            echo "- Removed forced Blair minimum CPU frequencies"
            echo "- CASS intentionally unchanged from known-good baseline"
            echo
            echo "Intentionally NOT changed:"
            echo "- CASS scheduler implementation"
            echo "- Blair CPU frequency table"
            echo "- Blair energy model"
            echo "- schedutil tuning"
            echo "- VEUX thermal device fixes"
            echo "- VEUX USB device fixes"
            echo "- SUSFS / KernelSU / ReSukiSU"
            echo
            echo "Kernel release:"
            make \
              -s \
              O=out \
              ARCH=arm64 \
              LLVM=1 \
              kernelrelease
            echo
            echo "SHA-256:"
            sha256sum \
              out/arch/arm64/boot/Image
            sha256sum \
              out/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb
            echo
            echo "Stability revert:"
            git log -1 --oneline
          } > "$GITHUB_WORKSPACE/artifacts/STABILITY-INFO.txt"

      - name: Upload stability candidate
        uses: actions/upload-artifact@v7
        with:
          name: veux-5.4.274-stability-candidate-2
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

      - name: Upload logs if build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: veux-5.4.274-stability-candidate-2-failure-logs
          path: |
            config.log
            build.log
            kernel/out/.config
          retention-days: 14
          if-no-files-found: warn
