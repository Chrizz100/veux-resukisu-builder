name: 05 - VEUX 5.4.274 Stability Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout VEUX source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: 20240619
          fetch-depth: 0
          filter: blob:none
          path: kernel

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            cpio \
            rsync \
            python3 \
            xz-utils \
            zstd

      - name: Upstream to Android 5.4.274
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          git config user.name "VEUX Stability Builder"
          git config user.email "veux-stability@users.noreply.github.com"

          git remote remove android 2>/dev/null || true
          git remote add android \
            https://android.googlesource.com/kernel/common

          git fetch android \
            refs/tags/android11-5.4.274_r00:refs/tags/android11-5.4.274_r00

          git merge \
            --no-edit \
            --no-ff \
            android11-5.4.274_r00

          VERSION=$(awk '$1=="VERSION" && $2=="=" {print $3; exit}' Makefile)
          PATCHLEVEL=$(awk '$1=="PATCHLEVEL" && $2=="=" {print $3; exit}' Makefile)
          SUBLEVEL=$(awk '$1=="SUBLEVEL" && $2=="=" {print $3; exit}' Makefile)

          test "${VERSION}.${PATCHLEVEL}.${SUBLEVEL}" = "5.4.274"

      - name: Remove two high-risk Positron tunings
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          echo "Reverting CASS thermal-pressure bypass..."
          git revert \
            --no-edit \
            b9b5ddba28bf9f23ac1a2af27f574291451244fd

          echo
          echo "Reverting forced Blair minimum frequencies..."
          git revert \
            --no-edit \
            f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80

          echo
          echo "Applied stability reverts:"
          git log -2 --oneline

      - name: Verify stability changes
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          echo "Checking CASS thermal-pressure handling..."

          grep -n \
            'thermal_load_avg' \
            kernel/sched/cass.c

          echo
          echo "Checking forced minimum-frequency table is gone..."

          if grep -n \
            'eff_table' \
            drivers/cpuidle/lpm-levels.c; then
            echo "ERROR: Positron eff_table is still present"
            exit 20
          fi

          if grep -n \
            'freq_qos_update_request(policy.min_freq_req' \
            drivers/cpuidle/lpm-levels.c; then
            echo "ERROR: Forced minimum-frequency request is still present"
            exit 21
          fi

          echo
          echo "✅ CASS thermal awareness restored"
          echo "✅ Forced minimum frequencies removed"

          echo
          echo "Intentionally untouched:"
          echo "- VEUX thermal-zone device fixes"
          echo "- VEUX USB overrides"
          echo "- Blair CPU frequency table"
          echo "- Blair energy model"
          echo "- schedutil tuning"
          echo "- all other device-specific fixes"

      - name: Download official Android clang-r416183b
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchain/clang-r416183b"

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz" \
            -o "$RUNNER_TEMP/clang-r416183b.tar.gz"

          tar \
            -xzf "$RUNNER_TEMP/clang-r416183b.tar.gz" \
            -C "$GITHUB_WORKSPACE/toolchain/clang-r416183b"

          rm -f "$RUNNER_TEMP/clang-r416183b.tar.gz"

          echo "$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin" >> "$GITHUB_PATH"

          "$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin/clang" --version

      - name: Configure VEUX
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          export PATH="$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin:$PATH"
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"

          rm -rf out

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            veux_defconfig \
            2>&1 | tee "$GITHUB_WORKSPACE/config.log"

          echo
          echo "Kernel release:"

          make \
            -s \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            kernelrelease

      - name: Build stability candidate
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          export PATH="$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin:$PATH"
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            Image \
            dtbs \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          IMAGE="out/arch/arm64/boot/Image"
          VEUX_DTB="out/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"

          test -s "$IMAGE"
          test -s "$VEUX_DTB"
          test -s out/.config

          echo "✅ Image"
          echo "✅ veux.dtb"
          echo "✅ .config"

          echo
          echo "SHA-256:"
          sha256sum "$IMAGE"
          sha256sum "$VEUX_DTB"

          out/scripts/dtc/dtc \
            -I dtb \
            -O dts \
            -o /dev/null \
            "$VEUX_DTB"

          echo "✅ VEUX DTB parses"

      - name: Prepare stability artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp \
            kernel/out/arch/arm64/boot/Image \
            "$GITHUB_WORKSPACE/artifacts/Image"

          cp \
            kernel/out/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb \
            "$GITHUB_WORKSPACE/artifacts/veux.dtb"

          cp \
            kernel/out/.config \
            "$GITHUB_WORKSPACE/artifacts/veux-5.4.274-stability.config"

          cp \
            "$GITHUB_WORKSPACE/config.log" \
            "$GITHUB_WORKSPACE/artifacts/config.log"

          cp \
            "$GITHUB_WORKSPACE/build.log" \
            "$GITHUB_WORKSPACE/artifacts/build.log"

          cd kernel

          {
            echo "VEUX 5.4.274 STABILITY CANDIDATE 1"
            echo
            echo "Base: dereference23/kernel_xiaomi_sm6375 tag 20240619"
            echo "Upstream: android11-5.4.274_r00"
            echo "Compiler: clang-r416183b"
            echo
            echo "Stability changes:"
            echo "- Restored CASS thermal-pressure awareness"
            echo "- Removed forced Blair minimum CPU frequencies"
            echo
            echo "NOT changed:"
            echo "- CPU frequency table"
            echo "- Energy model"
            echo "- VEUX thermal-zone fixes"
            echo "- USB device overrides"
            echo "- schedutil tuning"
            echo "- SUSFS / KernelSU / ReSukiSU"
            echo
            echo "Kernel release:"
            make \
              -s \
              O=out \
              ARCH=arm64 \
              LLVM=1 \
              kernelrelease
            echo
            echo "SHA-256:"
            sha256sum out/arch/arm64/boot/Image
            sha256sum out/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb
            echo
            echo "Revert commits:"
            git log -2 --oneline
          } > "$GITHUB_WORKSPACE/artifacts/STABILITY-INFO.txt"

      - name: Upload stability candidate
        uses: actions/upload-artifact@v7
        with:
          name: veux-5.4.274-stability-candidate-1
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

      - name: Upload logs if build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: veux-5.4.274-stability-failure-logs
          path: |
            config.log
            build.log
            kernel/out/.config
          retention-days: 14
          if-no-files-found: warn
