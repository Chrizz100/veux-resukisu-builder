name: 42 - GEN2 VEUX PEUX Installable AK3 Release Promotion v3

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gen2-42-v3-veux-peux-installable-release-${{ github.ref }}
  cancel-in-progress: false

env:
  W37_ARTIFACT_PREFIX: "GEN2_37_V3_NONFLASHING_AK3_RELEASE_CANDIDATE_AUDIT-"
  W41_ARTIFACT_PREFIX: "GEN2_41_V1_VEUX_PEUX_FINAL_NONFLASHING_RELEASE_READINESS_AUDIT-"
  BOOT_INPUT_ARTIFACT_NAME: "GEN2_W36_VALIDATED_LINEAGE_ANDROID16_BOOT_INPUT"

  W37_STAGING_NAME: "DO_NOT_FLASH_GEN2_VEUX_5.4.302_ReSukiSU_SUSFS_W37_AK3_RC_CONTENTS.zip"
  W37_STAGING_SHA256: "ad7bb3017d1cd768b1973127dc527efbcb8546b65dd0c7308171b38638bedf6d"
  W37_STAGING_BYTES: "17884855"

  W33_IMAGE_SHA256: "98e608f7c30540b6cb5a1731b0edecd9a3b4960ebf388763452685858916037f"
  W41_DUAL_DEVICE_SCRIPT_SHA256: "ecb74b1c4b5dc41017e39d6b95645737c9cb01c15274110e3d853bca867fa362"
  AK3_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_PIN: "af770f7b16cf8f8eb7c68614b2a693b3b361c90c"
  AK3_UPDATE_BINARY_BLOB: "8c7006e7e3f6ef10f8f4117b291d6df204ef285e"
  AK3_UPDATER_SCRIPT_BLOB: "e93ec6c09de11bed7db46050d8ad4a49c944fd69"
  RELEASE_ZIP_NAME: "GEN2_VEUX_PEUX_5.4.302_ReSukiSU_SUSFS_AK3_RELEASE_V1.zip"
  SOURCE_DATE_EPOCH: "1787184000"
  AK3_CORE_SHA256: "f7a51cfe2e093016a34a76e16de6c9885c2d1992c3482fcabc668680e1f0f6bb"
  AK3_NATIVE_MAGISKBOOT_SHA256: "0b19472b291ce9033c29a83155ff4c1b18be9d1d17d901d63e50f57436378762"

  VALIDATED_BOOT_GZIP_SHA256: "183984c727524325b36696a43419802fa9894a56bfc4c51c3b3cc6fa242a7bfa"
  VALIDATED_BOOT_GZIP_SIZE: "16498759"
  VALIDATED_BOOT_SHA256: "b4f8a81c19f89f2cfc0a179a3a01b3079119411e0325bbde758e885bf9d4aa8d"
  VALIDATED_BOOT_SIZE: "133300224"

  BOOT_PARTITION_SIZE: "134217728"
  EXPECTED_FINAL_BOOT_SHA256: "fe83a790cf7dc213c709320fe4b38072c50a434387f5f49845120d9e770ecf6f"

jobs:
  audit:
    name: Promote and runtime-audit exact VEUX PEUX installable AnyKernel3 release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      WORK: ${{ github.workspace }}/w42v3
      INPUTS: ${{ github.workspace }}/w42v3/inputs
      W37: ${{ github.workspace }}/w42v3/w37
      W41: ${{ github.workspace }}/w42v3/w41
      PACKAGE: ${{ github.workspace }}/w42v3/package
      BOOT_INPUT: ${{ github.workspace }}/w42v3/boot-input
      CASES: ${{ github.workspace }}/w42v3/cases
      OUTPUT: ${{ github.workspace }}/w42v3/output
      AK3: ${{ github.workspace }}/w42v3/ak3
      RELEASE: ${{ github.workspace }}/w42v3/release

    steps:
      - name: Prepare W42 installable release promotion workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORK"
          mkdir -p \
            "$INPUTS" \
            "$W37" \
            "$W41" \
            "$PACKAGE" \
            "$BOOT_INPUT" \
            "$CASES" \
            "$OUTPUT" \
            "$AK3" \
            "$RELEASE"

          cat > "$OUTPUT/SCOPE.txt" <<'EOF'
          GEN2 Workflow 42 v3
          ===================

          PURPOSE:
          Promote the exact W41-approved VEUX/PEUX AnyKernel3 script to an
          actual recovery-installable dual-device release ZIP.

          INPUTS:
          - exact successful W37-v3 nonflashing staging archive
          - exact successful W41-v1 VEUX/PEUX release-readiness artifact
          - exact validated Lineage Android-16 veux boot input
          - exact pinned AnyKernel3 META-INF installer files

          RELEASE SCOPE:
          - device.name1=veux
          - device.name2=peux
          - Android 16
          - boot partition only
          - active A/B slot
          - no kernel modules
          - no systemless payload
          - no vendor_boot write
          - no dtbo write
          - no top-level vbmeta write

          VALIDATION:
          - deterministic release ZIP build twice
          - exact W33 kernel
          - exact W41 dual-device anykernel.sh
          - pinned AK3 META-INF blob identities
          - fake active-slot _a runtime
          - fake active-slot _b runtime
          - invalid _c fail-closed
          - exact known final boot SHA-256
          - logical ramdisk preservation

          IMPORTANT:
          This workflow CREATES an installable ZIP.
          It DOES NOT access a phone, use adb/fastboot, or flash a device.
          A physical device test remains a separate explicit action.
          EOF

          {
            echo "AUDIT=GEN2_42_V3_VEUX_PEUX_INSTALLABLE_AK3_RELEASE_PROMOTION"
            echo "DATE_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "REPOSITORY=$GITHUB_REPOSITORY"
            echo "USER_APPROVAL=INSTALLABLE_DUAL_DEVICE_PACKAGE_PROMOTION_APPROVED"
            echo "TARGET_SCOPE=VEUX_AND_PEUX"
            echo "RECOVERY_INSTALLABLE_ZIP_CREATED=YES_IF_ALL_GATES_PASS"
            echo "REAL_DEVICE_ACCESSED=NO"
            echo "ADB_USED=NO"
            echo "FASTBOOT_USED=NO"
            echo "FLASHING_PERFORMED=NO"
            echo "W42_V1_FAILURE_CLASSIFICATION=AUTHORING_BUG_CAUGHT_PRE_RUNTIME"
            echo "W42_V1_FAILURE_DETAIL=STALE_UNDEFINED_PRODUCTION_CANDIDATE_SHA256_VARIABLE"
            echo "W42_V2_RELEASE_QUALITY_CLASSIFICATION=FUNCTIONALLY_PASS_METADATA_COHERENCE_FIX_REQUIRED"
            echo "W42_V2_RELEASE_QUALITY_DETAIL=STALE_W37_NONFLASHING_VEUX_ONLY_TEXT_INSIDE_INSTALLABLE_DUAL_DEVICE_ZIP"
          } > "$OUTPUT/AUDIT-HEADER.txt"

      - name: Install host runtime dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            file \
            git \
            jq \
            qemu-user-static \
            unzip \
            zip

          command -v git
          command -v qemu-arm-static
          command -v sha256sum
          command -v unzip
          command -v zip
          command -v gzip

          {
            echo "QEMU_ARM=$(command -v qemu-arm-static)"
            qemu-arm-static --version | head -n 1
          } > "$OUTPUT/HOST-RUNTIME.txt"

      - name: Download exact W37 W41 and canonical boot artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          VERSION="X-GitHub-Api-Version: 2022-11-28"
          ALL="$WORK/artifacts.ndjson"
          : > "$ALL"

          page=1
          while :; do
            page_json="$WORK/artifacts-page-${page}.json"

            curl -fsSL \
              -H "$AUTH" \
              -H "$ACCEPT" \
              -H "$VERSION" \
              "$API/actions/artifacts?per_page=100&page=${page}" \
              -o "$page_json"

            count="$(jq '.artifacts | length' "$page_json")"
            jq -c '.artifacts[]' "$page_json" >> "$ALL"

            [ "$count" -lt 100 ] && break

            page=$((page + 1))
            [ "$page" -le 100 ] || {
              echo "ERROR: artifact pagination safety limit reached"
              exit 1
            }
          done

          select_prefix() {
            local prefix="$1"
            jq -s -c --arg prefix "$prefix" '
              [
                .[]
                | select(
                    (.expired == false)
                    and (.name | startswith($prefix))
                  )
              ]
              | sort_by(.created_at)
              | reverse
              | .[0] // empty
            ' "$ALL"
          }

          select_exact() {
            local name="$1"
            jq -s -c --arg name "$name" '
              [
                .[]
                | select(
                    (.expired == false)
                    and (.name == $name)
                  )
              ]
              | sort_by(.created_at)
              | reverse
              | .[0] // empty
            ' "$ALL"
          }

          download_selected() {
            local selected="$1"
            local dest="$2"
            local meta="$3"

            [ -n "$selected" ] || {
              echo "ERROR: required artifact selection is empty"
              exit 1
            }

            local id name url
            id="$(jq -r '.id // empty' <<<"$selected")"
            name="$(jq -r '.name // empty' <<<"$selected")"
            url="$(jq -r '.archive_download_url // empty' <<<"$selected")"

            test -n "$id"
            test -n "$name"
            test -n "$url"

            jq . <<<"$selected" > "$meta"

            curl -fLsS \
              -H "$AUTH" \
              -H "$ACCEPT" \
              -H "$VERSION" \
              "$url" \
              -o "$dest"

            unzip -t "$dest" > "${dest}.ziptest.txt"

            echo "$name|$id|$(sha256sum "$dest" | awk '{print $1}')"
          }

          W37_INFO="$(
            download_selected \
              "$(select_prefix "$W37_ARTIFACT_PREFIX")" \
              "$INPUTS/w37.zip" \
              "$OUTPUT/W37-ARTIFACT.json"
          )"

          W41_INFO="$(
            download_selected \
              "$(select_prefix "$W41_ARTIFACT_PREFIX")" \
              "$INPUTS/w41.zip" \
              "$OUTPUT/W41-ARTIFACT.json"
          )"

          BOOT_INFO="$(
            download_selected \
              "$(select_exact "$BOOT_INPUT_ARTIFACT_NAME")" \
              "$INPUTS/boot-input.zip" \
              "$OUTPUT/BOOT-INPUT-ARTIFACT.json"
          )"

          unzip -q "$INPUTS/w37.zip" -d "$W37"
          unzip -q "$INPUTS/w41.zip" -d "$W41"
          unzip -q "$INPUTS/boot-input.zip" -d "$BOOT_INPUT"

          {
            echo "INPUT_ARTIFACT_FETCH=PASS"
            echo "ARTIFACT_PAGINATION=PASS"
            echo "ARTIFACT_PAGE_COUNT=$page"
            echo "ARTIFACT_TOTAL_COUNT=$(wc -l < "$ALL" | tr -d ' ')"
            echo "W37_ARTIFACT=$W37_INFO"
            echo "W41_ARTIFACT=$W41_INFO"
            echo "BOOT_INPUT_ARTIFACT=$BOOT_INFO"
          } | tee "$OUTPUT/INPUT-ARTIFACTS.txt"

      - name: Verify exact successful W37 staging archive
        shell: bash
        run: |
          set -euo pipefail

          W37_REPORT="$W37/GEN2_37_V3_NONFLASHING_AK3_RELEASE_CANDIDATE_AUDIT.txt"
          W37_VERDICT="$W37/w37v3/output/W37-VERDICT.txt"
          STAGING="$W37/w37v3/output/$W37_STAGING_NAME"

          test -s "$W37_REPORT"
          test -s "$W37_VERDICT"
          test -s "$STAGING"

          grep -Fxq \
            'FINAL_RESULT=PASS_GEN2_37_V3_NONFLASHING_AK3_RELEASE_CANDIDATE_ARCHIVE_AND_DEVICE_TEST_PLAN' \
            "$W37_VERDICT"
          grep -Fxq 'W36_V14_PREREQUISITE=PASS' "$W37_VERDICT"
          grep -Fxq 'AK3_PACKAGED_NATIVE_MAGISKBOOT_QEMU=PASS' "$W37_VERDICT"
          grep -Fxq 'DETERMINISTIC_PACKAGE_BYTES=YES' "$W37_VERDICT"
          grep -Fxq 'STAGING_ARCHIVE_RECOVERY_INSTALLABLE=NO' "$W37_VERDICT"
          grep -Fxq 'REAL_DEVICE_ACCESSED=NO' "$W37_VERDICT"

          test "$(stat -c '%s' "$STAGING")" = "$W37_STAGING_BYTES"
          test "$(sha256sum "$STAGING" | awk '{print $1}')" = "$W37_STAGING_SHA256"

          unzip -t "$STAGING" > "$OUTPUT/W37-STAGING-CRC.txt"
          unzip -q "$STAGING" -d "$PACKAGE"

          (
            cd "$PACKAGE"
            sha256sum -c PACKAGE-SHA256SUMS
          ) > "$OUTPUT/W37-PACKAGE-SHA256SUMS.verify.txt"

          test "$(sha256sum "$PACKAGE/Image" | awk '{print $1}')" = "$W33_IMAGE_SHA256"
          test "$(sha256sum "$PACKAGE/anykernel.production-candidate.sh" | awk '{print $1}')" = "4e1a731b9454e17697ba38051c5e2aa63f274305875152900f6222e34b45791a"
          test "$(sha256sum "$PACKAGE/tools/ak3-core.sh" | awk '{print $1}')" = "$AK3_CORE_SHA256"
          test "$(sha256sum "$PACKAGE/tools/magiskboot" | awk '{print $1}')" = "$AK3_NATIVE_MAGISKBOOT_SHA256"

          test ! -e "$PACKAGE/META-INF"
          test ! -e "$PACKAGE/boot.img"
          test ! -e "$PACKAGE/vendor_boot.img"
          test ! -e "$PACKAGE/dtbo.img"
          test ! -e "$PACKAGE/vbmeta.img"

          grep -Fq 'device.name1=veux' "$PACKAGE/anykernel.production-candidate.sh"
          grep -Fq 'supported.versions=16' "$PACKAGE/anykernel.production-candidate.sh"
          grep -Fq 'BLOCK=boot' "$PACKAGE/anykernel.production-candidate.sh"
          grep -Fq 'IS_SLOT_DEVICE=1' "$PACKAGE/anykernel.production-candidate.sh"
          grep -Fq 'SLOT_SELECT=active' "$PACKAGE/anykernel.production-candidate.sh"
          grep -Fq 'NO_MAGISK_CHECK=1' "$PACKAGE/anykernel.production-candidate.sh"
          grep -Fxq 'split_boot' <(
            sed -n 's/^[[:space:]]*\(split_boot\)[[:space:]]*$/\1/p' \
              "$PACKAGE/anykernel.production-candidate.sh"
          )
          grep -Fxq 'flash_boot' <(
            sed -n 's/^[[:space:]]*\(flash_boot\)[[:space:]]*$/\1/p' \
              "$PACKAGE/anykernel.production-candidate.sh"
          )

          {
            echo "W37_INPUT_GATE=PASS"
            echo "W37_STAGING_SHA256=$W37_STAGING_SHA256"
            echo "W37_STAGING_BYTES=$W37_STAGING_BYTES"
            echo "BASELINE_PRODUCTION_CANDIDATE_SHA256=4e1a731b9454e17697ba38051c5e2aa63f274305875152900f6222e34b45791a"
            echo "AK3_CORE_SHA256=$AK3_CORE_SHA256"
            echo "AK3_NATIVE_MAGISKBOOT_SHA256=$AK3_NATIVE_MAGISKBOOT_SHA256"
            echo "W33_IMAGE_SHA256=$W33_IMAGE_SHA256"
            echo "INSTALLABLE_PACKAGE_PROMOTED=NO"
          } | tee "$OUTPUT/W37-INPUT-GATE.txt"

      - name: Verify W41 dual device approval and exact promoted script
        shell: bash
        run: |
          set -euo pipefail

          W41_REPORT="$W41/GEN2_41_V1_VEUX_PEUX_FINAL_NONFLASHING_RELEASE_READINESS_AUDIT.txt"
          W41_VERDICT="$W41/w41/evidence/W41-VERDICT.txt"
          W41_SCRIPT="$W41/w41/proposed/anykernel.production-candidate.veux-peux.sh"

          test -s "$W41_REPORT"
          test -s "$W41_VERDICT"
          test -s "$W41_SCRIPT"

          grep -Fxq \
            'FINAL_RESULT=PASS_GEN2_41_V1_VEUX_PEUX_FINAL_NONFLASHING_RELEASE_READINESS_AUDIT' \
            "$W41_VERDICT"
          grep -Fxq 'TARGET_SCOPE=VEUX_AND_PEUX' "$W41_VERDICT"
          grep -Fxq 'INSTALLABLE_DUAL_DEVICE_PACKAGE_PROMOTION_PRECONDITIONS=PASS' "$W41_VERDICT"
          grep -Fxq 'PROMOTION_REQUIRES_EXPLICIT_USER_APPROVAL=YES' "$W41_VERDICT"
          grep -Fxq 'REAL_DEVICE_ACCESSED=NO' "$W41_VERDICT"
          grep -Fxq 'FLASHING_PERFORMED=NO' "$W41_VERDICT"

          test "$(sha256sum "$W41_SCRIPT" | awk '{print $1}')" = \
            "$W41_DUAL_DEVICE_SCRIPT_SHA256"

          bash -n "$W41_SCRIPT"

          grep -Fxq 'device.name1=veux' "$W41_SCRIPT"
          grep -Fxq 'device.name2=peux' "$W41_SCRIPT"
          grep -Fxq 'device.name3=' "$W41_SCRIPT"
          grep -Fxq 'device.name4=' "$W41_SCRIPT"
          grep -Fxq 'device.name5=' "$W41_SCRIPT"
          grep -Fxq 'do.devicecheck=1' "$W41_SCRIPT"
          grep -Fxq 'do.modules=0' "$W41_SCRIPT"
          grep -Fxq 'do.systemless=0' "$W41_SCRIPT"
          grep -Fxq 'supported.versions=16' "$W41_SCRIPT"
          grep -Fxq 'BLOCK=boot' "$W41_SCRIPT"
          grep -Fxq 'IS_SLOT_DEVICE=1' "$W41_SCRIPT"
          grep -Fxq 'SLOT_SELECT=active' "$W41_SCRIPT"
          grep -Fxq 'PATCH_VBMETA_FLAG=0' "$W41_SCRIPT"

          {
            echo "W41_APPROVAL_GATE=PASS"
            echo "DUAL_DEVICE_SCRIPT_SHA256=$W41_DUAL_DEVICE_SCRIPT_SHA256"
            echo "DEVICE_1=veux"
            echo "DEVICE_2=peux"
            echo "INSTALLABLE_PROMOTION_APPROVED=YES"
          } | tee "$OUTPUT/W41-APPROVAL-GATE.txt"

      - name: Fetch exact pinned AnyKernel3 installer metadata
        shell: bash
        run: |
          set -euo pipefail

          git clone --filter=blob:none --no-checkout \
            "$AK3_REPO" \
            "$AK3/repo" >/dev/null 2>&1

          git -C "$AK3/repo" \
            checkout --detach "$AK3_PIN" >/dev/null 2>&1

          test "$(git -C "$AK3/repo" rev-parse HEAD)" = "$AK3_PIN"

          test "$(
            git -C "$AK3/repo" rev-parse HEAD:META-INF/com/google/android/update-binary
          )" = "$AK3_UPDATE_BINARY_BLOB"

          test "$(
            git -C "$AK3/repo" rev-parse HEAD:META-INF/com/google/android/updater-script
          )" = "$AK3_UPDATER_SCRIPT_BLOB"

          test -s "$AK3/repo/META-INF/com/google/android/update-binary"
          test -s "$AK3/repo/META-INF/com/google/android/updater-script"

          bash -n "$AK3/repo/META-INF/com/google/android/update-binary"

          grep -Fq "grep '^device.name.*=' anykernel.sh" \
            "$AK3/repo/META-INF/com/google/android/update-binary"

          {
            echo "AK3_INSTALLER_METADATA=PASS"
            echo "AK3_PIN=$AK3_PIN"
            echo "UPDATE_BINARY_BLOB=$AK3_UPDATE_BINARY_BLOB"
            echo "UPDATER_SCRIPT_BLOB=$AK3_UPDATER_SCRIPT_BLOB"
          } | tee "$OUTPUT/AK3-INSTALLER-METADATA.txt"

      - name: Recover and authenticate canonical real Lineage boot input
        shell: bash
        run: |
          set -euo pipefail

          GZIP="$BOOT_INPUT/GEN2_W36_VALIDATED_LINEAGE_VEUX_ANDROID16_BOOT.img.gz"
          BOOT="$INPUTS/validated-real-boot.img"

          test -s "$GZIP"
          test "$(stat -c '%s' "$GZIP")" = "$VALIDATED_BOOT_GZIP_SIZE"
          test "$(sha256sum "$GZIP" | awk '{print $1}')" = "$VALIDATED_BOOT_GZIP_SHA256"

          gzip -t "$GZIP"
          gzip -dc "$GZIP" > "$BOOT"

          test "$(stat -c '%s' "$BOOT")" = "$VALIDATED_BOOT_SIZE"
          test "$(sha256sum "$BOOT" | awk '{print $1}')" = "$VALIDATED_BOOT_SHA256"

          python3 - "$BOOT" <<'PY'
          import struct
          import sys
          from pathlib import Path

          data = Path(sys.argv[1]).read_bytes()

          if data[:8] != b"ANDROID!":
              raise SystemExit("ERROR: Android boot magic missing")

          header_version = struct.unpack_from("<I", data, 40)[0]
          if header_version != 3:
              raise SystemExit(
                  f"ERROR: expected boot header v3, got {header_version}"
              )

          if len(data) > 134217728:
              raise SystemExit("ERROR: boot exceeds 128 MiB partition")

          if b"Redmi/lineage_veux/veux:16/" not in data:
              raise SystemExit("ERROR: validated Lineage veux Android 16 fingerprint missing")

          print("REAL_BOOT_STRUCTURE=PASS")
          PY

          {
            echo "VALIDATED_REAL_BOOT_INPUT=PASS"
            echo "BOOT_SHA256=$VALIDATED_BOOT_SHA256"
            echo "BOOT_SIZE=$VALIDATED_BOOT_SIZE"
            echo "BOOT_HEADER_VERSION=3"
          } | tee "$OUTPUT/REAL-BOOT-INPUT.txt"

      - name: Promote exact deterministic VEUX PEUX installable release ZIP
        shell: bash
        run: |
          set -euo pipefail

          W41_SCRIPT="$W41/w41/proposed/anykernel.production-candidate.veux-peux.sh"

          # Promote exactly the W41-approved script to the actual installer entry.
          cp "$W41_SCRIPT" "$PACKAGE/anykernel.sh"
          chmod 755 "$PACKAGE/anykernel.sh"

          test "$(sha256sum "$PACKAGE/anykernel.sh" | awk '{print $1}')" = \
            "$W41_DUAL_DEVICE_SCRIPT_SHA256"

          # The W41 script was authenticated byte-for-byte above. Change only
          # its nonfunctional release-state comment from candidate to final release.
          python3 - "$PACKAGE/anykernel.sh" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          old = (
              "### GEN2 VEUX/PEUX AnyKernel3 production candidate "
              "- NOT YET RELEASED"
          )
          new = "### GEN2 VEUX/PEUX AnyKernel3 RELEASE V1"

          if text.count(old) != 1:
              raise SystemExit(
                  "unexpected W41 release-label occurrence count"
              )

          path.write_text(
              text.replace(old, new, 1),
              encoding="utf-8",
          )
          PY

          bash -n "$PACKAGE/anykernel.sh"

          RELEASE_ANYKERNEL_SHA256="$(
            sha256sum "$PACKAGE/anykernel.sh" | awk '{print $1}'
          )"
          test -n "$RELEASE_ANYKERNEL_SHA256"

          echo "RELEASE_ANYKERNEL_SHA256=$RELEASE_ANYKERNEL_SHA256" \
            >> "$GITHUB_ENV"

          # Remove the old candidate copy. The promoted anykernel.sh is now the
          # sole installer entry.
          rm -f "$PACKAGE/anykernel.production-candidate.sh"

          # Replace W37's intentionally nonflashing/VEUX-only documentation with
          # final dual-device release documentation. No executable behavior changes.
          cat > "$PACKAGE/PROVENANCE.txt" <<EOF
          GEN2 W42 VEUX/PEUX INSTALLABLE AK3 RELEASE V1
          =================================================
          TARGET_DEVICE_1=veux
          TARGET_DEVICE_2=peux
          KERNEL_BASE=Linux 5.4.302
          W33_IMAGE_SHA256=$W33_IMAGE_SHA256
          W37_STAGING_SHA256=$W37_STAGING_SHA256
          W41_DUAL_DEVICE_SCRIPT_SHA256=$W41_DUAL_DEVICE_SCRIPT_SHA256
          RELEASE_ANYKERNEL_SHA256=$RELEASE_ANYKERNEL_SHA256
          VALIDATED_REAL_BOOT_SHA256=$VALIDATED_BOOT_SHA256
          AK3_PIN=$AK3_PIN
          BOOT_ONLY_KERNEL_REPLACEMENT=YES
          RAMDISK_POLICY=PRESERVE
          VENDOR_BOOT_POLICY=PRESERVE
          DTBO_POLICY=PRESERVE
          TOP_LEVEL_VBMETA_POLICY=PRESERVE
          CUSTOM_DTB_INCLUDED=NO
          CUSTOM_DTBO_INCLUDED=NO
          BOOT_IMG_INCLUDED=NO
          VENDOR_BOOT_IMG_INCLUDED=NO
          DTBO_IMG_INCLUDED=NO
          VBMETA_IMG_INCLUDED=NO
          RECOVERY_INSTALLABLE=YES
          VEUX_RUNTIME_VALIDATION=PASS
          PEUX_STATIC_COMPATIBILITY=PASS
          PEUX_PHYSICAL_RUNTIME_VALIDATION=NOT_PERFORMED
          REAL_DEVICE_ACCESSED=NO
          FLASHING_PERFORMED=NO
          EOF

          sed -i 's/^          //' "$PACKAGE/PROVENANCE.txt"

          cat > "$PACKAGE/DEVICE-TEST-PLAN.txt" <<'EOF'
          GEN2 VEUX/PEUX PHYSICAL DEVICE TEST PLAN - NOT YET EXECUTED
          ============================================================

          This ZIP is recovery-installable for the statically approved dual-device
          scope:
          - veux
          - peux

          Preconditions for an optional separately approved physical test:
          1. Confirm the physical device reports either veux or peux.
          2. Confirm bootloader-unlocked evidence.
          3. Record the current active A/B slot.
          4. Back up and hash the currently installed boot partition before write.
          5. Confirm Android 16 and the expected boot-header-v3 contract.
          6. Flash only the active boot slot through the audited AnyKernel3 path.
          7. Leave vendor_boot, dtbo and top-level vbmeta untouched.
          8. Reboot and verify Android boot, kernel release, ReSukiSU and SUSFS.
          9. Preserve an exact rollback path to the pre-test boot image.

          VEUX runtime behavior has been validated through the real-boot/fake-slot
          harness chain. PEUX is statically approved by the unified Lineage/GEN2
          device model, but a physical PEUX boot has not been tested.

          This W42 workflow performs no physical-device write.
          EOF

          sed -i 's/^          //' "$PACKAGE/DEVICE-TEST-PLAN.txt"

          mkdir -p "$PACKAGE/META-INF/com/google/android"
          cp \
            "$AK3/repo/META-INF/com/google/android/update-binary" \
            "$PACKAGE/META-INF/com/google/android/update-binary"
          cp \
            "$AK3/repo/META-INF/com/google/android/updater-script" \
            "$PACKAGE/META-INF/com/google/android/updater-script"

          chmod 755 "$PACKAGE/META-INF/com/google/android/update-binary"
          chmod 644 "$PACKAGE/META-INF/com/google/android/updater-script"

          cat > "$PACKAGE/RELEASE-MANIFEST.txt" <<EOF
          RELEASE=GEN2_VEUX_PEUX_5.4.302_ReSukiSU_SUSFS_AK3_RELEASE_V1
          TARGET_DEVICE_1=veux
          TARGET_DEVICE_2=peux
          ANDROID_VERSION=16
          KERNEL_IMAGE_SHA256=$W33_IMAGE_SHA256
          W41_DUAL_DEVICE_SCRIPT_SHA256=$W41_DUAL_DEVICE_SCRIPT_SHA256
          RELEASE_ANYKERNEL_SHA256=$RELEASE_ANYKERNEL_SHA256
          AK3_PIN=$AK3_PIN
          AK3_UPDATE_BINARY_BLOB=$AK3_UPDATE_BINARY_BLOB
          AK3_UPDATER_SCRIPT_BLOB=$AK3_UPDATER_SCRIPT_BLOB
          BOOT_PARTITION=boot
          ACTIVE_SLOT=YES
          MODULE_INSTALL=NO
          SYSTEMLESS=NO
          VENDOR_BOOT_POLICY=PRESERVE
          DTBO_POLICY=PRESERVE
          TOP_LEVEL_VBMETA_POLICY=PRESERVE
          VEUX_RUNTIME_VALIDATION=PASS_THROUGH_W39_V5
          PEUX_STATIC_COMPATIBILITY=PASS_THROUGH_W40_V1
          PEUX_PHYSICAL_RUNTIME_VALIDATION=NOT_PERFORMED
          EOF

          sed -i 's/^          //' "$PACKAGE/RELEASE-MANIFEST.txt"

          # Rebuild the package manifest after the exact release promotion.
          (
            cd "$PACKAGE"
            rm -f PACKAGE-SHA256SUMS
            find . -type f ! -name PACKAGE-SHA256SUMS -printf '%P\n' \
              | LC_ALL=C sort \
              | while IFS= read -r file; do
                  sha256sum "$file"
                done \
              > PACKAGE-SHA256SUMS
          )

          (
            cd "$PACKAGE"
            sha256sum -c PACKAGE-SHA256SUMS
          ) > "$OUTPUT/RELEASE-PACKAGE-SHA256SUMS.verify.txt"

          test "$(sha256sum "$PACKAGE/Image" | awk '{print $1}')" = \
            "$W33_IMAGE_SHA256"
          test "$(sha256sum "$PACKAGE/anykernel.sh" | awk '{print $1}')" = \
            "$RELEASE_ANYKERNEL_SHA256"
          test "$(sha256sum "$PACKAGE/tools/ak3-core.sh" | awk '{print $1}')" = \
            "$AK3_CORE_SHA256"
          test "$(sha256sum "$PACKAGE/tools/magiskboot" | awk '{print $1}')" = \
            "$AK3_NATIVE_MAGISKBOOT_SHA256"

          test -s "$PACKAGE/META-INF/com/google/android/update-binary"
          test -s "$PACKAGE/META-INF/com/google/android/updater-script"
          test ! -e "$PACKAGE/boot.img"
          test ! -e "$PACKAGE/vendor_boot.img"
          test ! -e "$PACKAGE/dtbo.img"
          test ! -e "$PACKAGE/vbmeta.img"
          test ! -e "$PACKAGE/anykernel.production-candidate.sh"

          grep -Fxq 'device.name1=veux' "$PACKAGE/anykernel.sh"
          grep -Fxq 'device.name2=peux' "$PACKAGE/anykernel.sh"
          grep -Fxq '### GEN2 VEUX/PEUX AnyKernel3 RELEASE V1'             "$PACKAGE/anykernel.sh"

          grep -Fxq 'TARGET_DEVICE_1=veux' "$PACKAGE/PROVENANCE.txt"
          grep -Fxq 'TARGET_DEVICE_2=peux' "$PACKAGE/PROVENANCE.txt"
          grep -Fxq 'RECOVERY_INSTALLABLE=YES' "$PACKAGE/PROVENANCE.txt"
          grep -Fxq 'PEUX_PHYSICAL_RUNTIME_VALIDATION=NOT_PERFORMED'             "$PACKAGE/PROVENANCE.txt"

          grep -Fq 'either veux or peux' "$PACKAGE/DEVICE-TEST-PLAN.txt"

          if grep -Fq 'NOT YET RELEASED' "$PACKAGE/anykernel.sh"; then
            echo "ERROR: stale candidate label remains in release anykernel.sh"
            exit 1
          fi

          if grep -Fxq 'DEVICE=veux' "$PACKAGE/PROVENANCE.txt"; then
            echo "ERROR: stale VEUX-only provenance remains"
            exit 1
          fi

          if grep -Fxq 'RECOVERY_INSTALLABLE=NO' "$PACKAGE/PROVENANCE.txt"; then
            echo "ERROR: stale noninstallable provenance remains"
            exit 1
          fi

          if grep -Fq 'identity is exactly veux' "$PACKAGE/DEVICE-TEST-PLAN.txt"; then
            echo "ERROR: stale VEUX-only physical test plan remains"
            exit 1
          fi

          # Normalize deterministic timestamps without altering Unix modes.
          find "$PACKAGE" -exec \
            touch -h -d "@$SOURCE_DATE_EPOCH" {} +

          build_release_zip() {
            local out="$1"
            rm -f "$out"
            (
              cd "$PACKAGE"
              find . -type f -printf '%P\n' \
                | LC_ALL=C sort \
                | zip -X -9 "$out" -@ >/dev/null
            )
          }

          ZIP_A="$RELEASE/release-a.zip"
          ZIP_B="$RELEASE/release-b.zip"

          build_release_zip "$ZIP_A"
          build_release_zip "$ZIP_B"

          unzip -t "$ZIP_A" > "$OUTPUT/RELEASE-A-CRC.txt"
          unzip -t "$ZIP_B" > "$OUTPUT/RELEASE-B-CRC.txt"

          A_SHA="$(sha256sum "$ZIP_A" | awk '{print $1}')"
          B_SHA="$(sha256sum "$ZIP_B" | awk '{print $1}')"

          test "$A_SHA" = "$B_SHA"
          cmp -s "$ZIP_A" "$ZIP_B"

          cp "$ZIP_A" "$OUTPUT/$RELEASE_ZIP_NAME"

          RELEASE_SHA="$(
            sha256sum "$OUTPUT/$RELEASE_ZIP_NAME" | awk '{print $1}'
          )"
          RELEASE_BYTES="$(
            stat -c '%s' "$OUTPUT/$RELEASE_ZIP_NAME"
          )"

          printf '%s  %s\n' \
            "$RELEASE_SHA" \
            "$RELEASE_ZIP_NAME" \
            > "$OUTPUT/$RELEASE_ZIP_NAME.sha256"

          python3 - "$OUTPUT/$RELEASE_ZIP_NAME" <<'PY'
          import stat
          import sys
          import zipfile

          path = sys.argv[1]

          with zipfile.ZipFile(path) as zf:
              names = set(zf.namelist())

              required = {
                  "Image",
                  "anykernel.sh",
                  "tools/ak3-core.sh",
                  "tools/magiskboot",
                  "META-INF/com/google/android/update-binary",
                  "META-INF/com/google/android/updater-script",
                  "PACKAGE-SHA256SUMS",
                  "RELEASE-MANIFEST.txt",
              }

              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"missing release entries: {missing}")

              forbidden = {
                  "boot.img",
                  "vendor_boot.img",
                  "dtbo.img",
                  "vbmeta.img",
                  "anykernel.production-candidate.sh",
              }

              present_forbidden = sorted(forbidden & names)
              if present_forbidden:
                  raise SystemExit(
                      f"forbidden release entries: {present_forbidden}"
                  )

              executable = {
                  "Image",
                  "anykernel.sh",
                  "META-INF/com/google/android/update-binary",
                  "tools/ak3-core.sh",
                  "tools/busybox",
                  "tools/magiskboot",
              }

              for name in executable:
                  info = zf.getinfo(name)
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if not (mode & stat.S_IXUSR):
                      raise SystemExit(
                          f"executable bit missing for {name}: {oct(mode)}"
                      )

              anykernel = zf.read("anykernel.sh").decode("utf-8")
              provenance = zf.read("PROVENANCE.txt").decode("utf-8")
              test_plan = zf.read("DEVICE-TEST-PLAN.txt").decode("utf-8")

              required_text = {
                  "anykernel.sh": [
                      "### GEN2 VEUX/PEUX AnyKernel3 RELEASE V1",
                      "device.name1=veux",
                      "device.name2=peux",
                  ],
                  "PROVENANCE.txt": [
                      "TARGET_DEVICE_1=veux",
                      "TARGET_DEVICE_2=peux",
                      "RECOVERY_INSTALLABLE=YES",
                  ],
                  "DEVICE-TEST-PLAN.txt": [
                      "either veux or peux",
                  ],
              }

              contents = {
                  "anykernel.sh": anykernel,
                  "PROVENANCE.txt": provenance,
                  "DEVICE-TEST-PLAN.txt": test_plan,
              }

              for name, needles in required_text.items():
                  for needle in needles:
                      if needle not in contents[name]:
                          raise SystemExit(
                              f"release metadata missing in {name}: {needle}"
                          )

              forbidden_text = [
                  ("anykernel.sh", "NOT YET RELEASED"),
                  ("PROVENANCE.txt", "DEVICE=veux"),
                  ("PROVENANCE.txt", "RECOVERY_INSTALLABLE=NO"),
                  ("DEVICE-TEST-PLAN.txt", "identity is exactly veux"),
              ]

              for name, needle in forbidden_text:
                  if needle in contents[name]:
                      raise SystemExit(
                          f"stale release text in {name}: {needle}"
                      )

          print("INSTALLABLE_RELEASE_ZIP_STRUCTURE=PASS")
          print("INSTALLABLE_RELEASE_METADATA_COHERENCE=PASS")
          PY

          {
            echo "INSTALLABLE_RELEASE_PROMOTION=PASS"
            echo "RELEASE_ZIP_NAME=$RELEASE_ZIP_NAME"
            echo "RELEASE_ZIP_SHA256=$RELEASE_SHA"
            echo "RELEASE_ZIP_BYTES=$RELEASE_BYTES"
            echo "DETERMINISTIC_RELEASE_BYTES=YES"
            echo "W33_KERNEL_EXACT=YES"
            echo "W41_DUAL_DEVICE_FUNCTIONAL_SCRIPT=EXACT"
            echo "RELEASE_LABEL_ONLY_DELTA=YES"
            echo "RELEASE_ANYKERNEL_SHA256=$RELEASE_ANYKERNEL_SHA256"
            echo "RELEASE_METADATA_COHERENCE=PASS"
            echo "META_INF_PRESENT=YES"
            echo "RECOVERY_INSTALLABLE=YES"
            echo "DEVICE_1=veux"
            echo "DEVICE_2=peux"
            echo "REAL_DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } | tee "$OUTPUT/RELEASE-PROMOTION-STATUS.txt"

      - name: Prepare exact promoted release host runtime harness
        shell: bash
        run: |
          set -euo pipefail

          file "$PACKAGE/tools/magiskboot" \
            | tee "$OUTPUT/PACKAGED-MAGISKBOOT-FILE.txt"

          grep -Fq 'ELF 32-bit LSB' "$OUTPUT/PACKAGED-MAGISKBOOT-FILE.txt"
          grep -Fq 'ARM' "$OUTPUT/PACKAGED-MAGISKBOOT-FILE.txt"

          QEMU_ARM="$(command -v qemu-arm-static)"
          test -x "$QEMU_ARM"
          echo "QEMU_ARM=$QEMU_ARM" >> "$GITHUB_ENV"

          mkdir -p "$WORK/harness/bin"

          cat > "$WORK/harness/bin/getprop" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            ro.boot.slot_suffix)
              printf '%s\n' "${FAKE_SLOT:-}"
              ;;
            ro.boot.slot)
              case "${FAKE_SLOT:-}" in
                _a) printf '%s\n' 'a' ;;
                _b) printf '%s\n' 'b' ;;
                _c) printf '%s\n' 'c' ;;
              esac
              ;;
            *)
              exit 0
              ;;
          esac
          EOF

          cat > "$WORK/harness/bin/blockdev" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            --setrw)
              exit 0
              ;;
            --getro)
              printf '%s\n' '0'
              exit 0
              ;;
            *)
              exit 0
              ;;
          esac
          EOF

          cat > "$WORK/harness/bin/magiskboot" <<'EOF'
          #!/usr/bin/env bash
          exec "$QEMU_ARM" "$AKHOME/tools/magiskboot" "$@"
          EOF

          chmod 755 \
            "$WORK/harness/bin/getprop" \
            "$WORK/harness/bin/blockdev" \
            "$WORK/harness/bin/magiskboot"

          bash -n "$WORK/harness/bin/getprop"
          bash -n "$WORK/harness/bin/blockdev"
          bash -n "$WORK/harness/bin/magiskboot"

          {
            echo "W42_HOST_HARNESS=PASS"
            echo "PROMOTED_RELEASE_SCRIPT=W41_EXACT"
            echo "MAGISKBOOT_RUNTIME=EXACT_PACKAGED_ANDROID_BINARY_VIA_QEMU"
            echo "GETPROP=FAKE_SLOT_ONLY"
            echo "BLOCKDEV=REGULAR_FILE_NO_OP"
            echo "CUSTOMDD=HOST_ONLY_BOUNDED_128_MIB"
            echo "REAL_DEVICE_BLOCKS=NO"
          } | tee "$OUTPUT/HARNESS-STATUS.txt"

      - name: Execute exact promoted release script for active slots A and B
        shell: bash
        run: |
          set -euo pipefail

          cleanup_dev_links() {
            sudo rm -f \
              /dev/block/by-name/boot_a \
              /dev/block/by-name/boot_b \
              /dev/block/by-name/boot_c \
              /dev/block/by-name/boot \
              2>/dev/null || true

            sudo rmdir /dev/block/by-name 2>/dev/null || true
            sudo rmdir /dev/block 2>/dev/null || true
          }

          trap cleanup_dev_links EXIT
          cleanup_dev_links

          sudo mkdir -p /dev/block/by-name

          run_valid_case() {
            local label="$1"
            local slot="$2"
            local target_name="$3"
            local other_name="$4"

            local dir="$CASES/$label"
            local pkg="$dir/package"
            local target="$dir/$target_name.img"
            local other="$dir/$other_name.img"

            rm -rf "$dir"
            mkdir -p "$dir"
            cp -a "$PACKAGE" "$pkg"

            test "$(sha256sum "$pkg/anykernel.sh" | awk '{print $1}')" = \
              "$RELEASE_ANYKERNEL_SHA256"

            truncate -s "$BOOT_PARTITION_SIZE" "$target"
            truncate -s "$BOOT_PARTITION_SIZE" "$other"

            dd \
              if="$INPUTS/validated-real-boot.img" \
              of="$target" \
              bs=1048576 \
              conv=notrunc \
              status=none

            dd \
              if="$INPUTS/validated-real-boot.img" \
              of="$other" \
              bs=1048576 \
              conv=notrunc \
              status=none

            local target_before other_before
            target_before="$(sha256sum "$target" | awk '{print $1}')"
            other_before="$(sha256sum "$other" | awk '{print $1}')"

            sudo ln -s "$target" "/dev/block/by-name/$target_name"
            sudo ln -s "$other" "/dev/block/by-name/$other_name"

            (
              cd "$pkg"

              export AKHOME="$pkg"
              export OUTFD=1
              export FAKE_SLOT="$slot"
              export PATH="$WORK/harness/bin:$PATH"

              # Host-only bounded dd geometry. A real block partition naturally
              # terminates at its device size; an ordinary test file does not.
              export CUSTOMDD="bs=1048576 count=128 conv=notrunc status=none"

              bash anykernel.sh
            ) > "$OUTPUT/${label}-runtime.log" 2>&1

            local target_after other_after
            target_after="$(sha256sum "$target" | awk '{print $1}')"
            other_after="$(sha256sum "$other" | awk '{print $1}')"

            test "$target_after" != "$target_before"
            test "$other_after" = "$other_before"

            rm -rf "$dir/final-unpack"
            mkdir -p "$dir/final-unpack"
            cp "$target" "$dir/final-unpack/boot-partition.img"

            (
              cd "$dir/final-unpack"
              "$QEMU_ARM" \
                "$pkg/tools/magiskboot" \
                unpack \
                -h \
                boot-partition.img \
                > "$OUTPUT/${label}-final-unpack.log" \
                2>&1
            )

            test -s "$dir/final-unpack/kernel"
            test -s "$dir/final-unpack/ramdisk.cpio"
            test "$(sha256sum "$dir/final-unpack/kernel" | awk '{print $1}')" = \
              "$W33_IMAGE_SHA256"

            rm -rf "$dir/source-unpack"
            mkdir -p "$dir/source-unpack"
            cp \
              "$INPUTS/validated-real-boot.img" \
              "$dir/source-unpack/source.img"

            (
              cd "$dir/source-unpack"
              "$QEMU_ARM" \
                "$pkg/tools/magiskboot" \
                unpack \
                -h \
                source.img \
                > "$OUTPUT/${label}-source-unpack.log" \
                2>&1
            )

            test -s "$dir/source-unpack/ramdisk.cpio"
            cmp -s \
              "$dir/source-unpack/ramdisk.cpio" \
              "$dir/final-unpack/ramdisk.cpio"

            {
              echo "CASE=$label"
              echo "RESULT=PASS"
              echo "FAKE_SLOT=$slot"
              echo "TARGET=$target_name"
              echo "TARGET_BEFORE_SHA256=$target_before"
              echo "TARGET_AFTER_SHA256=$target_after"
              echo "OTHER_BEFORE_SHA256=$other_before"
              echo "OTHER_AFTER_SHA256=$other_after"
              echo "OTHER_PARTITION_UNCHANGED=YES"
              echo "W33_KERNEL_SHA256_MATCH=YES"
              echo "RAMDISK_LOGICAL_BYTES_PRESERVED=YES"
              echo "REAL_DEVICE_WRITE=NO"
            } | tee "$OUTPUT/${label}-status.txt"

            sudo rm -f \
              "/dev/block/by-name/$target_name" \
              "/dev/block/by-name/$other_name"
          }

          run_valid_case \
            "CASE-A-ACTIVE" \
            "_a" \
            "boot_a" \
            "boot_b"

          run_valid_case \
            "CASE-B-ACTIVE" \
            "_b" \
            "boot_b" \
            "boot_a"

          A_FINAL="$CASES/CASE-A-ACTIVE/boot_a.img"
          B_FINAL="$CASES/CASE-B-ACTIVE/boot_b.img"

          A_SHA="$(sha256sum "$A_FINAL" | awk '{print $1}')"
          B_SHA="$(sha256sum "$B_FINAL" | awk '{print $1}')"

          test "$A_SHA" = "$B_SHA"
          cmp -s "$A_FINAL" "$B_FINAL"
          test "$A_SHA" = "$EXPECTED_FINAL_BOOT_SHA256"

          {
            echo "VALID_SLOT_RUNTIME=PASS"
            echo "SLOT_A_FINAL_SHA256=$A_SHA"
            echo "SLOT_B_FINAL_SHA256=$B_SHA"
            echo "VALID_SLOT_OUTPUTS_BYTE_IDENTICAL=YES"
            echo "EXPECTED_FINAL_BOOT_SHA256_MATCH=YES"
            echo "W33_KERNEL_MATCH=YES"
            echo "RAMDISK_LOGICAL_BYTES_PRESERVED=YES"
            echo "REAL_DEVICE_WRITE=NO"
          } | tee "$OUTPUT/VALID-SLOT-VERDICT.txt"

      - name: Verify invalid slot fails closed without writes
        shell: bash
        run: |
          set -euo pipefail

          cleanup_dev_links() {
            sudo rm -f \
              /dev/block/by-name/boot_a \
              /dev/block/by-name/boot_b \
              /dev/block/by-name/boot_c \
              /dev/block/by-name/boot \
              2>/dev/null || true
          }

          trap cleanup_dev_links EXIT
          cleanup_dev_links
          sudo mkdir -p /dev/block/by-name

          DIR="$CASES/CASE-C-INVALID"
          PKG="$DIR/package"

          rm -rf "$DIR"
          mkdir -p "$DIR"
          cp -a "$PACKAGE" "$PKG"

          test "$(sha256sum "$PKG/anykernel.sh" | awk '{print $1}')" = \
            "$RELEASE_ANYKERNEL_SHA256"

          truncate -s "$BOOT_PARTITION_SIZE" "$DIR/boot_a.img"
          truncate -s "$BOOT_PARTITION_SIZE" "$DIR/boot_b.img"

          dd \
            if="$INPUTS/validated-real-boot.img" \
            of="$DIR/boot_a.img" \
            bs=1048576 \
            conv=notrunc \
            status=none

          dd \
            if="$INPUTS/validated-real-boot.img" \
            of="$DIR/boot_b.img" \
            bs=1048576 \
            conv=notrunc \
            status=none

          A_BEFORE="$(sha256sum "$DIR/boot_a.img" | awk '{print $1}')"
          B_BEFORE="$(sha256sum "$DIR/boot_b.img" | awk '{print $1}')"

          sudo ln -s "$DIR/boot_a.img" /dev/block/by-name/boot_a
          sudo ln -s "$DIR/boot_b.img" /dev/block/by-name/boot_b

          set +e
          (
            cd "$PKG"

            export AKHOME="$PKG"
            export OUTFD=1
            export FAKE_SLOT="_c"
            export PATH="$WORK/harness/bin:$PATH"
            export CUSTOMDD="bs=1048576 count=128 conv=notrunc status=none"

            bash anykernel.sh
          ) > "$OUTPUT/CASE-C-INVALID-runtime.log" 2>&1
          INVALID_RC=$?
          set -e

          test "$INVALID_RC" -ne 0

          A_AFTER="$(sha256sum "$DIR/boot_a.img" | awk '{print $1}')"
          B_AFTER="$(sha256sum "$DIR/boot_b.img" | awk '{print $1}')"

          test "$A_AFTER" = "$A_BEFORE"
          test "$B_AFTER" = "$B_BEFORE"

          grep -Eq \
            'Unable to determine .*boot.*partition|Unable to determine boot partition|Invalid partition|Aborting' \
            "$OUTPUT/CASE-C-INVALID-runtime.log"

          {
            echo "CASE=CASE-C-INVALID"
            echo "RESULT=PASS_FAIL_CLOSED"
            echo "EXIT_CODE=$INVALID_RC"
            echo "FAKE_SLOT=_c"
            echo "BOOT_A_BEFORE_SHA256=$A_BEFORE"
            echo "BOOT_A_AFTER_SHA256=$A_AFTER"
            echo "BOOT_B_BEFORE_SHA256=$B_BEFORE"
            echo "BOOT_B_AFTER_SHA256=$B_AFTER"
            echo "TARGETS_UNCHANGED=YES"
            echo "REAL_DEVICE_WRITE=NO"
          } | tee "$OUTPUT/CASE-C-INVALID-status.txt"

          cleanup_dev_links

      - name: Derive W42 installable release verdict
        shell: bash
        run: |
          set -euo pipefail

          grep -Fxq 'W37_INPUT_GATE=PASS' \
            "$OUTPUT/W37-INPUT-GATE.txt"
          grep -Fxq 'W41_APPROVAL_GATE=PASS' \
            "$OUTPUT/W41-APPROVAL-GATE.txt"
          grep -Fxq 'AK3_INSTALLER_METADATA=PASS' \
            "$OUTPUT/AK3-INSTALLER-METADATA.txt"
          grep -Fxq 'VALIDATED_REAL_BOOT_INPUT=PASS' \
            "$OUTPUT/REAL-BOOT-INPUT.txt"
          grep -Fxq 'INSTALLABLE_RELEASE_PROMOTION=PASS' \
            "$OUTPUT/RELEASE-PROMOTION-STATUS.txt"
          grep -Fxq 'W42_HOST_HARNESS=PASS' \
            "$OUTPUT/HARNESS-STATUS.txt"

          grep -Fxq 'RESULT=PASS' \
            "$OUTPUT/CASE-A-ACTIVE-status.txt"
          grep -Fxq 'RESULT=PASS' \
            "$OUTPUT/CASE-B-ACTIVE-status.txt"
          grep -Fxq 'VALID_SLOT_RUNTIME=PASS' \
            "$OUTPUT/VALID-SLOT-VERDICT.txt"
          grep -Fxq 'VALID_SLOT_OUTPUTS_BYTE_IDENTICAL=YES' \
            "$OUTPUT/VALID-SLOT-VERDICT.txt"
          grep -Fxq 'RESULT=PASS_FAIL_CLOSED' \
            "$OUTPUT/CASE-C-INVALID-status.txt"
          grep -Fxq 'TARGETS_UNCHANGED=YES' \
            "$OUTPUT/CASE-C-INVALID-status.txt"

          RELEASE_SHA="$(
            sed -n 's/^RELEASE_ZIP_SHA256=//p' \
              "$OUTPUT/RELEASE-PROMOTION-STATUS.txt"
          )"

          RELEASE_BYTES="$(
            sed -n 's/^RELEASE_ZIP_BYTES=//p' \
              "$OUTPUT/RELEASE-PROMOTION-STATUS.txt"
          )"

          test -n "$RELEASE_SHA"
          test -n "$RELEASE_BYTES"

          {
            echo "FINAL_RESULT=PASS_GEN2_42_V3_VEUX_PEUX_INSTALLABLE_AK3_RELEASE_PROMOTION"
            echo "TARGET_SCOPE=VEUX_AND_PEUX"
            echo "W37_NONFLASHING_STAGING_INPUT=PASS"
            echo "W41_RELEASE_READINESS=PASS"
            echo "W41_DUAL_DEVICE_FUNCTIONAL_SCRIPT_PROMOTED=YES"
            echo "RELEASE_LABEL_ONLY_DELTA=YES"
            echo "RELEASE_METADATA_COHERENCE=PASS"
            echo "PINNED_AK3_META_INF=PASS"
            echo "RECOVERY_INSTALLABLE_ZIP_CREATED=YES"
            echo "INSTALLABLE_PACKAGE_PROMOTED=YES"
            echo "RELEASE_ZIP_NAME=$RELEASE_ZIP_NAME"
            echo "RELEASE_ZIP_SHA256=$RELEASE_SHA"
            echo "RELEASE_ZIP_BYTES=$RELEASE_BYTES"
            echo "DETERMINISTIC_RELEASE_BYTES=YES"
            echo "ACTIVE_SLOT_A_RUNTIME=PASS"
            echo "ACTIVE_SLOT_B_RUNTIME=PASS"
            echo "SLOT_A_B_OUTPUTS_BYTE_IDENTICAL=YES"
            echo "INVALID_SLOT_FAIL_CLOSED=PASS"
            echo "W33_KERNEL_INSERTED_EXACTLY=YES"
            echo "RAMDISK_LOGICAL_BYTES_PRESERVED=YES"
            echo "OTHER_SLOT_PRESERVED=YES"
            echo "VENDOR_BOOT_TOUCHED=NO"
            echo "DTBO_TOUCHED=NO"
            echo "TOP_LEVEL_VBMETA_TOUCHED=NO"
            echo "VEUX_RUNTIME_VALIDATION=PASS"
            echo "PEUX_STATIC_COMPATIBILITY=PASS"
            echo "PEUX_PHYSICAL_RUNTIME_VALIDATION=NOT_PERFORMED"
            echo "REAL_DEVICE_ACCESSED=NO"
            echo "ADB_USED=NO"
            echo "FASTBOOT_USED=NO"
            echo "FLASHING_PERFORMED=NO"
            echo "REAL_DEVICE_BOOT_TEST_REQUIRED=YES"
            echo "NEXT_STEP=OPTIONAL_EXPLICITLY_APPROVED_PHYSICAL_DEVICE_TEST"
          } | tee "$OUTPUT/W42-VERDICT.txt"

      - name: Write failure safe W42 release report
        if: always()
        shell: bash
        run: |
          set +e

          REPORT='GEN2_42_V3_VEUX_PEUX_INSTALLABLE_AK3_RELEASE_PROMOTION_AUDIT.txt'

          {
            cat "$OUTPUT/AUDIT-HEADER.txt" 2>/dev/null
            echo
            echo "=== SCOPE ==="
            cat "$OUTPUT/SCOPE.txt" 2>/dev/null
            echo

            for f in \
              "$OUTPUT/INPUT-ARTIFACTS.txt" \
              "$OUTPUT/W37-INPUT-GATE.txt" \
              "$OUTPUT/W41-APPROVAL-GATE.txt" \
              "$OUTPUT/AK3-INSTALLER-METADATA.txt" \
              "$OUTPUT/REAL-BOOT-INPUT.txt" \
              "$OUTPUT/RELEASE-PROMOTION-STATUS.txt" \
              "$OUTPUT/PACKAGED-MAGISKBOOT-FILE.txt" \
              "$OUTPUT/HARNESS-STATUS.txt" \
              "$OUTPUT/CASE-A-ACTIVE-status.txt" \
              "$OUTPUT/CASE-B-ACTIVE-status.txt" \
              "$OUTPUT/VALID-SLOT-VERDICT.txt" \
              "$OUTPUT/CASE-C-INVALID-status.txt" \
              "$OUTPUT/W42-VERDICT.txt"
            do
              if [ -f "$f" ]; then
                echo "=== $(basename "$f") ==="
                cat "$f"
                echo
              fi
            done

            echo "REAL_DEVICE_ACCESSED=NO"
            echo "ADB_USED=NO"
            echo "FASTBOOT_USED=NO"
            echo "FLASHING_PERFORMED=NO"
          } > "$REPORT"

          test -s "$REPORT"

      - name: Upload W42 installable dual device release
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GEN2_42_V3_VEUX_PEUX_INSTALLABLE_AK3_RELEASE-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            GEN2_42_V3_VEUX_PEUX_INSTALLABLE_AK3_RELEASE_PROMOTION_AUDIT.txt
            w42v3/output/

      - name: Fail only after preserving W42 release diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -Fxq \
            'FINAL_RESULT=PASS_GEN2_42_V3_VEUX_PEUX_INSTALLABLE_AK3_RELEASE_PROMOTION' \
            "$OUTPUT/W42-VERDICT.txt" 2>/dev/null; then
            echo "ERROR: W42 final PASS verdict was not produced."
            exit 1
          fi

          test -s "$OUTPUT/$RELEASE_ZIP_NAME"
          test -s "$OUTPUT/$RELEASE_ZIP_NAME.sha256"

          echo "W42 installable VEUX/PEUX release PASS confirmed after artifact upload."
