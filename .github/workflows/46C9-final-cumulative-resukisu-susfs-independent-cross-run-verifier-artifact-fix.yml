          CORE="drivers/cpuidle/cpuidle.c"
          HEADER="include/linux/cpuidle.h"
          DEFCONFIG="arch/arm64/configs/veux_defconfig"

          HZ_SHA="$(
            sha256sum kernel/Kconfig.hz \
              | awk '{print $1}'
          )"

          if [ "$HZ_SHA" != "$EXPECTED_HZ_KCONFIG_SHA256" ]; then
            echo "ERROR: HZ Kconfig hash mismatch"
            exit 1
          fi

          grep -qF \
            'default HZ_250' \
            kernel/Kconfig.hz

          if grep -qE \
            '^CONFIG_HZ_(100|250|300|1000)=y$' \
            "$DEFCONFIG"
          then
            echo "ERROR: explicit HZ selection remains"
            exit 1
          fi

          grep -qx \
            'CONFIG_CPUSETS=y' \
            "$DEFCONFIG"

          grep -qx \
            '# CONFIG_SPRD_ROTATION_TASK is not set' \
            "$DEFCONFIG"

          grep -qF \
            'time_after_eq(jiffies, sg->sgc->next_update)' \
            kernel/sched/fair.c

          grep -qF \
            'arch_scale_max_freq_capacity(NULL, cpu)' \
            kernel/sched/cass.c

          grep -qF \
            'curr->cap_no_therm' \
            kernel/sched/cass.c

          grep -qx \
            '#define LOAD_AVG_PERIOD 8' \
            kernel/sched/sched-pelt.h

          if grep -qF \
            'mult_frac(100, freq - h_freq, l_freq - h_freq) < 20' \
            "$SUGOV"
          then
            echo "ERROR: schedutil lower-step heuristic remains"
            exit 1
          fi

          if grep -qF \
            'uclamp_rq_util_with(rq, util, p) < util' \
            "$SUGOV"
          then
            echo "ERROR: schedutil cap-only UClamp remains"
            exit 1
          fi

          grep -qF \
            'return cpufreq_driver_resolve_freq(policy, freq);' \
            "$SUGOV"

          if grep -qF \
            'if (&policy->object == &policy->min)' \
            "$CPUFREQ"
          then
            echo "ERROR: CPUFreq min no-op remains"
            exit 1
          fi

          if grep -qF \
            'if (&policy->object == &policy->max)' \
            "$CPUFREQ"
          then
            echo "ERROR: CPUFreq max special-case remains"
            exit 1
          fi

          if grep -qF \
            'val = policy->min;' \
            "$CPUFREQ"
          then
            echo "ERROR: CPUFreq max/min clamp remains"
            exit 1
          fi

          grep -qF \
            'freq_qos_update_request(policy->object##_freq_req, val);' \
            "$CPUFREQ"

          grep -qF \
            'static bool sleep_disabled;' \
            "$LPM"

          grep -qF \
            'module_param_named(sleep_disabled, sleep_disabled, bool, 0664);' \
            "$LPM"

          for TOKEN in \
            'lpm_drm_panel_notify' \
            'goodix_get_panel' \
            'drm_panel_notifier_register' \
            'bool lpm_sleep_disabled(void)'
          do
            if grep -qF "$TOKEN" "$LPM"; then
              echo "ERROR: custom idle token remains: $TOKEN"
              exit 1
            fi
          done

          if grep -qF \
            'lpm_sleep_disabled' \
            "$CORE"
          then
            echo "ERROR: lpm_sleep_disabled remains in cpuidle core"
            exit 1
          fi

          if grep -qF \
            'lpm_sleep_disabled' \
            "$HEADER"
          then
            echo "ERROR: lpm_sleep_disabled remains in cpuidle header"
            exit 1
          fi

          if grep -qF \
            'update_cpumask(cs, trialcs, "0-7")' \
            kernel/cgroup/cpuset.c
          then
            echo "ERROR: hardcoded CPUSET mask remains"
            exit 1
          fi

          grep -qF \
            'update_cpumask(cs, trialcs, buf)' \
            kernel/cgroup/cpuset.c

          git diff --check \
            > "$ARTIFACT_DIR/CUMULATIVE-GIT-DIFF-CHECK.txt" \
            2>&1

          {
            echo "CUMULATIVE_SOURCE_CHECK=PASS"
            echo "CPUFREQ_MIN_NOOP=REMOVED"
            echo "CPUFREQ_MAX_BELOW_MIN_CLAMP=REMOVED"
            echo "CPUFREQ_STANDARD_QOS_WRITE=YES"
            echo "DISPLAY_COUPLED_SLEEP_POLICY=REMOVED"
            echo "SCHEDUTIL_STANDARD=YES"
            echo "CASS_MAXFREQ=YES"
            echo "SPRD_ROTATION_DISABLED=YES"
            echo "LB_CAPACITY_RATE_LIMIT=YES"
            echo "CPUSETS_ENABLED=YES"
            echo "PELT8_XIAOMI=YES"
            echo "VEUX_DEFCONFIG_EXPLICIT_HZ=NO"
          } | tee "$ARTIFACT_DIR/CUMULATIVE-SOURCE-STATE.txt"

      - name: Commit and gate isolated cumulative baseline
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          git status --short \
            > "$ARTIFACT_DIR/CUMULATIVE-PRECOMMIT-STATUS.txt"

          git add -A

          PRECOMMIT_TREE="$(git write-tree)"

          if [ "$PRECOMMIT_TREE" != "$EXPECTED_CUMULATIVE_TREE" ]; then
            echo "ERROR: cumulative 44C tree mismatch before commit"
            echo "Expected: $EXPECTED_CUMULATIVE_TREE"
            echo "Actual:   $PRECOMMIT_TREE"
            git diff --cached --stat
            exit 1
          fi

          git commit \
            -m "audit: exact cumulative 44C corrected baseline"

          CUMULATIVE_SHA="$(git rev-parse HEAD)"
          CUMULATIVE_TREE="$(git rev-parse HEAD^{tree})"

          if [ "$CUMULATIVE_TREE" != "$EXPECTED_CUMULATIVE_TREE" ]; then
            echo "ERROR: committed cumulative tree mismatch"
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: cumulative baseline not clean after commit"
            git status --short
            exit 1
          fi

          {
            echo "CUMULATIVE_SHA=$CUMULATIVE_SHA"
            echo "CUMULATIVE_TREE=$CUMULATIVE_TREE"
            echo "CUMULATIVE_BASELINE_CLEAN=YES"
            echo "GIT_AUTHOR_DATE=$GIT_AUTHOR_DATE"
            echo "GIT_COMMITTER_DATE=$GIT_COMMITTER_DATE"
            echo "DETERMINISTIC_GIT_METADATA=YES"
          } | tee "$ARTIFACT_DIR/CUMULATIVE-BASELINE-IDENTITY.txt"

          {
            echo "CUMULATIVE_SHA=$CUMULATIVE_SHA"
            echo "CUMULATIVE_TREE=$CUMULATIVE_TREE"
          } >> "$GITHUB_ENV"

      - name: Verify clean pre SUSFS cumulative state
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD^{tree})" != "$EXPECTED_CUMULATIVE_TREE" ]; then
            echo "ERROR: pre-SUSFS cumulative tree changed"
            exit 1
          fi

          MATCHES="$(
            grep -RInE \
              --exclude-dir=.git \
              --exclude-dir=out \
              --exclude-dir=kernelsu \
              --include='*.c' \
              --include='*.h' \
              --include='Kconfig*' \
              --include='Makefile*' \
              --include='*.mk' \
              '(^|[^A-Za-z0-9_])(CONFIG_KSU_SUSFS|CONFIG_SUSFS|susfs_[A-Za-z0-9_]+|SUSFS_VERSION|susfs\.h|susfs_def\.h)([^A-Za-z0-9_]|$)' \
              fs \
              include \
              kernel \
              security \
              mm \
              drivers \
              2>/dev/null || true
          )"

          if [ -n "$MATCHES" ]; then
            printf '%s\n' "$MATCHES" \
              | tee "$ARTIFACT_DIR/PRE-SUSFS-GUARD.txt"

            echo "ERROR: pre-existing kernel-side SUSFS detected"
            exit 1
          fi

          echo "No existing SUSFS kernel-side backport detected." \
            | tee "$ARTIFACT_DIR/PRE-SUSFS-GUARD.txt"

      - name: Fetch exact approved SUSFS 2.2 backport
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$PATCH_DIR/susfs_patch_to_5.4-v2.2.00.patch"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 300 \
            "https://raw.githubusercontent.com/${BACKPORT_REPO}/${BACKPORT_COMMIT}/${BACKPORT_PATCH_PATH}" \
            -o "$PATCH"

          ACTUAL_BLOB="$(
            git hash-object "$PATCH"
          )"

          ACTUAL_SHA="$(
            sha256sum "$PATCH" \
              | awk '{print $1}'
          )"

          if [ "$ACTUAL_BLOB" != "$BACKPORT_PATCH_BLOB" ]; then
            echo "ERROR: SUSFS patch Git blob mismatch"
            echo "Expected: $BACKPORT_PATCH_BLOB"
            echo "Actual:   $ACTUAL_BLOB"
            exit 1
          fi

          if [ "$ACTUAL_SHA" != "$BACKPORT_PATCH_SHA256" ]; then
            echo "ERROR: SUSFS patch SHA-256 mismatch"
            echo "Expected: $BACKPORT_PATCH_SHA256"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

          cp \
            "$PATCH" \
            "$ARTIFACT_DIR/susfs_patch_to_5.4-v2.2.00.patch"

          {
            echo "BACKPORT_REPO=$BACKPORT_REPO"
            echo "BACKPORT_COMMIT=$BACKPORT_COMMIT"
            echo "BACKPORT_PATCH_GIT_BLOB=$ACTUAL_BLOB"
            echo "BACKPORT_PATCH_SHA256=$ACTUAL_SHA"
          } | tee "$ARTIFACT_DIR/PATCH-SOURCE.txt"

      - name: Apply SUSFS base and verify known VEUX reject
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$PATCH_DIR/susfs_patch_to_5.4-v2.2.00.patch"

          find . \
            -type f \
            \( -name '*.rej' -o -name '*.orig' \) \
            -delete

          set +e

          patch \
            --batch \
            --forward \
            --fuzz=0 \
            -p1 \
            < "$PATCH" \
            > "$ARTIFACT_DIR/BASE-PATCH.log" \
            2>&1

          PATCH_RC=$?

          set -e

          printf '%s\n' "$PATCH_RC" \
            > "$ARTIFACT_DIR/BASE-PATCH.exit-code"

          find . \
            -type f \
            -name '*.rej' \
            -print \
            | sort \
            > "$ARTIFACT_DIR/BASE-REJECT-FILES.txt"

          REJECT_COUNT="$(
            wc -l < "$ARTIFACT_DIR/BASE-REJECT-FILES.txt" \
              | tr -d ' '
          )"

          if [ "$PATCH_RC" -ne 1 ]; then
            echo "ERROR: expected base patch exit code 1"
            cat "$ARTIFACT_DIR/BASE-PATCH.log"
            exit 1
          fi

          if [ "$REJECT_COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly one reject"
            cat "$ARTIFACT_DIR/BASE-REJECT-FILES.txt"
            exit 1
          fi

          if ! grep -Fxq \
            './fs/proc/task_mmu.c.rej' \
            "$ARTIFACT_DIR/BASE-REJECT-FILES.txt"
          then
            echo "ERROR: unexpected reject target"
            cat "$ARTIFACT_DIR/BASE-REJECT-FILES.txt"
            exit 1
          fi

          REJECT_SHA="$(
            sha256sum fs/proc/task_mmu.c.rej \
              | awk '{print $1}'
          )"

          if [ "$REJECT_SHA" != "$EXPECTED_TASK_MMU_REJECT_SHA256" ]; then
            echo "ERROR: task_mmu reject content changed"
            echo "Expected: $EXPECTED_TASK_MMU_REJECT_SHA256"
            echo "Actual:   $REJECT_SHA"
            exit 1
          fi

          cp \
            fs/proc/task_mmu.c.rej \
            "$ARTIFACT_DIR/task_mmu.c.rej"

          {
            echo "BASE_PATCH_EXIT_CODE=$PATCH_RC"
            echo "REJECT_COUNT=$REJECT_COUNT"
            echo "REJECT_PATH=fs/proc/task_mmu.c.rej"
            echo "REJECT_SHA256=$REJECT_SHA"
          } | tee "$ARTIFACT_DIR/BASE-PATCH-GUARD.txt"

      - name: Replace legacy KernelSU with pinned ReSukiSU
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d drivers/kernelsu ]; then
            echo "ERROR: legacy drivers/kernelsu missing"
            exit 1
          fi

          find drivers/kernelsu -type f \
            | sort \
            > "$ARTIFACT_DIR/legacy-kernelsu-files.txt"

          rm -rf \
            drivers/kernelsu \
            KernelSU

          git clone \
            https://github.com/ReSukiSU/ReSukiSU.git \
            KernelSU

          git -C KernelSU checkout \
            --detach \
            "$RESUKISU_COMMIT"

          ACTUAL_KSU="$(git -C KernelSU rev-parse HEAD)"

          if [ "$ACTUAL_KSU" != "$RESUKISU_COMMIT" ]; then
            echo "ERROR: ReSukiSU pin mismatch"
            exit 1
          fi

          ln -s \
            ../KernelSU/kernel \
            drivers/kernelsu

          if [ \
            "$(readlink -f drivers/kernelsu)" != \
            "$(readlink -f KernelSU/kernel)" \
          ]; then
            echo "ERROR: drivers/kernelsu symlink mismatch"
            exit 1
          fi

          grep -qF \
            'config KSU_SUSFS' \
            KernelSU/kernel/Kconfig

          grep -qF \
            'config KSU_SUSFS_SUS_MAP' \
            KernelSU/kernel/Kconfig

          grep -qF \
            'include $(KSU_SRC)/tools/inline_hook_check.mk' \
            KernelSU/kernel/Kbuild

          printf '%s\n' "$ACTUAL_KSU" \
            > "$ARTIFACT_DIR/resukisu-commit.txt"

          {
            echo "RESUKISU_COMMIT=$ACTUAL_KSU"
            echo "RESUKISU_IDENTITY=PASS"
            echo "DRIVERS_KERNELSU_SYMLINK=PASS"
          } | tee "$ARTIFACT_DIR/RESUKISU-IDENTITY.txt"

      - name: Audit newer ReSukiSU head for kernel delta
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git -C KernelSU fetch \
            --no-tags \
            origin \
            "$RESUKISU_AUDIT_HEAD"

          git -C KernelSU cat-file -e \
            "${RESUKISU_AUDIT_HEAD}^{commit}"

          POST_PIN_COUNT="$(
            git -C KernelSU rev-list \
              --count \
              "${RESUKISU_COMMIT}..${RESUKISU_AUDIT_HEAD}"
          )"

          if [ "$POST_PIN_COUNT" != "$EXPECTED_RESUKISU_POST_PIN_COMMITS" ]; then
            echo "ERROR: ReSukiSU post-pin commit count changed"
            echo "Expected: $EXPECTED_RESUKISU_POST_PIN_COMMITS"
            echo "Actual:   $POST_PIN_COUNT"
            exit 1
          fi

          git -C KernelSU diff \
            --name-status \
            "$RESUKISU_COMMIT" \
            "$RESUKISU_AUDIT_HEAD" \
            -- kernel/ \
            > "$ARTIFACT_DIR/RESUKISU-KERNEL-DELTA.txt"

          if [ -s "$ARTIFACT_DIR/RESUKISU-KERNEL-DELTA.txt" ]; then
            echo "ERROR: newer ReSukiSU head changes kernel/"
            cat "$ARTIFACT_DIR/RESUKISU-KERNEL-DELTA.txt"
            exit 1
          fi

          {
            echo "RESUKISU_BUILD_PIN=$RESUKISU_COMMIT"
            echo "RESUKISU_AUDIT_HEAD=$RESUKISU_AUDIT_HEAD"
            echo "POST_PIN_COMMITS=$POST_PIN_COUNT"
            echo "RESUKISU_NEW_KERNEL_DELTA=NO"
            echo "RESUKISU_KERNEL_PIN_CHANGE_REQUIRED=NO"
          } | tee "$ARTIFACT_DIR/RESUKISU-HEAD-AUDIT.txt"

      - name: Apply exact warning-clean VEUX SUSFS and ReSukiSU adaptation
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new, label):
              text = read(path)
              count = text.count(old)

              if count == 1:
                  write(path, text.replace(old, new, 1))
                  return

              parts = re.split(r"(\s+)", old)
              pattern = ""

              for part in parts:
                  if not part:
                      continue
                  if re.fullmatch(r"\s+", part):
                      pattern += r"\s+"
                  else:
                      pattern += re.escape(part)

              matches = list(re.finditer(pattern, text, flags=re.S))

              if len(matches) != 1:
                  raise SystemExit(
                      f"{label}: literal matches={count}, "
                      f"whitespace-tolerant matches={len(matches)} in {path}"
                  )

              match = matches[0]
              write(path, text[:match.start()] + new + text[match.end():])

          def regex_once(path, pattern, replacement, label, flags=re.S):
              text = read(path)
              new_text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=flags,
              )

              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one regex match "
                      f"in {path}, got {count}"
                  )

              write(path, new_text)

          task = "fs/proc/task_mmu.c"

          task_include = """#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)
          #include <linux/susfs_def.h>
          #endif // #if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)
          """

          text = read(task)

          if "#include <linux/susfs_def.h>" not in text:
              anchor = "#include <linux/pkeys.h>\n"

              if text.count(anchor) != 1:
                  raise SystemExit("task_mmu include anchor mismatch")

              text = text.replace(anchor, anchor + task_include, 1)

          task_externs = """#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
          extern void susfs_sus_kstat_spoof_show_map_vma(struct inode *inode, dev_t *out_dev, unsigned long *out_ino);
          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
          #ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT
          extern struct srcu_struct susfs_srcu_open_redirect;
          extern int susfs_open_redirect_spoof_show_map_vma_srcu(struct inode *inode, unsigned long *out_ino, dev_t *out_dev, char **out_spoofed_name);
          #endif // #ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT

          """

          if "extern struct srcu_struct susfs_srcu_open_redirect;" not in text:
              anchor = (
                  "static void\n"
                  "show_map_vma(struct seq_file *m, struct vm_area_struct *vma)\n"
              )

              if text.count(anchor) != 1:
                  raise SystemExit("task_mmu show_map_vma anchor mismatch")

              text = text.replace(anchor, task_externs + anchor, 1)

          write(task, text)

          reject = Path("fs/proc/task_mmu.c.rej")

          if not reject.exists():
              raise SystemExit(
                  "expected task_mmu reject file disappeared before repair"
              )

          reject.unlink()

          stat_path = Path("fs/stat.c")
          stat_text = stat_path.read_text()

          obsolete_stat_decl = (
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "extern int susfs_get_non_sus_mnt_id_from_mnt(struct mount *orig_mnt);\n"
              "#endif\n"
          )

          obsolete_count = stat_text.count(obsolete_stat_decl)

          if obsolete_count != 1:
              raise SystemExit(
                  "warning cleanup expected exactly one "
                  "susfs_get_non_sus_mnt_id_from_mnt declaration "
                  f"in fs/stat.c, got {obsolete_count}"
              )

          stat_path.write_text(
              stat_text.replace(obsolete_stat_decl, "", 1)
          )

          namei = "fs/namei.c"
          text = read(namei)
          old = "\t\treturn dentry;\t\n"

          if text.count(old) != 1:
              raise SystemExit(
                  "namei trailing-whitespace normalization expected "
                  f"1 match, got {text.count(old)}"
              )

          write(namei, text.replace(old, "\t\treturn dentry;\n", 1))

          regex_once(
              "fs/exec.c",
              r'#ifdef CONFIG_KSU\n'
              r'extern bool ksu_execveat_hook __read_mostly;\n'
              r'extern int ksu_handle_execveat\(int \*fd, struct filename \*\*filename_ptr,\n'
              r'.*?'
              r'#endif\n(?=static int do_execveat_common)',
              """#ifdef CONFIG_KSU_SUSFS
          #include <linux/jump_label.h>
          #include <linux/susfs_def.h>
          extern struct static_key_true ksu_su_compat_enabled;
          extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;
          extern int ksu_handle_execveat(
                  int *fd,
                  struct filename **filename_ptr,
                  void *argv,
                  void *envp,
                  int *flags);
          extern int ksu_handle_execveat_sucompat(
                  int *fd,
                  struct filename **filename_ptr,
                  void *argv,
                  void *envp,
                  int *flags);
          #endif
          """,
              "exec old declaration replacement",
          )

          regex_once(
              "fs/exec.c",
              r'#ifdef CONFIG_KSU\n'
              r'\s*if \(unlikely\(ksu_execveat_hook\)\)\n'
              r'.*?'
              r'#endif\n',
              """#ifdef CONFIG_KSU_SUSFS
              if (!likely(susfs_is_current_proc_umounted())) {
                  if (static_branch_likely(&ksu_su_compat_enabled)) {
                      if (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted))
                          ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
                  } else {
                      ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
                  }
              }
          #endif
          """,
              "exec old call replacement",
          )

          regex_once(
              "fs/open.c",
              r'#ifdef CONFIG_KSU\n'
              r'extern int ksu_handle_faccessat\(int \*dfd, const char __user \*\*filename_user,\n'
              r'.*?'
              r'#endif\n',
              """#ifdef CONFIG_KSU_SUSFS
          #include <linux/jump_label.h>
          #include <linux/susfs_def.h>
          extern struct static_key_true ksu_su_compat_enabled;
          extern bool __ksu_is_allow_uid_for_current(uid_t uid);
          extern int ksu_handle_faccessat(
                  int *dfd,
                  const char __user **filename_user,
                  int *mode,
                  int *flags);
          #endif
          """,
              "open old declaration replacement",
          )

          regex_once(
              "fs/open.c",
              r'#ifdef CONFIG_KSU\n'
              r'\s*ksu_handle_faccessat\(&dfd, &filename, &mode, NULL\);\n'
              r'#endif\n',
              """#ifdef CONFIG_KSU_SUSFS
              if (!likely(susfs_is_current_proc_umounted()) &&
                  static_branch_likely(&ksu_su_compat_enabled) &&
                  unlikely(__ksu_is_allow_uid_for_current(current_uid().val)))
                  ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          """,
              "open old call replacement",
          )

          regex_once(
              "fs/read_write.c",
              r'#ifdef CONFIG_KSU\n'
              r'extern bool ksu_vfs_read_hook __read_mostly;\n'
              r'extern int ksu_handle_vfs_read\(struct file \*\*file_ptr, char __user \*\*buf_ptr,\n'
              r'.*?'
              r'#endif\n',
              "",
              "read_write old declaration removal",
          )

          regex_once(
              "fs/read_write.c",
              r'#ifdef CONFIG_KSU\n'
              r'\s*if \(unlikely\(ksu_vfs_read_hook\)\)\n'
              r'\s*ksu_handle_vfs_read\(&file, &buf, &count, &pos\);\n'
              r'#endif\n',
              "",
              "read_write old call removal",
          )

          replace_once(
              "fs/read_write.c",
              "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n",
              """#ifdef CONFIG_KSU_SUSFS
          #include <linux/jump_label.h>
          extern struct static_key_true ksu_is_init_rc_hook_enabled;
          extern int ksu_handle_sys_read(
                  unsigned int fd,
                  char __user **buf_ptr,
                  size_t *count_ptr);
          #endif

          SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
          """,
              "read syscall declaration insertion",
          )

          replace_once(
