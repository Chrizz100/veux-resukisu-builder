          if [ -s "$SNAPSHOT/Image" ]; then
            cp \
              "$SNAPSHOT/Image" \
              "$ARTIFACT_DIR/failure-output/build-a-Image"
          fi

          if [ -s "$SNAPSHOT/veux.dtb" ]; then
            cp \
              "$SNAPSHOT/veux.dtb" \
              "$ARTIFACT_DIR/failure-output/build-a-veux.dtb"
          fi

          if [ -s "$SNAPSHOT/System.map" ]; then
            cp \
              "$SNAPSHOT/System.map" \
              "$ARTIFACT_DIR/failure-output/build-a-System.map"
          fi

          if [ -s "$SNAPSHOT/vmlinux" ]; then
            {
              echo "BUILD_A_VMLINUX_BYTES=$(stat -c '%s' "$SNAPSHOT/vmlinux")"
              echo "BUILD_A_VMLINUX_SHA256=$(sha256sum "$SNAPSHOT/vmlinux" | awk '{print $1}')"
            } > "$ARTIFACT_DIR/failure-output/build-a-vmlinux-info.txt"
          fi

          if [ -f "kernel/$OUT_DIR/.config" ]; then
            cp \
              "kernel/$OUT_DIR/.config" \
              "$ARTIFACT_DIR/failure-output/current-final.config"
          fi

          if [ -s "kernel/$OUT_DIR/arch/arm64/boot/Image" ]; then
            cp \
              "kernel/$OUT_DIR/arch/arm64/boot/Image" \
              "$ARTIFACT_DIR/failure-output/current-Image"
          fi

          if [ -d "kernel/$OUT_DIR/arch/arm64/boot/dts" ]; then
            find "kernel/$OUT_DIR/arch/arm64/boot/dts" \
              -type f \
              -name 'veux.dtb' \
              -exec cp {} "$ARTIFACT_DIR/failure-output/current-veux.dtb" \; \
              2>/dev/null \
              || true
          fi

          if [ -s "kernel/$OUT_DIR/System.map" ]; then
            cp \
              "kernel/$OUT_DIR/System.map" \
              "$ARTIFACT_DIR/failure-output/current-System.map"
          fi

          if [ -s "kernel/$OUT_DIR/vmlinux" ]; then
            {
              echo "CURRENT_VMLINUX_BYTES=$(stat -c '%s' "kernel/$OUT_DIR/vmlinux")"
              echo "CURRENT_VMLINUX_SHA256=$(sha256sum "kernel/$OUT_DIR/vmlinux" | awk '{print $1}')"
            } > "$ARTIFACT_DIR/failure-output/current-vmlinux-info.txt"
          fi

