      - name: Verify cumulative SUSFS adaptation and inherited diagnostics
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          if find . \
            -type f \
            \( -name '*.rej' -o -name '*.orig' \) \
            | grep -q .
          then
            echo "ERROR: reject/orig files remain"
            exit 1
          fi

          REQUIRED=(
            "ksu_handle_setresuid:kernel/sys.c"
            "ksu_handle_execveat:fs/exec.c"
            "ksu_handle_faccessat:fs/open.c"
            "ksu_handle_sys_read:fs/read_write.c"
            "ksu_handle_stat:fs/stat.c"
            "ksu_handle_sys_reboot:kernel/reboot.c"
            "ksu_handle_input_handle_event:drivers/input/input.c"
            "ksu_handle_vfs_fstat:fs/stat.c"
          )

          for ENTRY in "${REQUIRED[@]}"; do
            HOOK="${ENTRY%%:*}"
            FILE="${ENTRY#*:}"

            if ! grep -wq "$HOOK" "$FILE"; then
              echo "ERROR: required hook missing: $HOOK in $FILE"
              exit 1
            fi
          done

          INCOMPATIBLE=(
            "ksu_vfs_read_hook:fs/read_write.c"
            "ksu_handle_vfs_read:fs/read_write.c"
            "ksu_input_hook:drivers/input/input.c"
            "ksu_execveat_hook:fs/exec.c"
            "ksu_init_rc_hook:fs/read_write.c"
            "ksu_init_rc_hook:fs/stat.c"
          )

          for ENTRY in "${INCOMPATIBLE[@]}"; do
            HOOK="${ENTRY%%:*}"
            FILE="${ENTRY#*:}"

            if grep -wq "$HOOK" "$FILE"; then
              echo "ERROR: incompatible hook remains: $HOOK in $FILE"
              exit 1
            fi
          done

          if grep -wq \
            'susfs_get_non_sus_mnt_id_from_mnt' \
            fs/stat.c
          then
            echo "ERROR: removed warning source reappeared in fs/stat.c"
            exit 1
          fi

          if ! grep -Eq \
            'synchronize_srcu\(&susfs_srcu_open_redirect\)' \
            fs/susfs.c
          then
            echo "ERROR: OPEN_REDIRECT synchronize_srcu UAF fix missing"
            exit 1
          fi

          if ! grep -qF \
            'char **out_spoofed_name' \
            fs/proc/task_mmu.c
          then
            echo "ERROR: /proc/maps OPEN_REDIRECT output-pointer signature missing"
            exit 1
          fi

          if ! grep -qF \
            'extern struct srcu_struct susfs_srcu_open_redirect;' \
            fs/proc/task_mmu.c
          then
            echo "ERROR: /proc/maps OPEN_REDIRECT SRCU declaration missing"
            exit 1
          fi

          if ! grep -qF \
            'susfs_open_redirect_spoof_show_map_vma_srcu' \
            fs/proc/task_mmu.c
          then
            echo "ERROR: /proc/maps OPEN_REDIRECT helper missing"
            exit 1
          fi

          if ! grep -qF \
            'char *spoofed_redirected_name = NULL;' \
            fs/proc/task_mmu.c
          then
            echo "ERROR: /proc/maps redirected-name output pointer handling missing"
            exit 1
          fi

          if ! grep -qF \
            '&spoofed_redirected_name' \
            fs/proc/task_mmu.c
          then
            echo "ERROR: /proc/maps redirected-name pointer pass-through missing"
            exit 1
          fi

          if ! grep -qF \
            'srcu_read_lock(&susfs_srcu_open_redirect)' \
            fs/proc/task_mmu.c
          then
            echo "ERROR: /proc/maps caller-side OPEN_REDIRECT SRCU lock missing"
            exit 1
          fi

          if ! grep -qF \
            'srcu_read_unlock(&susfs_srcu_open_redirect' \
            fs/proc/task_mmu.c
          then
            echo "ERROR: /proc/maps caller-side OPEN_REDIRECT SRCU unlock missing"
            exit 1
          fi

          git add -N \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h

          git diff \
            --no-ext-diff \
            --no-color \
            -- \
            arch/arm64/configs/veux_defconfig \
            fs \
            include/linux/susfs.h \
            include/linux/susfs_def.h \
            kernel \
            mm \
            security \
            drivers/input/input.c \
            ':!drivers/kernelsu' \
            > "$ARTIFACT_DIR/VEUX-SUSFS-2.2-WARNING-CLEAN.diff"

          DIFF_SHA="$(
            sha256sum \
              "$ARTIFACT_DIR/VEUX-SUSFS-2.2-WARNING-CLEAN.diff" \
              | awk '{print $1}'
          )"

          DIFF_BYTES="$(
            stat -c '%s' \
              "$ARTIFACT_DIR/VEUX-SUSFS-2.2-WARNING-CLEAN.diff"
          )"

          if [ "$DIFF_SHA" != "$EXPECTED_WARNING_CLEAN_DIFF_SHA256" ]; then
            echo "ERROR: cumulative source adaptation differs from approved state"
            echo "Expected: $EXPECTED_WARNING_CLEAN_DIFF_SHA256"
            echo "Actual:   $DIFF_SHA"
            exit 1
          fi

          if [ "$DIFF_BYTES" != "$EXPECTED_WARNING_CLEAN_DIFF_BYTES" ]; then
            echo "ERROR: cumulative adaptation byte count changed"
            echo "Expected: $EXPECTED_WARNING_CLEAN_DIFF_BYTES"
            echo "Actual:   $DIFF_BYTES"
            exit 1
          fi

          printf '%s\n' "$DIFF_SHA" \
            > "$ARTIFACT_DIR/VEUX-SUSFS-2.2-WARNING-CLEAN.diff.sha256"

          python3 - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          artifact = Path(os.environ["ARTIFACT_DIR"])
          path = artifact / "VEUX-SUSFS-2.2-WARNING-CLEAN.diff"

          raw = path.read_text(encoding="utf-8")
          raw_bytes = raw.encode("utf-8")

          raw_sha = hashlib.sha256(raw_bytes).hexdigest()

          if raw_sha != os.environ["EXPECTED_WARNING_CLEAN_DIFF_SHA256"]:
              raise SystemExit("ERROR: raw cumulative adaptation SHA mismatch")

          expected_bytes = int(
              os.environ["EXPECTED_WARNING_CLEAN_DIFF_BYTES"]
          )

          if len(raw_bytes) != expected_bytes:
              raise SystemExit("ERROR: cumulative adaptation byte count mismatch")

          old_index = os.environ["WORKFLOW17_OLD_DEFCONFIG_INDEX"]
          new_index = os.environ["CUMULATIVE_NEW_DEFCONFIG_INDEX"]

          new_count = raw.count(new_index)
          old_count = raw.count(old_index)

          if new_count != 1:
              raise SystemExit(
                  "ERROR: expected exactly one cumulative defconfig "
                  f"index line, got {new_count}"
              )

          if old_count != 0:
              raise SystemExit(
                  "ERROR: old Workflow 17 defconfig index line "
                  "unexpectedly already present"
              )

          reconstructed = raw.replace(
              new_index,
              old_index,
              1,
          )

          reconstructed_sha = hashlib.sha256(
              reconstructed.encode("utf-8")
          ).hexdigest()

          expected_old = os.environ[
              "WORKFLOW17_ORIGINAL_DIFF_SHA256"
          ]

          if reconstructed_sha != expected_old:
              raise SystemExit(
                  "ERROR: replacing only expected Git metadata line "
                  "does not reconstruct Workflow 17 diff\n"
                  f"Expected: {expected_old}\n"
                  f"Actual:   {reconstructed_sha}"
              )

          def normalize_index_metadata(text):
              return re.sub(
                  (
                      r"^index "
                      r"[0-9a-f]{12}"
                      r"\.\."
                      r"[0-9a-f]{12}"
                      r"( 100644)?$"
                  ),
                  r"index <OLD>..<NEW>\1",
                  text,
                  flags=re.M,
              )

          normalized = normalize_index_metadata(raw)

          normalized_sha = hashlib.sha256(
              normalized.encode("utf-8")
          ).hexdigest()

          expected_normalized = os.environ[
              "EXPECTED_NORMALIZED_ADAPTATION_SHA256"
          ]

          if normalized_sha != expected_normalized:
              raise SystemExit(
                  "ERROR: normalized semantic adaptation SHA mismatch\n"
                  f"Expected: {expected_normalized}\n"
                  f"Actual:   {normalized_sha}"
              )

          reconstructed_normalized = normalize_index_metadata(
              reconstructed
          )

          reconstructed_normalized_sha = hashlib.sha256(
              reconstructed_normalized.encode("utf-8")
          ).hexdigest()

          if reconstructed_normalized_sha != expected_normalized:
              raise SystemExit(
                  "ERROR: reconstructed Workflow 17 normalized "
                  "adaptation hash mismatch"
              )

          (
              artifact /
              "RECONSTRUCTED-WORKFLOW17-ADAPTATION.diff"
          ).write_text(
              reconstructed,
              encoding="utf-8",
          )

          (
              artifact /
              "NORMALIZED-CUMULATIVE-ADAPTATION.diff"
          ).write_text(
              normalized,
              encoding="utf-8",
          )

          result = [
              "RECONSTRUCTED_WORKFLOW17_RAW_MATCH=YES",
              "NORMALIZED_ADAPTATION_MATCH=YES",
              "SOURCE_HUNK_DIFFERENCE=NO",
              "GIT_INDEX_METADATA_DIFFERENCE_ONLY=YES",
              "SEMANTIC_ADAPTATION_EQUALS_WORKFLOW17=YES",
              "RAW_DIFF_BYTE_IDENTICAL_TO_WORKFLOW17=NO",
              f"CUMULATIVE_RAW_SHA256={raw_sha}",
              f"CUMULATIVE_RAW_BYTES={len(raw_bytes)}",
              f"RECONSTRUCTED_WORKFLOW17_SHA256={reconstructed_sha}",
              f"NORMALIZED_ADAPTATION_SHA256={normalized_sha}",
          ]

          (
              artifact /
              "ADAPTATION-METADATA-EQUIVALENCE.txt"
          ).write_text(
              "\n".join(result) + "\n",
              encoding="utf-8",
          )
          PY

          git diff \
            --check \
            -- \
            . \
            ':!fs/susfs.c' \
            ':!include/linux/susfs_def.h' \
            > "$ARTIFACT_DIR/STRICT-DIFF-CHECK.txt" \
            2>&1

          if [ -s "$ARTIFACT_DIR/STRICT-DIFF-CHECK.txt" ]; then
            echo "ERROR: unexpected whitespace problem outside approved SUSFS files"
            cat "$ARTIFACT_DIR/STRICT-DIFF-CHECK.txt"
            exit 1
          fi

          OUTPUT="$ARTIFACT_DIR/KNOWN-SUSFS-DIFF-CHECK.txt"

          set +e

          git diff \
            --check \
            -- \
            fs/susfs.c \
            include/linux/susfs_def.h \
            > "$OUTPUT" \
            2>&1

          KNOWN_RC=$?

          set -e

          if [ "$KNOWN_RC" -eq 0 ]; then
            echo "ERROR: expected known approved SUSFS whitespace diagnostics"
            exit 1
          fi

          OUTPUT_SHA="$(
            sha256sum "$OUTPUT" \
              | awk '{print $1}'
          )"

          OUTPUT_LINES="$(
            wc -l \
              < "$OUTPUT" \
              | tr -d ' '
          )"

          ISSUE_COUNT="$(
            grep -Ec \
              ':( trailing whitespace\.| new blank line at EOF\.)$' \
              "$OUTPUT" \
              || true
          )"

          if [ "$OUTPUT_SHA" != "$EXPECTED_KNOWN_SUSFS_DIFFCHECK_SHA256" ]; then
            echo "ERROR: known SUSFS whitespace diagnostic bytes changed"
            echo "Expected: $EXPECTED_KNOWN_SUSFS_DIFFCHECK_SHA256"
            echo "Actual:   $OUTPUT_SHA"
            cat "$OUTPUT"
            exit 1
          fi

          if [ "$OUTPUT_LINES" != "$EXPECTED_KNOWN_SUSFS_DIFFCHECK_LINE_COUNT" ]; then
            echo "ERROR: known SUSFS diagnostic line count changed"
            echo "Expected: $EXPECTED_KNOWN_SUSFS_DIFFCHECK_LINE_COUNT"
            echo "Actual:   $OUTPUT_LINES"
            exit 1
          fi

          if [ "$ISSUE_COUNT" != "$EXPECTED_KNOWN_SUSFS_WHITESPACE_ISSUE_COUNT" ]; then
            echo "ERROR: known SUSFS whitespace issue count changed"
            echo "Expected: $EXPECTED_KNOWN_SUSFS_WHITESPACE_ISSUE_COUNT"
            echo "Actual:   $ISSUE_COUNT"
            exit 1
          fi

          for EXPECTED in \
            'fs/susfs.c:37: trailing whitespace.' \
            'fs/susfs.c:38: trailing whitespace.' \
            'fs/susfs.c:253: trailing whitespace.' \
            'fs/susfs.c:315: trailing whitespace.' \
            'fs/susfs.c:511: trailing whitespace.' \
            'fs/susfs.c:584: trailing whitespace.' \
            'fs/susfs.c:1491: new blank line at EOF.' \
            'include/linux/susfs_def.h:83: trailing whitespace.'
          do
            if ! grep -qFx \
              "$EXPECTED" \
              "$OUTPUT"
            then
              echo "ERROR: expected inherited SUSFS diagnostic missing:"
              echo "$EXPECTED"
              exit 1
            fi
          done

          git status --short \
            > "$ARTIFACT_DIR/GIT-STATUS-PREBUILD.txt"

          {
            echo "SOURCE_ADAPTATION=PASS"
            echo "CUMULATIVE_RAW_DIFF_SHA256=$DIFF_SHA"
            echo "CUMULATIVE_RAW_DIFF_BYTES=$DIFF_BYTES"
            echo "SEMANTIC_ADAPTATION_EQUALS_WORKFLOW17=YES"
            echo "OPEN_REDIRECT_SRCU_UAF_FIX_PRESENT=YES"
            echo "OPEN_REDIRECT_MAPS_POINTER_SRCU_FIX_PRESENT=YES"
            echo "STRICT_DIFF_CHECK_OUTSIDE_KNOWN_SUSFS_FILES=PASS"
            echo "KNOWN_SUSFS_WHITESPACE_DIAGNOSTICS_EXACT_MATCH=YES"
            echo "KNOWN_SUSFS_WHITESPACE_ISSUE_COUNT=$ISSUE_COUNT"
            echo "REJECT_FILES=0"
            echo "ORIG_FILES=0"
          } | tee "$ARTIFACT_DIR/SOURCE-ADAPTATION-CHECK.txt"

      - name: Verify cumulative corrections survived integration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CPUFREQ_SHA="$(
            sha256sum drivers/cpufreq/cpufreq.c \
              | awk '{print $1}'
          )"

          LPM_SHA="$(
            sha256sum drivers/cpuidle/lpm-levels.c \
              | awk '{print $1}'
          )"

          CORE_SHA="$(
            sha256sum drivers/cpuidle/cpuidle.c \
              | awk '{print $1}'
          )"

          HEADER_SHA="$(
            sha256sum include/linux/cpuidle.h \
              | awk '{print $1}'
          )"

          SUGOV_SHA="$(
            sha256sum kernel/sched/cpufreq_schedutil.c \
              | awk '{print $1}'
          )"

          if [ "$CPUFREQ_SHA" != "$EXPECTED_CPUFREQ_AFTER_SHA256" ]; then
            echo "ERROR: ReSukiSU/SUSFS changed corrected cpufreq.c"
            exit 1
          fi

          if [ "$LPM_SHA" != "$EXPECTED_LPM_AFTER_SHA256" ]; then
            echo "ERROR: ReSukiSU/SUSFS changed corrected lpm-levels.c"
            exit 1
          fi

          if [ "$CORE_SHA" != "$EXPECTED_CPUIDLE_CORE_AFTER_SHA256" ]; then
            echo "ERROR: ReSukiSU/SUSFS changed corrected cpuidle.c"
            exit 1
          fi

          if [ "$HEADER_SHA" != "$EXPECTED_CPUIDLE_HEADER_AFTER_SHA256" ]; then
            echo "ERROR: ReSukiSU/SUSFS changed corrected cpuidle.h"
            exit 1
          fi

          if [ "$SUGOV_SHA" != "$EXPECTED_SCHEDUTIL_AFTER_SHA256" ]; then
            echo "ERROR: ReSukiSU/SUSFS changed corrected schedutil"
            exit 1
          fi

          grep -qx \
            '#define LOAD_AVG_PERIOD 8' \
            kernel/sched/sched-pelt.h

          grep -qx \
            'CONFIG_CPUSETS=y' \
            arch/arm64/configs/veux_defconfig

          grep -qx \
            '# CONFIG_SPRD_ROTATION_TASK is not set' \
            arch/arm64/configs/veux_defconfig

          if grep -qE \
            '^CONFIG_HZ_(100|250|300|1000)=y$' \
            arch/arm64/configs/veux_defconfig
          then
            echo "ERROR: explicit HZ selection returned"
            exit 1
          fi

          grep -qF \
            'time_after_eq(jiffies, sg->sgc->next_update)' \
            kernel/sched/fair.c

          grep -qF \
            'arch_scale_max_freq_capacity(NULL, cpu)' \
            kernel/sched/cass.c

          grep -qF \
            'curr->cap_no_therm' \
            kernel/sched/cass.c

          {
            echo "CUMULATIVE_CORRECTIONS_SURVIVED_INTEGRATION=YES"
            echo "CPUFREQ_SHA256=$CPUFREQ_SHA"
            echo "LPM_SHA256=$LPM_SHA"
            echo "CPUIDLE_CORE_SHA256=$CORE_SHA"
            echo "CPUIDLE_HEADER_SHA256=$HEADER_SHA"
            echo "SCHEDUTIL_SHA256=$SUGOV_SHA"
            echo "PELT_PERIOD=8"
            echo "CPUSETS_ENABLED=YES"
            echo "SPRD_ROTATION_DISABLED=YES"
            echo "EXPLICIT_HZ_SELECTION=NO"
            echo "LB_CAPACITY_RATE_LIMIT=RESTORED"
            echo "CASS_MAXFREQ=YES"
          } | tee "$ARTIFACT_DIR/CUMULATIVE-POST-INTEGRATION-STATE.txt"

      - name: Resolve exact cumulative ReSukiSU SUSFS config
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          rm -rf "$OUT_DIR"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            veux_defconfig \
            2>&1 \
            | tee "$ARTIFACT_DIR/defconfig.log"

          CONFIG="$OUT_DIR/.config"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: resolved config missing"
            exit 1
          fi

          REQUIRED_Y=(
            CONFIG_64BIT
            CONFIG_THREAD_INFO_IN_TASK
            CONFIG_KALLSYMS
            CONFIG_CC_IS_CLANG
            CONFIG_LD_IS_LLD
            CONFIG_CPUSETS
            CONFIG_SCHED_CASS
            CONFIG_HZ_250
            CONFIG_CPU_FREQ
            CONFIG_CPU_FREQ_GOV_SCHEDUTIL
            CONFIG_ARM_QCOM_CPUFREQ_HW
            CONFIG_CPU_IDLE
            CONFIG_ARM_QCOM_LPM_CPUIDLE
            CONFIG_KSU
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          for SYMBOL in "${REQUIRED_Y[@]}"; do
            if ! grep -qx \
              "${SYMBOL}=y" \
              "$CONFIG"
            then
              echo "ERROR: required config not y: $SYMBOL"
              exit 1
            fi
          done

          grep -qx \
            'CONFIG_HZ=250' \
            "$CONFIG"

          if grep -qx \
            'CONFIG_HZ_100=y' \
            "$CONFIG"
          then
            echo "ERROR: HZ100 returned"
            exit 1
          fi

          if ! grep -qx \
            '# CONFIG_SPRD_ROTATION_TASK is not set' \
            "$CONFIG"
          then
            echo "ERROR: SPRD rotation returned"
            exit 1
          fi

          FORBIDDEN_Y=(
            CONFIG_KSU_TRACEPOINT_HOOK
            CONFIG_KSU_MANUAL_HOOK
            CONFIG_DEBUG_KERNEL
            CONFIG_KALLSYMS_ALL
          )

          for SYMBOL in "${FORBIDDEN_Y[@]}"; do
            if grep -qx \
              "${SYMBOL}=y" \
              "$CONFIG"
            then
              echo "ERROR: forbidden config active: $SYMBOL"
              exit 1
            fi
          done

          CONFIG_SHA="$(
            sha256sum "$CONFIG" \
              | awk '{print $1}'
          )"

          if [ "$CONFIG_SHA" != "$EXPECTED_CUMULATIVE_CONFIG_SHA256" ]; then
            echo "ERROR: cumulative resolved config SHA mismatch"
            echo "Expected: $EXPECTED_CUMULATIVE_CONFIG_SHA256"
            echo "Actual:   $CONFIG_SHA"
            exit 1
          fi

          cp \
            "$CONFIG" \
            "$ARTIFACT_DIR/config-before-build"

          cp \
            "$CONFIG" \
            "$ARTIFACT_DIR/final-cumulative.config"

          {
            grep -E \
              '^(CONFIG_CC_VERSION_TEXT=|CONFIG_CC_IS_CLANG=|CONFIG_LD_IS_LLD=|CONFIG_64BIT=|CONFIG_THREAD_INFO_IN_TASK=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=|# CONFIG_KALLSYMS_ALL|CONFIG_DEBUG_KERNEL=|# CONFIG_DEBUG_KERNEL|CONFIG_CPUSETS=|CONFIG_SCHED_CASS=|CONFIG_HZ_|CONFIG_HZ=|CONFIG_SPRD_ROTATION_TASK=|# CONFIG_SPRD_ROTATION_TASK|CONFIG_KSU=|CONFIG_KSU_TRACEPOINT_HOOK=|# CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_KSU_MANUAL_HOOK=|# CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS=|CONFIG_KSU_SUSFS_)' \
              "$CONFIG" \
              || true
          } > "$ARTIFACT_DIR/resolved-config-important.txt"

          make \
            -s \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            kernelrelease \
            | tee "$ARTIFACT_DIR/kernelrelease.txt"

          {
            echo "FINAL_CUMULATIVE_CONFIG=PASS"
            echo "FINAL_CUMULATIVE_CONFIG_SHA256=$CONFIG_SHA"
            echo "CONFIG_CPUSETS=y"
            echo "CONFIG_SCHED_CASS=y"
            echo "CONFIG_HZ_250=y"
            echo "CONFIG_HZ=250"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
            echo "SPRD_ROTATION_DISABLED=YES"
          } | tee "$ARTIFACT_DIR/FINAL-CONFIG-CHECK.txt"

      - name: Build complete cumulative kernel Image and DTBs
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          set +e

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            Image \
            dtbs \
            2>&1 \
            | tee "$ARTIFACT_DIR/full-build.log"

          BUILD_RC=${PIPESTATUS[0]}

          set -e

          printf '%s\n' "$BUILD_RC" \
            > "$ARTIFACT_DIR/full-build.exit-code"

          if [ "$BUILD_RC" -ne 0 ]; then
            echo "ERROR: cumulative kernel build failed"
            exit "$BUILD_RC"
          fi

      - name: Verify config remained byte identical after build
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="$OUT_DIR/.config"

          if [ ! -s "$CONFIG" ]; then
            echo "ERROR: post-build config missing"
            exit 1
          fi

          POST_SHA="$(
            sha256sum "$CONFIG" \
              | awk '{print $1}'
          )"

          if [ "$POST_SHA" != "$EXPECTED_CUMULATIVE_CONFIG_SHA256" ]; then
            echo "ERROR: config changed during cumulative build"
            echo "Expected: $EXPECTED_CUMULATIVE_CONFIG_SHA256"
            echo "Actual:   $POST_SHA"
            exit 1
          fi

          if ! cmp -s \
            "$ARTIFACT_DIR/config-before-build" \
            "$CONFIG"
          then
            echo "ERROR: config changed bytewise during cumulative build"
            exit 1
          fi

          cp \
            "$CONFIG" \
            "$ARTIFACT_DIR/final.config"

          {
            echo "CONFIG_POST_BUILD=PASS"
            echo "SHA256=$POST_SHA"
            echo "BYTE_IDENTICAL_TO_PREBUILD=YES"
          } | tee "$ARTIFACT_DIR/CONFIG-POST-BUILD-CHECK.txt"

      - name: Audit compiler diagnostics without fixed total warning count
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LOG="$ARTIFACT_DIR/full-build.log"

          grep -Ei \
            '(^|[[:space:]])error:' \
            "$LOG" \
            > "$ARTIFACT_DIR/FULL-BUILD-ERRORS.txt" \
            || true

          grep -Ei \
            '(^|[[:space:]])warning:' \
            "$LOG" \
            > "$ARTIFACT_DIR/FULL-BUILD-WARNINGS.txt" \
            || true

          grep -E \
            'drivers/cpufreq/cpufreq\.c:.*warning:' \
            "$LOG" \
            > "$ARTIFACT_DIR/CPUFREQ-CORE-WARNINGS.txt" \
            || true

          grep -Ei \
            '(drivers/cpuidle/cpuidle\.c|drivers/cpuidle/lpm-levels\.c):.*warning:' \
            "$LOG" \
            > "$ARTIFACT_DIR/IDLE-WARNINGS.txt" \
            || true

          grep -Ei \
            '(KernelSU|ReSukiSU|kernelsu|susfs|fs/stat\.c|fs/proc/task_mmu\.c|fs/exec\.c|fs/open\.c|fs/read_write\.c|kernel/reboot\.c|kernel/sys\.c|drivers/input/input\.c).*warning:' \
            "$LOG" \
            > "$ARTIFACT_DIR/SUSFS-RESUKISU-WARNINGS.txt" \
            || true

          ERROR_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/FULL-BUILD-ERRORS.txt" \
              | tr -d ' '
          )"

          WARNING_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/FULL-BUILD-WARNINGS.txt" \
              | tr -d ' '
          )"

          CPUFREQ_WARNING_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/CPUFREQ-CORE-WARNINGS.txt" \
              | tr -d ' '
          )"

          IDLE_WARNING_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/IDLE-WARNINGS.txt" \
              | tr -d ' '
          )"

          SUSFS_RESUKISU_WARNING_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/SUSFS-RESUKISU-WARNINGS.txt" \
              | tr -d ' '
          )"

          if [ "$ERROR_COUNT" -ne 0 ]; then
            echo "ERROR: compiler errors detected"
            cat "$ARTIFACT_DIR/FULL-BUILD-ERRORS.txt"
            exit 1
          fi

          if [ "$CPUFREQ_WARNING_COUNT" -ne 0 ]; then
            echo "ERROR: drivers/cpufreq/cpufreq.c emitted warnings"
            cat "$ARTIFACT_DIR/CPUFREQ-CORE-WARNINGS.txt"
            exit 1
          fi

          if [ "$IDLE_WARNING_COUNT" -ne 0 ]; then
            echo "ERROR: restored idle source emitted warnings"
            cat "$ARTIFACT_DIR/IDLE-WARNINGS.txt"
            exit 1
          fi

          if [ "$SUSFS_RESUKISU_WARNING_COUNT" -ne 0 ]; then
            echo "ERROR: SUSFS/ReSukiSU/adaptation warning detected"
            cat "$ARTIFACT_DIR/SUSFS-RESUKISU-WARNINGS.txt"
            exit 1
          fi

          {
            echo "COMPILER_DIAGNOSTIC_AUDIT=PASS"
            echo "ERROR_COUNT=$ERROR_COUNT"
            echo "WARNING_COUNT=$WARNING_COUNT"
            echo "WARNING_COUNT_POLICY=MEASURED_NOT_HARDCODED"
            echo "CPUFREQ_CORE_WARNING_COUNT=$CPUFREQ_WARNING_COUNT"
            echo "IDLE_WARNING_COUNT=$IDLE_WARNING_COUNT"
            echo "SUSFS_RESUKISU_ADAPTATION_WARNING_COUNT=$SUSFS_RESUKISU_WARNING_COUNT"
          } | tee "$ARTIFACT_DIR/DIAGNOSTICS.txt"

      - name: Verify linked cumulative ReSukiSU SUSFS and scheduler state
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          VMLINUX="$OUT_DIR/vmlinux"
          NM="$TOOLCHAIN_DIR/bin/llvm-nm"
          NM_FILE="${RUNNER_TEMP}/vmlinux-symbols.txt"

          if [ ! -s "$VMLINUX" ]; then
            echo "ERROR: vmlinux missing"
            exit 1
          fi

          if [ ! -x "$NM" ]; then
            echo "ERROR: llvm-nm missing"
            exit 1
          fi

          "$NM" -n "$VMLINUX" \
            > "$NM_FILE"

          : > "$ARTIFACT_DIR/REQUIRED-LINKED-SYMBOLS.txt"
          : > "$ARTIFACT_DIR/REQUIRED-LINKED-SYMBOL-LINES.txt"

          require_symbol() {
            local symbol="$1"

            if ! awk -v target="$symbol" \
              'NF >= 3 && $NF == target { found=1 } END { exit(found ? 0 : 1) }' \
              "$NM_FILE"
            then
              echo "ERROR: linked symbol missing: $symbol"
              exit 1
            fi

            printf '%s\n' "$symbol" \
              >> "$ARTIFACT_DIR/REQUIRED-LINKED-SYMBOLS.txt"

            awk -v target="$symbol" \
              'NF >= 3 && $NF == target { print }' \
              "$NM_FILE" \
              >> "$ARTIFACT_DIR/REQUIRED-LINKED-SYMBOL-LINES.txt"
          }

          for SYMBOL in \
            ksu_handle_setresuid \
            ksu_handle_execveat \
            ksu_handle_faccessat \
            ksu_handle_sys_read \
            ksu_handle_stat \
            ksu_handle_sys_reboot \
            ksu_handle_input_handle_event \
            ksu_handle_vfs_fstat \
            susfs_add_sus_map \
            sel_handle_status_ops \
            write_op
          do
            require_symbol "$SYMBOL"
          done

          REQUIRED_SYMBOL_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/REQUIRED-LINKED-SYMBOLS.txt" \
              | tr -d ' '
          )"

          if [ "$REQUIRED_SYMBOL_COUNT" -ne 11 ]; then
            echo "ERROR: expected 11 required linked symbols"
            exit 1
          fi

          grep -E \
            '[[:space:]]cass_[A-Za-z0-9_]+' \
            "$NM_FILE" \
            > "$ARTIFACT_DIR/vmlinux-cass-symbols.txt" \
            || true

          CASS_SYMBOL_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/vmlinux-cass-symbols.txt" \
              | tr -d ' '
          )"

          if [ "$CASS_SYMBOL_COUNT" -lt 1 ]; then
            echo "ERROR: CASS symbols missing"
            exit 1
          fi

          grep -E \
            'check_for_task_rotation|try_rotation_task|do_rotation_task|rotation_task_init|set_rotation_enable' \
            "$NM_FILE" \
            > "$ARTIFACT_DIR/ROTATION-SYMBOLS.txt" \
            || true

          ROTATION_SYMBOL_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/ROTATION-SYMBOLS.txt" \
              | tr -d ' '
          )"

          if [ "$ROTATION_SYMBOL_COUNT" -ne 0 ]; then
            echo "ERROR: SPRD rotation symbols remain linked"
            cat "$ARTIFACT_DIR/ROTATION-SYMBOLS.txt"
            exit 1
          fi

          grep -Ei \
            '[[:space:]][A-Za-z0-9_]*cpuset[A-Za-z0-9_]*$' \
            "$NM_FILE" \
            > "$ARTIFACT_DIR/vmlinux-cpuset-symbols.txt" \
            || true

          CPUSET_SYMBOL_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/vmlinux-cpuset-symbols.txt" \
              | tr -d ' '
          )"

          if [ "$CPUSET_SYMBOL_COUNT" -lt 1 ]; then
            echo "ERROR: CPUSET symbols missing"
            exit 1
          fi

          grep -E \
            '[[:space:]]lpm_sleep_disabled$' \
            "$NM_FILE" \
            > "$ARTIFACT_DIR/LPM-SLEEP-SYMBOLS.txt" \
            || true

          LPM_SLEEP_SYMBOL_COUNT="$(
            wc -l \
              < "$ARTIFACT_DIR/LPM-SLEEP-SYMBOLS.txt" \
              | tr -d ' '
          )"

          if [ "$LPM_SLEEP_SYMBOL_COUNT" -ne 0 ]; then
            echo "ERROR: lpm_sleep_disabled remains linked"
            exit 1
          fi

          {
            echo "VMLINUX_SYMBOL_AUDIT=PASS"
            echo "REQUIRED_RESUKISU_SUSFS_SYMBOL_COUNT=$REQUIRED_SYMBOL_COUNT"
            echo "CASS_SYMBOL_COUNT=$CASS_SYMBOL_COUNT"
            echo "ROTATION_SYMBOL_COUNT=$ROTATION_SYMBOL_COUNT"
            echo "CPUSET_SYMBOL_COUNT=$CPUSET_SYMBOL_COUNT"
            echo "LPM_SLEEP_DISABLED_SYMBOL_COUNT=$LPM_SLEEP_SYMBOL_COUNT"
          } | tee "$ARTIFACT_DIR/VMLINUX-SYMBOL-AUDIT.txt"

      - name: Verify ReSukiSU SUSFS build identity
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LOG="$ARTIFACT_DIR/full-build.log"
          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          IMAGE_STRINGS="$ARTIFACT_DIR/IMAGE-IDENTITY-STRINGS.txt"

          for HOOK in \
            ksu_handle_setresuid \
            ksu_handle_execveat \
            ksu_handle_faccessat \
            ksu_handle_sys_read \
            ksu_handle_stat \
            ksu_handle_sys_reboot \
            ksu_handle_input_handle_event
          do
            if ! grep -Fq \
              "susfs_inline: $HOOK found" \
              "$LOG"
            then
              echo "ERROR: Kbuild did not confirm hook: $HOOK"
              exit 1
            fi
          done

          if grep -Fq \
            'is incompatible hook' \
            "$LOG"
          then
            echo "ERROR: incompatible ReSukiSU hook reported"
            grep -F \
              'is incompatible hook' \
              "$LOG"
            exit 1
          fi

          if ! grep -Fq \
            'ReSukiSU: using SuSFS Inline hook' \
            "$LOG"
          then
            echo "ERROR: SUSFS Inline Hook mode not selected"
            exit 1
          fi

          if ! grep -Fq \
            'SUSFS_VERSION: v2.2.0' \
            "$LOG"
          then
            echo "ERROR: SUSFS v2.2.0 not detected"
            exit 1
          fi

          strings "$IMAGE" \
            > "$IMAGE_STRINGS"

          if ! grep -Fq \
            "$EXPECTED_RESUKISU_VERSION" \
            "$IMAGE_STRINGS"
          then
            echo "ERROR: expected ReSukiSU version string missing from Image"
            exit 1
          fi

          grep -Ei \
            'Linux version|ReSukiSU|KernelSU|SUSFS|positron' \
            "$IMAGE_STRINGS" \
            | head -n 200 \
            > "$ARTIFACT_DIR/IMAGE-IDENTITY-SELECTED.txt" \
            || true

          {
            echo "BUILD_IDENTITY_AUDIT=PASS"
            echo "HOOK_MODE=SUSFS_INLINE"
            echo "SUSFS_VERSION=v2.2.0"
            echo "RESUKISU_VERSION=$EXPECTED_RESUKISU_VERSION"
            echo "SEVEN_REQUIRED_INLINE_HOOKS=FOUND"
          } | tee "$ARTIFACT_DIR/BUILD-IDENTITY-AUDIT.txt"

      - name: Verify complete build outputs and exact VEUX DTB
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX="$OUT_DIR/vmlinux"
          SYSTEM_MAP="$OUT_DIR/System.map"

          for FILE in \
            "$IMAGE" \
            "$VMLINUX" \
            "$SYSTEM_MAP"
          do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: build output missing: $FILE"
              exit 1
            fi
          done

          mapfile -t DTBS < <(
            find "$OUT_DIR/arch/arm64/boot/dts" \
              -type f \
              -name 'veux.dtb' \
              -print \
              | sort
          )

          if [ "${#DTBS[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one built veux.dtb, got ${#DTBS[@]}"
            printf '%s\n' "${DTBS[@]}"
            exit 1
          fi

          DTB="${DTBS[0]}"

          "$OUT_DIR/scripts/dtc/dtc" \
            -I dtb \
            -O dts \
            -o /dev/null \
            "$DTB"

          IMAGE_BYTES="$(stat -c '%s' "$IMAGE")"
          DTB_BYTES="$(stat -c '%s' "$DTB")"
          VMLINUX_BYTES="$(stat -c '%s' "$VMLINUX")"
          SYSTEM_MAP_BYTES="$(stat -c '%s' "$SYSTEM_MAP")"

          IMAGE_SHA="$(
            sha256sum "$IMAGE" \
              | awk '{print $1}'
          )"

          DTB_SHA="$(
            sha256sum "$DTB" \
              | awk '{print $1}'
          )"

          VMLINUX_SHA="$(
            sha256sum "$VMLINUX" \
              | awk '{print $1}'
          )"

          SYSTEM_MAP_SHA="$(
            sha256sum "$SYSTEM_MAP" \
              | awk '{print $1}'
          )"

          if [ "$DTB_BYTES" != "$EXPECTED_VEUX_DTB_BYTES" ]; then
            echo "ERROR: VEUX DTB size changed"
            echo "Expected: $EXPECTED_VEUX_DTB_BYTES"
            echo "Actual:   $DTB_BYTES"
            exit 1
          fi

          if [ "$DTB_SHA" != "$EXPECTED_VEUX_DTB_SHA256" ]; then
            echo "ERROR: VEUX DTB bytes changed"
            echo "Expected: $EXPECTED_VEUX_DTB_SHA256"
            echo "Actual:   $DTB_SHA"
            exit 1
          fi

          KERNEL_RELEASE="$(
            make -s \
              O="$OUT_DIR" \
              ARCH="$ARCH" \
              LLVM=1 \
              LLVM_IAS=1 \
              kernelrelease
          )"

          {
            echo "KERNEL_RELEASE=$KERNEL_RELEASE"
            echo "IMAGE_BYTES=$IMAGE_BYTES"
            echo "IMAGE_SHA256=$IMAGE_SHA"
            echo "VEUX_DTB_BYTES=$DTB_BYTES"
            echo "VEUX_DTB_SHA256=$DTB_SHA"
            echo "VMLINUX_BYTES=$VMLINUX_BYTES"
            echo "VMLINUX_SHA256=$VMLINUX_SHA"
            echo "SYSTEM_MAP_BYTES=$SYSTEM_MAP_BYTES"
            echo "SYSTEM_MAP_SHA256=$SYSTEM_MAP_SHA"
            echo "VEUX_DTB_PARSE=PASS"
          } | tee "$ARTIFACT_DIR/BUILD-OUTPUT-HASHES.txt"

      - name: Snapshot build A and rebuild reproduction B in identical output path
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          SNAPSHOT="$REPRO_A_SNAPSHOT"
          IMAGE_A="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX_A="$OUT_DIR/vmlinux"
          SYSTEM_MAP_A="$OUT_DIR/System.map"
          CONFIG_A="$OUT_DIR/.config"
          COMPILE_A="$OUT_DIR/include/generated/compile.h"

          mapfile -t DTBS_A < <(
            find "$OUT_DIR/arch/arm64/boot/dts" \
              -type f \
              -name 'veux.dtb' \
              -print \
              | sort
          )

          if [ "${#DTBS_A[@]}" -ne 1 ]; then
            echo "ERROR: build A expected exactly one veux.dtb before snapshot"
            printf '%s\n' "${DTBS_A[@]}"
            exit 1
          fi

          DTB_A="${DTBS_A[0]}"

          for FILE in \
            "$IMAGE_A" \
            "$VMLINUX_A" \
            "$SYSTEM_MAP_A" \
            "$CONFIG_A" \
            "$COMPILE_A" \
            "$DTB_A" \
            "$ARTIFACT_DIR/kernelrelease.txt"
          do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: build A snapshot input missing: $FILE"
              exit 1
            fi
          done

          rm -rf "$SNAPSHOT"
          mkdir -p "$SNAPSHOT"

          cp "$IMAGE_A" "$SNAPSHOT/Image"
          cp "$DTB_A" "$SNAPSHOT/veux.dtb"
          cp "$SYSTEM_MAP_A" "$SNAPSHOT/System.map"
          cp "$CONFIG_A" "$SNAPSHOT/final.config"
          cp "$COMPILE_A" "$SNAPSHOT/compile.h"
          cp "$VMLINUX_A" "$SNAPSHOT/vmlinux"
          cp "$ARTIFACT_DIR/kernelrelease.txt" "$SNAPSHOT/kernelrelease.txt"

          {
            echo "BUILD_A_SNAPSHOT=PASS"
            echo "BUILD_A_OUTPUT_PATH=$OUT_DIR"
            echo "BUILD_A_IMAGE_SHA256=$(sha256sum "$SNAPSHOT/Image" | awk '{print $1}')"
            echo "BUILD_A_VEUX_DTB_SHA256=$(sha256sum "$SNAPSHOT/veux.dtb" | awk '{print $1}')"
            echo "BUILD_A_SYSTEM_MAP_SHA256=$(sha256sum "$SNAPSHOT/System.map" | awk '{print $1}')"
            echo "BUILD_A_VMLINUX_SHA256=$(sha256sum "$SNAPSHOT/vmlinux" | awk '{print $1}')"
            echo "BUILD_A_CONFIG_SHA256=$(sha256sum "$SNAPSHOT/final.config" | awk '{print $1}')"
            echo "BUILD_A_COMPILE_H_SHA256=$(sha256sum "$SNAPSHOT/compile.h" | awk '{print $1}')"
          } | tee "$ARTIFACT_DIR/BUILD-A-SNAPSHOT-HASHES.txt"

          if [ "$(git -C KernelSU rev-parse HEAD)" != "$RESUKISU_COMMIT" ]; then
            echo "ERROR: source changed before reproduction B: ReSukiSU pin mismatch"
            exit 1
          fi

          git diff \
            --no-ext-diff \
            --no-color \
            -- \
            arch/arm64/configs/veux_defconfig \
            fs \
            include/linux/susfs.h \
            include/linux/susfs_def.h \
            kernel \
            mm \
            security \
            drivers/input/input.c \
            ':!drivers/kernelsu' \
            > "$ARTIFACT_DIR/REPRO-B-PREBUILD-SOURCE.diff"

          REPRO_SOURCE_SHA="$(
            sha256sum "$ARTIFACT_DIR/REPRO-B-PREBUILD-SOURCE.diff" \
              | awk '{print $1}'
          )"

          REPRO_SOURCE_BYTES="$(
            stat -c '%s' "$ARTIFACT_DIR/REPRO-B-PREBUILD-SOURCE.diff"
          )"

          if [ "$REPRO_SOURCE_SHA" != "$EXPECTED_WARNING_CLEAN_DIFF_SHA256" ]; then
            echo "ERROR: source changed between integration audit and reproduction B"
            echo "Expected: $EXPECTED_WARNING_CLEAN_DIFF_SHA256"
            echo "Actual:   $REPRO_SOURCE_SHA"
            exit 1
          fi

          if [ "$REPRO_SOURCE_BYTES" != "$EXPECTED_WARNING_CLEAN_DIFF_BYTES" ]; then
            echo "ERROR: source adaptation byte count changed before reproduction B"
            exit 1
          fi

          if find . \
            -type f \
            \( -name '*.rej' -o -name '*.orig' \) \
            | grep -q .
          then
            echo "ERROR: reject/orig file appeared before reproduction B"
            exit 1
          fi

          {
            echo "REPRO_B_SOURCE_STATE=PASS"
            echo "REPRO_B_SOURCE_ADAPTATION_SHA256=$REPRO_SOURCE_SHA"
            echo "REPRO_B_SOURCE_ADAPTATION_BYTES=$REPRO_SOURCE_BYTES"
            echo "REPRO_B_RESUKISU_COMMIT=$RESUKISU_COMMIT"
            echo "REPRO_B_REJECT_ORIG_FILES=0"
            echo "REPRO_B_OUTPUT_PATH=$OUT_DIR"
            echo "REPRO_B_SAME_OUTPUT_PATH_AS_A=YES"
          } | tee "$ARTIFACT_DIR/REPRO-B-SOURCE-STATE.txt"

          rm -rf "$OUT_DIR"

          if [ -e "$OUT_DIR" ]; then
            echo "ERROR: build A output tree was not removed completely"
            exit 1
          fi

          echo "BUILD_A_OUTPUT_TREE_REMOVED=YES" \
            | tee "$ARTIFACT_DIR/REPRO-B-OUTPUT-TREE-RESET.txt"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            veux_defconfig \
            2>&1 \
            | tee "$ARTIFACT_DIR/repro-b-defconfig.log"

          CONFIG_B="$OUT_DIR/.config"

          if [ ! -s "$CONFIG_B" ]; then
            echo "ERROR: reproduction B config missing"
            exit 1
          fi

          CONFIG_B_SHA="$(
            sha256sum "$CONFIG_B" \
              | awk '{print $1}'
          )"

          if [ "$CONFIG_B_SHA" != "$EXPECTED_CUMULATIVE_CONFIG_SHA256" ]; then
            echo "ERROR: reproduction B config SHA mismatch"
            echo "Expected: $EXPECTED_CUMULATIVE_CONFIG_SHA256"
            echo "Actual:   $CONFIG_B_SHA"
            exit 1
          fi

          if ! cmp -s \
            "$SNAPSHOT/final.config" \
            "$CONFIG_B"
          then
            echo "ERROR: build A and B configs differ before reproduction build"
            exit 1
          fi

          make \
            -s \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            kernelrelease \
            | tee "$ARTIFACT_DIR/repro-b-kernelrelease.txt"

          if ! cmp -s \
            "$SNAPSHOT/kernelrelease.txt" \
            "$ARTIFACT_DIR/repro-b-kernelrelease.txt"
          then
            echo "ERROR: kernelrelease differs between build A and B"
            echo "A: $(cat "$SNAPSHOT/kernelrelease.txt")"
            echo "B: $(cat "$ARTIFACT_DIR/repro-b-kernelrelease.txt")"
            exit 1
          fi

          set +e

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            Image \
            dtbs \
            2>&1 \
            | tee "$ARTIFACT_DIR/repro-b-full-build.log"

          BUILD_B_RC=${PIPESTATUS[0]}

          set -e

          printf '%s\n' "$BUILD_B_RC" \
            > "$ARTIFACT_DIR/repro-b-full-build.exit-code"

          if [ "$BUILD_B_RC" -ne 0 ]; then
            echo "ERROR: reproduction B kernel build failed"
            exit "$BUILD_B_RC"
          fi

          POST_B_SHA="$(
            sha256sum "$CONFIG_B" \
              | awk '{print $1}'
          )"

          if [ "$POST_B_SHA" != "$EXPECTED_CUMULATIVE_CONFIG_SHA256" ]; then
            echo "ERROR: reproduction B config changed during build"
            exit 1
          fi

          if ! cmp -s \
            "$SNAPSHOT/final.config" \
            "$CONFIG_B"
          then
            echo "ERROR: build A and B configs differ after reproduction build"
            exit 1
          fi

          {
            echo "REPRO_B_CONFIG=PASS"
            echo "REPRO_B_CONFIG_SHA256=$POST_B_SHA"
            echo "REPRO_B_CONFIG_EQUALS_BUILD_A=YES"
            echo "REPRO_B_KERNELRELEASE_EQUALS_BUILD_A=YES"
            echo "REPRO_B_SAME_OUTPUT_PATH_AS_A=YES"
            echo "BUILD_A_OUTPUT_TREE_REMOVED_BEFORE_B=YES"
            echo "KBUILD_BUILD_USER=$KBUILD_BUILD_USER"
            echo "KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST"
            echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP"
            echo "KBUILD_BUILD_VERSION=$KBUILD_BUILD_VERSION"
            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          } | tee "$ARTIFACT_DIR/REPRO-B-CONFIG-CHECK.txt"

      - name: Audit reproduction B compiler diagnostics
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LOG="$ARTIFACT_DIR/repro-b-full-build.log"

          grep -Ei \
            '(^|[[:space:]])error:' \
            "$LOG" \
            > "$ARTIFACT_DIR/REPRO-B-ERRORS.txt" \
            || true

          grep -Ei \
            '(^|[[:space:]])warning:' \
            "$LOG" \
            > "$ARTIFACT_DIR/REPRO-B-WARNINGS.txt" \
            || true

          grep -E \
            'drivers/cpufreq/cpufreq\\.c:.*warning:' \
            "$LOG" \
            > "$ARTIFACT_DIR/REPRO-B-CPUFREQ-CORE-WARNINGS.txt" \
            || true

          grep -Ei \
            '(drivers/cpuidle/cpuidle\\.c|drivers/cpuidle/lpm-levels\\.c):.*warning:' \
            "$LOG" \
            > "$ARTIFACT_DIR/REPRO-B-IDLE-WARNINGS.txt" \
            || true

          grep -Ei \
            '(KernelSU|ReSukiSU|kernelsu|susfs|fs/stat\\.c|fs/proc/task_mmu\\.c|fs/exec\\.c|fs/open\\.c|fs/read_write\\.c|kernel/reboot\\.c|kernel/sys\\.c|drivers/input/input\\.c).*warning:' \
            "$LOG" \
            > "$ARTIFACT_DIR/REPRO-B-SUSFS-RESUKISU-WARNINGS.txt" \
            || true

          ERROR_COUNT_B="$(wc -l < "$ARTIFACT_DIR/REPRO-B-ERRORS.txt" | tr -d ' ')"
          WARNING_COUNT_B="$(wc -l < "$ARTIFACT_DIR/REPRO-B-WARNINGS.txt" | tr -d ' ')"
          CPUFREQ_WARNING_COUNT_B="$(wc -l < "$ARTIFACT_DIR/REPRO-B-CPUFREQ-CORE-WARNINGS.txt" | tr -d ' ')"
          IDLE_WARNING_COUNT_B="$(wc -l < "$ARTIFACT_DIR/REPRO-B-IDLE-WARNINGS.txt" | tr -d ' ')"
          SUSFS_RESUKISU_WARNING_COUNT_B="$(wc -l < "$ARTIFACT_DIR/REPRO-B-SUSFS-RESUKISU-WARNINGS.txt" | tr -d ' ')"

          if [ "$ERROR_COUNT_B" -ne 0 ]; then
            echo "ERROR: reproduction B compiler errors detected"
            cat "$ARTIFACT_DIR/REPRO-B-ERRORS.txt"
            exit 1
          fi

          if [ "$CPUFREQ_WARNING_COUNT_B" -ne 0 ]; then
            echo "ERROR: reproduction B CPUFreq core warning detected"
            cat "$ARTIFACT_DIR/REPRO-B-CPUFREQ-CORE-WARNINGS.txt"
            exit 1
          fi

          if [ "$IDLE_WARNING_COUNT_B" -ne 0 ]; then
            echo "ERROR: reproduction B idle warning detected"
            cat "$ARTIFACT_DIR/REPRO-B-IDLE-WARNINGS.txt"
            exit 1
          fi

          if [ "$SUSFS_RESUKISU_WARNING_COUNT_B" -ne 0 ]; then
            echo "ERROR: reproduction B SUSFS/ReSukiSU/adaptation warning detected"
            cat "$ARTIFACT_DIR/REPRO-B-SUSFS-RESUKISU-WARNINGS.txt"
            exit 1
          fi

          sort "$ARTIFACT_DIR/FULL-BUILD-WARNINGS.txt" \
            > "$ARTIFACT_DIR/BUILD-A-WARNINGS.sorted.txt"

          sort "$ARTIFACT_DIR/REPRO-B-WARNINGS.txt" \
            > "$ARTIFACT_DIR/BUILD-B-WARNINGS.sorted.txt"

          if ! cmp -s \
            "$ARTIFACT_DIR/BUILD-A-WARNINGS.sorted.txt" \
            "$ARTIFACT_DIR/BUILD-B-WARNINGS.sorted.txt"
          then
            echo "ERROR: compiler warning profile differs between build A and B"
            diff -u \
              "$ARTIFACT_DIR/BUILD-A-WARNINGS.sorted.txt" \
              "$ARTIFACT_DIR/BUILD-B-WARNINGS.sorted.txt" \
              || true
            exit 1
          fi

          {
            echo "REPRO_B_DIAGNOSTIC_AUDIT=PASS"
            echo "REPRO_B_ERROR_COUNT=$ERROR_COUNT_B"
            echo "REPRO_B_WARNING_COUNT=$WARNING_COUNT_B"
            echo "REPRO_B_CPUFREQ_CORE_WARNING_COUNT=$CPUFREQ_WARNING_COUNT_B"
            echo "REPRO_B_IDLE_WARNING_COUNT=$IDLE_WARNING_COUNT_B"
            echo "REPRO_B_SUSFS_RESUKISU_ADAPTATION_WARNING_COUNT=$SUSFS_RESUKISU_WARNING_COUNT_B"
            echo "WARNING_PROFILE_EQUALS_BUILD_A=YES"
          } | tee "$ARTIFACT_DIR/REPRO-B-DIAGNOSTICS.txt"

      - name: Verify reproduction B linked identity and outputs
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          LOG="$ARTIFACT_DIR/repro-b-full-build.log"
          IMAGE_B="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX_B="$OUT_DIR/vmlinux"
          SYSTEM_MAP_B="$OUT_DIR/System.map"
          NM="$TOOLCHAIN_DIR/bin/llvm-nm"
          NM_B="${RUNNER_TEMP}/repro-b-vmlinux-symbols.txt"

          for FILE in \
            "$IMAGE_B" \
            "$VMLINUX_B" \
            "$SYSTEM_MAP_B"
          do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: reproduction B output missing: $FILE"
              exit 1
            fi
          done

          for HOOK in \
            ksu_handle_setresuid \
            ksu_handle_execveat \
            ksu_handle_faccessat \
            ksu_handle_sys_read \
            ksu_handle_stat \
            ksu_handle_sys_reboot \
            ksu_handle_input_handle_event
          do
            if ! grep -Fq \
              "susfs_inline: $HOOK found" \
              "$LOG"
            then
              echo "ERROR: reproduction B Kbuild did not confirm hook: $HOOK"
              exit 1
            fi
          done

          if grep -Fq 'is incompatible hook' "$LOG"; then
            echo "ERROR: reproduction B incompatible ReSukiSU hook reported"
            exit 1
          fi

          grep -Fq \
            'ReSukiSU: using SuSFS Inline hook' \
            "$LOG"

          grep -Fq \
            'SUSFS_VERSION: v2.2.0' \
            "$LOG"

          strings "$IMAGE_B" \
            > "$ARTIFACT_DIR/REPRO-B-IMAGE-STRINGS.txt"

          grep -Fq \
            "$EXPECTED_RESUKISU_VERSION" \
            "$ARTIFACT_DIR/REPRO-B-IMAGE-STRINGS.txt"

          "$NM" -n "$VMLINUX_B" \
            > "$NM_B"

          : > "$ARTIFACT_DIR/REPRO-B-REQUIRED-LINKED-SYMBOLS.txt"

          require_b_symbol() {
            local symbol="$1"

            if ! awk -v target="$symbol" \
              'NF >= 3 && $NF == target { found=1 } END { exit(found ? 0 : 1) }' \
              "$NM_B"
            then
              echo "ERROR: reproduction B linked symbol missing: $symbol"
              exit 1
            fi

            printf '%s\n' "$symbol" \
              >> "$ARTIFACT_DIR/REPRO-B-REQUIRED-LINKED-SYMBOLS.txt"
          }

          for SYMBOL in \
            ksu_handle_setresuid \
            ksu_handle_execveat \
            ksu_handle_faccessat \
            ksu_handle_sys_read \
            ksu_handle_stat \
            ksu_handle_sys_reboot \
            ksu_handle_input_handle_event \
            ksu_handle_vfs_fstat \
            susfs_add_sus_map \
            sel_handle_status_ops \
            write_op
          do
            require_b_symbol "$SYMBOL"
          done

          REQUIRED_B_COUNT="$(
            wc -l < "$ARTIFACT_DIR/REPRO-B-REQUIRED-LINKED-SYMBOLS.txt" \
              | tr -d ' '
          )"

          if [ "$REQUIRED_B_COUNT" -ne 11 ]; then
            echo "ERROR: reproduction B expected 11 linked symbols"
            exit 1
          fi

          mapfile -t DTBS_B < <(
            find "$OUT_DIR/arch/arm64/boot/dts" \
              -type f \
              -name 'veux.dtb' \
              -print \
              | sort
          )

          if [ "${#DTBS_B[@]}" -ne 1 ]; then
            echo "ERROR: reproduction B expected exactly one veux.dtb"
            printf '%s\n' "${DTBS_B[@]}"
            exit 1
          fi

          DTB_B="${DTBS_B[0]}"

          "$OUT_DIR/scripts/dtc/dtc" \
            -I dtb \
            -O dts \
            -o /dev/null \
            "$DTB_B"

          DTB_B_BYTES="$(stat -c '%s' "$DTB_B")"
          DTB_B_SHA="$(sha256sum "$DTB_B" | awk '{print $1}')"
          IMAGE_B_SHA="$(sha256sum "$IMAGE_B" | awk '{print $1}')"
          VMLINUX_B_SHA="$(sha256sum "$VMLINUX_B" | awk '{print $1}')"
          SYSTEM_MAP_B_SHA="$(sha256sum "$SYSTEM_MAP_B" | awk '{print $1}')"

          if [ "$DTB_B_BYTES" != "$EXPECTED_VEUX_DTB_BYTES" ]; then
            echo "ERROR: reproduction B VEUX DTB size changed"
            exit 1
          fi

          if [ "$DTB_B_SHA" != "$EXPECTED_VEUX_DTB_SHA256" ]; then
            echo "ERROR: reproduction B VEUX DTB hash changed"
            exit 1
          fi

          {
            echo "REPRO_B_IDENTITY_AUDIT=PASS"
            echo "REPRO_B_REQUIRED_SYMBOL_COUNT=$REQUIRED_B_COUNT"
            echo "REPRO_B_HOOK_MODE=SUSFS_INLINE"
            echo "REPRO_B_SUSFS_VERSION=v2.2.0"
            echo "REPRO_B_RESUKISU_VERSION=$EXPECTED_RESUKISU_VERSION"
            echo "REPRO_B_VEUX_DTB_PARSE=PASS"
            echo "REPRO_B_IMAGE_SHA256=$IMAGE_B_SHA"
            echo "REPRO_B_VEUX_DTB_BYTES=$DTB_B_BYTES"
            echo "REPRO_B_VEUX_DTB_SHA256=$DTB_B_SHA"
            echo "REPRO_B_VMLINUX_SHA256=$VMLINUX_B_SHA"
            echo "REPRO_B_SYSTEM_MAP_SHA256=$SYSTEM_MAP_B_SHA"
          } | tee "$ARTIFACT_DIR/REPRO-B-OUTPUT-HASHES.txt"

      - name: Prove build A and B same-path byte reproducibility
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SNAPSHOT="$REPRO_A_SNAPSHOT"

          IMAGE_A="$SNAPSHOT/Image"
          IMAGE_B="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX_A="$SNAPSHOT/vmlinux"
          VMLINUX_B="$OUT_DIR/vmlinux"
          SYSTEM_MAP_A="$SNAPSHOT/System.map"
          SYSTEM_MAP_B="$OUT_DIR/System.map"
          CONFIG_A="$SNAPSHOT/final.config"
          CONFIG_B="$OUT_DIR/.config"
          COMPILE_A="$SNAPSHOT/compile.h"
          COMPILE_B="$OUT_DIR/include/generated/compile.h"
          DTB_A="$SNAPSHOT/veux.dtb"

          mapfile -t DTBS_B < <(
            find "$OUT_DIR/arch/arm64/boot/dts" \
              -type f \
              -name 'veux.dtb' \
              -print \
              | sort
          )

          if [ "${#DTBS_B[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one VEUX DTB in build B"
            printf '%s\n' "${DTBS_B[@]}"
            exit 1
          fi

          DTB_B="${DTBS_B[0]}"

          for FILE in \
            "$IMAGE_A" \
            "$IMAGE_B" \
            "$DTB_A" \
            "$DTB_B" \
            "$SYSTEM_MAP_A" \
            "$SYSTEM_MAP_B" \
            "$VMLINUX_A" \
            "$VMLINUX_B" \
            "$CONFIG_A" \
            "$CONFIG_B" \
            "$COMPILE_A" \
            "$COMPILE_B" \
            "$SNAPSHOT/kernelrelease.txt" \
            "$ARTIFACT_DIR/repro-b-kernelrelease.txt"
          do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: reproducibility comparison input missing: $FILE"
              exit 1
            fi
          done

          EXPECTED_BUILD_DIR="${GITHUB_WORKSPACE}/kernel/${OUT_DIR}"

          if ! grep -Fq \
            "Entering directory '${EXPECTED_BUILD_DIR}'" \
            "$ARTIFACT_DIR/full-build.log"
          then
            echo "ERROR: build A log does not prove expected O= path"
            exit 1
          fi

          if ! grep -Fq \
            "Entering directory '${EXPECTED_BUILD_DIR}'" \
            "$ARTIFACT_DIR/repro-b-full-build.log"
          then
            echo "ERROR: build B log does not prove same O= path"
            exit 1
          fi

          compare_exact() {
            local label="$1"
            local a="$2"
            local b="$3"

            local sha_a
            local sha_b
            sha_a="$(sha256sum "$a" | awk '{print $1}')"
            sha_b="$(sha256sum "$b" | awk '{print $1}')"

            {
              echo "${label}_A_SHA256=$sha_a"
              echo "${label}_B_SHA256=$sha_b"
            } >> "$ARTIFACT_DIR/REPRODUCIBILITY-HASHES.txt"

            if ! cmp -s "$a" "$b"; then
              echo "ERROR: $label differs between same-path build A and B"
              echo "A SHA256: $sha_a"
              echo "B SHA256: $sha_b"
              cmp -l "$a" "$b" \
                | head -n 40 \
                > "$ARTIFACT_DIR/${label}-FIRST-BYTE-DIFFERENCES.txt" \
                || true
              exit 1
            fi

            echo "${label}_BYTE_IDENTICAL=YES" \
              >> "$ARTIFACT_DIR/REPRODUCIBILITY-HASHES.txt"
          }

          : > "$ARTIFACT_DIR/REPRODUCIBILITY-HASHES.txt"

          compare_exact IMAGE "$IMAGE_A" "$IMAGE_B"
          compare_exact VEUX_DTB "$DTB_A" "$DTB_B"
          compare_exact SYSTEM_MAP "$SYSTEM_MAP_A" "$SYSTEM_MAP_B"
          compare_exact VMLINUX "$VMLINUX_A" "$VMLINUX_B"
          compare_exact CONFIG "$CONFIG_A" "$CONFIG_B"
          compare_exact COMPILE_H "$COMPILE_A" "$COMPILE_B"

          if ! cmp -s \
            "$SNAPSHOT/kernelrelease.txt" \
            "$ARTIFACT_DIR/repro-b-kernelrelease.txt"
          then
            echo "ERROR: kernelrelease text differs A/B"
            exit 1
          fi

          cp "$COMPILE_A" \
            "$ARTIFACT_DIR/BUILD-A-compile.h"

          cp "$COMPILE_B" \
            "$ARTIFACT_DIR/BUILD-B-compile.h"

          cat "$ARTIFACT_DIR/REPRODUCIBILITY-HASHES.txt"

          {
            echo "REPRODUCIBILITY=PASS"
            echo "DETERMINISTIC_CROSS_RUN_REFERENCE=READY"
            echo "CROSS_RUN_REPRODUCIBILITY=NOT_YET_CLAIMED"
            echo "DETERMINISTIC_GIT_AUTHOR_DATE=$GIT_AUTHOR_DATE"
            echo "DETERMINISTIC_GIT_COMMITTER_DATE=$GIT_COMMITTER_DATE"
            echo "BUILD_A_AND_B_SAME_OUTPUT_PATH=YES"
            echo "BUILD_A_OUTPUT_TREE_DELETED_BEFORE_B=YES"
            echo "OUTPUT_PATH=$OUT_DIR"
            echo "FIXED_KBUILD_BUILD_USER=$KBUILD_BUILD_USER"
            echo "FIXED_KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST"
            echo "FIXED_KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP"
            echo "FIXED_KBUILD_BUILD_VERSION=$KBUILD_BUILD_VERSION"
            echo "FIXED_SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
            echo "IMAGE_BYTE_IDENTICAL=YES"
            echo "VEUX_DTB_BYTE_IDENTICAL=YES"
            echo "SYSTEM_MAP_BYTE_IDENTICAL=YES"
            echo "VMLINUX_BYTE_IDENTICAL=YES"
            echo "CONFIG_BYTE_IDENTICAL=YES"
            echo "COMPILE_H_BYTE_IDENTICAL=YES"
            echo "KERNELRELEASE_BYTE_IDENTICAL=YES"
            echo "WARNING_PROFILE_BYTE_IDENTICAL=YES"
            echo "REFERENCE_46C2_IMAGE_HASH_HARDCODED=NO"
            echo "46C3_DIFFERENT_OUTPUT_PATH_FALSE_NEGATIVE_AVOIDED=YES"
          } | tee "$ARTIFACT_DIR/REPRODUCIBILITY.txt"

      - name: Write deterministic cross-run reference manifest
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX="$OUT_DIR/vmlinux"
          SYSTEM_MAP="$OUT_DIR/System.map"
          CONFIG="$OUT_DIR/.config"
          COMPILE_H="$OUT_DIR/include/generated/compile.h"

          mapfile -t DTBS < <(
            find "$OUT_DIR/arch/arm64/boot/dts" \
              -type f \
              -name 'veux.dtb' \
              -print \
              | sort
          )

          if [ "${#DTBS[@]}" -ne 1 ]; then
            echo "ERROR: deterministic reference expected exactly one veux.dtb"
            exit 1
          fi

          DTB="${DTBS[0]}"

          for FILE in \
            "$IMAGE" \
            "$VMLINUX" \
            "$SYSTEM_MAP" \
            "$CONFIG" \
            "$COMPILE_H" \
            "$DTB"
          do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: deterministic reference input missing: $FILE"
              exit 1
            fi
          done

          CANDIDATE_SHA_VALUE="$(
            awk -F= '$1=="CANDIDATE_SHA" {print $2}' \
              "$ARTIFACT_DIR/CANDIDATE-IDENTITY.txt"
          )"

          CUMULATIVE_SHA_VALUE="$(
            awk -F= '$1=="CUMULATIVE_SHA" {print $2}' \
              "$ARTIFACT_DIR/CUMULATIVE-BASELINE-IDENTITY.txt"
          )"

          KERNEL_RELEASE_VALUE="$(cat "$ARTIFACT_DIR/repro-b-kernelrelease.txt")"

          {
            echo "REFERENCE_FORMAT=VEUX_46C7_V1"
            echo "REFERENCE_STATUS=READY_FOR_INDEPENDENT_46C8_VERIFICATION"
            echo "KERNEL_VERSION=5.4.274"
            echo "BASE_CANDIDATE_TREE=$EXPECTED_CANDIDATE_TREE"
            echo "CUMULATIVE_BASELINE_TREE=$EXPECTED_CUMULATIVE_TREE"
            echo "CANDIDATE_COMMIT_SHA=$CANDIDATE_SHA_VALUE"
            echo "CUMULATIVE_COMMIT_SHA=$CUMULATIVE_SHA_VALUE"
            echo "GIT_AUTHOR_DATE=$GIT_AUTHOR_DATE"
            echo "GIT_COMMITTER_DATE=$GIT_COMMITTER_DATE"
            echo "KBUILD_BUILD_USER=$KBUILD_BUILD_USER"
            echo "KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST"
            echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP"
            echo "KBUILD_BUILD_VERSION=$KBUILD_BUILD_VERSION"
            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
            echo "KERNEL_RELEASE=$KERNEL_RELEASE_VALUE"
            echo "IMAGE_BYTES=$(stat -c '%s' "$IMAGE")"
            echo "IMAGE_SHA256=$(sha256sum "$IMAGE" | awk '{print $1}')"
            echo "VEUX_DTB_BYTES=$(stat -c '%s' "$DTB")"
            echo "VEUX_DTB_SHA256=$(sha256sum "$DTB" | awk '{print $1}')"
            echo "VMLINUX_BYTES=$(stat -c '%s' "$VMLINUX")"
            echo "VMLINUX_SHA256=$(sha256sum "$VMLINUX" | awk '{print $1}')"
            echo "SYSTEM_MAP_BYTES=$(stat -c '%s' "$SYSTEM_MAP")"
            echo "SYSTEM_MAP_SHA256=$(sha256sum "$SYSTEM_MAP" | awk '{print $1}')"
            echo "CONFIG_BYTES=$(stat -c '%s' "$CONFIG")"
            echo "CONFIG_SHA256=$(sha256sum "$CONFIG" | awk '{print $1}')"
            echo "COMPILE_H_BYTES=$(stat -c '%s' "$COMPILE_H")"
            echo "COMPILE_H_SHA256=$(sha256sum "$COMPILE_H" | awk '{print $1}')"
            echo "RESUKISU_COMMIT=$RESUKISU_COMMIT"
            echo "SUSFS_BACKPORT_COMMIT=$BACKPORT_COMMIT"
            echo "SUSFS_BACKPORT_SHA256=$BACKPORT_PATCH_SHA256"
            echo "SOURCE_ADAPTATION_SHA256=$EXPECTED_WARNING_CLEAN_DIFF_SHA256"
            echo "FINAL_CONFIG_EXPECTED_SHA256=$EXPECTED_CUMULATIVE_CONFIG_SHA256"
            echo "VEUX_DTB_EXPECTED_SHA256=$EXPECTED_VEUX_DTB_SHA256"
            echo "SAME_PATH_A_B_REPRODUCIBILITY=PASS"
            echo "CROSS_RUN_REPRODUCIBILITY=NOT_YET_CLAIMED"
          } | tee "$ARTIFACT_DIR/CROSS-RUN-REFERENCE.txt"

          sha256sum "$ARTIFACT_DIR/CROSS-RUN-REFERENCE.txt" \
            | tee "$ARTIFACT_DIR/CROSS-RUN-REFERENCE.txt.sha256"

      - name: Verify independent 46C7 cross-run reference
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          REF="$ARTIFACT_DIR/CROSS-RUN-REFERENCE.txt"
          REF_SIDECAR="$ARTIFACT_DIR/CROSS-RUN-REFERENCE.txt.sha256"

          if [ ! -s "$REF" ] || [ ! -s "$REF_SIDECAR" ]; then
            echo "ERROR: regenerated cross-run reference evidence missing"
            exit 1
          fi

          REF_SHA="$(sha256sum "$REF" | awk '{print $1}')"
          REF_BYTES="$(stat -c '%s' "$REF")"
          SIDECAR_SHA="$(awk '{print $1}' "$REF_SIDECAR")"

          if [ "$REF_SHA" != "$EXPECTED_46C7_REFERENCE_MANIFEST_SHA256" ]; then
            echo "ERROR: current regenerated reference manifest differs from 46C7"
            echo "Expected: $EXPECTED_46C7_REFERENCE_MANIFEST_SHA256"
            echo "Actual:   $REF_SHA"
            exit 1
          fi

          if [ "$REF_BYTES" != "$EXPECTED_46C7_REFERENCE_MANIFEST_BYTES" ]; then
            echo "ERROR: current regenerated reference manifest byte count differs from 46C7"
            echo "Expected: $EXPECTED_46C7_REFERENCE_MANIFEST_BYTES"
            echo "Actual:   $REF_BYTES"
            exit 1
          fi

          if [ "$SIDECAR_SHA" != "$EXPECTED_46C7_REFERENCE_MANIFEST_SHA256" ]; then
            echo "ERROR: regenerated reference sidecar hash mismatch"
            exit 1
          fi

          CANDIDATE_SHA_VALUE="$(
            awk -F= \
              '$1=="CANDIDATE_SHA" {print $2}' \
              "$ARTIFACT_DIR/CANDIDATE-IDENTITY.txt"
          )"

          CUMULATIVE_SHA_VALUE="$(
            awk -F= \
              '$1=="CUMULATIVE_SHA" {print $2}' \
              "$ARTIFACT_DIR/CUMULATIVE-BASELINE-IDENTITY.txt"
          )"

          KERNEL_RELEASE_VALUE="$(
            cat "$ARTIFACT_DIR/repro-b-kernelrelease.txt"
          )"

          if [ "$CANDIDATE_SHA_VALUE" != "$EXPECTED_46C7_CANDIDATE_COMMIT_SHA" ]; then
            echo "ERROR: deterministic Candidate commit differs from 46C7"
            echo "Expected: $EXPECTED_46C7_CANDIDATE_COMMIT_SHA"
            echo "Actual:   $CANDIDATE_SHA_VALUE"
            exit 1
          fi

          if [ "$CUMULATIVE_SHA_VALUE" != "$EXPECTED_46C7_CUMULATIVE_COMMIT_SHA" ]; then
            echo "ERROR: deterministic cumulative commit differs from 46C7"
            echo "Expected: $EXPECTED_46C7_CUMULATIVE_COMMIT_SHA"
            echo "Actual:   $CUMULATIVE_SHA_VALUE"
            exit 1
          fi

          if [ "$KERNEL_RELEASE_VALUE" != "$EXPECTED_46C7_KERNEL_RELEASE" ]; then
            echo "ERROR: kernelrelease differs from 46C7"
            echo "Expected: $EXPECTED_46C7_KERNEL_RELEASE"
            echo "Actual:   $KERNEL_RELEASE_VALUE"
            exit 1
          fi

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX="$OUT_DIR/vmlinux"
          SYSTEM_MAP="$OUT_DIR/System.map"
          CONFIG="$OUT_DIR/.config"
          COMPILE_H="$OUT_DIR/include/generated/compile.h"

          mapfile -t DTBS < <(
            find "$OUT_DIR/arch/arm64/boot/dts" \
              -type f \
              -name 'veux.dtb' \
              -print \
              | sort
          )

          if [ "${#DTBS[@]}" -ne 1 ]; then
            echo "ERROR: cross-run verifier expected exactly one veux.dtb"
            exit 1
          fi

          DTB="${DTBS[0]}"

          verify_file() {
            local label="$1"
            local file="$2"
            local expected_bytes="$3"
            local expected_sha="$4"

            if [ ! -s "$file" ]; then
              echo "ERROR: cross-run verifier missing $label: $file"
              exit 1
            fi

            local actual_bytes
            local actual_sha

            actual_bytes="$(stat -c '%s' "$file")"
            actual_sha="$(sha256sum "$file" | awk '{print $1}')"

            if [ "$actual_bytes" != "$expected_bytes" ]; then
              echo "ERROR: $label byte count differs from 46C7"
              echo "Expected: $expected_bytes"
              echo "Actual:   $actual_bytes"
              exit 1
            fi

            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "ERROR: $label SHA-256 differs from 46C7"
              echo "Expected: $expected_sha"
              echo "Actual:   $actual_sha"
              exit 1
            fi

            {
              echo "${label}_BYTES=$actual_bytes"
              echo "${label}_SHA256=$actual_sha"
              echo "${label}_MATCHES_46C7=YES"
            } >> "$ARTIFACT_DIR/CROSS-RUN-FILE-MATCHES.txt"
          }

          : > "$ARTIFACT_DIR/CROSS-RUN-FILE-MATCHES.txt"

          verify_file \
            IMAGE \
            "$IMAGE" \
            "$EXPECTED_46C7_IMAGE_BYTES" \
            "$EXPECTED_46C7_IMAGE_SHA256"

          verify_file \
            VEUX_DTB \
            "$DTB" \
            "$EXPECTED_46C7_VEUX_DTB_BYTES" \
            "$EXPECTED_46C7_VEUX_DTB_SHA256"

          verify_file \
            VMLINUX \
            "$VMLINUX" \
            "$EXPECTED_46C7_VMLINUX_BYTES" \
            "$EXPECTED_46C7_VMLINUX_SHA256"

          verify_file \
            SYSTEM_MAP \
            "$SYSTEM_MAP" \
            "$EXPECTED_46C7_SYSTEM_MAP_BYTES" \
            "$EXPECTED_46C7_SYSTEM_MAP_SHA256"

          verify_file \
            CONFIG \
            "$CONFIG" \
            "$EXPECTED_46C7_CONFIG_BYTES" \
            "$EXPECTED_46C7_CONFIG_SHA256"

          verify_file \
            COMPILE_H \
            "$COMPILE_H" \
            "$EXPECTED_46C7_COMPILE_H_BYTES" \
            "$EXPECTED_46C7_COMPILE_H_SHA256"

          for EXPECTED_LINE in \
            'REFERENCE_FORMAT=VEUX_46C7_V1' \
            'REFERENCE_STATUS=READY_FOR_INDEPENDENT_46C8_VERIFICATION' \
            "CANDIDATE_COMMIT_SHA=$EXPECTED_46C7_CANDIDATE_COMMIT_SHA" \
            "CUMULATIVE_COMMIT_SHA=$EXPECTED_46C7_CUMULATIVE_COMMIT_SHA" \
            "KERNEL_RELEASE=$EXPECTED_46C7_KERNEL_RELEASE" \
            "IMAGE_BYTES=$EXPECTED_46C7_IMAGE_BYTES" \
            "IMAGE_SHA256=$EXPECTED_46C7_IMAGE_SHA256" \
            "VEUX_DTB_BYTES=$EXPECTED_46C7_VEUX_DTB_BYTES" \
            "VEUX_DTB_SHA256=$EXPECTED_46C7_VEUX_DTB_SHA256" \
            "VMLINUX_BYTES=$EXPECTED_46C7_VMLINUX_BYTES" \
            "VMLINUX_SHA256=$EXPECTED_46C7_VMLINUX_SHA256" \
            "SYSTEM_MAP_BYTES=$EXPECTED_46C7_SYSTEM_MAP_BYTES" \
            "SYSTEM_MAP_SHA256=$EXPECTED_46C7_SYSTEM_MAP_SHA256" \
            "CONFIG_BYTES=$EXPECTED_46C7_CONFIG_BYTES" \
            "CONFIG_SHA256=$EXPECTED_46C7_CONFIG_SHA256" \
            "COMPILE_H_BYTES=$EXPECTED_46C7_COMPILE_H_BYTES" \
            "COMPILE_H_SHA256=$EXPECTED_46C7_COMPILE_H_SHA256" \
            'SAME_PATH_A_B_REPRODUCIBILITY=PASS' \
            'CROSS_RUN_REPRODUCIBILITY=NOT_YET_CLAIMED'
          do
            if ! grep -qFx "$EXPECTED_LINE" "$REF"; then
              echo "ERROR: expected 46C7 reference line missing: $EXPECTED_LINE"
              exit 1
            fi
          done

          {
            echo "CROSS_RUN_REPRODUCIBILITY=PASS"
            echo "REFERENCE_WORKFLOW=46C7"
            echo "VERIFIER_WORKFLOW=46C9"
            echo "REFERENCE_FORMAT=VEUX_46C7_V1"
            echo "REFERENCE_ARTIFACT_ZIP_SHA256=$EXPECTED_46C7_ARTIFACT_ZIP_SHA256"
            echo "REFERENCE_MANIFEST_SHA256=$REF_SHA"
            echo "REFERENCE_MANIFEST_BYTES=$REF_BYTES"
            echo "REFERENCE_MANIFEST_BYTE_IDENTICAL=YES"
            echo "CANDIDATE_COMMIT_SHA=$CANDIDATE_SHA_VALUE"
            echo "CANDIDATE_COMMIT_MATCHES_46C7=YES"
            echo "CUMULATIVE_COMMIT_SHA=$CUMULATIVE_SHA_VALUE"
            echo "CUMULATIVE_COMMIT_MATCHES_46C7=YES"
            echo "KERNEL_RELEASE=$KERNEL_RELEASE_VALUE"
            echo "KERNEL_RELEASE_MATCHES_46C7=YES"
            echo "IMAGE_MATCHES_46C7=YES"
            echo "VEUX_DTB_MATCHES_46C7=YES"
            echo "VMLINUX_MATCHES_46C7=YES"
            echo "SYSTEM_MAP_MATCHES_46C7=YES"
            echo "CONFIG_MATCHES_46C7=YES"
            echo "COMPILE_H_MATCHES_46C7=YES"
            echo "SAME_PATH_A_B_REPRODUCIBILITY_THIS_RUN=PASS"
            echo "DETERMINISTIC_GIT_METADATA_MATCHES_46C7=YES"
            echo "FIXED_BUILD_METADATA_MATCHES_46C7=YES"
          } | tee "$ARTIFACT_DIR/CROSS-RUN-VERIFICATION.txt"

          cat "$ARTIFACT_DIR/CROSS-RUN-FILE-MATCHES.txt"

      - name: Verify no boot image flash ZIP or device artifact exists
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          FOUND="$(
            find . \
              -type f \
              \( \
                -name 'boot.img' \
                -o -name 'vendor_boot.img' \
                -o -name 'init_boot.img' \
                -o -name '*flash*.zip' \
                -o -name '*AnyKernel*.zip' \
              \) \
              -print \
              2>/dev/null || true
          )"

          if [ -n "$FOUND" ]; then
            echo "ERROR: unexpected boot/flash packaging artifact found"
            printf '%s\n' "$FOUND"
            exit 1
          fi

          {
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "DEVICE_ACCESSED=NO"
            echo "DEVICE_FLASHED=NO"
          } | tee "$ARTIFACT_DIR/NO-FLASH-GUARD.txt"

      - name: Collect successful build payload
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          SYSTEM_MAP="$OUT_DIR/System.map"

          DTB="$(
            find "$OUT_DIR/arch/arm64/boot/dts" \
              -type f \
              -name 'veux.dtb' \
              -print
          )"

          cp \
            "$IMAGE" \
            "$ARTIFACT_DIR/Image"

          cp \
            "$DTB" \
            "$ARTIFACT_DIR/veux.dtb"

          cp \
            "$SYSTEM_MAP" \
            "$ARTIFACT_DIR/System.map"

          cp \
            "$OUT_DIR/.config" \
            "$ARTIFACT_DIR/final.config"

          {
            echo "PAYLOAD_IMAGE=YES"
            echo "PAYLOAD_VEUX_DTB=YES"
            echo "PAYLOAD_SYSTEM_MAP=YES"
            echo "PAYLOAD_FINAL_CONFIG=YES"
            echo "VMLINUX_INCLUDED=NO"
            echo "VMLINUX_IDENTITY_RECORDED=YES"
          } | tee "$ARTIFACT_DIR/PAYLOAD-STATE.txt"

      - name: Prepare final 46C9 result
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          for CHECK in \
            "$ARTIFACT_DIR/CANDIDATE-IDENTITY.txt" \
            "$ARTIFACT_DIR/CUMULATIVE-BASELINE-IDENTITY.txt" \
            "$ARTIFACT_DIR/SOURCE-ADAPTATION-CHECK.txt" \
            "$ARTIFACT_DIR/ADAPTATION-METADATA-EQUIVALENCE.txt" \
            "$ARTIFACT_DIR/FINAL-CONFIG-CHECK.txt" \
            "$ARTIFACT_DIR/CONFIG-POST-BUILD-CHECK.txt" \
            "$ARTIFACT_DIR/DIAGNOSTICS.txt" \
            "$ARTIFACT_DIR/VMLINUX-SYMBOL-AUDIT.txt" \
            "$ARTIFACT_DIR/BUILD-IDENTITY-AUDIT.txt" \
            "$ARTIFACT_DIR/BUILD-OUTPUT-HASHES.txt" \
            "$ARTIFACT_DIR/REPRO-B-SOURCE-STATE.txt" \
            "$ARTIFACT_DIR/REPRO-B-CONFIG-CHECK.txt" \
            "$ARTIFACT_DIR/REPRO-B-DIAGNOSTICS.txt" \
            "$ARTIFACT_DIR/REPRO-B-OUTPUT-HASHES.txt" \
            "$ARTIFACT_DIR/REPRODUCIBILITY.txt" \
            "$ARTIFACT_DIR/CROSS-RUN-REFERENCE.txt" \
            "$ARTIFACT_DIR/CROSS-RUN-VERIFICATION.txt" \
            "$ARTIFACT_DIR/NO-FLASH-GUARD.txt"
          do
            if [ ! -s "$CHECK" ]; then
              echo "ERROR: required final evidence missing: $CHECK"
              exit 1
            fi
          done

          grep -qFx \
            "CUMULATIVE_TREE=$EXPECTED_CUMULATIVE_TREE" \
            "$ARTIFACT_DIR/CUMULATIVE-BASELINE-IDENTITY.txt"

          grep -qFx \
            'SOURCE_ADAPTATION=PASS' \
            "$ARTIFACT_DIR/SOURCE-ADAPTATION-CHECK.txt"

          grep -qFx \
            'SEMANTIC_ADAPTATION_EQUALS_WORKFLOW17=YES' \
            "$ARTIFACT_DIR/ADAPTATION-METADATA-EQUIVALENCE.txt"

          grep -qFx \
            'FINAL_CUMULATIVE_CONFIG=PASS' \
            "$ARTIFACT_DIR/FINAL-CONFIG-CHECK.txt"

          grep -qFx \
            'CONFIG_POST_BUILD=PASS' \
            "$ARTIFACT_DIR/CONFIG-POST-BUILD-CHECK.txt"

          grep -qFx \
            'COMPILER_DIAGNOSTIC_AUDIT=PASS' \
            "$ARTIFACT_DIR/DIAGNOSTICS.txt"

          grep -qFx \
            'VMLINUX_SYMBOL_AUDIT=PASS' \
            "$ARTIFACT_DIR/VMLINUX-SYMBOL-AUDIT.txt"

          grep -qFx \
            'BUILD_IDENTITY_AUDIT=PASS' \
            "$ARTIFACT_DIR/BUILD-IDENTITY-AUDIT.txt"

          grep -qFx \
            'VEUX_DTB_PARSE=PASS' \
            "$ARTIFACT_DIR/BUILD-OUTPUT-HASHES.txt"

          grep -qFx \
            'REPRO_B_SOURCE_STATE=PASS' \
            "$ARTIFACT_DIR/REPRO-B-SOURCE-STATE.txt"

          grep -qFx \
            'REPRO_B_CONFIG=PASS' \
            "$ARTIFACT_DIR/REPRO-B-CONFIG-CHECK.txt"

          grep -qFx \
            'REPRO_B_DIAGNOSTIC_AUDIT=PASS' \
            "$ARTIFACT_DIR/REPRO-B-DIAGNOSTICS.txt"

          grep -qFx \
            'REPRO_B_IDENTITY_AUDIT=PASS' \
            "$ARTIFACT_DIR/REPRO-B-OUTPUT-HASHES.txt"

          grep -qFx \
            'REPRODUCIBILITY=PASS' \
            "$ARTIFACT_DIR/REPRODUCIBILITY.txt"

          grep -qFx \
            'REFERENCE_STATUS=READY_FOR_INDEPENDENT_46C8_VERIFICATION' \
            "$ARTIFACT_DIR/CROSS-RUN-REFERENCE.txt"

          grep -qFx \
            'CROSS_RUN_REPRODUCIBILITY=PASS' \
            "$ARTIFACT_DIR/CROSS-RUN-VERIFICATION.txt"

          grep -qFx \
            "REFERENCE_MANIFEST_SHA256=$EXPECTED_46C7_REFERENCE_MANIFEST_SHA256" \
            "$ARTIFACT_DIR/CROSS-RUN-VERIFICATION.txt"

          WARNING_COUNT="$(
            awk -F= \
              '$1=="WARNING_COUNT" {print $2}' \
              "$ARTIFACT_DIR/DIAGNOSTICS.txt"
          )"

          WARNING_COUNT_B="$(
            awk -F= \
              '$1=="REPRO_B_WARNING_COUNT" {print $2}' \
              "$ARTIFACT_DIR/REPRO-B-DIAGNOSTICS.txt"
          )"

          if [ "$WARNING_COUNT" != "$WARNING_COUNT_B" ]; then
            echo "ERROR: warning counts differ between build A and B"
            exit 1
          fi

          IMAGE_SHA="$(
            awk -F= \
              '$1=="IMAGE_SHA256" {print $2}' \
              "$ARTIFACT_DIR/BUILD-OUTPUT-HASHES.txt"
          )"

          VMLINUX_SHA="$(
            awk -F= \
              '$1=="VMLINUX_SHA256" {print $2}' \
              "$ARTIFACT_DIR/BUILD-OUTPUT-HASHES.txt"
          )"

          SYSTEM_MAP_SHA="$(
            awk -F= \
              '$1=="SYSTEM_MAP_SHA256" {print $2}' \
              "$ARTIFACT_DIR/BUILD-OUTPUT-HASHES.txt"
          )"

          {
            echo "RESULT=PASS"
            echo "WORKFLOW=46C9"
            echo "KERNEL_VERSION=5.4.274"
            echo "BASE_CANDIDATE_TREE=$EXPECTED_CANDIDATE_TREE"
            echo "CUMULATIVE_BASELINE_TREE=$EXPECTED_CUMULATIVE_TREE"

            echo "CUMULATIVE_44C_REPLAY=PASS"
            echo "CPUFREQ_AFTER_SHA256=$EXPECTED_CPUFREQ_AFTER_SHA256"
            echo "IDLE_RESTORE_DIFF_SHA256=$EXPECTED_IDLE_RESTORE_DIFF_SHA256"
            echo "SCHEDUTIL_AFTER_SHA256=$EXPECTED_SCHEDUTIL_AFTER_SHA256"
            echo "CASS_PATCH_SHA256=$EXPECTED_CASS_DIFF_SHA256"
            echo "SPRD_ROTATION_DISABLED=YES"
            echo "LB_CAPACITY_RATE_LIMIT=RESTORED"
            echo "CPUSETS_ENABLED=YES"
            echo "PELT_RESTORED_PERIOD=8"
            echo "HZ_RESOLVED_CHOICE=250"

            echo "RESUKISU_COMMIT=$RESUKISU_COMMIT"
            echo "RESUKISU_AUDIT_HEAD=$RESUKISU_AUDIT_HEAD"
            echo "RESUKISU_NEW_KERNEL_DELTA=NO"

            echo "SUSFS_BACKPORT_COMMIT=$BACKPORT_COMMIT"
            echo "SUSFS_BACKPORT_SHA256=$BACKPORT_PATCH_SHA256"
            echo "CUMULATIVE_RAW_ADAPTATION_SHA256=$EXPECTED_WARNING_CLEAN_DIFF_SHA256"
            echo "SEMANTIC_ADAPTATION_EQUALS_WORKFLOW17=YES"
            echo "OPEN_REDIRECT_SRCU_UAF_FIX_PRESENT=YES"
            echo "OPEN_REDIRECT_MAPS_POINTER_SRCU_FIX_PRESENT=YES"

            echo "FINAL_CUMULATIVE_CONFIG_SHA256=$EXPECTED_CUMULATIVE_CONFIG_SHA256"
            echo "CONFIG_POST_BUILD_BYTE_IDENTICAL=YES"

            echo "FULL_KERNEL_BUILD=PASS"
            echo "REPRODUCTION_BUILD_B=PASS"
            echo "REPRODUCIBILITY=PASS"
            echo "DETERMINISTIC_CROSS_RUN_REFERENCE=VERIFIED"
            echo "CROSS_RUN_REPRODUCIBILITY=PASS"
            echo "REFERENCE_WORKFLOW=46C7"
            echo "REFERENCE_MANIFEST_SHA256=$EXPECTED_46C7_REFERENCE_MANIFEST_SHA256"
            echo "REFERENCE_ARTIFACT_ZIP_SHA256=$EXPECTED_46C7_ARTIFACT_ZIP_SHA256"
            echo "DETERMINISTIC_GIT_AUTHOR_DATE=$GIT_AUTHOR_DATE"
            echo "DETERMINISTIC_GIT_COMMITTER_DATE=$GIT_COMMITTER_DATE"
            echo "BUILD_A_AND_B_SAME_OUTPUT_PATH=YES"
            echo "BUILD_A_OUTPUT_TREE_DELETED_BEFORE_B=YES"
            echo "IMAGE_BYTE_IDENTICAL_A_B=YES"
            echo "VEUX_DTB_BYTE_IDENTICAL_A_B=YES"
            echo "SYSTEM_MAP_BYTE_IDENTICAL_A_B=YES"
            echo "VMLINUX_BYTE_IDENTICAL_A_B=YES"
            echo "CONFIG_BYTE_IDENTICAL_A_B=YES"
            echo "COMPILE_H_BYTE_IDENTICAL_A_B=YES"
            echo "KERNELRELEASE_BYTE_IDENTICAL_A_B=YES"
            echo "WARNING_PROFILE_BYTE_IDENTICAL_A_B=YES"
            echo "KBUILD_BUILD_USER=$KBUILD_BUILD_USER"
            echo "KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST"
            echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP"
            echo "KBUILD_BUILD_VERSION=$KBUILD_BUILD_VERSION"
            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
            echo "REFERENCE_46C2_IMAGE_HASH_HARDCODED=NO"
            echo "COMPILER_ERRORS=0"
            echo "COMPILER_WARNINGS=$WARNING_COUNT"
            echo "REPRO_B_COMPILER_WARNINGS=$WARNING_COUNT_B"
            echo "COMPILER_WARNING_COUNT_POLICY=MEASURED_NOT_HARDCODED"
            echo "CPUFREQ_CORE_COMPILER_WARNINGS=0"
            echo "IDLE_COMPILER_WARNINGS=0"
            echo "SUSFS_RESUKISU_ADAPTATION_WARNINGS=0"

            echo "VMLINUX_SYMBOL_AUDIT=PASS"
            echo "REQUIRED_RESUKISU_SUSFS_SYMBOLS=11"
            echo "BUILD_IDENTITY_AUDIT=PASS"

            echo "IMAGE_CREATED=YES"
            echo "IMAGE_SHA256=$IMAGE_SHA"
            echo "DTBS_BUILT=YES"
            echo "VEUX_DTB_PARSE=PASS"
            echo "VEUX_DTB_SHA256=$EXPECTED_VEUX_DTB_SHA256"
            echo "VMLINUX_SHA256=$VMLINUX_SHA"
            echo "SYSTEM_MAP_SHA256=$SYSTEM_MAP_SHA"

            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "DEVICE_FLASHED=NO"
          } | tee "$ARTIFACT_DIR/RESULT.txt"

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p \
            "$ARTIFACT_DIR/failure-output"

          {
            echo "VEUX 46C9 independent cross-run verifier: FAILURE"
            echo "Finished: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "No boot.img was intentionally created."
            echo "No flashable ZIP was intentionally created."
            echo "Nothing was flashed."
          } > "$ARTIFACT_DIR/FAILURE-SUMMARY.txt"

          if [ -d kernel/.git ]; then
            git -C kernel status --short \
              > "$ARTIFACT_DIR/FAILURE-git-status.txt" \
              2>&1 \
              || true

            git -C kernel diff \
              --no-ext-diff \
              --no-color \
              > "$ARTIFACT_DIR/FAILURE-kernel.diff" \
              2>&1 \
              || true

            find kernel \
              -type f \
              -name '*.rej' \
              -print \
              > "$ARTIFACT_DIR/FAILURE-reject-files.txt" \
              2>&1 \
              || true

            find kernel \
              -type f \
              -name '*.orig' \
              -print \
              > "$ARTIFACT_DIR/FAILURE-orig-files.txt" \
              2>&1 \
              || true
          else
            echo "kernel checkout unavailable" \
              > "$ARTIFACT_DIR/FAILURE-git-status.txt"

            : > "$ARTIFACT_DIR/FAILURE-kernel.diff"
            : > "$ARTIFACT_DIR/FAILURE-reject-files.txt"
            : > "$ARTIFACT_DIR/FAILURE-orig-files.txt"
          fi

          if [ -f "$ARTIFACT_DIR/full-build.log" ]; then
            tail -n 1500 \
              "$ARTIFACT_DIR/full-build.log" \
              > "$ARTIFACT_DIR/FAILURE-full-build-tail.txt"

            grep -Ei \
              '(^|[[:space:]])(warning|error):' \
              "$ARTIFACT_DIR/full-build.log" \
              > "$ARTIFACT_DIR/FAILURE-warning-error-lines.txt" \
              || true
          fi

          if [ -f "$ARTIFACT_DIR/repro-b-full-build.log" ]; then
            tail -n 1500 \
              "$ARTIFACT_DIR/repro-b-full-build.log" \
              > "$ARTIFACT_DIR/FAILURE-repro-b-full-build-tail.txt"

            grep -Ei \
              '(^|[[:space:]])(warning|error):' \
              "$ARTIFACT_DIR/repro-b-full-build.log" \
              > "$ARTIFACT_DIR/FAILURE-repro-b-warning-error-lines.txt" \
              || true
          fi

          SNAPSHOT="$REPRO_A_SNAPSHOT"

          if [ -s "$SNAPSHOT/final.config" ]; then
            cp \
              "$SNAPSHOT/final.config" \
              "$ARTIFACT_DIR/failure-output/build-a-final.config"
