      CUMULATIVE_NEW_DEFCONFIG_INDEX: "index c8b4616de807..78e35057b154 100644"

      EXPECTED_CUMULATIVE_CONFIG_SHA256: "d7cd955abd59da45804acc9c5e450cf8fc953da3e66bbc274212b40ee9a0b372"

