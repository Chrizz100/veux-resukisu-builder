      EXPECTED_KNOWN_SUSFS_DIFFCHECK_LINE_COUNT: "15"
      EXPECTED_KNOWN_SUSFS_WHITESPACE_ISSUE_COUNT: "8"

      EXPECTED_VEUX_DTB_SHA256: "42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37"
      EXPECTED_VEUX_DTB_BYTES: "275689"

      CLANG_PREBUILT_COMMIT: "aa2e4a514a6c85eebcc4a27149eaf9244e951a1e"

      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      PATCH_DIR: ${{ github.workspace }}/reference-patches
      OUT_DIR: out-repro
      REPRO_A_SNAPSHOT: ${{ github.workspace }}/repro-snapshots/veux-46c9-build-a
