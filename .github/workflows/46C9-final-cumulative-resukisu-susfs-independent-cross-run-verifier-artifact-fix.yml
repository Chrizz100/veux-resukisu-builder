      # Intentionally retained from 46C7 because this value is embedded in compile metadata.
      KBUILD_BUILD_HOST: "veux-46c7"
      KBUILD_BUILD_TIMESTAMP: "Thu Aug 20 00:00:00 UTC 2026"
      KBUILD_BUILD_VERSION: "1"
      SOURCE_DATE_EPOCH: "1787184000"

      # Deterministic Git metadata for every merge/revert/commit created here.
      GIT_AUTHOR_DATE: "2026-08-20T00:00:00Z"
      GIT_COMMITTER_DATE: "2026-08-20T00:00:00Z"
      TZ: "UTC"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"

      # Hard-pinned from the independently downloaded and verified 46C7 artifact.
      EXPECTED_46C7_REFERENCE_MANIFEST_SHA256: "e825a8063f6e9ffee21757a0c1088e786d70ab7eab59059722aa2c7cebdb6d23"
      EXPECTED_46C7_REFERENCE_MANIFEST_BYTES: "1816"
      EXPECTED_46C7_ARTIFACT_ZIP_SHA256: "cdadf5717af536951d75ae642ab942a42cf77920a37c5904cabd1c1f3e03dfe3"
      EXPECTED_46C7_CANDIDATE_COMMIT_SHA: "236445945af5ba259a76f2ab3de001708063eb70"
      EXPECTED_46C7_CUMULATIVE_COMMIT_SHA: "4b67123308cc084853ee6cced988ed00d7e254f3"
      EXPECTED_46C7_KERNEL_RELEASE: "5.4.274~positron/4b671233"
      EXPECTED_46C7_IMAGE_BYTES: "29843968"
      EXPECTED_46C7_IMAGE_SHA256: "41d79cc66653ac75c390eb21c23029d921f9a0a2ef683c5d65a0edbb745bbce1"
      EXPECTED_46C7_VEUX_DTB_BYTES: "275689"
      EXPECTED_46C7_VEUX_DTB_SHA256: "42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37"
      EXPECTED_46C7_VMLINUX_BYTES: "635526504"
      EXPECTED_46C7_VMLINUX_SHA256: "d524aad261f322f1c5c942e2e3fc130b948344731cdc5de1340dfde11f699f7c"
      EXPECTED_46C7_SYSTEM_MAP_BYTES: "3997443"
      EXPECTED_46C7_SYSTEM_MAP_SHA256: "c801d850739b5a20bb0eb717c85cae0e345046fb58f79c9a82c10549c417d21e"
      EXPECTED_46C7_CONFIG_BYTES: "157405"
      EXPECTED_46C7_CONFIG_SHA256: "d7cd955abd59da45804acc9c5e450cf8fc953da3e66bbc274212b40ee9a0b372"
      EXPECTED_46C7_COMPILE_H_BYTES: "533"
      EXPECTED_46C7_COMPILE_H_SHA256: "5104ece9bbe7943591d0f600903c5ef00813313af089cc63a67905a6e6059d72"

    steps:
      - name: Prepare full build audit
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$TOOLCHAIN_DIR" \
            "$PATCH_DIR" \
            "$ARTIFACT_DIR"

          cat > "$ARTIFACT_DIR/PLAN.txt" <<'EOF'
          VEUX 5.4.274 Final Cumulative ReSukiSU + SUSFS Reproducibility Build
          =========================================================

          This is 46C9, the artifact-path-corrected independent GitHub-run verifier for the deterministic reference produced by 46C7.

          The workflow is deliberately standalone:
          - no old YAML is edited
          - no run block is extracted from older workflows
          - no old workflow structure is executed dynamically
          - every source correction is written directly in this file
          - every critical identity is guarded by SHA/tree/config checks

          Cumulative kernel corrections reproduced here:
          - CPUFreq scaling_min_freq no-op removed
          - CPUFreq scaling_max_freq below-min clamp removed
          - standard CPUFreq QoS sysfs behavior restored
          - Xiaomi idle/sleep policy restored
          - schedutil 20% lower-step heuristic removed
          - normal schedutil FREQUENCY_UTIL UClamp behavior restored
          - custom HZ100 removed; resolved HZ250 required
          - standard load-balance capacity rate limit restored
          - CASS max-frequency/thermal capacity handling restored
          - SPRD rotation disabled
          - CONFIG_CPUSETS restored
          - exact Xiaomi VEUX PELT8 restored

          ReSukiSU:
          - build pin: faccf4c5edc7be37776216e7d43dd3dca0239331
          - audit head: 06390a6acbb7e966b3e1cda00fc1b93e89f11086
          - expected post-pin commits: 10
          - kernel/ delta between pin and audit head must be empty

          SUSFS:
          - exact approved v2.2 5.4 backport
          - exact cumulative warning-clean VEUX adaptation
          - OPEN_REDIRECT SRCU/UAF fixed semantics must already be present
          - /proc/*/maps output-pointer/SRCU handling must already be present
          - no duplicate upstream fix is applied

          Hard gates:
          - Candidate tree
          - cumulative pre-SUSFS tree
          - cumulative SUSFS adaptation hash/bytes
          - final cumulative config hash before and after build
          - exact known inherited SUSFS whitespace diagnostic
          - no reject/orig files
          - compiler errors = 0
          - ReSukiSU/SUSFS/adaptation warnings = 0
          - CPUFreq core warnings = 0
          - idle source warnings = 0
          - total warning count is measured, not hard-coded
          - 11 ReSukiSU/SUSFS linked symbols
          - CASS and CPUSET linked state
          - no SPRD rotation or lpm_sleep_disabled linked symbol
          - exact VEUX DTB bytes/hash

          Reproducibility policy:
          - GitHub runner is pinned to ubuntu-22.04 for this independent 46C9 verification
          - build A and build B use the exact same O= output path
          - the output tree is deleted completely between build A and build B
          - fixed KBUILD build user, host, timestamp and build version
          - fixed SOURCE_DATE_EPOCH
          - Image must be byte-identical A/B
          - veux.dtb must be byte-identical A/B
          - System.map must be byte-identical A/B
          - vmlinux must be byte-identical A/B
          - resolved .config must be byte-identical A/B
          - generated compile metadata must be byte-identical A/B
          - warning profile must be identical A/B
          - no 46C2 Image hash is hard-coded
          - every workflow-created Git commit uses the same fixed author/committer date as 46C7
          - the complete 46C7 reference manifest SHA-256 is hard-pinned
          - deterministic Candidate/Cumulative commit IDs, kernelrelease and output hashes are hard-pinned
          - current 46C9 outputs must reproduce every pinned 46C7 value exactly
          - KBUILD_BUILD_HOST intentionally remains "veux-46c7" because it is embedded in the reference bytes

          Outputs:
          - byte-identical Image/veux.dtb/System.map from the same-path rebuild
          - final config
          - A/B same-path reproducibility hashes and comparisons
          - hashes, logs, diffs and symbol evidence
          - build A vmlinux is snapshotted temporarily outside the output tree for comparison
          - build B vmlinux is audited in the rebuilt output tree; hashes are recorded

          No boot.img.
          No flashable ZIP.
          No device access.
          No flashing.
          EOF

      - name: Install dependencies robustly
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail

          for FILE in \
            /etc/apt/apt-mirrors.txt \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/ubuntu.sources
          do
            if [ -f "$FILE" ]; then
              sudo sed -i \
                's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
                "$FILE"
            fi
          done

          sudo timeout 600 \
            apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update

          sudo timeout 600 \
            apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends \
              bc \
              bison \
              build-essential \
              ca-certificates \
              cpio \
              curl \
              flex \
              git \
              libelf-dev \
              libncurses-dev \
              libssl-dev \
              patch \
              python3 \
              python-is-python3 \
              rsync \
              xz-utils \
              zstd

          {
            echo "APT_MIRROR_GUARD=PASS"
            echo "DEPENDENCIES=PASS"
          } | tee "$ARTIFACT_DIR/DEPENDENCY-STATE.txt"

      - name: Install exact Android clang-r416183b
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 300 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz" \
            -o "${RUNNER_TEMP}/clang-r416183b.tar.gz"

          tar \
            -xzf "${RUNNER_TEMP}/clang-r416183b.tar.gz" \
            -C "$TOOLCHAIN_DIR"

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

          "$TOOLCHAIN_DIR/bin/clang" --version \
            | tee "$ARTIFACT_DIR/clang-version.txt"

          "$TOOLCHAIN_DIR/bin/ld.lld" --version \
            | tee -a "$ARTIFACT_DIR/clang-version.txt"

          if ! "$TOOLCHAIN_DIR/bin/clang" --version \
            | grep -q 'r416183b'
          then
            echo "ERROR: expected clang-r416183b"
            exit 1
          fi

          for TOOL in \
            clang \
            ld.lld \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-size \
            llvm-strip
          do
            if [ ! -x "$TOOLCHAIN_DIR/bin/$TOOL" ]; then
              echo "ERROR: missing toolchain binary: $TOOL"
              exit 1
            fi
          done

          echo "CLANG_R416183B=PASS" \
            | tee "$ARTIFACT_DIR/TOOLCHAIN-STATE.txt"

      - name: Checkout exact VEUX source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: "20240619"
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Recreate exact Candidate 2
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          BASE_SHA="$(git rev-parse HEAD)"
          BASE_TREE="$(git rev-parse HEAD^{tree})"

          git remote remove android-common 2>/dev/null || true
          git remote add android-common \
            https://android.googlesource.com/kernel/common

          git fetch \
            --no-tags \
            android-common \
            "$COMMON_REF"

          COMMON_SHA="$(git rev-parse FETCH_HEAD)"

          git update-ref \
            refs/remotes/android-common/audit-base \
            "$COMMON_SHA"

          git merge \
            --no-edit \
            "$COMMON_SHA"

          MERGED_SHA="$(git rev-parse HEAD)"
          MERGED_TREE="$(git rev-parse HEAD^{tree})"

          git cat-file -e \
            "${STABILITY_REVERT}^{commit}"

          git revert \
            --no-edit \
            "$STABILITY_REVERT"

          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"
          KERNEL_VERSION="$(make -s kernelversion)"

          if [ "$KERNEL_VERSION" != "5.4.274" ]; then
            echo "ERROR: expected Linux 5.4.274"
            echo "Actual: $KERNEL_VERSION"
            exit 1
          fi

          if [ "$CANDIDATE_TREE" != "$EXPECTED_CANDIDATE_TREE" ]; then
            echo "ERROR: Candidate 2 tree mismatch"
            echo "Expected: $EXPECTED_CANDIDATE_TREE"
            echo "Actual:   $CANDIDATE_TREE"
            exit 1
          fi

          echo "CANDIDATE_TIP=$CANDIDATE_SHA" \
            >> "$GITHUB_ENV"

          echo "COMMON_SHA=$COMMON_SHA" \
            >> "$GITHUB_ENV"

          {
            echo "BASE_SHA=$BASE_SHA"
            echo "BASE_TREE=$BASE_TREE"
            echo "COMMON_SHA=$COMMON_SHA"
            echo "MERGED_SHA=$MERGED_SHA"
            echo "MERGED_TREE=$MERGED_TREE"
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "CANDIDATE_TREE=$CANDIDATE_TREE"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "GIT_AUTHOR_DATE=$GIT_AUTHOR_DATE"
            echo "GIT_COMMITTER_DATE=$GIT_COMMITTER_DATE"
            echo "DETERMINISTIC_GIT_METADATA=YES"
          } | tee "$ARTIFACT_DIR/CANDIDATE-IDENTITY.txt"

      - name: Fetch official Xiaomi VEUX reference
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git remote remove xiaomi 2>/dev/null || true

          git remote add \
            xiaomi \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git

          git fetch \
            --no-tags \
            xiaomi \
            "+refs/heads/${STOCK_REF}:refs/remotes/xiaomi/${STOCK_REF}"

          STOCK_SHA="$(git rev-parse "xiaomi/${STOCK_REF}")"

          {
            echo "STOCK_REF=$STOCK_REF"
            echo "STOCK_SHA=$STOCK_SHA"
          } | tee "$ARTIFACT_DIR/XIAOMI-REFERENCE.txt"

      - name: Restore Xiaomi idle sleep policy
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          for COMMIT in \
            "$IDLE_SCREEN_COMMIT" \
            "$IDLE_EXPOSE_COMMIT" \
            "$IDLE_NOTIFIER_COMMIT" \
            "$IDLE_OPTIMIZE_COMMIT"
          do
            git cat-file -e \
              "${COMMIT}^{commit}"

            if ! git merge-base \
              --is-ancestor \
              "$COMMIT" \
              "$CANDIDATE_TIP"
            then
              echo "ERROR: idle commit is not Candidate ancestor"
              echo "COMMIT=$COMMIT"
              exit 1
            fi
          done

          git revert \
            --no-edit \
            "$IDLE_OPTIMIZE_COMMIT"

          git revert \
            --no-edit \
            "$IDLE_NOTIFIER_COMMIT"

          git revert \
            --no-edit \
            "$IDLE_EXPOSE_COMMIT"

          git revert \
            --no-edit \
            "$IDLE_SCREEN_COMMIT"

          RESTORED_TIP="$(git rev-parse HEAD)"

          git diff \
            --no-ext-diff \
            --no-color \
            "$CANDIDATE_TIP" \
            "$RESTORED_TIP" \
            -- \
            drivers/cpuidle/cpuidle.c \
            drivers/cpuidle/lpm-levels.c \
            include/linux/cpuidle.h \
            > "$ARTIFACT_DIR/IDLE-SLEEP-RESTORE.diff"

          IDLE_DIFF_SHA="$(
            sha256sum \
              "$ARTIFACT_DIR/IDLE-SLEEP-RESTORE.diff" \
              | awk '{print $1}'
          )"

          if [ "$IDLE_DIFF_SHA" != "$EXPECTED_IDLE_RESTORE_DIFF_SHA256" ]; then
            echo "ERROR: idle restore diff mismatch"
            echo "Expected: $EXPECTED_IDLE_RESTORE_DIFF_SHA256"
            echo "Actual:   $IDLE_DIFF_SHA"
            exit 1
          fi

          LPM_SHA="$(
            sha256sum drivers/cpuidle/lpm-levels.c \
              | awk '{print $1}'
          )"

          CORE_SHA="$(
            sha256sum drivers/cpuidle/cpuidle.c \
              | awk '{print $1}'
          )"

          HEADER_SHA="$(
            sha256sum include/linux/cpuidle.h \
              | awk '{print $1}'
          )"

          [ "$LPM_SHA" = "$EXPECTED_LPM_AFTER_SHA256" ]
          [ "$CORE_SHA" = "$EXPECTED_CPUIDLE_CORE_AFTER_SHA256" ]
          [ "$HEADER_SHA" = "$EXPECTED_CPUIDLE_HEADER_AFTER_SHA256" ]

          {
            echo "IDLE_FEATURE_CHAIN_REVERSED=YES"
            echo "IDLE_RESTORE_DIFF_SHA256=$IDLE_DIFF_SHA"
            echo "LPM_AFTER_SHA256=$LPM_SHA"
            echo "CPUIDLE_CORE_AFTER_SHA256=$CORE_SHA"
            echo "CPUIDLE_HEADER_AFTER_SHA256=$HEADER_SHA"
          } | tee "$ARTIFACT_DIR/IDLE-RESTORE-STATE.txt"

      - name: Verify exact active CPUFreq lineage
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          for COMMIT in \
            "$CPUFREQ_MIN_COMMIT" \
            "$CPUFREQ_MAX_COMMIT"
          do
            git cat-file -e \
              "${COMMIT}^{commit}"

            if ! git merge-base \
              --is-ancestor \
              "$COMMIT" \
              "$CANDIDATE_TIP"
            then
              echo "ERROR: CPUFreq commit is not Candidate ancestor"
              echo "COMMIT=$COMMIT"
              exit 1
            fi
          done

          MAX_PARENT="$(
            git rev-parse \
              "${CPUFREQ_MAX_COMMIT}^"
          )"

          if [ "$MAX_PARENT" != "$CPUFREQ_MIN_COMMIT" ]; then
            echo "ERROR: max-clamp commit parent is not min-noop commit"
            echo "Expected: $CPUFREQ_MIN_COMMIT"
            echo "Actual:   $MAX_PARENT"
            exit 1
          fi

          {
            echo "CPUFREQ_MIN_COMMIT=$CPUFREQ_MIN_COMMIT"
            echo "CPUFREQ_MAX_COMMIT=$CPUFREQ_MAX_COMMIT"
            echo "CPUFREQ_MIN_COMMIT_ANCESTOR=YES"
            echo "CPUFREQ_MAX_COMMIT_ANCESTOR=YES"
            echo "CPUFREQ_MAX_PARENT_EQUALS_MIN_COMMIT=YES"
          } | tee "$ARTIFACT_DIR/CPUFREQ-LINEAGE.txt"

      - name: Restore standard CPUFreq min max sysfs behavior
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="drivers/cpufreq/cpufreq.c"

          BEFORE_SHA="$(
            sha256sum "$SOURCE" \
              | awk '{print $1}'
          )"

          if [ "$BEFORE_SHA" != "$EXPECTED_CPUFREQ_BEFORE_SHA256" ]; then
            echo "ERROR: Candidate cpufreq.c baseline mismatch"
            echo "Expected: $EXPECTED_CPUFREQ_BEFORE_SHA256"
            echo "Actual:   $BEFORE_SHA"
            exit 1
          fi

          python3 - <<'PY'
          import difflib
          import hashlib
          import os
          from pathlib import Path

          source = Path(
              "drivers/cpufreq/cpufreq.c"
          )

          text = source.read_text(
              encoding="utf-8"
          )

          start_marker = (
              "#define store_one(file_name, object)"
          )

          end_marker = (
              "store_one(scaling_max_freq, max);"
          )

          start = text.find(start_marker)

          if start < 0:
              raise SystemExit(
                  "ERROR: store_one macro start missing"
              )

          end = text.find(
              end_marker,
              start,
          )

          if end < 0:
              raise SystemExit(
                  "ERROR: store_one macro end missing"
              )

          end += len(end_marker)

          candidate_macro = text[start:end]

          if end < len(text) and text[end] == "\n":
              candidate_macro += "\n"

          expected_before = os.environ[
              "EXPECTED_STORE_ONE_BEFORE_SHA256"
          ]

          macro_sha = hashlib.sha256(
              candidate_macro.encode("utf-8")
          ).hexdigest()

          if macro_sha != expected_before:
              raise SystemExit(
                  "ERROR: Candidate store_one hash mismatch\n"
                  f"Expected: {expected_before}\n"
                  f"Actual:   {macro_sha}"
              )

          lines = candidate_macro.splitlines(
              keepends=True
          )

          def unique_line(token):
              matches = [
                  i
                  for i, line in enumerate(lines)
                  if token in line
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      f"ERROR: expected one match for {token}, "
                      f"got {len(matches)}"
                  )

              return matches[0]

          min_condition = unique_line(
              "if (&policy->object == &policy->min)"
          )

          parse_line = unique_line(
              'ret = sscanf(buf, "%lu", &val);'
          )

          max_condition = unique_line(
              "if (&policy->object == &policy->max)"
          )

          qos_line = unique_line(
              "freq_qos_update_request("
          )

          if not (
              min_condition
              < parse_line
              < max_condition
              < qos_line
          ):
              raise SystemExit(
                  "ERROR: unexpected Candidate store_one ordering"
              )

          min_block = "".join(
              lines[
                  min_condition:
                  parse_line
              ]
          )

          max_block = "".join(
              lines[
                  max_condition:
                  qos_line
              ]
          )

          if "return count;" not in min_block:
              raise SystemExit(
                  "ERROR: scaling_min_freq no-op return missing"
              )

          if "if (val < policy->min)" not in max_block:
              raise SystemExit(
                  "ERROR: scaling_max_freq below-min test missing"
              )

          if "val = policy->min;" not in max_block:
              raise SystemExit(
                  "ERROR: scaling_max_freq clamp assignment missing"
              )

          sanitized_lines = (
              lines[:min_condition]
              + lines[parse_line:max_condition]
              + lines[qos_line:]
          )

          sanitized_macro = "".join(
              sanitized_lines
          )

          expected_after = os.environ[
              "EXPECTED_STORE_ONE_AFTER_SHA256"
          ]

          sanitized_sha = hashlib.sha256(
              sanitized_macro.encode("utf-8")
          ).hexdigest()

          if sanitized_sha != expected_after:
              raise SystemExit(
                  "ERROR: sanitized store_one hash mismatch\n"
                  f"Expected: {expected_after}\n"
                  f"Actual:   {sanitized_sha}"
              )

          diff = "".join(
              difflib.unified_diff(
                  candidate_macro.splitlines(
                      keepends=True
                  ),
                  sanitized_macro.splitlines(
                      keepends=True
                  ),
                  fromfile="candidate-store-one.c",
                  tofile="candidate-store-one-sanitized.c",
              )
          )

          diff_sha = hashlib.sha256(
              diff.encode("utf-8")
          ).hexdigest()

          expected_diff = os.environ[
              "EXPECTED_CPUFREQ_TARGETED_DIFF_SHA256"
          ]

          if diff_sha != expected_diff:
              raise SystemExit(
                  "ERROR: targeted CPUFreq diff hash mismatch\n"
                  f"Expected: {expected_diff}\n"
                  f"Actual:   {diff_sha}"
              )

          corrected = (
              text[:start]
              + sanitized_macro
              + text[
                  start + len(candidate_macro):
              ]
          )

          corrected_sha = hashlib.sha256(
              corrected.encode("utf-8")
          ).hexdigest()

          expected_full = os.environ[
              "EXPECTED_CPUFREQ_AFTER_SHA256"
          ]

          if corrected_sha != expected_full:
              raise SystemExit(
                  "ERROR: corrected cpufreq.c hash mismatch\n"
                  f"Expected: {expected_full}\n"
                  f"Actual:   {corrected_sha}"
              )

          source.write_text(
              corrected,
              encoding="utf-8"
          )

          out = Path(
              os.environ["ARTIFACT_DIR"]
          )

          (
              out /
              "CPUFREQ-TARGETED-CORRECTION.diff"
          ).write_text(
              diff,
              encoding="utf-8"
          )

          (
              out /
              "CPUFREQ-MIN-NOOP-BLOCK.c"
          ).write_text(
              min_block,
              encoding="utf-8"
          )

          (
              out /
              "CPUFREQ-MAX-CLAMP-BLOCK.c"
          ).write_text(
              max_block,
              encoding="utf-8"
          )

          (
              out /
              "CPUFREQ-STORE-ONE-AFTER.c"
          ).write_text(
              sanitized_macro,
              encoding="utf-8"
          )
          PY

          AFTER_SHA="$(
            sha256sum "$SOURCE" \
              | awk '{print $1}'
          )"

          if [ "$AFTER_SHA" != "$EXPECTED_CPUFREQ_AFTER_SHA256" ]; then
            echo "ERROR: final corrected cpufreq.c hash mismatch"
            exit 1
          fi

          if grep -qF \
            'if (&policy->object == &policy->min)' \
            "$ARTIFACT_DIR/CPUFREQ-STORE-ONE-AFTER.c"
          then
            echo "ERROR: scaling_min_freq no-op remains"
            exit 1
          fi

          if grep -qF \
            'if (&policy->object == &policy->max)' \
            "$ARTIFACT_DIR/CPUFREQ-STORE-ONE-AFTER.c"
          then
            echo "ERROR: scaling_max_freq special-case remains"
            exit 1
          fi

          if grep -qF \
            'val = policy->min;' \
            "$ARTIFACT_DIR/CPUFREQ-STORE-ONE-AFTER.c"
          then
            echo "ERROR: scaling_max_freq clamp remains"
            exit 1
          fi

          grep -qF \
            'ret = sscanf(buf, "%lu", &val);' \
            "$ARTIFACT_DIR/CPUFREQ-STORE-ONE-AFTER.c"

          grep -qF \
            'freq_qos_update_request(policy->object##_freq_req, val);' \
            "$ARTIFACT_DIR/CPUFREQ-STORE-ONE-AFTER.c"

          {
            echo "CPUFREQ_BEFORE_SHA256=$BEFORE_SHA"
            echo "CPUFREQ_AFTER_SHA256=$AFTER_SHA"
            echo "STORE_ONE_BEFORE_SHA256=$EXPECTED_STORE_ONE_BEFORE_SHA256"
            echo "STORE_ONE_AFTER_SHA256=$EXPECTED_STORE_ONE_AFTER_SHA256"
            echo "TARGETED_DIFF_SHA256=$EXPECTED_CPUFREQ_TARGETED_DIFF_SHA256"
            echo "SCALING_MIN_WRITE_NOOP_REMOVED=YES"
            echo "SCALING_MAX_BELOW_MIN_CLAMP_REMOVED=YES"
            echo "STANDARD_CPUFREQ_QOS_WRITE_RESTORED=YES"
