name: 02 - Find exact VEUX 5.4.274 source

on:
  workflow_dispatch:

jobs:
  find-source:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout VEUX history
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: 20240819
          fetch-depth: 0
          path: kernel

      - name: Find last complete VEUX 5.4.274 commit
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          START=73abf253d5caf9cc3b8e20450e222c919ecbbfa6
          END=20240819
          TMPFILE="$RUNNER_TEMP/kernel_makefile"

          read_kver() {
            git show "$1:Makefile" > "$TMPFILE"

            VERSION=$(awk '$1=="VERSION" && $2=="=" {print $3; exit}' "$TMPFILE")
            PATCHLEVEL=$(awk '$1=="PATCHLEVEL" && $2=="=" {print $3; exit}' "$TMPFILE")
            SUBLEVEL=$(awk '$1=="SUBLEVEL" && $2=="=" {print $3; exit}' "$TMPFILE")

            printf '%s.%s.%s\n' "$VERSION" "$PATCHLEVEL" "$SUBLEVEL"
          }

          echo "Checking ancestry..."

          if ! git merge-base --is-ancestor "$START" "$END"; then
            echo "ERROR: 5.4.274 base is not an ancestor of $END"
            exit 2
          fi

          echo "START:"
          echo "$START"
          echo "Version: $(read_kver "$START")"
          echo

          BUMP=""

          echo "Searching only commits that changed Makefile..."

          while IFS= read -r COMMIT; do
            KVER=$(read_kver "$COMMIT")
            echo "$COMMIT -> $KVER"

            if [ "$KVER" != "5.4.274" ]; then
              BUMP="$COMMIT"
              break
            fi
          done < <(
            git rev-list \
              --first-parent \
              --reverse \
              "$START..$END" \
              -- Makefile
          )

          if [ -n "$BUMP" ]; then
            CANDIDATE=$(git rev-parse "$BUMP^1")
            echo
            echo "First version after 5.4.274:"
            echo "$BUMP"
          else
            CANDIDATE=$(git rev-parse "$END")
          fi

          KVER=$(read_kver "$CANDIDATE")

          echo
          echo "Candidate:"
          echo "$CANDIDATE"
          echo "Version: $KVER"

          if [ "$KVER" != "5.4.274" ]; then
            echo "ERROR: Candidate is not Linux 5.4.274"
            exit 3
          fi

          VEUX_DTS="arch/arm64/boot/dts/vendor/xiaomi/veux.dts"
          VEUX_DEFCONFIG="arch/arm64/configs/veux_defconfig"

          echo
          echo "Checking VEUX device files..."

          git cat-file -e "$CANDIDATE:$VEUX_DTS" || {
            echo "ERROR: veux.dts missing"
            exit 4
          }

          git cat-file -e "$CANDIDATE:$VEUX_DEFCONFIG" || {
            echo "ERROR: veux_defconfig missing"
            exit 5
          }

          echo
          echo "=========================================="
          echo "FOUND COMPLETE VEUX 5.4.274 SOURCE"
          echo "=========================================="
          echo
          echo "COMMIT=$CANDIDATE"
          echo "VERSION=$KVER"
          echo
          git show -s --format='Date: %ci%nSubject: %s' "$CANDIDATE"

          {
            echo "## Complete VEUX 5.4.274 source"
            echo
            echo "**Commit:** \`$CANDIDATE\`"
            echo
            echo "**Kernel:** \`$KVER\`"
            echo
            echo "- ✅ veux.dts"
            echo "- ✅ veux_defconfig"
          } >> "$GITHUB_STEP_SUMMARY"
