        do
          grep -Eq "[[:space:]]${sym}$" "$map"
        done

        : > "$GITHUB_WORKSPACE/evidence/13-UNEXPECTED-FEATURE-SYMBOLS.txt"
        for sym in \
          susfs_add_sus_path \
          susfs_add_sus_kstat \
          susfs_update_sus_kstat \
          susfs_set_hide_sus_mnts_for_non_su_procs \
          susfs_add_open_redirect \
          susfs_add_sus_map
        do
          if grep -Eq "[[:space:]]${sym}$" "$map"; then
            echo "$sym" >> "$GITHUB_WORKSPACE/evidence/13-UNEXPECTED-FEATURE-SYMBOLS.txt"
          fi
        done
        test ! -s "$GITHUB_WORKSPACE/evidence/13-UNEXPECTED-FEATURE-SYMBOLS.txt"

        grep -Fq 'susfs_clear_current_proc_umounted();' KernelSU/kernel/core_hook.c
        grep -Fq 'susfs_set_current_proc_umounted();' KernelSU/kernel/core_hook.c

        sha256sum \
          fs/stat.c \
          fs/open.c \
          fs/susfs.c \
          kernel/sys.c \
          fs/proc/cmdline.c \
          KernelSU/kernel/sucompat.c \
          KernelSU/kernel/Kconfig \
          > "$RUNNER_TEMP/p5v6-protected-source-linked.sha256"

        cmp "$RUNNER_TEMP/p5v5-protected-source.sha256" \
            "$RUNNER_TEMP/p5v6-protected-source-linked.sha256"

        {
          echo "P5_V5_SPOOF_UNAME_LINKED=YES"
          echo "P5_V5_SPOOF_CMDLINE_LINKED=YES"
          echo "P5_V6_TIF_PROC_UMOUNTED_SOURCE_BRIDGE=YES"
          echo "P5_V6_TIF_PROC_UMOUNTED_BIT=33"
          echo "P5_V6_TIF_PROC_NO_SU_BIT=34"
          echo "P5_V6_TIF_ZYGOTE_NEXT_BIT=35"
          echo "P5_V6_ROOT_ONLY_DISPATCH_UNCHANGED=YES"
          echo "P5_V6_DISPATCH_COMMAND_COUNT=5"
          echo "P5_V6_ACTIVE_SUBOPTION_COUNT=2"
          echo "P4_STAT_FACCESSAT_BRIDGE_PRESERVED=YES"
          echo "SUS_PATH_ACTIVE=NO"
          echo "SUS_MOUNT_ACTIVE=NO"
          echo "SUS_KSTAT_ACTIVE=NO"
          echo "OPEN_REDIRECT_ACTIVE=NO"
          echo "SUS_MAP_ACTIVE=NO"
          echo "PROC_MAPS_ACTIVE=NO"
          echo "P5_V6_LINKED_BOUNDARY=PASS"
        } > "$GITHUB_WORKSPACE/evidence/13-P5V6-LINKED-BOUNDARY.txt"
    - name: 21 - Create and replay-check P5-v6 restore kit
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V6_RESTORE_KIT" > evidence/STAGE.txt
        cd kernel

        cp "$RUNNER_TEMP/p5v5-to-p5v6-kernelsu-core-hook.patch" \
          "$GITHUB_WORKSPACE/restore-kit/p5v5-to-p5v6-kernelsu-umounted-process-state.patch"

        cp "$GITHUB_WORKSPACE/p5v5-artifact/restore-kit/manifest.json" \
          "$GITHUB_WORKSPACE/restore-kit/PARENT-P5-V5-MANIFEST.json"

        cp "$GITHUB_WORKSPACE/evidence/13-P5V6-LINKED-BOUNDARY.txt" \
          "$GITHUB_WORKSPACE/restore-kit/P5V6-LINKED-BOUNDARY.txt"

        tmp="$RUNNER_TEMP/p5v6-replay"
        rm -rf "$tmp"
        mkdir -p "$tmp/kernel"
        cp "$RUNNER_TEMP/p5v5-parent/ksu/core_hook.c" "$tmp/kernel/core_hook.c"

        (
          cd "$tmp"
          patch -p1 --dry-run \
            < "$GITHUB_WORKSPACE/restore-kit/p5v5-to-p5v6-kernelsu-umounted-process-state.patch"
          patch -p1 \
            < "$GITHUB_WORKSPACE/restore-kit/p5v5-to-p5v6-kernelsu-umounted-process-state.patch"
        )

        cmp "$tmp/kernel/core_hook.c" KernelSU/kernel/core_hook.c

        image_sha="$(sha256sum out-p5/arch/arm64/boot/Image | awk '{print $1}')"
        dtb_sha="$(sha256sum out-p5/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb | awk '{print $1}')"
        config_sha="$(sha256sum out-p5/.config | awk '{print $1}')"

        python3 - <<PY
        import json
        from pathlib import Path

        m = {
            "stage": "KSU-GEN1-P5-v6",
            "device": "VEUX",
            "kernel_version": "$TARGET_VERSION",
            "parent_p5_v5_pass_run_id": "$P5_V5_PASS_RUN_ID",
            "parent_p5_v5_backup_tag": "$P5_V5_PARENT_BACKUP_TAG",
            "kernelsu_head": "$KSU_COMMIT",
            "kernelsu_version": int("$KSU_EXPECTED_VERSION"),
            "susfs_source_head": "$SUSFS_SOURCE_COMMIT",
            "susfs_version": "$SUSFS_EXPECTED_VERSION",
            "config_ksu_susfs": True,
            "config_ksu_susfs_spoof_uname": True,
            "config_ksu_susfs_spoof_cmdline_or_bootconfig": True,
            "susfs_feature_suboptions_enabled": 2,
            "enabled_susfs_suboptions": [
                "KSU_SUSFS_SPOOF_UNAME",
                "KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG"
            ],
            "root_only_user_command_dispatch": True,
            "dispatch_command_count": 5,
            "tif_proc_umounted_bridge_integrated": True,
            "tif_proc_umounted_bit": 33,
            "tif_proc_no_su_bit": 34,
            "tif_proc_umounted_for_zygote_next_bit": 35,
            "tif_proc_no_su_bridge_integrated": False,
            "zygote_next_bridge_integrated": False,
            "p4_stat_faccessat_bridge_preserved": True,
            "p5_v5_outer_source_preserved": True,
            "p5_v5_kconfig_preserved": True,
            "raw_user_pointer_reinterpret_cast": False,
            "sus_path_active": False,
            "sus_mount_active": False,
            "sus_kstat_active": False,
            "open_redirect_active": False,
            "sus_map_active": False,
            "proc_maps_changed": False,
            "namei_changed": False,
            "namespace_changed": False,
            "resukisu_integrated": False,
            "kernel_build_performed": True,
            "image_sha256": "$image_sha",
            "veux_dtb_sha256": "$dtb_sha",
            "config_sha256": "$config_sha",
            "boot_image_created": False,
            "device_accessed": False,
            "flashing_performed": False,
            "auto_github_backup_required_after_pass": True,
            "next_if_pass_and_backup_pass": "P5 controlled SUS_KSTAT foundation"
        }

        Path("$GITHUB_WORKSPACE/restore-kit/manifest.json").write_text(
            json.dumps(m, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        PY

        cat > "$GITHUB_WORKSPACE/restore-kit/RESTORE-INSTRUCTIONS.txt" <<EOF
        KSU GEN1 P5-v6 recovery

        Permanent parent backup:
          $P5_V5_PARENT_BACKUP_TAG

        Parent PASS run:
          $P5_V5_PASS_RUN_ID

        Restore:
        1. Restore exact P5-v5 from the permanent GitHub recovery release.
        2. Inside KernelSU apply:
           p5v5-to-p5v6-kernelsu-umounted-process-state.patch
        3. Keep exactly these active SUSFS suboptions:
           CONFIG_KSU_SUSFS_SPOOF_UNAME=y
           CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        4. Do not enable SUS_PATH, SUS_MOUNT, SUS_KSTAT, OPEN_REDIRECT or SUS_MAP.

        P5-v6 adds only the TIF_PROC_UMOUNTED process-state bridge in
        KernelSU/kernel/core_hook.c. It does not add a new SUSFS subfeature.

        This checkpoint proves source/object/full-kernel build and link gates.
        It does not prove real-device boot or runtime behavior.
        EOF

        {
          echo "PARENT_P5_V5_RUN=$P5_V5_PASS_RUN_ID"
          echo "PARENT_P5_V5_BACKUP_TAG=$P5_V5_PARENT_BACKUP_TAG"
          echo "P5_V6_IMAGE_SHA256=$image_sha"
          echo "P5_V6_DTB_SHA256=$dtb_sha"
          echo "P5_V6_CONFIG_SHA256=$config_sha"
          echo "P5_V6_TIF_PROC_UMOUNTED_BRIDGE=PASS"
          echo "P5_V6_RESTORE_KIT=PASS"
        } > "$GITHUB_WORKSPACE/evidence/14-P5V6-PROVENANCE.txt"
    - name: 22 - Close P5-v6 technical status
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p evidence
        echo "STAGE=FINAL_STATUS" > evidence/STAGE.txt

        if grep -Fxq 'P5_V6_RESTORE_KIT=PASS' evidence/14-P5V6-PROVENANCE.txt 2>/dev/null \
          && grep -Fxq 'P5_V6_LINKED_BOUNDARY=PASS' evidence/13-P5V6-LINKED-BOUNDARY.txt 2>/dev/null \
          && grep -Fxq 'P5_V6_IMAGE_DTBS_BUILD=PASS' evidence/12-P5V6-BUILD-IDENTITY.txt 2>/dev/null; then
          technical_pass=YES
          checkpoint=KSU-GEN1-P5-UMOUNTED-PROCESS-STATE-BRIDGE-PASS
          build_performed=YES
        else
          technical_pass=NO
          checkpoint=KSU-GEN1-P5-V6-FAILED
          if grep -Fxq 'P5_V6_IMAGE_DTBS_BUILD=PASS' evidence/12-P5V6-BUILD-IDENTITY.txt 2>/dev/null; then
            build_performed=YES
          else
            build_performed=NO
          fi
        fi

        {
          echo "JOB_STATUS_BEFORE_TECHNICAL_CLOSE=${{ job.status }}"
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          echo "TECHNICAL_PASS=$technical_pass"
          echo "CHECKPOINT=$checkpoint"
          echo "PARENT_P5_V5_RUN_ID=$P5_V5_PASS_RUN_ID"
          echo "PARENT_P5_V5_BACKUP_TAG=$P5_V5_PARENT_BACKUP_TAG"
          echo "CONFIG_KSU_SUSFS_TARGET=YES"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME_TARGET=YES"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG_TARGET=YES"
          echo "SUSFS_FEATURE_SUBOPTIONS_ENABLED=2"
          echo "NEW_SUBOPTION=NONE"
          echo "TIF_PROC_UMOUNTED_BRIDGE=YES"
          echo "TIF_PROC_UMOUNTED_BIT=33"
          echo "TIF_PROC_NO_SU_BRIDGE=NO"
          echo "ZYGOTE_NEXT_BRIDGE=NO"
          echo "USER_COMMAND_DISPATCH=ROOT_ONLY"
          echo "USER_COMMAND_DISPATCH_COMMAND_COUNT=5"
          echo "P4_STAT_FACCESSAT_BRIDGE_PRESERVED=YES"
          echo "SUS_PATH_ACTIVE=NO"
          echo "SUS_MOUNT_ACTIVE=NO"
          echo "SUS_KSTAT_ACTIVE=NO"
          echo "OPEN_REDIRECT_ACTIVE=NO"
          echo "SUS_MAP_ACTIVE=NO"
          echo "PROC_MAPS_CHANGED=NO"
          echo "NAMEI_CHANGED=NO"
          echo "NAMESPACE_CHANGED=NO"
          echo "KERNEL_BUILD_PERFORMED=$build_performed"
          echo "AUTO_GITHUB_BACKUP_REQUIRED=YES"
          echo "BOOT_IMAGE_CREATED=NO"
          echo "DEVICE_ACCESSED=NO"
          echo "FLASHING_PERFORMED=NO"
        } > evidence/98-FINAL-STATUS.txt

        test "$technical_pass" = YES
      if: ${{ always() }}
    - name: 23 - Build P5-v6 SHA256 manifests
      shell: bash
      run: |
        set -euo pipefail

        for dir in evidence restore-kit build-artifacts; do
          [ -d "$dir" ] || continue
          rm -f "$dir/SHA256SUMS" "$dir/EMPTY-DIRECTORY.txt"

          (
            cd "$dir"
            count="$(
              find . -type f ! -name SHA256SUMS ! -name EMPTY-DIRECTORY.txt \
                | wc -l | tr -d ' '
            )"

            if [ "$count" -eq 0 ]; then
              {
                echo "EMPTY_DIRECTORY_AT_MANIFEST_TIME=YES"
                echo "RUN_ID=$GITHUB_RUN_ID"
              } > EMPTY-DIRECTORY.txt
            fi

            find . -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 -r sha256sum \
              > SHA256SUMS

            test -s SHA256SUMS
            ! grep -Eq '[[:space:]]SHA256SUMS$' SHA256SUMS
            sha256sum -c SHA256SUMS
          )
        done
      if: ${{ always() }}
    - name: 24 - Upload P5-v6 evidence restore kit and build outputs
      uses: actions/upload-artifact@v7
      with:
        name: ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-umounted-process-state-bridge-v6-${{ github.run_id }}
        path: 'evidence/

          restore-kit/

          build-artifacts/

          '
        retention-days: 14
        if-no-files-found: error
      if: ${{ always() }}
    - name: 25 - P5-v6 technical summary
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "# KSU GEN1 P5-v6 - TIF_PROC_UMOUNTED process-state bridge"
          echo
          if grep -Fxq 'TECHNICAL_PASS=YES' evidence/98-FINAL-STATUS.txt 2>/dev/null; then
            echo "**TECHNICAL PASS**"
            echo
            echo "No new SUSFS subfeature was enabled."
            echo "The existing KSU setuid/umount path now marks TIF_PROC_UMOUNTED."
            echo "The automatic backup job must also pass before the next P5 block."
            echo
            echo '```text'
            cat evidence/12-P5V6-BUILD-IDENTITY.txt
            cat evidence/13-P5V6-LINKED-BOUNDARY.txt
            cat evidence/14-P5V6-PROVENANCE.txt
            echo '```'
          else
            echo "**FAIL — repair only the concrete P5-v6 boundary.**"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
      if: ${{ always() }}
  backup-pass:
    name: P5-v6 - automatic permanent GitHub recovery backup
    needs:
    - p5-process-state
    if: ${{ needs.p5-process-state.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: B01 - Initialize automatic P5-v6 backup
      shell: bash
      run: |
        set -euo pipefail
        rm -rf backup-work backup-evidence
        mkdir -p backup-work backup-evidence

        tag="ksu-gen1-p5-v6-pass-backup-${GITHUB_RUN_ID}"

        {
          echo "BACKUP_WORKFLOW=KSU-GEN1-P5-V6-AUTO-GITHUB-RECOVERY"
          echo "TECHNICAL_RUN_ID=$GITHUB_RUN_ID"
          echo "PARENT_BACKUP_TAG=$P5_V5_PARENT_BACKUP_TAG"
          echo "RELEASE_TAG=$tag"
          echo "RELEASE_TARGET_SHA=$GITHUB_SHA"
          echo "RELEASE_REDOWNLOAD_REVERIFY=YES"
        } > backup-evidence/00-CONTRACT.txt

        gh release view "$P5_V5_PARENT_BACKUP_TAG" \
          --repo "$GITHUB_REPOSITORY" >/dev/null
    - name: B02 - Resolve and download exact current Actions artifact
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-umounted-process-state-bridge-v6-${GITHUB_RUN_ID}"

        json="$(
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
        )"

        count="$(
          jq --arg n "$artifact_name" \
            '[.artifacts[] | select(.name == $n and .expired == false)] | length' \
            <<<"$json"
        )"
        test "$count" -eq 1

        artifact_id="$(
          jq -r --arg n "$artifact_name" \
            '.artifacts[] | select(.name == $n and .expired == false) | .id' \
            <<<"$json"
        )"
        expected_digest="$(
          jq -r --arg n "$artifact_name" \
            '.artifacts[] | select(.name == $n and .expired == false) | .digest' \
            <<<"$json"
        )"

        test -n "$artifact_id"
        test "$expected_digest" != "null"
        expected_sha="${expected_digest#sha256:}"

        gh api \
          -H "Accept: application/vnd.github+json" \
          "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
          > "${artifact_name}.zip"

        test -s "${artifact_name}.zip"
        actual_sha="$(sha256sum "${artifact_name}.zip" | awk '{print $1}')"
        test "$actual_sha" = "$expected_sha"

        {
          echo "CURRENT_ARTIFACT_NAME=$artifact_name"
          echo "CURRENT_ARTIFACT_ID=$artifact_id"
          echo "CURRENT_ARTIFACT_SHA256=$actual_sha"
          echo "CURRENT_ACTIONS_ARTIFACT_AUTH=PASS"
        } > "$GITHUB_WORKSPACE/backup-evidence/01-CURRENT-ARTIFACT-AUTH.txt"
    - name: B03 - Verify internal P5-v6 PASS manifests
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-umounted-process-state-bridge-v6-${GITHUB_RUN_ID}"
        rm -rf verify-current
        mkdir verify-current
        unzip -q "${artifact_name}.zip" -d verify-current

        for dir in evidence restore-kit build-artifacts; do
          test -s "verify-current/$dir/SHA256SUMS"
          (
            cd "verify-current/$dir"
            sha256sum -c SHA256SUMS
          )
        done

        grep -Fxq 'TECHNICAL_PASS=YES' \
          verify-current/evidence/98-FINAL-STATUS.txt
        grep -Fxq \
          'CHECKPOINT=KSU-GEN1-P5-UMOUNTED-PROCESS-STATE-BRIDGE-PASS' \
          verify-current/evidence/98-FINAL-STATUS.txt
        grep -Fxq 'P5_V6_LINKED_BOUNDARY=PASS' \
          verify-current/evidence/13-P5V6-LINKED-BOUNDARY.txt
        grep -Fxq 'P5_V6_RESTORE_KIT=PASS' \
          verify-current/evidence/14-P5V6-PROVENANCE.txt

        jq -e \
          '.stage == "KSU-GEN1-P5-v6" and
           .tif_proc_umounted_bridge_integrated == true and
           .susfs_feature_suboptions_enabled == 2 and
           .kernel_build_performed == true and
           .device_accessed == false and
           .flashing_performed == false' \
          verify-current/restore-kit/manifest.json >/dev/null

        echo "CURRENT_PASS_CHAIN_AUTH=PASS" \
          > "$GITHUB_WORKSPACE/backup-evidence/02-PASS-AUTH.txt"
    - name: B04 - Prepare P5-v6 recovery release payload
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-umounted-process-state-bridge-v6-${GITHUB_RUN_ID}"
        artifact_sha="$(sha256sum "${artifact_name}.zip" | awk '{print $1}')"
        image_sha="$(sha256sum verify-current/build-artifacts/Image | awk '{print $1}')"
        config_sha="$(sha256sum verify-current/build-artifacts/config | awk '{print $1}')"
        dtb_sha="$(sha256sum verify-current/build-artifacts/veux.dtb | awk '{print $1}')"

        cp verify-current/restore-kit/manifest.json P5V6-MANIFEST.json

        cat > RECOVERY.txt <<EOF
        KSU GEN1 VEUX P5-v6 PASS Recovery Backup
        ========================================

        Technical run: $GITHUB_RUN_ID
        Parent permanent backup:
        $P5_V5_PARENT_BACKUP_TAG

        Kernel: Linux 5.4.274
        KernelSU: official v0.9.5
        SUSFS: v2.3.0

        Active SUSFS suboptions:
        - KSU_SUSFS_SPOOF_UNAME
        - KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG

        New P5-v6 bridge:
        - TIF_PROC_UMOUNTED cleared before app policy evaluation
        - TIF_PROC_UMOUNTED set after the existing KSU zygote-child umount sequence
        - no TIF_PROC_NO_SU bridge
        - no zygote_next bridge

        Image SHA256:
        $image_sha

        Config SHA256:
        $config_sha

        VEUX DTB SHA256:
        $dtb_sha

        Current complete Actions artifact SHA256:
        $artifact_sha

        This is a build/recovery checkpoint.
        No boot image, real-device boot test or flashing is claimed.
        EOF

        {
          sha256sum "${artifact_name}.zip"
          sha256sum P5V6-MANIFEST.json
          sha256sum RECOVERY.txt
        } > RELEASE-SHA256SUMS.txt
        sha256sum -c RELEASE-SHA256SUMS.txt

        cat > release-notes.md <<EOF
        Permanent recovery checkpoint after successful P5-v6.

        - VEUX / Linux 5.4.274
        - official KernelSU 0.9.5
        - SUSFS 2.3.0
        - parent backup: \`$P5_V5_PARENT_BACKUP_TAG\`
        - technical run: \`$GITHUB_RUN_ID\`

        P5-v6 adds only the TIF_PROC_UMOUNTED bridge in the existing
        KernelSU setuid/umount path. No new SUSFS feature suboption is enabled.

        The complete Actions artifact is attached and is re-downloaded after
        release creation for byte-identity verification.
        EOF

        echo "RELEASE_PAYLOAD_PREPARED=PASS" \
          > "$GITHUB_WORKSPACE/backup-evidence/03-RELEASE-PAYLOAD.txt"
    - name: B05 - Create permanent P5-v6 GitHub Release
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        tag="ksu-gen1-p5-v6-pass-backup-${GITHUB_RUN_ID}"
        title="KSU GEN1 VEUX P5-v6 PASS Recovery Backup"

        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "release already exists: $tag" >&2
          exit 1
        fi

        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-umounted-process-state-bridge-v6-${GITHUB_RUN_ID}"

        gh release create "$tag" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "$title" \
          --notes-file release-notes.md \
          "${artifact_name}.zip#P5-v6 complete PASS artifact" \
          "P5V6-MANIFEST.json#P5-v6 recovery manifest" \
          "RELEASE-SHA256SUMS.txt#Release checksums" \
          "RECOVERY.txt#Recovery metadata"

        gh release view "$tag" \
          --repo "$GITHUB_REPOSITORY" \
          --json tagName,name,isDraft,isPrerelease,url,assets \
          > "$GITHUB_WORKSPACE/backup-evidence/04-RELEASE.json"

        jq -e \
          --arg tag "$tag" \
          --arg title "$title" \
          '.tagName == $tag and
           .name == $title and
           .isDraft == false and
           .isPrerelease == false and
           (.assets | length) == 4' \
          "$GITHUB_WORKSPACE/backup-evidence/04-RELEASE.json" >/dev/null

        {
          echo "GITHUB_RELEASE_CREATED=PASS"
          echo "RELEASE_TAG=$tag"
        } > "$GITHUB_WORKSPACE/backup-evidence/04-RELEASE-CREATE.txt"
    - name: B06 - Redownload P5-v6 release assets and reverify
      shell: bash
      run: |
        set -euo pipefail
        cd backup-work

        tag="ksu-gen1-p5-v6-pass-backup-${GITHUB_RUN_ID}"
        artifact_name="ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-umounted-process-state-bridge-v6-${GITHUB_RUN_ID}"

        rm -rf release-download
        mkdir release-download

        gh release download "$tag" \
          --repo "$GITHUB_REPOSITORY" \
          --dir release-download

        cmp "${artifact_name}.zip" \
          "release-download/${artifact_name}.zip"
        cmp P5V6-MANIFEST.json \
          release-download/P5V6-MANIFEST.json
        cmp RELEASE-SHA256SUMS.txt \
          release-download/RELEASE-SHA256SUMS.txt
        cmp RECOVERY.txt \
          release-download/RECOVERY.txt

        {
          echo "CURRENT_ARTIFACT_RELEASE_BYTE_IDENTITY=PASS"
          echo "MANIFEST_RELEASE_BYTE_IDENTITY=PASS"
          echo "CHECKSUM_RELEASE_BYTE_IDENTITY=PASS"
          echo "RECOVERY_METADATA_RELEASE_BYTE_IDENTITY=PASS"
          echo "RELEASE_DOWNLOAD_REVERIFY=PASS"
        } > "$GITHUB_WORKSPACE/backup-evidence/05-RELEASE-REVERIFY.txt"
    - name: B07 - Close automatic P5-v6 backup status
      shell: bash
      run: |
        set -euo pipefail

        if grep -Fxq 'GITHUB_RELEASE_CREATED=PASS' backup-evidence/04-RELEASE-CREATE.txt \
          && grep -Fxq 'RELEASE_DOWNLOAD_REVERIFY=PASS' backup-evidence/05-RELEASE-REVERIFY.txt; then
          pass=YES
          checkpoint=KSU-GEN1-P5-V6-GITHUB-RECOVERY-BACKUP-PASS
        else
          pass=NO
          checkpoint=KSU-GEN1-P5-V6-GITHUB-RECOVERY-BACKUP-FAILED
        fi

        {
          echo "BACKUP_PASS=$pass"
          echo "CHECKPOINT=$checkpoint"
          echo "TECHNICAL_RUN_ID=$GITHUB_RUN_ID"
          echo "PARENT_BACKUP_TAG=$P5_V5_PARENT_BACKUP_TAG"
          echo "RELEASE_TAG=ksu-gen1-p5-v6-pass-backup-$GITHUB_RUN_ID"
          echo "CURRENT_FULL_ARTIFACT_BACKED_UP=YES"
          echo "RELEASE_ASSETS_REDOWNLOADED_AND_REVERIFIED=$pass"
        } > backup-evidence/98-BACKUP-STATUS.txt

        test "$pass" = YES
    - name: B08 - Build automatic backup evidence manifest
      shell: bash
      run: |
        set -euo pipefail
        cd backup-evidence
        rm -f SHA256SUMS
        find . -type f ! -name SHA256SUMS -printf '%P\0' \
          | sort -z \
          | xargs -0 -r sha256sum \
          > SHA256SUMS
        test -s SHA256SUMS
        sha256sum -c SHA256SUMS
      if: ${{ always() }}
    - name: B09 - Upload automatic P5-v6 backup evidence
      uses: actions/upload-artifact@v7
      with:
        name: ksu-gen1-p5-v6-github-recovery-backup-evidence-${{ github.run_id }}
        path: backup-evidence/
        retention-days: 90
        if-no-files-found: error
      if: ${{ always() }}
    - name: B10 - Automatic P5-v6 backup summary
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "# P5-v6 automatic GitHub recovery backup"
          echo
          if grep -Fxq 'BACKUP_PASS=YES' backup-evidence/98-BACKUP-STATUS.txt 2>/dev/null; then
            echo "**BACKUP PASS**"
            echo
            echo "Permanent release:"
            echo "\`ksu-gen1-p5-v6-pass-backup-$GITHUB_RUN_ID\`"
            echo
            echo "The release assets were downloaded again and verified byte-for-byte."
          else
            echo "**BACKUP FAIL — do not continue to the next P5 block.**"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
      if: ${{ always() }}
