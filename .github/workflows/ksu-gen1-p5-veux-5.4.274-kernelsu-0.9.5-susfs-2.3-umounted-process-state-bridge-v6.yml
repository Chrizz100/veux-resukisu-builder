    - name: 14 - Audit and activate TIF_PROC_UMOUNTED bridge
      shell: bash
      run: |
        set -euo pipefail
        echo "STAGE=P5_V6_PROCESS_STATE_ACTIVATION" > evidence/STAGE.txt
        cd kernel

        python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/07-P5V6-PRE-AUDIT.txt"
        from pathlib import Path
        import re

        defs = Path("include/linux/susfs_def.h").read_text(encoding="utf-8")
        core = Path("KernelSU/kernel/core_hook.c").read_text(encoding="utf-8")
        arm64 = Path("arch/arm64/include/asm/thread_info.h").read_text(encoding="utf-8")

        checks = {
            "TIF_PROC_UMOUNTED_33":
                re.search(r"^#define\s+TIF_PROC_UMOUNTED\s+33\s*$", defs, re.M) is not None,
            "TIF_PROC_NO_SU_34":
                re.search(r"^#define\s+TIF_PROC_NO_SU\s+34\s*$", defs, re.M) is not None,
            "TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT_35":
                re.search(r"^#define\s+TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT\s+35\s*$", defs, re.M) is not None,
            "SET_HELPER_PRESENT":
                "static inline void susfs_set_current_proc_umounted(void)" in defs,
            "CLEAR_HELPER_PRESENT":
                "static inline void susfs_clear_current_proc_umounted(void)" in defs,
            "KSU_SUSFS_INCLUDE_PRESENT":
                "#include <linux/susfs.h>" in core,
            "SETUID_FUNCTION_PRESENT":
                "int ksu_handle_setuid(struct cred *new, const struct cred *old)" in core,
            "ALLOWLIST_ANCHOR_PRESENT":
                "if (ksu_is_allow_uid(new_uid.val))" in core,
            "FINAL_UMOUNT_ANCHOR_PRESENT":
                'try_umount("/sbin", false, MNT_DETACH);' in core,
            "NO_EXISTING_SET_CALL":
                "susfs_set_current_proc_umounted();" not in core,
            "NO_EXISTING_CLEAR_CALL":
                "susfs_clear_current_proc_umounted();" not in core,
        }

        arm64_tif_bits = {}
        for name, bit in re.findall(r"^#define\s+(TIF_[A-Z0-9_]+)\s+(\d+)\b", arm64, re.M):
            arm64_tif_bits[name] = int(bit)

        occupied = sorted(
            (name, bit) for name, bit in arm64_tif_bits.items()
            if bit in (33, 34, 35)
        )
        checks["ARM64_TIF_33_35_FREE"] = not occupied

        for key, ok in checks.items():
            print(f"{key}={'PASS' if ok else 'FAIL'}")
        print("ARM64_TIF_33_35_OCCUPIED=" + repr(occupied))

        failed = [key for key, ok in checks.items() if not ok]
        if failed:
            raise SystemExit("P5-v6 prerequisite failure: " + ", ".join(failed))

        print("P5_V6_PRE_ACTIVATION_AUDIT=PASS")
        PY

        python3 - <<'PY'
        from pathlib import Path

        p = Path("KernelSU/kernel/core_hook.c")
        t = p.read_text(encoding="utf-8")

        sig = "int ksu_handle_setuid(struct cred *new, const struct cred *old)"
        if t.count(sig) != 1:
            raise SystemExit("ksu_handle_setuid function count mismatch")

        start = t.index(sig)
        end_anchor = "\n}\n\n// Init functons"
        end = t.index(end_anchor, start) + 3
        fn = t[start:end]

        if "susfs_set_current_proc_umounted();" in fn:
            raise SystemExit("set proc umounted already present")
        if "susfs_clear_current_proc_umounted();" in fn:
            raise SystemExit("clear proc umounted already present")

        allow_anchor = "\tif (ksu_is_allow_uid(new_uid.val)) {"
        if fn.count(allow_anchor) != 1:
            raise SystemExit("allowlist anchor mismatch")

        clear_block = (
            "#ifdef CONFIG_KSU_SUSFS\n"
            "\t/* Fresh app transition: clear stale SUSFS umount state first. */\n"
            "\tsusfs_clear_current_proc_umounted();\n"
            "#endif\n\n"
        )
        fn = fn.replace(allow_anchor, clear_block + allow_anchor, 1)

        final_umount = '\ttry_umount("/sbin", false, MNT_DETACH);\n'
        if fn.count(final_umount) != 1:
            raise SystemExit("final KSU umount anchor mismatch")

        set_block = (
            final_umount
            + "\n#ifdef CONFIG_KSU_SUSFS\n"
            + "\t/* Mark only the completed KSU zygote-child umount path. */\n"
            + "\tsusfs_set_current_proc_umounted();\n"
            + "#endif\n"
        )
        fn = fn.replace(final_umount, set_block, 1)

        if fn.count("susfs_clear_current_proc_umounted();") != 1:
            raise SystemExit("clear proc umounted insertion count mismatch")
        if fn.count("susfs_set_current_proc_umounted();") != 1:
            raise SystemExit("set proc umounted insertion count mismatch")

        t = t[:start] + fn + t[end:]
        p.write_text(t, encoding="utf-8")
        PY

        git -C KernelSU diff --check -- kernel/core_hook.c

        python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/07-P5V6-SOURCE-AUDIT.txt"
        from pathlib import Path
        import re

        core = Path("KernelSU/kernel/core_hook.c").read_text(encoding="utf-8")
        cfg = Path("KernelSU/kernel/Kconfig").read_text(encoding="utf-8")

        start = core.index("int ksu_handle_setuid(struct cred *new, const struct cred *old)")
        end = core.index("\n}\n\n// Init functons", start) + 3
        fn = core[start:end]

        assert fn.count("susfs_clear_current_proc_umounted();") == 1
        assert fn.count("susfs_set_current_proc_umounted();") == 1
        assert fn.index("susfs_clear_current_proc_umounted();") < fn.index("if (ksu_is_allow_uid(new_uid.val))")
        assert fn.index('try_umount("/sbin", false, MNT_DETACH);') < fn.index("susfs_set_current_proc_umounted();")
        assert fn.index("susfs_set_current_proc_umounted();") < fn.rindex("return 0;")

        assert "susfs_set_current_proc_no_su();" not in fn
        assert "susfs_clear_current_proc_no_su();" not in fn
        assert "susfs_set_current_proc_umounted_for_zygote_next();" not in fn
        assert "susfs_clear_current_proc_umounted_for_zygote_next();" not in fn

        assert cfg.count("config KSU_SUSFS_SPOOF_UNAME") == 1
        assert cfg.count("config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG") == 1
        assert len(re.findall(r"^config KSU_SUSFS_[A-Z0-9_]+$", cfg, re.M)) == 2

        dstart = core.index("static bool ksu_handle_susfs_command")
        dend = core.index("int ksu_handle_prctl", dstart)
        dispatch = core[dstart:dend]
        cases = set(re.findall(r"case (CMD_SUSFS_[A-Z0-9_]+):", dispatch))
        expected = {
            "CMD_SUSFS_SET_UNAME",
            "CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG",
            "CMD_SUSFS_SHOW_VERSION",
            "CMD_SUSFS_SHOW_ENABLED_FEATURES",
            "CMD_SUSFS_SHOW_VARIANT",
        }
        assert cases == expected
        assert "if (from_root && ksu_handle_susfs_command(arg2, arg3))" in core

        print("P5_V6_TIF_PROC_UMOUNTED_CLEAR_BEFORE_POLICY=PASS")
        print("P5_V6_TIF_PROC_UMOUNTED_SET_AFTER_KSU_UMOUNT_SEQUENCE=PASS")
        print("P5_V6_TIF_PROC_NO_SU_UNCHANGED=PASS")
        print("P5_V6_ZYGOTE_NEXT_UNCHANGED=PASS")
        print("P5_V6_ROOT_ONLY_DISPATCH_UNCHANGED=PASS")
        print("P5_V6_ACTIVE_SUBOPTION_COUNT=2")
        print("P5_V6_SOURCE_ACTIVATION=PASS")
        PY
