        grep -Fq 'P6_IMAGE_REPRODUCIBLE=YES' "$ARTIFACT_DIR/13-reproducibility.txt"
        grep -Fq 'P6_VEUX_DTB_REPRODUCIBLE=YES' "$ARTIFACT_DIR/13-reproducibility.txt"
        grep -Fq 'P6_VMLINUX_REPRODUCIBLE=YES' "$ARTIFACT_DIR/13-reproducibility.txt"
        grep -Fq 'P6_ALL_DTBS_REPRODUCIBLE=YES' "$ARTIFACT_DIR/13-reproducibility.txt"
        grep -Fq 'P6_BUILD_B_FULL_LINK_CONTRACT=PASS' "$ARTIFACT_DIR/14-build-b-final.txt"
        grep -Fq 'P6_PROVENANCE_PACKAGE=PASS' "$ARTIFACT_DIR/15-provenance-state.txt"
        grep -Fq 'P6_SOURCE_RESTORE_REPLAY=PASS' "$ARTIFACT_DIR/16-restore-replays.txt"
        grep -Fq 'P6_RESUKISU_RESTORE_REPLAY=PASS' "$ARTIFACT_DIR/16-restore-replays.txt"

        test -s "$ARTIFACT_DIR/build-a/Image"
        test -s "$ARTIFACT_DIR/build-a/veux.dtb"
        test -s "$ARTIFACT_DIR/build-a/veux-5.4.274.base.config"
        test -s "$ARTIFACT_DIR/build-a/EFFECTIVE-BUILD-CONFIG.txt"

        {
          echo "CLEAN_GEN1_P6_DETERMINISTIC_IMAGE_DTB_BUILD=PASS"
          echo "P6_V4_FAILURE_CLASS=WORKFLOW_INVALID_ISOLATED_RESUKISU_SUBDIR_PREFLIGHT"
          echo "P6_V5_SOURCE_TRANSFORM_CHANGED_FROM_V4=NO"
          echo "P6_ISOLATED_RESUKISU_SUBDIR_PREFLIGHT=REMOVED"
          echo "P6_STATIC_EXPORT_CHECK_RUNTIME_PROVEN_IN_PARENT=YES"
          echo "P6_V3_FAILURE_CLASS=WORKFLOW_PREFLIGHT_MAKEFILE_HAS_NO_STANDALONE_TARGET"
          echo "P6_V4_EXACT_STATIC_EXPORT_CHECK_REPLAY=PASS"
          echo "P6_V4_SOURCE_TRANSFORM_CHANGED_FROM_V3=NO"
          echo "P6_V2_FAILURE_CLASS=WORKFLOW_FALSE_POSITIVE_STATIC_EXPORT_SUBSTRING_GUARD"
          echo "P6_V3_EXACT_SOURCE_TRANSFORM_REPLAY=PASS"
          echo "KERNEL_VERSION=5.4.274"
          echo "P6_INPUT_STAGE=P5I_PLUS_REQUIRED_RESUKISU_STATIC_EXPORT_FIX"
          echo "P6_PARENT_INPUT_COMMIT=$EXPECTED_P5I_COMMIT"
          echo "P6_SOURCE_COMMIT=$P6_SOURCE_COMMIT"
          echo "P6_PARENT_INPUT_TREE=$EXPECTED_P5I_TREE"
          echo "P6_SOURCE_TREE=$P6_SOURCE_TREE"
          echo "P6_RESUKISU_HEAD=$EXPECTED_RESUKISU_HEAD"
          echo "P6_RESUKISU_TREE=$EXPECTED_RESUKISU_TREE"
          echo "P6_KSU_VERSION=$EXPECTED_KSU_VERSION"
          echo "P6_TOOLCHAIN=clang-r416183b"
          echo "P6_CLANG_PREBUILT_COMMIT=$CLANG_PREBUILT_COMMIT"
          echo "P6_EFFECTIVE_HOOK_MODE=MANUAL_HOOK_PLUS_FORCED_SUSFS"
          echo "P6_KCONFIG_NATIVE_DUAL_SELECTION=NO"
          echo "P6_EFFECTIVE_SUSFS_ENABLEMENT=MAKE_COMMAND_LINE_PLUS_KCFLAGS"
          echo "P6_ALL_SUSFS_FEATURE_OVERRIDES=YES"
          echo "P6_SUSFS_LOGGING=ENABLED_FOR_DIAGNOSTIC_CANDIDATE"
          echo "P6_IMAGE_CREATED=YES"
          echo "P6_DTB_BUILD_PERFORMED=YES"
          echo "P6_VEUX_DTB_CREATED=YES"
          echo "P6_IMAGE_REPRODUCIBLE=YES"
          echo "P6_VEUX_DTB_REPRODUCIBLE=YES"
          echo "P6_VMLINUX_REPRODUCIBLE=YES"
          echo "P6_SYSTEM_MAP_REPRODUCIBLE=YES"
          echo "P6_BASE_CONFIG_REPRODUCIBLE=YES"
          echo "P6_ALL_DTBS_REPRODUCIBLE=YES"
          echo "P6_REPRODUCIBILITY_SCOPE=SAME_RUN_CLEAN_REBUILD_SAME_ABSOLUTE_OUT_PATH"
          echo "P6_FULL_LINK_MANUAL_HOOK=PASS"
          echo "P6_FULL_LINK_SUSFS=PASS"
          echo "P6_FULL_LINK_OPEN_REDIRECT=PASS"
          echo "P6_SOURCE_MUTATION=YES_REQUIRED_STATIC_EXPORT_FIX_ONLY"
          echo "P6_SOURCE_CHANGE_SCOPE=security/selinux/selinuxfs.c"
          echo "P6_STATIC_EXPORT_WRITE_OP=YES"
          echo "P6_STATIC_EXPORT_SEL_HANDLE_STATUS_OPS=YES"
          echo "P6_LAST_GOOD_SOURCE=P6_SOURCE_CHECKPOINT_AFTER_FULL_BUILD_PASS"
          echo "MODULE_LOAD_FILTER_INCLUDED=NO"
          echo "BOOT_IMAGE_CREATED=NO"
          echo "FLASHABLE_ZIP_CREATED=NO"
          echo "DEVICE_ACCESSED=NO"
          echo "FLASHING_PERFORMED=NO"
          echo "NEXT_STAGE=CLEAN_GEN1_P7A_FROZEN_MANAGER_KSUD_DEVICE_AB_PREPARATION"
        } | tee "$ARTIFACT_DIR/17-result.txt"
    - name: Preserve P6 failure evidence
      if: always()
      shell: bash
      run: |2

        set +e
        mkdir -p "$ARTIFACT_DIR"
        {
          echo "JOB_STATUS=${{ job.status }}"
          if [ -d "$GITHUB_WORKSPACE/kernel/.git" ]; then
            echo "OUTER_HEAD=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD 2>/dev/null || true)"
            echo "OUTER_TREE=$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD^{tree} 2>/dev/null || true)"
            echo "OUTER_STATUS_BEGIN"
            git -C "$GITHUB_WORKSPACE/kernel" status --porcelain 2>/dev/null || true
            echo "OUTER_STATUS_END"
          fi
          if [ -d "$GITHUB_WORKSPACE/kernel/KernelSU/.git" ]; then
            echo "RESUKISU_HEAD=$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD 2>/dev/null || true)"
            echo "RESUKISU_TREE=$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD^{tree} 2>/dev/null || true)"
            echo "RESUKISU_STATUS_BEGIN"
            git -C "$GITHUB_WORKSPACE/kernel/KernelSU" status --porcelain 2>/dev/null || true
            echo "RESUKISU_STATUS_END"
          fi
          if [ -n "${OUT_DIR:-}" ] && [ -d "$OUT_DIR" ]; then
            echo "IMAGE_EXISTS=$(test -s "$OUT_DIR/arch/arm64/boot/Image" && echo YES || echo NO)"
            echo "VEUX_DTB_EXISTS=$(test -s "$OUT_DIR/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb" && echo YES || echo NO)"
            echo "VMLINUX_EXISTS=$(test -s "$OUT_DIR/vmlinux" && echo YES || echo NO)"
          fi
        } > "$ARTIFACT_DIR/99-job-end-state.txt"

        find "$ARTIFACT_DIR" -maxdepth 3 -type f -printf '%P\n' \
          | sort > "$ARTIFACT_DIR/99-artifact-file-list.txt"
        exit 0
    - name: Upload P6 deterministic build evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: clean-gen1-p6-deterministic-image-dtb-build-v5-${{ github.run_id }}
        path: clean-gen1-p6/
        if-no-files-found: error
        retention-days: 90
