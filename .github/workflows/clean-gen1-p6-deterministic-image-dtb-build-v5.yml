          > "$ARTIFACT_DIR/13-build-b-all-dtbs.sha256"

        python3 - <<'PY' > "$ARTIFACT_DIR/13-reproducibility.txt"
        from pathlib import Path

        def parse(path):
            d = {}
            for line in Path(path).read_text().splitlines():
                sha, name = line.split(None, 1)
                d[name.strip()] = sha
            return d

        a = parse("../clean-gen1-p6/09-build-a-core.sha256")
        b = parse("../clean-gen1-p6/13-build-b-core.sha256")

        suffixes = {
            "Image": "/arch/arm64/boot/Image",
            "VEUX_DTB": "/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb",
            "VMLINUX": "/vmlinux",
            "SYSTEM_MAP": "/System.map",
            "CONFIG": "/.config",
        }
        for label, suffix in suffixes.items():
            av = next(v for k, v in a.items() if k.endswith(suffix))
            bv = next(v for k, v in b.items() if k.endswith(suffix))
            if av != bv:
                raise SystemExit(f"{label} mismatch: {av} != {bv}")
            print(f"P6_{label}_SHA256={av}")
            print(f"P6_{label}_REPRODUCIBLE=YES")
        PY

        cmp -s "$ARTIFACT_DIR/09-build-a-all-dtbs.sha256" \
               "$ARTIFACT_DIR/13-build-b-all-dtbs.sha256"

        cmp -s "$IMAGE" "$ARTIFACT_DIR/build-a/Image"
        cmp -s "$VEUX_DTB" "$ARTIFACT_DIR/build-a/veux.dtb"
        cmp -s "$OUT_DIR/.config" "$ARTIFACT_DIR/build-a/veux-5.4.274.base.config"

        {
          echo "P6_REPRODUCIBILITY_MODE=SAME_RUN_CLEAN_REBUILD_SAME_ABSOLUTE_OUT_PATH"
          echo "P6_IMAGE_REPRODUCIBLE=YES"
          echo "P6_VEUX_DTB_REPRODUCIBLE=YES"
          echo "P6_VMLINUX_REPRODUCIBLE=YES"
          echo "P6_SYSTEM_MAP_REPRODUCIBLE=YES"
          echo "P6_BASE_CONFIG_REPRODUCIBLE=YES"
          echo "P6_ALL_DTBS_REPRODUCIBLE=YES"
          echo "P6_BUILD_B_VALIDATION=PASS"
        } | tee -a "$ARTIFACT_DIR/13-reproducibility.txt"
