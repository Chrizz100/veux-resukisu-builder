name: CLEAN GEN1 P6 - deterministic Image + DTB build v5
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  p6-deterministic-image-dtb:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      ARCH: arm64
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      VENDOR_REPO: dereference23/kernel_xiaomi_sm6375
      VENDOR_TAG: '20240619'
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      P5I_RUN_ID: '33513399363'
      P5I_ARTIFACT_NAME: clean-gen1-p5i-proc-maps-open-redirect-srcu-v1-33513399363
      EXPECTED_P5I_COMMIT: f353a9475e40ca866d570c1d0ef55e24cf6556e4
      EXPECTED_P5I_TREE: a947c1f2891c796a08373fc755e29b23139dc761
      EXPECTED_RESUKISU_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_RESUKISU_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      EXPECTED_KSU_VERSION: '35102'
      RESUKISU_SNAPSHOT_HEAD: 0b5efe9e0102c43ca5c41174d500f5a7080cd0c7
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_54_HEAD: 76affd70abf61d77feb0a132f61365d6848505df
      SUSFS_510_HEAD: ec785f47d49f7b3871ca9356f450411020af7017
      SUSFS_515_HEAD: bca0d2333c1a7d717e7278b019d7af7ba1d16005
      SUSFS_61_HEAD: 4fc9c1898ea66f51847cdbc0d1473ea4ef525a70
      CLANG_PREBUILT_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      OUT_DIR: ${{ github.workspace }}/kernel/out-p6
      ARTIFACT_DIR: ${{ github.workspace }}/clean-gen1-p6
      P5I_ARTIFACT_DIR: ${{ github.workspace }}/p5i-artifact
      KBUILD_BUILD_USER: clean-gen1
      KBUILD_BUILD_HOST: veux-p6
      KBUILD_BUILD_TIMESTAMP: Tue Sep 1 00:00:00 UTC 2026
      KBUILD_BUILD_VERSION: '1'
      SOURCE_DATE_EPOCH: '1788220800'
      P6_SUSFS_MAKE_ARGS: CONFIG_KSU_SUSFS=y CONFIG_KSU_SUSFS_SUS_PATH=y CONFIG_KSU_SUSFS_SUS_MOUNT=y CONFIG_KSU_SUSFS_SUS_KSTAT=y CONFIG_KSU_SUSFS_SPOOF_UNAME=y CONFIG_KSU_SUSFS_ENABLE_LOG=y CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y CONFIG_KSU_SUSFS_OPEN_REDIRECT=y CONFIG_KSU_SUSFS_SUS_MAP=y
      P6_EFFECTIVE_KCFLAGS: -D__ANDROID_COMMON_KERNEL__ -DCONFIG_KSU_SUSFS -DCONFIG_KSU_SUSFS_SUS_PATH -DCONFIG_KSU_SUSFS_SUS_MOUNT -DCONFIG_KSU_SUSFS_SUS_KSTAT -DCONFIG_KSU_SUSFS_SPOOF_UNAME -DCONFIG_KSU_SUSFS_ENABLE_LOG -DCONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -DCONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -DCONFIG_KSU_SUSFS_OPEN_REDIRECT -DCONFIG_KSU_SUSFS_SUS_MAP
      P6_PARENT_RUN_ID: '33521377085'
      P6_PARENT_FAILURE: WORKFLOW_INVALID_ISOLATED_RESUKISU_SUBDIR_PREFLIGHT
      P6_REQUIRED_EXPORT_FILE: security/selinux/selinuxfs.c
    steps:
    - name: Initialize P6
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf "$ARTIFACT_DIR" "$P5I_ARTIFACT_DIR" "$TOOLCHAIN_DIR" \
               "$GITHUB_WORKSPACE/toolchains" \
               "$GITHUB_WORKSPACE/p6-outer-replay" \
               "$GITHUB_WORKSPACE/p6-resukisu-replay"
        mkdir -p "$ARTIFACT_DIR" "$TOOLCHAIN_DIR"

        cat > "$ARTIFACT_DIR/00-plan.txt" <<'EOF'
        CLEAN GEN1 P6 v5 - deterministic Image + DTB build

        P6-v1 exposed the required ReSukiSU SELinux static exports.
        P6-v2 and v3 were workflow-gate mistakes and did not invalidate the source fix.
        P6-v4 proved on the real GitHub runner that the corrected static-export checker
        returns success and finds both write_op and sel_handle_status_ops. v4 then failed
        only because an additional isolated 'drivers/kernelsu/' subdir compile was used as
        a preflight. That partial build bypasses normal full-kernel dependency generation
        and therefore lacked include/generated/compile.h and SELinux flask.h.
        P6-v5 removes that artificial partial compile entirely. After the already-proven
        static-export checker it proceeds directly to canonical full Build A.

        Input Last Good:
          CLEAN GEN1 P5I

        P6 source policy:
        - restore exact P5I tree and selected ReSukiSU bundle;
        - fresh upstream-drift gate BEFORE the first full kernel compile;
        - exactly one required ReSukiSU static-export source repair is permitted;
        - permitted scope: security/selinux/selinuxfs.c only;
        - remove static from write_op and sel_handle_status_ops exactly as documented;
        - module_load_filter remains excluded.

        Toolchain:
        - Android clang-r416183b pinned to prebuilts commit aa2e4a...

        Important effective configuration model:
        - real VEUX .config remains CONFIG_KSU_MANUAL_HOOK=y;
        - real VEUX .config remains # CONFIG_KSU_SUSFS is not set;
        - ReSukiSU Kconfig places MANUAL_HOOK and SUSFS in one choice, so native
          Kconfig cannot represent the CLEAN GEN1 hybrid source contract;
        - P6 therefore enables SUSFS and all currently integrated SUSFS features
          through GNU make CONFIG_* command-line overrides plus matching KCFLAGS;
        - this preserves MANUAL_HOOK from generated autoconf while compiling the
          SUSFS bridge and SUSFS objects at the same time;
        - this is recorded explicitly and is NOT reported as Kconfig-native dual mode.

        Determinism:
        - Build A from clean out-p6
        - archive hashes/output
        - delete out-p6 completely
        - Build B again at the same absolute out-p6 path
        - compare Image, VEUX DTB, vmlinux, System.map, .config and complete DTB hash list

        Outputs:
        - Image
        - VEUX DTB
        - base .config
        - effective-build-config manifest
        - complete provenance/build/reproducibility evidence

        No boot.img, AnyKernel3 ZIP, device access or flashing in P6.
        EOF
    - name: Install P6 dependencies
      shell: bash
      run: |2

        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates cpio curl flex git jq \
          libelf-dev libncurses-dev libssl-dev patch python3 rsync xz-utils zstd
    - name: Checkout exact VEUX vendor source
      uses: actions/checkout@v6
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: '20240619'
        path: kernel
        fetch-depth: 1
        persist-credentials: false
    - name: Download accepted P5I artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.P5I_ARTIFACT_NAME }}
        path: p5i-artifact
        github-token: ${{ github.token }}
        run-id: ${{ env.P5I_RUN_ID }}
    - name: Authenticate P5I Last Good
      shell: bash
      run: |2

        set -euo pipefail
        (
          cd "$P5I_ARTIFACT_DIR/restore-kit"
          sha256sum -c SHA256SUMS
        ) > "$ARTIFACT_DIR/01-p5i-restore-sha256.txt"

        jq -e \
          --arg commit "$EXPECTED_P5I_COMMIT" \
          --arg tree "$EXPECTED_P5I_TREE" \
          --arg rhead "$EXPECTED_RESUKISU_HEAD" \
          --arg rtree "$EXPECTED_RESUKISU_TREE" \
          '.stage=="CLEAN_GEN1_P5I" and
           .p5i_commit==$commit and
           .p5i_tree==$tree and
           .resukisu_head==$rhead and
           .resukisu_tree==$rtree and
           .normal_path_open_redirect_integrated==true and
           .tmpfile_open_redirect_integrated==true and
           .o_path_open_redirect_integrated==true and
           .vfs_readlink_open_redirect_integrated==true and
           .proc_readlink_open_redirect_integrated==true and
           .vfs_statfs_open_redirect_integrated==true and
           .fdinfo_mnt_id_open_redirect_integrated==true and
           .proc_maps_open_redirect_integrated==true and
           .proc_maps_caller_held_srcu==true and
           .proc_maps_redirect_pointer_used_only_under_srcu==true and
           .susfs_runtime_enabled==false and
           .full_kernel_build_performed==false' \
          "$P5I_ARTIFACT_DIR/restore-kit/manifest.json" \
          > "$ARTIFACT_DIR/01-p5i-manifest-auth.json"

        grep -Fxq 'CLEAN_GEN1_P5I_PROC_MAPS_OPEN_REDIRECT_SRCU=PASS' \
          "$P5I_ARTIFACT_DIR/16-result.txt"
        grep -Fxq 'P5I_MAPS_SYMBOL_CONTRACT=PASS' \
          "$P5I_ARTIFACT_DIR/11-object-builds.txt"

        {
          echo "P5I_RESTORE_ARTIFACT=PASS"
          echo "P5I_CHECKPOINT_AUTH=PASS"
          echo "P5I_INPUT_TREE=$EXPECTED_P5I_TREE"
          echo "P6_FULL_BUILD_ALLOWED=YES"
        } | tee "$ARTIFACT_DIR/01-p5i-auth.txt"
    - name: Fresh upstream audit immediately before full build
      shell: bash
      run: |2

        set -euo pipefail
        current_resu="$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main | awk '{print $1}')"
        current_54="$(git ls-remote "$SUSFS_REPO" refs/heads/kernel-5.4 | awk '{print $1}')"
        current_510="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android12-5.10 | awk '{print $1}')"
        current_515="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android13-5.15 | awk '{print $1}')"
        current_61="$(git ls-remote "$SUSFS_REPO" refs/heads/gki-android14-6.1 | awk '{print $1}')"

        {
          echo "RESUKISU_CURRENT=$current_resu"
          echo "RESUKISU_REVIEWED=$RESUKISU_SNAPSHOT_HEAD"
          echo "SUSFS_54_CURRENT=$current_54"
          echo "SUSFS_54_REVIEWED=$SUSFS_54_HEAD"
          echo "SUSFS_510_CURRENT=$current_510"
          echo "SUSFS_510_REVIEWED=$SUSFS_510_HEAD"
          echo "SUSFS_515_CURRENT=$current_515"
          echo "SUSFS_515_REVIEWED=$SUSFS_515_HEAD"
          echo "SUSFS_61_CURRENT=$current_61"
          echo "SUSFS_61_REVIEWED=$SUSFS_61_HEAD"
        } > "$ARTIFACT_DIR/02-upstream-current.txt"

        test "$current_resu" = "$RESUKISU_SNAPSHOT_HEAD"
        test "$current_54" = "$SUSFS_54_HEAD"
        test "$current_510" = "$SUSFS_510_HEAD"
        test "$current_515" = "$SUSFS_515_HEAD"
        test "$current_61" = "$SUSFS_61_HEAD"

        echo "P6_FRESH_UPSTREAM_AUDIT=PASS" | tee -a "$ARTIFACT_DIR/02-upstream-current.txt"
    - name: Restore exact accepted P5I outer tree
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
        test -z "$(git status --porcelain)"

        PATCH="$P5I_ARTIFACT_DIR/restore-kit/vendor-20240619-to-p5i-outer.patch"
        git apply --check --binary "$PATCH"
        git apply --index --binary "$PATCH"
        test "$(git write-tree)" = "$EXPECTED_P5I_TREE"

        GIT_AUTHOR_NAME="CLEAN-GEN1 Restore" \
        GIT_AUTHOR_EMAIL="clean-gen1@invalid.local" \
        GIT_AUTHOR_DATE="2026-09-01T00:00:00Z" \
        GIT_COMMITTER_NAME="CLEAN-GEN1 Restore" \
        GIT_COMMITTER_EMAIL="clean-gen1@invalid.local" \
        GIT_COMMITTER_DATE="2026-09-01T00:00:00Z" \
          git commit -m "CLEAN GEN1 restore accepted P5I outer tree"

        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P5I_TREE"
        echo "P5I_RESTORED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

        echo "P5I_OUTER_RESTORE_FOR_P6=PASS" \
          | tee "$ARTIFACT_DIR/03-p5i-outer-restore.txt"
    - name: Restore exact accepted P5I ReSukiSU
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        rm -rf KernelSU
        git init KernelSU >/dev/null
        git -C KernelSU fetch \
          "$P5I_ARTIFACT_DIR/restore-kit/resukisu-p5i-full.bundle" \
          refs/heads/clean-gen1-p5i-resukisu:refs/heads/clean-gen1-p5i-resukisu
        git -C KernelSU checkout --detach refs/heads/clean-gen1-p5i-resukisu >/dev/null

        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_RESUKISU_TREE"
        test -z "$(git -C KernelSU status --porcelain)"

        mkdir -p .git/info
        touch .git/info/exclude
        grep -Fxq '/KernelSU/' .git/info/exclude || echo '/KernelSU/' >> .git/info/exclude

        test -L drivers/kernelsu
        test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
        test -z "$(git status --porcelain)"

        echo "P5I_RESUKISU_RESTORE_FOR_P6=PASS" \
          | tee "$ARTIFACT_DIR/04-p5i-resukisu-restore.txt"
    - name: Audit P6 hybrid Manual Hook plus forced SUSFS contract
      working-directory: kernel
      shell: bash
      run: |2

        set -euo pipefail
        test "$(make -s kernelversion)" = "5.4.274"
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P5I_TREE"
        test "$(git -C KernelSU rev-parse HEAD)" = "$EXPECTED_RESUKISU_HEAD"
        test "$(git -C KernelSU rev-parse HEAD^{tree})" = "$EXPECTED_RESUKISU_TREE"

        grep -Fxq 'CONFIG_KSU=y' arch/arm64/configs/veux_defconfig
        grep -Fxq 'CONFIG_KSU_MANUAL_HOOK=y' arch/arm64/configs/veux_defconfig
        grep -Fxq '# CONFIG_KSU_SUSFS is not set' arch/arm64/configs/veux_defconfig
        grep -Fxq 'CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y' arch/arm64/configs/veux_defconfig
        grep -Fxq 'CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y' arch/arm64/configs/veux_defconfig
        grep -Fxq 'CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y' arch/arm64/configs/veux_defconfig

        # ReSukiSU Kconfig deliberately makes MANUAL_HOOK and SUSFS mutually exclusive.
        python3 - <<'PY' > "$ARTIFACT_DIR/05-hook-choice-audit.txt"
        from pathlib import Path

        text = Path("KernelSU/kernel/Kconfig").read_text(encoding="utf-8")
        choice = text.find('choice')
        end = text.find('endchoice', choice)
        if choice < 0 or end < 0:
            raise SystemExit("ReSukiSU hooking-method choice missing")
        body = text[choice:end]
        required = (
            "config KSU_TRACEPOINT_HOOK",
            "config KSU_MANUAL_HOOK",
            "config KSU_SUSFS",
        )
        for item in required:
            if item not in body:
                raise SystemExit("hooking choice missing " + item)

        exec_text = Path("fs/exec.c").read_text(encoding="utf-8")
        open_text = Path("fs/open.c").read_text(encoding="utf-8")
        stat_text = Path("fs/stat.c").read_text(encoding="utf-8")

        if "#ifdef CONFIG_KSU_MANUAL_HOOK" not in exec_text:
            raise SystemExit("manual exec hook guard missing")
        if "#ifdef CONFIG_KSU_SUSFS" not in open_text:
            raise SystemExit("SUSFS faccessat bridge guard missing")
        if "#ifdef CONFIG_KSU_SUSFS" not in stat_text:
            raise SystemExit("SUSFS stat bridge guard missing")
        if "#ifdef CONFIG_KSU_MANUAL_HOOK" not in stat_text:
            raise SystemExit("manual fstat return hooks missing")

        print("P6_KCONFIG_NATIVE_DUAL_SELECTION=NO")
        print("P6_MANUAL_EXEC_HOOK_REQUIRED=YES")
        print("P6_SUSFS_STRUCT_FILENAME_BRIDGE_REQUIRED=YES")
        print("P6_EFFECTIVE_HYBRID_BUILD_REQUIRED=YES")
        print("P6_HOOK_MODE_CONTRACT=PASS")
        PY

        grep -Fq 'P6_HOOK_MODE_CONTRACT=PASS' "$ARTIFACT_DIR/05-hook-choice-audit.txt"

        # Explicit identity / exclusions.
        grep -Fq 'CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := 35102' KernelSU/kernel/Kbuild
        test ! -e KernelSU/kernel/feature/module_load_filter.c

        cat > "$ARTIFACT_DIR/05-effective-build-config.txt" <<EOF
        P6_EFFECTIVE_HOOK_MODE=MANUAL_HOOK_PLUS_FORCED_SUSFS
        P6_KCONFIG_NATIVE_DUAL_SELECTION=NO
        P6_BASE_DEFCONFIG_KSU_MANUAL_HOOK=YES
        P6_BASE_DEFCONFIG_KSU_SUSFS=NO
        P6_EFFECTIVE_SUSFS_ENABLEMENT=MAKE_COMMAND_LINE_PLUS_KCFLAGS
        P6_KSU_VERSION=$EXPECTED_KSU_VERSION
        P6_SUSFS_MAKE_ARGS=$P6_SUSFS_MAKE_ARGS
        P6_EFFECTIVE_KCFLAGS=$P6_EFFECTIVE_KCFLAGS
        P6_MODULE_LOAD_FILTER_INCLUDED=NO
        EOF
    - name: Integrate required ReSukiSU 5.4 static symbol exports
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        FILE="$P6_REQUIRED_EXPORT_FILE"
        test -s "$FILE"

        # This 5.4 tree has selinux_state, so the 4.17- conditional export set
        # (selinux_status_page/lock, sel_mutex, policy_rwlock) is not applicable.
        grep -Fq 'struct selinux_state {' security/selinux/include/security.h

        cp "$FILE" "$ARTIFACT_DIR/05a-selinuxfs-before.c"

        python3 - <<'PY'
        from pathlib import Path

        path = Path("security/selinux/selinuxfs.c")
        s = path.read_text(encoding="utf-8")

        old_write = "static ssize_t (*const write_op[])(struct file *, char *, size_t) = {"
        new_write = "ssize_t (*const write_op[])(struct file *, char *, size_t) = {"

        old_status = "static const struct file_operations sel_handle_status_ops = {"
        new_status = "const struct file_operations sel_handle_status_ops = {"

        if s.count(old_write) != 1:
            raise SystemExit(
                f"expected exactly one VEUX static write_op definition, got {s.count(old_write)}"
            )
        if s.count(old_status) != 1:
            raise SystemExit(
                "expected exactly one static sel_handle_status_ops definition, "
                f"got {s.count(old_status)}"
            )
        s = s.replace(old_write, new_write, 1)
        s = s.replace(old_status, new_status, 1)

        # Validate exact post-transform line state. Do not use substring membership here:
        # the non-static declaration is itself a substring of the original static line.
        if s.count(old_write) != 0:
            raise SystemExit("static write_op definition remains after transform")
        if s.count(old_status) != 0:
            raise SystemExit("static sel_handle_status_ops definition remains after transform")
        if s.count(new_write) != 1:
            raise SystemExit(
                f"expected exactly one exported write_op definition, got {s.count(new_write)}"
            )
        if s.count(new_status) != 1:
            raise SystemExit(
                "expected exactly one exported sel_handle_status_ops definition, "
                f"got {s.count(new_status)}"
            )

        path.write_text(s, encoding="utf-8")
        PY

        grep -Fq 'ssize_t (*const write_op[])(struct file *, char *, size_t) = {' "$FILE"
        grep -Fq 'const struct file_operations sel_handle_status_ops = {' "$FILE"
        ! grep -Fq 'static ssize_t (*const write_op[])(struct file *, char *, size_t) = {' "$FILE"
        ! grep -Fq 'static const struct file_operations sel_handle_status_ops = {' "$FILE"

        git diff --check
        mapfile -t changed < <(git diff --name-only)
        test "${#changed[@]}" -eq 1
        test "${changed[0]}" = "$P6_REQUIRED_EXPORT_FILE"

        git diff --binary -- "$P6_REQUIRED_EXPORT_FILE" \
          > "$ARTIFACT_DIR/p5i-to-p6-static-symbol-exports.patch"
        test -s "$ARTIFACT_DIR/p5i-to-p6-static-symbol-exports.patch"

        git add "$P6_REQUIRED_EXPORT_FILE"
        git diff --cached --check

        P6_SOURCE_TREE="$(git write-tree)"
        test -n "$P6_SOURCE_TREE"

        GIT_AUTHOR_NAME="CLEAN-GEN1 P6" \
        GIT_AUTHOR_EMAIL="clean-gen1@invalid.local" \
        GIT_AUTHOR_DATE="2026-09-01T00:00:00Z" \
        GIT_COMMITTER_NAME="CLEAN-GEN1 P6" \
        GIT_COMMITTER_EMAIL="clean-gen1@invalid.local" \
        GIT_COMMITTER_DATE="2026-09-01T00:00:00Z" \
          git commit -m "CLEAN GEN1 P6 export required ReSukiSU SELinux symbols"

        P6_SOURCE_COMMIT="$(git rev-parse HEAD)"
        test "$(git rev-parse HEAD^{tree})" = "$P6_SOURCE_TREE"
        test -z "$(git status --porcelain)"

        {
          echo "P6_SOURCE_TREE=$P6_SOURCE_TREE"
          echo "P6_SOURCE_COMMIT=$P6_SOURCE_COMMIT"
        } >> "$GITHUB_ENV"

        {
          echo "P6_PARENT_RUN_ID=$P6_PARENT_RUN_ID"
          echo "P6_PARENT_FAILURE=$P6_PARENT_FAILURE"
          echo "P6_V4_FAILURE_CLASS=WORKFLOW_INVALID_ISOLATED_RESUKISU_SUBDIR_PREFLIGHT"
          echo "P6_V5_SOURCE_TRANSFORM_CHANGED_FROM_V4=NO"
          echo "P6_V3_FAILURE_CLASS=WORKFLOW_PREFLIGHT_MAKEFILE_HAS_NO_STANDALONE_TARGET"
          echo "P6_V4_SOURCE_TRANSFORM_CHANGED_FROM_V3=NO"
          echo "P6_V2_FAILURE_CLASS=WORKFLOW_FALSE_POSITIVE_STATIC_EXPORT_SUBSTRING_GUARD"
          echo "P6_V3_EXACT_SOURCE_TRANSFORM_REPLAY_REQUIRED=YES"
          echo "P6_STATIC_EXPORT_WRITE_OP=PASS"
          echo "P6_STATIC_EXPORT_SEL_HANDLE_STATUS_OPS=PASS"
          echo "P6_SELINUX_STATE_PRESENT=YES"
          echo "P6_4_17_MINUS_CONDITIONAL_EXPORT_SET_REQUIRED=NO"
          echo "P6_STATIC_EXPORT_CHANGED_FILE=$P6_REQUIRED_EXPORT_FILE"
          echo "P6_STATIC_EXPORT_CHANGE_SCOPE=PASS"
          echo "P6_SOURCE_COMMIT=$P6_SOURCE_COMMIT"
          echo "P6_SOURCE_TREE=$P6_SOURCE_TREE"
          echo "P6_STATIC_SYMBOL_EXPORT_INTEGRATION=PASS"
        } | tee "$ARTIFACT_DIR/05a-static-symbol-exports.txt"
    - name: Install pinned Android clang-r416183b
      shell: bash
      run: |2

        set -euo pipefail
        url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz"
        curl --fail --location --retry 3 "$url" \
          -o "$RUNNER_TEMP/clang-r416183b.tar.gz"

        sha256sum "$RUNNER_TEMP/clang-r416183b.tar.gz" \
          | tee "$ARTIFACT_DIR/06-clang-archive.sha256"

        tar -xzf "$RUNNER_TEMP/clang-r416183b.tar.gz" -C "$TOOLCHAIN_DIR"
        echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

        "$TOOLCHAIN_DIR/bin/clang" --version \
          | tee "$ARTIFACT_DIR/06-clang-version.txt"
        "$TOOLCHAIN_DIR/bin/ld.lld" --version \
          | tee -a "$ARTIFACT_DIR/06-clang-version.txt"

        grep -q 'r416183b' "$ARTIFACT_DIR/06-clang-version.txt"

        for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-size llvm-strip
        do
          test -x "$TOOLCHAIN_DIR/bin/$tool"
        done

        {
