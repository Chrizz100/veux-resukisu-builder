name: 45P7 - VEUX Final ReSukiSU SUSFS Preflight Step Boundary Closure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ARCH: arm64

      COMMON_REF: "android11-5.4.274_r00"
      STOCK_REF: "veux-r-oss"

      STABILITY_REVERT: "f74e5c1b7c3f3e42f694e5ab524f95f62a0dab80"

      EXPECTED_CANDIDATE_TREE: "5d25b7e0124d7fb695f3f07b45928fcb5780d0e8"

      LB_CAPACITY_COMMIT: "2c1495be9eabac845acc8da45f070622d6455091"

      IDLE_SCREEN_COMMIT: "64e34240600a0c90072972a6c3d86f1d6ec85c53"
      IDLE_EXPOSE_COMMIT: "4ac606c780ae02a075d75a2703be68880761531a"
      IDLE_NOTIFIER_COMMIT: "8bc9cc6e197c0d1cf166ed94bb53ce41add1c828"

      IDLE_OPTIMIZE_COMMIT: "1d49e9b3308a7eacd75ed67f4112914e74ee60db"

      CPUFREQ_MIN_COMMIT: "44242207c9afe2b3e7fb5bdc18da42e918043c63"
      CPUFREQ_MAX_COMMIT: "3a25ef84be1d26cf0ddd526534358febd04529c5"

      EXPECTED_CPUFREQ_BEFORE_SHA256: "e1fa642651d4cf66fe59bf0eb615974bb403057dad5daeb3b7a8b1e9c06de646"
      EXPECTED_CPUFREQ_AFTER_SHA256: "9ac85ecaafbdddfb43d2b361183b455448ce400fad1296ae290510ad33039ceb"

      EXPECTED_STORE_ONE_BEFORE_SHA256: "5b85f632ef77eeee55d4b404a08e9d96ec87af0201ba1d634150c3ef418f37e3"
      EXPECTED_STORE_ONE_AFTER_SHA256: "0bbe18c9eee2059f4d2ec636b604f50bda90b131261e857b0dbc717c512ef28e"

      EXPECTED_CPUFREQ_TARGETED_DIFF_SHA256: "b431c73a2bfee36e093dc87846c628dd598a84499db66fc12a9930ff948e0b43"

      EXPECTED_IDLE_RESTORE_DIFF_SHA256: "33b144f63893d7a45d6c8e301aacf6ca1faa7a87088c19ab8bfdc1ecb29a0fd5"

      EXPECTED_LPM_AFTER_SHA256: "6805651af0a60905ce04356df3a538be15e94b6c8599a1d35e414d0a50b67094"
      EXPECTED_CPUIDLE_CORE_AFTER_SHA256: "e7f7fba62ce2bbe82f23c6bfbf5a103161d1c8013b85f7f48e4c036758f6a603"
      EXPECTED_CPUIDLE_HEADER_AFTER_SHA256: "9149734aa0eef1bba2e7ae16902dfd3aa203f23fe41657ce7df50ab947620506"

      EXPECTED_SCHEDUTIL_BEFORE_SHA256: "9d56491a427ee12f1156ae907c5aa647bf1a1b35bf13c725a08e73ef295274b7"
      EXPECTED_SCHEDUTIL_AFTER_SHA256: "987c9598f16b22a1e7b343475691687d309122de447494cd1a2b5ea8cbbafffc"

      EXPECTED_CASS_DIFF_SHA256: "67abb81be8c2d7727c3e4c8a92419c9e9a3d97ee3d3e5355d3acabce34adf659"

      EXPECTED_XIAOMI_PELT_SHA256: "bad23ba491cc5d4669936507b392888765aa65fd8063b2a95a492d6b0dca0cb0"

      EXPECTED_HZ_KCONFIG_SHA256: "685e9a79f3dbf17e9bd5b402dfd25ad014886fbe1b6975a0913b3621519cd7fe"

      RESUKISU_COMMIT: "faccf4c5edc7be37776216e7d43dd3dca0239331"
      EXPECTED_RESUKISU_VERSION: "v4.2.0-rc1-faccf4c5@ReSukiSU"

      BACKPORT_REPO: "JackA1ltman/NonGKI_Kernel_Build_2nd"
      BACKPORT_COMMIT: "90d9f91d43ecaaee044e79c75a01d6a512508eb3"
      BACKPORT_PATCH_PATH: "Patches/Patch/susfs_patch_to_5.4.patch"
      BACKPORT_PATCH_BLOB: "7533876188b65d78940b705d8e4462dbdc31c0a2"
      BACKPORT_PATCH_SHA256: "21233ce9a0a02590d977cd193aa493b23df7008e73fed402901e033a303b9631"

      EXPECTED_TASK_MMU_REJECT_SHA256: "f8daf0861fd9608e6ceb11557c34ec09368fff8e4123992d3453c740f61c4996"

      WORKFLOW17_ORIGINAL_DIFF_SHA256: "afdbab86f738aead94a12f896eeb5b74008dcf1c4fe5dfec4682651491a3de1e"

      EXPECTED_WARNING_CLEAN_DIFF_SHA256: "5cca5614c8a34afc3e9c9d9719f8f0ed52dbf4d2296be15797dc9530630d9665"

      EXPECTED_NORMALIZED_ADAPTATION_SHA256: "43906d8a85bc0a1d175f5a2dd7903ae3a564fa8af891b9309a05de6d7edda135"

      EXPECTED_ADAPTATION_BYTES: "145803"

      WORKFLOW17_OLD_DEFCONFIG_INDEX: "index a841afe0a397..69cc6a8f1aa5 100644"
      CUMULATIVE_NEW_DEFCONFIG_INDEX: "index c8b4616de807..78e35057b154 100644"

      EXPECTED_CUMULATIVE_CONFIG_SHA256: "d7cd955abd59da45804acc9c5e450cf8fc953da3e66bbc274212b40ee9a0b372"

      EXPECTED_KNOWN_SUSFS_DIFFCHECK_SHA256: "eacb9bc8266ed665b6867709599450f54a47426dc09e979eb4ed2ede839a26f8"
      EXPECTED_KNOWN_SUSFS_DIFFCHECK_LINE_COUNT: "15"
      EXPECTED_KNOWN_SUSFS_WHITESPACE_ISSUE_COUNT: "8"

      WORKFLOW17_BLOB: "a87d1c8ec8dab938101337dd9786c1773d2c5f19"
      WORKFLOW44C_BLOB: "95fc204bd6d5355c2f6a1c0e75eefa68a053f576"
      WORKFLOW45P3_BLOB: "c0c791909e83cd3183cdaf2afc087e6d9d1c8a23"
      WORKFLOW45P4_BLOB: "cdcc8f96c22187b227e30e6a47ded92eceafd62c"
      WORKFLOW45P5_BLOB: "a3ff37c857312ee124fd76105ced390892605080"
      WORKFLOW45P6_BLOB: "75caad43d9e791dffe2d23fa24f09010a12034a0"

      CLANG_PREBUILT_COMMIT: "aa2e4a514a6c85eebcc4a27149eaf9244e951a1e"

      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      REFERENCE_DIR: ${{ github.workspace }}/workflow-reference
      PATCH_DIR: ${{ github.workspace }}/reference-patches
      OUT_DIR: out
      ARTIFACT_DIR: ${{ github.workspace }}/final-preflight-step-boundary-closure

    steps:
      - name: Prepare 45P7 closure
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$TOOLCHAIN_DIR" \
            "$PATCH_DIR" \
            "$ARTIFACT_DIR"

          cat > "$ARTIFACT_DIR/PLAN.txt" <<'EOF'
          VEUX Final ReSukiSU + SUSFS Preflight Step-Boundary Closure
          ===========================================================

          Historical findings:

          45P:
          - cumulative 44C replay succeeded
          - SUSFS base and ReSukiSU identity succeeded
          - orchestration incorrectly expected Workflow 17's adaptation
            diff before its separate verification step

          45P2:
          - warning-clean adaptation itself returned exit code 0

          45P3:
          - proved the new raw adaptation differed only because the
            cumulative defconfig baseline has different Git blob IDs

          45P4:
          - semantic adaptation equivalence to Workflow 17 proved
          - new cumulative config SHA established
          - stopped only on inherited SUSFS whitespace in a later global
            git diff --check

          45P5:
          - attempted tailored whitespace closure
          - one run timed out in apt mirror access
          - second run exposed a nested GitHub Actions environment boundary

          45P6:
          - contained an incorrect IDLE_OPTIMIZE_COMMIT SHA
          - therefore must not be used further

          45P7 correction:

          - exact correct IDLE_OPTIMIZE_COMMIT restored:
            1d49e9b3308a7eacd75ed67f4112914e74ee60db

          - every historic 45P4 run block which depends on $GITHUB_ENV
            is executed as its OWN GitHub Actions step

          - therefore GitHub itself propagates CANDIDATE_TIP,
            COMMON_SHA, CUMULATIVE_SHA, CUMULATIVE_TREE and the final
            config SHA exactly as originally designed

          - dependency installation uses bounded retries/timeouts and
            removes the unreliable Azure archive mirror where present

          - no kernel semantics are changed
          - no ReSukiSU semantics are changed
          - no SUSFS semantics are changed

          Expected final cumulative config:
          d7cd955abd59da45804acc9c5e450cf8fc953da3e66bbc274212b40ee9a0b372

          No Image build.
          No boot.img.
          No flashable ZIP.
          No device access.
          No flashing.
          EOF

      - name: Install dependencies robustly
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail

          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i \
              's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
              /etc/apt/apt-mirrors.txt
          fi

          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i \
              's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
              /etc/apt/sources.list
          fi

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i \
              's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi

          sudo timeout 600 \
            apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update

          sudo timeout 600 \
            apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends \
              bc \
              bison \
              build-essential \
              ca-certificates \
              cpio \
              curl \
              flex \
              git \
              libelf-dev \
              libncurses-dev \
              libssl-dev \
              patch \
              python3 \
              python-is-python3 \
              rsync \
              xz-utils \
              zstd

          {
            echo "APT_MIRROR_GUARD=PASS"
            echo "APT_UPDATE=PASS"
            echo "DEPENDENCIES=PASS"
          } | tee "$ARTIFACT_DIR/DEPENDENCY-STATE.txt"

      - name: Install exact Android clang-r416183b
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 300 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz" \
            -o "${RUNNER_TEMP}/clang-r416183b.tar.gz"

          tar \
            -xzf "${RUNNER_TEMP}/clang-r416183b.tar.gz" \
            -C "$TOOLCHAIN_DIR"

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

          "$TOOLCHAIN_DIR/bin/clang" --version \
            | tee "$ARTIFACT_DIR/clang-version.txt"

          "$TOOLCHAIN_DIR/bin/ld.lld" --version \
            | tee -a "$ARTIFACT_DIR/clang-version.txt"

          if ! "$TOOLCHAIN_DIR/bin/clang" --version \
            | grep -q 'r416183b'
          then
            echo "ERROR: expected clang-r416183b"
            exit 1
          fi

          for TOOL in \
            clang \
            ld.lld \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-size \
            llvm-strip
          do
            if [ ! -x "$TOOLCHAIN_DIR/bin/$TOOL" ]; then
              echo "ERROR: missing toolchain binary: $TOOL"
              exit 1
            fi
          done

          echo "CLANG_R416183B=PASS" \
            | tee "$ARTIFACT_DIR/TOOLCHAIN-STATE.txt"

      - name: Checkout exact workflow references
        uses: actions/checkout@v7
        with:
          repository: Chrizz100/veux-resukisu-builder
          ref: main
          fetch-depth: 1
          path: workflow-reference
          persist-credentials: false

      - name: Verify historical workflow blobs
        shell: bash
        run: |
          set -euo pipefail

          declare -A EXPECTED

          EXPECTED["17-susfs-final-release-candidate.yml"]="$WORKFLOW17_BLOB"
          EXPECTED["44C-restore-cpufreq-min-max-sysfs-full-build.yml"]="$WORKFLOW44C_BLOB"
          EXPECTED["45P3-final-resukisu-susfs-integration-closure.yml"]="$WORKFLOW45P3_BLOB"
          EXPECTED["45P4-final-resukisu-susfs-semantic-integration-closure.yml"]="$WORKFLOW45P4_BLOB"
          EXPECTED["45P5-final-resukisu-susfs-preflight-closure.yml"]="$WORKFLOW45P5_BLOB"
          EXPECTED["45P6-final-resukisu-susfs-preflight-env-closure.yml"]="$WORKFLOW45P6_BLOB"

          : > "$ARTIFACT_DIR/WORKFLOW-BLOB-STATE.txt"

          for FILE in "${!EXPECTED[@]}"; do
            PATHNAME=".github/workflows/$FILE"

            ACTUAL="$(
              git -C "$REFERENCE_DIR" \
                hash-object \
                "$PATHNAME"
            )"

            if [ "$ACTUAL" != "${EXPECTED[$FILE]}" ]; then
              echo "ERROR: workflow blob changed: $FILE"
              echo "Expected: ${EXPECTED[$FILE]}"
              echo "Actual:   $ACTUAL"
              exit 1
            fi

            echo "$FILE=$ACTUAL" \
              >> "$ARTIFACT_DIR/WORKFLOW-BLOB-STATE.txt"
          done

          echo "HISTORICAL_WORKFLOW_BLOBS=PASS" \
            >> "$ARTIFACT_DIR/WORKFLOW-BLOB-STATE.txt"

          cat "$ARTIFACT_DIR/WORKFLOW-BLOB-STATE.txt"

      - name: Create exact run block extractor
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/extract-run-block.py" <<'PY'
          import sys
          from pathlib import Path

          if len(sys.argv) != 4:
              raise SystemExit(
                  "usage: extract-run-block.py WORKFLOW STEP_NAME OUTPUT"
              )

          workflow = Path(sys.argv[1])
          step_name = sys.argv[2]
          output = Path(sys.argv[3])

          lines = workflow.read_text(
              encoding="utf-8"
          ).splitlines(
              keepends=True
          )

          marker = f"      - name: {step_name}"

          starts = [
              i
              for i, line in enumerate(lines)
              if line.rstrip("\n") == marker
          ]

          if len(starts) != 1:
              raise SystemExit(
                  f"{step_name!r}: expected one step, got {len(starts)}"
              )

          start = starts[0]
          run_index = None

          for i in range(start + 1, len(lines)):
              if (
                  i > start + 1
                  and lines[i].startswith("      - name: ")
              ):
                  break

              if lines[i].strip() == "run: |":
                  run_index = i
                  break

          if run_index is None:
              raise SystemExit(
                  f"{step_name!r}: run block not found"
              )

          end = len(lines)

          for i in range(run_index + 1, len(lines)):
              if lines[i].startswith("      - name: "):
                  end = i
                  break

          block = lines[
              run_index + 1:
              end
          ]

          nonblank = [
              line
              for line in block
              if line.strip()
          ]

          if not nonblank:
              raise SystemExit(
                  f"{step_name!r}: empty run block"
              )

          def leading_spaces(line):
              return len(line) - len(line.lstrip(" "))

          indent = min(
              leading_spaces(line)
              for line in nonblank
          )

          if indent < 10:
              raise SystemExit(
                  f"{step_name!r}: unexpected indentation {indent}"
              )

          extracted = "".join(
              line[indent:]
              if line.strip()
              else "\n"
              for line in block
          )

          output.write_text(
              extracted,
              encoding="utf-8"
          )
          PY

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P4-final-resukisu-susfs-semantic-integration-closure.yml" \
            "Recreate exact Candidate 2" \
            "${RUNNER_TEMP}/extractor-selftest.sh"

          if [ ! -s "${RUNNER_TEMP}/extractor-selftest.sh" ]; then
            echo "ERROR: extractor self-test failed"
            exit 1
          fi

          echo "RUN_BLOCK_EXTRACTOR=PASS" \
            | tee "$ARTIFACT_DIR/RUN-BLOCK-EXTRACTOR.txt"

      - name: Checkout exact VEUX source
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: "20240619"
          fetch-depth: 0
          path: kernel
          persist-credentials: false

      - name: Recreate exact Candidate 2
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p7-recreate-candidate.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P4-final-resukisu-susfs-semantic-integration-closure.yml" \
            "Recreate exact Candidate 2" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

          echo "STEP_BOUNDARY_RECREATE_CANDIDATE=PASS" \
            | tee "$ARTIFACT_DIR/STEP-01-CANDIDATE.txt"

      - name: Verify Candidate environment propagation
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CANDIDATE_TIP:-}" ]; then
            echo "ERROR: CANDIDATE_TIP did not cross Actions step boundary"
            exit 1
          fi

          if [ -z "${COMMON_SHA:-}" ]; then
            echo "ERROR: COMMON_SHA did not cross Actions step boundary"
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$CANDIDATE_TIP" ]; then
            echo "ERROR: CANDIDATE_TIP does not identify current Candidate"
            exit 1
          fi

          {
            echo "GITHUB_ENV_STEP_BOUNDARY=PASS"
            echo "CANDIDATE_TIP=$CANDIDATE_TIP"
            echo "COMMON_SHA=$COMMON_SHA"
          } | tee "$ARTIFACT_DIR/CANDIDATE-ENV-STATE.txt"

      - name: Fetch official Xiaomi VEUX reference
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p7-fetch-xiaomi.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P4-final-resukisu-susfs-semantic-integration-closure.yml" \
            "Fetch official Xiaomi VEUX reference" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Reapply exact approved 44C cumulative corrections
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          if [ "$IDLE_OPTIMIZE_COMMIT" != "1d49e9b3308a7eacd75ed67f4112914e74ee60db" ]; then
            echo "ERROR: IDLE_OPTIMIZE_COMMIT guard failed"
            exit 1
          fi

          SCRIPT="$RUNNER_TEMP/45p7-replay-44c.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P4-final-resukisu-susfs-semantic-integration-closure.yml" \
            "Reapply exact approved 44C cumulative corrections" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

          echo "CUMULATIVE_44C_REPLAY_STEP=PASS" \
            | tee "$ARTIFACT_DIR/STEP-02-44C.txt"

      - name: Commit isolated cumulative baseline
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p7-commit-baseline.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P4-final-resukisu-susfs-semantic-integration-closure.yml" \
            "Commit isolated cumulative baseline" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Verify cumulative environment propagation
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CUMULATIVE_SHA:-}" ]; then
            echo "ERROR: CUMULATIVE_SHA did not cross Actions step boundary"
            exit 1
          fi

          if [ -z "${CUMULATIVE_TREE:-}" ]; then
            echo "ERROR: CUMULATIVE_TREE did not cross Actions step boundary"
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$CUMULATIVE_SHA" ]; then
            echo "ERROR: CUMULATIVE_SHA does not identify current baseline"
            exit 1
          fi

          if [ "$(git rev-parse HEAD^{tree})" != "$CUMULATIVE_TREE" ]; then
            echo "ERROR: CUMULATIVE_TREE mismatch"
            exit 1
          fi

          {
            echo "CUMULATIVE_GITHUB_ENV_STEP_BOUNDARY=PASS"
            echo "CUMULATIVE_SHA=$CUMULATIVE_SHA"
            echo "CUMULATIVE_TREE=$CUMULATIVE_TREE"
          } | tee "$ARTIFACT_DIR/CUMULATIVE-ENV-STATE.txt"

      - name: Verify clean pre SUSFS cumulative state
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p7-pre-susfs.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P4-final-resukisu-susfs-semantic-integration-closure.yml" \
            "Verify clean pre SUSFS cumulative state" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Fetch exact approved SUSFS 2.2 backport
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p7-fetch-susfs.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P4-final-resukisu-susfs-semantic-integration-closure.yml" \
            "Fetch exact approved SUSFS 2.2 backport" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Apply exact Workflow 17 SUSFS base
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p7-apply-susfs-base.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P4-final-resukisu-susfs-semantic-integration-closure.yml" \
            "Apply exact Workflow 17 SUSFS base" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Replace legacy KernelSU with exact Workflow 17 ReSukiSU
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p7-resukisu.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P4-final-resukisu-susfs-semantic-integration-closure.yml" \
            "Replace legacy KernelSU with exact Workflow 17 ReSukiSU" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

          ACTUAL_KSU="$(
            git -C KernelSU \
              rev-parse HEAD
          )"

          if [ "$ACTUAL_KSU" != "$RESUKISU_COMMIT" ]; then
            echo "ERROR: ReSukiSU commit mismatch"
            exit 1
          fi

      - name: Apply exact Workflow 17 warning clean adaptation
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p7-warning-clean-apply.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P4-final-resukisu-susfs-semantic-integration-closure.yml" \
            "Apply exact Workflow 17 warning clean adaptation" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Verify cumulative adaptation with new exact raw hash
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p7-adaptation-raw.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P4-final-resukisu-susfs-semantic-integration-closure.yml" \
            "Verify cumulative adaptation with new exact raw hash" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Prove only Git index metadata changed from Workflow 17
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p7-adaptation-metadata.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P4-final-resukisu-susfs-semantic-integration-closure.yml" \
            "Prove only Git index metadata changed from Workflow 17" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Verify cumulative corrections survived integration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$RUNNER_TEMP/45p7-post-integration.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P4-final-resukisu-susfs-semantic-integration-closure.yml" \
            "Verify cumulative corrections survived integration" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Resolve new cumulative ReSukiSU SUSFS config
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          SCRIPT="$RUNNER_TEMP/45p7-resolve-config.sh"

          python3 \
            "${RUNNER_TEMP}/extract-run-block.py" \
            "$REFERENCE_DIR/.github/workflows/45P4-final-resukisu-susfs-semantic-integration-closure.yml" \
            "Resolve new cumulative ReSukiSU SUSFS config" \
            "$SCRIPT"

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

      - name: Verify exact cumulative config identity
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="$ARTIFACT_DIR/final-cumulative.config"

          if [ ! -s "$CONFIG" ]; then
            echo "ERROR: final cumulative config missing"
            exit 1
          fi

          CONFIG_SHA="$(
            sha256sum "$CONFIG" \
              | awk '{print $1}'
          )"

          if [ "$CONFIG_SHA" != "$EXPECTED_CUMULATIVE_CONFIG_SHA256" ]; then
            echo "ERROR: cumulative config SHA mismatch"
            echo "Expected: $EXPECTED_CUMULATIVE_CONFIG_SHA256"
            echo "Actual:   $CONFIG_SHA"
            exit 1
          fi

          REQUIRED=(
            "CONFIG_CPUSETS=y"
            "CONFIG_SCHED_CASS=y"
            "CONFIG_HZ_250=y"
            "CONFIG_HZ=250"
            "CONFIG_KSU=y"
            "CONFIG_KSU_SUSFS=y"
            "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            "CONFIG_KSU_SUSFS_SUS_MAP=y"
            "# CONFIG_SPRD_ROTATION_TASK is not set"
          )

          for ITEM in "${REQUIRED[@]}"; do
            if ! grep -qFx \
              "$ITEM" \
              "$CONFIG"
            then
              echo "ERROR: required final config item missing:"
              echo "$ITEM"
              exit 1
            fi
          done

          FORBIDDEN=(
            "CONFIG_HZ_100=y"
            "CONFIG_KSU_TRACEPOINT_HOOK=y"
            "CONFIG_KSU_MANUAL_HOOK=y"
            "CONFIG_DEBUG_KERNEL=y"
          )

          for ITEM in "${FORBIDDEN[@]}"; do
            if grep -qFx \
              "$ITEM" \
              "$CONFIG"
            then
              echo "ERROR: forbidden final config item active:"
              echo "$ITEM"
              exit 1
            fi
          done

          {
            echo "FINAL_CUMULATIVE_CONFIG=PASS"
            echo "FINAL_CUMULATIVE_CONFIG_SHA256=$CONFIG_SHA"
          } | tee "$ARTIFACT_DIR/FINAL-CONFIG-CHECK.txt"

      - name: Verify no reject or orig files remain
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -type f \
            \( -name '*.rej' -o -name '*.orig' \) \
            -print \
            | sort \
            > "$ARTIFACT_DIR/FINAL-REJECT-ORIG.txt"

          if [ -s "$ARTIFACT_DIR/FINAL-REJECT-ORIG.txt" ]; then
            echo "ERROR: reject/orig files remain"
            cat "$ARTIFACT_DIR/FINAL-REJECT-ORIG.txt"
            exit 1
          fi

          {
            echo "REJECT_FILES=0"
            echo "ORIG_FILES=0"
          } | tee "$ARTIFACT_DIR/FINAL-REJECT-ORIG-STATE.txt"

      - name: Strict diff check outside known approved SUSFS files
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          git diff \
            --check \
            -- \
            . \
            ':!fs/susfs.c' \
            ':!include/linux/susfs_def.h' \
            > "$ARTIFACT_DIR/STRICT-DIFF-CHECK.txt" \
            2>&1

          if [ -s "$ARTIFACT_DIR/STRICT-DIFF-CHECK.txt" ]; then
            echo "ERROR: unexpected whitespace problem outside approved SUSFS files"
            cat "$ARTIFACT_DIR/STRICT-DIFF-CHECK.txt"
            exit 1
          fi

          {
            echo "STRICT_DIFF_CHECK_OUTSIDE_KNOWN_SUSFS_FILES=PASS"
            echo "UNEXPECTED_WHITESPACE_ISSUES=0"
          } | tee "$ARTIFACT_DIR/STRICT-DIFF-CHECK-STATE.txt"

      - name: Verify exact inherited SUSFS whitespace diagnostics
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$ARTIFACT_DIR/KNOWN-SUSFS-DIFF-CHECK.txt"

          set +e

          git diff \
            --check \
            -- \
            fs/susfs.c \
            include/linux/susfs_def.h \
            > "$OUTPUT" \
            2>&1

          KNOWN_RC=$?

          set -e

          if [ "$KNOWN_RC" -eq 0 ]; then
            echo "ERROR: expected known approved SUSFS whitespace diagnostics"
            exit 1
          fi

          OUTPUT_SHA="$(
            sha256sum "$OUTPUT" \
              | awk '{print $1}'
          )"

          OUTPUT_LINES="$(
            wc -l \
              < "$OUTPUT" \
              | tr -d ' '
          )"

          ISSUE_COUNT="$(
            grep -Ec \
              ':( trailing whitespace\.| new blank line at EOF\.)$' \
              "$OUTPUT" \
              || true
          )"

          if [ "$OUTPUT_SHA" != "$EXPECTED_KNOWN_SUSFS_DIFFCHECK_SHA256" ]; then
            echo "ERROR: known SUSFS whitespace diagnostic bytes changed"
            echo "Expected: $EXPECTED_KNOWN_SUSFS_DIFFCHECK_SHA256"
            echo "Actual:   $OUTPUT_SHA"
            cat "$OUTPUT"
            exit 1
          fi

          if [ "$OUTPUT_LINES" != "$EXPECTED_KNOWN_SUSFS_DIFFCHECK_LINE_COUNT" ]; then
            echo "ERROR: known SUSFS diagnostic line count changed"
            echo "Expected: $EXPECTED_KNOWN_SUSFS_DIFFCHECK_LINE_COUNT"
            echo "Actual:   $OUTPUT_LINES"
            exit 1
          fi

          if [ "$ISSUE_COUNT" != "$EXPECTED_KNOWN_SUSFS_WHITESPACE_ISSUE_COUNT" ]; then
            echo "ERROR: known SUSFS whitespace issue count changed"
            echo "Expected: $EXPECTED_KNOWN_SUSFS_WHITESPACE_ISSUE_COUNT"
            echo "Actual:   $ISSUE_COUNT"
            exit 1
          fi

          for EXPECTED in \
            'fs/susfs.c:37: trailing whitespace.' \
            'fs/susfs.c:38: trailing whitespace.' \
            'fs/susfs.c:253: trailing whitespace.' \
            'fs/susfs.c:315: trailing whitespace.' \
            'fs/susfs.c:511: trailing whitespace.' \
            'fs/susfs.c:584: trailing whitespace.' \
            'fs/susfs.c:1491: new blank line at EOF.' \
            'include/linux/susfs_def.h:83: trailing whitespace.'
          do
            if ! grep -qFx \
              "$EXPECTED" \
              "$OUTPUT"
            then
              echo "ERROR: expected inherited SUSFS diagnostic missing:"
              echo "$EXPECTED"
              exit 1
            fi
          done

          {
            echo "KNOWN_SUSFS_DIFF_CHECK_EXIT_CODE=$KNOWN_RC"
            echo "KNOWN_SUSFS_DIFF_CHECK_SHA256=$OUTPUT_SHA"
            echo "KNOWN_SUSFS_DIFF_CHECK_LINE_COUNT=$OUTPUT_LINES"
            echo "KNOWN_SUSFS_WHITESPACE_ISSUE_COUNT=$ISSUE_COUNT"
            echo "KNOWN_SUSFS_WHITESPACE_DIAGNOSTICS_EXACT_MATCH=YES"
            echo "KNOWN_SUSFS_WHITESPACE_INHERITED_FROM_APPROVED_ADAPTATION=YES"
          } | tee "$ARTIFACT_DIR/KNOWN-SUSFS-WHITESPACE-STATE.txt"

      - name: Verify semantic integration proof
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          PROOF="$ARTIFACT_DIR/ADAPTATION-METADATA-EQUIVALENCE.txt"

          REQUIRED=(
            "RECONSTRUCTED_WORKFLOW17_RAW_MATCH=YES"
            "NORMALIZED_ADAPTATION_MATCH=YES"
            "SOURCE_HUNK_DIFFERENCE=NO"
            "GIT_INDEX_METADATA_DIFFERENCE_ONLY=YES"
            "SEMANTIC_ADAPTATION_EQUALS_WORKFLOW17=YES"
            "RAW_DIFF_BYTE_IDENTICAL_TO_WORKFLOW17=NO"
          )

          for ITEM in "${REQUIRED[@]}"; do
            if ! grep -qFx \
              "$ITEM" \
              "$PROOF"
            then
              echo "ERROR: semantic integration proof missing:"
              echo "$ITEM"
              exit 1
            fi
          done

          RAW_SHA="$(
            sha256sum \
              "$ARTIFACT_DIR/VEUX-SUSFS-2.2-WARNING-CLEAN.diff" \
              | awk '{print $1}'
          )"

          if [ "$RAW_SHA" != "$EXPECTED_WARNING_CLEAN_DIFF_SHA256" ]; then
            echo "ERROR: cumulative adaptation raw hash changed"
            exit 1
          fi

          {
            echo "SEMANTIC_INTEGRATION_PROOF=PASS"
            echo "CUMULATIVE_RAW_ADAPTATION_SHA256=$RAW_SHA"
            echo "WORKFLOW17_ORIGINAL_RAW_ADAPTATION_SHA256=$WORKFLOW17_ORIGINAL_DIFF_SHA256"
            echo "NORMALIZED_ADAPTATION_SHA256=$EXPECTED_NORMALIZED_ADAPTATION_SHA256"
          } | tee "$ARTIFACT_DIR/SEMANTIC-INTEGRATION-STATE.txt"

      - name: Verify ReSukiSU final identity and linkage
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_KSU="$(
            git -C KernelSU \
              rev-parse HEAD
          )"

          if [ "$ACTUAL_KSU" != "$RESUKISU_COMMIT" ]; then
            echo "ERROR: ReSukiSU commit mismatch"
            echo "Expected: $RESUKISU_COMMIT"
            echo "Actual:   $ACTUAL_KSU"
            exit 1
          fi

          if [ ! -L drivers/kernelsu ]; then
            echo "ERROR: drivers/kernelsu is not a symlink"
            exit 1
          fi

          EXPECTED_TARGET="$(
            readlink -f KernelSU/kernel
          )"

          ACTUAL_TARGET="$(
            readlink -f drivers/kernelsu
          )"

          if [ "$ACTUAL_TARGET" != "$EXPECTED_TARGET" ]; then
            echo "ERROR: drivers/kernelsu target mismatch"
            echo "Expected: $EXPECTED_TARGET"
            echo "Actual:   $ACTUAL_TARGET"
            exit 1
          fi

          {
            echo "RESUKISU_COMMIT=$ACTUAL_KSU"
            echo "RESUKISU_IDENTITY=PASS"
            echo "DRIVERS_KERNELSU_SYMLINK=PASS"
          } | tee "$ARTIFACT_DIR/FINAL-RESUKISU-STATE.txt"

      - name: Prepare final preflight result
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          for CHECK in \
            "$ARTIFACT_DIR/CANDIDATE-ENV-STATE.txt" \
            "$ARTIFACT_DIR/CUMULATIVE-ENV-STATE.txt" \
            "$ARTIFACT_DIR/FINAL-CONFIG-CHECK.txt" \
            "$ARTIFACT_DIR/STRICT-DIFF-CHECK-STATE.txt" \
            "$ARTIFACT_DIR/KNOWN-SUSFS-WHITESPACE-STATE.txt" \
            "$ARTIFACT_DIR/SEMANTIC-INTEGRATION-STATE.txt" \
            "$ARTIFACT_DIR/FINAL-RESUKISU-STATE.txt"
          do
            if [ ! -s "$CHECK" ]; then
              echo "ERROR: required closure evidence missing: $CHECK"
              exit 1
            fi
          done

          grep -qFx \
            'GITHUB_ENV_STEP_BOUNDARY=PASS' \
            "$ARTIFACT_DIR/CANDIDATE-ENV-STATE.txt"

          grep -qFx \
            'CUMULATIVE_GITHUB_ENV_STEP_BOUNDARY=PASS' \
            "$ARTIFACT_DIR/CUMULATIVE-ENV-STATE.txt"

          grep -qFx \
            'FINAL_CUMULATIVE_CONFIG=PASS' \
            "$ARTIFACT_DIR/FINAL-CONFIG-CHECK.txt"

          grep -qFx \
            'STRICT_DIFF_CHECK_OUTSIDE_KNOWN_SUSFS_FILES=PASS' \
            "$ARTIFACT_DIR/STRICT-DIFF-CHECK-STATE.txt"

          grep -qFx \
            'KNOWN_SUSFS_WHITESPACE_DIAGNOSTICS_EXACT_MATCH=YES' \
            "$ARTIFACT_DIR/KNOWN-SUSFS-WHITESPACE-STATE.txt"

          grep -qFx \
            'SEMANTIC_INTEGRATION_PROOF=PASS' \
            "$ARTIFACT_DIR/SEMANTIC-INTEGRATION-STATE.txt"

          grep -qFx \
            'RESUKISU_IDENTITY=PASS' \
            "$ARTIFACT_DIR/FINAL-RESUKISU-STATE.txt"

          CONFIG_SHA="$(
            sha256sum \
              "$ARTIFACT_DIR/final-cumulative.config" \
              | awk '{print $1}'
          )"

          if [ "$CONFIG_SHA" != "$EXPECTED_CUMULATIVE_CONFIG_SHA256" ]; then
            echo "ERROR: final config identity changed"
            exit 1
          fi

          {
            echo "RESULT=PASS_PREFLIGHT"

            echo "BASE_CANDIDATE_TREE=$EXPECTED_CANDIDATE_TREE"

            echo "45P6_RETIRED=YES"
            echo "45P6_FAILURE_CLASS=WORKFLOW_ORCHESTRATION"
            echo "45P7_STEP_BOUNDARY_FIX=PASS"

            echo "IDLE_OPTIMIZE_COMMIT=$IDLE_OPTIMIZE_COMMIT"
            echo "IDLE_OPTIMIZE_COMMIT_CORRECT=YES"

            echo "GITHUB_ENV_STEP_BOUNDARY=PASS"
            echo "CANDIDATE_TIP=$CANDIDATE_TIP"
            echo "COMMON_SHA=$COMMON_SHA"

            echo "CUMULATIVE_GITHUB_ENV_STEP_BOUNDARY=PASS"
            echo "CUMULATIVE_SHA=$CUMULATIVE_SHA"
            echo "CUMULATIVE_TREE=$CUMULATIVE_TREE"

            echo "CUMULATIVE_44C_REPLAY=PASS"

            echo "CPUFREQ_AFTER_SHA256=$EXPECTED_CPUFREQ_AFTER_SHA256"
            echo "SCALING_MIN_WRITE_NOOP_REMOVED=YES"
            echo "SCALING_MAX_BELOW_MIN_CLAMP_REMOVED=YES"

            echo "IDLE_FEATURE_CHAIN_REVERSED=YES"
            echo "DISPLAY_COUPLED_SLEEP_POLICY_REMOVED=YES"

            echo "SCHEDUTIL_AFTER_SHA256=$EXPECTED_SCHEDUTIL_AFTER_SHA256"
            echo "SCHEDUTIL_STANDARD=YES"

            echo "CASS_PATCH_SHA256=$EXPECTED_CASS_DIFF_SHA256"
            echo "CASS_MAXFREQ=YES"

            echo "SPRD_ROTATION_DISABLED=YES"
            echo "LB_CAPACITY_RATE_LIMIT=RESTORED"
            echo "CPUSETS_ENABLED=YES"
            echo "PELT_RESTORED_PERIOD=8"
            echo "HZ_RESOLVED_CHOICE=250"

            echo "RESUKISU_COMMIT=$RESUKISU_COMMIT"
            echo "RESUKISU_IDENTITY=PASS"

            echo "SUSFS_BACKPORT_COMMIT=$BACKPORT_COMMIT"
            echo "SUSFS_BACKPORT_SHA256=$BACKPORT_PATCH_SHA256"

            echo "WORKFLOW17_ORIGINAL_RAW_ADAPTATION_SHA256=$WORKFLOW17_ORIGINAL_DIFF_SHA256"
            echo "CUMULATIVE_RAW_ADAPTATION_SHA256=$EXPECTED_WARNING_CLEAN_DIFF_SHA256"
            echo "NORMALIZED_ADAPTATION_SHA256=$EXPECTED_NORMALIZED_ADAPTATION_SHA256"

            echo "RAW_DIFF_BYTE_IDENTICAL_TO_WORKFLOW17=NO"
            echo "GIT_INDEX_METADATA_DIFFERENCE_ONLY=YES"
            echo "RECONSTRUCTED_WORKFLOW17_RAW_MATCH=YES"
            echo "SOURCE_HUNK_DIFFERENCE=NO"
            echo "SEMANTIC_ADAPTATION_EQUALS_WORKFLOW17=YES"

            echo "STRICT_DIFF_CHECK_OUTSIDE_KNOWN_SUSFS_FILES=PASS"

            echo "KNOWN_SUSFS_WHITESPACE_ISSUE_COUNT=$EXPECTED_KNOWN_SUSFS_WHITESPACE_ISSUE_COUNT"
            echo "KNOWN_SUSFS_WHITESPACE_DIAGNOSTIC_SHA256=$EXPECTED_KNOWN_SUSFS_DIFFCHECK_SHA256"
            echo "KNOWN_SUSFS_WHITESPACE_DIAGNOSTICS_EXACT_MATCH=YES"
            echo "KNOWN_SUSFS_WHITESPACE_INHERITED_FROM_APPROVED_ADAPTATION=YES"

            echo "NEW_CUMULATIVE_CONFIG_SHA256=$CONFIG_SHA"

            echo "REJECT_FILES=0"
            echo "ORIG_FILES=0"

            echo "KERNEL_IMAGE_BUILT=NO"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "FLASHABLE_ZIP_CREATED=NO"
            echo "DEVICE_FLASHED=NO"
          } | tee "$ARTIFACT_DIR/RESULT.txt"

      - name: Upload 45P7 final preflight closure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-Final-ReSukiSU-SUSFS-Preflight-Step-Boundary-Closure
          path: final-preflight-step-boundary-closure/
          if-no-files-found: error
          retention-days: 30
