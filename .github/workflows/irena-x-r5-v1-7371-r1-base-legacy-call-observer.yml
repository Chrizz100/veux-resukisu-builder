          grep -q '^PAIRIP_BYPASS=ABSENT$' r5-output/R5_PROVENANCE.txt

          test -f "r5-output/INSTALL_THIS_${FINAL_ZIP}"

          (
            cd r5-output
            sha256sum -c R5_EVIDENCE_SHA256SUMS.txt
          )

          {
            echo "RESULT=R5_V1_STATIC_FULL_PASS_OBSERVER_CANDIDATE_CREATED"
            echo "PARENT=R1-v2 device framework PASS"
            echo "PARENT_PACKAGE_SHA256=7ed948db19d92b0dd7776c424f93783e10210082ea807345228e901ab9ce4af7"
