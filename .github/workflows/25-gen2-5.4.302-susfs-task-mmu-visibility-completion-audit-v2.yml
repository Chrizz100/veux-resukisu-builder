      - name: Verify no incompatible legacy hook callsites remain
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          count=0

          {
            for spec in \
              'ksu_vfs_read_hook:fs/read_write.c' \
              'ksu_input_hook:drivers/input/input.c' \
              'ksu_execveat_hook:fs/exec.c' \
              'ksu_init_rc_hook:fs/read_write.c' \
              'ksu_init_rc_hook:fs/stat.c'
            do
              symbol="${spec%%:*}"
              file="${spec#*:}"

              if grep -wq "$symbol" "$SIM/$file"; then
                echo "INCOMPATIBLE_PRESENT=$symbol FILE=$file"
                count=$((count + 1))
              else
                echo "INCOMPATIBLE_ABSENT=$symbol FILE=$file"
              fi
            done

            echo "INCOMPATIBLE_LEGACY_HOOK_REFERENCES=$count"
          } | tee incompatible-hook-state.txt

          grep -q '^INCOMPATIBLE_LEGACY_HOOK_REFERENCES=0$' \
            incompatible-hook-state.txt

