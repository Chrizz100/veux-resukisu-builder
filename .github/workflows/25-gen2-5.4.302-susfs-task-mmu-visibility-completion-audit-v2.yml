              )

          print("AVC_5_4_MEMORY_OWNERSHIP=PASS")
          print("SECURITY_SELINUX_AVC_LOG_SPOOF_COMPLETION=PASS")
          PY

          grep -q '^SECURITY_SELINUX_AVC_LOG_SPOOF_COMPLETION=PASS$' \
            avc-log-spoof-edit-log.txt

