                  "\t{\n"
                  "\t\tif (rc)\n"
                  "\t\t\taudit_log_format(ab, \" tsid=%d\", sad->tsid);\n"
                  "\t\telse {\n"
                  "\t\t\taudit_log_format(ab, \" tcontext=%s\", scontext);\n"
                  "\t\t\tkfree(scontext);\n"
                  "\t\t}\n"
