          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY' 2>&1 | tee task-mmu-edit-log.txt
          import re
          from pathlib import Path

          sim = Path(Path("kernel-simulation.path").read_text().strip())
          p = sim / "fs/proc/task_mmu.c"
          text = p.read_text(encoding="utf-8")

          def extract_function(source, start_regex):
              m = re.search(start_regex, source, re.M)
              if not m:
                  raise RuntimeError(f"function start not found: {start_regex}")

              brace_start = source.find("{", m.start())
              if brace_start < 0:
                  raise RuntimeError("function opening brace not found")

              depth = 0
              end = None
              for i in range(brace_start, len(source)):
                  ch = source[i]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise RuntimeError("function closing brace not found")

              return m.start(), end, source[m.start():end]

          # ------------------------------------------------------------
          # 1) Provider declarations required by show_map_vma() code
          # that was already automatically staged in Workflow 17.
          # ------------------------------------------------------------
          decl_marker = "extern struct srcu_struct susfs_srcu_open_redirect;"

          if decl_marker not in text:
              m = re.search(
                  r"^static void\s*\n?show_map_vma\(struct seq_file \*m, "
                  r"struct vm_area_struct \*vma\)\n",
                  text,
                  re.M,
              )
              if not m:
                  raise RuntimeError("show_map_vma declaration anchor not found")

              block = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
                  "extern void susfs_sus_kstat_spoof_show_map_vma("
                  "struct inode *inode, dev_t *out_dev, "
                  "unsigned long *out_ino);\n"
                  "#endif\n"
                  "#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n"
                  "extern struct srcu_struct susfs_srcu_open_redirect;\n"
                  "extern int susfs_open_redirect_spoof_show_map_vma_srcu("
                  "struct inode *inode, unsigned long *out_ino, "
                  "dev_t *out_dev, char **out_spoofed_name);\n"
                  "#endif\n\n"
              )

              text = text[:m.start()] + block + text[m.start():]
              print("task_mmu provider declarations: PASS")
          else:
              print("task_mmu provider declarations: already present")

          # ------------------------------------------------------------
          # 2) show_smap(): hide a SUS_MAP VMA entirely.
          #
          # GEN2 5.4.302 already has Android-16K show_smap_vma() /
          # show_map_pad_vma() plumbing. We only add the visibility gate.
          # ------------------------------------------------------------
          s, e, region = extract_function(
              text,
              r"^static int show_smap\(struct seq_file \*m, void \*v\)\n",
          )

          guard = "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))"

          if guard not in region:
              anchor = "\tstruct vm_area_struct *vma = v;\n"
              count = region.count(anchor)
              print(f"show_smap vma anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"show_smap: expected one local vma anchor, found {count}"
                  )

              addition = (
                  anchor
                  + "\n#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                  + "\tif (vma->vm_file &&\n"
                  + "\t    SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n"
                  + "\t\treturn 0;\n"
                  + "#endif\n"
              )

              region = region.replace(anchor, addition, 1)
              text = text[:s] + region + text[e:]
              print("show_smap SUS_MAP visibility guard: PASS")
          else:
              print("show_smap SUS_MAP visibility guard: already present")

          # ------------------------------------------------------------
          # 3) show_smaps_rollup():
          #
          # Important GEN2 divergence:
          # This 5.4.302 tree already carries the Android-16K rollup form:
          #
          #   for (vma = priv->mm->mmap; vma; vma = vma->vm_next) {
          #       smap_gather_stats(vma, &mss);
          #       last_vma_end = vma->vm_end;
          #   }
          #
          # There is NO newer 3-argument partial-gather / Case-4 path here.
          # Therefore port only the semantically applicable SUS_MAP skip and
          # leave last_vma_end + the existing topology unchanged.
          # ------------------------------------------------------------
          s, e, region = extract_function(
              text,
              r"^static int show_smaps_rollup\(struct seq_file \*m, void \*v\)\n",
          )

          rollup_marker = (
              "!SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))"
          )

          if rollup_marker not in region:
              old_loop = (
                  "\tfor (vma = priv->mm->mmap; vma; vma = vma->vm_next) {\n"
                  "\t\tsmap_gather_stats(vma, &mss);\n"
                  "\t\tlast_vma_end = vma->vm_end;\n"
                  "\t}\n"
              )

              count = region.count(old_loop)
              print(f"GEN2 simple smaps_rollup loop count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"show_smaps_rollup: expected one GEN2 simple loop, found {count}"
                  )

              new_loop = (
                  "\tfor (vma = priv->mm->mmap; vma; vma = vma->vm_next) {\n"
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                  "\t\tif (!vma->vm_file ||\n"
                  "\t\t    !SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n"
                  "\t\t\tsmap_gather_stats(vma, &mss);\n"
                  "#else\n"
                  "\t\tsmap_gather_stats(vma, &mss);\n"
                  "#endif\n"
                  "\t\tlast_vma_end = vma->vm_end;\n"
                  "\t}\n"
              )

              region = region.replace(old_loop, new_loop, 1)
              text = text[:s] + region + text[e:]
              print("show_smaps_rollup GEN2 SUS_MAP filtering: PASS")
          else:
              print("show_smaps_rollup GEN2 SUS_MAP filtering: already present")

          # ------------------------------------------------------------
          # 4) pagemap_read():
          #
          # GEN2 5.4.302 uses:
          #   down_read_killable(&mm->mmap_sem)
          #   walk_page_range(...)
          #   up_read(&mm->mmap_sem)
          #
          # The vma declaration was already auto-applied in Workflow 17.
          # Skip the walk for a SUS_MAP VMA without replacing the 5.4 lock API.
          # ------------------------------------------------------------
          s, e, region = extract_function(
              text,
              r"^static ssize_t pagemap_read\(struct file \*file, char __user \*buf,\n"
              r"\s*size_t count, loff_t \*ppos\)\n",
          )

          page_guard = "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))"

          if "vma = find_vma(mm, start_vaddr);" not in region:
              walk = (
                  "\t\tret = walk_page_range(mm, start_vaddr, end, "
                  "&pagemap_ops, &pm);\n"
              )

              count = region.count(walk)
              print(f"pagemap walk_page_range anchor count={count}")
              if count != 1:
                  raise RuntimeError(
                      f"pagemap_read: expected one walk_page_range call, found {count}"
                  )

              if "struct vm_area_struct *vma;" not in region:
                  raise RuntimeError(
                      "pagemap_read: Workflow-17 vma declaration missing"
                  )

              replacement = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                  "\t\tvma = find_vma(mm, start_vaddr);\n"
                  "\t\tif (vma && vma->vm_file &&\n"
                  "\t\t    SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n"
                  "\t\t\tret = 0;\n"
                  "\t\telse\n"
                  "\t\t\tret = walk_page_range(mm, start_vaddr, end,\n"
                  "\t\t\t\t\t      &pagemap_ops, &pm);\n"
                  "#else\n"
                  + walk
                  + "#endif\n"
              )

              region = region.replace(walk, replacement, 1)
              text = text[:s] + region + text[e:]
              print("pagemap_read GEN2 SUS_MAP walk suppression: PASS")
          else:
              print("pagemap_read GEN2 SUS_MAP walk suppression: already present")

          p.write_text(text, encoding="utf-8")

          # ------------------------------------------------------------
          # Final semantic checks against the actual GEN2 5.4.302 layout.
          # ------------------------------------------------------------
          final = p.read_text(encoding="utf-8", errors="replace")

          _, _, map_region = extract_function(
              final,
              r"^static void\s*\n?show_map_vma\(struct seq_file \*m, "
              r"struct vm_area_struct \*vma\)\n",
          )
          _, _, smap_region = extract_function(
              final,
              r"^static int show_smap\(struct seq_file \*m, void \*v\)\n",
          )
          _, _, roll_region = extract_function(
              final,
              r"^static int show_smaps_rollup\(struct seq_file \*m, void \*v\)\n",
          )
          _, _, page_region = extract_function(
              final,
              r"^static ssize_t pagemap_read\(struct file \*file, char __user \*buf,\n"
              r"\s*size_t count, loff_t \*ppos\)\n",
          )

          checks = {
              "SHOW_MAP_OPEN_REDIRECT_SRCU_PRESENT":
                  "srcu_read_lock(&susfs_srcu_open_redirect)" in map_region,
              "SHOW_MAP_OPEN_REDIRECT_PROVIDER_PRESENT":
                  "susfs_open_redirect_spoof_show_map_vma_srcu" in map_region,
              "SHOW_MAP_SUS_KSTAT_PRESENT":
                  "susfs_sus_kstat_spoof_show_map_vma" in map_region,
              "SHOW_MAP_SUS_MAP_HIDE_PRESENT":
                  "SUSFS_IS_INODE_SUS_MAP(inode)" in map_region,
              "ANDROID_16K_VMA_PAD_START_PRESENT":
                  "VMA_PAD_START(vma)" in map_region,
              "SHOW_SMAP_SUS_MAP_HIDE_PRESENT":
                  page_guard in smap_region,
              "ROLLUP_SIMPLE_2ARG_GATHER_PRESENT":
                  "smap_gather_stats(vma, &mss);" in roll_region,
              "ROLLUP_SUS_MAP_FILTER_PRESENT":
                  page_guard in roll_region,
              "ROLLUP_LAST_VMA_END_PRESERVED":
                  "last_vma_end = vma->vm_end;" in roll_region,
              "ROLLUP_NEWER_3ARG_GATHER_ABSENT":
                  "smap_gather_stats(vma, &mss, last_vma_end)" not in roll_region,
              "PAGEMAP_GEN2_DOWN_READ_PRESENT":
                  "down_read_killable(&mm->mmap_sem)" in page_region,
              "PAGEMAP_GEN2_UP_READ_PRESENT":
                  "up_read(&mm->mmap_sem)" in page_region,
              "PAGEMAP_FIND_VMA_PRESENT":
                  "vma = find_vma(mm, start_vaddr);" in page_region,
              "PAGEMAP_SUS_MAP_HIDE_PRESENT":
                  page_guard in page_region,
              "PAGEMAP_ORIGINAL_WALK_PRESENT":
                  "walk_page_range(mm, start_vaddr, end" in page_region,
          }

          for key, value in checks.items():
              print(f"{key}={'YES' if value else 'NO'}")
              if not value:
                  raise RuntimeError(f"{key}=NO")

          lock_pos = page_region.index("down_read_killable(&mm->mmap_sem)")
          find_pos = page_region.index("vma = find_vma(mm, start_vaddr);")
          walk_pos = page_region.index("walk_page_range(mm, start_vaddr, end")
          unlock_pos = page_region.index("up_read(&mm->mmap_sem)")

          if not (lock_pos < find_pos < walk_pos < unlock_pos):
              raise RuntimeError("pagemap GEN2 5.4 ordering invalid")

          print("TASK_MMU_ANDROID16K_SEMANTICS_PRESERVED=YES")
          print("TASK_MMU_GEN2_SIMPLE_ROLLUP_TOPOLOGY_PRESERVED=YES")
          print("TASK_MMU_VISIBILITY_COMPLETION=PASS")
          PY

          grep -q '^TASK_MMU_VISIBILITY_COMPLETION=PASS$' \
            task-mmu-edit-log.txt

          echo "TASK_MMU_VISIBILITY_COMPLETION=PASS" \
            | tee task-mmu-state.txt

      - name: Classify newer smaps_rollup partial-gather reject
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY' | tee task-mmu-rollup-classification.txt
          import re
          from pathlib import Path

          sim = Path(Path("kernel-simulation.path").read_text().strip())
          text = (sim / "fs/proc/task_mmu.c").read_text(
              encoding="utf-8", errors="replace"
          )

          # Verify the actual GEN2 smap_gather_stats() signature.
          sig = re.search(
              r"static void smap_gather_stats\(struct vm_area_struct \*vma,\n"
              r"\s*struct mem_size_stats \*mss\)\n",
              text,
              re.M,
          )

          if not sig:
              raise SystemExit("GEN2_SMAP_GATHER_STATS_2ARG_SIGNATURE=NO")

          has_newer_partial = (
              "smap_gather_stats(vma, &mss, last_vma_end)" in text
          )
          has_case4 = "Case 4 above" in text

          print("GEN2_SMAP_GATHER_STATS_2ARG_SIGNATURE=YES")
          print(
              "GEN2_HAS_NEWER_PARTIAL_GATHER="
              + ("YES" if has_newer_partial else "NO")
          )
          print(
              "GEN2_HAS_NEWER_CASE4_ROLLUP="
              + ("YES" if has_case4 else "NO")
          )

          if has_newer_partial or has_case4:
              raise SystemExit(
                  "Unexpected newer rollup topology present in GEN2"
              )

          print("SUSFS_5_10_PARTIAL_ROLLUP_HUNK=NOT_APPLICABLE_TO_GEN2_5_4")
          print("NO_SYNTHETIC_3ARG_SMAP_GATHER_ADDED=YES")
          print("ROLLUP_REJECT_CLASSIFICATION=PASS")
          PY

      - name: Verify task_mmu SUSFS provider contracts
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          {
            echo "=== SUS_KSTAT show_map provider ==="
            grep -RIn -C 4 \
              'susfs_sus_kstat_spoof_show_map_vma' \
              "$SIM/fs/susfs.c" \
              "$SIM/include/linux/susfs.h" \
              "$SIM/include/linux/susfs_def.h" \
              | sed -n '1,160p'

            echo
            echo "=== OPEN_REDIRECT SRCU provider ==="
            grep -RIn -C 4 \
              'susfs_srcu_open_redirect' \
              "$SIM/fs/susfs.c" \
              "$SIM/include/linux/susfs.h" \
              "$SIM/include/linux/susfs_def.h" \
              | sed -n '1,180p'

            echo
            grep -RIn -C 5 \
              'susfs_open_redirect_spoof_show_map_vma_srcu' \
              "$SIM/fs/susfs.c" \
              "$SIM/include/linux/susfs.h" \
              "$SIM/include/linux/susfs_def.h" \
              | sed -n '1,180p'
          } | tee task-mmu-provider-context.txt

          grep -Rq 'susfs_sus_kstat_spoof_show_map_vma' \
            "$SIM/fs/susfs.c" \
            "$SIM/include/linux/susfs.h" \
            "$SIM/include/linux/susfs_def.h"

          grep -Rq 'susfs_srcu_open_redirect' \
            "$SIM/fs/susfs.c" \
            "$SIM/include/linux/susfs.h" \
            "$SIM/include/linux/susfs_def.h"

          grep -Rq 'susfs_open_redirect_spoof_show_map_vma_srcu' \
            "$SIM/fs/susfs.c" \
            "$SIM/include/linux/susfs.h" \
            "$SIM/include/linux/susfs_def.h"

          echo "TASK_MMU_PROVIDER_CONTRACTS=PASS" \
            | tee task-mmu-provider-status.txt

      - name: Verify task_mmu original GEN2 control flow remains reachable
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY' | tee task-mmu-behavior-verification.txt
          from pathlib import Path

          sim = Path(Path("kernel-simulation.path").read_text().strip())
          text = (sim / "fs/proc/task_mmu.c").read_text(
              encoding="utf-8", errors="replace"
          )

          checks = {
              "SHOW_SMAP_ORIGINAL_SHOW_CALL_PRESENT":
                  "show_smap_vma(m, vma);" in text,
              "SHOW_SMAP_ANDROID16K_PAD_CALL_PRESENT":
                  "show_map_pad_vma(vma, m, show_smap_vma, true);" in text,
              "SMAP_GATHER_ANDROID16K_END_PRESENT":
                  "unsigned long end = VMA_PAD_START(vma);" in text,
              "ROLLUP_2ARG_SMAP_GATHER_PRESENT":
                  "smap_gather_stats(vma, &mss);" in text,
              "ROLLUP_LAST_VMA_END_PRESENT":
                  "last_vma_end = vma->vm_end;" in text,
              "PAGEMAP_DOWN_READ_KILLABLE_PRESENT":
                  "down_read_killable(&mm->mmap_sem)" in text,
              "PAGEMAP_UP_READ_PRESENT":
                  "up_read(&mm->mmap_sem)" in text,
              "PAGEMAP_WALK_PAGE_RANGE_PRESENT":
                  "walk_page_range(mm, start_vaddr, end" in text,
              "PAGEMAP_COPY_TO_USER_PRESENT":
                  "copy_to_user(buf, pm.buffer, len)" in text,
          }

          for key, value in checks.items():
              print(f"{key}={'YES' if value else 'NO'}")
              if not value:
                  raise SystemExit(f"{key}=NO")

          if "smap_gather_stats(vma, &mss, last_vma_end)" in text:
              raise SystemExit("SYNTHETIC_NEWER_ROLLUP_PATH_PRESENT=YES")

          print("SYNTHETIC_NEWER_ROLLUP_PATH_PRESENT=NO")
          print("TASK_MMU_ORIGINAL_GEN2_CONTROL_FLOW_PRESERVED=YES")
          print("TASK_MMU_CHANGE_SCOPE=VISIBILITY_FILTERS_AND_PROVIDER_DECLARATIONS")
          PY

