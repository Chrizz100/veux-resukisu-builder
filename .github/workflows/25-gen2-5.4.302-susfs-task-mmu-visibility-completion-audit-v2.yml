      - name: Resolve mm memory SUS_MAP remote VM semantic rejects v2
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY' 2>&1 | tee mm-memory-sus-map-edit-log.txt
          import re
          from pathlib import Path

          sim = Path(Path("kernel-simulation.path").read_text().strip())
          p = sim / "mm/memory.c"
          text = p.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # 1) Header wiring against the real GEN2 5.4.302 include set.
          # ------------------------------------------------------------
          include_marker = "#include <linux/susfs_def.h>"
          include_block = (
              "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
              "#include <linux/susfs_def.h>\n"
              "#endif\n"
          )

          if include_marker not in text:
              anchor = "#include <linux/numa.h>\n"
              count = text.count(anchor)
              print(f"mm/memory.c include anchor count={count}")

              if count != 1:
                  raise RuntimeError(
                      f"mm/memory.c: expected one linux/numa.h include, found {count}"
                  )

              text = text.replace(anchor, anchor + include_block, 1)
              print("mm/memory.c SUS_MAP include: PASS")
          else:
              print("mm/memory.c SUS_MAP include: already present")

          # ------------------------------------------------------------
          # Brace-aware extraction of the exact 5.4.302 function.
          # ------------------------------------------------------------
          func_re = re.compile(
              r"^int __access_remote_vm\(struct task_struct \*tsk, struct mm_struct \*mm,\n"
              r"\s*unsigned long addr, void \*buf, int len, unsigned int gup_flags\)\n"
              r"\{\n",
              re.M,
          )

          def extract_function(source):
              fm = func_re.search(source)
              if not fm:
                  raise RuntimeError(
                      "mm/memory.c: __access_remote_vm() function start not found"
                  )

              brace_start = source.find("{", fm.start())
              depth = 0
              func_end = None

              for i in range(brace_start, len(source)):
                  ch = source[i]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          func_end = i + 1
                          break

              if func_end is None:
                  raise RuntimeError(
                      "mm/memory.c: could not determine __access_remote_vm() boundary"
                  )

              return fm.start(), func_end, source[fm.start():func_end]

          start, end, region = extract_function(text)

          # ------------------------------------------------------------
          # 2) GEN2 5.4 lock API:
          #    down_read_killable(&mm->mmap_sem)
          #    ...
          #    up_read(&mm->mmap_sem)
          #
          # Insert a distinct SUSFS seed immediately after the lock.
          # Do NOT confuse it with the pre-existing VM_IO fallback
          # find_vma() later inside the loop.
          # ------------------------------------------------------------
          lock_anchor = (
              "\tif (down_read_killable(&mm->mmap_sem))\n"
              "\t\treturn 0;\n"
          )

          lock_count = region.count(lock_anchor)
          print(f"GEN2 5.4 mmap lock anchor count={lock_count}")

          if lock_count != 1:
              raise RuntimeError(
                  f"__access_remote_vm: expected one 5.4 down_read_killable anchor, found {lock_count}"
              )

          seed_block = (
              "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
              "\tvma = find_vma(mm, addr);\n"
              "#endif\n"
          )

          lock_end = region.index(lock_anchor) + len(lock_anchor)
          after_lock = region[lock_end:]

          # Only treat the seed as present if it is immediately after the
          # lock (allowing only whitespace), not merely somewhere later.
          seed_already = after_lock.lstrip().startswith(seed_block)

          if seed_already:
              print("remote-vm initial VMA seed after lock: already present")
          else:
              region = (
                  region[:lock_end]
                  + "\n"
                  + seed_block
                  + region[lock_end:]
              )
              print("remote-vm initial VMA seed after lock: PASS")

          # ------------------------------------------------------------
          # 3) SUS_MAP guard before the first GUP attempt.
          # GEN2 5.4 signature is:
          # get_user_pages_remote(tsk, mm, addr, 1, ...)
          # ------------------------------------------------------------
          guard_marker = (
              "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))"
          )

          if guard_marker not in region:
              page_anchor = "\t\tstruct page *page = NULL;\n"
              count = region.count(page_anchor)
              print(f"remote-vm page anchor count={count}")

              if count != 1:
                  raise RuntimeError(
                      f"__access_remote_vm: expected one page anchor, found {count}"
                  )

              guard = (
                  page_anchor
                  + "\n#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                  + "\t\tif (vma && vma->vm_file &&\n"
                  + "\t\t    SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n"
                  + "\t\t\tbreak;\n"
                  + "#endif\n"
              )

              region = region.replace(page_anchor, guard, 1)
              print("remote-vm SUS_MAP access guard: PASS")
          else:
              print("remote-vm SUS_MAP access guard: already present")

          text = text[:start] + region + text[end:]
          p.write_text(text, encoding="utf-8")

          # ------------------------------------------------------------
          # Final semantic invariants against the actual 5.4 API.
          # ------------------------------------------------------------
          final = p.read_text(encoding="utf-8", errors="replace")
          start, end, region = extract_function(final)

          seed = "vma = find_vma(mm, addr);"
          seed_positions = [
              m.start() for m in re.finditer(re.escape(seed), region)
          ]

          print(f"FIND_VMA_OCCURRENCE_COUNT={len(seed_positions)}")

          checks = {
              "VMA_DECLARATION_PRESENT":
                  "struct vm_area_struct *vma;" in region,
              "GEN2_5_4_DOWN_READ_KILLABLE_PRESENT":
                  "down_read_killable(&mm->mmap_sem)" in region,
              "GEN2_5_4_UP_READ_PRESENT":
                  "up_read(&mm->mmap_sem);" in region,
              "INITIAL_FIND_VMA_PRESENT":
                  len(seed_positions) >= 2,
              "SUS_MAP_INODE_GUARD_PRESENT":
                  guard_marker in region,
              "ORIGINAL_5_4_GUP_SIGNATURE_PRESENT":
                  "get_user_pages_remote(tsk, mm, addr, 1" in region,
              "ORIGINAL_VM_IO_FALLBACK_FIND_VMA_PRESENT":
                  len(seed_positions) >= 2,
              "ORIGINAL_RETURN_ACCOUNTING_PRESENT":
                  "return buf - old_buf;" in region,
          }

          for key, value in checks.items():
              print(f"{key}={'YES' if value else 'NO'}")
              if not value:
                  raise RuntimeError(f"{key}=NO")

          lock_pos = region.index("down_read_killable(&mm->mmap_sem)")
          loop_pos = region.index("while (len)")
          guard_pos = region.index(guard_marker)
          gup_pos = region.index("get_user_pages_remote(tsk, mm, addr, 1")
          fallback_pos = region.index(seed, gup_pos)
          unlock_pos = region.index("up_read(&mm->mmap_sem);")

          # The first find_vma must be the new seed, between lock and loop.
          initial_seed_pos = seed_positions[0]

          if not (
              lock_pos < initial_seed_pos < loop_pos
              < guard_pos < gup_pos < fallback_pos < unlock_pos
          ):
              raise RuntimeError(
                  "SUS_MAP remote-vm 5.4 ordering invalid"
              )

          # Ensure the seed is CONFIG-gated and the original fallback remains
          # outside that initial seed block.
          seed_context = region[max(0, initial_seed_pos - 80):initial_seed_pos + 80]
          if "#ifdef CONFIG_KSU_SUSFS_SUS_MAP" not in seed_context:
              raise RuntimeError(
                  "Initial SUS_MAP VMA seed is not CONFIG-gated"
              )

          print("INITIAL_SUS_MAP_SEED_DISTINCT_FROM_VM_IO_FALLBACK=YES")
          print("GEN2_5_4_MMAP_LOCK_PAIR=PASS")
          print("MM_MEMORY_SUS_MAP_ORDERING=PASS")
          print("MM_MEMORY_SUS_MAP_COMPLETION=PASS")
          PY

          grep -q '^MM_MEMORY_SUS_MAP_COMPLETION=PASS$' \
            mm-memory-sus-map-edit-log.txt

          echo "MM_MEMORY_SUS_MAP_COMPLETION=PASS" \
            | tee mm-memory-sus-map-state.txt

      - name: Verify SUS_MAP inode marker provider
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          {
