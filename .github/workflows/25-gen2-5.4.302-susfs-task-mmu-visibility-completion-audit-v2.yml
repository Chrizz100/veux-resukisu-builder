              # - Preserve original security_sid_to_context() call.
              # - When spoofing KSU tsid, print priv_app identity.
              # - If context resolution succeeded, free scontext in BOTH
              #   spoofed and original branches.
              # - Do not use the 5.10 goto pattern, because GEN2 5.4 has
              #   an explicit kfree(scontext) in this block.
              new = (
                  "\trc = security_sid_to_context(sad->state, sad->tsid, &scontext,\n"
                  "\t\t\t\t     &scontext_len);\n"
                  "#ifdef CONFIG_KSU_SUSFS\n"
                  "\tif (static_branch_likely(&susfs_is_avc_log_spoofing_enabled) &&\n"
                  "\t    unlikely(sad->tsid == susfs_ksu_sid)) {\n"
                  "\t\tif (rc)\n"
                  "\t\t\taudit_log_format(ab, \" tsid=%d\", susfs_priv_app_sid);\n"
                  "\t\telse {\n"
                  "\t\t\taudit_log_format(ab, \" tcontext=%s\",\n"
                  "\t\t\t\t\t \"u:r:priv_app:s0:c512,c768\");\n"
                  "\t\t\tkfree(scontext);\n"
                  "\t\t}\n"
                  "\t} else\n"
