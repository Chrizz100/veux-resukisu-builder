      - name: Resolve security selinux avc log spoof semantic rejects
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY' 2>&1 | tee avc-log-spoof-edit-log.txt
          import re
          from pathlib import Path

          sim = Path(Path("kernel-simulation.path").read_text().strip())
          p = sim / "security/selinux/avc.c"
          text = p.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # Provider declarations.
          # Anchor directly before struct avc_entry; this is stable in
          # GEN2 5.4.302 and avoids relying on 5.10 trace-hook includes.
          # ------------------------------------------------------------
          decl_marker = "extern u32 susfs_ksu_sid;"
          decl_block = (
              "#ifdef CONFIG_KSU_SUSFS\n"
              "extern u32 susfs_ksu_sid;\n"
              "extern u32 susfs_priv_app_sid;\n"
              "extern struct static_key_false susfs_is_avc_log_spoofing_enabled;\n"
              "#endif\n\n"
