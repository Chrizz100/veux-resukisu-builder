      - name: Resolve fs namespace vfs_create_mount SUS_MOUNT reject
        shell: bash
        run: |
          set -euo pipefail

          SIM="$(cat kernel-simulation.path)"

          python3 - <<'PY' 2>&1 | tee namespace-sus-mount-edit-log.txt
          import re
          from pathlib import Path

          sim = Path(Path("kernel-simulation.path").read_text().strip())
          p = sim / "fs/namespace.c"
          text = p.read_text(encoding="utf-8")

          func_re = re.compile(
              r"^struct vfsmount \*vfs_create_mount\(struct fs_context \*fc\)\n"
              r"\{\n",
              re.M,
          )

          fm = func_re.search(text)
          if not fm:
              raise RuntimeError(
                  "fs/namespace.c: vfs_create_mount(struct fs_context *fc) not found"
              )

          next_boundary = re.search(
              r"^\}\nEXPORT_SYMBOL\(vfs_create_mount\);",
              text[fm.start():],
              re.M,
          )
          if not next_boundary:
              raise RuntimeError(
                  "fs/namespace.c: vfs_create_mount export boundary not found"
              )

          start = fm.start()
          end = fm.start() + next_boundary.end()
          region = text[start:end]

          # These providers were already introduced by the automatically
          # applicable parts of the SUS_MOUNT patch in Workflow 17.
          required_global_markers = [
              "static struct mount *susfs_alloc_non_unshare_ksu_vfsmnt",
              "extern bool susfs_is_current_ksu_domain(void);",
              "extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;",
          ]

          for marker in required_global_markers:
              if marker not in text:
                  raise RuntimeError(
                      f"fs/namespace.c: required staged provider missing: {marker}"
                  )

          if "susfs_alloc_non_unshare_ksu_vfsmnt(fc->source ?: \"none\")" in region:
              print("vfs_create_mount SUS_MOUNT branch: already present")
          else:
              # GEN2 5.4.302 has:
              #   if (!fc->root) ...
              #   sb = fc->root->d_sb;
              #   mnt = alloc_vfsmnt(...);
              # so anchor directly on the allocator + NULL guard only.
              old = (
                  "\tmnt = alloc_vfsmnt(fc->source ?: \"none\");\n"
                  "\tif (!mnt)\n"
              )

              count = region.count(old)
              print(f"vfs_create_mount allocator anchor count={count}")

              if count != 1:
                  raise RuntimeError(
                      f"fs/namespace.c vfs_create_mount: expected one allocator anchor, found {count}"
                  )

              new = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\t/* Keep checking the KSU domain only while Android/data is not yet accessible. */\n"
                  "\tif (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted)) {\n"
                  "\t\tif (susfs_is_current_ksu_domain()) {\n"
                  "\t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(fc->source ?: \"none\");\n"
                  "\t\t\tgoto bypass_orig_flow;\n"
                  "\t\t}\n"
                  "\t}\n"
                  "#endif\n"
                  "\n"
                  "\tmnt = alloc_vfsmnt(fc->source ?: \"none\");\n"
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "bypass_orig_flow:\n"
                  "#endif\n"
                  "\tif (!mnt)\n"
              )

              region = region.replace(old, new, 1)
              text = text[:start] + region + text[end:]
              p.write_text(text, encoding="utf-8")
              print("vfs_create_mount SUS_MOUNT branch: PASS")

          # Final semantic verification.
          final = p.read_text(encoding="utf-8", errors="replace")
          fm = func_re.search(final)
          next_boundary = re.search(
              r"^\}\nEXPORT_SYMBOL\(vfs_create_mount\);",
              final[fm.start():],
              re.M,
          )
          end = fm.start() + next_boundary.end()
          region = final[fm.start():end]

          checks = {
              "FC_ROOT_GUARD_PRESENT":
                  "if (!fc->root)" in region,
              "STATIC_KEY_GUARD_PRESENT":
                  "static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted)" in region,
              "KSU_DOMAIN_CHECK_PRESENT":
                  "susfs_is_current_ksu_domain()" in region,
              "SUSFS_ALLOCATOR_PRESENT":
                  'susfs_alloc_non_unshare_ksu_vfsmnt(fc->source ?: "none")' in region,
              "ORIGINAL_ALLOCATOR_FALLBACK_PRESENT":
                  'mnt = alloc_vfsmnt(fc->source ?: "none");' in region,
              "BYPASS_LABEL_PRESENT":
                  "bypass_orig_flow:" in region,
              "NULL_GUARD_PRESENT":
                  "if (!mnt)" in region,
          }

          for key, value in checks.items():
              print(f"{key}={'YES' if value else 'NO'}")
              if not value:
                  raise RuntimeError(f"{key}=NO")

          static_pos = region.index(
              "static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted)"
          )
          domain_pos = region.index("susfs_is_current_ksu_domain()")
          susfs_alloc_pos = region.index(
              'susfs_alloc_non_unshare_ksu_vfsmnt(fc->source ?: "none")'
          )
          fallback_pos = region.index(
              'mnt = alloc_vfsmnt(fc->source ?: "none");'
          )
          null_guard_pos = region.index("if (!mnt)")

          if not (
              static_pos < domain_pos < susfs_alloc_pos
              < fallback_pos < null_guard_pos
          ):
              raise RuntimeError(
                  "vfs_create_mount SUS_MOUNT ordering invalid"
              )

          print("VFS_CREATE_MOUNT_SUS_MOUNT_ORDERING=PASS")
          print("FS_NAMESPACE_SUS_MOUNT_COMPLETION=PASS")
          PY

          grep -q '^FS_NAMESPACE_SUS_MOUNT_COMPLETION=PASS$' \
            namespace-sus-mount-edit-log.txt

          echo "FS_NAMESPACE_SUS_MOUNT_COMPLETION=PASS" \
            | tee namespace-sus-mount-state.txt

