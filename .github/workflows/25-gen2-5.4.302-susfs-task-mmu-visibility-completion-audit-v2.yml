          end = fm.start() + boundary.start()
          region = final[fm.start():end]

          checks = {
              "SUSFS_STATIC_KEY_GUARD_PRESENT":
                  "static_branch_likely(&susfs_is_avc_log_spoofing_enabled)" in region,
              "KSU_TSID_MATCH_PRESENT":
                  "sad->tsid == susfs_ksu_sid" in region,
              "PRIV_APP_NUMERIC_SID_FALLBACK_PRESENT":
                  'audit_log_format(ab, " tsid=%d", susfs_priv_app_sid);' in region,
              "PRIV_APP_CONTEXT_PRESENT":
                  '"u:r:priv_app:s0:c512,c768"' in region,
              "ORIGINAL_TSID_OUTPUT_PRESENT":
                  'audit_log_format(ab, " tsid=%d", sad->tsid);' in region,
              "ORIGINAL_TCONTEXT_OUTPUT_PRESENT":
                  'audit_log_format(ab, " tcontext=%s", scontext);' in region,
              "RAW_CONTEXT_AUDIT_PRESERVED":
                  "security_sid_to_context_inval(sad->state, sad->tsid" in region,
          }

          for key, value in checks.items():
              print(f"{key}={'YES' if value else 'NO'}")
              if not value:
                  raise RuntimeError(f"{key}=NO")

          # There must be two explicit frees in the normal target-context
          # section after this 5.4 adaptation: one spoof-success path and
          # one original-success path.
          target_start = region.index(
              "rc = security_sid_to_context(sad->state, sad->tsid"
          )
          raw_start = region.index(
              "rc = security_sid_to_context_inval(sad->state, sad->ssid"
          )
          target_section = region[target_start:raw_start]

          free_count = target_section.count("kfree(scontext);")
          print(f"TARGET_CONTEXT_KFREE_COUNT={free_count}")

          if free_count != 2:
              raise RuntimeError(
                  f"AVC target-context section expected 2 kfree paths, found {free_count}"
