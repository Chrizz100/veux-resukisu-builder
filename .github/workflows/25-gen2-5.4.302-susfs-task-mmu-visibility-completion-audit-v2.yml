          spoof_marker = "static_branch_likely(&susfs_is_avc_log_spoofing_enabled)"

          if spoof_marker not in region:
              # Exact GEN2 5.4.302 target-context output block.
              old = (
                  "\trc = security_sid_to_context(sad->state, sad->tsid, &scontext,\n"
                  "\t\t\t\t     &scontext_len);\n"
                  "\tif (rc)\n"
                  "\t\taudit_log_format(ab, \" tsid=%d\", sad->tsid);\n"
                  "\telse {\n"
                  "\t\taudit_log_format(ab, \" tcontext=%s\", scontext);\n"
                  "\t\tkfree(scontext);\n"
                  "\t}\n"
              )

