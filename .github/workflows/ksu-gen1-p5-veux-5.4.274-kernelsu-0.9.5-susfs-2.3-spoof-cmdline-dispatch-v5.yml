name: KSU GEN1 P5 VEUX 5.4.274 KSU 0.9.5 SUSFS 2.3 SPOOF_CMDLINE Dispatch v5

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ksu-gen1-p5-spoof-cmdline-dispatch-v5-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_REPOSITORY: dereference23/kernel_xiaomi_sm6375
  BASE_COMMIT: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
  BASE_TREE: 1783b5008fc971b795ccaa374efe97aa996eef49
  BASE_VERSION: 5.4.268

  ANDROID_COMMON_REPO: https://android.googlesource.com/kernel/common
  ANDROID_TAG: android11-5.4.274_r00
  ANDROID_TAG_OBJECT: b5141f9d31a3d1875523c9e1ae0d4587c144d149
  ANDROID_COMMIT: 181edea14ae07024cc87699f3cd49116e6f8fbb3
  ANDROID_TREE: 0485f492b920bf72f7f623a0df2aa3c5d7661a9c
  TARGET_VERSION: 5.4.274
  EXPECTED_P0_MERGE_COMMIT: 763f39fff62ff914200a9ac6e7e2336fdf29a6f2
  EXPECTED_P0_MERGE_TREE: a50206971cf1d1eddc259f3aba3d63f87e7ec706

  KSU_COMMIT: b766b98513b5a7eb33bc1c4a76b5702bf1288f07
  KSU_EXPECTED_VERSION: "11872"
  SUSFS_SOURCE_COMMIT: ec785f47d49f7b3871ca9356f450411020af7017
  SUSFS_EXPECTED_VERSION: v2.3.0

  P4_PASS_RUN_ID: "33939213280"
  P4_ARTIFACT_NAME: ksu-gen1-p4-veux-5.4.274-ksu-0.9.5-susfs-2.3-safe-filename-bridge-v7-33939213280
  EXPECTED_P4_IMAGE_SHA256: b28113d51b58aa48683a64c06612bfd6d70f0e09d9b5c1866581a9a1a4971885
  EXPECTED_P4_CONFIG_SHA256: 4416cdb68d8a445afb2ce64891174cfb55b9746406ec40962fc819cd591b8316
  EXPECTED_P4_DTB_SHA256: 42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37

  P5_V4_PASS_RUN_ID: "33943099824"
  P5_V4_ARTIFACT_NAME: ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-active-spoof-uname-dispatch-v4-33943099824
  EXPECTED_P5_V4_IMAGE_SHA256: 795ecd62d3fdb698088ec91c127a423fad7ef7d937d1b3f90558defd42d265e3
  EXPECTED_P5_V4_CONFIG_SHA256: 11d6708381325751743d9d9f7359c97f3b2b2b3be85f3a2a869265eed5816c94
  EXPECTED_P5_V4_DTB_SHA256: 42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37

  TOOLCHAIN_REPO: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
  TOOLCHAIN_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
  TOOLCHAIN_DIR: clang-r416183b
  EXPECTED_TOOLCHAIN_TREE_SHA256: ed560f80e2009206b25cb963c8810faecdad06b18b75cc563ef2c9b900355a1f
  EXPECTED_CLANG_SHA256: b2ce016755bddbab76549895bca07b1dc8d14a3e315b8b3567097fef04eadae1
  EXPECTED_LLD_SHA256: 51dc9705420c136f583478ac08a3258cd970710296928b3bf24dc3ee2e6208e3

  KBUILD_BUILD_USER: clean-gen1
  KBUILD_BUILD_HOST: github-actions
  KBUILD_BUILD_TIMESTAMP: Thu Apr 18 11:05:25 UTC 2024

jobs:
  p5-spoof-cmdline:
    name: P5 - add non-GKI /proc/cmdline spoof on P5-v4
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: 01 - Checkout exact fresh VEUX base
        uses: actions/checkout@v7
        with:
          repository: dereference23/kernel_xiaomi_sm6375
          ref: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
          path: kernel
          fetch-depth: 0
          filter: blob:none

      - name: 02 - Initialize P5-v5 evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence restore-kit build-artifacts p4-artifact p5v4-artifact
          mkdir -p evidence restore-kit build-artifacts p4-artifact p5v4-artifact

          {
            echo "WORKFLOW=KSU-GEN1-P5-SPOOF-CMDLINE-DISPATCH-v5"
            echo "DEVICE=VEUX"
            echo "TARGET_KERNEL=$TARGET_VERSION"
            echo "PARENT_P4_PASS_RUN_ID=$P4_PASS_RUN_ID"
            echo "PARENT_P5_V4_PASS_RUN_ID=$P5_V4_PASS_RUN_ID"
            echo "ACTIVE_SUBOPTIONS=KSU_SUSFS_SPOOF_UNAME,KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG"
            echo "NEW_ACTIVE_BLOCK=KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG"
            echo "VEUX_CMDLINE_MODE=NON_GKI_PROC_CMDLINE"
            echo "BOOTCONFIG_FILE_EXPECTED=ABSENT"
            echo "USER_COMMAND_DISPATCH=ROOT_ONLY"
            echo "DISPATCH_COMMAND_COUNT=5"
            echo "DISPATCH_COMMANDS=SET_UNAME,SET_CMDLINE_OR_BOOTCONFIG,SHOW_VERSION,SHOW_ENABLED_FEATURES,SHOW_VARIANT"
            echo "P4_FILENAME_BRIDGE_MUST_REMAIN_BYTE_IDENTICAL=YES"
            echo "P5_V4_UNAME_PATH_MUST_REMAIN_BYTE_IDENTICAL=YES"
            echo "SUS_PATH=SUS_MOUNT=SUS_KSTAT=OPEN_REDIRECT=SUS_MAP=DISABLED"
            echo "PROC_CMDLINE_CHANGE=YES"
            echo "PROC_MAPS_CHANGE=NO"
            echo "NAMEI_CHANGE=NO"
            echo "NAMESPACE_CHANGE=NO"
            echo "RESUKISU_INTEGRATION=NO"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } > evidence/00-CONTRACT.txt
          echo "STAGE=INITIALIZED" > evidence/STAGE.txt

      - name: 03 - Install build and audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=DEPENDENCIES" > evidence/STAGE.txt
          sudo apt-get update
          sudo apt-get install -y \
            bc bison ca-certificates cpio curl flex git jq \
            libelf-dev libssl-dev patch python3 rsync xz-utils zstd

      - name: 04 - Reconstruct exact deterministic P0
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P0_RECONSTRUCTION" > evidence/STAGE.txt
          cd kernel

          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(make -s kernelversion)" = "$BASE_VERSION"
          test -z "$(git status --porcelain)"

          git remote remove android >/dev/null 2>&1 || true
          git remote add android "$ANDROID_COMMON_REPO"
          git fetch --no-tags android "refs/tags/${ANDROID_TAG}:refs/tags/${ANDROID_TAG}"

          test "$(git cat-file -t "refs/tags/${ANDROID_TAG}")" = "tag"
          test "$(git rev-parse "refs/tags/${ANDROID_TAG}")" = "$ANDROID_TAG_OBJECT"
          test "$(git rev-parse "refs/tags/${ANDROID_TAG}^{}")" = "$ANDROID_COMMIT"
          test "$(git rev-parse "${ANDROID_COMMIT}^{tree}")" = "$ANDROID_TREE"

          git config user.name "VEUX Clean Baseline"
          git config user.email "veux-clean-baseline@users.noreply.github.com"
          git merge --no-commit --no-ff "$ANDROID_COMMIT"
          test "$(make -s kernelversion)" = "$TARGET_VERSION"

          export GIT_AUTHOR_DATE="2024-04-18T11:05:25Z"
          export GIT_COMMITTER_DATE="2024-04-18T11:05:25Z"
          git commit -m "CLEAN BASELINE: merge android11-5.4.274_r00 into VEUX 5.4.268"

          test "$(git rev-parse HEAD)" = "$EXPECTED_P0_MERGE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_P0_MERGE_TREE"

          {
            echo "P0_RECONSTRUCTION=PASS"
            echo "P0_COMMIT=$(git rev-parse HEAD)"
            echo "P0_TREE=$(git rev-parse HEAD^{tree})"
          } > "$GITHUB_WORKSPACE/evidence/01-P0.txt"

      - name: 05 - Download exact accepted P4-v7 artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.P4_ARTIFACT_NAME }}
          path: p4-artifact
          github-token: ${{ github.token }}
          run-id: ${{ env.P4_PASS_RUN_ID }}
          repository: Chrizz100/veux-resukisu-builder

      - name: 06 - Authenticate P4-v7 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P4_AUTH" > evidence/STAGE.txt

          for dir in evidence restore-kit build-artifacts; do
            test -s "p4-artifact/$dir/SHA256SUMS"
            (
              cd "p4-artifact/$dir"
              sha256sum -c SHA256SUMS
            ) > "evidence/02-P4-${dir}-SHA256.txt"
          done

          grep -Fxq 'TECHNICAL_PASS=YES' p4-artifact/evidence/98-FINAL-STATUS.txt
          grep -Fxq 'CHECKPOINT=KSU-GEN1-P4-SAFE-STAT-FACCESSAT-FILENAME-BRIDGE-PASS' \
            p4-artifact/evidence/98-FINAL-STATUS.txt

          test "$(sha256sum p4-artifact/build-artifacts/Image | awk '{print $1}')" \
            = "$EXPECTED_P4_IMAGE_SHA256"
          test "$(sha256sum p4-artifact/build-artifacts/config | awk '{print $1}')" \
            = "$EXPECTED_P4_CONFIG_SHA256"
          test "$(sha256sum p4-artifact/build-artifacts/veux.dtb | awk '{print $1}')" \
            = "$EXPECTED_P4_DTB_SHA256"

          test -s p4-artifact/restore-kit/p0-to-p4-outer-full.patch
          test -s p4-artifact/restore-kit/p4-kernelsu-0.9.5-full-bridge.patch
          echo "P4_ACCEPTED_ARTIFACT_AUTH=PASS" > evidence/02-P4-AUTH.txt

      - name: 07 - Restore exact P4-v7 source
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P4_SOURCE_RESTORE" > evidence/STAGE.txt
          cd kernel

          outer="$GITHUB_WORKSPACE/p4-artifact/restore-kit/p0-to-p4-outer-full.patch"
          ksup="$GITHUB_WORKSPACE/p4-artifact/restore-kit/p4-kernelsu-0.9.5-full-bridge.patch"

          git apply --check --binary "$outer"
          git apply --binary "$outer"

          git clone --filter=blob:none https://github.com/tiann/KernelSU.git KernelSU
          git -C KernelSU checkout --detach "$KSU_COMMIT"
          test "$(git -C KernelSU rev-parse HEAD)" = "$KSU_COMMIT"

          ksu_count="$(git -C KernelSU rev-list --count HEAD)"
          test "$((10000 + ksu_count + 200))" = "$KSU_EXPECTED_VERSION"

          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
          test "$(realpath drivers/kernelsu)" = "$(realpath KernelSU/kernel)"

          mkdir -p .git/info
          touch .git/info/exclude
          grep -Fxq '/KernelSU/' .git/info/exclude || echo '/KernelSU/' >> .git/info/exclude

          git -C KernelSU apply --check --binary "$ksup"
          git -C KernelSU apply --binary "$ksup"

          {
            git diff --name-only "$EXPECTED_P0_MERGE_COMMIT" --
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | LC_ALL=C sort -u > "$RUNNER_TEMP/p4-outer-actual-paths.txt"

          awk '/^diff --git a\// {p=$3; sub(/^a\//,"",p); print p}' "$outer" \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/p4-outer-expected-paths.txt"

          diff -u "$RUNNER_TEMP/p4-outer-expected-paths.txt" \
                  "$RUNNER_TEMP/p4-outer-actual-paths.txt"

          {
            git -C KernelSU diff --name-only "$KSU_COMMIT" --
            git -C KernelSU ls-files --others --exclude-standard
          } | sed '/^$/d' | LC_ALL=C sort -u > "$RUNNER_TEMP/p4-ksu-actual-paths.txt"

          awk '/^diff --git a\// {p=$3; sub(/^a\//,"",p); print p}' "$ksup" \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/p4-ksu-expected-paths.txt"

          diff -u "$RUNNER_TEMP/p4-ksu-expected-paths.txt" \
                  "$RUNNER_TEMP/p4-ksu-actual-paths.txt"

          {
            echo "P4_SOURCE_RESTORE=PASS"
            echo "P4_OUTER_AUTHENTICATED_PATCH_APPLY=PASS"
            echo "P4_KSU_AUTHENTICATED_PATCH_APPLY=PASS"
            echo "P4_TRACKED_PLUS_UNTRACKED_CHANGESET_GATE=PASS"
          } > "$GITHUB_WORKSPACE/evidence/03-P4-SOURCE-RESTORE.txt"

      - name: 08 - Download accepted P5-v4 PASS artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.P5_V4_ARTIFACT_NAME }}
          path: p5v4-artifact
          github-token: ${{ github.token }}
          run-id: ${{ env.P5_V4_PASS_RUN_ID }}
          repository: Chrizz100/veux-resukisu-builder

      - name: 09 - Authenticate P5-v4 PASS checkpoint
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P5_V4_AUTH" > evidence/STAGE.txt

          for dir in evidence restore-kit build-artifacts; do
            test -s "p5v4-artifact/$dir/SHA256SUMS"
            (
              cd "p5v4-artifact/$dir"
              sha256sum -c SHA256SUMS
            ) > "evidence/04-P5V4-${dir}-SHA256.txt"
          done

          grep -Fxq 'TECHNICAL_PASS=YES' p5v4-artifact/evidence/98-FINAL-STATUS.txt
          grep -Fxq 'CHECKPOINT=KSU-GEN1-P5-ACTIVE-SPOOF-UNAME-DISPATCH-PASS' \
            p5v4-artifact/evidence/98-FINAL-STATUS.txt
          grep -Fxq 'P5_LINKED_BOUNDARY=PASS' \
            p5v4-artifact/evidence/11-P5-LINKED-BOUNDARY.txt
          grep -Fxq 'P5_RESTORE_KIT=PASS' \
            p5v4-artifact/evidence/12-P5-PROVENANCE.txt

          test "$(sha256sum p5v4-artifact/build-artifacts/Image | awk '{print $1}')" \
            = "$EXPECTED_P5_V4_IMAGE_SHA256"
          test "$(sha256sum p5v4-artifact/build-artifacts/config | awk '{print $1}')" \
            = "$EXPECTED_P5_V4_CONFIG_SHA256"
          test "$(sha256sum p5v4-artifact/build-artifacts/veux.dtb | awk '{print $1}')" \
            = "$EXPECTED_P5_V4_DTB_SHA256"

          jq -e \
            --arg image "$EXPECTED_P5_V4_IMAGE_SHA256" \
            --arg cfg "$EXPECTED_P5_V4_CONFIG_SHA256" \
            --arg dtb "$EXPECTED_P5_V4_DTB_SHA256" \
            '.image_sha256 == $image and
             .config_sha256 == $cfg and
             .veux_dtb_sha256 == $dtb and
             .root_only_user_command_dispatch == true and
             .config_ksu_susfs == true and
             .config_ksu_susfs_spoof_uname == true and
             .susfs_feature_suboptions_enabled == 1 and
             .only_enabled_susfs_suboption == "KSU_SUSFS_SPOOF_UNAME" and
             .kernel_build_performed == true and
             .device_accessed == false and
             .flashing_performed == false' \
            p5v4-artifact/restore-kit/manifest.json \
            > evidence/04-P5V4-MANIFEST-AUTH.json

          test -s p5v4-artifact/restore-kit/p4-to-p5-outer-spoof-uname.patch
          test -s p5v4-artifact/restore-kit/p4-to-p5-kernelsu-dispatch-kconfig.patch

          echo "P5_V4_ACCEPTED_ARTIFACT_AUTH=PASS" > evidence/04-P5V4-AUTH.txt

      - name: 10 - Restore exact P5-v4 source on P4-v7
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P5_V4_SOURCE_RESTORE" > evidence/STAGE.txt
          cd kernel

          outer_inc="$GITHUB_WORKSPACE/p5v4-artifact/restore-kit/p4-to-p5-outer-spoof-uname.patch"
          ksu_inc="$GITHUB_WORKSPACE/p5v4-artifact/restore-kit/p4-to-p5-kernelsu-dispatch-kconfig.patch"

          patch -p1 --dry-run < "$outer_inc"
          patch -p1 < "$outer_inc"

          (
            cd KernelSU
            patch -p1 --dry-run < "$ksu_inc"
            patch -p1 < "$ksu_inc"
          )

          grep -Fq 'config KSU_SUSFS_SPOOF_UNAME' KernelSU/kernel/Kconfig
          grep -Fq 'static bool ksu_handle_susfs_command' KernelSU/kernel/core_hook.c
          grep -Fq 'case CMD_SUSFS_SET_UNAME:' KernelSU/kernel/core_hook.c
          grep -Fq 'susfs_spoof_uname(&tmp);' kernel/sys.c
          grep -Fq 'static_key_enabled(&susfs_is_uname_spoof_buffer_set)' fs/susfs.c

          test -f fs/proc/cmdline.c
          test ! -e fs/proc/bootconfig.c

          mkdir -p "$RUNNER_TEMP/p5v4-parent/outer" "$RUNNER_TEMP/p5v4-parent/ksu"
          cp fs/proc/cmdline.c "$RUNNER_TEMP/p5v4-parent/outer/cmdline.c"
          cp KernelSU/kernel/Kconfig "$RUNNER_TEMP/p5v4-parent/ksu/Kconfig"
          cp KernelSU/kernel/core_hook.c "$RUNNER_TEMP/p5v4-parent/ksu/core_hook.c"

          sha256sum \
            fs/stat.c \
            fs/open.c \
            fs/susfs.c \
            kernel/sys.c \
            KernelSU/kernel/sucompat.c \
            > "$RUNNER_TEMP/p5v4-protected-source.sha256"

          cp "$RUNNER_TEMP/p5v4-protected-source.sha256" \
            "$GITHUB_WORKSPACE/evidence/05-P5V4-PROTECTED-SOURCE-BEFORE.txt"

          {
            echo "P5_V4_SOURCE_RESTORE=PASS"
            echo "P5_V4_PARENT_RUN_ID=$P5_V4_PASS_RUN_ID"
            echo "P5_V4_RESTORE_METHOD=EXACT_P4_PLUS_AUTHENTICATED_P5V4_INCREMENTAL_PATCHES"
            echo "VEUX_NON_GKI_CMDLINE_FILE=fs/proc/cmdline.c"
            echo "VEUX_BOOTCONFIG_FILE=ABSENT"
          } > "$GITHUB_WORKSPACE/evidence/05-P5V4-SOURCE-RESTORE.txt"

      - name: 11 - Audit and activate non-GKI SPOOF_CMDLINE
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE=P5_V5_CMDLINE_ACTIVATION" > evidence/STAGE.txt
          cd kernel

          python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/06-P5V5-PRE-AUDIT.txt"
          from pathlib import Path

          sus = Path("fs/susfs.c").read_text(encoding="utf-8")
          hdr = Path("include/linux/susfs.h").read_text(encoding="utf-8")
          defs = Path("include/linux/susfs_def.h").read_text(encoding="utf-8")
          cmd = Path("fs/proc/cmdline.c").read_text(encoding="utf-8")
          core = Path("KernelSU/kernel/core_hook.c").read_text(encoding="utf-8")
          cfg = Path("KernelSU/kernel/Kconfig").read_text(encoding="utf-8")

          checks = {
              "P5V4_UNAME_CONFIG_PRESENT":
                  "config KSU_SUSFS_SPOOF_UNAME" in cfg,
              "SET_CMDLINE_SOURCE_PRESENT":
                  "susfs_set_cmdline_or_bootconfig" in sus,
              "SPOOF_CMDLINE_SOURCE_PRESENT":
                  "susfs_spoof_cmdline_or_bootconfig" in sus,
              "CMDLINE_HEADER_API_PRESENT":
                  "susfs_set_cmdline_or_bootconfig" in hdr,
              "CMDLINE_COMMAND_ID_PRESENT":
                  "#define CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG 0x555b0" in defs,
              "NON_GKI_CMDLINE_FILE_PRESENT":
                  Path("fs/proc/cmdline.c").is_file(),
              "BOOTCONFIG_FILE_ABSENT":
                  not Path("fs/proc/bootconfig.c").exists(),
              "CMDLINE_PROC_SHOW_PRESENT":
                  "static int cmdline_proc_show(struct seq_file *m, void *v)" in cmd,
              "SAVED_COMMAND_LINE_PRESENT":
                  "saved_command_line" in cmd,
              "P5V4_ROOT_ONLY_DISPATCH_PRESENT":
                  "if (from_root && ksu_handle_susfs_command(arg2, arg3))" in core,
              "CMDLINE_COMMAND_NOT_ALREADY_DISPATCHED":
                  "case CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG:" not in core,
              "CMDLINE_CONFIG_NOT_ALREADY_PRESENT":
                  "config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG" not in cfg,
          }

          for key, ok in checks.items():
              print(f"{key}={'PASS' if ok else 'FAIL'}")

          failed = [key for key, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("P5-v5 prerequisite failure: " + ", ".join(failed))

          print("P5_V5_PRE_ACTIVATION_AUDIT=PASS")
          PY

          python3 - <<'PY'
          from pathlib import Path

          # Add exactly one new SUSFS feature Kconfig option.
          p = Path("KernelSU/kernel/Kconfig")
          t = p.read_text(encoding="utf-8")
          if t.count("\nendmenu\n") != 1:
              raise SystemExit("Kconfig endmenu mismatch")
          if "config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG" in t:
              raise SystemExit("cmdline config already present")

          block = """
          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	bool "SUSFS: spoof /proc/cmdline on non-GKI"
          	depends on KSU_SUSFS
          	default n
          	help
          	  Enable the SUSFS cmdline/bootconfig spoof source path.
          	  VEUX is non-GKI here, so P5-v5 hooks only /proc/cmdline.

          """
          t = t.replace("\nendmenu\n", "\n" + block + "endmenu\n", 1)
          p.write_text(t, encoding="utf-8")

          # Extend the already root-only P5-v4 dispatcher by one command.
          p = Path("KernelSU/kernel/core_hook.c")
          t = p.read_text(encoding="utf-8")
          anchor = """#endif
          	case CMD_SUSFS_SHOW_VERSION:
          """
          if t.count(anchor) != 1:
              raise SystemExit("P5-v4 dispatcher insertion anchor mismatch")

          addition = """#endif
          #ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	case CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG:
          		susfs_set_cmdline_or_bootconfig(&user_info);
          		return true;
          #endif
          	case CMD_SUSFS_SHOW_VERSION:
          """
          t = t.replace(anchor, addition, 1)
          p.write_text(t, encoding="utf-8")

          # Non-GKI 5.4 cmdline hook: if SUSFS emits a spoofed string,
          # terminate it with newline and bypass saved_command_line.
          p = Path("fs/proc/cmdline.c")
          t = p.read_text(encoding="utf-8")

          inc_anchor = "#include <linux/seq_file.h>\n"
          if t.count(inc_anchor) != 1:
              raise SystemExit("cmdline include anchor mismatch")

          t = t.replace(
              inc_anchor,
              inc_anchor
              + "\n#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n"
              + "extern int susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n"
              + "#endif\n",
              1,
          )

          fn_anchor = """static int cmdline_proc_show(struct seq_file *m, void *v)
          {
          """
          if t.count(fn_anchor) != 1:
              raise SystemExit("cmdline_proc_show anchor mismatch")

          hook = """static int cmdline_proc_show(struct seq_file *m, void *v)
          {
          #ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	if (!susfs_spoof_cmdline_or_bootconfig(m)) {
          		seq_putc(m, '\\n');
          		return 0;
          	}
          #endif
          """
          t = t.replace(fn_anchor, hook, 1)
          p.write_text(t, encoding="utf-8")
          PY

          git diff --check -- fs/proc/cmdline.c
          git -C KernelSU diff --check -- kernel/Kconfig kernel/core_hook.c

          python3 - <<'PY' > "$GITHUB_WORKSPACE/evidence/06-P5V5-SOURCE-AUDIT.txt"
          from pathlib import Path
          import re

          cmd = Path("fs/proc/cmdline.c").read_text(encoding="utf-8")
          core = Path("KernelSU/kernel/core_hook.c").read_text(encoding="utf-8")
          cfg = Path("KernelSU/kernel/Kconfig").read_text(encoding="utf-8")

          assert cfg.count("config KSU_SUSFS_SPOOF_UNAME") == 1
          assert cfg.count("config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG") == 1

          start = core.index("static bool ksu_handle_susfs_command")
          end = core.index("int ksu_handle_prctl", start)
          block = core[start:end]
          seen = set(re.findall(r"case (CMD_SUSFS_[A-Z0-9_]+):", block))
          expected = {
              "CMD_SUSFS_SET_UNAME",
              "CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG",
              "CMD_SUSFS_SHOW_VERSION",
              "CMD_SUSFS_SHOW_ENABLED_FEATURES",
              "CMD_SUSFS_SHOW_VARIANT",
          }
          if seen != expected:
              raise SystemExit(f"dispatch set mismatch: {sorted(seen)}")

          assert "if (from_root && ksu_handle_susfs_command(arg2, arg3))" in core
          assert cmd.count("susfs_spoof_cmdline_or_bootconfig(m)") == 1
          assert cmd.count("extern int susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);") == 1

          fn_start = cmd.index("static int cmdline_proc_show")
          fn_end = cmd.index("\n}\n", fn_start) + 3
          fn = cmd[fn_start:fn_end]
          assert fn.index("susfs_spoof_cmdline_or_bootconfig(m)") < fn.index("saved_command_line")
          assert "seq_putc(m, '\\n');" in fn

          print("P5_V5_ROOT_ONLY_DISPATCH=PASS")
          print("P5_V5_DISPATCH_COMMAND_COUNT=5")
          print("P5_V5_NON_GKI_CMDLINE_HOOK=PASS")
          print("P5_V5_BOOTCONFIG_HOOK=NOT_APPLICABLE")
          print("P5_V5_SOURCE_ACTIVATION=PASS")
          PY

