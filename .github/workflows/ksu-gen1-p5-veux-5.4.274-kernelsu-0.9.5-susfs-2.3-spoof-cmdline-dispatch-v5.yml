              "susfs_source_head": "$SUSFS_SOURCE_COMMIT",
              "susfs_version": "$SUSFS_EXPECTED_VERSION",
              "config_ksu_susfs": True,
              "config_ksu_susfs_spoof_uname": True,
              "config_ksu_susfs_spoof_cmdline_or_bootconfig": True,
              "susfs_feature_suboptions_enabled": 2,
              "enabled_susfs_suboptions": [
                  "KSU_SUSFS_SPOOF_UNAME",
                  "KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG"
              ],
              "root_only_user_command_dispatch": True,
              "dispatched_commands": [
                  "CMD_SUSFS_SET_UNAME",
                  "CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG",
                  "CMD_SUSFS_SHOW_VERSION",
                  "CMD_SUSFS_SHOW_ENABLED_FEATURES",
                  "CMD_SUSFS_SHOW_VARIANT"
              ],
              "newuname_hook_integrated": True,
              "non_gki_proc_cmdline_hook_integrated": True,
              "bootconfig_hook_applicable": False,
              "p4_stat_faccessat_bridge_preserved": True,
              "p5_v4_uname_source_preserved": True,
              "raw_user_pointer_reinterpret_cast": False,
              "sus_path_active": False,
              "sus_mount_active": False,
              "sus_kstat_active": False,
              "open_redirect_active": False,
              "sus_map_active": False,
              "proc_cmdline_changed": True,
              "proc_maps_changed": False,
              "namei_changed": False,
              "namespace_changed": False,
              "resukisu_integrated": False,
              "kernel_build_performed": True,
              "image_sha256": "$image_sha",
              "veux_dtb_sha256": "$dtb_sha",
              "config_sha256": "$config_sha",
              "boot_image_created": False,
              "device_accessed": False,
              "flashing_performed": False,
              "next_if_pass": "P5 next controlled active SUSFS block"
          }

          Path("$GITHUB_WORKSPACE/restore-kit/manifest.json").write_text(
              json.dumps(m, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          cat > "$GITHUB_WORKSPACE/restore-kit/RESTORE-INSTRUCTIONS.txt" <<EOF
          KSU GEN1 P5-v5 recovery

          Parent source checkpoint:
          - P4-v7 PASS run: $P4_PASS_RUN_ID
          - P5-v4 PASS run: $P5_V4_PASS_RUN_ID

          Restore:
          1. Restore exact P4-v7.
          2. Apply the two authenticated P5-v4 incremental restore patches from
             run $P5_V4_PASS_RUN_ID.
          3. Apply p5v4-to-p5v5-outer-cmdline.patch at the outer kernel root.
          4. Apply p5v4-to-p5v5-kernelsu-dispatch-kconfig.patch inside KernelSU.
          5. Enable:
             CONFIG_KSU=y
             CONFIG_KSU_SUSFS=y
             CONFIG_KSU_SUSFS_SPOOF_UNAME=y
             CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          6. Keep every other CONFIG_KSU_SUSFS_* sub-option disabled.

          VEUX is treated as non-GKI here. Only fs/proc/cmdline.c is hooked;
          fs/proc/bootconfig.c is absent and not synthesized.

          This checkpoint proves source/object/full-kernel build and link gates.
          It does not prove device boot, userspace runtime behavior, root behavior
          on a real phone, or flashing safety.
          EOF

          {
            echo "PARENT_P5_V4_RUN=$P5_V4_PASS_RUN_ID"
            echo "P5_V5_IMAGE_SHA256=$image_sha"
            echo "P5_V5_DTB_SHA256=$dtb_sha"
            echo "P5_V5_CONFIG_SHA256=$config_sha"
            echo "P5_V5_ROOT_ONLY_CMDLINE_DISPATCH=PASS"
            echo "P5_V5_RESTORE_KIT=PASS"
          } > "$GITHUB_WORKSPACE/evidence/13-P5V5-PROVENANCE.txt"

      - name: 19 - Close P5-v5 technical status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo "STAGE=FINAL_STATUS" > evidence/STAGE.txt

          if [ "${{ job.status }}" = "success" ] \
            && grep -Fxq 'P5_V5_RESTORE_KIT=PASS' evidence/13-P5V5-PROVENANCE.txt 2>/dev/null \
            && grep -Fxq 'P5_V5_LINKED_BOUNDARY=PASS' evidence/12-P5V5-LINKED-BOUNDARY.txt 2>/dev/null; then
            technical_pass=YES
            checkpoint=KSU-GEN1-P5-SPOOF-CMDLINE-DISPATCH-PASS
            build_performed=YES
          else
            technical_pass=NO
            checkpoint=KSU-GEN1-P5-V5-FAILED
            if grep -Fxq 'P5_V5_IMAGE_DTBS_BUILD=PASS' evidence/11-P5V5-BUILD-IDENTITY.txt 2>/dev/null; then
              build_performed=YES
            else
              build_performed=NO
            fi
          fi

          {
            echo "JOB_STATUS_AT_TECHNICAL_CLOSE=${{ job.status }}"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "TECHNICAL_PASS=$technical_pass"
            echo "CHECKPOINT=$checkpoint"
            echo "PARENT_P4_RUN_ID=$P4_PASS_RUN_ID"
            echo "PARENT_P5_V4_RUN_ID=$P5_V4_PASS_RUN_ID"
            echo "CONFIG_KSU_SUSFS_TARGET=YES"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME_TARGET=YES"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG_TARGET=YES"
            echo "SUSFS_FEATURE_SUBOPTIONS_ENABLED=2"
            echo "USER_COMMAND_DISPATCH=ROOT_ONLY"
            echo "USER_COMMAND_DISPATCH_COMMAND_COUNT=5"
            echo "NEWUNAME_HOOK=YES"
            echo "NON_GKI_PROC_CMDLINE_HOOK=YES"
            echo "BOOTCONFIG_HOOK=NOT_APPLICABLE"
            echo "P4_STAT_FACCESSAT_BRIDGE_PRESERVED=YES"
            echo "P5_V4_UNAME_SOURCE_PRESERVED=YES"
            echo "RAW_USER_POINTER_REINTERPRET_CAST=NO"
            echo "SUS_PATH_ACTIVE=NO"
            echo "SUS_MOUNT_ACTIVE=NO"
            echo "SUS_KSTAT_ACTIVE=NO"
            echo "OPEN_REDIRECT_ACTIVE=NO"
            echo "SUS_MAP_ACTIVE=NO"
            echo "PROC_CMDLINE_CHANGED=YES"
            echo "PROC_MAPS_CHANGED=NO"
            echo "NAMEI_CHANGED=NO"
            echo "NAMESPACE_CHANGED=NO"
            echo "KERNEL_BUILD_PERFORMED=$build_performed"
            echo "BOOT_IMAGE_CREATED=NO"
            echo "DEVICE_ACCESSED=NO"
            echo "FLASHING_PERFORMED=NO"
          } > evidence/98-FINAL-STATUS.txt

      - name: 20 - Build SHA256 manifests
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          for dir in evidence restore-kit build-artifacts; do
            [ -d "$dir" ] || continue
            rm -f "$dir/SHA256SUMS" "$dir/EMPTY-DIRECTORY.txt"

            (
              cd "$dir"

              count="$(
                find . -type f ! -name SHA256SUMS ! -name EMPTY-DIRECTORY.txt \
                  | wc -l | tr -d ' '
              )"

              if [ "$count" -eq 0 ]; then
                {
                  echo "EMPTY_DIRECTORY_AT_MANIFEST_TIME=YES"
                  echo "RUN_ID=$GITHUB_RUN_ID"
                } > EMPTY-DIRECTORY.txt
              fi

              find . -type f ! -name SHA256SUMS -printf '%P\0' \
                | sort -z \
                | xargs -0 -r sha256sum \
                > SHA256SUMS

              test -s SHA256SUMS
              ! grep -Eq '[[:space:]]SHA256SUMS$' SHA256SUMS
              sha256sum -c SHA256SUMS
            )
          done

      - name: 21 - Upload P5-v5 evidence restore kit and build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ksu-gen1-p5-veux-5.4.274-ksu-0.9.5-susfs-2.3-spoof-cmdline-dispatch-v5-${{ github.run_id }}
          path: |
            evidence/
            restore-kit/
            build-artifacts/
          retention-days: 14
          if-no-files-found: error

      - name: 22 - Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# KSU GEN1 P5-v5 - non-GKI /proc/cmdline spoof"
            echo

            if [ "${{ job.status }}" = "success" ] \
              && grep -Fxq 'TECHNICAL_PASS=YES' evidence/98-FINAL-STATUS.txt 2>/dev/null; then
              echo "**PASS**"
              echo
              echo "P5-v4 SPOOF_UNAME remains preserved."
              echo "SPOOF_CMDLINE_OR_BOOTCONFIG is active only through VEUX /proc/cmdline."
              echo "SUS_PATH, SUS_MOUNT, KSTAT, OPEN_REDIRECT, SUS_MAP and proc maps remain disabled."
              echo
              echo '```text'
              cat evidence/11-P5V5-BUILD-IDENTITY.txt
              cat evidence/12-P5V5-LINKED-BOUNDARY.txt
              cat evidence/13-P5V5-PROVENANCE.txt
              echo '```'
            else
              echo "**FAIL — repair only the concrete P5-v5 failure before enabling another SUSFS block.**"
              echo
              echo '```text'
              cat evidence/STAGE.txt 2>/dev/null || true
              cat evidence/10-P5V5-OBJECT-COMPILE.txt 2>/dev/null || true
              cat evidence/11-P5V5-IMAGE-DTBS-COMPILE.txt 2>/dev/null || true
              cat evidence/98-FINAL-STATUS.txt 2>/dev/null || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
