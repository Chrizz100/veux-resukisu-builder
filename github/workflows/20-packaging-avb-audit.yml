          cp \
            "$AUDIT_DIR/STAGING-ZIP-HASH.txt" \
            "$OUTPUT_DIR/STAGING-ZIP-HASH.txt"

          cp \
            "$AUDIT_DIR/WORKFLOW17-RELEASE-CANDIDATE-CHECK.txt" \
            "$OUTPUT_DIR/WORKFLOW17-RELEASE-CANDIDATE-CHECK.txt"

          (
            cd "$OUTPUT_DIR"

            find . \
              -maxdepth 1 \
              -type f \
              ! -name 'SHA256SUMS' \
              -printf '%f\n' \
              | LC_ALL=C sort \
              | while IFS= read -r file; do
                  sha256sum "$file"
                done \
              > SHA256SUMS

            sha256sum -c SHA256SUMS \
              | tee SHA256SUMS.verify.txt
          )

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p \
            "$AUDIT_DIR" \
            "$OUTPUT_DIR"

