            echo "VEUX Workflow 20: FAILURE"
            echo "Finished: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "No flash was performed."
            echo "No flash-enabled package should be used from this failed run."
          } > "$AUDIT_DIR/FAILURE-SUMMARY.txt"

          if [ -d "$STAGE_DIR" ]; then
            find "$STAGE_DIR" \
              -maxdepth 4 \
              -printf '%M %s %p\n' \
              > "$AUDIT_DIR/FAILURE-stage-tree.txt" \
              2>&1 \
