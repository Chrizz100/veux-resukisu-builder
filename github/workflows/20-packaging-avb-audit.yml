          fi

          if [ -d "$RC_DIR" ]; then
            find "$RC_DIR" \
              -maxdepth 2 \
              -printf '%M %s %p\n' \
              > "$AUDIT_DIR/FAILURE-rc-tree.txt" \
              2>&1 \
              || true
          fi

          cp -a \
            "$AUDIT_DIR" \
            "$OUTPUT_DIR/failure-audit" \
            2>/dev/null \
            || true

